<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182019">
  <meta name="description" content="Practice with Infinity — NEET UG 2027 ke liye chapter-wise learning space.">
  <title>Practice with Infinity | NEET UG 2027</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #182019;
      --bg-soft: #1c261f;
      --panel: #222d24;
      --panel-raised: #29362b;
      --panel-hover: #304033;
      --line: #394a3b;
      --line-soft: rgba(183, 201, 179, .15);
      --text: #e6e9df;
      --muted: #aab5a7;
      --quiet: #778578;
      --sage: #b4c9a9;
      --sage-deep: #809b79;
      --gold: #c9b58c;
      --gold-soft: rgba(201, 181, 140, .12);
      --red-soft: #4a302b;
      --green-soft: #293b2c;
      --radius-lg: 24px;
      --radius-md: 17px;
      --radius-sm: 12px;
      --shadow: 0 22px 70px rgba(0, 0, 0, .22);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 14% 4%, rgba(85, 114, 81, .14), transparent 36rem),
        radial-gradient(ellipse at 92% 26%, rgba(116, 99, 67, .10), transparent 31rem),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--sage);
      outline-offset: 4px;
    }
    .site-shell { width: min(1160px, calc(100% - 48px)); margin-inline: auto; }

    .site-header {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line-soft);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 0;
      color: inherit;
      text-align: left;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(180, 201, 169, .25);
      border-radius: 15px;
      color: var(--sage);
      background: linear-gradient(145deg, rgba(180, 201, 169, .13), rgba(180, 201, 169, .025));
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1;
      box-shadow: inset 0 1px rgba(255,255,255,.035);
    }
    .brand-copy { display: grid; gap: 1px; }
    .brand-copy strong { font-size: 15px; font-weight: 650; letter-spacing: -.025em; }
    .brand-copy strong span { color: var(--sage); }
    .brand-copy small {
      color: var(--quiet);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .header-meta { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; }
    .identity-pill, .channel-pill {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.018);
      font-size: 11px;
      white-space: nowrap;
    }
    .identity-pill strong, .channel-pill strong { color: var(--text); font-weight: 600; }
    .channel-pill svg { width: 14px; height: 14px; color: #cf9b88; flex: none; }
    .channel-pill .channel-label { color: var(--quiet); }

    main { min-height: calc(100vh - 168px); padding-block: 34px 60px; }
    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 14px 28px;
      align-items: center;
      min-height: 66px;
      padding-block: 15px;
      border-top: 1px solid var(--line-soft);
      color: var(--quiet);
      font-size: 11px;
    }
    .site-footer strong { color: var(--muted); font-weight: 600; }
    .site-footer .footer-right { text-align: right; }

    .view-enter { animation: arrive .26s ease-out both; }
    @keyframes arrive { from { opacity: .45; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .eyebrow, .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--sage);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(201,181,140,.09); }
    .home-grid { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(330px, .94fr); gap: clamp(38px, 7vw, 96px); align-items: center; padding-block: 42px 48px; }
    .hero-copy { position: relative; padding-block: 8px; }
    .welcome-line { margin: 23px 0 3px; color: var(--muted); font-family: Georgia, "Times New Roman", serif; font-size: clamp(17px, 2vw, 21px); font-style: italic; }
    .hero-title {
      max-width: 650px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(50px, 7.4vw, 88px);
      font-weight: 500;
      letter-spacing: -.065em;
      line-height: .99;
    }
    .hero-title span { color: var(--sage); font-style: italic; }
    .hero-description { max-width: 500px; margin: 23px 0 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .signature {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-top: 26px;
      padding: 10px 13px 10px 10px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: rgba(255,255,255,.018);
    }
    .avatar {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 50%;
      color: #1a231b;
      background: var(--sage);
      font-family: Georgia, serif;
      font-size: 12px;
      font-weight: 700;
    }
    .signature-copy { display: grid; color: var(--quiet); font-size: 9px; line-height: 1.25; }
    .signature-copy strong { margin-top: 2px; color: var(--text); font-size: 12px; font-weight: 600; }
    .hero-orbit {
      position: absolute;
      z-index: -1;
      top: -35px;
      left: 52%;
      width: 230px;
      height: 230px;
      border: 1px solid rgba(180, 201, 169, .065);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-orbit::before, .hero-orbit::after { content: ""; position: absolute; border: 1px solid rgba(180, 201, 169, .055); border-radius: 50%; }
    .hero-orbit::before { inset: 22px; }
    .hero-orbit::after { inset: 49px; }

    .goal-panel {
      position: relative;
      overflow: hidden;
      padding: clamp(20px, 3vw, 29px);
      border: 1px solid rgba(180, 201, 169, .16);
      border-radius: var(--radius-lg);
      background: linear-gradient(150deg, rgba(39, 54, 41, .96), rgba(30, 42, 32, .96));
      box-shadow: var(--shadow);
    }
    .goal-panel::after {
      content: "∞";
      position: absolute;
      right: -11px;
      bottom: -69px;
      color: rgba(180, 201, 169, .035);
      font-family: Georgia, serif;
      font-size: 210px;
      line-height: 1;
      pointer-events: none;
    }
    .goal-panel-head { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 19px; }
    .goal-panel-head h2 { margin: 6px 0 0; font-family: Georgia, serif; font-size: 23px; font-weight: 500; letter-spacing: -.035em; }
    .target-stamp {
      display: inline-grid;
      min-width: 55px;
      height: 55px;
      place-items: center;
      padding-inline: 8px;
      border: 1px solid rgba(201,181,140,.25);
      border-radius: 17px;
      color: var(--gold);
      background: var(--gold-soft);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      letter-spacing: .04em;
    }
    .goal-list { position: relative; z-index: 1; display: grid; gap: 11px; }
    .goal-card {
      width: 100%;
      display: grid;
      gap: 7px;
      padding: 16px 17px;
      color: var(--text);
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(18, 28, 20, .24);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .goal-card:hover { transform: translateY(-2px); border-color: rgba(180, 201, 169, .38); background: rgba(180, 201, 169, .055); }
    .goal-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--quiet); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .goal-card-top .goal-number { color: var(--gold); font-family: Georgia, serif; font-size: 13px; letter-spacing: 0; }
    .goal-card strong { font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 500; letter-spacing: -.025em; }
    .goal-card .goal-desc { color: var(--muted); font-size: 12px; }
    .goal-card .goal-action { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--line-soft); color: var(--sage); font-size: 11px; font-weight: 650; }
    .goal-card .goal-action span:last-child { font-size: 17px; transition: transform .18s; }
    .goal-card:hover .goal-action span:last-child { transform: translate(2px, -2px); }
    .goal-note { position: relative; z-index: 1; margin: 14px 2px 0; color: var(--quiet); font-size: 10px; }
    .home-bottom { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 16px 18px; border: 1px solid var(--line-soft); border-radius: var(--radius-md); background: rgba(255,255,255,.014); }
    .home-bottom-left { display: flex; align-items: center; gap: 13px; }
    .status-mark { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--sage-deep); box-shadow: 0 0 0 5px rgba(128,155,121,.11); }
    .home-bottom strong { display: block; font-size: 12px; font-weight: 600; }
    .home-bottom p { margin: 2px 0 0; color: var(--quiet); font-size: 10px; }
    .home-bottom .mini-brand { color: var(--gold); font-family: Georgia, serif; font-size: 22px; }

    .view-top { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 32px; }
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      color: var(--muted);
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      transition: color .15s ease;
    }
    .back-button:hover { color: var(--sage); }
    .back-button .back-arrow { color: var(--sage); font-size: 16px; line-height: 1; }
    .goal-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid rgba(201,181,140,.18);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(201,181,140,.055);
      font-size: 10px;
      font-weight: 650;
    }
    .goal-pill .pill-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
    .page-heading { max-width: 690px; margin-bottom: 29px; }
    .page-heading h1 { margin: 8px 0 7px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(35px, 5vw, 54px); font-weight: 500; letter-spacing: -.055em; line-height: 1.08; }
    .page-heading p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .breadcrumb-label { color: var(--quiet); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }

    .subject-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .subject-card {
      position: relative;
      min-height: 228px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 20px;
      color: var(--text);
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: linear-gradient(155deg, rgba(39, 53, 41, .94), rgba(30, 42, 32, .94));
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .subject-card:hover { transform: translateY(-3px); border-color: rgba(180, 201, 169, .36); background: linear-gradient(155deg, rgba(45, 61, 47, .98), rgba(34, 47, 36, .98)); }
    .subject-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .subject-icon {
      display: grid;
      width: 45px;
      height: 45px;
      place-items: center;
      border: 1px solid rgba(180, 201, 169, .18);
      border-radius: 14px;
      color: var(--sage);
      background: rgba(180, 201, 169, .07);
    }
    .subject-icon svg { width: 21px; height: 21px; }
    .subject-status { padding: 5px 8px; border: 1px solid var(--line-soft); border-radius: 999px; color: var(--quiet); font-size: 9px; white-space: nowrap; }
    .subject-card h2 { margin: 23px 0 4px; font-family: Georgia, serif; font-size: 25px; font-weight: 500; letter-spacing: -.035em; }
    .subject-card p { max-width: 260px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .subject-card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 18px; color: var(--quiet); font-size: 10px; }
    .subject-card-bottom .open-text { color: var(--sage); font-weight: 650; }
    .subject-card-bottom .open-arrow { margin-left: 4px; font-size: 14px; }
    .library-note { display: flex; align-items: flex-start; gap: 11px; max-width: 760px; margin-top: 22px; padding: 15px 17px; border: 1px solid var(--line-soft); border-radius: 14px; color: var(--muted); background: rgba(255,255,255,.014); font-size: 11px; }
    .library-note .note-mark { color: var(--gold); font-size: 15px; line-height: 1; }

    .chapter-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .chapter-card {
      min-height: 145px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 19px;
      color: var(--text);
      text-align: left;
      border: 1px solid rgba(180, 201, 169, .23);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(45, 62, 47, .86), rgba(32, 45, 34, .95));
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease;
    }
    .chapter-card:hover { transform: translateY(-2px); border-color: rgba(180, 201, 169, .48); }
    .chapter-number { display: grid; width: 46px; height: 46px; flex: none; place-items: center; border: 1px solid rgba(201,181,140,.24); border-radius: 15px; color: var(--gold); background: var(--gold-soft); font-family: Georgia, serif; font-size: 17px; }
    .chapter-copy { min-width: 0; flex: 1; }
    .chapter-copy .chapter-kicker { color: var(--sage); font-size: 9px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .chapter-copy h2 { margin: 5px 0 3px; font-family: Georgia, serif; font-size: clamp(19px, 2.3vw, 24px); font-weight: 500; letter-spacing: -.03em; line-height: 1.2; }
    .chapter-copy p { margin: 0; color: var(--muted); font-size: 10px; }
    .chapter-open { color: var(--sage); font-size: 19px; }
    .coming-card {
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px;
      border: 1px dashed rgba(170,181,167,.23);
      border-radius: 18px;
      background: rgba(255,255,255,.012);
    }
    .coming-card .coming-icon { margin-bottom: 8px; color: var(--gold); font-family: Georgia, serif; font-size: 20px; line-height: 1; }
    .coming-card h3 { margin: 0; color: var(--text); font-size: 13px; font-weight: 600; }
    .coming-card p { margin: 4px 0 0; color: var(--quiet); font-size: 10px; }

    .chapter-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding: 20px 22px;
      border: 1px solid rgba(180, 201, 169, .17);
      border-radius: 18px;
      background: linear-gradient(110deg, rgba(45, 62, 47, .82), rgba(32, 45, 34, .78));
    }
    .chapter-banner .banner-kicker { color: var(--sage); font-size: 9px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
    .chapter-banner h1 { margin: 5px 0 0; font-family: Georgia, serif; font-size: clamp(25px, 3.8vw, 38px); font-weight: 500; letter-spacing: -.04em; line-height: 1.15; }
    .banner-symbol { display: grid; width: 52px; height: 52px; flex: none; place-items: center; border: 1px solid rgba(180,201,169,.18); border-radius: 16px; color: var(--sage); font-family: Georgia, serif; font-size: 23px; background: rgba(180,201,169,.055); }
    .resource-heading { margin: 0 0 13px; color: var(--muted); font-size: 11px; font-weight: 600; }
    .resource-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .resource-card {
      min-height: 175px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 19px;
      color: var(--text);
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(35, 48, 37, .92);
      cursor: pointer;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .resource-card:hover { transform: translateY(-2px); border-color: rgba(180,201,169,.38); background: rgba(42,57,44,.98); }
    .resource-icon { display: grid; width: 39px; height: 39px; place-items: center; border: 1px solid rgba(180,201,169,.17); border-radius: 12px; color: var(--sage); background: rgba(180,201,169,.055); }
    .resource-icon svg { width: 18px; height: 18px; }
    .resource-card h2 { margin: 17px 0 2px; font-family: Georgia, serif; font-size: 20px; font-weight: 500; letter-spacing: -.025em; }
    .resource-card p { margin: 0; color: var(--quiet); font-size: 10px; }
    .resource-card .resource-arrow { align-self: flex-end; margin-top: auto; color: var(--sage); font-size: 16px; }

    .content-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin: 0 0 17px; }
    .content-header h1 { margin: 5px 0 0; font-family: Georgia, serif; font-size: clamp(30px, 4vw, 43px); font-weight: 500; letter-spacing: -.045em; line-height: 1.1; }
    .content-header .content-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .content-type-tag { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid var(--line-soft); border-radius: 999px; color: var(--sage); font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
    .content-type-tag svg { width: 13px; height: 13px; }
    .content-area { min-height: 315px; }
    .empty-state {
      min-height: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 38px 20px;
      text-align: center;
      border: 1px dashed rgba(170,181,167,.22);
      border-radius: 20px;
      background: rgba(255,255,255,.012);
    }
    .empty-icon { display: grid; width: 58px; height: 58px; place-items: center; margin-bottom: 17px; border: 1px solid rgba(180,201,169,.17); border-radius: 19px; color: var(--sage); background: rgba(180,201,169,.055); }
    .empty-icon svg { width: 24px; height: 24px; }
    .empty-state h2 { margin: 0; font-family: Georgia, serif; font-size: 23px; font-weight: 500; letter-spacing: -.025em; }
    .empty-state p { max-width: 400px; margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 1.75; }
    .empty-state .empty-status { margin-top: 16px; padding: 5px 9px; border: 1px solid var(--line-soft); border-radius: 999px; color: var(--quiet); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }

    .notes-stack { display: grid; gap: 13px; }
    .note-entry, .pdf-entry, .video-entry {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(35,48,37,.88);
    }
    .note-entry { padding: clamp(18px, 3vw, 25px); }
    .note-entry .note-index { color: var(--gold); font-size: 9px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .note-entry h2, .pdf-entry h2, .video-entry h2 { margin: 6px 0 10px; font-family: Georgia, serif; font-size: 21px; font-weight: 500; letter-spacing: -.025em; }
    .note-entry p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.85; white-space: normal; }
    .pdf-entry { padding: 16px; }
    .pdf-entry h2 { margin: 0 0 11px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 650; letter-spacing: 0; }
    .pdf-frame { width: 100%; height: min(72vh, 680px); min-height: 410px; display: block; border: 1px solid var(--line-soft); border-radius: 11px; background: #202820; }
    .file-link { display: inline-flex; margin-top: 10px; color: var(--sage); font-size: 11px; text-decoration: none; }
    .file-link:hover { text-decoration: underline; }

    .video-entry { padding: 14px; }
    .video-entry h2 { margin: 2px 2px 12px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 650; letter-spacing: 0; }
    .video-frame, .video-player { width: 100%; aspect-ratio: 16 / 9; display: block; border: 1px solid var(--line-soft); border-radius: 12px; background: #0d120e; }
    .video-frame { border: 0; }
    .video-link-card { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px; border: 1px solid var(--line-soft); border-radius: 12px; color: var(--sage); font-size: 12px; text-decoration: none; }

    /*

      chemistry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.2l-5.2 8.7A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-3.1L14 9.2V3"/><path d="M7.5 16h9M9 13.5h6"/></svg>',

      video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3V9Z" fill="currentColor" stroke="none"/></svg>'
    };

    const state = {

      goal: null,

      mode: null,

      quizScore: 0,
      quizSelected: null,

    };

    const app = document.getElementById("app");
    document.getElementById("headerChannelName").textContent = YOUTUBE_CHANNEL_NAME;
    document.getElementById("footerChannelName").textContent = YOUTUBE_CHANNEL_NAME;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function safeUrl(value) {
      const url = String(value ?? "").trim();
      if (/^https?:\/\//i.test(url)) return url;
      if (/^(?:\.\/|\/)?[A-Za-z0-9._~!$&'()*+,;=:@%/-]+(?:#[A-Za-z0-9._~!$&'()*+,;=:@%/?-]*)?$/.test(url) && !url.startsWith("//")) return url;
      return "";
    }

    function getSubject(id = state.subjectId) {
      return SUBJECTS.find(subject => subject.id === id) || null;
    }

    function getChapter() {
      const subject = getSubject();
      return subject?.chapters.find(chapter => chapter.id === state.chapterId) || null;
    }

    function getContent() {
      return CONTENT_LIBRARY[state.subjectId]?.[state.chapterId] || { notes: [], noteFiles: [], questions: [], videos: [] };
    }

      return "NEET UG 2027 target";

      return `<span class="goal-pill"><span class="pill-dot"></span>${escapeHtml(goalLabel())}</span>`;
    }

    }

    function renderHome() {
      return `
        <section class="view-enter" aria-labelledby="home-title">
          <div class="home-grid">

              <span class="hero-orbit" aria-hidden="true"></span>

              </div>

                  <span class="goal-action"><span>Study library mein jaayein</span><span aria-hidden="true">↗</span></span>
                </button>
              </div>
              <p class="goal-note">Aage badhne ke liye is ek target par click karein.</p>

              <button class="resource-card" type="button" data-action="open-mode" data-mode="${item.id}">
                <span class="resource-icon">${ICONS[item.icon]}</span>
                <h2>${item.title}</h2><p>${item.desc}</p>
                <span class="resource-arrow" aria-hidden="true">→</span>
              </button>`).join("")}
          </div>
        </section>`;
    }

    function emptyState(mode) {
      const states = {
        notes: { icon: "notes", title: "Notes abhi upload nahi hue", text: "Is chapter ke notes upload hone par yahin dikhai denge.", status: "Chapter notes" },
        questions: { icon: "questions", title: "Questions abhi upload nahi hue", text: "Is chapter ke question set ko yahin practice kar sakte hain.", status: "Question practice" },
        videos: { icon: "video", title: "Video abhi upload nahi hua", text: "Is chapter ka video isi section mein play hoga.", status: "Chapter video" }
      }[mode];
      return `<div class="empty-state"><span class="empty-icon">${ICONS[states.icon]}</span><h2>${states.title}</h2><p>${states.text}</p><span class="empty-status">${states.status}</span></div>`;
    }

    function renderNotes() {
      const content = getContent();
      const notes = Array.isArray(content.notes) ? content.notes : [];
      const files = Array.isArray(content.noteFiles) ? content.noteFiles : (content.noteFiles ? [content.noteFiles] : []);
      if (!notes.length && !files.length) return emptyState("notes");
      const textNotes = notes.map((note, index) => `
        <article class="note-entry">
          <div class="note-index">Note ${String(index + 1).padStart(2, "0")}</div>
          <h2>${escapeHtml(note.title || `Chapter notes ${index + 1}`)}</h2>
          <p>${escapeHtml(note.text || "").replace(/\n/g, "<br>")}</p>
        </article>`).join("");
      const pdfNotes = files.map((rawFile, index) => {
        const file = safeUrl(rawFile);
        if (!file) return "";
        return `<article class="pdf-entry"><h2>PDF Notes ${files.length > 1 ? String(index + 1).padStart(2, "0") : ""}</h2><iframe class="pdf-frame" src="${escapeHtml(file)}" title="Chapter notes PDF" loading="lazy"></iframe><a class="file-link" href="${escapeHtml(file)}" target="_blank" rel="noopener">PDF ko alag tab mein kholen ↗</a></article>`;
      }).join("");
      return `<div class="notes-stack">${textNotes}${pdfNotes}</div>`;
    }

    function renderQuestions() {
      const questions = Array.isArray(getContent().questions) ? getContent().questions : [];
      if (!questions.length) return emptyState("questions");
      if (state.quizIndex >= questions.length) {
        return `<div class="quiz-shell"><div class="quiz-finish"><div><div class="finish-symbol" aria-hidden="true">∞</div><h2>Practice complete</h2><p>Aapka score: <strong>${state.quizScore} / ${questions.length}</strong></p><div class="finish-actions"><button class="primary-button" type="button" data-action="restart-quiz">Dobara practice karein</button><button class="secondary-button" type="button" data-action="back-chapter">Chapter par wapas</button></div></div></div>`;
      }
      const question = questions[state.quizIndex];
      const options = Array.isArray(question.options) ? question.options : [];
      const answerIndex = Number(question.answer);
      const isCorrect = state.quizChecked && state.quizSelected === answerIndex;
      const progress = Math.round(((state.quizIndex + 1) / questions.length) * 100);
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const optionHtml = options.map((option, index) => {
        let className = "answer-option";
        if (state.quizSelected === index) className += " is-selected";
        if (state.quizChecked && index === answerIndex) className += " is-correct";
        if (state.quizChecked && state.quizSelected === index && index !== answerIndex) className += " is-wrong";
        return `<button class="${className}" type="button" data-action="select-option" data-index="${index}" ${state.quizChecked ? "disabled" : ""}><span class="option-letter">${letters[index] || index + 1}</span><span class="option-text">${escapeHtml(option)}</span></button>`;
      }).join("");
      const feedback = state.quizChecked
        ? `<div class="quiz-feedback ${isCorrect ? "" : "is-wrong"}"><strong>${isCorrect ? "Sahi jawab!" : "Is baar nahi—sahi option highlight kiya hai."}</strong>${escapeHtml(question.explanation || "")}</div>`
        : "";
      const action = state.quizChecked
        ? `<button class="primary-button" type="button" data-action="next-question">${state.quizIndex === questions.length - 1 ? "Result dekhein" : "Agla question"} <span aria-hidden="true">→</span></button>`
        : `<button class="primary-button" type="button" data-action="check-answer" ${state.quizSelected === null ? "disabled" : ""}>Jawab check karein</button>`;
      return `<div class="quiz-shell">
        <div class="quiz-topline"><span>Question ${state.quizIndex + 1} / ${questions.length}</span><span class="quiz-score">Score ${state.quizScore}</span></div>
        <div class="quiz-progress" aria-label="Practice progress"><span style="width:${progress}%"></span></div>
        <h2 class="quiz-question">${escapeHtml(question.question || "")}</h2>
        <div class="answer-list">${optionHtml}</div>
        ${feedback}
        <div class="quiz-actions">${action}</div>
      </div>`;
    }

    function getVideoItems(content) {
      if (Array.isArray(content.videos) && content.videos.length) return content.videos;
      if (content.videoUrl) return [{ title: content.videoTitle || "Chapter video", url: content.videoUrl }];
      return [];
    }

    function youtubeEmbedUrl(rawUrl) {
      try {
        const parsed = new URL(rawUrl);
        const host = parsed.hostname.replace(/^www\./, "").toLowerCase();
        let id = "";
        if (host === "youtu.be") id = parsed.pathname.split("/").filter(Boolean)[0] || "";
        else if (host.endsWith("youtube.com")) {
          if (parsed.pathname === "/watch") id = parsed.searchParams.get("v") || "";
          else if (parsed.pathname.startsWith("/embed/")) id = parsed.pathname.split("/")[2] || "";
          else if (parsed.pathname.startsWith("/shorts/")) id = parsed.pathname.split("/")[2] || "";
        }
        return /^[A-Za-z0-9_-]{11}$/.test(id) ? `https://www.youtube-nocookie.com/embed/${id}` : "";
      } catch (_) { return ""; }
    }

    function renderVideos() {
      const videos = getVideoItems(getContent());
      if (!videos.length) return emptyState("videos");
      const cards = videos.map((video, index) => {
        const url = safeUrl(video.url || "");
        if (!url) return "";
        const title = escapeHtml(video.title || `Chapter video ${index + 1}`);
        const youtubeUrl = /^https?:\/\//i.test(url) ? youtubeEmbedUrl(url) : "";
        let player = "";
        if (youtubeUrl) {
          player = `<iframe class="video-frame" src="${youtubeUrl}" title="${title}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
        } else if (/\.(mp4|webm|ogg)(?:[?#].*)?$/i.test(url)) {
          player = `<video class="video-player" controls playsinline preload="metadata"><source src="${escapeHtml(url)}"></video>`;
        } else {
          player = `<a class="video-link-card" href="${escapeHtml(url)}" target="_blank" rel="noopener"><span>Video link kholen</span><span aria-hidden="true">↗</span></a>`;
        }
        return `<article class="video-entry"><h2>${title}</h2>${player}</article>`;
      }).join("");
      return cards || emptyState("videos");
    }

    function renderTool() {
      const subject = getSubject();
      const chapter = getChapter();
      if (!subject || !chapter) { state.screen = "subjects"; return renderSubjects(); }
      const labels = { notes: "Notes", questions: "Question Practice", videos: "Video" };
      const icons = { notes: "notes", questions: "questions", videos: "video" };
      let content = "";
      if (state.mode === "notes") content = renderNotes();
      else if (state.mode === "questions") content = renderQuestions();
      else if (state.mode === "videos") content = renderVideos();
      else { state.screen = "chapter"; return renderChapter(); }
      return `
        <section class="view-enter" aria-labelledby="content-title">
          ${viewTop("back-chapter", `${escapeHtml(chapter.name)} par wapas`)}
          <div class="content-header">
            <div><div class="breadcrumb-label">${subject.name} · ${escapeHtml(chapter.name)}</div><h1 id="content-title">${labels[state.mode]}</h1><p class="content-subtitle">NEET UG 2027 · chapter-wise ${labels[state.mode].toLowerCase()}</p></div>
            <span class="content-type-tag">${ICONS[icons[state.mode]]}${labels[state.mode]}</span>
          </div>
          <div class="content-area">${content}</div>
        </section>`;
    }

    function render() {
      let html = "";
      if (state.screen === "home") html = renderHome();
      else if (state.screen === "subjects") html = renderSubjects();
      else if (state.screen === "subject") html = renderSubject();
      else if (state.screen === "chapter") html = renderChapter();
      else if (state.screen === "tool") html = renderTool();
      else html = renderHome();
      app.innerHTML = html;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("click", event => {
      const control = event.target.closest("[data-action]");
      if (!control) return;
      const action = control.dataset.action;
      if (action === "home") {
        state.screen = "home"; state.goal = null; state.subjectId = null; state.chapterId = null; state.mode = null;
      } else if (action === "enter-target") {
        state.goal = "neet";
        state.screen = "subjects";
      } else if (action === "back-home") {
        state.screen = "home"; state.goal = null; state.subjectId = null; state.chapterId = null; state.mode = null;
      } else if (action === "open-subject") {
        state.subjectId = control.dataset.subject; state.chapterId = null; state.screen = "subject";
      } else if (action === "back-subjects") {
        state.screen = "subjects"; state.chapterId = null; state.mode = null;
      } else if (action === "open-chapter") {
        if (state.subjectId === "test" && TEST_LINKS[control.dataset.chapter]) {
  window.location.href = TEST_LINKS[control.dataset.chapter];
  return;
        }
        state.chapterId = control.dataset.chapter; state.screen = "chapter";
      } else if (action === "back-subject") {
        state.screen = "subject"; state.mode = null;
      } else if (action === "open-mode") {
        if (control.dataset.mode === "questions" && state.subjectId === "physics" && state.chapterId === "basic-math-calculus") {
  window.location.href = "data/index1physics.html";
  return;
        }
        if (control.dataset.mode === "questions" && state.subjectId === "chemistry" && state.chapterId === "some-basic-concepts") {
  window.location.href = "data/index1chemistry.html";
  return;
        }
        if (control.dataset.mode === "questions" && state.subjectId === "biology" && state.chapterId === "cell-the-unit-of-life") {
  window.location.href = "data/CellTheUnitofLife1question.html";
  return;
        }
        if (control.dataset.mode === "questions" && state.subjectId === "biology" && state.chapterId === "structural-organisation-in-animals") {
  window.location.href = "data/StructuralOrganisationquestion.html";
  return;
        }
        if (control.dataset.mode === "questions" && state.subjectId === "physics" && state.chapterId === "Vector") {
  window.location.href = "data/VectorsQuestion.html";
  return;
        }
        if (control.dataset.mode === "questions" && state.subjectId === "chemistry" && state.chapterId === ""Redox-Reaction") {
  window.location.href = "data/redoxreactionpractice.html";
  return;
        }
        state.mode = control.dataset.mode; state.screen = "tool";
        state.quizIndex = 0; state.quizScore = 0; state.quizSelected = null; state.quizChecked = false;
      } else if (action === "back-chapter") {
        state.screen = "chapter"; state.mode = null;
      } else if (action === "select-option") {
        if (!state.quizChecked) state.quizSelected = Number(control.dataset.index);
      } else if (action === "check-answer") {
        const questions = getContent().questions || [];
        const question = questions[state.quizIndex];
        if (question && state.quizSelected !== null) {
          state.quizChecked = true;
          if (state.quizSelected === Number(question.answer)) state.quizScore += 1;
        }
      } else if (action === "next-question") {
        state.quizIndex += 1; state.quizSelected = null; state.quizChecked = false;
      } else if (action === "restart-quiz") {
        state.quizIndex = 0; state.quizScore = 0; state.quizSelected = null; state.quizChecked = false;
      } else {
        return;
      }
      render();
    });

    render();
  </script>
</body>
</html>
