     3. Site live: https://<username>.github.io/neet-practice/

     { name:"Motion in a Straight Line", cls:11, live:true,
       desc:"...", revision:"...", subtopics:["...","..."],
       resources:{ notes:[{t:"...", link:"...", note:"..."}],

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f13">

<title>Practice with Infinity | NEET 2027 | Pradip Kar</title>
<style>
/* ============================ TOKENS — aankh par zor na pade ============================ */
:root{
  --bg:#0d0f13; --bg2:#11141a;
  --panel:#171b22; --panel2:#1d222b; --panel3:#232935;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13);
  --txt:#d7dce4; --mut:#a4aebd; --dim:#78838f;
  --phy:#8fb6e6; --che:#dfb877; --bio:#93c9a0;
  --a1:#8fb6e6; --a2:#b9c6d6;      /* current screen ka accent */
  --gold:#e3c381; --ok:#8fd4b0; --rose:#e6a2ae;
  --r:14px; --r2:10px;
  --ff:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--txt); font-family:var(--ff);
  font-size:16px; line-height:1.65; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh;
}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1100px 520px at 78% -12%, rgba(143,182,230,.055), transparent 62%),
  radial-gradient(900px 480px at 8% 108%, rgba(147,201,160,.045), transparent 60%),
  linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));}
::selection{background:rgba(143,182,230,.28);color:#fff}
a{color:inherit}
:focus-visible{outline:2px solid var(--a1);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4,h5{margin:0;line-height:1.3;font-weight:650;letter-spacing:-.01em}
p{margin:0}
ul{margin:0}
button{font-family:inherit}

/* ============================ LAYOUT ============================ */
.wrap{width:min(1000px,92vw);margin:0 auto}
main{padding:26px 0 70px;min-height:60vh}
section{animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#10131a,#0d0f13)}
.top .in{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.logo .mk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--a1);
  border:1px solid var(--line2);background:var(--panel2);color:var(--a1)}
.logo .mk svg{width:30px;height:30px}
.logo b{display:block;font-size:15px;font-weight:650;line-height:1.3}
.logo i{display:block;font-style:normal;font-size:12px;letter-spacing:1.6px;color:var(--dim)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;white-space:nowrap;border:1px solid var(--line);
  border-radius:999px;font-size:12.5px;color:var(--mut);background:var(--panel);text-decoration:none}
.chip svg{width:14px;height:14px}
@media(max-width:640px){
  .top .in{gap:8px}
  #planChip{display:none}
  #dayChip{font-size:11.5px;padding:4px 10px;flex:0 0 auto}
  .logo i{display:none}
  .logo b{font-size:14px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--txt);padding:10px 16px;border-radius:999px;font-size:14.5px;font-weight:600;cursor:pointer;
  transition:.18s;text-decoration:none}
.btn:hover{background:var(--panel3);border-color:var(--a1)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--a1);border-color:transparent;color:#0e1319;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 13px;font-size:13px}
.lnk{color:var(--a1);text-decoration:none;border-bottom:1px solid rgba(143,182,230,.35);font-size:14px;cursor:pointer}
.lnk:hover{border-bottom-color:var(--a1)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.eyebrow{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:650}
.h1 .wl{display:block;font-size:.42em;letter-spacing:2.6px;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:9px}
.h1{font-size:clamp(28px,5.4vw,44px);letter-spacing:-.02em;line-height:1.14;font-weight:700}
.h2{font-size:clamp(20px,3vw,26px);letter-spacing:-.015em;font-weight:650}
.h3{font-size:17px;font-weight:650}
.lead{color:var(--mut);font-size:16px}
.sm{font-size:13.5px}.xs{font-size:12px}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;
  font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--mut)}
.pill svg{width:12px;height:12px}
.pill.soon{color:var(--dim);background:transparent;border-style:dashed}
.pill.ok{color:#0f2018;background:var(--ok);border-color:transparent}
.pill.live{color:#101a24;background:var(--a1);border-color:transparent}
.pill.gold{color:var(--gold);border-color:rgba(227,195,129,.3)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.gap8{gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

/* ============================ HOME (exam chuno) ============================ */
.home{padding:30px 0 0;max-width:760px}
.name{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--txt);font-weight:600;margin-top:12px}
.name .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.name span{color:var(--dim);font-weight:400;font-size:13.5px}
.banner{margin:24px 0 4px;padding:15px 18px;border-radius:var(--r);font-size:15.5px;color:var(--txt);
  background:linear-gradient(180deg,#1a1f27,#171b22);border:1px solid var(--line)}
.banner b{color:var(--gold);font-weight:650}
.exams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
@media(max-width:760px){.exams{grid-template-columns:1fr}}
.exam{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:22px;cursor:pointer;color:inherit;font:inherit;transition:.18s;display:block;width:100%}
.exam:hover{background:var(--panel2);border-color:var(--a1);transform:translateY(-2px)}
.exam[disabled]{cursor:default;opacity:.62}
.exam[disabled]:hover{transform:none;border-color:var(--line2);background:var(--panel)}
.exam .ei{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--ec,var(--a1))}
.exam .ei svg{width:26px;height:26px}
.exam .k{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:650}
.exam h2{font-size:27px;margin:8px 0 6px;letter-spacing:-.02em}
.exam p{font-size:14px;color:var(--mut)}
.exam .go{display:flex;align-items:center;gap:7px;margin-top:16px;font-size:14px;font-weight:650;color:var(--a1)}
.exam .go svg{width:15px;height:15px}
.home .foot-note{margin-top:26px;font-size:13.5px;color:var(--dim)}

/* ============================ SUBJECTS ============================ */
.subj{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.subj{grid-template-columns:1fr}}
.scard{position:relative;display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:20px 20px 18px;cursor:pointer;color:inherit;font:inherit;transition:.18s;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--s1);opacity:.85}
.scard:hover{background:var(--panel2);border-color:var(--s1);transform:translateY(-2px)}
.scard .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--panel3);color:var(--s1);border:1px solid var(--line)}
.scard .ic svg, .shead .big svg{width:21px;height:21px}
.scard .ic .x,.shead .big .x{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:6px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line2);color:var(--gold)}
.scard .ic .x svg,.shead .big .x svg{width:11px;height:11px}
.scard .ic,.shead .big{position:relative}
.scard h3{font-size:21px;margin:14px 0 2px}
.scard p{font-size:14px;color:var(--mut);margin-top:8px}
.scard .ftr{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.scard .ftr b{color:var(--txt);font-weight:650;font-size:13.5px}

/* ============================ CHAPTER LIST ============================ */
.shead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:18px}
.shead .t{display:flex;gap:14px;align-items:center;min-width:0}
.shead .big{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--panel3);
  color:var(--a1);border:1px solid var(--line2);flex:0 0 auto}
.shead .big svg{width:24px;height:24px}
.clist{display:grid;gap:8px}
.crow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r2);padding:13px 16px;color:inherit;font:inherit;transition:.16s}
button.crow{cursor:pointer}
button.crow:hover{background:var(--panel2);border-color:var(--a1);transform:translateX(2px)}
.crow .n{width:26px;flex:0 0 auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.crow .bd{flex:1;min-width:0}
.crow .bd b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.crow .bd span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
.crow .prg{width:88px;flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.crow .prg i{flex:1;height:4px;border-radius:9px;background:var(--panel3);overflow:hidden;display:block}
.crow .prg i b{display:block;height:100%;background:var(--a1);border-radius:9px}
.crow.live{border-left:3px solid var(--a1)}
.crow.soon{background:transparent;border-style:dashed;opacity:.78}
.crow.soon .bd b{color:var(--mut);font-weight:500}
.soonline{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;padding:15px;
  border:1px dashed var(--line2);border-radius:var(--r);color:var(--mut);font-size:14.5px;background:transparent}
.soonline svg{width:17px;height:17px;color:var(--dim)}
.crow.done{border-left-color:var(--ok)}
@media(max-width:640px){.crow .prg{display:none}}

/* ============================ CHAPTER PAGE ============================ */
.cback{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;font-size:13.5px;color:var(--dim)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:var(--mut);font-size:14px;font-weight:600;padding:9px 14px;
  border-radius:9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:.16s}
.tab svg{width:15px;height:15px}
.tab:hover{color:var(--txt);background:var(--panel2)}
.tab.on{background:var(--panel3);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
.tab.on i{color:var(--a1)}
.tab i{font-style:normal;font-size:11.5px;color:var(--dim);font-weight:650}
.res{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel)}
.res:hover{border-color:var(--line2)}
.res .rk{width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel2);color:var(--a1)}
.res .rk svg{width:16px;height:16px}
.res .bd{flex:1;min-width:0}
.res h5{font-size:15.5px;font-weight:600}
.res p{font-size:13.5px;color:var(--mut);margin-top:3px}
.res .lk{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--a1);text-decoration:none;border-bottom:1px solid rgba(143,182,230,.3)}
.res .lk svg{width:13px;height:13px}
.res .lk:hover{border-bottom-color:var(--a1)}
.res.done{background:linear-gradient(90deg,rgba(143,212,176,.05),transparent)}
.res.done h5{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line2)}
.ck{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:transparent;cursor:pointer;
  display:grid;place-items:center;transition:.16s;padding:0;flex:0 0 auto}
.ck svg{width:16px;height:16px}
.ck:hover{border-color:var(--ok);color:var(--line2)}
.ck.on{background:var(--ok);border-color:transparent;color:#0f2018}
.empty{padding:28px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r);color:var(--mut)}
.empty svg{width:34px;height:34px;color:var(--dim);margin-bottom:8px}

/* practice */
.mcq{padding:22px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel)}
.mcq .q{font-size:17.5px;font-weight:600;margin:12px 0 18px;line-height:1.6}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;font:inherit;color:inherit;cursor:pointer;
  padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--bg2);transition:.16s;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--a1);background:var(--panel2)}
.opt .lt{width:24px;height:24px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-size:12px;
  font-weight:700;border:1px solid var(--line2);color:var(--mut)}
.opt.right{border-color:var(--ok);background:rgba(143,212,176,.09)}
.opt.right .lt{background:var(--ok);color:#0f2018;border-color:transparent}
.opt.wrong{border-color:var(--rose);background:rgba(230,162,174,.09)}
.opt.wrong .lt{background:var(--rose);color:#241014;border-color:transparent}
.opt:disabled{cursor:default}
.exp{margin-top:15px;padding:14px 15px;border-radius:var(--r2);border-left:3px solid var(--a1);background:var(--panel2);font-size:14.5px;color:var(--mut)}
.exp b{color:var(--txt);font-weight:650}
.meter{height:5px;border-radius:9px;background:var(--panel3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--a1);border-radius:9px;transition:width .3s}
.tm{font-variant-numeric:tabular-nums;font-weight:650}
.score{text-align:center;padding:30px 22px}
.score .big{font-size:clamp(42px,9vw,68px);font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--gold)}

/* plan page */
.plan{max-width:720px}
.plan h2{margin:26px 0 8px;font-size:21px;letter-spacing:-.01em}
.plan h2:first-of-type{margin-top:14px}
.plan ol,.plan ul{padding-left:20px;display:grid;gap:9px;color:var(--mut);font-size:15.5px;margin:10px 0 0}
.plan li::marker{color:var(--a1)}
.plan b{color:var(--txt);font-weight:650}
.plan .note{margin-top:10px;padding:13px 15px;border-radius:var(--r2);background:var(--panel);border:1px solid var(--line);font-size:14.5px;color:var(--mut)}

.foot{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--dim);font-size:13px;
  display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:200;padding:11px 18px;border-radius:999px;
  background:var(--panel3);border:1px solid var(--line2);color:var(--txt);font-size:14px;box-shadow:0 14px 40px -18px #000;
  opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* chhote phone par tab strip 3 column me mutate ho (horizontal scroll na karana pade) */
</style>
</head>

<script>
/* ==========================================================================
   >>> SYLLABUS YAHAN SE EDIT KARO <<<   (Admin = Pradip Kar, sirf code se)
   --------------------------------------------------------------------------
   Har subject ke andar uske chapter ki line hai.
     { name:"Chapter ka naam", cls:11 }                     -> Coming Soon
     { name:"...", cls:11, live:true, desc:"...", ... }     -> students ke liye khula
   Naya chapter live karne ka pura template file ke upar comment me hai.
   ========================================================================== */
var SITE_DATA = {
  owner: "Pradip Kar",
  site: "Practice with Infinity",
  targetMarks: 700,          /* NEET me target marks — yahi number sab jagah dikhega */
  totalMarks: 720,

  exams: [
    { id:"neet2027", name:"NEET 2027", icon:"doctor", live:true,
      tag:"Physics · Chemistry · Biology",

      tag:"Physics · Chemistry · Maths",
      blurb:"Abhi khali hai. Jaise hi content daala jayega, yahi se khulega." }

/* ==========================================================================
   ENGINE — data normalise, progress storage, render (is ke neeche kuch edit
   karne ki zaroorat nahi; content sirf upar wale section me hai)
   ========================================================================== */
const KEY = { prog:"infi_v3_prog" };
const MEM = {};
function sGet(k){ try { const v = localStorage.getItem(k); if (v !== null) return v; } catch(e){} return (k in MEM) ? MEM[k] : null; }
function sSet(k, v){ MEM[k] = v; try { localStorage.setItem(k, v); } catch(e){} }
function uid(p){ return (p||"x") + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,5); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || uid("c"); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

/* chapter/subject ko normal shape de do — isliye tum sirf naam + live:true likhoge */
function normalise(D){
  D.exams = D.exams || [];
  (D.subjects || []).forEach(s => {
    s.chapters = s.chapters || [];
    s.chapters.forEach((c, i) => {
      c.id = c.id || slug(c.name);
      c.name = c.name || "Chapter " + (i+1);
      c.live = c.live === true;
      c.resources = c.resources || {};
      ["notes","videos","questions"].forEach(k => {
        c.resources[k] = (c.resources[k] || []).map(r => { r.id = r.id || slug(c.id + "-" + k + "-" + r.t).slice(-40); r.t = r.t || "Untitled"; return r; });
      });
      c.mcqs = c.mcqs || [];
      c.subtopics = c.subtopics || [];
    });
  });
  return D;
}
const DATA = normalise(SITE_DATA);

let P = (function(){ try { return JSON.parse(sGet(KEY.prog) || "{}") || {}; } catch(e){ return {}; } })();
P.tasks = P.tasks || {}; P.mcq = P.mcq || {}; P.log = P.log || {};
function saveProg(){ sSet(KEY.prog, JSON.stringify(P)); }

const S = { exam:"neet2027", subject:null, chapter:null };
let A = null;   /* chal raha MCQ attempt */

/* ---- helpers ---- */
function exam(id){ id = id || S.exam; return DATA.exams.find(x => x.id === id) || DATA.exams[0]; }
function subs(){ return DATA.subjects || []; }
function sub(id){ return subs().find(s => s.id === id) || null; }
function chap(s, id){ return (s && s.chapters || []).find(c => c.id === id) || null; }
function isLive(c){ return !!(c && c.live); }
function chTasks(c){ return isLive(c) ? ["notes","videos","questions"].reduce((n,k) => n + (c.resources[k]||[]).length, 0) : 0; }
function pKey(e, s, c){ return e.id + "/" + s.id + "/" + c.id; }
function chDone(e, s, c){ const pre = pKey(e,s,c) + "::"; return Object.keys(P.tasks).filter(k => k.indexOf(pre) === 0 && P.tasks[k]).length; }
function chPct(e, s, c){ const t = chTasks(c); return t ? Math.min(100, Math.round(chDone(e,s,c) * 100 / t)) : 0; }
function liveCount(s){ return (s.chapters||[]).filter(isLive).length; }
function streak(){
  let n = 0, d = new Date();
  for(;;){
    const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    if (P.log[k] > 0) { n++; d.setDate(d.getDate()-1); }
    else { if (k === today()) { d.setDate(d.getDate()-1); continue; } break; }
    if (n > 400) break;
  }
  return n;
}
function bump(n){ const k = today(); P.log[k] = (P.log[k] || 0) + (n || 0); saveProg(); }

function render(){
  const app = document.getElementById("app");

  else if (S.screen === "plan"){ html = vPlan(); }

  else if (S.screen === "chapters" || S.screen === "chapter"){
    const s = sub(S.subject) || subs()[0];
    setAccent(s);
    html = S.screen === "chapters" ? vChapters(e, s) : vChapter(e, s, chap(s, S.chapter));
  }

  document.getElementById("logoSub").textContent = e ? e.name : "NEET 2027";
  const dn = P.log[today()] || 0;
  document.getElementById("dayChip").innerHTML = ic("target") + "Target " + (DATA.targetMarks || 700) + "/" + (DATA.totalMarks || 720) + (dn ? " · aaj " + dn : "");

  const rk = location.hash;
  if (rk !== render._r) { render._r = rk; window.scrollTo(0,0); }
}

function vChapter(e, s, c){

function resRow(e, s, c, kind, it, i, x){

/* ---------------- PRACTICE (MCQ) ---------------- */
function practiceBlock(e, s, c){
  return `<div><h2 class="h3">Practice</h2>${tabPractice(e, s, c)}</div>`;
}
function tabPractice(e, s, c){
  const list = c.mcqs || [];
  if (!A) return practiceIntro(e, s, c, list);
  if (A.i >= A.order.length) return practiceResult(e, s, c, list);
  const q = list[A.order[A.i]];
  const asked = A.picks[A.i] !== null;
  const right = asked && A.picks[A.i] === q.a;
  const sec = Math.max(0, Math.round((Date.now() - A.t0)/1000));
  return `
  <div class="mcq">
    <div class="row between">
      <span class="xs dim">Sawal ${A.i+1} / ${A.order.length}</span>
      <span class="row gap8"><span class="tm" id="tmr">${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}</span>
        <button class="btn sm" data-act="end-try">Band karo</button></span>
    </div>
    <div class="meter" style="margin:12px 0 4px"><i style="width:${Math.round(A.i*100/A.order.length)}%"></i></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">
      ${q.o.map((o, k) => {
        const isA = k === q.a, isP = k === A.picks[A.i];
        const cls = asked ? (isA ? "right" : (isP ? "wrong" : "")) : "";
        return `<button class="opt ${cls}" ${asked ? "disabled" : ""} data-act="pick" data-k="${k}"><span class="lt">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`;
      }).join("")}
    </div>
    ${asked ? `<div class="exp"><b>${right ? "Sahi." : "Galat."}</b> ${esc(q.exp||"")}</div>
      <div class="row between" style="margin-top:14px"><span></span>
      <button class="btn pri" data-act="next-q">${A.i === A.order.length-1 ? "Result" : "Agla sawal"} ${ic("right")}</button></div>`
      : `<div class="row between" style="margin-top:14px"><span class="xs dim">Option dabao</span><button class="btn sm" data-act="skip-exp">Chhodo</button></div>`}
  </div>`;
}
function practiceIntro(e, s, c, list){
  const b = P.mcq[pKey(e,s,c)];
  return `
  <div class="card">
    <p class="sm mut">${list.length} sawal · target 80%+${b ? " · best " + b.right + "/" + b.total : ""}</p>
    <div class="row" style="margin-top:14px">
      <button class="btn pri" data-act="start-try">${ic("bolt")} Shuru karo</button>
      ${b && b.wrong && b.wrong.length ? `<button class="btn" data-act="review-mode">Galat wale dobara</button>` : ""}
    </div>
  </div>`;
}
function practiceResult(e, s, c, list){
  const right = A.picks.filter((p, i) => p === list[A.order[i]].a).length;
  const total = A.order.length, pct = Math.round(right * 100 / total);
  return `
  <div class="mcq score">
    <p class="big" style="margin:0 0 6px">${pct}%</p>
    <p class="lead">${right} sahi · ${total - right} galat</p>
    <p class="sm mut" style="margin-top:12px">${pct >= 80 ? "Chapter pack ho gaya — agla chapter kholo." : "Galat sawal dobara karo, reason notebook me likho."}</p>
    <div class="row" style="justify-content:center;margin-top:18px">
      <button class="btn" data-act="review-mode">Galat wale dobara</button>
      <button class="btn pri" data-act="end-try">Band karo</button>
    </div>
  </div>`;
}
function finishAttempt(e, s, c){
  if (!A || !c) return;
  const list = c.mcqs || [];
  const right = A.picks.filter((p, i) => p === list[A.order[i]].a).length;
  const wrong = A.order.filter((q, i) => A.picks[i] !== list[q].a);
  const k = pKey(e,s,c), old = P.mcq[k];
  if (!old || right > old.right) P.mcq[k] = { right, total: A.order.length, wrong };
  bump(right);
}

/* ---------------- PLAN (Target) ---------------- */
function vPlan(){
  const p = DATA.plan || [];
  return `
  <section class="plan">
    <p class="eyebrow">Target</p>
    <h1 class="h1" style="margin-top:8px;font-size:clamp(24px,4.4vw,34px)">${esc(exam() ? exam().name : "NEET 2027")}</h1>
    ${p.map(x => `<h2>${esc(x.h)}</h2><ul>${(x.pts||[]).map(t => `<li>${t}</li>`).join("")}</ul>`).join("")}
    <div class="row" style="margin-top:24px">
      <a class="btn" href="#/" data-act="nav" data-to="/">${ic("back")} Home</a>
      <a class="btn pri" href="#/subjects" data-act="nav" data-to="/subjects">Subjects kholo</a>
    </div>
  </section>`;
}

/* ==========================================================================
   EVENTS + ROUTER
   ========================================================================== */
function toast(m){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2100);
}
function go(to){ location.hash = "#" + to; }
function curSub(){ return sub(S.subject) || subs()[0]; }
function curChap(){ const s = curSub(); return s ? chap(s, S.chapter) : null; }

document.addEventListener("click", function(ev){
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  const e = exam();

  if (a === "nav") { ev.preventDefault(); go(el.dataset.to); return; }
  if (a === "noop") { ev.preventDefault(); toast("JEE 2027 ka content abhi ban raha hai — thoda intezaar"); return; }
  if (a === "open-exam") { ev.preventDefault(); S.exam = el.dataset.e; go("/subjects"); return; }
  if (a === "open-sub") { S.subject = el.dataset.s; S.query = ""; go("/chapters/" + el.dataset.s); return; }
  if (a === "open-ch") { const s = sub(el.dataset.s); const c = chap(s, el.dataset.c);
    if (!isLive(c)) { toast("Ye chapter abhi Coming Soon me hai"); return; }
    S.subject = s.id; S.chapter = c.id; A = null; go("/chapter/" + s.id + "/" + c.id); return; }

  if (a === "tick") {
    const k = el.dataset.key;
    P.tasks[k] = !P.tasks[k];
    if (P.tasks[k]) { bump(1); toast("Done — aage badho"); } else { P.log[today()] = Math.max(0, (P.log[today()] || 1) - 1); saveProg(); }
    render(); return;
  }
  if (a === "play") {
    const box = document.getElementById("player-" + el.dataset.key);
    if (!box) return;
    if (box.innerHTML) { box.innerHTML = ""; return; }
    let src = el.dataset.src || "";
    if (!src) return;
    const m = src.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{6,})/);
    if (m) src = "https://www.youtube-nocookie.com/embed/" + m[1] + "?autoplay=1&rel=0";
    box.innerHTML = '<span style="display:block;position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;border:1px solid var(--line2);margin-top:12px;background:#000">' +
      '<iframe src="' + esc(src) + '" allow="accelerometer;autoplay;encrypted-media;picture-in-picture" allowfullscreen ' +
      'style="position:absolute;inset:0;width:100%;height:100%;border:0" title="Video lecture" loading="lazy"></iframe></span>';
    return;
  }

  /* practice */
  if (a === "start-try" || a === "review-mode") {
    const s = curSub(), c = curChap();
    if (!c || !(c.mcqs||[]).length) { toast("Is chapter me abhi MCQ nahi hai"); return; }
    let idx = c.mcqs.map((x, i) => i);
    const b = P.mcq[pKey(e,s,c)];
    if (a === "review-mode") { if (b && b.wrong && b.wrong.length) idx = b.wrong.slice(); else toast("Koi galat sawal record nahi — pehle ek attempt karo"); }
    else if (el.dataset.seq !== "1") idx.sort(() => Math.random() - .5);
    A = { i:0, order:idx, picks:idx.map(() => null), t0:Date.now() };
    render(); return;
  }
  if (a === "pick") {
    if (!A) return;
    A.picks[A.i] = +el.dataset.k;
    render(); return;
  }
  if (a === "skip-exp") { if (!A) return; A.picks[A.i] = -1; A.i++; if (A.i >= A.order.length) { finishAttempt(exam(), curSub(), curChap()); } render(); return; }
  if (a === "next-q") {
    if (!A) return;
    A.i++;
    if (A.i >= A.order.length) finishAttempt(exam(), curSub(), curChap());
    render(); return;
  }
  if (a === "end-try") { A = null; render(); return; }

  if (a === "reset-prog") {
    if (!confirm("Tumhara tick aur practice score is browser se hat jaayega. Theek hai?")) return;
    P = { tasks:{}, mcq:{}, log:{} }; saveProg(); A = null; render(); toast("Progress reset ho gaya"); return;
  }
});

document.addEventListener("keydown", function(ev){
  const t = ev.target;
  if (t && t.matches && t.matches("input,textarea,select")) { if (ev.key === "Escape") ev.target.blur(); return; }
  if (ev.key === "Escape" && location.hash && location.hash !== "#/") { if (history.length > 1) history.back(); else go("/"); }
});
setInterval(function(){
  if (!A) return;
  const t = document.getElementById("tmr"); if (!t) return;
  const sec = Math.max(0, Math.round((Date.now() - A.t0)/1000));
  t.textContent = String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
}, 1000);

function route(){
  let p = (location.hash || "#/").replace(/^#\/?/, "").split("/").filter(Boolean);
  /* exam id se shuru ho to use utha lo (e.g. #/jee2027/chapters/physics),
     warna pichhla/first exam chalta rahega */
  const isExam = p[0] && DATA.exams.some(x => x.id === p[0]);
  if (isExam) { S.exam = p[0]; p = p.slice(1); }
  if (!p[0] || p[0] === "home" || p[0] === "index.html") S.screen = "home";
  else if (p[0] === "plan") S.screen = "plan";
  else if (p[0] === "chapters") {
    S.screen = "chapters";
    S.subject = sub(p[1]) ? p[1] : (subs()[0] || {}).id;
    S.chapter = null;
  } else if (p[0] === "chapter") {
    S.screen = "chapter";
    S.subject = sub(p[1]) ? p[1] : (subs()[0] || {}).id;
    const s = sub(S.subject);
    S.chapter = chap(s, p[2]) ? p[2] : (s && s.chapters[0] ? s.chapters[0].id : null);
    if (!s || !S.chapter) S.screen = "chapters";   /* chapter hi nahi to list dikha do */
  } else S.screen = "subjects";
  render();
}
window.addEventListener("hashchange", route);
document.addEventListener("DOMContentLoaded", function(){
  route();
});
</script>
</body>
