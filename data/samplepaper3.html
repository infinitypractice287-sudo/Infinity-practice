<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET UG 2027 · Sample Paper 3 — 180 MCQ Practice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{
  --bg:#12141a; --card:#1b1f27; --card2:#20252f; --text:#dcdfe4; --muted:#9aa3b2;
  --green:#3fae74; --greenBg:rgba(63,174,116,.14); --red:#c9564f; --redBg:rgba(201,86,79,.14);
  --line:#2b3140; --accent:#6f9fe0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.7; -webkit-text-size-adjust:100%;
}
#app{max-width:920px;margin:0 auto;padding:14px 14px 90px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;
  padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header.top .sub{font-size:13px;color:var(--muted);font-weight:400}
.scorebox{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.pill b{color:var(--text);font-variant-numeric:tabular-nums}
.barwrap{height:7px;background:#0e1015;border-radius:99px;overflow:hidden;margin:2px 0 14px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#4f8fd6,#3fae74);transition:width .25s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qnum{font-weight:650;font-size:15px;color:var(--accent);letter-spacing:.3px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12.5px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.qtext{font-size:18px;line-height:1.75;margin:6px 0 14px}
.figwrap{background:#0f1217;border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0 16px;overflow-x:auto;text-align:center}
.figwrap svg{max-width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  min-height:52px;padding:12px 14px;border-radius:12px;cursor:pointer;
  background:var(--card2);border:1.5px solid var(--line);color:var(--text);
  font:inherit;font-size:17px;line-height:1.6;transition:border-color .15s,background .15s}
.opt:hover:not(.locked){border-color:#3c4a63}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;background:#12161d;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;color:var(--muted)}
.opt .body{flex:1 1 auto;min-width:0}
.opt.locked{cursor:default}
.opt.correct{background:var(--greenBg);border-color:var(--green)}
.opt.correct .key{background:var(--green);color:#08130c;border-color:var(--green)}
.opt.wrong{background:var(--redBg);border-color:var(--red)}
.opt.wrong .key{background:var(--red);color:#1a0807;border-color:var(--red)}
.opt.dim{opacity:.85}
.verdict{margin:14px 0 0;font-weight:650;font-size:16px}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.explain{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.explain h3{font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:700}
.explain h3:first-child{margin-top:0}
.explain p{margin:6px 0}
.explain ol{margin:6px 0 6px 22px;padding:0}
.explain ol li{margin:7px 0}
.explain ul{margin:6px 0 6px 20px;padding:0}
.explain li{margin:5px 0}
.ansline{background:var(--greenBg);border:1px solid rgba(63,174,116,.45);border-radius:10px;padding:10px 12px;margin:10px 0}
.why .li-ok{color:#8fd3ae}
.why .li-no{color:#e39b95}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button.btn{font:inherit;font-size:16px;padding:11px 18px;min-height:48px;border-radius:11px;cursor:pointer;
  background:var(--card2);color:var(--text);border:1.5px solid var(--line);transition:background .15s,border-color .15s}
button.btn:hover{border-color:#3c4a63;background:#252b37}
button.btn.primary{background:#2c5c8f;border-color:#3a74b3;color:#eef4fb}
button.btn.primary:hover{background:#33689f}
button.btn.ghost{background:transparent}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.gridpanel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.gridpanel h2{font-size:15px;margin:0 0 10px;letter-spacing:.3px}
.gridctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.gridctl select,.gridctl input{font:inherit;font-size:15px;background:var(--card2);color:var(--text);
  border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px}
.gridctl input{width:110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.gbtn{min-height:44px;border-radius:9px;border:1.5px solid var(--line);background:var(--card2);color:var(--text);
  font:inherit;font-size:14.5px;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
.gbtn.cur{outline:2px solid var(--accent);outline-offset:1px}
.gbtn.ans-ok{background:rgba(63,174,116,.24);border-color:var(--green)}
.gbtn.ans-no{background:rgba(201,86,79,.24);border-color:var(--red)}
.gbtn.done{background:#2a3340}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.results .big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.simbox{margin:14px 0 0;background:#0f1217;border:1px solid var(--line);border-radius:12px;padding:14px}
.simbox h3{margin:0 0 4px;font-size:15px;color:var(--accent)}
.simbox .hint{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.simrow{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0}
.simrow label{font-size:14.5px;color:var(--text);display:flex;justify-content:space-between;gap:10px}
.simrow label span{color:var(--accent);font-variant-numeric:tabular-nums}
.simrow input[type=range]{width:100%;accent-color:#4f8fd6;height:32px}
.simout{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.outbox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;min-width:150px}
.outbox .lb{font-size:12.5px;color:var(--muted);display:block}
.simnote{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.katex{font-size:1.03em}
.katex-display{margin:.4em 0}
.fb-frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 .12em}
.fb-frac .n{border-bottom:1px solid currentColor;padding:0 .18em}
.fb-frac .d{padding:0 .18em}
.mono-hide{display:none}
footer.foot{margin-top:22px;text-align:center;font-size:12.5px;color:var(--muted)}
@media (max-width:560px){
  body{font-size:16.5px}
  .qtext{font-size:17px}
  #app{padding:10px 10px 80px}
  .card{padding:14px}
  .opt{font-size:16.5px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>NEET UG 2027 · Sample Paper 3</h1>
      <div class="sub" id="subline">180 questions · Physics + Chemistry + Biology · +4 / −1 / 0</div>
    </div>
    <div class="scorebox">
      <div class="pill">Score <b id="scoreNow">0</b>/<b id="scoreMax">720</b></div>
      <div class="pill">Correct <b id="cntOk">0</b></div>
      <div class="pill">Wrong <b id="cntNo">0</b></div>
      <div class="pill">Left <b id="cntLeft">180</b></div>
    </div>
  </header>
  <div class="barwrap"><div class="bar" id="bar"></div></div>

  <section id="quizView">
    <div class="card" id="qcard"></div>
    <div class="nav">
      <button class="btn" id="btnPrev">← Previous</button>
      <button class="btn" id="btnNext">Next →</button>
      <button class="btn ghost" id="btnSkip">Skip</button>
      <button class="btn primary" id="btnSubmit" style="margin-left:auto">Submit test</button>
    </div>
    <div class="gridpanel">
      <h2>Question map</h2>
      <div class="gridctl">
        <select id="filterSel">
          <option value="all">All questions</option>
          <option value="answered">Answered</option>
          <option value="unanswered">Unanswered</option>
        </select>
        <input id="gotoInput" type="number" min="1" max="180" placeholder="Go to Q">
        <button class="btn" id="btnGoto" style="min-height:44px;padding:9px 14px">Go</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i class="dot" style="background:rgba(63,174,116,.5)"></i>Correct</span>
        <span><i class="dot" style="background:rgba(201,86,79,.5)"></i>Wrong</span>
        <span><i class="dot" style="background:#2a3340"></i>Answered (hidden mode)</span>
        <span><i class="dot" style="background:#20252f;border:1px solid #2b3140"></i>Not attempted</span>
      </div>
    </div>
  </section>

  <section id="resultView" class="results" hidden></section>
  <footer class="foot">Progress auto-saved in this browser · KaTeX 0.16.9 (cdnjs)</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
/* ======================= DATA ======================= */
const DATA = [
{
"id": 1,
"ch": "Moving charges & magnetism",
"q": "A proton moves with a speed of $1\\times 10^{6}\\ \\mathrm{m\\,s^{-1}}$ perpendicular to a magnetic field of $0.8\\ \\mathrm{T}$. What is the radius of its path? (Mass $=1.67\\times10^{-27}\\ \\mathrm{kg}$, charge $=1.6\\times10^{-19}\\ \\mathrm{C}$)",
"fig": "",
"opt": [
"$1.3\\ \\mathrm{cm}$",
"$2.6\\ \\mathrm{cm}$",
"$0.65\\ \\mathrm{cm}$",
"$3.9\\ \\mathrm{cm}$"
],
"ans": 0,
"c": "Jab koi charged particle kisi magnetic field $\\vec{B}$ ke andar chalta hai, to field uspar ek force lagata hai: $\\vec{F}=q(\\vec{v}\\times\\vec{B})$. Ye force hamesha velocity ke perpendicular hoti hai, isliye speed nahi badalti — sirf direction badalti hai. Direction hamesha badalne ka matlab hai particle circle mein ghumta hai. Force ka magnitude $F=qvB\\sin\\theta$; yahan $\\theta=90^\\circ$ hai isliye $F=qvB$.",
"m": "Circle ki radius nikalne ke liye hum \"centripetal force = magnetic force\" likhte hain. Kyunki particle ko circle mein rakhne wali single force yahi magnetic force hai, wo hi required centripetal force $mv^{2}/r$ supply karti hai. Isse $r$ ka formula seedha nikal aata hai — koi kinematics ya time ki zaroorat nahi.",
"s": [
"Centripetal force ko magnetic force ke barabar rakho: $\\dfrac{mv^{2}}{r}=qvB$.",
"Dono taraf $v$ se divide karo: $\\dfrac{mv}{r}=qB$.",
"$r$ ke liye rearrange karo: $r=\\dfrac{mv}{qB}$.",
"Values daalo: $r=\\dfrac{(1.67\\times10^{-27})\\times(1\\times10^{6})}{(1.6\\times10^{-19})\\times(0.8)}$.",
"Numerator ke powers jodo: $10^{-27}\\times10^{6}=10^{-21}$. Denominator: $10^{-19}$. Ratio: $10^{-21}/10^{-19}=10^{-2}$.",
"Ab numbers: $\\dfrac{1.67}{1.6\\times0.8}=\\dfrac{1.67}{1.28}=1.30$.",
"To $r=1.30\\times10^{-2}\\ \\mathrm{m}=1.3\\ \\mathrm{cm}$.",
"Answer option (A) $\\mathbf{1.3\\ cm}$ se match karta hai."
],
"r": [
"Sahi — $r=mv/(qB)=1.3\\ \\mathrm{cm}$.",
"$2.6\\ \\mathrm{cm}$ tab aata jab aap $qB$ ki jagah $qB/2$ le lein ya galti se $2mv/(qB)$ likh dein — factor 2 ka error.",
"$0.65\\ \\mathrm{cm}$ exactly aadha hai, yani formula mein $2$ se divide kar diya gaya — kyunki energy $\\frac12mv^2$ se confuse hua jaata hai.",
"$3.9\\ \\mathrm{cm}$ teen guna hai — ye proton nahi, kisi 3 guna bhaari particle ka radius hota."
],
"w": [
"$\\theta$ hamesha $90^\\circ$ maano sirf jab question mein \"perpendicular\" likha ho — yahan likha hai, isliye $\\sin\\theta=1$.",
"Mass ko kg mein aur charge ko coulomb mein hi rakho; proton ka charge $1.6\\times10^{-19}\\ \\mathrm{C}$ hota hai, $1.6\\times10^{-27}$ nahi."
],
"t": "Yaad rakhne ka shortcut: $r=\\dfrac{mv}{qB}$ ko $r=\\dfrac{p}{qB}$ bhi likh sakte ho (momentum form) — aur $r$ speed ke directly proportional hota hai, $v$ double karo to radius double.",
"sim": {
"title": "Radius vs speed and field",
"hint": "Slider ghumao aur dekho radius kis cheez ke saath badhta hai.",
"consts": {
"m": 1.67e-27,
"q": 1.6e-19
},
"vars": [
{
"k": "v",
"label": "Speed v (×10^6 m/s)",
"min": 0.2,
"max": 5,
"step": 0.1,
"val": 1.0
},
{
"k": "B",
"label": "Field B (T)",
"min": 0.1,
"max": 2,
"step": 0.05,
"val": 0.8
}
],
"outs": [
{
"label": "Radius r",
"expr": "m*v*1e6/(q*B)*100",
"unit": "cm",
"dp": 3
},
{
"label": "Cyclotron frequency f",
"expr": "q*B/(2*3.14159265*m)",
"unit": "MHz",
"dp": 2
}
],
"plot": null,
"note": "Dhyan do: B badhao to circle chhota; v badhao to circle bada. Frequency sirf B aur mass par depend karti hai."
}
},
{
"id": 2,
"ch": "Magnetism & matter",
"q": "A bar magnet is cut along its length into two equal parts. If the original magnetic moment is $m=1.0\\ \\mathrm{A\\,m^{2}}$, what is the magnetic moment of each part?\"”",
"fig": "<svg viewBox=\"0 0 460 190\" width=\"100%\" height=\"190\" role=\"img\" aria-label=\"bar magnet cut along length\"><rect width=\"460\" height=\"190\" fill=\"#0f1217\"/>\n<rect x=\"60\" y=\"45\" width=\"100\" height=\"60\" fill=\"#3b4a63\" stroke=\"#9aa3b2\"/><rect x=\"160\" y=\"45\" width=\"100\" height=\"60\" fill=\"#5c4747\" stroke=\"#9aa3b2\"/>\n<text x=\"110\" y=\"82\" fill=\"#e6e9ee\" font-size=\"16\" text-anchor=\"middle\">S<\/text><text x=\"210\" y=\"82\" fill=\"#e6e9ee\" font-size=\"16\" text-anchor=\"middle\">N<\/text>\n<text x=\"160\" y=\"30\" fill=\"#9aa3b2\" font-size=\"13\" text-anchor=\"middle\">cut along length (dashed line)<\/text>\n<line x1=\"60\" y1=\"75\" x2=\"260\" y2=\"75\" stroke=\"#c9a227\" stroke-width=\"1.6\" stroke-dasharray=\"6 5\"/>\n<text x=\"300\" y=\"72\" fill=\"#9aa3b2\" font-size=\"13\">L same, pole strength halves<\/text>\n<text x=\"60\" y=\"140\" fill=\"#9aa3b2\" font-size=\"13\">original m = 1.0 A m<\/text><text x=\"205\" y=\"140\" fill=\"#9aa3b2\" font-size=\"10\" baseline-shift=\"sub\">2<\/text>\n<text x=\"60\" y=\"165\" fill=\"#3fae74\" font-size=\"13\">each part: m/2 = 0.5 A m<\/text><text x=\"230\" y=\"165\" fill=\"#3fae74\" font-size=\"10\" baseline-shift=\"sub\">2<\/text><\/svg>",
"opt": [
"$0.25\\ \\mathrm{A\\,m^{2}}$",
"$0.4\\ \\mathrm{A\\,m^{2}}$",
"$0.45\\ \\mathrm{A\\,m^{2}}$",
"$0.5\\ \\mathrm{A\\,m^{2}}$"
],
"ans": 3,
"c": "Magnetic moment ka matlab hai magnet ki \"strength\" ka measure: $m=(\\text{pole strength})\\times(\\text{poles ke beech distance})$, yani $m=q_m\\cdot 2l$. Isko do tarah se badla ja sakta hai — pole strength badalkar, ya length badalkar. Cutting ka direction decide karta hai ki kaunsi cheez badlegi.",
"m": "Sabse pehle ye sochna hai ki cut kis side se hai. \"Along its length\" ka matlab cut length ke parallel hai — magnet lambai ke saath do patli pattiyon mein bant jaata hai. Aisi cutting se har naye piece ki length same rehti hai, par area aadha hone se har naya pole aadha strong ho jaata hai. Isliye pole strength par focus karo, length par nahi.",
"s": [
"Original magnetic moment: $m=q_m\\times L$, jahan $q_m$ pole strength aur $L$ poles ke beech ki doori hai.",
"Length ke parallel cut karne par: nayi length $L' = L$ (same), aur pole ka area aadha hone se nayi pole strength $q_m' = q_m/2$.",
"Naya magnetic moment: $m' = q_m'\\times L' = \\dfrac{q_m}{2}\\times L = \\dfrac{1}{2}(q_m L)$.",
"To $m' = \\dfrac{m}{2}$ — har part ka magnetic moment aadha.",
"Value daalo: $m' = \\dfrac{1.0}{2} = 0.5\\ \\mathrm{A\\,m^{2}}$.",
"Answer option (D) $\\mathbf{0.5\\ A\\,m^{2}}$ hai."
],
"r": [
"$0.25$ tab aata hai jab aap ek saath dono (length aur pole strength) aadha kar dein — double counting.",
"$0.4$ kisi bhi standard cutting rule se nahi aata; ye sirf galat arithmetic se banta hai (jaise $1.0\\times0.4$).",
"$0.45$ bhi arbitrary hai — cutting se magnetic moment aadha ya double hota hai, $0.45$ guna nahi.",
"Sahi — longitudinal cut se pole strength aadhi, isliye $m$ aadha = $0.5\\ \\mathrm{A\\,m^{2}}$."
],
"w": [
"Length ke perpendicular cut (transverse) mein ulta hota hai: dono naye magnet ki pole strength same, length aadhi, isliye $m'=m/2$ — wahan bhi aadha, par reason alag hai.",
"Pole strength $\\times$ length ko ek saath badalna mat; pehle decide karo ki cut kis axis ke along hai."
],
"t": "Rule of thumb: transverse cut (chhoti lambai) → pole strength same, $L$ halves → $m$ halves. Longitudinal cut (lambai ke along) → $L$ same, area (pole) halves → $m$ halves. Dono mein $m$ aadha, par wajah alag — exam isi wajah par options rakh deta hai.",
"sim": null
},
{
"id": 3,
"ch": "Magnetism & matter",
"q": "A paramagnetic material with susceptibility $\\chi = 6\\times10^{-4}$ is placed in a magnetic field $H = 1500\\ \\mathrm{A\\,m^{-1}}$. Its magnetization $M$ is:\"”",
"fig": "",
"opt": [
"$0.7\\ \\mathrm{A\\,m^{-1}}$",
"$0.9\\ \\mathrm{A\\,m^{-1}}$",
"$1.1\\ \\mathrm{A\\,m^{-1}}$",
"$1.3\\ \\mathrm{A\\,m^{-1}}$"
],
"ans": 1,
"c": "Magnetization $M$ batata hai ki material ke andar kitne magnetic dipole \"align\" ho gaye, per unit volume. Paramagnetic material ke liye $M$, applied field $H$ ke seedha proportional hota hai: $M=\\chi H$. Yahan $\\chi$ ek pure number hai (koi unit nahi), aur $H$ ka unit $\\mathrm{A\\,m^{-1}}$ hai — isliye $M$ ka unit bhi $\\mathrm{A\\,m^{-1}}$ aata hai.",
"m": "Ek hi formula $M=\\chi H$ use karo. Alternatives jaise $B=\\mu_0(H+M)$ tab use karte hain jab $B$ poocha ho. Yahan sawaal seedha $M$ maang raha hai, isliye $\\mu_0$ ki zaroorat hi nahi — ye common trap hai.",
"s": [
"Formula: $M=\\chi H$.",
"$\\chi$ aur $H$ ki values likho: $\\chi=6\\times10^{-4}$, $H=1500=1.5\\times10^{3}\\ \\mathrm{A\\,m^{-1}}$.",
"Multiply: $M=(6\\times10^{-4})\\times(1.5\\times10^{3})$.",
"Pehle numbers: $6\\times1.5=9$. Phir powers: $10^{-4}\\times10^{3}=10^{-1}$.",
"To $M=9\\times10^{-1}=0.9\\ \\mathrm{A\\,m^{-1}}$.",
"Answer option (B) hai."
],
"r": [
"$0.7$ galat hai — ye $H$ ko galti se $1200$ lene par ya powers ka error karne par aata hai.",
"Sahi — $M=\\chi H=0.9\\ \\mathrm{A\\,m^{-1}}$.",
"$1.1$ tab aata hai jab $10^{-4}\\times10^{3}$ ko $10^{0}$ samajh liya jaaye ($6\\times1.5\\times\\ldots$ ka rounding error).",
"$1.3$ bina kisi valid calculation ke hai; powers ko add karne ki jagah subtract na karna iska source hai."
],
"w": [
"$\\chi$ unitless hota hai — agar options mein $\\mathrm{A\\,m^{-1}}$ na ho to samajh lo kuch galat hai.",
"$H$ ko SI mein hi rakho ($\\mathrm{A\\,m^{-1}}$); kOe ya Oe mein convert karne ki zaroorat nahi."
],
"t": "Paramagnetic ke liye $\\chi$ chhota positive ($\\sim10^{-5}$–$10^{-3}$) hota hai, ferromagnetic ke liye bahut bada ($\\sim10^{3}$), diamagnetic ke liye chhota negative. Agar $\\chi$ ka sign negative mile to material diamagnetic hai — uske liye bhi $M=\\chi H$ hi chalta hai.",
"sim": {
"title": "Magnetization vs susceptibility and field",
"hint": "Dono sliders ghumao; M dono ke product jitna badhta hai.",
"consts": {},
"vars": [
{
"k": "chi",
"label": "Susceptibility χ (×10⁻⁴)",
"min": 0,
"max": 20,
"step": 0.5,
"val": 6

"fig": "<svg viewBox=\"0 0 460 180\" width=\"100%\" height=\"180\" role=\"img\" aria-label=\"car decelerating\"><rect width=\"460\" height=\"180\" fill=\"#0f1217\"/>\n<line x1=\"30\" y1=\"130\" x2=\"430\" y2=\"130\" stroke=\"#3a4152\" stroke-width=\"2\"/>\n<rect x=\"40\" y=\"95\" width=\"58\" height=\"26\" rx=\"6\" fill=\"#3b4a63\" stroke=\"#9aa3b2\"/>\n<text x=\"40\" y=\"85\" fill=\"#9aa3b2\" font-size=\"12\">u = 54 km/h<\/text>\n<circle cx=\"250\" cy=\"110\" r=\"6\" fill=\"#3fae74\"/><text x=\"230\" y=\"90\" fill=\"#3fae74\" font-size=\"12\">v = 0<\/text>\n<line x1=\"255\" y1=\"122\" x2=\"410\" y2=\"122\" stroke=\"#6f9fe0\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<text x=\"270\" y=\"150\" fill=\"#6f9fe0\" font-size=\"12\">last 5 s → 37.5 m<\/text><\/svg>",

"ans": 0,
"c": "Uniform acceleration (ya deceleration) ka matlab hai acceleration constant. Aise motion ke teen equations hote hain: $v=u+at$, $s=ut+\\frac12at^{2}$, $v^{2}=u^{2}+2as$. Trick ye hai ki \"last 5 s\" ka matlab: us interval ka final velocity zero hai — isliye us interval ko ulta chala kar dekho, jaise car ne $37.5\\ \\mathrm{m}$ se start karke $0$ se $v$ tak accelerate kiya ho.",

<script>
/* ===================== ENGINE ===================== */
const LS_KEY = 'mcq_all_v1';
const N = DATA.length;
const LETTERS = ['A','B','C','D'];
let ST = {ans:{}, cur:0, submitted:false, review:false};

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(ST)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(o && typeof o === 'object'){
      ST.ans = {};
      if(o.ans && typeof o.ans === 'object'){
        Object.keys(o.ans).forEach(function(k){ const n = parseInt(k,10); if(!isNaN(n)) ST.ans[n] = o.ans[k]; });
      }
      ST.cur = (typeof o.cur === 'number' && o.cur >= 0 && o.cur < N) ? o.cur : 0;
      ST.submitted = !!o.submitted;
      ST.review = !!o.review;
    }
  }catch(e){}
}

/* ---------- math rendering (KaTeX + graceful fallback) ---------- */
const HAS_KATEX = !!(window.katex && window.renderMathInElement);

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const SYM = {
  '\\times':'×','\\cdot':'·','\\div':'÷','\\pm':'±','\\mp':'∓','\\pi':'π','\\theta':'θ','\\alpha':'α','\\beta':'β',
  '\\gamma':'γ','\\delta':'δ','\\Delta':'Δ','\\epsilon':'ε','\\varepsilon':'ε','\\mu':'μ','\\rho':'ρ','\\sigma':'σ',
  '\\omega':'ω','\\Omega':'Ω','\\lambda':'λ','\\Lambda':'Λ','\\phi':'φ','\\varphi':'φ','\\chi':'χ','\\tau':'τ','\\eta':'η',
  '\\nu':'ν','\\infty':'∞','\\le':'≤','\\leq':'≤','\\ge':'≥','\\geq':'≥','\\ne':'≠','\\neq':'≠','\\approx':'≈',
  '\\rightarrow':'→','\\to':'→','\\leftarrow':'←','\\Rightarrow':'⇒','\\longrightarrow':'⟶','\\iff':'⇔',
  '\\rightleftharpoons':'⇌','\\degree':'°','\\circ':'°','\\angle':'∠','\\perp':'⊥','\\parallel':'∥','\\sqrt':'√',
  '\\sum':'Σ','\\int':'∫','\\partial':'∂','\\ldots':'…','\\dots':'…','\\equiv':'≡','\\propto':'∝','\\prime':'′',
  '\\%':'%','\\#':'#','\\&':'&','\\_':'_','\\{':'{','\\}':'}','\\ln':'ln','\\log':'log','\\sin':'sin','\\cos':'cos',
  '\\tan':'tan','\\cot':'cot','\\sec':'sec','\\csc':'csc','\\max':'max','\\min':'min','\\lim':'lim',
  '\\,'  :' ','\\;':' ','\\:':' ','\\ ':' ','\\quad':'  ','\\qquad':'   ','\\!':'','\\left':'','\\right':'',
  '\\displaystyle':'','\\textstyle':'','\\hat':'','\\vec':'','\\bar':'','\\overline':''
};

function chemFmt(s){
  s = s.replace(/\s*->\s*/g,' → ').replace(/\s*<=>\s*/g,' ⇌ ').replace(/\s*<->\s*/g,' ⇌ ');
  // charges written like ^{3+} already handled by sup; handle trailing digits after letters / ) / ]
  s = s.replace(/([A-Za-z\)\]])(\d+)/g, '$1<sub>$2</sub>');
  return s;
}

function supSub(s){
  s = s.replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>');
  s = s.replace(/\_\{([^{}]*)\}/g,'<sub>$1</sub>');
  s = s.replace(/\^([A-Za-z0-9+\-])/g,'<sup>$1</sup>');
  s = s.replace(/\_([A-Za-z0-9+\-])/g,'<sub>$1</sub>');
  return s;
}

function texToHtml(tex){
  let s = String(tex);
  s = s.replace(/\\ce\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g, function(_,inner){
    return '\u0001'+inner+'\u0001';
  });
  s = s.replace(/\\[dtc]?frac\{([^{}]*)\}\{([^{}]*)\}/g, function(_,a,b){
    return '<span class="fb-frac"><span class="n">'+texToHtml(a)+'</span><span class="d">'+texToHtml(b)+'</span></span>';
  });
  s = s.replace(/\\sqrt\{([^{}]*)\}/g, function(_,a){
    return '√<span style="border-top:1px solid currentColor;padding:0 2px">'+texToHtml(a)+'</span>';
  });
  s = s.replace(/\\(?:mathrm|mathbf|mathit|mathsf|text|textrm|textit|operatorname|ce|pu|boldsymbol|mathbb)\s*/g,'');
  s = supSub(s);
  s = s.replace(/\\[A-Za-z]+/g, function(m){ return (SYM[m] !== undefined) ? SYM[m] : ''; });
  s = s.replace(/[{}]/g,'');
  s = s.replace(/\u0001([^\u0001]*)\u0001/g, function(_,inner){ return chemFmt(esc(inner)); });
  return s;
}

function fallbackMath(root){
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(function(node){
    const t = node.nodeValue;
    if(t.indexOf('$') === -1) return;
    const parts = t.split(/\$([^$]+)\$/);
    if(parts.length === 1) return;
    let html = '';
    for(let i=0;i<parts.length;i++){
      if(i % 2 === 1){ html += '<span class="fbmath">'+texToHtml(parts[i])+'</span>'; }
      else { html += esc(parts[i]); }
    }
    const span = document.createElement('span');
    span.innerHTML = html;
    node.parentNode.replaceChild(span, node);
  });
}

function renderMath(root){
  if(!root) return;
  if(HAS_KATEX){
    try{
      window.renderMathInElement(root, {
        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError:false, strict:false, trust:false
      });
      return;
    }catch(e){}
  }
  fallbackMath(root);
}

/* ---------- helpers ---------- */
function fmtNum(v, dp){
  if(!isFinite(v)) return '—';
  const a = Math.abs(v);
  if(a !== 0 && (a < 0.001 || a >= 100000)){
    let e = Math.floor(Math.log10(a));
    let mant = v / Math.pow(10,e);
    return '$'+mant.toFixed(2)+'\\times 10^{'+e+'}$';
  }
  return String(parseFloat(v.toFixed(dp === undefined ? 3 : dp)));
}
function optLetter(i){ return LETTERS[i]; }
function C(s){ return String(s == null ? '' : s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function CO(s){ s = String(s == null ? '' : s); return /^\s*<svg/i.test(s) ? s : C(s); }

/* ---------- stats ---------- */
function stats(){
  let ok=0, no=0, att=0;
  DATA.forEach(function(q){
    const a = ST.ans[q.id];
    if(a === undefined || a === null || a === -1) return;
    att++;
    if(a === q.ans) ok++; else no++;
  });
  return {ok:ok, no:no, att:att, left:N-att, score: ok*4 - no};
}

function updateHUD(){
  const s = stats();
  document.getElementById('scoreNow').textContent = s.score;
  document.getElementById('scoreMax').textContent = 4*N;
  document.getElementById('cntOk').textContent = s.ok;
  document.getElementById('cntNo').textContent = s.no;
  document.getElementById('cntLeft').textContent = s.left;
  document.getElementById('bar').style.width = (100*s.att/N).toFixed(2)+'%';
}

/* ---------- simulators ---------- */
function makeSim(sim){
  const box = document.createElement('div');
  box.className = 'simbox';
  const h = document.createElement('h3');
  h.textContent = 'Live simulation · ' + (sim.title || '');
  box.appendChild(h);
  if(sim.hint){ const p=document.createElement('p'); p.className='hint'; p.innerHTML = sim.hint; box.appendChild(p); renderMath(p); }

  const vals = {};
  (sim.vars||[]).forEach(function(v){ vals[v.k] = v.val; });
  const consts = sim.consts || {};

  (sim.vars||[]).forEach(function(v){
    const row = document.createElement('div'); row.className='simrow';
    const lab = document.createElement('label');
    const nm = document.createElement('span'); nm.textContent = v.label;
    const vv = document.createElement('span'); vv.className='val';
    lab.appendChild(nm); lab.appendChild(vv); row.appendChild(lab);
    const inp = document.createElement('input');
    inp.type='range'; inp.min=v.min; inp.max=v.max; inp.step=v.step||0.1; inp.value=v.val;
    inp.addEventListener('input', function(){
      vals[v.k] = parseFloat(inp.value);
      draw(vals);
    });
    row.appendChild(inp);
    box.appendChild(row);
    v._el = vv;
  });

  let svgHost = null;
  if(sim.plot){ svgHost = document.createElement('div'); svgHost.className='figwrap'; box.appendChild(svgHost); }
  const outHost = document.createElement('div'); outHost.className='simout'; box.appendChild(outHost);
  if(sim.note){ const p=document.createElement('p'); p.className='simnote'; p.innerHTML = sim.note; box.appendChild(p); renderMath(p); }

  function ev(expr, v){
    try{
      const keys = Object.keys(consts).concat(Object.keys(v));
      const args = keys.map(function(k){ return (k in v) ? v[k] : consts[k]; });
      return (new Function(keys.join(','), 'return ('+expr+');')).apply(null, args);
    }catch(e){ return NaN; }
  }

  function draw(v){
    (sim.vars||[]).forEach(function(vr){
      if(vr._el) vr._el.textContent = (vr.fmt ? vr.fmt(vr.k in v ? v[vr.k] : 0) : String(v[vr.k]));
    });
    let html = '';
    (sim.outs||[]).forEach(function(o){
      const val = ev(o.expr, v);
      html += '<div class="outbox"><span class="lb">'+o.label+'</span><span class="ov">'
        + (o.tex ? texToHtml(o.tex) : fmtNum(val, o.dp)) + (o.unit ? ' '+o.unit : '') + '</span></div>';
    });
    outHost.innerHTML = html;
    renderMath(outHost);
    if(svgHost) drawPlot(sim.plot, svgHost, v, consts, ev);
  }
  draw(vals);
  return box;
}

function drawPlot(kind, host, v, consts, ev){
  const W = 460, H = 240;
  if(kind === 'circle'){
    const cx = W/2, cy = H/2;
    const rcm = v.r || 3;
    const R = Math.max(12, Math.min(95, rcm*9));
    host.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="240" role="img" aria-label="circular path">'
     + '<rect width="'+W+'" height="'+H+'" fill="#0f1217"/>'
     + '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#6f9fe0" stroke-width="2" stroke-dasharray="6 5"/>'
     + '<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#c9a227"/>'
     + '<circle cx="'+(cx+R)+'" cy="'+cy+'" r="7" fill="#e0e4ea"/>'
     + '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'" stroke="#3fae74" stroke-width="1.6"/>'
     + '<text x="'+(cx+R/2)+'" y="'+(cy-8)+'" fill="#3fae74" font-size="13" text-anchor="middle">r</text>'
     + '<text x="'+cx+'" y="'+(cy+24)+'" fill="#9aa3b2" font-size="12" text-anchor="middle">B into page</text>'
     + '</svg>';
    return;
  }
  if(kind === 'projectile'){
    const u = v.u || 10, th = (v.th || 30) * Math.PI/180, g = 10;
    const R = u*u*Math.sin(2*th)/g, Hm = u*u*Math.sin(th)*Math.sin(th)/(2*g);
    const sx = 40, sy = H-30, sw = W-70, sh = H-60;
    const pts = [];
    for(let i=0;i<=60;i++){
      const t = i/60, x = R*t, y = (u*Math.sin(th))*(t*R/u) - 0.5*g*Math.pow(t*R/u,2);
      const px = sx + (x/(R||1))*sw, py = sy - (Math.max(0,y)/(Hm||1))*sh*0.92;
      pts.push(px.toFixed(1)+','+py.toFixed(1));
    }
    host.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="240" role="img" aria-label="projectile path">'
      + '<rect width="'+W+'" height="'+H+'" fill="#0f1217"/>'
      + '<line x1="'+sx+'" y1="'+sy+'" x2="'+(sx+sw)+'" y2="'+sy+'" stroke="#3a4152" stroke-width="1.5"/>'
      + '<line x1="'+sx+'" y1="'+sy+'" x2="'+sx+'" y2="'+(sy-sh)+'" stroke="#3a4152" stroke-width="1.5"/>'
      + '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#6f9fe0" stroke-width="2.2"/>'
      + '<line x1="'+(sx+sw)+'" y1="'+sy+'" x2="'+(sx+sw)+'" y2="'+sy+'" stroke="#3fae74"/>'
      + '<text x="'+(sx+sw-30)+'" y="'+(sy-8)+'" fill="#3fae74" font-size="13">R = '+R.toFixed(2)+' m</text>'
      + '<text x="'+(sx+6)+'" y="'+(sy-sh-4)+'" fill="#9aa3b2" font-size="12">H = '+Hm.toFixed(2)+' m</text>'
      + '</svg>';
    return;
  }
  if(kind === 'fringe'){
    const beta = v.beta || 5;
    const n = 9, sp = Math.max(6, Math.min(40, beta*4));
    let bars = '';
    for(let i=0;i<n;i++){
      bars += '<rect x="'+(60+i*sp)+'" y="40" width="'+(sp*0.55)+'" height="140" fill="#6f9fe0" opacity="0.85"/>';
    }
    host.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="240" role="img" aria-label="fringe pattern">'
      + '<rect width="'+W+'" height="'+H+'" fill="#0f1217"/>'
      + bars
      + '<text x="60" y="30" fill="#9aa3b2" font-size="12">dark</text>'
      + '<text x="'+(60+sp)+'" y="30" fill="#9aa3b2" font-size="12">bright</text>'
      + '<text x="60" y="210" fill="#3fae74" font-size="13">fringe width β ∝ gap shown; numeric value in the boxes</text>'
      + '</svg>';
    return;
  }
  host.innerHTML = '';
}

/* ---------- question rendering ---------- */
function renderCurrent(){
  const q = DATA[ST.cur];
  const chosen = ST.ans[q.id];
  const answered = (chosen !== undefined && chosen !== null && chosen !== -1);
  const showAns = answered || ST.submitted || ST.review;
  const card = document.getElementById('qcard');

  let html = '';
  html += '<div class="qhead"><div class="qnum">Q'+q.id+' <span style="color:#9aa3b2;font-weight:400">/ '+N+'</span></div>';
  html += '<div class="tags"><span class="tag">'+(q.ch||'General')+'</span>';
  html += '<span class="tag">'+(q.id<=45?'Physics':(q.id<=90?'Chemistry':'Biology'))+'</span>';
  html += '<span class="tag">+4 / −1 / 0</span></div></div>';
  html += '<div class="qtext" id="qtext">'+C(q.q)+'</div>';
  if(q.fig){ html += '<div class="figwrap" id="figbox">'+q.fig+'</div>'; }
  html += '<div class="opts" id="opts">';
  q.opt.forEach(function(o,i){
    let cls = 'opt';
    if(showAns){
      cls += ' locked';
      if(i === q.ans) cls += ' correct';
      else if(answered && i === chosen) cls += ' wrong';
      else cls += ' dim';
    }
    html += '<button class="'+cls+'" data-i="'+i+'" '+(showAns?'disabled':'')+'>'
      + '<span class="key">'+LETTERS[i]+'</span><span class="body">'+CO(o)+'</span></button>';
  });
  html += '</div>';

  if(answered && !ST.review){
    html += '<div class="verdict '+(chosen === q.ans ? 'ok' : 'no')+'">'
      + (chosen === q.ans ? 'Sahi jawab!' : 'Galat jawab')
      + ' <span style="color:#9aa3b2;font-weight:400">· Sahi option '+LETTERS[q.ans]+' hai</span></div>';
  }
  if(showAns){
    if(!answered){ html += '<div class="verdict" style="color:#9aa3b2">Is question par attempt nahi kiya · Sahi option ('+LETTERS[q.ans]+')</div>'; }
    html += '<div class="explain" id="explain">'+explainHTML(q)+'</div>';
  }

  card.innerHTML = html;
  renderMath(card);

  if(!showAns){
    const opts = card.querySelectorAll('.opt');
    opts.forEach(function(b){
      b.addEventListener('click', function(){ pick(parseInt(b.getAttribute('data-i'),10)); });
    });
  }

  if(q.sim){
    const holder = document.createElement('div');
    holder.appendChild(makeSim(q.sim));
    card.appendChild(holder);
  }

  document.getElementById('btnPrev').disabled = (ST.cur === 0);
  document.getElementById('btnNext').disabled = (ST.cur === N-1);
  updateHUD();
  renderGrid();
  if(ST.submitted) renderResultsBar();
}

function explainHTML(q){
  let h = '';
  h += '<h3>1 · Concept (zero se)</h3><p>'+C(q.c)+'</p>';
  h += '<h3>2 · Kaunsa method aur kyun</h3><p>'+C(q.m)+'</p>';
  h += '<h3>3 · Step-by-step</h3><ol>';
  q.s.forEach(function(st){ h += '<li>'+C(st)+'</li>'; });
  h += '</ol>';
  if(q.simbox){ h += '<p>'+C(q.simbox)+'</p>'; }
  h += '<h3>4 · Final answer</h3><div class="ansline"><b>Option ('+LETTERS[q.ans]+')</b> — '+(/^\s*<svg/i.test(q.opt[q.ans]) ? '(diagram option)' : C(q.opt[q.ans]))+'</div>';
  h += '<h3>5 · Baaki options kyun galat</h3><ul class="why">';
  q.r.forEach(function(r,i){
    const ok = (i === q.ans);
    h += '<li class="'+(ok?'li-ok':'li-no')+'"><b>('+LETTERS[i]+')</b> '+C(r)+'</li>';
  });
  h += '</ul>';
  if(q.w && q.w.length){
    h += '<h3>6 · Common traps</h3><ul>';
    q.w.forEach(function(x){ h += '<li>'+C(x)+'</li>'; });
    h += '</ul>';
  }
  if(q.t){ h += '<h3>7 · Tip</h3><p>'+C(q.t)+'</p>'; }
  return h;
}

function pick(i){
  const q = DATA[ST.cur];
  if(ST.ans[q.id] !== undefined && ST.ans[q.id] !== null && ST.ans[q.id] !== -1) return;
  ST.ans[q.id] = i;
  save();
  renderCurrent();
}

function goTo(n){
  if(n < 0 || n >= N) return;
  ST.cur = n; save(); renderCurrent();
  try{
    if(window.scrollTo) window.scrollTo({top:0, behavior:'smooth'});
    const c = document.getElementById('qcard');
    if(c && c.scrollIntoView) c.scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){}
}

/* ---------- grid ---------- */
let gridFilter = 'all';
function renderGrid(){
  const g = document.getElementById('grid');
  if(!g) return;
  let html = '';
  DATA.forEach(function(q,idx){
    const a = ST.ans[q.id];
    const answered = (a !== undefined && a !== null && a !== -1);
    if(gridFilter === 'answered' && !answered) return;
    if(gridFilter === 'unanswered' && answered) return;
    let cls = 'gbtn';
    if(idx === ST.cur) cls += ' cur';
    if(answered){
      if(ST.submitted || ST.review){ cls += (a === q.ans ? ' ans-ok' : ' ans-no'); }
      else { cls += ' done'; }
    }
    html += '<button class="'+cls+'" data-idx="'+idx+'">'+q.id+'</button>';
  });
  g.innerHTML = html;
  g.querySelectorAll('.gbtn').forEach(function(b){
    b.addEventListener('click', function(){ goTo(parseInt(b.getAttribute('data-idx'),10)); });
  });
}

/* ---------- results ---------- */
function renderResults(){
  const s = stats();
  const acc = s.att ? (100*s.ok/s.att).toFixed(1) : '0.0';
  const v = document.getElementById('resultView');
  let h = '';
  h += '<div class="card">';
  h += '<h2 style="margin:0 0 4px;font-size:18px">Result — NEET UG 2027 Sample Paper 3</h2>';
  h += '<p style="color:#9aa3b2;margin:0 0 12px">Marking: +4 correct, −1 wrong, 0 unattempted. Maximum marks '+4*N+'.</p>';
  h += '<div class="big">'+s.score+' / '+(4*N)+'</div>';
  h += '<div class="stats">';
  h += '<div class="stat"><div class="k">Correct</div><div class="v" style="color:#3fae74">'+s.ok+'</div></div>';
  h += '<div class="stat"><div class="k">Wrong</div><div class="v" style="color:#c9564f">'+s.no+'</div></div>';
  h += '<div class="stat"><div class="k">Unattempted</div><div class="v">'+s.left+'</div></div>';
  h += '<div class="stat"><div class="k">Accuracy</div><div class="v">'+acc+'%</div></div>';
  h += '<div class="stat"><div class="k">Attempted</div><div class="v">'+s.att+' / '+N+'</div></div>';
  h += '</div>';
  h += '<div class="nav"><button class="btn primary" id="btnReview">Review all answers</button>';
  h += '<button class="btn" id="btnRestart">Restart</button></div>';
  h += '</div>';
  v.innerHTML = h;
  v.hidden = false;
  document.getElementById('quizView').hidden = true;
  document.getElementById('btnReview').addEventListener('click', function(){
    ST.review = true; ST.cur = 0; save();
    v.hidden = true; document.getElementById('quizView').hidden = false;
    renderCurrent();
  });
  document.getElementById('btnRestart').addEventListener('click', function(){
    if(confirm('Restart karein? Saare answers aur score mit jayenge.')){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      ST = {ans:{}, cur:0, submitted:false, review:false};
      save();
      v.hidden = true; document.getElementById('quizView').hidden = false;
      renderCurrent();
    }
  });
}
function renderResultsBar(){
  // after submit while reviewing, show a small bar with score + restart route
  let el = document.getElementById('resbar');
  if(!el){
    el = document.createElement('div');
    el.id = 'resbar'; el.className = 'gridpanel';
    document.getElementById('quizView').appendChild(el);
  }
  const s = stats();
  el.innerHTML = '<h2>Test submitted · Score <b>'+s.score+' / '+(4*N)+'</b> · Correct '+s.ok+' · Wrong '+s.no+' · Left '+s.left
    + '</h2><div class="nav"><button class="btn primary" id="btnRes2">Result page</button>'
    + '<button class="btn" id="btnRestart2">Restart</button></div>';
  document.getElementById('btnRes2').addEventListener('click', function(){ renderResults(); });
  document.getElementById('btnRestart2').addEventListener('click', function(){
    if(confirm('Restart karein? Saare answers aur score mit jayenge.')){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      ST = {ans:{}, cur:0, submitted:false, review:false}; save();
      el.remove(); renderCurrent();
    }
  });
}

/* ---------- wiring ---------- */
document.getElementById('btnPrev').addEventListener('click', function(){ goTo(ST.cur-1); });
document.getElementById('btnNext').addEventListener('click', function(){ goTo(ST.cur+1); });
document.getElementById('btnSkip').addEventListener('click', function(){ if(ST.cur < N-1) goTo(ST.cur+1); });
document.getElementById('btnSubmit').addEventListener('click', function(){
  if(ST.submitted){ renderResults(); return; }
  const s = stats();
  if(confirm('Submit test? Attempted: '+s.att+' / '+N+'. Unattempted par 0 marks milenge.')){
    ST.submitted = true; save(); renderResults();
  }
});
document.getElementById('filterSel').addEventListener('change', function(e){ gridFilter = e.target.value; renderGrid(); });
document.getElementById('btnGoto').addEventListener('click', function(){
  const val = parseInt(document.getElementById('gotoInput').value,10);
  if(!isNaN(val) && val >= 1 && val <= N) goTo(val-1);
});
document.getElementById('gotoInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('btnGoto').click();
});
document.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') { document.getElementById('btnNext').click(); }
  if(e.key === 'ArrowLeft') { document.getElementById('btnPrev').click(); }
});

/* ---------- boot ---------- */
load();
renderCurrent();
if(ST.submitted) renderResults();
</script>
