: total 2× se 4× ke beech.","R true: linear + quadratic mix.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason hi range ka kaaran hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Mixed proportionality (linear + quadratic) se total 2× aur 4× ke beech hota hai.","w":"","fig":null,"sim":null},{"id":194,"q":"Assertion: When the velocity of a body moving along a straight line is zero, its acceleration must also be zero at that instant.\nReason: The acceleration of a body is the rate of change of its velocity with respect to time.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":3,"c":"v = 0 par a ≠ 0 ho sakta hai (highest point). Par reason — acceleration = dv/dt — sach hai.","m":"Assertion galat hai kyunki counter-example maujood hai.","s":["A false: highest point par v = 0, a = g.","R true: definition sahi hai.","False assertion + true reason → option (D)."],"r":{"0":"Assertion galat hai.","1":"Assertion galat hai, isliye ye bhi galat.","2":"Reason sach hai."},"t":"Assertion me 'must' dikhe to counter-example dhundo — highest point wala example hamesha kaam karta hai.","w":"","fig":null,"sim":null},{"id":195,"q":"The velocity-time graph of a car is as follows: from t = 0 to t = $5\\ \\mathrm{s}$ the velocity increases uniformly from 0 to $15\\ \\mathrm{m\\,s^{-1}}$; from t = $5\\ \\mathrm{s}$ to t = $15\\ \\mathrm{s}$ the velocity remains constant at $15\\ \\mathrm{m\\,s^{-1}}$; from t = $15\\ \\mathrm{s}$ to t = $20\\ \\mathrm{s}$ the velocity decreases uniformly from $15\\ \\mathrm{m\\,s^{-1}}$ to 0. The total distance travelled by the car in $20\\ \\mathrm{s}$ is:","opt":["$225\\ \\mathrm{m}$","$300\\ \\mathrm{m}$","$175\\ \\mathrm{m}$","$200\\ \\mathrm{m}$"],"ans":0,"c":"v–t graph ka area = distance: triangle + rectangle + triangle.","m":"Teen areas alag nikaalo.","s":["0–$5\\ \\mathrm{s}$: $\\tfrac12\\times5\\times15=37.5$ m.","5–$15\\ \\mathrm{s}$: $10\\times15=150$ m.","15–$20\\ \\mathrm{s}$: $\\tfrac12\\times5\\times15=37.5$ m.","Total $=225$ m → option (A)."],"r":{"2":"Rectangle ka hissa chhota le liya ($5\\ \\mathrm{s}$ ki jagah).","3":"200 aata hai jab rectangle $10\\ \\mathrm{s}$ na le kar $8.33\\ \\mathrm{s}$ jaisa galat ho.","1":"Poore $20\\ \\mathrm{s}$ ko 15 se multiply kar diya (300)."},"t":"Rectangular part ki width dhyan se nikalo: 15 − 5 = $10\\ \\mathrm{s}$.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,0],[5,15],[15,15],[20,0]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":196,"q":"The position-time graph of a particle is as follows: from t = 0 to t = $4\\ \\mathrm{s}$ the position increases uniformly from x = 0 to x = $24\\ \\mathrm{m}$; from t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ the graph is horizontal at x = $24\\ \\mathrm{m}$; from t = $6\\ \\mathrm{s}$ to t = $10\\ \\mathrm{s}$ the position decreases uniformly from x = $24\\ \\mathrm{m}$ to x = 0. For the whole journey from t = 0 to t = $10\\ \\mathrm{s}$, which one of the following is correct?","opt":["Both the average velocity and the average speed are zero.","Both the average velocity and the average speed are $2.4\\ \\mathrm{m\\,s^{-1}}$.","The average velocity is zero and the average speed is $4.8\\ \\mathrm{m\\,s^{-1}}$.","The average velocity is $4.8\\ \\mathrm{m\\,s^{-1}}$ and the average speed is zero."],"ans":2,"c":"Displacement = final − initial = 0 − 0 = 0. Distance = 24 + 24 = $48\\ \\mathrm{m}$.","m":"Dono quantities ke numerator alag hain — displacement aur distance.","s":["Average velocity $=0/10=0$.","Average speed $=48/10=4.8$ $\\mathrm{m\\,s^{-1}}$.","Isliye option (C)."],"r":{"3":"Values ulat gayi — average velocity zero hai.","0":"Average speed zero nahi, 4.8 hai.","1":"Dono 2.4 nahi hain; average velocity 0 hai."},"t":"x–t graph me displacement = last − first position; distance = saare segments ke |changes| ka sum.","w":"","fig":{"t":"g","kind":"xt","pts":[[0,0],[4,24],[6,24],[10,0]],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":197,"q":"The velocity of a body moving along a straight line is recorded at equal intervals of $1\\ \\mathrm{s}$ in the following data table. Assuming the velocity to vary uniformly between the recorded instants, the displacement of the body during the interval t = 0 to t = $4\\ \\mathrm{s}$ is:","opt":["$65\\ \\mathrm{m}$","$70\\ \\mathrm{m}$","$75\\ \\mathrm{m}$","$60\\ \\mathrm{m}$"],"ans":0,"c":"Har $1\\ \\mathrm{s}$ ke interval ka area trapezium hai; total = successive average velocities ka sum.","m":"Har interval ka ($v_{1}$ + $v_{2}$)/2 × 1 nikalo aur jodo.","s":["0–$1\\ \\mathrm{s}$: (10 + 15)/2 = $12.5\\ \\mathrm{m}$.","1–$2\\ \\mathrm{s}$: (15 + 20)/2 = $17.5\\ \\mathrm{m}$; 2–$3\\ \\mathrm{s}$: (20 + 20)/2 = $20\\ \\mathrm{m}$; 3–$4\\ \\mathrm{s}$: (20 + 10)/2 = $15\\ \\mathrm{m}$.","Total $=12.5+17.5+20+15=65$ m → option (A)."],"r":{"3":"Kuch intervals mein 10 se multiply jaisi galti.","1":"Aakhri interval ko 20 se multiply kar diya (rectangular maan liya).","2":"Sab intervals me maximum velocity maan li."},"t":"Trapezium rule: har interval ka average velocity × interval width.","w":"","fig":{"t":"tab","head":["t (s)","v ($\\mathrm{m\\,s^{-1}}$)"],"rows":[["0","10"],["1","15"],["2","20"],["3","20"],["4","10"]]},"sim":null},{"id":198,"q":"The acceleration-time graph of a body starting from rest is as follows: from t = 0 to t = $4\\ \\mathrm{s}$ a = +$3\\ \\mathrm{m\\,s^{-2}}$; from t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ a = 0; from t = $6\\ \\mathrm{s}$ to t = $9\\ \\mathrm{s}$ a = −$4\\ \\mathrm{m\\,s^{-2}}$. The total displacement of the body during the interval t = 0 to t = $9\\ \\mathrm{s}$ is:","opt":["$54\\ \\mathrm{m}$","$66\\ \\mathrm{m}$","$78\\ \\mathrm{m}$","$48\\ \\mathrm{m}$"],"ans":1,"c":"Pehle a–t area se velocity banao, phir har segment ka displacement nikalo.","m":"Teen segments: velocity 0 → 12 → 12 → 0, phir area se distance.","s":["0–$4\\ \\mathrm{s}$: v 0 se 12; $x_1=\\tfrac12(4)(12)=24$ m.","4–$6\\ \\mathrm{s}$: v = 12; $x_2=12\\times2=24$ m.","6–$9\\ \\mathrm{s}$: v 12 se 0; $x_3=\\tfrac12(3)(12)=18$ m.","Total $=24+24+18=66$ m → option (B)."],"r":{"3":"Sirf pehla segment liya.","0":"Aakhri segment chhod diya.","2":"Teesre segment me poora rectangle le liya."},"t":"a–t graph se velocity banaiye, phir v–t ka area displacement dega — do step ka method.","w":"","fig":{"t":"g","kind":"at","pts":[[0,3],[4,3],[4,0],[6,0],[6,-4],[9,-4]],"yl":"a (m s^{-2})","xl":"t (s)"},"sim":null},{"id":199,"q":"Two cars A and B start from the same point on a straight road at t = 0. Car A moves with a constant velocity of $10\\ \\mathrm{m\\,s^{-1}}$. Car B starts from rest and moves in the same direction with a constant acceleration of $2\\ \\mathrm{m\\,s^{-2}}$. The two cars are again at the same point after a time:","opt":["$5\\ \\mathrm{s}$","$8\\ \\mathrm{s}$","$10\\ \\mathrm{s}$","$20\\ \\mathrm{s}$"],"ans":2,"c":"Same point par milne ka matlab dono ka displacement barabar.","m":"$10t=\\tfrac12(2)t^2$ likho aur solve karo.","s":["$10t=t^2$.","$t(t-10)=0$.","$t=10$ s → option (C)."],"r":{"0":"$5\\ \\mathrm{s}$ par B ne $25\\ \\mathrm{m}$ aur A ne $50\\ \\mathrm{m}$ tay kiya — barabar nahi.","1":"$8\\ \\mathrm{s}$ par B $64\\ \\mathrm{m}$, A $80\\ \\mathrm{m}$ — barabar nahi.","3":"$20\\ \\mathrm{s}$ par B aage nikal chuki hogi ($400\\ \\mathrm{m}$ vs $200\\ \\mathrm{m}$)."},"t":"Milne ki condition: displacement barabar. Uske baad quadratic solve karo.","w":"","fig":{"t":"g","kind":"xt","series":[{"pts":[[0,0],[12,120]],"color":"#7fb2ee","name":"Car A"},{"pts":[[0,0],[6,36],[12,144]],"color":"#e0a33a","name":"Car B"}],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":200,"q":"The position of a body moving along a straight line is recorded in the following data table. The acceleration of the body is:","opt":["not uniform, since the velocity changes with time","$2\\ \\mathrm{m\\,s^{-2}}$ and uniform","$4\\ \\mathrm{m\\,s^{-2}}$ and uniform","$8\\ \\mathrm{m\\,s^{-2}}$ and uniform"],"ans":2,"c":"Table me x ∝ $t^{2}$ dikh raha hai (0, 2, 8, 18, 32) — yaani uniform acceleration.","m":"x/$t^{2}$ ratio check karo: sabhi rows me constant aayega to a uniform hai.","s":["$x/t^2$: 2, 2, 2, 2 → x = 2$t^{2}$.","$x=\\tfrac12at^2\\Rightarrow a=4$ $\\mathrm{m\\,s^{-2}}$.","Uniform hai → option (C)."],"r":{"1":"2 to x = 2$t^{2}$ ka coefficient hai; a = 2 × 2 = 4.","3":"8 aata hai agar x = 4$t^{2}$ maan lo.","0":"Velocity badalna hi uniform acceleration ka matlab hai; isliye ye statement galat."},"t":"Data table me x/$t^{2}$ constant → uniform acceleration. Ye trick bahut kaam aati hai.","w":"","fig":{"t":"tab","head":["t (s)","x (m)"],"rows":[["0","0"],["1","2"],["2","8"],["3","18"],["4","32"]]},"sim":null},{"id":201,"q":"A body covers the first half of the total distance of its journey along a straight line with a speed of $8\\ \\mathrm{m\\,s^{-1}}$ and the second half with a speed v. If the average speed of the body for the whole journey is $12\\ \\mathrm{m\\,s^{-1}}$, the value of v is:","opt":["$32\\ \\mathrm{m\\,s^{-1}}$","$16\\ \\mathrm{m\\,s^{-1}}$","$20\\ \\mathrm{m\\,s^{-1}}$","$24\\ \\mathrm{m\\,s^{-1}}$"],"ans":3,"c":"Equal distance par average speed $=\\dfrac{2v_1v_2}{v_1+v_2}$ hoti hai (simple average nahi).","m":"Formula likho, v ke liye solve karo.","s":["$12=\\dfrac{2\\times8\\times v}{8+v}$.","$12(8+v)=16v\\Rightarrow96+12v=16v$.","$4v=96\\Rightarrow v=24$ $\\mathrm{m\\,s^{-1}}$ → option (D)."],"r":{"1":"2 × 8 = 16 se aaya, par formula me v bhi hai.","2":"20 rakhne par average 11.4 aati hai, 12 nahi.","0":"32 rakhne par average 12.8 aati hai."},"t":"Answer ko wapas formula me daal kar check karo: 2(8)(24)/32 = 12 ✓.","w":"","fig":null,"sim":null},{"id":202,"q":"A particle starts from rest and moves along a straight line with an acceleration a = (4 − 2t) $\\mathrm{m\\,s^{-2}}$, where t is in second. The maximum velocity attained by the particle is:","opt":["$8\\ \\mathrm{m\\,s^{-1}}$","$2\\ \\mathrm{m\\,s^{-1}}$","$4\\ \\mathrm{m\\,s^{-1}}$","$6\\ \\mathrm{m\\,s^{-1}}$"],"ans":2,"c":"Maximum velocity tab hoti hai jab acceleration zero ho kar sign badle.","m":"a = 0 ka time nikalo, phir v = ∫a dt me daalo.","s":["$a=0\\Rightarrow4-2t=0\\Rightarrow t=2$ s.","$v=\\int_0^2(4-2t)\\,dt=\\left[4t-t^2\\right]_0^2$.","$v=8-4=4$ $\\mathrm{m\\,s^{-1}}$ → option (C)."],"r":{"1":"t = 1 par velocity $3\\ \\mathrm{m\\,s^{-1}}$ hoti hai.","3":"Integrate kiye bina 4 + 2 jaisa galat hisaab.","0":"Poora area 4 × 2 liya bina triangle kaatne ke."},"t":"Max velocity ke liye a = 0 karo, v = 0 nahi — ye distinction zaroori hai.","w":"","fig":null,"sim":null},{"id":203,"q":"A particle moves along the x-axis such that x = $t^{3}$ − 6$t^{2}$ + 9t. The distance travelled by the particle in the first $4\\ \\mathrm{s}$ is:","opt":["$8\\ \\mathrm{m}$","$12\\ \\mathrm{m}$","$16\\ \\mathrm{m}$","$4\\ \\mathrm{m}$"],"ans":1,"c":"Distance ke liye har reversal par position note karni padti hai, phir |changes| jodne hain.","m":"v = 0 ke roots nikalo (t = 1, 3), un par x ki values lo, phir segments jodo.","s":["$v=3t^2-12t+9=3(t-1)(t-3)$.","$x(0)=0$, $x(1)=4$, $x(3)=0$, $x(4)=4$.","Distance $=4+4+4=12$ m → option (B)."],"r":{"3":"Displacement $4\\ \\mathrm{m}$ hai, distance nahi.","0":"Sirf ek segment liya.","2":"Kuch segments double gin liye."},"t":"Reversal wale questions me x(0), x($t_1$), x($t_2$)… sab likho, phir |$\\Delta x$| jodo.","w":"","fig":null,"sim":null},{"id":204,"q":"A stone is dropped from rest from the top of a tower of height $100\\ \\mathrm{m}$. At the same instant another stone is thrown vertically upward from the ground with a speed of $25\\ \\mathrm{m\\,s^{-1}}$. Take g = $10\\ \\mathrm{m\\,s^{-2}}$. The two stones meet after a time:","opt":["$2.5\\ \\mathrm{s}$","$3.2\\ \\mathrm{s}$","$4.0\\ \\mathrm{s}$","$5.0\\ \\mathrm{s}$"],"ans":2,"c":"Dono ka acceleration same hai, isliye relative speed constant rehti hai.","m":"Relative speed se separation divide karo.","s":["Relative speed $=25$ $\\mathrm{m\\,s^{-1}}$.","Separation $=100$ m.","$t=100/25=4$ s → option (C)."],"r":{"0":"$2.5\\ \\mathrm{s}$ par positions match nahi karte.","1":"$3.2\\ \\mathrm{s}$ kisi aise hisaab se aata hai jisme g add/subtract kiya gaya.","3":"$5\\ \\mathrm{s}$ tak dono cross kar chuke hote hain."},"t":"Same acceleration wale bodies ke liye relative motion me g cancel ho jata hai.","w":"","fig":null,"sim":null},{"id":205,"q":"A train $200\\ \\mathrm{m}$ long is moving with a speed of $72\\ \\mathrm{km\\,h^{-1}}$. The time taken by the train to cross a platform $300\\ \\mathrm{m}$ long is:","opt":["$15\\ \\mathrm{s}$","$20\\ \\mathrm{s}$","$25\\ \\mathrm{s}$","$10\\ \\mathrm{s}$"],"ans":2,"c":"Platform cross karne me total length = train + platform.","m":"Pehle speed ko $\\mathrm{m\\,s^{-1}}$ me badlo, phir length/speed.","s":["$72$ $\\mathrm{km\\,h^{-1}}$ $=20$ $\\mathrm{m\\,s^{-1}}$.","Total length $=200+300=500$ m.","$t=500/20=25$ s → option (C)."],"r":{"3":"Sirf platform ki length li (300/20 = 15 nahi, 10 bhi galat).","0":"Sirf platform 300/20 = 15 li.","1":"Sirf train ki length 200/10 jaisa galat hisaab."},"t":"Platform/bridge cross karne me dono lengths jodo; pole cross karne me sirf train ki.","w":"","fig":null,"sim":null},{"id":206,"q":"A ball is thrown vertically upward from the top of a tower of height $25\\ \\mathrm{m}$ with a speed of $20\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the time taken by the ball to reach the ground is:","opt":["$5\\ \\mathrm{s}$","$2\\ \\mathrm{s}$","$3\\ \\mathrm{s}$","$4\\ \\mathrm{s}$"],"ans":0,"c":"Sign convention upar positive: displacement −$25\\ \\mathrm{m}$, u = +20.","m":"$-25=20t-5t^2$ likho aur solve karo.","s":["$5t^2-20t-25=0$.","$t^2-4t-5=0$.","$(t-5)(t+1)=0\\Rightarrow t=5$ s → option (A)."],"r":{"1":"$2\\ \\mathrm{s}$ me ball highest point par hoti hai, ground par nahi.","2":"$3\\ \\mathrm{s}$ par ground se upar hai.","3":"$4\\ \\mathrm{s}$ par bhi upar hai."},"t":"Tower se phenki ball: displacement negative lena hai, tabhi sahi time aata hai.","w":"","fig":null,"sim":null},{"id":207,"q":"Car A moves along a straight road with a constant speed of $25\\ \\mathrm{m\\,s^{-1}}$ and car B moves ahead of it in the same direction with a constant speed of $15\\ \\mathrm{m\\,s^{-1}}$. At a certain instant the separation between the cars is $100\\ \\mathrm{m}$. The time after which car A just catches car B is:","opt":["$20\\ \\mathrm{s}$","$4\\ \\mathrm{s}$","$5\\ \\mathrm{s}$","$10\\ \\mathrm{s}$"],"ans":3,"c":"Relative speed se separation divide karo — dono constant velocity par hain.","m":"$v_{AB}=25-15=10$ $\\mathrm{m\\,s^{-1}}$, gap $100\\ \\mathrm{m}$.","s":["Relative speed $=10$ $\\mathrm{m\\,s^{-1}}$.","$t=100/10$.","$=10$ s → option (D)."],"r":{"1":"25 − 15 ki jagah 25 liya.","2":"40/8 jaisa galat hisaab.","0":"Relative speed ki jagah 5 liya."},"t":"Constant velocity wale catching problems me sirf relative speed kaafi hai.","w":"","fig":null,"sim":null},{"id":208,"q":"A body moving along a straight line with an initial velocity of $20\\ \\mathrm{m\\,s^{-1}}$ is uniformly retarded at $2\\ \\mathrm{m\\,s^{-2}}$. The distance travelled by the body in the 10th second of its motion is:","opt":["$19\\ \\mathrm{m}$","$0\\ \\mathrm{m}$","$1\\ \\mathrm{m}$","$2\\ \\mathrm{m}$"],"ans":2,"c":"Nth second ka formula $S_n=u+\\tfrac{a(2n-1)}{2}$ retarding motion me bhi chalta hai (a negative).","m":"u = 20, a = −2, n = 10 daalo.","s":["$S_{10}=20+\\dfrac{(-2)(19)}{2}$.","$=20-19$.","$=1$ m → option (C)."],"r":{"1":"Body $10\\ \\mathrm{s}$ par ruk jati hai; 10th second me thoda sa distance bacha hai ($1\\ \\mathrm{m}$).","3":"$2\\ \\mathrm{m}$ aata hai agar 18/2 lagao.","0":"$19\\ \\mathrm{m}$ sirf acceleration ka hissa hai."},"t":"$10\\ \\mathrm{s}$ me body rukti hai (20/2 = 10) — isliye 10th second ka distance chhota hai.","w":"","fig":null,"sim":null},{"id":209,"q":"A body moving along a straight line with an initial velocity of $10\\ \\mathrm{m\\,s^{-1}}$ has a uniform acceleration of $2\\ \\mathrm{m\\,s^{-2}}$ in the direction of its velocity. The distance travelled by the body in the 4th second is:","opt":["$15\\ \\mathrm{m}$","$17\\ \\mathrm{m}$","$19\\ \\mathrm{m}$","$14\\ \\mathrm{m}$"],"ans":1,"c":"$S_n=u+\\dfrac{a(2n-1)}{2}$ me n = 4.","m":"Values daalo aur solve karo.","s":["$S_4=10+\\dfrac{2(7)}{2}$.","$=10+7$.","$=17$ m → option (B)."],"r":{"3":"10 + 4 jaisa galat hisaab.","0":"10 + 5 aata hai agar (2n−1) ki jagah 5 lo.","2":"Sirf acceleration ka hissa (2 × 9.5) liya."},"t":"Formula me pehle (2n − 1) nikalo: n = 4 → 7. Uske baad a/2 se multiply.","w":"","fig":null,"sim":null},{"id":210,"q":"A body moving along a straight line with uniform acceleration covers $12\\ \\mathrm{m}$ in the 2nd second and $20\\ \\mathrm{m}$ in the 4th second of its motion. Its initial velocity and acceleration are respectively:","opt":["$2\\ \\mathrm{m\\,s^{-1}}$ and $4\\ \\mathrm{m\\,s^{-2}}$","$6\\ \\mathrm{m\\,s^{-1}}$ and $2\\ \\mathrm{m\\,s^{-2}}$","$6\\ \\mathrm{m\\,s^{-1}}$ and $4\\ \\mathrm{m\\,s^{-2}}$","$4\\ \\mathrm{m\\,s^{-1}}$ and $6\\ \\mathrm{m\\,s^{-2}}$"],"ans":2,"c":"Do equations banengi: $S_2=u+\\tfrac{3a}{2}=12$ aur $S_4=u+\\tfrac{7a}{2}=20$.","m":"Dono equations subtract karke a nikalo, phir u.","s":["Subtract: $\\dfrac{7a}{2}-\\dfrac{3a}{2}=8\\Rightarrow2a=8\\Rightarrow a=4$ $\\mathrm{m\\,s^{-2}}$.","$12=u+6\\Rightarrow u=6$ $\\mathrm{m\\,s^{-1}}$.","Isliye u = 6, a = 4 → option (C)."],"r":{"3":"Values swap ho gayi — u aur a ki jagah badal di.","0":"u galat (12 − 10 = 2) nikala.","1":"a = 2 rakhne par $S_{4}$ = $13\\ \\mathrm{m}$ aata hai, 20 nahi."},"t":"Nth second ke do data points se hamesha linear equations milti hain — subtract karo.","w":"","fig":null,"sim":null},{"id":211,"q":"A stone is projected vertically upward from the ground with a speed of $40\\ \\mathrm{m\\,s^{-1}}$. Exactly $2\\ \\mathrm{s}$ later a second stone is projected vertically upward from the same point with the same speed. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the two stones meet:","opt":["$2\\ \\mathrm{s}$ after the second stone is projected","$3\\ \\mathrm{s}$ after the second stone is projected","$4\\ \\mathrm{s}$ after the second stone is projected","$5\\ \\mathrm{s}$ after the second stone is projected"],"ans":1,"c":"Pehli stone $2\\ \\mathrm{s}$ tak akeli chalti hai, uske baad dono ka relative motion constant speed ka ho jata hai.","m":"t = $2\\ \\mathrm{s}$ par dono ki positions nikalo, phir relative speed se divide karo.","s":["t = $2\\ \\mathrm{s}$ par pehli stone: $40(2)-5(4)=60$ m, speed $=20$ $\\mathrm{m\\,s^{-1}}$ upar.","Dusri stone ki speed $40\\ \\mathrm{m\\,s^{-1}}$ upar → relative speed $20\\ \\mathrm{m\\,s^{-1}}$, gap $60\\ \\mathrm{m}$.","$t=60/20=3$ s (dusri stone ke projection ke baad) → option (B)."],"r":{"0":"$2\\ \\mathrm{s}$ me gap poora nahi hota.","2":"$4\\ \\mathrm{s}$ tak dono cross kar chuke hote hain.","3":"$5\\ \\mathrm{s}$ bahut zyada hai."},"t":"Late start wale projectile problems me relative velocity hi sabse short rasta hai.","w":"","fig":null,"sim":null},{"id":212,"q":"A balloon starts from rest from the ground and rises vertically with a constant upward acceleration of $2\\ \\mathrm{m\\,s^{-2}}$. After $5\\ \\mathrm{s}$ a stone is released from the balloon. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the time taken by the stone to reach the ground after its release is:","opt":["$3\\ \\mathrm{s}$","(1 + $\\sqrt{3}$) s","(1 + $\\sqrt{6}$) s","(2 + $\\sqrt{3}$) s"],"ans":2,"c":"Release ke waqt stone ki velocity balloon ki velocity hai; height bhi nikaalni padegi.","m":"Pehle balloon ki velocity aur height nikalo, phir free-fall equation.","s":["$v=2\\times5=10$ $\\mathrm{m\\,s^{-1}}$, $h=\\tfrac12(2)(25)=25$ m.","$-25=10t-5t^2\\Rightarrow t^2-2t-5=0$.","$t=1+\\sqrt6\\approx3.45$ s → option (C)."],"r":{"1":"$\\sqrt{3}$ wala root galat equation se aata hai.","3":"Ye root galat constant se aata hai.","0":"$3\\ \\mathrm{s}$ me displacement −$15\\ \\mathrm{m}$ hota hai, −25 nahi."},"t":"Roots me se sirf positive wala lo aur usse height check karo.","w":"","fig":null,"sim":null},{"id":213,"q":"Car P moves along a straight road with a constant velocity of $20\\ \\mathrm{m\\,s^{-1}}$. At the instant P passes a point O, car Q starts from rest from O and moves along the same road in the same direction with a uniform acceleration of $2\\ \\mathrm{m\\,s^{-2}}$. Consider the following statements:\nI. Q catches P at t = $20\\ \\mathrm{s}$.\nII. At the instant Q catches P, the speed of Q is $40\\ \\mathrm{m\\,s^{-1}}$.\nIII. The separation between P and Q is maximum at t = $10\\ \\mathrm{s}$.\nIV. The separation between P and Q decreases continuously from t = 0 onwards.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"Q ki velocity shuru me kam hoti hai, isliye separation pehle badhta hai, phir ghatta hai. Separation maximum tab jab speeds barabar hon.","m":"Teen points check karo: catching time, us waqt speed, aur separation ka maximum.","s":["Catch: $t^2=20t\\Rightarrow t=20$ s → I true.","Us waqt $v=2\\times20=40$ $\\mathrm{m\\,s^{-1}}$ → II true.","Separation max jab $2t=20\\Rightarrow t=10$ s → III true.","IV false: separation pehle badhta hai.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"Separation maximum jab dono ki velocities barabar ho — ye standard result hai.","w":"","fig":null,"sim":null},{"id":214,"q":"A body is thrown vertically upward from the ground and it passes the same point of its path at t = $2\\ \\mathrm{s}$ and again at t = $6\\ \\mathrm{s}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, consider the following statements:\nI. The speed of projection of the body is $40\\ \\mathrm{m\\,s^{-1}}$.\nII. The maximum height reached by the body is $60\\ \\mathrm{m}$.\nIII. The body reaches the highest point of its path at t = $4\\ \\mathrm{s}$.\nIV. At t = $7\\ \\mathrm{s}$ the body is at a height of $35\\ \\mathrm{m}$ above the ground.\nThe correct statements are:","opt":["I, III and IV only","II, III and IV only","I and III only","I, II and III only"],"ans":0,"c":"Do passages ka midpoint highest point ka time deta hai: t = $4\\ \\mathrm{s}$. Usse u = $40\\ \\mathrm{m\\,s^{-1}}$ nikalta hai.","m":"Pehle highest point ka time (symmetry), phir u, phir height check.","s":["t(highest) = (2 + 6)/2 = $4\\ \\mathrm{s}$ → III true.","$u=gt=40$ $\\mathrm{m\\,s^{-1}}$ → I true.","$H=u^2/2g=80$ m, 60 nahi → II false.","t = 7 par $y=40(7)-5(49)=35$ m → IV true.","True set = I, III, IV → option (A)."],"r":{"3":"Isme II galat hai (H = $80\\ \\mathrm{m}$).","1":"Isme II hai aur I chhoot gaya.","2":"IV bhi sahi hai, isliye ye adhoora hai."},"t":"Do passages ka average time highest point deta hai — ye shortcut yaad rakho.","w":"","fig":null,"sim":null},{"id":215,"q":"The velocity-time graph of a body consists of three straight-line segments: from t = 0 to t = $2\\ \\mathrm{s}$ the velocity increases uniformly from 0 to $10\\ \\mathrm{m\\,s^{-1}}$; from t = $2\\ \\mathrm{s}$ to t = $4\\ \\mathrm{s}$ the velocity remains constant at $10\\ \\mathrm{m\\,s^{-1}}$; from t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ the velocity decreases uniformly from $10\\ \\mathrm{m\\,s^{-1}}$ to 0. Consider the following statements:\nI. The acceleration of the body during the interval t = 0 to t = $2\\ \\mathrm{s}$ is $5\\ \\mathrm{m\\,s^{-2}}$.\nII. The distance travelled by the body in the first $4\\ \\mathrm{s}$ is $25\\ \\mathrm{m}$.\nIII. The total displacement of the body in $6\\ \\mathrm{s}$ is $40\\ \\mathrm{m}$.\nIV. The magnitude of the retardation during the interval t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ is $5\\ \\mathrm{m\\,s^{-2}}$.\nThe correct statements are:","opt":["I, II and IV only","I, III and IV only","I, II and III only","II, III and IV only"],"ans":1,"c":"Teen segments ka area: $10\\ \\mathrm{m}$ + $20\\ \\mathrm{m}$ + $10\\ \\mathrm{m}$ = $40\\ \\mathrm{m}$; slopes: +5, 0, −5.","m":"Har statement ko numbers se verify karo.","s":["I: $10/2=5$ → true.","II: first $4\\ \\mathrm{s}$ me 10 + 20 = $30\\ \\mathrm{m}$ (25 nahi) → false.","III: total $40\\ \\mathrm{m}$ → true.","IV: $10/2=5$ → true.","True set = I, III, IV → option (B)."],"r":{"2":"Isme II galat hai ($30\\ \\mathrm{m}$ hota hai).","3":"Isme II hai aur I chhoot gaya.","0":"Isme II hai — eliminate."},"t":"Statement-based graph questions me har statement ke numbers alag nikaalo — ek saath mat karo.","w":"","fig":null,"sim":null},{"id":216,"q":"A balloon is ascending vertically with a constant speed of $20\\ \\mathrm{m\\,s^{-1}}$. When it is at a height of $60\\ \\mathrm{m}$, a stone is released. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, consider the following statements:\nI. The stone continues to move upward for $2\\ \\mathrm{s}$ after its release.\nII. The maximum height above the ground reached by the stone is $100\\ \\mathrm{m}$.\nIII. The stone reaches the ground $6\\ \\mathrm{s}$ after its release.\nIV. The speed of the stone on striking the ground is $40\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["I, III and IV only","II, III and IV only","I and IV only","I, II and III only"],"ans":0,"c":"Stone ka initial velocity $20\\ \\mathrm{m\\,s^{-1}}$ upar, height $60\\ \\mathrm{m}$. Ascent $2\\ \\mathrm{s}$, extra height $20\\ \\mathrm{m}$, max $80\\ \\mathrm{m}$.","m":"Teen cheezein alag nikaalo: ascent time, max height, total time aur ground speed.","s":["I: $20/10=2$ s → true.","II: $60+\\dfrac{400}{20}=80$ m (100 nahi) → false.","III: $-60=20t-5t^2\\Rightarrow t^2-4t-12=0\\Rightarrow t=6$ s → true.","IV: $v=\\sqrt{400+1200}=40$ $\\mathrm{m\\,s^{-1}}$ → true.","True set = I, III, IV → option (A)."],"r":{"3":"Isme II galat hai ($80\\ \\mathrm{m}$).","1":"Isme II hai aur I chhoot gaya.","2":"III bhi sahi hai."},"t":"Max height = release height + $u^{2}$/$2\\ \\mathrm{g}$. Release height ko add karna mat bhoolo.","w":"","fig":null,"sim":null},{"id":217,"q":"A particle moves along the x-axis such that x = 2$t^{3}$ − 9$t^{2}$ + 12t. Consider the following statements:\nI. The velocity of the particle is zero at t = $1\\ \\mathrm{s}$ and at t = $2\\ \\mathrm{s}$.\nII. The acceleration of the particle is zero at t = $1.5\\ \\mathrm{s}$.\nIII. The distance travelled by the particle in the first $2\\ \\mathrm{s}$ is $4\\ \\mathrm{m}$.\nIV. The displacement of the particle in the first $2\\ \\mathrm{s}$ is $4\\ \\mathrm{m}$.\nThe correct statements are:","opt":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"ans":1,"c":"$v=6t^2-18t+12$, $a=12t-18$. Distance ke liye x(0), x(1), x(2) chahiye.","m":"Reversal points par positions note karo, phir distance aur displacement alag likho.","s":["I: $6(t-1)(t-2)=0$ → true.","II: $12t-18=0\\Rightarrow t=1.5$ → true.","III: $x(0)=0$, $x(1)=5$, $x(2)=4$ → distance $=5+1=6$ m → false.","IV: displacement $=x(2)-x(0)=4$ m → true.","True set = I, II, IV → option (B)."],"r":{"0":"Isme III galat hai (distance $6\\ \\mathrm{m}$).","2":"Isme III hai aur I chhoot gaya.","3":"Isme III hai — eliminate."},"t":"Distance ke liye reversal points ki positions chahiye — sirf end points se kaam nahi chalta.","w":"","fig":null,"sim":null},{"id":218,"q":"Consider the following statements about relative motion in one dimension:\nI. Two bodies moving in opposite directions with equal speeds v have a relative speed of 2v.\nII. Two bodies in free fall, air resistance being neglected, have zero relative acceleration.\nIII. The relative velocity of A with respect to B is equal to the relative velocity of B with respect to A.\nIV. The relative velocity of A with respect to B is the negative of the relative velocity of B with respect to A.\nThe correct statements are:","opt":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"ans":1,"c":"$v_{AB}=-v_{BA}$ — antisymmetric. Free fall me dono ka a = g, isliye relative acceleration zero.","m":"III aur IV ek dusre ke opposite hain — sirf ek sach ho sakta hai.","s":["I: $v-(-v)=2v$ → true.","II: same g → 0 → true.","III: barabar nahi, negative hai → false.","IV: antisymmetric → true.","True set = I, II, IV → option (B)."],"r":{"0":"Isme III galat hai.","2":"Isme III hai aur I chhoot gaya.","3":"Isme III hai — eliminate."},"t":"Opposite statements wale options me se sirf ek hi sach hota hai — aadha kaam wahin ho jata hai.","w":"","fig":null,"sim":null},{"id":219,"q":"Consider the following statements about the stopping of a vehicle whose brakes produce a constant retardation:\nI. If the speed of the vehicle is doubled and the retardation remains the same, the braking distance becomes four times.\nII. The total stopping distance of the vehicle is always proportional to the square of its speed.\nIII. The distance travelled by the vehicle during the reaction time of the driver does not depend on the retardation produced by the brakes.\nIV. On a wet road, where the retardation produced by the brakes is smaller, the braking distance is larger.\nThe correct statements are:","opt":["I, II and III only","I, III and IV only","II, III and IV only","I, II and IV only"],"ans":1,"c":"Total = v t(r) + $v^{2}$/2a. II tabhi sach hota hai jab reaction time zero ho.","m":"II me 'always' hai — reaction time wale case se ye toot jata hai.","s":["I: $v^{2}$/2a → 4× → true.","II: 'always' galat (linear term bhi hai) → false.","III: reaction distance = v t(r), a se independent → true.","IV: a chhota → $v^{2}$/2a bada → true.","True set = I, III, IV → option (B)."],"r":{"0":"Isme II galat hai.","2":"Isme II hai aur I chhoot gaya.","3":"Isme II hai — eliminate."},"t":"Wet road ka example yaad rakho: retardation kam → braking distance zyada.","w":"","fig":null,"sim":null},{"id":220,"q":"A body is released from rest from a height and falls freely. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, consider the following statements:\nI. The distances fallen by the body in the first, second and third seconds are in the ratio 1 : 3 : 5.\nII. The distance fallen by the body in the 3rd second is $25\\ \\mathrm{m}$.\nIII. The average speed of the body during the first $2\\ \\mathrm{s}$ is $10\\ \\mathrm{m\\,s^{-1}}$.\nIV. The body covers half of the total distance of its fall in the first half of its total time of fall.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"Free fall me distances ∝ $t^{2}$, isliye half time me chauthai distance hota hai (half nahi).","m":"IV counter-example se reject karo.","s":["I: 5 : 15 : 25 = 1 : 3 : 5 → true.","II: $S_3=5(2\\times3-1)=25$ m → true.","III: $2\\ \\mathrm{s}$ me $20\\ \\mathrm{m}$, average = 10 → true.","IV: half time me h/4 hota hai → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"Distance ∝ $t^{2}$ — isliye half time me ¼ distance, half distance ke liye $T/\\sqrt{2}$ time.","w":"","fig":null,"sim":null},{"id":221,"q":"The velocity-time graph of a body consists of three horizontal segments: from t = 0 to t = $2\\ \\mathrm{s}$ the velocity is +$5\\ \\mathrm{m\\,s^{-1}}$; from t = $2\\ \\mathrm{s}$ to t = $4\\ \\mathrm{s}$ the velocity is −$5\\ \\mathrm{m\\,s^{-1}}$; from t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ the velocity is 0. Consider the following statements:\nI. The displacement of the body in the interval t = 0 to t = $4\\ \\mathrm{s}$ is $20\\ \\mathrm{m}$.\nII. The distance travelled by the body in the interval t = 0 to t = $6\\ \\mathrm{s}$ is $20\\ \\mathrm{m}$.\nIII. The body remains at rest during the interval t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$.\nIV. The average speed of the body over the interval t = 0 to t = $6\\ \\mathrm{s}$ is 10/$3\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["II, III and IV only","I, II and IV only","I, III and IV only","I, II and III only"],"ans":0,"c":"Signed area displacement deta hai, |area| distance. Yahan +10 aur −10 ka displacement zero hai.","m":"Pehle signed areas jodo, phir magnitudes.","s":["I: $+10-10=0$, 20 nahi → false.","II: distance $=10+10=20$ m → true.","III: v = 0 → rest → true.","IV: $20/6=10/3$ → true.","True set = II, III, IV → option (A)."],"r":{"3":"Isme I galat hai (displacement 0).","1":"Isme I hai aur II chhoot gaya.","2":"Isme I hai — eliminate."},"t":"Equal opposite areas → displacement zero. Distance phir bhi double hota hai.","w":"","fig":null,"sim":null},{"id":222,"q":"The velocity of a particle moving along a straight line is v = 6t − $t^{2}$. Consider the following statements:\nI. The acceleration of the particle at t = 0 is $6\\ \\mathrm{m\\,s^{-2}}$.\nII. The velocity of the particle is maximum at t = $6\\ \\mathrm{s}$.\nIII. The velocity of the particle becomes zero at t = $6\\ \\mathrm{s}$.\nIV. The acceleration of the particle at t = $6\\ \\mathrm{s}$ is −$6\\ \\mathrm{m\\,s^{-2}}$.\nThe correct statements are:","opt":["I, II and III only","I, III and IV only","II, III and IV only","I, II and IV only"],"ans":1,"c":"$a=6-2t$. Velocity maximum tab jab a = 0 (t = 3), aur v = 0 tab jab t = 6.","m":"Maximum velocity aur zero velocity ko alag-alag solve karo — dono ek hi nahi.","s":["I: $a(0)=6$ → true.","II: v max at t = 3 (v = 9), t = 6 par v = 0 → false.","III: $6t-t^2=0\\Rightarrow t=6$ → true.","IV: $a(6)=6-12=-6$ → true.","True set = I, III, IV → option (B)."],"r":{"0":"Isme II galat hai (max at t = 3).","2":"Isme II hai aur I chhoot gaya.","3":"Isme II hai — eliminate."},"t":"v = 0 (reversal) aur v = max (a = 0) bilkul alag points hain.","w":"","fig":null,"sim":null},{"id":223,"q":"Which one of the following statements is NOT correct?","opt":["For a body moving with uniform acceleration, the distances covered in successive equal intervals of time form an arithmetic progression.","The distance travelled by a body in the nth second of uniform acceleration is numerically equal to the velocity of the body at the beginning of that second.","For a body starting from rest with uniform acceleration, the distances covered in successive equal intervals of time are in the ratio of successive odd numbers.","For a body moving with uniform acceleration, the average velocity over any interval equals the velocity at the mid-instant of that interval."],"ans":1,"c":"Nth second ka distance us second ki average velocity ke barabar hota hai (mid-instant ki velocity), beginning ki velocity ke nahi.","m":"B me 'beginning' word galat hai — mid-instant hona chahiye.","s":["D: mid-instant velocity = average velocity → sahi.","A: AP me hote hain ($aT^{2}$ ka difference) → sahi.","B: average velocity (mid-instant) ke barabar hai, beginning ke nahi → NOT correct.","C: 1 : 3 : 5 → sahi.","Isliye option (B)."],"r":{"3":"Ye sahi hai.","0":"Ye bhi sahi hai.","2":"Odd numbers ka ratio sahi hai."},"t":"S_n = v(mid-instant) × $1\\ \\mathrm{s}$ — beginning ki velocity nahi.","w":"","fig":null,"sim":null},{"id":224,"q":"Which one of the following statements is correct?","opt":["A body can have zero velocity and non-zero acceleration at the same instant.","A body at rest at any instant must have zero acceleration at that instant.","A body with negative acceleration must necessarily be slowing down.","The magnitude of the average velocity of a body is always equal to its average speed."],"ans":0,"c":"Highest point par v = 0 par a = g — ye classic example hai.","m":"Har option ko ek example se test karo.","s":["A: highest point ka example → sahi.","B: wahi example ise galat karta hai.","C: negative direction me tez hoti body ka a negative hota hai → galat.","D: return journey me dono alag hote hain → galat.","Isliye option (A)."],"r":{"1":"Highest point par rest hai par a = g ≠ 0.","2":"Negative acceleration ka matlab sirf negative direction me acceleration hai.","3":"Average speed ≥ |average velocity| hoti hai; barabar nahi."},"t":"Ek hi example (vertical throw ka highest point) se teen options kat jate hain.","w":"","fig":null,"sim":null},{"id":225,"q":"Which one of the following statements is NOT correct?","opt":["Two bodies dropped from rest from the same height at different instants have equal speeds at the instants when they are at the same height above the ground.","If the relative velocity of two bodies is zero at an instant, their accelerations at that instant must also be equal.","Two bodies moving with constant velocities have zero relative acceleration.","A body thrown vertically upward has the same acceleration while going up and while coming down."],"ans":1,"c":"Same velocity at an instant ka matlab same acceleration nahi — dono alag quantities hain.","m":"B ke liye counter-example: ek body peak par (a = g), dusri constant velocity se chal rahi ho (a = 0) — velocity same ho sakti hai par acceleration alag.","s":["A: same height par same speed → sahi.","B: same velocity se same acceleration nahi nikalta → NOT correct.","C: constant velocity → a = 0 dono → relative 0 → sahi.","D: dono phases me a = g → sahi.","Isliye option (B)."],"r":{"0":"Energy/symmetry se ye sahi hai.","2":"Constant velocities ka acceleration zero hota hai.","3":"Throw ke baad a = g hamesha."},"t":"Same velocity ≠ same acceleration. Do alag cheezein hain.","w":"","fig":null,"sim":null},{"id":226,"q":"Which one of the following statements is correct?","opt":["The area under a position-time graph between two instants gives the velocity of the body.","The area under a speed-time graph between two instants gives the displacement of the body in that interval.","The area under a velocity-time graph between two instants, taken with proper sign, gives the displacement of the body in that interval.","The slope of the tangent to a velocity-time graph gives the displacement of the body."],"ans":2,"c":"v–t ka signed area displacement deta hai; speed–time ka area distance deta hai.","m":"Area aur slope ke rules ko match karo.","s":["B: speed–time area distance deta hai, displacement nahi → galat.","C: signed area = displacement → sahi.","D: slope acceleration deta hai → galat.","A: x–t ka area ka koi meaning nahi → galat.","Isliye option (C)."],"r":{"1":"Speed–time graph ka area distance hota hai.","3":"v–t ka slope acceleration deta hai.","0":"x–t graph ka area bekaar hai."},"t":"Speed–time → distance; velocity–time → displacement. Ye jodi yaad rakho.","w":"","fig":null,"sim":null},{"id":227,"q":"Which one of the following statements is NOT correct?","opt":["The frame of reference attached to a freely falling lift is a non-inertial frame.","For most laboratory experiments of short duration, the Earth is treated as an approximately inertial frame.","A frame of reference moving with uniform velocity relative to an inertial frame is a non-inertial frame.","The acceleration of a body measured in two inertial frames moving uniformly relative to each other is the same."],"ans":2,"c":"Uniform velocity se chalne wala frame bhi inertial hota hai — non-inertial nahi.","m":"Definition yaad karo: inertial = zero acceleration frame.","s":["A: free fall me a = g → non-inertial → sahi.","B: Earth approx inertial → sahi.","C: uniform velocity frame inertial hota hai → NOT correct.","D: acceleration inertial frames me same → sahi.","Isliye option (C)."],"r":{"0":"Free fall frame me pseudo force lagti hai — sahi.","1":"Ye standard assumption hai.","3":"Galilean relativity ka result hai — sahi."},"t":"Sirf accelerated frame non-inertial hota hai, constant velocity wala nahi.","w":"","fig":null,"sim":null},{"id":228,"q":"Which one of the following statements is correct? (Take g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglect air resistance.)","opt":["A body thrown vertically upward with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ reaches a maximum height of $20\\ \\mathrm{m}$.","A body thrown vertically upward with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ returns to the ground after $2\\ \\mathrm{s}$.","A body dropped from rest covers a distance of $40\\ \\mathrm{m}$ in $4\\ \\mathrm{s}$.","A body starting with $10\\ \\mathrm{m\\,s^{-1}}$ and moving with $2\\ \\mathrm{m\\,s^{-2}}$ covers a speed of $24\\ \\mathrm{m\\,s^{-1}}$ in $3\\ \\mathrm{s}$."],"ans":0,"c":"Numbers ko formula me daal kar check karo — har option ek chhota calculation hai.","m":"$H=u^2/2g$, $T=2u/g$, $h=\\tfrac12gt^2$, $v=u+at$ — chaar quick checks.","s":["A: $H=400/20=20$ m → sahi.","B: $T=2(20)/10=4$ s (2 nahi) → galat.","C: $h=\\tfrac12(10)(16)=80$ m (40 nahi) → galat.","D: $v=10+6=16$ $\\mathrm{m\\,s^{-1}}$ (24 nahi) → galat.","Isliye option (A)."],"r":{"1":"T = 2u/g = $4\\ \\mathrm{s}$ hota hai.","2":"$4\\ \\mathrm{s}$ me $80\\ \\mathrm{m}$ girta hai.","3":"Speed $16\\ \\mathrm{m\\,s^{-1}}$ hoti hai, 24 nahi."},"t":"Aise questions me har option ka chhota calculation karo — 30 second me answer.","w":"","fig":null,"sim":null},{"id":229,"q":"Which one of the following statements is NOT correct?","opt":["The distance travelled by a body in any interval can never be less than the magnitude of its displacement in that interval.","For a body starting from rest with uniform acceleration, the distance travelled in the nth second is proportional to $n^{2}$.","If the acceleration of a particle varies with time, its velocity-time graph is a curve.","If the velocity-time graph of a particle is a parabola, its acceleration varies linearly with time."],"ans":1,"c":"Rest se uniform acceleration me $S_n\\propto(2n-1)$, jo $n^{2}$ ke proportional nahi hai.","m":"B me proportionality galat hai — $n^{2}$ total distance ka rishta hai.","s":["C: variable a → v–t curve → sahi.","D: v ∝ $t^{2}$ → a ∝ t → sahi.","A: path ≥ |displacement| → sahi.","B: $S_n\\propto(2n-1)$, $n^{2}$ ke proportional nahi → NOT correct.","Isliye option (B)."],"r":{"2":"Ye sahi hai.","3":"v quadratic → a linear — sahi.","0":"Ye inequality sahi hai."},"t":"$S_n\\propto(2n-1)$ aur total $s\\propto n^2$ — inhe confuse mat karo.","w":"","fig":null,"sim":null},{"id":230,"q":"Which one of the following statements is correct?","opt":["The average velocity of a body moving along a straight line is always positive.","The acceleration of a body is always directed along its velocity.","A body moving along a straight line with constant speed has zero average acceleration over any interval.","The instantaneous speed of a body moving along a straight line can be negative."],"ans":2,"c":"1D me constant speed ka matlab velocity constant (direction fixed) hai, isliye acceleration zero aur average acceleration bhi zero.","m":"Har option ko 1D ki special property se test karo.","s":["A: negative direction me negative hoti hai → galat.","B: retardation me opposite hota hai → galat.","C: constant velocity → a = 0 → sahi.","D: speed magnitude hai, negative nahi → galat.","Isliye option (C)."],"r":{"0":"Peeche chalne par average velocity negative hoti hai.","1":"Braking me acceleration velocity ke opposite hota hai.","3":"Speed negative nahi hoti."},"t":"1D me constant speed → acceleration zero. Ye 2D se alag hai (wahan direction badalti hai).","w":"","fig":null,"sim":null},{"id":231,"q":"Which one of the following statements is NOT correct?","opt":["Two cars moving in the same direction with speeds $10\\ \\mathrm{m\\,s^{-1}}$ and $15\\ \\mathrm{m\\,s^{-1}}$ have a relative speed of $5\\ \\mathrm{m\\,s^{-1}}$.","A passenger sitting in a train moving with $60\\ \\mathrm{km\\,h^{-1}}$ sees a stationary tree apparently moving backward with $60\\ \\mathrm{km\\,h^{-1}}$.","A train $100\\ \\mathrm{m}$ long moving with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ crosses a platform $100\\ \\mathrm{m}$ long in $5\\ \\mathrm{s}$.","Two trains, each $100\\ \\mathrm{m}$ long, moving in opposite directions with speeds of $10\\ \\mathrm{m\\,s^{-1}}$ each cross each other completely in $10\\ \\mathrm{s}$."],"ans":2,"c":"Platform cross karne me total length $200\\ \\mathrm{m}$ hoti hai, isliye time 200/20 = $10\\ \\mathrm{s}$, $5\\ \\mathrm{s}$ nahi.","m":"Har option me numbers check karo — option C me length add karna bhoola gaya hai.","s":["A: 15 − 10 = 5 → sahi.","B: relative velocity se tree peeche chalta dikhta hai → sahi.","C: $200/20=10$ s (5 nahi) → NOT correct.","D: $200/20=10$ s → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi hai.","1":"Frame change ka simple example — sahi.","3":"Opposite direction me relative speed $20\\ \\mathrm{m\\,s^{-1}}$ aur total length $200\\ \\mathrm{m}$ → $10\\ \\mathrm{s}$."},"t":"Platform/bridge me dono lengths jodo; pole me sirf train ki length.","w":"","fig":null,"sim":null},{"id":232,"q":"Which one of the following statements is correct?","opt":["A body thrown vertically upward returns to the ground with a speed greater than the launch speed if air resistance acts on it.","The acceleration of a body moving with uniform velocity is zero, but a body momentarily at rest need not have zero acceleration.","If the position-time graph of a body is a straight line, its acceleration is constant and non-zero.","If the velocity-time graph of a body is a straight line not passing through the origin, the body must have started from rest."],"ans":1,"c":"Uniform velocity → a = 0; momentary rest par a ≠ 0 ho sakta hai (highest point).","m":"Har option ko ek counter-example se check karo.","s":["A: air resistance se speed kam hoti hai → galat.","B: dono parts sach hain → sahi.","C: straight x–t line → a = 0 → galat.","D: origin se na guzarna matlab u ≠ 0 → galat.","Isliye option (B)."],"r":{"0":"Resistance se energy loss hoti hai, speed badhti nahi.","2":"Straight line ka matlab uniform velocity, acceleration zero.","3":"y-intercept hi initial velocity batata hai."},"t":"v–t graph ka y-intercept initial velocity hota hai.","w":"","fig":null,"sim":null},{"id":233,"q":"Match the situations in Column I with the values in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$.\nColumn I: (a) Maximum height reached by a body thrown vertically upward with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ (b) Total time of flight of that body (c) Time taken by a body released from rest to fall $45\\ \\mathrm{m}$ (d) Speed acquired by a body in falling $45\\ \\mathrm{m}$ from rest\nColumn II: (i) $3\\ \\mathrm{s}$ (ii) $20\\ \\mathrm{m}$ (iii) $30\\ \\mathrm{m\\,s^{-1}}$ (iv) $4\\ \\mathrm{s}$","opt":["a-iv, b-ii, c-iii, d-i","a-ii, b-i, c-iv, d-iii","a-iii, b-iv, c-i, d-ii","a-ii, b-iv, c-i, d-iii"],"ans":3,"c":"$H=u^2/2g$, $T=2u/g$, $h=\\tfrac12gt^2$, $v=\\sqrt{2gh}$ — chaar standard formulas.","m":"Har case ka formula pehle likho, phir value.","s":["(a) $400/20=20$ m → ii.","(b) $40/10=4$ s → iv.","(c) $45=5t^2\\Rightarrow3$ s → i.","(d) $\\sqrt{2(10)(45)}=30$ $\\mathrm{m\\,s^{-1}}$ → iii.","Isliye a-ii, b-iv, c-i, d-iii → option (D)."],"r":{"0":"(a) me $4\\ \\mathrm{s}$ daal diya (time of flight).","1":"(b) me $3\\ \\mathrm{s}$ daal diya.","2":"(a) me $30\\ \\mathrm{m\\,s^{-1}}$ daal diya."},"t":"Chaar formulas yaad hain to ye questions 40 second me ho jate hain.","w":"","fig":null,"sim":null},{"id":234,"q":"Match the position-time relations in Column I with the accelerations at t = $1\\ \\mathrm{s}$ in Column II. Here x is in metre and t is in second.\nColumn I: (a) x = 4$t^{2}$ (b) x = 3t + 5 (c) x = 2$t^{3}$ (d) x = 5 − 6$t^{2}$\nColumn II: (i) Zero (ii) $8\\ \\mathrm{m\\,s^{-2}}$ (iii) $12\\ \\mathrm{m\\,s^{-2}}$ (iv) −$12\\ \\mathrm{m\\,s^{-2}}$","opt":["a-ii, b-i, c-iii, d-iv","a-i, b-ii, c-iv, d-iii","a-iii, b-iv, c-ii, d-i","a-iv, b-iii, c-i, d-ii"],"ans":0,"c":"Acceleration ke liye do baar differentiate karo.","m":"Har relation ka second derivative nikaalo, phir t = 1 daalo.","s":["(a) $x=4t^2\\Rightarrow a=8$ → ii.","(b) linear → a = 0 → i.","(c) $x=2t^3\\Rightarrow a=12t=12$ → iii.","(d) $x=5-6t^2\\Rightarrow a=-12$ → iv.","Isliye a-ii, b-i, c-iii, d-iv → option (A)."],"r":{"1":"(a) me zero daal diya.","2":"(a) me 12 daal diya (c ka answer).","3":"(a) me −12 daal diya (d ka answer)."},"t":"Second derivative = acceleration; t = 1 daalna last step hai.","w":"","fig":null,"sim":null},{"id":235,"q":"Match the features of graphs in Column I with the corresponding descriptions of motion in Column II:\nColumn I: (a) Position-time graph that is a parabola opening upward (b) Velocity-time graph that is a straight line with negative slope crossing the time axis (c) Acceleration-time graph that is a straight line parallel to the time axis at a constant positive value (d) Position-time graph that is a straight line with negative slope\nColumn II: (i) Uniform velocity in the negative direction (ii) Uniformly accelerated motion with a reversal of direction (iii) Motion with constant positive acceleration in which the velocity increases linearly with time (iv) Uniformly accelerated motion starting from rest","opt":["a-iv, b-ii, c-iii, d-i","a-ii, b-iv, c-i, d-iii","a-i, b-iii, c-iv, d-ii","a-iii, b-i, c-ii, d-iv"],"ans":0,"c":"Parabola = quadratic (uniform a); v–t line time axis cross kare to direction reversal; a–t horizontal = constant a.","m":"Har graph ko shape se pehchano, phir motion ki description.","s":["(a) upward parabola → rest se + a → iv.","(b) v–t negative slope crossing axis → reversal → ii.","(c) a–t positive constant → v linear badhti → iii.","(d) x–t negative slope → negative uniform velocity → i.","Isliye a-iv, b-ii, c-iii, d-i → option (A)."],"r":{"1":"(a) ko reversal wala motion likh diya.","2":"(a) me uniform velocity daal di.","3":"(b) me uniform velocity daal di."},"t":"v–t graph ka time axis ko cross karna = direction reversal ka surest signal.","w":"","fig":null,"sim":null},{"id":236,"q":"Match the journeys in Column I with their average speeds in Column II:\nColumn I: (a) A body covers $60\\ \\mathrm{m}$ in $3\\ \\mathrm{s}$ and then $40\\ \\mathrm{m}$ in the next $2\\ \\mathrm{s}$ (b) A body covers the first half of the distance with $20\\ \\mathrm{m\\,s^{-1}}$ and the second half with $30\\ \\mathrm{m\\,s^{-1}}$ (c) A body moves with $20\\ \\mathrm{m\\,s^{-1}}$ for the first half of the total time and with $30\\ \\mathrm{m\\,s^{-1}}$ for the rest (d) A body goes $60\\ \\mathrm{m}$ forward and then returns $60\\ \\mathrm{m}$, the whole journey taking $10\\ \\mathrm{s}$\nColumn II: (i) $12\\ \\mathrm{m\\,s^{-1}}$ (ii) $20\\ \\mathrm{m\\,s^{-1}}$ (iii) $24\\ \\mathrm{m\\,s^{-1}}$ (iv) $25\\ \\mathrm{m\\,s^{-1}}$","opt":["a-ii, b-iii, c-iv, d-i","a-iii, b-iv, c-i, d-ii","a-i, b-ii, c-iii, d-iv","a-iv, b-i, c-ii, d-iii"],"ans":0,"c":"Mixed types: total/total, equal distance ka harmonic average, equal time ka simple average.","m":"Har case ka type pehchano pehle.","s":["(a) $100/5=20$ → ii.","(b) $\\dfrac{2(20)(30)}{50}=24$ → iii.","(c) $(20+30)/2=25$ → iv.","(d) $120/10=12$ → i.","Isliye a-ii, b-iii, c-iv, d-i → option (A)."],"r":{"1":"(a) me 24 daal diya (b ka answer).","2":"(a) me 12 daal diya (d ka answer).","3":"(a) me 25 daal diya (c ka answer)."},"t":"Equal distance vs equal time — pehla step yahi decide karna hai.","w":"","fig":null,"sim":null},{"id":237,"q":"Match the quantities in Column I with their expressions in Column II. The motion is uniformly accelerated along a straight line.\nColumn I: (a) Distance travelled in the nth second (b) The relation $v^{2}$ = $u^{2}$ + 2as (c) Relative velocity of A with respect to B (d) Distance covered during the reaction time of a driver moving with speed v\nColumn II: (i) v(A) − v(B) (ii) u + a(2n − 1)/2 (iii) v × t(r) (iv) A relation between velocity and displacement that does not involve time","opt":["a-ii, b-iv, c-i, d-iii","a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-iv, d-ii","a-iv, b-iii, c-ii, d-i"],"ans":0,"c":"Chaar expressions ki pehchaan: nth second, time-free relation, relative velocity, reaction distance.","m":"(b) ki khaas baat: isme time nahi hota.","s":["(a) → ii.","(b) → iv (time-free relation).","(c) → i.","(d) → iii.","Isliye a-ii, b-iv, c-i, d-iii → option (A)."],"r":{"1":"(a) me relative velocity daal di.","2":"(a) me reaction distance daal di.","3":"(a) me $v^{2}$ = $u^{2}$ + 2as ka description daal diya."},"t":"Description match me har expression ki khaas baat dhundo (jaise 'no time').","w":"","fig":null,"sim":null},{"id":238,"q":"Match the motions in Column I with the shapes of their velocity-time graphs described in Column II:\nColumn I: (a) A body permanently at rest (b) A body starting from rest with uniform positive acceleration (c) A body moving with initial velocity $v_{0}$ and brought to rest by uniform retardation (d) A body moving with uniform velocity in the negative direction\nColumn II: (i) A straight line passing through the origin with positive slope (ii) A straight line lying along the time axis (iii) A straight line parallel to the time axis drawn below it (iv) A straight line of negative slope starting on the positive velocity axis and ending on the time axis","opt":["a-ii, b-i, c-iv, d-iii","a-i, b-ii, c-iii, d-iv","a-iv, b-iii, c-ii, d-i","a-iii, b-iv, c-i, d-ii"],"ans":0,"c":"Har motion ka v–t graph shape: rest → axis par line; rest se + a → origin se line; retardation → positive axis se neeche; negative uniform velocity → axis ke neeche horizontal line.","m":"Shape ko sketch karo aur match karo.","s":["(a) rest → v = 0 line → ii.","(b) origin se positive slope → i.","(c) $v_{0}$ se 0 tak negative slope → iv.","(d) neeche horizontal → iii.","Isliye a-ii, b-i, c-iv, d-iii → option (A)."],"r":{"1":"(a) me origin se line daal di.","2":"(a) me negative slope daal di.","3":"(a) me neeche horizontal line daal di."},"t":"Graph match me pehle charan (starting point) dekho, phir slope.","w":"","fig":null,"sim":null},{"id":239,"q":"Assertion: The relative velocity of two bodies moving towards each other with equal speeds v has magnitude 2v, while the relative acceleration of two bodies moving with uniform velocities is zero.\nReason: Relative velocity is obtained by subtracting one velocity from the other, and relative acceleration is obtained by subtracting one acceleration from the other.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Dono definitions subtraction par based hain — isliye reason assertion ka poora mechanism samjhata hai.","m":"Assertion ke dono hisse check karo: 2v (sahi) aur zero relative acceleration (uniform velocities, sahi).","s":["A true: dono hisse sahi.","R true: definition sahi hai.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Relative velocity/acceleration — dono me same subtraction rule, bas quantity alag.","w":"","fig":null,"sim":null},{"id":240,"q":"Assertion: For a body moving with uniform acceleration, the distance travelled in the nth second is numerically equal to its velocity at the middle of the nth second multiplied by one second.\nReason: For uniformly accelerated motion, the average velocity over any interval equals the velocity at the middle instant of that time interval.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Distance = average velocity × time. $1\\ \\mathrm{s}$ ke interval me average velocity = mid-instant velocity.","m":"Reason ko assertion se jodo — dono ek hi fact par based hain.","s":["A true: S_n = v(mid) × 1.","R true: uniform acceleration ka mid-instant rule.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Mid-instant velocity = average velocity — sirf uniform acceleration me.","w":"","fig":null,"sim":null},{"id":241,"q":"Assertion: A ball released from rest inside a lift that is moving upward with a constant velocity falls with acceleration g relative to the floor of the lift.\nReason: A lift moving with constant velocity is an inertial frame of reference, so Newton's laws hold inside it without any pseudo force.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Constant velocity wala lift inertial frame hai, isliye andar sab kuch normal — ball g se girti hai.","m":"Frame inertial hai ya nahi — yahi poora question hai.","s":["A true: relative acceleration g.","R true: constant velocity → inertial.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Lift constant velocity se chale to andar physics same rehti hai — pseudo force nahi.","w":"","fig":null,"sim":null},{"id":242,"q":"Assertion: In the absence of air resistance a body thrown vertically upward returns to the point of projection with the same speed, whereas in the presence of air resistance it returns with a smaller speed.\nReason: With air resistance present, the magnitude of the acceleration during the descent is smaller than that during the ascent, so the body loses speed.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Ascent me weight + resistance neeche; descent me weight neeche, resistance upar. Isliye net deceleration ascent me zyada, descent me kam — energy loss hoti hai.","m":"Reason me acceleration ka comparison hai — wahi assertion ki wajah hai.","s":["A true: bina resistance same speed, resistance ke saath kam speed.","R true: descent ka acceleration chhota hota hai.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Air resistance se wapsi speed kam — iska kaaran ascent/descent ka asymmetric acceleration hai.","w":"","fig":null,"sim":null},{"id":243,"q":"Assertion: In a velocity-time graph, the area between the graph and the time axis is taken as positive where the graph lies above the axis and as negative where it lies below the axis, and the total displacement is the algebraic sum of such areas.\nReason: Velocity is a vector quantity, so motion represented below the time axis corresponds to displacement in the negative direction.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Sign convention ka source velocity ka vector nature hai — isliye neeche ka area negative displacement deta hai.","m":"Assertion ke dono hisse sach hain, reason uska kaaran batata hai.","s":["A true: signed area = displacement.","R true: velocity vector hai.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"v–t graph me neeche ka area negative — ye rule vector nature se aata hai.","w":"","fig":null,"sim":null},{"id":244,"q":"Assertion: For a body moving with uniform acceleration along a straight line, the average velocity over any time interval is equal to the arithmetic mean of its initial and final velocities over that interval.\nReason: For uniformly accelerated motion, the velocity-time graph is a parabola.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":2,"c":"Uniform acceleration me v–t graph straight line hoti hai (parabola nahi). Isliye reason galat hai.","m":"Reason ke shape ko check karo — parabola galat hai.","s":["A true: (u + v)/2.","R false: v–t graph straight line hai.","True assertion + false reason → option (C)."],"r":{"0":"Reason galat hai.","1":"Reason galat hai.","3":"Assertion sach hai."},"t":"v–t line, x–t parabola — shape yaad rakho.","w":"","fig":null,"sim":null},{"id":245,"q":"The velocity-time graph of a body is as follows: from t = 0 to t = $2\\ \\mathrm{s}$ the velocity is +$10\\ \\mathrm{m\\,s^{-1}}$; from t = $2\\ \\mathrm{s}$ to t = $4\\ \\mathrm{s}$ the velocity decreases uniformly from +$10\\ \\mathrm{m\\,s^{-1}}$ to −$10\\ \\mathrm{m\\,s^{-1}}$, crossing the time axis at t = $3\\ \\mathrm{s}$; from t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ the velocity is −$10\\ \\mathrm{m\\,s^{-1}}$. For the interval t = 0 to t = $6\\ \\mathrm{s}$, the displacement and the distance travelled by the body are respectively:","opt":["0 and $50\\ \\mathrm{m}$","$40\\ \\mathrm{m}$ and $40\\ \\mathrm{m}$","$20\\ \\mathrm{m}$ and $40\\ \\mathrm{m}$","0 and 0"],"ans":0,"c":"Signed areas se displacement, magnitudes se distance. Yahan upar $25\\ \\mathrm{m}$ aur neeche $25\\ \\mathrm{m}$ ka area hai.","m":"Areas: 0–$2\\ \\mathrm{s}$ rectangle (+20), 2–$3\\ \\mathrm{s}$ triangle (+5), 3–$4\\ \\mathrm{s}$ triangle (−5), 4–$6\\ \\mathrm{s}$ rectangle (−20).","s":["Displacement $=+20+5-5-20=0$.","Distance $=20+5+5+20=50$ m.","Isliye 0 aur $50\\ \\mathrm{m}$ → option (A)."],"r":{"3":"Distance zero nahi, body $50\\ \\mathrm{m}$ chali hai.","1":"Displacement zero hai, 40 nahi.","2":"Dono values galat hain."},"t":"Crossing point par area ko do triangles me todo — sign alag-alag lena hai.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,10],[2,10],[4,-10],[6,-10]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":246,"q":"The position-time graph of a particle is as follows: from t = 0 to t = $2\\ \\mathrm{s}$ the position increases uniformly from x = 0 to x = $20\\ \\mathrm{m}$; from t = $2\\ \\mathrm{s}$ to t = $4\\ \\mathrm{s}$ the graph is horizontal at x = $20\\ \\mathrm{m}$; from t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ the position decreases uniformly from x = $20\\ \\mathrm{m}$ to x = 0. For the interval t = 0 to t = $6\\ \\mathrm{s}$, the average speed and the magnitude of the average velocity are respectively:","opt":["$3.33\\ \\mathrm{m\\,s^{-1}}$ and zero","$6.67\\ \\mathrm{m\\,s^{-1}}$ and zero","zero and $6.67\\ \\mathrm{m\\,s^{-1}}$","$10\\ \\mathrm{m\\,s^{-1}}$ and $10\\ \\mathrm{m\\,s^{-1}}$"],"ans":1,"c":"Distance = 20 + 20 = $40\\ \\mathrm{m}$; displacement = 0 → average speed 6.67, |average velocity| 0.","m":"Dono numerators alag nikaalo.","s":["Average speed $=40/6=6.67$ $\\mathrm{m\\,s^{-1}}$.","Displacement $=0$ → $|v_{avg}|=0$.","Isliye option (B)."],"r":{"2":"Values ulat gayi.","3":"$10\\ \\mathrm{m\\,s^{-1}}$ sirf pehle segment ki speed hai.","0":"40/12 jaisa galat time lagaya."},"t":"x–t graph ka total path = har segment ke |change| ka sum.","w":"","fig":{"t":"g","kind":"xt","pts":[[0,0],[2,20],[4,20],[6,0]],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":247,"q":"The velocity of a body moving along a straight line is recorded at equal intervals of $1\\ \\mathrm{s}$ in the following data table. Assuming the velocity to vary uniformly between the recorded instants, the acceleration of the body and the displacement during the interval t = 0 to t = $3\\ \\mathrm{s}$ are respectively:","opt":["$4\\ \\mathrm{m\\,s^{-2}}$ and $33\\ \\mathrm{m}$","$4\\ \\mathrm{m\\,s^{-2}}$ and $27\\ \\mathrm{m}$","$2\\ \\mathrm{m\\,s^{-2}}$ and $33\\ \\mathrm{m}$","$4\\ \\mathrm{m\\,s^{-2}}$ and $51\\ \\mathrm{m}$"],"ans":0,"c":"Uniform rate se velocity badal rahi hai → acceleration constant, aur displacement trapezium area se.","m":"Pehle $a=\\Delta v/\\Delta t$, phir (u + v)/2 × t.","s":["$a=(9-5)/1=4$ $\\mathrm{m\\,s^{-2}}$.","$s=\\dfrac{5+17}{2}\\times3$.","$=11\\times3=33$ m → option (A)."],"r":{"1":"27 aata hai agar area galat liya (sirf $3\\ \\mathrm{s}$ × 9).","2":"Acceleration 2 liya, jo galat hai.","3":"51 aata hai agar average ke bajaye max velocity se multiply karo."},"t":"Linear v–t me displacement = (u + v)/2 × t — ye sabse safe shortcut hai.","w":"","fig":{"t":"tab","head":["t (s)","v ($\\mathrm{m\\,s^{-1}}$)"],"rows":[["0","5"],["1","9"],["2","13"],["3","17"]]},"sim":null},{"id":248,"q":"The acceleration-time graph of a body starting from rest is as follows: from t = 0 to t = $2\\ \\mathrm{s}$ a = +$5\\ \\mathrm{m\\,s^{-2}}$; from t = $2\\ \\mathrm{s}$ to t = $4\\ \\mathrm{s}$ a = −$5\\ \\mathrm{m\\,s^{-2}}$. Which one of the following statements about the motion is correct?","opt":["The velocity of the body at t = $4\\ \\mathrm{s}$ is zero and the distance travelled by it in $4\\ \\mathrm{s}$ is $20\\ \\mathrm{m}$.","The velocity of the body decreases continuously from t = 0 to t = $4\\ \\mathrm{s}$.","The maximum velocity of the body is $20\\ \\mathrm{m\\,s^{-1}}$.","The velocity of the body at t = $4\\ \\mathrm{s}$ is $10\\ \\mathrm{m\\,s^{-1}}$."],"ans":0,"c":"a–t area se velocity milti hai: pehle $2\\ \\mathrm{s}$ me +10, agle $2\\ \\mathrm{s}$ me −10 → velocity zero.","m":"Area se velocity track karo, phir v–t ka area se distance.","s":["v: 0 → 10 → 0.","Distance $=2\\times\\tfrac12(2)(10)=20$ m.","Isliye option (A)."],"r":{"3":"t = $4\\ \\mathrm{s}$ par velocity 10 nahi, zero hai.","1":"Velocity pehle $2\\ \\mathrm{s}$ me badhti hai.","2":"Maximum velocity $10\\ \\mathrm{m\\,s^{-1}}$ hai, 20 nahi."},"t":"Symmetric a–t graph (equal positive/negative area) → velocity wapas zero.","w":"","fig":null,"sim":null},{"id":249,"q":"The velocity-time graph of a car is as follows: from t = 0 to t = $10\\ \\mathrm{s}$ the velocity remains constant at $20\\ \\mathrm{m\\,s^{-1}}$; from t = $10\\ \\mathrm{s}$ onwards the brakes are applied and the velocity decreases uniformly at the rate of $2\\ \\mathrm{m\\,s^{-2}}$ until the car stops. The total time taken from t = 0 and the total distance travelled are respectively:","opt":["$20\\ \\mathrm{s}$ and $200\\ \\mathrm{m}$","$20\\ \\mathrm{s}$ and $300\\ \\mathrm{m}$","$20\\ \\mathrm{s}$ and $400\\ \\mathrm{m}$","$15\\ \\mathrm{s}$ and $300\\ \\mathrm{m}$"],"ans":1,"c":"Braking time = v/a; distance = rectangle + triangle.","m":"Do hisse: uniform phase ka area aur braking phase ka area.","s":["Braking time $=20/2=10$ s → total $=10+10=20$ s.","Distance $=20\\times10+\\tfrac12(10)(20)=200+100$.","$=300$ m → option (B)."],"r":{"2":"$400\\ \\mathrm{m}$ aata hai agar braking distance ko rectangle maan lo.","3":"Time $15\\ \\mathrm{s}$ galat hai.","0":"$200\\ \\mathrm{m}$ sirf uniform phase ka distance hai."},"t":"Total distance = uniform phase + braking phase; braking distance = $v^{2}$/2a = $100\\ \\mathrm{m}$.","w":"","fig":null,"sim":null},{"id":250,"q":"The velocity-time graph of a body starting from the origin is a straight line joining the point (t = 0, v = 0) to the point (t = $4\\ \\mathrm{s}$, v = $8\\ \\mathrm{m\\,s^{-1}}$). Which one of the following statements is correct?","opt":["The position-time graph of the body is a parabola passing through the origin and the position at t = $4\\ \\mathrm{s}$ is $16\\ \\mathrm{m}$.","The position-time graph of the body is a parabola passing through the origin and the position at t = $4\\ \\mathrm{s}$ is $32\\ \\mathrm{m}$.","The position-time graph of the body is a straight line and the position at t = $4\\ \\mathrm{s}$ is $8\\ \\mathrm{m}$.","The position-time graph of the body is a straight line and the position at t = $4\\ \\mathrm{s}$ is $32\\ \\mathrm{m}$."],"ans":0,"c":"v–t line origin se → v = 2t → x = $t^{2}$ → parabola; area se x(4) = $16\\ \\mathrm{m}$.","m":"Do cheezein: graph ka shape aur area.","s":["$a=8/4=2$ $\\mathrm{m\\,s^{-2}}$, $x=\\tfrac12(2)t^2=t^2$.","$x(4)=16$ m.","Isliye parabola + $16\\ \\mathrm{m}$ → option (A)."],"r":{"3":"Straight line tab hoti jab velocity constant ho.","1":"$32\\ \\mathrm{m}$ aata hai agar 8 × 4 kar do (rectangle maan lo).","2":"Dono hisse galat hain."},"t":"v–t graph triangular ho to displacement $\\tfrac{1}{2}$ × base × height hota hai.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,0],[4,8]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":251,"q":"A particle moves along the x-axis with velocity v = (4 − $t^{2}$) $\\mathrm{m\\,s^{-1}}$, where t is in second. The distance travelled by the particle in the first $3\\ \\mathrm{s}$ is:","opt":["16/$3\\ \\mathrm{m}$","23/$3\\ \\mathrm{m}$","25/$3\\ \\mathrm{m}$","$3\\ \\mathrm{m}$"],"ans":1,"c":"Velocity ka sign badalta hai (t = 2 par zero), isliye distance ke liye integral ko do hisson me todna padega.","m":"Pehle reversal point nikalo, phir |∫v dt| dono intervals ke liye jodo.","s":["$v=0\\Rightarrow t=2$ s.","0–$2\\ \\mathrm{s}$: $\\int_0^2(4-t^2)dt=8-\\dfrac83=\\dfrac{16}{3}$ m.","2–$3\\ \\mathrm{s}$: $\\left|\\int_2^3(4-t^2)dt\\right|=\\left|(12-9)-\\dfrac{16}{3}\\right|=\\dfrac73$ m. Total $=\\dfrac{16}{3}+\\dfrac73=\\dfrac{23}{3}$ m → option (B)."],"r":{"3":"$3\\ \\mathrm{m}$ sirf net displacement hai (12 − 9).","0":"16/3 sirf pehle hisse ka distance hai.","2":"25/3 galat addition se aata hai."},"t":"Jab v ka sign badle, integration ko reversal point par todo — warna distance galat aayega.","w":"","fig":null,"sim":null},{"id":252,"q":"A particle starts from rest and moves along a straight line with acceleration a = (6 − 2t) $\\mathrm{m\\,s^{-2}}$, where t is in second. The maximum velocity attained by the particle is:","opt":["$6\\ \\mathrm{m\\,s^{-1}}$","$9\\ \\mathrm{m\\,s^{-1}}$","$12\\ \\mathrm{m\\,s^{-1}}$","$18\\ \\mathrm{m\\,s^{-1}}$"],"ans":1,"c":"Maximum velocity tab jab a = 0 (a positive se negative ho jaye).","m":"a = 0 ka time nikalo, phir v = ∫a dt.","s":["$6-2t=0\\Rightarrow t=3$ s.","$v=\\int_0^3(6-2t)dt=[6t-t^2]_0^3$.","$=18-9=9$ $\\mathrm{m\\,s^{-1}}$ → option (B)."],"r":{"0":"6 sirf initial acceleration hai.","2":"12 aata hai agar t = 3 ke bajaye t = 2 lo.","3":"18 aata hai agar $t^{2}$ term chhod do."},"t":"Max velocity ka condition: a = 0 (dv/dt = 0), v = 0 nahi.","w":"","fig":null,"sim":null},{"id":253,"q":"A body covers the first half of the total distance of its journey along a straight line with a speed of $4\\ \\mathrm{m\\,s^{-1}}$ and the second half with a speed v. If the average speed for the whole journey is $6\\ \\mathrm{m\\,s^{-1}}$, the value of v is:","opt":["$8\\ \\mathrm{m\\,s^{-1}}$","$10\\ \\mathrm{m\\,s^{-1}}$","$12\\ \\mathrm{m\\,s^{-1}}$","$14\\ \\mathrm{m\\,s^{-1}}$"],"ans":2,"c":"Equal distance ka average $=\\dfrac{2v_1v_2}{v_1+v_2}$.","m":"Formula me values daalo aur v ke liye solve karo.","s":["$6=\\dfrac{2\\times4\\times v}{4+v}$.","$24+6v=8v$.","$v=12$ $\\mathrm{m\\,s^{-1}}$ → option (C)."],"r":{"0":"8 rakhne par average 5.33 aati hai.","1":"10 rakhne par average 5.71 aati hai.","3":"14 rakhne par 6.22 aati hai."},"t":"Plug-back verification: 2(4)(12)/16 = 6 ✓.","w":"","fig":null,"sim":null},{"id":254,"q":"A car moving with a speed of $30\\ \\mathrm{m\\,s^{-1}}$ is brought to rest by a driver whose reaction time is $0.4\\ \\mathrm{s}$, the brakes then producing a uniform retardation of $5\\ \\mathrm{m\\,s^{-2}}$. The total distance travelled by the car before coming to rest is:","opt":["$108\\ \\mathrm{m}$","$90\\ \\mathrm{m}$","$96\\ \\mathrm{m}$","$102\\ \\mathrm{m}$"],"ans":3,"c":"Total = reaction distance + braking distance.","m":"Dono hisse alag nikaalo.","s":["Reaction: $30\\times0.4=12$ m.","Braking: $\\dfrac{900}{2\\times5}=90$ m.","Total $=102$ m → option (D)."],"r":{"1":"Sirf braking distance $90\\ \\mathrm{m}$ liya.","2":"Reaction distance galat ($6\\ \\mathrm{m}$) liya.","0":"Reaction distance $18\\ \\mathrm{m}$ liya."},"t":"$30\\ \\mathrm{m\\,s^{-1}}$ ($108\\ \\mathrm{km\\,h^{-1}}$) par braking distance $90\\ \\mathrm{m}$ hota hai — speed ka square ka effect hai.","w":"","fig":null,"sim":null},{"id":255,"q":"A body is released from rest from the top of a tower and falls freely. Take g = $10\\ \\mathrm{m\\,s^{-2}}$. The distance travelled by the body in the last second of its fall is equal to the distance travelled by it in the first $3\\ \\mathrm{s}$ of its fall. The total time taken by the body to reach the ground is:","opt":["$7\\ \\mathrm{s}$","$4\\ \\mathrm{s}$","$5\\ \\mathrm{s}$","$6\\ \\mathrm{s}$"],"ans":2,"c":"First $3\\ \\mathrm{s}$ ka distance $45\\ \\mathrm{m}$ hai. Last second ka distance $=5(2n-1)$ hota hai (n = total seconds).","m":"Equation banao aur n solve karo.","s":["First $3\\ \\mathrm{s}$: $\\tfrac12(10)(9)=45$ m.","Last second: $5(2n-1)=45\\Rightarrow2n-1=9$.","$n=5$ s → option (C)."],"r":{"1":"$4\\ \\mathrm{s}$ me last second ka distance $35\\ \\mathrm{m}$ hota hai.","3":"$6\\ \\mathrm{s}$ me $55\\ \\mathrm{m}$ hota hai.","0":"$7\\ \\mathrm{s}$ me $65\\ \\mathrm{m}$ hota hai."},"t":"Last second ka distance free fall me hamesha 5(2n − 1) hota hai.","w":"","fig":null,"sim":null},{"id":256,"q":"A ball is thrown vertically upward from the ground and it passes through a certain point of its path at t = $1\\ \\mathrm{s}$ and again at t = $3\\ \\mathrm{s}$. Take g = $10\\ \\mathrm{m\\,s^{-2}}$. The height of that point above the ground is:","opt":["$10\\ \\mathrm{m}$","$15\\ \\mathrm{m}$","$20\\ \\mathrm{m}$","$25\\ \\mathrm{m}$"],"ans":1,"c":"Symmetry: highest point t = $2\\ \\mathrm{s}$ par hai, isliye u = $20\\ \\mathrm{m\\,s^{-1}}$.","m":"Phir kisi bhi passage time par height nikaal lo.","s":["$t_{top}=(1+3)/2=2$ s → $u=g\\times2=20$ $\\mathrm{m\\,s^{-1}}$.","$h=20(1)-\\tfrac12(10)(1)^2$.","$=20-5=15$ m → option (B)."],"r":{"0":"$10\\ \\mathrm{m}$ aata hai agar 5$t^{2}$ term ko 10 maan lo.","2":"$20\\ \\mathrm{m}$ maximum height ka aadha nahi; yahan H = $20\\ \\mathrm{m}$ hai, point $15\\ \\mathrm{m}$ par.","3":"$25\\ \\mathrm{m}$ maximum height ($20\\ \\mathrm{m}$) se bhi zyada hai."},"t":"Highest point ka time = do passages ka average. Phir height usi se nikal lo.","w":"","fig":null,"sim":null},{"id":257,"q":"Two trains, one of length $150\\ \\mathrm{m}$ moving with a speed of $72\\ \\mathrm{km\\,h^{-1}}$ and the other of length $250\\ \\mathrm{m}$ moving with a speed of $54\\ \\mathrm{km\\,h^{-1}}$, approach each other on parallel tracks. The time taken by them to completely cross each other is:","opt":["$8\\ \\mathrm{s}$","80/$7\\ \\mathrm{s}$","$12\\ \\mathrm{s}$","40/$3\\ \\mathrm{s}$"],"ans":1,"c":"Opposite direction → relative speed sum; total length dono lengths ka sum.","m":"Pehle speeds ko $\\mathrm{m\\,s^{-1}}$ me badlo.","s":["$72$ $\\mathrm{km\\,h^{-1}}$ $=20$ $\\mathrm{m\\,s^{-1}}$, $54$ $\\mathrm{km\\,h^{-1}}$ $=15$ $\\mathrm{m\\,s^{-1}}$.","Relative speed $=35$ $\\mathrm{m\\,s^{-1}}$, total length $=400$ m.","$t=400/35=\\dfrac{80}{7}\\approx11.4$ s → option (B)."],"r":{"0":"Speeds ko convert na karke 400/50 jaisa hisaab.","2":"$12\\ \\mathrm{s}$ aata hai agar total length 420 lo.","3":"Relative speed ki jagah 30 liya."},"t":"$72\\ \\mathrm{km\\,h^{-1}}$ = $20\\ \\mathrm{m\\,s^{-1}}$ aur $54\\ \\mathrm{km\\,h^{-1}}$ = $15\\ \\mathrm{m\\,s^{-1}}$ — ye conversions rat lo.","w":"","fig":null,"sim":null},{"id":258,"q":"A balloon starts from rest from the ground and rises vertically with a constant upward acceleration of $4\\ \\mathrm{m\\,s^{-2}}$. After $5\\ \\mathrm{s}$ a stone is released from the balloon. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the maximum height above the ground reached by the stone is:","opt":["$60\\ \\mathrm{m}$","$70\\ \\mathrm{m}$","$90\\ \\mathrm{m}$","$50\\ \\mathrm{m}$"],"ans":1,"c":"Release ke waqt stone ki velocity aur height dono nikaalo; phir extra height $u^{2}$/$2\\ \\mathrm{g}$.","m":"Do steps: balloon ka motion, phir stone ka ascent.","s":["$v=4\\times5=20$ $\\mathrm{m\\,s^{-1}}$, $h=\\tfrac12(4)(25)=50$ m.","Extra height $=\\dfrac{400}{20}=20$ m.","Max height $=50+20=70$ m → option (B)."],"r":{"3":"Sirf release height $50\\ \\mathrm{m}$ liya.","0":"$60\\ \\mathrm{m}$ aata hai agar extra height 10 lo.","2":"$90\\ \\mathrm{m}$ aata hai agar g ki jagah galat value use ho."},"t":"Max height = release height + $u^{2}$/$2\\ \\mathrm{g}$. Release height add karna mat bhoolo.","w":"","fig":null,"sim":null},{"id":259,"q":"A particle moves along the x-axis such that the square of its velocity is given by $v^{2}$ = 4x. The acceleration of the particle at x = $4\\ \\mathrm{m}$ is:","opt":["$8\\ \\mathrm{m\\,s^{-2}}$","$1\\ \\mathrm{m\\,s^{-2}}$","$2\\ \\mathrm{m\\,s^{-2}}$","$4\\ \\mathrm{m\\,s^{-2}}$"],"ans":2,"c":"$v^2=4x$ ko differentiate karo, ya $a=v\\dfrac{dv}{dx}$ use karo.","m":"$2v\\dfrac{dv}{dx}=4\\Rightarrow v\\dfrac{dv}{dx}=2$ → acceleration constant 2.","s":["$a=v\\dfrac{dv}{dx}$.","$2v\\,dv/dx=4\\Rightarrow a=2$ $\\mathrm{m\\,s^{-2}}$.","x ki value se koi farq nahi → option (C)."],"r":{"1":"1 aata hai agar 4 ko 4 se divide jaisa galat karo.","3":"4 sirf constant hai formula me.","0":"8 aata hai agar x = 4 se multiply kar do — acceleration constant hai."},"t":"$v^2=kx$ jaisa form ho to acceleration constant hota hai (k/2).","w":"","fig":null,"sim":null},{"id":260,"q":"The velocity-time graph of a body consists of three straight-line segments: from t = 0 to t = $10\\ \\mathrm{s}$ the velocity increases uniformly from 0 to $20\\ \\mathrm{m\\,s^{-1}}$; from t = $10\\ \\mathrm{s}$ to t = $20\\ \\mathrm{s}$ the velocity remains constant at $20\\ \\mathrm{m\\,s^{-1}}$; from t = $20\\ \\mathrm{s}$ to t = $30\\ \\mathrm{s}$ the velocity decreases uniformly to 0. The average velocity of the body for the whole journey is:","opt":["$10\\ \\mathrm{m\\,s^{-1}}$","$13.3\\ \\mathrm{m\\,s^{-1}}$","$16.7\\ \\mathrm{m\\,s^{-1}}$","$20\\ \\mathrm{m\\,s^{-1}}$"],"ans":1,"c":"Average velocity = total area / total time.","m":"Pehle area (100 + 200 + 100), phir $30\\ \\mathrm{s}$ se divide.","s":["Area $=100+200+100=400$ m.","$v_{avg}=400/30$.","$=13.3$ $\\mathrm{m\\,s^{-1}}$ → option (B)."],"r":{"0":"$10\\ \\mathrm{m\\,s^{-1}}$ kisi ek segment ka average hai.","2":"16.7 aata hai agar $24\\ \\mathrm{s}$ se divide karo.","3":"$20\\ \\mathrm{m\\,s^{-1}}$ maximum velocity hai, average nahi."},"t":"Average velocity ke liye hamesha total area / total time — maximum velocity nahi.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,0],[10,20],[20,20],[30,0]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":261,"q":"A particle moves along the x-axis such that x = $t^{3}$ − 3$t^{2}$. The distance travelled by the particle in the first $3\\ \\mathrm{s}$ is:","opt":["$4\\ \\mathrm{m}$","$8\\ \\mathrm{m}$","$12\\ \\mathrm{m}$","0"],"ans":1,"c":"$v=3t^2-6t=3t(t-2)$ — reversal t = 2 par.","m":"x(0), x(2), x(3) nikaalo, phir |changes| jodo.","s":["$x(0)=0$, $x(2)=8-12=-4$, $x(3)=27-27=0$.","Distance $=4+4$.","$=8$ m → option (B)."],"r":{"3":"0 displacement hai, distance nahi.","0":"4 sirf ek segment ka distance hai.","2":"12 galat addition se aata hai."},"t":"Reversal point par position ka sign badalna distance ko double kar deta hai.","w":"","fig":null,"sim":null},{"id":262,"q":"A body is released from rest from a height h and falls freely. If $t_1$ is the time taken to cover the first half of the distance and $t_2$ the time taken to cover the second half, then $t_1$ : $t_2$ is:","opt":["1 : $\\sqrt{2}$","1 : 1","1 : ($\\sqrt{2}$ − 1)","($\\sqrt{2}$ − 1) : 1"],"ans":2,"c":"h/2 ke liye $t_1$ = $\\sqrt{h/g}$; poore h ke liye T = $\\sqrt{2h/g}$.","m":"Ratio nikaalo: $t_1$ : (T − $t_1$).","s":["$t_1=\\sqrt{h/g}$, $T=\\sqrt{2h/g}=\\sqrt2\\,t_1$.","$t_2=T-t_1=(\\sqrt2-1)t_1$.","$t_1:t_2=1:(\\sqrt2-1)$ → option (C)."],"r":{"1":"Equal time nahi hota — distance ∝ $t^{2}$ hai.","3":"Ratio ulta ho gaya.","0":"1 : $\\sqrt{2}$ total ti
