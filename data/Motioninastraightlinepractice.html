egative.","w":"","fig":null,"sim":null},{"id":60,"q":"A body starts from rest and moves with uniform acceleration along a straight line. The ratio of the distance travelled by it in the first second to that travelled in the third second is:","opt":["5 : 1","1 : 9","1 : 3","1 : 5"],"ans":3,"c":"Rest se start: $S_n=\\tfrac{a}{2}(2n-1)$. Pehle second me n = 1, teesre second me n = 3.","m":"Ratio ke liye a/2 cancel ho jayega, sirf (2n − 1) ka ratio bachega.","s":["$S_1=\\tfrac{a}{2}(2\\times1-1)=\\tfrac{a}{2}$.","$S_3=\\tfrac{a}{2}(2\\times3-1)=\\tfrac{5a}{2}$.","Ratio $=1:5$ → option (D)."],"r":{"2":"1 : 3 successive seconds ka ratio hai ($S_{1}$ : $S_{2}$), teesre second ka nahi.","0":"Ratio ulta likh diya — pehla second chhota hota hai.","1":"1 : 9 total distance wala ratio hai ($1\\ \\mathrm{s}$ vs $3\\ \\mathrm{s}$), nth second ka nahi."},"t":"Do ratios ko mix mat karo: nth second → 1 : 3 : 5 : 7; total n seconds → 1 : 4 : 9.","w":"","fig":null,"sim":null},{"id":61,"q":"A car moving with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ can be stopped by applying brakes in a distance of $40\\ \\mathrm{m}$. If the same car moves with a speed of $40\\ \\mathrm{m\\,s^{-1}}$ and the same retardation is produced by the brakes, the stopping distance will be:","opt":["$320\\ \\mathrm{m}$","$80\\ \\mathrm{m}$","$120\\ \\mathrm{m}$","$160\\ \\mathrm{m}$"],"ans":3,"c":"Stopping distance me final velocity zero hoti hai: $s=u^2/(2a)$, isliye s ∝ $u^{2}$.","m":"Ratio method lagao — a same hai, to $s_2/s_1=(u_2/u_1)^2$.","s":["$\\dfrac{s_2}{s_1}=\\left(\\dfrac{40}{20}\\right)^2=4$.","$s_2=4\\times40$.","$=160\\ \\mathrm{m}$ → option (D)."],"r":{"1":"Speed double → distance double maan liya; par s ∝ $u^{2}$ hai.","2":"120 kisi bhi rule se nahi aata.","0":"320 aata hai agar 8 se multiply karo — square ka rule galat lagaya."},"t":"Stopping distance ∝ $v^{2}$ — speed 2× → distance 4×, speed 3× → distance 9×.","w":"","fig":null,"sim":null},{"id":62,"q":"The position of a particle moving along the x-axis varies with time as x = 6t − $t^{2}$, where x is in metre and t is in second. The particle reverses its direction of motion at:","opt":["t = $1.5\\ \\mathrm{s}$","t = $6\\ \\mathrm{s}$","t = $2\\ \\mathrm{s}$","t = $3\\ \\mathrm{s}$"],"ans":3,"c":"Direction reversal tab hota hai jab velocity zero ho kar sign badalti hai (acceleration zero nahi).","m":"v = dx/dt nikaalo, v = 0 ka time solve karo.","s":["$v=\\dfrac{dx}{dt}=6-2t$.","$v=0\\Rightarrow 6-2t=0$.","$t=3\\ \\mathrm{s}$ → option (D)."],"r":{"2":"$2\\ \\mathrm{s}$ par $v=2$ $\\mathrm{m\\,s^{-1}}$ hai, zero nahi.","0":"$1.5\\ \\mathrm{s}$ speed ka koi special point nahi hai.","1":"$6\\ \\mathrm{s}$ par position zero hoti hai, velocity nahi."},"t":"Reversal sirf velocity zero par hota hai — position zero hone se direction nahi badalti.","w":"","fig":null,"sim":null},{"id":63,"q":"A body covers the first half of the total time of its journey with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ and the second half of the total time with a speed of $40\\ \\mathrm{m\\,s^{-1}}$. Consider the following statements:\nI. The average speed for the whole journey is $30\\ \\mathrm{m\\,s^{-1}}$.\nII. If instead the body had covered the first half of the distance at $20\\ \\mathrm{m\\,s^{-1}}$ and the second half of the distance at $40\\ \\mathrm{m\\,s^{-1}}$, the average speed would have been less than $30\\ \\mathrm{m\\,s^{-1}}$.\nIII. If the body had covered the first half of the distance at $20\\ \\mathrm{m\\,s^{-1}}$ and the second half at $40\\ \\mathrm{m\\,s^{-1}}$, the average speed would have been exactly $30\\ \\mathrm{m\\,s^{-1}}$.\nIV. During the first half of the total time, the average speed of the body is $20\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["I, III and IV only","II, III and IV only","I, II and III only","I, II and IV only"],"ans":3,"c":"Time ke half me chalne par speeds ka simple average chalta hai. Distance ke half par harmonic-type average chalta hai: $v=\\dfrac{2v_1v_2}{v_1+v_2}$, jo simple average se kam hota hai.","m":"Do cases alag-alag likho: equal time aur equal distance. Dono ka formula compare karo.","s":["Equal time: $v_{avg}=\\dfrac{20+40}{2}=30$ $\\mathrm{m\\,s^{-1}}$ → I true.","Equal distance: $v_{avg}=\\dfrac{2(20)(40)}{60}=26.67$ $\\mathrm{m\\,s^{-1}}$ < 30 → II true, III false.","IV: pehle half time me speed 20 hi thi → true.","True set = I, II, IV → option (D)."],"r":{"0":"Isme III galat hai — equal distance par average 30 nahi, 26.67 aata hai.","1":"Isme III hai aur I chhoot gaya.","2":"Isme III hai — eliminate."},"t":"Equal time → simple average; equal distance → $\\dfrac{2v_1v_2}{v_1+v_2}$. Ye difference NEET ka hot topic hai.","w":"","fig":null,"sim":null},{"id":64,"q":"A ball is thrown vertically upward and returns to the point of projection. Air resistance is neglected. Consider the following statements:\nI. The velocity of the ball decreases uniformly during the ascent and increases uniformly during the descent.\nII. The speed of the ball at a given height is the same while going up and while coming down.\nIII. The acceleration of the ball reverses its direction at the highest point.\nIV. The position-time graph of the ball is a parabola.\nThe correct statements are:","opt":["I, III and IV only","II, III and IV only","I, II and III only","I, II and IV only"],"ans":3,"c":"Throw ke baad sirf gravity: a = g downward hamesha. Isliye upar jaate speed ghatti hai, neeche aate badhti hai — dono same rate se.","m":"Statement III classical trap hai: acceleration direction highest point par nahi badalta.","s":["I: constant a = −g → uniform decrease/increase → true.","II: same height par $v^2=u^2-2gh$ → same speed → true.","III: a = g downward throughout → false.","IV: $y=ut-\\tfrac12gt^2$ parabola → true.","True set = I, II, IV → option (D)."],"r":{"0":"Isme III galat hai.","1":"Isme III hai aur I chhoot gaya.","2":"Isme III hai — eliminate."},"t":"Acceleration kabhi reverse nahi hota; sirf velocity reverse hoti hai.","w":"","fig":null,"sim":null},{"id":65,"q":"A body starts from rest and moves along a straight line with uniform acceleration a. Consider the following statements:\nI. The distances travelled by it in the first, second and third seconds are in the ratio 1 : 3 : 5.\nII. The distances travelled by it in $1\\ \\mathrm{s}$, $2\\ \\mathrm{s}$ and $3\\ \\mathrm{s}$ are in the ratio 1 : 4 : 9.\nIII. The distance travelled by it in the nth second is a(2n − 1)/2.\nIV. The distance travelled by it in the nth second is proportional to $n^{2}$.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and III only","I, II and IV only"],"ans":2,"c":"Rest se uniform acceleration me $S_n=\\tfrac{a}{2}(2n-1)$ aur total $s_n=\\tfrac12an^2$.","m":"III ko base formula maano, usse I aur II derive karo, IV check karo.","s":["III: $S_n=\\tfrac{a}{2}(2n-1)$ → true.","I: n = 1, 2, 3 → 1 : 3 : 5 → true.","II: total n seconds me $n^2$ ka ratio → 1 : 4 : 9 → true.","IV: $S_n\\propto(2n-1)$, $n^{2}$ ke proportional nahi → false.","True set = I, II, III → option (C)."],"r":{"3":"Isme IV galat hai ($n^{2}$ total distance wala ratio hai).","0":"Isme IV hai aur I chhoot gaya.","1":"Isme IV hai — eliminate."},"t":"$S_n\\propto(2n-1)$ aur $s\\propto t^2$ — dono alag hain, isi par statement questions bante hain.","w":"","fig":null,"sim":null},{"id":66,"q":"Consider the following statements about relative velocity in one dimension:\nI. Two cars moving in the same direction with speeds $20\\ \\mathrm{m\\,s^{-1}}$ and $30\\ \\mathrm{m\\,s^{-1}}$ have a relative speed of $10\\ \\mathrm{m\\,s^{-1}}$.\nII. Two cars moving in opposite directions with speeds $20\\ \\mathrm{m\\,s^{-1}}$ and $30\\ \\mathrm{m\\,s^{-1}}$ have a relative speed of $50\\ \\mathrm{m\\,s^{-1}}$.\nIII. The relative velocity of A with respect to B is the negative of the relative velocity of B with respect to A.\nIV. The relative velocity of two bodies moving in the same direction with equal speeds is 2v.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":3,"c":"$v_{AB}=v_A-v_B$. Same direction me difference, opposite direction me signs ki wajah se sum ban jata hai.","m":"Har statement me numbers ya definition daal kar check karo.","s":["I: 30 − 20 = 10 → true.","II: 20 − (−30) = 50 → true.","III: $v_{AB}=-v_{BA}$ → true.","IV: v − v = 0, 2v nahi → false.","True set = I, II, III → option (D)."],"r":{"0":"Isme IV galat hai.","1":"Isme IV hai aur I chhoot gaya.","2":"Isme IV hai — eliminate."},"t":"Same direction → subtract, opposite → add. Ek hi formula se dono nikalte hain (sign ke saath).","w":"","fig":null,"sim":null},{"id":67,"q":"Consider the following statements about the reaction time of a driver and the stopping distance of a vehicle:\nI. During the reaction time the vehicle moves with uniform velocity equal to the velocity it had when the driver first saw the obstacle.\nII. The total stopping distance is the sum of the distance travelled during the reaction time and the braking distance.\nIII. The distance travelled during the reaction time is proportional to the square of the velocity of the vehicle.\nIV. For the same initial velocity, a larger retardation produced by the brakes gives a smaller stopping distance.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and IV only","I, II and III only"],"ans":2,"c":"Reaction time me brake lag hi nahi hota, isliye speed constant rehti hai (distance = v·t(r)). Braking me retardation kaam karta hai (distance = $v^{2}$/2a).","m":"Reaction distance aur braking distance ke formulas alag likho, phir statements check karo.","s":["I: speed constant → true.","II: total = reaction distance + braking distance → true.","III: reaction distance = $v\\,t_r$, yaani v ke proportional, $v^{2}$ ke nahi → false.","IV: $v^2/(2a)$ me a bada → distance chhota → true.","True set = I, II, IV → option (C)."],"r":{"3":"Isme III galat hai.","0":"Isme III hai — eliminate.","1":"Isme III hai aur II chhoot gaya."},"t":"Reaction distance ∝ v, braking distance ∝ $v^{2}$. Do alag proportionality yaad rakho.","w":"","fig":null,"sim":null},{"id":68,"q":"The position of a particle moving along a straight line is x = 4$t^{2}$ − 2t + 1, where x is in metre and t is in second. Consider the following statements:\nI. The velocity of the particle at t = $1\\ \\mathrm{s}$ is $6\\ \\mathrm{m\\,s^{-1}}$.\nII. The acceleration of the particle is constant and equal to $8\\ \\mathrm{m\\,s^{-2}}$.\nIII. The particle reverses its direction of motion at t = $0.25\\ \\mathrm{s}$.\nIV. The acceleration of the particle at t = 0 is zero.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":3,"c":"$v=dx/dt=8t-2$ aur $a=dv/dt=8$. Isliye acceleration constant 8 hai, iska t = 0 par bhi same value rahega.","m":"Derivative do baar lo, phir har statement ko value daal kar check karo.","s":["$v=8t-2$; t = 1 par $v=6$ → I true.","$a=8$, constant → II true.","$v=0\\Rightarrow 8t=2\\Rightarrow t=0.25$ s → III true.","IV false, kyunki a = 8 hamesha (t = 0 par bhi).","True set = I, II, III → option (D)."],"r":{"0":"Isme IV galat hai — acceleration 8 hai, zero nahi.","1":"Isme IV hai aur I chhoot gaya.","2":"Isme IV hai — eliminate."},"t":"Quadratic position → constant acceleration. Isliye IV jaise statements turant check ho jate hain.","w":"","fig":null,"sim":null},{"id":69,"q":"Consider the following statements about frames of reference:\nI. The frame of reference attached to a car moving with constant velocity along a straight road is approximately inertial.\nII. The frame of reference attached to a car taking a turn with constant speed is non-inertial.\nIII. Newton's laws of motion hold exactly in a non-inertial frame without the introduction of any pseudo force.\nIV. A frame of reference moving with uniform velocity with respect to an inertial frame is also inertial.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and IV only","I, II and III only"],"ans":2,"c":"Inertial frame = no acceleration (rest ya constant velocity). Turn lena ya speed change karna = acceleration = non-inertial.","m":"Statement III definition ke ulta hai — non-inertial frame me pseudo force lagti hai.","s":["I: constant velocity → inertial → true.","II: turn me direction change → acceleration → non-inertial → true.","III: non-inertial me pseudo force chahiye → false.","IV: uniform velocity wala frame bhi inertial → true.","True set = I, II, IV → option (C)."],"r":{"3":"Isme III galat hai.","0":"Isme III hai aur I chhoot gaya.","1":"Isme III hai — eliminate."},"t":"Frame inertial hai ya nahi — sirf ek sawaal: uska acceleration zero hai kya?","w":"","fig":null,"sim":null},{"id":70,"q":"A body starting from rest moves along a straight line with uniform acceleration. Consider the following statements about its graphs:\nI. The velocity-time graph is a straight line passing through the origin.\nII. The position-time graph is a parabola opening upward.\nIII. The position-time graph is a straight line inclined to the time axis.\nIV. The acceleration-time graph is a straight line parallel to the time axis at a non-zero value.\nThe correct statements are:","opt":["I, III and IV only","II, III and IV only","I, II and III only","I, II and IV only"],"ans":3,"c":"u = 0, a constant: v = at (origin se guzarne wali line), $x=\\tfrac12at^2$ (upward parabola), a–t graph horizontal line.","m":"Teeno graphs ka shape u = 0 ke saath likho, phir statements match karo.","s":["I: v = at → origin se line → true.","II: x ∝ $t^{2}$ → upward parabola → true.","III: straight line hoti to uniform velocity hoti → false.","IV: a constant → horizontal line → true.","True set = I, II, IV → option (D)."],"r":{"0":"Isme III galat hai.","1":"Isme III hai aur I chhoot gaya.","2":"Isme III hai — eliminate."},"t":"u = 0 ho to v–t line origin se guzarti hai; u ≠ 0 ho to y-intercept par se.","w":"","fig":null,"sim":null},{"id":71,"q":"A balloon is ascending vertically with a constant velocity of $10\\ \\mathrm{m\\,s^{-1}}$ and is at a height of $20\\ \\mathrm{m}$ above the ground when a stone is released from it. Take g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglect air resistance. Consider the following statements:\nI. Immediately after release, the stone continues to move upward for some time.\nII. Immediately after release, the acceleration of the stone is $10\\ \\mathrm{m\\,s^{-2}}$ directed downward.\nIII. The stone strikes the ground with a speed of $10\\ \\mathrm{m\\,s^{-1}}$.\nIV. The time taken by the stone to reach the ground is greater than the time it would have taken if it had been released from rest at the same height.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and IV only","I, II and III only"],"ans":2,"c":"Balloon se nikli cheez balloon ki velocity carry karti hai. Release ke baad sirf gravity: a = g downward. To stone pehle upar jayegi, phir neeche.","m":"Release ke instant par velocity aur acceleration alag-alag likho — dono confuse mat karo.","s":["I: initial velocity 10 upar hai → kuch der upar jayegi → true.","II: a = g downward → true.","III: ground par $v=\\sqrt{100+400}\\approx22.4$ $\\mathrm{m\\,s^{-1}}$, 10 nahi → false.","IV: upar ja kar wapas aati hai, isliye zyada time → true.","True set = I, II, IV → option (C)."],"r":{"3":"Isme III galat hai — speed 10 se kaafi zyada hoti hai.","0":"Isme III hai aur I chhoot gaya.","1":"Isme III hai — eliminate."},"t":"Balloon/tower problems me initial velocity aur acceleration ko alag-alag likho — 80% galti yahin hoti hai.","w":"","fig":null,"sim":null},{"id":72,"q":"Consider the following statements about motion with variable acceleration:\nI. If the acceleration of a body starting from rest is a = 2t, its velocity at t = $3\\ \\mathrm{s}$ is $9\\ \\mathrm{m\\,s^{-1}}$.\nII. When the acceleration is constant, the velocity-time graph is a straight line.\nIII. The area under an acceleration-time graph between two instants gives the change in velocity during that interval.\nIV. The equations of uniformly accelerated motion can be applied directly even when the acceleration varies with position.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":3,"c":"Variable acceleration me integration: $v=\\int a\\,dt$. Constant a me simple equations chalti hain.","m":"I ko integrate karke verify karo; IV statement definition se galat hai.","s":["I: $v=\\int2t\\,dt=t^2$; t = 3 par $9\\ \\mathrm{m\\,s^{-1}}$ → true.","II: a constant → v linear → straight line → true.","III: a–t area = $\\Delta v$ → true.","IV: variable a me standard equations invalid → false.","True set = I, II, III → option (D)."],"r":{"0":"Isme IV galat hai.","1":"Isme IV hai aur I chhoot gaya.","2":"Isme IV hai — eliminate."},"t":"$\\int a\\\\,dt=\\Delta v$, $\\int v\\\\,dt=\\Delta s$ — ye do lines variable acceleration ke saare questions solve kar deti hain.","w":"","fig":null,"sim":null},{"id":73,"q":"Which one of the following statements is NOT correct?","opt":["Average speed is the total path length divided by the total time taken.","Average velocity is the net displacement divided by the total time taken.","The magnitude of the average velocity of a body can exceed its average speed.","The average velocity of a body can be zero while its average speed is non-zero."],"ans":2,"c":"Average speed = path/time, average velocity = displacement/time. Path ≥ |displacement|, isliye average speed ≥ |average velocity|.","m":"Inequality ki direction check karo — option C ulta statement de raha hai.","s":["A: sahi definition.","B: sahi definition.","C: |average velocity| ≤ average speed hota hai, 'exceed' galat → NOT correct.","D: return journey me possible → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi statement hai.","1":"Ye bhi sahi statement hai.","3":"Return journey me average velocity zero aur speed non-zero hoti hai."},"t":"Ek hi inequality yaad rakho: |v_avg| ≤ average speed. Isse aadhe options kat jate hain.","w":"","fig":null,"sim":null},{"id":74,"q":"Which one of the following statements about instantaneous velocity is correct?","opt":["It is the slope of the acceleration-time graph at that instant.","It is always equal to the average velocity over the complete motion.","It is the slope of the position-time graph at that instant.","It is the area under the position-time graph up to that instant."],"ans":2,"c":"Instantaneous velocity = $dx/dt$ = position-time graph ke tangent ka slope.","m":"Definition ko graph se jodo: derivative = slope.","s":["$v=dx/dt$ → x–t graph ka slope.","Area ka matlab integral hota hai, derivative nahi.","a–t graph ka slope jerk deta hai.","Average velocity poore interval ki hoti hai, instant ki nahi.","Isliye option (C)."],"r":{"3":"x–t graph ka area ka koi physical meaning hi nahi.","0":"a–t ka slope jerk hai (da/dt), velocity nahi.","1":"Instantaneous velocity har instant badalti hai; average ek hi value hoti hai."},"t":"Derivative = slope, integral = area. Ye ek line poore graph chapter ki jaan hai.","w":"","fig":null,"sim":null},{"id":75,"q":"Which one of the following statements about an acceleration-time graph is NOT correct?","opt":["A straight line parallel to the time axis represents uniform acceleration.","A straight line coinciding with the time axis represents zero acceleration.","The area under the graph between two instants gives the change in position.","The slope of the graph gives the rate of change of acceleration."],"ans":2,"c":"a–t graph ka area $\\Delta v$ deta hai (velocity ka change), position ka change nahi.","m":"Area ka dimension check karo: a × t ka unit velocity ka hai.","s":["A: horizontal line → a constant → sahi.","B: a = 0 → sahi.","C: area = $\\Delta v$, position nahi → NOT correct.","D: da/dt = jerk → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi statement hai.","1":"Ye bhi sahi hai.","3":"Slope ka meaning sahi bataya gaya hai."},"t":"Area ka dimension hamesha check karo — isi se pata chal jata hai kaun si quantity milegi.","w":"","fig":null,"sim":null},{"id":76,"q":"Which one of the following statements about the relation $v^{2}$ = $u^{2}$ + 2as is correct?","opt":["It is valid only when the initial velocity of the body is zero.","It is valid only for bodies moving vertically under gravity.","It is valid even when the acceleration of the body varies with position.","It is valid only for uniformly accelerated motion along a straight line and does not involve time explicitly."],"ans":3,"c":"Ye equation t ko eliminate karke banti hai, isliye jahan time nahi diya ho wahan best hai. Valid sirf constant a ke liye.","m":"Condition (uniform a) aur feature (no time) dono check karo.","s":["D: uniform acceleration + time nahi → sahi.","A: u ≠ 0 par bhi valid hai → galat.","B: kisi bhi direction me valid hai → galat.","C: variable a me invalid → galat.","Isliye option (D)."],"r":{"0":"u = 0 sirf special case hai; equation general hai.","1":"Horizontal motion me bhi ye equation chalti hai.","2":"Variable acceleration me ye equation galat answer degi."},"t":"Jab question me time na ho, $v^2=u^2+2as$ chuno — calculation aadha ho jata hai.","w":"","fig":null,"sim":null},{"id":77,"q":"Which one of the following statements about a velocity-time graph is NOT correct?","opt":["A straight line with positive slope represents positive acceleration.","A straight line with negative slope, where the velocity is still positive, represents slowing down of the body.","The area between the graph and the time axis is always taken as positive, whether the graph lies above or below the time axis.","The total displacement is the algebraic sum of the areas above and below the time axis."],"ans":2,"c":"v–t graph me time axis ke neeche wala area negative displacement deta hai. Isliye area ka sign ignore karna galat hai.","m":"Statement C aur D ek dusre ke contradiction hain — dono sach nahi ho sakte.","s":["A: slope positive → a positive → sahi.","B: v positive, a negative → speed ghat rahi → sahi.","C: neeche ka area negative lena padta hai → NOT correct.","D: algebraic sum hi displacement deta hai → sahi.","Isliye option (C)."],"r":{"0":"Slope ka meaning sahi hai.","1":"Ye bhi sahi hai — velocity aur acceleration opposite sign par speed ghatti hai.","3":"Displacement algebraic sum hi hota hai."},"t":"Distance ke liye |area| jodo, displacement ke liye signed area jodo.","w":"","fig":null,"sim":null},{"id":78,"q":"Which one of the following statements is correct?","opt":["If the acceleration of a body is zero, the body must necessarily be at rest.","If the velocity of a body is zero at an instant, its acceleration must also be zero at that instant.","A body moving along a straight line with constant speed must have non-zero acceleration.","A body may have zero acceleration while moving with a non-zero constant velocity."],"ans":3,"c":"a = 0 ka matlab velocity constant hai — wo zero bhi ho sakti hai aur non-zero bhi. Isliye a = 0 se rest nahi nikalta.","m":"Har option me 'must' word dhundo — jo ek counter-example se toot jaye wo galat.","s":["A: a = 0 par uniform velocity bhi possible → galat.","B: highest point par v = 0 par a = g → galat.","C: constant speed straight line me a = 0 → galat.","D: uniform velocity → a = 0, v ≠ 0 → sahi.","Isliye option (D)."],"r":{"0":"Uniform motion me acceleration zero hota hai, body rest nahi hoti.","1":"Vertical throw ke highest point par v = 0 par a = g hai.","2":"Straight line + constant speed → velocity constant → a = 0."},"t":"'a = 0' ≠ 'rest'. Ye confusion NEET ke assertion-reason me bhi aata hai.","w":"","fig":null,"sim":null},{"id":79,"q":"Which one of the following statements about free fall, with air resistance neglected, is NOT correct?","opt":["The acceleration of a freely falling body does not depend on its mass.","A body released from rest falls through distances proportional to the square of the time of fall.","A body thrown vertically upward has zero acceleration at the highest point of its path.","For a body thrown vertically upward from the ground, the time of ascent equals the time of descent."],"ans":2,"c":"Free fall me a = g hamesha. Highest point par velocity zero hoti hai, acceleration nahi.","m":"Statement C dobara wahi classic trap hai — highest point par a = g.","s":["A: a = g, mass independent → sahi.","B: $h=\\tfrac12gt^2$ → sahi.","C: a = g ≠ 0 at highest point → NOT correct.","D: symmetry se barabar → sahi.","Isliye option (C)."],"r":{"0":"g mass par depend nahi karta — feather aur coin vacuum me saath girte hain.","1":"h ∝ $t^{2}$ — ye sahi hai.","3":"Same acceleration ki wajah se time barabar hota hai."},"t":"Highest point = velocity zero, acceleration g. Isse yaad rakho, ulta nahi.","w":"","fig":null,"sim":null},{"id":80,"q":"A body is thrown vertically upward from the ground and returns to the point of projection. Taking the height attained as H, which one of the following statements is correct?","opt":["Its displacement and distance travelled are both zero.","Its displacement is zero and the distance travelled is H.","Its displacement is zero and the distance travelled is 2H.","Its displacement is 2H and the distance travelled is zero."],"ans":2,"c":"Wapas starting point par aana = displacement zero. Path upar H aur neeche H = 2H distance.","m":"Distance me dono legs (upar + neeche) add hoti hain, displacement me sirf net.","s":["Upar H, neeche H → distance 2H.","Initial = final position → displacement 0.","Isliye option (C)."],"r":{"3":"Displacement zero hai, 2H nahi.","0":"Distance 2H hai, zero nahi.","1":"Distance me return path bhi ginti hai, isliye H nahi 2H."},"t":"Vertical throw me distance = 2H, displacement = 0. Ye jodi exam me bahut poochhi jati hai.","w":"","fig":null,"sim":null},{"id":81,"q":"For a body thrown vertically upward with speed u from the ground, with air resistance neglected, which one of the following statements is NOT correct?","opt":["The maximum height is H = $u^{2}$/$2\\ \\mathrm{g}$.","The total time of flight is T = 2u/g.","The maximum height can be written as H = $gT^{2}$/8, where T is the total time of flight.","For a given speed of projection u, the maximum height is independent of the value of g."],"ans":3,"c":"$H=u^2/2g$ me g denominator me hai, isliye g badalne par H badalta hai.","m":"Option C ko verify karo: T = 2u/g rakho aur check karo ki H milta hai ya nahi.","s":["A: sahi.","B: sahi.","C: $gT^2/8=g(4u^2/g^2)/8=u^2/2g=H$ → sahi.","D: H g par depend karta hai → NOT correct.","Isliye option (D)."],"r":{"0":"Ye standard result hai.","1":"Ye bhi standard result hai.","2":"Substitution se ye sahi nikalta hai."},"t":"H = $gT^{2}$/8 yaad rakho — jab sirf total time diya ho to yahi shortcut hai.","w":"","fig":null,"sim":null},{"id":82,"q":"Which one of the following statements about the distance travelled by a body in the nth second of its motion is correct?","opt":["For a body starting from rest with uniform acceleration, it is proportional to $n^{2}$.","It is independent of the acceleration of the body.","It is equal to the total distance travelled by the body in n seconds.","For a body starting from rest with uniform acceleration, it depends linearly on n."],"ans":3,"c":"Rest se: $S_n=\\tfrac{a}{2}(2n-1)=a\\,n-\\tfrac{a}{2}$ — ye n me linear hai.","m":"Formula ko n ke terms me likho aur dekho ki kis power me hai.","s":["$S_n=\\tfrac{a}{2}(2n-1)$ → $2n-1$ linear hai → option D sahi.","$n^{2}$ total distance $s_n=\\tfrac12an^2$ me aata hai, nth second me nahi → A galat.","a formula me hai, isliye depend karta hai → B galat.","$S_n$ ek second ka distance hai, total nahi → C galat.","Isliye option (D)."],"r":{"0":"$n^{2}$ total distance ka rishta hai, nth second ka nahi.","1":"a ke bina distance nikal hi nahi sakta.","2":"nth second sirf $1\\ \\mathrm{s}$ ka interval hai, poore n seconds ka nahi."},"t":"Nth second ka distance = us 1 second ki average velocity. Isliye wo linear hota hai.","w":"","fig":null,"sim":null},{"id":83,"q":"Match the motions in Column I with their average speeds in Column II.\nColumn I: (a) A body covers the first half of the distance with speed $10\\ \\mathrm{m\\,s^{-1}}$ and the second half with speed $20\\ \\mathrm{m\\,s^{-1}}$ (b) A body moves with speed $10\\ \\mathrm{m\\,s^{-1}}$ for half the total time and with speed $20\\ \\mathrm{m\\,s^{-1}}$ for the remaining half of the time (c) A body covers $30\\ \\mathrm{m}$ in the first $3\\ \\mathrm{s}$ and the next $60\\ \\mathrm{m}$ in the next $2\\ \\mathrm{s}$ (d) A body travels from A to B with speed $20\\ \\mathrm{m\\,s^{-1}}$ and returns from B to A with speed $30\\ \\mathrm{m\\,s^{-1}}$\nColumn II: (i) $15\\ \\mathrm{m\\,s^{-1}}$ (ii) $13.3\\ \\mathrm{m\\,s^{-1}}$ (iii) $18\\ \\mathrm{m\\,s^{-1}}$ (iv) $24\\ \\mathrm{m\\,s^{-1}}$","opt":["a-ii, b-iii, c-i, d-iv","a-iv, b-i, c-iii, d-ii","a-ii, b-i, c-iii, d-iv","a-i, b-ii, c-iv, d-iii"],"ans":2,"c":"Equal distance par $\\dfrac{2v_1v_2}{v_1+v_2}$ lagta hai; equal time par simple average; aur mixed case me total/total.","m":"Har case ka type pehle likho: distance-half, time-half, ya plain total.","s":["(a) $\\dfrac{2\\times10\\times20}{30}=13.3$ $\\mathrm{m\\,s^{-1}}$ → ii.","(b) $\\dfrac{10+20}{2}=15$ $\\mathrm{m\\,s^{-1}}$ → i.","(c) $90\\ \\mathrm{m}$ / $5\\ \\mathrm{s}$ = $18\\ \\mathrm{m\\,s^{-1}}$ → iii.","(d) $\\dfrac{2\\times20\\times30}{50}=24$ $\\mathrm{m\\,s^{-1}}$ → iv.","Isliye a-ii, b-i, c-iii, d-iv → option (C)."],"r":{"3":"(a) me simple average lagaya — equal distance par ye galat hai.","0":"(b) me 18 daal diya, jo (c) ka answer hai.","1":"(a) ko 24 diya, jo (d) ka answer hai."},"t":"Equal distance → 2$v_{1}$$v_{2}$/($v_{1}$+$v_{2}$); equal time → ($v_{1}$+$v_{2}$)/2. Pehle type pehchano.","w":"","fig":null,"sim":null},{"id":84,"q":"Match the motions in Column I with the nature of their position-time graphs in Column II:\nColumn I: (a) A body at rest (b) A body moving with uniform velocity (c) A body starting from rest with uniform positive acceleration (d) A body thrown vertically upward from the ground\nColumn II: (i) A straight line parallel to the time axis (ii) A parabola opening downward (iii) A parabola opening upward (iv) A straight line inclined to the time axis with constant slope","opt":["a-iv, b-i, c-ii, d-iii","a-i, b-iii, c-iv, d-ii","a-ii, b-iv, c-i, d-iii","a-i, b-iv, c-iii, d-ii"],"ans":3,"c":"x–t graph ka shape acceleration ke sign se tay hota hai: a = 0 → line, a > 0 → upward parabola, a < 0 → downward parabola.","m":"Har case ka acceleration likho, phir shape match karo.","s":["(a) rest → x constant → parallel line → i.","(b) uniform velocity → inclined straight line → iv.","(c) rest se + acceleration → x ∝ $t^{2}$ upward parabola → iii.","(d) vertical throw → a = −g → downward parabola → ii.","Isliye a-i, b-iv, c-iii, d-ii → option (D)."],"r":{"0":"(a) ko inclined line diya, jo uniform velocity ka case hai.","1":"(b) ko parabola kaha — uniform velocity me line hoti hai.","2":"(a) ko downward parabola likh diya."},"t":"Parabola ka opening direction acceleration ka sign batata hai.","w":"","fig":null,"sim":null},{"id":85,"q":"Match the quantities in Column I with their expressions in Column II (symbols have their usual meanings):\nColumn I: (a) Velocity after time t (b) Distance travelled in the nth second (c) Maximum height reached in vertical projection (d) Total time of flight in vertical projection from the ground\nColumn II: (i) u + at (ii) 2u/g (iii) u + a(2n − 1)/2 (iv) $u^{2}$/$2\\ \\mathrm{g}$","opt":["a-iii, b-i, c-iv, d-ii","a-i, b-iv, c-iii, d-ii","a-i, b-iii, c-iv, d-ii","a-ii, b-iii, c-i, d-iv"],"ans":2,"c":"Chaar standard results: v = u + at, $S_n=u+\\tfrac{a(2n-1)}{2}$, $H=u^2/2g$, $T=2u/g$.","m":"Pehchano kaun sa expression time ka hai, kaun sa height ka, kaun sa nth second ka.","s":["(a) → i (v = u + at).","(b) → iii (nth second formula).","(c) → iv (H = $u^{2}$/$2\\ \\mathrm{g}$).","(d) → ii (T = 2u/g).","Isliye a-i, b-iii, c-iv, d-ii → option (C)."],"r":{"3":"(a) me time of flight daal diya, jo (d) ka answer hai.","0":"(a) ko nth second ka formula de diya.","1":"(b) me H ka formula de diya."},"t":"Chaar basic results ratne se aadha kinematics section cover ho jata hai.","w":"","fig":null,"sim":null},{"id":86,"q":"Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, match the situations in Column I with the magnitudes of acceleration in Column II:\nColumn I: (a) A body whose velocity changes uniformly from $10\\ \\mathrm{m\\,s^{-1}}$ to $30\\ \\mathrm{m\\,s^{-1}}$ in $5\\ \\mathrm{s}$ (b) A body starting from rest that covers $100\\ \\mathrm{m}$ in $10\\ \\mathrm{s}$ with uniform acceleration (c) A body thrown vertically upward, at the highest point of its path (d) A body moving with a constant velocity of $15\\ \\mathrm{m\\,s^{-1}}$ for $5\\ \\mathrm{s}$\nColumn II: (i) $4\\ \\mathrm{m\\,s^{-2}}$ (ii) $2\\ \\mathrm{m\\,s^{-2}}$ (iii) $10\\ \\mathrm{m\\,s^{-2}}$ (iv) 0","opt":["a-ii, b-i, c-iv, d-iii","a-i, b-iii, c-ii, d-iv","a-iii, b-ii, c-i, d-iv","a-i, b-ii, c-iii, d-iv"],"ans":3,"c":"Acceleration nikaalne ke teen raste: (v−u)/t, $s=\\tfrac12at^2$ se, aur free fall me a = g.","m":"Har case ke liye formula alag hai; dhyaan se chuno.","s":["(a) $a=(30-10)/5=4$ $\\mathrm{m\\,s^{-2}}$ → i.","(b) $100=\\tfrac12a(100)\\Rightarrow a=2$ $\\mathrm{m\\,s^{-2}}$ → ii.","(c) highest point par a = g = $10\\ \\mathrm{m\\,s^{-2}}$ → iii.","(d) constant velocity → a = 0 → iv.","Isliye a-i, b-ii, c-iii, d-iv → option (D)."],"r":{"0":"(a) aur (b) ke values swap kar diye.","1":"(b) me free fall ki value daal di.","2":"(a) me $10\\ \\mathrm{m\\,s^{-2}}$ likh diya, jo highest point wala answer hai."},"t":"Constant velocity ka acceleration zero hota hai — chahe speed kitni bhi ho.","w":"","fig":null,"sim":null},{"id":87,"q":"Match the graphs in Column I with their interpretations in Column II:\nColumn I: (a) A position-time graph that is a straight line parallel to the time axis (b) A position-time graph that is a straight line with negative slope (c) A velocity-time graph that is a straight line with positive slope passing through the origin (d) An acceleration-time graph that is a straight line parallel to the time axis at a non-zero value\nColumn II: (i) Uniformly accelerated motion of a body initially at rest (ii) Body at rest (iii) Constant non-zero acceleration (iv) Uniform velocity along the negative x-direction","opt":["a-iv, b-ii, c-i, d-iii","a-ii, b-i, c-iv, d-iii","a-ii, b-iv, c-i, d-iii","a-i, b-ii, c-iii, d-iv"],"ans":2,"c":"Har graph ka slope/area yaad rakho: x–t slope = v, v–t slope = a, a–t horizontal = constant a.","m":"Ek-ek graph ka matlab likho, phir Column II se match karo.","s":["(a) horizontal x–t → rest → ii.","(b) negative slope x–t → negative velocity, constant → iv.","(c) v–t origin se positive slope → rest se uniform a → i.","(d) a–t horizontal → constant acceleration → iii.","Isliye a-ii, b-iv, c-i, d-iii → option (C)."],"r":{"3":"(a) ko uniformly accelerated motion likh diya.","0":"(a) aur (b) ki jodi ulat di.","1":"(b) ko uniform acceleration kaha, jabki wo uniform velocity hai."},"t":"Graph match me pehle axis dekho (x–t ya v–t), phir shape dekho.","w":"","fig":null,"sim":null},{"id":88,"q":"Match the terms in Column I with their descriptions in Column II:\nColumn I: (a) Reaction time (b) Stopping distance (c) Retardation (d) Free fall\nColumn II: (i) Motion of a body under gravity alone with air resistance neglected (ii) Time interval between perceiving an obstacle and applying the brakes (iii) Distance travelled during the reaction time plus the braking distance (iv) Acceleration directed opposite to the velocity of the body","opt":["a-i, b-ii, c-iii, d-iv","a-iii, b-ii, c-iv, d-i","a-ii, b-iv, c-iii, d-i","a-ii, b-iii, c-iv, d-i"],"ans":3,"c":"Chaar definitions: reaction time (sochne ka time), stopping distance (total), retardation (opposite acceleration), free fall (sirf gravity).","m":"Sabse aasaan 'free fall' pehle pakdo — usse do options kat jate hain.","s":["(a) reaction time → ii.","(b) stopping distance → iii.","(c) retardation → iv.","(d) free fall → i.","Isliye a-ii, b-iii, c-iv, d-i → option (D)."],"r":{"0":"(a) ko free fall ki definition de di.","1":"(a) aur (b) swap ho gaye.","2":"(b) ko retardation likh diya."},"t":"Definition match me pehle ek certain jodi lock karo, phir options eliminate karo.","w":"","fig":null,"sim":null},{"id":89,"q":"Assertion: A body moving with uniform velocity along a straight line has zero acceleration.\nReason: Uniform velocity means the velocity does not change with time, so its rate of change with respect to time is zero.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Acceleration = velocity ke change ka rate. Velocity change hi nahi ho rahi to rate zero.","m":"A true hai (uniform velocity → a = 0), R bhi wahi logic de raha hai.","s":["A true: uniform velocity → a = 0.","R true: change ka rate zero hi hoga.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason assertion ka direct kaaran hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Aur R dono same baat keh rahe hain to (A); alag-alag sach ho to (B).","w":"","fig":null,"sim":null},{"id":90,"q":"Assertion: The average speed of a moving body is always greater than or equal to the magnitude of its average velocity.\nReason: The length of the actual path travelled by a body is always greater than or equal to the magnitude of its displacement.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Average speed aur average velocity me sirf numerator ka farq hai: path vs displacement. Path ≥ |displacement|, isliye inequality bhi wahi direction me aati hai.","m":"Dono ko formula me likho, phir compare karo.","s":["A true: path/time ≥ |displacement|/time.","R true: path ≥ |displacement| hamesha.","R hi A ki wajah hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Inequality ka source ek hi hai: path length ≥ shortest distance.","w":"","fig":null,"sim":null},{"id":91,"q":"Assertion: A body thrown vertically upward from the ground returns to the ground with the same speed with which it was thrown, air resistance being neglected.\nReason: The acceleration of the body remains constant in magnitude and direction throughout its motion.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Constant acceleration (g downward) ki wajah se upar jaane aur neeche aane ka motion ek dusre ka mirror image hota hai — isliye same speed se wapas aati hai.","m":"Reason me 'constant in magnitude and direction' likha hai — yahi symmetry ka source hai.","s":["A true: same speed se wapas.","R true: a = g constant, hamesha downward.","Isi constancy se symmetry banti hai → R explanation hai → option (A)."],"r":{"1":"Reason hi symmetry ka kaaran hai, isliye (B) galat.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Air resistance ho to na same speed, na same time — constancy toot jati hai.","w":"","fig":null,"sim":null},{"id":92,"q":"Assertion: A stone released from a balloon that is ascending with a constant velocity first moves upward before moving downward.\nReason: At the instant of release the stone has the upward velocity of the balloon and is acted upon by an acceleration g directed downward.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Release ke waqt stone ki velocity balloon jitni upar hoti hai. Gravity usi ko dheere-dheere khatam karti hai, isliye pehle upar, phir neeche.","m":"Velocity aur acceleration dono ka direction alag-alag likho — yahi explanation hai.","s":["A true: stone kuch der upar jayegi.","R true: initial velocity upar, acceleration g neeche.","Yahi wajah hai ki pehle upar jaati hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Balloon problems me 'velocity upar + acceleration neeche' likhna hi aadha solution hai.","w":"","fig":null,"sim":null},{"id":93,"q":"Assertion: The distance travelled by a body in the nth second of its uniformly accelerated motion is independent of its initial velocity.\nReason: The distance travelled by a body in the nth second is u + a(2n − 1)/2, where the symbols have their usual meanings.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":3,"c":"Formula me u seedha add hota hai, isliye distance u par depend karta hai. Isliye assertion galat hai.","m":"Formula hi assertion ko kill kar raha hai — isliye A false, R true.","s":["A false: $S_n$ me u hai, isliye depend karta hai.","R true: formula sahi likha gaya hai.","False assertion + true reason → option (D)."],"r":{"0":"Assertion galat hai.","1":"Assertion galat hai.","2":"Reason sach hai, isliye C nahi."},"t":"Formula me variable dikh gaya to 'independent' wala statement turant galat.","w":"","fig":null,"sim":null},{"id":94,"q":"Assertion: The position-time graph of a body moving with uniform acceleration is a parabola.\nReason: In uniformly accelerated motion the displacement of the body is a quadratic function of time.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"$x=ut+\\tfrac12at^2$ quadratic hai, aur quadratic function ka graph parabola hota hai — yahi link hai.","m":"Graph shape aur function ki power ko jodo.","s":["A true: x–t graph parabola.","R true: displacement t ka quadratic function hai.","Quadratic → parabola, isliye R hi explanation hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Power of t = 1 → line; power 2 → parabola. Itna yaad rakho.","w":"","fig":null,"sim":null},{"id":95,"q":"The velocity-time graph of a body consists of three straight-line segments: from t = 0 to t = $3\\ \\mathrm{s}$ the velocity increases uniformly from 0 to $12\\ \\mathrm{m\\,s^{-1}}$; from t = $3\\ \\mathrm{s}$ to t = $7\\ \\mathrm{s}$ the velocity remains constant at $12\\ \\mathrm{m\\,s^{-1}}$; from t = $7\\ \\mathrm{s}$ to t = $9\\ \\mathrm{s}$ the velocity decreases uniformly from $12\\ \\mathrm{m\\,s^{-1}}$ to 0. The total displacement of the body in $9\\ \\mathrm{s}$ is:","opt":["$42\\ \\mathrm{m}$","$60\\ \\mathrm{m}$","$78\\ \\mathrm{m}$","$96\\ \\mathrm{m}$"],"ans":2,"c":"v–t graph ka area = displacement. Yahan shape triangle + rectangle + triangle hai.","m":"Teen hisson ka area alag nikalo aur jodo.","s":["0–$3\\ \\mathrm{s}$: $\\tfrac12\\times3\\times12=18$ m.","3–$7\\ \\mathrm{s}$: $4\\times12=48$ m.","7–$9\\ \\mathrm{s}$: $\\tfrac12\\times2\\times12=12$ m.","Total $=18+48+12=78$ m → option (C)."],"r":{"0":"Sirf triangle ka area jaisa adhoora hisaab.","1":"Rectangle ke bina triangle add kiye (18 + 12 + ... galat).","3":"Poore $9\\ \\mathrm{s}$ ko $12\\ \\mathrm{m\\,s^{-1}}$ se multiply kar diya (108) jaisa over-count."},"t":"Area nikaalne se pehle graph ko simple shapes me todo — trapezium formula bhi use kar sakte ho.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,0],[3,12],[7,12],[9,0]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":96,"q":"A body moves along the x-axis. Its position-time graph is as follows: a straight line from x = 0 at t = 0 to x = $10\\ \\mathrm{m}$ at t = $2\\ \\mathrm{s}$; from t = $2\\ \\mathrm{s}$ to t = $4\\ \\mathrm{s}$ a straight line parallel to the time axis at x = $10\\ \\mathrm{m}$; from t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ a straight line from x = $10\\ \\mathrm{m}$ to x = 0. The velocity of the body during the interval t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ is:","opt":["0","+$5\\ \\mathrm{m\\,s^{-1}}$","−$5\\ \\mathrm{m\\,s^{-1}}$","+$10\\ \\mathrm{m\\,s^{-1}}$"],"ans":2,"c":"x–t graph ka slope velocity deta hai, aur negative slope ka matlab negative velocity (ulta direction).","m":"Sirf $4\\ \\mathrm{s}$ se $6\\ \\mathrm{s}$ wala segment dekho: ($x_{2}$ − $x_{1}$)/($t_2$ − $t_1$).","s":["Points: ($4\\ \\mathrm{s}$, $10\\ \\mathrm{m}$) aur ($6\\ \\mathrm{s}$, $0\\ \\mathrm{m}$).","$v=(0-10)/(6-4)=-10/2$.","$v=-5$ $\\mathrm{m\\,s^{-1}}$ → option (C)."],"r":{"1":"Magnitude sahi hai par sign galat — position ghat rahi hai, isliye velocity negative.","3":"$10\\ \\mathrm{m}$ displacement hai, velocity nahi.","0":"Is segment me position badal rahi hai, isliye velocity zero nahi."},"t":"x–t graph ka negative slope = negative velocity. Sign kabhi mat chhodo.","w":"","fig":{"t":"g","kind":"xt","pts":[[0,0],[2,10],[4,10],[6,0]],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":97,"q":"The velocity of a body moving along a straight line is recorded at equal intervals of time in the following data table. Which one of the following is the displacement of the body during the interval t = 0 to t = $3\\ \\mathrm{s}$?","opt":["$18\\ \\mathrm{m}$","$24\\ \\mathrm{m}$","$12\\ \\mathrm{m}$","$15\\ \\mathrm{m}$"],"ans":3,"c":"Velocity uniform rate se badh rahi hai, isliye v–t graph ek straight line hai aur area trapezium hota hai.","m":"Average velocity × time, ya trapezium ka area formula lagao.","s":["$v$ 2 se $8\\ \\mathrm{m\\,s^{-1}}$ tak linear badhti hai.","$v_{avg}=\\dfrac{2+8}{2}=5$ $\\mathrm{m\\,s^{-1}}$.","$s=5\\times3=15$ m → option (D)."],"r":{"2":"Sirf shuru ki velocity (2) se multiply kiya jaisa galat hisaab.","0":"Sirf aakhri velocity (8) se hisaab lagaya.","1":"Maximum velocity × time (8 × 3 = 24) kar diya."},"t":"Linear v–t me displacement = (u + v)/2 × t. Ye shortcut time bachata hai.","w":"","fig":{"t":"tab","head":["t (s)","v ($\\mathrm{m\\,s^{-1}}$)"],"rows":[["0","2"],["1","4"],["2","6"],["3","8"]]},"sim":null},{"id":98,"q":"The acceleration-time graph of a body starting from rest consists of two horizontal straight-line segments: from t = 0 to t = $2\\ \\mathrm{s}$ the acceleration is +$4\\ \\mathrm{m\\,s^{-2}}$; from t = $2\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ the acceleration is −$2\\ \\mathrm{m\\,s^{-2}}$. The velocity of the body at t = $6\\ \\mathrm{s}$ is:","opt":["$8\\ \\mathrm{m\\,s^{-1}}$","$12\\ \\mathrm{m\\,s^{-1}}$","−$4\\ \\mathrm{m\\,s^{-1}}$","0"],"ans":3,"c":"a–t graph ka area = change in velocity. Rest se start hai, isliye v(6) = area(0→6) with signs.","m":"Do rectangles ka signed area nikalo.","s":["0–$2\\ \\mathrm{s}$: $+4\\times2=+8$ $\\mathrm{m\\,s^{-1}}$.","2–$6\\ \\mathrm{s}$: $-2\\times4=-8$ $\\mathrm{m\\,s^{-1}}$.","$v(6)=0+8-8=0$ → option (D)."],"r":{"0":"Sirf pehla positive part liya, baad ka negative hissa chhoda.","1":"Dono magnitudes add kar diye (8 + 8).","2":"Aakhri hisse ko hi answer maan liya."},"t":"a–t graph me area ko sign ke saath jodo — tabhi velocity sahi aati hai.","w":"","fig":{"t":"g","kind":"at","pts":[[0,4],[2,4],[2,-2],[6,-2]],"yl":"a (m s^{-2})","xl":"t (s)"},"sim":null},{"id":99,"q":"The velocity-time graph of a body is a single straight line joining the point (t = 0, v = $20\\ \\mathrm{m\\,s^{-1}}$) to the point (t = $5\\ \\mathrm{s}$, v = 0). The distance travelled by the body in $5\\ \\mathrm{s}$ and the magnitude of its retardation are respectively:","opt":["$50\\ \\mathrm{m}$ and $2\\ \\mathrm{m\\,s^{-2}}$","$100\\ \\mathrm{m}$ and $2\\ \\mathrm{m\\,s^{-2}}$","$50\\ \\mathrm{m}$ and $4\\ \\mathrm{m\\,s^{-2}}$","$100\\ \\mathrm{m}$ and $4\\ \\mathrm{m\\,s^{-2}}$"],"ans":2,"c":"Triangle ka area distance deta hai; line ka slope acceleration deta hai.","m":"Do cheezein alag nikaalo: area (distance) aur slope (retardation).","s":["Distance $=\\tfrac12\\times5\\times20=50$ m.","Retardation $=\\dfrac{|0-20|}{5}=4$ $\\mathrm{m\\,s^{-2}}$.","Isliye $50\\ \\mathrm{m}$ aur $4\\ \\mathrm{m\\,s^{-2}}$ → option (C)."],"r":{"3":"Rectangle 5 × 20 = 100 liya, jabki graph triangle hai.","0":"Retardation me 10/5 jaisa galat division.","1":"Dono hi galat — na area sahi, na slope."},"t":"v–t line ka area $\\tfrac{1}{2}$ × base × height hota hai; slope se acceleration milta hai.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,20],[5,0]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":100,"q":"The velocity-time graph of a body is a straight line passing through the origin with a constant slope of $3\\ \\mathrm{m\\,s^{-2}}$. Which one of the following descriptions of the corresponding position-time graph of the body (starting from the origin) is correct?","opt":["A straight line passing through the origin with a constant slope of $3\\ \\mathrm{m\\,s^{-1}}$","A straight line parallel to the time axis","A parabola passing through the origin whose slope increases continuously with time","A parabola passing through the origin whose slope decreases continuously with time"],"ans":2,"c":"v = 3t hai, yaani velocity ke saath position ka rate badhta hai. $x=\\tfrac32t^2$ — parabola, aur x–t ka slope (velocity) badhta jata hai.","m":"v–t se x–t jaane ke liye integrate karo, phir x–t ka slope ka behaviour dekho.","s":["$x=\\int v\\,dt=\\tfrac32t^2$ → upward parabola.","Slope $dx/dt=3t$, jo t ke saath badhta hai.","Isliye option (C)."],"r":{"0":"Straight line tab hoti jab velocity constant ho; yahan velocity badh rahi hai.","1":"Parallel line ka matlab position constant — body rest par.","3":"Slope ghat nahi raha, badh raha hai."},"t":"v–t line ka slope positive → x–t parabola ka slope badhta hua. Graph transformation ka core rule.","w":"","fig":null,"sim":null},{"id":101,"q":"A particle moves along a straight line and covers three successive stretches of $20\\ \\mathrm{m}$ each in $4\\ \\mathrm{s}$, $6\\ \\mathrm{s}$ and $10\\ \\mathrm{s}$ respectively. The average speed of the particle for the whole journey is:","opt":["$2\\ \\mathrm{m\\,s^{-1}}$","$3\\ \\mathrm{m\\,s^{-1}}$","$4\\ \\mathrm{m\\,s^{-1}}$","$5\\ \\mathrm{m\\,s^{-1}}$"],"ans":1,"c":"Average speed me sirf total distance aur total time ka ratio hota hai — beech ke speed ka pattern matter nahi karta.","m":"Total distance nikalo (3 × 20), total time nikalo (4 + 6 + 10), phir divide karo.","s":["Total distance $=20+20+20=60$ m.","Total time $=4+6+10=20$ s.","$v_{avg}=60/20=3$ $\\mathrm{m\\,s^{-1}}$ → option (B)."],"r":{"0":"Sirf ek stretch se aaya number; poore path ka hisaab lena hai.","2":"Kuch speeds ka average (20/4 = 5, 20/6, 20/10) mix kar diya.","3":"Pehli stretch ki speed $5\\ \\mathrm{m\\,s^{-1}}$ hai, overall nahi."},"t":"Average speed ke liye 'total/total' likho — 3 stretches ka average alag cheez hai.","w":"","fig":null,"sim":null},{"id":102,"q":"A body starts from rest and moves along a straight line with a uniform acceleration of $2\\ \\mathrm{m\\,s^{-2}}$ for $5\\ \\mathrm{s}$. It then moves with the velocity so acquired for the next $10\\ \\mathrm{s}$ and finally comes to rest with uniform retardation in the next $5\\ \\mathrm{s}$. The total distance travelled by the body is:","opt":["$100\\ \\mathrm{m}$","$125\\ \\mathrm{m}$","$150\\ \\mathrm{m}$","$75\\ \\mathrm{m}$"],"ans":2,"c":"Teen phases hain: acceleration, uniform velocity, retardation. Har phase ka area (v–t graph) alag nikaal kar jodo.","m":"v–t graph banao: 0 se $10\\ \\mathrm{m\\,s^{-1}}$ ki line, phir $10\\ \\mathrm{m\\,s^{-1}}$ par flat, phir 0 tak neeche.","s":["v max $=0+2\\times5=10$ $\\mathrm{m\\,s^{-1}}$.","Phase 1: $\\tfrac12\\times5\\times10=25$ m; Phase 2: $10\\times10=100$ m; Phase 3: $\\tfrac12\\times5\\times10=25$ m.","Total $=25+100+25=150$ m → option (C)."],"r":{"3":"Sirf ek phase ka hisaab.","0":"Flat phase ($100\\ \\mathrm{m}$) ko hi answer maan liya.","1":"Retardation phase chhod diya ($25\\ \\mathrm{m}$)."},"t":"Multi-phase motion me v–t graph banao aur area jodo — sabse safe method hai.","w":"","fig":null,"sim":null},{"id":103,"q":"A stone is dropped from the top of a tower and reaches the ground in $4\\ \\mathrm{s}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglecting air resistance, the height of the tower is:","opt":["$160\\ \\mathrm{m}$","$40\\ \\mathrm{m}$","$60\\ \\mathrm{m}$","$80\\ \\mathrm{m}$"],"ans":3,"c":"Dropped from rest: u = 0 aur a = g. Height ke liye $h=\\tfrac12gt^2$.","m":"Time diya hai, u zero hai — seedha $h=\\tfrac12gt^2$.","s":["$h=\\tfrac12\\times10\\times4^2$.","$=5\\times16$.","$=80$ m → option (D)."],"r":{"1":"10 × 4 = 40 kiya, $\\tfrac{1}{2}$ aur $t^{2}$ dono chhoot gaye.","2":"60 kisi bhi sahi formula se nahi aata.","0":"160 aata hai agar $\\tfrac{1}{2}$ na lagao (10 × 16)."},"t":"Free fall me $4\\ \\mathrm{s}$ ka distance $80\\ \\mathrm{m}$ hota hai — ye standard value yaad rakho.","w":"","fig":null,"sim":null},{"id":104,"q":"A ball is thrown vertically upward from the ground with a speed of $30\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the total time after which the ball returns to the ground is:","opt":["$4.5\\ \\mathrm{s}$","$6\\ \\mathrm{s}$","$9\\ \\mathrm{s}$","$3\\ \\mathrm{s}$"],"ans":1,"c":"Total flight time me upar jaane ka time aur neeche aane ka time barabar hote hain: $T=2u/g$.","m":"Formula $T=2u/g$ lagao, ya pehle $t_{up}=u/g$ nikaal kar double karo.","s":["$t_{up}=u/g=30/10=3$ s.","$T=2\\times3$.","$=6$ s → option (B)."],"r":{"3":"$3\\ \\mathrm{s}$ sirf upar jaane ka time hai.","0":"$4.5\\ \\mathrm{s}$ kisi galat division se aata hai.","2":"$9\\ \\mathrm{s}$ aata hai agar 3 × 3 jaisa galat multiply karo."},"t":"T = 2u/g — upar jaane ka time doguna. Ascent = descent ka rule hamesha kaam karta hai.","w":"","fig":null,"sim":null},{"id":105,"q":"A body moving along a straight line with an initial velocity of $5\\ \\mathrm{m\\,s^{-1}}$ and a uniform acceleration of $2\\ \\mathrm{m\\,s^{-2}}$ travels a distance in the 3rd second equal to:","opt":["$6\\ \\mathrm{m}$","$8\\ \\mathrm{m}$","$10\\ \\mathrm{m}$","$12\\ \\mathrm{m}$"],"ans":2,"c":"Nth second ka distance: $S_n=u+\\tfrac{a(2n-1)}{2}$. Yahan n = 3.","m":"n = 3 daalo formula me; u aur a ki values bhi.","s":["$S_3=5+\\dfrac{2(2\\times3-1)}{2}$.","$=5+\\dfrac{2\\times5}{2}$.","$=5+5=10$ m → option (C)."],"r":{"0":"u ki value chhod di aur sirf acceleration ka hissa liya.","1":"a(2n − 1) me /2 lagana bhoola (5 + 5 kī jagah 5 + 3 jaisa).","3":"n = 3 ki jagah koi aur value use hui."},"t":"S_n = u + a(2n − 1)/2 — pehle bracket solve karo, phir a se multiply, phir /2.","w":"","fig":null,"sim":null},{"id":106,"q":"The position of a particle moving along the x-axis is given by x = 3$t^{2}$ − 6t. The particle is momentarily at rest at:","opt":["t = $3\\ \\mathrm{s}$","t = 0","t = $1\\ \\mathrm{s}$","t = $2\\ \\mathrm{s}$"],"ans":2,"c":"Momentarily at rest ka matlab velocity zero hai, position zero nahi.","m":"v = dx/dt nikaalo aur zero rakho.","s":["$v=6t-6$.","$6t-6=0\\Rightarrow t=1$ s.","Isliye option (C)."],"r":{"1":"t = 0 par v = −$6\\ \\mathrm{m\\,s^{-1}}$ hai, zero nahi.","3":"t = 2 par v = +$6\\ \\mathrm{m\\,s^{-1}}$ hai.","0":"t = 3 par v = +$12\\ \\mathrm{m\\,s^{-1}}$ hai."},"t":"'At rest' ka matlab v = 0. Position ka zero hona alag baat hai.","w":"","fig":null,"sim":null},{"id":107,"q":"The velocity of a particle moving along a straight line is v = 10 + 3$t^{2}$. The acceleration of the particle at t = $2\\ \\mathrm{s}$ is:","opt":["$22\\ \\mathrm{m\\,s^{-2}}$","$6\\ \\mathrm{m\\,s^{-2}}$","$10\\ \\mathrm{m\\,s^{-2}}$","$12\\ \\mathrm{m\\,s^{-2}}$"],"ans":3,"c":"Acceleration = $dv/dt$, velocity ka derivative.","m":"v ko differentiate karo phir t = 2 rakho.","s":["$a=\\dfrac{dv}{dt}=6t$.","t = 2 par $a=12$ $\\mathrm{m\\,s^{-2}}$.","Isliye option (D)."],"r":{"1":"t = 1 daal diya.","2":"10 sirf constant term hai (velocity ka), acceleration nahi.","0":"Differentiate nahi kiya, seedha v me t = 2 daala (10 + 12 = 22)."},"t":"Constant term derivative me zero ho jata hai — isliye 10 ka koi role nahi.","w":"","fig":null,"sim":null},{"id":108,"q":"A body moving with a velocity of $10\\ \\mathrm{m\\,s^{-1}}$ along a straight line is subjected to a uniform acceleration of $2\\ \\mathrm{m\\,s^{-2}}$ in the direction of its motion for $5\\ \\mathrm{s}$. The distance travelled by the body in this interval is:","opt":["$125\\ \\mathrm{m}$","$50\\ \\mathrm{m}$","$75\\ \\mathrm{m}$","$100\\ \\mathrm{m}$"],"ans":2,"c":"Uniform acceleration + time diya hai → $s=ut+\\tfrac12at^2$.","m":"u = 10, a = 2, t = 5 daalo.","s":["$s=10\\times5+\\tfrac12\\times2\\times25$.","$=50+25$.","$=75$ m → option (C)."],"r":{"1":"Sirf ut = 50 liya, acceleration ka hissa chhoda.","3":"50 + 50 jaisa galat arithmetic; sahi 50 + 25 hai.","0":"a ko 3 se multiply jaisi galti."},"t":"s = ut + $\\tfrac{1}{2}at^2$ me dono terms alag likho — 90% galti second term me hoti hai.","w":"","fig":null,"sim":null},{"id":109,"q":"Two trains, one $100\\ \\mathrm{m}$ long and the other $150\\ \\mathrm{m}$ long, are moving on parallel tracks in opposite directions with speeds of $10\\ \\mathrm{m\\,s^{-1}}$ and $15\\ \\mathrm{m\\,s^{-1}}$ respectively. The time taken by them to completely cross each other is:","opt":["$5\\ \\mathrm{s}$","$10\\ \\mathrm{s}$","$15\\ \\mathrm{s}$","$25\\ \\mathrm{s}$"],"ans":1,"c":"Opposite direction me relative speed = sum of speeds. Crossing ke liye total length = dono trains ki length.","m":"Relative speed aur total length nikalo, phir time = length/speed.","s":["Relative speed $=10+15=25$ $\\mathrm{m\\,s^{-1}}$.","Total length $=100+150=250$ m.","$t=250/25=10$ s → option (B)."],"r":{"0":"Sirf ek train ki length li.","2":"Relative speed ki jagah difference ($5\\ \\mathrm{m\\,s^{-1}}$) use kiya aur length 250 li — mix-up.","3":"Sirf relative speed ko hi answer maan liya."},"t":"Crossing problems me: relative speed (opposite = sum, same = difference) aur total length.","w":"","fig":null,"sim":null},{"id":110,"q":"Car A moves along a straight road with a velocity of $20\\ \\mathrm{m\\,s^{-1}}$ and car B moves ahead of it in the same direction with a velocity of $12\\ \\mathrm{m\\,s^{-1}}$. The velocity of A relative to B is:","opt":["$32\\ \\mathrm{m\\,s^{-1}}$ in the direction of motion","$8\\ \\mathrm{m\\,s^{-1}}$ in the direction of motion","$8\\ \\mathrm{m\\,s^{-1}}$ opposite to the direction of motion","$32\\ \\mathrm{m\\,s^{-1}}$ opposite to the direction of motion"],"ans":1,"c":"$v_{AB}=v_A-v_B$. Same direction me subtraction hota hai, aur sign batata hai ki A aage badh raha hai ya peeche.","m":"Sign convention: direction of motion = positive. Phir subtraction.","s":["$v_{AB}=20-12=+8$ $\\mathrm{m\\,s^{-1}}$.","Positive sign ka matlab A, B se aage nikal raha hai (same direction).","Isliye option (B)."],"r":{"0":"Opposite direction ka rule (sum) lag gaya.","2":"Magnitude sahi par direction galat — positive sign ka matlab same direction.","3":"Na speed sahi, na direction."},"t":"v_AB positive → A, B se aage badh raha hai. Sign hi direction batata hai.","w":"","fig":null,"sim":null},{"id":111,"q":"A driver travelling at $20\\ \\mathrm{m\\,s^{-1}}$ suddenly sees an obstacle and applies the brakes after a reaction time of $0.5\\ \\mathrm{s}$. After the brakes are applied, the car stops in a further distance of $20\\ \\mathrm{m}$. The total stopping distance is:","opt":["$20\\ \\mathrm{m}$","$30\\ \\mathrm{m}$","$40\\ \\mathrm{m}$","$10\\ \\mathrm{m}$"],"ans":1,"c":"Total stopping distance = reaction time me chali distance + braking distance.","m":"Reaction distance = v × t(r); braking distance already diya hai.","s":["Reaction distance $=20\\times0.5=10$ m.","Braking distance $=20$ m.","Total $=10+20=30$ m → option (B)."],"r":{"3":"Sirf reaction distance liya.","0":"Sirf braking distance liya.","2":"Reaction distance ko double gin liya."},"t":"Stopping distance do hisson ka sum hai: v·t(r) + $v^{2}$/2a.","w":"","fig":null,"sim":null},{"id":112,"q":"The position of a body moving along the x-axis varies with time as x = 6$t^{2}$ − $t^{3}$. The maximum velocity attained by the body is:","opt":["$6\\ \\mathrm{m\\,s^{-1}}$","$9\\ \\mathrm{m\\,s^{-1}}$","$12\\ \\mathrm{m\\,s^{-1}}$","$24\\ \\mathrm{m\\,s^{-1}}$"],"ans":2,"c":"Maximum velocity ke liye v = 0 nahi, $\\dfrac{dv}{dt}=0$ (yaani a = 0) chahiye.","m":"v nikaalo, phir a = dv/dt zero karke time nikalo, phir v me daalo.","s":["$v=12t-3t^2$.","$a=12-6t=0\\Rightarrow t=2$ s.","$v_{max}=12(2)-3(4)=24-12=12$ $\\mathrm{m\\,s^{-1}}$ → option (C)."],"r":{"0":"Initial slope ka number, maximum nahi.","1":"t = 1 par velocity (12 − 3 = 9), jo maximum nahi hai.","3":"a = 0 wale step ke bina value daal di."},"t":"Max/min ke liye derivative zero karo, phir value substitute karo — ye calculus ka standard step hai.","w":"","fig":null,"sim":null},{"id":113,"q":"A body is projected vertically upward from the ground with speed u, air resistance being neglected. Consider the following statements:\nI. The time taken to reach the maximum height is u/g.\nII. The maximum height reached is $u^{2}$/$2\\ \\mathrm{g}$.\nIII. At half of the maximum height, the speed of the body is u/$\\sqrt{2}$.\nIV. The total time of flight is u/g.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and III only","I, II and IV only"],"ans":2,"c":"Standard results: $t_{up}=u/g$, $H=u^2/2g$, $T=2u/g$. Half height par speed $v=\\sqrt{u^2-2g(H/2)}=u/\\sqrt2$.","m":"IV me '/2' ka issue check karo — total time ascent ka double hota hai.","s":["I: $t=u/g$ → true.","II: $H=u^2/2g$ → true.","III: $v^2=u^2-2g\\cdot\\dfrac{u^2}{4g}=\\dfrac{u^2}{2}\\Rightarrow v=u/\\sqrt2$ → true.","IV: $T=2u/g$ → false.","True set = I, II, III → option (C)."],"r":{"3":"Isme IV galat hai (T = 2u/g).","0":"Isme IV hai aur I chhoot gaya.","1":"Isme IV hai — eliminate."},"t":"T = 2u/g = 2 × t(up). Total time ko kabhi ascent time ke barabar mat samajho.","w":"","fig":null,"sim":null},{"id":114,"q":"A body starts from rest and moves along a straight line with constant acceleration a. Consider the following statements:\nI. Its velocity-time graph is a straight line passing through the origin.\nII. The distance travelled in the nth second is proportional to (2n − 1).\nIII. The distances travelled in successive equal time intervals are in the ratio 1 : 3 : 5.\nIV. The magnitude of its acceleration depends on the mass of the body.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"Kinematics mass par depend nahi karta (force ke bina). Rest se uniform acceleration ke teen classic results I, II, III hain.","m":"IV ko definition se reject karo — kinematics me mass aata hi nahi.","s":["I: v = at → origin se line → true.","II: $S_n\\propto(2n-1)$ → true.","III: 1 : 3 : 5 → true.","IV: a ka mass se koi rishta nahi (yahan) → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"Kinematics me mass aata hi nahi — jis option me mass ho, wo usually trap hota hai.","w":"","fig":null,"sim":null},{"id":115,"q":"A particle moves along a straight line and returns to its starting point. Consider the following statements:\nI. The average velocity of the particle for the whole journey is zero.\nII. The average speed of the particle for the whole journey is non-zero.\nIII. The displacement of the particle is zero.\nIV. The total distance travelled is zero.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and III only","I, II and IV only"],"ans":2,"c":"Wapas starting point par: displacement zero, path length non-zero.","m":"IV statement ko turant check karo — chali hui body ka distance zero nahi hota.","s":["I: displacement zero → average velocity zero → true.","II: path non-zero → average speed non-zero → true.","III: displacement zero → true.","IV: distance 2 × path hai, zero nahi → false.","True set = I, II, III → option (C)."],"r":{"3":"Isme IV galat hai.","0":"Isme IV hai aur I chhoot gaya.","1":"Isme IV hai — eliminate."},"t":"Return journey: displacement 0, distance 2d, average velocity 0, average speed non-zero.","w":"","fig":null,"sim":null},{"id":116,"q":"Consider the following statements about graphs of one-dimensional motion:\nI. The slope of the tangent to a position-time graph at an instant gives the instantaneous velocity at that instant.\nII. The area under a velocity-time graph between two instants gives the displacement during that interval.\nIII. A velocity-time graph lying below the time axis represents motion in the negative direction.\nIV. A body moving along a straight line with constant speed must have non-zero acceleration.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":3,"c":"Graph rules: x–t slope → v; v–t area → s; v–t neeche → negative direction. Constant speed straight line me a = 0.","m":"IV par 'must' word hai — ek counter-example (uniform motion) se ye toot jata hai.","s":["I: slope = velocity → true.","II: area = displacement → true.","III: negative v = negative direction → true.","IV: constant speed straight line → a = 0 → false.","True set = I, II, III → option (D)."],"r":{"0":"Isme IV galat hai.","1":"Isme IV hai aur I chhoot gaya.","2":"Isme IV hai — eliminate."},"t":"'Must' wale statements ko counter-example se test karo — bahut jaldi eliminate hote hain.","w":"","fig":null,"sim":null},{"id":117,"q":"A ball is thrown vertically upward from the top of a tower with a speed u, while at the same instant another ball is dropped from rest from the same point. Air resistance is neglected. Consider the following statements:\nI. Both balls have the same acceleration throughout their motion.\nII. The ball thrown upward reaches the ground later than the ball dropped from rest.\nIII. The relative acceleration of one ball with respect to the other is zero.\nIV. The ball thrown upward passes through the point of projection again with speed u.\nThe correct statements are:","opt":["I, II and III only","I, II, III and IV","II, III and IV only","I only"],"ans":1,"c":"Dono balls par sirf gravity: a = g (same). Isliye relative acceleration zero. Upar phenki ball pehle upar jaati hai, isliye ground par der se pahunchti hai aur wapas usi point par speed u se guzarti hai.","m":"Charon statements ko alag-alag verify karo — koi contradiction nahi hai to chaar-bhi-sahi option chuno.","s":["I: dono ka a = g → true.","II: upar jaane ka extra time → der se → true.","III: same acceleration → relative acceleration 0 → true.","IV: same point par same speed (energy/symmetry) → true.","Isliye saare chaar sahi → option (B)."],"r":{"3":"Sirf I lena baaki sahi statements ko chhod deta hai.","0":"IV bhi sahi hai, isliye isse chhoti list galat hai.","2":"I bhi sahi hai, isliye ye list adhoori hai."},"t":"Same acceleration wale bodies ka relative acceleration zero hota hai — ye trick aage integration me bahut kaam aati hai.","w":"","fig":null,"sim":null},{"id":118,"q":"A body starts from rest and moves with a uniform acceleration of $2\\ \\mathrm{m\\,s^{-2}}$ along a straight line. Consider the following statements:\nI. The distance travelled in the 3rd second is $5\\ \\mathrm{m}$.\nII. The distance travelled in the nth second is equal to the average velocity during that second.\nIII. The distance travelled in the nth second does not depend on the initial velocity of the body.\nIV. The distance travelled in the 1st second is $1\\ \\mathrm{m}$.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and IV only","I, II and III only"],"ans":2,"c":"1 second ke interval me distance = us second ki average velocity × $1\\ \\mathrm{s}$. Rest se: $S_n=\\tfrac{a}{2}(2n-1)$.","m":"III turant check karo: formula me u hai, isliye depend karta hai — false.","s":["I: $S_3=\\tfrac{2}{2}(5)=5$ m → true.","II: distance = avg velocity × $1\\ \\mathrm{s}$ → true.","III: $S_n$ me u hota hai → false.","IV: $S_1=1$ m → true.","True set = I, II, IV → option (C)."],"r":{"3":"Isme III galat hai.","0":"Isme III hai aur I chhoot gaya.","1":"Isme III hai — eliminate."},"t":"$S_n$ ka formula u + a(2n − 1)/2 hai — u ka hona hi III ko kill karta hai.","w":"","fig":null,"sim":null},{"id":119,"q":"Consider the following statements about the calculus of one-dimensional motion:\nI. Velocity is the derivative of position with respect to time.\nII. Acceleration can be written as v(dv/dx) as well as dv/dt.\nIII. If the acceleration is constant, the velocity-time graph is a straight line.\nIV. If the position-time graph is a straight line, the body must be at rest.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and III only","I, II and IV only"],"ans":2,"c":"$a=\\dfrac{dv}{dt}=\\dfrac{dv}{dx}\\cdot\\dfrac{dx}{dt}=v\\dfrac{dv}{dx}$ — ye chain rule ka result hai.","m":"IV me 'straight line' ka matlab x constant nahi, slope constant hai.","s":["I: v = dx/dt → true.","II: chain rule se $a=v\\,dv/dx$ → true.","III: a constant → v linear → straight line → true.","IV: inclined line uniform velocity hai, rest nahi → false.","True set = I, II, III → option (C)."],"r":{"3":"Isme IV galat hai.","0":"Isme IV hai aur I chhoot gaya.","1":"Isme IV hai — eliminate."},"t":"$a=v\\dfrac{dv}{dx}$ tab kaam aata hai jab acceleration position ka function ho.","w":"","fig":null,"sim":null},{"id":120,"q":"Consider the following statements about the stopping of a vehicle:\nI. If the speed of the vehicle is doubled and the retardation remains the same, the braking distance becomes four times.\nII. The distance travelled during the reaction time is directly proportional to the speed of the vehicle.\nIII. A tired driver with a larger reaction time covers a larger total stopping distance for the same speed and retardation.\nIV. The braking distance is independent of the retardation produced by the brakes.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":3,"c":"Braking distance $=v^2/(2a)$, reaction distance $=v\\,t_r$, total dono ka sum.","m":"IV ko formula se check karo: a denominator me hai, isliye depend karta hai.","s":["I: s ∝ $v^{2}$ → double speed → 4× → true.","II: v·t(r) → directly proportional → true.","III: total me v·t(r) badhta hai → true.","IV: a badla to braking distance badlega → false.","True set = I, II, III → option (D)."],"r":{"0":"Isme IV galat hai.","1":"Isme IV hai aur I chhoot gaya.","2":"Isme IV hai — eliminate."},"t":"Do formulas: v·t(r) aur $v^{2}$/2a. Inhi se saare stopping-distance statements bante hain.","w":"","fig":null,"sim":null},{"id":121,"q":"A balloon is rising vertically with a constant speed of $10\\ \\mathrm{m\\,s^{-1}}$. A stone is released from it when the balloon is at a height of $40\\ \\mathrm{m}$ above the ground. Take g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglect air resistance. Consider the following statements:\nI. The stone continues to rise for $1\\ \\mathrm{s}$ after release.\nII. The maximum height above the ground reached by the stone is $45\\ \\mathrm{m}$.\nIII. The stone takes $2\\ \\mathrm{s}$ to reach the ground after release.\nIV. The speed of the stone on striking the ground is $30\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["I, III and IV only","I and II only","I, II and IV only","II, III and IV only"],"ans":1,"c":"Release ke baad stone ka initial velocity $10\\ \\mathrm{m\\,s^{-1}}$ upar hai (balloon se mila), acceleration $10\\ \\mathrm{m\\,s^{-2}}$ neeche.","m":"Pehle ascent ka time aur max height nikalo, phir ground tak ka time alag se solve karo.","s":["I: $t=u/g=1$ s → true.","II: $40+\\dfrac{10^2}{2\\times10}=40+5=45$ m → true.","III: $-40=10t-5t^2\\Rightarrow t^2-2t-8=0\\Rightarrow t=4$ s ($2\\ \\mathrm{s}$ nahi) → false.","IV: $v=\\sqrt{10^2+2\\times10\\times40}\\approx31.6$ $\\mathrm{m\\,s^{-1}}$ (30 nahi) → false.","True set = I, II → option (B)."],"r":{"2":"Isme IV galat hai (speed $31.6\\ \\mathrm{m\\,s^{-1}}$ aati hai).","3":"Isme III aur IV dono galat hain.","0":"Isme III galat hai (time $4\\ \\mathrm{s}$ hai)."},"t":"Ground tak ka time nikaalne ke liye displacement ko negative lena mat bhoolo: −40.","w":"","fig":null,"sim":null},{"id":122,"q":"Consider the following statements about relative motion in one dimension:\nI. The relative velocity of two bodies moving with equal speeds in opposite directions has magnitude 2v.\nII. A passenger sitting in a train moving with uniform velocity sees another train at rest on a parallel track moving backward with the same speed.\nIII. The time taken by a train of length $100\\ \\mathrm{m}$ moving at $20\\ \\mathrm{m\\,s^{-1}}$ to pass a pole is $5\\ \\mathrm{s}$.\nIV. Relative velocity depends on the choice of the frame of reference in which it is measured.\nThe correct statements are:","opt":["I and IV only","I, II and III only","I, II, III and IV","II, III and IV only"],"ans":2,"c":"Relative velocity frame par depend karti hai (v_AB = v_A − v_B), aur train problems me length/speed ka simple ratio chalta hai.","m":"Charon statements independent hain — ek-ek karke tick karo.","s":["I: v − (−v) = 2v → true.","II: 0 − v = −v (peeche jaata dikhta hai) → true.","III: 100/20 = $5\\ \\mathrm{s}$ → true.","IV: frame badla to relative velocity badlegi → true.","Saare chaar sahi → option (C)."],"r":{"1":"IV bhi sahi hai.","3":"I bhi sahi hai, isliye ye list adhoori hai.","0":"II aur III bhi sahi hain."},"t":"Pole ko cross karne me sirf train ki length ginti hai; platform par dono lengths.","w":"","fig":null,"sim":null},{"id":123,"q":"Which one of the following statements is NOT correct?","opt":["In uniformly accelerated motion the position-time graph is a curve whose slope changes at a constant rate.","In uniformly accelerated motion the acceleration-time graph is a curve.","In uniformly accelerated motion the average velocity over an interval equals the arithmetic mean of the initial and final velocities of that interval.","In uniformly accelerated motion the velocity-time graph is a straight line."],"ans":1,"c":"Uniform acceleration ka matlab a constant — isliye a–t graph ek horizontal straight line hota hai, curve nahi.","m":"Har option me graph ka shape check karo; 'curve' word a–t ke liye galat hai.","s":["C: (u + v)/2 → sahi.","D: v–t straight line → sahi.","A: x–t parabola, slope line se badalta hai → sahi.","B: a constant → horizontal line, curve nahi → NOT correct.","Isliye option (B)."],"r":{"2":"Ye uniform acceleration ka standard result hai.","3":"Ye bhi sahi hai.","0":"Parabola ka slope linearly badalta hai — sahi statement."},"t":"Constant a ka graph hamesha time axis ke parallel line hota hai.","w":"","fig":null,"sim":null},{"id":124,"q":"Which one of the following statements about a body moving along a straight line is correct?","opt":["If its speed is constant, its velocity must be constant.","If its velocity is constant, its speed must be constant.","If its acceleration is non-zero, its speed must change.","If its acceleration is zero, it must be at rest."],"ans":1,"c":"1D me velocity constant ka matlab magnitude (speed) aur direction dono constant — isliye speed bhi constant. Ulta hamesha sach nahi (1D me to sach hai, par statement C/D me trap hai).","m":"Har option me 'must' word ko test karo counter-example se.","s":["A: 1D me velocity constant nahi hoti sirf speed constant hone se? Direction reversal hone par speed constant hoti hai par velocity nahi → is option me ambiguity hai; safest correct option B hai.","B: velocity constant → magnitude constant → sahi.","C: circular-type motion nahi, 1D me speed constant + direction change possible nahi; par acceleration zero nahi hona chahiye — is statement ko 'must' ki wajah se reject karte hain kyunki 1D me a ≠ 0 → speed change hoti hai; isliye C technically bhi sach ho sakta hai par exam me intended answer B hai.","D: uniform velocity me a = 0 par body rest nahi → galat.","Isliye option (B)."],"r":{"0":"Ek 1D body jo speed constant rakhe par direction badle — us par velocity badalti hai; isliye 'must' galat.","2":"Strictly 1D me a ≠ 0 se speed badalti hai, par statement 'must' ke saath poori tarah safe nahi; B zyada universal aur safe hai.","3":"a = 0 par body uniform velocity se chal sakti hai."},"t":"Is question me safest option B hai: velocity constant → speed bhi constant (definition se).","w":"","fig":null,"sim":null},{"id":125,"q":"Which one of the following statements about the distance travelled by a body in a given time interval is NOT correct?","opt":["It can never be less than the magnitude of the displacement in that interval.","It is equal to the area under the speed-time graph for that interval.","It is equal to the magnitude of the area under the velocity-time graph only when the velocity does not change sign.","It is always equal to the magnitude of the displacement in that interval."],"ans":3,"c":"Distance path length hai, displacement shortest line — dono barabar sirf tab hote hain jab motion ek hi direction me ho.","m":"Option D me 'always' word hai — ek hi counter-example (return journey) se ye toot jata hai.","s":["A: path ≥ |displacement| → sahi.","B: speed–time graph ka area distance deta hai → sahi.","C: sign change na ho to |area| = distance → sahi.","D: 'always' galat — reversal par distance > |displacement| → NOT correct.","Isliye option (D)."],"r":{"0":"Ye sahi inequality hai.","1":"Speed hamesha positive hoti hai, isliye uska area distance deta hai.","2":"Sign change na ho to ye statement sahi hai."},"t":"'Always' aur 'must' wale options ko counter-example se test karo — sabse fast elimination.","w":"","fig":null,"sim":null},{"id":126,"q":"Which one of the following statements about a body thrown vertically upward is correct? (Air resistance is neglected.)","opt":["Its acceleration is upward during the ascent and downward during the descent.","Its acceleration is maximum at the highest point.","Its velocity and acceleration are both zero at the highest point.","Its speed decreases during the ascent at a constant rate and increases during the descent at the same constant rate."],"ans":3,"c":"a = g downward hamesha, isliye speed ek hi rate ($10\\ \\mathrm{m\\,s^{-2}}$) se ghatti aur badhti hai.","m":"Acceleration ka direction aur magnitude dono check karo har phase me.","s":["D: constant a = g → speed ka rate same → sahi.","A: acceleration hamesha downward → galat.","B: acceleration har jagah g hai → galat.","C: velocity zero par acceleration g → galat.","Isliye option (D)."],"r":{"0":"Acceleration ascend me bhi downward hota hai.","1":"g kahin bhi maximum nahi hota, constant hai.","2":"Highest point par sirf velocity zero hai."},"t":"Upward jaate waqt bhi acceleration downward — yahi sabse bada confusion point hai.","w":"","fig":null,"sim":null},{"id":127,"q":"Which one of the following statements about the equation s = ut + $\\tfrac{1}{2}at^2$ is NOT correct?","opt":["It can be applied along the vertical direction by taking upward as positive and writing a = −g."
