me ka ratio hai, half distance ka nahi."},"t":"Distance ∝ $t^{2}$ — isliye half distance pehle zyada time leta hai.","w":"","fig":null,"sim":null},{"id":263,"q":"A particle moves along a straight line starting with a velocity of +$8\\ \\mathrm{m\\,s^{-1}}$ at t = 0 and its velocity-time graph is a straight line of constant slope −$2\\ \\mathrm{m\\,s^{-2}}$, crossing the time axis at t = $4\\ \\mathrm{s}$. Consider the following statements:\nI. The magnitude of the acceleration of the particle is $2\\ \\mathrm{m\\,s^{-2}}$.\nII. The particle reverses its direction of motion at t = $4\\ \\mathrm{s}$.\nIII. The distance travelled by the particle in the first $8\\ \\mathrm{s}$ is $16\\ \\mathrm{m}$.\nIV. The displacement of the particle in the first $8\\ \\mathrm{s}$ is zero.\nThe correct statements are:","opt":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"ans":1,"c":"Do barabar triangles: 0–$4\\ \\mathrm{s}$ me +$16\\ \\mathrm{m}$, 4–$8\\ \\mathrm{s}$ me −$16\\ \\mathrm{m}$. Isliye displacement zero, distance $32\\ \\mathrm{m}$.","m":"Distance ke liye dono triangles ke magnitude jodo.","s":["I: a = −2, magnitude 2 → true.","II: v zero ho kar negative hui → true.","III: distance $=16+16=32$ m (16 nahi) → false.","IV: displacement $=16-16=0$ → true.","True set = I, II, IV → option (B)."],"r":{"0":"Isme III galat hai ($32\\ \\mathrm{m}$).","2":"Isme III hai aur I chhoot gaya.","3":"Isme III hai — eliminate."},"t":"Symmetric v–t graph ka distance 2 × triangle area hota hai; displacement zero.","w":"","fig":null,"sim":null},{"id":264,"q":"A body is projected vertically upward from the ground with a speed of $30\\ \\mathrm{m\\,s^{-1}}$. Take g = $10\\ \\mathrm{m\\,s^{-2}}$. Consider the following statements:\nI. The total time of flight of the body is $6\\ \\mathrm{s}$.\nII. The maximum height reached by the body is $45\\ \\mathrm{m}$.\nIII. The distance travelled by the body during the last second of its ascent is $5\\ \\mathrm{m}$.\nIV. The speed of the body at half of the maximum height is $15\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"$T=2u/g$, $H=u^2/2g$; half height par $v=\\sqrt{u^2-2g(H/2)}=u/\\sqrt2\\approx21.2$ $\\mathrm{m\\,s^{-1}}$.","m":"IV ko formula se check karo — answer 21.2 aata hai, 15 nahi.","s":["I: $60/10=6$ s → true.","II: $900/20=45$ m → true.","III: last second of ascent = $5\\ \\mathrm{m}$ (independent of u) → true.","IV: $v=\\dfrac{30}{\\sqrt2}\\approx21.2$ $\\mathrm{m\\,s^{-1}}$ (15 nahi) → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"Half height par speed u/$\\sqrt{2}$ hoti hai — half nahi.","w":"","fig":null,"sim":null},{"id":265,"q":"Two bodies are released from rest from the top of a tower of height $180\\ \\mathrm{m}$, the second being released exactly $2\\ \\mathrm{s}$ after the first. Take g = $10\\ \\mathrm{m\\,s^{-2}}$. Consider the following statements:\nI. The first body reaches the ground $2\\ \\mathrm{s}$ before the second body does.\nII. At the instant $4\\ \\mathrm{s}$ after the release of the first body, the separation between the two bodies is $60\\ \\mathrm{m}$.\nIII. The relative acceleration of the two bodies is zero.\nIV. The separation between the two bodies decreases with time.\nThe correct statements are:","opt":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"ans":0,"c":"Dono ka acceleration same → separation constant rate se badhta hai.","m":"Separation = 10 × time-lag based formula check karo.","s":["I: same height, $2\\ \\mathrm{s}$ ka lag → $2\\ \\mathrm{s}$ baad → true.","II: t = $4\\ \\mathrm{s}$ par: A ne $80\\ \\mathrm{m}$, B ne $20\\ \\mathrm{m}$ ($2\\ \\mathrm{s}$) → $60\\ \\mathrm{m}$ → true.","III: same g → 0 → true.","IV: separation badhta hai, ghatta nahi → false.","True set = I, II, III → option (A)."],"r":{"1":"Isme IV galat hai.","2":"Isme IV hai aur I chhoot gaya.","3":"Isme IV hai — eliminate."},"t":"Release lag ho to separation = 10 × (lag) + ...; yahan rate 10 × 2 = $20\\ \\mathrm{m\\,s^{-1}}$ hai.","w":"","fig":null,"sim":null},{"id":266,"q":"A car moving with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ is brought to rest by a driver whose reaction time is $0.5\\ \\mathrm{s}$, the brakes then producing a uniform retardation of $5\\ \\mathrm{m\\,s^{-2}}$. Consider the following statements:\nI. The total stopping distance of the car is $50\\ \\mathrm{m}$.\nII. If the speed of the car were doubled with the same retardation and the same reaction time, the total stopping distance would become exactly double.\nIII. The distance travelled by the car while the brakes are acting is $40\\ \\mathrm{m}$.\nIV. If the reaction time of the driver were zero, the stopping distance would be $40\\ \\mathrm{m}$.\nThe correct statements are:","opt":["I, III and IV only","II, III and IV only","I, II and IV only","I, II and III only"],"ans":0,"c":"Total = 10 + 40 = $50\\ \\mathrm{m}$. Speed double karne par braking part 4× hota hai, isliye total double nahi.","m":"II ko numbers se test karo: doubled speed par total $120\\ \\mathrm{m}$ hota hai, 100 nahi.","s":["I: $10+40=50$ m → true.","II: doubled par $20+160=180$? nahi: $40\\times0.5=20$ reaction + 160 braking = $180\\ \\mathrm{m}$ ≠ 100 → false.","III: braking distance $40\\ \\mathrm{m}$ → true.","IV: $t_r=0$ par sirf $40\\ \\mathrm{m}$ → true.","True set = I, III, IV → option (A)."],"r":{"3":"Isme II galat hai.","1":"Isme II hai aur I chhoot gaya.","2":"Isme II hai — eliminate."},"t":"Speed double → reaction distance 2×, braking distance 4×, total 2× se zyada.","w":"","fig":null,"sim":null},{"id":267,"q":"Consider the following statements about relative motion in one dimension:\nI. Two bodies having the same velocity at an instant have zero relative velocity and zero relative acceleration at that instant.\nII. If the relative velocity of two bodies is constant and non-zero, their relative acceleration is zero.\nIII. Two bodies released from rest at the same instant from the same height remain at rest relative to each other.\nIV. The relative velocity of two bodies moving with constant velocities remains constant with time.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":1,"c":"Same velocity ka matlab same acceleration nahi — isliye I ka doosra hissa galat hai.","m":"I me do claims hain: relative velocity zero (sahi) aur relative acceleration zero (galat).","s":["I: relative velocity 0 sahi, par relative acceleration zero nahi → false.","II: constant relative velocity → relative acceleration 0 → true.","III: dono same tarah girti hain → relative rest → true.","IV: dono constant velocities → difference constant → true.","True set = II, III, IV → option (B)."],"r":{"3":"Isme I galat hai.","0":"Isme I hai aur III chhoot gaya.","2":"Isme I hai — eliminate."},"t":"Ek hi statement ke do hisse ho to dono ko alag-alag check karo.","w":"","fig":null,"sim":null},{"id":268,"q":"Consider the following statements about graphs of one-dimensional motion:\nI. The slope of a position-time graph at an instant gives the instantaneous velocity of the body at that instant.\nII. The area under an acceleration-time graph between two instants gives the change in velocity in that interval.\nIII. A velocity-time graph that crosses the time axis corresponds to a reversal of the direction of motion.\nIV. The area under a velocity-time graph of a moving body can never be zero over a finite interval.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and III only","I, II and IV only"],"ans":2,"c":"IV galat hai: equal positive aur negative areas mil kar zero displacement de sakte hain.","m":"IV ko counter-example se reject karo.","s":["I: slope = v → true.","II: a–t area = $\\Delta v$ → true.","III: axis cross karna = direction reversal → true.","IV: zero ho sakta hai (symmetric motion) → false.","True set = I, II, III → option (C)."],"r":{"3":"Isme IV galat hai.","0":"Isme IV hai aur I chhoot gaya.","1":"Isme IV hai — eliminate."},"t":"'Can never be zero' jaise statements ko counter-example se turant kaat do.","w":"","fig":null,"sim":null},{"id":269,"q":"A body starts from rest and moves along a straight line with uniform acceleration. Consider the following statements:\nI. The distances travelled by the body in the 1st, 2nd and 3rd seconds are in the ratio 1 : 3 : 5.\nII. The ratio of the distance travelled in the nth second to the distance travelled in n seconds is (2n − 1)/$n^{2}$.\nIII. The distance travelled by the body in the nth second can never be zero for any value of n.\nIV. The distance travelled by the body in the nth second is proportional to (2n − 1).\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":0,"c":"$S_n=\\tfrac{a}{2}(2n-1)$ aur $s_n=\\tfrac12an^2$; inka ratio $(2n-1)/n^2$ hota hai.","m":"III ko a = negative ya zero ki soch se test karo — zero ho sakta hai.","s":["I: 1 : 3 : 5 → true.","II: ratio $(2n-1)/n^2$ → true.","III: a ≤ 0 ho to $S_n$ zero ya negative ho sakta hai → false.","IV: $S_n\\propto(2n-1)$ → true.","True set = I, II, IV → option (A)."],"r":{"3":"Isme III galat hai.","1":"Isme III hai aur I chhoot gaya.","2":"Isme III hai — eliminate."},"t":"'Never zero' wale statements me retardation ka case socho — turant galat nikal aate hain.","w":"","fig":null,"sim":null},{"id":270,"q":"Consider the following statements about a ball thrown vertically upward, the resistive force of air being taken to depend on the speed of the ball:\nI. In the absence of air resistance, the ball returns to the point of projection with the same speed with which it was thrown.\nII. In the presence of air resistance, the ball returns to the point of projection with a speed smaller than the speed of projection.\nIII. In the presence of air resistance, the time of ascent of the ball is greater than its time of descent.\nIV. At the highest point of its path, the acceleration of the ball is g directed downward even in the presence of air resistance.\nThe correct statements are:","opt":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"ans":1,"c":"Air resistance ascent ko slow karti hai (a > g) aur descent ko bhi slow karti hai (a < g), isliye ascent ka time kam hota hai.","m":"III me comparison ulta hai — ascent tez hota hai.","s":["I: bina resistance same speed → true.","II: resistance se speed kam → true.","III: ascent ka time kam hota hai (greater nahi) → false.","IV: highest point par velocity zero hone se resistance bhi zero, isliye a = g → true.","True set = I, II, IV → option (B)."],"r":{"0":"Isme III galat hai.","2":"Isme III hai aur I chhoot gaya.","3":"Isme III hai — eliminate."},"t":"Highest point par resistance zero ho jata hai kyunki speed zero hai — isliye a = g.","w":"","fig":null,"sim":null},{"id":271,"q":"Consider the following statements about a body moving along a straight line with uniform acceleration:\nI. The body may have zero velocity and non-zero acceleration at the same instant.\nII. The body may have zero acceleration and non-zero velocity at the same instant.\nIII. The body may reverse its direction of motion during the motion.\nIV. The body must travel equal distances in equal intervals of time.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"'Uniform acceleration' me velocity badalti hai, isliye equal distances equal times me nahi hoti (wo uniform velocity ka case hai).","m":"IV ko uniform velocity ke saath confuse mat karo.","s":["I: highest point ka case → true.","II: jab a = 0 ho (uniform acceleration ka special case) → true.","III: retardation wale case me → true.","IV: uniform acceleration me distances badalte hain → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"Uniform acceleration me equal distances ka rule lagta hi nahi — wo uniform velocity ka rule hai.","w":"","fig":null,"sim":null},{"id":272,"q":"Consider the following statements about motion as observed inside a lift:\nI. A ball released from rest inside a lift moving with a constant velocity falls with acceleration g relative to the floor of the lift.\nII. A ball released from rest inside a freely falling lift has zero acceleration relative to the floor of the lift.\nIII. A ball released from rest inside a lift accelerating upward with g/2 falls with acceleration g/2 relative to the floor of the lift.\nIV. Newton's laws of motion hold good inside a lift moving with a constant velocity without the introduction of any pseudo force.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":0,"c":"Relative acceleration floor ke respect me = g + a(lift) jab lift upar accelerate kare.","m":"III me g/2 + g = $1.5\\ \\mathrm{g}$ hoga, g/2 nahi.","s":["I: constant velocity → inertial → g → true.","II: free fall me dono saath girti hain → relative 0 → true.","III: relative acceleration $=g+g/2=1.5g$ (g/2 nahi) → false.","IV: constant velocity → inertial frame → true.","True set = I, II, IV → option (A)."],"r":{"3":"Isme III galat hai.","1":"Isme III hai aur I chhoot gaya.","2":"Isme III hai — eliminate."},"t":"Lift upar accelerate kare to andar fall tez (g + a), neeche accelerate kare to dheema (g − a).","w":"","fig":null,"sim":null},{"id":273,"q":"Which one of the following statements is NOT correct?","opt":["A body moving with a constant velocity has zero acceleration.","A body moving along a straight line with a constant speed has zero acceleration.","A body momentarily at rest must necessarily have zero acceleration at that instant.","A body may have a negative acceleration while its velocity is positive."],"ans":2,"c":"Momentary rest par acceleration non-zero ho sakta hai (highest point par a = g).","m":"C me 'must' hai — vertical throw ka highest point counter-example hai.","s":["A: constant velocity → a = 0 → sahi.","B: 1D me constant speed → a = 0 → sahi.","C: momentary rest par a ≠ 0 ho sakta hai → NOT correct.","D: braking me velocity positive aur a negative → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi hai.","1":"1D me direction fixed hoti hai, isliye sahi hai.","3":"Retardation me ye hota hai."},"t":"'Momentarily at rest' aur 'zero acceleration' do alag cheezein hain.","w":"","fig":null,"sim":null},{"id":274,"q":"Which one of the following statements is correct?","opt":["The average speed of a body is always equal to the magnitude of its average velocity.","The average speed of a body can never be less than the magnitude of its average velocity.","The average velocity of a body can never be zero for a body that has actually moved.","The magnitude of the average velocity of a body can be greater than its average speed."],"ans":1,"c":"Path length ≥ |displacement|, isliye average speed ≥ |average velocity|.","m":"Inequality ki direction check karo.","s":["D: ulta hai — |average velocity| ≤ average speed → galat.","A: sirf ek hi direction me chalne par barabar → galat.","B: yeh sahi inequality hai → sahi.","C: return journey me average velocity zero → galat.","Isliye option (B)."],"r":{"3":"Inequality ulti likh di.","0":"Sirf special case me barabar hoti hai.","2":"Return journey me zero ho sakti hai."},"t":"|v_avg| ≤ average speed — ye inequality har case me chalti hai.","w":"","fig":null,"sim":null},{"id":275,"q":"Which one of the following statements is NOT correct?","opt":["The slope of a position-time graph at an instant gives the instantaneous velocity at that instant.","The slope of a velocity-time graph at an instant gives the acceleration at that instant.","The area under an acceleration-time graph between two instants gives the change in position of the body in that interval.","The area under a velocity-time graph between two instants, taken with proper sign, gives the displacement in that interval."],"ans":2,"c":"a–t area $\\Delta v$ deta hai, position ka change nahi (uske liye v–t area chahiye).","m":"Option C ka dimension check karo: a × t = velocity, position nahi.","s":["A: x–t slope = v → sahi.","B: v–t slope = a → sahi.","C: a–t area = $\\Delta v$, position nahi → NOT correct.","D: v–t area = displacement → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi hai.","1":"Ye bhi sahi hai.","3":"Ye bhi sahi hai."},"t":"Area ka dimension check karna habit banao — aadhe options khud kat jate hain.","w":"","fig":null,"sim":null},{"id":276,"q":"Which one of the following expressions correctly gives the distance travelled by a body in the nth second of its uniformly accelerated motion, with the usual symbols?","opt":["a(2n − 1)","(u + an)n","u + a(2n − 1)/2","u + an/2"],"ans":2,"c":"$S_n$ = nth second ka distance = us second ki average velocity × $1\\ \\mathrm{s}$.","m":"Do waqt ke displacement subtract karo: $s_n-s_{n-1}$.","s":["$s_n=\\tfrac12an^2+un$, $s_{n-1}=\\tfrac12a(n-1)^2+u(n-1)$.","Difference $=u+\\dfrac{a(2n-1)}{2}$.","Isliye option (C)."],"r":{"3":"Ye average velocity ka galat form hai.","0":"Isme /2 missing hai aur u bhi nahi.","1":"Ye total distance ka galat form hai."},"t":"Formula bhool jao to $s_n-s_{n-1}$ se khud nikaal lo — 20 second ka kaam.","w":"","fig":null,"sim":null},{"id":277,"q":"Which one of the following statements is NOT correct?","opt":["If two bodies have zero relative velocity at an instant, their accelerations must also be equal at that instant.","Two bodies dropped from the same height at different instants have equal speeds at the instants when they are at the same height above the ground.","Two bodies having the same acceleration at an instant may have different velocities at that instant.","If the velocity-time graphs of two bodies are parallel straight lines, their relative acceleration is zero."],"ans":0,"c":"Zero relative velocity ka matlab same velocity hai, same acceleration nahi.","m":"A me 'must' hai — counter-example possible hai.","s":["B: same height par same speed → sahi.","C: same a, alag v (alag start times) → sahi.","D: parallel lines → same slope → same a → relative 0 → sahi.","A: same velocity se same acceleration nahi nikalta → NOT correct.","Isliye option (A)."],"r":{"1":"Energy conservation se sahi hai.","2":"Alag initial velocities se same acceleration possible.","3":"Parallel lines ka slope barabar hota hai."},"t":"Same velocity aur same acceleration bilkul independent ho sakte hain.","w":"","fig":null,"sim":null},{"id":278,"q":"Which one of the following statements is correct for a vehicle brought to rest by a constant retardation?","opt":["The braking distance is proportional to the square of the initial speed.","The braking distance is proportional to the initial speed.","The braking distance is independent of the initial speed.","The braking distance is proportional to the cube of the initial speed."],"ans":0,"c":"$s=\\dfrac{v^2}{2a}$ — isliye s ∝ $v^{2}$.","m":"Formula likho aur proportionality padho.","s":["$0=v^2-2as\\Rightarrow s=\\dfrac{v^2}{2a}$.","a constant → s ∝ $v^{2}$.","Isliye option (A)."],"r":{"1":"Linear rishta reaction distance ka hota hai, braking distance ka nahi.","2":"Speed zero ho to braking distance zero hi hoga.","3":"Cube ka rishta kahin nahi aata."},"t":"Braking distance ∝ $v^{2}$, reaction distance ∝ v — dono alag hain.","w":"","fig":null,"sim":null},{"id":279,"q":"Which one of the following statements is NOT correct?","opt":["A train moving north with a speed of $10\\ \\mathrm{m\\,s^{-1}}$ and another moving south with a speed of $10\\ \\mathrm{m\\,s^{-1}}$ have a relative speed of $20\\ \\mathrm{m\\,s^{-1}}$.","The passengers of these two trains appear to each other to approach at $20\\ \\mathrm{m\\,s^{-1}}$.","The relative velocity of two bodies depends on the frame of reference in which it is measured.","A man walking inside a train moving with $10\\ \\mathrm{m\\,s^{-1}}$, at $2\\ \\mathrm{m\\,s^{-1}}$ in the direction of the motion of the train, has a speed of $8\\ \\mathrm{m\\,s^{-1}}$ relative to the ground."],"ans":3,"c":"Same direction me speeds add hoti hain: 10 + 2 = $12\\ \\mathrm{m\\,s^{-1}}$ (8 nahi).","m":"D me subtraction laga diya — same direction me relative to ground add hota hai.","s":["A: opposite direction → 20 → sahi.","B: approach speed 20 → sahi.","C: frame par depend karti hai → sahi.","D: $10+2=12$ $\\mathrm{m\\,s^{-1}}$ hona chahiye → NOT correct.","Isliye option (D)."],"r":{"0":"Opposite direction me sum hota hai — sahi.","1":"Ye bhi sahi hai.","2":"Frame dependence sahi hai."},"t":"Ground ke respect me same direction me velocities add hoti hain; relative ke liye subtract.","w":"","fig":null,"sim":null},{"id":280,"q":"Which one of the following statements is correct?","opt":["A stone released from a balloon ascending with a constant velocity has zero initial velocity relative to the ground.","A stone released from a balloon ascending with a constant velocity moves upward relative to the ground immediately after release.","A stone released from a balloon ascending with a constant velocity moves downward relative to the ground immediately after release.","The acceleration of a stone released from a stationary balloon is zero relative to the balloon."],"ans":1,"c":"Release ke instant par stone ki velocity balloon ki velocity ke barabar (upar) hoti hai.","m":"Velocity aur acceleration alag-alag likho release ke baad.","s":["A: velocity balloon jitni upar hoti hai → galat.","B: upar hi jaati hai (phir ruk kar neeche) → sahi.","C: turant neeche nahi jaati → galat.","D: stationary balloon me bhi a = g → galat.","Isliye option (B)."],"r":{"0":"Velocity carry hoti hai release ke waqt.","2":"Upar ki velocity pehle zero honi chahiye, phir neeche.","3":"Stationary balloon inertial frame hai, isliye a = g."},"t":"Balloon problems me 'initial velocity = balloon velocity' — ye pehli line likho.","w":"","fig":null,"sim":null},{"id":281,"q":"Which one of the following statements is NOT correct?","opt":["Velocity is the rate of change of position and acceleration is the rate of change of velocity with respect to time.","The area under a velocity-time graph between two instants gives the displacement in that interval.","For a body starting from rest with a = 2t (SI units), the velocity at t = $2\\ \\mathrm{s}$ is $4\\ \\mathrm{m\\,s^{-1}}$.","If the velocity of a body is v = $t^{2}$ (SI units), its acceleration is constant."],"ans":3,"c":"$v=t^2$ ho to $a=2t$, jo constant nahi hai.","m":"D ko differentiate karke check karo.","s":["A: definitions → sahi.","B: v–t area = displacement → sahi.","C: $v=\\int2t\\,dt=t^2=4$ → sahi.","D: $a=2t$ (constant nahi) → NOT correct.","Isliye option (D)."],"r":{"0":"Ye sahi definitions hain.","1":"Ye bhi sahi hai.","2":"Integration se $4\\ \\mathrm{m\\,s^{-1}}$ aata hai."},"t":"Differentiate karke check karo — variable a turant pakda jayega.","w":"","fig":null,"sim":null},{"id":282,"q":"Which one of the following statements is correct?","opt":["A body thrown vertically upward has its maximum acceleration at the highest point of its path.","A body thrown vertically upward has zero acceleration at the highest point of its path.","A body thrown vertically upward returns to the point of projection with the same speed, air resistance being neglected.","For a body thrown vertically upward, the time of descent is greater than the time of ascent, air resistance being neglected."],"ans":2,"c":"Air resistance na ho to a = g hamesha, aur wapsi speed same hoti hai.","m":"Teen options acceleration/constancy ke baare me hain — wahi check karo.","s":["A: a = g hamesha, maximum nahi → galat.","B: highest point par a = g ≠ 0 → galat.","C: symmetry se same speed → sahi.","D: times barabar hote hain → galat.","Isliye option (C)."],"r":{"0":"Acceleration constant hai, badhta nahi.","1":"Highest point par bhi a = g.","3":"Air resistance na ho to ascent = descent time."},"t":"Bina resistance: same speed, same time. Resistance ke saath dono badal jate hain.","w":"","fig":null,"sim":null},{"id":283,"q":"Match each case in Column I with the distance travelled in Column II. The motion is along a straight line with the given uniform acceleration and initial velocity.\nColumn I: (a) u = 0, a = $2\\ \\mathrm{m\\,s^{-2}}$; distance in the 4th second (b) u = 0, a = $2\\ \\mathrm{m\\,s^{-2}}$; distance in the first $4\\ \\mathrm{s}$ (c) u = 0, a = $2\\ \\mathrm{m\\,s^{-2}}$; velocity after $4\\ \\mathrm{s}$ (d) u = $10\\ \\mathrm{m\\,s^{-1}}$, a = $2\\ \\mathrm{m\\,s^{-2}}$; distance in the 4th second\nColumn II: (i) $8\\ \\mathrm{m\\,s^{-1}}$ (ii) $7\\ \\mathrm{m}$ (iii) $17\\ \\mathrm{m}$ (iv) $16\\ \\mathrm{m}$","opt":["a-iv, b-iii, c-ii, d-i","a-ii, b-iv, c-i, d-iii","a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-iv, d-ii"],"ans":1,"c":"Chaaro me a = 2 hai; nth second ke liye $S_n=u+\\tfrac{a(2n-1)}{2}$, total ke liye $\\tfrac12at^2$.","m":"Har case me n = 4 daal kar dekho.","s":["(a) $S_4=0+\\dfrac{2(7)}{2}=7$ m → ii.","(b) $\\tfrac12(2)(16)=16$ m → iv.","(c) $v=2\\times4=8$ $\\mathrm{m\\,s^{-1}}$ → i.","(d) $S_4=10+7=17$ m → iii.","Isliye a-ii, b-iv, c-i, d-iii → option (B)."],"r":{"2":"(a) me $8\\ \\mathrm{m\\,s^{-1}}$ daal diya, jo velocity hai.","3":"(a) me $17\\ \\mathrm{m}$ daal diya (d ka answer).","0":"(a) me $16\\ \\mathrm{m}$ daal diya (b ka answer)."},"t":"(i) ka unit velocity ka hai — match karte waqt units dekho.","w":"","fig":null,"sim":null},{"id":284,"q":"Match each case in Column I with the value in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$.\nColumn I: (a) Speed acquired in $3\\ \\mathrm{s}$ of free fall from rest (b) Distance fallen in $3\\ \\mathrm{s}$ of free fall from rest (c) Distance fallen in the 4th second of free fall from rest (d) Time taken to fall $20\\ \\mathrm{m}$ from rest\nColumn II: (i) $2\\ \\mathrm{s}$ (ii) $30\\ \\mathrm{m\\,s^{-1}}$ (iii) $45\\ \\mathrm{m}$ (iv) $35\\ \\mathrm{m}$","opt":["a-ii, b-iii, c-iv, d-i","a-i, b-ii, c-iii, d-iv","a-iii, b-iv, c-i, d-ii","a-iv, b-i, c-ii, d-iii"],"ans":0,"c":"Free fall ke chaar standard results: v = gt, h = $\\tfrac{1}{2}g$$t^{2}$, S_n = 5(2n−1), t = $\\sqrt{2h/g}$.","m":"Chaar chhote calculations karo.","s":["(a) $10\\times3=30$ $\\mathrm{m\\,s^{-1}}$ → ii.","(b) $5\\times9=45$ m → iii.","(c) $5(7)=35$ m → iv.","(d) $20=5t^2\\Rightarrow t=2$ s → i.","Isliye a-ii, b-iii, c-iv, d-i → option (A)."],"r":{"1":"(a) me $2\\ \\mathrm{s}$ daal diya.","2":"(a) me $45\\ \\mathrm{m}$ daal diya (b ka answer).","3":"(a) me $35\\ \\mathrm{m}$ daal diya (c ka answer)."},"t":"Free fall ke char values (30, 45, 35, 2) yaad rakhne layak hain.","w":"","fig":null,"sim":null},{"id":285,"q":"Match the graphs in Column I with the descriptions of motion in Column II:\nColumn I: (a) Position-time graph that is a parabola opening downward (b) Velocity-time graph that is a straight line of negative slope ending on the time axis (c) Velocity-time graph that is a straight line of positive slope starting from a positive value on the velocity axis (d) Position-time graph that is a straight line passing through the origin\nColumn II: (i) Body moving with uniform velocity, starting from the origin (ii) Body starting with an initial velocity and moving with uniform acceleration (iii) Body moving with an initial velocity and brought to rest by uniform retardation (iv) Body moving with an initial velocity and uniform negative acceleration, with a reversal of direction","opt":["a-iv, b-iii, c-ii, d-i","a-i, b-ii, c-iii, d-iv","a-iii, b-iv, c-i, d-ii","a-ii, b-i, c-iv, d-iii"],"ans":0,"c":"Downward parabola → negative acceleration with reversal possible; v–t negative slope ending on axis → retardation; positive slope from positive intercept → initial velocity + acceleration.","m":"Har shape ka matlab likho.","s":["(a) downward parabola → reversal wala negative acceleration → iv.","(b) $v_{0}$ se 0 → retardation → iii.","(c) $v_{0}$ se badhti → initial velocity + uniform acceleration → ii.","(d) origin se line → uniform velocity → i.","Isliye a-iv, b-iii, c-ii, d-i → option (A)."],"r":{"1":"(a) ko uniform velocity likh diya.","2":"(a) me retardation wala motion daal diya.","3":"(a) me uniform acceleration daal diya."},"t":"Parabola ka opening acceleration ka sign batata hai; v–t line ka intercept initial velocity.","w":"","fig":null,"sim":null},{"id":286,"q":"Match each situation in Column I with the value in Column II:\nColumn I: (a) Relative speed of two cars moving in the same direction with speeds $20\\ \\mathrm{m\\,s^{-1}}$ and $30\\ \\mathrm{m\\,s^{-1}}$ (b) Relative speed of two cars moving in opposite directions with speeds $20\\ \\mathrm{m\\,s^{-1}}$ and $30\\ \\mathrm{m\\,s^{-1}}$ (c) Time taken by a train of length $200\\ \\mathrm{m}$ moving at $20\\ \\mathrm{m\\,s^{-1}}$ to pass a pole (d) Time taken by a train of length $100\\ \\mathrm{m}$ moving at $10\\ \\mathrm{m\\,s^{-1}}$ to pass a bridge $100\\ \\mathrm{m}$ long\nColumn II: (i) $10\\ \\mathrm{s}$ (ii) $20\\ \\mathrm{s}$ (iii) $10\\ \\mathrm{m\\,s^{-1}}$ (iv) $50\\ \\mathrm{m\\,s^{-1}}$","opt":["a-iii, b-iv, c-i, d-ii","a-i, b-ii, c-iii, d-iv","a-iv, b-iii, c-ii, d-i","a-ii, b-i, c-iv, d-iii"],"ans":0,"c":"Same direction → difference; opposite → sum; pole → length of train; bridge → train + bridge.","m":"Chaar chhote calculations.","s":["(a) 30 − 20 = $10\\ \\mathrm{m\\,s^{-1}}$ → iii.","(b) 30 + 20 = $50\\ \\mathrm{m\\,s^{-1}}$ → iv.","(c) 200/20 = $10\\ \\mathrm{s}$ → i.","(d) 200/10 = $20\\ \\mathrm{s}$ → ii.","Isliye a-iii, b-iv, c-i, d-ii → option (A)."],"r":{"1":"(a) me $10\\ \\mathrm{s}$ daal diya.","2":"(a) me 50 daal diya (b ka answer).","3":"(a) me $20\\ \\mathrm{s}$ daal diya (d ka answer)."},"t":"Bridge me dono length jodo — yahi ek step zyada galti ki jagah hai.","w":"","fig":null,"sim":null},{"id":287,"q":"Match each case in Column I with the distance in Column II:\nColumn I: (a) A car moving at $10\\ \\mathrm{m\\,s^{-1}}$ with a reaction time of $0.5\\ \\mathrm{s}$; distance travelled during the reaction time (b) A car moving at $20\\ \\mathrm{m\\,s^{-1}}$ and retarded uniformly at $4\\ \\mathrm{m\\,s^{-2}}$; braking distance (c) A car moving at $20\\ \\mathrm{m\\,s^{-1}}$ and retarded uniformly at $8\\ \\mathrm{m\\,s^{-2}}$; braking distance (d) A car moving at $20\\ \\mathrm{m\\,s^{-1}}$ with a reaction time of $0.5\\ \\mathrm{s}$; distance travelled during the reaction time\nColumn II: (i) $5\\ \\mathrm{m}$ (ii) $10\\ \\mathrm{m}$ (iii) $25\\ \\mathrm{m}$ (iv) $50\\ \\mathrm{m}$","opt":["a-i, b-iv, c-iii, d-ii","a-ii, b-iii, c-iv, d-i","a-iv, b-i, c-ii, d-iii","a-iii, b-ii, c-i, d-iv"],"ans":0,"c":"Reaction distance = v t(r); braking distance = $v^{2}$/2a.","m":"Chaar calculations, do formulas.","s":["(a) $10\\times0.5=5$ m → i.","(b) $400/8=50$ m → iv.","(c) $400/16=25$ m → iii.","(d) $20\\times0.5=10$ m → ii.","Isliye a-i, b-iv, c-iii, d-ii → option (A)."],"r":{"1":"(a) me $10\\ \\mathrm{m}$ daal diya (d ka answer).","2":"(a) me $50\\ \\mathrm{m}$ daal diya (b ka answer).","3":"(a) me $25\\ \\mathrm{m}$ daal diya (c ka answer)."},"t":"Retardation double → braking distance aadha; ye check se answer verify ho jata hai.","w":"","fig":null,"sim":null},{"id":288,"q":"Match each relation in Column I with the value in Column II. Here x is in metre and v is in $\\mathrm{m\\,s^{-1}}$, with t in second.\nColumn I: (a) x = 2$t^{2}$; velocity at t = $3\\ \\mathrm{s}$ (b) x = 2$t^{3}$; acceleration at t = $2\\ \\mathrm{s}$ (c) v = 4t, body starting from the origin; displacement in the first $2\\ \\mathrm{s}$ (d) v = 5$t^{2}$; acceleration at t = $1\\ \\mathrm{s}$\nColumn II: (i) $8\\ \\mathrm{m}$ (ii) $10\\ \\mathrm{m\\,s^{-2}}$ (iii) $12\\ \\mathrm{m\\,s^{-1}}$ (iv) $24\\ \\mathrm{m\\,s^{-2}}$","opt":["a-iii, b-iv, c-i, d-ii","a-i, b-ii, c-iii, d-iv","a-ii, b-iii, c-iv, d-i","a-iv, b-i, c-ii, d-iii"],"ans":0,"c":"Position wale cases me differentiate, velocity wale me integrate (displacement) ya differentiate (acceleration).","m":"Har relation ke liye sahi operation chuno.","s":["(a) $v=4t\\Rightarrow12$ → iii.","(b) $a=12t\\Rightarrow24$ → iv.","(c) $x=\\int_0^2 4t\\,dt=8$ → i.","(d) $a=10t\\Rightarrow10$ → ii.","Isliye a-iii, b-iv, c-i, d-ii → option (A)."],"r":{"1":"(a) me $8\\ \\mathrm{m}$ daal diya (c ka answer).","2":"(a) me 10 daal diya (d ka answer).","3":"(a) me 24 daal diya (b ka answer)."},"t":"x diya ho to differentiate; v diya ho to displacement ke liye integrate.","w":"","fig":null,"sim":null},{"id":289,"q":"Assertion: For a body moving with uniform acceleration along a straight line, the average velocity over any time interval is equal to the arithmetic mean of its initial and final velocities for that interval.\nReason: The velocity-time graph of a body moving with uniform acceleration is a straight line.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Straight line v–t graph ka area trapezium hota hai, jisse average velocity (u+v)/2 nikalta hai.","m":"Graph shape se result derive karo — yahi explanation hai.","s":["A true: (u + v)/2.","R true: straight line.","Trapezium area se average (u+v)/2 hi aata hai → option (A)."],"r":{"1":"Reason hi explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"v–t straight line → area trapezium → average velocity (u+v)/2.","w":"","fig":null,"sim":null},{"id":290,"q":"Assertion: A body dropped from a train moving with uniform velocity appears to an observer inside the train to fall vertically downward, air resistance being neglected.\nReason: At the instant of release the body retains the horizontal velocity of the train, so its horizontal velocity relative to the train is zero.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Train ke frame me horizontal velocity zero hai, isliye ball seedha neeche girti dikhti hai.","m":"Frame me relative velocity nikalo.","s":["A true: train ke andar vertical fall.","R true: horizontal velocity retain hoti hai.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Train ke andar vertical, ground par parabola — frame badalne se path badal jata hai.","w":"","fig":null,"sim":null},{"id":291,"q":"Assertion: For a body moving along a straight line with zero acceleration, the distance travelled in the nth second is equal to the distance travelled in the (n + 1)th second.\nReason: A body moving with zero acceleration has a constant velocity.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Constant velocity me har second ka distance v × 1 = v hota hai — isliye barabar.","m":"Reason se seedha assertion nikalta hai.","s":["A true: har second me same distance.","R true: a = 0 → v constant.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Uniform velocity me har second ka distance barabar — ye definition se hi aata hai.","w":"","fig":null,"sim":null},{"id":292,"q":"Assertion: The relative velocity of two bodies having the same uniform acceleration changes with time at a constant rate.\nReason: The relative acceleration of the two bodies is zero.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":3,"c":"Same acceleration → relative velocity constant hoti hai, badalti nahi. Isliye assertion galat, reason sach.","m":"Relative acceleration zero ka matlab relative velocity ka rate of change zero.","s":["A false: relative velocity constant rehti hai.","R true: relative acceleration = 0.","False assertion + true reason → option (D)."],"r":{"0":"Assertion galat hai.","1":"Assertion galat hai.","2":"Reason sach hai."},"t":"Relative acceleration zero → relative velocity constant (badalna nahi).","w":"","fig":null,"sim":null},{"id":293,"q":"Assertion: The total stopping distance of a car is always proportional to the square of its speed.\nReason: The distance travelled by the car during the reaction time of the driver is proportional to the speed of the car.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":3,"c":"Total = v t(r) + $v^{2}$/2a — isme linear term bhi hai, isliye 'always $v^{2}$' galat hai.","m":"Reason sach hai (linear term) — aur isi wajah se assertion galat ho jata hai.","s":["A false: total pure $v^{2}$ ke proportional nahi.","R true: reaction distance ∝ v.","False assertion + true reason → option (D)."],"r":{"0":"Assertion galat hai.","1":"Assertion galat hai.","2":"Reason sach hai."},"t":"Reaction time zero ho tabhi total stopping distance $v^{2}$ ke proportional hota hai.","w":"","fig":null,"sim":null},{"id":294,"q":"Assertion: For a body thrown vertically upward, the displacement of the body in the time interval between its two passages through the same point of its path is zero.\nReason: The body passes through that point with equal speeds while going up and while coming down.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":1,"c":"Displacement zero isliye hai kyunki dono baar position same hai — speeds barabar hona iska kaaran nahi.","m":"Dono statements sach hain, par reason explanation nahi hai.","s":["A true: same point → displacement 0.","R true: same point par same speed.","Par zero displacement ki wajah position ka same hona hai → option (B)."],"r":{"0":"Reason kaaran nahi hai, sirf ek additional fact hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"A-R me reason ko 'kyun' se test karo — sirf 'sach' hona kaafi nahi.","w":"","fig":null,"sim":null},{"id":295,"q":"The velocity-time graph of a body is as follows: 0–$10\\ \\mathrm{s}$ velocity rises uniformly from 0 to $20\\ \\mathrm{m\\,s^{-1}}$; 10–$20\\ \\mathrm{s}$ constant at $20\\ \\mathrm{m\\,s^{-1}}$; 20–$25\\ \\mathrm{s}$ decreases uniformly to 0; 25–$30\\ \\mathrm{s}$ constant at −$10\\ \\mathrm{m\\,s^{-1}}$. For the interval t = 0 to t = $30\\ \\mathrm{s}$, the distance travelled and the magnitude of the displacement of the body are respectively:","opt":["$400\\ \\mathrm{m}$ and $300\\ \\mathrm{m}$","$400\\ \\mathrm{m}$ and $400\\ \\mathrm{m}$","$450\\ \\mathrm{m}$ and $350\\ \\mathrm{m}$","$350\\ \\mathrm{m}$ and $350\\ \\mathrm{m}$"],"ans":0,"c":"Signed areas se displacement, |area| se distance.","m":"Chaar areas nikalo: 100, 200, 50, −50.","s":["Distance $=100+200+50+50=400$ m.","Displacement $=100+200+50-50=300$ m.","Isliye $400\\ \\mathrm{m}$ aur $300\\ \\mathrm{m}$ → option (A)."],"r":{"3":"Displacement me negative area ignore kar diya.","1":"Displacement 400 nahi, 300 hai.","2":"Distance 400 hai, 450 nahi."},"t":"Starting velocity zero aur negative phase ke saath graph ho to signed area zaroor lena.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,0],[10,20],[20,20],[25,0],[25,-10],[30,-10]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":296,"q":"The position-time graph of a particle is as follows: from t = 0 to t = $2\\ \\mathrm{s}$ the position is x = 5$t^{2}$ (a parabola from x = 0 to x = $20\\ \\mathrm{m}$); from t = $2\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$ the graph is horizontal at x = $20\\ \\mathrm{m}$. The instantaneous velocity of the particle at t = $1\\ \\mathrm{s}$ and at t = $4\\ \\mathrm{s}$ are respectively:","opt":["$10\\ \\mathrm{m\\,s^{-1}}$ and zero","$5\\ \\mathrm{m\\,s^{-1}}$ and zero","$20\\ \\mathrm{m\\,s^{-1}}$ and $20\\ \\mathrm{m\\,s^{-1}}$","$10\\ \\mathrm{m\\,s^{-1}}$ and $5\\ \\mathrm{m\\,s^{-1}}$"],"ans":0,"c":"Parabolic part me v = dx/dt; horizontal part me slope zero → velocity zero.","m":"Pehle derivative, phir horizontal segment ka slope.","s":["$x=5t^2\\Rightarrow v=10t$; t = 1 par v = $10\\ \\mathrm{m\\,s^{-1}}$.","t = $4\\ \\mathrm{s}$ par graph horizontal → slope 0 → v = 0.","Isliye option (A)."],"r":{"3":"t = $4\\ \\mathrm{s}$ par velocity zero hai, 5 nahi.","1":"t = $1\\ \\mathrm{s}$ par 10 aata hai (5 nahi).","2":"Dono galat — 20 displacement hai, velocity nahi."},"t":"x–t graph ka horizontal part = body rest par; wahan velocity zero.","w":"","fig":{"t":"g","kind":"xt","series":[{"pts":[[0,0],[1,5],[2,20]],"color":"#7fb2ee","name":"x = 5$t^{2}$"},{"pts":[[2,20],[6,20]],"color":"#e0a33a","name":"at rest"}],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":297,"q":"The velocity of a body moving along a straight line is recorded at equal intervals of $1\\ \\mathrm{s}$ in the following data table. Assuming the velocity to vary uniformly between the recorded instants, the acceleration of the body and the displacement during the interval t = 0 to t = $4\\ \\mathrm{s}$ are respectively:","opt":["$4\\ \\mathrm{m\\,s^{-2}}$ and $36\\ \\mathrm{m}$","$4\\ \\mathrm{m\\,s^{-2}}$ and $40\\ \\mathrm{m}$","$4\\ \\mathrm{m\\,s^{-2}}$ and $44\\ \\mathrm{m}$","$2\\ \\mathrm{m\\,s^{-2}}$ and $40\\ \\mathrm{m}$"],"ans":1,"c":"Velocity linear badh rahi hai → acceleration constant; displacement trapezium area se.","m":"$a=\\Delta v/\\Delta t$, phir (u + v)/2 × t.","s":["$a=(6-2)/1=4$ $\\mathrm{m\\,s^{-2}}$.","$s=\\dfrac{2+18}{2}\\times4$.","$=10\\times4=40$ m → option (B)."],"r":{"2":"44 aata hai agar $4\\ \\mathrm{s}$ ka average galat lo.","3":"Acceleration 2 galat hai.","0":"36 aata hai agar $4\\ \\mathrm{s}$ ke bajaye $3.6\\ \\mathrm{s}$ lo."},"t":"(u + v)/2 × t — linear v–t ke liye sabse fast formula.","w":"","fig":{"t":"tab","head":["t (s)","v ($\\mathrm{m\\,s^{-1}}$)"],"rows":[["0","2"],["1","6"],["2","10"],["3","14"],["4","18"]]},"sim":null},{"id":298,"q":"The acceleration-time graph of a body starting from rest is as follows: 0–$5\\ \\mathrm{s}$ a = +$4\\ \\mathrm{m\\,s^{-2}}$; 5–$10\\ \\mathrm{s}$ a = 0; from t = $10\\ \\mathrm{s}$ onwards a = −$8\\ \\mathrm{m\\,s^{-2}}$. The velocity of the body becomes zero at:","opt":["t = $15\\ \\mathrm{s}$","t = $12\\ \\mathrm{s}$","t = $12.5\\ \\mathrm{s}$","t = $13\\ \\mathrm{s}$"],"ans":2,"c":"Pehle a–t area se velocity banaiye, phir negative area se zero hone ka time nikalo.","m":"v(10) = $20\\ \\mathrm{m\\,s^{-1}}$; uske baad $8\\ \\mathrm{m\\,s^{-2}}$ ki retardation.","s":["0–$5\\ \\mathrm{s}$: v = $20\\ \\mathrm{m\\,s^{-1}}$; 5–$10\\ \\mathrm{s}$: v = $20\\ \\mathrm{m\\,s^{-1}}$.","$10\\ \\mathrm{s}$ ke baad: $0=20-8(t-10)$.","$t-10=2.5\\Rightarrow t=12.5$ s → option (C)."],"r":{"1":"$12\\ \\mathrm{s}$ par velocity $4\\ \\mathrm{m\\,s^{-1}}$ rehti hai.","3":"$13\\ \\mathrm{s}$ par velocity negative ho chuki hoti hai.","0":"$15\\ \\mathrm{s}$ par velocity −$20\\ \\mathrm{m\\,s^{-1}}$ hoti hai."},"t":"Retardation phase me velocity zero ka time: t = $t_{0}$ + $v_{0}$/a.","w":"","fig":{"t":"g","kind":"at","pts":[[0,4],[5,4],[5,0],[10,0],[10,-8],[13,-8]],"yl":"a (m s^{-2})","xl":"t (s)"},"sim":null},{"id":299,"q":"The velocity-time graph of a body is as follows: from t = 0 to t = $2\\ \\mathrm{s}$ the velocity decreases uniformly from $20\\ \\mathrm{m\\,s^{-1}}$ to 0; from t = $2\\ \\mathrm{s}$ to t = $4\\ \\mathrm{s}$ the velocity decreases uniformly from 0 to −$20\\ \\mathrm{m\\,s^{-1}}$. For the interval t = 0 to t = $4\\ \\mathrm{s}$, the average speed and the magnitude of the average velocity are respectively:","opt":["$10\\ \\mathrm{m\\,s^{-1}}$ and $10\\ \\mathrm{m\\,s^{-1}}$","$10\\ \\mathrm{m\\,s^{-1}}$ and zero","zero and $10\\ \\mathrm{m\\,s^{-1}}$","$20\\ \\mathrm{m\\,s^{-1}}$ and zero"],"ans":1,"c":"Distance $40\\ \\mathrm{m}$, displacement 0 → average speed 10, |average velocity| 0.","m":"Dono triangles ka area nikalo, signs ke saath aur bina.","s":["Distance $=20+20=40$ m → average speed $=40/4=10$ $\\mathrm{m\\,s^{-1}}$.","Displacement $=+20-20=0$ → $|v_{avg}|=0$.","Isliye option (B)."],"r":{"0":"Average velocity zero hai, 10 nahi.","2":"Values ulat gayi.","3":"Average speed 10 hai, 20 nahi."},"t":"Symmetric graph: distance = 2 × area, displacement zero.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,20],[2,0],[4,-20]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":300,"q":"The position of a body moving along a straight line is recorded in the following data table. The acceleration of the body is:","opt":["$3\\ \\mathrm{m\\,s^{-2}}$","$6\\ \\mathrm{m\\,s^{-2}}$","$9\\ \\mathrm{m\\,s^{-2}}$","not uniform, since the body starts from rest"],"ans":1,"c":"x/$t^{2}$ ratio check karo — constant mile to uniform acceleration, aur $x=\\tfrac12at^2$ se a = 2 × coefficient.","m":"Table me x = 3$t^{2}$ dikh raha hai.","s":["$x/t^2$: 3, 3, 3, 3 → $x=3t^2$.","$\\tfrac12a=3\\Rightarrow a=6$ $\\mathrm{m\\,s^{-2}}$.","Uniform hai → option (B)."],"r":{"0":"3 coefficient hai; acceleration uska double hota hai.","2":"9 aata hai agar cube wala pattern socho.","3":"Rest se start hona uniform acceleration ko rokta nahi."},"t":"$x=kt^2$ ho to a = 2k — coefficient ka double. Ye shortcut yaad rakho.","w":"","fig":{"t":"tab","head":["t (s)","x (m)"],"rows":[["0","0"],["1","3"],["2","12"],["3","27"],["4","48"]]},"sim":null},{"id":301,"q":"A particle moves along the x-axis with velocity v = (4t − $t^{2}$) $\\mathrm{m\\,s^{-1}}$. The distance travelled by the particle in the first $5\\ \\mathrm{s}$ is:","opt":["$10\\ \\mathrm{m}$","$13\\ \\mathrm{m}$","$16\\ \\mathrm{m}$","25/$3\\ \\mathrm{m}$"],"ans":1,"c":"v ka sign t = $4\\ \\mathrm{s}$ par badalta hai, isliye distance ke liye integral do hisson me todna hoga.","m":"Reversal point nikalo, phir |∫v dt| dono hisson ka jodo.","s":["$v=0\\Rightarrow t=4$ s.","0–$4\\ \\mathrm{s}$: $\\left[2t^2-\\dfrac{t^3}{3}\\right]_0^4=32-\\dfrac{64}{3}=\\dfrac{32}{3}$ m.","4–$5\\ \\mathrm{s}$: $\\left|(50-\\dfrac{125}{3})-\\dfrac{32}{3}\\right|=\\dfrac{7}{3}$ m. Total $=\\dfrac{39}{3}=13$ m → option (B)."],"r":{"0":"$10\\ \\mathrm{m}$ kisi hisse ka galat hisaab hai.","2":"$16\\ \\mathrm{m}$ displacement aur distance ko mix karne se aata hai.","3":"25/3 sirf ek hissa hai."},"t":"v–t curve ke sign change par distance ke liye integral todo — warna distance kam aayega.","w":"","fig":null,"sim":null},{"id":302,"q":"A body is projected vertically upward from the ground with a speed u, air resistance being neglected. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the distance travelled by the body during the last second of its upward journey is:","opt":["$u^{2}$/$20\\ \\mathrm{m}$","$5\\ \\mathrm{m}$, whatever the value of u","u/$10\\ \\mathrm{m}$","$10\\ \\mathrm{m}$, whatever the value of u"],"ans":1,"c":"Last second of ascent ko ulta socho: highest point par v = 0, isliye $1\\ \\mathrm{s}$ me girne wala distance $\\tfrac12g(1)^2$.","m":"Reverse motion me initial velocity zero maan kar $1\\ \\mathrm{s}$ ka distance nikalo.","s":["$s=\\tfrac12\\times10\\times1^2$.","$=5$ m.","u ki koi bhumika nahi → option (B)."],"r":{"2":"u ke saath badalna galat hai — last second me speed 0 se shuru hoti hai.","3":"$10\\ \\mathrm{m}$ aata hai agar $\\tfrac{1}{2}$ na lagao.","0":"$u^{2}$/20 maximum height ka formula hai."},"t":"Ascent ke last second ka distance hamesha $5\\ \\mathrm{m}$ hota hai — ek powerful shortcut.","w":"","fig":null,"sim":null},{"id":303,"q":"Two particles A and B move along the x-axis. At t = 0, particle A starts from the origin with velocity $4\\ \\mathrm{m\\,s^{-1}}$ and has a constant acceleration of −$1\\ \\mathrm{m\\,s^{-2}}$, while particle B starts at x = $10\\ \\mathrm{m}$ with a constant velocity of −$2\\ \\mathrm{m\\,s^{-1}}$. The two particles occupy the same position at:","opt":["t = $2\\ \\mathrm{s}$ and t = $10\\ \\mathrm{s}$","t = $4\\ \\mathrm{s}$ and t = $8\\ \\mathrm{s}$","t = $2\\ \\mathrm{s}$ only","t = $10\\ \\mathrm{s}$ only"],"ans":0,"c":"Dono particles ki position ko time ka function banao aur barabar rakho.","m":"Quadratic equation banegi, uske dono roots valid ho sakte hain.","s":["$x_A=4t-\\tfrac12t^2$, $x_B=10-2t$.","$4t-0.5t^2=10-2t\\Rightarrow t^2-12t+20=0$.","$(t-2)(t-10)=0\\Rightarrow t=2$ s aur $t=10$ s → option (A)."],"r":{"2":"Sirf pehla root liya — dusra bhi valid hai.","3":"Sirf dusra root liya.","1":"Roots galat nikale."},"t":"Milne ka matlab position barabar; quadratic ke dono positive roots valid ho sakte hain.","w":"","fig":null,"sim":null},{"id":304,"q":"A train $150\\ \\mathrm{m}$ long passes a man standing on a platform in $10\\ \\mathrm{s}$ and passes the whole platform in $25\\ \\mathrm{s}$. The length of the platform is:","opt":["$225\\ \\mathrm{m}$","$300\\ \\mathrm{m}$","$375\\ \\mathrm{m}$","$150\\ \\mathrm{m}$"],"ans":0,"c":"Man cross karne me sirf train ki length; platform cross karne me train + platform.","m":"Pehle speed nikalo, phir $25\\ \\mathrm{s}$ me total distance, phir platform.","s":["$v=150/10=15$ $\\mathrm{m\\,s^{-1}}$.","$25\\ \\mathrm{s}$ me $15\\times25=375$ m.","Platform $=375-150=225$ m → option (A)."],"r":{"3":"$150\\ \\mathrm{m}$ sirf train ki length hai.","1":"$300\\ \\mathrm{m}$ aata hai agar speed 12 le lo.","2":"$375\\ \\mathrm{m}$ total distance hai, platform nahi."},"t":"Pehle speed nikaalne se do-teen questions ek saath solve ho jate hain.","w":"","fig":null,"sim":null},{"id":305,"q":"The velocity of a body moving along a straight line decreases with time according to $v = 10e^{-2t}$ $\\mathrm{m\\,s^{-1}}$. The distance travelled by the body before it comes to rest, and its acceleration at t = 0, are respectively:","opt":["$20\\ \\mathrm{m}$ and −$10\\ \\mathrm{m\\,s^{-2}}$","$5\\ \\mathrm{m}$ and −$20\\ \\mathrm{m\\,s^{-2}}$","$10\\ \\mathrm{m}$ and −$20\\ \\mathrm{m\\,s^{-2}}$","$5\\ \\mathrm{m}$ and −$2\\ \\mathrm{m\\,s^{-2}}$"],"ans":1,"c":"Distance ke liye v ka 0 se ∞ tak integral; acceleration ke liye derivative at t = 0.","m":"Do alag operations: integral aur derivative.","s":["$s=\\int_0^\\infty 10e^{-2t}dt=\\dfrac{10}{2}=5$ m.","$a=\\dfrac{dv}{dt}=-20e^{-2t}$; t = 0 par $a=-20$ $\\mathrm{m\\,s^{-2}}$.","Isliye $5\\ \\mathrm{m}$ aur −$20\\ \\mathrm{m\\,s^{-2}}$ → option (B)."],"r":{"2":"Distance $5\\ \\mathrm{m}$ hai, 10 nahi (2 se divide karna hai).","3":"Acceleration ka coefficient (20) chhoot gaya.","0":"Dono galat — integral aur derivative mix ho gaye."},"t":"$e^{-kt}$ ka integral $1/k$ deta hai aur derivative $-k$ deta hai — ye do facts kaafi hain.","w":"","fig":null,"sim":null},{"id":306,"q":"A body starting with velocity u moves along a straight line with uniform acceleration a. It covers a distance $s_{1}$ in the first n seconds and a further distance $s_{2}$ in the next n seconds. The acceleration of the body is:","opt":["($s_{2}$ + $s_{1}$)/$n^{2}$","($s_{2}$ − $s_{1}$)/2n","($s_{2}$ − $s_{1}$)/$n^{2}$","($s_{2}$ − $s_{1}$)/2$n^{2}$"],"ans":2,"c":"Successive equal intervals me displacement ka difference constant $aT^{2}$ hota hai.","m":"Pehle interval aur doosre interval ke displacements likho, phir subtract karo.","s":["$s_1=un+\\tfrac12an^2$.","Doosre interval me $s_2=\\left[u(2n)+\\tfrac12a(4n^2)\\right]-s_1=un+\\dfrac{3}{2}an^2$.","$s_2-s_1=an^2\\Rightarrow a=\\dfrac{s_2-s_1}{n^2}$ → option (C)."],"r":{"3":"2 se divide karna galat hai — $aT^{2}$ me square hi aata hai.","0":"Difference lena chahiye, sum nahi.","1":"Dimension bhi galat (n nahi $n^{2}$)."},"t":"$s_2-s_1=aT^2$ — successive equal intervals ka difference. Ye result bahut kaam aata hai.","w":"","fig":null,"sim":null},{"id":307,"q":"A particle moves along the x-axis such that $v^{2}$ = 4$x^{2}$, and the particle moves in the positive x-direction. The acceleration of the particle at x = $3\\ \\mathrm{m}$ is:","opt":["$12\\ \\mathrm{m\\,s^{-2}}$","$36\\ \\mathrm{m\\,s^{-2}}$","$2\\ \\mathrm{m\\,s^{-2}}$","$6\\ \\mathrm{m\\,s^{-2}}$"],"ans":0,"c":"$v^2=4x^2$ ko differentiate karo: $2v\\dfrac{dv}{dx}=8x$.","m":"$a=v\\,dv/dx$ me dx ka relation daalo, phir x = 3.","s":["$2v\\dfrac{dv}{dx}=8x\\Rightarrow a=v\\dfrac{dv}{dx}=4x$.","x = 3 par $a=12$ $\\mathrm{m\\,s^{-2}}$.","Isliye option (A)."],"r":{"2":"2 sirf ek hissa hai.","3":"6 aata hai agar 2x le lo.","1":"36 aata hai agar $x^{2}$ le lo."},"t":"$v^2=4x^2$ me acceleration x ka linear function hai — $v^{2}$ = kx me constant hota hai.","w":"","fig":null,"sim":null},{"id":308,"q":"Car A moves along a straight road with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ and car B, $100\\ \\mathrm{m}$ ahead of A on the same road, moves in the same direction with a speed of $10\\ \\mathrm{m\\,s^{-1}}$. At the instant when the separation between them is $100\\ \\mathrm{m}$, the driver of A applies the brakes. The minimum constant retardation required so that A just avoids a collision with B is:","opt":["$0.25\\ \\mathrm{m\\,s^{-2}}$","$0.5\\ \\mathrm{m\\,s^{-2}}$","$1\\ \\mathrm{m\\,s^{-2}}$","$2\\ \\mathrm{m\\,s^{-2}}$"],"ans":1,"c":"Relative motion me socho: relative speed $10\\ \\mathrm{m\\,s^{-1}}$ aur gap $100\\ \\mathrm{m}$, B ka relative acceleration zero.","m":"$v_{rel}^2=2a_{rel}d$ lagao relative frame me.","s":["$v_{rel}=10$ $\\mathrm{m\\,s^{-1}}$, $d=100$ m.","$0=10^2-2a(100)$.","$a=0.5$ $\\mathrm{m\\,s^{-2}}$ → option (B)."],"r":{"0":"25/100 jaisa galat hisaab.","2":"A ki speed (20) se hisaab kiya.","3":"400/200 jaisa galat hisaab."},"t":"Relative frame me braking problems aadhe ho jate hain — B ko rest maan lo, A ki speed $10\\ \\mathrm{m\\,s^{-1}}$.","w":"","fig":null,"sim":null},{"id":309,"q":"A ball is thrown vertically upward from the top of a tower of height $60\\ \\mathrm{m}$ with a speed of $20\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the total distance travelled by the ball before it strikes the ground is:","opt":["$100\\ \\mathrm{m}$","$120\\ \\mathrm{m}$","$60\\ \\mathrm{m}$","$80\\ \\mathrm{m}$"],"ans":0,"c":"Distance = upar jaane ki height + neeche aane ki poori height.","m":"Pehle max height above tower ($u^2/2g$), phir total fall.","s":["Upar: $\\dfrac{400}{20}=20$ m → max height $80\\ \\mathrm{m}$.","Neeche: $80\\ \\mathrm{m}$.","Distance $=20+80=100$ m → option (A)."],"r":{"2":"Sirf tower ki height.","3":"Sirf max height above ground.","1":"120 aata hai agar 60 + 60 jaisa galat socho."},"t":"Distance me upar aur neeche dono legs add hote hain; displacement nahi.","w":"","fig":null,"sim":null},{"id":310,"q":"Car A moves along a straight road with a constant velocity of $5\\ \\mathrm{m\\,s^{-1}}$, passing the origin at t = 0. Car B starts from rest at t = 0 from a point $300\\ \\mathrm{m}$ ahead of the origin and moves towards the origin with a constant acceleration of $2\\ \\mathrm{m\\,s^{-2}}$. The two cars meet after a time:","opt":["$10\\ \\mathrm{s}$","$12\\ \\mathrm{s}$","$15\\ \\mathrm{s}$","$20\\ \\mathrm{s}$"],"ans":2,"c":"Dono ki position equations likho, phir barabar rakho.","m":"$x_A=5t$ aur $x_B=300-t^2$.","s":["$5t=300-t^2$.","$t^2+5t-300=0$.","$t=\\dfrac{-5+35}{2}=15$ s → option (C)."],"r":{"0":"$10\\ \\mathrm{s}$ par positions match nahi karte.","1":"$12\\ \\mathrm{s}$ bhi galat root hai.","3":"$20\\ \\mathrm{s}$ par A aage nikal chuki hoti hai."},"t":"Quadratic ke roots me se positive root lo aur position check kar ke verify karo.","w":"","fig":null,"sim":null},{"id":311,"q":"A driver moving with a speed of $15\\ \\mathrm{m\\,s^{-1}}$ has a reaction time of $0.7\\ \\mathrm{s}$, after which the brakes produce a uniform retardation of $5\\ \\mathrm{m\\,s^{-2}}$. The total distance travelled by the car before coming to rest is:","opt":["$22.5\\ \\mathrm{m}$","$28\\ \\mathrm{m}$","$33\\ \\mathrm{m}$","$43\\ \\mathrm{m}$"],"ans":2,"c":"Total = reaction distance + braking distance.","m":"Dono hisse nikaal kar jodo.","s":["Reaction: $15\\times0.7=10.5$ m.","Braking: $225/10=22.5$ m.","Total $=33$ m → option (C)."],"r":{"0":"Sirf braking distance $22.5\\ \\mathrm{m}$ liya.","1":"Reaction distance $5.5\\ \\mathrm{m}$ liya.","3":"Reaction time $2\\ \\mathrm{s}$ jaisa galat liya."},"t":"$0.7\\ \\mathrm{s}$ jaisa decimal reaction time calculation me dhyaan se multiply karo.","w":"","fig":null,"sim":null},{"id":312,"q":"A particle moves along the x-axis such that x = $t^{3}$ − 6$t^{2}$ + 9t + 5. The distance travelled by the particle in the first $4\\ \\mathrm{s}$ is:","opt":["$4\\ \\mathrm{m}$","$8\\ \\mathrm{m}$","$12\\ \\mathrm{m}$","$16\\ \\mathrm{m}$"],"ans":2,"c":"Reversal points t = 1, 3 par hain; positions nikaal kar segments jodo.","m":"$x(0), x(1), x(3), x(4)$ — chaar values chahiye.","s":["$x(0)=5$, $x(1)=9$, $x(3)=5$, $x(4)=9$.","Distance $=4+4+4$.","$=12$ m → option (C)."],"r":{"0":"Displacement $4\\ \\mathrm{m}$ hai (9 − 5), distance nahi.","1":"Sirf do segments liye.","3":"Ek segment double gin liya."},"t":"Constant term (+5) distance ko affect nahi karta — sirf changes matter karte hain.","w":"","fig":null,"sim":null},{"id":313,"q":"A stone is dropped from rest from the top of a tower of height $80\\ \\mathrm{m}$. At the same instant another stone is thrown vertically upward from the ground with a speed of $20\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the two stones:","opt":["meet at a height of $20\\ \\mathrm{m}$ after $3\\ \\mathrm{s}$","meet in mid-air at a height of $40\\ \\mathrm{m}$ after $2\\ \\mathrm{s}$","meet at the ground, exactly when the second stone returns to the ground","never meet, since the first stone reaches the ground earlier"],"ans":2,"c":"Relative speed $20\\ \\mathrm{m\\,s^{-1}}$, separation $80\\ \\mathrm{m}$ → t = $4\\ \\mathrm{s}$. Ye exactly wahi time hai jab dono ground par pahunchti hain.","m":"Time nikaalo, phir dono ki position us time par check karo.","s":["$t=80/20=4$ s.","$4\\ \\mathrm{s}$ me pehli stone: $80\\ \\mathrm{m}$ gir kar ground par; dusri stone: total flight $2(20)/10=4$ s → ground par.","Isliye dono ground par milti hain → option (C)."],"r":{"1":"$2\\ \\mathrm{s}$ par pehli $20\\ \\mathrm{m}$ aur dusri $20\\ \\mathrm{m}$ par hai — $40\\ \\mathrm{m}$ par nahi.","3":"Dono ka time barabar hai, isliye milti hain.","0":"$3\\ \\mathrm{s}$ par pehli $45\\ \\mathrm{m}$ gira, dusri $60\\ \\mathrm{m}$ — barabar nahi."},"t":"Meeting point ko hamesha time nikaal kar verify karo — yahan answer ground hai, mid-air nahi.","w":"","fig":null,"sim":null},{"id":314,"q":"A particle moves along the x-axis with velocity v = (6t − 3$t^{2}$) $\\mathrm{m\\,s^{-1}}$. Consider the following statements:\nI. The acceleration of the particle at t = 0 is $6\\ \\mathrm{m\\,s^{-2}}$.\nII. The maximum velocity attained by the particle is $3\\ \\mathrm{m\\,s^{-1}}$.\nIII. The velocity of the particle becomes zero at t = $2\\ \\mathrm{s}$.\nIV. The particle moves with constant acceleration.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"$a=6-6t$ — variable hai. v max tab jab a = 0 (t = 1).","m":"Har statement ko derivative se check karo.","s":["I: $a(0)=6$ → true.","II: v max at t = 1 → $6-3=3$ → true.","III: $6t-3t^2=0\\Rightarrow t=2$ → true.","IV: a badalta hai → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"v quadratic ho to a linear hota hai — isliye acceleration constant nahi.","w":"","fig":null,"sim":null},{"id":315,"q":"Ball A is dropped from rest and ball B is thrown vertically downward with a speed of $20\\ \\mathrm{m\\,s^{-1}}$, both at the same instant from the same point at the top of a tall tower. Air resistance is neglected. Consider the following statements:\nI. Both balls have the same acceleration throughout their motion.\nII. At every instant the speed of B exceeds that of A by $20\\ \\mathrm{m\\,s^{-1}}$.\nIII. The separation between the two balls increases at the constant rate of $20\\ \\mathrm{m\\,s^{-1}}$.\nIV. The separation between the two balls at any instant is proportional to the square of the time elapsed.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"Dono ka acceleration g hai, isliye relative velocity $20\\ \\mathrm{m\\,s^{-1}}$ constant rehti hai aur separation = 20t (t ke proportional, $t^{2}$ ke nahi).","m":"IV ko separation ke expression se check karo: 20t hai, 10$t^{2}$ nahi.","s":["I: dono ka a = g → true.","II: $(20+gt)-gt=20$ → true.","III: separation 20t → rate 20 → true.","IV: separation t ke proportional hai → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"Same acceleration → relative velocity constant → separation linear in time.","w":"","fig":null,"sim":null},{"id":316,"q":"A balloon starts from rest from the ground and rises vertically with a constant upward acceleration of $2\\ \\mathrm{m\\,s^{-2}}$. After $5\\ \\mathrm{s}$ a stone is released from the balloon. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, consider the following statements:\nI. The stone continues to rise for $1\\ \\mathrm{s}$ after its release.\nII. The maximum height above the ground reached by the stone is $30\\ \\mathrm{m}$.\nIII. The stone reaches the ground exactly $3\\ \\mathrm{s}$ after its release.\nIV. The stone strikes the ground with a speed of $20\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["I and II only","I, II and III only","II, III and IV only","I, III and IV only"],"ans":0,"c":"Release par v = $10\\ \\mathrm{m\\,s^{-1}}$ upar, height $25\\ \\mathrm{m}$. Ascent $1\\ \\mathrm{s}$, max $30\\ \\mathrm{m}$.","m":"Ground tak ka time quadratic se nikaalo, seedha $3\\ \\mathrm{s}$ nahi.","s":["I: $10/10=1$ s → true.","II: $25+\\dfrac{100}{20}=30$ m → true.","III: $-25=10t-5t^2\\Rightarrow t=1+\\sqrt6\\approx3.45$ s → false.","IV: $v=\\sqrt{100+500}\\approx24.5$ $\\mathrm{m\\,s^{-1}}$ (20 nahi) → false.","True set = I, II → option (A)."],"r":{"1":"Isme III galat hai.","2":"Isme III aur IV dono galat hain.","3":"Isme III galat hai."},"t":"Ground tak ka exact time quadratic se aata hai — approximation se option trap hota hai.","w":"","fig":null,"sim":null},{"id":317,"q":"A car moving at $20\\ \\mathrm{m\\,s^{-1}}$ is brought to rest by a driver whose reaction time is $0.5\\ \\mathrm{s}$, the brakes then producing a uniform retardation of $4\\ \\mathrm{m\\,s^{-2}}$. Consider the following statements:\nI. The total stopping distance of the car is $60\\ \\mathrm{m}$.\nII. If the speed of the car were doubled, with the same reaction time and the same retardation, the total stopping distance would exceed four times its original value.\nIII. The distance travelled by the car during the reaction time is $10\\ \\mathrm{m}$.\nIV. The braking distance is proportional to the square of the speed of the car.\nThe correct statements are:","opt":["I, III and IV only","II, III and IV only","I, II and IV only","I, II and III only"],"ans":0,"c":"Total = 10 + 50 = $60\\ \\mathrm{m}$. Doubling par total $120\\ \\mathrm{m}$ hoga, jo 4 × 60 = 240 se kam hai.","m":"II ko numbers se check karo — 'exceed four times' galat hai.","s":["I: $10+50=60$ m → true.","II: doubled par $20+200=220$? nahi — $v^2/2a=1600/8=200$, reaction 20 → $220\\ \\mathrm{m}$ < 240 → false.","III: reaction distance $10\\ \\mathrm{m}$ → true.","IV: braking distance ∝ $v^{2}$ → true.","True set = I, III, IV → option (A)."],"r":{"3":"Isme II galat hai.","1":"Isme II hai aur I chhoot gaya.","2":"Isme II hai — eliminate."},"t":"Doubling speed: reaction 2×, braking 4×, total 2× aur 4× ke beech — 4× se zyada nahi.","w":"","fig":null,"sim":null},{"id":318,"q":"A body is released from rest from a height and falls freely. If $t_1$ is the time taken to cover the first half of the height and $t_2$ the time taken to cover the second half, consider the following statements:\nI. The body covers the first half of the height in less time than the second half.\nII. $t_1$ : $t_2$ = 1 : ($\\sqrt{2}$ − 1).\nIII. The body covers the first half of the height in half of the total time of fall.\nIV. The speed of the body at the end of the first half of the height is v/$\\sqrt{2}$, where v is the speed on reaching the ground.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":0,"c":"Distance ∝ $t^{2}$, isliye pehla half height kam time leta hai. Speed ∝ $\\sqrt{h}$, isliye half height par v/$\\sqrt{2}$.","m":"III ko ratio se reject karo: $t_1$ = $T/\\sqrt{2}$, aadha nahi.","s":["I: pehla half kam time → true.","II: $1:(\\sqrt2-1)$ → true.","III: $t_1=T/\\sqrt2$, half nahi → false.","IV: $v_1=v/\\sqrt2$ → true.","True set = I, II, IV → option (A)."],"r":{"3":"Isme III galat hai.","1":"Isme III hai aur I chhoot gaya.","2":"Isme III hai — eliminate."},"t":"Speed ∝ $\\sqrt{h}$ aur time ∝ $\\sqrt{h}$ — dono ka same square-root pattern.","w":"","fig":null,"sim":null},{"id":319,"q":"Consider the following statements about relative velocity in one dimension:\nI. Two bodies moving in opposite directions with speeds $20\\ \\mathrm{m\\,s^{-1}}$ and $30\\ \\mathrm{m\\,s^{-1}}$ have a relative speed of $10\\ \\mathrm{m\\,s^{-1}}$.\nII. The relative velocity of A with respect to B is the negative of the relative velocity of B with respect to A.\nIII. If two bodies have equal velocities, their relative velocity is zero.\nIV. The relative velocity of two bodies is the same in all inertial frames of reference.\nThe correct statements are:","opt":["I, II and III only","II, III and IV only","I, III and IV only","I, II and IV only"],"ans":1,"c":"Opposite direction me relative speed sum hoti hai ($50\\ \\mathrm{m\\,s^{-1}}$), aur relative velocity saare inertial frames me same rehti hai.","m":"I ko numbers se check karo: 20 + 30 = 50, 10 nahi.","s":["I: $50\\ \\mathrm{m\\,s^{-1}}$ hona chahiye, 10 nahi → false.","II: antisymmetric → true.","III: equal velocities → 0 → true.","IV: difference of velocities frame badalne par same → true.","True set = II, III, IV → option (B)."],"r":{"0":"Isme I galat hai.","2":"Isme I hai aur II chhoot gaya.","3":"Isme I hai — eliminate."},"t":"Relative velocity inertial frames me invariant hoti hai — velocity khud nahi.","w":"","fig":null,"sim":null},{"id":320,"q":"The velocity-time graph of a body is a straight line joining (t = 0, v = $10\\ \\mathrm{m\\,s^{-1}}$) to (t = $8\\ \\mathrm{s}$, v = −$10\\ \\mathrm{m\\,s^{-1}}$), crossing the time axis at t = $4\\ \\mathrm{s}$. Consider the following statements:\nI. The body reverses its direction of motion at t = $4\\ \\mathrm{s}$.\nII. The acceleration of the body is constant and equal to −$2.5\\ \\mathrm{m\\,s^{-2}}$.\nIII. The displacement of the body in the interval t = 0 to t = $8\\ \\mathrm{s}$ is zero.\nIV. The average speed of the body in the interval t = 0 to t = $4\\ \\mathrm{s}$ is $5\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["I, II and III only","I, II, III and IV","II, III and IV only","I, III and IV only"],"ans":1,"c":"Graph symmetric hai: +$20\\ \\mathrm{m}$ aur −$20\\ \\mathrm{m}$ ka area, slope −20/8 = −$2.5\\ \\mathrm{m\\,s^{-2}}$.","m":"Chaar statements ko graph ke areas aur slope se verify karo.","s":["I: axis cross at t = 4 → true.","II: slope $=(-10-10)/8=-2.5$ → true.","III: $+20-20=0$ → true.","IV: $20/4=5$ $\\mathrm{m\\,s^{-1}}$ → true.","Saare chaar sahi → option (B)."],"r":{"0":"IV bhi sahi hai.","2":"I bhi sahi hai.","3":"II bhi sahi hai."},"t":"Symmetric graph par chaar cheezein ek saath check ho jati hain: slope, reversal, displacement, average speed.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,10],[4,0],[8,-10]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":321,"q":"A ball is released from rest relative to the floor of a lift. Take g = $10\\ \\mathrm{m\\,s^{-2}}$. Consider the following statements:\nI. If the lift is at rest, the ball falls with an acceleration of $10\\ \\mathrm{m\\,s^{-2}}$ relative to the floor of the lift.\nII. If the lift is accelerating upward at $2\\ \\mathrm{m\\,s^{-2}}$, the ball falls with an acceleration of $12\\ \\mathrm{m\\,s^{-2}}$ relative to the floor of the lift.\nIII. If the lift is in free fall, the ball remains at rest relative to the floor of the lift.\nIV. If the lift is moving upward with a constant velocity of $5\\ \\mathrm{m\\,s^{-1}}$, the ball falls with an acceleration of $15\\ \\mathrm{m\\,s^{-2}}$ relative to the floor of the lift.\nThe correct statements are:","opt":["I and III only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"Relative acceleration = g + a(lift) jab lift upar accelerate kare; constant velocity me sirf g; free fall me zero.","m":"IV me constant velocity hai → $10\\ \\mathrm{m\\,s^{-2}}$ hi hoga, 15 nahi.","s":["I: $10\\ \\mathrm{m\\,s^{-2}}$ → true.","II: $10+2=12$ → true.","III: free fall me dono ek saath → relative zero → true.","IV: constant velocity → $10\\ \\mathrm{m\\,s^{-2}}$ (15 nahi) → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"II bhi sahi hai, isliye ye adhoora hai."},"t":"Lift ke andar relative acceleration = g ± a(lift). Constant velocity ka case neutral hai.","w":"","fig":null,"sim":null},{"id":322,"q":"A body starts from rest and moves along a straight line with a uniform acceleration of $4\\ \\mathrm{m\\,s^{-2}}$. Consider the following statements:\nI. The distance travelled by the body in the 3rd second is $10\\ \\mathrm{m}$.\nII. The distance travelled by the body in the first $3\\ \\mathrm{s}$ is $18\\ \\mathrm{m}$.\nIII. The ratio of the distance travelled in the 3rd second to that travelled in the first $3\\ \\mathrm{s}$ is 5 : 9.\nIV. The distance travelled by the body in the 1st second is $4\\ \\mathrm{m}$.\nThe correct statements are:","opt":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"ans":0,"c":"$S_n=\\tfrac{a}{2}(2n-1)$ aur total $=\\tfrac12at^2$.","m":"Har statement ke numbers nikaalo.","s":["I: $S_3=2(5)=10$ m → true.","II: $\\tfrac12(4)(9)=18$ m → true.","III: 10 : 18 = 5 : 9 → true.","IV: $S_1=2(1)=2$ m (4 nahi) → false.","True set = I, II, III → option (A)."],"r":{"1":"Isme IV galat hai (1st second me $2\\ \\mathrm{m}$).","2":"Isme IV hai aur I chhoot gaya.","3":"Isme IV hai — eliminate."},"t":"Pehle second me distance a/2 hota hai, a nahi — yahan $2\\ \\mathrm{m}$.","w":"","fig":null,"sim":null},{"id":323,"q":"Which one of the following statements is NOT correct?","opt":["For uniformly accelerated motion along a straight line, the velocity-time graph is a straight line.","For uniformly accelerated motion along a straight line, the displacement of the body is a linear function of time.","For uniformly accelerated motion, the acceleration-time graph is a straight line parallel to the time axis.","For uniformly accelerated motion, the average velocity over any interval is equal to the velocity at the mid-instant of that interval."],"ans":1,"c":"Displacement time ka quadratic function hota hai ($s=ut+\\tfrac12at^2$), linear nahi.","m":"B me 'linear' word galat hai.","s":["A: v–t straight line → sahi.","B: displacement quadratic hai, linear nahi → NOT correct.","C: a constant → horizontal line → sahi.","D: mid-instant velocity = average velocity → sahi.","Isliye option (B)."],"r":{"0":"Ye sahi hai.","2":"Ye bhi sahi hai.","3":"Ye bhi sahi hai."},"t":"Linear vs quadratic — uniform acceleration me displacement quadratic hota hai.","w":"","fig":null,"sim":null},{"id":324,"q":"Which one of the following statements is correct?","opt":["A body having zero velocity at an instant must have zero acceleration at that instant.","A body having zero acceleration must necessarily be at rest.","A body may have a non-zero velocity and zero acceleration at the same instant.","A body with negative acceleration is always slowing down."],"ans":2,"c":"Uniform motion me v ≠ 0 par a = 0 hota hai.","m":"Har option ko counter-example se test karo.","s":["A: highest point par v = 0, a = g → galat.","B: uniform motion → galat.","C: uniform motion → sahi.","D: negative direction me tez hoti body → galat.","Isliye option (C)."],"r":{"0":"Highest point ka counter-example.","1":"Uniform motion me a = 0 par v ≠ 0.","3":"Sign sirf direction batata hai."},"t":"Ek hi counter-example (uniform motion / highest point) se teen options kat jate hain.","w":"","fig":null,"sim":null},{"id":325,"q":"Which one of the following statements is NOT correct?","opt":["The slope of the tangent to a position-time graph at an instant gives the instantaneous velocity at that instant.","The area under a velocity-time graph between two instants gives the displacement of the body in that interval.","The area under a position-time graph between two instants gives the distance travelled by the body in that interval.","The slope of a velocity-time graph at an instant gives the acceleration at that instant."],"ans":2,"c":"x–t graph ka area ka koi physical meaning nahi hota.","m":"C ko dimension se check karo: m × s = m·s, jo kisi standard quantity ka unit nahi.","s":["A: x–t slope = v → sahi.","B: v–t area = displacement → sahi.","C: x–t area ka koi matlab nahi → NOT correct.","D: v–t slope = a → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi hai.","1":"Ye bhi sahi hai.","3":"Ye bhi sahi hai."},"t":"x–t graph ka area bekaar hai — ye classic trap hai.","w":"","fig":null,"sim":null},{"id":326,"q":"Which one of the following statements is correct? (Take g = $10\\ \\mathrm{m\\,s^{-2}}$.)","opt":["A body thrown vertically upward with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ reaches a maximum height of $40\\ \\mathrm{m}$.","A body thrown vertically upward with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ returns to the ground after $2\\ \\mathrm{s}$.","A body thrown vertically upward with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ has a speed of $10\\ \\mathrm{m\\,s^{-1}}$ at the highest point.","A body thrown vertically upward with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ reaches a maximum height of $20\\ \\mathrm{m}$ and returns to the ground after $4\\ \\mathrm{s}$."],"ans":3,"c":"$H=u^2/2g=20$ m aur $T=2u/g=4$ s.","m":"Do values nikaal kar options match karo.","s":["$H=400/20=20$ m.","$T=40/10=4$ s.","Isliye option (D)."],"r":{"0":"$40\\ \\mathrm{m}$ galat hai (2 se divide karna bhoola).","1":"$2\\ \\mathrm{s}$ sirf ascent time hai.","2":"Highest point par speed zero hoti hai."},"t":"u = $20\\ \\mathrm{m\\,s^{-1}}$ ka combo (H = $20\\ \\mathrm{m}$, T = $4\\ \\mathrm{s}$) yaad rakhne layak hai.","w":"","fig":null,"sim":null},{"id":327,"q":"Which one of the following statements is NOT correct?","opt":["Two trains of lengths $100\\ \\mathrm{m}$ and $150\\ \\mathrm{m}$, moving in opposite directions with speeds of $10\\ \\mathrm{m\\,s^{-1}}$ and $15\\ \\mathrm{m\\,s^{-1}}$, cross each other completely in $10\\ \\mathrm{s}$.","A passenger in a train moving at $20\\ \\mathrm{m\\,s^{-1}}$ observes another train on a parallel track, moving in the same direction at $20\\ \\mathrm{m\\,s^{-1}}$, to be at rest.","The relative velocity of two bodies is the same in all inertial frames of reference.","If two bodies have zero relative velocity at an instant, their accelerations at that instant must also be equal."],"ans":3,"c":"Zero relative velocity ka matlab same acceleration nahi.","m":"D me 'must' hai — highest point wala type counter-example socho.","s":["A: $250/25=10$ s → sahi.","B: relative velocity zero → rest dikhta hai → sahi.","C: inertial frames me relative velocity invariant → sahi.","D: acceleration ka koi lena-dena nahi → NOT correct.","Isliye option (D)."],"r":{"0":"Total length $250\\ \\mathrm{m}$, relative speed $25\\ \\mathrm{m\\,s^{-1}}$ — sahi.","1":"Same direction, same speed → relative rest — sahi.","2":"Ye Galilean invariance hai — sahi."},"t":"Same velocity ≠ same acceleration, isko hamesha yaad rakho.","w":"","fig":null,"sim":null},{"id":328,"q":"Which one of the following statements is correct?","opt":["The total stopping distance of a vehicle is directly proportional to its speed.","The braking distance is proportional to the square of the speed, whereas the distance travelled during the reaction time is proportional to the speed.","A larger reaction time of the driver reduces the total stopping distance of the vehicle.","The braking distance does not depend on the retardation produced by the brakes."],"ans":1,"c":"Do hisse hain: reaction (linear) aur braking (quadratic).","m":"Formula likho aur har option ko match karo.","s":["A: total pure linear nahi → galat.","B: dono proportionalities sahi → sahi option.","C: bada reaction time → zyada distance → galat.","D: braking distance $v^2/2a$ se a se depend karta hai → galat.","Isliye option (B)."],"r":{"0":"Total me quadratic term bhi hai.","2":"Reaction time badhne se distance badhta hai.","3":"a denominator me hai, isliye depend karta hai."},"t":"Reaction ∝ v, braking ∝ $v^{2}$ — ye do lines poore topic ko cover karti hain.","w":"","fig":null,"sim":null},{"id":329,"q":"Which one of the following statements is NOT correct?","opt":["If the velocity of a body varies as v = 3$t^{2}$ (SI units), its acceleration at t = $1\\ \\mathrm{s}$ is $6\\ \\mathrm{m\\,s^{-2}}$.","For a body moving with constant acceleration, the velocity-time graph is a straight line.","If the velocity of a body varies as v = 4$t^{3}$ (SI units), its acceleration is constant.","If the acceleration of a body starting from rest varies as a = 2t (SI units), its velocity at t = $2\\ \\mathrm{s}$ is $4\\ \\mathrm{m\\,s^{-1}}$."],"ans":2,"c":"$v=4t^3$ se $a=12t^2$, jo constant nahi hai.","m":"Har statement ko differentiate karke check karo.","s":["C: $a=12t^2$ (constant nahi) → NOT correct.","D: $v=t^2=4$ → sahi.","A: $a=6t=6$ → sahi.","B: constant a → straight line → sahi.","Isliye option (C)."],"r":{"3":"Integration se $4\\ \\mathrm{m\\,s^{-1}}$ aata hai — sahi statement.","0":"Derivative se 6 aata hai — sahi.","1":"Ye standard result hai."},"t":"Power of t ka rule: v ∝ $t^{3}$ → a ∝ $t^{2}$, jo variable hai.","w":"","fig":null,"sim":null},{"id":330,"q":"Which one of the following statements is correct? (Air resistance is neglected.)","opt":["A stone released from a balloon ascending with a constant velocity has zero velocity relative to the ground immediately after release.","A stone released from a balloon ascending with a constant velocity moves downward relative to the ground immediately after release.","A stone released from a balloon ascending with a constant velocity first moves upward relative to the ground and then moves downward.","A stone released from a balloon ascending with a constant velocity has zero acceleration relative to the ground immediately after release."],"ans":2,"c":"Release par stone ki velocity balloon jitni upar hoti hai; gravity usko dheere-dheere rok kar neeche le aati hai.","m":"Pehle phase (upar) aur doosre phase (neeche) ko alag likho.","s":["A: velocity ballo
