on ke barabar upar → galat.","B: turant neeche nahi → galat.","C: pehle upar, phir neeche → sahi.","D: acceleration turant g ho jata hai → galat.","Isliye option (C)."],"r":{"0":"Velocity carry hoti hai.","1":"Upar ki velocity pehle khatam hoti hai.","3":"Release ke baad a = g hamesha."},"t":"Balloon problems ka standard pattern: pehle upar, phir neeche, par acceleration hamesha g.","w":"","fig":null,"sim":null},{"id":331,"q":"Which one of the following statements is NOT correct?","opt":["The distance travelled by a body in a given interval can never be less than the magnitude of its displacement in that interval.","A body moving with uniform acceleration may have zero velocity at some instant during its motion.","The average velocity of a body over an interval can be zero even though it has travelled a non-zero distance.","For a body starting from rest with uniform acceleration, the distance travelled in the nth second is proportional to $n^{2}$."],"ans":3,"c":"$S_n\\propto(2n-1)$ hota hai, $n^{2}$ ke proportional nahi.","m":"D me proportionality check karo — $n^{2}$ total distance ka rishta hai.","s":["A: path ≥ |displacement| → sahi.","B: reversal ke waqt v = 0 → sahi.","C: return journey me → sahi.","D: $S_n\\propto(2n-1)$ → NOT correct.","Isliye option (D)."],"r":{"0":"Ye sahi inequality hai.","1":"Uniform acceleration me bhi reversal possible hai.","2":"Return journey ka example."},"t":"$S_n\\propto(2n-1)$ vs total $\\propto n^2$ — ye confusion sabse common hai.","w":"","fig":null,"sim":null},{"id":332,"q":"Which one of the following statements is correct?","opt":["The average speed of a body can never be less than the magnitude of its average velocity.","The average velocity of a body moving along a straight line is always positive.","The average speed of a body is always equal to the magnitude of its average velocity.","The average velocity of a body is its total path length divided by the total time taken."],"ans":0,"c":"Inequality: average speed ≥ |average velocity|.","m":"Definitions likho aur options ko match karo.","s":["C: sirf ek direction me chalne par barabar → galat.","D: ye average speed ki definition hai → galat.","A: sahi inequality → sahi.","B: negative direction me negative hoti hai → galat.","Isliye option (A)."],"r":{"2":"Sirf special case me barabar hoti hai.","3":"Path length se average speed milti hai.","1":"Sign direction par depend karta hai."},"t":"Average speed vs magnitude of average velocity — inhe kabhi barabar mat maano.","w":"","fig":null,"sim":null},{"id":333,"q":"Match each quantity in Column I with its value in Column II. Here x is in metre, v in $\\mathrm{m\\,s^{-1}}$, a in $\\mathrm{m\\,s^{-2}}$ and t in second.\nColumn I: (a) Velocity at t = $3\\ \\mathrm{s}$ for x = 4$t^{2}$ (b) Acceleration at t = $2\\ \\mathrm{s}$ for x = $t^{3}$ (c) Displacement in the first $2\\ \\mathrm{s}$ for v = 3$t^{2}$, starting from the origin (d) Displacement in the first $3\\ \\mathrm{s}$ for v = 2t, starting from the origin\nColumn II: (i) $8\\ \\mathrm{m}$ (ii) $9\\ \\mathrm{m}$ (iii) $12\\ \\mathrm{m\\,s^{-2}}$ (iv) $24\\ \\mathrm{m\\,s^{-1}}$","opt":["a-iv, b-iii, c-i, d-ii","a-i, b-ii, c-iii, d-iv","a-iii, b-iv, c-ii, d-i","a-ii, b-i, c-iv, d-iii"],"ans":0,"c":"Position wale case me differentiate; velocity wale case me integrate.","m":"Chaar chhote operations.","s":["(a) $v=8t\\Rightarrow24$ → iv.","(b) $a=6t\\Rightarrow12$ → iii.","(c) $x=t^3$ at 2 → 8 → i.","(d) $x=t^2$ at 3 → 9 → ii.","Isliye a-iv, b-iii, c-i, d-ii → option (A)."],"r":{"1":"(a) me $8\\ \\mathrm{m}$ daal diya (c ka answer).","2":"(a) me 12 daal diya (b ka answer).","3":"(a) me $9\\ \\mathrm{m}$ daal diya (d ka answer)."},"t":"Units se pata chal jata hai kaun sa answer kahan jayega — yahan (iii) aur (iv) acceleration/velocity hain.","w":"","fig":null,"sim":null},{"id":334,"q":"Match each case in Column I with its value in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$.\nColumn I: (a) Maximum height reached by a body thrown vertically upward with $20\\ \\mathrm{m\\,s^{-1}}$ (b) Total time of flight of that body (c) Distance fallen in the 3rd second of free fall from rest (d) Total time of flight of a body thrown vertically upward with $30\\ \\mathrm{m\\,s^{-1}}$\nColumn II: (i) $4\\ \\mathrm{s}$ (ii) $6\\ \\mathrm{s}$ (iii) $20\\ \\mathrm{m}$ (iv) $25\\ \\mathrm{m}$","opt":["a-ii, b-iv, c-iii, d-i","a-iii, b-i, c-iv, d-ii","a-i, b-iii, c-ii, d-iv","a-iv, b-ii, c-i, d-iii"],"ans":1,"c":"$H=u^2/2g$, $T=2u/g$, free fall ka 3rd second $=5(2\\times3-1)$.","m":"Chaar alag formulas.","s":["(a) $400/20=20$ m → iii.","(b) $40/10=4$ s → i.","(c) $5(5)=25$ m → iv.","(d) $60/10=6$ s → ii.","Isliye a-iii, b-i, c-iv, d-ii → option (B)."],"r":{"2":"(a) me $4\\ \\mathrm{s}$ daal diya.","3":"(a) me $25\\ \\mathrm{m}$ daal diya (c ka answer).","0":"(a) me $6\\ \\mathrm{s}$ daal diya (d ka answer)."},"t":"Free fall ke 3rd second me $25\\ \\mathrm{m}$ — ye value NEET me bahut baar aati hai.","w":"","fig":null,"sim":null},{"id":335,"q":"Match each case in Column I with its distance in Column II:\nColumn I: (a) Distance travelled during the reaction time by a car moving at $10\\ \\mathrm{m\\,s^{-1}}$ with reaction time $0.5\\ \\mathrm{s}$ (b) Braking distance of a car moving at $20\\ \\mathrm{m\\,s^{-1}}$ with retardation $8\\ \\mathrm{m\\,s^{-2}}$ (c) Braking distance of a car moving at $20\\ \\mathrm{m\\,s^{-1}}$ with retardation $4\\ \\mathrm{m\\,s^{-2}}$ (d) Braking distance of a car moving at $30\\ \\mathrm{m\\,s^{-1}}$ with retardation $5\\ \\mathrm{m\\,s^{-2}}$\nColumn II: (i) $5\\ \\mathrm{m}$ (ii) $25\\ \\mathrm{m}$ (iii) $50\\ \\mathrm{m}$ (iv) $90\\ \\mathrm{m}$","opt":["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-iii, b-iv, c-i, d-ii","a-iv, b-iii, c-ii, d-i"],"ans":0,"c":"Reaction distance = v t(r); braking distance = $v^{2}$/2a.","m":"Chaar calculations karo.","s":["(a) $10\\times0.5=5$ m → i.","(b) $400/16=25$ m → ii.","(c) $400/8=50$ m → iii.","(d) $900/10=90$ m → iv.","Isliye a-i, b-ii, c- -iv, b-iii, c-ii, d-i"],"ans":0,"c":"$S_n=1\\times(2n-1)$ (kyunki a/2 = 1), total $s=t^2$, $v=2t$.","m":"a = 2 hone se formulas simple ho jate hain.","s":["(a) $S_3=2(5)/2=5$ m → ii.","(b) $S_5=2(9)/2=9$ m → iv.","(c) $\\tfrac12(2)(4)=4$ m → i.","(d) $v=6$ $\\mathrm{m\\,s^{-1}}$ → iii.","Isliye a-ii, b-iv, c-i, d-iii → option (A)."],"r":{"1":"(a) me $4\\ \\mathrm{m}$ daal diya (c ka answer).","2":"(a) me $6\\ \\mathrm{m\\,s^{-1}}$ daal diya (d ka answer).","3":"(a) me $9\\ \\mathrm{m}$ daal diya (b ka answer)."},"t":"(iii) ka unit velocity ka hai — units dekh kar turant match ho jata hai.","w":"","fig":null,"sim":null},{"id":339,"q":"Assertion: When air resistance is neglected, a body thrown vertically upward returns to the point of projection with the same speed with which it was projected.\nReason: Throughout its motion, the acceleration of the body is g directed vertically downward.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Constant acceleration (g) ki wajah se motion symmetric hoti hai — isliye same speed se wapasi.","m":"Reason me constancy hai — wahi symmetry ka source hai.","s":["A true: same speed.","R true: a = g hamesha.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Constant acceleration = symmetric motion. Ye link yaad rakho.","w":"","fig":null,"sim":null},{"id":340,"q":"Assertion: A body projected vertically upward from the ground with a speed u returns to the ground after a time 2u/g.\nReason: The maximum height attained by the body is $u^{2}$/$2\\ \\mathrm{g}$.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reas rue and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":3,"c":"a = 0 ka matlab velocity constant — wo non-zero bhi ho sakti hai. Isliye assertion galat, reason sach.","m":"Counter-example: uniform motion.","s":["A false: uniform motion me a = 0 par v ≠ 0.","R true: definition sahi hai.","False assertion + true reason → option (D)."],"r":{"0":"Assertion galat hai.","1":"Assertion galat hai.","2":"Reason sach hai."},"t":"a = 0 se rest nahi nikalta — uniform velocity bhi possible hai.","w":"","fig":null,"sim":null},{"id":343,"q":"Assertion: The displacement of a body in a time interval is zero if its velocity-time graph encloses equal areas above and below the time axis in that interval.\nReason: The displacement of the body is the algebraic sum of the signed areas under the velocity-time graph.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Equal opposite areas ka algebraic sum zero hota hai — isliye displacement zero.","m":"Reason hi assertion ka mechanism batata hai.","s":["A true: net area zero → displacement zero.","R true: algebraic sum ka rule.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Equal above-below areas → displacement zero, distance non-zero.","w":"","fig":null,"sim":null},{"id":344,"q":"Assertion: The relative velocity of two bodies moving with equal and constant velocities is zero.\nReason: The relative acceleration of two bodies moving with constant velocities is zero.","opt":["Both Ass ion (B)."],"r":{"2":"Average velocity zero nahi — final position −$10\\ \\mathrm{m}$ hai.","3":"Distance $30\\ \\mathrm{m}$ hai, 10 nahi.","0":"Sign galat — position ghati hai."},"t":"x–t graph me displacement = last − first; distance = saare |changes| ka sum.","w":"","fig":{"t":"g","kind":"xt","pts":[[0,0],[2,10],[6,10],[10,-10]],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":348,"q":"The acceleration-time graph of a body starting from rest is as follows: 0–$2\\ \\mathrm{s}$ a = +$6\\ \\mathrm{m\\,s^{-2}}$; 2–$4\\ \\mathrm{s}$ a = 0; 4–$8\\ \\mathrm{s}$ a = −$3\\ \\mathrm{m\\,s^{-2}}$. The total displacement of the body in the first $8\\ \\mathrm{s}$ is:","opt":["$60\\ \\mathrm{m}$","$72\\ \\mathrm{m}$","$36\\ \\mathrm{m}$","$48\\ \\mathrm{m}$"],"ans":0,"c":"Pehle a–t area se velocity, phir har segment ka area (displacement).","m":"v: 0 → 12 → 12 → 0; teen segments ke areas 12, 24, 24.","s":["0–$2\\ \\mathrm{s}$: $x_1=\\tfrac12(2)(12)=12$ m.","2–$4\\ \\mathrm{s}$: $x_2=12\\times2=24$ m.","4–$8\\ \\mathrm{s}$: $x_3=\\tfrac12(4)(12)=24$ m.","Total $=60$ m → option (A)."],"r":{"2":"Sirf ek segment.","3":"Aakhri segment chhoda.","1":"Teesre segment ko rectangle maan liya (48)."},"t":"a–t se v banao, phir v–t ka area lo — do steps ka standard method.","w":"","fig":{"t":"g","kind":"at","pts":[[0,6],[2,6],[2,0],[4,0],[4,-3],[8,-3]],"yl":"a (m s^{-2})","xl":"t (s)"},"sim":null},{"id":349,"q":"The acceleration of a body starting from rest is recorded at equal intervals of $1\\ \\mathrm{s}$: t = 0, a = 2; t = 1, a = 4; t = 2, a = 6; t = 3, a = 8 (a in $\\mathrm{m\\,s^{-2}}$). Assuming the acceleration to vary linearly with time between the recorded instants, the displacement of the body during the first $3\\ \\mathrm{s}$ is:","opt":["$12\\ \\mathrm{m}$","$15\\ \\mathrm{m}$","$18\\ \\mathrm{m}$","$24\\ \\mathrm{m}$"],"ans":2,"c":"a linear hai → do integrations: $v=\\int a\\,dt$, $s=\\int v\\,dt$.","m":"a = 2 + 2t likho, phir integrate.","s":["$v=\\int(2+2t)dt=2t+t^2$.","$s=\\int_0^3(2t+t^2)dt=\\left[t^2+\\dfrac{t^3}{3}\\right]_0^3$.","$=9+9=18$ m → option (C)."],"r":{"0":"Sirf ek integration kiya.","1":"a ka average × $t^{2}$ jaisa galat hisaab.","3":"$t^{3}$ term ko double gin liya."},"t":"a linear ho to v quadratic aur s cubic hota hai — power ka pattern yaad rakho.","w":"","fig":{"t":"tab","head":["t (s)","a ($\\mathrm{m\\,s^{-2}}$)"],"rows":[["0","2"],["1","4"],["2","6"],["3","8"]]},"sim":null},{"id":350,"q":"The velocity-time graph of a body starting from the origin is a straight line joining (t = 0, v = $6\\ \\mathrm{m\\,s^{-1}}$) to (t = $6\\ \\mathrm{s}$, v = 0). Which one of the following statements about the corresponding position-time graph is correct?","opt":["It is a straight line parallel to the time axis, and the position at t = $6\\ \\mathrm{s}$ is $6\\ \\mathrm{m}$.","It is a straight line, and the position at t = $6\\ \\mathrm{s}$ is $18\\ \\mathrm{m}$.","It is a parabola opening downward with its highest point at t = $6\\ \\mathrm{s}$, and the position at t = $6\\ \\mathrm{s}$ is $18\\ \\mathrm{m}$.","It is a parabola opening upward passing through the origin, and the position at t = $6\\ \\mathrm{s}$ is $36\\ \\mathrm{m}$."],"ans":2,"c":"v = 6 − t → x = 6t − $t^{2}$/2, jo downward parabola hai; slope (velocity) ghat raha hai.","m":"Area se position nikalo, aur shape slope se tay karo.","s":["Area $=\\tfrac12(6)(6)=18$ m.","$x=6t-\\tfrac12t^2$ → downward parabola, maximum slope t = 0 par.","Isliye option (C)."],"r":{"1":"Straight line tab hoti jab velocity constant ho.","3":"Upward parabola nahi — acceleration negative hai.","0":"Position badal rahi hai, parallel line nahi."},"t":"v ghat rahi hai → x–t ka slope ghat raha hai → downward parabola.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,6],[6,0]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":351,"q":"A particle moves along the x-axis such that x = $t^{3}$/3 − 3$t^{2}$ + 8t. The distance travelled by the particle in the first $5\\ \\mathrm{s}$ is:","opt":["20/$3\\ \\mathrm{m}$","28/$3\\ \\mathrm{m}$","$8\\ \\mathrm{m}$","$9\\ \\mathrm{m}$"],"ans":1,"c":"$v=t^2-6t+8=(t-2)(t-4)$ — do reversal points (t = 2 aur t = 4).","m":"Chaar positions nikaalo: x(0), x(2), x(4), x(5); phir |changes| jodo.","s":["$x(0)=0$, $x(2)=\\dfrac{8}{3}-12+16=\\dfrac{20}{3}$.","$x(4)=\\dfrac{64}{3}-48+32=\\dfrac{16}{3}$, $x(5)=\\dfrac{125}{3}-75+40=\\dfrac{20}{3}$.","Distance $=\\dfrac{20}{3}+\\dfrac{4}{3}+\\dfrac{4}{3}=\\dfrac{28}{3}$ m → option (B)."],"r":{"2":"$8\\ \\mathrm{m}$ sirf displacement ke aas-paas ka galat hisaab hai.","3":"$9\\ \\mathrm{m}$ kisi ek segment se aata hai.","0":"20/3 sirf pehle segment ka distance hai."},"t":"Do reversal points hone par teen segments ka |$\\Delta x$| jodo — sabse safe method.","w":"","fig":null,"sim":null},{"id":352,"q":"A ball is thrown vertically upward from the top of a tower of height $100\\ \\mathrm{m}$ with a speed of $50\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the total distance travelled by the ball before it strikes the ground is:","opt":["$350\\ \\mathrm{m}$","$225\\ \\mathrm{m}$","$450\\ \\mathrm{m}$","$250\\ \\mathrm{m}$"],"ans":0,"c":"Distance = upar jaane ki height + neeche ki poori height.","m":"Max height above ground nikalo ($h + u^2/2g$), phir dono legs jodo.","s":["Upar: $\\dfrac{2500}{20}=125$ m → ground se $225\\ \\mathrm{m}$.","Neeche: $225\\ \\mathrm{m}$.","Distance $=125+225=350$ m → option (A)."],"r":{"3":"$250\\ \\mathrm{m}$ sirf max height (225) + kuch galat hisaab.","1":"$225\\ \\mathrm{m}$ sirf neeche ka leg hai.","2":"$450\\ \\mathrm{m}$ dono legs ko galat jodne se aata hai."},"t":"Distance me upar + neeche dono, displacement me sirf net −$100\\ \\mathrm{m}$.","w":"","fig":null,"sim":null},{"id":353,"q":"Ball A is thrown vertically upward from the ground with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ at t = 0. Exactly $2\\ \\mathrm{s}$ later, ball B is thrown vertically upward from the same point with a speed of $30\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the two balls meet at a time (measured from t = 0):","opt":["8/$3\\ \\mathrm{s}$","10/$3\\ \\mathrm{s}$","$3\\ \\mathrm{s}$","16/$3\\ \\mathrm{s}$"],"ans":0,"c":"Dono ki position equations likho (B ke liye t − 2), phir barabar rakho.","m":"y_A = y_B solve karo.","s":["$y_A=20t-5t^2$.","$y_B=30(t-2)-5(t-2)^2=50t-5t^2-80$.","$20t=50t-80\\Rightarrow t=\\dfrac{80}{30}=\\dfrac{8}{3}$ s → option (A)."],"r":{"1":"10/3 galat arithmetic se aata hai.","2":"$3\\ \\mathrm{s}$ par dono positions match nahi karte.","3":"16/3 galat root hai."},"t":"Late start wale body ke liye time ko (t − $t_{0}$) likhna zaroori hai.","w":"","fig":null,"sim":null},{"id":354,"q":"A stone is dropped from rest from the top of a tower, and at the same instant another stone is thrown vertically upward from the ground with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ along the same vertical line. The two stones meet exactly at the highest point of the path of the second stone. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the height of the tower is:","opt":["$30\\ \\mathrm{m}$","$40\\ \\mathrm{m}$","$80\\ \\mathrm{m}$","$20\\ \\mathrm{m}$"],"ans":1,"c":"Second stone ka highest point t = $2\\ \\mathrm{s}$ par $20\\ \\mathrm{m}$ height par hai; usi $2\\ \\mathrm{s}$ me pehla stone bhi wahan hona chahiye.","m":"t = $2\\ \\mathrm{s}$ par dono ki position barabar rakho.","s":["Highest point time $=20/10=2$ s, height $=20$ m.","$2\\ \\mathrm{s}$ me pehla stone $\\tfrac12(10)(4)=20$ m girta hai.","Tower height $=20+20=40$ m → option (B)."],"r":{"3":"$20\\ \\mathrm{m}$ sirf second stone ki height hai.","0":"$30\\ \\mathrm{m}$ kisi galat jod se aata hai.","2":"$80\\ \\mathrm{m}$ $4\\ \\mathrm{s}$ wale case ka hai."},"t":"Meeting point given ho to us point ka time nikaal kar dono equations verify karo.","w":"","fig":null,"sim":null},{"id":355,"q":"Car B starts from rest at t = 0 from a point $96\\ \\mathrm{m}$ ahead of the origin on a straight road and moves towards the origin with a constant acceleration of $2\\ \\mathrm{m\\,s^{-2}}$. Car A passes the origin at t = 0 moving in the same direction as B's line of approach, with a constant velocity of $10\\ \\mathrm{m\\,s^{-1}}$. The two cars meet at:","opt":["t = $4\\ \\mathrm{s}$","t = $6\\ \\mathrm{s}$","t = $8\\ \\mathrm{s}$","t = $12\\ \\mathrm{s}$"],"ans":1,"c":"Dono ki position equations likho aur barabar rakho.","m":"$x_A=10t$, $x_B=96-t^2$.","s":["$10t=96-t^2$.","$t^2+10t-96=0$.","$(t+16)(t-6)=0\\Rightarrow t=6$ s → option (B)."],"r":{"0":"$4\\ \\mathrm{s}$ par A $40\\ \\mathrm{m}$ par aur B $80\\ \\mathrm{m}$ par hai.","2":"$8\\ \\mathrm{s}$ par A aage nikal chuki hoti hai.","3":"$12\\ \\mathrm{s}$ par B origin cross kar chuki hoti hai."},"t":"Meeting problems me dono positions ka equation likhna hi pehla step hai.","w":"","fig":null,"sim":null},{"id":356,"q":"A body moves along a straight line such that its velocity decreases uniformly with displacement according to v = 20 − 4x, where v is in $\\mathrm{m\\,s^{-1}}$ and x is in metre. The acceleration of the body at x = $2\\ \\mathrm{m}$ is:","opt":["−$96\\ \\mathrm{m\\,s^{-2}}$","−$12\\ \\mathrm{m\\,s^{-2}}$","−$48\\ \\mathrm{m\\,s^{-2}}$","−$24\\ \\mathrm{m\\,s^{-2}}$"],"ans":2,"c":"$a=v\\dfrac{dv}{dx}$ use karo, kyunki v, x ka function hai.","m":"Pehle dv/dx = −4, phir x = 2 par v nikaalo.","s":["$a=v(-4)=-4v$.","x = 2 par $v=20-8=12$ $\\mathrm{m\\,s^{-1}}$.","$a=-4\\times12=-48$ $\\mathrm{m\\,s^{-2}}$ → option (C)."],"r":{"3":"−24 aata hai agar v = 6 lo.","0":"−96 aata hai agar v = 24 lo.","1":"−12 sirf v ki value hai."},"t":"Jab v = f(x) diya ho, to $a=v\\,dv/dx$ hi sahi rasta hai.","w":"","fig":null,"sim":null},{"id":357,"q":"A particle starts from rest. Its velocity-time graph is: 0–$2\\ \\mathrm{s}$ with v = 3$t^{2}$, then 2–$4\\ \\mathrm{s}$ constant at $12\\ \\mathrm{m\\,s^{-1}}$. The distance travelled by the particle in the first $4\\ \\mathrm{s}$ is:","opt":["$32\\ \\mathrm{m}$","$36\\ \\mathrm{m}$","$24\\ \\mathrm{m}$","$28\\ \\mathrm{m}$"],"ans":0,"c":"Pehla hissa curve ka area (integration), dusra rectangle.","m":"Do hisse alag: $\\int_0^2 3t^2dt$ aur $12\\times2$.","s":["0–$2\\ \\mathrm{s}$: $\\left[t^3\\right]_0^2=8$ m.","2–$4\\ \\mathrm{s}$: $12\\times2=24$ m.","Total $=32$ m → option (A)."],"r":{"2":"Sirf rectangle ka area.","3":"Pehle hisse ka galat integral.","1":"Rectangle ko 12 × 2.33 jaisa galat liya."},"t":"Curve + straight line wale graph me dono hisson ka area alag nikaalo.","w":"","fig":null,"sim":null},{"id":358,"q":"A body is released from rest from a height h and falls freely. The distance travelled by the body in the last second of its fall is exactly half of the total height h. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the total time taken by the body to reach the ground is:","opt":["$3\\ \\mathrm{s}$","$4\\ \\mathrm{s}$","(2 + $\\sqrt{2}$) s","(2 + $\\sqrt{3}$) s"],"ans":2,"c":"Do expressions banaiye: $h=5n^2$ aur last second ka distance $=5(2n-1)=h/2$.","m":"Substitute karke quadratic solve karo.","s":["$5(2n-1)=\\dfrac{5n^2}{2}\\Rightarrow2(2n-1)=n^2$.","$n^2-4n+2=0$.","$n=2+\\sqrt2\\approx3.41$ s → option (C)."],"r":{"3":"$\\sqrt{3}$ wala root galat equation se aata hai.","0":"$3\\ \\mathrm{s}$ me last second $25\\ \\mathrm{m}$ aur total $45\\ \\mathrm{m}$ — aadha nahi.","1":"$4\\ \\mathrm{s}$ me last second $35\\ \\mathrm{m}$ aur total $80\\ \\mathrm{m}$ — aadha nahi."},"t":"Roots me se sirf bada root lo (n > 1 hona chahiye) — chhota root physical nahi.","w":"","fig":null,"sim":null},{"id":359,"q":"Train A, $200\\ \\mathrm{m}$ long, moves with a speed of $54\\ \\mathrm{km\\,h^{-1}}$ and train B, $100\\ \\mathrm{m}$ long, moving in the same direction on a parallel track with a speed of $72\\ \\mathrm{km\\,h^{-1}}$. The time taken by train A to completely cross train B is:","opt":["$60\\ \\mathrm{s}$","$100\\ \\mathrm{s}$","$20\\ \\mathrm{s}$","$30\\ \\mathrm{s}$"],"ans":0,"c":"Same direction me relative speed difference hoti hai, aur total length dono lengths ka sum.","m":"Speeds convert karo, phir length/relative speed.","s":["$54$ $\\mathrm{km\\,h^{-1}}$ $=15$ $\\mathrm{m\\,s^{-1}}$, $72$ $\\mathrm{km\\,h^{-1}}$ $=20$ $\\mathrm{m\\,s^{-1}}$.","Relative speed $=5$ $\\mathrm{m\\,s^{-1}}$; total length $=300$ m.","$t=300/5=60$ s → option (A)."],"r":{"2":"Speeds convert kiye bina 300/15 jaisa hisaab.","3":"Relative speed sum (35) le liya.","1":"Relative speed $3\\ \\mathrm{m\\,s^{-1}}$ le liya."},"t":"Same direction me relative speed chhoti hoti hai, isliye time zyada lagta hai.","w":"","fig":null,"sim":null},{"id":360,"q":"A car moving with a speed of $108\\ \\mathrm{km\\,h^{-1}}$ is brought to rest by a driver whose reaction time is $0.5\\ \\mathrm{s}$, the brakes then producing a uniform retardation of $6\\ \\mathrm{m\\,s^{-2}}$. The total distance travelled by the car before coming to rest is:","opt":["$75\\ \\mathrm{m}$","$80\\ \\mathrm{m}$","$90\\ \\mathrm{m}$","$105\\ \\mathrm{m}$"],"ans":2,"c":"$108\\ \\mathrm{km\\,h^{-1}}$ = $30\\ \\mathrm{m\\,s^{-1}}$; total = reaction + braking.","m":"Dono hisse nikaalo.","s":["Reaction: $30\\times0.5=15$ m.","Braking: $900/12=75$ m.","Total $=90$ m → option (C)."],"r":{"0":"Sirf braking distance.","1":"Reaction distance $5\\ \\mathrm{m}$ liya.","3":"Braking distance $90\\ \\mathrm{m}$ maan liya."},"t":"$108\\ \\mathrm{km\\,h^{-1}}$ = $30\\ \\mathrm{m\\,s^{-1}}$ — ye conversion yaad rakho.","w":"","fig":null,"sim":null},{"id":361,"q":"A particle moves along the x-axis with velocity v = 4t − $t^{2}$, starting from the origin. The distance travelled by the particle in the first $4\\ \\mathrm{s}$ is:","opt":["$8\\ \\mathrm{m}$","64/$3\\ \\mathrm{m}$","32/$3\\ \\mathrm{m}$","16/$3\\ \\mathrm{m}$"],"ans":2,"c":"v = 0 sirf t = 4 par (interval ke end par), isliye poore $4\\ \\mathrm{s}$ me velocity positive rehti hai.","m":"Sign check karo: 0 < t < 4 me v > 0, isliye displacement = distance.","s":["$s=\\int_0^4(4t-t^2)dt=\\left[2t^2-\\dfrac{t^3}{3}\\right]_0^4$.","$=32-\\dfrac{64}{3}$.","$=\\dfrac{32}{3}$ m → option (C)."],"r":{"3":"16/3 galat integration se aata hai.","0":"$8\\ \\mathrm{m}$ kisi adhoore hisaab se aata hai.","1":"64/3 sirf $t^{3}$ term ka hissa hai."},"t":"Distance ke liye pehle poore interval me v ka sign check karo — yahan sign nahi badalta.","w":"","fig":null,"sim":null},{"id":362,"q":"A balloon starts from rest from the ground and rises with a constant upward acceleration of $2\\ \\mathrm{m\\,s^{-2}}$. After $10\\ \\mathrm{s}$ a stone is released. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the maximum height above the ground reached by the stone is:","opt":["$120\\ \\mathrm{m}$","$140\\ \\mathrm{m}$","$180\\ \\mathrm{m}$","$100\\ \\mathrm{m}$"],"ans":0,"c":"Release par v = $20\\ \\mathrm{m\\,s^{-1}}$, height = $100\\ \\mathrm{m}$; extra height $u^2/2g$.","m":"Do steps aur jodo.","s":["$v=2\\times10=20$ $\\mathrm{m\\,s^{-1}}$, $h=\\tfrac12(2)(100)=100$ m.","Extra $=\\dfrac{400}{20}=20$ m.","Max $=120$ m → option (A)."],"r":{"3":"Sirf release height $100\\ \\mathrm{m}$.","1":"$140\\ \\mathrm{m}$ extra height 40 maan kar aata hai.","2":"$180\\ \\mathrm{m}$ g ki galat value se aata hai."},"t":"Max height = release height + $u^{2}$/$2\\ \\mathrm{g}$; release height bhoolna sabse badi galti hai.","w":"","fig":null,"sim":null},{"id":363,"q":"A particle moves along the x-axis such that x = $t^{3}$ − 9$t^{2}$ + 24t. Consider the following statements:\nI. The particle reverses its direction of motion at t = $2\\ \\mathrm{s}$ and at t = $4\\ \\mathrm{s}$.\nII. The acceleration of the particle is zero at t = $3\\ \\mathrm{s}$.\nIII. The distance travelled by the particle in the first $4\\ \\mathrm{s}$ is $24\\ \\mathrm{m}$.\nIV. The displacement of the particle in the first $4\\ \\mathrm{s}$ is $24\\ \\mathrm{m}$.\nThe correct statements are:","opt":["I and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"$v=3(t-2)(t-4)$, $a=6t-18$. x(0)=0, x(2)=20, x(4)=16.","m":"Distance = 20 + 4 = 24; displacement = 16.","s":["I: reversal at t = 2, 4 → true.","II: $a=0$ at t = 3 → true.","III: distance $=20+4=24$ → true.","IV: displacement $=16$ (24 nahi) → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"Distance aur displacement ka farq reversal points ki positions se hi pata chalta hai.","w":"","fig":null,"sim":null},{"id":364,"q":"A ball is thrown vertically upward from the top of a tower of height $25\\ \\mathrm{m}$ with a speed of $20\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, consider the following statements:\nI. The ball takes $2\\ \\mathrm{s}$ to reach the highest point of its path.\nII. The maximum height reached by the ball above the ground is $45\\ \\mathrm{m}$.\nIII. The ball reaches the ground $5\\ \\mathrm{s}$ after it is thrown.\nIV. The ball strikes the ground with a speed of $25\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["I, II and III only","I and III only","I, II and IV only","II, III and IV only"],"ans":0,"c":"Ascent $2\\ \\mathrm{s}$, max height 25 + 20 = $45\\ \\mathrm{m}$, ground tak $5\\ \\mathrm{s}$, ground par speed $30\\ \\mathrm{m\\,s^{-1}}$.","m":"Speed ko $v=u-gt$ se check karo: 20 − 50 = −30.","s":["I: $20/10=2$ s → true.","II: $25+20=45$ m → true.","III: $t^2-4t-5=0\\Rightarrow t=5$ s → true.","IV: speed $30\\ \\mathrm{m\\,s^{-1}}$ (25 nahi) → false.","True set = I, II, III → option (A)."],"r":{"2":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","1":"II bhi sahi hai, isliye ye adhoora hai."},"t":"Ground par speed = u + gt (ascent) / $\\sqrt{u^2+2gh}$ — dono se 30 aata hai.","w":"","fig":null,"sim":null},{"id":365,"q":"A stone is released from rest from the top of a tall tower, and at the same instant another stone is thrown vertically downward from the same point with a speed u. Air resistance is neglected. Consider the following statements:\nI. The two stones have equal speeds at every instant.\nII. The second stone reaches the ground first.\nIII. The relative acceleration of the two stones is zero.\nIV. At any time t after release, the separation between the two stones is ut.\nThe correct statements are:","opt":["I and II only","I, III and IV only","II, III and IV only","I, II and III only"],"ans":2,"c":"Second stone ki speed hamesha u zyada hoti hai; separation = ut.","m":"I galat hai — speeds barabar nahi, speed difference constant hai.","s":["I: speeds u ke farq se alag → false.","II: zyada initial speed → pehle → true.","III: dono ka a = g → relative 0 → true.","IV: $s=(ut+\\tfrac12gt^2)-\\tfrac12gt^2=ut$ → true.","True set = II, III, IV → option (C)."],"r":{"1":"Isme I galat hai.","3":"Isme I hai aur II chhoot gaya.","0":"Isme I hai — eliminate."},"t":"Same acceleration → separation = (relative initial velocity) × t.","w":"","fig":null,"sim":null},{"id":366,"q":"Car A moves along a straight road with a constant speed of $10\\ \\mathrm{m\\,s^{-1}}$. Car B, which is $20\\ \\mathrm{m}$ behind A at a certain instant, moves in the same direction with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ at that instant and with a uniform retardation of $2\\ \\mathrm{m\\,s^{-2}}$ thereafter. Consider the following statements:\nI. The speed of B becomes equal to that of A after $5\\ \\mathrm{s}$.\nII. The distance covered by B during these $5\\ \\mathrm{s}$ is $75\\ \\mathrm{m}$.\nIII. The distance covered by A during these $5\\ \\mathrm{s}$ is $50\\ \\mathrm{m}$.\nIV. Car B just avoids a collision with car A.\nThe correct statements are:\n(The relative-closing calculation decides statement IV.)","opt":["I and II only","I, II and III only","II, III and IV only","I, III and IV only"],"ans":1,"c":"B ki speed 20 se 10 tak ghatne me $5\\ \\mathrm{s}$ lagte hain. Relative closing = area between the two v–t lines.","m":"B ne $75\\ \\mathrm{m}$, A ne $50\\ \\mathrm{m}$ chala — B ne $25\\ \\mathrm{m}$ gap cover kiya, jo $20\\ \\mathrm{m}$ se zyada hai.","s":["I: $20-2t=10\\Rightarrow t=5$ s → true.","II: $20(5)-\\tfrac12(2)(25)=100-25=75$ m → true.","III: $10\\times5=50$ m → true.","IV: $25\\ \\mathrm{m}$ > $20\\ \\mathrm{m}$ gap → collision ho jayegi, isliye IV false.","True set = I, II, III → option (B)."],"r":{"0":"III bhi sahi hai.","2":"IV galat hai aur I chhoot gaya.","3":"IV galat hai."},"t":"Relative closing distance = dono ke distances ka difference; usko gap se compare karo.","w":"","fig":null,"sim":null},{"id":367,"q":"A stone is dropped from rest from the top of a tower of height $80\\ \\mathrm{m}$. At the same instant another stone is thrown vertically upward from the ground with a speed of $20\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, consider the following statements:\nI. The two stones meet $4\\ \\mathrm{s}$ after the start of the motion.\nII. The meeting point is the ground.\nIII. The two stones meet in mid-air at a height of $40\\ \\mathrm{m}$.\nIV. The second stone is still moving upward at the instant of meeting.\nThe correct statements are:","opt":["I and IV only","I and II only","I, II and III only","II and III only"],"ans":1,"c":"Relative speed $20\\ \\mathrm{m\\,s^{-1}}$ se t = $4\\ \\mathrm{s}$; us waqt dono ground par hain.","m":"Second stone ka velocity $4\\ \\mathrm{s}$ par −$20\\ \\mathrm{m\\,s^{-1}}$ hota hai (neeche).","s":["I: $80/20=4$ s → true.","II: $4\\ \\mathrm{s}$ me pehla $80\\ \\mathrm{m}$ gira, dusra poora flight $4\\ \\mathrm{s}$ → dono ground par → true.","III: mid-air nahi → false.","IV: $4\\ \\mathrm{s}$ par dusri stone neeche aa rahi hai → false.","True set = I, II → option (B)."],"r":{"2":"Isme III galat hai.","3":"Isme III hai aur I chhoot gaya.","0":"Isme IV galat hai."},"t":"Meeting ka time nikaalne ke baad position zaroor check karo — answer mid-air nahi, ground ho sakta hai.","w":"","fig":null,"sim":null},{"id":368,"q":"The velocity-time graph of a body is a straight line given by v = 10 − 2t for t = 0 to t = $8\\ \\mathrm{s}$. Consider the following statements:\nI. The body reverses its direction of motion at t = $5\\ \\mathrm{s}$.\nII. The acceleration of the body is −$2\\ \\mathrm{m\\,s^{-2}}$ throughout the interval.\nIII. The distance travelled by the body in the first $8\\ \\mathrm{s}$ is $16\\ \\mathrm{m}$.\nIV. The displacement of the body in the first $8\\ \\mathrm{s}$ is $16\\ \\mathrm{m}$.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I and III only","I, II and III only"],"ans":0,"c":"Areas: 0–$5\\ \\mathrm{s}$ me +$25\\ \\mathrm{m}$, 5–$8\\ \\mathrm{s}$ me −$9\\ \\mathrm{m}$; isliye distance $34\\ \\mathrm{m}$, displacement $16\\ \\mathrm{m}$.","m":"Sign change ke baad ke hisse ka area alag nikaalo.","s":["I: $v=0$ at t = 5 → true.","II: slope −2 → true.","III: distance $=25+9=34$ m (16 nahi) → false.","IV: displacement $=25-9=16$ m → true.","True set = I, II, IV → option (A)."],"r":{"3":"Isme III galat hai.","1":"Isme III hai aur I chhoot gaya.","2":"Isme III hai — eliminate."},"t":"$8\\ \\mathrm{s}$ tak graph negative ho jata hai — distance me |area| joda jata hai.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,10],[5,0],[8,-6]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":369,"q":"A lift starts from rest and moves vertically upward with a constant acceleration of $2\\ \\mathrm{m\\,s^{-2}}$. After $4\\ \\mathrm{s}$ a ball is released from rest relative to the floor of the lift, from a height of $5\\ \\mathrm{m}$ above the floor. Take g = $10\\ \\mathrm{m\\,s^{-2}}$. Consider the following statements:\nI. The acceleration of the ball relative to the floor of the lift is $12\\ \\mathrm{m\\,s^{-2}}$ directed downward.\nII. Immediately after release, the velocity of the ball relative to the ground is $8\\ \\mathrm{m\\,s^{-1}}$ directed upward.\nIII. The ball reaches the floor of the lift in $\\sqrt{5/6}$ s.\nIV. Immediately after release, the velocity of the ball relative to the ground is zero.\nThe correct statements are:","opt":["I, II and IV only","I, II and III only","II, III and IV only","I and II only"],"ans":1,"c":"Lift ki velocity $8\\ \\mathrm{m\\,s^{-1}}$ upar; relative acceleration = g + a = $12\\ \\mathrm{m\\,s^{-2}}$; floor tak ka time $5=\\tfrac12(12)t^2$.","m":"Ball ki initial velocity ground ke respect me lift jitni hoti hai ($8\\ \\mathrm{m\\,s^{-1}}$ upar).","s":["I: $10+2=12$ $\\mathrm{m\\,s^{-2}}$ → true.","II: $2\\times4=8$ $\\mathrm{m\\,s^{-1}}$ upar → true.","III: $5=6t^2\\Rightarrow t=\\sqrt{5/6}$ → true.","IV: zero nahi, $8\\ \\mathrm{m\\,s^{-1}}$ → false.","True set = I, II, III → option (B)."],"r":{"3":"III bhi sahi hai.","0":"Isme IV galat hai.","2":"Isme IV hai aur I chhoot gaya."},"t":"Relative acceleration = g + a(lift) jab lift upar accelerate kare — isse time nikalta hai.","w":"","fig":null,"sim":null},{"id":370,"q":"Particle A starts at t = 0 from the origin with a velocity of $10\\ \\mathrm{m\\,s^{-1}}$ along the positive x-axis and moves with a constant acceleration of −$2\\ \\mathrm{m\\,s^{-2}}$. Particle B starts at t = 0 from x = $24\\ \\mathrm{m}$ and moves with a constant velocity of −$4\\ \\mathrm{m\\,s^{-1}}$. Consider the following statements:\nI. The two particles are at the same position at t = $2\\ \\mathrm{s}$.\nII. The two particles are again at the same position at t = $12\\ \\mathrm{s}$.\nIII. The two particles occupy the same position only once.\nIV. At t = $12\\ \\mathrm{s}$ particle A is moving in the negative x-direction.\nThe correct statements are:","opt":["I and II only","I, II and III only","II, III and IV only","I, II and IV only"],"ans":3,"c":"$x_A=10t-t^2$, $x_B=24-4t$; equation $t^2-14t+24=0$ → t = 2, 12.","m":"A ki velocity t = 12 par $10-24=-14$ $\\mathrm{m\\,s^{-1}}$ (negative).","s":["I: t = 2 par dono $16\\ \\mathrm{m}$ par → true.","II: t = 12 par dono −$24\\ \\mathrm{m}$ par → true.","III: do baar milte hain → false.","IV: $v_A=10-2(12)=-14$ → true.","True set = I, II, IV → option (D)."],"r":{"0":"IV bhi sahi hai.","1":"Isme III galat hai.","2":"Isme III hai aur I chhoot gaya."},"t":"Quadratic ke dono roots check karo — do meeting points possible hain.","w":"","fig":null,"sim":null},{"id":371,"q":"Consider the following statements about the stopping distance of a vehicle:\nI. If the speed of the vehicle is doubled, the total stopping distance becomes more than double, since the braking distance becomes four times while the reaction distance only doubles.\nII. If the retardation produced by the brakes is doubled, the braking distance is halved for a given speed.\nIII. The distance travelled during the reaction time of the driver is independent of the retardation produced by the brakes.\nIV. When the reaction time of the driver is zero, the total stopping distance is a linear function of the speed of the vehicle.\nThe correct statements are:","opt":["I and III only","I, II and IV only","I, II and III only","II, III and IV only"],"ans":2,"c":"$d=v t_r+\\dfrac{v^2}{2a}$. Reaction time zero ho to d ∝ $v^{2}$ (quadratic), linear nahi.","m":"IV me 'linear' galat hai — quadratic hota hai.","s":["I: 2× reaction + 4× braking → total 2× se zyada → true.","II: $v^2/2(2a)$ → half → true.","III: $v t_r$ me a nahi aata → true.","IV: $t_r=0$ par $d\\propto v^2$ → false.","True set = I, II, III → option (C)."],"r":{"1":"Isme IV galat hai.","3":"Isme IV hai aur I chhoot gaya.","0":"II bhi sahi hai, isliye adhoora."},"t":"Reaction time zero → d ∝ $v^{2}$; reaction time non-zero → mixed behaviour.","w":"","fig":null,"sim":{"t":"sd","title":"Stopping distance — speed, reaction time aur retardation ke slider ghumao"}},{"id":372,"q":"Consider the following statements about graphs of one-dimensional motion:\nI. A velocity-time graph that is a horizontal straight line lying above the time axis represents uniform motion.\nII. A position-time graph whose slope is constant and negative represents motion with constant velocity in the negative direction.\nIII. The area under an acceleration-time graph between two instants gives the change in velocity during that interval.\nIV. The slope of the tangent to a position-time graph at an instant gives the acceleration of the body at that instant.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I and II only","II, III and IV only"],"ans":1,"c":"x–t ka slope velocity deta hai, acceleration nahi — isliye IV galat hai.","m":"IV ko definition se reject karo.","s":["I: horizontal v–t → uniform velocity → true.","II: constant negative slope → constant negative velocity → true.","III: a–t area = $\\Delta v$ → true.","IV: x–t slope = velocity → false.","True set = I, II, III → option (B)."],"r":{"3":"Isme IV galat hai.","0":"Isme IV hai aur II chhoot gaya.","2":"III bhi sahi hai — adhoora."},"t":"Slope/area ka table yaad rakho — 90% graph questions isi se bante hain.","w":"","fig":null,"sim":null},{"id":373,"q":"Which one of the following statements is NOT correct?","opt":["In uniformly accelerated motion the velocity of the body changes by equal amounts in equal intervals of time.","In uniformly accelerated motion the distances covered in successive seconds form an arithmetic progression.","In uniformly accelerated motion the acceleration is always in the direction of the velocity of the body.","In uniformly accelerated motion the average velocity over any interval equals the velocity at the mid-instant of that interval."],"ans":2,"c":"Retardation me acceleration velocity ke opposite hota hai — isliye 'always in the direction of velocity' galat hai.","m":"C me 'always' hai — retardation counter-example hai.","s":["A: uniform a ki definition → sahi.","B: successive seconds me AP (difference $aT^{2}$) → sahi.","C: retardation me opposite → NOT correct.","D: mid-instant velocity = average velocity → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi hai.","1":"Ye bhi sahi hai.","3":"Ye bhi sahi hai."},"t":"Uniform acceleration me direction ka koi promise nahi hota — sign dono ho sakte hain.","w":"","fig":null,"sim":null},{"id":374,"q":"Which one of the following statements is correct?","opt":["A body at rest at an instant must have zero acceleration at that instant.","A body may have zero velocity and non-zero acceleration at the same instant.","If the acceleration of a body is zero, the body must be at rest.","Positive acceleration always means that the speed of the body is increasing."],"ans":1,"c":"Vertical throw ka highest point: v = 0 par a = g ≠ 0.","m":"Har option ko counter-example se test karo.","s":["A: highest point → galat.","B: highest point → sahi.","C: uniform motion me a = 0 par v ≠ 0 → galat.","D: negative velocity ke saath positive a ka matlab speed ghat rahi hai → galat.","Isliye option (B)."],"r":{"0":"Highest point par acceleration g hai.","2":"Uniform motion me body rest nahi hoti.","3":"Direction ka farq dekho — speed ghat bhi sakti hai."},"t":"Ek hi example (highest point) se do options kat jate hain — exam me time bachao.","w":"","fig":null,"sim":{"t":"ua","title":"Sliders se u aur a badlo — 5 s baad v aur s live dekho"}},{"id":375,"q":"Which one of the following statements is NOT correct?","opt":["Two bodies moving with equal velocities have zero relative velocity.","The relative velocity of A with respect to B is the negative of the relative velocity of B with respect to A.","The relative speed of two bodies approaching each other is the sum of their speeds.","The relative velocity of two bodies can be zero only when both the bodies are at rest."],"ans":3,"c":"Dono same velocity se chal rahe hon to bhi relative velocity zero hoti hai — rest zaroori nahi.","m":"D me 'only when both at rest' galat hai.","s":["A: v − v = 0 → sahi.","B: antisymmetric → sahi.","C: approach speed = sum → sahi.","D: same velocity par bhi zero → NOT correct.","Isliye option (D)."],"r":{"0":"Ye sahi hai.","1":"Ye bhi sahi hai.","2":"Ye bhi sahi hai."},"t":"Relative velocity zero ka matlab velocities barabar — rest ka matlab nahi.","w":"","fig":null,"sim":{"t":"rel","title":"Dono speeds ke slider ghumao — same aur opposite dono ke relative velocity dekho"}},{"id":376,"q":"Which one of the following statements is correct?","opt":["The slope of an acceleration-time graph gives the velocity of the body.","The area under a position-time graph gives the velocity of the body.","The slope of the tangent to a velocity-time graph at an instant gives the acceleration at that instant.","The area under an acceleration-time graph gives the displacement of the body."],"ans":2,"c":"v–t ka slope acceleration hota hai (dv/dt).","m":"Slope/area ka matlab match karo.","s":["B: x–t ka area bekaar hai → galat.","C: v–t slope = acceleration → sahi.","D: a–t area = $\\Delta v$, displacement nahi → galat.","A: a–t slope = jerk → galat.","Isliye option (C)."],"r":{"1":"x–t ka area ka koi matlab nahi.","3":"a–t area velocity ka change deta hai.","0":"a–t ka slope jerk deta hai."},"t":"Derivative → slope; integral → area. Bas isi se saare options solve karo.","w":"","fig":null,"sim":null},{"id":377,"q":"Which one of the following statements is NOT correct?","opt":["The acceleration of a freely falling body is independent of its mass.","The distances fallen in successive seconds of free fall from rest are in the ratio 1 : 3 : 5.","A body thrown vertically upward has zero acceleration at the highest point of its path.","A body released from rest falls through distances proportional to the square of the time of fall."],"ans":2,"c":"Highest point par velocity zero hoti hai, acceleration g hi rehta hai.","m":"C dobara classic trap hai.","s":["A: a = g, mass se independent → sahi.","B: 1 : 3 : 5 → sahi.","C: a = g ≠ 0 → NOT correct.","D: h ∝ $t^{2}$ → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi hai.","1":"Ye bhi sahi hai.","3":"Ye bhi sahi hai."},"t":"Highest point par sirf velocity zero hoti hai — acceleration kabhi nahi.","w":"","fig":null,"sim":{"t":"ff","title":"Height ka slider ghumao — fall time aur ground speed ka rishta dekho"}},{"id":378,"q":"Which one of the following statements is correct?","opt":["The braking distance of a vehicle is directly proportional to its speed.","A longer reaction time of the driver reduces the total stopping distance of the vehicle.","The braking distance is independent of the retardation produced by the brakes.","For a constant retardation, the braking distance of a vehicle is proportional to the square of its speed."],"ans":3,"c":"$s=\\dfrac{v^2}{2a}$ → s ∝ $v^{2}$.","m":"Formula likho aur proportionality padho.","s":["A: linear nahi, quadratic hai → galat.","B: bada reaction time → zyada distance → galat.","C: a denominator me hai → depend karta hai → galat.","D: s ∝ $v^{2}$ → sahi.","Isliye option (D)."],"r":{"0":"Linear rishta reaction distance ka hota hai.","1":"Reaction time badhne se distance badhta hai.","2":"a badla to braking distance badlega."},"t":"Braking distance ∝ $v^{2}$ aur ∝ 1/a — dono proportionalities yaad rakho.","w":"","fig":null,"sim":null},{"id":379,"q":"Which one of the following statements is NOT correct?","opt":["The average velocity of a body over an interval can be zero while its average speed is non-zero.","A body with zero acceleration must necessarily be at rest.","A body may have a negative velocity and a positive acceleration at the same instant.","The instantaneous speed of a body is the magnitude of its instantaneous velocity."],"ans":1,"c":"a = 0 ka matlab velocity constant hai — rest zaroori nahi.","m":"B me 'necessarily' hai — uniform motion counter-example hai.","s":["A: return journey me → sahi.","B: uniform motion me a = 0 par v ≠ 0 → NOT correct.","C: peeche jaati body jo slow ho rahi ho → sahi.","D: speed = |velocity| → sahi.","Isliye option (B)."],"r":{"0":"Ye sahi hai.","2":"Signs independent hote hain.","3":"1D me speed velocity ka magnitude hai."},"t":"Zero acceleration ka matlab constant velocity, zero velocity nahi.","w":"","fig":null,"sim":null},{"id":380,"q":"Which one of the following statements is correct?","opt":["In the presence of air resistance, the time of ascent of a body thrown vertically upward exceeds its time of descent.","In the presence of air resistance, a body thrown vertically upward returns to the point of projection with a speed smaller than its launch speed.","The presence of air resistance does not affect the maximum height reached by a body thrown vertically upward.","In the presence of air resistance, a body thrown vertically upward returns to the point of projection with a speed larger than its launch speed."],"ans":1,"c":"Resistance se energy loss hoti hai — isliye wapsi speed kam hoti hai aur max height bhi kam.","m":"Ascent tez hota hai (a > g) aur descent dheema (a < g).","s":["D: energy loss se speed kam hoti hai → galat.","A: ascent ka time kam hota hai → galat.","B: wapsi speed kam → sahi.","C: max height kam ho jati hai → galat.","Isliye option (B)."],"r":{"3":"Resistance energy nikaal leti hai.","0":"Ascent me deceleration zyada hoti hai, isliye jaldi.","2":"Height par bhi asar padta hai."},"t":"Air resistance ke teen effects: kam height, kam wapsi speed, ascent time kam.","w":"","fig":null,"sim":null},{"id":381,"q":"Which one of the following statements is NOT correct?","opt":["The relation $v^{2}$ = $u^{2}$ + 2as can be used for uniformly accelerated motion along a straight line.","The relation s = ut + $\\tfrac{1}{2}at^2$ gives the displacement of a body in time t when its acceleration is uniform.","The relation v = u + at cannot be used when the velocity of the body reverses its direction during the motion.","The three equations of uniformly accelerated motion cannot be applied when the acceleration varies with time."],"ans":2,"c":"Direction reversal par bhi v = u + at valid hai — bas v ka sign negative aa jayega.","m":"C me 'cannot be used' galat hai.","s":["A: sahi.","B: sahi.","C: reversal par bhi equation valid → NOT correct.","D: variable acceleration me invalid → sahi.","Isliye option (C)."],"r":{"0":"Ye sahi hai.","1":"Ye bhi sahi hai.","3":"Ye bhi sahi hai."},"t":"Equations ka condition sirf 'a constant' hai — direction reversal koi problem nahi.","w":"","fig":null,"sim":null},{"id":382,"q":"Which one of the following statements is correct?","opt":["If the velocity of a particle varies as v = $kt^{2}$, its acceleration is constant.","If the position of a particle varies as x = $kt^{2}$, its acceleration increases with time.","If the position of a particle varies as x = $kt^{3}$, its acceleration increases linearly with time.","If the position of a particle varies as x = $kt^{3}$, its acceleration is constant."],"ans":2,"c":"$x=kt^3$ → $v=3kt^2$ → $a=6kt$, jo t me linear hai.","m":"Do derivative lo aur power check karo.","s":["C: $a=6kt$ → linear → sahi.","D: constant nahi → galat.","A: $v=kt^2$ → $a=2kt$ → galat.","B: $x=kt^2$ → a = 2k constant → galat.","Isliye option (C)."],"r":{"3":"a badalta hai (t ke proportional).","0":"a = 2kt, constant nahi.","1":"x quadratic → a constant."},"t":"Power ka pattern: x ∝ $t^{3}$ → a ∝ t; x ∝ $t^{2}$ → a constant.","w":"","fig":null,"sim":null},{"id":383,"q":"Match the position-time relations in Column I with the accelerations of the body at t = $2\\ \\mathrm{s}$ in Column II. Here x is in metre and t is in second.\nColumn I: (a) x = 2$t^{4}$ (b) x = 3$t^{3}$ (c) x = 4$t^{2}$ (d) x = 6t + 5\nColumn II: (i) Zero (ii) $8\\ \\mathrm{m\\,s^{-2}}$ (iii) $36\\ \\mathrm{m\\,s^{-2}}$ (iv) $96\\ \\mathrm{m\\,s^{-2}}$","opt":["a-iv, b-iii, c-ii, d-i","a-i, b-ii, c-iii, d-iv","a-iii, b-iv, c-i, d-ii","a-ii, b-i, c-iv, d-iii"],"ans":0,"c":"Do baar differentiate karke a nikalo, phir t = 2 daalo.","m":"Chaar second derivatives.","s":["(a) $x=2t^4\\Rightarrow a=24t^2=96$ → iv.","(b) $x=3t^3\\Rightarrow a=18t=36$ → iii.","(c) $x=4t^2\\Rightarrow a=8$ → ii.","(d) linear → a = 0 → i.","Isliye a-iv, b-iii, c-ii, d-i → option (A)."],"r":{"1":"(a) me zero daal diya.","2":"(a) me 36 daal diya (b ka answer).","3":"(a) me 8 daal diya (c ka answer)."},"t":"$t^{4}$ ka second derivative 12$t^{2}$ hota hai — power 2 se ghatti hai.","w":"","fig":null,"sim":null},{"id":384,"q":"Match the cases in Column I with the braking distances in Column II. In each case the brakes produce the stated constant retardation.\nColumn I: (a) A car moving at $10\\ \\mathrm{m\\,s^{-1}}$ with retardation $5\\ \\mathrm{m\\,s^{-2}}$ (b) A car moving at $20\\ \\mathrm{m\\,s^{-1}}$ with retardation $2\\ \\mathrm{m\\,s^{-2}}$ (c) A car moving at $20\\ \\mathrm{m\\,s^{-1}}$ with retardation $5\\ \\mathrm{m\\,s^{-2}}$ (d) A car moving at $30\\ \\mathrm{m\\,s^{-1}}$ with retardation $10\\ \\mathrm{m\\,s^{-2}}$\nColumn II: (i) $10\\ \\mathrm{m}$ (ii) $40\\ \\mathrm{m}$ (iii) $45\\ \\mathrm{m}$ (iv) $100\\ \\mathrm{m}$","opt":["a-i, b-iv, c-ii, d-iii","a-ii, b-iii, c-i, d-iv","a-iii, b-i, c-iv, d-ii","a-iv, b-ii, c-iii, d-i"],"ans":0,"c":"$s=\\dfrac{v^2}{2a}$ — chaar cases me lagao.","m":"Chaar chhote calculations.","s":["(a) $100/10=10$ m → i.","(b) $400/4=100$ m → iv.","(c) $400/10=40$ m → ii.","(d) $900/20=45$ m → iii.","Isliye a-i, b-iv, c-ii, d-iii → option (A)."],"r":{"1":"(a) me $40\\ \\mathrm{m}$ daal diya (c ka answer).","2":"(a) me $45\\ \\mathrm{m}$ daal diya (d ka answer).","3":"(a) me $100\\ \\mathrm{m}$ daal diya (b ka answer)."},"t":"Same speed, double retardation → aadha distance — isse option verify karo.","w":"","fig":null,"sim":null},{"id":385,"q":"Match the motions in Column I with the times in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$.\nColumn I: (a) A body projected vertically upward with u = $40\\ \\mathrm{m\\,s^{-1}}$; total time of flight (b) A body dropped from rest from a height of $80\\ \\mathrm{m}$; time to reach the ground (c) A body projected vertically upward with u = $20\\ \\mathrm{m\\,s^{-1}}$; time to reach the highest point (d) A body dropped from rest from a height of $125\\ \\mathrm{m}$; time to reach the ground\nColumn II: (i) $2\\ \\mathrm{s}$ (ii) $4\\ \\mathrm{s}$ (iii) $5\\ \\mathrm{s}$ (iv) $8\\ \\mathrm{s}$","opt":["a-iv, b-ii, c-i, d-iii","a-i, b-iii, c-ii, d-iv","a-ii, b-iv, c-iii, d-i","a-iii, b-i, c-iv, d-ii function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ d = null; }
  if(!d || typeof d !== 'object') d = {};
  if(!d.ans || typeof d.ans !== 'object') d.ans = {};
  if(typeof d.idx !== 'number' || d.idx < 0 || d.idx >= TOTAL) d.idx = 0;
  if(!d.view) d.view = 'quiz';
  if(typeof d.submitted !== 'boolean') d.submitted = false;
  if(!d.filter) d.filter = 'all';
  if(!d.skipped || typeof d.skipped !== 'object') d.skipped = {};
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- math helpers ---------- */
function esc(s){
  return String(s).replace(/&(?![a-zA-Z#]+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fallbackStrip(html){
  return html.replace(/\$/g,'').replace(/\\ce\{/g,'').replace(/\\mathrm\{/g,'')
             .replace(/\\tfrac\{/g,'(').replace(/\\frac\{/g,'(').replace(/\\sqrt\{/g,'\u221A(')
             .replace(/\\[a-zA-Z]+/g,'').replace(/[{}]/g,'');
}
function typeset(el){
  if(!el) return;
  if(window.renderMathInElement){
    try{
      renderMathInElement(el,{
        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError:false, trust:true, strict:false, ignoredTags:['script','style','noscript','textarea','input']
      });
      return;
    }catch(e){}
  }
  el.innerHTML = fallbackStrip(el.innerHTML);
}

/* ---------- figure builders ---------- */
function tl(str){ /* text -> svg tspans for ^{ } and _{ } */
  str = String(str).replace(/\$/g, '')
        .replace(/\\mathrm\{([^}]*)\}/g, '$1')
        .replace(/\\ce\{([^}]*)\}/g, '$1')
        .replace(/\\,|\\ /g, ' ')
        .replace(/\\sqrt\{([^}]*)\}/g, '\u221A($1)')
        .replace(/\\(?:d|t)?frac/g, '');
  let out = '', i = 0;
  while(i < str.length){
    const m = str.slice(i).match(/^([\^_])\{([^}]*)\}/);
    if(m){
      const shift = m[1] === '^' ? 'super' : 'sub';
      out += '<tspan baseline-shift="'+shift+'" font-size="70%">'+esc(m[2])+'</tspan>';
      i += m[0].length;
    } else { out += esc(str[i]); i++; }
  }
  return out;
}
function figGraph(fig){
  const series = fig.series ? fig.series : [{pts: fig.pts, color: '#7fb2ee'}];
  const allPts = series.reduce((a,s)=>a.concat(s.pts), []);
  const pts = allPts, W = 340, H = 230, PL = 52, PB = 42, PT = 20, PR = 30;
  let xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  let xmin = Math.min(0, ...xs), xmax = Math.max(...xs);
  let ymin = Math.min(0, ...ys), ymax = Math.max(...ys);
  if(xmax === xmin) xmax = xmin + 1;
  if(ymax === ymin) ymax = ymin + 1;
  if(ymin < 0) ymin = ymin * 1.25; else ymin = 0;
  ymax = ymax * 1.18;
  const px = x => PL + (x - xmin) / (xmax - xmin) * (W - PL - PR);
  const py = y => PT + (ymax - y) / (ymax - ymin) * (H - PT - PB);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img">';
  s += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#161a21"/>';
  /* grid lines */
  for(let k=0;k<=4;k++){
    const gx = PL + k*(W-PL-PR)/4, gy = PT + k*(H-PT-PB)/4;
    s += '<line x1="'+gx+'" y1="'+PT+'" x2="'+gx+'" y2="'+(H-PB)+'" stroke="#232a36" stroke-width="1"/>';
    s += '<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#232a36" stroke-width="1"/>';
  }
  /* axes */
  s += '<line x1="'+PL+'" y1="'+py(0)+'" x2="'+(W-PR+4)+'" y2="'+py(0)+'" stroke="#9aa3b2" stroke-width="1.6"/>';
  s += '<polygon points="'+(W-PR+4)+','+py(0)+' '+(W-PR-2)+','+(py(0)-4)+' '+(W-PR-2)+','+(py(0)+4)+'" fill="#9aa3b2"/>';
  s += '<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+PL+'" y2="'+(PT-6)+'" stroke="#9aa3b2" stroke-width="1.6"/>';
  s += '<polygon points="'+PL+','+(PT-6)+' '+(PL-4)+','+(PT+4)+' '+(PL+4)+','+(PT+4)+'" fill="#9aa3b2"/>';
  /* polylines */
  series.forEach((ser, si)=>{
    const col = ser.color || '#7fb2ee';
    const d = ser.pts.map((p,i)=>(i?'L':'M')+px(p[0])+','+py(p[1])).join(' ');
    s += '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linejoin="round"/>';
    ser.pts.forEach((p, pi)=>{
      s += '<circle cx="'+px(p[0])+'" cy="'+py(p[1])+'" r="3.4" fill="'+col+'"/>';
      if(!fig.series){
        const lx = px(p[0]), ly = py(p[1]);
        const rightSide = lx > PL + (W - PL - PR) * 0.7;
        const below = (pi % 2 === 1) || (ly - 10 < PT + 14);
        const tx = rightSide ? lx - 7 : lx + 7;
        const ty = below ? ly + 17 : ly - 9;
        s += '<text x="'+tx+'" y="'+ty+'" fill="#c3cad6" font-size="11" text-anchor="'+(rightSide?'end':'start')+'" stroke="#161a21" stroke-width="3" paint-order="stroke">('+tl(String(p[0]))+', '+tl(String(p[1]))+')</text>';
      }
    });
    if(ser.name){
      s += '<text x="'+(PL+8)+'" y="'+(PT+16+si*15)+'" fill="'+col+'" font-size="12">'+tl(ser.name)+'</text>';
    }
  });
  /* labels */
  s += '<text x="'+(W-PR-2)+'" y="'+(py(0)-8)+'" fill="#9aa3b2" font-size="13" text-anchor="end" stroke="#161a21" stroke-width="3" paint-order="stroke">'+tl(fig.xl || 't (s)')+'</text>';
  s += '<text x="'+(PL+7)+'" y="'+(PT+12)+'" fill="#9aa3b2" font-size="13" stroke="#161a21" stroke-width="3" paint-order="stroke">'+tl(fig.yl || '')+'</text>';
  s += '<text x="'+(PL-8)+'" y="'+(py(0)+5)+'" fill="#9aa3b2" font-size="12" text-anchor="end" stroke="#161a21" stroke-width="3" paint-order="stroke">O</text>';
  s += '</svg>';
  return s;
}
function pl0(v){ return v; }

function figTable(fig){
  let s = '<table class="dt"><thead><tr>';
  fig.head.forEach(h=>{ s += '<th>'+esc(h)+'</th>'; });
  s += '</tr></thead><tbody>';
  fig.rows.forEach(r=>{
    s += '<tr>';
    r.forEach(c=>{ s += '<td>'+esc(c)+'</td>'; });
    s += '</tr>';
  });
  s += '</tbody></table>';
  return s;
}
function figHTML(fig){
  if(!fig) return '';
  if(fig.t === 'g') return '<div class="figwrap" id="fighost">'+figGraph(fig)+'</div>';
  if(fig.t === 'tab') return '<div class="figwrap" id="fighost">'+figTable(fig)+'</div>';
  return '';
}

/* ---------- simulations ---------- */
const G = 10;
function simHTML(sim, host){
  if(!sim) return '';
  const box = document.createElement('div');
  box.className = 'simbox';
  const out = document.createElement('div');
  out.style.marginTop = '8px';
  function slider(label, min, max, step, val){
    const wrap = document.createElement('div');
    wrap.className = 'row';
    const lab = document.createElement('span');
    lab.style.minWidth = '120px';
    lab.style.color = '#9aa3b2';
    lab.textContent = label;
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = val;
    const valS = document.createElement('b');
    valS.textContent = val;
    wrap.appendChild(lab); wrap.appendChild(inp); wrap.appendChild(valS);
    box.appendChild(wrap);
    return {inp, valS, get v(){ return parseFloat(inp.value); }};
  }
  const title = document.createElement('div');
  title.className = 'small';
  title.textContent = sim.title || 'Live simulation — slider ghumao aur concept dekho';
  box.appendChild(title);
  if(sim.t === 'ff'){
    const h = slider('Height h (m)', 5, 125, 5, 45);
    function upd(){
      const hh = h.v, t = Math.sqrt(2*hh/G), v = Math.sqrt(2*G*hh);
      out.innerHTML = 'Fall time $t=\\sqrt{2h/g}=$ '+'<b>'+t.toFixed(2)+' s</b>'
        + ' &nbsp;·&nbsp; Ground speed $v=\\sqrt{2gh}=$ <b>'+v.toFixed(1)+' $\\mathrm{m\\,s^{-1}}$</b>'
        + '<br><span class="small">Height double karo: time $\\sqrt{2}$ guna, speed $\\sqrt{2}$ guna.</span>';
    }
    h.inp.oninput = ()=>{ h.valS.textContent = h.v; upd(); };
    upd();
  } else if(sim.t === 'ua'){
    const u = slider('Initial speed u', 0, 30, 1, 10);
    const a = slider('Acceleration a', -5, 10, 0.5, 2);
    function upd(){
      const t = 5, v = u.v + a.v*t, s = u.v*t + 0.5*a.v*t*t;
      out.innerHTML = 'At $t=5\\,\\mathrm{s}$: $v=u+at=$ <b>'+v.toFixed(1)+' $\\mathrm{m\\,s^{-1}}$</b>, '
        + '$s=ut+\\tfrac{1}{2}at^2=$ <b>'+s.toFixed(1)+' $\\mathrm{m}$</b>'
        + '<br><span class="small">$a$ negative karo: pehle slow, phir reverse — $v$ ka sign badalta hai.</span>';
    }
    u.inp.oninput = ()=>{ u.valS.textContent = u.v; upd(); };
    a.inp.oninput = ()=>{ a.valS.textContent = a.v; upd(); };
    upd();
  } else if(sim.t === 'sd'){
    const v = slider('Speed v (m/s)', 5, 40, 1, 20);
    const tr = slider('Reaction time (s)', 0, 1.5, 0.1, 0.5);
    const a = slider('Retardation a', 2, 12, 1, 5);
    function upd(){
      const d1 = v.v*tr.v, d2 = v.v*v.v/(2*a.v);
      out.innerHTML = 'Reaction distance $=v t_r=$ <b>'+d1.toFixed(1)+' m</b> &nbsp;·&nbsp; '
        + 'Braking distance $=\\dfrac{v^2}{2a}=$ <b>'+d2.toFixed(1)+' m</b> &nbsp;·&nbsp; '
        + 'Total <b>'+(d1+d2).toFixed(1)+' m</b>'
        + '<br><span class="small">Speed double: reaction distance 2 guna, braking distance 4 guna.</span>';
    }
    v.inp.oninput = ()=>{ v.valS.textContent = v.v; upd(); };
    tr.inp.oninput = ()=>{ tr.valS.textContent = tr.v.toFixed(1); upd(); };
    a.inp.oninput = ()=>{ a.valS.textContent = a.v; upd(); };
    upd();
  } else if(sim.t === 'rel'){
    const v1 = slider('Car A speed (m/s)', 0, 30, 1, 20);
    const v2 = slider('Car B speed (m/s)', 0, 30, 1, 12);
    function upd(){
      out.innerHTML = 'Same direction: $v_{AB}=$ <b>'+(v1.v-v2.v).toFixed(0)+' $\\mathrm{m\\,s^{-1}}$</b>'
        + ' &nbsp;·&nbsp; Opposite direction: $v_{AB}=$ <b>'+(v1.v+v2.v).toFixed(0)+' $\\mathrm{m\\,s^{-1}}$</b>';
    }
    v1.inp.oninput = ()=>{ v1.valS.textContent = v1.v; upd(); };
    v2.inp.oninput = ()=>{ v2.valS.textContent = v2.v; upd(); };
    upd();
  }
  box.appendChild(out);
  typeset(out);
  box.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>typeset(out)));
  return box;
}

/* ---------- question rendering ---------- */
function renderQuestion(){
  const q = DATA[S.idx];
  const stage = document.getElementById('stage');
  const sel = S.ans[q.id];
  const answered = (sel !== undefined && sel !== null);
  let html = '<div class="card">';
  html += '<div class="qhead"><div class="qno">Q'+q.id+' / '+TOTAL+
          ' &nbsp;·&nbsp; Set '+Math.floor((q.id-1)/50+1)+' (Q'+(Math.floor((q.id-1)/50)*50+1)+'-'+(Math.floor((q.id-1)/50)*50+50)+')</div>'+
          '<div class="tag">Kinematics</div></div>';
  html += '<div class="qtext" id="qtext">'+esc(q.q)+'</div>';
  html += figHTML(q.fig);
  html += '<div class="opts" id="opts"></div>';
  html += '<div id="verdict"></div>';
  html += '<div id="expl"></div>';
  html += '<div id="simhost"></div>';
  html += '</div>';

  html += '<div class="nav">'+
    '<button class="btn" id="prevBtn">‹ Previous</button>'+
    '<div class="row">'+
      '<button class="btn" id="skipBtn">Skip</button>'+
      '<button class="btn primary" id="gridBtn">Grid</button>'+
      '<button class="btn primary" id="nextBtn">Next ›</button>'+
    '</div></div>';
  html += '<div class="nav" style="margin-top:10px">'+
      '<button class="btn green" id="submitBtn">Submit test</button>'+
      '<span class="small">Marking: +4 correct · −1 wrong · 0 unattempted</span></div>';

  stage.innerHTML = html;

  const optsBox = document.getElementById('opts');
  q.opt.forEach((o, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="ltr">'+LTR[i]+'</span><span class="otxt">'+esc(o)+'</span>';
    b.onclick = ()=> choose(i);
    if(answered){
      b.disabled = true;
      if(i === q.ans) b.classList.add('right');
      if(i === sel && sel !== q.ans) b.classList.add('wrong');
      if(i === sel) b.classList.add('sel');
    }
    optsBox.appendChild(b);
  });
  typeset(document.getElementById('qtext'));
  const fh = document.getElementById('fighost');
  if(fh) typeset(fh);
  q.opt.forEach((o,i)=>{ typeset(optsBox.children[i]); });

  if(answered) showExplanation(q, sel);

  document.getElementById('prevBtn').onclick = ()=> nav(-1);
  document.getElementById('nextBtn').onclick = ()=> nav(1);
  document.getElementById('skipBtn').onclick = ()=> skipQ();
  document.getElementById('gridBtn').onclick = ()=> openGrid();
  document.getElementById('submitBtn').onclick = ()=> trySubmit();
  document.getElementById('prevBtn').disabled = (S.idx === 0);

  const sim = simHTML(q.sim);
  if(sim && q.sim){ document.getElementById('simhost').appendChild(sim); }
  updateBars();
}

function showExplanation(q, sel){
  const v = document.getElementById('verdict');
  const ok = (sel === q.ans);
  v.className = 'verdict ' + (ok ? 'ok' : 'no');
  v.textContent = ok ? '\u2713 Sahi jawab' : '\u2717 Galat jawab';
  const box = document.getElementById('expl');
  let h = '<div class="expl">';
  h += '<h4>1. Concept — zero se</h4><p>'+esc(q.c)+'</p>';
  h += '<h4>2. Method — kaun sa aur kyun</h4><p>'+esc(q.m)+'</p>';
  h += '<h4>3. Step-by-step</h4><ol>';
  q.s.forEach(st=>{ h += '<li>'+esc(st)+'</li>'; });
  h += '</ol>';
  h += '<div class="ansline"><b>Sahi jawab: ('+LTR[q.ans]+')</b> '+esc(q.opt[q.ans])+'</div>';
  const wrong = Object.keys(q.r || {}).sort((a,b)=>a-b);
  if(wrong.length){
    h += '<h4>4. Baaki options kyun galat</h4><ul>';
    wrong.forEach(k=>{ h += '<li><b>('+LTR[+k]+')</b> '+esc(q.r[k])+'</li>'; });
    h += '</ul>';
  }
  if(q.w){ h += '<h4>5. Cross-check</h4><p>'+esc(q.w)+'</p>'; }
  if(q.t){ h += '<h4>6. Tip</h4><p class="tip">'+esc(q.t)+'</p>'; }
  h += '</div>';
  box.innerHTML = h;
  typeset(box);
}

function choose(i){
  const q = DATA[S.idx];
  if(S.ans[q.id] !== undefined && S.ans[q.id] !== null) return;
  S.ans[q.id] = i;
  delete S.skipped[q.id];
  save();
  renderQuestion();
}

function skipQ(){
  const q = DATA[S.idx];
  if(S.ans[q.id] === undefined || S.ans[q.id] === null) S.skipped[q.id] = 1;
  save();
  nav(1);
}
function nav(d){
  const n = S.idx + d;
  if(n >= 0 && n < TOTAL){ S.idx = n; save(); renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(n >= TOTAL){ openGrid(); }
}

/* ---------- score / bars ---------- */
function stats(){
  let correct = 0, wrong = 0, att = 0;
  DATA.forEach(q=>{
    const a = S.ans[q.id];
    if(a === undefined || a === null) return;
    att++;
    if(a === q.ans) correct++; else wrong++;
  });
  const marks = correct*4 - wrong;
  return {correct, wrong, att, marks, unatt: TOTAL - att};
}
function updateBars(){
  const st = stats();
  document.getElementById('scoreChip').textContent = st.correct;
  document.getElementById('attChip').textContent = st.att;
  document.getElementById('totChip').textContent = TOTAL;
  document.getElementById('markChip').textContent = st.marks;
  document.getElementById('maxChip').textContent = MAXMARKS;
  document.getElementById('bar').style.width = (st.att/TOTAL*100).toFixed(1)+'%';
}

/* ---------- grid ---------- */
function openGrid(){
  document.getElementById('gridModal').classList.remove('hidden');
  document.getElementById('filterSel').value = S.filter;
  renderGrid();
}
function closeGrid(){ document.getElementById('gridModal').classList.add('hidden'); }
function setFilter(v){ S.filter = v; save(); renderGrid(); }
function renderGrid(){
  const box = document.getElementById('gridBox');
  box.innerHTML = '';
  DATA.forEach((q, i)=>{
    const a = S.ans[q.id];
    const answered = (a !== undefined && a !== null);
    if(S.filter === 'answered' && !answered) return;
    if(S.filter === 'unanswered' && answered) return;
    if(S.filter === 'wrong' && !(answered && a !== q.ans)) return;
    const b = document.createElement('button');
    b.className = 'gbtn';
    b.textContent = q.id;
    if(i === S.idx) b.classList.add('cur');
    if(answered) b.classList.add(a === q.ans ? 'ok' : 'no');
    else if(S.skipped[q.id]) b.classList.add('skip');
    b.onclick = ()=>{ S.idx = i; save(); closeGrid(); renderQuestion(); window.scrollTo({top:0}); };
    box.appendChild(b);
  });
}
function goTo(){
  const v = parseInt(document.getElementById('gotoInput').value, 10);
  if(!isNaN(v) && v >= 1 && v <= TOTAL){
    S.idx = v-1; save(); closeGrid(); renderQuestion(); window.scrollTo({top:0});
  }
}

/* ---------- submit / result / review ---------- */
function trySubmit(){
  const st = stats();
  const msg = 'Submit test?\n\nAttempted: '+st.att+' / '+TOTAL+
    '\nUnattempted: '+st.unatt+
    '\nMarks abhi: '+st.marks+' / '+MAXMARKS+
    '\n\nSubmit ke baad answers lock ho jayenge.';
  if(confirm(msg)){ S.submitted = true; S.view = 'result'; save(); render(); }
}
function renderResult(){
  const st = stats();
  const acc = st.att ? (st.correct/st.att*100) : 0;
  let h = '<div class="card"><div class="qhead"><b style="font-size:19px">Result</b>'+
    '<div class="tag">Kinematics</div></div>';
  h += '<div class="stat">'+
    '<div><span>Score</span><b>'+st.marks+' / '+MAXMARKS+'</b></div>'+
    '<div><span>Correct</span><b style="color:#66c78d">'+st.correct+'</b></div>'+
    '<div><span>Wrong</span><b style="color:#e0827c">'+st.wrong+'</b></div>'+
    '<div><span>Unattempted</span><b>'+st.unatt+'</b></div>'+
    '<div><span>Accuracy</span><b>'+acc.toFixed(1)+'%</b></div>'+
    '<div><span>Attempted</span><b>'+st.att+' / '+TOTAL+'</b></div>'+
    '</div>';
  h += '<div class="row" style="margin-top:8px">'+
    '<button class="btn primary" onclick="showReview()">Review all answers</button>'+
    '<button class="btn red" onclick="restart()">Restart</button>'+
    '<button class="btn" onclick="backToQuiz()">Back to questions</button>'+
    '</div></div>';
  document.getElementById('stage').innerHTML = h;
}
function showReview(){
  S.view = 'review'; save();
  let h = '<div class="card"><div class="row" style="justify-content:space-between">'+
    '<b style="font-size:18px">Review — all '+TOTAL+' questions</b>'+
    '<button class="btn sm" onclick="backToQuiz()">Back</button></div>';
  DATA.forEach(q=>{
    const a = S.ans[q.id];
    const answered = (a !== undefined && a !== null);
    const ok = answered && a === q.ans;
    h += '<div class="revitem" style="border-color:'+(ok?'#2f6b48':(answered?'#7a3a37':'#2e3542'))+'">';
    h += '<div class="rq"><b>Q'+q.id+'.</b> '+esc(q.q)+'</div>';
    h += '<div class="small" style="margin-top:6px">Your answer: '+
      (answered ? '('+LTR[a]+') '+esc(q.opt[a]) : '<i>not attempted</i>')+'</div>';
    h += '<div class="small" style="color:#8fdcae">Correct: ('+LTR[q.ans]+') '+esc(q.opt[q.ans])+'</div>';
    h += '<div class="small" style="margin-top:4px">'+esc(q.c)+'</div>';
    h += '</div>';
  });
  h += '</div>';
  document.getElementById('stage').innerHTML = h;
  document.querySelectorAll('#stage .revitem').forEach(el=>{
    const m = el.querySelector('.rq').textContent.match(/Q(\d+)\./);
    if(m){
      el.style.cursor = 'pointer';
      el.onclick = ()=>{ S.idx = parseInt(m[1],10)-1; S.view='quiz'; save(); render(); window.scrollTo({top:0}); };
    }
  });
  typeset(document.getElementById('stage'));
}
function restart(){
  if(!confirm('Restart? Saare answers delete ho jayenge.')) return;
  S = {ans:{}, idx:0, view:'quiz', submitted:false, filter:'all', skipped:{}};
  save(); render();
}
function backToQuiz(){ S.view = 'quiz'; save(); render(); }

/* ---------- main render ---------- */
function render(){
  if(S.view === 'result') renderResult();
  else if(S.view === 'review') showReview();
  else { renderQuestion(); }
  updateBars();
}
document.addEventListener('keydown', (e)=>{
  if(S.view !== 'quiz' || S.submitted) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if(e.key === 'ArrowRight') nav(1);
  if(e.key === 'ArrowLeft') nav(-1);
  const k = ['a','b','c','d'].indexOf(e.key.toLowerCase());
  if(k >= 0){
    const q = DATA[S.idx];
    if(S.ans[q.id] === undefined || S.ans[q.id] === null) choose(k);
  }
});
document.getElementById('gridModal').addEventListener('click', (e)=>{
  if(e.target.id === 'gridModal') closeGrid();
});
render();
</script>
