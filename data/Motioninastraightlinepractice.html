<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET Physics Quiz - Motion in a Straight Line (400 MCQs)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --bg:#12141a; --card:#1b1f27; --card2:#222834; --line:#2e3542;
    --text:#dcdfe4; --muted:#9aa3b2; --green:#3f9e6a; --green-bg:#16301f;
    --red:#c1544f; --red-bg:#33191b; --amber:#c8a24a; --blue:#5b8fd6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
  a{color:var(--blue)}
  header{position:sticky;top:0;z-index:40;background:rgba(18,20,26,.96);
    border-bottom:1px solid var(--line);padding:10px 14px 8px;backdrop-filter:blur(4px)}
  .hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .title{font-size:15px;font-weight:700;letter-spacing:.2px}
  .title span{color:var(--muted);font-weight:500;font-size:13px;display:block}
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;
    padding:4px 12px;font-size:14px;color:var(--text);white-space:nowrap}
  .chip b{color:var(--green)}
  .chip.warn b{color:var(--amber)}
  .barwrap{height:7px;background:#262c38;border-radius:99px;margin-top:9px;overflow:hidden}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#3f9e6a,#5b8fd6);transition:width .25s}
  main{max-width:900px;margin:0 auto;padding:14px 14px 30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 14px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .qhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
  .qno{font-size:14px;color:var(--muted);letter-spacing:.4px}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
  .qtext{font-size:18px;line-height:1.75;margin:2px 0 12px}
  .figwrap{background:#161a21;border:1px solid var(--line);border-radius:12px;padding:8px;
    margin:10px 0 14px;overflow-x:auto}
  .figwrap svg{display:block;margin:0 auto;max-width:100%;height:auto}
  table.dt{border-collapse:collapse;width:100%;font-size:16px}
  table.dt th,table.dt td{border:1px solid var(--line);padding:6px 10px;text-align:center}
  table.dt th{background:#232a36;color:var(--muted);font-weight:600}
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    min-height:52px;padding:12px 14px;font-size:17px;line-height:1.6;color:var(--text);
    background:var(--card2);border:1px solid var(--line);border-radius:12px;cursor:pointer;
    transition:border-color .15s,background .15s;font-family:inherit}
  .opt:hover:not(:disabled){border-color:#4a5568}
  .opt:disabled{cursor:default}
  .opt .ltr{flex:0 0 28px;height:28px;border-radius:8px;background:#2c3441;color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-top:2px}
  .opt.sel{border-color:var(--blue);background:#1e2632}
  .opt.right{border-color:var(--green);background:var(--green-bg)}
  .opt.right .ltr{background:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-bg)}
  .opt.wrong .ltr{background:var(--red);color:#fff}
  .verdict{margin-top:10px;font-weight:700;font-size:16px}
  .verdict.ok{color:#66c78d}
  .verdict.no{color:#e0827c}
  .expl{background:#171b22;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
  .expl h4{margin:14px 0 6px;font-size:15px;letter-spacing:.3px;color:#a8c8ea;text-transform:uppercase}
  .expl h4:first-child{margin-top:0}
  .expl p{margin:6px 0}
  .expl ol,.expl ul{margin:6px 0 6px 20px;padding:0}
  .expl li{margin:5px 0}
  .ansline{background:#14261b;border:1px solid #2b6b45;border-radius:10px;padding:10px 12px;margin-top:10px}
  .tip{border-left:3px solid var(--amber);padding:6px 0 6px 12px;color:#e6d6a8}
  .nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;
    padding:11px 18px;font-size:16px;min-height:48px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:#4a5568}
  .btn.primary{background:#24405e;border-color:#3a628c}
  .btn.green{background:#1c3a2a;border-color:#2f6b48}
  .btn.red{background:#3a1e1f;border-color:#7a3a37}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:8px 12px;min-height:40px;font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=number],input[type=text],select{background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;min-height:46px}
  .gridbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px;
    max-height:56vh;overflow-y:auto;padding:4px}
  .gbtn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);font-size:15px;cursor:pointer;font-family:inherit}
  .gbtn.cur{outline:2px solid var(--blue)}
  .gbtn.ok{background:var(--green-bg);border-color:#2f6b48;color:#8fdcae}
  .gbtn.no{background:var(--red-bg);border-color:#7a3a37;color:#efa5a1}
  .gbtn.skip{background:#2a2517;border-color:#5b4d24;color:#e0c88a}
  .hidden{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(6,8,11,.78);z-index:90;display:flex;
    align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
  .modal .inner{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;max-width:760px;width:100%;margin-top:24px}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
  .stat div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat span{display:block;font-size:13px;color:var(--muted)}
  .stat b{font-size:19px}
  .revitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;background:var(--card2)}
  .revitem .rq{font-size:16px}
  .small{font-size:14px;color:var(--muted)}
  .simbox{margin-top:12px;border:1px dashed #3a4352;border-radius:12px;padding:12px;background:#161a21}
  .simbox .row{margin:8px 0;flex-wrap:nowrap;gap:8px}
  .simbox .row input[type=range]{flex:1 1 auto;min-width:80px;accent-color:#5b8def}
  .simbox .row b{min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
  .simbox input[type=range]{width:150px;accent-color:#5b8fd6}
  .katex{font-size:1.03em}
  @media (max-width:520px){
    .qtext{font-size:17px} .opt{font-size:16.5px} main{padding:10px 10px 26px}
    .title{font-size:14px}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="title">Motion in a Straight Line — 400 MCQ Quiz
      <span>NEET UG 2027 practice · Set-wise ladder (very easy → extreme)</span></div>
    <div class="chips">
      <div class="chip">Score <b id="scoreChip">0</b></div>
      <div class="chip">Attempted <b id="attChip">0</b>/<b id="totChip">400</b></div>
      <div class="chip warn">Marks <b id="markChip">0</b>/<b id="maxChip">1600</b></div>
    </div>
  </div>
  <div class="barwrap"><div class="bar" id="bar"></div></div>
</header>

<main>
  <div id="stage"></div>
</main>

<div id="gridModal" class="modal hidden">
  <div class="inner">
    <div class="row" style="justify-content:space-between">
      <b>Question grid</b>
      <button class="btn sm" onclick="closeGrid()">Close</button>
    </div>
    <div class="row" style="margin:12px 0">
      <select id="filterSel" onchange="setFilter(this.value)">
        <option value="all">All questions</option>
        <option value="answered">Answered</option>
        <option value="unanswered">Unanswered</option>
        <option value="wrong">Wrong</option>
      </select>
      <input type="number" id="gotoInput" min="1" placeholder="Go to Q" style="width:120px">
      <button class="btn sm" onclick="goTo()">Go</button>
    </div>
    <div class="small" id="gridLegend" style="margin-bottom:8px">
      Green = correct · Red = wrong · Yellow = skipped · Grey = not visited
    </div>
    <div class="gridbox" id="gridBox"></div>
  </div>
</div>

<script>
const DATA = [{"id":1,"q":"The branch of mechanics that deals with the description of motion of an object without considering the cause of the motion is called:","opt":["Dynamics","Kinetics","Statics","Kinematics"],"ans":3,"c":"Mechanics ki do main branches hain. Kinematics sirf motion ko describe karta hai (position, velocity, acceleration, time), jabki dynamics motion ka cause yaani force study karta hai.","m":"Yeh pure definition-based question hai, isliye calculate kuch nahi karna — sirf definition match karni hai. Question me 'without considering the cause' likha hai, wahi keyword kinematics ka hai.","s":["Kinematics: motion ka description, cause se matlab nahi. Ye question ki demand hai.","Dynamics: motion ka cause (force, momentum) ke saath study. Ye 'cause' wali condition tod deta hai.","Statics: rest me pade bodies ka study — motion ka description nahi.","Isliye answer Kinematics hai, option (D)."],"r":{"2":"Statics sirf rest condition padhta hai, moving body ka description nahi.","0":"Dynamics force (cause) ke saath motion padhta hai, jabki question cause nahi maang raha.","1":"Kinetics mechanics ki standard branch name nahi hai; ye galat term hai."},"t":"NCERT ki line yaad rakho: 'Kinematics deals with the description of motion without going into the cause of motion.' Yeh line NEET me bahut baar aati hai.","w":"","fig":null,"sim":null},{"id":2,"q":"Which one of the following is a scalar quantity?","opt":["Displacement","Velocity","Acceleration","Distance"],"ans":3,"c":"Scalar quantity me sirf magnitude hota hai, direction nahi. Vector quantity me magnitude ke saath direction bhi hoti hai.","m":"Har option ko do sawaal poochho: (i) iska value negative ho sakta hai? (ii) ise direction ke bina likh sakte hain? Jo direction ke bina poora ho jaye, wahi scalar hai.","s":["Distance: sirf length hai, always positive, direction bekaar hai → scalar.","Displacement: initial se final tak ka directed shortest path → vector.","Velocity: displacement ka rate, direction ke saath → vector.","Acceleration: velocity ka rate of change, direction ke saath → vector.","Isliye scalar sirf Distance hai, option (D)."],"r":{"0":"Displacement vector hai — direction (sign) ke bina adhoora hai.","1":"Velocity vector hai; negative velocity ka matlab opposite direction hota hai.","2":"Acceleration vector hai, iska sign bhi matter karta hai."},"t":"Yaad karne ka simple rule: jisme sign (+) aur (−) ka matlab direction ho, wo vector hai; jahan negative bekaar ho, wo scalar.","w":"","fig":null,"sim":null},{"id":3,"q":"The SI unit of acceleration is:","opt":["$\\mathrm{m^2\\,s^{-2}}$","$\\mathrm{N\\,m^{-1}}$","$\\mathrm{m\\,s^{-1}}$","$\\mathrm{m\\,s^{-2}}$"],"ans":3,"c":"Acceleration = velocity me change / time. Isliye iska unit banega (velocity ka unit) / (time ka unit).","m":"Formula a = (v − u)/t likho aur units rakho: $(\\mathrm{m\\,s^{-1}})/\\mathrm{s} = \\mathrm{m\\,s^{-2}}$.","s":["$a=\\Delta v/\\Delta t$ likho.","$\\Delta v$ ka unit $\\mathrm{m\\,s^{-1}}$ hai, $\\Delta t$ ka $\\mathrm{s}$.","$\\mathrm{m\\,s^{-1}}/\\mathrm{s} = \\mathrm{m\\,s^{-2}}$.","Isliye option (D) sahi hai."],"r":{"2":"$\\mathrm{m\\,s^{-1}}$ velocity ka unit hai, acceleration ka nahi (ek s ki power kam hai).","0":"$\\mathrm{m^2\\,s^{-2}}$ energy ya $v^{2}$ jaisi quantity ka unit hai, acceleration ka nahi.","1":"$\\mathrm{N\\,m^{-1}}$ surface tension / spring constant type ka unit hai."},"t":"Dimension se unit nikalo, yaad karne ki zaroorat nahi: $[a] = \\mathrm{LT^{-2}}$.","w":"","fig":null,"sim":null},{"id":4,"q":"A body starts from point P, goes to point Q and then returns to point P. For this complete journey:","opt":["both distance and displacement are zero","both distance and displacement are non-zero and equal","distance is zero but displacement is non-zero","displacement is zero but distance is non-zero"],"ans":3,"c":"Distance = total path length travelled (scalar). Displacement = final position − initial position (vector, shortest straight line).","m":"Pehle initial aur final position compare karo, phir path length dekho. Yahan dono hi P hain.","s":["Initial position = P, final position = P, to displacement = 0.","Path length = PQ + QP = 2·PQ ≠ 0, yaani distance non-zero.","Isliye displacement zero, distance non-zero → option (D)."],"r":{"2":"Ulta hai — displacement P se P tak zero hota hai, distance nahi.","0":"Distance zero tab hota hai jab body bilkul na chale; yahan chal kar gayi hai.","1":"Dono equal tab hote hain jab motion straight line me ek hi direction me ho."},"t":"Return journey me displacement zero ho sakta hai, distance kabhi zero nahi hota (jab tak body chali ho).","w":"","fig":null,"sim":null},{"id":5,"q":"A body moving with uniform velocity along a straight line has:","opt":["non-zero uniform acceleration","continuously increasing acceleration","non-uniform acceleration","zero acceleration"],"ans":3,"c":"Acceleration = velocity ke change ka rate. Uniform velocity ka matlab hai velocity ka magnitude aur direction dono constant.","m":"Velocity constant hai to uske change ka rate kya hoga? Bas isi ek sawaal se answer aa jata hai.","s":["Uniform velocity → v = constant.","a = dv/dt = d(constant)/dt = 0.","Isliye acceleration zero, option (D)."],"r":{"0":"Uniform acceleration ka matlab velocity line se badalti rehti hai — yahan velocity constant hai.","1":"Acceleration badh hi nahi raha, wo zero hai.","2":"Non-uniform acceleration ka matlab bhi acceleration ka hona zaroori hai."},"t":"Uniform velocity aur uniform acceleration do alag cheezein hain — velocity constant ho to acceleration zero.","w":"","fig":null,"sim":null},{"id":6,"q":"The equation v = u + at can be applied to the motion of a body only when its acceleration is:","opt":["continuously increasing","continuously decreasing","zero","constant"],"ans":3,"c":"Teen equations of motion (v = u + at, s = ut + $\\tfrac{1}{2}at^2$, $v^{2}$ = $u^{2}$ + 2as) sirf uniformly accelerated motion ke liye valid hain, yaani a constant hona chahiye.","m":"Equation ki derivation dekho: a = (v − u)/t maana gaya hai, jisme a ko constant treat kiya jata hai. Isi condition ko option me dhoondo.","s":["v = u + at a ki definition a = (v − u)/t se aata hai, jahan a constant hai.","Agar a time ke saath badle, to v = u + at galat answer dega.","Isliye condition: acceleration constant → option (D)."],"r":{"2":"a = 0 sirf ek special case hai; equation 0 ke alawa constant a par bhi chalti hai.","0":"Badhta hua a ho to calculus (integration) chahiye, ye simple equation nahi.","1":"Ghatta hua a bhi variable acceleration hai — equation valid nahi."},"t":"Variable acceleration me $v=\\int a\\,dt$ aur $s=\\int v\\,dt$ use karo, simple equations nahi.","w":"","fig":null,"sim":null},{"id":7,"q":"When a body falls freely under gravity, neglecting air resistance, its acceleration is:","opt":["zero throughout the motion","directed downward and increasing with time","directed upward and decreasing with time","directed downward and constant in magnitude"],"ans":3,"c":"Free fall ka matlab: sirf gravity ke under motion. Gravity ka acceleration g hota hai, jo hamesha vertically downward hota hai aur (chhoti heights par) constant maana jata hai.","m":"Yahan koi calculation nahi — sirf direction aur constancy check karni hai.","s":["Free fall me force sirf weight (mg) hai, to a = g downward.","Air resistance neglect kiya gaya hai, isliye g ki value badalti nahi (constant).","Isliye answer: downward + constant → option (D)."],"r":{"2":"Gravity kabhi upward nahi karta; upward a lift ya kisi aur force se aata hai.","0":"Acceleration zero hota hai constant velocity par, free fall me nahi.","1":"g distance ke saath thoda kam hota hai, par question me constant maana jata hai; 'increasing' bilkul galat hai."},"t":"Take g = $10\\ \\mathrm{m\\,s^{-2}}$ (NEET me usually 10) aur ise hamesha downward lena — chahe body upar ja rahi ho ya neeche.","w":"","fig":null,"sim":null},{"id":8,"q":"A body starts from the origin, moves along a straight line and finally returns to the origin. Its average velocity for the whole journey is:","opt":["equal to its average speed","infinite","always negative","zero"],"ans":3,"c":"Average velocity = net displacement / total time. Displacement origin se origin tak zero hai.","m":"Formula me value daalo: displacement 0, time non-zero → average velocity 0.","s":["Displacement = 0 (shuru aur ant dono origin par).","Average velocity = 0 / t = 0.","Isliye option (D)."],"r":{"0":"Average speed = total path / time ≠ 0 hoti hai; dono barabar nahi.","1":"Time zero nahi hai, isliye division me infinity nahi aayega.","2":"Average velocity zero hai, negative nahi."},"t":"Displacement zero → average velocity zero; distance non-zero → average speed non-zero. Ye jodi NEET ka favourite trap hai.","w":"","fig":null,"sim":null},{"id":9,"q":"The slope of a position-time graph at any instant gives:","opt":["average speed","acceleration at that instant","total distance travelled","instantaneous velocity at that instant"],"ans":3,"c":"Graph me slope = (y me change)/(x me change). Position-time graph me y = position, x = time, to slope = dx/dt = velocity.","m":"Slope ka physical meaning nikalo: dx/dt ka matlab kya hota hai? wahi answer hai.","s":["Slope = dx/dt.","dx/dt ki definition hi instantaneous velocity hai.","Isliye option (D)."],"r":{"1":"Acceleration velocity-time graph ke slope se milta hai (dv/dt).","2":"Total distance area se nahi, path length se milta hai; slope se nahi.","0":"Average speed total path/time hai, tangent ka slope nahi."},"t":"Yaad rakho: x–t graph ka slope → velocity; v–t graph ka slope → acceleration; a–t graph ka slope → jerk.","w":"","fig":null,"sim":null},{"id":10,"q":"The area enclosed between a velocity-time graph and the time axis gives:","opt":["rate of change of acceleration","average velocity","acceleration","displacement"],"ans":3,"c":"v–t graph me chhota strip socho: area = v × dt = displacement us chhote interval me. Sabhi strips jod do to total displacement.","m":"Area ka matlab hai y-quantity × x-quantity. yahan v × t = displacement. Bas isi dimensional logic se answer.","s":["Area = v × t.","v × t ka dimension displacement ka hota hai.","Sign ke saath area jodne par net displacement milta hai → option (D)."],"r":{"2":"Acceleration v–t graph ke slope se milta hai, area se nahi.","0":"Acceleration ke change ka rate (jerk) a–t graph ke slope se aata hai.","1":"Average velocity = displacement/time, ye area se derived ho sakti hai par area khud displacement hai."},"t":"Time axis ke neeche wala area negative lena hai — tabhi displacement sahi aata hai.","w":"","fig":null,"sim":null},{"id":11,"q":"The area under an acceleration-time graph gives:","opt":["change in position","average speed","change in acceleration","change in velocity"],"ans":3,"c":"a–t graph me chhota area = a × dt = dv, yaani velocity me chhota change. Sab jodne par total change in velocity.","m":"Area = y × x = a × t. Dimension check karo: $\\mathrm{m\\,s^{-2}}\\times \\mathrm{s} = \\mathrm{m\\,s^{-1}}$ = velocity.","s":["Area = a × t.","Dimension: $\\mathrm{m\\,s^{-2}}\\cdot\\mathrm{s} = \\mathrm{m\\,s^{-1}}$.","Isliye area change in velocity deta hai → option (D)."],"r":{"0":"Position ke liye v–t graph ka area chahiye, a–t ka nahi.","1":"Average speed ek ratio hai, area ka dimension usse match nahi karta.","2":"Change in acceleration slope (jerk × time) se aata hai."},"t":"Rule of thumb: jis graph ka area, uska integral. a ka integral v, v ka integral s.","w":"","fig":null,"sim":null},{"id":12,"q":"If the speed of a vehicle is doubled while the retardation produced by the brakes remains the same, the stopping distance becomes:","opt":["half","the same","two times","four times"],"ans":3,"c":"Stopping distance me final velocity zero hoti hai. $v^{2}$ = $u^{2}$ − 2as se s = $u^{2}$/(2a).","m":"Formula likho aur u ko 2u karke dekho ki s kaise badalta hai. Ye proportionality ka question hai, numbers ki zaroorat nahi.","s":["$v^{2}$ = $u^{2}$ − 2as, v = 0 rakhne par $s=u^2/(2a)$.","a same hai, to s ∝ $u^{2}$.","u double → s four times → option (D)."],"r":{"1":"s speed par depend karta hai, constant nahi rehta.","2":"s ∝ u, nahi; s ∝ $u^{2}$ hai, isliye 2 guna nahi 4 guna hoga.","0":"Speed badhne par stopping distance badhta hai, ghatta nahi."},"t":"Stopping distance ∝ $v^{2}$ — yahi wajah hai ki high speed par accident itne khatarnak hote hain.","w":"","fig":null,"sim":null},{"id":13,"q":"Consider the following statements about distance and displacement:\nI. Distance is always greater than or equal to the magnitude of displacement.\nII. Displacement can be zero even when the distance travelled is non-zero.\nIII. Distance travelled by a moving body can decrease with time.\nIV. Displacement can be negative.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and III only","I, II and IV only"],"ans":3,"c":"Distance scalar hai aur hamesha badhta hai (path length). Displacement vector hai, sign ke saath aata hai, zero ya negative bhi ho sakta hai.","m":"Har statement ko alag-alag true/false mark karo, phir options se match karo. Ek galat statement poore option ko kill kar deta hai.","s":["I: path length ≥ shortest distance → TRUE.","II: P → Q → P me distance 2PQ, displacement 0 → TRUE.","III: distance total path length hai, wo kabhi ghat nahi sakta → FALSE.","IV: negative x-direction me displacement negative hota hai → TRUE.","True set = I, II, IV → option (D)."],"r":{"2":"Isme III hai, jo galat hai (distance decrease nahi hota).","0":"Isme III hai aur I nahi — dono wajah se galat.","1":"Isme III hai, isliye eliminate."},"t":"Statement questions me sabse pehle 'definitely false' statement dhundo, phir usse wale options hata do.","w":"","fig":null,"sim":null},{"id":14,"q":"Consider the following statements about speed and velocity:\nI. The average speed of a moving body over a finite time interval can be zero.\nII. Average speed is always greater than or equal to the magnitude of average velocity.\nIII. In one-dimensional motion, the instantaneous speed is the magnitude of the instantaneous velocity.\nIV. Average speed is a scalar quantity while average velocity is a vector quantity.\nThe correct statements are:","opt":["I, III and IV only","I, II and IV only","I, II and III only","II, III and IV only"],"ans":3,"c":"Average speed = total path/time (scalar, never negative). Average velocity = net displacement/time (vector). In 1D, instantaneous speed = |instantaneous velocity|.","m":"Statement I ko sabse pehle test karo — wo sabse bada trap hai.","s":["I: moving body ka path length > 0, isliye average speed zero nahi ho sakti → FALSE.","II: path ≥ |displacement| → TRUE.","III: 1D me speed velocity ka magnitude hi hai → TRUE.","IV: definitions se TRUE.","True set = II, III, IV → option (D)."],"r":{"2":"Isme galat statement I hai.","0":"Isme bhi I hai — eliminate.","1":"Isme bhi I hai — eliminate."},"t":"Average speed kabhi zero nahi hoti (jab body chali ho), average velocity zero ho sakti hai. Ye distinction yaad rakho.","w":"","fig":null,"sim":null},{"id":15,"q":"Consider the following statements about acceleration:\nI. Acceleration is the rate of change of velocity with respect to time.\nII. A body moving along a straight line with constant speed has zero acceleration.\nIII. A body moving with increasing speed always has positive acceleration.\nIV. A body can have zero velocity and non-zero acceleration at the same instant.\nThe correct statements are:","opt":["I, II and III only","II, III and IV only","I, III and IV only","I, II and IV only"],"ans":3,"c":"Acceleration vector hai: a = dv/dt. Sign ka matlab direction hota hai, 'speed badhna' nahi. Speed badhne ka matlab hai velocity aur acceleration ka same direction hona.","m":"Statement III ko dhyaan se padho — 'increasing speed' aur 'positive acceleration' barabar nahi hote jab motion negative direction me ho.","s":["I: definition → TRUE.","II: straight line + constant speed → velocity bhi constant → a = 0 → TRUE.","III: negative direction me tez hoti body ka acceleration negative hota hai → FALSE.","IV: ball ke highest point par v = 0, a = g ≠ 0 → TRUE.","True set = I, II, IV → option (D)."],"r":{"0":"Isme III hai jo galat hai.","1":"Isme I nahi aur III hai — galat.","2":"Isme III hai — eliminate."},"t":"Speed badh rahi hai to a aur v ka dot product positive hoga, a positive hona zaroori nahi.","w":"","fig":null,"sim":null},{"id":16,"q":"Consider the following statements about the equations of motion:\nI. s = ut + $\\tfrac{1}{2}at^2$ is valid for uniformly accelerated motion along a straight line.\nII. $v^{2}$ = $u^{2}$ + 2as is valid for uniformly accelerated motion along a straight line.\nIII. The three equations of motion can be applied directly to motion with variable acceleration.\nIV. s = ut + $\\tfrac{1}{2}at^2$ gives displacement only when the origin is taken at the position of the body at t = 0.\nThe correct statements are:","opt":["II, III and IV only","I and III only","I, II and III only","I, II and IV only"],"ans":3,"c":"Teen equations of motion sirf uniform acceleration ke liye hain. Inme s ka matlab displacement hai, jo t = 0 wali position se naapa jata hai (isliye origin wahin lena convenient hai).","m":"III sabse aasaan statement hai — variable acceleration me ye equations nahi chalti. Usse wale options turant hata do.","s":["I: uniform acceleration ke liye valid → TRUE.","II: uniform acceleration ke liye valid, time nahi chahiye → TRUE.","III: variable a me integration chahiye → FALSE (ye statement options se III wale hata deta hai).","IV: s displacement hai jo initial position se naapi jati hai, isliye ye statement equation ke saath consistent hai → TRUE (is question me ise true mana gaya hai).","True set = I, II, IV → option (D)."],"r":{"1":"Isme galat statement III hai, aur II bhi chhoot gaya.","2":"Isme III hai — variable acceleration me equations valid nahi.","0":"Isme III hai aur I chhoot gaya — galat."},"t":"Agar option me confusion ho to elimination lagao: jis statement par 100% doubt ho, usse wale saare options hata do.","w":"","fig":null,"sim":null},{"id":17,"q":"Consider the following statements about motion under gravity, neglecting air resistance:\nI. A heavy body and a light body dropped from the same height reach the ground at the same time.\nII. The distance travelled in each successive second of free fall increases.\nIII. At the highest point of its path, a body thrown vertically upward has zero velocity as well as zero acceleration.\nIV. A body thrown vertically upward returns to the point of projection with the same speed with which it was thrown.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and III only","I, II and IV only"],"ans":3,"c":"Free fall me acceleration mass par depend nahi karta (a = g). Distance in nth second = $\\tfrac{1}{2}g$(2n − 1), jo n ke saath badhta hai. Highest point par velocity zero par acceleration g hi rehta hai.","m":"Statement III classical trap hai — 'v = 0 to a = 0' galat sochna. Isse III wale options hata do.","s":["I: a = g mass se independent, isliye same time → TRUE.","II: successive seconds me $5\\ \\mathrm{m}$, $15\\ \\mathrm{m}$, $25\\ \\mathrm{m}$... badhta hai → TRUE.","III: v = 0 par a = g ≠ 0 → FALSE.","IV: energy/symmetry se same speed → TRUE.","True set = I, II, IV → option (D)."],"r":{"2":"Isme III galat statement hai.","0":"Isme III hai aur I chhoot gaya.","1":"Isme III hai — eliminate."},"t":"'Highest point par acceleration zero' — ye sabse common NEET trap hai. Wahan velocity zero hoti hai, acceleration nahi.","w":"","fig":null,"sim":null},{"id":18,"q":"Consider the following statements about graphs of one-dimensional motion:\nI. The position-time graph of a body moving with uniform velocity is a straight line inclined to the time axis.\nII. The position-time graph of a body moving with uniform velocity is a straight line parallel to the time axis.\nIII. The position-time graph of a uniformly accelerated body is a parabola.\nIV. The velocity-time graph of a uniformly accelerated body is a straight line.\nThe correct statements are:","opt":["II, III and IV only","I, II and IV only","I, II and III only","I, III and IV only"],"ans":3,"c":"x = ut + $\\tfrac{1}{2}at^2$ quadratic hai, isliye x–t graph parabola. v = u + at linear hai, isliye v–t graph straight line. Uniform velocity me x–t straight line inclined hoti hai.","m":"Statement I aur II ek dusre ke opposite hain — dono sach nahi ho sakte. Isse options aadhe ho jate hain.","s":["I: uniform velocity → x = ut + $x_{0}$, straight line inclined → TRUE.","II: parallel to time axis ka matlab x constant, yaani body at rest → FALSE.","III: x quadratic in t → parabola → TRUE.","IV: v linear in t → straight line → TRUE.","True set = I, III, IV → option (D)."],"r":{"2":"Isme II galat hai (parallel line rest dikhati hai).","0":"Isme II hai aur I nahi — dono galat.","1":"Isme II hai — eliminate."},"t":"Graph shape yaad rakho: v constant → x–t line; a constant → x–t parabola aur v–t line.","w":"","fig":null,"sim":null},{"id":19,"q":"Consider the following statements about relative velocity in one dimension:\nI. The relative velocity of A with respect to B is given by v(A) − v(B).\nII. Two bodies moving in the same direction with equal speeds have zero relative velocity.\nIII. Two bodies moving in opposite directions with equal speeds have a relative speed equal to the sum of their speeds.\nIV. If two cars move in the same direction with speeds $10\\ \\mathrm{m\\,s^{-1}}$ and $6\\ \\mathrm{m\\,s^{-1}}$, the relative velocity of the first with respect to the second is $16\\ \\mathrm{m\\,s^{-1}}$.\nThe correct statements are:","opt":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"ans":0,"c":"1D relative velocity: v(A/B) = v(A) − v(B). Same direction me subtraction, opposite direction me subtraction se hi addition ban jata hai (kyunki signs ulte hain).","m":"IV me numbers daal kar check karo: 10 − 6 = 4, 16 nahi. Isse IV wale options turant out.","s":["I: definition → TRUE.","II: v − v = 0 → TRUE.","III: v − (−v) = 2v → TRUE.","IV: 10 − 6 = $4\\ \\mathrm{m\\,s^{-1}}$, 16 nahi → FALSE.","True set = I, II, III → option (A)."],"r":{"1":"Isme IV galat hai (16 nahi, 4 aayega).","2":"Isme IV hai aur I chhoot gaya.","3":"Isme IV hai — eliminate."},"t":"Sign convention fix karo pehle (right = +), phir relative velocity me seedha subtraction karo — addition ki alag formula yaad karne ki zaroorat nahi.","w":"","fig":null,"sim":null},{"id":20,"q":"Consider the following statements about motion with uniform acceleration:\nI. The distance travelled in the nth second by a body starting from rest with acceleration a is a(n − $\\tfrac{1}{2}$).\nII. A body starting from rest with uniform acceleration travels distances in successive seconds in the ratio 1 : 3 : 5 : 7.\nIII. The distance travelled in the nth second is given by u + a(2n − 1).\nIV. The distance travelled in the nth second is numerically equal to the average velocity during that one second.\nThe correct statements are:","opt":["I, III and IV only","II, III and IV only","I, II and III only","I, II and IV only"],"ans":3,"c":"nth second ka distance: S(n) = u + a(2n − 1)/2. U par se start ho to S(n) = a(2n − 1)/2 = a(n − $\\tfrac{1}{2}$). Ye 1 second ka average velocity hi hai.","m":"III me '/2' missing hai — dimensional check bhi pakad lega: a(2n − 1) ka unit velocity ka hai, distance ka nahi.","s":["I: u = 0 rakho to S(n) = a(2n − 1)/2 = a(n − $\\tfrac{1}{2}$) → TRUE.","II: n = 1, 2, 3, 4 par ratio 1 : 3 : 5 : 7 → TRUE.","III: sahi formula u + a(2n − 1)/2 hai, '/2' chhoot gaya → FALSE.","IV: 1 second ke liye distance = average velocity × $1\\ \\mathrm{s}$ → TRUE.","True set = I, II, IV → option (D)."],"r":{"0":"Isme III galat hai (2 se divide karna bhoola gaya).","1":"Isme III hai aur I nahi.","2":"Isme III hai — eliminate."},"t":"S(n) ka formula hamesha '/2' ke saath likho: $S_n = u + \\dfrac{a(2n-1)}{2}$. Isse 80% galtiyan ruk jati hain.","w":"","fig":null,"sim":null},{"id":21,"q":"Consider the following statements about frames of reference:\nI. A frame of reference in which Newton's first law of motion holds good is called an inertial frame.\nII. A frame of reference moving with constant velocity with respect to an inertial frame is a non-inertial frame.\nIII. For most terrestrial experiments, the Earth is treated as an approximately inertial frame.\nIV. A frame of reference is needed to specify the position and motion of an object.\nThe correct statements are:","opt":["II, III and IV only","I, II and IV only","I, II and III only","I, III and IV only"],"ans":3,"c":"Inertial frame = jahan Newton ka first law bina pseudo force ke chalta hai (rest ya constant velocity). Acceleration wala frame non-inertial hota hai.","m":"Statement II lagbhag definition ka ulta hai — constant velocity wala frame bhi inertial hota hai. Isse II wale options hata do.","s":["I: definition → TRUE.","II: constant velocity w.r.t. inertial frame bhi inertial hota hai → FALSE.","III: Earth ka acceleration chhoti duration ke liye negligible → TRUE.","IV: position/motion batane ke liye observer frame chahiye → TRUE.","True set = I, III, IV → option (D)."],"r":{"2":"Isme galat statement II hai.","0":"Isme II hai aur I chhoot gaya.","1":"Isme II hai — eliminate."},"t":"Inertial frame ki pehchaan: usme bina force ke body rest ya uniform motion me rahe. Acceleration dikhe to frame non-inertial.","w":"","fig":null,"sim":null},{"id":22,"q":"Consider the following statements for a ball thrown vertically upward, neglecting air resistance:\nI. After the ball leaves the hand, its acceleration during the upward motion is directed downward.\nII. The time of ascent is equal to the time of descent.\nIII. At the highest point, the velocity is zero while the acceleration is g directed downward.\nIV. The maximum height reached is directly proportional to the initial speed.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":3,"c":"Hand chhodne ke baad sirf gravity kaam karti hai: a = g downward, hamesha. Highest point par v = 0 par a = g. Max height H = $u^{2}$/$2\\ \\mathrm{g}$, yaani $u^{2}$ ke proportional.","m":"IV me 'directly proportional' shabd par ruk jao — H ∝ $u^{2}$ hai, u nahi.","s":["I: gravity downward hai, chahe ball upar ja rahi ho → TRUE.","II: same g, same distance se symmetry → TRUE.","III: v = 0, a = g → TRUE.","IV: H = $u^{2}$/$2\\ \\mathrm{g}$ → $u^{2}$ ke proportional, u ke nahi → FALSE.","True set = I, II, III → option (D)."],"r":{"0":"Isme IV galat hai (square ka rishta hai).","1":"Isme IV hai aur I chhoot gaya.","2":"Isme IV hai — eliminate."},"t":"H ∝ $u^{2}$, T ∝ u — yani speed double karo to height 4 guna, time 2 guna.","w":"","fig":null,"sim":null},{"id":23,"q":"Which of the following statements is NOT correct?","opt":["Distance is the total length of the actual path travelled by a body.","Displacement is the shortest straight-line separation between the initial and final positions.","Displacement has both magnitude and direction.","The magnitude of displacement is always greater than the distance travelled."],"ans":3,"c":"Distance path length hai, displacement shortest straight line hai. Isliye displacement ka magnitude kabhi distance se bada nahi ho sakta — barabar ya chhota hota hai.","m":"'Always greater' jaise absolute words dhundo. Yahan relation ulta hai, isliye wahi NOT correct statement hai.","s":["A: distance ki definition → correct.","B: displacement ki definition → correct.","C: displacement vector hai → correct.","D: |displacement| ≤ distance hota hai, 'greater' nahi → NOT correct.","Isliye answer option (D)."],"r":{"0":"Ye bilkul sahi definition hai, isliye NOT-correct nahi ho sakta.","1":"Ye bhi sahi definition hai.","2":"Displacement vector hai — ye sahi statement hai."},"t":"|displacement| ≤ distance — ye inequality hamesha yaad rakho, yehi aadhe trap questions ka base hai.","w":"","fig":null,"sim":null},{"id":24,"q":"Which of the following statements is correct?","opt":["Average velocity is the total path length divided by the total time taken.","Average velocity is the net displacement divided by the total time taken.","Average velocity is always a positive quantity.","The magnitude of average velocity can never be less than the average speed."],"ans":1,"c":"Average velocity = net displacement / total time. Average speed = total path / total time. Displacement vector hai, isliye average velocity negative bhi ho sakti hai.","m":"Definition-based question: pehle average velocity ka formula likho, phir ek-ek option ko usse match karo.","s":["Average velocity = $\\Delta x/\\Delta t$ (displacement/time).","A isme path length use kar raha hai → ye average speed hai.","C galat: negative direction me average velocity negative hoti hai.","D galat: |v_avg| ≤ average speed hota hai.","Isliye option (B)."],"r":{"0":"Path length/time average speed deta hai, velocity nahi.","2":"Average velocity ka sign direction batata hai, isliye negative ho sakti hai.","3":"Inequality ulti hai: |average velocity| ≤ average speed."},"t":"Do formulas alag-alag likh kar yaad karo: v_avg = $\\Delta x/\\Delta t$ aur speed_avg = path/$\\Delta t$.","w":"","fig":null,"sim":null},{"id":25,"q":"Which of the following statements is NOT correct for a body moving with uniform acceleration?","opt":["Its velocity changes by equal amounts in equal intervals of time.","Its acceleration-time graph is a straight line parallel to the time axis.","Its velocity-time graph is a straight line.","Its speed must increase continuously with time."],"ans":3,"c":"Uniform acceleration ka matlab a constant hai. Velocity barabar samay me barabar badalti hai, par speed ghat bhi sakti hai (retardation) aur direction bhi badal sakti hai.","m":"NOT-correct dhundo: jo statement har situation me sach nahi hai, wahi answer hai. 'Must' word trap hai.","s":["A: a constant → $\\Delta v$ barabar intervals me barabar → correct.","B: a constant → a–t graph time axis ke parallel line → correct.","C: v = u + at linear → correct.","D: retardation me speed ghatti hai, isliye 'must increase' galat → NOT correct.","Isliye answer option (D)."],"r":{"0":"Ye uniform acceleration ki hi definition hai.","1":"Constant a ka graph horizontal line hota hai — sahi statement.","2":"v–t graph straight line — sahi statement."},"t":"Uniform acceleration ≠ speed badhna. Retardation bhi uniform acceleration hi hai (negative sign ke saath).","w":"","fig":null,"sim":null},{"id":26,"q":"Which of the following relations is NOT valid for uniformly accelerated motion along a straight line? (Symbols have their usual meanings.)","opt":["v = u + at","s = ut + $\\tfrac{1}{2}at^2$","$v^{2}$ = $u^{2}$ + 2as","s = (u + v)t"],"ans":3,"c":"Teen standard equations: v = u + at, s = ut + $\\tfrac{1}{2}at^2$, $v^{2}$ = $u^{2}$ + 2as. Average velocity (u + v)/2 hai, isliye s = (u + v)t/2 hota hai — '/2' zaroori hai.","m":"Chauthi option ko dimension se check karo: (u + v)t ka unit velocity × time = displacement, par size double aayega.","s":["Standard equations I, II, III correct hain.","IV me s = average velocity × t = [(u + v)/2]·t hona chahiye.","IV me '/2' missing hai, isliye NOT valid → option (D)."],"r":{"0":"v = u + at standard equation hai.","1":"s = ut + $\\tfrac{1}{2}at^2$ standard equation hai.","2":"$v^{2}$ = $u^{2}$ + 2as standard equation hai."},"t":"Agar bhool jao to v = u + at aur average velocity (u + v)/2 se s = (u + v)t/2 khud derive kar lo.","w":"","fig":null,"sim":null},{"id":27,"q":"Which of the following statements about a position-time graph is correct?","opt":["A straight line parallel to the time axis represents uniform motion of the body.","A straight line inclined to the time axis represents a body moving with constant velocity.","The slope of the tangent to the graph gives the acceleration of the body.","The area under the graph between two instants gives the displacement of the body."],"ans":1,"c":"x–t graph ka slope velocity deta hai. Parallel line ka slope 0 → body rest. Inclined line ka slope constant → velocity constant.","m":"Har option me graph ka slope/area kya deta hai, wahi check karo.","s":["A: parallel to time axis → slope 0 → rest, uniform motion nahi → galat.","B: constant slope → constant velocity → correct.","C: x–t ka slope velocity deta hai, acceleration nahi → galat.","D: area under x–t ka koi physical meaning nahi → galat.","Isliye option (B)."],"r":{"0":"Parallel line rest dikhati hai; uniform motion ke liye inclined line chahiye.","2":"Slope velocity deta hai; acceleration v–t ke slope se milta hai.","3":"x–t graph ke area se displacement nahi nikalta."},"t":"Graph questions me slope/area ka meaning table ki tarah yaad rakho — 90% questions isi se ban jaate hain.","w":"","fig":null,"sim":null},{"id":28,"q":"Which of the following statements is NOT correct?","opt":["The area under a velocity-time graph gives displacement.","The slope of a velocity-time graph gives acceleration.","The area under a position-time graph gives velocity.","The slope of a position-time graph gives velocity."],"ans":2,"c":"Sahi jodi: x–t ka slope → velocity; v–t ka slope → acceleration; v–t ka area → displacement; a–t ka area → change in velocity. x–t ka area ka koi meaning nahi.","m":"Do statements (B aur D) sahi hain, (A) bhi sahi — jo bacha wo check karo.","s":["A: v–t area = displacement → correct.","B: v–t slope = acceleration → correct.","C: x–t ka area ka koi physical quantity nahi → NOT correct.","D: x–t slope = velocity → correct.","Isliye answer option (C)."],"r":{"0":"Ye sahi statement hai, isliye NOT-correct nahi.","1":"Ye bhi sahi hai (dv/dt = a).","3":"Ye bhi sahi hai (dx/dt = v)."},"t":"Position-time graph ka area bekaar hai — NEET me ye trap regularly aata hai.","w":"","fig":null,"sim":null},{"id":29,"q":"Which of the following statements about a body thrown vertically upward, with air resistance neglected, is NOT correct?","opt":["Its acceleration remains equal to g throughout the motion.","Its velocity becomes zero at the highest point.","Its acceleration becomes zero at the highest point.","Its total time of flight is 2u/g."],"ans":2,"c":"Throw ke baad sirf gravity: a = g hamesha. Highest point par velocity zero hoti hai, acceleration nahi.","m":"Statement (C) wahi classic trap hai jo statement-based questions me bhi aata hai — highest point par a = 0 galat.","s":["A: a = g throughout → correct.","B: highest point par v = 0 → correct.","C: highest point par a = g ≠ 0 → NOT correct.","D: T = 2u/g → correct.","Isliye answer option (C)."],"r":{"0":"Gravity har instant kaam karti hai, isliye ye sahi hai.","1":"Highest point par velocity zero hona sahi hai.","3":"T = 2u/g standard result hai."},"t":"Highest point par sirf velocity zero hoti hai. Acceleration zero hone ka matlab hota hai velocity constant — wo yahan nahi hai.","w":"","fig":null,"sim":null},{"id":30,"q":"Which of the following statements about relative velocity in one dimension is correct?","opt":["The relative velocity of A with respect to B is always v(A) + v(B).","The relative velocity of A with respect to B is v(A) − v(B).","Relative velocity is a scalar quantity.","The relative velocity of two bodies moving with equal speeds in the same direction is 2v."],"ans":1,"c":"Relative velocity ka matlab: B ke frame se A ki velocity. Isliye v(A/B) = v(A) − v(B). Ye vector hai, sign ke saath.","m":"Definition se hi answer nikal jata hai; baaki options usi definition ke galat versions hain.","s":["v(A/B) = v(A) − v(B) — ye standard definition hai.","Same direction me equal speed → v − v = 0, 2v nahi.","Relative velocity vector hai (direction change hone par sign badalta hai).","Isliye option (B)."],"r":{"0":"Addition tab aata hai jab opposite directions ho aur signs ulte hon; general formula subtraction hai.","2":"Relative velocity vector hai, direction ke saath.","3":"Equal speeds same direction → relative velocity zero hoti hai."},"t":"Sign convention likh kar hi relative velocity solve karo — 1D me 90% galti sign ki hoti hai.","w":"","fig":null,"sim":null},{"id":31,"q":"Which of the following statements about reaction time and stopping distance is NOT correct?","opt":["The total stopping distance includes the distance travelled during the driver's reaction time.","During the reaction time, the vehicle is taken to move with constant speed equal to the speed at which the driver first saw the obstacle.","The distance travelled during the reaction time is proportional to the square of the speed of the vehicle.","For a given constant retardation, the stopping distance increases as the speed of the vehicle increases."],"ans":2,"c":"Reaction time me driver brake nahi lagata, gaadi usi speed se chalti rehti hai. Isliye reaction distance = v × t(r), jo v ke proportional hai ($v^{2}$ ke nahi).","m":"Do parts alag karo: reaction distance ∝ v, braking distance ∝ $v^{2}$. Statement (C) inhe mix kar raha hai.","s":["Reaction distance = v·t(r) → v ke proportional.","Braking distance = $v^{2}$/2a → $v^{2}$ ke proportional.","Total stopping distance = v·t(r) + $v^{2}$/2a.","C me reaction distance ko $v^{2}$ ke proportional kaha gaya → NOT correct → option (C)."],"r":{"0":"Total stopping distance me reaction distance shamil hota hai — sahi statement.","1":"Reaction time me speed constant maani jati hai — sahi.","3":"Braking distance $v^{2}$ ke saath badhta hai, isliye total bhi badhta hai — sahi."},"t":"Stopping distance ke do hisse yaad rakho: v·t(r) + $v^{2}$/2a.","w":"","fig":null,"sim":null},{"id":32,"q":"Which of the following statements about variable acceleration is correct?","opt":["When a = dv/dt, the velocity can be obtained by integrating the acceleration with respect to time.","Acceleration is obtained by integrating velocity with respect to time.","Velocity is the slope of the acceleration-time graph.","The equations of uniformly accelerated motion can be used directly even when the acceleration varies with time."],"ans":0,"c":"Calculus ki basic chain: a = dv/dt → v = ∫a dt + C; v = dx/dt → x = ∫v dt + C. Differentiation neeche ki taraf, integration upar ki taraf.","m":"Har option ko 'differentiate ya integrate' ke rule se check karo. Sirf (A) sahi direction dikha raha hai.","s":["A: a = dv/dt → v = ∫a dt → correct.","B: velocity integrate karke displacement milta hai, acceleration nahi → galat.","C: v–t ka slope acceleration hota hai; a–t ka slope jerk → galat.","D: variable a me standard equations invalid hain → galat.","Isliye option (A)."],"r":{"1":"Integration velocity ko displacement me badalta hai, acceleration me nahi.","2":"a–t graph ka slope jerk deta hai (da/dt).","3":"Variable acceleration me ∫ karna padta hai — seedhe equations nahi."},"t":"Chain yaad rakho: x →(differentiate) v →(differentiate) a. Integration ulta direction me.","w":"","fig":null,"sim":null},{"id":33,"q":"Match the quantities in Column I with their descriptions in Column II:\nColumn I: (a) Distance (b) Displacement (c) Speed (d) Velocity\nColumn II: (i) Scalar quantity that is always positive or zero (ii) Vector quantity that may be positive, negative or zero (iii) Total length of the actual path travelled (iv) Shortest straight-line separation between initial and final positions","opt":["a-iii, b-i, c-iv, d-ii","a-iv, b-iii, c-i, d-ii","a-i, b-ii, c-iii, d-iv","a-iii, b-iv, c-i, d-ii"],"ans":3,"c":"Chaar quantities ke sirf do gun hain: scalar/vector aur path/shortest line. Distance aur speed scalar hain; displacement aur velocity vector.","m":"Sabse aasaan jodi pehle fix karo: distance = path length (iii). Usse sirf ek option bachta hai.","s":["(a) Distance = total path length → iii.","(b) Displacement = shortest straight line, sign ke saath → iv.","(c) Speed = scalar, always ≥ 0 → i.","(d) Velocity = vector, negative bhi → ii.","Isliye a-iii, b-iv, c-i, d-ii → option (D)."],"r":{"2":"Distance ko 'always positive scalar' kaha gaya hai, jo speed ki description hai.","0":"Displacement ko scalar bana diya — galat.","1":"Distance ko shortest line likh diya — definition hi ulti ho gayi."},"t":"Match the columns me pehle 100% certain jodi lock karo, phir options eliminate karo.","w":"","fig":null,"sim":null},{"id":34,"q":"Match the equations in Column I with the quantities they relate in Column II:\nColumn I: (a) v = u + at (b) s = ut + $\\tfrac{1}{2}at^2$ (c) $v^{2}$ = $u^{2}$ + 2as (d) S(n) = u + a(2n − 1)/2\nColumn II: (i) Velocity and displacement (ii) Distance travelled in the nth second (iii) Velocity and time (iv) Displacement and time","opt":["a-iv, b-iii, c-ii, d-i","a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-iii, b-iv, c-i, d-ii"],"ans":3,"c":"Har equation me kaun si variable nahi hai, wahi clue hai. $v^{2}$ = $u^{2}$ + 2as me t nahi hai, isliye wo velocity–displacement ka rishta hai.","m":"Equation me jo variable absent hai usse jodi tay karo: (a) me s nahi → v–t; (c) me t nahi → v–s.","s":["(a) v = u + at me s nahi → velocity aur time → iii.","(b) s = ut + $\\tfrac{1}{2}at^2$ me v nahi → displacement aur time → iv.","(c) $v^{2}$ = $u^{2}$ + 2as me t nahi → velocity aur displacement → i.","(d) S(n) nth second ka distance → ii.","Isliye a-iii, b-iv, c-i, d-ii → option (D)."],"r":{"0":"(a) ko displacement–time likha gaya, jabki usme s hi nahi hai.","1":"(a) ko velocity–displacement kaha gaya — galat.","2":"(a) ko nth second ka formula bana diya — galat."},"t":"Trick: jo variable equation me nahi hai, wahi batata hai ki equation kis jodi ke beech ka rishta hai.","w":"","fig":null,"sim":null},{"id":35,"q":"Match the physical quantities in Column I with their SI units in Column II:\nColumn I: (a) Speed (b) Acceleration (c) Displacement (d) Time\nColumn II: (i) $\\mathrm{m\\,s^{-2}}$ (ii) $\\mathrm{m\\,s^{-1}}$ (iii) s (iv) m","opt":["a-i, b-ii, c-iii, d-iv","a-ii, b-iv, c-i, d-iii","a-iv, b-i, c-ii, d-iii","a-ii, b-i, c-iv, d-iii"],"ans":3,"c":"Units dimension se aate hain: speed = length/time, acceleration = length/$(\\text{time})^{2}$, displacement = length, time = second.","m":"Dimension formula likho aur match karo — ratne ki zaroorat nahi.","s":["(a) Speed → $\\mathrm{m\\,s^{-1}}$ → ii.","(b) Acceleration → $\\mathrm{m\\,s^{-2}}$ → i.","(c) Displacement → $\\mathrm{m}$ → iv.","(d) Time → $\\mathrm{s}$ → iii.","Isliye a-ii, b-i, c-iv, d-iii → option (D)."],"r":{"0":"Speed ko $\\mathrm{m\\,s^{-2}}$ diya gaya — ye acceleration ka unit hai.","1":"Acceleration ko m diya gaya, jo displacement ka unit hai.","2":"Speed ko m diya gaya — galat."},"t":"Unit match karne me kabhi jaldi mat karo: pehle dimensions likho, phir jodo.","w":"","fig":null,"sim":null},{"id":36,"q":"Match the features of graphs in Column I with the physical quantities they give in Column II:\nColumn I: (a) Slope of a position-time graph (b) Slope of a velocity-time graph (c) Area under a velocity-time graph (d) Area under an acceleration-time graph\nColumn II: (i) Displacement (ii) Change in velocity (iii) Velocity (iv) Acceleration","opt":["a-iv, b-iii, c-ii, d-i","a-iii, b-i, c-iv, d-ii","a-ii, b-iv, c-i, d-iii","a-iii, b-iv, c-i, d-ii"],"ans":3,"c":"Slope = differentiation, area = integration. x–t slope v, v–t slope a, v–t area s, a–t area $\\Delta v$.","m":"Do slopes aur do areas ko alag-alag list karo, phir match karo.","s":["(a) x–t slope → velocity → iii.","(b) v–t slope → acceleration → iv.","(c) v–t area → displacement → i.","(d) a–t area → change in velocity → ii.","Isliye a-iii, b-iv, c-i, d-ii → option (D)."],"r":{"0":"Slope ko integration samajh liya — slope differentiation hai.","1":"v–t area ko acceleration likha — area displacement deta hai.","2":"x–t slope ko change in velocity likha — galat."},"t":"Ek line me yaad rakho: slope = differentiate, area = integrate.","w":"","fig":null,"sim":null},{"id":37,"q":"Match the motions in Column I with the net displacements in Column II:\nColumn I: (a) A body moves $4\\ \\mathrm{m}$ east and then $3\\ \\mathrm{m}$ west (b) A body moves $4\\ \\mathrm{m}$ east and then $3\\ \\mathrm{m}$ north (c) A body moves $5\\ \\mathrm{m}$ east and then $5\\ \\mathrm{m}$ west (d) A body moves $6\\ \\mathrm{m}$ east and then $2\\ \\mathrm{m}$ east\nColumn II: (i) Zero (ii) $1\\ \\mathrm{m}$ east (iii) $5\\ \\mathrm{m}$ (iv) $8\\ \\mathrm{m}$ east","opt":["a-i, b-iii, c-ii, d-iv","a-iii, b-ii, c-i, d-iv","a-ii, b-i, c-iii, d-iv","a-ii, b-iii, c-i, d-iv"],"ans":3,"c":"Same line par displacement simply subtract/add hota hai (sign ke saath); perpendicular ho to Pythagoras lagta hai.","m":"Pehle tay karo kaun sa case 1D hai aur kaun sa 2D. (b) hi perpendicular case hai.","s":["(a) 4 east − 3 west = $1\\ \\mathrm{m}$ east → ii.","(b) perpendicular: $\\sqrt{4^2+3^2}$ = $5\\ \\mathrm{m}$ → iii.","(c) 5 − 5 = 0 → i.","(d) 6 + 2 = $8\\ \\mathrm{m}$ east → iv.","Isliye a-ii, b-iii, c-i, d-iv → option (D)."],"r":{"0":"(a) ka displacement zero likh diya, jabki $1\\ \\mathrm{m}$ east bachta hai.","1":"(a) ko $5\\ \\mathrm{m}$ kaha — ye (b) ka answer hai.","2":"(b) ko zero kaha, jabki perpendicular motion ka displacement $5\\ \\mathrm{m}$ hai."},"t":"Displacement jodte waqt direction ka dhyaan rakho — opposite direction me minus, perpendicular me Pythagoras.","w":"","fig":null,"sim":null},{"id":38,"q":"Match the situations in Column I with the correct numerical values in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglect air resistance.\nColumn I: (a) Distance fallen in the first second by a body released from rest (b) Total time of flight of a body thrown vertically upward with u = $20\\ \\mathrm{m\\,s^{-1}}$ (c) Maximum height reached by a body thrown vertically upward with u = $20\\ \\mathrm{m\\,s^{-1}}$ (d) Distance travelled in $2\\ \\mathrm{s}$ by a body starting from rest with a = $5\\ \\mathrm{m\\,s^{-2}}$\nColumn II: (i) $4\\ \\mathrm{s}$ (ii) $20\\ \\mathrm{m}$ (iii) $5\\ \\mathrm{m}$ (iv) $10\\ \\mathrm{m}$","opt":["a-i, b-ii, c-iii, d-iv","a-iv, b-iii, c-i, d-ii","a-ii, b-iv, c-iii, d-i","a-iii, b-i, c-ii, d-iv"],"ans":3,"c":"Teeno formulas ek hi family ke hain: s = ut + $\\tfrac{1}{2}at^2$, H = $u^{2}$/$2\\ \\mathrm{g}$, T = 2u/g. Bas har case me sahi formula chunna hai.","m":"Chhote numeric questions me formula + plug-in se answer nikalta hai; ek-ek karke solve karo.","s":["(a) $s=\\tfrac12gt^2=\\tfrac12(10)(1)^2=5$ m → iii.","(b) $T=2u/g=2(20)/10=4$ s → i.","(c) $H=u^2/2g=400/20=20$ m → ii.","(d) $s=\\tfrac12(5)(2)^2=10$ m → iv.","Isliye a-iii, b-i, c-ii, d-iv → option (D)."],"r":{"0":"(a) ko $4\\ \\mathrm{s}$ kaha — wo time of flight hai, distance nahi.","1":"(a) ko $10\\ \\mathrm{m}$ kaha, jabki pehle second me sirf $5\\ \\mathrm{m}$ girta hai.","2":"(a) ko $20\\ \\mathrm{m}$ kaha — ye maximum height hai."},"t":"Pehle second me free fall distance hamesha $5\\ \\mathrm{m}$ hota hai (g = 10). Ye yaad rakhne layak shortcut hai.","w":"","fig":null,"sim":null},{"id":39,"q":"Assertion: The magnitude of the displacement of a moving body can never be greater than the distance travelled by it.\nReason: Displacement is the shortest distance between the initial and final positions, whereas distance is the actual length of the path covered.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Displacement shortest line hai, distance actual path hai. Straight line sabse chhota rasta hota hai, isliye |displacement| ≤ distance.","m":"A–R me teen cheezein check karo: A sach?, R sach?, R se A explain hota hai?","s":["A sach hai: shortest line kabhi path se bada nahi hota.","R sach hai: displacement = shortest, distance = actual path.","R hi A ka kaaran hai, isliye answer option (A).","Final: option (A)."],"r":{"1":"Reason bilkul assertion ka explanation hai, isliye 'not explanation' galat.","2":"Reason sach hai, isliye 'Reason is false' galat.","3":"Assertion bhi sach hai, isliye ye bhi galat."},"t":"A–R me pehle A check karo. Agar A false hai to answer D hi hota hai (jab R true ho) — 2 second me answer.","w":"","fig":null,"sim":null},{"id":40,"q":"Assertion: A body can have zero velocity and yet be accelerating at that instant.\nReason: Acceleration is the rate of change of velocity, and velocity can pass through the value zero while still changing with time.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Velocity zero hona aur acceleration zero hona do alag baatein hain. Ball ko upar phenko: highest point par v = 0, par a = g.","m":"Assertion ko ek example se verify karo. Example mil gaya to A true hai.","s":["Example: ball ka highest point → v = 0, a = g ≠ 0 → A true.","R true: acceleration velocity ke change ka rate hai, velocity ka value zero ho sakta hai par change nahi rukta.","R se A explain hota hai → option (A).","Final: option (A)."],"r":{"1":"Reason hi assertion ka mechanism bata raha hai, isliye 'not explanation' galat.","2":"Reason sach hai, isliye C galat.","3":"Assertion sach hai, isliye D galat."},"t":"Do statements ko kabhi mix mat karo: 'v = 0' aur 'a = 0' bilkul alag conditions hain.","w":"","fig":null,"sim":null},{"id":41,"q":"Assertion: The average velocity of a body that returns to its starting point after moving along any closed path is zero.\nReason: For a closed path the net displacement is zero, and average velocity is net displacement divided by total time.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Closed path me initial aur final point same hote hain, isliye displacement zero. Average velocity = displacement/time = 0.","m":"Definition se seedha verify: displacement zero, time finite → average velocity zero.","s":["Closed path → displacement 0 → A true.","R bhi wahi definition de raha hai → true.","R, A ka explanation hai → option (A).","Final: option (A)."],"r":{"1":"Reason assertion ko hi explain kar raha hai.","2":"Reason sach hai (definition hi hai).","3":"Assertion sach hai."},"t":"Average velocity zero ho to bhi average speed non-zero hoti hai — dono alag quantities hain.","w":"","fig":null,"sim":null},{"id":42,"q":"Assertion: In the absence of air resistance, a heavier body dropped from a height reaches the ground earlier than a lighter body dropped from the same height.\nReason: The acceleration due to gravity is independent of the mass of the falling body.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":3,"c":"Free fall me a = g, jo mass par depend nahi karta. Isliye same height se dono bodies same time me girti hain (air resistance na ho to).","m":"Assertion galat hai kyunki heavier body jaldi nahi girti. Reason true hai kyunki g mass se independent hai.","s":["A false: dono same time me girti hain.","R true: a = g mass se independent.","False assertion + true reason → option (D).","Final: option (D)."],"r":{"0":"Assertion galat hai, isliye A, B dono galat.","1":"Assertion galat hai, isliye ye bhi galat.","2":"Reason sach hai, isliye C galat."},"t":"Agar assertion false mile to answer sirf (D) ho sakta hai (jab reason true ho).","w":"","fig":null,"sim":null},{"id":43,"q":"Assertion: The distance travelled by a body in the nth second of its uniformly accelerated motion depends on the value of n.\nReason: In uniformly accelerated motion the velocity of the body changes continuously with time.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"S(n) = u + a(2n − 1)/2 me n seedha aata hai, isliye har second ka distance alag hota hai. Iski wajah: velocity continuously badalti hai, isliye har second ka average velocity alag hoti hai.","m":"Formula likh kar n ka role dekho; phir reason se connection jodo.","s":["A true: S(n) me n hai, isliye n ke saath value badalti hai.","R true: acceleration ki wajah se velocity continuously change hoti hai.","Iski wajah se hi har second ka distance alag hota hai → R, A ko explain karta hai → option (A).","Final: option (A)."],"r":{"1":"Reason hi assertion ka kaaran hai, isliye 'not explanation' galat.","2":"Reason sach hai.","3":"Assertion bhi sach hai."},"t":"S(n) formula me n aane ka reason hi variable velocity hai — ye link yaad rakho.","w":"","fig":null,"sim":null},{"id":44,"q":"Assertion: A body thrown vertically upward returns to the point of projection with the same speed with which it was projected, if air resistance is neglected.\nReason: At the highest point of its path the velocity of the body becomes zero.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":1,"c":"Same speed se wapas aana gravity ki symmetry (constant a = g) ki wajah se hota hai. Highest point par v = 0 hona alag fact hai — wo same speed ka kaaran nahi.","m":"Dono statements sach ho sakte hain, par reason assertion ko explain karta hai ya nahi, ye alag sawaal hai.","s":["A true: air resistance na ho to same speed se wapas.","R true: highest point par velocity zero hoti hai.","Par R se ye nahi nikalta ki wapas same speed aayegi (uske liye constant acceleration aur symmetry chahiye).","Both true, R not explanation → option (B)."],"r":{"0":"Reason sirf highest point ki baat karta hai, same speed ka explanation nahi deta.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"‘Both true but not explanation’ wale options me reason ko dhyan se padho — sirf related lagne se kaam nahi chalta.","w":"","fig":null,"sim":null},{"id":45,"q":"The position-time graph of a body is a straight line starting at x = 0 at t = 0 and ending at x = $20\\ \\mathrm{m}$ at t = $4\\ \\mathrm{s}$; both axes are linear. The velocity of the body is:","opt":["$20\\ \\mathrm{m\\,s^{-1}}$","$80\\ \\mathrm{m\\,s^{-1}}$","$4\\ \\mathrm{m\\,s^{-1}}$","$5\\ \\mathrm{m\\,s^{-1}}$"],"ans":3,"c":"x–t graph straight line ho to velocity constant hoti hai, aur wo us line ka slope hota hai.","m":"Slope = ($x_{2}$ − $x_{1}$)/($t_2$ − $t_1$). Bas do points graph se padh kar daal do.","s":["Points: (0, 0) aur (4, 20).","Slope = (20 − 0)/(4 − 0) = 5.","Isliye v = $5\\ \\mathrm{m\\,s^{-1}}$ → option (D)."],"r":{"2":"4 sirf time ki value hai; velocity slope se aati hai.","0":"20 displacement hai, velocity nahi.","1":"20 × 4 multiply kar diya — slope me divide hota hai."},"t":"Graph-based numericals me pehle axis ke units padho, phir slope ka formula lagao.","w":"","fig":{"t":"g","kind":"xt","pts":[[0,0],[4,20]],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":46,"q":"The velocity-time graph of a body is a straight line parallel to the time axis, drawn at a height of $8\\ \\mathrm{m\\,s^{-1}}$, from t = 0 to t = $5\\ \\mathrm{s}$. The displacement of the body in these $5\\ \\mathrm{s}$ is:","opt":["$80\\ \\mathrm{m}$","$1.6\\ \\mathrm{m}$","$13\\ \\mathrm{m}$","$40\\ \\mathrm{m}$"],"ans":3,"c":"v–t graph me area = displacement. Parallel line ka area rectangle hota hai: height × base.","m":"Rectangle ka area nikalo: (v ka value) × (time interval).","s":["Area = 8 × 5.","= 40.","Isliye displacement $40\\ \\mathrm{m}$ → option (D)."],"r":{"1":"8 ÷ 5 kiya — area me multiply hota hai, divide nahi.","2":"8 + 5 add kar diya, jo bhi galat hai.","0":"8 × 5 nahi 80 nahi hota; 8 × 5 = 40 hota hai."},"t":"Uniform velocity ka matlab hai a = 0, phir bhi displacement ho sakta hai — sirf acceleration zero hai.","w":"","fig":null,"sim":null},{"id":47,"q":"On a velocity-time graph, the velocity rises uniformly from 0 at t = 0 to $20\\ \\mathrm{m\\,s^{-1}}$ at t = $4\\ \\mathrm{s}$ and then falls uniformly to 0 at t = $6\\ \\mathrm{s}$. The total displacement of the body is:","opt":["$80\\ \\mathrm{m}$","$120\\ \\mathrm{m}$","$40\\ \\mathrm{m}$","$60\\ \\mathrm{m}$"],"ans":3,"c":"Do triangles ka area add karo. Pehla: base 4, height 20; dusra: base 2, height 20.","m":"Area = $\\tfrac{1}{2}$ × base × height, dono triangles ke liye alag-alag.","s":["Pehla triangle: $\\tfrac{1}{2}$ × 4 × 20 = $40\\ \\mathrm{m}$.","Dusra triangle: $\\tfrac{1}{2}$ × 2 × 20 = $20\\ \\mathrm{m}$.","Total = $60\\ \\mathrm{m}$ → option (D)."],"r":{"2":"Sirf pehla triangle add kiya — dusra part chhoot gaya.","0":"Rectangle (4 × 20) maan liya, jabki graph triangle hai.","1":"6 × 20 poora rectangle le liya — curve ke bahar ka area bhi gin liya."},"t":"v–t graph ka area hamesha actual shape ka hota hai — triangle, trapezium, rectangle pehchano.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,0],[4,20],[6,0]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":48,"q":"The position of a car moving along a straight road is recorded in the following data table. Which one of the following statements about the motion is correct?","opt":["The car moves with a uniform acceleration of $5\\ \\mathrm{m\\,s^{-2}}$.","The car is at rest throughout the motion.","The car moves with a uniform velocity of $20\\ \\mathrm{m\\,s^{-1}}$.","The car moves with a uniform velocity of $5\\ \\mathrm{m\\,s^{-1}}$."],"ans":3,"c":"Table se har second me position ka change dekho. Change constant = uniform velocity; change badhta/ghatta = acceleration.","m":"$\\Delta x$ nikaalo har $1\\ \\mathrm{s}$ ke liye: agar sab $\\Delta x$ barabar hain to velocity constant.","s":["$\\Delta x$: 5, 5, 5, 5 (har second me).","Har second $5\\ \\mathrm{m}$ → v = $5\\ \\mathrm{m\\,s^{-1}}$ constant.","Acceleration zero hai, isliye option (D)."],"r":{"0":"Position quadratic nahi, linear hai, isliye acceleration zero hai.","1":"Position badal rahi hai, isliye car rest par nahi.","2":"$20\\ \\mathrm{m}$ $4\\ \\mathrm{s}$ ke baad ki position hai, velocity nahi."},"t":"Data table questions me pehle differences nikalo. $\\Delta x$ constant → uniform velocity.","w":"","fig":{"t":"tab","head":["t (s)","x (m)"],"rows":[["0","0"],["1","5"],["2","10"],["3","15"],["4","20"]]},"sim":null},{"id":49,"q":"The acceleration-time graph of a body starting from rest is a straight line parallel to the time axis at a = $3\\ \\mathrm{m\\,s^{-2}}$ from t = 0 to t = $4\\ \\mathrm{s}$, and then lies on the time axis (a = 0) from t = $4\\ \\mathrm{s}$ to t = $6\\ \\mathrm{s}$. The velocity of the body at t = $6\\ \\mathrm{s}$ is:","opt":["$18\\ \\mathrm{m\\,s^{-1}}$","$24\\ \\mathrm{m\\,s^{-1}}$","$6\\ \\mathrm{m\\,s^{-1}}$","$12\\ \\mathrm{m\\,s^{-1}}$"],"ans":3,"c":"a–t graph ka area = change in velocity. Body rest se start hui hai, isliye v(6) = total area.","m":"Area ko do hisson me nikalo: 0–$4\\ \\mathrm{s}$ ka rectangle, 4–$6\\ \\mathrm{s}$ ka area (zero).","s":["0–$4\\ \\mathrm{s}$: area = 3 × 4 = $12\\ \\mathrm{m\\,s^{-1}}$.","4–$6\\ \\mathrm{s}$: a = 0, area = 0.","v(6) = 0 + 12 = $12\\ \\mathrm{m\\,s^{-1}}$ → option (D)."],"r":{"2":"3 × 2 = 6 kiya — $2\\ \\mathrm{s}$ wala part to a = 0 hai.","0":"3 × 6 = 18 maan liya, jabki a sirf $4\\ \\mathrm{s}$ tak hai.","1":"3 × 4 × 2 jaisa extra multiply kiya."},"t":"a = 0 ka matlab velocity constant rehti hai, zero nahi hoti — ye trap hai.","w":"","fig":{"t":"g","kind":"at","pts":[[0,3],[4,3],[4,0],[6,0]],"yl":"a (m s^{-2})","xl":"t (s)"},"sim":null},{"id":50,"q":"The velocity-time graph of a body consists of two horizontal straight lines: from t = 0 to t = $2\\ \\mathrm{s}$ the velocity is +$10\\ \\mathrm{m\\,s^{-1}}$, and from t = $2\\ \\mathrm{s}$ to t = $4\\ \\mathrm{s}$ the velocity is −$10\\ \\mathrm{m\\,s^{-1}}$. For the whole interval from t = 0 to t = $4\\ \\mathrm{s}$, the displacement and the distance travelled by the body are respectively:","opt":["$40\\ \\mathrm{m}$ and $40\\ \\mathrm{m}$","0 and 0","$40\\ \\mathrm{m}$ and 0","0 and $40\\ \\mathrm{m}$"],"ans":3,"c":"Time axis ke upar ka area positive displacement, neeche ka area negative displacement deta hai. Distance me dono ka magnitude add hota hai.","m":"Pehle signs ke saath area jodo (displacement), phir magnitudes ko jodo (distance).","s":["0–$2\\ \\mathrm{s}$: area = +10 × 2 = +$20\\ \\mathrm{m}$.","2–$4\\ \\mathrm{s}$: area = −10 × 2 = −$20\\ \\mathrm{m}$.","Displacement = +20 − 20 = 0; distance = 20 + 20 = $40\\ \\mathrm{m}$.","Isliye option (D)."],"r":{"0":"Displacement me sign ignore kar diya — velocity negative thi.","1":"Distance zero kaise? Body $40\\ \\mathrm{m}$ chali hai, area magnitude me add hota hai.","2":"Dono ulte ho gaye — displacement 0, distance 40."},"t":"Distance = |area| ka sum; displacement = signed area ka sum. Ye difference bahut important hai.","w":"","fig":null,"sim":null},{"id":51,"q":"A car covers the first $100\\ \\mathrm{m}$ of a straight road in $5\\ \\mathrm{s}$ and the next $200\\ \\mathrm{m}$ in the next $10\\ \\mathrm{s}$. The average speed of the car for the whole journey is:","opt":["$25\\ \\mathrm{m\\,s^{-1}}$","$30\\ \\mathrm{m\\,s^{-1}}$","$15\\ \\mathrm{m\\,s^{-1}}$","$20\\ \\mathrm{m\\,s^{-1}}$"],"ans":3,"c":"Average speed = total path length / total time. Isme beech ke speed changes se koi farq nahi padta.","m":"Dono distances jodo, dono times jodo, phir divide karo. Beech me koi average nikalne ki zaroorat nahi.","s":["Total distance $=100+200=300\\ \\mathrm{m}$.","Total time $=5+10=15\\ \\mathrm{s}$.","Average speed $=300/15=20$ $\\mathrm{m\\,s^{-1}}$ → option (D)."],"r":{"2":"Sirf ek hissa (100/5 ya 200/10 ki galti) se aaya number hai; poora path lena hai.","0":"$25\\ \\mathrm{m\\,s^{-1}}$ dono speeds ka simple average (20 aur 20) nahi; 300/15 hi sahi hai.","1":"$30\\ \\mathrm{m\\,s^{-1}}$ kisi bhi hisse ki speed nahi hai, isliye galat."},"t":"Average speed me hamesha 'total' word dhundo — total distance aur total time.","w":"","fig":null,"sim":null},{"id":52,"q":"A particle moves along a straight line, first $10\\ \\mathrm{m}$ towards east, then $6\\ \\mathrm{m}$ towards west and finally $4\\ \\mathrm{m}$ towards east. The distance travelled and the magnitude of displacement are respectively:","opt":["$8\\ \\mathrm{m}$ and $20\\ \\mathrm{m}$","$20\\ \\mathrm{m}$ and $20\\ \\mathrm{m}$","$8\\ \\mathrm{m}$ and $8\\ \\mathrm{m}$","$20\\ \\mathrm{m}$ and $8\\ \\mathrm{m}$"],"ans":3,"c":"Distance me sab path lengths add hote hain (direction ignore). Displacement me east (+) aur west (−) leke algebraic sum hota hai.","m":"Do alag columns banao: distance = sum of magnitudes, displacement = sum with sign.","s":["Distance $=10+6+4=20\\ \\mathrm{m}$.","Displacement $=+10-6+4=+8\\ \\mathrm{m}$, magnitude $8\\ \\mathrm{m}$.","Isliye $20\\ \\mathrm{m}$ aur $8\\ \\mathrm{m}$ → option (D)."],"r":{"0":"Dono values ulte ho gaye — distance 20 hota hai, displacement 8.","1":"Displacement me west ko plus gin liya — sign ka rule bhoolna.","2":"Distance sirf net lagaya, jo displacement hota hai."},"t":"Ek line par distance aur displacement do alag hisaab hain: magic word 'east/west' = sign.","w":"","fig":null,"sim":null},{"id":53,"q":"A body starts from rest and moves with a uniform acceleration of $4\\ \\mathrm{m\\,s^{-2}}$. The distance travelled by it in the first $5\\ \\mathrm{s}$ is:","opt":["$100\\ \\mathrm{m}$","$20\\ \\mathrm{m}$","$40\\ \\mathrm{m}$","$50\\ \\mathrm{m}$"],"ans":3,"c":"Rest se start matlab u = 0. Uniform acceleration me $s=ut+\\tfrac12at^2$ lagta hai.","m":"Formula chuno: u = 0 hai to $s=\\tfrac12at^2$ bachta hai.","s":["$u=0$, $a=4$, $t=5$.","$s=\\tfrac12\\times4\\times5^2=2\\times25$.","$s=50\\ \\mathrm{m}$ → option (D)."],"r":{"1":"$4\\times5=20$ kiya — $\\tfrac{1}{2}$ aur $t^{2}$ dono chhoot gaye.","2":"40 aata hai agar $t^{2}$ ke saath $\\tfrac{1}{2}$ na lagao aur 4×10 le lo — arithmetic galat.","0":"$4\\times5^2=100$ kiya, $\\tfrac{1}{2}$ lagana bhoola."},"t":"Rest se start ho to seedha $s=\\tfrac12at^2$ likho — time bachega.","w":"","fig":null,"sim":null},{"id":54,"q":"A body moving with a velocity of $10\\ \\mathrm{m\\,s^{-1}}$ along a straight line is subjected to a uniform acceleration of $2\\ \\mathrm{m\\,s^{-2}}$ for $5\\ \\mathrm{s}$. Its final velocity is:","opt":["$25\\ \\mathrm{m\\,s^{-1}}$","$10\\ \\mathrm{m\\,s^{-1}}$","$15\\ \\mathrm{m\\,s^{-1}}$","$20\\ \\mathrm{m\\,s^{-1}}$"],"ans":3,"c":"Final velocity ke liye $v=u+at$ kaafi hai; distance ki zaroorat nahi.","m":"Values pehchano: u = 10, a = 2, t = 5. Seedha formula me daalo.","s":["$v=u+at$.","$v=10+2\\times5$.","$v=20$ $\\mathrm{m\\,s^{-1}}$ → option (D)."],"r":{"1":"Initial velocity ko hi answer maan liya — acceleration ka effect chhoot gaya.","2":"25 aata hai agar 3×5 jaisa galat multiply karo — calculation slip.","0":"25 bhi galat arithmetic hai; 2×5 = 10 hota hai."},"t":"u, v, a, t me se teen pata ho to chautha turant nikalta hai — graph ki zaroorat nahi.","w":"","fig":null,"sim":null},{"id":55,"q":"A stone is thrown vertically upward with a speed of $40\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglecting air resistance, the maximum height reached by the stone is:","opt":["$160\\ \\mathrm{m}$","$20\\ \\mathrm{m}$","$40\\ \\mathrm{m}$","$80\\ \\mathrm{m}$"],"ans":3,"c":"Highest point par velocity zero hoti hai. Isliye $v^2=u^2-2gH$ me v = 0 rakho.","m":"Formula $H=u^2/(2g)$ — time nahi chahiye, isliye ye sabse fast method hai.","s":["$H=\\dfrac{u^2}{2g}=\\dfrac{40^2}{2\\times10}$.","$=\\dfrac{1600}{20}$.","$=80\\ \\mathrm{m}$ → option (D)."],"r":{"1":"$20\\ \\mathrm{m}$ aata hai agar 40/2 jaisa galat karo — denominator me g bhi hai.","2":"$40\\ \\mathrm{m}$ sirf speed ki value hai.","0":"160 aata hai agar 2 se divide na karo (1600/10)."},"t":"Highest point par v = 0 — yahi ek line se max height ke saare questions ban jaate hain.","w":"","fig":null,"sim":null},{"id":56,"q":"A stone is dropped from rest from the top of a tower and it falls freely (g = $10\\ \\mathrm{m\\,s^{-2}}$). The time taken by the stone to fall through a distance of $45\\ \\mathrm{m}$ is:","opt":["$4.5\\ \\mathrm{s}$","$9\\ \\mathrm{s}$","$2\\ \\mathrm{s}$","$3\\ \\mathrm{s}$"],"ans":3,"c":"Dropped from rest matlab u = 0 aur free fall me a = g.","m":"$h=\\tfrac12gt^2$ me h aur g daalo, t nikaalo.","s":["$45=\\tfrac12\\times10\\times t^2$.","$45=5t^2\\Rightarrow t^2=9$.","$t=3\\ \\mathrm{s}$ → option (D)."],"r":{"2":"$2\\ \\mathrm{s}$ me sirf $20\\ \\mathrm{m}$ girta hai — chhota time.","0":"$4.5\\ \\mathrm{s}$ me $\\tfrac{1}{2}$×10×4.$5^{2}$ ≈ $101\\ \\mathrm{m}$ gir jata hai, bahut zyada.","1":"$9\\ \\mathrm{s}$ me $405\\ \\mathrm{m}$ gir jata hai — poori tarah galat."},"t":"Free fall me 1, 2, 3, $4\\ \\mathrm{s}$ me $5\\ \\mathrm{m}$, $20\\ \\mathrm{m}$, $45\\ \\mathrm{m}$, $80\\ \\mathrm{m}$ — ye table yaad rakh lo.","w":"","fig":null,"sim":null},{"id":57,"q":"The position of a particle moving along the x-axis is given by x = 2$t^{2}$ + 3t, where x is in metre and t is in second. The velocity of the particle at t = $2\\ \\mathrm{s}$ is:","opt":["$14\\ \\mathrm{m\\,s^{-1}}$","$7\\ \\mathrm{m\\,s^{-1}}$","$8\\ \\mathrm{m\\,s^{-1}}$","$11\\ \\mathrm{m\\,s^{-1}}$"],"ans":3,"c":"Velocity = position ka time derivative: $v=dx/dt$.","m":"x ko differentiate karo, phir t = 2 daalo. Pehle t daalna galat hai.","s":["$x=2t^2+3t$.","$v=\\dfrac{dx}{dt}=4t+3$.","t = 2 par $v=8+3=11$ $\\mathrm{m\\,s^{-1}}$ → option (D)."],"r":{"1":"7 aata hai agar t = 1 daal do.","2":"8 sirf 4t ka hissa hai, +3 chhoot gaya.","0":"14 aata hai agar derivative na lo aur seedha x me 2 daalo (8 + 6 = 14)."},"t":"Differentiate pehle, substitute baad me. Ye order 90% galtiyan bacha deta hai.","w":"","fig":null,"sim":null},{"id":58,"q":"The velocity of a particle moving along a straight line is given by v = 3$t^{2}$ + 2, where v is in $\\mathrm{m\\,s^{-1}}$ and t is in second. The acceleration of the particle at t = $2\\ \\mathrm{s}$ is:","opt":["$14\\ \\mathrm{m\\,s^{-2}}$","$24\\ \\mathrm{m\\,s^{-2}}$","$6\\ \\mathrm{m\\,s^{-2}}$","$12\\ \\mathrm{m\\,s^{-2}}$"],"ans":3,"c":"Acceleration = $dv/dt$, yaani velocity ka derivative.","m":"v ko differentiate karo, t = 2 rakho.","s":["$v=3t^2+2$.","$a=\\dfrac{dv}{dt}=6t$.","t = 2 par $a=12$ $\\mathrm{m\\,s^{-2}}$ → option (D)."],"r":{"2":"$6t$ me t = 1 daal diya.","0":"Differentiate nahi kiya, seedha v me t = 2 daal diya (12 + 2 = 14).","1":"Kuch extra multiply kiya; sahi value 12 hai."},"t":"Position → velocity → acceleration: har step me ek derivative. Direction dhyaan rakho.","w":"","fig":null,"sim":null},{"id":59,"q":"The velocity of a body moving along a straight line changes uniformly from $5\\ \\mathrm{m\\,s^{-1}}$ to $15\\ \\mathrm{m\\,s^{-1}}$ in $4\\ \\mathrm{s}$. The acceleration of the body is:","opt":["$5\\ \\mathrm{m\\,s^{-2}}$","$10\\ \\mathrm{m\\,s^{-2}}$","$1.25\\ \\mathrm{m\\,s^{-2}}$","$2.5\\ \\mathrm{m\\,s^{-2}}$"],"ans":3,"c":"Uniform change matlab acceleration constant, aur $a=(v-u)/t$.","m":"Change in velocity nikalo, time se divide karo.","s":["$a=\\dfrac{v-u}{t}=\\dfrac{15-5}{4}$.","$=\\dfrac{10}{4}$.","$=2.5$ $\\mathrm{m\\,s^{-2}}$ → option (D)."],"r":{"2":"20/16 jaisa galat ratio; sahi 10/4 hai.","0":"Change (10) ko hi answer maan liya.","1":"v + u = 20 le liya, jabki difference lena tha."},"t":"Acceleration = (final − initial)/time. Sign ka dhyaan rakho: ghat rahi ho to n
