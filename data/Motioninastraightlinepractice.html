,"It can be applied to a body moving with acceleration that varies as a = 3t.","It gives the displacement of the body in time t.","It holds for uniformly accelerated motion in one dimension."],"ans":1,"c":"Ye equation constant a ke liye derived hai. Variable acceleration (a = 3t) me integration karna padta hai.","m":"Equation ki derivation ki condition yaad karo: a constant.","s":["C: s displacement deta hai → sahi.","D: uniform acceleration ke liye → sahi.","A: sign convention ke saath vertical me bhi chalta hai → sahi.","B: a variable ho to equation invalid → NOT correct.","Isliye option (B)."],"r":{"2":"Ye sahi hai.","3":"Ye equation uniform acceleration ka hi result hai.","0":"a = −g rakh kar vertical motion me bhi use hota hai."},"t":"Variable acceleration dikhe to turant integral socho, equation nahi.","w":"","fig":null,"sim":null},{"id":128,"q":"A body moves along a straight line such that its velocity-time graph is a curve whose slope increases with time. Which one of the following statements is correct?","opt":["The acceleration of the body decreases with time.","The acceleration of the body is zero.","The acceleration of the body is constant.","The acceleration of the body increases with time."],"ans":3,"c":"v–t graph ka slope acceleration hota hai. Slope badh raha hai → acceleration badh raha hai.","m":"Graph ke slope ko acceleration se replace karo, phir statement padho.","s":["Slope $=a$.","Slope time ke saath badh raha hai.","Isliye a badh raha hai → option (D)."],"r":{"2":"Constant acceleration ke liye v–t straight line hoti hai.","0":"Slope ghat raha hota to acceleration ghatta.","1":"Slope zero nahi hai, wo badh raha hai."},"t":"v–t graph ka slope = acceleration; slope ki slope = jerk.","w":"","fig":null,"sim":null},{"id":129,"q":"A particle moves along the x-axis with its velocity given by v = 6 − 2t (v in $\\mathrm{m\\,s^{-1}}$, t in s). Which one of the following statements about the particle is NOT correct?","opt":["The particle moves in the positive x-direction for t < $3\\ \\mathrm{s}$.","The particle reverses its direction at t = $3\\ \\mathrm{s}$.","The acceleration of the particle is constant in magnitude and equal to $2\\ \\mathrm{m\\,s^{-2}}$ in the negative x-direction.","The particle comes to rest permanently at t = $3\\ \\mathrm{s}$."],"ans":3,"c":"v = 0 sirf ek instant ke liye hota hai; uske baad velocity negative ho jati hai, isliye particle wapas chalti hai — permanently rest nahi.","m":"v ka sign chart banao: t < 3, t = 3, t > 3.","s":["t < 3 → v > 0 → A sahi.","t = 3 par v = 0 aur sign badalta hai → B sahi.","$a=dv/dt=-2$ $\\mathrm{m\\,s^{-2}}$ → C sahi.","t > 3 par v < 0 (peeche chal rahi hai), rest nahi → D NOT correct.","Isliye option (D)."],"r":{"0":"Ye sahi statement hai.","1":"Ye bhi sahi hai — velocity zero ho kar sign badalna reversal hai.","2":"Derivative se a = −2 aata hai, isliye sahi."},"t":"v = 0 ek instant hai; 'rest' hone ka matlab velocity ka zero rehna hai.","w":"","fig":null,"sim":null},{"id":130,"q":"Which one of the following statements about motion under gravity, with air resistance neglected, is correct?","opt":["The acceleration of a body thrown upward is directed upward before it crosses the highest point.","The distance fallen by a body released from rest in successive seconds increases in the ratio 1 : 2 : 3.","A body thrown vertically upward has its velocity decreasing uniformly with time during the ascent.","A body released from rest falls through equal distances in equal intervals of time."],"ans":2,"c":"Throw ke baad a = g downward. Isliye ascent me velocity g ke rate se ghatti hai (uniform decrease).","m":"Aur options me ratios/statements ko free-fall ke standard results se match karo.","s":["A: acceleration hamesha downward → galat.","B: ratio 1 : 3 : 5 hota hai, 1 : 2 : 3 nahi → galat.","C: v = u − gt → uniform decrease → sahi.","D: equal intervals me unequal distances (5, 15, 25) → galat.","Isliye option (C)."],"r":{"0":"Gravity kabhi upward nahi hoti.","1":"Successive seconds me distances 1 : 3 : 5 ratio me hote hain.","3":"Free fall me distances $5\\ \\mathrm{m}$, $15\\ \\mathrm{m}$, $25\\ \\mathrm{m}$… badhte hain."},"t":"Free fall ke ratios: 1 : 3 : 5 (nth second), 1 : 4 : 9 (total n seconds).","w":"","fig":null,"sim":null},{"id":131,"q":"Which one of the following statements about the relative velocity of two bodies in one dimension is NOT correct?","opt":["Relative velocity can be positive, negative or zero depending on the directions and magnitudes of the velocities.","The relative velocity of A with respect to B is the velocity of A measured by an observer moving with B.","The magnitude of the relative velocity of two bodies can be greater than the speed of either body.","The relative velocity of A with respect to B equals the relative velocity of B with respect to A."],"ans":3,"c":"$v_{AB}=v_A-v_B$ aur $v_{BA}=v_B-v_A=-v_{AB}$ — ye ek dusre ka negative hai, barabar nahi.","m":"Definition ke saath sign check karo — symmetric nahi, antisymmetric hai.","s":["A: sign ke saath possible → sahi.","B: definition sahi hai.","C: opposite directions me 2v > v → sahi.","D: antisymmetric hai, isliye NOT correct.","Isliye option (D)."],"r":{"0":"Ye sahi hai.","1":"Ye relative velocity ki sahi definition hai.","2":"Opposite direction me relative speed sum hoti hai, isliye speed se badi ho sakti hai."},"t":"v_AB = −v_BA — ye antisymmetry yaad rakho.","w":"","fig":null,"sim":null},{"id":132,"q":"A body moving with a certain velocity is brought to rest by a constant retardation in distance s. Which one of the following statements is correct?","opt":["If the retardation is doubled, the stopping distance becomes two times.","The stopping distance is independent of the initial velocity.","If the initial velocity is halved, the stopping distance becomes half.","If the initial velocity is halved, the stopping distance becomes one-fourth."],"ans":3,"c":"$s=\\dfrac{u^2}{2a}$ — isliye s ∝ $u^{2}$ aur s ∝ 1/a.","m":"Proportionality likho, phir har option ko usse compare karo.","s":["$s=u^2/(2a)$.","u → u/2 to s → s/4.","a → 2a to s → s/2 → isliye option (D)."],"r":{"2":"s ∝ $u^{2}$, isliye half velocity par quarter distance.","0":"Retardation double → distance half, double nahi.","1":"s seedha u par depend karta hai (square ke through)."},"t":"s ∝ $u^{2}$, s ∝ 1/a — ye do proportionalities hi is chapter ke aadhe numericals chalati hain.","w":"","fig":null,"sim":null},{"id":133,"q":"Match each motion in Column I with the distance in the nth second given in Column II. Take the acceleration as uniform, with the given initial velocity and acceleration.\nColumn I: (a) u = 0, a = $2\\ \\mathrm{m\\,s^{-2}}$, distance in the 2nd second (b) u = 0, a = $2\\ \\mathrm{m\\,s^{-2}}$, distance in the 3rd second (c) u = $5\\ \\mathrm{m\\,s^{-1}}$, a = $2\\ \\mathrm{m\\,s^{-2}}$, distance in the 3rd second (d) u = $10\\ \\mathrm{m\\,s^{-1}}$, a = −$2\\ \\mathrm{m\\,s^{-2}}$, distance in the 5th second\nColumn II: (i) $1\\ \\mathrm{m}$ (ii) $3\\ \\mathrm{m}$ (iii) $5\\ \\mathrm{m}$ (iv) $10\\ \\mathrm{m}$","opt":["a-ii, b-i, c-iii, d-iv","a-ii, b-iii, c-iv, d-i","a-i, b-ii, c-iii, d-iv","a-iii, b-ii, c-iv, d-i"],"ans":1,"c":"Formula ek hi: $S_n=u+\\dfrac{a(2n-1)}{2}$.","m":"Chaar cases me sirf u, a, n badal rahe hain — formula lagao.","s":["(a) $0+\\dfrac{2(3)}{2}=3$ m → ii.","(b) $0+\\dfrac{2(5)}{2}=5$ m → iii.","(c) $5+5=10$ m → iv.","(d) $10+\\dfrac{(-2)(9)}{2}=10-9=1$ m → i.","Isliye a-ii, b-iii, c-iv, d-i → option (B)."],"r":{"2":"(a) me $1\\ \\mathrm{m}$ daal diya, jo (d) ka answer hai.","3":"(a) aur (b) ki values ulat di.","0":"(b) me $1\\ \\mathrm{m}$ likh diya, jo galat hai."},"t":"Negative acceleration ke saath bhi same formula chalta hai — bas sign dhyaan se rakho.","w":"","fig":null,"sim":null},{"id":134,"q":"Match each vertical motion in Column I with its time of flight or time of descent given in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglect air resistance.\nColumn I: (a) A body projected vertically upward with u = $20\\ \\mathrm{m\\,s^{-1}}$, time to return to the ground (b) A body projected vertically upward with u = $50\\ \\mathrm{m\\,s^{-1}}$, time to return to the ground (c) A body released from rest from a height of $45\\ \\mathrm{m}$, time to reach the ground (d) A body released from rest from a height of $125\\ \\mathrm{m}$, time to reach the ground\nColumn II: (i) $3\\ \\mathrm{s}$ (ii) $4\\ \\mathrm{s}$ (iii) $5\\ \\mathrm{s}$ (iv) $10\\ \\mathrm{s}$","opt":["a-ii, b-iii, c-iv, d-i","a-ii, b-iv, c-i, d-iii","a-i, b-ii, c-iii, d-iv","a-iv, b-ii, c-i, d-iii"],"ans":1,"c":"Upar phenki body: $T=2u/g$. Giraftari se girti body: $h=\\tfrac12gt^2$ se t.","m":"Do alag formulas — pehle do cases time of flight, baad ke do free fall.","s":["(a) 2(20)/10 = $4\\ \\mathrm{s}$ → ii.","(b) 2(50)/10 = $10\\ \\mathrm{s}$ → iv.","(c) $45=5t^2\\Rightarrow t=3$ s → i.","(d) $125=5t^2\\Rightarrow t=5$ s → iii.","Isliye a-ii, b-iv, c-i, d-iii → option (B)."],"r":{"2":"(a) me $3\\ \\mathrm{s}$ likh diya, jo (c) ka answer hai.","3":"(a) me $10\\ \\mathrm{s}$ daal diya — 2u/g bhool gaye.","0":"(c) me $5\\ \\mathrm{s}$ likh diya."},"t":"2u/g aur $\\sqrt{2h/g}$ — do formulas alag hain, inhe mix mat karo.","w":"","fig":null,"sim":null},{"id":135,"q":"Match each position-time relation in Column I with the velocity at t = $2\\ \\mathrm{s}$ given in Column II. Here x is in metre and t is in second.\nColumn I: (a) x = 3$t^{2}$ (b) x = 5t + 4 (c) x = 2$t^{3}$ (d) x = 10 − 2$t^{2}$\nColumn II: (i) $5\\ \\mathrm{m\\,s^{-1}}$ (ii) $12\\ \\mathrm{m\\,s^{-1}}$ (iii) $24\\ \\mathrm{m\\,s^{-1}}$ (iv) −$8\\ \\mathrm{m\\,s^{-1}}$","opt":["a-iii, b-iv, c-ii, d-i","a-ii, b-iii, c-i, d-iv","a-ii, b-i, c-iii, d-iv","a-i, b-ii, c-iii, d-iv"],"ans":2,"c":"Har relation ko differentiate karo, phir t = 2 daalo.","m":"Chaar derivatives alag-alag likho — confuse hone ka chance kam ho jayega.","s":["(a) $v=6t\\Rightarrow12$ → ii.","(b) $v=5\\Rightarrow5$ → i.","(c) $v=6t^2\\Rightarrow24$ → iii.","(d) $v=-4t\\Rightarrow-8$ → iv.","Isliye a-ii, b-i, c-iii, d-iv → option (C)."],"r":{"3":"(a) me 5 daal diya, jo (b) ka answer hai.","0":"(a) me 24 daal diya, jo (c) ka answer hai.","1":"(c) me 5 likh diya — derivative galat."},"t":"Read carefully: (b) linear hai to velocity constant 5 rahegi har instant par.","w":"","fig":null,"sim":null},{"id":136,"q":"Match each feature of a graph in Column I with its interpretation in Column II:\nColumn I: (a) Position-time graph concave upward (b) Velocity-time graph with negative slope while the velocity is positive (c) Velocity-time graph lying on the time axis (d) Position-time graph that is a straight line passing through the origin\nColumn II: (i) Body at rest, velocity zero but finite acceleration (ii) Uniformly accelerated motion with positive acceleration, starting from rest (iii) Body moving with uniform velocity (iv) Body slowing down while moving in the positive direction","opt":["a-iv, b-ii, c-iii, d-i","a-iii, b-i, c-iv, d-ii","a-i, b-iii, c-ii, d-iv","a-ii, b-iv, c-i, d-iii"],"ans":3,"c":"x–t concave up = badhti slope = positive acceleration. v–t negative slope + positive v = slow down. v = 0 = body rest.","m":"Har graph ka slope/level interpret karo.","s":["(a) concave up → slope badhta hai → +a → ii.","(b) v > 0, a < 0 → speed ghat rahi → iv.","(c) v = 0 → rest → i.","(d) origin se line → uniform velocity → iii.","Isliye a-ii, b-iv, c-i, d-iii → option (D)."],"r":{"0":"(a) ko slowing down likh diya.","1":"(a) me uniform velocity daal di.","2":"(a) ko rest likh diya — shape ka matlab galat."},"t":"Concave up = slope badh raha; concave down = slope ghat raha.","w":"","fig":null,"sim":null},{"id":137,"q":"Match each quantity in Column I with its SI unit in Column II:\nColumn I: (a) Velocity (b) Acceleration (c) Displacement (d) Rate of change of acceleration\nColumn II: (i) m (ii) $\\mathrm{m\\,s^{-1}}$ (iii) $\\mathrm{m\\,s^{-2}}$ (iv) $\\mathrm{m\\,s^{-3}}$","opt":["a-iv, b-i, c-iii, d-ii","a-ii, b-iii, c-i, d-iv","a-iii, b-ii, c-iv, d-i","a-i, b-iii, c-ii, d-iv"],"ans":1,"c":"Har derivative ke saath ek 'per second' badhta hai: position m → velocity $\\mathrm{m\\,s^{-1}}$ → acceleration $\\mathrm{m\\,s^{-2}}$ → jerk $\\mathrm{m\\,s^{-3}}$.","m":"Chain banao aur ek-ek karke unit likho.","s":["(a) velocity → $\\mathrm{m\\,s^{-1}}$ → ii.","(b) acceleration → $\\mathrm{m\\,s^{-2}}$ → iii.","(c) displacement → m → i.","(d) jerk → $\\mathrm{m\\,s^{-3}}$ → iv.","Isliye a-ii, b-iii, c-i, d-iv → option (B)."],"r":{"2":"(a) me acceleration ka unit daal diya.","3":"(a) me metre likh diya, jo displacement ka unit hai.","0":"(a) me jerk ka unit daal diya."},"t":"Jerk (da/dt) ka unit $\\mathrm{m\\,s^{-3}}$ hota hai — ye NEET me kabhi-kabhi poochha jata hai.","w":"","fig":null,"sim":null},{"id":138,"q":"Match each situation in Column I with the relative speed or time given in Column II:\nColumn I: (a) Two cars moving in the same direction with speeds $25\\ \\mathrm{m\\,s^{-1}}$ and $15\\ \\mathrm{m\\,s^{-1}}$, relative speed (b) Two cars moving in opposite directions with speeds $25\\ \\mathrm{m\\,s^{-1}}$ and $15\\ \\mathrm{m\\,s^{-1}}$, relative speed (c) Two cars moving in the same direction with speeds $30\\ \\mathrm{m\\,s^{-1}}$ and $10\\ \\mathrm{m\\,s^{-1}}$, relative speed (d) A train of length $200\\ \\mathrm{m}$ moving at $20\\ \\mathrm{m\\,s^{-1}}$ crossing a pole\nColumn II: (i) $10\\ \\mathrm{s}$ (ii) $10\\ \\mathrm{m\\,s^{-1}}$ (iii) $20\\ \\mathrm{m\\,s^{-1}}$ (iv) $40\\ \\mathrm{m\\,s^{-1}}$","opt":["a-iii, b-iv, c-ii, d-i","a-i, b-iii, c-iv, d-ii","a-ii, b-iv, c-iii, d-i","a-iv, b-ii, c-i, d-iii"],"ans":2,"c":"Same direction → difference; opposite → sum; pole cross karne ka time = length/speed.","m":"Pehle teen cases me arithmetic, chautha case division.","s":["(a) 25 − 15 = 10 → ii.","(b) 25 + 15 = 40 → iv.","(c) 30 − 10 = 20 → iii.","(d) 200/20 = $10\\ \\mathrm{s}$ → i.","Isliye a-ii, b-iv, c-iii, d-i → option (C)."],"r":{"3":"(a) me sum laga diya.","0":"(a) me 20 daal diya, jo (c) ka answer hai.","1":"(a) me $10\\ \\mathrm{s}$ likh diya, jo time hai, speed nahi."},"t":"Relative speed ke do rules aur pole-crossing ka ek rule — teeno yaad rakho.","w":"","fig":null,"sim":null},{"id":139,"q":"Assertion: A body moving with a constant speed along a straight line has zero acceleration.\nReason: The velocity of a body moving with constant speed along a straight line does not change in magnitude or direction.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"1D straight line me direction fixed hoti hai, isliye constant speed = constant velocity = zero acceleration.","m":"Dono statements same baat keh rahe hain — reason explanation hai.","s":["A true: constant speed straight line → a = 0.","R true: magnitude aur direction dono constant.","R hi A ka kaaran hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"1D me direction fixed hoti hai, isliye constant speed wala case simple ho jata hai.","w":"","fig":null,"sim":null},{"id":140,"q":"Assertion: A body can have zero acceleration and still be moving.\nReason: A body moving with constant velocity has zero acceleration.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"a = 0 ka matlab velocity constant — velocity zero nahi. Isliye body chal sakti hai.","m":"Assertion ka example: uniform motion. Reason wahi example de raha hai.","s":["A true: uniform motion me a = 0, v ≠ 0.","R true: constant velocity → a = 0.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason assertion ka direct reason hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"a = 0 aur v = 0 bilkul alag conditions hain.","w":"","fig":null,"sim":null},{"id":141,"q":"Assertion: The average velocity of a particle over an interval can be zero even though its instantaneous velocity is never zero during that interval.\nReason: Average velocity depends only on the net displacement over the interval and not on the details of the motion in between.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Average velocity displacement/time hai — beech me kya hua, wo matter nahi karta. Isliye lagatar chalti body ka bhi average velocity zero ho sakta hai.","m":"Assertion ko ek example se check karo: ek taraf jaakar wapas aana, bina rukey.","s":["A true: jaakar wapas aane par displacement 0 par velocity kabhi zero nahi.","R true: average velocity sirf net displacement par depend karti hai.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason hi wajah bata raha hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Average velocity ke liye sirf shuru aur ant dekho; beech ka rasta ignore karo.","w":"","fig":null,"sim":null},{"id":142,"q":"Assertion: The distance travelled by a body in the nth second of uniformly accelerated motion can be calculated as the average velocity during that second multiplied by one second.\nReason: In uniformly accelerated motion the average velocity over any interval equals the velocity at the midpoint of the time interval.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Distance = average velocity × time. 1 second ke interval me average velocity = midpoint (t + $\\tfrac{1}{2}$ s) par velocity — yahi $S_n$ ka formula hai.","m":"Reason ko assertion se jodo: midpoint velocity hi average velocity hai.","s":["A true: distance = v(avg) × $1\\ \\mathrm{s}$.","R true: uniform acceleration me v_avg = v(midpoint).","R hi A ka aadhaar hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"Midpoint velocity = average velocity — sirf uniform acceleration me sach hai.","w":"","fig":null,"sim":null},{"id":143,"q":"Assertion: A body dropped from a moving train hits the ground following a vertical straight line as seen by an observer standing on the ground, neglecting air resistance.\nReason: A body released from a moving vehicle retains the horizontal velocity of the vehicle at the instant of release.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":3,"c":"Ground observer ke liye body ka horizontal velocity bana rehta hai aur vertical me girti hai — isliye path parabola hota hai, vertical line nahi.","m":"Assertion galat hai (parabola), reason sach hai (velocity retain hoti hai).","s":["A false: ground observer ko path parabola dikhta hai.","R true: horizontal velocity retain hoti hai.","False assertion + true reason → option (D)."],"r":{"0":"Assertion galat hai.","1":"Assertion galat hai, isliye ye bhi galat.","2":"Reason sach hai, isliye C nahi."},"t":"Train ke andar wale observer ko vertical dikhega, ground wale ko parabola — frame ka farq.","w":"","fig":null,"sim":null},{"id":144,"q":"Assertion: The velocity of a body thrown vertically upward is zero at the highest point, yet its acceleration there is not zero.\nReason: The acceleration of the body thrown vertically upward is g directed downward throughout its motion, including the highest point.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Highest point par sirf velocity zero hoti hai; gravity wahan bhi kaam karti hai, isliye a = g.","m":"Reason wahi baat explain kar raha hai ki acceleration har jagah g hai.","s":["A true: v = 0, a ≠ 0.","R true: a = g throughout.","Isi wajah se highest point par bhi a zero nahi → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"v = 0 ≠ a = 0 — ye distinction poore chapter ka core hai.","w":"","fig":null,"sim":null},{"id":145,"q":"The velocity-time graph of a body is described as follows. From t = 0 to t = $5\\ \\mathrm{s}$ the velocity increases uniformly from 0 to $20\\ \\mathrm{m\\,s^{-1}}$. From t = $5\\ \\mathrm{s}$ to t = $10\\ \\mathrm{s}$ the velocity remains constant at $20\\ \\mathrm{m\\,s^{-1}}$. From t = $10\\ \\mathrm{s}$ to t = $14\\ \\mathrm{s}$ the velocity decreases uniformly from $20\\ \\mathrm{m\\,s^{-1}}$ to 0. The distance travelled by the body in $14\\ \\mathrm{s}$ is:","opt":["$140\\ \\mathrm{m}$","$170\\ \\mathrm{m}$","$190\\ \\mathrm{m}$","$220\\ \\mathrm{m}$"],"ans":2,"c":"v–t graph ka area distance deta hai: yahan triangle + rectangle + triangle.","m":"Teen hisson ka area alag nikaalo.","s":["0–$5\\ \\mathrm{s}$: $\\tfrac12\\times5\\times20=50$ m.","5–$10\\ \\mathrm{s}$: $5\\times20=100$ m.","10–$14\\ \\mathrm{s}$: $\\tfrac12\\times4\\times20=40$ m.","Total $=50+100+40=190$ m → option (C)."],"r":{"0":"Sirf pehle aur aakhri triangle jaisa adhoora hisaab.","1":"Rectangle ka hissa galat liya ($5\\ \\mathrm{s}$ ki jagah $4\\ \\mathrm{s}$).","3":"Poore $14\\ \\mathrm{s}$ ko 20 se multiply kar diya jaisa over-count."},"t":"Area nikaalne se pehle intervals ki width dhyan se padho — yahin galti hoti hai.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,0],[5,20],[10,20],[14,0]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":146,"q":"A body moves along the x-axis. Its position-time graph is made of two straight-line segments: from t = 0 to t = $5\\ \\mathrm{s}$ the position increases uniformly from x = $10\\ \\mathrm{m}$ to x = $30\\ \\mathrm{m}$; from t = $5\\ \\mathrm{s}$ to t = $15\\ \\mathrm{s}$ the position decreases uniformly from x = $30\\ \\mathrm{m}$ to x = $10\\ \\mathrm{m}$. The average speed of the body for the interval t = 0 to t = $15\\ \\mathrm{s}$ is:","opt":["$4\\ \\mathrm{m\\,s^{-1}}$","zero","$2\\ \\mathrm{m\\,s^{-1}}$","$2.67\\ \\mathrm{m\\,s^{-1}}$"],"ans":3,"c":"Average speed = total path length / total time. Yahan body ne $20\\ \\mathrm{m}$ aage aur $20\\ \\mathrm{m}$ peeche travel kiya.","m":"Distance jodo (path), time se divide karo — displacement se matlab nahi.","s":["Distance $=20+20=40$ m.","Time $=15$ s.","$v_{avg}=40/15\\approx2.67$ $\\mathrm{m\\,s^{-1}}$ → option (D)."],"r":{"1":"Zero average velocity hai, average speed nahi.","2":"40/20 jaisa galat time lagaya.","0":"Sirf net $20\\ \\mathrm{m}$ / $5\\ \\mathrm{s}$ jaisa hisaab."},"t":"Average speed ke liye path length lo, displacement nahi — return journey me farq padta hai.","w":"","fig":{"t":"g","kind":"xt","pts":[[0,10],[5,30],[15,10]],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":147,"q":"The velocity of a body moving along a straight line is recorded at equal intervals of $1\\ \\mathrm{s}$ in the following data table. Assuming the velocity to vary uniformly between the recorded instants, the displacement of the body during the interval t = 0 to t = $4\\ \\mathrm{s}$ is:","opt":["$40\\ \\mathrm{m}$","$44\\ \\mathrm{m}$","$48\\ \\mathrm{m}$","$60\\ \\mathrm{m}$"],"ans":2,"c":"Linear variation of velocity = trapezium area. Total displacement = average of first and last velocity × total time.","m":"Trapezium formula: $\\dfrac{u+v}{2}\\times t$.","s":["$u=4$ $\\mathrm{m\\,s^{-1}}$, $v=20$ $\\mathrm{m\\,s^{-1}}$, $t=4$ s.","$s=\\dfrac{4+20}{2}\\times4$.","$=12\\times4=48$ m → option (C)."],"r":{"0":"Sirf ek velocity se multiply kiya.","1":"44 aata hai kisi adhoori jodi se.","3":"20 × 3 jaisa galat hisaab."},"t":"Uniform rate se badalti velocity me (u + v)/2 × t sabse fast hai.","w":"","fig":{"t":"tab","head":["t (s)","v ($\\mathrm{m\\,s^{-1}}$)"],"rows":[["0","4"],["1","8"],["2","12"],["3","16"],["4","20"]]},"sim":null},{"id":148,"q":"The acceleration-time graph of a body starting from rest is as follows: from t = 0 to t = $3\\ \\mathrm{s}$ the acceleration is constant at +$4\\ \\mathrm{m\\,s^{-2}}$; from t = $3\\ \\mathrm{s}$ to t = $5\\ \\mathrm{s}$ the acceleration is zero; from t = $5\\ \\mathrm{s}$ to t = $7\\ \\mathrm{s}$ the acceleration is constant at −$6\\ \\mathrm{m\\,s^{-2}}$. Which one of the following statements about the motion is correct?","opt":["The velocity of the body at t = $5\\ \\mathrm{s}$ is $20\\ \\mathrm{m\\,s^{-1}}$.","The velocity of the body at t = $7\\ \\mathrm{s}$ is $12\\ \\mathrm{m\\,s^{-1}}$.","The velocity of the body at t = $7\\ \\mathrm{s}$ is zero and the maximum velocity is $12\\ \\mathrm{m\\,s^{-1}}$.","The velocity of the body keeps increasing throughout the interval from t = 0 to t = $7\\ \\mathrm{s}$."],"ans":2,"c":"a–t graph ka area = change in velocity. Pehle positive area velocity badhata hai, phir negative area ghatata hai.","m":"Har segment ka area nikalo aur cumulative velocity banao.","s":["0–$3\\ \\mathrm{s}$: $+4\\times3=+12$ → v = $12\\ \\mathrm{m\\,s^{-1}}$ (maximum).","3–$5\\ \\mathrm{s}$: area 0 → v = $12\\ \\mathrm{m\\,s^{-1}}$.","5–$7\\ \\mathrm{s}$: $-6\\times2=-12$ → v = 0.","Isliye option (C) sahi hai."],"r":{"1":"t = $7\\ \\mathrm{s}$ par velocity 12 nahi, zero hai.","3":"Last segment me velocity ghat rahi hai.","0":"t = $5\\ \\mathrm{s}$ par velocity $12\\ \\mathrm{m\\,s^{-1}}$ hai, 20 nahi."},"t":"a = 0 ka matlab velocity constant; negative a matlab velocity ghat rahi hai (zero nahi).","w":"","fig":{"t":"g","kind":"at","pts":[[0,4],[3,4],[3,0],[5,0],[5,-6],[7,-6]],"yl":"a (m s^{-2})","xl":"t (s)"},"sim":null},{"id":149,"q":"The velocity-time graph of a body is as follows: from t = 0 to t = $4\\ \\mathrm{s}$ the velocity is +$10\\ \\mathrm{m\\,s^{-1}}$ (horizontal); from t = $4\\ \\mathrm{s}$ to t = $8\\ \\mathrm{s}$ the velocity is −$10\\ \\mathrm{m\\,s^{-1}}$ (horizontal). For the whole interval t = 0 to t = $8\\ \\mathrm{s}$, the distance travelled and the magnitude of the average velocity are respectively:","opt":["$40\\ \\mathrm{m}$ and $5\\ \\mathrm{m\\,s^{-1}}$","$80\\ \\mathrm{m}$ and zero","$80\\ \\mathrm{m}$ and $10\\ \\mathrm{m\\,s^{-1}}$","zero and zero"],"ans":1,"c":"Distance = |area| ka sum; displacement = signed area; average velocity = displacement/time.","m":"Do rectangles ka signed area nikalo, phir distance aur displacement alag likho.","s":["Distance $=10\\times4+10\\times4=80$ m.","Displacement $=+40-40=0$.","$|v_{avg}|=0/8=0$ → option (B)."],"r":{"2":"Average velocity zero hai, 10 nahi — displacement zero ho gaya.","3":"Distance zero nahi, $80\\ \\mathrm{m}$ hai.","0":"Distance $80\\ \\mathrm{m}$ hai, 40 nahi."},"t":"Opposite equal areas → displacement zero, distance $80\\ \\mathrm{m}$. Ye NEET ka classic data question hai.","w":"","fig":{"t":"g","kind":"vt","pts":[[0,10],[4,10],[4,-10],[8,-10]],"yl":"v (m s^{-1})","xl":"t (s)"},"sim":null},{"id":150,"q":"Two cars A and B move along the same straight road. Car A starts from the origin at t = 0 and its position-time graph is a straight line of constant slope $5\\ \\mathrm{m\\,s^{-1}}$. Car B starts at t = 0 from a point $30\\ \\mathrm{m}$ ahead of the origin and moves towards the origin with a constant speed of $3\\ \\mathrm{m\\,s^{-1}}$, so that its position-time graph is a straight line of slope −$3\\ \\mathrm{m\\,s^{-1}}$. The two cars meet at:","opt":["t = $3\\ \\mathrm{s}$","t = $3.75\\ \\mathrm{s}$","t = $5\\ \\mathrm{s}$","t = $6\\ \\mathrm{s}$"],"ans":1,"c":"Dono cars ki position ko time ke function me likho aur barabar rakho.","m":"$x_A=5t$ aur $x_B=30-3t$ likho, phir $x_A=x_B$.","s":["$5t=30-3t$.","$8t=30$.","$t=3.75$ s → option (B)."],"r":{"0":"$3\\ \\mathrm{s}$ par A $15\\ \\mathrm{m}$ par aur B $21\\ \\mathrm{m}$ par hai — meet nahi.","2":"$5\\ \\mathrm{s}$ par A $25\\ \\mathrm{m}$, B $15\\ \\mathrm{m}$ — cross ho chuke hain.","3":"$6\\ \\mathrm{s}$ par A $30\\ \\mathrm{m}$, B $12\\ \\mathrm{m}$ — door hain."},"t":"Meeting/catching problems me dono positions ka equation likho aur barabar karo.","w":"","fig":{"t":"g","kind":"xt","series":[{"pts":[[0,0],[6,30]],"color":"#7fb2ee","name":"Car A"},{"pts":[[0,30],[10,0]],"color":"#e0a33a","name":"Car B"}],"yl":"x (m)","xl":"t (s)"},"sim":null},{"id":151,"q":"Two particles P and Q travel the same total distance along a straight line. P covers the first half of the distance with a speed of $10\\ \\mathrm{m\\,s^{-1}}$ and the second half with a speed of $20\\ \\mathrm{m\\,s^{-1}}$. Q moves for the first half of its total time of journey with a speed of $10\\ \\mathrm{m\\,s^{-1}}$ and for the remaining half of its total time with a speed of $20\\ \\mathrm{m\\,s^{-1}}$. The ratio of the average speed of Q to that of P is:","opt":["8 : 9","9 : 8","1 : 1","3 : 2"],"ans":1,"c":"Equal distance par harmonic-type average lagta hai, equal time par simple average. Simple average hamesha bada hota hai.","m":"Dono ki average speed alag formula se nikalo, phir ratio lo.","s":["P: $\\dfrac{2\\times10\\times20}{10+20}=\\dfrac{400}{30}=13.33$ $\\mathrm{m\\,s^{-1}}$.","Q: $\\dfrac{10+20}{2}=15$ $\\mathrm{m\\,s^{-1}}$.","Ratio $=15:13.33=9:8$ → option (B)."],"r":{"0":"Ratio ulat diya — Q ki average badi hai.","2":"Dono ko barabar maan liya, jabki equal-distance average chhoti hoti hai.","3":"3 : 2 kisi sahi hisaab se nahi aata."},"t":"Equal distance wali average hamesha equal time wali average se chhoti hoti hai — sanity check ke liye use karo.","w":"","fig":null,"sim":null},{"id":152,"q":"A body starts from rest and moves along a straight line with uniform acceleration. If it covers a distance of $18\\ \\mathrm{m}$ in the 5th second of its motion, its acceleration is:","opt":["$3\\ \\mathrm{m\\,s^{-2}}$","$4\\ \\mathrm{m\\,s^{-2}}$","$6\\ \\mathrm{m\\,s^{-2}}$","$2\\ \\mathrm{m\\,s^{-2}}$"],"ans":1,"c":"Rest se nth second ka distance: $S_n=\\tfrac{a}{2}(2n-1)$.","m":"n = 5 daalo aur a ke liye solve karo.","s":["$18=\\dfrac{a}{2}(2\\times5-1)$.","$18=\\dfrac{9a}{2}$.","$a=4$ $\\mathrm{m\\,s^{-2}}$ → option (B)."],"r":{"3":"2 se 18 nahi aata (9 × 2/2 = 9).","0":"3 rakhne par S₅ = $13.5\\ \\mathrm{m}$ aata hai.","2":"6 rakhne par S₅ = $27\\ \\mathrm{m}$ aata hai."},"t":"S₅ check karo: a = 4 → S₅ = 4 × 9/2 = 18 ✓. Answer ko wapas formula me daal kar verify karna habit banao.","w":"","fig":null,"sim":null},{"id":153,"q":"A car travelling at $72\\ \\mathrm{km\\,h^{-1}}$ is brought to rest in a total distance of $50\\ \\mathrm{m}$ after the driver sees an obstacle. If the reaction time of the driver is $0.5\\ \\mathrm{s}$, the retardation produced by the brakes is:","opt":["$2.5\\ \\mathrm{m\\,s^{-2}}$","$4\\ \\mathrm{m\\,s^{-2}}$","$5\\ \\mathrm{m\\,s^{-2}}$","$10\\ \\mathrm{m\\,s^{-2}}$"],"ans":2,"c":"Pehle $\\mathrm{km\\,h^{-1}}$ ko $\\mathrm{m\\,s^{-1}}$ me badlo, phir reaction distance minus karke braking distance nikalo.","m":"Total $50\\ \\mathrm{m}$ me se reaction distance hatao; bacha hua distance braking ka hai.","s":["$72$ $\\mathrm{km\\,h^{-1}}$ $=72\\times\\dfrac{5}{18}=20$ $\\mathrm{m\\,s^{-1}}$.","Reaction distance $=20\\times0.5=10$ m, to braking distance $=40$ m.","$0=20^2-2a(40)\\Rightarrow a=\\dfrac{400}{80}=5$ $\\mathrm{m\\,s^{-2}}$ → option (C)."],"r":{"0":"Total $50\\ \\mathrm{m}$ ko hi braking distance maan liya (400/100 = 4? nahi, 2.5 bhi galat hisaab).","1":"$50\\ \\mathrm{m}$ ko braking distance maan kar 400/100 = 4 kiya — reaction distance chhod diya.","3":"$\\mathrm{km\\,h^{-1}}$ ko convert nahi kiya aur seedha numbers use kiye."},"t":"Pehla step hamesha: $\\mathrm{km\\,h^{-1}}$ ko $\\mathrm{m\\,s^{-1}}$ me badalne ke liye 5/18 se multiply karo.","w":"","fig":null,"sim":null},{"id":154,"q":"A stone is dropped from rest from the top of a tower of height $45\\ \\mathrm{m}$. At the same instant another stone is thrown vertically upward from the ground with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ along the same vertical line. Take g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglect air resistance. The two stones meet after a time:","opt":["$1.5\\ \\mathrm{s}$","$2.0\\ \\mathrm{s}$","$2.25\\ \\mathrm{s}$","$3.0\\ \\mathrm{s}$"],"ans":2,"c":"Dono stones ka acceleration same (g) hai, isliye unki relative velocity constant rehti hai aur relative acceleration zero.","m":"Relative approach speed se separation divide karo — yahi sabse fast method hai.","s":["Relative speed $=20$ $\\mathrm{m\\,s^{-1}}$ (dono ka a same hai, isliye constant).","Separation $=45$ m.","$t=45/20=2.25$ s → option (C)."],"r":{"0":"$1.5\\ \\mathrm{s}$ par dono ke positions match nahi karte.","1":"$2\\ \\mathrm{s}$ par pehla $20\\ \\mathrm{m}$ gira, dusra $20\\ \\mathrm{m}$ chadha — total $40\\ \\mathrm{m}$, 45 nahi.","3":"$3\\ \\mathrm{s}$ tak dono cross kar chuke hote hain."},"t":"Same acceleration wale dono bodies ke liye relative motion me g cancel ho jata hai — bas relative speed se divide karo.","w":"","fig":null,"sim":null},{"id":155,"q":"A train of length $150\\ \\mathrm{m}$ moving with a speed of $20\\ \\mathrm{m\\,s^{-1}}$ overtakes a second train of length $100\\ \\mathrm{m}$ moving in the same direction with a speed of $10\\ \\mathrm{m\\,s^{-1}}$ on a parallel track. The time taken by the first train to completely cross the second train is:","opt":["$12.5\\ \\mathrm{s}$","$20\\ \\mathrm{s}$","$25\\ \\mathrm{s}$","$50\\ \\mathrm{s}$"],"ans":2,"c":"Same direction me relative speed = difference; overtaking ke liye total length = dono trains ki lengths.","m":"Relative speed aur total length nikalo, phir divide.","s":["Relative speed $=20-10=10$ $\\mathrm{m\\,s^{-1}}$.","Total length $=150+100=250$ m.","$t=250/10=25$ s → option (C)."],"r":{"0":"Sirf ek length se hisaab kiya.","1":"Relative speed ki jagah 12.5 jaisa average liya.","3":"Relative speed ki jagah $5\\ \\mathrm{m\\,s^{-1}}$ le liya."},"t":"Overtaking (same direction) → subtract speeds; crossing (opposite) → add speeds. Lengths hamesha add.","w":"","fig":null,"sim":null},{"id":156,"q":"A particle starts from rest and moves along a straight line with an acceleration given by a = 2t (a in $\\mathrm{m\\,s^{-2}}$, t in s). The displacement of the particle in the first $3\\ \\mathrm{s}$ is:","opt":["$27\\ \\mathrm{m}$","$6\\ \\mathrm{m}$","$9\\ \\mathrm{m}$","$18\\ \\mathrm{m}$"],"ans":2,"c":"Variable acceleration hai, isliye do integration karni padengi: $v=\\int a\\,dt$, phir $s=\\int v\\,dt$.","m":"a ko integrate karke v, phir v ko integrate karke s — dono baar constant zero (rest se start).","s":["$v=\\int2t\\,dt=t^2$.","$s=\\int_0^3 t^2\\,dt=\\dfrac{t^3}{3}$.","$s=27/3=9$ m → option (C)."],"r":{"1":"Sirf ek integration kiya aur v ki value daal di (t = 3 par v = 9? nahi, 6 galat hisaab).","3":"v ka formula galat liya (2t ke bajaye 6).","0":"Integration ke baad 3 se multiply jaisi galti (27 = $t^{3}$)."},"t":"Variable acceleration me hamesha do integrals: a → v → s. Simple equations yahan nahi chalti.","w":"","fig":null,"sim":null},{"id":157,"q":"A body moving along a straight line with an initial speed of $10\\ \\mathrm{m\\,s^{-1}}$ is subjected to a resistive acceleration whose magnitude varies with speed as a = −2v (v in $\\mathrm{m\\,s^{-1}}$, a in $\\mathrm{m\\,s^{-2}}$). The distance travelled by the body before it comes to rest is:","opt":["$2.5\\ \\mathrm{m}$","$5\\ \\mathrm{m}$","$10\\ \\mathrm{m}$","$20\\ \\mathrm{m}$"],"ans":1,"c":"Yahan acceleration position/speed ka function hai, isliye $a=v\\dfrac{dv}{dx}$ form use karo.","m":"$v\\dfrac{dv}{dx}=-2v$ likho, v cancel karo, phir dx integrate karo.","s":["$v\\dfrac{dv}{dx}=-2v\\Rightarrow\\dfrac{dv}{dx}=-2$.","$dx=-\\dfrac{dv}{2}$.","$x=\\dfrac{10}{2}=5$ m → option (B)."],"r":{"0":"$v^{2}$ wala integration lagaya ($10^{2}$/8 jaisa) — yahan linear hai.","2":"v ko hi distance maan liya.","3":"Denominator me 0.5 ki jagah 0.25 use kiya."},"t":"Jab a, v ka function ho to $a=v\\,dv/dx$ hi sabse short rasta hai.","w":"","fig":null,"sim":null},{"id":158,"q":"A balloon is rising vertically upward with a constant speed of $5\\ \\mathrm{m\\,s^{-1}}$. When the balloon is at a height of $60\\ \\mathrm{m}$ above the ground, a stone is released from it. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglecting air resistance, the time taken by the stone to reach the ground after release is:","opt":["$3\\ \\mathrm{s}$","$3.5\\ \\mathrm{s}$","$4\\ \\mathrm{s}$","$5\\ \\mathrm{s}$"],"ans":2,"c":"Release ke baad stone ka initial velocity $5\\ \\mathrm{m\\,s^{-1}}$ upar hai, acceleration $10\\ \\mathrm{m\\,s^{-2}}$ neeche, displacement −$60\\ \\mathrm{m}$.","m":"Sign convention: upar positive. Phir $s=ut-\\tfrac12gt^2$ me s = −60.","s":["$-60=5t-5t^2$.","$t^2-t-12=0$.","$(t-4)(t+3)=0\\Rightarrow t=4$ s → option (C)."],"r":{"0":"$3\\ \\mathrm{s}$ me displacement −$30\\ \\mathrm{m}$ hota hai, ground tak nahi pahunchti.","1":"$3.5\\ \\mathrm{s}$ me bhi ground se upar hai.","3":"$5\\ \\mathrm{s}$ me stone ground ke neeche chala jata (galat root)."},"t":"Quadratic ke do roots me se positive root lo aur usse ground par pahunchne ka check karo.","w":"","fig":null,"sim":null},{"id":159,"q":"A body is projected vertically upward from the ground with a speed of $40\\ \\mathrm{m\\,s^{-1}}$. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglecting air resistance, the distance travelled by the body during the last second of its upward journey is:","opt":["$20\\ \\mathrm{m}$","$5\\ \\mathrm{m}$","$10\\ \\mathrm{m}$","$15\\ \\mathrm{m}$"],"ans":1,"c":"Last second of ascent me body 0 se shuru karke $1\\ \\mathrm{s}$ me giregi jaisa — kyunki reverse motion bhi same acceleration se hoti hai.","m":"Ascent ko ulta socho: highest point par v = 0, isliye last second me distance $=\\tfrac12g(1)^2$.","s":["$s=\\tfrac12\\times10\\times1^2$.","$=5$ m.","Ye initial speed par depend nahi karta → option (B)."],"r":{"2":"$10\\ \\mathrm{m}$ aata hai agar g ko 10 × 1 se multiply karo bina $\\tfrac{1}{2}$ ke.","3":"$15\\ \\mathrm{m}$ doosre second ka distance hai, last second ka nahi.","0":"$20\\ \\mathrm{m}$ pehle second ke distance ke barabar galat hisaab hai."},"t":"Last second of ascent ka distance hamesha $5\\ \\mathrm{m}$ hota hai (g = 10) — speed chahe kuch bhi ho.","w":"","fig":null,"sim":null},{"id":160,"q":"A body starting from rest moves along a straight line with uniform acceleration and covers a distance of $14\\ \\mathrm{m}$ in the 4th second of its motion. The distance travelled by the body in the first $4\\ \\mathrm{s}$ is:","opt":["$14\\ \\mathrm{m}$","$24\\ \\mathrm{m}$","$32\\ \\mathrm{m}$","$56\\ \\mathrm{m}$"],"ans":2,"c":"Pehle a nikaalo $S_4$ se, phir total distance ke liye $s=\\tfrac12at^2$.","m":"Do steps: (i) a from nth second formula, (ii) total distance in $4\\ \\mathrm{s}$.","s":["$14=\\dfrac{a}{2}(2\\times4-1)=\\dfrac{7a}{2}\\Rightarrow a=4$ $\\mathrm{m\\,s^{-2}}$.","$s=\\tfrac12\\times4\\times16$.","$=32$ m → option (C)."],"r":{"0":"4th second ka distance total distance nahi hota.","1":"24 aata hai kisi galat a (3) se.","3":"56 = 14 × 4 jaisa galat multiply."},"t":"Nth second ka distance aur total distance do alag cheezein hain — 4th second me $14\\ \\mathrm{m}$, par total $32\\ \\mathrm{m}$.","w":"","fig":null,"sim":null},{"id":161,"q":"The position of a particle moving along the x-axis is given by x = 2$t^{3}$ − 9$t^{2}$ + 12t. The position of the particle at the instant when its acceleration becomes zero is:","opt":["$9.0\\ \\mathrm{m}$","$2.5\\ \\mathrm{m}$","$4.5\\ \\mathrm{m}$","$6.0\\ \\mathrm{m}$"],"ans":2,"c":"Acceleration pehle nikaalo (do derivatives), a = 0 ka time solve karo, phir wahi t position me daalo.","m":"Order yaad rakho: t(a = 0) → x(t).","s":["$v=6t^2-18t+12$, $a=12t-18$.","$a=0\\Rightarrow t=1.5$ s.","$x=2(3.375)-9(2.25)+12(1.5)=6.75-20.25+18=4.5$ m → option (C)."],"r":{"1":"t = 1.5 ko cube ki jagah galat lagaya.","3":"t = 1 par x = $5\\ \\mathrm{m}$ aata hai, jo a = 0 ka instant nahi.","0":"t = 2 par x = $4\\ \\mathrm{m}$ aata hai."},"t":"a = 0 ka instant aur maximum velocity ka instant ek hi hota hai (jab a sign badle).","w":"","fig":null,"sim":null},{"id":162,"q":"Two balls are released from the top of a tower of height $80\\ \\mathrm{m}$. Ball A is dropped from rest, while ball B is thrown vertically downward with a speed of $30\\ \\mathrm{m\\,s^{-1}}$ at the same instant. Taking g = $10\\ \\mathrm{m\\,s^{-2}}$, the difference in the times taken by the two balls to reach the ground is:","opt":["$1\\ \\mathrm{s}$","$2\\ \\mathrm{s}$","$2.5\\ \\mathrm{s}$","$4\\ \\mathrm{s}$"],"ans":1,"c":"Dono ke liye alag equations: A ke liye u = 0, B ke liye u = 30 (neeche).","m":"Dono times alag nikaalo, phir difference lo.","s":["A: $80=5t^2\\Rightarrow t=4$ s.","B: $80=30t+5t^2\\Rightarrow t^2+6t-16=0\\Rightarrow t=2$ s.","Difference $=4-2=2$ s → option (B)."],"r":{"0":"$1\\ \\mathrm{s}$ kisi bhi root se nahi aata.","2":"$2.5\\ \\mathrm{s}$ galat root se aata hai.","3":"$4\\ \\mathrm{s}$ sirf A ka time hai."},"t":"Neeche phenki body ke liye equation me u positive lena hai (neeche ki direction positive).","w":"","fig":null,"sim":null},{"id":163,"q":"The position of a particle moving along the x-axis varies with time as x = 4t − $t^{2}$. Consider the following statements:\nI. The velocity of the particle becomes zero at t = $2\\ \\mathrm{s}$.\nII. The acceleration of the particle is −$2\\ \\mathrm{m\\,s^{-2}}$ and is constant.\nIII. The distance travelled by the particle in the first $4\\ \\mathrm{s}$ is zero.\nIV. The displacement of the particle in the first $4\\ \\mathrm{s}$ is zero.\nThe correct statements are:","opt":["I, III and IV only","I, II and IV only","I, II and III only","II, III and IV only"],"ans":1,"c":"x = 4t − $t^{2}$: v = 4 − 2t, a = −2. Particle $4\\ \\mathrm{m}$ tak jaati hai phir wapas aati hai — isliye distance $8\\ \\mathrm{m}$ par displacement 0.","m":"III me 'distance' word hai — return journey ki wajah se zero nahi hoga.","s":["I: $v=0$ at t = 2 → true.","II: $a=-2$ constant → true.","III: distance $=4+4=8$ m, zero nahi → false.","IV: $x(4)=0$ → displacement zero → true.","True set = I, II, IV → option (B)."],"r":{"2":"Isme III galat hai.","3":"Isme III hai aur I chhoot gaya.","0":"Isme III hai — eliminate."},"t":"Reversal wale motion me distance aur displacement alag ho jate hain — statement questions ka favourite.","w":"","fig":null,"sim":null},{"id":164,"q":"Two bodies are projected vertically upward from the ground with speeds u and 2u respectively. Air resistance is neglected. Consider the following statements:\nI. Their maximum heights are in the ratio 1 : 4.\nII. Their times of ascent are in the ratio 1 : 2.\nIII. Each returns to the ground with the same speed with which it was projected.\nIV. The acceleration of the second body is greater than that of the first.\nThe correct statements are:","opt":["I, II and IV only","II, III and IV only","I, III and IV only","I, II and III only"],"ans":3,"c":"$H=u^2/2g\\propto u^2$ aur $t_{up}=u/g\\propto u$. Acceleration dono ka same g hai.","m":"IV turant eliminate karo — acceleration mass/speed par depend nahi karta.","s":["I: $u^{2}$ ratio → 1 : 4 → true.","II: u ratio → 1 : 2 → true.","III: energy/symmetry → true.","IV: dono ka a = g → false.","True set = I, II, III → option (D)."],"r":{"0":"Isme IV galat hai.","1":"Isme IV hai aur I chhoot gaya.","2":"Isme IV hai — eliminate."},"t":"H ∝ $u^{2}$, t ∝ u, a = g (constant) — teen facts se poora question ban jata hai.","w":"","fig":null,"sim":null},{"id":165,"q":"Consider the following statements about graphs of one-dimensional motion:\nI. The area under a velocity-time graph between two instants gives the displacement in that interval even when the velocity changes sign.\nII. The slope of the position-time graph of a uniformly accelerated body changes continuously with time.\nIII. A body moving along a straight line with constant speed has non-zero acceleration.\nIV. The area under an acceleration-time graph between two instants gives the change in velocity in that interval.\nThe correct statements are:","opt":["I, III and IV only","I, II and IV only","I, II and III only","II, III and IV only"],"ans":1,"c":"Graph ke do rules: v–t area → displacement (sign ke saath), a–t area → $\\Delta v$. Uniform acceleration me x–t parabola ka slope badalta rehta hai.","m":"III classical trap hai: straight line + constant speed → a = 0.","s":["I: signed area se displacement milta hai → true.","II: parabola ka slope continuous badalta hai → true.","III: constant speed straight line → a = 0 → false.","IV: a–t area = $\\Delta v$ → true.","True set = I, II, IV → option (B)."],"r":{"2":"Isme III galat hai.","3":"Isme III hai aur I chhoot gaya.","0":"Isme III hai — eliminate."},"t":"1D me constant speed par direction fixed hoti hai, isliye acceleration zero — ye exception-free fact hai.","w":"","fig":null,"sim":null},{"id":166,"q":"A driver moving with speed v sees an obstacle and applies the brakes after a reaction time t(r). The brakes then produce a constant retardation a. Consider the following statements:\nI. If v is doubled while a remains the same, the braking distance becomes four times.\nII. If v is doubled while t(r) remains the same, the distance travelled during the reaction time becomes two times.\nIII. The total stopping distance is proportional to the square of v for all values of t(r).\nIV. The distance travelled during the reaction time is independent of the retardation a.\nThe correct statements are:","opt":["II, III and IV only","I, III and IV only","I, II and IV only","I, II and III only"],"ans":2,"c":"Total stopping distance $=v\\,t_r+\\dfrac{v^2}{2a}$. Isme pehla term linear, dusra quadratic hai.","m":"III tabhi sach hota hai jab t(r) = 0 ho — warna nahi.","s":["I: $v^2/2a$ se 4× → true.","II: v·t(r) se 2× → true.","III: sirf jab $t_r=0$; warna linear term bhi hai → false.","IV: reaction distance = v·t(r), a se independent → true.","True set = I, II, IV → option (C)."],"r":{"3":"Isme III galat hai.","0":"Isme III hai aur I chhoot gaya.","1":"Isme III hai — eliminate."},"t":"Total stopping distance pure $v^{2}$ ke proportional nahi hota — reaction time ka linear hissa hota hai.","w":"","fig":null,"sim":null},{"id":167,"q":"Consider the following statements about relative velocity and relative acceleration in one dimension:\nI. Two bodies moving in opposite directions with equal speeds v have a relative speed of 2v.\nII. The relative velocity of two bodies can be zero even when both are moving with respect to the ground.\nIII. If the relative velocity of A with respect to B is zero, then A and B have the same velocity.\nIV. The relative acceleration of two bodies in free fall (air resistance neglected) is zero.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II, III and IV","II, III and IV only"],"ans":2,"c":"Relative velocity zero ka matlab dono ki velocity barabar. Free fall me dono ka a = g, isliye relative acceleration zero.","m":"Chaar statements independent hain; sabhi standard facts hain.","s":["I: $v-(-v)=2v$ → true.","II: same velocity → relative velocity zero → true.","III: definition se → true.","IV: same g → 0 → true.","Saare chaar sahi → option (C)."],"r":{"1":"IV bhi sahi hai.","3":"I bhi sahi hai, isliye list adhoori hai.","0":"II bhi sahi hai."},"t":"Relative acceleration = $a_{1}$ − $a_{2}$, sirf accelerations ka difference.","w":"","fig":null,"sim":null},{"id":168,"q":"Consider the following statements about the calculus of one-dimensional motion:\nI. If the acceleration of a body is zero, the body must be at rest.\nII. For constant acceleration, the area under the velocity-time graph between two instants gives the displacement in that interval.\nIII. If the velocity of a body is v = $kt^{2}$ (k constant), then its acceleration increases linearly with time.\nIV. For constant acceleration, the position-time graph of a body starting from rest is a parabola.\nThe correct statements are:","opt":["I, II and III only","II, III and IV only","I, III and IV only","I, II and IV only"],"ans":1,"c":"a = 0 sirf velocity constant batata hai (rest zaroori nahi). v = $kt^{2}$ → a = 2kt, jo t me linear hai.","m":"I ko counter-example se reject karo — uniform motion.","s":["I: uniform motion me a = 0 par v ≠ 0 → false.","II: v–t area = displacement → true.","III: $a=2kt$, t me linear → true.","IV: $x=\\tfrac12at^2$ parabola → true.","True set = II, III, IV → option (B)."],"r":{"0":"Isme I galat hai.","2":"Isme I hai aur II chhoot gaya.","3":"Isme I hai — eliminate."},"t":"Derivative ki power ka rule: v ∝ $t^{2}$ → a ∝ t.","w":"","fig":null,"sim":null},{"id":169,"q":"Ball A is dropped from rest from a point at a height of $80\\ \\mathrm{m}$. Ball B is dropped from rest from the same point exactly $1\\ \\mathrm{s}$ later. Take g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglect air resistance. Consider the following statements:\nI. At t = $2\\ \\mathrm{s}$ (measured from the release of A), the separation between the two balls is $25\\ \\mathrm{m}$.\nII. At t = $2\\ \\mathrm{s}$ the speed of ball A is greater than that of ball B.\nIII. The separation between the two balls increases at the constant rate of $10\\ \\mathrm{m\\,s^{-1}}$.\nIV. Ball A reaches the ground earlier than ball B.\nThe correct statements are:","opt":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"ans":2,"c":"Pehli ball $1\\ \\mathrm{s}$ pehle chali, isliye uski speed aur girāi hui distance dono zyada hain. Separation har second $10\\ \\mathrm{m}$ se badhta hai.","m":"t = $2\\ \\mathrm{s}$ par distances alag nikaal kar check karo: A ne $2\\ \\mathrm{s}$, B ne $1\\ \\mathrm{s}$ travel kiya.","s":["I: A: $20\\ \\mathrm{m}$, B: $5\\ \\mathrm{m}$ → separation $15\\ \\mathrm{m}$ (25 nahi) → false.","II: A ki speed 20, B ki 10 → true.","III: separation = 10 × (time difference) → constant rate → true.","IV: A pehle start hui, isliye pehle pahunchegi → true.","True set = II, III, IV → option (C)."],"r":{"0":"Isme I galat hai (separation $15\\ \\mathrm{m}$).","1":"Isme I hai — eliminate.","3":"Isme I hai — eliminate."},"t":"Do bodies ke beech separation = (time lag) × relative speed. Yahan $1\\ \\mathrm{s}$ × $10\\ \\mathrm{m\\,s^{-1}}$.","w":"","fig":null,"sim":null},{"id":170,"q":"A body starts from rest and moves along a straight line with a uniform acceleration of $4\\ \\mathrm{m\\,s^{-2}}$ for $5\\ \\mathrm{s}$. It then moves with the velocity so acquired for the next $5\\ \\mathrm{s}$ and finally comes to rest with uniform retardation in the next $10\\ \\mathrm{s}$. Consider the following statements:\nI. The maximum velocity attained by the body is $20\\ \\mathrm{m\\,s^{-1}}$.\nII. The total distance travelled by the body is $250\\ \\mathrm{m}$.\nIII. The average velocity of the body for the whole journey is $25\\ \\mathrm{m\\,s^{-1}}$.\nIV. The distance travelled during retardation is twice the distance travelled during acceleration.\nThe correct statements are:","opt":["I, III and IV only","I, II and IV only","I, II and III only","II, III and IV only"],"ans":1,"c":"Teen phases ka v–t graph banao. Average velocity = total distance / total time.","m":"Pehle v(max), phir teen areas, phir average velocity.","s":["I: $v=4\\times5=20$ $\\mathrm{m\\,s^{-1}}$ → true.","II: $50+100+100=250$ m → true.","III: $250/20=12.5$ $\\mathrm{m\\,s^{-1}}$ (25 nahi) → false.","IV: $100\\ \\mathrm{m}$ = 2 × $50\\ \\mathrm{m}$ → true.","True set = I, II, IV → option (B)."],"r":{"2":"Isme III galat hai (average 12.5 hai).","3":"Isme III hai aur I chhoot gaya.","0":"Isme III hai — eliminate."},"t":"Retardation $10\\ \\mathrm{s}$ me hai aur acceleration $5\\ \\mathrm{s}$ me — same v change par zyada distance (average velocity zyada).","w":"","fig":null,"sim":null},{"id":171,"q":"A ball is thrown vertically upward in air, and air resistance is not neglected (assume the resistive force to be constant in magnitude). Consider the following statements:\nI. The magnitude of the acceleration of the ball during its ascent is greater than g.\nII. The magnitude of the acceleration of the ball during its descent is less than g.\nIII. The time of ascent of the ball is less than its time of descent.\nIV. The ball returns to the point of projection with the same speed with which it was thrown.\nThe correct statements are:","opt":["I, III and IV only","I, II and III only","I, II and IV only","II, III and IV only"],"ans":1,"c":"Ascent me weight aur air resistance dono neeche → a > g. Descent me resistance upar → a < g. Isliye ascent fast, descent slow.","m":"Har phase me forces ka direction likho — yahi poora answer hai.","s":["I: a = g + f/m > g → true.","II: a = g − f/m < g → true.","III: ascent tez, descent dheema → time of ascent kam → true.","IV: energy loss hoti hai, speed kam hoti hai → false.","True set = I, II, III → option (B)."],"r":{"2":"Isme IV galat hai — resistance se energy loss hoti hai.","3":"Isme IV hai aur I chhoot gaya.","0":"Isme IV hai — eliminate."},"t":"Air resistance ke saath: upar jaana tez, neeche aana dheema, wapsi speed kam.","w":"","fig":null,"sim":null},{"id":172,"q":"Consider the following statements about frames of reference:\nI. The frame of reference attached to a freely falling body is non-inertial.\nII. The frame of reference attached to a lift moving with constant velocity is inertial.\nIII. The velocity of a body measured in two different inertial frames is always the same.\nIV. The acceleration of a body measured in two inertial frames moving with uniform velocity relative to each other is the same.\nThe correct statements are:","opt":["I, II and III only","II, III and IV only","I, III and IV only","I, II and IV only"],"ans":3,"c":"Free fall me acceleration g hai → non-inertial. Constant velocity frame inertial hai. Inertial frames me velocity alag hoti hai (relative velocity) par acceleration same.","m":"III galat hai — velocity frame ke saath badalti hai.","s":["I: a = g ≠ 0 → non-inertial → true.","II: constant velocity → inertial → true.","III: velocity badalti hai (v − u) → false.","IV: acceleration dono frames me same → true.","True set = I, II, IV → option (D)."],"r":{"0":"Isme III galat hai.","1":"Isme III hai aur I chhoot gaya.","2":"Isme III hai — eliminate."},"t":"Inertial frames me acceleration invariant hoti hai, velocity nahi.","w":"","fig":null,"sim":null},{"id":173,"q":"Which one of the following statements is NOT correct for a body moving along a straight line with constant acceleration?","opt":["The average velocity over any time interval equals the velocity of the body at the midpoint of that interval.","The distance travelled in the nth second equals the average velocity during that second multiplied by one second.","The velocity-time graph is a straight line, not necessarily passing through the origin.","The average speed over any interval is always equal to the magnitude of the average velocity over that interval."],"ans":3,"c":"Reversal wale motion me path length aur |displacement| alag hote hain, isliye average speed ≠ |average velocity|.","m":"D me 'always' word hai — reversal ek counter-example hai.","s":["A: uniform acceleration ka standard result → sahi.","B: distance = v(avg) × $1\\ \\mathrm{s}$ → sahi.","C: v = u + at → line, origin zaroori nahi → sahi.","D: reversal me alag hote hain → NOT correct.","Isliye option (D)."],"r":{"0":"Midpoint velocity = average velocity, ye sahi hai.","1":"Ye bhi sahi hai ($1\\ \\mathrm{s}$ ke interval par).","2":"u = 0 ho tabhi origin se guzarti hai; warna nahi — isliye ye statement sahi hai."},"t":"Average speed = |average velocity| sirf tab jab direction na badle.","w":"","fig":null,"sim":null},{"id":174,"q":"Which one of the following statements is correct?","opt":["A body can have negative velocity and positive acceleration simultaneously.","A body starting from rest can never have a negative acceleration.","The instantaneous speed of a body can be negative.","If a body returns to its starting point, its displacement must be non-zero."],"ans":0,"c":"Velocity aur acceleration ke signs independent hain. Negative velocity + positive acceleration ka matlab body peeche ja rahi hai par slow ho rahi hai.","m":"Har option ko ek concrete example se test karo.","s":["A: peeche jaati body jo slow ho rahi ho → sahi.","B: rest se start karke peeche accelerate kar sakti hai → galat.","C: speed magnitude hai, negative nahi → galat.","D: wapas aane par displacement zero → galat.","Isliye option (A)."],"r":{"1":"Rest se start karke negative acceleration possible hai (jaise brake lagana).","2":"Speed negative nahi hoti; velocity hoti hai.","3":"Return journey me displacement zero hota hai."},"t":"Velocity ka sign direction batata hai, acceleration ka sign speed ka badhna/ghatna.","w":"","fig":null,"sim":null},{"id":175,"q":"Which one of the following statements about relative velocity in one dimension is NOT correct?","opt":["Two bodies moving with the same velocity have zero relative velocity.","The relative speed of approach of two bodies moving towards each other with speeds u and v is u + v.","Relative velocity is a vector quantity and depends on the direction as well as the magnitude of the velocities involved.","The magnitude of the relative velocity of A with respect to B is always greater than the magnitude of the velocity of A with respect to the ground."],"ans":3,"c":"$v_{AB}=v_A-v_B$ — same direction me ye chhoti hoti hai, badi nahi. Isliye 'always greater' galat hai.","m":"Ek counter-example: same direction me 20 aur 15 → relative 5, jo 20 se chhoti hai.","s":["A: same velocity → 0 → sahi.","B: opposite direction → sum → sahi.","C: vector hai, direction matter karti hai → sahi.","D: same direction me chhoti hoti hai → NOT correct.","Isliye option (D)."],"r":{"0":"Ye sahi statement hai.","1":"Approach speed = sum of speeds — sahi.","2":"Relative velocity vector hai — sahi."},"t":"Relative velocity ka magnitude velocity se chhota, barabar ya bada ho sakta hai — 'always' mat socho.","w":"","fig":null,"sim":null},{"id":176,"q":"A body is released from rest from a height h above the ground. Air resistance is neglected. Which one of the following statements is NOT correct?","opt":["The distance fallen by the body in the first half of its total time of fall is h/2.","The average speed of the body during the whole fall is half of its speed on striking the ground.","The time taken to reach the ground is $\\sqrt{2h/g}$.","The speed with which the body strikes the ground is $\\sqrt{2gh}$."],"ans":0,"c":"Half time me distance $=\\tfrac12g(T/2)^2=h/4$ hota hai, h/2 nahi (kyunki distance ∝ $t^{2}$).","m":"Time ke half par distance chauthai hota hai — ye ratio question ka core hai.","s":["C: $h=\\tfrac12gT^2$ se → sahi.","D: $v^2=2gh$ se → sahi.","A: half time me h/4 girta hai → NOT correct.","B: average speed = (0 + v)/2 = v/2 → sahi.","Isliye option (A)."],"r":{"2":"Ye sahi formula hai.","3":"Ye bhi sahi hai.","1":"Uniform acceleration me average speed = (u + v)/2 — sahi."},"t":"Distance ∝ $t^{2}$ — isliye half time me chauthai distance, aur half distance ke liye $T/\\sqrt{2}$ time.","w":"","fig":null,"sim":null},{"id":177,"q":"Consider the following statements about a position-time graph of a body moving along a straight line:\nI. A straight line parallel to the time axis represents a body at rest.\nII. A straight line with negative slope represents motion with uniform velocity in the negative direction.\nIII. The crossing of the position-time graph with the time axis indicates that the body is at the origin at that instant.\nIV. A curve whose slope changes with time represents a body moving with non-uniform velocity.\nWhich of the above statements are correct?","opt":["I and II only","I, II and III only","I, II, III and IV","II, III and IV only"],"ans":2,"c":"x–t graph ka slope velocity hai. Slope zero = rest, slope constant negative = negative uniform velocity, x = 0 par origin, badalta slope = non-uniform velocity.","m":"Chaar statements basic definitions hain — sabhi sach hain.","s":["I: parallel line → x constant → rest → true.","II: negative slope → negative velocity → true.","III: x = 0 par body origin par → true.","IV: badalta slope → badalti velocity → true.","Saare chaar sahi → option (C)."],"r":{"0":"III aur IV bhi sahi hain.","1":"IV bhi sahi hai.","3":"I bhi sahi hai."},"t":"x–t graph ka har feature velocity ke baare me kuch batata hai — ye chaar points yaad rakho.","w":"","fig":null,"sim":null},{"id":178,"q":"Consider the following statements about a velocity-time graph:\nI. A straight line parallel to the time axis at v = $5\\ \\mathrm{m\\,s^{-1}}$ represents uniform velocity.\nII. A straight line joining the point ($0\\ \\mathrm{s}$, $10\\ \\mathrm{m\\,s^{-1}}$) to the point ($5\\ \\mathrm{s}$, 0) represents uniform retardation of $2\\ \\mathrm{m\\,s^{-2}}$.\nIII. The area under a velocity-time graph is always taken as positive.\nIV. The slope of a velocity-time graph at any instant gives the displacement up to that instant.\nWhich of the above statements are NOT correct?","opt":["II and IV only","I and II only","III and IV only","I, II and III only"],"ans":2,"c":"Area sign ke saath lena hota hai (negative area = negative displacement), aur v–t ka slope acceleration deta hai, displacement nahi.","m":"III aur IV dono galat hain — isliye un dono ko chunne wala option lo.","s":["I: horizontal line → uniform velocity → sahi.","II: slope = (0 − 10)/5 = −2 → sahi.","III: neeche ka area negative hota hai → NOT correct.","IV: slope acceleration deta hai → NOT correct.","Galat statements = III, IV → option (C)."],"r":{"1":"I aur II sahi statements hain.","3":"I sahi hai, isliye ye list galat hai.","0":"II sahi hai, isliye ye bhi galat."},"t":"NOT-correct questions me 'kaunse galat hain' wali list banaiye, phir option match kariye.","w":"","fig":null,"sim":null},{"id":179,"q":"A stone is dropped from rest from the top of a tower, and at the same instant another stone is thrown vertically downward from the same point with a speed u. Air resistance is neglected. Which one of the following statements is NOT correct?","opt":["Both stones have the same acceleration throughout their motion.","Both stones reach the ground with the same speed.","The stone thrown downward reaches the ground first.","The stone thrown downward takes less time to cover the height of the tower."],"ans":1,"c":"Neeche phenki stone ki initial velocity zyada hai, isliye $v^2=u^2+2gh$ se uski final speed zyada hogi — same nahi.","m":"C aur D ek hi baat keh rahe hain (sach), isliye A aur B me se NOT-correct dhundo.","s":["A: dono ka a = g → sahi.","B: speeds alag ($\\sqrt{u^2+2gh}$ vs $\\sqrt{2gh}$) → NOT correct.","C: u zyada hai to jaldi → sahi.","D: jaldi pahunchne ka matlab kam time → sahi.","Isliye option (B)."],"r":{"0":"Dono par sirf gravity → acceleration same.","2":"Neeche phenki stone aage rehti hai — sahi statement.","3":"Kam time lena bhi sahi hai."},"t":"Same acceleration ≠ same speed; initial velocity ka farq final speed me dikhta hai.","w":"","fig":null,"sim":null},{"id":180,"q":"Which one of the following statements about uniformly accelerated motion along a straight line is NOT correct?","opt":["The acceleration of the body changes uniformly with time.","The velocity-time graph of the body is a straight line.","The position-time graph of the body is a parabola.","The displacements of the body in successive equal time intervals differ by a constant amount."],"ans":0,"c":"Uniform acceleration ka matlab acceleration constant hai — wo badalta hi nahi, isliye 'uniformly changes' galat hai.","m":"Statement A apne aap me contradiction hai: uniform means constant.","s":["A: a constant hota hai, badalta nahi → NOT correct.","B: v–t straight line → sahi.","C: x–t parabola → sahi.","D: successive intervals me difference constant ($aT^{2}$) → sahi.","Isliye option (A)."],"r":{"1":"Ye sahi hai.","2":"Ye bhi sahi hai.","3":"Ye sahi hai — $aT^{2}$ ka constant difference."},"t":"'Uniform acceleration' me 'uniform' ka matlab constant hi hota hai.","w":"","fig":null,"sim":null},{"id":181,"q":"A body is projected vertically upward from the ground. Air resistance is neglected. Which one of the following statements is correct?","opt":["Both the velocity and the acceleration of the body decrease during its upward motion.","At the highest point, the velocity of the body is zero while its acceleration is g directed downward.","The time of ascent of the body is greater than its time of descent.","The maximum height reached by the body is directly proportional to the speed of projection."],"ans":1,"c":"Ascent me velocity ghatti hai par acceleration constant g rehta hai. Highest point par v = 0, a = g.","m":"Acceleration ka constancy check karo — bahut se options isi par kat jate hain.","s":["A: acceleration constant rehta hai → galat.","B: v = 0, a = g downward → sahi.","C: dono times barabar → galat.","D: H ∝ $u^{2}$, u ke proportional nahi → galat.","Isliye option (B)."],"r":{"0":"Sirf velocity ghatti hai; acceleration constant hai.","2":"Symmetry ki wajah se times barabar hote hain.","3":"H ∝ $u^{2}$ hota hai, linear nahi."},"t":"Highest point ka fact (v = 0, a = g) NEET me har saal kisi na kisi roop me aata hai.","w":"","fig":null,"sim":null},{"id":182,"q":"Which one of the following statements about relative acceleration in one dimension is NOT correct?","opt":["The relative acceleration of A with respect to B is given by a(A) − a(B).","Two bodies moving with different constant velocities have zero relative acceleration.","Two bodies in free fall (air resistance neglected) have zero relative acceleration.","Two bodies having equal accelerations have a non-zero relative acceleration."],"ans":3,"c":"$a_{AB}=a_A-a_B$; equal accelerations ka matlab relative acceleration zero.","m":"Definition ko directly apply karo — equal accelerations se zero aata hai, non-zero nahi.","s":["A: definition → sahi.","B: constant velocities → a = 0 dono → 0 → sahi.","C: dono ka g → 0 → sahi.","D: equal accelerations → 0 → NOT correct.","Isliye option (D)."],"r":{"0":"Ye sahi definition hai.","1":"Constant velocity ka acceleration zero hota hai.","2":"Free fall me dono ka same g hota hai."},"t":"Relative acceleration zero ka matlab dono ki accelerations barabar hain.","w":"","fig":null,"sim":null},{"id":183,"q":"Match the situations in Column I with the magnitudes of acceleration in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$ unless stated.\nColumn I: (a) A body moving with a constant velocity of $5\\ \\mathrm{m\\,s^{-1}}$ for $10\\ \\mathrm{s}$ (b) A body whose velocity changes uniformly from $10\\ \\mathrm{m\\,s^{-1}}$ to $20\\ \\mathrm{m\\,s^{-1}}$ in $5\\ \\mathrm{s}$ (c) A body thrown vertically upward, at the highest point of its path (d) A body starting from rest that covers $32\\ \\mathrm{m}$ in $4\\ \\mathrm{s}$ with uniform acceleration\nColumn II: (i) 0 (ii) $2\\ \\mathrm{m\\,s^{-2}}$ (iii) $10\\ \\mathrm{m\\,s^{-2}}$ (iv) $4\\ \\mathrm{m\\,s^{-2}}$","opt":["a-ii, b-i, c-iv, d-iii","a-i, b-ii, c-iii, d-iv","a-i, b-iv, c-ii, d-iii","a-iii, b-ii, c-i, d-iv"],"ans":1,"c":"Teen different tarike: constant velocity → 0; (v−u)/t; $s=\\tfrac12at^2$; aur free fall me g.","m":"Har case ka formula alag hai — dhyaan se chuno.","s":["(a) constant velocity → a = 0 → i.","(b) $a=10/5=2$ → ii.","(c) highest point par a = 10 → iii.","(d) $32=\\tfrac12a(16)\\Rightarrow a=4$ → iv.","Isliye a-i, b-ii, c-iii, d-iv → option (B)."],"r":{"2":"(b) me 4 daal diya (jo (d) ka answer hai).","3":"(a) me 10 daal diya.","0":"(a) me 2 likh diya."},"t":"Constant velocity ka acceleration zero — sabse pehle ise match karo, options turant kam ho jate hain.","w":"","fig":null,"sim":null},{"id":184,"q":"Match the graphs in Column I with their interpretations in Column II:\nColumn I: (a) A velocity-time graph that is a straight line with negative slope, the velocity remaining positive throughout (b) A velocity-time graph that is a straight line parallel to the time axis (c) An acceleration-time graph that is a straight line parallel to the time axis at a non-zero value (d) An acceleration-time graph that lies along the time axis\nColumn II: (i) Uniform velocity (ii) Constant non-zero acceleration (iii) Zero acceleration (iv) Uniformly retarded motion","opt":["a-iv, b-iii, c-i, d-ii","a-iv, b-i, c-ii, d-iii","a-i, b-iv, c-iii, d-ii","a-ii, b-i, c-iv, d-iii"],"ans":1,"c":"v–t ka negative slope = retardation; v–t parallel = uniform velocity; a–t horizontal non-zero = constant a; a–t zero = zero acceleration.","m":"Do graph types (v–t aur a–t) ko alag list me likho.","s":["(a) v–t negative slope, v > 0 → slow down → iv.","(b) v–t horizontal → uniform velocity → i.","(c) a–t non-zero horizontal → constant a → ii.","(d) a–t zero → a = 0 → iii.","Isliye a-iv, b-i, c-ii, d-iii → option (B)."],"r":{"2":"(a) ko uniform velocity likh diya.","3":"(a) me constant acceleration daal diya.","0":"(b) me zero acceleration likh diya."},"t":"Graph ka type pehle dekho (kaun sa graph), phir uska meaning.","w":"","fig":null,"sim":null},{"id":185,"q":"Match the situations in Column I with the times in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$ and neglect air resistance.\nColumn I: (a) A body projected vertically upward with u = $30\\ \\mathrm{m\\,s^{-1}}$; total time of flight (b) A body released from rest from a height of $45\\ \\mathrm{m}$; time to reach the ground (c) A body projected vertically upward with u = $40\\ \\mathrm{m\\,s^{-1}}$; time to reach the highest point (d) A body released from rest from a height of $125\\ \\mathrm{m}$; time to reach the ground\nColumn II: (i) $3\\ \\mathrm{s}$ (ii) $4\\ \\mathrm{s}$ (iii) $5\\ \\mathrm{s}$ (iv) $6\\ \\mathrm{s}$","opt":["a-iv, b-i, c-ii, d-iii","a-i, b-ii, c-iii, d-iv","a-ii, b-iv, c-i, d-iii","a-iii, b-ii, c-iv, d-i"],"ans":0,"c":"Total flight $=2u/g$; ascent time $=u/g$; free fall $h=\\tfrac12gt^2$.","m":"Chaar cases me kaun sa formula, ye pehle tay karo.","s":["(a) $2(30)/10=6$ s → iv.","(b) $45=5t^2\\Rightarrow3$ s → i.","(c) $40/10=4$ s → ii.","(d) $125=5t^2\\Rightarrow5$ s → iii.","Isliye a-iv, b-i, c-ii, d-iii → option (A)."],"r":{"1":"(a) me $3\\ \\mathrm{s}$ likh diya (ascent time samajh liya).","2":"(a) me $4\\ \\mathrm{s}$ likh diya.","3":"(a) me $5\\ \\mathrm{s}$ likh diya."},"t":"Total flight aur ascent time me 2 ka factor hai — yahi sabse common galti hai.","w":"","fig":null,"sim":null},{"id":186,"q":"Match the position-time relations in Column I with the velocities at t = $1\\ \\mathrm{s}$ in Column II. Here x is in metre and t is in second.\nColumn I: (a) x = 5$t^{2}$ (b) x = 3t + 2 (c) x = 2$t^{3}$ (d) x = 8 − 4$t^{2}$\nColumn II: (i) $3\\ \\mathrm{m\\,s^{-1}}$ (ii) $6\\ \\mathrm{m\\,s^{-1}}$ (iii) $10\\ \\mathrm{m\\,s^{-1}}$ (iv) −$8\\ \\mathrm{m\\,s^{-1}}$","opt":["a-iii, b-i, c-ii, d-iv","a-i, b-iii, c-iv, d-ii","a-ii, b-i, c-iii, d-iv","a-iv, b-ii, c-i, d-iii"],"ans":0,"c":"Har relation ka derivative lo, t = 1 daalo.","m":"Chaar derivatives ek saath likh lo, phir match karo.","s":["(a) $v=10t\\Rightarrow10$ → iii.","(b) $v=3\\Rightarrow3$ → i.","(c) $v=6t^2\\Rightarrow6$ → ii.","(d) $v=-8t\\Rightarrow-8$ → iv.","Isliye a-iii, b-i, c-ii, d-iv → option (A)."],"r":{"1":"(a) me 3 daal diya (b ka answer).","2":"(a) me 6 daal diya (c ka answer).","3":"(a) me −8 daal diya (d ka answer)."},"t":"Derivative ke baad hi t daalo — pehle t daalna sabse badi galti hai.","w":"","fig":null,"sim":null},{"id":187,"q":"Match the quantities in Column I with their expressions in Column II. The motion is uniformly accelerated along a straight line.\nColumn I: (a) Distance travelled in the nth second (b) Velocity after a time t (c) Stopping distance for a body moving with speed v and retardation a (d) Average velocity over an interval in which the velocity changes from u to v\nColumn II: (i) u + at (ii) u + a(2n − 1)/2 (iii) (u + v)/2 (iv) $v^{2}$/2a","opt":["a-ii, b-i, c-iv, d-iii","a-i, b-ii, c-iii, d-iv","a-iii, b-iv, c-i, d-ii","a-iv, b-iii, c-ii, d-i"],"ans":0,"c":"Chaar standard expressions: nth second, first equation, stopping distance, average velocity.","m":"Har expression ka dimension dekho — (iv) distance hai, (iii) velocity hai.","s":["(a) → ii.","(b) → i.","(c) $v^2/2a$ → iv.","(d) $(u+v)/2$ → iii.","Isliye a-ii, b-i, c-iv, d-iii → option (A)."],"r":{"1":"(a) me v = u + at daal diya.","2":"(a) me average velocity daal diya.","3":"(a) me stopping distance daal diya."},"t":"Expression match me dimension check sabse fast trick hai.","w":"","fig":null,"sim":null},{"id":188,"q":"Match the situations in Column I with the distances covered in Column II. Take g = $10\\ \\mathrm{m\\,s^{-2}}$.\nColumn I: (a) A body starting from rest with a = $2\\ \\mathrm{m\\,s^{-2}}$; distance covered in the 3rd second (b) A body starting from rest with a = $2\\ \\mathrm{m\\,s^{-2}}$; distance covered in $4\\ \\mathrm{s}$ (c) A body with u = $10\\ \\mathrm{m\\,s^{-1}}$ and a = −$2\\ \\mathrm{m\\,s^{-2}}$; distance covered in the first $3\\ \\mathrm{s}$ (d) A body projected vertically upward with u = $20\\ \\mathrm{m\\,s^{-1}}$; total distance covered during its flight\nColumn II: (i) $5\\ \\mathrm{m}$ (ii) $16\\ \\mathrm{m}$ (iii) $21\\ \\mathrm{m}$ (iv) $40\\ \\mathrm{m}$","opt":["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-iii, b-iv, c-i, d-ii","a-iv, b-iii, c-ii, d-i"],"ans":0,"c":"Nth second ke liye $S_n$, total ke liye $s=\\tfrac12at^2$, retardation me $s=ut+\\tfrac12at^2$, aur vertical throw me distance = 2H.","m":"Chaar cases, chaar chhote calculations.","s":["(a) $S_3=\\tfrac22(5)=5$ m → i.","(b) $s=\\tfrac12(2)(16)=16$ m → ii.","(c) $s=10(3)-\\tfrac12(2)(9)=30-9=21$ m → iii.","(d) $2H=2\\times\\dfrac{400}{20}=40$ m → iv.","Isliye a-i, b-ii, c-iii, d-iv → option (A)."],"r":{"1":"(a) me 16 daal diya (b ka answer).","2":"(a) me 21 daal diya (c ka answer).","3":"(a) me 40 daal diya (d ka answer)."},"t":"Vertical throw me total distance 2H hota hai — displacement 0, distance 2H.","w":"","fig":null,"sim":null},{"id":189,"q":"Assertion: For a body moving with constant acceleration along a straight line, the average velocity over any time interval is equal to the arithmetic mean of its initial and final velocities for that interval.\nReason: The velocity-time graph of a body moving with constant acceleration is a straight line, so the average of the velocity over the interval equals its value at the midpoint of the interval in time.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"v–t straight line ka area trapezium hota hai, isliye average velocity = (u + v)/2. Yehi reason assertion ko explain karta hai.","m":"Graph-based reason ko assertion se jodo.","s":["A true: (u + v)/2.","R true: straight line → midpoint value = average.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"(u + v)/2 sirf constant acceleration me hi average velocity hoti hai.","w":"","fig":null,"sim":null},{"id":190,"q":"Assertion: The relative velocity of two bodies moving with the same velocity is zero.\nReason: Relative velocity depends on the frame of reference in which it is measured.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":1,"c":"Same velocity → v − v = 0 (assertion sach). Frame dependence bhi sach hai, par ye zero hone ka kaaran nahi hai — kaaran dono velocities ka barabar hona hai.","m":"Reason sach hai par assertion ka direct explanation nahi hai.","s":["A true: v − v = 0.","R true: relative velocity frame par depend karti hai.","Par R se zero hona nahi nikalta → option (B)."],"r":{"0":"Reason sirf frame ki baat karta hai, zero hone ki wajah nahi batata.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"A-R me 'related but not explanatory' case ko pehchano — (B) option isi ke liye hai.","w":"","fig":null,"sim":null},{"id":191,"q":"Assertion: For a body projected vertically upward, the time of ascent is equal to the time of descent when air resistance is neglected.\nReason: The acceleration of the body is g during the ascent and less than g during the descent.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":2,"c":"Air resistance na ho to a = g dono phases me — isliye times barabar. Reason galat hai kyunki descent me bhi g hi hai.","m":"Reason me 'less than g' likha hai — ye air resistance wale case ki baat hai.","s":["A true: times barabar.","R false: descent me bhi a = g.","True assertion + false reason → option (C)."],"r":{"0":"Reason galat hai.","1":"Reason galat hai, isliye B bhi nahi.","3":"Assertion sach hai."},"t":"Air resistance na ho to ascent aur descent ka acceleration same g hota hai.","w":"","fig":null,"sim":null},{"id":192,"q":"Assertion: A body moving along a straight line with a constant speed of $5\\ \\mathrm{m\\,s^{-1}}$ has zero acceleration.\nReason: The velocity of a body is a vector, and a body moving with constant speed in a fixed direction has a velocity that does not change with time.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"1D me direction fixed hoti hai, isliye constant speed = constant velocity = zero acceleration.","m":"Reason me 'fixed direction' likha hai — yahi 1D ka key point hai.","s":["A true: a = 0.","R true: velocity vector change nahi hota.","R hi A ka explanation hai → option (A)."],"r":{"1":"Reason direct explanation hai.","2":"Reason sach hai.","3":"Assertion sach hai."},"t":"2D/3D me constant speed par bhi acceleration ho sakta hai (direction badalne se) — 1D me nahi.","w":"","fig":null,"sim":null},{"id":193,"q":"Assertion: If the speed of a car is doubled, its total stopping distance becomes more than two times but less than four times, when the reaction time of the driver is not zero.\nReason: The distance travelled during the reaction time is proportional to the speed while the braking distance is proportional to the square of the speed.","opt":["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.","Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.","The Assertion is true but the Reason is false.","The Assertion is false but the Reason is true."],"ans":0,"c":"Total = v·t(r) + $v^{2}$/2a. Ek hissa 2× hota hai, dusra 4× — isliye total 2× aur 4× ke beech rehta hai.","m":"Dono terms alag-alag socho, phir total ka range nikalo.","s":["A true
