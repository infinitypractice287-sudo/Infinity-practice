rtonic hai aur paani P se Q me jayega.","w":["P hypertonic nahi hai, usme particles kam hain.","Dono isotonic nahi hain ($0.1$ vs $0.2$ effective).","Solute membrane se pass nahi hota; sirf solvent pass hota hai."],"t":"Effective concentration = $i \\times C$. Osmosis ka direction hamesha 'kam particles se zyada particles' ki taraf hota hai."},{"id":51,"c":"Concentration terms","q":"The molarity of a solution prepared by dissolving $5.85\\,\\mathrm{g}$ of $\\ce{NaCl}$ (molar mass $58.5\\,\\mathrm{g\\,mol^{-1}}$) in enough water to make $500\\,\\mathrm{mL}$ of solution is","opt":["$0.2\\,\\mathrm{M}$","$1.0\\,\\mathrm{M}$","$0.5\\,\\mathrm{M}$","$0.1\\,\\mathrm{M}$"],"ans":0,"cpt":"Molarity $= \\dfrac{\\text{moles of solute}}{\\text{volume of solution in L}}$. Volume solution ka hota hai, paani ka nahi.","m":"Pehle moles nikaalo ($w/M$), phir volume se divide karo (mL ko L me badlo).","s":["$n = \\dfrac{5.85}{58.5} = 0.1\\,\\mathrm{mol}$.","$V = 500\\,\\mathrm{mL} = 0.5\\,\\mathrm{L}$.","$M = \\dfrac{0.1}{0.5} = 0.2\\,\\mathrm{M}$."],"r":"$5.85/58.5 = 0.1$ mol ko $0.5$ L se divide karne par $0.2\\,\\mathrm{M}$ milti hai.","w":["$1.0\\,\\mathrm{M}$ bilkul galat hai.","$0.5\\,\\mathrm{M}$ galat arithmetic se aata hai.","$0.1\\,\\mathrm{M}$ tab aata agar volume 1 L hota."],"t":"mL se L me badalna kabhi mat bhoolna: $500\\,\\mathrm{mL} = 0.5\\,\\mathrm{L}$."},{"id":52,"c":"Concentration terms","q":"A glucose solution is labelled as $10\\%$ w/w (molar mass of glucose $= 180\\,\\mathrm{g\\,mol^{-1}}$). The molality of this solution is nearly","opt":["$0.100\\,\\mathrm{m}$","$0.556\\,\\mathrm{m}$","$0.617\\,\\mathrm{m}$","$0.111\\,\\mathrm{m}$"],"ans":2,"cpt":"$10\\%$ w/w ka matlab $100\\,\\mathrm{g}$ solution me $10\\,\\mathrm{g}$ solute, isliye solvent $= 90\\,\\mathrm{g} = 0.090\\,\\mathrm{kg}$. Molality solute ke moles ko solvent ke mass se divide karke milti hai.","m":"w/w se solvent ka mass nikaalo (100 $-$ solute), phir molality lagao.","s":["$100\\,\\mathrm{g}$ solution me glucose $= 10\\,\\mathrm{g}$, paani $= 100-10 = 90\\,\\mathrm{g} = 0.09\\,\\mathrm{kg}$.","$n = \\dfrac{10}{180} = 0.0556\\,\\mathrm{mol}$.","$m = \\dfrac{0.0556}{0.09} = 0.617\\,\\mathrm{m}$."],"r":"$0.0556$ mol ko $0.090\\,\\mathrm{kg}$ solvent se divide karne par $0.617\\,\\mathrm{m}$ aata hai.","w":["$0.100$ kisi aur data se aata hai.","$0.556$ tab aata agar solvent $0.1\\,\\mathrm{kg}$ hota.","$0.111$ mass % ko 100 se divide karne ki galti hai."],"t":"w/w se molality me denominator hamesha solvent ka mass hota hai ($100 - $ solute), solution ka nahi. Ye sabse common trap hai."},{"id":53,"c":"Concentration terms","q":"The mole fraction of water in a mixture of $46\\,\\mathrm{g}$ of ethanol ($\\ce{C2H5OH}$, molar mass $46\\,\\mathrm{g\\,mol^{-1}}$) and $180\\,\\mathrm{g}$ of water (molar mass $18\\,\\mathrm{g\\,mol^{-1}}$) is","opt":["$0.900$","$0.091$","$0.909$","$0.100$"],"ans":2,"cpt":"Mole fraction $= \\dfrac{n_{\\text{water}}}{n_{\\text{water}}+n_{\\text{ethanol}}}$. Masses ko moles me badalna zaroori hai.","m":"Dono ke moles nikaalo, phir water ke moles ko total se divide karo.","s":["$n_{\\text{ethanol}} = 46/46 = 1\\,\\mathrm{mol}$.","$n_{\\text{water}} = 180/18 = 10\\,\\mathrm{mol}$.","$x_{\\text{water}} = \\dfrac{10}{10+1} = 0.909$."],"r":"Water ke $10$ mol aur ethanol ke $1$ mol, isliye $x_{\\text{water}} = 10/11 = 0.909$.","w":["$0.900$ ratio galat liya gaya hai.","$0.091$ ethanol ka mole fraction hai.","$0.100$ galat calculation hai."],"t":"Mole fraction hamesha moles se, mass se nahi. Aur dono fractions ka sum 1 hota hai ($0.091+0.909=1$)."},{"id":54,"c":"Henry's law","q":"At a given temperature, the Henry's law constant for a gas in water is $3.2\\,\\mathrm{bar}$. If the partial pressure of the gas above the solution is $0.8\\,\\mathrm{bar}$, the mole fraction of the gas dissolved in water is","opt":["$0.25$","$0.40$","$2.50$","$4.00$"],"ans":0,"cpt":"Henry's law: $p = K_H x$, isliye $x = \\dfrac{p}{K_H}$. $K_H$ jitna bada, solubility utni kam.","m":"Formula directly apply karo: $x = p/K_H$.","s":["Given: $K_H = 3.2\\,\\mathrm{bar}$ aur $p = 0.8\\,\\mathrm{bar}$.","$x = \\dfrac{p}{K_H} = \\dfrac{0.8}{3.2}$.","$x = 0.25$.","Sahi option A: $x = 0.25$."],"r":"$0.8/3.2 = 0.25$ — yahi dissolve gas ka mole fraction hai.","w":["$0.40$ ratio ko galat simplify karne se aata hai.","$2.50$ ulta ratio ($K_H/p$) hai.","$4.00$ bhi ulta ratio hai."],"t":"$x = p/K_H$ — yahan $x$ chhota hota hai, isliye $K_H$ bada ho to solubility kam. Ulti division se bacho."},{"id":55,"c":"Raoult's law","q":"At a given temperature, the vapour pressure of pure liquid A is $200\\,\\mathrm{mm\\,Hg}$ and that of pure liquid B is $100\\,\\mathrm{mm\\,Hg}$. For a liquid mixture of A and B having mole fraction of A equal to $0.3$ and obeying Raoult's law, the total vapour pressure is","opt":["$100\\,\\mathrm{mm\\,Hg}$","$130\\,\\mathrm{mm\\,Hg}$","$150\\,\\mathrm{mm\\,Hg}$","$170\\,\\mathrm{mm\\,Hg}$"],"ans":1,"cpt":"Raoult's law: $p = p_A^{\\circ}x_A + p_B^{\\circ}x_B$, jahan $x_A+x_B = 1$.","m":"$x_A = 0.3$ diya hai, isliye $x_B = 0.7$ nikaalo aur dono partial pressures jodo.","s":["$x_A = 0.3$, isliye $x_B = 1-0.3 = 0.7$.","$p_A = 200 \\times 0.3 = 60\\,\\mathrm{mm\\,Hg}$.","$p_B = 100 \\times 0.7 = 70\\,\\mathrm{mm\\,Hg}$.","$p_{\\text{total}} = 60+70 = 130\\,\\mathrm{mm\\,Hg}$."],"r":"$p_{\\text{total}} = 60+70 = 130\\,\\mathrm{mm\\,Hg}$.","w":["$100$ sirf pure B ka vapour pressure hai.","$150$ tab aata agar mole fractions equal hote.","$170$ doosre mole fraction ke saath aata."],"t":"$x_A$ diya ho to $x_B = 1-x_A$ likhna pehla step hai — yahan sabse zyada galti hoti hai."},{"id":56,"c":"Vapour pressure","q":"A solution contains $0.1\\,\\mathrm{mol}$ of a non-volatile solute and $0.9\\,\\mathrm{mol}$ of a volatile solvent. The relative lowering of vapour pressure of this solution is","opt":["$0.01$","$0.09$","$0.10$","$0.90$"],"ans":2,"cpt":"Non-volatile solute ke liye $\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2 = \\dfrac{n_2}{n_1+n_2}$.","m":"Solute ke moles ko total moles se divide karo.","s":["$n_2 = 0.1$, $n_1 = 0.9$.","$x_2 = \\dfrac{0.1}{0.1+0.9} = 0.1$.","Relative lowering $= 0.1$."],"r":"Relative lowering $= x_2 = 0.1$.","w":["$0.01$ galat ratio hai.","$0.09$ $0.1\\times0.9$ jaisi galti se aata hai.","$0.90$ solvent ka mole fraction hai."],"t":"Relative lowering solute ke mole fraction ke equal hoti hai, solvent ke nahi. $0.9$ wala option yahi trap hai."},{"id":57,"c":"Elevation of boiling point","q":"The molal elevation constant of water is $0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$. The elevation in boiling point of a $0.1$ molal aqueous glucose solution is","opt":["$0.026\\,\\mathrm{K}$","$0.052\\,\\mathrm{K}$","$0.52\\,\\mathrm{K}$","$5.2\\,\\mathrm{K}$"],"ans":1,"cpt":"$\\Delta T_b = K_b m$ (non-electrolyte ke liye $i = 1$).","m":"Seedha formula lagao: $K_b$ ko molality se multiply karo.","s":["Given: $K_b = 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$, glucose ka $i = 1$, $m = 0.1\\,\\mathrm{mol\\,kg^{-1}}$.","$\\Delta T_b = K_b m = 0.52 \\times 0.1$.","$\\Delta T_b = 0.052\\,\\mathrm{K}$.","Sahi option B: $0.052\\,\\mathrm{K}$."],"r":"$0.52 \\times 0.1 = 0.052\\,\\mathrm{K}$.","w":["$0.026$ galat multiplication hai.","$0.52$ to 1 molal solution ke liye hota hai.","$5.2$ decimal ki galti hai."],"t":"$K_b$ ki definition hi ye hai: 1 molal solution ka elevation. Isliye $0.1$ molal par $K_b$ ka 0.1 guna."},{"id":58,"c":"Depression of freezing point","q":"The molal depression constant of water is $1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$. The depression in freezing point of a $0.5$ molal aqueous urea solution is","opt":["$0.186\\,\\mathrm{K}$","$0.372\\,\\mathrm{K}$","$0.930\\,\\mathrm{K}$","$3.72\\,\\mathrm{K}$"],"ans":2,"cpt":"$\\Delta T_f = K_f m$; urea non-electrolyte hai isliye $i = 1$.","m":"$1.86 \\times 0.5$ karo.","s":["Given: $K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$, urea ka $i = 1$, $m = 0.5\\,\\mathrm{mol\\,kg^{-1}}$.","$\\Delta T_f = K_f m = 1.86 \\times 0.5$.","$\\Delta T_f = 0.93\\,\\mathrm{K}$.","Sahi option C: $0.930\\,\\mathrm{K}$."],"r":"$1.86 \\times 0.5 = 0.93\\,\\mathrm{K}$.","w":["$0.186$ 0.1 molal ke liye hota.","$0.372$ 0.2 molal ke liye hota.","$3.72$ 2 molal ke liye hota."],"t":"$K_f$ aur $K_b$ sirf solvent ke constants hain — solute badalne se nahi badalte."},{"id":59,"c":"Osmotic pressure","q":"The osmotic pressure of a $0.1\\,\\mathrm{M}$ aqueous glucose solution at $300\\,\\mathrm{K}$, taking $R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$, is nearly","opt":["$0.246\\,\\mathrm{atm}$","$1.23\\,\\mathrm{atm}$","$2.46\\,\\mathrm{atm}$","$24.6\\,\\mathrm{atm}$"],"ans":2,"cpt":"$\\pi = CRT$ (glucose ke liye $i = 1$).","m":"Values directly multiply karo; $T$ kelvin me hona chahiye.","s":["$\\pi = 0.1 \\times 0.0821 \\times 300$.","$0.0821 \\times 300 = 24.63$.","$\\pi = 0.1 \\times 24.63 = 2.463\\,\\mathrm{atm}$."],"r":"$\\pi = 2.463 \\approx 2.46\\,\\mathrm{atm}$.","w":["$0.246$ 0.01 M ke liye hota.","$1.23$ 0.05 M ke liye hota.","$24.6$ tab aata agar $C = 1$ ho."],"t":"$RT$ ka value 300 K par $\\approx 24.6\\,\\mathrm{L\\,atm\\,mol^{-1}}$ hota hai — yaad rakhne se calculation fast hoti hai."},{"id":60,"c":"van't Hoff factor","q":"Assuming complete dissociation, the van't Hoff factor of $\\ce{K3[Fe(CN)6]}$ in dilute aqueous solution is","opt":["$5$","$3$","$2$","$4$"],"ans":3,"cpt":"$\\ce{K3[Fe(CN)6]}$ ek complex salt hai: bahar ke $3\\ce{K+}$ ions alag hote hain aur $\\ce{[Fe(CN)6]^{3-}}$ ek hi particle rehta hai.","m":"Dissociation equation likho aur particles gino.","s":["$\\ce{K3[Fe(CN)6] -> 3K+ + [Fe(CN)6]^{3-}}$.","Particles: 3 potassium ions + 1 complex ion = 4.","Isliye $i = 4$."],"r":"Ek formula unit se 4 particles bante hain, isliye $i = 4$.","w":["$5$ $\\ce{K4[Fe(CN)6]}$ ke liye hota hai.","$3$ sirf $\\ce{K+}$ ions ginne se aata hai.","$2$ ions wale salt ke liye hota hai."],"t":"Complex ion ke andar ke ligands/central atom alag particles nahi bante. Sirf coordination sphere ke bahar ke ions count karo."},{"id":61,"c":"Colligative properties","q":"Among the following $0.1\\,\\mathrm{M}$ aqueous solutions, the one having the highest osmotic pressure at the same temperature, assuming complete dissociation, is","opt":["glucose","$\\ce{NaCl}$","$\\ce{CaCl2}$","$\\ce{Al2(SO4)3}$"],"ans":3,"cpt":"$\\pi = iCRT$: same $C$ aur $T$ par jiska van't Hoff factor bada, uska osmotic pressure zyada.","m":"Har solute ke ions gino aur $i$ compare karo.","s":["Glucose: $i=1$.","$\\ce{NaCl} \\rightarrow 2$ ions: $i=2$.","$\\ce{CaCl2} \\rightarrow 3$ ions: $i=3$.","$\\ce{Al2(SO4)3} \\rightarrow 2\\ce{Al^{3+}} + 3\\ce{SO4^{2-}} = 5$ ions: $i=5$.","Sabse zyada $i = 5$ hai, isliye $\\ce{Al2(SO4)3}$ ka $\\pi$ highest."],"r":"$\\ce{Al2(SO4)3}$ se 5 ions bante hain, isliye uska osmotic pressure sabse zyada hai.","w":["Glucose ka $i=1$ sabse kam hai.","$\\ce{NaCl}$ ka $i=2$ sirf.","$\\ce{CaCl2}$ ka $i=3$, $\\ce{Al2(SO4)3}$ se kam."],"t":"Salt ka formula dekho aur ions gino: $\\ce{Al2(SO4)3}$ jaise salts sabse zyada colligative effect dete hain (isliye alum water treatment me use hota hai)."},{"id":62,"c":"Colligative properties","q":"The SI-type unit of the molal elevation constant (ebullioscopic constant) of a solvent is","opt":["$\\mathrm{K\\,mol^{-1}}$","$\\mathrm{kg\\,mol^{-1}}$","$\\mathrm{K\\,kg^{-1}\\,mol}$","$\\mathrm{K\\,kg\\,mol^{-1}}$"],"ans":3,"cpt":"$\\Delta T_b = K_b m$ se $K_b = \\dfrac{\\Delta T_b}{m}$. $\\Delta T_b$ ka unit K aur molality ka unit $\\mathrm{mol\\,kg^{-1}}$ hai.","m":"Unit nikalne ke liye formula ko rearrange karo aur units divide karo.","s":["$K_b = \\dfrac{\\Delta T_b}{m}$.","$\\Delta T_b$ ka unit K, $m$ ka unit $\\mathrm{mol\\,kg^{-1}}$.","Isliye $K_b$ ka unit $\\mathrm{K\\,kg\\,mol^{-1}}$."],"r":"K ko $\\mathrm{mol\\,kg^{-1}}$ se divide karne par $\\mathrm{K\\,kg\\,mol^{-1}}$ milta hai.","w":["$\\mathrm{K\\,mol^{-1}}$ me kg missing hai.","$\\mathrm{K\\,kg^{-1}\\,mol}$ me kg ka sign galat hai.","$\\mathrm{kg\\,mol^{-1}}$ me K missing hai."],"t":"$K_b$ aur $K_f$ dono ka same unit hota hai: $\\mathrm{K\\,kg\\,mol^{-1}}$. Ye NEET me frequently puchha jata hai."},{"id":63,"c":"Concentration terms","q":"Statement I: The molarity of a solution decreases when the solution is heated, assuming no solute is lost. Statement II: The molality of the same solution also decreases when the solution is heated.","opt":["Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct"],"ans":2,"cpt":"Heating par solution ka volume badhta hai. Molarity $= n/V$, isliye molarity ghat ti hai. Molality mass par based hai, isliye constant rehti hai.","m":"Dono statements ko alag-alag test karo: molarity (volume-based) aur molality (mass-based).","s":["Volume badhne se molarity ghat ti hai — Statement I sahi.","Molality mass of solvent par based hai, isliye heating se nahi badalti — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"Molarity volume par depend karti hai isliye ghat ti hai, par molality mass par depend karti hai isliye constant rehti hai.","w":["Statement II galat hai.","Statement I galat nahi hai.","Statement I sahi hai."],"t":"Rule: mass-based terms (molality, mole fraction, mass %) heating par constant; volume-based terms (molarity, normality, % w/v) badalte hain."},{"id":64,"c":"Concentration terms","q":"Statement I: A $1$ molal aqueous solution contains $1$ mole of the solute dissolved in $1\\,\\mathrm{kg}$ of the solution. Statement II: The mole fraction of the solute in a $1$ molal aqueous solution of a non-electrolyte is less than $0.02$.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"1 molal = 1 mole solute in 1 kg solvent (solution me nahi). Aur aqueous 1 molal solution me $1$ mol solute ke saath $1000/18 = 55.5$ mol water hota hai.","m":"Definition check karo, phir mole fraction calculate karo.","s":["Statement I galat hai: 1 kg solvent me 1 mole, 1 kg solution me nahi.","$x_2 = \\dfrac{1}{1+55.5} = 0.0177$.","$0.0177 < 0.02$, isliye Statement II sahi hai."],"r":"Statement I me 'solution' likha hai jo galat hai (solvent hona chahiye), par Statement II ka calculation sahi hai.","w":["Statement I galat hai.","Statement II galat nahi hai — $0.0177 < 0.02$.","Statement II sahi hai."],"t":"1 molal aqueous solution ka mole fraction hamesha $1/56.5 \\approx 0.0177$ hota hai — ye number yaad rakho."},{"id":65,"c":"Raoult's law","q":"Statement I: For an ideal solution of two volatile liquids, the plot of total vapour pressure against the mole fraction of one component in the liquid phase is a straight line. Statement II: For an ideal solution, $\\Delta H_{\\text{mix}} = 0$ and $\\Delta V_{\\text{mix}} = 0$.","opt":["Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct"],"ans":2,"cpt":"Raoult's law $p = p_1^{\\circ}x_1 + p_2^{\\circ}x_2$ linear hai, isliye ideal solution ka $p$ vs $x$ graph straight line hota hai. Ideal solution me enthalpy aur volume change zero hote hain.","m":"Dono statements NCERT ke facts hain; verify karke 'both correct' choose karo.","s":["$p = p_1^{\\circ} + (p_2^{\\circ}-p_1^{\\circ})x_2$ — ye $x$ me linear hai, isliye straight line — Statement I sahi.","Ideal solution me $\\Delta H = 0$, $\\Delta V = 0$ — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain: linear plot Raoult's law se aata hai aur ideal solution ki thermodynamic condition bhi sahi di gayi hai.","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi hai."],"t":"Ideal solution ka $p$–$x$ graph seedhi line; non-ideal me line se upar (positive) ya neeche (negative) curve banta hai."},{"id":66,"c":"Colligative properties","q":"Statement I: At a given temperature, the vapour pressure of an aqueous glucose solution is less than that of pure water. Statement II: The boiling point of this glucose solution is lower than that of pure water at the same external pressure.","opt":["Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct"],"ans":0,"cpt":"Non-volatile solute dalne par vapour pressure ghat ta hai. Isi wajah se solution ka boiling point badhta hai aur freezing point ghat ta hai.","m":"Statement I sahi hai (standard colligative effect). Statement II me direction galat hai.","s":["Glucose non-volatile hai, isliye vapour pressure kam hota hai — Statement I sahi.","Vapour pressure kam hai, isliye atmospheric pressure tak pahunchne ke liye zyada temperature chahiye.","Isliye boiling point badhta hai, ghat ta nahi — Statement II galat."],"r":"Statement I sahi hai, par boiling point ghat ne ke bajaye badhta hai, isliye Statement II incorrect hai.","w":["Statement I sahi hai, isliye 'both incorrect' galat.","Statement II galat hai.","Statement I sahi hai."],"t":"Ek hi reason se chaar effects nikalte hain: $p\\downarrow \\Rightarrow T_b\\uparrow$, $T_f\\downarrow$, $\\pi\\uparrow$."},{"id":67,"c":"Solubility of gases","q":"Statement I: Aquatic species are more comfortable in cold water than in warm water. Statement II: The solubility of oxygen in water decreases with increase in temperature at constant partial pressure of oxygen.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"Oxygen ki solubility low temperature par zyada hoti hai. Cold water me dissolved oxygen zyada hota hai, isliye aquatic species wahan aaram se saans le paati hain.","m":"Statement II NCERT ka fact hai; Statement I usi ka application hai.","s":["Oxygen ka dissolution exothermic hai, isliye heating par solubility ghat ti hai — Statement II sahi.","Cold water me zyada dissolved oxygen hota hai — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain aur dono ek hi phenomenon (temperature vs gas solubility) ko describe karti hain.","w":["Dono sahi hain.","Statement II galat nahi — ye NCERT ki line hai.","Statement I galat nahi."],"t":"Thermal pollution se paani garam hota hai, dissolved oxygen kam hota hai — isliye fish marte hain. Ye NEET ka application question hai."},{"id":68,"c":"Colligative properties","q":"Statement I: Colligative properties depend on the nature of the solute particles present in the solution. Statement II: A $0.1\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ solution and a $0.1\\,\\mathrm{m}$ aqueous urea solution have the same osmotic pressure at the same temperature.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":3,"cpt":"Colligative properties sirf particle ki sankhya par depend karti hain, nature par nahi. Aur $\\ce{NaCl}$ do ions deta hai jabki urea ek particle, isliye same molality par unke colligative effects barabar nahi hote.","m":"Dono statements ko basic definition se test karo.","s":["Colligative properties nature par nahi, number par depend karti hain — Statement I galat.","$\\ce{NaCl}$ ka $i=2$, urea ka $i=1$, isliye $\\pi$ barabar nahi — Statement II galat.","Dono galat hain."],"r":"Dono statements incorrect hain: nature ka role nahi hota, aur $\\ce{NaCl}$/urea ka particle number alag hone se colligative effects alag hote hain.","w":["Statement I galat hai.","Statement II bhi galat hai.","Statement I galat hai."],"t":"Trap: 'same molality = same colligative property' sirf non-electrolytes ke liye sahi hai. Electrolyte ke liye $i$ se multiply karo."},{"id":69,"c":"Non-ideal solutions","q":"Statement I: A mixture of chloroform and acetone shows positive deviation from Raoult's law. Statement II: Hydrogen bonding between chloroform and acetone molecules lowers the vapour pressure of the mixture below the value predicted by Raoult's law.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Chloroform ke H aur acetone ke O ke beech H-bond banne se A-B interaction strong ho jati hai, isliye vapour pressure ghat ta hai — yani negative deviation.","m":"Statement I me deviation ka sign galat hai; Statement II me effect sahi describe hua hai.","s":["Chloroform-acetone ke beech H-bond banta hai.","Strong interaction se vapour pressure Raoult's law se kam hota hai — Statement II sahi.","Kam vapour pressure matlab negative deviation, isliye Statement I galat."],"r":"Statement II sahi hai; usi ka result negative deviation hai, positive nahi.","w":["Statement I galat hai.","Statement II galat nahi hai.","Statement II sahi hai."],"t":"Ek line me: H-bond banana = negative deviation; H-bond tootna = positive deviation."},{"id":70,"c":"Osmotic pressure","q":"Statement I: Osmotic pressure is used to determine the molar mass of biological macromolecules such as proteins, which are denatured at higher temperatures. Statement II: The measurement of osmotic pressure requires the solution to be heated up to its boiling point.","opt":["Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect"],"ans":3,"cpt":"Osmotic pressure room temperature par measure kiya ja sakta hai, isliye proteins/polymers ke liye best method hai. Boiling point elevation ke liye solution ko garam karna padta hai, jo protein ke liye nuksaandeh hai.","m":"Statement II me 'boiling point tak garam karna' likha hai — ye galat hai, osmotic pressure room temperature par measure hota hai.","s":["Proteins high temperature par denature ho jate hain, isliye osmotic pressure (room temperature) use karte hain — Statement I sahi.","Osmotic pressure ke liye heating ki zarurat nahi — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"Statement I sahi hai; osmotic pressure room temperature par measure hota hai, boiling point par nahi.","w":["Statement II galat hai.","Statement I galat nahi.","Statement I sahi hai."],"t":"Macromolecules ke liye order: osmotic pressure best, phir freezing point depression; boiling point elevation sabse kam suitable (decomposition ka risk)."},{"id":71,"c":"van't Hoff factor","q":"Statement I: The van't Hoff factor of $\\ce{K2SO4}$ in very dilute aqueous solution is close to $3$. Statement II: One formula unit of $\\ce{K2SO4}$ gives two $\\ce{K+}$ ions and one $\\ce{SO4^{2-}}$ ion in aqueous solution.","opt":["Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect"],"ans":1,"cpt":"$\\ce{K2SO4 -> 2K+ + SO4^{2-}}$: teen particles. Dilute solution me ions ke beech attraction kam ho jata hai, isliye $i$ theoretical value 3 ke qareeb pahunch jata hai.","m":"Dissociation equation likho aur ions gino.","s":["$\\ce{K2SO4 -> 2K+ + SO4^{2-}}$ — 3 ions, Statement II sahi.","Dilute solution me $i \\to 3$ — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; 3 ions ki wajah se $i \\approx 3$ hota hai.","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi hai."],"t":"Concentrated solution me ion pairing ki wajah se $i$ theoretical value se thoda kam hota hai."},{"id":72,"c":"Reverse osmosis","q":"Statement I: Reverse osmosis can be made to occur by applying a pressure on the solution side which is lower than the osmotic pressure of the solution. Statement II: In reverse osmosis, water molecules pass from the solution side to the pure solvent side through a semipermeable membrane.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct"],"ans":3,"cpt":"Osmosis ko ulta karne ke liye external pressure osmotic pressure se zyada chahiye. Tabhi paani solution side se pure solvent side jata hai.","m":"Condition yaad karo: $p_{\\text{applied}} > \\pi$. Statement I me 'lower' likha hai, jo galat hai.","s":["RO me applied pressure osmotic pressure se zyada hona chahiye — Statement I galat.","RO me paani solution side se pure water side jata hai — Statement II sahi.","Isliye Statement I incorrect, Statement II correct."],"r":"Statement I galat hai (pressure zyada chahiye), Statement II RO ki sahi definition hai.","w":["Statement I galat hai.","Statement II galat nahi hai.","Statement II sahi hai."],"t":"RO ka diagram yaad rakho: piston se pressure, paani membrane ke through pure side me nikalta hai, salt peeche reh jata hai."},{"id":73,"c":"Solubility of gases","q":"Which of the following statements is NOT correct?","opt":["When the cap of a soft drink bottle is opened, carbon dioxide escapes because the partial pressure of $\\ce{CO2}$ above the liquid falls.","Soft drinks are sealed under a high pressure of carbon dioxide to increase its solubility.","Scuba divers may suffer from bends because nitrogen dissolves in blood at high pressure and forms bubbles on decompression.","In scuba diving, a cylinder filled with ordinary air is used instead of a helium-oxygen mixture in order to avoid bends."],"ans":3,"cpt":"Deep sea diving me high pressure par nitrogen blood me zyada dissolve ho jata hai aur ascent par bubbles bana deta hai (bends). Isliye ordinary air ki jagah helium-oxygen mixture use hota hai, kyunki helium blood me bahut kam soluble hai.","m":"Divers wale option me direction check karo: bends se bachne ke liye air nahi, He-O₂ mixture use hota hai.","s":["Soft drinks high $\\ce{CO2}$ pressure par bharti hain — sahi.","Cap kholne par $\\ce{CO2}$ ka partial pressure girta hai, gas nikalti hai — sahi.","High pressure par $\\ce{N2}$ blood me ghulti hai, decompression par bubbles — sahi.","Bends se bachne ke liye He-O₂ mixture use hota hai, ordinary air nahi — ye statement galat."],"r":"Scuba diving me helium-oxygen mixture hi bends se bachata hai; ordinary air wali statement galat hai.","w":["Cap kholne par pressure kam hone se gas nikalna sahi hai.","Ye Henry's law ka sahi application hai.","Bends ka mechanism sahi likha hai."],"t":"He ki solubility N₂ se bahut kam hai — isliye He-O₂ mixture me bends ka risk kam hota hai."},{"id":74,"c":"Non-ideal solutions","q":"Which of the following liquid pairs shows positive deviation from Raoult's law?","opt":["Chloroform and acetone","Phenol and aniline","Acetone and aniline","Ethanol and water"],"ans":3,"cpt":"Positive deviation tab hoti hai jab A-B interactions pure components ke interactions se kamzor hon. Ethanol-water me ethanol ke H-bonds paani ke saath kamzor ho jate hain, isliye vapour pressure badh jata hai.","m":"Har pair me puchho: naya strong interaction (H-bond) ban raha hai ya purana toot raha hai?","s":["Chloroform-acetone: naya H-bond banta hai $\\rightarrow$ negative deviation.","Phenol-aniline: H-bond banta hai $\\rightarrow$ negative deviation.","Acetone-aniline: H-bond banta hai $\\rightarrow$ negative deviation.","Ethanol-water: H-bond toot ta hai $\\rightarrow$ positive deviation."],"r":"Ethanol-water me A-B interaction kamzor hoti hai, isliye vapour pressure Raoult's law se zyada hota hai — positive deviation.","w":["Chloroform-acetone negative deviation dikhata hai.","Phenol-aniline negative deviation dikhata hai.","Acetone-aniline bhi negative deviation dikhata hai."],"t":"Positive deviation ke NCERT examples: ethanol + water, ethanol + chloroform, benzene + methanol, $\\ce{CS2}$ + acetone."},{"id":75,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["The cryoscopic constant and the ebullioscopic constant are properties of the solvent only.","Osmotic pressure is suitable for determining the molar mass of proteins and polymers.","The value of $K_f$ of a solvent depends on the nature of the solute dissolved in it.","For dilute solutions, the depression in freezing point is directly proportional to the molality of the solution."],"ans":2,"cpt":"$K_f$ aur $K_b$ sirf solvent ki properties hain — solute ki nature se nahi badalte. Ye solvent ke boiling/freezing point aur enthalpy of fusion/vaporisation par depend karte hain.","m":"$K_f$ ki definition yaad karo: 1 molal non-electrolyte solution ka depression — solute ka naam matter nahi karta.","s":["$K_f$, $K_b$ solvent ke constants hain — sahi.","Dilute solution me $\\Delta T_f \\propto m$ — sahi.","Osmotic pressure proteins/polymers ke liye best hai — sahi.","$K_f$ solute ki nature par depend karta hai — galat statement."],"r":"$K_f$ ka value sirf solvent par depend karta hai, solute ki nature par nahi — isliye ye statement NOT correct hai.","w":["Ye sahi statement hai.","Osmotic pressure macromolecules ke liye sahi choice hai.","Ye bhi sahi hai (dilute solutions ke liye)."],"t":"Common trap: solute ki nature $i$ par depend karti hai, par $K_f$/$K_b$ par nahi."},{"id":76,"c":"van't Hoff factor","q":"Which of the following relations for the van't Hoff factor ($i$) is correct?","opt":["$i = \\text{normal molar mass} \\times \\text{observed molar mass}$","$i = \\dfrac{\\text{observed molar mass}}{\\text{normal molar mass}}$","$i = \\dfrac{\\text{normal molar mass}}{\\text{observed molar mass}}$","$i = \\dfrac{\\text{calculated colligative property}}{\\text{observed colligative property}}$"],"ans":2,"cpt":"Dissociation me observed molar mass kam aata hai (particles zyada), isliye $i > 1$ ke liye normal/observed karna padta hai. $i = \\dfrac{\\text{normal molar mass}}{\\text{observed molar mass}} = \\dfrac{\\text{observed colligative property}}{\\text{calculated colligative property}}$.","m":"Sign check karo: $\\ce{NaCl}$ ka observed molar mass $\\approx 29.25$, normal $58.5$, to $i = 2$ aana chahiye — isliye normal/observed.","s":["$\\ce{NaCl}$ ke liye: normal $= 58.5$, observed $\\approx 29.25$.","$58.5/29.25 = 2 = i$ — sahi relation.","Observed/calculated colligative property se bhi yahi $i$ milta hai."],"r":"$i = \\dfrac{\\text{normal molar mass}}{\\text{observed molar mass}}$ sahi relation hai.","w":["Ulta ratio 0.5 dega, jo galat hai.","Multiplication ka koi meaning nahi.","Colligative property me observed/calculated hota hai, calculated/observed nahi."],"t":"$i$ ka ek hi meaning: 'actual particles / expected particles'. Isliye $i > 1$ par observed molar mass chhota hota hai."},{"id":77,"c":"Reverse osmosis","q":"Which of the following statements about reverse osmosis is NOT correct?","opt":["It requires the application of a pressure greater than the osmotic pressure of the solution.","It is used for the desalination of sea water.","In this process, water flows from the solution side to the solvent side through a semipermeable membrane.","In this process, solute particles move through the semipermeable membrane along with the solvent."],"ans":3,"cpt":"RO me membrane solute ko rok ti hai aur sirf solvent ko pass karti hai. Isliye salt ions membrane ke through nahi jate.","m":"RO ka core: 'solvent ko force karke nikalna, solute ko rokna'.","s":["RO sea water desalination me use hota hai — sahi.","$p_{\\text{applied}} > \\pi$ chahiye — sahi.","Paani solution side se solvent side jata hai — sahi.","Solute membrane se pass nahi hota — ye statement galat."],"r":"RO me solute membrane se pass nahi hota, isliye 'solute along with solvent' wali statement galat hai.","w":["Pressure condition sahi likhi hai.","Desalination RO ka main application hai.","Flow direction sahi hai."],"t":"RO membrane semipermeable hoti hai: solvent ke liye permeable, ions ke liye impermeable."},{"id":78,"c":"Solubility of solids","q":"Which of the following statements about the solubility of solids in liquids is correct?","opt":["The solubility of every solid in a liquid is independent of temperature.","The solubility of $\\ce{NaCl}$ in water increases steeply with increase in temperature.","The solubility of $\\ce{Ce2(SO4)3}$ in water increases with increase in temperature.","The solubility of $\\ce{KNO3}$ in water increases markedly with increase in temperature."],"ans":3,"cpt":"Zyada solids ki solubility temperature ke saath badh ti hai (endothermic dissolution), par $\\ce{NaCl}$ ki solubility lagbhag constant rehti hai aur $\\ce{Ce2(SO4)3}$ ki ghat ti hai (exothermic dissolution).","m":"NCERT ke teen special examples yaad karo: $\\ce{KNO3}$ (steep increase), $\\ce{NaCl}$ (almost flat), $\\ce{Ce2(SO4)3}$ (decrease).","s":["$\\ce{KNO3}$ ki solubility temperature ke saath tezi se badh ti hai — sahi.","$\\ce{NaCl}$ ki solubility lagbhag temperature-independent hai — option galat.","$\\ce{Ce2(SO4)3}$ ki solubility ghat ti hai — option galat.","Har solid ke liye temperature independence galat hai."],"r":"$\\ce{KNO3}$ ki solubility temperature ke saath markedly badh ti hai — yahi sahi statement hai.","w":["Sabhi solids ke liye independent hona galat hai.","$\\ce{NaCl}$ ki solubility steeply nahi badh ti.","$\\ce{Ce2(SO4)3}$ ki solubility ghat ti hai."],"t":"Yaad rakho: $\\ce{Ce2(SO4)3}$ = decrease, $\\ce{NaCl}$ = almost flat, $\\ce{KNO3}$ = steep increase. NCERT ke teen graphs yahi hain."},{"id":79,"c":"Azeotropes","q":"Which of the following statements about azeotropic mixtures is correct?","opt":["A maximum boiling azeotrope boils at a temperature lower than the boiling points of both the pure components.","A minimum boiling azeotrope boils at a temperature lower than the boiling points of both the pure components.","An azeotropic mixture can be separated into its pure components by fractional distillation.","Azeotropes are formed only by solutions which obey Raoult's law over the whole concentration range."],"ans":1,"cpt":"Minimum boiling azeotrope ka boiling point dono pure components se kam hota hai (positive deviation ki wajah se). Maximum boiling azeotrope ka boiling point dono se zyada hota hai.","m":"Naam se hi direction yaad karo: 'minimum' ka matlab dono se kam.","s":["Minimum boiling azeotrope ka $T_b$ dono pure liquids se kam — sahi.","Maximum boiling azeotrope ka $T_b$ dono se zyada hota hai, kam nahi.","Azeotrope fractional distillation se separate nahi hota.","Azeotropes non-ideal solutions se bante hain (Raoult's law deviate karne par)."],"r":"Minimum boiling azeotrope dono components se kam temperature par boil karta hai — yahi sahi statement hai.","w":["Maximum boiling azeotrope ka $T_b$ zyada hota hai.","Azeotrope distillation se alag nahi hota.","Azeotrope non-ideal behaviour se banta hai."],"t":"Ethanol-water (minimum boiling, $78.15\\,^{\\circ}\\mathrm{C}$) aur $68\\%$ $\\ce{HNO3}$-water (maximum boiling, $120.5\\,^{\\circ}\\mathrm{C}$) — dono yaad rakho."},{"id":80,"c":"Osmotic pressure","q":"Which of the following statements about osmotic pressure is NOT correct?","opt":["Osmotic pressure is a colligative property.","The osmotic pressure of a given solution increases with increase in temperature.","The osmotic pressure of $0.1\\,\\mathrm{M}$ $\\ce{NaCl}$ is half the osmotic pressure of $0.1\\,\\mathrm{M}$ glucose at the same temperature.","Osmotic pressure can be measured at room temperature."],"ans":2,"cpt":"$\\ce{NaCl}$ ka $i = 2$ hai, isliye uska osmotic pressure glucose se dogna (double) hota hai, aadha nahi.","m":"$\\pi = iCRT$ me $i$ check karo: $\\ce{NaCl}$ ke liye 2, glucose ke liye 1.","s":["$\\pi \\propto T$ — temperature badhne par $\\pi$ badhta hai (sahi).","$\\ce{NaCl}$: $\\pi = 2CRT$; glucose: $\\pi = CRT$.","Yani $\\ce{NaCl}$ ka $\\pi$ double hai, half nahi — ye statement galat."],"r":"$\\ce{NaCl}$ ka osmotic pressure glucose ka double hota hai, isliye 'half' wali statement NOT correct hai.","w":["Osmotic pressure colligative property hai.","Temperature badhne par $\\pi$ badhta hai.","Room temperature par measurement possible hai."],"t":"$\\pi$ ka ratio = $i_1C_1 : i_2C_2$. Same $C$ par ratio sirf $i$ ka ratio hota hai."},{"id":81,"c":"Vapour pressure","q":"Which of the following statements is correct?","opt":["The relative lowering of vapour pressure depends on the nature of the solute.","The relative lowering of vapour pressure depends on the molar mass of the solute.","The relative lowering of vapour pressure is directly proportional to the volume of the solution.","For a dilute solution of a non-volatile solute, the relative lowering of vapour pressure is equal to the mole fraction of the solute."],"ans":3,"cpt":"Raoult's law se non-volatile solute ke liye $\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2$. Ye sirf mole fraction par depend karta hai, molar mass ya volume par nahi.","m":"Formula likho aur dekho ki RHS me kaun si quantity hai — wahi dependency hai.","s":["$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2$.","$x_2$ sirf mole fraction hai, koi mass ya volume term nahi.","Isliye sirf pehla statement sahi hai."],"r":"Relative lowering solute ke mole fraction ke barabar hoti hai — ek colligative relation.","w":["Nature par depend karta hai — galat, ye colligative property hai.","Molar mass to indirectly enter karta hai, par relative lowering ka expression $x_2$ hai.","Volume ka koi role nahi."],"t":"$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2$ — ye ek line poori chapter ka base hai."},{"id":82,"c":"Units","q":"Which of the following statements about units is NOT correct?","opt":["Both $K_b$ and $K_f$ have the unit $\\mathrm{K\\,kg\\,mol^{-1}}$.","Osmotic pressure has the unit of pressure.","Henry's law constant has the unit of pressure when solubility is expressed as mole fraction.","Molality has the unit $\\mathrm{mol\\,L^{-1}}$."],"ans":3,"cpt":"Molality mass of solvent par based hai, isliye uska unit $\\mathrm{mol\\,kg^{-1}}$ hota hai. $\\mathrm{mol\\,L^{-1}}$ molarity ka unit hai.","m":"Har term ka unit formula se derive karo.","s":["$K_b, K_f$ ka unit $\\mathrm{K\\,kg\\,mol^{-1}}$ — sahi.","$K_H = p/x$: dimension me pressure — sahi.","Osmotic pressure pressure hi hai — sahi.","Molality ka unit $\\mathrm{mol\\,kg^{-1}}$ hai, $\\mathrm{mol\\,L^{-1}}$ nahi — galat."],"r":"Molality ka unit $\\mathrm{mol\\,kg^{-1}}$ hai, isliye $\\mathrm{mol\\,L^{-1}}$ wali statement galat hai.","w":["$K_b$ aur $K_f$ ka unit same hota hai — sahi statement.","$\\pi$ pressure hai — sahi.","$K_H$ ka unit pressure hota hai — sahi."],"t":"$\\mathrm{mol\\,L^{-1}}$ = molarity, $\\mathrm{mol\\,kg^{-1}}$ = molality. Bas ye do unit kabhi mix mat karna."},{"id":83,"c":"Concentration terms","q":"Match the Column I (concentration term) with Column II (definition). Column I: (a) Molarity (b) Molality (c) Mole fraction of solute (d) ppm of solute. Column II: (i) moles of solute per kilogram of solvent (ii) moles of solute per litre of solution (iii) mass of solute per $10^{6}$ parts by mass of solution (iv) ratio of moles of solute to total moles of all components","opt":["a-iv, b-iii, c-i, d-ii","a-ii, b-i, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-i, b-ii, c-iv, d-iii"],"ans":2,"cpt":"Har definition ko denominator se pehchano: solution ka litre $\\rightarrow$ molarity, solvent ka kg $\\rightarrow$ molality, total moles $\\rightarrow$ mole fraction, $10^{6}$ parts $\\rightarrow$ ppm.","m":"Ek-ek term ka formula likho aur Column II se match karo.","s":["Molarity $\\rightarrow$ moles per litre solution $\\rightarrow$ (ii).","Molality $\\rightarrow$ moles per kg solvent $\\rightarrow$ (i).","Mole fraction $\\rightarrow$ moles/total moles $\\rightarrow$ (iv).","ppm $\\rightarrow$ parts per $10^{6}$ $\\rightarrow$ (iii)."],"r":"Mapping a-ii, b-i, c-iv, d-iii sahi hai.","w":["Molality ka denominator litre nahi, kg hai.","Mole fraction ppm nahi hai.","Molarity ka matlab total moles nahi hai."],"t":"Match me pehle molarity/molality ka farq fix karo — baaki options automatically eliminate ho jate hain."},{"id":84,"c":"Non-ideal solutions","q":"Match the Column I (liquid mixture) with Column II (behaviour). Column I: (a) Benzene and toluene (b) Ethanol and water (c) Chloroform and acetone (d) Nitric acid ($68\\%$ by mass) and water. Column II: (i) negative deviation from Raoult's law (ii) almost ideal behaviour (iii) positive deviation with minimum boiling azeotrope (iv) maximum boiling azeotrope","opt":["a-ii, b-iii, c-i, d-iv","a-iii, b-ii, c-iv, d-i","a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv"],"ans":0,"cpt":"Benzene-toluene nearly ideal; ethanol-water positive deviation (minimum boiling azeotrope); chloroform-acetone H-bonding se negative deviation; $68\\%$ $\\ce{HNO3}$-water maximum boiling azeotrope banata hai.","m":"Har pair ki interaction type yaad karo, phir match karo.","s":["Benzene-toluene $\\rightarrow$ (ii) almost ideal.","Ethanol-water $\\rightarrow$ (iii) positive deviation, minimum boiling azeotrope.","Chloroform-acetone $\\rightarrow$ (i) negative deviation.","$68\\%$ $\\ce{HNO3}$-water $\\rightarrow$ (iv) maximum boiling azeotrope."],"r":"Mapping a-ii, b-iii, c-i, d-iv sahi hai.","w":["Benzene-toluene positive deviation nahi dikhata.","Ethanol-water negative deviation nahi hai.","Chloroform-acetone ideal nahi hai."],"t":"$68\\%$ $\\ce{HNO3}$ (by mass) ka constant boiling mixture $120.5\\,^{\\circ}\\mathrm{C}$ par distil hota hai — NCERT ka classic example."},{"id":85,"c":"Formulae","q":"Match the Column I (colligative property) with Column II (relation). Column I: (a) Relative lowering of vapour pressure (b) Elevation in boiling point (c) Depression in freezing point (d) Osmotic pressure. Column II: (i) $K_f m$ (ii) $(p_1^{\\circ}-p)/p_1^{\\circ}$ (iii) $K_b m$ (iv) $CRT$","opt":["a-ii, b-i, c-iii, d-iv","a-i, b-ii, c-iv, d-iii","a-iv, b-iii, c-i, d-ii","a-ii, b-iii, c-i, d-iv"],"ans":3,"cpt":"Chaar colligative relations: relative lowering $=(p_1^{\\circ}-p)/p_1^{\\circ}$, $\\Delta T_b = K_bm$, $\\Delta T_f = K_fm$, $\\pi = CRT$.","m":"Subscripts $b$ (boiling) aur $f$ (freezing) se turant match ho jata hai.","s":["$\\Delta T_b$ $\\rightarrow$ (iii) $K_bm$.","$\\Delta T_f$ $\\rightarrow$ (i) $K_fm$.","Relative lowering $\\rightarrow$ (ii).","Osmotic pressure $\\rightarrow$ (iv) $CRT$."],"r":"Mapping a-ii, b-iii, c-i, d-iv sahi hai.","w":["Relative lowering $CRT$ nahi hai.","Boiling point elevation $K_f m$ nahi hota.","Osmotic pressure relative lowering nahi hai."],"t":"$b$ = boiling, $f$ = freezing — subscript se hi sahi pair chuno."},{"id":86,"c":"van't Hoff factor","q":"Match the Column I (solute) with Column II (approximate van't Hoff factor). Column I: (a) $\\ce{NaCl}$ in water (b) $\\ce{K2SO4}$ in water (c) $\\ce{Al2(SO4)3}$ in water (d) Acetic acid in benzene (fully dimerised). Column II: (i) $5$ (ii) $2$ (iii) $0.5$ (iv) $3$","opt":["a-ii, b-i, c-iv, d-iii","a-iv, b-ii, c-i, d-iii","a-iii, b-iv, c-ii, d-i","a-ii, b-iv, c-i, d-iii"],"ans":3,"cpt":"Ions gino: $\\ce{NaCl}\\rightarrow2$, $\\ce{K2SO4}\\rightarrow3$, $\\ce{Al2(SO4)3}\\rightarrow5$. Complete dimerisation me do molecules ek particle banate hain, isliye $i=0.5$.","m":"$i$ = particles per formula unit; dimerisation me ulta (aadha) ho jata hai.","s":["$\\ce{NaCl}$ $\\rightarrow$ 2 ions $\\rightarrow$ (ii).","$\\ce{K2SO4}$ $\\rightarrow$ 3 ions $\\rightarrow$ (iv).","$\\ce{Al2(SO4)3}$ $\\rightarrow$ 5 ions $\\rightarrow$ (i).","Acetic acid dimer $\\rightarrow$ 1 particle per 2 molecules $\\rightarrow i=0.5$ $\\rightarrow$ (iii)."],"r":"Mapping a-ii, b-iv, c-i, d-iii sahi hai.","w":["$\\ce{NaCl}$ ke liye $i=3$ nahi.","$\\ce{K2SO4}$ ke liye $i=2$ nahi.","Acetic acid dimer ke liye $i=2$ nahi, $0.5$ hota hai."],"t":"Association me $i = 1/n$ (complete association) — dimer ke liye 0.5, trimer ke liye 0.33."},{"id":87,"c":"Osmotic pressure","q":"Match the Column I (term) with Column II (description). Column I: (a) Isotonic solutions (b) Hypertonic solution (c) Hypotonic solution (d) Reverse osmosis. Column II: (i) solutions having equal osmotic pressure at a given temperature (ii) a solution whose osmotic pressure is higher than that of the solution with which it is compared (iii) process used for the desalination of sea water (iv) a solution whose osmotic pressure is lower than that of the solution with which it is compared","opt":["a-ii, b-i, c-iii, d-iv","a-i, b-iv, c-ii, d-iii","a-iv, b-ii, c-i, d-iii","a-i, b-ii, c-iv, d-iii"],"ans":3,"cpt":"iso = same, hyper = zyada, hypo = kam. Reverse osmosis desalination ka process hai.","m":"Prefix se meaning nikaalo.","s":["Isotonic $\\rightarrow$ (i) equal osmotic pressure.","Hypertonic $\\rightarrow$ (ii) higher osmotic pressure.","Hypotonic $\\rightarrow$ (iv) lower osmotic pressure.","Reverse osmosis $\\rightarrow$ (iii) desalination."],"r":"Mapping a-i, b-ii, c-iv, d-iii sahi hai.","w":["Hypertonic ka matlab kam nahi, zyada hai.","Isotonic same hota hai.","Reverse osmosis equal pressure nahi hai."],"t":"Cell biology me: hypertonic solution me cell shrink, hypotonic me swell (aur phool kar phat sakta hai)."},{"id":88,"c":"Constants","q":"Match the Column I (constant) with Column II (value in $\\mathrm{K\\,kg\\,mol^{-1}}$). Column I: (a) $K_f$ of water (b) $K_b$ of water (c) $K_f$ of benzene (d) $K_b$ of benzene. Column II: (i) $2.53$ (ii) $1.86$ (iii) $5.12$ (iv) $0.52$","opt":["a-iv, b-ii, c-iii, d-i","a-iii, b-i, c-ii, d-iv","a-ii, b-iv, c-i, d-iii","a-ii, b-iv, c-iii, d-i"],"ans":3,"cpt":"Water: $K_f = 1.86$, $K_b = 0.52$. Benzene: $K_f = 5.12$, $K_b = 2.53$ (sab $\\mathrm{K\\,kg\\,mol^{-1}}$ me).","m":"Values yaad karo — water ke dono values NEET me sabse zyada use hote hain.","s":["Water ka $K_f = 1.86$ $\\rightarrow$ (ii).","Water ka $K_b = 0.52$ $\\rightarrow$ (iv).","Benzene ka $K_f = 5.12$ $\\rightarrow$ (iii).","Benzene ka $K_b = 2.53$ $\\rightarrow$ (i)."],"r":"Mapping a-ii, b-iv, c-iii, d-i sahi hai.","w":["$K_f$ water ka 0.52 nahi hota.","Benzene ka $K_f$ 2.53 nahi hota.","$K_b$ water ka 1.86 nahi hota."],"t":"Water ke liye $K_f > K_b$ (freezing point depression zyada effective hai), benzene ke liye bhi $K_f > K_b$."},{"id":89,"c":"Colligative properties","q":"Assertion (A): A $0.1\\,\\mathrm{M}$ aqueous $\\ce{NaCl}$ solution has a higher osmotic pressure than a $0.1\\,\\mathrm{M}$ aqueous glucose solution at the same temperature. Reason (R): $\\ce{NaCl}$ dissociates into two ions, so the number of solute particles per unit volume is greater in the $\\ce{NaCl}$ solution.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$\\pi = iCRT$. $\\ce{NaCl}$ ka $i \\approx 2$ aur glucose ka $i = 1$, isliye same molarity par $\\ce{NaCl}$ ka osmotic pressure lagbhag double hota hai.","m":"$i$ compare karo aur R ko A se jodo.","s":["$\\ce{NaCl} \\rightarrow \\ce{Na+} + \\ce{Cl-}$: 2 particles, isliye $i=2$ — R sahi.","$\\pi(\\ce{NaCl}) = 2CRT > \\pi(\\text{glucose}) = CRT$ — A sahi.","R hi A ka kaaran hai."],"r":"Dono sach hain aur $\\ce{NaCl}$ ke do ions hi zyada osmotic pressure ka kaaran hain.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Same molarity par osmotic pressure ka ratio $= i$ ka ratio — ye shortcut yaad rakho."},{"id":90,"c":"Colligative properties","q":"Assertion (A): Colligative properties depend only on the number of solute particles and not on their nature. Reason (R): A $0.1\\,\\mathrm{m}$ aqueous solution of urea and a $0.1\\,\\mathrm{m}$ aqueous solution of glucose show the same depression in freezing point.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":1,"cpt":"Colligative properties particle number par depend karti hain. Urea aur glucose dono non-electrolytes hain ($i=1$), isliye same molality par same depression milti hai — ye R me sahi diya hai.","m":"Dono sach hain, par R sirf ek example (verification) hai, A ka kaaran nahi. Isliye option B.","s":["Colligative properties sirf particle number par depend karti hain — A sahi.","Urea aur glucose dono ke $i=1$, isliye same $\\Delta T_f$ — R sahi.","R ek example hai, definition ka explanation nahi — isliye R, A ka correct explanation nahi."],"r":"Dono statements sach hain, par R ek specific example deta hai; colligative behaviour ka theoretical kaaran nahi batata.","w":["R, A ka explanation nahi hai (sirf example hai).","R galat nahi hai.","A sach hai."],"t":"Assertion-Reason me jab R ek 'example' ho, to 'both true but R is not the correct explanation' chuno."},{"id":91,"c":"Solubility of gases","q":"Assertion (A): The solubility of a gas in a liquid increases with increase in temperature at constant pressure. Reason (R): The dissolution of a gas in a liquid is an exothermic process.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":3,"cpt":"Exothermic dissolution ko heating par Le Chatelier ke hisaab se oppose kiya jata hai, isliye solubility ghat ti hai, badh ti nahi.","m":"A ka direction check karo — 'increases' galat hai; R NCERT ki sahi line hai.","s":["Gas dissolution generally exothermic hai — R sach.","Exothermic process heating par oppose hota hai, isliye solubility ghat ti hai.","Isliye A galat hai."],"r":"A galat hai (solubility ghat ti hai), R sach hai.","w":["A sach nahi hai.","R sach hai.","R galat nahi hai."],"t":"Cold water me zyada dissolved oxygen — yahi reason hai ki garam paani me fish survive nahi karte."},{"id":92,"c":"Concentration terms","q":"Assertion (A): The molarity of a solution decreases when its temperature is raised. Reason (R): The number of moles of solute present in the solution decreases when the temperature is raised.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":2,"cpt":"Heating par volume badhta hai, isliye molarity ghat ti hai — A sahi. Par moles of solute heating se nahi badalte; sirf volume change hota hai.","m":"R me 'moles decrease' likha hai — ye chemical change hota to hi possible, normal heating me nahi.","s":["Volume badhne se molarity ghat ti hai — A sahi.","Moles of solute heating par change nahi hote — R galat.","Isliye A true, R false."],"r":"Molarity ghat ti hai volume expansion ki wajah se, moles ghat ne se nahi — R galat hai.","w":["R galat hai.","A sach hai.","R galat hai, A sach hai."],"t":"Molarity change ka kaaran volume hai, moles nahi. Ye trap statement-based questions me aata hai."},{"id":93,"c":"Azeotropes","q":"Assertion (A): An azeotropic mixture distils at a constant temperature without any change in composition. Reason (R): Azeotropic mixtures are formed only by solutions which do not obey Raoult's law.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Azeotrope constant temperature par distill hota hai kyunki vapour aur liquid ka composition same hota hai. Azeotropes un solutions se bante hain jo Raoult's law se deviate karte hain (non-ideal).","m":"A definition hai, R uske formation ka kaaran — dono sach hain aur related hain.","s":["Azeotrope bina composition change distill hota hai — A sahi.","Azeotropes non-ideal (Raoult's law deviate) solutions se bante hain — R sahi.","R hi batata hai ki aisa constant-composition behaviour kaise possible hai."],"r":"Dono sach hain: azeotrope ki formation non-ideal behaviour ki wajah se hoti hai, isliye R, A ko explain karta hai.","w":["R ko alag nahi kiya ja sakta.","R galat nahi hai.","A sach hai."],"t":"Ideal solutions (jaise benzene-toluene) azeotrope nahi banate — sirf large deviations wale banate hain."},{"id":94,"c":"Osmotic pressure","q":"Assertion (A): Osmotic pressure measurement is preferred for determining the molar mass of biological macromolecules such as proteins. Reason (R): Such macromolecules are denatured at higher temperatures, whereas osmotic pressure can be measured at room temperature.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Proteins high temperature par denature ho jate hain, isliye boiling point elevation use nahi kar sakte. Osmotic pressure room temperature par measure hota hai, isliye macromolecules ke liye best hai.","m":"A (preference) aur R (reason) ko jodo — R hi A ka logic hai.","s":["Osmotic pressure room temperature par measure hota hai — R sahi.","Isliye proteins ke liye ye suitable hai — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain aur macromolecules ke denaturation se bachne ki wajah hi osmotic pressure ki preference hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Macromolecules ke liye 'osmotic pressure' ka keyword NEET me aata hai — turant room temperature wali baat yaad karo."},{"id":95,"c":"Non-ideal solutions","q":"For a binary mixture of liquids A and B at a fixed temperature, the vapour pressure of pure A is $150\\,\\mathrm{mm\\,Hg}$ and that of pure B is $180\\,\\mathrm{mm\\,Hg}$. The total vapour pressure of mixtures of different composition was measured and is given below. From this data, the mixture","opt":["obeys Raoult's law over the whole range of composition","shows positive deviation from Raoult's law and forms a minimum boiling azeotrope","shows negative deviation from Raoult's law and forms a maximum boiling azeotrope","shows positive deviation from Raoult's law and forms a maximum boiling azeotrope"],"ans":1,"fig":{"type":"table","head":["$x_A$","Measured $p$ (mm Hg)","Raoult's law $p$ (mm Hg)"],"rows":[["0.0","180","180"],["0.2","177","174"],["0.4","173","168"],["0.6","167","162"],["0.8","159","156"],["1.0","150","150"]],"cap":"Total vapour pressure of A-B mixtures at fixed temperature."},"cpt":"Raoult's law se predicted $p = p_B^{\\circ} + (p_A^{\\circ}-p_B^{\\circ})x_A = 180 - 30x_A$. Agar measured value predicted se zyada ho to positive deviation hoti hai, aur aisi mixture minimum boiling azeotrope banati hai.","m":"Har composition par expected value nikaalo aur measured se compare karo.","s":["$x_A = 0.2$: expected $= 180-30(0.2) = 174$, measured $= 177$ — measured zyada.","$x_A = 0.4$: expected $168$, measured $173$ — phir zyada.","$x_A = 0.6$: expected $162$, measured $167$; $x_A = 0.8$: expected $156$, measured $159$ — har jagah measured zyada.","Measured $>$ expected $\\Rightarrow$ positive deviation $\\Rightarrow$ minimum boiling azeotrope."],"r":"Har composition par measured pressure Raoult's law ki value se zyada hai, isliye positive deviation hoti hai, aur positive deviation wali mixture minimum boiling azeotrope banati hai.","w":["Raoult's law hota to measured = expected hota, par yahan measured zyada hai.","Negative deviation me measured value expected se kam hoti hai.","Positive deviation minimum boiling azeotrope deti hai, maximum nahi."],"t":"Table wale questions me pehle do-teen rows par expected value calculate karo — deviation ka sign turant dikh jata hai."},{"id":96,"c":"Non-ideal solutions","q":"A graph is drawn with total vapour pressure of a binary liquid mixture on the $y$-axis (in mm Hg) and mole fraction of component B in the liquid phase on the $x$-axis, from 0 to 1, at constant temperature. The curve obtained lies entirely below the straight line joining the vapour pressures of the two pure components and shows a minimum. The vapour pressures of the two pure components are $90\\,\\mathrm{mm\\,Hg}$ and $40\\,\\mathrm{mm\\,Hg}$. It follows that for this mixture","opt":["A-B interactions are weaker than A-A and B-B interactions and it forms a minimum boiling azeotrope","A-B interactions are stronger than A-A and B-B interactions and it forms a maximum boiling azeotrope","$\\Delta H_{\\text{mix}}$ is positive and $\\Delta V_{\\text{mix}}$ is positive","the mixture is ideal because the curve is continuous"],"ans":1,"fig":{"type":"plot","xlab":"x_{B} (mole fraction in liquid)","ylab":"p (mm Hg)","xmin":0,"xmax":1,"ymin":0,"ymax":100,"series":[{"name":"Raoult's law line","pts":[[0,90],[1,40]],"dash":true,"dots":false},{"name":"measured curve","pts":[[0,90],[0.2,72],[0.4,58],[0.6,50],[0.8,48],[1,40]]}],"cap":"Minimum in the vapour pressure curve indicates negative deviation."},"cpt":"Curve Raoult's law line ke neeche hai, yani vapour pressure predicted se kam — negative deviation. Negative deviation ka reason strong A-B interactions hain, aur aisi mixture maximum boiling azeotrope banati hai.","m":"Graph ke position se deviation ka sign, aur sign se interaction aur azeotrope type decide karo.","s":["Curve line ke neeche hai $\\Rightarrow p$ kam $\\Rightarrow$ negative deviation.","Negative deviation $\\Rightarrow$ A-B interactions stronger hain.","Aise mixtures maximum boiling azeotrope banate hain, aur $\\Delta H_{\\text{mix}} < 0$."],"r":"Negative deviation strong A-B interactions ki wajah se hoti hai, aur isse maximum boiling azeotrope banta hai.","w":["Weaker interactions se positive deviation hoti aur curve upar hota.","Positive $\\Delta H$ positive deviation ke liye hota hai.","Curve line se hat kar neeche hai, isliye mixture ideal nahi hai."],"t":"Graph ka position = deviation ka sign. Neeche $\\rightarrow$ negative deviation $\\rightarrow$ strong interactions $\\rightarrow$ maximum boiling azeotrope."},{"id":97,"c":"Depression of freezing point","q":"The depression in freezing point of aqueous glucose solutions of different molalities, measured at constant pressure, is given: $0.10\\,\\mathrm{m} \\rightarrow 0.186\\,\\mathrm{K}$; $0.20\\,\\mathrm{m} \\rightarrow 0.372\\,\\mathrm{K}$; $0.40\\,\\mathrm{m} \\rightarrow 0.744\\,\\mathrm{K}$. Using this data, $2.0\\,\\mathrm{g}$ of a non-electrolyte solute dissolved in $100\\,\\mathrm{g}$ of water gives a depression in freezing point of $0.186\\,\\mathrm{K}$. The molar mass of the solute is","opt":["$400\\,\\mathrm{g\\,mol^{-1}}$","$20\\,\\mathrm{g\\,mol^{-1}}$","$100\\,\\mathrm{g\\,mol^{-1}}$","$200\\,\\mathrm{g\\,mol^{-1}}$"],"ans":3,"fig":{"type":"table","head":["Molality ($\\mathrm{mol\\,kg^{-1}}$)","$\\Delta T_f$ (K)"],"rows":[["0.10","0.186"],["0.20","0.372"],["0.40","0.744"]],"cap":"Freezing point depression of aqueous glucose solutions."},"cpt":"Data se $K_f$ nikaal sakte hain: $\\Delta T_f/m = 0.186/0.10 = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$. Phir $M = \\dfrac{K_f \\times w_2}{\\Delta T_f \\times w_1(\\mathrm{kg})}$.","m":"Pehle data se $K_f$ confirm karo, phir molar mass formula lagao.","s":["$K_f = \\Delta T_f/m = 1.86$.","$\\Delta T_f = 0.186$ diya hai, isliye molality $= 0.186/1.86 = 0.10\\,\\mathrm{mol\\,kg^{-1}}$.","$0.1\\,\\mathrm{kg}$ water me moles $= 0.10 \\times 0.1 = 0.01\\,\\mathrm{mol}$.","$M = \\dfrac{2.0}{0.01} = 200\\,\\mathrm{g\\,mol^{-1}}$."],"r":"Molality $0.10$ aur $2.0\\,\\mathrm{g}$ solute $\\Rightarrow M = 200\\,\\mathrm{g\\,mol^{-1}}$.","w":["$400$ tab aata agar mass double hota.","$20$ ka koi basis nahi.","$100$ tab aata agar molality $0.2$ hoti."],"t":"Data-based $K_f$ questions me pehle proportionality constant nikaalo — phir wahi formula aage apply karo."},{"id":98,"c":"Abnormal molar mass","q":"The apparent molar mass of acetic acid dissolved in benzene, determined from freezing point measurements at different concentrations, is given (true molar mass of acetic acid $= 60\\,\\mathrm{g\\,mol^{-1}}$). The van't Hoff factor of acetic acid at $0.10\\,\\mathrm{mol\\,kg^{-1}}$ is","opt":["$0.60$","$0.90$","$1.10$","$1.67$"],"ans":0,"fig":{"type":"table","head":["Concentration ($\\mathrm{mol\\,kg^{-1}}$)","Apparent molar mass ($\\mathrm{g\\,mol^{-1}}$)"],"rows":[["0.20","110"],["0.10","100"],["0.05","85"],["0.02","70"]],"cap":"Apparent molar mass of acetic acid in benzene."},"cpt":"$i = \\dfrac{\\text{normal molar mass}}{\\text{observed (apparent) molar mass}}$. Benzene me acetic acid dimer banata hai, isliye apparent molar mass true se zyada aur $i < 1$ hota hai.","m":"Table se $0.10\\,\\mathrm{mol\\,kg^{-1}}$ wali apparent molar mass lo aur formula lagao.","s":["Association ke liye $i = \\dfrac{M_{\\text{normal}}}{M_{\\text{apparent}}}$; yahan $M_{\\text{normal}} = 60\\,\\mathrm{g\\,mol^{-1}}$.","$0.10\\,\\mathrm{mol\\,kg^{-1}}$ par apparent molar mass $= 100\\,\\mathrm{g\\,mol^{-1}}$.","$i = \\dfrac{60}{100} = 0.60$.","Sahi option A: $i = 0.60$."],"r":"$i = 60/100 = 0.60$ — association ki wajah se $i$ ek se kam hai.","w":["$0.90$ galat ratio hai.","$1.10 > 1$ hota agar dissociation hoti.","$1.67$ ulta ratio ($100/60$) hai."],"t":"Apparent molar mass badhna = association ($i<1$); apparent molar mass ghatna = dissociation ($i>1$)."},{"id":99,"c":"Osmotic pressure","q":"In a graph of osmotic pressure ($y$-axis, in atm) against molar concentration ($x$-axis, in $\\mathrm{mol\\,L^{-1}}$) at $300\\,\\mathrm{K}$, two straight lines passing through the origin are obtained. For glucose the slope is $24.6\\,\\mathrm{atm\\,L\\,mol^{-1}}$, while for a salt $\\ce{MX2}$ the slope is $73.8\\,\\mathrm{atm\\,L\\,mol^{-1}}$. From this it follows that","opt":["the salt is not dissociated in solution and $i = 1$","the salt has $i \\approx 3$ in solution and could be a salt of the type $\\ce{MX2}$ such as $\\ce{CaCl2}$","the salt has $i \\approx 2$ in solution and could be $\\ce{NaCl}$","the salt has $i \\approx 0.33$ because it associates in solution"],"ans":1,"fig":{"type":"plot","xlab":"C (mol L^{-1})","ylab":"π (atm)","xmin":0,"xmax":0.06,"ymin":0,"ymax":5,"series":[{"name":"glucose (slope 24.6)","pts":[[0,0],[0.02,0.492],[0.04,0.984]]},{"name":"salt (slope 73.8)","pts":[[0,0],[0.02,1.476],[0.04,2.952]]}],"cap":"Osmotic pressure vs concentration at 300 K."},"cpt":"$\\pi = iCRT$ se slope $= iRT$. Same temperature par slope ka ratio seedha $i$ ka ratio deta hai.","m":"Slopes ka ratio lo: $73.8/24.6 = 3$, isliye salt ka $i = 3$.","s":["Glucose ke liye slope $= RT = 24.6$, isliye $i = 1$.","Salt ke liye slope $= iRT = 73.8$.","$i = \\dfrac{73.8}{24.6} = 3$.","$\\ce{MX2}$ type salt (jaise $\\ce{CaCl2}$) 3 ions deta hai, isliye $i \\approx 3$ consistent hai."],"r":"Slope ratio 3 dDta hai, isliye $\\ce{MX2}$ type salt ka $i \\approx 3$ hai.","w":["$i=1$ hota to slope 24.6 hota.","$i=2$ ($\\ce{NaCl}$ type) ke liye slope 49.2 hota.","Association me slope ghat ta, yahan badha hai."],"t":"$\\pi$–$C$ graph ka slope $iRT$ hota hai — graph se $i$ nikalna sabse fast method hai."},{"id":100,"c":"Henry's law","q":"The solubility of a slightly soluble gas in water was measured at two temperatures and at different partial pressures. At $298\\,\\mathrm{K}$: $p = 1.0\\,\\mathrm{bar} \\rightarrow 2.0\\times10^{-3}\\,\\mathrm{mol\\,L^{-1}}$; $p = 2.0\\,\\mathrm{bar} \\rightarrow 4.0\\times10^{-3}\\,\\mathrm{mol\\,L^{-1}}$; $p = 4.0\\,\\mathrm{bar} \\rightarrow 8.0\\times10^{-3}\\,\\mathrm{mol\\,L^{-1}}$. At $308\\,\\mathrm{K}$: $p = 1.0\\,\\mathrm{bar} \\rightarrow 1.4\\times10^{-3}\\,\\mathrm{mol\\,L^{-1}}$; $p = 2.0\\,\\mathrm{bar} \\rightarrow 2.8\\times10^{-3}\\,\\mathrm{mol\\,L^{-1}}$; $p = 4.0\\,\\mathrm{bar} \\rightarrow 5.6\\times10^{-3}\\,\\mathrm{mol\\,L^{-1}}$. From these data it is correct to conclude that at constant temperature the solubility is","opt":["directly proportional to the partial pressure of the gas, and it increases with rise in temperature","directly proportional to the partial pressure of the gas, and it decreases with rise in temperature","independent of the partial pressure of the gas, and it decreases with rise in temperature","inversely proportional to the partial pressure of the gas, and it decreases with rise in temperature"],"ans":1,"fig":{"type":"table","head":["$p$ (bar)","Solubility at 298 K ($\\mathrm{mol\\,L^{-1}}$)","Solubility at 308 K ($\\mathrm{mol\\,L^{-1}}$)"],"rows":[["1.0","$2.0\\times10^{-3}$","$1.4\\times10^{-3}$"],["2.0","$4.0\\times10^{-3}$","$2.8\\times10^{-3}$"],["4.0","$8.0\\times10^{-3}$","$5.6\\times10^{-3}$"]],"cap":"Solubility of a gas in water at two temperatures."},"cpt":"Henry's law kehta hai solubility partial pressure ke proportional hoti hai (constant temperature par). Aur temperature badhne par gas ki solubility ghat ti hai.","m":"Har temperature par solubility/pressure ka ratio constant hai ya nahi check karo, phir dono temperatures ke values compare karo.","s":["298 K par: $2.0/1.0 = 4.0/2.0 = 8.0/4.0 = 2.0\\times10^{-3}$ — ratio constant $\\Rightarrow$ proportional.","308 K par bhi ratio $1.4\\times10^{-3}$ constant hai $\\Rightarrow$ proportional.","Same pressure par 298 K ki solubility ($2.0\\times10^{-3}$) 308 K se ($1.4\\times10^{-3}$) zyada hai $\\Rightarrow$ heating par decrease."],"r":"Solubility pressure ke directly proportional hai aur temperature badhne par ghat ti hai — dono conclusions data se match karte hain.","w":["Inverse proportionality data se match nahi karti.","Temperature ka effect galat likha hai (increase nahi hota).","Solubility pressure par depend karti hai."],"t":"Henry's law ka practical test: $p$ double karo to solubility double honi chahiye — ratio constant rehna chahiye."},{"id":101,"c":"Concentration terms","q":"The molarity of a $9.8\\%$ w/w aqueous $\\ce{H2SO4}$ solution (molar mass $98\\,\\mathrm{g\\,mol^{-1}}$) having density $1.02\\,\\mathrm{g\\,mL^{-1}}$ is nearly","opt":["$1.20\\,\\mathrm{M}$","$0.98\\,\\mathrm{M}$","$1.02\\,\\mathrm{M}$","$2.04\\,\\mathrm{M}$"],"ans":2,"cpt":"$\\%$ w/w se molarity ka direct formula: $M = \\dfrac{10 \\times d \\times \\%}{\\text{molar mass}}$, jahan $d$ $\\mathrm{g\\,mL^{-1}}$ me hai.","m":"Ya phir 1 L solution socho: mass $= 1020\\,\\mathrm{g}$, usme $9.8\\%$ $\\ce{H2SO4}$ nikaalo aur moles banao.","s":["1 L solution ka mass $= 1.02 \\times 1000 = 1020\\,\\mathrm{g}$.","$\\ce{H2SO4}$ ka mass $= 0.098 \\times 1020 = 99.96\\,\\mathrm{g}$.","$n = \\dfrac{99.96}{98} \\approx 1.02\\,\\mathrm{mol}$.","$M \\approx 1.02\\,\\mathrm{M}$."],"r":"1 L me $1.02\\,\\mathrm{mol}$ $\\ce{H2SO4}$ hai, isliye molarity $1.02\\,\\mathrm{M}$ hai.","w":["$1.20$ galat density use karne se aata hai.","$0.98$ sirf $\\%$ ka number hai.","$2.04$ double ho gaya — $\\ce{H2SO4}$ ke 2 H ki galti (molarity me basicity nahi dekhi jaati)."],"t":"Formula $M = \\dfrac{10\\,d\\,\\%}{M_m}$ yaad rakho — isse seconds me answer aa jata hai. Basics: $\\ce{H2SO4}$ ki dibasicity normality me kaam aati hai, molarity me nahi."},{"id":102,"c":"Concentration terms","q":"The mole fraction of the solute in a $1$ molal aqueous solution of a non-electrolyte is nearly (molar mass of water $= 18\\,\\mathrm{g\\,mol^{-1}}$)","opt":["$0.010$","$0.018$","$0.056$","$0.100$"],"ans":1,"cpt":"1 molal ka matlab $1\\,\\mathrm{mol}$ solute in $1\\,\\mathrm{kg}$ water. $1\\,\\mathrm{kg}$ water me $1000/18 = 55.56\\,\\mathrm{mol}$ water hote hain.","m":"$x_2 = \\dfrac{n_2}{n_2+n_1}$ me $n_2 = 1$ aur $n_1 = 55.56$ rakho.","s":["$n_2 = 1\\,\\mathrm{mol}$ (solute).","$n_1 = \\dfrac{1000}{18} = 55.56\\,\\mathrm{mol}$ (water).","$x_2 = \\dfrac{1}{1+55.56} = \\dfrac{1}{56.56} = 0.0177 \\approx 0.018$."],"r":"$x_2 = 1/56.56 = 0.0177 \\approx 0.018$.","w":["$0.010$ galat denominator se aata hai.","$0.056$ $1/18$ karne se aata hai.","$0.100$ bahut bada hai."],"t":"1 molal aqueous solution ka mole fraction always $\\approx 0.0177$ — ye ek constant ki tarah yaad rakho."},{"id":103,"c":"Concentration terms","q":"The molality of a $0.50\\,\\mathrm{M}$ aqueous urea solution having density $1.02\\,\\mathrm{g\\,mL^{-1}}$ is nearly (molar mass of urea $= 60\\,\\mathrm{g\\,mol^{-1}}$)","opt":["$0.47\\,\\mathrm{m}$","$0.50\\,\\mathrm{m}$","$0.54\\,\\mathrm{m}$","$0.51\\,\\mathrm{m}$"],"ans":3,"cpt":"Molarity se molality me jaane ke liye solution ka mass nikaalna zaroori hai: $m = \\dfrac{M}{d - M \\times M_m/1000}$ type approach, ya seedha 1 L solution socho.","m":"1 L solution lo: usme urea ka mass aur paani ka mass nikaalo, phir molality lagao.","s":["1 L solution ka mass $= 1020\\,\\mathrm{g}$.","Urea $= 0.50 \\times 60 = 30\\,\\mathrm{g}$.","Water $= 1020-30 = 990\\,\\mathrm{g} = 0.99\\,\\mathrm{kg}$.","Molality $= \\dfrac{0.50}{0.99} = 0.505 \\approx 0.51\\,\\mathrm{m}$."],"r":"$0.50\\,\\mathrm{mol}$ urea $0.99\\,\\mathrm{kg}$ water me hai, isliye molality $\\approx 0.51\\,\\mathrm{m}$.","w":["$0.47$ galat mass subtraction se aata hai.","$0.50$ tab aata agar density $1$ hoti.","$0.54$ density ko galat use karne se aata hai."],"t":"Density $> 1$ ho to molality molarity se thodi zyada hoti hai (water ka mass 1 kg se kam ho jata hai)."},{"id":104,"c":"Henry's law","q":"At $298\\,\\mathrm{K}$, the Henry's law constant for a gas in water is $4.0\\times10^{4}\\,\\mathrm{bar}$. Its mole fraction in water when its partial pressure above the solution is $0.40\\,\\mathrm{bar}$ is","opt":["$1.0\\times10^{-5}$","$1.6\\times10^{-5}$","$1.0\\times10^{-4}$","$6.4\\times10^{-5}$"],"ans":0,"cpt":"$x = \\dfrac{p}{K_H}$ — bada $K_H$ matlab kam solubility.","m":"Division karo aur power of 10 sambhalo.","s":["Given: $K_H = 4.0\\times10^{4}\\,\\mathrm{bar}$ aur $p = 0.40\\,\\mathrm{bar}$.","$x = \\dfrac{0.40}{4.0\\times10^{4}}$.","$\\dfrac{0.4}{4} = 0.1$, isliye $x = 0.1\\times10^{-4} = 1.0\\times10^{-5}$.","Sahi option A: $x = 1.0\\times10^{-5}$."],"r":"$0.40/(4.0\\times10^{4}) = 1.0\\times10^{-5}$.","w":["$1.6\\times10^{-5}$ multiplication karne se aata hai.","$1.0\\times10^{-4}$ power of 10 galat hai.","$6.4\\times10^{-5}$ galat operation hai."],"t":"$10^{4}$ se divide karna = $10^{-4}$ se multiply karna. Exponent ginti me galti sabse common hai."},{"id":105,"c":"Raoult's law","q":"A liquid mixture contains $2\\,\\mathrm{mol}$ of A ($p_A^{\\circ} = 200\\,\\mathrm{mm\\,Hg}$) and $3\\,\\mathrm{mol}$ of B ($p_B^{\\circ} = 100\\,\\mathrm{mm\\,Hg}$). Assuming ideal behaviour, the total vapour pressure of the mixture is","opt":["$120\\,\\mathrm{mm\\,Hg}$","$140\\,\\mathrm{mm\\,Hg}$","$150\\,\\mathrm{mm\\,Hg}$","$160\\,\\mathrm{mm\\,Hg}$"],"ans":1,"cpt":"Raoult's law me mole fraction liquid phase ka lagta hai: $x_A = n_A/(n_A+n_B)$.","m":"Pehle mole fractions nikaalo (total moles 5), phir $p = p_A^{\\circ}x_A + p_B^{\\circ}x_B$.","s":["$x_A = \\dfrac{2}{5} = 0.4$, $x_B = 0.6$.","$p_A = 200 \\times 0.4 = 80\\,\\mathrm{mm\\,Hg}$.","$p_B = 100 \\times 0.6 = 60\\,\\mathrm{mm\\,Hg}$.","$p_{\\text{total}} = 140\\,\\mathrm{mm\\,Hg}$."],"r":"$80+60 = 140\\,\\mathrm{mm\\,Hg}$.","w":["$120$ galat mole fraction se aata hai.","$150$ average lene se aata hai.","$160$ sirf A ka pressure double lene se aata hai."],"t":"Moles diye hon to pehla step hamesha mole fraction hai — total moles se divide karo."},{"id":106,"c":"Raoult's law","q":"For the mixture described in the previous question, the mole fraction of A in the vapour phase in equilibrium with the liquid is nearly","opt":["$0.400$","$0.429$","$0.571$","$0.600$"],"ans":2,"cpt":"Vapour phase ka mole fraction $y_A = \\dfrac{p_A}{p_{\\text{total}}}$. Liquid ka mole fraction $x_A$ se ye alag hota hai (jab tak $p_A^{\\circ} = p_B^{\\circ}$ na ho).","m":"Pichhle question me partial pressure aur total pressure already mile hue hain — unko divide karo.","s":["Pichhle question se partial pressure $p_A = 80\\,\\mathrm{mm\\,Hg}$ aur total $p = 140\\,\\mathrm{mm\\,Hg}$ mile the.","$p_A = 80\\,\\mathrm{mm\\,Hg}$, $p_{\\text{total}} = 140\\,\\mathrm{mm\\,Hg}$.","$y_A = \\dfrac{80}{140} = 0.571$.","Sahi option C: $y_A = 0.571$."],"r":"$80/140 = 0.571$ — vapour phase me A ka mole fraction.","w":["$0.400$ liquid phase ka mole fraction hai ($x_A$).","$0.429$ B ka vapour mole fraction hai ($60/140$).","$0.600$ liquid phase me B ka mole fraction hai."],"t":"Liquid ka $x$ aur vapour ka $y$ alag hote hain. Vapour us component se rich hota hai jiska $p^{\\circ}$ zyada hai."},{"id":107,"c":"Elevation of boiling point","q":"When $1.0\\,\\mathrm{g}$ of a non-volatile non-electrolyte solute is dissolved in $100\\,\\mathrm{g}$ of water, the boiling point of water rises by $0.104\\,\\mathrm{K}$. Taking $K_b$ of water as $0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the molar mass of the solute is","opt":["$200\\,\\mathrm{g\\,mol^{-1}}$","$500\\,\\mathrm{g\\,mol^{-1}}$","$50\\,\\mathrm{g\\,mol^{-1}}$","$100\\,\\mathrm{g\\,mol^{-1}}$"],"ans":2,"cpt":"$\\Delta T_b = K_b m \\Rightarrow m = \\dfrac{\\Delta T_b}{K_b}$. Phir $m = \\dfrac{w_2/M_2}{w_1(\\mathrm{kg})}$ se molar mass.","m":"Pehle molality nikaalo, phir moles aur molar mass.","s":["$m = \\dfrac{0.104}{0.52} = 0.20\\,\\mathrm{mol\\,kg^{-1}}$.","$0.10\\,\\mathrm{kg}$ water me moles $= 0.20 \\times 0.10 = 0.02\\,\\mathrm{mol}$.","$M = \\dfrac{1.0}{0.02} = 50\\,\\mathrm{g\\,mol^{-1}}$."],"r":"Molality $0.2$ aur $0.02\\,\\mathrm{mol}$ solute se $M = 50\\,\\mathrm{g\\,mol^{-1}}$.","w":["$200$ tab aata agar mass $2\\,\\mathrm{g}$ hota.","$500$ ka koi basis nahi.","$100$ tab aata agar molality $0.1$ hoti."],"t":"$w_1$ ko hamesha kg me badlo — yahin sabse zyada galti hoti hai ($100\\,\\mathrm{g} = 0.1\\,\\mathrm{kg}$)."},{"id":108,"c":"Depression of freezing point","q":"When $2.0\\,\\mathrm{g}$ of a non-electrolyte is dissolved in $50\\,\\mathrm{g}$ of benzene, the freezing point of benzene is depressed by $0.40\\,\\mathrm{K}$. Taking $K_f$ of benzene as $5.12\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the molar mass of the solute is","opt":["$256\\,\\mathrm{g\\,mol^{-1}}$","$1024\\,\\mathrm{g\\,mol^{-1}}$","$512\\,\\mathrm{g\\,mol^{-1}}$","$128\\,\\mathrm{g\\,mol^{-1}}$"],"ans":2,"cpt":"$\\Delta T_f = K_fm$; yahan benzene ka $K_f$ bada hai ($5.12$), isliye chhota molality bhi measurable depression deta hai.","m":"Molality nikaalo, phir solvent ke mass se moles, phir molar mass.","s":["$m = \\dfrac{0.40}{5.12} = 0.0781\\,\\mathrm{mol\\,kg^{-1}}$.","$0.050\\,\\mathrm{kg}$ benzene me moles $= 0.0781\\times0.050 = 0.003906\\,\\mathrm{mol}$.","$M = \\dfrac{2.0}{0.003906} = 512\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M = \\dfrac{5.12 \\times 2.0}{0.40 \\times 0.050} = 512\\,\\mathrm{g\\,mol^{-1}}$.","w":["$256$ aadhe mole (double molar mass) lene se aata hai.","$1024$ solyent ki mass ko 100 g lene se (0.1 kg ki jagah 1 kg jaisi galti) aata hai.","$128$ tab aata agar molality $0.3125$ hoti — galat arithmetic."],"t":"Direct formula: $M_2 = \\dfrac{K_f \\times w_2}{\\Delta T_f \\times w_1(\\mathrm{kg})}$ — ek hi step me answer."},{"id":109,"c":"Osmotic pressure","q":"The osmotic pressure at $300\\,\\mathrm{K}$ of a solution containing $1.8\\,\\mathrm{g}$ of glucose (molar mass $180\\,\\mathrm{g\\,mol^{-1}}$) in $100\\,\\mathrm{mL}$ of solution ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$) is","opt":["$0.246\\,\\mathrm{atm}$","$1.23\\,\\mathrm{atm}$","$2.46\\,\\mathrm{atm}$","$24.6\\,\\mathrm{atm}$"],"ans":2,"fig":null,"sim":{"title":"Osmotic pressure explore karo","sliders":[{"name":"C","label":"C (mol L^{-1})","min":0.01,"max":0.5,"step":0.01,"val":0.1},{"name":"T","label":"T (K)","min":250,"max":350,"step":5,"val":300}],"calc":"var pi = C*0.0821*T; return [['π', pi.toFixed(3)+' atm'], ['RT', (0.0821*T).toFixed(2)+' L atm mol^{-1}']];"},"cpt":"$\\pi = CRT$, jahan $C$ molarity ($\\mathrm{mol\\,L^{-1}}$) hai. Glucose ke liye $i = 1$.","m":"Pehle molarity nikaalo (moles/volume in L), phir $\\pi = CRT$.","s":["$n = \\dfrac{1.8}{180} = 0.01\\,\\mathrm{mol}$.","$V = 100\\,\\mathrm{mL} = 0.1\\,\\mathrm{L}$, isliye $C = 0.1\\,\\mathrm{M}$.","$\\pi = 0.1 \\times 0.0821 \\times 300 = 2.463\\,\\mathrm{atm}$."],"r":"$\\pi = 0.1 \\times 24.63 = 2.46\\,\\mathrm{atm}$.","w":["$0.246$ 0.01 M ke liye hota.","$1.23$ 0.05 M ke liye hota.","$24.6$ tab aata agar $C=1$ ho."],"t":"Osmotic pressure ka $C$ molarity hai — molality nahi. Dilute aqueous solution me dono lagbhag same hote hain, par formula molarity ka hai."},{"id":110,"c":"Osmotic pressure","q":"A $0.10\\,\\mathrm{M}$ aqueous glucose solution is isotonic with an aqueous $\\ce{NaCl}$ solution at the same temperature. Assuming complete dissociation of $\\ce{NaCl}$, the molarity of the $\\ce{NaCl}$ solution is","opt":["$0.025\\,\\mathrm{M}$","$0.050\\,\\mathrm{M}$","$0.10\\,\\mathrm{M}$","$0.20\\,\\mathrm{M}$"],"ans":1,"cpt":"Isotonic ka matlab same osmotic pressure: $\\pi_1 = \\pi_2$. Glucose ka $i=1$, $\\ce{NaCl}$ ka $i=2$.","m":"$i_1C_1 = i_2C_2$ likho aur $C_2$ nikaalo.","s":["Glucose: $1 \\times 0.10 = 0.10$.","$\\ce{NaCl}$: $2 \\times C = 0.10$.","$C = 0.05\\,\\mathrm{M}$."],"r":"Same osmotic pressure ke liye $\\ce{NaCl}$ ki molarity aadhi honi chahiye, kyunki uska $i$ double hai.","w":["$0.025$ me $i$ ko chaar guna le liya.","$0.10$ tab aata agar $\\ce{NaCl}$ dissociate na kare.","$0.20$ ulta relation hai."],"t":"Isotonic solutions ke liye condition: $i_1C_1 = i_2C_2$ (same temperature par)."},{"id":111,"c":"Colligative properties","q":"Among the following aqueous solutions, the one having the lowest freezing point (assuming complete dissociation of electrolytes) is","opt":["$0.2\\,\\mathrm{m}$ $\\ce{NaCl}$","$0.1\\,\\mathrm{m}$ $\\ce{Al2(SO4)3}$","$0.3\\,\\mathrm{m}$ glucose","$0.15\\,\\mathrm{m}$ $\\ce{CaCl2}$"],"ans":1,"cpt":"$\\Delta T_f = iK_f m$ — sabse zyada effective molality wale solution ka freezing point sabse neeche hoga.","m":"Har solution ka $i \\times m$ nikaalo aur compare karo.","s":["Glucose: $1\\times0.3 = 0.30$.","$\\ce{NaCl}$: $2\\times0.2 = 0.40$.","$\\ce{CaCl2}$: $3\\times0.15 = 0.45$.","$\\ce{Al2(SO4)3}$: $5\\times0.1 = 0.50$.","Sabse zyada $0.50$ hai, isliye $\\ce{Al2(SO4)3}$ ka freezing point sabse kam."],"r":"$\\ce{Al2(SO4)3}$ ki effective molality $0.5$ sabse zyada hai, isliye freezing point sabse kam hai.","w":["$0.40$ teesra hai.","$0.30$ sabse kam effective molality hai.","$0.45$ doosre number par hai."],"t":"Lowest freezing point $\\leftrightarrow$ highest $i \\times m$. Ye comparison har NEET paper me aata hai."},{"id":112,"c":"Elevation of boiling point","q":"The elevation in boiling point of a $1.5\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ solution, assuming complete dissociation and $K_b$ of water $= 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$, is","opt":["$1.04\\,\\mathrm{K}$","$0.78\\,\\mathrm{K}$","$1.56\\,\\mathrm{K}$","$3.12\\,\\mathrm{K}$"],"ans":2,"cpt":"Electrolyte ke liye $\\Delta T_b = iK_bm$. $\\ce{NaCl}$ dissociate hokar 2 ions deta hai ($i=2$).","m":"Pehle $i$ likho, phir formula me multiply karo.","s":["$\\ce{NaCl} \\rightarrow \\ce{Na+}+\\ce{Cl-}$, isliye $i = 2$.","$\\Delta T_b = 2 \\times 0.52 \\times 1.5$.","$\\Delta T_b = 1.56\\,\\mathrm{K}$."],"r":"$2 \\times 0.52 \\times 1.5 = 1.56\\,\\mathrm{K}$.","w":["$1.04$ galat multiplication hai.","$0.78$ tab aata agar $i=1$.","$3.12$ tab aata agar $i=4$."],"t":"Electrolyte ke saare colligative formulae me $i$ multiply karna mat bhoolna."},{"id":113,"c":"Concentration terms","q":"Statement I: Molality is the number of moles of solute present in $1\\,\\mathrm{kg}$ of solvent, whereas molarity is the number of moles of solute present in $1\\,\\mathrm{L}$ of solution. Statement II: For dilute aqueous solutions of density close to $1\\,\\mathrm{g\\,mL^{-1}}$, molarity and molality are nearly equal in magnitude.","opt":["Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct"],"ans":1,"cpt":"Molality solvent ke kg par, molarity solution ke litre par. Dilute aqueous solution me $1\\,\\mathrm{L}$ solution ka mass lagbhag $1\\,\\mathrm{kg}$ hota hai aur solute ka mass negligible hota hai, isliye dono numbers qareeb aa jaate hain.","m":"Definitions check karo, phir 'dilute + density $\\approx1$' condition ko test karo.","s":["Statement I
