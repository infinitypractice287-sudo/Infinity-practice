d to determine the molar mass of the solvent."],"ans":3,"cpt":"Colligative properties se solute ka molar mass nikalta hai, solvent ka nahi. Solvent ka $K_f$ pehle se known constant hota hai.","m":"Determination ka direction check karo: solute ka molar mass nikalta hai.","s":["Relative lowering particle number par depend karti hai — sahi.","Dilute solution me $\\Delta T_b \\propto m$ — sahi.","$\\Delta T_f$ se solute ka molar mass nikalta hai, solvent ka nahi — galat statement.","Osmotic pressure se polymer ka molar mass nikalta hai — sahi."],"r":"Freezing point depression solute ke molar mass ke liye use hoti hai, solvent ke liye nahi — isliye ye statement NOT correct hai.","w":["Polymer ke liye osmotic pressure sahi choice hai.","Ye sahi hai.","Ye bhi sahi hai."],"t":"Hamesha yaad rakho: colligative property $\\rightarrow$ solute ka molar mass."},{"id":178,"c":"van't Hoff factor","q":"Which of the following statements is correct?","opt":["The van't Hoff factor cannot be less than $1$.","The van't Hoff factor of a non-electrolyte in aqueous solution is always greater than $1$.","For complete association of a solute into trimers, the van't Hoff factor is $1/3$.","For complete dissociation of a salt giving five ions per formula unit, the van't Hoff factor is $1/5$."],"ans":2,"cpt":"Complete association me $i = 1/n$; trimer ke liye $n=3$, isliye $i = 1/3$. Dissociation me $i = n$.","m":"Association aur dissociation ke limits yaad karo: association $i = 1/n$, dissociation $i = n$.","s":["Trimer: $i = 1/3$ — sahi.","5 ions wale salt ka $i = 5$, $1/5$ nahi — galat.","Non-electrolyte ka $i = 1$ hota hai, greater than 1 nahi.","Association me $i<1$ ho sakta hai — galat."],"r":"Complete trimerisation me $i = 1/3$ — yahi correct statement hai.","w":["$i$ 1 se kam ho sakta hai (association).","Non-electrolyte ka $i$ exactly 1 hota hai.","Dissociation me $i = n$ hota hai, $1/n$ nahi."],"t":"$i$ ka range: $1/n \\le i \\le n$, jahan $n$ association/dissociation ke liye particles ki sankhya hai."},{"id":179,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["The relative lowering of vapour pressure depends on the molar mass of the solute and not on its mole fraction.","The freezing point of an aqueous solution is lower than that of pure water.","For a $0.1\\,\\mathrm{m}$ aqueous solution of a strong electrolyte with $i=3$, the depression in freezing point is three times that of a $0.1\\,\\mathrm{m}$ solution of a non-electrolyte.","The cryoscopic constant of a solvent is independent of the nature of the solute."],"ans":0,"cpt":"Relative lowering $= x_2$, yani mole fraction par depend karti hai; molar mass par direct dependence nahi (molar mass sirf $x_2$ ke through aata hai jab mass diya ho).","m":"Formula likho: relative lowering $= x_2$.","s":["$K_f$ solute-independent — sahi.","Solution ka freezing point neeche hota hai — sahi.","$i=3$ se depression 3 guna — sahi.","Relative lowering mole fraction par depend karti hai, molar mass par nahi — galat statement."],"r":"Relative lowering ka expression $x_2$ hai — mole fraction ka role hai, molar mass ka direct nahi.","w":["Ye sahi hai.","Ye bhi sahi hai.","$i$ ka effect sahi hai."],"t":"$x_2$ aur molar mass ke beech ka relation tab aata hai jab mass percentage diya ho — direct dependence nahi."},{"id":180,"c":"Non-ideal solutions","q":"Which of the following statements about non-ideal solutions is correct?","opt":["Positive deviation occurs when the solute-solvent interactions are stronger than the pure-component interactions.","Negative deviation results in $\\Delta V_{\\text{mix}} < 0$ and $\\Delta H_{\\text{mix}} < 0$.","The vapour pressure in a solution showing positive deviation is lower than that predicted by Raoult's law.","Negative deviation is accompanied by a decrease in boiling point of the mixture."],"ans":1,"cpt":"Negative deviation: strong A-B interactions $\\Rightarrow$ volume contraction ($\\Delta V<0$) aur heat release ($\\Delta H<0$). Boiling point ideal se zyada hota hai.","m":"Sign conventions yaad karo: negative deviation = negative $\\Delta H$, negative $\\Delta V$.","s":["Positive deviation strong interactions se nahi, weak se hoti hai — galat.","Negative deviation me $\\Delta V<0$ aur $\\Delta H<0$ — sahi.","Positive deviation me $p$ predicted se zyada hota hai — galat.","Negative deviation me boiling point badhta hai — galat."],"r":"Negative deviation ke saath negative enthalpy aur negative volume change dono aate hain — yahi sahi statement hai.","w":["Positive deviation weak interactions se hoti hai.","Positive deviation me vapour pressure zyada hota hai.","Negative deviation me boiling point badhta hai."],"t":"Ek table yaad rakho: positive deviation $\\rightarrow (+,-$, high $p$, low $T_b)$; negative deviation $\\rightarrow (-,+$, low $p$, high $T_b)$."},{"id":181,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["The boiling point of a solution containing a non-volatile solute increases with increase in the concentration of the solute.","Osmotic pressure of a solution increases with increase in the concentration of the solute.","The freezing point of a solution decreases with increase in the concentration of the solute.","The vapour pressure of a solution containing a non-volatile solute is independent of the concentration of the solute."],"ans":3,"cpt":"Solute ki concentration badhne par vapour pressure aur bhi ghat ta hai (Raoult's law: $p \\propto x_1$). Isliye vapour pressure concentration se independent nahi hai.","m":"Har option me concentration ke saath direction check karo.","s":["$T_b$ concentration ke saath badhta hai — sahi.","$\\pi$ concentration ke saath badhta hai — sahi.","Vapour pressure concentration se independent hai — galat.","$T_f$ concentration ke saath ghat ta hai — sahi."],"r":"Vapour pressure concentration par depend karta hai (badhne par ghat ta hai), isliye 'independent' wali statement NOT correct hai.","w":["Ye sahi hai.","Ye bhi sahi hai.","$T_f$ ka decrease sahi hai."],"t":"Vapour pressure lowering hi baaki teeno properties ka source hai — isliye wo concentration par depend karta hai."},{"id":182,"c":"Azeotropes","q":"Which of the following statements about azeotropes is NOT correct?","opt":["Azeotropes are binary mixtures that distill at constant temperature.","A minimum boiling azeotrope forms from a solution showing positive deviation.","Azeotropes can be separated into pure components by fractional distillation since their composition changes during boiling.","An azeotrope shows a maximum or minimum in a boiling point-composition diagram."],"ans":2,"cpt":"Azeotrope par vapour aur liquid ka composition same hota hai, isliye boiling ke dauraan composition change nahi hota — separation possible nahi.","m":"'Composition changes during boiling' wali baat check karo — azeotrope me composition nahi badalta.","s":["Azeotrope constant temperature par distill hota hai — sahi.","Minimum boiling azeotrope positive deviation se banta hai — sahi.","Fractional distillation se separation — galat, kyunki composition nahi badalta.","Boiling point-composition diagram me extremum hota hai — sahi."],"r":"Azeotrope ka composition boiling ke dauraan nahi badalta, isliye fractional distillation se separation ka claim galat hai.","w":["Ye sahi hai.","Positive deviation $\\rightarrow$ minimum boiling azeotrope, sahi.","Extremum wali baat sahi hai."],"t":"Azeotrope ko todne ke liye pressure badla jata hai (pressure-swing distillation) ya chemical treatment kiya jata hai."},{"id":183,"c":"Colligative properties","q":"Which of the following statements is correct?","opt":["The vapour pressure of a $0.1\\,\\mathrm{m}$ aqueous solution of urea is equal to that of pure water.","The boiling point of a $0.1\\,\\mathrm{m}$ aqueous solution of glucose is higher than that of a $0.1\\,\\mathrm{m}$ aqueous solution of $\\ce{KCl}$.","The freezing point of a $0.1\\,\\mathrm{m}$ aqueous solution of urea is higher than that of a $0.1\\,\\mathrm{m}$ aqueous solution of $\\ce{KCl}$.","The osmotic pressure of a $0.1\\,\\mathrm{M}$ aqueous solution of $\\ce{Al2(SO4)3}$ is less than that of a $0.1\\,\\mathrm{M}$ aqueous solution of $\\ce{CaCl2}$, assuming complete dissociation."],"ans":2,"cpt":"Urea ka $i=1$, $\\ce{KCl}$ ka $i=2$. Same molality par $\\ce{KCl}$ ka colligative effect zyada hota hai, isliye uska freezing point kam aur boiling point zyada hota hai.","m":"Har option me $i \\times m$ compare karo.","s":["$\\ce{Al2(SO4)3}$ ka $i=5$ aur $\\ce{CaCl2}$ ka $3$ — isliye $\\ce{Al2(SO4)3}$ ka $\\pi$ zyada hoga.","Urea ka effective $0.1$, $\\ce{KCl}$ ka $0.2$ — urea ka depression kam, isliye freezing point zyada — sahi.","Glucose ka $T_b$ $\\ce{KCl}$ se kam hoga.","Urea dalne par vapour pressure kam hota hai."],"r":"Urea ka particle concentration kam hai, isliye uska freezing point $\\ce{KCl}$ solution se zyada hai — yahi sahi statement hai.","w":["Solute dalne se vapour pressure ghat ta hai.","Glucose ka boiling point $\\ce{KCl}$ se kam hota hai.","$\\ce{Al2(SO4)3}$ ka $\\pi$ zyada hota hai, kam nahi."],"t":"Urea ($i=1$) hamesha electrolytes se kam colligative effect deta hai — same molality par."},{"id":184,"c":"Colligative properties","q":"Which of the following statements about the measurements used for determining molar mass is NOT correct?","opt":["Elevation of boiling point gives the true molar mass of an electrolyte without any correction for the van't Hoff factor.","Relative lowering of vapour pressure can be used for non-volatile solutes that are non-electrolytes.","Depression in freezing point cannot be used for solutes which dissociate in solution because the observed molar mass would be smaller than the true molar mass.","Osmotic pressure is particularly useful for macromolecules such as proteins and polymers."],"ans":0,"cpt":"Electrolyte ke liye $\\Delta T_b = iK_bm$, isliye molar mass nikalte waqt $i$ se correct karna padta hai. Bina correction ke observed molar mass galat aata hai.","m":"Electrolyte ke saare formulae me $i$ ka role check karo.","s":["Osmotic pressure macromolecules ke liye best hai — sahi.","Dissociating solute ka observed molar mass chhota aata hai — sahi.","Boiling point elevation bina $i$ correction ke true molar mass nahi deta — galat statement.","Relative lowering non-volatile non-electrolytes ke liye use hoti hai — sahi."],"r":"Electrolyte ke liye $i$ ka correction zaroori hai, isliye 'without any correction' wali statement NOT correct hai.","w":["Relative lowering ka use sahi bataya gaya hai.","Dissociating solute ka apparent molar mass kam hota hai — sahi.","Ye sahi hai."],"t":"Electrolyte ke liye $M_{\\text{true}} = i \\times M_{\\text{observed}}$ — correction bhoolna sabse badi galti hai."},{"id":185,"c":"van't Hoff factor","q":"Match the Column I (solution/solute) with Column II (correct value or behaviour). Column I: (a) $0.1\\,\\mathrm{m}$ glucose (b) $0.1\\,\\mathrm{m}$ $\\ce{NaCl}$ (complete dissociation) (c) $0.1\\,\\mathrm{m}$ $\\ce{Al2(SO4)3}$ (complete dissociation) (d) benzoic acid in benzene (fully dimerised). Column II: (i) $i=0.5$ (ii) $i=1$ (iii) $i=2$ (iv) $i=5$","opt":["a-i, b-iii, c-iv, d-ii","a-iii, b-ii, c-iv, d-i","a-ii, b-iv, c-iii, d-i","a-ii, b-iii, c-iv, d-i"],"ans":3,"cpt":"Glucose $i=1$; $\\ce{NaCl}$ $i=2$; $\\ce{Al2(SO4)3}$ $i=5$; full dimerisation $i=0.5$.","m":"Ions gino; dimer me particle aadhe ho jate hain.","s":["Glucose $\\rightarrow$ (ii) $i=1$.","$\\ce{NaCl}$ $\\rightarrow$ (iii) $i=2$.","$\\ce{Al2(SO4)3}$ $\\rightarrow$ (iv) $i=5$.","Benzoic acid dimer $\\rightarrow$ (i) $i=0.5$."],"r":"Mapping a-ii, b-iii, c-iv, d-i sahi hai.","w":["Glucose ka $i$ 0.5 nahi hota.","$\\ce{NaCl}$ ka $i=5$ nahi.","Glucose ke liye $i=3$ galat hai."],"t":"Match me sabse pehle non-electrolyte aur fully associated cases fix karo — baaki elimination se ho jate hain."},{"id":186,"c":"Non-ideal solutions","q":"Match the Column I (mixture) with Column II (type of deviation and azeotrope). Column I: (a) Ethanol and water (b) Chloroform and acetone (c) Benzene and toluene (d) $68\\%$ aqueous $\\ce{HNO3}$. Column II: (i) positive deviation, minimum boiling azeotrope (ii) no azeotrope, nearly ideal (iii) negative deviation, maximum boiling azeotrope (iv) maximum boiling azeotrope at $68\\%$ composition","opt":["a-iii, b-i, c-ii, d-iv","a-iv, b-iii, c-ii, d-i","a-i, b-iii, c-ii, d-iv","a-i, b-ii, c-iii, d-iv"],"ans":2,"cpt":"Ethanol-water: positive deviation, min boiling azeotrope. Chloroform-acetone: negative deviation, max boiling azeotrope. Benzene-toluene: nearly ideal, no azeotrope. $68\\%$ $\\ce{HNO3}$: max boiling azeotrope.","m":"Har pair ka known behaviour yaad karo.","s":["Ethanol-water $\\rightarrow$ (i).","Chloroform-acetone $\\rightarrow$ (iii).","Benzene-toluene $\\rightarrow$ (ii).","$68\\%$ $\\ce{HNO3}$ $\\rightarrow$ (iv)."],"r":"Mapping a-i, b-iii, c-ii, d-iv sahi hai.","w":["Chloroform-acetone positive deviation nahi dikhata.","Benzene-toluene negative deviation nahi dikhata.","Ethanol-water max boiling azeotrope nahi banata."],"t":"Ideal pair azeotrope nahi banata — sirf non-ideal (deviating) pairs azeotrope banate hain."},{"id":187,"c":"Formulae","q":"Match the Column I (law/property) with Column II (statement). Column I: (a) Henry's law (b) Raoult's law (c) van't Hoff equation for osmotic pressure (d) van't Hoff factor. Column II: (i) $\\pi = iCRT$ (ii) $p = K_Hx$ (iii) $p_1 = p_1^{\\circ}x_1$ for the solvent in solution (iv) ratio of the normal molar mass to the observed molar mass","opt":["a-ii, b-i, c-iii, d-iv","a-ii, b-iii, c-i, d-iv","a-iv, b-iii, c-ii, d-i","a-iii, b-ii, c-i, d-iv"],"ans":1,"cpt":"Henry: gas ka $p = K_Hx$. Raoult: solvent ka $p_1 = p_1^{\\circ}x_1$. Osmotic pressure: $\\pi = iCRT$. $i$: normal/observed molar mass.","m":"Har law ka formula yaad karo aur match karo.","s":["Henry's law $\\rightarrow$ (ii).","Raoult's law $\\rightarrow$ (iii).","van't Hoff osmotic equation $\\rightarrow$ (i).","van't Hoff factor $\\rightarrow$ (iv)."],"r":"Mapping a-ii, b-iii, c-i, d-iv sahi hai.","w":["Henry's law $p_1 = p_1^{\\circ}x_1$ nahi hai.","Raoult's law mein $K_H$ nahi aata.","$i$ ka formula $\\pi = iCRT$ nahi hai."],"t":"Henry's law gas ke liye, Raoult's law solvent ke liye — dono ka same form hai, bas $K_H$ aur $p^{\\circ}$ ka farq hai."},{"id":188,"c":"Colligative properties","q":"Match the Column I (aqueous solution) with Column II (effective particle concentration). Column I: (a) $0.1\\,\\mathrm{m}$ glucose (b) $0.1\\,\\mathrm{m}$ $\\ce{KCl}$ (c) $0.1\\,\\mathrm{m}$ $\\ce{BaCl2}$ (d) $0.1\\,\\mathrm{m}$ $\\ce{Al2(SO4)3}$. Column II: (i) $0.1\\,\\mathrm{m}$ (ii) $0.2\\,\\mathrm{m}$ (iii) $0.3\\,\\mathrm{m}$ (iv) $0.5\\,\\mathrm{m}$","opt":["a-iv, b-iii, c-ii, d-i","a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv"],"ans":1,"cpt":"Effective concentration $= i \\times m$: glucose $1\\times0.1$, $\\ce{KCl}$ $2\\times0.1$, $\\ce{BaCl2}$ $3\\times0.1$, $\\ce{Al2(SO4)3}$ $5\\times0.1$.","m":"$i$ nikaalo aur molality se multiply karo.","s":["Glucose $\\rightarrow$ (i) $0.1$.","$\\ce{KCl}$ $\\rightarrow$ (ii) $0.2$.","$\\ce{BaCl2}$ $\\rightarrow$ (iii) $0.3$.","$\\ce{Al2(SO4)3}$ $\\rightarrow$ (iv) $0.5$."],"r":"Mapping a-i, b-ii, c-iii, d-iv sahi hai.","w":["$\\ce{KCl}$ ka effective $0.3$ nahi.","$\\ce{BaCl2}$ ka effective $0.2$ nahi.","Glucose ka effective $0.5$ nahi."],"t":"$\\ce{BaCl2} \\rightarrow \\ce{Ba^{2+}} + 2\\ce{Cl-}$: 3 particles, isliye $i=3$."},{"id":189,"c":"Osmotic pressure","q":"Match the Column I (property) with Column II (value/definition). Column I: (a) Isotonic solutions (b) Hypertonic solution (c) Hypotonic solution (d) Semipermeable membrane. Column II: (i) a membrane that allows passage of solvent but not of solute (ii) solutions having identical osmotic pressure (iii) a solution having higher solute concentration than the reference solution (iv) a solution having lower solute concentration than the reference solution","opt":["a-ii, b-iv, c-iii, d-i","a-i, b-iii, c-iv, d-ii","a-ii, b-iii, c-iv, d-i","a-iii, b-ii, c-i, d-iv"],"ans":2,"cpt":"Isotonic = same osmotic pressure; hypertonic = higher solute concentration; hypotonic = lower; semipermeable membrane sirf solvent ko pass karti hai.","m":"Prefixes se meaning nikaalo.","s":["Isotonic $\\rightarrow$ (ii).","Hypertonic $\\rightarrow$ (iii).","Hypotonic $\\rightarrow$ (iv).","Semipermeable membrane $\\rightarrow$ (i)."],"r":"Mapping a-ii, b-iii, c-iv, d-i sahi hai.","w":["Hypertonic lower nahi hota.","Hypotonic higher nahi hota.","Membrane isotonic solutions nahi hoti."],"t":"Hyper = zyada (paani cell se bahar), hypo = kam (paani cell me andar)."},{"id":190,"c":"Applications","q":"Match the Column I (process/application) with Column II (phenomenon involved). Column I: (a) Desalination of sea water (b) Fresh water fish dying in sea water (c) Soft drinks carbonated under pressure (d) Preservation of fruits by adding sugar. Column II: (i) Henry's law (ii) reverse osmosis (iii) osmosis causing loss of water from cells (iv) lowering of vapour pressure and lowering of water activity in the preservative medium","opt":["a-i, b-iii, c-ii, d-iv","a-iv, b-ii, c-i, d-iii","a-ii, b-i, c-iii, d-iv","a-ii, b-iii, c-i, d-iv"],"ans":3,"cpt":"Desalination $\\rightarrow$ RO; sea water me fish cells se paani bahar nikalta hai $\\rightarrow$ osmosis; soft drink $\\rightarrow$ $\\ce{CO2}$ ka high pressure solubility (Henry's law); sugar preservation $\\rightarrow$ vapour pressure/water activity lowering.","m":"Har application ko phenomenon se jodo.","s":["Desalination $\\rightarrow$ (ii) reverse osmosis.","Fish dying in sea water $\\rightarrow$ (iii) osmosis.","Soft drinks $\\rightarrow$ (i) Henry's law.","Sugar preservation $\\rightarrow$ (iv) vapour pressure lowering."],"r":"Mapping a-ii, b-iii, c-i, d-iv sahi hai.","w":["Desalination Henry's law nahi hai.","Fish death RO nahi hai.","Soft drink vapour pressure lowering ka example nahi hai."],"t":"Chaaron applications NCERT ke 'Applications' section se hain — inhe examples ke roop me yaad rakho."},{"id":191,"c":"Colligative properties","q":"Assertion (A): A $0.1\\,\\mathrm{m}$ aqueous solution of $\\ce{KCl}$ has a lower freezing point than a $0.1\\,\\mathrm{m}$ aqueous solution of urea. Reason (R): $\\ce{KCl}$ produces two ions per formula unit, so the total molality of particles is greater in the $\\ce{KCl}$ solution.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$\\Delta T_f = iK_fm$: $\\ce{KCl}$ ka $i=2$, urea ka $i=1$. Isliye $\\ce{KCl}$ ka depression double hota hai — freezing point zyada neeche.","m":"$i$ compare karo aur A se jodo.","s":["$\\ce{KCl}$ se 2 ions bante hain — R sahi.","Zyada particles $\\Rightarrow$ zyada depression $\\Rightarrow$ kam freezing point — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; $\\ce{KCl}$ ke do ions hi zyada depression ka kaaran hain.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"$0.1\\,\\mathrm{m}$ $\\ce{KCl}$ ka $\\Delta T_f = 0.372\\,\\mathrm{K}$; urea ka $0.186\\,\\mathrm{K}$ — exactly double."},{"id":192,"c":"Concentration terms","q":"Assertion (A): Molarity is not preferred over molality in the measurement of colligative properties where high accuracy is required over varying temperature. Reason (R): Molality is independent of temperature, whereas molarity varies with temperature because the volume of the solution changes.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Colligative measurements me molality isliye use hoti hai kyunki wo temperature se independent hai.","m":"A (preference) aur R (reason) ko jodo.","s":["Molality temperature-independent hai, molarity nahi — R sahi.","Isliye accurate work me molality preferred hai — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; molality ki temperature independence hi uski preference ka kaaran hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"NEET ke numericals me molality isliye use hoti hai kyunki constants ($K_f$, $K_b$) molality ke saath defined hain."},{"id":193,"c":"Non-ideal solutions","q":"Assertion (A): A mixture of ethanol and hexane shows positive deviation from Raoult's law and forms a minimum boiling azeotrope. Reason (R): Ethanol molecules are hydrogen bonded among themselves, and addition of hexane disrupts these hydrogen bonds, making the interactions weaker than those in the pure components.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Ethanol apne H-bonds banata hai; hexane non-polar hai aur in H-bonds ko tod deta hai. Isse escaping tendency badh jati hai — positive deviation aur minimum boiling azeotrope.","m":"A ka mechanism R me diya hai — direct explanation.","s":["Hexane ethanol ke H-bonds todta hai — R sahi.","Weak interactions $\\Rightarrow$ high vapour pressure $\\Rightarrow$ positive deviation $\\Rightarrow$ min boiling azeotrope — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain aur H-bond disruption hi positive deviation ka kaaran hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Non-polar solvent + H-bonded solvent = positive deviation (jaise hexane + ethanol)."},{"id":194,"c":"Osmosis","q":"Assertion (A): A plant cell placed in a hypertonic solution undergoes plasmolysis. Reason (R): Water leaves the cell because the solution outside has a lower osmotic pressure than the cell sap.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":2,"cpt":"Hypertonic solution ka osmotic pressure cell sap se zyada hota hai (solute concentration zyada). Isliye paani cell se bahar nikalta hai aur cell sikud jata hai — plasmolysis.","m":"A sach hai; R me 'lower osmotic pressure' likha hai jo galat hai.","s":["Hypertonic solution me solute zyada hota hai, isliye bahar ka osmotic pressure zyada hota hai — R galat.","Paani cell se bahar jata hai $\\Rightarrow$ plasmolysis — A sahi.","Isliye A true, R false."],"r":"Plasmolysis hota hai (A sahi), par hypertonic solution ka osmotic pressure zyada hota hai, kam nahi — R galat.","w":["R galat hai.","A sach hai.","R galat hai, A sach hai."],"t":"Hypertonic = high osmotic pressure outside $\\Rightarrow$ exosmosis $\\Rightarrow$ plasmolysis."},{"id":195,"c":"Colligative properties","q":"Assertion (A): The osmotic pressure of a solution is greater than the pressure that would be observed if the solute particles acted independently in the same volume, when the solute associates. Reason (R): Association of solute particles decreases the total number of particles in solution.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":3,"cpt":"Association me particles kam hote hain, isliye osmotic pressure kam hota hai (independent particles wali value se). Isliye A galat hai.","m":"A ka direction check karo: association $\\Rightarrow$ kam particles $\\Rightarrow$ kam $\\pi$.","s":["Association se particles ghat te hain — R sahi.","Kam particles $\\Rightarrow$ kam osmotic pressure, isliye A galat hai.","Isliye A false, R true."],"r":"A galat hai kyunki association se osmotic pressure kam hota hai, zyada nahi; R sahi hai.","w":["A sach nahi hai.","R galat nahi.","A sach nahi hai."],"t":"Association: $i<1$ $\\Rightarrow$ observed colligative property calculated se kam."},{"id":196,"c":"Henry's law","q":"Assertion (A): The Henry's law constant of a gas generally increases with increase in temperature. Reason (R): Dissolution of a gas in a liquid is an exothermic process, so its solubility decreases with increase in temperature.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$K_H = p/x$: solubility $x$ ghat ne ka matlab $K_H$ badhna. Heating par solubility ghat ti hai isliye $K_H$ badh ta hai.","m":"$K_H$, solubility ka inverse hai — is relation se A aur R ko jodo.","s":["Dissolution exothermic hai isliye heating par solubility ghat ti hai — R sahi.","Solubility ghat ne $\\Rightarrow K_H$ badhna — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; exothermic dissolution hi $K_H$ ke increase ka kaaran hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"$K_H$ aur solubility ka inverse relation: $x = p/K_H$."},{"id":197,"c":"Non-ideal solutions","q":"The total vapour pressure ($p$) of a liquid mixture of A and B at $300\\,\\mathrm{K}$ was measured as a function of mole fraction of A ($x_A$) in the liquid phase. The vapour pressures of pure A and pure B are $p_A^{\\circ} = 100\\,\\mathrm{mm\\,Hg}$ and $p_B^{\\circ} = 80\\,\\mathrm{mm\\,Hg}$. From the table it follows that","opt":["the mixture is ideal throughout, since the vapour pressure returns to $100\\,\\mathrm{mm\\,Hg}$ at $x_A = 1$","the mixture shows negative deviation at low $x_A$ and positive deviation at high $x_A$, and the initial fall in pressure indicates stronger A-B interactions","the mixture shows positive deviation throughout and forms a minimum boiling azeotrope","the data are inconsistent with any deviation, since vapour pressure can only increase with $x_A$"],"ans":1,"fig":{"type":"table","head":["$x_A$","Measured $p$ (mm Hg)","Raoult's law $p$ (mm Hg)"],"rows":[["0.0","80.0","80.0"],["0.2","79.0","84.0"],["0.5","78.0","90.0"],["0.8","97.0","96.0"],["1.0","100.0","100.0"]],"cap":"Total vapour pressure of A-B mixtures at 300 K."},"cpt":"Raoult's law se expected value: $p = 80+20x_A$. Jahan measured expected se kam ho wahan negative deviation, jahan zyada ho wahan positive deviation.","m":"Har row me expected value nikaalo aur compare karo.","s":["$x_A=0.2$: expected $84$, measured $79$ $\\Rightarrow$ measured kam $\\Rightarrow$ negative deviation.","$x_A=0.5$: expected $90$, measured $78$ $\\Rightarrow$ negative deviation.","$x_A=0.8$: expected $96$, measured $97$ $\\Rightarrow$ measured zyada $\\Rightarrow$ positive deviation.","Shuru me pressure girna strong A-B interactions dikhata hai (negative deviation)."],"r":"Low $x_A$ par measured kam (negative deviation) aur high $x_A$ par measured zyada (positive deviation) hai — option B sahi hai.","w":["Sirf end points match hona ideal behaviour prove nahi karta.","Poore range me positive deviation nahi hai.","Data consistent hai; curve pehle girta hai phir badhta hai."],"t":"Data ko row-wise verify karo — end points (0 aur 1) par hamesha $p = p^{\\circ}$ hota hai, chahe mixture ideal ho ya na ho."},{"id":198,"c":"Depression of freezing point","q":"The freezing points of aqueous solutions of a non-electrolyte at different molalities are recorded ($K_f$ of water $= 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$): $0.20\\,\\mathrm{m} \\rightarrow -0.372\\,^{\\circ}\\mathrm{C}$; $0.40\\,\\mathrm{m} \\rightarrow -0.744\\,^{\\circ}\\mathrm{C}$; $0.60\\,\\mathrm{m} \\rightarrow -1.116\\,^{\\circ}\\mathrm{C}$. Using these data, the freezing point of a $0.80\\,\\mathrm{m}$ solution of the same solute, assuming the same proportionality, is","opt":["$-1.488\\,^{\\circ}\\mathrm{C}$","$-1.674\\,^{\\circ}\\mathrm{C}$","$-2.232\\,^{\\circ}\\mathrm{C}$","$-0.930\\,^{\\circ}\\mathrm{C}$"],"ans":0,"fig":{"type":"table","head":["Molality ($\\mathrm{mol\\,kg^{-1}}$)","Freezing point ($^{\\circ}\\mathrm{C}$)"],"rows":[["0.20","$-0.372$"],["0.40","$-0.744$"],["0.60","$-1.116$"]],"cap":"Freezing point data for a non-electrolyte solution."},"cpt":"Dilute solutions ke liye $\\Delta T_f = K_fm$ — depression molality ke proportional hoti hai. Data se $K_f$ confirm karo: $0.372/0.2 = 1.86$.","m":"Proportionality constant ($\\Delta T_f/m$) nikaalo, phir 0.80 m par apply karo.","s":["$\\Delta T_f/m = 0.372/0.20 = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$.","$0.80\\,\\mathrm{m}$ ke liye $\\Delta T_f = 1.86\\times0.80 = 1.488\\,\\mathrm{K}$.","Freezing point $= -1.488\\,^{\\circ}\\mathrm{C}$."],"r":"$\\Delta T_f = 1.488\\,\\mathrm{K}$, isliye freezing point $-1.488\\,^{\\circ}\\mathrm{C}$.","w":["$-1.674$ galat slope se aata hai.","$-2.232$ 0.6 ki value ka double hai.","$-0.930$ 0.5 m ke liye hota."],"t":"Linear data ko extrapolate karte waqt sirf slope se multiply karo — end point se guess mat karo."},{"id":199,"c":"Abnormal molar mass","q":"The apparent molar masses of an electrolyte in aqueous solution determined from colligative properties are given: at $0.05\\,\\mathrm{m}$, apparent molar mass $= 40\\,\\mathrm{g\\,mol^{-1}}$; at $0.10\\,\\mathrm{m}$, apparent molar mass $= 35\\,\\mathrm{g\\,mol^{-1}}$; at $0.20\\,\\mathrm{m}$, apparent molar mass $= 30\\,\\mathrm{g\\,mol^{-1}}$. The true molar mass of the electrolyte is $60\\,\\mathrm{g\\,mol^{-1}}$. The van't Hoff factor of the electrolyte at $0.10\\,\\mathrm{m}$ is","opt":["$0.58$","$1.71$","$1.20$","$2.40$"],"ans":1,"fig":{"type":"table","head":["Molality ($\\mathrm{mol\\,kg^{-1}}$)","Apparent molar mass ($\\mathrm{g\\,mol^{-1}}$)"],"rows":[["0.05","40"],["0.10","35"],["0.20","30"]],"cap":"Apparent molar mass of an electrolyte in water (true molar mass 60)."},"cpt":"Electrolyte ke liye apparent molar mass true se kam hota hai (dissociation), aur $i = \\dfrac{\\text{true}}{\\text{apparent}}$.","m":"$0.10\\,\\mathrm{m}$ wali apparent molar mass lo aur ratio nikalo.","s":["$i = \\dfrac{M_{\\text{normal}}}{M_{\\text{apparent}}}$ aur yahan $M_{\\text{normal}} = 60\\,\\mathrm{g\\,mol^{-1}}$.","Apparent molar mass at $0.10\\,\\mathrm{m}$ $= 35\\,\\mathrm{g\\,mol^{-1}}$.","$i = \\dfrac{60}{35} = 1.714$.","Sahi option B: $i = 1.71$."],"r":"$i = 60/35 = 1.71$ — partial dissociation ke saath consistent.","w":["$0.58$ ulta ratio hai ($35/60$).","$1.20$ galat value se aata hai.","$2.40$ zyada hai."],"t":"Dissociation $\\Rightarrow$ apparent molar mass kam $\\Rightarrow i>1$; association me ulta."},{"id":200,"c":"Osmotic pressure","q":"The osmotic pressures of four aqueous solutions at the same temperature are measured and given (all $0.10\\,\\mathrm{M}$ with respect to the solute): glucose $2.46\\,\\mathrm{atm}$; $\\ce{NaCl}$ $4.92\\,\\mathrm{atm}$; $\\ce{CaCl2}$ $7.38\\,\\mathrm{atm}$; $\\ce{Al2(SO4)3}$ $12.30\\,\\mathrm{atm}$. From these data, which conclusion is correct? ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$)","opt":["the temperature is $300\\,\\mathrm{K}$, and the measured pressures indicate complete dissociation of the electrolytes","the temperature is $300\\,\\mathrm{K}$, and the measured pressures indicate that glucose dissociates in solution","the temperature is $500\\,\\mathrm{K}$, and only $\\ce{NaCl}$ dissociates into ions","the data are internally inconsistent because osmotic pressure must be the same for equal molar solutions"],"ans":0,"fig":{"type":"table","head":["Solute ($0.10\\,\\mathrm{M}$)","$\\pi$ (atm)","$\\pi/CRT$ at 300 K"],"rows":[["glucose","2.46","1"],["$\\ce{NaCl}$","4.92","2"],["$\\ce{CaCl2}$","7.38","3"],["$\\ce{Al2(SO4)3}$","12.30","5"]],"cap":"Osmotic pressure data for 0.10 M solutions."},"cpt":"$\\pi = iCRT$: $T = \\dfrac{\\pi}{iCR}$. Glucose ke liye $i=1$, isliye $T$ seedha nikal sakte hain.","m":"Glucose ki row se $T$ nikaalo, phir baaki rows se $i$ verify karo.","s":["Glucose: $T = \\dfrac{2.46}{0.10\\times0.0821} = 299.6\\,\\mathrm{K} \\approx 300\\,\\mathrm{K}$.","$\\ce{NaCl}$: $i = \\dfrac{4.92}{2.46} = 2$; $\\ce{CaCl2}$: $3$; $\\ce{Al2(SO4)3}$: $5$.","Ye values complete dissociation ke saath match karti hain."],"r":"$T \\approx 300\\,\\mathrm{K}$ aur $i$ values $1,2,3,5$ complete dissociation darshata hai — option A sahi.","w":["Glucose dissociate nahi karta ($i=1$).","$\\ce{NaCl}$ ke alawa baaki electrolytes bhi dissociate karte hain.","Data consistent hai — molarity same hone par bhi $i$ alag hone se $\\pi$ alag hota hai."],"t":"$\\pi$ data se $T$ aur $i$ dono nikal sakte hain — is type ke data-analysis questions NEET 2026 style ke hain."},{"id":201,"c":"Concentration terms","q":"An aqueous solution of a non-electrolyte has a mole fraction of solute equal to $0.05$. The molality of this solution is nearly (molar mass of water $= 18\\,\\mathrm{g\\,mol^{-1}}$)","opt":["$3.33\\,\\mathrm{m}$","$2.63\\,\\mathrm{m}$","$1.85\\,\\mathrm{m}$","$2.92\\,\\mathrm{m}$"],"ans":3,"cpt":"$x_2 = 0.05$ ka matlab $100$ mol total me $5$ mol solute aur $95$ mol water. Molality ke liye water ka mass kg me chahiye.","m":"95 mol water ka mass nikaalo ($95\\times18\\,\\mathrm{g}$), usse kg me badlo, phir $5$ mol ko divide karo.","s":["$n_2 = 5\\,\\mathrm{mol}$, $n_1 = 95\\,\\mathrm{mol}$.","Water ka mass $= 95\\times18 = 1710\\,\\mathrm{g} = 1.71\\,\\mathrm{kg}$.","$m = \\dfrac{5}{1.71} = 2.92\\,\\mathrm{mol\\,kg^{-1}}$."],"r":"$5$ mol solute $1.71\\,\\mathrm{kg}$ water me hai, isliye molality $2.92\\,\\mathrm{m}$.","w":["$3.33$ $x_2 = 0.056$ type value deta hai.","$2.63$ $x_2$ ko $0.05$ ke bajaye $0.047$ lene se aata hai.","$1.85$ galat water mass se aata hai."],"t":"Mole fraction se molality ka shortcut: $m = \\dfrac{x_2 \\times 1000}{(1-x_2)M_1}$ — yahan $M_1 = 18$."},{"id":202,"c":"Osmotic pressure","q":"$500\\,\\mathrm{mL}$ of $0.2\\,\\mathrm{M}$ aqueous $\\ce{NaCl}$ is mixed with $500\\,\\mathrm{mL}$ of $0.1\\,\\mathrm{M}$ aqueous $\\ce{CaCl2}$. Assuming complete dissociation of both electrolytes, the resulting mixture is isotonic with an aqueous glucose solution of concentration","opt":["$0.45\\,\\mathrm{M}$","$0.15\\,\\mathrm{M}$","$0.35\\,\\mathrm{M}$","$0.25\\,\\mathrm{M}$"],"ans":2,"cpt":"Mix karne par total volume double hota hai, isliye dono ki concentration aadhi. Phir particles count karo ($i$ ke saath).","m":"Dilution ke baad concentration nikaalo, $i$ se multiply karo, aur jodo.","s":["$\\ce{NaCl}$: $0.2/2 = 0.1\\,\\mathrm{M}$, particles $= 2\\times0.1 = 0.2\\,\\mathrm{M}$.","$\\ce{CaCl2}$: $0.1/2 = 0.05\\,\\mathrm{M}$, particles $= 3\\times0.05 = 0.15\\,\\mathrm{M}$.","Total $= 0.35\\,\\mathrm{M}$ particles $\\Rightarrow$ $0.35\\,\\mathrm{M}$ glucose ke isotonic."],"r":"Total particle concentration $0.35\\,\\mathrm{M}$ hai, isliye $0.35\\,\\mathrm{M}$ glucose ke barabar osmotic pressure hoga.","w":["$0.45$ dono ko double karne se aata hai.","$0.15$ sirf $\\ce{CaCl2}$ ka contribution hai.","$0.25$ me dilution galat liya gaya."],"t":"Mixing me volume add karke concentration halve karna pehla step hai — iske bina answer galat aayega."},{"id":203,"c":"Vapour pressure","q":"When $30\\,\\mathrm{g}$ of a non-volatile non-electrolyte solute is dissolved in $90\\,\\mathrm{g}$ of water, the vapour pressure of the solution at $373\\,\\mathrm{K}$ is $740\\,\\mathrm{mm\\,Hg}$ while that of pure water is $760\\,\\mathrm{mm\\,Hg}$. The molar mass of the solute is nearly","opt":["$180\\,\\mathrm{g\\,mol^{-1}}$","$200\\,\\mathrm{g\\,mol^{-1}}$","$250\\,\\mathrm{g\\,mol^{-1}}$","$222\\,\\mathrm{g\\,mol^{-1}}$"],"ans":3,"cpt":"$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = \\dfrac{n_2}{n_1+n_2}$. Yahan $n_1 = 90/18 = 5\\,\\mathrm{mol}$ water.","m":"Pehle relative lowering nikaalo, phir $n_2$ ke liye solve karo, phir molar mass.","s":["$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = \\dfrac{760-740}{760} = \\dfrac{20}{760} = 0.02632$.","$0.02632 = \\dfrac{n_2}{n_2+5} \\Rightarrow n_2 = 0.02632(n_2+5)$.","$n_2(1-0.02632) = 0.1316 \\Rightarrow n_2 = 0.1351\\,\\mathrm{mol}$.","$M = \\dfrac{30}{0.1351} \\approx 222\\,\\mathrm{g\\,mol^{-1}}$."],"r":"Molality-type calculation se $n_2 \\approx 0.135\\,\\mathrm{mol}$ aur $M \\approx 222\\,\\mathrm{g\\,mol^{-1}}$.","w":["$180$ galat denominator se aata hai.","$200$ galat approximation se aata hai.","$250$ zyada hai."],"t":"Relative lowering me denominator total moles ($n_1+n_2$) aata hai — sirf $n_1$ lena galti hai. Dilute solution me approximation se same answer aata hai, par yahan solute bada hai."},{"id":204,"c":"Elevation of boiling point","q":"When $6.0\\,\\mathrm{g}$ of urea (molar mass $60\\,\\mathrm{g\\,mol^{-1}}$) is dissolved in $180\\,\\mathrm{g}$ of water, the boiling point of the solution at $1\\,\\mathrm{atm}$ is ($K_b$ of water $= 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$)","opt":["$100.13\\,^{\\circ}\\mathrm{C}$","$100.29\\,^{\\circ}\\mathrm{C}$","$100.52\\,^{\\circ}\\mathrm{C}$","$100.58\\,^{\\circ}\\mathrm{C}$"],"ans":1,"cpt":"$\\Delta T_b = K_bm$; urea ke liye $i=1$.","m":"Molality nikaalo ($6/60 = 0.1$ mol in $0.18$ kg), phir multiply.","s":["$n = 0.1\\,\\mathrm{mol}$, water $= 0.18\\,\\mathrm{kg}$.","$m = 0.1/0.18 = 0.5556\\,\\mathrm{mol\\,kg^{-1}}$.","$\\Delta T_b = 0.52\\times0.5556 = 0.2889\\,\\mathrm{K}$.","$T_b = 100.29\\,^{\\circ}\\mathrm{C}$."],"r":"$\\Delta T_b = 0.289\\,\\mathrm{K}$, isliye boiling point $100.29\\,^{\\circ}\\mathrm{C}$.","w":["$100.13$ tab aata agar mass $0.36\\,\\mathrm{kg}$ hoti.","$100.52$ 1 molal ke liye hota.","$100.58$ galat molality se aata hai."],"t":"$180\\,\\mathrm{g}$ water $= 0.18\\,\\mathrm{kg}$ — decimal shift ki galti se answer badal jata hai."},{"id":205,"c":"Osmotic pressure","q":"A solution contains $0.10\\,\\mathrm{M}$ glucose and $0.20\\,\\mathrm{M}$ urea. At $300\\,\\mathrm{K}$, the osmotic pressure of this solution ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$) is","opt":["$2.46\\,\\mathrm{atm}$","$4.93\\,\\mathrm{atm}$","$7.39\\,\\mathrm{atm}$","$9.85\\,\\mathrm{atm}$"],"ans":2,"cpt":"Osmotic pressure colligative hai, isliye ek hi solution ke saare non-electrolyte solutes ke particle concentrations add ho jate hain: $\\pi = (C_1+C_2)RT$.","m":"Total particle molarity nikaalo, phir $RT$ se multiply.","s":["Total $C = 0.10+0.20 = 0.30\\,\\mathrm{M}$.","$\\pi = 0.30\\times0.0821\\times300$.","$\\pi = 0.30\\times24.63 = 7.39\\,\\mathrm{atm}$."],"r":"Total particle concentration $0.30\\,\\mathrm{M}$ hai, isliye $\\pi = 7.39\\,\\mathrm{atm}$.","w":["$2.46$ sirf glucose ke liye hota.","$4.93$ sirf urea ke liye hota ($0.2$ M).","$9.85$ galat total se aata hai."],"t":"Ek solution me multiple solutes ho to unki molarities (particles ke hisaab se) add karo — ye 'mixture ka colligative effect' hai."},{"id":206,"c":"Degree of dissociation","q":"A $0.10\\,\\mathrm{m}$ aqueous solution of acetic acid shows a depression in freezing point of $0.2046\\,\\mathrm{K}$. Taking $K_f$ of water as $1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the degree of dissociation of acetic acid in this solution is","opt":["$5\\%$","$10\\%$","$20\\%$","$50\\%$"],"ans":1,"sim":{"title":"Weak acid: alpha se i tak","sliders":[{"name":"a","label":"α (0 se 1)","min":0,"max":1,"step":0.01,"val":0.1},{"name":"m","label":"molality m","min":0.02,"max":0.3,"step":0.02,"val":0.1}],"calc":"var i = 1 + a; var dT = 1.86*i*m; return [['i', i.toFixed(2)], ['ΔT_f', dT.toFixed(4)+' K']];"},"cpt":"Acetic acid weak monobasic acid hai: $i = 1+\\alpha$. Pehle $i = \\dfrac{\\text{observed } \\Delta T_f}{K_fm}$ nikaalo.","m":"Calculated depression ($i=1$ maan kar) nikaalo, phir ratio se $i$, phir $\\alpha$.","s":["Calculated $\\Delta T_f$ (bina dissociation) $= 1.86\\times0.10 = 0.186\\,\\mathrm{K}$.","$i = \\dfrac{0.2046}{0.186} = 1.10$.","$i = 1+\\alpha \\Rightarrow \\alpha = 0.10$, yani $10\\%$."],"r":"$i = 1.10$ se $\\alpha = 0.10$, yani $10\\%$ dissociation.","w":["$5\\%$ ke liye $i = 1.05$ chahiye.","$20\\%$ ke liye $i = 1.20$ chahiye.","$50\\%$ ke liye $i = 1.50$ chahiye."],"t":"Weak acid ke liye $i = 1+\\alpha$ (monobasic); $\\alpha$ nikalne ke liye $i-1$ karo."},{"id":207,"c":"Degree of association","q":"A $0.10\\,\\mathrm{m}$ solution of benzoic acid in benzene shows a depression in freezing point of $0.35\\,\\mathrm{K}$. Taking $K_f$ of benzene as $5.12\\,\\mathrm{K\\,kg\\,mol^{-1}}$ and assuming that benzoic acid exists only as monomer and dimer in solution, the percentage of benzoic acid which has dimerised is","opt":["$27\\%$","$48\\%$","$63\\%$","$75\\%$"],"ans":2,"cpt":"Dimerisation: $i = 1-\\dfrac{\\alpha}{2}$. Yahan $i = \\dfrac{\\text{observed}}{\\text{calculated}} = \\dfrac{0.35}{5.12\\times0.1}$.","m":"Calculated depression nikaalo, $i$ nikaalo, phir $\\alpha$ solve karo.","s":["Calculated $\\Delta T_f = 5.12\\times0.10 = 0.512\\,\\mathrm{K}$.","$i = \\dfrac{0.35}{0.512} = 0.6836$.","$0.6836 = 1-\\dfrac{\\alpha}{2} \\Rightarrow \\dfrac{\\alpha}{2} = 0.3164 \\Rightarrow \\alpha = 0.6328$.","Yani lagbhag $63\\%$ dimerised."],"r":"$\\alpha \\approx 0.63$, isliye $63\\%$ benzoic acid dimer ban gaya.","w":["$27\\%$ $\\alpha$ ko aadha lene se aata hai.","$48\\%$ galat arithmetic se aata hai.","$75\\%$ ke liye $i = 0.625$ chahiye."],"t":"Dimer: $i = 1-\\alpha/2$; trimer: $i = 1-2\\alpha/3$. Formula $n$ ke hisaab se badalta hai."},{"id":208,"c":"van't Hoff factor","q":"An aqueous solution of $\\ce{NaCl}$ of molality $1.0\\,\\mathrm{m}$ freezes at $-3.35\\,^{\\circ}\\mathrm{C}$. Taking $K_f$ of water as $1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the van't Hoff factor and the degree of dissociation of $\\ce{NaCl}$ in this solution are respectively","opt":["$1.80$ and $0.80$","$1.80$ and $0.90$","$2.00$ and $1.00$","$1.50$ and $0.50$"],"ans":0,"cpt":"$i = \\dfrac{\\Delta T_f}{K_fm}$ aur $\\ce{NaCl}$ ke liye $i = 1+\\alpha$ (do ions).","m":"Pehle $i$, phir $\\alpha = i-1$.","s":["$\\Delta T_f = 3.35\\,\\mathrm{K}$ (freezing point $-3.35\\,^{\\circ}\\mathrm{C}$).","$i = \\dfrac{3.35}{1.86\\times1.0} = 1.80$.","$i = 1+\\alpha \\Rightarrow \\alpha = 0.80$."],"r":"$i = 1.80$ aur $\\alpha = 0.80$ — dono consistent hain.","w":["$0.90$ ke liye $i = 1.90$ chahiye.","$2.00$ complete dissociation ke liye hota.","$1.50$ me $\\alpha$ ka value match nahi karta."],"t":"Electrolyte ke liye $\\alpha = i-1$ (jab $n=2$); general formula $\\alpha = \\dfrac{i-1}{n-1}$."},{"id":209,"c":"Henry's law","q":"The Henry's law constant of oxygen in water at $298\\,\\mathrm{K}$ is $4.6\\times10^{4}\\,\\mathrm{atm}$. The mass of oxygen that dissolves in $1\\,\\mathrm{L}$ of water at $298\\,\\mathrm{K}$ when the partial pressure of oxygen above water is $0.20\\,\\mathrm{atm}$ is nearly (molar mass of $\\ce{O2} = 32\\,\\mathrm{g\\,mol^{-1}}$; $1\\,\\mathrm{L}$ of water $= 55.5\\,\\mathrm{mol}$)","opt":["$0.077\\,\\mathrm{mg}$","$77\\,\\mathrm{mg}$","$0.77\\,\\mathrm{mg}$","$7.7\\,\\mathrm{mg}$"],"ans":3,"cpt":"$x = \\dfrac{p}{K_H}$ se mole fraction milta hai; phir $1\\,\\mathrm{L}$ paani ke $55.5\\,\\mathrm{mol}$ se multiply karke moles aur mass nikaalna hai.","m":"Teen steps: mole fraction $\\rightarrow$ moles $\\rightarrow$ mass.","s":["$x = \\dfrac{0.20}{4.6\\times10^{4}} = 4.35\\times10^{-6}$.","Moles $= 4.35\\times10^{-6}\\times55.5 = 2.41\\times10^{-4}\\,\\mathrm{mol}$.","Mass $= 2.41\\times10^{-4}\\times32 = 7.7\\times10^{-3}\\,\\mathrm{g} = 7.7\\,\\mathrm{mg}$."],"r":"Oxygen ka mass $\\approx 7.7\\,\\mathrm{mg}$ per litre.","w":["$0.077\\,\\mathrm{mg}$ bahut kam hai.","$77\\,\\mathrm{mg}$ das guna zyada hai.","$0.77\\,\\mathrm{mg}$ me decimal shift hai."],"t":"Dilute solution me $x\\times55.5$ se moles per litre milte hain — ye shortcut yaad rakho."},{"id":210,"c":"Reverse osmosis","q":"A sea water sample may be modelled as $0.50\\,\\mathrm{M}$ $\\ce{NaCl}$. At $300\\,\\mathrm{K}$, the osmotic pressure (that is, the minimum pressure that must be applied on the sea water side in a reverse osmosis unit to bring it into equilibrium with pure water) is nearly ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$, complete dissociation assumed)","opt":["$12.3\\,\\mathrm{atm}$","$24.6\\,\\mathrm{atm}$","$36.9\\,\\mathrm{atm}$","$49.2\\,\\mathrm{atm}$"],"ans":1,"cpt":"$\\pi = iCRT$; $\\ce{NaCl}$ ke liye $i=2$. RO me isse zyada pressure lagana padta hai.","m":"$i$ multiply karo, phir $CRT$.","s":["Given: $C = 0.50\\,\\mathrm{M}$, $i = 2$ ($\\ce{NaCl}$), $T = 300\\,\\mathrm{K}$.","Effective concentration $= 2\\times0.50 = 1.0\\,\\mathrm{M}$.","$\\pi = 1.0\\times0.0821\\times300 = 24.63\\,\\mathrm{atm}$.","Sahi option B: $24.6\\,\\mathrm{atm}$."],"r":"$\\pi \\approx 24.6\\,\\mathrm{atm}$ — RO ke liye isse zyada pressure chahiye.","w":["$12.3$ tab aata agar $i=1$.","$36.9$ me $i=3$ liya gaya.","$49.2$ double ho gaya."],"t":"Sea water ka osmotic pressure $\\approx 25\\,\\mathrm{atm}$ — ye number NEET me application question ke roop me aata hai."},{"id":211,"c":"Raoult's law","q":"For an ideal binary mixture of liquids A and B at a fixed temperature, $p_A^{\\circ} = 200\\,\\mathrm{mm\\,Hg}$ and $p_B^{\\circ} = 100\\,\\mathrm{mm\\,Hg}$. When $x_A = 0.25$ in the liquid phase, the mole fraction of A in the vapour phase in equilibrium with the liquid is","opt":["$0.25$","$0.30$","$0.40$","$0.50$"],"ans":2,"cpt":"$y_A = \\dfrac{p_A^{\\circ}x_A}{p_A^{\\circ}x_A + p_B^{\\circ}x_B}$.","m":"Partial pressures nikaalo, total banao, phir ratio.","s":["$p_A = 200\\times0.25 = 50\\,\\mathrm{mm\\,Hg}$.","$p_B = 100\\times0.75 = 75\\,\\mathrm{mm\\,Hg}$; total $= 125$.","$y_A = \\dfrac{50}{125} = 0.40$."],"r":"$y_A = 50/125 = 0.40$.","w":["$0.25$ liquid ka mole fraction hai.","$0.30$ galat total se aata hai.","$0.50$ ke liye $x_A$ alag chahiye."],"t":"Vapour phase us component se rich hota hai jiska $p^{\\circ}$ zyada hai — A ($200>100$) isliye $y_A > x_A$."},{"id":212,"c":"Raoult's law","q":"For an ideal binary mixture at a fixed temperature, $p_A^{\\circ} = 100\\,\\mathrm{mm\\,Hg}$ and $p_B^{\\circ} = 300\\,\\mathrm{mm\\,Hg}$. When $x_A = 0.50$ in the liquid phase, the mole fraction of A in the vapour phase is","opt":["$0.17$","$0.25$","$0.50$","$0.75$"],"ans":1,"cpt":"$y_A = \\dfrac{p_A}{p_{\\text{total}}}$, aur yahan B zyada volatile hai, isliye vapour me B rich hoga.","m":"Partial pressures nikaalo aur divide karo.","s":["$p_A = 100\\times0.5 = 50$.","$p_B = 300\\times0.5 = 150$; total $= 200$.","$y_A = 50/200 = 0.25$."],"r":"$y_A = 0.25$ aur $y_B = 0.75$ — vapour B se rich hai.","w":["$0.17$ galat total se aata hai.","$0.50$ liquid ka mole fraction hai.","$0.75$ B ka vapour mole fraction hai."],"t":"Same $x$ par jiska $p^{\\circ}$ zyada, usi ka $y$ zyada — yahan B ka $y = 0.75$."},{"id":213,"c":"Vapour pressure","q":"Statement I: For a solution of a non-volatile solute, the ratio of the relative lowering of vapour pressure to the molality of the solution is independent of the molar mass of the solute. Statement II: The relative lowering of vapour pressure of such a solution equals the mole fraction of the solute, which is related to the molality through the molar mass of the solute and of the solvent.","opt":["Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"Dilute solution me $x_2 \\approx \\dfrac{m M_1}{1000}$, isliye $\\dfrac{x_2}{m} \\approx \\dfrac{M_1}{1000}$ — ye sirf solvent ke molar mass par depend karta hai, solute ke nahi.","m":"Approximation $x_2 \\approx m M_1/1000$ likho aur ratio dekho.","s":["$x_2 = \\dfrac{m}{m+1000/M_1} \\approx \\dfrac{mM_1}{1000}$ (dilute).","$\\dfrac{x_2}{m} \\approx \\dfrac{M_1}{1000}$ — solute ke molar mass se independent — Statement I sahi.","Relative lowering $= x_2$ aur $x_2$ molality se linked hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; ratio sirf solvent ke molar mass par depend karta hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Dilute solution approximation: $x_2 \\approx \\dfrac{mM_1}{1000}$ — ye bahut kaam aata hai."},{"id":214,"c":"van't Hoff factor","q":"Statement I: A $0.1\\,\\mathrm{m}$ aqueous solution of a weak monobasic acid which is $10\\%$ dissociated has a van't Hoff factor of about $1.1$ and its freezing point depression is about $10\\%$ greater than that of a $0.1\\,\\mathrm{m}$ solution of a non-electrolyte. Statement II: The van't Hoff factor corrects a colligative property for the actual number of particles present in the solution.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"$i = 1+\\alpha = 1.10$ (10% dissociation). Isliye $\\Delta T_f$ bhi $1.10$ guna ho jata hai, yani $10\\%$ zyada.","m":"$i$ nikaalo aur colligative property par uske effect ko check karo.","s":["$\\alpha = 0.1 \\Rightarrow i = 1+0.1 = 1.1$ — Statement I sahi.","$\\Delta T_f$ bhi $i$ ke proportional hai, isliye $10\\%$ zyada — sahi.","Statement II $i$ ki definition hai — sahi.","Dono correct hain."],"r":"Dono statements correct hain; $i$ actual particle count ka correction factor hai.","w":["Statement II galat nahi.","Statement I galat nahi.","Dono sahi hain."],"t":"$i$ ka matlab: actual particles / expected particles — isliye property bhi usi ratio me badalti hai."},{"id":215,"c":"Osmosis","q":"Statement I: Two aqueous solutions, one $0.10\\,\\mathrm{M}$ in glucose and the other $0.10\\,\\mathrm{M}$ in urea, placed on opposite sides of a semipermeable membrane at the same temperature, show no net movement of solvent. Statement II: Glucose and urea are both non-electrolytes, so both solutions contain the same number of solute particles per unit volume.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Dono non-electrolytes hain ($i=1$) aur molarity same hai, isliye osmotic pressures barabar hain — isotonic solutions, koi net flow nahi.","m":"$iC$ compare karo: $1\\times0.1$ vs $1\\times0.1$ — barabar.","s":["Dono ke $i=1$ aur $C=0.10\\,\\mathrm{M}$ — Statement II sahi.","Barabar $\\pi$ matlab isotonic, net flow zero — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; barabar particle concentration se koi net osmosis nahi hota.","w":["Statement II galat nahi.","Statement I galat nahi.","Dono sahi hain."],"t":"Isotonic solutions ke beech net flow zero, par molecules ka exchange dono taraf barabar chalta rehta hai."},{"id":216,"c":"Non-ideal solutions","q":"Statement I: At a given temperature, the total vapour pressure of a binary mixture of two volatile liquids lies between the vapour pressures of the two pure components only if the solution is ideal or shows small deviations. Statement II: For strongly non-ideal solutions, the total vapour pressure may exceed the vapour pressure of both pure components, giving a maximum in the vapour pressure-composition curve.","opt":["Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct"],"ans":1,"cpt":"Positive deviation bahut strong ho to $p$ dono pure components se bhi zyada ho sakta hai (curve me maximum) — jaise ethanol-water type systems me azeotrope ke paas.","m":"Deviation ka magnitude socho: chhoti deviation me $p$ beech me rehta hai, badi deviation me bahar nikal sakta hai.","s":["Ideal/chhoti deviation me $p$ beech me rehta hai — Statement I sahi.","Strong positive deviation me $p$ dono se zyada ho sakta hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; strong positive deviation me vapour pressure dono pure components se zyada ho sakta hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Azeotropic point par curve ka extremum hota hai — maximum boiling azeotrope me minimum $p$."},{"id":217,"c":"Azeotropes","q":"Statement I: A liquid pair which forms a minimum boiling azeotrope cannot be completely separated into its pure components by fractional distillation at that pressure. Statement II: At the azeotropic composition the vapour has the same composition as the liquid, so boiling does not change the composition of the mixture.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Azeotrope par $y=x$, isliye distillation se composition badal nahi sakta — pure components nahi milte.","m":"Statement II kaaran hai, Statement I nateeja — dono sahi.","s":["Azeotrope par $y=x$ — Statement II sahi.","Isliye fractional distillation se separation possible nahi — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; same composition wala vapour distill hone ka matlab hai koi separation nahi.","w":["Statement II galat nahi.","Statement I galat nahi.","Dono sahi hain."],"t":"Isliye azeotrope ko todne ke liye pressure badla jata hai ya third component add kiya jata hai (extractive distillation)."},{"id":218,"c":"van't Hoff factor","q":"Statement I: In a $0.1\\,\\mathrm{m}$ aqueous solution of $\\ce{K4[Fe(CN)6]}$, assuming complete dissociation, the effective molality of particles is $0.5\\,\\mathrm{m}$. Statement II: Under these conditions, the van't Hoff factor of $\\ce{K4[Fe(CN)6]}$ has a value of $4$.","opt":["Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect"],"ans":3,"cpt":"$\\ce{K4[Fe(CN)6]} \\rightarrow 4\\ce{K+} + \\ce{[Fe(CN)6]^{4-}}$: total $5$ particles, isliye $i=5$, aur effective molality $= 0.5$.","m":"Ions gino: $4+1 = 5$.","s":["Particles $= 5$, isliye $i = 5$ (Statement II galat hai).","Effective molality $= 5\\times0.1 = 0.5\\,\\mathrm{m}$ (Statement I sahi).","Isliye Statement I correct, Statement II incorrect."],"r":"Effective molality $0.5\\,\\mathrm{m}$ sahi hai, par $i=4$ galat hai ($i=5$ hona chahiye).","w":["Statement II galat hai.","Statement I galat nahi.","Statement I sahi hai."],"t":"Complex salts me coordination sphere ke andar ke ions alag nahi hote — isliye $\\ce{[Fe(CN)6]^{4-}}$ ek particle hai."},{"id":219,"c":"Colligative properties","q":"Statement I: Adding $0.10\\,\\mathrm{mol}$ of $\\ce{NaCl}$ to $1\\,\\mathrm{kg}$ of water lowers its freezing point by nearly the same amount as adding $0.20\\,\\mathrm{mol}$ of glucose to $1\\,\\mathrm{kg}$ of water. Statement II: Each formula unit of $\\ce{NaCl}$ gives two ions in solution, so $0.10\\,\\mathrm{mol}$ of $\\ce{NaCl}$ provides $0.20\\,\\mathrm{mol}$ of particles.","opt":["Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"$\\ce{NaCl}$ ka $i=2$, isliye $0.1$ mol $\\ce{NaCl}$ $= 0.2$ mol particles. Glucose ka $i=1$, isliye $0.2$ mol glucose $= 0.2$ mol particles. Barabar particles $\\Rightarrow$ barabar depression.","m":"Particles count karo dono taraf.","s":["$\\ce{NaCl}$: $0.1\\times2 = 0.2$ mol particles — Statement II sahi.","Glucose: $0.2\\times1 = 0.2$ mol particles.","Dono barabar particles $\\Rightarrow$ same depression — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; particle count barabar hone se depression bhi barabar hoti hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"$0.1\\,\\mathrm{m}$ $\\ce{NaCl} \\equiv 0.2\\,\\mathrm{m}$ glucose — ye equivalence colligative comparisons me kaam aati hai."},{"id":220,"c":"Colligative properties","q":"Statement I: The relative lowering of vapour pressure of a solution containing a non-volatile solute is a colligative property, but the actual vapour pressure of that solution is not. Statement II: The relative lowering of vapour pressure depends only on the number of solute particles, whereas the actual vapour pressure also depends on the nature of the solvent and on temperature.","opt":["Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Relative lowering $= x_2$ sirf particle number par depend karti hai (colligative). Actual vapour pressure solvent ki nature aur temperature par bhi depend karta hai, isliye wo colligative nahi hai.","m":"Colligative ki definition se dono statements test karo.","s":["Relative lowering $= x_2$ — colligative — Statement I sahi.","Actual $p$ solvent aur temperature par bhi depend karta hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; relative quantity colligative hai, absolute nahi.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Yahi reason hai ki tumhe 'vapour pressure' ko colligative property list me nahi dekhna chahiye — sirf 'relative lowering' colligative hai."},{"id":221,"c":"Constants","q":"Statement I: For a given solvent, the values of $K_f$ and $K_b$ are related respectively to its enthalpy of fusion and enthalpy of vaporisation. Statement II: The values of $K_f$ and $K_b$ of a solvent depend on the molar mass of the solute added.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect"],"ans":3,"cpt":"$K_f = \\dfrac{RT_f^2M_1}{1000\\Delta H_{\\text{fus}}}$ aur $K_b = \\dfrac{RT_b^2M_1}{1000\\Delta H_{\\text{vap}}}$. Isliye $K_f$ fusion enthalpy se aur $K_b$ vaporisation enthalpy se juda hai. Solute ka koi role nahi.","m":"Dono constants ke formulae likho aur dekho kin quantities par depend karte hain.","s":["$K_f$ enthalpy of fusion par aur $K_b$ enthalpy of vaporisation par depend karta hai — Statement I sahi.","Dono solute ki nature/molar mass par depend nahi karte — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"Constants solvent ke properties hain; solute ka molar mass unme nahi aata, isliye Statement II galat hai.","w":["Statement I to sahi hai, par Statement II galat hai — isliye ye option nahi.","Statement I galat nahi hai, isliye 'both incorrect' nahi.","Statement II galat hai, isliye 'donon sahi' wala option nahi."],"t":"Formula me $M_1$ solvent ka molar mass hai, solute ka nahi — ye confusion NEET me deliberately create kiya jata hai."},{"id":222,"c":"Reverse osmosis","q":"Statement I: Sea water can be converted into drinking water by reverse osmosis only by applying a pressure exceeding its osmotic pressure. Statement II: In reverse osmosis, solvent is forced to flow in the direction opposite to that of natural osmosis, which requires the applied pressure to exceed the osmotic pressure.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect"],"ans":2,"cpt":"Natural osmosis me solvent dilute side se concentrated side jata hai. Ise ulta karne ke liye osmotic pressure se zyada external pressure chahiye.","m":"Dono statements ek hi condition ke do roop hain.","s":["RO ke liye $p>\\pi$ chahiye — Statement I sahi.","Direction ulti karne ke liye yahi pressure condition hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; pressure condition dono me sahi di gayi hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"RO plant me high pressure pump isliye lagta hai — sea water ka $\\pi \\approx 25$-$30\\,\\mathrm{atm}$ hota hai."},{"id":223,"c":"Non-ideal solutions","q":"Which of the following statements is NOT correct?","opt":["For a mixture showing a maximum boiling azeotrope, the total vapour pressure at the azeotropic composition is greater than the vapour pressure of either pure component.","For an ideal binary solution, the vapour-phase composition differs from the liquid-phase composition unless the two pure components have identical vapour pressures.","In a solution showing positive deviation from Raoult's law, the enthalpy of mixing is positive.","At the azeotropic composition, the total vapour pressure-composition curve shows a maximum or a minimum."],"ans":0,"cpt":"Maximum boiling azeotrope me vapour pressure minimum hota hai — dono pure components se kam. Isliye 'greater than either' wali statement galat hai.","m":"Azeotrope ke type aur vapour pressure extremum ka relation yaad karo.","s":["Ideal solution me $y \\ne x$ jab tak $p_1^{\\circ}\\ne p_2^{\\circ}$ — sahi.","Azeotrope par curve ka extremum hota hai — sahi.","Positive deviation me $\\Delta H>0$ — sahi.","Max boiling azeotrope par $p$ dono se kam hota hai, zyada nahi — galat statement."],"r":"Maximum boiling azeotrope par vapour pressure minimum (dono pure components se kam) hota hai, isliye ye statement NOT correct hai.","w":["Ye sahi hai.","Positive deviation ka sign sahi hai.","Ye bhi sahi hai."],"t":"Max boiling $\\leftrightarrow$ min vapour pressure; min boiling $\\leftrightarrow$ max vapour pressure."},{"id":224,"c":"Osmotic pressure","q":"Which of the following statements is NOT correct?","opt":["The osmotic pressure of a solution containing two non-electrolytes is the sum of the osmotic pressures that each would exert separately at the same temperature.","The osmotic pressure of a $0.1\\,\\mathrm{M}$ solution of a weak electrolyte lies between that of a $0.1\\,\\mathrm{M}$ non-electrolyte and that of a fully dissociated $0.1\\,\\mathrm{M}$ strong electrolyte of the same type.","Osmotic pressure measurement requires a semipermeable membrane.","The osmotic pressure of a solution increases when the solution is diluted at constant temperature."],"ans":3,"cpt":"Dilution se concentration ghat ti hai, isliye osmotic pressure ghat ta hai — badh ta nahi.","m":"$\\pi = iCRT$ me dilution ka effect dekho: $C$ ghat ta hai.","s":["Alag-alag solutes ke $\\pi$ add hote hain — sahi.","Weak electrolyte ka $\\pi$ dono limits ke beech hota hai — sahi.","Semipermeable membrane zaroori hai — sahi.","Dilution par $\\pi$ ghat ta hai, badh ta nahi — galat statement."],"r":"Dilution se $C$ kam hota hai, isliye $\\pi$ bhi kam hota hai; 'increases on dilution' galat hai.","w":["Ye sahi hai (colligative additivity).","Ye bhi sahi hai.","Membrane ke bina measurement possible nahi."],"t":"$\\pi \\propto C$: dilute karo to $\\pi$ ghat ta hai, evaporate karo to badh ta hai."},{"id":225,"c":"Azeotropes","q":"Which of the following statements is correct?","opt":["The boiling point of a binary liquid mixture can be lower than the boiling points of both pure components.","Solutions showing positive deviation from Raoult's law always boil at a temperature higher than the boiling points of both components.","During distillation of an azeotropic mixture, the composition of the liquid continuously changes in the direction of purity.","Addition of a non-volatile solute lowers the boiling point of the solvent."],"ans":0,"cpt":"Minimum boiling azeotrope ka boiling point dono pure components se kam hota hai — ye positive deviation ka result hai.","m":"'Can be lower' wali possibility check karo — haan, minimum boiling azeotrope me aisa hota hai.","s":["Minimum boiling azeotrope ka $T_b$ dono se kam — sahi.","Positive deviation me $T_b$ ideal se kam hota hai, zyada nahi.","Azeotrope ki composition distillation se nahi badalti.","Solute dalne se boiling point badhta hai."],"r":"Binary mixture ka boiling point dono pure components se kam ho sakta hai (minimum boiling azeotrope) — yahi sahi statement hai.","w":["Positive deviation se boiling point ghat ta hai.","Azeotrope ki composition nahi badalti.","Non-volatile solute boiling point badhata hai."],"t":"Ethanol-water azeotrope ($78.15\\,^{\\circ}\\mathrm{C}$) pure ethanol ($78.3\\,^{\\circ}\\mathrm{C}$) se bhi kam temperature par boil karta hai."},{"id":226,"c":"van't Hoff factor","q":"Which of the following statements about the van't Hoff factor and degree of dissociation/association is NOT correct?","opt":["For a solute associating into $n$ molecules with degree of association $\\alpha$, $i = 1-\\alpha+\\dfrac{\\alpha}{n}$.","For complete dissociation of a salt giving $n$ ions per formula unit, $i = n$.","For a weak electrolyte giving $n$ ions per formula unit and having degree of dissociation $\\alpha$, $i = 1+(n-1)\\alpha$.","The observed molar mass obtained from a colligative property is $i$ times the true molar mass."],"ans":3,"cpt":"Observed molar mass $= \\dfrac{\\text{true molar mass}}{i}$, yani $i$ guna nahi. Dissociation me $i>1$ se observed molar mass chhota hota hai.","m":"$i = \\dfrac{\\text{normal}}{\\text{observed}}$ rearrange karke dekho.","s":["Weak electrolyte ka formula $i = 1+(n-1)\\alpha$ — sahi.","Association ka formula $i = 1-\\alpha+\\alpha/n$ — sahi.","Complete dissociation par $i=n$ — sahi.","Observed molar mass $= M/i$, i guna nahi — galat statement."],"r":"$M_{\\text{observed}} = \\dfrac{M_{\\text{true}}}{i}$ hota hai, isliye 'i times' wali statement NOT correct hai.","w":["Ye sahi hai.","Ye sahi hai.","$i=n$ sahi hai."],"t":"$\\ce{NaCl}$: true $= 58.5$, observed $= 29.25$ ($=58.5/2$) — yahi relation yaad rakho."},{"id":227,"c":"Applications","q":"Which of the following statements about solubility, diving and bends is correct?","opt":["Divers breathe air at high pressure because the solubility of gases in blood decreases with increase in pressure.","In deep sea diving, a nitrogen-oxygen mixture is preferred over a helium-oxygen mixture because nitrogen is less soluble in blood than helium.","The solubility of nitrogen in blood increases with increase in its partial pressure, and a sudden decrease in pressure during rapid ascent causes bubbles of nitrogen to form, resulting in bends.","Bends are caused by the formation of oxygen bubbles in blood when the diver descends to greater depths."],"ans":2,"cpt":"Henry's law: high pressure par zyada $\\ce{N2}$ blood me ghulti hai. Ascent par pressure achanak ghat ta hai, to gas bubbles ban jati hai — bends.","m":"Henry's law ko diving ki situation par lagao: pressure badha $\\rightarrow$ zyada dissolved; pressure kam $\\rightarrow$ bubbles.","s":["High pressure par $\\ce{N2}$ zyada dissolve hoti hai — sahi.","Decompression par bubbles ban jate hain (bends) — sahi.","Bends $\\ce{N2}$ se hote hain, $\\ce{O2}$ se nahi.","High pressure par solubility badh ti hai, ghat ti nahi."],"r":"Henry's law ke hisaab se high pressure par $\\ce{N2}$ blood me ghulti hai aur decompression par bubbles banti hai — yahi bends hai.","w":["Pressure badhne par gas solubility badh ti hai.","He blood me $\\ce{N2}$ se kam soluble hai, isliye He-O₂ mixture preferred hai.","Bends nitrogen ki wajah se hote hain."],"t":"Deep sea divers He-O₂ mixture use karte hain kyunki He bahut kam soluble hai — bends ka risk kam."},{"id":228,"c":"Constants","q":"Which of the following statements is NOT correct?","opt":["The units of $K_f$ and $K_b$ are both $\\mathrm{K\\,kg\\,mol^{-1}}$.","Both $K_f$ and $K_b$ depend on the nature of the solvent.","The value of $K_b$ of a solvent depends on the nature of the solute dissolved in it.","The value of $K_f$ of water is $1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$ and that of $K_b$ of water is $0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$."],"ans":2,"cpt":"$K_b$ sirf solvent par depend karta hai (uske molar mass, boiling point aur enthalpy of vaporisation par), solute ki nature par nahi.","m":"Constants ki dependency list karo: solvent $\\rightarrow$ haan, solute $\\rightarrow$ nahi.","s":["Units same hain — sahi.","Water ke values sahi diye gaye hain.","$K_b$ solute ki nature par depend karta hai — galat statement.","Dono solvent ki nature par depend karte hain — sahi."],"r":"$K_b$ solute ki nature par depend nahi karta, isliye ye statement NOT correct hai.","w":["Units same hain.","Solvent dependency sahi hai.","Values sahi hain."],"t":"Solute ki nature ka effect $i$ me aata hai, $K_f$/$K_b$ me nahi."},{"id":229,"c":"Applications","q":"Which of the following statements is NOT correct?","opt":["Red blood cells placed in $0.9\\%$ w/v aqueous $\\ce{NaCl}$ solution retain their shape because this solution is nearly isotonic with blood.","Red blood cells placed in distilled water swell and may burst because water enters them by osmosis.","A plant cell placed in a hypertonic solution becomes turgid because water enters the cell from the surrounding solution.","Adding a large amount of common salt to food prevents the growth of bacteria because the hypertonic medium causes water to leave the bacterial cells."],"ans":2,"cpt":"Hypertonic solution me bahar solute zyada hota hai, isliye paani cell se bahar jata hai aur cell sikud jata hai (plasmolysis) — turgid nahi hota.","m":"Hypertonic ki direction yaad karo: paani bahar, cell shrink.","s":["$0.9\\%$ $\\ce{NaCl}$ blood ke isotonic hai — sahi.","Distilled water hypotonic hai, paani andar aata hai, RBC phat sakte hain — sahi.","Hypertonic me cell turgid nahi hota, sikud jata hai — galat statement.","High salt hypertonic medium bacteria se paani nikal deta hai — sahi."],"r":"Hypertonic solution me paani cell se bahar nikalta hai, isliye 'turgid' wali statement galat hai.","w":["Ye sahi hai.","Ye bhi sahi hai.","Salt preservation ka mechanism sahi hai."],"t":"Isotonic $0.9\\%$ $\\ce{NaCl}$ ko 'normal saline' kehte hain — medical me use hota hai."},{"id":230,"c":"Concentration terms","q":"Which of the following statements about interconversion of concentration terms is NOT correct?","opt":["The molality of a solution can be converted into the mole fraction of the solute without knowing the density of the solution.","For a dilute aqueous solution, molarity and molality are numerically nearly equal only when the density of the solution is close to $1\\,\\mathrm{g\\,mL^{-1}}$.","The mole fraction of the solute in a solution decreases when more solvent is added to it.","The molarity of a solution can be calculated from its molality without knowing the density of the solution."],"ans":3,"cpt":"Molality se molarity me jaane ke liye solution ka volume chahiye, aur volume ke liye density chahiye. Isliye density ke bina conversion possible nahi.","m":"Conversion ke liye zaroori quantities list karo.","s":["Dilute solution me density $\\approx1$ par $M\\approx m$ — sahi.","Zyada solvent dalne par $x_2$ ghat ta hai — sahi.","Molality se mole fraction possible (dono moles par based hain) — sahi.","Molality se molarity density ke bina possible nahi — galat statement."],"r":"Molality se molarity ke liye density zaroori hai, isliye ye statement NOT correct hai.","w":["Molality-mole fraction conversion density par depend nahi karta.","Ye sahi hai.","Ye sahi hai."],"t":"Molarity-molality conversion ke liye hamesha density chahiye — ye NEET ka favourite concept."},{"id":231,"c":"Colligative properties","q":"Which of the following statements about the choice of a colligative property for determining molar mass is correct?","opt":["The relative lowering of vapour pressure is preferred over osmotic pressure for determining the molar mass of proteins.","Depression in freezing point and osmotic pressure both give the true molar mass of an electrolyte without applying the van't Hoff factor.","Elevation in boiling point is the preferred method for determining the molar mass of substances that decompose on heating.","Osmotic pressure is preferred for the determination of the molar mass of polymers because a measurable pressure is obtained even for very dilute solutions and the measurement can be made at room temperature."],"ans":3,"cpt":"Polymers ke liye dilute solutions hi possible hote hain; wahan osmotic pressure measurable hota hai aur room temperature par measure kar sakte hain.","m":"Har method ki limitation socho (temperature, sensitivity, decomposition).","s":["Proteins ke liye osmotic pressure preferred hai, relative lowering nahi.","Electrolytes ke liye $i$ correction zaroori hai.","Osmotic pressure polymers ke liye best hai — sahi.","Decompose hone wale substances ko garam karna galat hoga — boiling point elevation suitable nahi."],"r":"Osmotic pressure dilute solutions me bhi measurable hai aur room temperature par kaam karta hai — polymers ke liye ideal.","w":["Relative lowering ke liye vapour pressure measurement chahiye, jo proteins ke liye practical nahi.","$i$ correction ke bina true molar mass nahi milta.","Decomposing substances ke liye boiling point elevation galat choice hai."],"t":"Macromolecules $\\rightarrow$ osmotic pressure; volatile ya low molar mass $\\rightarrow$ $\\Delta T_f$ or $\\Delta T_b$; non-volatile non-electrolytes $\\rightarrow$ relative lowering."},{"id":232,"c":"Azeotropes","q":"Which of the following statements about azeotropic mixtures is NOT correct?","opt":["At the azeotropic composition, the vapour pressure-composition curve shows an extremum.","A maximum boiling azeotrope is formed by a liquid pair showing negative deviation from Raoult's law.","An ethanol-water mixture forms a maximum boiling azeotrope containing about $95\\%$ ethanol by mass.","At the azeotropic composition, the mole fraction of each component in the vapour phase equals its mole fraction in the liquid phase."],"ans":2,"cpt":"Ethanol-water azeotrope minimum boiling hai (approx $78.15\\,^{\\circ}\\mathrm{C}$), maximum boiling nahi. Composition approx $95\\%$ ethanol by mass hai.","m":"Ethanol-water ka azeotrope type yaad karo: minimum boiling.","s":["Azeotrope par extremum hota hai — sahi.","Max boiling azeotrope negative deviation se banta hai — sahi.","Ethanol-water maximum boiling azeotrope hai — galat (minimum boiling hai).","Azeotrope par $y=x$ — sahi."],"r":"Ethanol-water mixture minimum boiling azeotrope banata hai, maximum boiling nahi — isliye ye statement NOT correct hai.","w":["Extremum wali baat sahi hai.","Max boiling azeotrope ka deviation type sahi hai.","$y=x$ sahi hai."],"t":"Ethanol-water: min boiling, $95\\%$ ethanol; $\\ce{HNO3}$-water: max boiling, $68\\%$ $\\ce{HNO3}$."},{"id":233,"c":"Concentration terms","q":"Match the Column I (aqueous solution of a non-electrolyte) with Column II (molality). Column I: (a) solution with $x_2 = 0.02$ (b) glucose solution containing $10\\,\\mathrm{g}$ of glucose in $90\\,\\mathrm{g}$ of water (c) solution containing $18\\,\\mathrm{g}$ of glucose in $500\\,\\mathrm{g}$ of water (d) solution containing $0.20\\,\\mathrm{mol}$ of solute in $250\\,\\mathrm{g}$ of water. Column II: (i) $0.20\\,\\mathrm{m}$ (ii) $0.62\\,\\mathrm{m}$ (iii) $1.13\\,\\mathrm{m}$ (iv) $0.80\\,\\mathrm{m}$","opt":["a-ii, b-iii, c-i, d-iv","a-iii, b-i, c-ii, d-iv","a-iii, b-ii, c-i, d-iv","a-iv, b-ii, c-iii, d-i"],"ans":2,"cpt":"Har case me moles/solvent kg lagao. $x_2 = 0.02$ ke liye $2$ mol solute aur $98$ mol water socho.","m":"Ek-ek case calculate karo aur match karo.","s":["(a) $x_2=0.02$: $2$ mol per $98\\times0.018 = 1.764\\,\\mathrm{kg}$ $\\Rightarrow 1.13\\,\\mathrm{m}$ $\\rightarrow$ (iii).","(b) $10/180 = 0.0556$ mol in $0.09\\,\\mathrm{kg}$ $\\Rightarrow 0.617\\,\\mathrm{m}$ $\\rightarrow$ (ii).","(c) $18/180 = 0.1$ mol in $0.5\\,\\mathrm{kg}$ $\\Rightarrow 0.20\\,\\mathrm{m}$ $\\rightarrow$ (i).","(d) $0.20/0.25 = 0.80\\,\\mathrm{m}$ $\\rightarrow$ (iv)."],"r":"Mapping a-iii, b-ii, c-i, d-iv sahi hai.","w":["(a) ka molality $0.62$ nahi hai.","(b) ka molality $1.13$ nahi hai.","(d) ka molality $0.20$ nahi hai."],"t":"Mole fraction se molality ka shortcut: $m = \\dfrac{x_2\\times1000}{(1-x_2)\\times18}$ (aqueous solution)."},{"id":234,"c":"Non-ideal solutions","q":"Match the Column I (type of solution) with Column II (set of characteristics). Column I: (a) positive deviation (b) negative deviation (c) ideal solution (d) maximum boiling azeotrope. Column II: (i) $\\Delta H_{\\text{mix}} = 0$, $\\Delta V_{\\text{mix}} = 0$, obeys Raoult's law (ii) $\\Delta H_{\\text{mix}} > 0$ and vapour pressure greater than the Raoult's law value (iii) $\\Delta H_{\\text{mix}} < 0$ and vapour pressure less than the Raoult's law value (iv) composition at which vapour and liquid phases have identical composition and boiling point is maximum","opt":["a-iv, b-iii, c-i, d-ii","a-ii, b-i, c-iii, d-iv","a-ii, b-iii, c-i, d-iv","a-iii, b-ii, c-i, d-iv"],"ans":2,"cpt":"Positive deviation: $\\Delta H>0$, $p$ zyada. Negative deviation: $\\Delta H<0$, $p$ kam. Ideal: dono zero. Max boiling azeotrope: $y=x$ par maximum $T_b$.","m":"Har type ke characteristics yaad karo.","s":["Positive deviation $\\rightarrow$ (ii).","Negative deviation $\\rightarrow$ (iii).","Ideal $\\rightarrow$ (i).","Max boiling azeotrope $\\rightarrow$ (iv)."],"r":"Mapping a-ii, b-iii, c-i, d-iv sahi hai.","w":["Positive deviation negative enthalpy nahi deti.","Ideal ke saath $\\Delta H<0$ nahi aata.","Max boiling azeotrope positive deviation ka example nahi hai."],"t":"Sign yaad rakho: positive deviation = positive enthalpy; negative deviation = negative enthalpy."},{"id":235,"c":"Formulae","q":"Match the Column I (expression) with Column II (quantity described). Column I: (a) $\\pi V = iCRT$ (b) $\\Delta T_f = iK_fm$ (c) $(p_1^{\\circ}-p_1)/p_1^{\\circ} = x_2$ (d) $y_1 = p_1^{\\circ}x_1/p_{\\text{total}}$. Column II: (i) mole fraction of a component in the vapour phase of an ideal mixture (ii) relative lowering of vapour pressure for a non-volatile solute (iii) van't Hoff equation for the osmotic pressure of a dilute solution (iv) depression in freezing point for an electrolyte solution","opt":["a-iii, b-ii, c-iv, d-i","a-i, b-iv, c-ii, d-iii","a-iii, b-iv, c-ii, d-i","a-iv, b-iii, c-ii, d-i"],"ans":2,"cpt":"Chaar expressions: osmotic pressure, freezing point depression, relative lowering, vapour phase mole fraction.","m":"Har expression ka subject pehchano.","s":["$\\pi V = iCRT$ $\\rightarrow$ (iii).","$\\Delta T_f = iK_fm$ $\\rightarrow$ (iv).","Relative lowering $\\rightarrow$ (ii).","$y_1$ wala expression $\\rightarrow$ (i)."],"r":"Mapping a-iii, b-iv, c-ii, d-i sahi hai.","w":["$\\pi V$ relative lowering nahi hai.","$\\Delta T_f$ vapour mole fraction nahi.","$y_1$ ka expression relative lowering nahi hai."],"t":"Vapour mole fraction $y_1$ ka formula Raoult's law se hi aata hai — $p_1 = p_1^{\\circ}x_1$ ko total se divide karo."},{"id":236,"c":"Applications","q":"Match the Column I (application) with Column II (principle involved). Column I: (a) desalination of sea water (b) carbonation of soft drinks (c) bends in deep sea divers (d) preservation of food by adding excess salt. Column II: (i) high solubility of carbon dioxide at high pressure and its escape on lowering the pressure (ii) reverse osmosis (iii) osmosis causing water to leave bacterial cells (iv) high solubility of nitrogen in blood at high pressure and bubble formation on decompression","opt":["a-iii, b-i, c-iv, d-ii","a-i, b-ii, c-iv, d-iii","a-ii, b-iv, c-i, d-iii","a-ii, b-i, c-iv, d-iii"],"ans":3,"cpt":"Desalination $\\rightarrow$ RO; soft drink $\\rightarrow$ Henry's law (high pressure $\\ce{CO2}$); bends $\\rightarrow$ $\\ce{N2}$ decompression; salt preservation $\\rightarrow$ osmosis.","m":"Application ko principle se jodo.","s":["Desalination $\\rightarrow$ (ii).","Soft drink $\\rightarrow$ (i).","Bends $\\rightarrow$ (iv).","Salt preservation $\\rightarrow$ (iii)."],"r":"Mapping a-ii, b-i, c-iv, d-iii sahi hai.","w":["Desalination Henry's law nahi hai.","Soft drink RO nahi hai.","Bends osmosis se nahi hote."],"t":"Chaaron NCERT applications hain — inhe ek saath revise karo."},{"id":237,"c":"van't Hoff factor","q":"Match the Column I (solute) with Column II (van't Hoff factor). Column I: (a) $\\ce{K2SO4}$, complete dissociation (b) benzoic acid in benzene, $60\\%$ dimerised (c) a weak monobasic acid with degree of dissociation $0.01$ (d) $\\ce{AlCl3}$, complete dissociation. Column II: (i) $1.
