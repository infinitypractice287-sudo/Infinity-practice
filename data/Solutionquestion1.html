 me dono definitions NCERT ke mutabik sahi hain.","Dilute solution me $1\\,\\mathrm{L}$ ka mass $\\approx 1000\\,\\mathrm{g}$, isliye solvent ka mass bhi $\\approx 1\\,\\mathrm{kg}$ — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; dilute aqueous solutions me $M \\approx m$ hota hai.","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi hai."],"t":"Yaad rakho: aqueous dilute solution me $M \\approx m$; concentrated ya non-aqueous me farq bada ho jata hai."},{"id":114,"c":"Colligative properties","q":"Statement I: The vapour pressure of an aqueous solution of a non-volatile solute is lower than that of pure water at the same temperature. Statement II: The boiling point of this solution is higher than that of pure water at the same external pressure.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect"],"ans":1,"cpt":"Solute dalne se vapour pressure ghat ta hai. Boiling point tab aata hai jab vapour pressure atmospheric pressure ke barabar ho — kam vapour pressure wale solution ko zyada temperature chahiye.","m":"Dono statements ek hi chain ke do kadam hain — dono correct hongi.","s":["Non-volatile solute vapour pressure ghat a deta hai — Statement I sahi.","Kam vapour pressure $\\Rightarrow$ zyada temperature chahiye $\\Rightarrow$ boiling point badh jata hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; vapour pressure lowering hi boiling point elevation ka kaaran hai.","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi."],"t":"Ek hi cause se: $p \\downarrow \\Rightarrow T_b \\uparrow$ aur $T_f \\downarrow$ — dono statements aksar saath aate hain."},{"id":115,"c":"Henry's law","q":"Statement I: At $298\\,\\mathrm{K}$, the Henry's law constant of $\\ce{N2}$ in water is greater than that of $\\ce{O2}$ in water. Statement II: At the same partial pressure and temperature, $\\ce{N2}$ is less soluble in water than $\\ce{O2}$.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"cpt":"$K_H$ jitna bada, solubility utni kam ($x = p/K_H$). $\\ce{N2}$ ki $K_H$ $\\ce{O2}$ se zyada hai, isliye $\\ce{N2}$ kam soluble hai.","m":"$K_H$ aur solubility ka inverse relation yaad karo.","s":["$\\ce{N2}$ ki $K_H$ $\\ce{O2}$ se zyada hai — Statement I sahi.","Badi $K_H$ $\\Rightarrow$ kam solubility, isliye $\\ce{N2}$ kam soluble — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain aur ek doosre se consistent hain ($K_H$ zyada $\\Rightarrow$ solubility kam).","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi."],"t":"Solubility order in water: $\\ce{CO2} > \\ce{O2} > \\ce{N2}$; $K_H$ ka order ulta hota hai."},{"id":116,"c":"van't Hoff factor","q":"Statement I: The van't Hoff factor of a solute which associates in solution is greater than $1$. Statement II: For such a solution the observed colligative property is smaller than the value calculated by assuming no association.","opt":["Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct"],"ans":3,"cpt":"Association me particles kam ho jate hain, isliye colligative effect kam hota hai aur $i < 1$ hota hai.","m":"Particles count karo: association se particles ghate, isliye $i$ bhi ghat ta hai.","s":["Association me $i < 1$ hota hai, greater than 1 nahi — Statement I galat.","Particles kam hone se observed colligative property calculated se kam hoti hai — Statement II sahi.","Isliye Statement I incorrect, Statement II correct."],"r":"$i<1$ hota hai association me, isliye Statement I galat hai; par observed property calculated se kam hona sahi hai.","w":["Statement I galat hai.","Statement II galat nahi.","Statement II sahi hai."],"t":"Association: $i<1$, observed property kam, apparent molar mass zyada. Dissociation: ulta."},{"id":117,"c":"Non-ideal solutions","q":"Statement I: A mixture of phenol and aniline shows negative deviation from Raoult's law. Statement II: The vapour pressure of this mixture is lower than that predicted by Raoult's law.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Phenol aur aniline ke beech hydrogen bonding hoti hai, isliye A-B interactions strong ho jati hain aur vapour pressure kam hota hai — yani negative deviation.","m":"Negative deviation ki definition hi ye hai ki vapour pressure predicted se kam ho.","s":["Phenol-aniline me H-bonding hoti hai $\\Rightarrow$ negative deviation — Statement I sahi.","Negative deviation me measured $p$ predicted se kam hota hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; negative deviation ki definition hi vapour pressure ka kam hona hai.","w":["Statement II galat nahi hai.","Statement I galat nahi.","Dono sahi hain."],"t":"H-bond banne wale pairs (phenol-aniline, chloroform-acetone, $\\ce{HNO3}$-water) negative deviation dikhate hain."},{"id":118,"c":"Constants","q":"Statement I: The ebullioscopic constant of a solvent is independent of the nature of the solute dissolved in it. Statement II: The value of $K_f$ of a solvent depends on the mass of the solvent taken.","opt":["Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect"],"ans":3,"cpt":"$K_b$ aur $K_f$ solvent ke intensive constants hain — solute ki nature ya solvent ki li gayi mass par depend nahi karte.","m":"Constants ki definition yaad karo: ye fixed temperature aur solvent ke liye fixed hote hain.","s":["$K_b$ solute ki nature par depend nahi karta — Statement I sahi.","$K_f$ mass of solvent par bhi depend nahi karta (ye intensive property hai) — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"$K_b$ solute-independent hai (sahi), par $K_f$ solvent ki mass par bhi depend nahi karta, isliye Statement II galat hai.","w":["Statement II galat hai.","Statement I galat nahi.","Statement I sahi hai."],"t":"$K_b$ aur $K_f$ ko 'solvent ka fingerprint' samjho — sirf solvent badalne par badalte hain."},{"id":119,"c":"Osmotic pressure","q":"Statement I: At the same temperature, $1\\,\\mathrm{L}$ of $0.1\\,\\mathrm{M}$ aqueous $\\ce{NaCl}$ has nearly twice the osmotic pressure of $1\\,\\mathrm{L}$ of $0.1\\,\\mathrm{M}$ aqueous glucose, assuming complete dissociation. Statement II: Colligative properties are directly proportional to the number of solute particles present in solution.","opt":["Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct"],"ans":1,"cpt":"$\\pi = iCRT$: $\\ce{NaCl}$ ka $i \\approx 2$, glucose ka $i = 1$. Isliye $\\ce{NaCl}$ ka osmotic pressure double hota hai.","m":"Statement I calculate karo, Statement II definition se check karo.","s":["$\\pi(\\ce{NaCl}) = 2CRT$ aur $\\pi(\\text{glucose}) = CRT$, ratio 2 — Statement I sahi.","Colligative properties particle number ke proportional hoti hain — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; particle number ki proportionality hi double pressure ka kaaran hai.","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi."],"t":"Volume same ho to osmotic pressure ka ratio seedha $iC$ ka ratio hota hai."},{"id":120,"c":"Osmosis","q":"Statement I: When a plant cell is placed in a hypotonic solution, water enters the cell and the cell becomes turgid. Statement II: A hypotonic solution has a higher solute concentration than the cell sap.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":1,"cpt":"Hypotonic ka matlab kam solute concentration (kam osmotic pressure) wala solution. Aise solution me cell se bahar wale solution me solute kam hota hai, isliye paani cell ke andar aata hai aur cell turgid ho jata hai.","m":"Hypo ka matlab 'kam' yaad karo — solution me solute kam, cells me zyada.","s":["Hypotonic solution me solute concentration kam hoti hai, isliye paani cell ke andar jata hai — Statement I sahi.","Statement II me 'higher solute concentration' likha hai, jo galat hai.","Isliye Statement I correct, Statement II incorrect."],"r":"Hypotonic solution me solute kam hota hai, isliye Statement II galat hai.","w":["Statement II galat hai.","Statement I galat nahi.","Statement I sahi hai."],"t":"Hypertonic = zyada solute (cell se paani nikalta hai, plasmolysis); hypotonic = kam solute (paani cell me jata hai, turgid)."},{"id":121,"c":"Azeotropes","q":"Statement I: At the azeotropic composition, the composition of the vapour phase is the same as that of the liquid phase. Statement II: An azeotropic mixture can be separated into its pure components by simple distillation.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct"],"ans":2,"cpt":"Azeotrope par vapour aur liquid ka composition same hota hai, isliye simple ya fractional distillation se composition nahi badalta — mixture alag nahi hota.","m":"Statement I NCERT definition hai; Statement II me separation ka claim check karo.","s":["Azeotropic point par $y_1 = x_1$ — Statement I sahi.","Composition same hone ki wajah se distillation se separation possible nahi — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"Statement I sahi hai, par azeotrope distillation se alag nahi hota, isliye Statement II galat hai.","w":["Statement II galat hai.","Statement I galat nahi.","Statement I sahi hai."],"t":"Azeotrope 'constant boiling mixture' hai — distillation se sirf wahi mixture aata rahega, pure components nahi."},{"id":122,"c":"Depression of freezing point","q":"Statement I: The freezing point of a solution is the temperature at which the vapour pressure of the liquid solution becomes equal to the vapour pressure of the pure solid solvent. Statement II: Depression in freezing point is used to determine the molar mass of a non-volatile solute.","opt":["Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"Freezing point par solid solvent aur liquid solution ke vapour pressure barabar hote hain. Ye definition hi $\\Delta T_f$ ka basis hai, aur $\\Delta T_f$ se molar mass nikal sakte hain.","m":"Dono statements NCERT ke facts hain.","s":["Freezing point par $p_{\\text{solution}} = p_{\\text{solid solvent}}$ — Statement I sahi.","$\\Delta T_f = K_fm$ se $M$ nikalta hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; freezing point ki definition aur usse molar mass ka determination dono valid hain.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Freezing point par solution aur solid solvent ka vapour pressure equal hota hai — isi se Clausius-Clapeyron se $K_f$ ka formula aata hai."},{"id":123,"c":"Concentration terms","q":"Which of the following statements is NOT correct?","opt":["Molarity depends on temperature whereas molality does not.","For dilute aqueous solutions, molarity and molality are numerically almost equal if the density is about $1\\,\\mathrm{g\\,mL^{-1}}$.","A concentration of $1\\,\\mathrm{ppm}$ in a dilute aqueous solution corresponds approximately to $1\\,\\mathrm{mg}$ of solute per litre of solution.","The normality of a solution is always equal to its molarity, whatever the solute."],"ans":3,"cpt":"Normality $= \\text{Molarity} \\times n\\text{-factor}$. $n$-factor sirf monoacidic/monobasic type solutes ke liye 1 hota hai; $\\ce{H2SO4}$ ka $n=2$, $\\ce{H3PO4}$ ka $n=3$.","m":"Normality aur molarity ko $n$-factor se jodo.","s":["Molarity temperature par depend karti hai, molality nahi — sahi.","Dilute aqueous solution me density $\\approx1$ par $M \\approx m$ — sahi.","$1\\,\\mathrm{ppm} \\approx 1\\,\\mathrm{mg\\,L^{-1}}$ dilute aqueous solution me — sahi.","Normality hamesha molarity ke barabar nahi hoti — galat statement."],"r":"Normality $= M \\times n$-factor, isliye 'always equal' wali statement galat hai.","w":["Ye sahi statement hai.","Dilute aqueous solutions ke liye sahi hai.","ppm ka approximation sahi hai."],"t":"$\\ce{H2SO4}$: $M = 0.5$ to $N = 1.0$. $n$-factor check karna hamesha zaroori hai."},{"id":124,"c":"Henry's law","q":"Which of the following statements about Henry's law is correct?","opt":["The Henry's law constant depends on the nature of the gas and on the temperature.","A larger value of the Henry's law constant means a greater solubility of the gas at a fixed pressure.","The Henry's law constant increases with increase in the partial pressure of the gas.","The solubility of a gas in a liquid is independent of temperature."],"ans":0,"cpt":"$K_H$ gas ki nature aur temperature par depend karta hai; partial pressure par nahi. $x = p/K_H$ — badi $K_H$ ka matlab kam solubility.","m":"Har option me $x = p/K_H$ lagao.","s":["$K_H$ gas aur temperature par depend karta hai — sahi.","$K_H$ bada $\\Rightarrow x$ chhota $\\Rightarrow$ solubility kam — option galat.","$K_H$ pressure par depend nahi karta — option galat.","Solubility temperature par depend karti hai — option galat."],"r":"$K_H$ sirf gas ki nature aur temperature par depend karta hai — yahi sahi statement hai.","w":["Badi $K_H$ ka matlab kam solubility hoti hai.","$K_H$ pressure-independent constant hai.","Temperature ka strong effect hota hai."],"t":"Henry's law constant = gas-solvent pair ka 'fingerprint' ek fixed temperature par."},{"id":125,"c":"Non-ideal solutions","q":"Which of the following statements about solutions showing negative deviation from Raoult's law is NOT correct?","opt":["The A-B interactions in such solutions are stronger than the A-A and B-B interactions.","The enthalpy of mixing of such solutions is negative.","Such solutions form maximum boiling azeotropes.","The vapour pressure of such solutions is higher than that predicted by Raoult's law."],"ans":3,"cpt":"Negative deviation me measured vapour pressure predicted se kam hota hai, zyada nahi. Iske saath strong A-B interactions, negative $\\Delta H$ aur maximum boiling azeotrope aate hain.","m":"'Negative deviation' ka matlab hi hai vapour pressure ka kam hona.","s":["Strong A-B interactions — sahi.","$\\Delta H_{\\text{mix}}<0$ — sahi.","Maximum boiling azeotrope — sahi.","Vapour pressure higher than predicted — galat (kam hota hai)."],"r":"Negative deviation me vapour pressure predicted se kam hota hai, isliye 'higher' wali statement NOT correct hai.","w":["Ye sahi hai.","Ye bhi sahi hai.","Maximum boiling azeotrope sahi hai."],"t":"Negative deviation = neeche wala curve = kam $p$ = strong interactions = max boiling azeotrope."},{"id":126,"c":"Azeotropes","q":"Which of the following statements about the aqueous nitric acid mixture ($68\\%$ $\\ce{HNO3}$ by mass) which boils at constant temperature is correct?","opt":["It shows negative deviation from Raoult's law, and at this composition the vapour and liquid phases have the same composition.","It shows positive deviation from Raoult's law, and it can be separated by fractional distillation.","It is an ideal solution and its vapour pressure equals that predicted by Raoult's law.","It boils at a temperature lower than the boiling points of both pure water and pure $\\ce{HNO3}$."],"ans":0,"cpt":"$68\\%$ $\\ce{HNO3}$-water ek maximum boiling azeotrope hai (approx $120.5\\,^{\\circ}\\mathrm{C}$) aur ye negative deviation dikhata hai. Azeotropic point par vapour aur liquid ka composition same hota hai.","m":"Pehchano: maximum boiling azeotrope $\\leftrightarrow$ negative deviation; azeotrope $\\leftrightarrow$ same composition.","s":["$68\\%$ $\\ce{HNO3}$-water maximum boiling azeotrope hai $\\Rightarrow$ negative deviation — sahi.","Azeotropic point par $y = x$ — sahi.","Azeotrope fractional distillation se separate nahi hota.","Maximum boiling azeotrope ka $T_b$ dono pure components se zyada hota hai."],"r":"Maximum boiling azeotrope par negative deviation hoti hai aur vapour-liquid composition same hota hai.","w":["Positive deviation wali mixture minimum boiling azeotrope deti hai.","Azeotrope ideal nahi hota aur distillation se alag nahi hota.","Maximum boiling azeotrope ka $T_b$ dono se zyada hota hai."],"t":"Do classic azeotropes: $68\\%$ $\\ce{HNO3}$ (max boiling, $120.5\\,^{\\circ}\\mathrm{C}$) aur $95\\%$ ethanol (min boiling, $78.15\\,^{\\circ}\\mathrm{C}$)."},{"id":127,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["The osmotic pressure of a solution is directly proportional to its temperature on the Kelvin scale.","The osmotic pressure of a solution is directly proportional to the molar concentration of the solute.","Osmotic pressure is a colligative property.","The units of $K_f$ and $K_b$ are different from each other."],"ans":3,"cpt":"$K_f$ aur $K_b$ dono ka unit $\\mathrm{K\\,kg\\,mol^{-1}}$ hi hota hai — same hai, different nahi.","m":"$\\pi = CRT$ ke dono proportionalities check karo, phir units compare karo.","s":["$\\pi \\propto T$ — sahi.","$\\pi \\propto C$ — sahi.","$\\pi$ colligative property hai — sahi.","$K_f$ aur $K_b$ ke units same hain — isliye ye statement galat."],"r":"Dono constants ka unit $\\mathrm{K\\,kg\\,mol^{-1}}$ hai, isliye 'different units' wali statement galat hai.","w":["Ye proportionality sahi hai.","Ye bhi sahi hai.","Osmotic pressure colligative hai."],"t":"$K_f$ aur $K_b$ ka unit same, par numerical values alag (water: $1.86$ vs $0.52$)."},{"id":128,"c":"van't Hoff factor","q":"Which of the following statements is correct?","opt":["For a substance which dimerises completely in solution, the van't Hoff factor is $2$.","The van't Hoff factor is equal to the ratio of the observed colligative property to the ratio of the molar masses.","For complete dissociation of $\\ce{Al2(SO4)3}$ in water, the van't Hoff factor is $4$.","For a weak electrolyte, the van't Hoff factor lies between $1$ and the number of ions obtained on complete dissociation."],"ans":3,"cpt":"Weak electrolyte partially dissociate hota hai, isliye $i$ ki value $1$ (no dissociation) aur $n$ (complete dissociation) ke beech hoti hai.","m":"Har option ko definition se test karo.","s":["Weak electrolyte: $1 < i < n$ — sahi.","Complete dimerisation me $i = 0.5$, not 2 — galat.","$\\ce{Al2(SO4)3}$ se 5 ions bante hain, isliye $i = 5$ — galat.","$i$ molar masses ya colligative properties ke ratio se define hota hai, aisa mixed statement galat hai."],"r":"Weak electrolyte ka $i$ $1$ aur $n$ ke beech hota hai — yahi sahi statement hai.","w":["Complete dimerisation me $i = 0.5$ hota hai.","Ye statement miscalculated hai.","$\\ce{Al2(SO4)3}$ ka $i = 5$ hai."],"t":"$i = 1 + (n-1)\\alpha$ — jab $\\alpha=0$ to $i=1$, jab $\\alpha=1$ to $i=n$."},{"id":129,"c":"Vapour pressure","q":"Which of the following statements about the relative lowering of vapour pressure is NOT correct?","opt":["It is independent of temperature for a solution of fixed composition.","For a solution of a non-volatile solute it is equal to the mole fraction of the solute.","It is directly proportional to the mass percentage of the solute in the solution.","It can be used to determine the molar mass of a non-volatile solute."],"ans":2,"cpt":"Relative lowering $= x_2$ (mole fraction), mass percentage ke proportional nahi hoti. Mass percentage aur mole fraction ke beech molar mass ka factor aata hai.","m":"Formula me dekho ki concentration ka kaun sa measure aata hai.","s":["Non-volatile solute ke liye relative lowering $= x_2$ — sahi.","Fixed composition par $x_2$ temperature se nahi badalta — sahi.","Molar mass determination me use hota hai — sahi.","Mass percentage ke proportional nahi hoti — galat statement."],"r":"Relative lowering mole fraction par depend karti hai, mass % par nahi — isliye ye statement NOT correct hai.","w":["Ye sahi hai.","Ye bhi sahi hai.","Molar mass nikalna sahi application hai."],"t":"Mole fraction aur mass % alag hain — molar mass badalne par same mass % ka different mole fraction milta hai."},{"id":130,"c":"Reverse osmosis","q":"Which of the following statements about reverse osmosis is NOT correct?","opt":["The pressure applied on the solution side must exceed the osmotic pressure of the solution.","The membrane used in reverse osmosis permits small ions such as $\\ce{Na+}$ and $\\ce{Cl-}$ to pass through easily.","It is used for the desalination of sea water.","Water passes from the solution side to the pure water side through a semipermeable membrane."],"ans":1,"cpt":"RO membrane ions ko rok ti hai aur sirf paani ko jaane deti hai. Agar ions aasani se pass ho jayein to desalination hi nahi hoga.","m":"Membrane ki selectivity check karo — RO ka poora point yahi hai.","s":["Desalination RO ka main use hai — sahi.","$p > \\pi$ chahiye — sahi.","Paani solution se pure water side jata hai — sahi.","Membrane ions ko pass nahi karti — ye statement galat."],"r":"RO membrane ions ko rok ti hai, pass nahi karti — isliye ye statement NOT correct hai.","w":["Pressure condition sahi hai.","Ye sahi hai.","Flow direction sahi hai."],"t":"RO membrane ka size-exclusion/charge mechanism ions ko rokta hai — isliye high pressure chahiye."},{"id":131,"c":"Colligative properties","q":"Which of the following statements is correct?","opt":["The vapour pressure of $0.1\\,\\mathrm{m}$ aqueous urea is equal to the vapour pressure of pure water at the same temperature.","$0.1\\,\\mathrm{m}$ aqueous $\\ce{CaCl2}$ has a higher boiling point than $0.1\\,\\mathrm{m}$ aqueous glucose, assuming complete dissociation.","$0.1\\,\\mathrm{m}$ aqueous glucose and $0.1\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ show the same elevation in boiling point.","$0.1\\,\\mathrm{m}$ aqueous glucose has a greater depression in freezing point than $0.1\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$."],"ans":1,"cpt":"$\\ce{CaCl2}$ ka $i=3$, glucose ka $i=1$. Same molality par $\\ce{CaCl2}$ ka colligative effect 3 guna hota hai.","m":"Har option me $i \\times m$ compare karo.","s":["Glucose ka effective $0.1$, $\\ce{NaCl}$ ka $0.2$ — same nahi.","$\\ce{CaCl2}$ ka effective $0.3 > 0.1$ — isliye boiling point zyada — sahi.","Urea dalne se vapour pressure ghat ta hai, equal nahi rehta.","Glucose ka $\\Delta T_f$ kam hoga, zyada nahi."],"r":"$\\ce{CaCl2}$ ka effective particle concentration zyada hai, isliye uska boiling point glucose se zyada hai.","w":["Solute dalne par vapour pressure kam hota hai.","$\\ce{NaCl}$ ka $i=2$ hone se elevation double hota hai.","$\\ce{NaCl}$ ka depression glucose se double hota hai."],"t":"Comparison ka ek hi rule: $i \\times m$ nikaalo aur compare karo."},{"id":132,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["Colligative properties depend only on the number of solute particles present.","A $0.2\\,\\mathrm{m}$ aqueous glucose solution and a $0.1\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ solution have nearly the same boiling point, assuming complete dissociation of $\\ce{NaCl}$.","Depression in freezing point is used to determine the molar mass of a non-volatile solute.","For a solution of a non-volatile solute, the vapour pressure of the solution is higher than that of the pure solvent."],"ans":3,"cpt":"Solute dalne par vapour pressure ghat ta hai. 'Higher than pure solvent' wali statement bilkul ulti hai.","m":"Solute ke effect ki direction yaad karo: $p$ ghat ta, $T_b$ badhta, $T_f$ ghat ta, $\\pi$ badhta.","s":["Colligative properties particle number par depend karti hain — sahi.","$0.2$ glucose $= 0.2$; $0.1$ $\\ce{NaCl}$ $= 0.2$ — barabar — sahi.","$\\Delta T_f$ se molar mass nikalta hai — sahi.","Vapour pressure higher nahi, lower hota hai — galat statement."],"r":"Non-volatile solute vapour pressure kam karta hai, isliye 'higher' wali statement NOT correct hai.","w":["Ye sahi hai.","Effective concentrations barabar hain ($0.2$ vs $0.2$).","Molar mass determination sahi application hai."],"t":"Vapour pressure ka direction hamesha yaad rakho — ye chaar colligative properties ka source hai."},{"id":133,"c":"Non-ideal solutions","q":"Match the Column I (type of system) with Column II (example/feature). Column I: (a) Solution showing positive deviation (b) Solution showing negative deviation (c) Almost ideal solution (d) Colligative property. Column II: (i) Osmotic pressure (ii) Acetone and chloroform (iii) Ethanol and water (iv) Benzene and toluene","opt":["a-iii, b-ii, c-iv, d-i","a-i, b-ii, c-iii, d-iv","a-ii, b-iii, c-iv, d-i","a-iii, b-iv, c-ii, d-i"],"ans":0,"cpt":"Positive deviation: ethanol-water. Negative deviation: acetone-chloroform. Almost ideal: benzene-toluene. Colligative property: osmotic pressure.","m":"Har example ka deviation type yaad karo.","s":["Ethanol-water positive deviation $\\rightarrow$ (iii).","Acetone-chloroform negative deviation $\\rightarrow$ (ii).","Benzene-toluene almost ideal $\\rightarrow$ (iv).","Osmotic pressure colligative property $\\rightarrow$ (i)."],"r":"Mapping a-iii, b-ii, c-iv, d-i sahi hai.","w":["Acetone-chloroform positive deviation nahi dikhata.","Benzene-toluene negative deviation nahi dikhata.","Osmotic pressure kisi deviation ka example nahi hai."],"t":"Exam me teen classic pairs: ethanol-water (positive), acetone-chloroform (negative), benzene-toluene (ideal)."},{"id":134,"c":"Colligative properties","q":"Match the Column I (colligative property) with Column II (description). Column I: (a) Relative lowering of vapour pressure (b) Elevation in boiling point (c) Depression in freezing point (d) Osmotic pressure. Column II: (i) temperature at which the vapour pressure of the solution equals atmospheric pressure is higher than that of the pure solvent (ii) extra pressure applied on the solution side to just stop osmosis (iii) ratio of the lowering in vapour pressure to the vapour pressure of the pure solvent (iv) the solution freezes below the freezing point of the pure solvent","opt":["a-i, b-iii, c-ii, d-iv","a-iii, b-iv, c-i, d-ii","a-iii, b-i, c-iv, d-ii","a-iv, b-i, c-iii, d-ii"],"ans":2,"cpt":"Chaar definitions: relative lowering = ratio; boiling point elevation = higher boiling temperature; freezing point depression = lower freezing temperature; osmotic pressure = extra pressure to stop osmosis.","m":"Description ko property ke naam se match karo.","s":["Relative lowering $\\rightarrow$ (iii) ratio.","Elevation in boiling point $\\rightarrow$ (i).","Depression in freezing point $\\rightarrow$ (iv).","Osmotic pressure $\\rightarrow$ (ii)."],"r":"Mapping a-iii, b-i, c-iv, d-ii sahi hai.","w":["Relative lowering boiling temperature nahi hai.","Freezing point depression ka matlab neeche freeze hona hai.","Relative lowering 'extra pressure' nahi hai."],"t":"Naam me hi definition chhupi hai — 'elevation' = upar, 'depression' = neeche."},{"id":135,"c":"Concentration terms","q":"Match the Column I (concentration) with Column II (composition). Column I: (a) $1\\,\\mathrm{ppm}$ (b) $10\\%$ w/w (c) $1$ molal (d) $1$ molar. Column II: (i) $10\\,\\mathrm{g}$ of solute in $100\\,\\mathrm{g}$ of solution (ii) $1$ mole of solute in $1\\,\\mathrm{kg}$ of solvent (iii) $1\\,\\mathrm{mg}$ of solute in $1\\,\\mathrm{kg}$ of solution (iv) $1$ mole of solute in $1\\,\\mathrm{L}$ of solution","opt":["a-iii, b-i, c-iv, d-ii","a-iii, b-i, c-ii, d-iv","a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv"],"ans":1,"cpt":"$1\\,\\mathrm{ppm}$ = $1\\,\\mathrm{mg}$ per kg solution; $10\\%$ w/w = $10\\,\\mathrm{g}$ per $100\\,\\mathrm{g}$ solution; $1$ molal = $1$ mol per kg solvent; $1$ molar = $1$ mol per L solution.","m":"Har definition ke denominator par dhyan do.","s":["$1\\,\\mathrm{ppm} \\rightarrow$ (iii).","$10\\%$ w/w $\\rightarrow$ (i).","$1$ molal $\\rightarrow$ (ii).","$1$ molar $\\rightarrow$ (iv)."],"r":"Mapping a-iii, b-i, c-ii, d-iv sahi hai.","w":["$1$ ppm $10\\,\\mathrm{g}$ per $100\\,\\mathrm{g}$ nahi hai.","Molal ka denominator kg solvent hai, litre nahi.","Molar ka denominator litre solution hai."],"t":"ppm ko mass ratio ki tarah padho: $1\\,\\mathrm{mg}$ per kg $= 1$ part per $10^{6}$."},{"id":136,"c":"Constants","q":"Match the Column I (symbol) with Column II (name). Column I: (a) $K_b$ (b) $K_f$ (c) $K_H$ (d) $i$. Column II: (i) Henry's law constant (ii) molal elevation constant (iii) van't Hoff factor (iv) molal depression constant","opt":["a-i, b-iv, c-ii, d-iii","a-ii, b-iv, c-iii, d-i","a-iv, b-ii, c-i, d-iii","a-ii, b-iv, c-i, d-iii"],"ans":3,"cpt":"$K_b$ = ebullioscopic (boiling), $K_f$ = cryoscopic (freezing), $K_H$ = Henry's, $i$ = van't Hoff factor.","m":"Subscript se pehchano: $b$ boiling, $f$ freezing, $H$ Henry.","s":["$K_b \\rightarrow$ (ii) molal elevation constant.","$K_f \\rightarrow$ (iv) molal depression constant.","$K_H \\rightarrow$ (i) Henry's law constant.","$i \\rightarrow$ (iii) van't Hoff factor."],"r":"Mapping a-ii, b-iv, c-i, d-iii sahi hai.","w":["$K_b$ depression constant nahi hai.","$K_H$ van't Hoff factor nahi.","$K_b$ Henry's constant nahi hai."],"t":"Symbol ke letter se meaning: $b$ = boil, $f$ = freeze, $H$ = Henry."},{"id":137,"c":"Formulae","q":"Match the Column I (symbol/expression) with Column II (relation). Column I: (a) $\\Delta T_f$ (b) $\\Delta T_b$ (c) $\\pi$ (d) relative lowering of vapour pressure. Column II: (i) $iK_fm$ (ii) $iCRT$ (iii) $iK_bm$ (iv) $x_{\\text{solute}}$","opt":["a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-ii, d-iv","a-iv, b-iii, c-ii, d-i","a-i, b-iii, c-ii, d-iv"],"ans":3,"cpt":"Electrolyte ke liye har colligative formula me $i$ lagta hai.","m":"Subscript se pehchano aur relation chuno.","s":["$\\Delta T_f = iK_fm \\rightarrow$ (i).","$\\Delta T_b = iK_bm \\rightarrow$ (iii).","$\\pi = iCRT \\rightarrow$ (ii).","Relative lowering $= x_{\\text{solute}} \\rightarrow$ (iv)."],"r":"Mapping a-i, b-iii, c-ii, d-iv sahi hai.","w":["$\\Delta T_f$ boiling wale formula se nahi aata.","$\\pi$ freezing point ka formula nahi hai.","Relative lowering $iK_fm$ nahi hai."],"t":"Ek hi pattern: har formula me particle count ($i$ ya mole fraction) hi kaam karta hai."},{"id":138,"c":"Non-ideal solutions","q":"Match the Column I (aqueous mixture) with Column II (behaviour). Column I: (a) Acetone and chloroform (b) Water and ethanol (c) Water and $\\ce{HCl}$ (constant boiling at about $20\\%$ $\\ce{HCl}$ by mass) (d) Benzene and toluene. Column II: (i) maximum boiling azeotrope (ii) minimum boiling azeotrope (iii) negative deviation from Raoult's law (iv) almost ideal behaviour","opt":["a-iii, b-ii, c-i, d-iv","a-i, b-ii, c-iii, d-iv","a-iii, b-i, c-ii, d-iv","a-ii, b-iii, c-i, d-iv"],"ans":0,"cpt":"Acetone-chloroform negative deviation dikhata hai; water-ethanol minimum boiling azeotrope banata hai; water-$\\ce{HCl}$ ($20\\%$) maximum boiling azeotrope hai; benzene-toluene almost ideal hai.","m":"Har pair ki known behaviour yaad karo.","s":["Acetone-chloroform $\\rightarrow$ (iii) negative deviation.","Water-ethanol $\\rightarrow$ (ii) minimum boiling azeotrope.","Water-$\\ce{HCl}$ $\\rightarrow$ (i) maximum boiling azeotrope.","Benzene-toluene $\\rightarrow$ (iv) almost ideal."],"r":"Mapping a-iii, b-ii, c-i, d-iv sahi hai.","w":["Acetone-chloroform maximum boiling azeotrope nahi banata.","Water-ethanol maximum boiling azeotrope nahi hai.","Water-$\\ce{HCl}$ minimum boiling azeotrope nahi hai."],"t":"$20\\%$ $\\ce{HCl}$-water ka constant boiling mixture ($\\approx 110\\,^{\\circ}\\mathrm{C}$) NCERT ka example hai."},{"id":139,"c":"Elevation of boiling point","q":"Assertion (A): The boiling point of an aqueous solution of a non-volatile solute is higher than that of pure water at the same external pressure. Reason (R): The vapour pressure of the solution is lower, so a higher temperature is needed for its vapour pressure to become equal to the atmospheric pressure.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Boiling tab hoti hai jab vapour pressure atmospheric pressure ke barabar ho. Solution ka vapour pressure kam hota hai, isliye usi pressure tak pahunchne ke liye zyada temperature chahiye.","m":"A aur R ka logical link check karo — R hi mechanism deta hai.","s":["Solution ka vapour pressure kam hota hai — R sahi.","Kam vapour pressure ko atmospheric tak laane ke liye zyada $T$ chahiye — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; vapour pressure lowering hi boiling point elevation ka kaaran hai.","w":["R hi explanation hai.","R galat nahi hai.","A sach hai."],"t":"Isi logic se freezing point depression bhi explain hota hai — dono ka source ek hi hai."},{"id":140,"c":"Osmotic pressure","q":"Assertion (A): The osmotic pressure of sea water is higher than that of drinking water. Reason (R): Osmotic pressure is directly proportional to the total concentration of solute particles in the solution.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Sea water me dissolved salts bahut zyada hote hain ($\\approx 0.5\\,\\mathrm{M}$ $\\ce{NaCl}$ type), isliye uska osmotic pressure $\\approx 25\\,\\mathrm{atm}$ tak hota hai. Drinking water me particles bahut kam hote hain.","m":"$\\pi = iCRT$ se A aur R ko jodo.","s":["$\\pi \\propto$ total particle concentration — R sahi.","Sea water me particles zyada $\\Rightarrow \\pi$ zyada — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; sea water me zyada solute particles hone se hi uska osmotic pressure zyada hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Sea water ka $\\pi \\approx 25$-$30\\,\\mathrm{atm}$ hota hai — RO me isse zyada pressure lagana padta hai."},{"id":141,"c":"Non-ideal solutions","q":"Assertion (A): A mixture of ethanol and water shows positive deviation from Raoult's law. Reason (R): The hydrogen bonding between ethanol and water molecules is stronger than the hydrogen bonding present in pure ethanol and pure water.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":2,"cpt":"Ethanol-water me A-B hydrogen bonding pure liquids ki H-bonding se kamzor hoti hai (ethanol ka hydrophobic group paani ki H-bond network ko disturb karta hai). Isliye vapour pressure badh jata hai — positive deviation.","m":"A sach hai; R me 'stronger' likha hai jo galat direction hai.","s":["Ethanol-water positive deviation dikhata hai — A sach.","A-B H-bonding actually kamzor hoti hai, stronger nahi — R galat.","Isliye A true, R false."],"r":"Positive deviation ka kaaran H-bonding ka kamzor hona hai; R me ulta likha hai, isliye R false hai.","w":["R galat hai.","A sach hai.","R galat hai, A sach hai."],"t":"Positive deviation = interactions weak = vapour pressure high = boiling point low."},{"id":142,"c":"Colligative properties","q":"Assertion (A): A $0.1\\,\\mathrm{m}$ aqueous $\\ce{KCl}$ solution freezes below $0.1\\,\\mathrm{m}$ aqueous glucose solution. Reason (R): $\\ce{KCl}$ dissociates to give two ions, so the number of solute particles is greater in the $\\ce{KCl}$ solution.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Colligative properties particle ki sankhya par depend karti hain. $\\ce{KCl}$ do ions deta hai ($i=2$), glucose ek particle ($i=1$), isliye $\\ce{KCl}$ ka depression double hota hai — freezing point zyada neeche.","m":"$i$ compare karo aur A se jodo.","s":["$\\ce{KCl}$ se 2 ions bante hain — R sahi.","Zyada particles se $\\Delta T_f$ zyada $\\Rightarrow$ freezing point neeche — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; $\\ce{KCl}$ ke do ions zyada depression dete hain.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"$0.1\\,\\mathrm{m}$ $\\ce{KCl}$ ka $\\Delta T_f = 0.372\\,\\mathrm{K}$, glucose ka $0.186\\,\\mathrm{K}$ — ratio $i$ ka ratio."},{"id":143,"c":"Henry's law","q":"Assertion (A): At $298\\,\\mathrm{K}$, the Henry's law constant for $\\ce{CO2}$ in water is smaller than that for $\\ce{O2}$ in water. Reason (R): At the same temperature and partial pressure, $\\ce{CO2}$ is more soluble in water than $\\ce{O2}$.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$x = p/K_H$: chhoti $K_H$ ka matlab zyada solubility. $\\ce{CO2}$ paani me $\\ce{O2}$ se kaafi zyada soluble hai, isliye uski $K_H$ chhoti hai.","m":"A aur R dono ek hi fact ke do pehlu hain — inverse relation se jodo.","s":["$\\ce{CO2}$ ki $K_H$ chhoti hai, isliye wo zyada soluble hai — A sahi.","$\\ce{CO2}$ ki solubility $\\ce{O2}$ se zyada hai — R sahi.","Dono ek hi baat ke do pehlu hain, R hi A ka explanation hai."],"r":"Dono sach hain; chhoti $K_H$ hi zyada solubility ko darshata hai, isliye R, A ko explain karta hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"$K_H$ aur solubility ka relation inverse hai — isko hamesha yaad rakho, statement questions me kaam aata hai."},{"id":144,"c":"Concentration terms","q":"Assertion (A): The molarity of a solution changes with change in temperature. Reason (R): The volume of the solution changes with temperature while the number of moles of solute remains unchanged.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Molarity $= n/V$: $n$ constant rehta hai par $V$ temperature ke saath badalta hai, isliye molarity badal jati hai.","m":"A ka kaaran R me diya hai — direct explanation.","s":["Volume temperature ke saath badalta hai, moles nahi — R sahi.","$M = n/V$ me $V$ badalne se $M$ badalti hai — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain aur volume expansion hi molarity ke change ka kaaran hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Molality ka advantage yahi hai: mass temperature se independent hota hai."},{"id":145,"c":"Non-ideal solutions","q":"A graph of total vapour pressure ($y$-axis, mm Hg) against mole fraction of B in the liquid phase ($x$-axis, 0 to 1) is drawn for a binary mixture of A and B at constant temperature. The vapour pressures of pure A and pure B are $120\\,\\mathrm{mm\\,Hg}$ and $60\\,\\mathrm{mm\\,Hg}$ respectively. The measured total pressures are: $x_B = 0.2 \\rightarrow 108$, $x_B = 0.5 \\rightarrow 84$, $x_B = 0.8 \\rightarrow 66$. On comparing with the values expected from Raoult's law ($108$, $90$ and $72$ respectively), it follows that the mixture","opt":["is ideal, and the curve coincides with the straight line predicted by Raoult's law","shows negative deviation, has stronger A-B interactions than A-A and B-B interactions, and forms a maximum boiling azeotrope","shows positive deviation, has weaker A-B interactions, and forms a maximum boiling azeotrope","shows positive deviation and forms a minimum boiling azeotrope"],"ans":1,"fig":{"type":"table","head":["$x_B$","Measured $p$ (mm Hg)","Raoult's law $p$ (mm Hg)"],"rows":[["0.2","108","108"],["0.5","84","90"],["0.8","66","72"]],"cap":"Measured and ideal vapour pressures at 300 K."},"cpt":"Jab measured pressure Raoult's law ki value se kam ho, negative deviation hoti hai. Iska kaaran strong A-B interactions hain, aur aise mixtures maximum boiling azeotrope banate hain.","m":"Row-wise measured vs expected compare karo; kam/zada se sign decide karo.","s":["$x_B=0.5$: measured $84 <$ expected $90$.","$x_B=0.8$: measured $66 <$ expected $72$.","Measured kam hai $\\Rightarrow$ negative deviation.","Negative deviation $\\Rightarrow$ strong A-B interactions $\\Rightarrow$ maximum boiling azeotrope."],"r":"Measured pressure expected se kam hai, isliye negative deviation hai aur mixture maximum boiling azeotrope banata hai.","w":["Ideal hota to measured = expected hota (yahan kam hai).","Positive deviation me measured zyada hota.","Positive deviation minimum boiling azeotrope deti hai."],"t":"Comparison ka rule: measured $>$ expected = positive; measured $<$ expected = negative."},{"id":146,"c":"van't Hoff factor","q":"The depression in freezing point of aqueous $\\ce{NaCl}$ solutions of different molalities is given below ($K_f$ of water $= 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$): $0.10\\,\\mathrm{m} \\rightarrow 0.37\\,\\mathrm{K}$; $0.20\\,\\mathrm{m} \\rightarrow 0.74\\,\\mathrm{K}$; $0.40\\,\\mathrm{m} \\rightarrow 1.48\\,\\mathrm{K}$. From this data, the van't Hoff factor of $\\ce{NaCl}$ in these solutions is approximately","opt":["$1.0$","$0.5$","$3.0$","$2.0$"],"ans":3,"fig":{"type":"table","head":["Molality ($\\mathrm{mol\\,kg^{-1}}$)","$\\Delta T_f$ (K)","$\\Delta T_f/m$ (K kg mol$^{-1}$)"],"rows":[["0.10","0.37","3.70"],["0.20","0.74","3.70"],["0.40","1.48","3.70"]],"cap":"Freezing point depression data for aqueous NaCl."},"cpt":"$\\Delta T_f = iK_fm$, isliye $i = \\dfrac{\\Delta T_f}{K_fm}$. Data se $\\Delta T_f/m$ constant milta hai, jo $iK_f$ ke barabar hai.","m":"$\\Delta T_f/m$ nikaalo aur $K_f$ (1.86) se divide karo.","s":["$0.10\\,\\mathrm{m}$ ke liye: $\\Delta T_f/m = 0.37/0.10 = 3.70$.","$i = \\dfrac{3.70}{1.86} \\approx 2.0$.","Baaki rows bhi same ratio deti hain, isliye $i \\approx 2$."],"r":"$i = 3.70/1.86 \\approx 2$, jo $\\ce{NaCl}$ ke do ions ke saath consistent hai.","w":["$1.0$ tab aata agar $\\ce{NaCl}$ dissociate na kare.","$0.5$ association ke liye hota.","$3.0$ teen ions wale salt ke liye hota."],"t":"Graph/table me $\\Delta T_f$ vs $m$ ka slope $iK_f$ hota hai — slope se $i$ turant nikal jata hai."},{"id":147,"c":"Osmotic pressure","q":"The osmotic pressures of solutions of a polymer in water at $300\\,\\mathrm{K}$ are given ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$): $1.0\\,\\mathrm{g\\,L^{-1}} \\rightarrow 2.5\\times10^{-4}\\,\\mathrm{atm}$; $2.0\\,\\mathrm{g\\,L^{-1}} \\rightarrow 5.0\\times10^{-4}\\,\\mathrm{atm}$; $4.0\\,\\mathrm{g\\,L^{-1}} \\rightarrow 10.0\\times10^{-4}\\,\\mathrm{atm}$. The molar mass of the polymer is nearly","opt":["$1.0\\times10^{4}\\,\\mathrm{g\\,mol^{-1}}$","$5.0\\times10^{4}\\,\\mathrm{g\\,mol^{-1}}$","$1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$","$1.0\\times10^{6}\\,\\mathrm{g\\,mol^{-1}}$"],"ans":2,"fig":{"type":"table","head":["Concentration ($\\mathrm{g\\,L^{-1}}$)","$\\pi$ (atm)"],"rows":[["1.0","$2.5\\times10^{-4}$"],["2.0","$5.0\\times10^{-4}$"],["4.0","$10.0\\times10^{-4}$"]],"cap":"Osmotic pressure of polymer solutions at 300 K."},"cpt":"$\\pi = CRT$ aur $C = \\dfrac{w}{M V}$, isliye $M = \\dfrac{wRT}{\\pi V}$ (gram per litre concentration ke liye $M = \\dfrac{C_{\\mathrm{g\\,L^{-1}}}RT}{\\pi}$).","m":"Ek row se molarity nikaalo, phir molar mass.","s":["$\\pi = 2.5\\times10^{-4}\\,\\mathrm{atm}$, $RT = 0.0821\\times300 = 24.63$.","$C = \\dfrac{2.5\\times10^{-4}}{24.63} = 1.015\\times10^{-5}\\,\\mathrm{mol\\,L^{-1}}$.","$1\\,\\mathrm{g\\,L^{-1}}$ me $1.015\\times10^{-5}$ mol hai, isliye $M = \\dfrac{1.0}{1.015\\times10^{-5}} \\approx 9.9\\times10^{4}$.","$M \\approx 1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M = \\dfrac{wRT}{\\pi V} \\approx 1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$.","w":["$10^{4}$ me exponent galat hai.","$5\\times10^{4}$ aadha molar mass hai.","$10^{6}$ das guna zyada hai."],"t":"Polymer ke liye $\\pi$ chhota hota hai ($10^{-4}$ atm), isliye molar mass bada ($\\sim10^{5}$) aata hai — ye order-of-magnitude check kaam aata hai."},{"id":148,"c":"Colligative properties","q":"A graph is plotted with elevation in boiling point ($y$-axis, K) against molality ($x$-axis, $\\mathrm{mol\\,kg^{-1}}$) for two aqueous solutions, one of glucose and one of $\\ce{NaCl}$. Both plots are straight lines passing through the origin. The slope of the glucose line is $0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$ and that of the $\\ce{NaCl}$ line is $1.04\\,\\mathrm{K\\,kg\\,mol^{-1}}$. From this graph it follows that","opt":["$\\ce{NaCl}$ does not dissociate and both solutes behave as non-electrolytes","the van't Hoff factor of $\\ce{NaCl}$ is nearly $2$, whereas that of glucose is $1$","the van't Hoff factor of glucose is nearly $2$, whereas that of $\\ce{NaCl}$ is $1$","the two lines should have the same slope because $K_b$ depends only on the solvent"],"ans":1,"fig":{"type":"plot","xlab":"molality (mol kg^{-1})","ylab":"ΔT_b (K)","xmin":0,"xmax":0.5,"ymin":0,"ymax":0.6,"series":[{"name":"glucose (slope 0.52)","pts":[[0,0],[0.2,0.104],[0.4,0.208]]},{"name":"NaCl (slope 1.04)","pts":[[0,0],[0.2,0.208],[0.4,0.416]]}],"cap":"Elevation of boiling point vs molality."},"cpt":"$\\Delta T_b = iK_bm$, isliye slope $= iK_b$. Same solvent ($K_b$ same) ke liye slope ka ratio seedha $i$ ka ratio deta hai.","m":"Slopes ka ratio nikaalo: $1.04/0.52 = 2$.","s":["Glucose ka slope $= K_b = 0.52$, isliye $i=1$.","$\\ce{NaCl}$ ka slope $= iK_b = 1.04$.","$i = 1.04/0.52 = 2$, jo $\\ce{NaCl}$ ke two ions ke saath consistent hai."],"r":"Slope ratio 2 dDta hai, isliye $\\ce{NaCl}$ ka $i=2$ aur glucose ka $i=1$ hai.","w":["$\\ce{NaCl}$ dissociate hota hai — slope double hai.","Glucose dissociate nahi karta.","$K_b$ same hai, par slope me $i$ bhi multiply hota hai."],"t":"$\\Delta T_b$ vs $m$ ka slope $= iK_b$; $\\Delta T_f$ vs $m$ ka slope $= iK_f$."},{"id":149,"c":"Depression of freezing point","q":"$1.0\\,\\mathrm{g}$ each of four solutes A, B, C and D was dissolved separately in $100\\,\\mathrm{g}$ of water and the depression in freezing point was measured ($K_f$ of water $= 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$): A $\\rightarrow 0.186\\,\\mathrm{K}$; B $\\rightarrow 0.093\\,\\mathrm{K}$; C $\\rightarrow 0.372\\,\\mathrm{K}$; D $\\rightarrow 0.372\\,\\mathrm{K}$, and D is known to be a strong electrolyte giving two ions per formula unit. From this data, the solute which has a molar mass of $100\\,\\mathrm{g\\,mol^{-1}}$ and behaves as an electrolyte is","opt":["A","B","C","D"],"ans":3,"fig":{"type":"table","head":["Solute","$\\Delta T_f$ (K)","Nature"],"rows":[["A","0.186","unknown"],["B","0.093","unknown"],["C","0.372","unknown"],["D","0.372","strong electrolyte, 2 ions"]],"cap":"Freezing point depression for 1.0 g solute in 100 g water."},"cpt":"$\\Delta T_f = iK_fm$ se molality nikaal kar $M$ calculate karo. Electrolyte ka $i=2$ hota hai, isliye same depression par uski molality aadhi hoti hai — yani molar mass double.","m":"Har solute ke liye molality nikaalo, phir $M = \\dfrac{w_2}{m \\times w_1(\\mathrm{kg})}$.","s":["$\\Delta T_f = 0.372$ (D ke liye): $m = \\dfrac{0.372}{1.86 \\times 2} = 0.10\\,\\mathrm{mol\\,kg^{-1}}$.","$0.10\\,\\mathrm{kg}$ water me moles $= 0.010$.","$M = \\dfrac{1.0}{0.010} = 100\\,\\mathrm{g\\,mol^{-1}}$.","Isliye D hi wo solute hai ($i=2$ ke saath molar mass $100\\,\\mathrm{g\\,mol^{-1}}$)."],"r":"D ka depression $0.372\\,\\mathrm{K}$ aur $i=2$ hone se molality $0.1$ milti hai, isliye $M=100\\,\\mathrm{g\\,mol^{-1}}$.","w":["A ka $i=1$ ke saath $M=100$ hota, par wo electrolyte nahi hai.","B ka molar mass $200$ hota.","C ka $i=1$ ke saath $M=50$ hota hai."],"t":"Electrolyte ka molar mass nikaalne ke liye $\\Delta T_f$ ko $i$ se divide karna mat bhoolna."},{"id":150,"c":"Henry's law","q":"The solubility of two gases P and Q in water was measured at $298\\,\\mathrm{K}$ at the same partial pressure of $1\\,\\mathrm{bar}$ and is given in the table. From these data, it follows that at $298\\,\\mathrm{K}$","opt":["the Henry's law constant of P is greater than that of Q, and P is less soluble than Q","the Henry's law constant of Q is greater than that of P, and Q is less soluble than P","the Henry's law constants of P and Q are equal","the Henry's law constant has no relation with the solubility of a gas"],"ans":0,"fig":{"type":"table","head":["Gas","Mole fraction in solution at 1 bar"],"rows":[["P","$4.0\\times10^{-5}$"],["Q","$2.0\\times10^{-4}$"]],"cap":"Solubility data at 298 K and 1 bar."},"cpt":"$K_H = \\dfrac{p}{x}$. Same pressure par jiska $x$ chhota, uska $K_H$ bada — aur wo gas kam soluble hai.","m":"Dono gases ke liye $K_H = p/x$ nikaalo.","s":["$K_H(\\mathrm{P}) = \\dfrac{1}{4.0\\times10^{-5}} = 2.5\\times10^{4}\\,\\mathrm{bar}$.","$K_H(\\mathrm{Q}) = \\dfrac{1}{2.0\\times10^{-4}} = 5.0\\times10^{3}\\,\\mathrm{bar}$.","$K_H(\\mathrm{P}) > K_H(\\mathrm{Q})$ aur P kam soluble hai."],"r":"P ki $K_H$ zyada hai isliye P ki solubility kam hai — option A sahi hai.","w":["Q ki $K_H$ kam hai, isliye Q zyada soluble hai.","Dono $K_H$ barabar nahi hain.","$K_H$ ka solubility se seedha (inverse) relation hai."],"t":"Same pressure par $K_H$ ka comparison = solubility ka ulta comparison."},{"id":151,"c":"Concentration terms","q":"The molality of a $20\\%$ w/w aqueous glucose solution is (molar mass of glucose $= 180\\,\\mathrm{g\\,mol^{-1}}$)","opt":["$1.11\\,\\mathrm{m}$","$1.39\\,\\mathrm{m}$","$0.20\\,\\mathrm{m}$","$1.25\\,\\mathrm{m}$"],"ans":1,"cpt":"$20\\%$ w/w $= 100\\,\\mathrm{g}$ solution me $20\\,\\mathrm{g}$ glucose, isliye paani $= 80\\,\\mathrm{g} = 0.08\\,\\mathrm{kg}$.","m":"Solute ke moles nikaalo, phir solvent ke kg se divide karo.","s":["$n = \\dfrac{20}{180} = 0.1111\\,\\mathrm{mol}$.","Water $= 100-20 = 80\\,\\mathrm{g} = 0.08\\,\\mathrm{kg}$.","$m = \\dfrac{0.1111}{0.08} = 1.39\\,\\mathrm{m}$."],"r":"$0.1111/0.08 = 1.39\\,\\mathrm{m}$.","w":["$1.11$ tab aata agar $100\\,\\mathrm{g}$ ko solvent maan liya jaye.","$0.20$ sirf mass fraction hai.","$1.25$ galat arithmetic hai."],"t":"w/w problems me denominator hamesha $(100 - \\text{solute mass})$ hota hai. Yahi sabse common mistake hai."},{"id":152,"c":"Concentration terms","q":"The molality of a $1.5\\,\\mathrm{M}$ aqueous $\\ce{H2SO4}$ solution having density $1.10\\,\\mathrm{g\\,mL^{-1}}$ is (molar mass of $\\ce{H2SO4} = 98\\,\\mathrm{g\\,mol^{-1}}$)","opt":["$1.57\\,\\mathrm{m}$","$1.45\\,\\mathrm{m}$","$1.70\\,\\mathrm{m}$","$1.32\\,\\mathrm{m}$"],"ans":0,"cpt":"Molarity se molality: 1 L solution ka mass nikaalo, usme solute ka mass ghatao, baaki solvent hai.","m":"1 L solution se start karo — sabse safe method.","s":["1 L solution ka mass $= 1100\\,\\mathrm{g}$.","$\\ce{H2SO4} = 1.5\\times98 = 147\\,\\mathrm{g}$.","Water $= 1100-147 = 953\\,\\mathrm{g} = 0.953\\,\\mathrm{kg}$.","$m = \\dfrac{1.5}{0.953} = 1.574\\,\\mathrm{m}$."],"r":"$1.5\\,\\mathrm{mol}$ solute $0.953\\,\\mathrm{kg}$ water me hai, isliye molality $1.57\\,\\mathrm{m}$.","w":["$1.45$ approximate density use karne se aata hai.","$1.70$ solute mass subtract na karne se aata hai.","$1.32$ galat water mass se aata hai."],"t":"$\\ce{H2SO4}$ jaise heavy solute ke liye molarity aur molality ka farq bada hota hai — density $1.10$ jaise cases me."},{"id":153,"c":"Henry's law","q":"At $298\\,\\mathrm{K}$, a gas has a Henry's law constant of $1.0\\times10^{3}\\,\\mathrm{bar}$ in water. At this temperature, its mole fraction in water when its partial pressure above the solution is $0.20\\,\\mathrm{bar}$ is","opt":["$2.0\\times10^{-4}$","$5.0\\times10^{-5}$","$2.0\\times10^{-3}$","$5.0\\times10^{-4}$"],"ans":0,"cpt":"$x = \\dfrac{p}{K_H}$.","m":"Direct division, exponent sambhal kar.","s":["Given: $K_H = 1.0\\times10^{3}\\,\\mathrm{bar}$ aur $p = 0.20\\,\\mathrm{bar}$.","$x = \\dfrac{0.20}{1.0\\times10^{3}}$.","$x = 2.0\\times10^{-4}$.","Sahi option A: $x = 2.0\\times10^{-4}$."],"r":"$0.20/1000 = 2.0\\times10^{-4}$.","w":["$5.0\\times10^{-5}$ me exponent galat hai.","$2.0\\times10^{-3}$ das guna zyada hai.","$5.0\\times10^{-4}$ galat calculation hai."],"t":"$10^{3}$ se divide karna = $10^{-3}$ multiply karna; $0.2$ ka $2$ banta hai — isliye $2\times10^{-4}$."},{"id":154,"c":"Vapour pressure","q":"At $373\\,\\mathrm{K}$, the vapour pressure of water is $760\\,\\mathrm{mm\\,Hg}$. When $18\\,\\mathrm{g}$ of glucose (molar mass $180\\,\\mathrm{g\\,mol^{-1}}$) is dissolved in $100\\,\\mathrm{g}$ of water, the vapour pressure of the resulting solution (assuming the solute to be non-volatile) is nearly","opt":["$752.0\\,\\mathrm{mm\\,Hg}$","$760.0\\,\\mathrm{mm\\,Hg}$","$746.6\\,\\mathrm{mm\\,Hg}$","$738.4\\,\\mathrm{mm\\,Hg}$"],"ans":2,"cpt":"Raoult's law: $p = p^{\\circ}\\dfrac{n_1}{n_1+n_2}$, jahan $n_1$ solvent ke moles aur $n_2$ solute ke moles hain.","m":"Dono ke moles nikaalo, phir solvent ke mole fraction se multiply karo.","s":["Glucose: $n_2 = 18/180 = 0.1\\,\\mathrm{mol}$.","Water: $n_1 = 100/18 = 5.556\\,\\mathrm{mol}$.","$x_1 = \\dfrac{5.556}{5.656} = 0.9823$.","$p = 760\\times0.9823 = 746.6\\,\\mathrm{mm\\,Hg}$."],"r":"$p = 760 \\times 0.9823 = 746.6\\,\\mathrm{mm\\,Hg}$.","w":["$752.0$ galat mole fraction deta hai.","$760$ tab aata agar solute hi na hota.","$738.4$ solute ke mole fraction se multiply karne ki galti hai."],"t":"Vapour pressure solvent ke mole fraction se multiply hota hai, solute ke nahi. $0.9823$ aur $0.0177$ ka farq yaad rakho."},{"id":155,"c":"Raoult's law","q":"A binary liquid mixture has $x_A = 0.40$ in the liquid phase. If $p_A^{\\circ} = 140\\,\\mathrm{mm\\,Hg}$ and $p_B^{\\circ} = 60\\,\\mathrm{mm\\,Hg}$ and the mixture is ideal, the mole fraction of A in the vapour phase in equilibrium with this liquid is nearly","opt":["$0.40$","$0.55$","$0.61$","$0.75$"],"ans":2,"cpt":"$y_A = \\dfrac{p_A}{p_{\\text{total}}} = \\dfrac{p_A^{\\circ}x_A}{p_A^{\\circ}x_A + p_B^{\\circ}x_B}$.","m":"Partial pressure $p_A$ nikaalo, total pressure banao, phir divide karo.","s":["$x_A = 0.40$, $x_B = 0.60$.","$p_A = 140\\times0.4 = 56\\,\\mathrm{mm\\,Hg}$.","$p_B = 60\\times0.6 = 36\\,\\mathrm{mm\\,Hg}$; total $= 92$.","$y_A = \\dfrac{56}{92} = 0.609 \\approx 0.61$."],"r":"$y_A = 56/92 = 0.61$.","w":["$0.40$ liquid ka mole fraction hai.","$0.55$ galat rounding/partial pressure se aata hai.","$0.75$ total ko $p_A$ se divide karne ki galti hai."],"t":"Vapour phase us component se rich hota hai jiska $p^{\\circ}$ zyada hai — yahan A ($140 > 60$), isliye $y_A (0.61) > x_A (0.40)$."},{"id":156,"c":"Elevation of boiling point","q":"When $3.0\\,\\mathrm{g}$ of urea (molar mass $60\\,\\mathrm{g\\,mol^{-1}}$) is dissolved in $100\\,\\mathrm{g}$ of water, the boiling point of the solution at $1\\,\\mathrm{atm}$ ($K_b$ of water $= 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$) is","opt":["$100.13\\,^{\\circ}\\mathrm{C}$","$100.26\\,^{\\circ}\\mathrm{C}$","$100.52\\,^{\\circ}\\mathrm{C}$","$100.78\\,^{\\circ}\\mathrm{C}$"],"ans":1,"cpt":"Urea non-electrolyte hai ($i=1$), isliye $\\Delta T_b = K_bm$.","m":"Molality nikaalo, $\\Delta T_b$ calculate karo, phir $100\\,^{\\circ}\\mathrm{C}$ me jodo.","s":["$n = 3/60 = 0.05\\,\\mathrm{mol}$, water $= 0.1\\,\\mathrm{kg}$.","$m = 0.05/0.1 = 0.5\\,\\mathrm{mol\\,kg^{-1}}$.","$\\Delta T_b = 0.52\\times0.5 = 0.26\\,\\mathrm{K}$.","$T_b = 100+0.26 = 100.26\\,^{\\circ}\\mathrm{C}$."],"r":"$\\Delta T_b = 0.26\\,\\mathrm{K}$, isliye boiling point $100.26\\,^{\\circ}\\mathrm{C}$.","w":["$100.13$ aadha molality lene se aata hai.","$100.52$ tab aata agar molality 1 hoti.","$100.78$ galat calculation hai."],"t":"$\\Delta T_b$ boiling point me add hota hai; $\\Delta T_f$ freezing point se subtract hota hai. Direction kabhi mat ulatna."},{"id":157,"c":"Depression of freezing point","q":"When $5.85\\,\\mathrm{g}$ of $\\ce{NaCl}$ (molar mass $58.5\\,\\mathrm{g\\,mol^{-1}}$) is dissolved in $500\\,\\mathrm{g}$ of water, the freezing point of the solution, assuming complete dissociation and $K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$, is","opt":["$-0.186\\,^{\\circ}\\mathrm{C}$","$-0.372\\,^{\\circ}\\mathrm{C}$","$-0.744\\,^{\\circ}\\mathrm{C}$","$-1.488\\,^{\\circ}\\mathrm{C}$"],"ans":2,"cpt":"$\\ce{NaCl}$ ka $i = 2$, isliye $\\Delta T_f = 2K_fm$.","m":"Pehle molality, phir $i$ ke saath multiply.","s":["$n = 5.85/58.5 = 0.10\\,\\mathrm{mol}$; water $= 0.5\\,\\mathrm{kg}$.","$m = 0.10/0.5 = 0.2\\,\\mathrm{mol\\,kg^{-1}}$.","$\\Delta T_f = 2\\times1.86\\times0.2 = 0.744\\,\\mathrm{K}$.","Freezing point $= -0.744\\,^{\\circ}\\mathrm{C}$."],"r":"$\\Delta T_f = 0.744\\,\\mathrm{K}$, isliye freezing point $-0.744\\,^{\\circ}\\mathrm{C}$.","w":["$-0.186$ tab aata agar molality $0.1$ aur $i=1$ ho.","$-0.372$ tab aata agar $i=1$ ho.","$-1.488$ double ho gaya (galat $i$)."],"t":"Electrolyte ke liye $i$ multiply karna mat bhoolna; $\\ce{NaCl}$ ka $i=2$."},{"id":158,"c":"Osmotic pressure","q":"The osmotic pressure at $298\\,\\mathrm{K}$ of a $0.50\\,\\mathrm{M}$ aqueous $\\ce{CaCl2}$ solution, assuming complete dissociation and $R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$, is nearly","opt":["$18.3\\,\\mathrm{atm}$","$12.2\\,\\mathrm{atm}$","$36.7\\,\\mathrm{atm}$","$24.5\\,\\mathrm{atm}$"],"ans":2,"cpt":"$\\pi = iCRT$; $\\ce{CaCl2}$ teen ions deta hai, isliye $i=3$.","m":"$i$ multiply karo, phir $CRT$.","s":["Effective concentration $= 3\\times0.50 = 1.5\\,\\mathrm{M}$.","$\\pi = 1.5\\times0.0821\\times298$.","$0.0821\\times298 = 24.47$; $\\pi = 36.7\\,\\mathrm{atm}$."],"r":"$\\pi = 1.5\\times24.47 = 36.7\\,\\mathrm{atm}$.","w":["$18.3$ half of $36.7$ hai.","$12.2$ tab aata agar $i=1$.","$24.5$ tab aata agar $i=2$."],"t":"$\\ce{CaCl2} \\rightarrow \\ce{Ca^{2+}} + 2\\ce{Cl-}$: $i=3$. Salt ka formula dekho aur ions gino."},{"id":159,"c":"Osmotic pressure","q":"A $0.20\\,\\mathrm{M}$ aqueous glucose solution is found to be isotonic with an aqueous solution of a salt MX which dissociates completely into two ions. The molarity of the salt solution is","opt":["$0.20\\,\\mathrm{M}$","$0.10\\,\\mathrm{M}$","$0.40\\,\\mathrm{M}$","$0.05\\,\\mathrm{M}$"],"ans":1,"cpt":"Isotonic: $\\pi_1 = \\pi_2 \\Rightarrow i_1C_1 = i_2C_2$.","m":"Glucose ka $i=1$, MX ka $i=2$; equation banao.","s":["Isotonic condition: $i_1C_1 = i_2C_2$; glucose ka $i = 1$ aur MX ka $i = 2$.","$1\\times0.20 = 2\\times C$.","$C = 0.10\\,\\mathrm{M}$.","Sahi option B: $C = 0.10\\,\\mathrm{M}$."],"r":"$C = 0.10\\,\\mathrm{M}$ — kyunki MX do ions deta hai.","w":["$0.20$ tab aata agar $i$ same ho.","$0.40$ ulta relation hai.","$0.05$ me $i=4$ maan liya."],"t":"Isotonic condition: $i_1C_1 = i_2C_2$ — same $T$ par."},{"id":160,"c":"Colligative properties","q":"Equal volumes of $0.10\\,\\mathrm{M}$ aqueous glucose and $0.10\\,\\mathrm{M}$ aqueous $\\ce{NaCl}$ (assumed completely dissociated) are mixed. The osmotic pressure of the resulting mixture at temperature $T$ is equal to the osmotic pressure of","opt":["$0.30\\,\\mathrm{M}$ glucose","$0.20\\,\\mathrm{M}$ glucose","$0.10\\,\\mathrm{M}$ glucose","$0.15\\,\\mathrm{M}$ glucose"],"ans":3,"cpt":"Mix karne par dono ki concentration aadhi ho jati hai (volume double). Total particle concentration $= 0.05 + 2(0.05) = 0.15\\,\\mathrm{M}$.","m":"Dilution ke baad concentration nikaalo, phir particles jodo.","s":["Glucose: $0.10/2 = 0.05\\,\\mathrm{M}$ particles.","$\\ce{NaCl}$: $0.10/2 = 0.05\\,\\mathrm{M}$, par $i=2$ se $0.10\\,\\mathrm{M}$ particles.","Total $= 0.05+0.10 = 0.15\\,\\mathrm{M}$ glucose ke barabar."],"r":"Mixed solution ka total particle concentration $0.15\\,\\mathrm{M}$ hai, isliye $0.15\\,\\mathrm{M}$ glucose ke isotonic hai.","w":["$0.30$ dono ko double karne se aata hai.","$0.20$ dilution ignore karne se aata hai.","$0.10$ sirf ek component ka hai."],"t":"Mixing me volume add hota hai — concentration halve hoti hai. Ye step sabse zyada bhoola jata hai."},{"id":161,"c":"van't Hoff factor","q":"When $1.0\\,\\mathrm{g}$ of an electrolyte of molar mass $74.5\\,\\mathrm{g\\,mol^{-1}}$ is dissolved in $100\\,\\mathrm{g}$ of water, the depression in freezing point is $0.50\\,\\mathrm{K}$. Taking $K_f$ of water as $1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the van't Hoff factor of the electrolyte is nearly","opt":["$1.5$","$1.0$","$3.0$","$2.0$"],"ans":3,"cpt":"$i = \\dfrac{\\text{observed } \\Delta T_f}{\\text{calculated } \\Delta T_f}$, jahan calculated value $K_fm$ se aati hai (bina dissociation maane).","m":"Pehle molality, phir calculated $\\Delta T_f$, phir observed/calculated ka ratio.","s":["$n = 1.0/74.5 = 0.01342\\,\\mathrm{mol}$, water $= 0.1\\,\\mathrm{kg}$.","$m = 0.1342\\,\\mathrm{mol\\,kg^{-1}}$.","Calculated $\\Delta T_f = 1.86\\times0.1342 = 0.25\\,\\mathrm{K}$.","$i = 0.50/0.25 = 2.0$."],"r":"$i = 2.0$ — electrolyte do ions deta hai.","w":["$1.5$ galat ratio hai.","$1.0$ non-electrolyte ke liye hota.","$3.0$ teen ions chahiye hote."],"t":"$i = \\dfrac{\\text{observed}}{\\text{calculated}}$ — observed hamesha numerator me aata hai, warna answer ulta aa jayega."},{"id":162,"c":"Degree of dissociation","q":"A $0.10\\,\\mathrm{m}$ aqueous solution of a weak monobasic acid HA has a van't Hoff factor of $1.05$. The degree of dissociation of HA in this solution is","opt":["$0.5\\%$","$5\\%$","$10\\%$","$95\\%$"],"ans":1,"cpt":"Weak monobasic acid ke liye $i = 1+(n-1)\\alpha$; yahan $n = 2$ (do ions), isliye $i = 1+\\alpha$.","m":"$\\alpha = i-1$ formula lagao.","s":["$i = 1+\\alpha$ (kyunki $n=2$).","$1.05 = 1+\\alpha \\Rightarrow \\alpha = 0.05$.","$\\alpha = 5\\%$."],"r":"$\\alpha = i-1 = 0.05$, yani $5\\%$.","w":["$0.5\\%$ me decimal galat hai.","$10\\%$ ke liye $i = 1.10$ chahiye.","$95\\%$ dissociation ka ulta hai."],"t":"Monobasic acid ke liye $i = 1+\\alpha$; $\\ce{NaCl}$ type salt ke liye bhi yahi (n=2)."},{"id":163,"c":"Degree of association","q":"Benzoic acid dissolved in benzene dimerises partly. If the van't Hoff factor of benzoic acid in a $0.10\\,\\mathrm{m}$ solution in benzene is $0.60$, the fraction of benzoic acid that has dimerised is","opt":["$0.80$","$0.20$","$0.60$","$0.40$"],"ans":0,"sim":{"title":"Association explore karo (dimer)","sliders":[{"name":"a","label":"α (dimerised fraction)","min":0,"max":1,"step":0.05,"val":0.8}],"calc":"var i = 1 - a + a/2; return [['i', i.toFixed(3)], ['dimerised %', (a*100).toFixed(0)+' %']];"},"cpt":"Dimerisation ke liye $i = 1-\\alpha+\\dfrac{\\alpha}{2} = 1-\\dfrac{\\alpha}{2}$, jahan $\\alpha$ association ki degree hai.","m":"$i$ ka formula likho aur $\\alpha$ ke liye solve karo.","s":["$i = 1-\\alpha+\\dfrac{\\alpha}{2} = 1-\\dfrac{\\alpha}{2}$ (dimer ke liye $n=2$).","$0.60 = 1-\\dfrac{\\alpha}{2}$.","$\\dfrac{\\alpha}{2} = 0.40 \\Rightarrow \\alpha = 0.80$.","Yani $80\\%$ acid dimerise ho gaya."],"r":"$\\alpha = 0.80$, isliye $80\\%$ benzoic acid dimer ke roop me hai.","w":["$0.20$ me factor 2 galat laga hai.","$0.60$ seedha $i$ hai, $\\alpha$ nahi.","$0.40$ $n=2$ ke liye galat formula se aata hai."],"t":"Dimer ke liye $i = 1-\\alpha/2$. Complete dimerisation ($\\alpha=1$) par $i = 0.5$ — check kar lo."},{"id":164,"c":"Concentration terms","q":"Statement I: The molality of a solution changes when the same solution is warmed, provided no solvent evaporates. Statement II: Molality is expressed in terms of the mass of solvent, which is unaffected by temperature.","opt":["Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect"],"ans":1,"cpt":"Molality mass par based hai, isliye heating se nahi badalti — Statement II sahi. Statement I iske ulta hai.","m":"Statement II (definition) sahi hai; Statement I ka conclusion galat hai.","s":["Molality mass of solvent par based hai — Statement II sahi.","Mass heating se nahi badalta, isliye molality bhi nahi badalti.","Isliye Statement I galat, Statement II correct."],"r":"Molality temperature-independent hoti hai, isliye 'changes on warming' wali Statement I galat hai.","w":["Statement I galat hai.","Statement II galat nahi.","Statement II sahi hai."],"t":"Molality ka poora point hi temperature independence hai — ye MHCET/NEET dono me puchha jata hai."},{"id":165,"c":"Vapour pressure","q":"Statement I: The vapour pressure of an aqueous solution of a non-volatile solute is lower than the vapour pressure of pure water at the same temperature. Statement II: Addition of a non-volatile solute lowers the escaping tendency of the solvent molecules from the surface of the solution.","opt":["Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"Solute ke particles solvent ke surface ka kuch hissa occupy kar lete hain, isliye kam solvent molecules vapour phase me ja paate hain — escaping tendency ghat ti hai.","m":"Dono statements ek hi phenomenon ka statement aur explanation hain.","s":["Solution ka vapour pressure kam hota hai — Statement I sahi.","Escaping tendency kam hona isi ka molecular reason hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; escaping tendency ka ghatna hi vapour pressure lowering ka molecular explanation hai.","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi."],"t":"Molecular picture: surface par solvent molecules ki effective concentration kam ho jati hai."},{"id":166,"c":"Henry's law","q":"Statement I: At $298\\,\\mathrm{K}$, the Henry's law constant of He in water is much larger than that of $\\ce{CO2}$ in water. Statement II: At the same partial pressure and temperature, the solubility of He in water is much less than that of $\\ce{CO2}$.","opt":["Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"cpt":"He ek noble gas hai, paani me bahut kam soluble. $\\ce{CO2}$ paani me kaafi soluble hai. $K_H$: He ke liye bahut zyada, $\\ce{CO2}$ ke liye kam.","m":"$K_H$ aur solubility ka inverse relation yaad karo.","s":["He ki $K_H$ bahut badi hai — Statement I sahi.","Badi $K_H$ ka matlab kam solubility — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain aur ek doosre se consistent hain.","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi."],"t":"Order yaad rakho: $K_H$: He $>$ $\\ce{N2}$ $>$ $\\ce{O2}$ $>$ $\\ce{CO2}$; solubility ka order ulta."},{"id":167,"c":"Non-ideal solutions","q":"Statement I: A mixture of acetone and carbon disulphide shows positive deviation from Raoult's law. Statement II: The enthalpy of mixing of this mixture is positive and the vapour pressure is greater than that predicted by Raoult's law.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Acetone polar hai aur $\\ce{CS2}$ non-polar; A-B interactions pure interactions se kamzor hoti hain, isliye vapour pressure badh jata hai aur heat absorb hoti hai ($\\Delta H > 0$).","m":"Positive deviation ke saare signs yaad karo: $\\Delta H>0$, $\\Delta V>0$, $p$ zyada.","s":["Acetone-$\\ce{CS2}$ positive deviation dikhata hai — Statement I sahi.","Positive deviation me $\\Delta H_{\\text{mix}}>0$ aur $p$ predicted se zyada — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; positive deviation ke saath positive enthalpy aur high vapour pressure dono aate hain.","w":["Statement II galat nahi hai.","Statement I galat nahi.","Dono sahi hain."],"t":"Acetone + $\\ce{CS2}$ NCERT ka classic positive deviation example hai (dono ke dipole-dipole interactions toot te hain)."},{"id":168,"c":"Colligative properties","q":"Statement I: Adding a non-volatile solute to a solvent increases its boiling point and decreases its freezing point. Statement II: Both these effects arise because the vapour pressure of the solution is lower than that of the pure solvent.","opt":["Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"Vapour pressure lowering se boiling point badhta hai aur freezing point ghat ta hai — dono ek hi source se aate hain.","m":"Dono statements NCERT ke core concept hain.","s":["Solute dalne par $T_b$ badhta hai aur $T_f$ ghat ta hai — Statement I sahi.","Dono ka kaaran vapour pressure lowering hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain aur Statement II dono effects ka common explanation deta hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Ek root cause, chaar properties: $p\\downarrow$, $T_b\\uparrow$, $T_f\\downarrow$, $\\pi\\uparrow$."},{"id":169,"c":"van't Hoff factor","q":"Statement I: The van't Hoff factor of $\\ce{K2SO4}$ in dilute aqueous solution is nearly $3$. Statement II: The van't Hoff factor of the same salt in a concentrated aqueous solution may be less than $3$.","opt":["Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":1,"cpt":"Dilute solution me ions free hote hain ($i\\approx3$); concentrated solution me ion pairing/ionic atmosphere ki wajah se effective particles kam ho jate hain, isliye $i<3$ mil sakta hai.","m":"Dilution ka effect yaad karo: dilution badhne par $i$ theoretical value ke qareeb jata hai.","s":["Dilute solution me $i \\to 3$ — Statement I sahi.","Concentrated solution me ion pairing se $i<3$ ho sakta hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; ion pairing concentrated solutions me $i$ ko kam kar deti hai.","w":["Dono sahi hain.","Statement II galat nahi hai.","Statement I galat nahi."],"t":"NEET me generally complete dissociation maan kar $i$ ka theoretical value liya jata hai, par concept me dilution ka effect yaad rakho."},{"id":170,"c":"Osmotic pressure","q":"Statement I: Two solutions having the same osmotic pressure at the same temperature must have the same molarity of solute particles. Statement II: Two solutions having the same osmotic pressure must be isotonic and must have the same mass percentage of the solute.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"$\\pi = iCRT$: same $\\pi$ aur same $T$ par $iC$ same hona chahiye, yani particle molarity same. Par mass percentage solute ke molar mass par depend karti hai, isliye same hona zaroori nahi.","m":"$\\pi = iCRT$ se pehla part sahi; mass % ka claim alag concept hai.","s":["$\\pi = iCRT \\Rightarrow iC$ same — Statement I sahi.","Isotonic solutions ka mass % same hona zaroori nahi (molar mass alag ho sakta hai) — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"Osmotic pressure particle molarity fix karta hai, mass percentage nahi — isliye Statement II galat hai.","w":["Statement II galat hai.","Statement I galat nahi.","Statement I sahi hai."],"t":"Isotonic $\\ne$ same concentration by mass. Isotonic ka matlab same particle molarity hai."},{"id":171,"c":"Reverse osmosis","q":"Statement I: In reverse osmosis, water is forced from the solution side to the solvent side through a semipermeable membrane by applying an external pressure. Statement II: The external pressure required must be greater than the osmotic pressure of the solution.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct"],"ans":2,"cpt":"RO me direction ulti hoti hai: solution se pure solvent ki taraf. Iske liye pressure osmotic pressure se zyada chahiye.","m":"Dono statements RO ki definition aur condition hain.","s":["RO me paani solution side se solvent side jata hai — Statement I sahi.","Iske liye $p_{\\text{applied}} > \\pi$ chahiye — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; RO ki dono conditions sahi di gayi hain.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"RO = osmosis ka ulta + pressure greater than $\\pi$. Ye do points hi exam me puchhe jate hain."},{"id":172,"c":"Solubility of gases","q":"Statement I: The solubility of a gas in a liquid decreases with increase in temperature at constant partial pressure. Statement II: Dissolution of a gas in a liquid is accompanied by evolution of heat, so the process is favoured at lower temperature.","opt":["Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct"],"ans":1,"cpt":"Gas dissolution exothermic hai; Le Chatelier ke hisaab se low temperature par zyada gas dissolve hoti hai.","m":"Statement I fact hai, Statement II uska thermodynamic reason.","s":["Heating par gas ki solubility ghat ti hai — Statement I sahi.","Dissolution exothermic hai isliye low $T$ par favour hota hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; exothermic nature hi temperature effect ka kaaran hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Le Chatelier ka simple application: exothermic $\\rightarrow$ cooling se solubility badh ti hai."},{"id":173,"c":"Azeotropes","q":"Statement I: A maximum boiling azeotrope boils at a temperature higher than the boiling points of both the pure components and shows negative deviation from Raoult's law. Statement II: At the azeotropic composition, the mole fraction of each component in the vapour phase equals that in the liquid phase.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Maximum boiling azeotrope ka $T_b$ dono pure components se zyada hota hai aur ye negative deviation se banta hai. Azeotropic point par $y_1 = x_1$.","m":"Dono statements azeotrope ki standard properties hain.","s":["Maximum boiling azeotrope ka $T_b$ dono se zyada, aur negative deviation — Statement I sahi.","Azeotrope par $y=x$ — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; ye azeotrope ki defining properties hain.","w":["Statement II galat nahi.","Statement I galat nahi.","Dono sahi hain."],"t":"Max boiling azeotrope ka example: $68\\%$ $\\ce{HNO3}$-water; min boiling: $95\\%$ ethanol-water."},{"id":174,"c":"Concentration terms","q":"Which of the following statements is NOT correct?","opt":["Molality and mole fraction are independent of temperature.","For a dilute aqueous solution, molarity and molality differ appreciably when the density deviates far from $1\\,\\mathrm{g\\,mL^{-1}}$.","Molarity of a solution decreases on heating because the volume of the solution increases.","Mole fraction of a solute depends on the volume of the solution taken."],"ans":3,"cpt":"Mole fraction moles ki ratio hai, volume se iska koi relation nahi. Solution ka volume badalne se mole fraction same rehta hai.","m":"Har statement me dekho ki volume ka role hai ya nahi.","s":["Molality aur mole fraction temperature-independent hain — sahi.","Heating par $V$ badhne se $M$ ghat ti hai — sahi.","Density $1$ se door ho to $M$ aur $m$ me farq aata hai — sahi.","Mole fraction volume par depend karta hai — galat."],"r":"Mole fraction sirf moles par depend karta hai, volume par nahi — isliye ye statement NOT correct hai.","w":["Ye sahi hai.","Density ka effect sahi describe hua hai.","Ye bhi sahi hai."],"t":"Mole fraction ka definition hi ratio of moles hai — volume ka koi zikr nahi."},{"id":175,"c":"Henry's law","q":"Which of the following statements about Henry's law is NOT correct?","opt":["The solubility of a gas is directly proportional to its partial pressure over the solution at constant temperature.","The Henry's law constant has units of pressure when solubility is expressed as mole fraction.","The Henry's law constant of a gas is independent of the nature of the solvent.","The Henry's law constant increases with increase in temperature for most gases."],"ans":2,"cpt":"$K_H$ gas aur solvent dono ki nature par depend karta hai (aur temperature par bhi). Isliye 'independent of solvent' galat hai.","m":"$K_H$ ki dependencies list karo: gas, solvent, temperature.","s":["$K_H = p/x$ ka unit pressure hota hai — sahi.","Most gases ke liye heating par $K_H$ badh ta hai (solubility ghat ti hai) — sahi.","Solubility pressure ke proportional hoti hai — sahi.","$K_H$ solvent ki nature par depend karta hai, independent nahi — galat statement."],"r":"$K_H$ gas ki nature, solvent ki nature aur temperature — teeno par depend karta hai; 'independent of solvent' galat hai.","w":["Heating par $K_H$ badh ta hai, yahi sahi hai.","$K_H$ ka unit pressure hota hai (jab solubility mole fraction me ho) — sahi statement hai.","Henry's law ka core statement hai — sahi."],"t":"$K_H$ teen cheezon par depend karta hai: gas ki nature, solvent ki nature aur temperature. Iske alawa kisi cheez par nahi."},{"id":176,"c":"Raoult's law","q":"Which of the following statements about Raoult's law is correct?","opt":["Raoult's law is obeyed by all binary liquid mixtures at all concentrations.","For a solution of a non-volatile solute, the vapour pressure of the solution is proportional to the mole fraction of the solute.","For a solution of a non-volatile solute, the relative lowering of vapour pressure equals the mole fraction of the solute.","For an ideal solution, the total vapour pressure is independent of the composition of the liquid phase."],"ans":2,"cpt":"$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2$ — relative lowering solute ke mole fraction ke barabar hoti hai.","m":"Har option ko Raoult's law ki standard form se compare karo.","s":["Vapour pressure $\\propto x_1$ (solvent), $x_2$ ke proportional nahi.","Relative lowering $= x_2$ — sahi.","Raoult's law sirf ideal solutions me poora obey hota hai.","Ideal solution ka $p$ composition par depend karta hai (linear)."],"r":"Non-volatile solute ke liye relative lowering of vapour pressure $= x_2$ — yahi sahi statement hai.","w":["Sab mixtures Raoult's law nahi obey karte.","$p \\propto x_1$ hota hai, $x_2$ ke proportional nahi (par $p^{\\circ}-p \\propto x_2$).","Ideal solution ka $p$ composition par linearly depend karta hai."],"t":"$p \\propto x_1$ aur $(p^{\\circ}-p) \\propto x_2$ — dono yaad rakho, warna option me confusion hoti hai."},{"id":177,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["Osmotic pressure is a colligative property used for determining the molar mass of polymers.","The relative lowering of vapour pressure depends on the number of solute particles.","Elevation of boiling point is directly proportional to molality for dilute solutions.","Depression of freezing point is use
