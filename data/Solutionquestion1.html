01$ (ii) $0.70$ (iii) $3.0$ (iv) $4.0$","opt":["a-iv, b-ii, c-i, d-iii","a-ii, b-iii, c-i, d-iv","a-iii, b-i, c-ii, d-iv","a-iii, b-ii, c-i, d-iv"],"ans":3,"cpt":"$\\ce{K2SO4}$: $i=3$. Dimerisation 60%: $i = 1-\\alpha/2 = 1-0.3 = 0.70$. Weak monobasic acid: $i = 1+\\alpha = 1.01$. $\\ce{AlCl3}$: $i=4$.","m":"Har case ka formula lagao.","s":["$\\ce{K2SO4} \\rightarrow$ (iii) $3$.","60% dimerised $\\rightarrow$ (ii) $0.70$.","$\\alpha = 0.01$ acid $\\rightarrow$ (i) $1.01$.","$\\ce{AlCl3} \\rightarrow$ (iv) $4$."],"r":"Mapping a-iii, b-ii, c-i, d-iv sahi hai.","w":["$\\ce{K2SO4}$ ka $i=0.7$ nahi.","Dimer ka $i=3$ nahi.","$\\ce{AlCl3}$ ka $i=3$ nahi (4 hota hai)."],"t":"Dimer: $i = 1-\\alpha/2$; acid: $i = 1+\\alpha$; salt: $i = $ ions ki sankhya."},{"id":238,"c":"Graphs","q":"Match the Column I (plot, all at $300\\,\\mathrm{K}$ unless stated) with Column II (feature of the plot). Column I: (a) osmotic pressure against concentration for an aqueous non-electrolyte (b) osmotic pressure against concentration for an aqueous solute with $i=3$ (c) total vapour pressure against mole fraction for a liquid pair showing positive deviation (d) boiling point against composition for an ethanol-water mixture. Column II: (i) curve lies above the straight line joining the vapour pressures of the pure components (ii) slope is three times that obtained for a non-electrolyte (iii) curve shows a minimum at the azeotropic composition (iv) straight line through the origin with slope $24.6\\,\\mathrm{atm\\,L\\,mol^{-1}}$","opt":["a-iv, b-ii, c-i, d-iii","a-ii, b-iv, c-i, d-iii","a-iv, b-i, c-ii, d-iii","a-iv, b-ii, c-iii, d-i"],"ans":0,"cpt":"$\\pi$ vs $C$ ka slope $iRT$ hota hai. Positive deviation me $p$ curve line ke upar. Ethanol-water min boiling azeotrope banata hai, isliye boiling point curve me minimum aata hai.","m":"Har plot ki shape aur slope yaad karo.","s":["Non-electrolyte ka slope $RT = 24.6$ $\\rightarrow$ (iv).","$i=3$ ka slope 3 guna $\\rightarrow$ (ii).","Positive deviation me curve line ke upar $\\rightarrow$ (i).","Ethanol-water ke boiling point curve me minimum $\\rightarrow$ (iii)."],"r":"Mapping a-iv, b-ii, c-i, d-iii sahi hai.","w":["Slope teen guna non-electrolyte ke liye hota hai.","Positive deviation me curve neeche nahi, upar hota hai.","Ethanol-water me boiling point maximum nahi, minimum hota hai."],"t":"$\\pi$–$C$ ka slope $iRT$: 300 K par $RT \\approx 24.6$; isse $i$ turant nikal jata hai."},{"id":239,"c":"Colligative properties","q":"Assertion (A): A $0.1\\,\\mathrm{m}$ aqueous solution of $\\ce{Na2SO4}$ has a lower freezing point than a $0.1\\,\\mathrm{m}$ aqueous solution of $\\ce{NaCl}$, assuming complete dissociation of both. Reason (R): One formula unit of $\\ce{Na2SO4}$ gives three ions in solution, whereas one formula unit of $\\ce{NaCl}$ gives two ions.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$\\ce{Na2SO4} \\rightarrow 2\\ce{Na+} + \\ce{SO4^{2-}}$: 3 ions ($i=3$); $\\ce{NaCl}$: 2 ions ($i=2$). Zyada particles $\\Rightarrow$ zyada depression $\\Rightarrow$ kam freezing point.","m":"$i$ compare karo aur A ko R se jodo.","s":["$\\ce{Na2SO4}$ se 3 ions, $\\ce{NaCl}$ se 2 — R sahi.","$i$ zyada hone se depression zyada, freezing point kam — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; $\\ce{Na2SO4}$ ke teen ions zyada depression dete hain.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"$0.1\\,\\mathrm{m}$ $\\ce{Na2SO4}$: $\\Delta T_f = 3\\times1.86\\times0.1 = 0.558\\,\\mathrm{K}$; $\\ce{NaCl}$: $0.372\\,\\mathrm{K}$."},{"id":240,"c":"Osmotic pressure","q":"Assertion (A): The osmotic pressure of the same solution measured at $300\\,\\mathrm{K}$ and at $310\\,\\mathrm{K}$ is different. Reason (R): Osmotic pressure is directly proportional to the absolute temperature for a solution of fixed composition.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$\\pi = iCRT$: fixed composition par $\\pi \\propto T$. Isliye temperature badalne par $\\pi$ badal jata hai.","m":"Aur R ko $\\pi = iCRT$ se jodo.","s":["$\\pi \\propto T$ — R sahi.","Isliye 300 K aur 310 K par $\\pi$ alag hoga — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; temperature ke saath proportionality hi different values ka kaaran hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"$\\pi_2/\\pi_1 = T_2/T_1$ (same concentration par) — ye shortcut yaad rakho."},{"id":241,"c":"Non-ideal solutions","q":"Assertion (A): A mixture of chloroform and acetone shows negative deviation from Raoult's law and forms a maximum boiling azeotrope. Reason (R): Hydrogen bonding between chloroform and acetone molecules lowers the escaping tendency of both components, so the vapour pressure of the mixture is less than that predicted by Raoult's law.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Chloroform ke H aur acetone ke O ke beech naya H-bond banta hai, isliye A-B interactions strong ho jati hain — vapour pressure ghat ta hai (negative deviation) aur maximum boiling azeotrope banta hai.","m":"Aur R ko seedha jodo — R mechanism deta hai.","s":["Chloroform-acetone me H-bond banta hai — R sahi.","Kam escaping tendency $\\Rightarrow$ kam $p$ $\\Rightarrow$ negative deviation $\\Rightarrow$ max boiling azeotrope — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; naya H-bond hi negative deviation ka kaaran hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Chloroform-acetone ka $\\Delta H_{\\text{mix}}$ negative hota hai — ye NCERT ka classic example hai."},{"id":242,"c":"Henry's law","q":"Assertion (A): At $298\\,\\mathrm{K}$ and the same partial pressure, helium is less soluble in water than carbon dioxide. Reason (R): The Henry's law constant of helium in water is much smaller than that of carbon dioxide.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":2,"cpt":"He bahut kam soluble hai, isliye uski $K_H$ bahut badi hoti hai (solubility ka inverse). R me 'much smaller' likha hai jo galat hai.","m":"$K_H$ ka relation solubility se inverse yaad karo.","s":["He kam soluble hai — A sahi.","Kam solubility ka matlab $K_H$ bahut badi hai, chhoti nahi — R galat.","Isliye A true, R false."],"r":"He ki solubility kam hai (A sahi), par uski $K_H$ badi hoti hai — R galat hai.","w":["R galat hai.","A sach hai.","R galat hai, A sach hai."],"t":"$K_H$: He $>$ $\\ce{N2}$ $>$ $\\ce{O2}$ $>$ $\\ce{CO2}$ — solubility ka order ulta."},{"id":243,"c":"Osmotic pressure","q":"Assertion (A): A $0.1\\,\\mathrm{M}$ aqueous glucose solution and a $0.1\\,\\mathrm{M}$ aqueous urea solution have the same osmotic pressure at the same temperature. Reason (R): Both glucose and urea are non-electrolytes and provide one particle per dissolved molecule.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$\\pi = iCRT$: dono ke liye $i=1$ aur $C$ same hai, isliye $\\pi$ same hoga.","m":"$iC$ compare karo dono taraf.","s":["Dono non-electrolytes hain, $i=1$ — R sahi.","$\\pi$ barabar ho jata hai — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; ek particle per molecule hone se particle concentration barabar hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Non-electrolytes ke liye colligative properties ka comparison sirf molarity/molality se hota hai — nature se nahi."},{"id":244,"c":"Osmotic pressure","q":"Assertion (A): Osmotic pressure is preferred over boiling point elevation for determining the molar mass of a polymer. Reason (R): For a very dilute polymer solution, the boiling point elevation is too small to be measured accurately, whereas the osmotic pressure is still measurable.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Polymer ka molar mass bahut bada hota hai, isliye same mass par moles bahut kam — $\\Delta T_b$ naapne layak nahi hota. Osmotic pressure dilute solution me bhi measurable rehta hai.","m":"$\\Delta T_b \\propto m$ aur $\\pi \\propto C$ — sensitivity compare karo.","s":["Dilute polymer solution me $\\Delta T_b$ bahut chhoti hoti hai — R sahi.","Isliye $\\pi$ better hai — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; sensitivity ki wajah se osmotic pressure preferred hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"$10^{5}$ molar mass ke polymer ke liye $\\pi$ measurement practical hai, $\\Delta T_b$ nahi."},{"id":245,"c":"Azeotropes","q":"The total vapour pressure of mixtures of liquids A and B was measured at $300\\,\\mathrm{K}$ ($p_A^{\\circ} = 45\\,\\mathrm{mm\\,Hg}$, $p_B^{\\circ} = 40\\,\\mathrm{mm\\,Hg}$). From the table given, it follows that the mixture","opt":["is ideal, since the vapour pressure rises from $40$ to $45\\,\\mathrm{mm\\,Hg}$ at the two ends","shows negative deviation from Raoult's law and forms a maximum boiling azeotrope at $x_A \\approx 0.5$","shows positive deviation from Raoult's law and forms a minimum boiling azeotrope at $x_A \\approx 0.5$","shows a maximum in vapour pressure because the two components have different molar masses"],"ans":2,"fig":{"type":"table","head":["$x_A$","Measured $p$ (mm Hg)","Raoult's law $p$ (mm Hg)"],"rows":[["0.0","40","40"],["0.2","55","41"],["0.4","68","42"],["0.5","70","42.5"],["0.6","67","43"],["0.8","55","44"],["1.0","45","45"]],"cap":"Total vapour pressure of A-B mixtures at 300 K."},"cpt":"Expected value: $p = 40+5x_A$. Measured values expected se kaafi zyada hain, yani positive deviation. Curve $x_A \\approx 0.5$ par maximum dikhata hai — wahi azeotropic composition hai.","m":"Row-wise compare karo; maximum dhundo — wahi azeotrope.","s":["$x_A=0.2$: expected $41$, measured $55$ — kaafi zyada.","$x_A=0.5$: expected $42.5$, measured $70$ — sabse zyada (maximum).","$x_A=0.8$: expected $44$, measured $55$ — phir bhi zyada.","Measured $>$ expected $\\Rightarrow$ positive deviation, aur $x_A\\approx0.5$ par maximum $\\Rightarrow$ minimum boiling azeotrope."],"r":"Positive deviation aur $x_A \\approx 0.5$ par maximum vapour pressure — yani minimum boiling azeotrope.","w":["End points ka match hona ideal behaviour prove nahi karta.","Measured values zyada hain, kam nahi.","Molar mass ka is deviation se koi relation nahi."],"t":"Positive deviation $\\Rightarrow$ vapour pressure maximum; ye minimum boiling azeotrope ke barabar hai."},{"id":246,"c":"Elevation of boiling point","q":"$1.0\\,\\mathrm{g}$ each of four non-electrolyte solutes P, Q, R and S was separately dissolved in $100\\,\\mathrm{g}$ of water and the elevation in boiling point was measured ($K_b$ of water $= 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$): P $\\rightarrow 0.087\\,\\mathrm{K}$; Q $\\rightarrow 0.174\\,\\mathrm{K}$; R $\\rightarrow 0.260\\,\\mathrm{K}$; S $\\rightarrow 0.043\\,\\mathrm{K}$. From this data, the solute having the highest molar mass is","opt":["Q","P","S","R"],"ans":2,"fig":{"type":"table","head":["Solute","$\\Delta T_b$ (K)","Molar mass ($\\mathrm{g\\,mol^{-1}}$) by $M = K_bw_2/(\\Delta T_b w_1)$"],"rows":[["P","0.087","60"],["Q","0.174","30"],["R","0.260","20"],["S","0.043","120"]],"cap":"Elevation of boiling point for 1.0 g solute in 100 g water."},"cpt":"Same mass aur same solvent ke liye $\\Delta T_b \\propto \\dfrac{1}{M}$. Isliye sabse chhoti elevation sabse bade molar mass ko darshata hai.","m":"$\\Delta T_b$ ko compare karo — sabse chhoti value wale ka molar mass sabse bada.","s":["S ki elevation $0.043\\,\\mathrm{K}$ sabse chhoti hai.","$M = \\dfrac{K_b \\times w_2}{\\Delta T_b \\times w_1} = \\dfrac{0.52\\times1.0}{0.043\\times0.1} \\approx 120\\,\\mathrm{g\\,mol^{-1}}$.","Isliye S ka molar mass sabse zyada hai."],"r":"Sabse chhoti elevation ($0.043\\,\\mathrm{K}$) S ke liye hai, isliye S ka molar mass sabse bada hai.","w":["P ka $M \\approx 60$.","Q ka $M \\approx 30$.","R ka $M \\approx 20$ (sabse kam)."],"t":"Same mass compare karte waqt: $\\Delta T_b$ chhoti $\\Rightarrow$ molar mass badi. Inverse relation yaad rakho."},{"id":247,"c":"Graphs","q":"Graphs of depression in freezing point ($y$-axis, K) against molality ($x$-axis, $\\mathrm{mol\\,kg^{-1}}$) are drawn for three aqueous solutions and all three are straight lines passing through the origin. Their slopes are $1.86$, $3.72$ and $5.58\\,\\mathrm{K\\,kg\\,mol^{-1}}$. It follows that the solutes in these three solutions respectively behave as","opt":["an associating solute, a non-electrolyte and a dissociating solute","an electrolyte giving three ions, an electrolyte giving two ions and a non-electrolyte","an electrolyte giving two ions, a non-electrolyte and an electrolyte giving three ions","a non-electrolyte, an electrolyte giving two ions and an electrolyte giving three ions"],"ans":3,"cpt":"Slope $= iK_f$. $K_f = 1.86$ hai, isliye slopes $1.86, 3.72, 5.58$ ka matlab $i = 1, 2, 3$.","m":"Har slope ko $K_f$ se divide karo.","s":["$1.86/1.86 = 1 \\Rightarrow$ non-electrolyte.","$3.72/1.86 = 2 \\Rightarrow$ two ions ($\\ce{NaCl}$ type).","$5.58/1.86 = 3 \\Rightarrow$ three ions ($\\ce{CaCl2}$ type)."],"r":"Slopes se $i = 1, 2, 3$ milta hai, isliye order non-electrolyte, two-ion electrolyte, three-ion electrolyte.","w":["Order ulta hai.","Order galat hai.","Association me slope $K_f$ se kam hota ($<1.86$), yahan nahi."],"t":"Slope $= iK_f$ — graph se $i$ nikaalna sabse fast method hai."},{"id":248,"c":"Colligative properties","q":"The freezing points of four $0.10$ molal aqueous solutions are given ($K_f$ of water $= 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$): A $\\rightarrow -0.093\\,^{\\circ}\\mathrm{C}$; B $\\rightarrow -0.186\\,^{\\circ}\\mathrm{C}$; C $\\rightarrow -0.558\\,^{\\circ}\\mathrm{C}$; D $\\rightarrow -0.744\\,^{\\circ}\\mathrm{C}$. The solution which contains a solute that exists as a dimer in water is","opt":["A","B","C","D"],"ans":0,"fig":{"type":"table","head":["Solution","Freezing point ($^{\\circ}\\mathrm{C}$)","$i$"],"rows":[["A","$-0.093$","0.5"],["B","$-0.186$","1.0"],["C","$-0.558$","3.0"],["D","$-0.744$","4.0"]],"cap":"Freezing point data for 0.10 m solutions."},"cpt":"Association (dimer) me $i = 0.5$, isliye depression half hoti hai — calculated $0.186\\,\\mathrm{K}$ ki jagah $0.093\\,\\mathrm{K}$.","m":"Har solution ka $i = \\Delta T_f/(K_fm)$ nikaalo.","s":["A: $i = 0.093/(1.86\\times0.1) = 0.5$.","B: $i = 1.0$; C: $i = 3.0$; D: $i = 4.0$.","$i = 0.5$ dimerisation darshata hai, isliye A sahi hai."],"r":"A ka $i = 0.5$ hai, jo complete dimerisation ke barabar hai.","w":["B non-electrolyte hai ($i=1$).","C ka $i=3$ (three ions).","D ka $i=4$ hai."],"t":"$i = 0.5$ = dimer, $i = 0.33$ = trimer, $i = 0.25$ = tetramer — complete association ke liye."},{"id":249,"c":"Henry's law","q":"The mole fractions of two gases X and Y dissolved in water at $298\\,\\mathrm{K}$ were measured at three partial pressures: at $p = 0.5\\,\\mathrm{bar}$, $x_X = 1.0\\times10^{-5}$ and $x_Y = 5.0\\times10^{-5}$; at $p = 1.0\\,\\mathrm{bar}$, $x_X = 2.0\\times10^{-5}$ and $x_Y = 10.0\\times10^{-5}$; at $p = 2.0\\,\\mathrm{bar}$, $x_X = 4.0\\times10^{-5}$ and $x_Y = 20.0\\times10^{-5}$. From these data it follows that at $298\\,\\mathrm{K}$","opt":["the Henry's law constant of X is $5$ times that of Y and X is the less soluble gas","the Henry's law constant of Y is $5$ times that of X and Y is the less soluble gas","the Henry's law constants of X and Y are equal and both gases have the same solubility","Henry's law is obeyed by neither gas, since the solubility is not constant"],"ans":0,"fig":{"type":"table","head":["$p$ (bar)","$x_X$","$x_Y$"],"rows":[["0.5","$1.0\\times10^{-5}$","$5.0\\times10^{-5}$"],["1.0","$2.0\\times10^{-5}$","$10.0\\times10^{-5}$"],["2.0","$4.0\\times10^{-5}$","$20.0\\times10^{-5}$"]],"cap":"Solubility data for two gases at 298 K."},"cpt":"$K_H = p/x$: har gas ke liye ratio constant hai (Henry's law obeyed). Jiska $x$ chhota, uska $K_H$ bada aur wo kam soluble hai.","m":"$p/x$ dono gases ke liye nikaalo aur compare karo.","s":["X: $0.5/(1.0\\times10^{-5}) = 5.0\\times10^{4}\\,\\mathrm{bar}$, aur baaki rows bhi same.","Y: $0.5/(5.0\\times10^{-5}) = 1.0\\times10^{4}\\,\\mathrm{bar}$.","$K_H$(X) $= 5\\times K_H$(Y) aur X kam soluble hai."],"r":"X ka $K_H$ paanch guna hai, isliye X kam soluble hai — option A sahi.","w":["Y ki $K_H$ chhoti hai, isliye Y zyada soluble hai.","$K_H$ barabar nahi hain.","Dono gases Henry's law obey karti hain ($p/x$ constant)."],"t":"Data se $K_H$ nikaalne ka tareeka: har row me $p/x$ — constant mile to law obeyed."},{"id":250,"c":"Non-ideal solutions","q":"The total vapour pressure of mixtures of liquids A and B was measured at $300\\,\\mathrm{K}$ ($p_A^{\\circ} = 100\\,\\mathrm{mm\\,Hg}$, $p_B^{\\circ} = 50\\,\\mathrm{mm\\,Hg}$) along with the values predicted by Raoult's law. From these data it is correct to conclude that","opt":["the mixture is ideal over the whole range because the two ends coincide with the predicted values","the mixture shows negative deviation, has stronger A-B interactions than A-A and B-B interactions, and forms a maximum boiling azeotrope","the mixture shows positive deviation and forms a minimum boiling azeotrope","the mixture shows negative deviation because its vapour pressure is higher than predicted at low $x_A$"],"ans":1,"fig":{"type":"table","head":["$x_A$","Measured $p$","Raoult's law $p$"],"rows":[["0.00","50","50"],["0.25","63","62.5"],["0.50","70","75"],["0.75","84","87.5"],["1.00","100","100"]],"cap":"Measured and ideal vapour pressures at 300 K (mm Hg)."},"cpt":"Jahan measured $<$ predicted wahan negative deviation. Negative deviation ka reason strong A-B interactions hain aur isse maximum boiling azeotrope banta hai.","m":"Row-wise comparison karo.","s":["$x_A=0.5$: measured $70 < 75$; $x_A=0.75$: measured $84 < 87.5$.","Measured kam hai $\\Rightarrow$ negative deviation.","Negative deviation $\\Rightarrow$ strong A-B interactions $\\Rightarrow$ max boiling azeotrope."],"r":"Measured pressure predicted se kam hai, isliye negative deviation aur maximum boiling azeotrope — option B sahi.","w":["End points ka match hona ideal prove nahi karta.","Positive deviation me measured zyada hota.","Measured higher nahi, lower hai."],"t":"Deviation ka sign hamesha intermediate compositions par dekho — end points par hamesha match hota hai."},{"id":251,"c":"Concentration terms","q":"The molarity of concentrated nitric acid which is $68\\%$ w/w $\\ce{HNO3}$ and has a density of $1.504\\,\\mathrm{g\\,mL^{-1}}$ is nearly (molar mass of $\\ce{HNO3} = 63\\,\\mathrm{g\\,mol^{-1}}$)","opt":["$15.1\\,\\mathrm{M}$","$14.2\\,\\mathrm{M}$","$17.4\\,\\mathrm{M}$","$16.2\\,\\mathrm{M}$"],"ans":3,"cpt":"$M = \\dfrac{10\\,d\\,\\%}{M_m}$: yahan $d$ $\\mathrm{g\\,mL^{-1}}$ me, $\\%$ w/w me.","m":"1 L solution ka mass nikaalo, usme acid ka mass, phir moles.","s":["1 L solution ka mass $= 1504\\,\\mathrm{g}$.","$\\ce{HNO3}$ ka mass $= 0.68\\times1504 = 1022.7\\,\\mathrm{g}$.","$n = \\dfrac{1022.7}{63} = 16.23\\,\\mathrm{mol}$ $\\Rightarrow M \\approx 16.2\\,\\mathrm{M}$."],"r":"$16.2\\,\\mathrm{M}$ — concentrated nitric acid ki standard value.","w":["$15.1$ approximate mass se aata hai.","$14.2$ galat density se aata hai.","$17.4$ zyada hai."],"t":"Formula: $M = \\dfrac{10\\,d\\,\\%}{M_m}$ — isse concentration questions seconds me solve hote hain."},{"id":252,"c":"Concentration terms","q":"The volume of the $68\\%$ w/w $\\ce{HNO3}$ solution of the previous question (density $1.504\\,\\mathrm{g\\,mL^{-1}}$) required to prepare $250\\,\\mathrm{mL}$ of a $2.0\\,\\mathrm{M}$ aqueous $\\ce{HNO3}$ solution is nearly","opt":["$40.8\\,\\mathrm{mL}$","$30.9\\,\\mathrm{mL}$","$35.4\\,\\mathrm{mL}$","$26.5\\,\\mathrm{mL}$"],"ans":1,"cpt":"Dilution me moles constant rehte hain: $M_1V_1 = M_2V_2$.","m":"Concentrated acid ki molarity ($16.2\\,\\mathrm{M}$) use karo aur $V_1$ nikaalo.","s":["Required moles $= 2.0\\times0.250 = 0.50\\,\\mathrm{mol}$.","Concentrated acid $16.2\\,\\mathrm{M}$ hai, isliye $V_1 = \\dfrac{0.50}{16.2} = 0.0309\\,\\mathrm{L}$.","$V_1 \\approx 30.9\\,\\mathrm{mL}$."],"r":"$M_1V_1 = M_2V_2 \\Rightarrow V_1 = 30.9\\,\\mathrm{mL}$.","w":["$40.8$ me $M_1$ galat li gayi.","$35.4$ zyada hai.","$26.5$ galat molarity se aata hai."],"t":"Dilution ka rule: moles pehle aur baad me same. $M_1V_1 = M_2V_2$ — units same rakho."},{"id":253,"c":"Concentration terms","q":"The mole fraction of the solute in a $1.5$ molal aqueous solution of a non-electrolyte whose molar mass is $60\\,\\mathrm{g\\,mol^{-1}}$ is nearly","opt":["$0.026$","$0.045$","$0.052$","$0.083$"],"ans":0,"cpt":"1.5 molal ka matlab $1.5\\,\\mathrm{mol}$ solute in $1\\,\\mathrm{kg}$ water. $1\\,\\mathrm{kg}$ water $= 55.56\\,\\mathrm{mol}$.","m":"$x_2 = \\dfrac{1.5}{1.5+55.56}$.","s":["$1.5$ molal ka matlab $1.5\\,\\mathrm{mol}$ solute aur $1\\,\\mathrm{kg} = 55.56\\,\\mathrm{mol}$ water.","$n_2 = 1.5$, $n_1 = 55.56$.","$x_2 = \\dfrac{1.5}{57.06} = 0.0263$.","Sahi option A: $x_2 = 0.026$."],"r":"$x_2 \\approx 0.026$ — solute ka molar mass yahan matter nahi karta.","w":["$0.045$ galat denominator se aata hai.","$0.052$ $1.5$ ko $1.5+27$ karne se aata hai.","$0.083$ zyada hai."],"t":"Trap: solute ka molar mass diya hota hai par mole fraction ke liye zaroori nahi — sirf moles chahiye."},{"id":254,"c":"Concentration terms","q":"A $2.0$ molal aqueous $\\ce{NaCl}$ solution has a density of $1.08\\,\\mathrm{g\\,mL^{-1}}$. Its molarity is nearly","opt":["$1.72\\,\\mathrm{M}$","$1.86\\,\\mathrm{M}$","$1.93\\,\\mathrm{M}$","$2.16\\,\\mathrm{M}$"],"ans":2,"cpt":"Molality se molarity: 1 kg solvent se start karo, solution ka mass nikaalo, volume nikaalo (density se), phir moles/volume.","m":"$2\\,\\mathrm{mol}$ $\\ce{NaCl}$ + $1\\,\\mathrm{kg}$ water $\\rightarrow$ solution ka mass $\\rightarrow$ volume $\\rightarrow$ molarity.","s":["$2\\,\\mathrm{mol}$ $\\ce{NaCl}$ ka mass $= 2\\times58.5 = 117\\,\\mathrm{g}$.","Solution ka mass $= 1000+117 = 1117\\,\\mathrm{g}$.","Volume $= \\dfrac{1117}{1.08} = 1034\\,\\mathrm{mL} = 1.034\\,\\mathrm{L}$.","$M = \\dfrac{2.0}{1.034} = 1.93\\,\\mathrm{M}$."],"r":"$M = 2.0/1.034 = 1.93\\,\\mathrm{M}$.","w":["$1.72$ galat density se aata hai.","$1.86$ approximate hai.","$2.16$ solute mass add na karne se aata hai."],"t":"Molality $\\rightarrow$ molarity conversion me solute ka mass add karna mat bhoolna ($117\\,\\mathrm{g}$ yahan)."},{"id":255,"c":"Henry's law","q":"The Henry's law constant of a gas in water at $298\\,\\mathrm{K}$ is $8.0\\times10^{4}\\,\\mathrm{bar}$ when solubility is expressed as mole fraction. At a partial pressure of $0.80\\,\\mathrm{bar}$, the number of moles of the gas dissolved in $1\\,\\mathrm{L}$ of water is nearly ($1\\,\\mathrm{L}$ of water contains $55.5\\,\\mathrm{mol}$ of water)","opt":["$5.55\\times10^{-4}\\,\\mathrm{mol}$","$1.00\\times10^{-5}\\,\\mathrm{mol}$","$5.55\\times10^{-2}\\,\\mathrm{mol}$","$8.00\\times10^{-4}\\,\\mathrm{mol}$"],"ans":0,"cpt":"$x = p/K_H$ se mole fraction, phir $x\\times55.5$ se moles per litre.","m":"Do steps: mole fraction, phir moles.","s":["Given: $K_H = 8.0\\times10^{4}\\,\\mathrm{bar}$, $p = 0.80\\,\\mathrm{bar}$, aur $1\\,\\mathrm{L}$ water $= 55.5\\,\\mathrm{mol}$.","$x = \\dfrac{0.80}{8.0\\times10^{4}} = 1.0\\times10^{-5}$.","Moles $= 1.0\\times10^{-5}\\times55.5 = 5.55\\times10^{-4}\\,\\mathrm{mol}$.","Sahi option A: $5.55\\times10^{-4}\\,\\mathrm{mol}$."],"r":"$5.55\\times10^{-4}\\,\\mathrm{mol}$ gas $1\\,\\mathrm{L}$ water me dissolve hoti hai.","w":["$1.00\\times10^{-5}$ sirf mole fraction hai.","$5.55\\times10^{-2}$ das guna zyada hai.","$8.00\\times10^{-4}$ galat calculation hai."],"t":"Dilute solution me $x\\times55.5$ = moles per litre water. Ye shortcut Henry's law ke numericals me bahut kaam aata hai."},{"id":256,"c":"Vapour pressure","q":"At $300\\,\\mathrm{K}$, the vapour pressure of pure water is $31.8\\,\\mathrm{mm\\,Hg}$. When $0.50\\,\\mathrm{mol}$ of a non-volatile non-electrolyte is dissolved in $1.0\\,\\mathrm{kg}$ of water, the vapour pressure of the solution is nearly","opt":["$30.60\\,\\mathrm{mm\\,Hg}$","$31.24\\,\\mathrm{mm\\,Hg}$","$31.79\\,\\mathrm{mm\\,Hg}$","$31.52\\,\\mathrm{mm\\,Hg}$"],"ans":3,"cpt":"$p = p^{\\circ}\\dfrac{n_1}{n_1+n_2}$, yahan $n_1 = 1000/18 = 55.56\\,\\mathrm{mol}$.","m":"Water ke moles nikaalo, mole fraction banao, multiply karo.","s":["$n_1 = 55.56$, $n_2 = 0.5$.","$x_1 = \\dfrac{55.56}{56.06} = 0.99108$.","$p = 31.8\\times0.99108 = 31.52\\,\\mathrm{mm\\,Hg}$."],"r":"$p = 31.52\\,\\mathrm{mm\\,Hg}$ — 0.5 molal solution ka vapour pressure.","w":["$30.60$ $0.5/55.5$ ko directly multiply karne ki galti hai.","$31.24$ zyada depression dikhata hai.","$31.79$ bahut chhota change hai (galat mole fraction)."],"t":"0.5 molal aqueous solution me $x_2 \\approx 0.0089$ hota hai — depression isi ratio se aati hai."},{"id":257,"c":"Raoult's law","q":"Liquids A and B form an ideal solution. At $300\\,\\mathrm{K}$, $p_A^{\\circ} = 60\\,\\mathrm{mm\\,Hg}$ and $p_B^{\\circ} = 90\\,\\mathrm{mm\\,Hg}$. For a liquid mixture in which $x_A = 0.40$, the mole fraction of A in the vapour phase and the total vapour pressure are respectively","opt":["$0.31$ and $78\\,\\mathrm{mm\\,Hg}$","$0.40$ and $78\\,\\mathrm{mm\\,Hg}$","$0.31$ and $60\\,\\mathrm{mm\\,Hg}$","$0.40$ and $66\\,\\mathrm{mm\\,Hg}$"],"ans":0,"cpt":"$p_A = p_A^{\\circ}x_A$, $p_B = p_B^{\\circ}x_B$, $p_{\\text{total}} = p_A+p_B$, $y_A = p_A/p_{\\text{total}}$.","m":"Teen steps: partial pressures, total, mole fraction.","s":["$p_A = 60\\times0.4 = 24\\,\\mathrm{mm\\,Hg}$; $p_B = 90\\times0.6 = 54\\,\\mathrm{mm\\,Hg}$.","$p_{\\text{total}} = 78\\,\\mathrm{mm\\,Hg}$.","$y_A = 24/78 = 0.308 \\approx 0.31$."],"r":"$y_A = 0.31$ aur total pressure $78\\,\\mathrm{mm\\,Hg}$.","w":["$y_A = 0.40$ liquid ka mole fraction hai.","$60$ sirf pure A ka vapour pressure hai.","$66$ galat total hai."],"t":"Vapour phase us component se rich hota hai jiska $p^{\\circ}$ zyada ho — yahan B ($90 > 60$), isliye $y_B = 0.69$."},{"id":258,"c":"Raoult's law","q":"At $350\\,\\mathrm{K}$, two liquids A and B form an ideal solution. For an equimolar liquid mixture, the total vapour pressure is $400\\,\\mathrm{mm\\,Hg}$ and the mole fraction of A in the vapour phase is $0.60$. The vapour pressures of pure A and pure B are respectively","opt":["$400\\,\\mathrm{mm\\,Hg}$ and $400\\,\\mathrm{mm\\,Hg}$","$480\\,\\mathrm{mm\\,Hg}$ and $320\\,\\mathrm{mm\\,Hg}$","$320\\,\\mathrm{mm\\,Hg}$ and $480\\,\\mathrm{mm\\,Hg}$","$240\\,\\mathrm{mm\\,Hg}$ and $160\\,\\mathrm{mm\\,Hg}$"],"ans":1,"cpt":"$y_A = \\dfrac{p_A}{p_{\\text{total}}} \\Rightarrow p_A = y_A \\times p_{\\text{total}}$. Phir $p_A = p_A^{\\circ}x_A$ se $p_A^{\\circ}$.","m":"Pehle partial pressure nikaalo, phir $x_A = 0.5$ se divide karo.","s":["$p_A = 0.60\\times400 = 240\\,\\mathrm{mm\\,Hg}$.","$p_A = p_A^{\\circ}\\times0.5 \\Rightarrow p_A^{\\circ} = 480\\,\\mathrm{mm\\,Hg}$.","$p_B = 0.40\\times400 = 160\\,\\mathrm{mm\\,Hg} \\Rightarrow p_B^{\\circ} = 320\\,\\mathrm{mm\\,Hg}$."],"r":"$p_A^{\\circ} = 480\\,\\mathrm{mm\\,Hg}$ aur $p_B^{\\circ} = 320\\,\\mathrm{mm\\,Hg}$.","w":["$400$ dono ke liye tab hota jab ideal binary mixture ka average ho.","Values swapped hain.","$240$ aur $160$ partial pressures hain, pure vapour pressures nahi."],"t":"Equimolar mixture me $x = 0.5$, isliye partial pressure pure vapour pressure ka aadha hota hai."},{"id":259,"c":"Depression of freezing point","q":"$5.0\\,\\mathrm{g}$ of a salt MX, which dissociates completely into two ions, is dissolved in $100\\,\\mathrm{g}$ of water. The freezing point of the solution is $-1.86\\,^{\\circ}\\mathrm{C}$. Taking $K_f$ of water as $1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the molar mass of MX is","opt":["$50\\,\\mathrm{g\\,mol^{-1}}$","$100\\,\\mathrm{g\\,mol^{-1}}$","$200\\,\\mathrm{g\\,mol^{-1}}$","$25\\,\\mathrm{g\\,mol^{-1}}$"],"ans":1,"cpt":"$\\Delta T_f = iK_fm$; MX do ions deta hai isliye $i=2$.","m":"Pehle $m$ nikaalo ($i$ ke saath), phir moles aur molar mass.","s":["$1.86 = 2\\times1.86\\times m \\Rightarrow m = 0.5\\,\\mathrm{mol\\,kg^{-1}}$.","$0.1\\,\\mathrm{kg}$ water me moles $= 0.05$.","$M = \\dfrac{5.0}{0.05} = 100\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M = 100\\,\\mathrm{g\\,mol^{-1}}$, aur $\\ce{NaCl}$ jaisa salt isi ke qareeb hota hai.","w":["$50$ tab aata agar $i=1$ liya jaye.","$200$ tab aata agar $i=4$.","$25$ ka koi basis nahi."],"t":"Salt ke molar mass ke questions me $i$ bhoolna sabse common galti hai — pehle $i$ likho."},{"id":260,"c":"Osmotic pressure","q":"At $300\\,\\mathrm{K}$, a solution containing $1.0\\,\\mathrm{g}$ of a protein per litre of solution exerts an osmotic pressure of $2.5\\times10^{-4}\\,\\mathrm{atm}$. The molar mass of the protein is nearly ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$)","opt":["$1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$","$1.0\\times10^{6}\\,\\mathrm{g\\,mol^{-1}}$","$5.0\\times10^{-4}\\,\\mathrm{g\\,mol^{-1}}$","$1.0\\times10^{4}\\,\\mathrm{g\\,mol^{-1}}$"],"ans":0,"cpt":"$\\pi = \\dfrac{wRT}{MV} \\Rightarrow M = \\dfrac{wRT}{\\pi V}$.","m":"Values seedha formula me rakho.","s":["$RT = 0.0821\\times300 = 24.63$.","$M = \\dfrac{1.0\\times24.63}{2.5\\times10^{-4}\\times1} = 9.85\\times10^{4}$.","$M \\approx 1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M \\approx 1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$ — protein ke liye realistic value.","w":["$10^{6}$ das guna zyada hai.","$5\\times10^{-4}$ bilkul galat order hai.","$10^{4}$ me exponent galat hai."],"t":"Bade molar mass ke liye $\\pi$ chhota hota hai ($10^{-4}$ atm) — ye sanity check use karo."},{"id":261,"c":"Osmotic pressure","q":"A solution at $298\\,\\mathrm{K}$ is $0.020\\,\\mathrm{M}$ in glucose and $0.015\\,\\mathrm{M}$ in $\\ce{CaCl2}$. Assuming complete dissociation of $\\ce{CaCl2}$, the osmotic pressure of this solution is nearly","opt":["$1.06\\,\\mathrm{atm}$","$1.59\\,\\mathrm{atm}$","$1.87\\,\\mathrm{atm}$","$2.13\\,\\mathrm{atm}$"],"ans":1,"cpt":"$\\pi = \\sum i_iC_iRT$: glucose ke liye $i=1$, $\\ce{CaCl2}$ ke liye $i=3$.","m":"Total particle molarity nikaalo, phir $RT$ se multiply.","s":["Glucose: $1\\times0.020 = 0.020\\,\\mathrm{M}$.","$\\ce{CaCl2}$: $3\\times0.015 = 0.045\\,\\mathrm{M}$.","Total $= 0.065\\,\\mathrm{M}$.","$\\pi = 0.065\\times0.0821\\times298 = 1.59\\,\\mathrm{atm}$."],"r":"Total particle concentration $0.065\\,\\mathrm{M}$ se $\\pi = 1.59\\,\\mathrm{atm}$.","w":["$1.06$ sirf glucose aur $\\ce{CaCl2}$ (bina $i$) ka sum hai.","$1.87$ galat temperature se aata hai.","$2.13$ zyada hai."],"t":"Multiple solutes: har solute ka $iC$ alag nikaalo aur add karo — ek hi baar me $RT$ multiply karo."},{"id":262,"c":"van't Hoff factor","q":"$2.0\\,\\mathrm{g}$ of an electrolyte of molar mass $100\\,\\mathrm{g\\,mol^{-1}}$ is dissolved in $100\\,\\mathrm{g}$ of water. The boiling point of the solution rises by $0.208\\,\\mathrm{K}$. Taking $K_b$ of water as $0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the electrolyte is","opt":["a weak electrolyte ($i=1.1$)","a non-electrolyte that associates ($i=0.5$)","a strong electrolyte giving three ions per formula unit, completely dissociated","a strong electrolyte giving two ions per formula unit, completely dissociated"],"ans":3,"cpt":"$i = \\dfrac{\\text{observed } \\Delta T_b}{K_bm}$; yahan molality $= \\dfrac{2/100}{0.1} = 0.2$.","m":"Molality nikaalo, $i$ nikaalo, phir ions ki sankhya decide karo.","s":["$n = 2.0/100 = 0.02\\,\\mathrm{mol}$; $m = 0.02/0.1 = 0.20\\,\\mathrm{mol\\,kg^{-1}}$.","Calculated $\\Delta T_b = 0.52\\times0.2 = 0.104\\,\\mathrm{K}$.","$i = 0.208/0.104 = 2.0$.","$i=2$ ka matlab do ions — strong electrolyte (jaise $\\ce{NaCl}$)."],"r":"$i=2$ mila, isliye electrolyte do ions deta hai (completely dissociated).","w":["$i=1.1$ tab hota jab $\\Delta T_b$ chhoti hoti.","$i=0.5$ association ke liye hota.","$i=3$ ke liye $\\Delta T_b = 0.312\\,\\mathrm{K}$ chahiye."],"t":"$i$ ki value se hi electrolyte ka type pata chal jata hai — $2$ = two ions, $3$ = three ions."},{"id":263,"c":"Non-ideal solutions","q":"Statement I: For a liquid pair showing positive deviation from Raoult's law, the total vapour pressure-composition curve lies above the straight line predicted by Raoult's law over the whole composition range. Statement II: In such a solution, the A-B interactions are weaker than the average A-A and B-B interactions, so the escaping tendency of both components is greater than in the pure liquids.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Positive deviation me measured $p$ predicted se zyada hota hai, isliye curve line ke upar hota hai. Kaaran weak A-B interactions hain.","m":"Graph ki position aur molecular reason dono check karo.","s":["Curve line ke upar $\\Rightarrow p$ zyada — Statement I sahi.","Weak A-B interactions se escaping tendency badh ti hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; weak interactions hi curve ke upar hone ka kaaran hain.","w":["Statement II galat nahi.","Statement I galat nahi.","Dono sahi hain."],"t":"Positive deviation ka graph: straight line ke upar ek 'hump' — jahan hump ka peak, wahan azeotrope."},{"id":264,"c":"Vapour pressure","q":"Statement I: For a dilute solution of a non-volatile non-electrolyte, the quantity $(p_1^{\\circ}-p_1)/x_2$ is nearly equal to $p_1^{\\circ}$. Statement II: As $x_2$ approaches zero, the vapour pressure of the solution approaches that of the pure solvent, so the relative lowering tends to the mole fraction of the solute.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct"],"ans":2,"cpt":"$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2 \\Rightarrow p^{\\circ}-p = p^{\\circ}x_2 \\Rightarrow \\dfrac{p^{\\circ}-p}{x_2} = p^{\\circ}$. Ye relation har concentration par sahi hai (non-volatile solute ke liye).","m":"Raoult's law ko rearrange karo.","s":["$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2$","Cross-multiply: $p^{\\circ}-p = p^{\\circ}x_2$.","$\\dfrac{p^{\\circ}-p}{x_2} = p^{\\circ}$ — Statement I sahi.","$x_2\\to0$ par $p\\to p^{\\circ}$ — Statement II sahi."],"r":"Dono statements correct hain; ye seedha Raoult's law ka rearrangement hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Is relation se ek linear graph banta hai: $(p^{\\circ}-p)$ vs $x_2$ ka slope $p^{\\circ}$ hota hai."},{"id":265,"c":"Abnormal molar mass","q":"Statement I: If a solute associates in solution, the molar mass obtained from osmotic pressure measurement is greater than the true molar mass. Statement II: Association reduces the number of solute particles, so the observed colligative effect is smaller and the calculated molar mass is correspondingly larger.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect"],"ans":1,"cpt":"Association $\\Rightarrow$ kam particles $\\Rightarrow$ kam $\\pi$ $\\Rightarrow$ formula $M = wRT/(\\pi V)$ se bada $M$ aata hai.","m":"$M$ ka formula dekho: $\\pi$ denominator me hai, isliye chhota $\\pi$ bada $M$ deta hai.","s":["Association se particles ghat te hain — Statement II sahi.","Kam $\\pi$ se calculated $M$ bada aata hai — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; kam particles se colligative effect kam hota hai aur molar mass zyada calculate hota hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Abnormal molar mass: association $\\rightarrow$ observed $>$ true; dissociation $\\rightarrow$ observed $<$ true."},{"id":266,"c":"Solubility of gases","q":"Statement I: The temperature dependence of the solubility of a gas in a liquid is decided by the enthalpy of solution of the gas in that liquid. Statement II: For gases whose dissolution in a liquid is exothermic, the solubility decreases with increase in temperature at constant partial pressure.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect"],"ans":1,"cpt":"Le Chatelier ke hisaab se exothermic dissolution heating par oppose hota hai, isliye solubility ghat ti hai. Enthalpy ka sign hi direction decide karta hai.","m":"Enthalpy ka sign aur temperature effect ko jodo.","s":["Dissolution ka enthalpy sign direction decide karta hai — Statement I sahi.","Exothermic me heating se solubility ghat ti hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; enthalpy of solution hi temperature dependence ka deciding factor hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Agar dissolution endothermic ho to heating par solubility badhegi — sign dekh kar decide karo."},{"id":267,"c":"Azeotropes","q":"Statement I: A binary liquid mixture forming a minimum boiling azeotrope cannot be completely resolved into pure components by repeated fractional distillation at that pressure. Statement II: At the azeotropic composition the vapour and liquid have identical composition, so the composition of the mixture does not change on boiling.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Azeotrope par $y=x$ hone se distillation composition nahi badalta, isliye separation nahi hota.","m":"Statement II kaaran hai, Statement I nateeja.","s":["Azeotrope par $y=x$ — Statement II sahi.","Isliye fractional distillation se separation nahi — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; same composition wale vapour se koi separation nahi hoti.","w":["Statement II galat nahi.","Statement I galat nahi.","Dono sahi hain."],"t":"Isliye ethanol ko $95\\%$ se aage concentrate karne ke liye azeotropic distillation ya molecular sieves use hote hain."},{"id":268,"c":"Degree of dissociation","q":"Statement I: On dilution, the degree of dissociation of a weak monobasic acid increases, so its van't Hoff factor approaches $2$. Statement II: On dilution, the number of ions produced per formula unit of the acid increases.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct"],"ans":1,"cpt":"Dilution par $\\alpha$ badh ta hai, isliye $i = 1+\\alpha$ badh kar 2 ke qareeb jata hai. Par ions per formula unit hamesha 2 hi rehte hain — unki sankhya nahi, unka fraction badh ta hai.","m":"$\\alpha$ aur 'ions per formula unit' me farq karo.","s":["Dilution par $\\alpha$ badh ta hai $\\Rightarrow i \\to 2$ — Statement I sahi.","Ions per formula unit (2) nahi badalte, sirf dissociated molecules ka fraction badh ta hai — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"$i$ 2 ke qareeb jata hai (sahi), par ions ki sankhya per formula unit nahi badalti — Statement II galat.","w":["Statement II galat hai.","Statement I galat nahi.","Statement I sahi hai."],"t":"Monobasic acid: maximum $i=2$; dilution par $i$ isi limit ke qareeb jata hai."},{"id":269,"c":"Elevation of boiling point","q":"Statement I: If a solute associates in a solvent, the boiling point of the solution is lower than the value calculated assuming that no association occurs. Statement II: Association decreases the effective molality of particles in the solution, so the observed elevation is smaller than the calculated one.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect"],"ans":2,"cpt":"Association se particle molality ghat ti hai, isliye $\\Delta T_b$ calculated se kam hoti hai — boiling point bhi kam badhta hai.","m":"Particle count ka effect dono statements me check karo.","s":["Association se effective molality ghat ti hai — Statement II sahi.","Kam particles $\\Rightarrow$ kam $\\Delta T_b$ $\\Rightarrow$ boiling point calculated se kam — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; particle molality ka ghatna hi kam elevation deta hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Association me $i<1$, isliye har colligative property calculated se kam hoti hai."},{"id":270,"c":"Vapour pressure","q":"Statement I: Solutions of two different non-volatile solvents containing the same mole fraction of the same solute have the same relative lowering of vapour pressure, but not necessarily the same absolute lowering in $\\mathrm{mm\\,Hg}$. Statement II: The relative lowering of vapour pressure depends on the mole fraction of the solute, whereas the absolute lowering also depends on the vapour pressure of the pure solvent.","opt":["Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct"],"ans":1,"cpt":"Relative lowering $= x_2$ (solvent-independent), absolute lowering $= p^{\\circ}x_2$ (solvent par depend).","m":"Dono expressions likho aur compare karo.","s":["Relative lowering $= x_2$ — same $x_2$ par same — Statement I ka pehla part sahi.","Absolute lowering $= p^{\\circ}x_2$ — $p^{\\circ}$ solvent par depend — Statement I ka doosra part sahi.","Statement II isi ka explanation hai — sahi."],"r":"Dono statements correct hain; relative quantity solvent-independent hai, absolute nahi.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Isi wajah se relative lowering ko 'colligative' kaha jata hai — ye solvent ki nature se independent hai."},{"id":271,"c":"Osmotic pressure","q":"Statement I: At the same temperature, a $0.10\\,\\mathrm{M}$ aqueous solution of a weak acid can exert a smaller osmotic pressure than a $0.10\\,\\mathrm{M}$ aqueous glucose solution. Statement II: A weak acid dissociates partially, so the total number of particles in such a solution is greater than $0.10\\,\\mathrm{mol}$ per litre.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Weak acid partially dissociate hota hai, isliye particles $0.10\\,\\mathrm{M}$ se zyada hote hain — osmotic pressure glucose se kam nahi ho sakta.","m":"Particle count compare karo: weak acid $>0.10$, glucose $=0.10$.","s":["Weak acid ke particles $0.10\\,\\mathrm{M}$ se zyada — Statement II sahi.","Isliye uska $\\pi$ glucose se kam nahi, zyada hoga — Statement I galat.","Isliye Statement I incorrect, Statement II correct."],"r":"Weak acid ka $\\pi$ glucose se zyada hota hai (zyada particles), kam nahi — Statement I galat.","w":["Statement I galat hai.","Statement II galat nahi.","Statement II sahi hai."],"t":"Partial dissociation me $i$ 1 aur 2 ke beech hota hai, isliye $\\pi$ glucose (i=1) aur strong acid (i=2) ke beech hota hai."},{"id":272,"c":"Constants","q":"Statement I: The cryoscopic constant of water ($1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$) is numerically larger than its ebullioscopic constant ($0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$), even though the enthalpy of fusion of water is much smaller than its enthalpy of vaporisation. Statement II: Both constants involve the square of the respective transition temperature and the corresponding enthalpy of the phase change, and the square of the freezing temperature of water is much smaller than the square of its boiling temperature.","opt":["Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"$K_f \\propto \\dfrac{T_f^2}{\\Delta H_{\\text{fus}}}$ aur $K_b \\propto \\dfrac{T_b^2}{\\Delta H_{\\text{vap}}}$. Yahan $\\Delta H_{\\text{fus}} < \\Delta H_{\\text{vap}}$ par $T_f^2$ bhi bahut chhota ($273^2$ vs $373^2$) hai; ratio aisa banta hai ki $K_f > K_b$.","m":"Formula me dono factors (enthalpy aur $T^2$) ka combined effect dekho.","s":["Dono constants $T^2/\\Delta H$ type expressions hain — Statement II sahi.","$\\Delta H_{\\text{fus}}$ chhota hone se $K_f$ badh ta hai, aur $T_f^2$ chhota hone se ghat ta hai; net result $K_f > K_b$ — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; enthalpy aur temperature square ka combined effect $K_f > K_b$ deta hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Data se hi pata chalta hai: water ka $K_f = 1.86 > K_b = 0.52$ — isliye freezing point depression zyada sensitive method hai."},{"id":273,"c":"Concentration terms","q":"Which of the following statements is NOT correct?","opt":["Mole fraction and molality are independent of temperature.","The normality and molarity of a solution are equal for every solute, irrespective of its $n$-factor.","The molarity of a solution can be converted into its molality only if the density of the solution is known.","The molarity of a solution decreases on heating because the volume of the solution expands."],"ans":1,"cpt":"Normality $= M \\times n$-factor — $n$-factor 1 na ho to dono barabar nahi hote.","m":"Last option me $n$-factor ki baat check karo.","s":["Mole fraction aur molality temperature-independent hain — sahi.","Heating par $M$ ghat ti hai — sahi.","Molarity-molality conversion ke liye density chahiye — sahi.","Normality hamesha molarity ke barabar nahi hoti — galat statement."],"r":"Normality molarity aur $n$-factor ka product hai, isliye 'equal for every solute' wali statement NOT correct hai.","w":["Ye sahi hai.","Density chahiye — sahi.","Ye bhi sahi hai."],"t":"$\\ce{H2SO4}$ ka $n=2$: $1\\,\\mathrm{M}$ $\\ce{H2SO4}$ $= 2\\,\\mathrm{N}$."},{"id":274,"c":"Henry's law","q":"Which of the following statements is NOT correct?","opt":["At constant temperature, the solubility of a gas in a liquid is directly proportional to the partial pressure of the gas above the liquid.","The Henry's law constant of a gas generally increases with increase in temperature when its dissolution is exothermic.","When the partial pressure of a dissolved gas is reduced, the gas escapes from the solution.","The Henry's law constant of a gas is a dimensionless quantity, since it relates a pressure to a mole fraction."],"ans":3,"cpt":"$K_H = p/x$: numerator pressure hai, denominator dimensionless, isliye $K_H$ ka unit pressure (bar/atm) hota hai.","m":"Unit nikaalne ke liye $K_H$ ka expression likho.","s":["Exothermic dissolution me heating par $K_H$ badh ta hai — sahi.","Solubility $\\propto p$ — sahi.","Pressure ghat ne par gas escape karti hai — sahi.","$K_H$ dimensionless nahi, pressure ka unit rakhta hai — galat statement."],"r":"$K_H$ ka unit pressure hota hai (bar), isliye 'dimensionless' wali statement NOT correct hai.","w":["Ye sahi hai.","Henry's law ki sahi statement hai.","Gas escape ka mechanism sahi hai."],"t":"Unit ka sawal aaye to formula se derive karo: $K_H = p/x \\Rightarrow$ pressure ka unit."},{"id":275,"c":"Azeotropes","q":"Which of the following statements about azeotropes is correct?","opt":["Minimum boiling azeotropes are formed by mixtures showing negative deviation from Raoult's law.","Azeotropic mixtures can be separated into pure components by fractional distillation.","An azeotropic mixture boils at a constant temperature and distils without any change in composition.","At the azeotropic composition, the mole fractions of the components in the vapour phase differ from those in the liquid phase."],"ans":2,"cpt":"Azeotrope constant temperature par distill hota hai aur composition nahi badalta — yahi definition hai.","m":"Definition ko har option se compare karo.","s":["Minimum boiling azeotrope positive deviation se banta hai, negative se nahi — galat.","Azeotrope constant $T_b$ par distill hota hai — sahi.","Azeotrope par $y=x$ — option galat.","Separation fractional distillation se nahi hoti — galat."],"r":"Azeotrope ki sahi definition: constant temperature par bina composition change distill hona.","w":["Minimum boiling azeotrope $\\leftrightarrow$ positive deviation.","Azeotrope distillation se alag nahi hota.","Azeotrope par $y=x$ hota hai."],"t":"Azeotrope = 'constant boiling mixture'; composition same rehne se separation nahi hota."},{"id":276,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["The depression in freezing point of a dilute solution is proportional to the molality of particles.","Vapour pressure of a solution is itself a colligative property, since it depends only on the number of solute particles.","All colligative properties are proportional to the number of solute particles present in solution.","Osmotic pressure can be measured at room temperature, so it is suitable for substances that are denatured at higher temperatures."],"ans":1,"cpt":"Vapour pressure ki absolute value solvent ki nature aur temperature par depend karti hai — isliye wo colligative nahi hai. Colligative hai 'relative lowering' of vapour pressure.","m":"Colligative properties ki list yaad karo.","s":["Osmotic pressure room temperature par measure hota hai — sahi.","Colligative properties particle number ke proportional hain — sahi.","$\\Delta T_f \\propto$ particle molality — sahi.","Vapour pressure khud colligative nahi hai — galat statement."],"r":"Vapour pressure absolute quantity hai aur solvent ki nature par depend karti hai, isliye ye colligative property nahi — statement NOT correct hai.","w":["Ye sahi hai.","Ye sahi hai.","Ye sahi hai."],"t":"Chaar colligative properties: relative lowering, $\\Delta T_b$, $\\Delta T_f$, $\\pi$."},{"id":277,"c":"van't Hoff factor","q":"Which of the following statements is correct?","opt":["For complete dimerisation of a solute, the van't Hoff factor is $2$.","For complete dissociation of a salt of the type $\\ce{AB2}$, the van't Hoff factor is $3$.","For a non-electrolyte solute, the van't Hoff factor is always greater than $1$.","Association of solute molecules increases the total number of particles in solution."],"ans":1,"cpt":"$\\ce{AB2} \\rightarrow \\ce{A^{2+}} + 2\\ce{B-}$: 3 particles, isliye $i=3$.","m":"Har option me particles gino.","s":["Dimerisation me $i=0.5$ hota hai, 2 nahi — galat.","$\\ce{AB2}$ se 3 ions bante hain, $i=3$ — sahi.","Non-electrolyte ka $i=1$ hota hai — galat.","Association se particles ghat te hain — galat."],"r":"$\\ce{AB2}$ type salt 3 ions deta hai, isliye $i=3$ hi sahi statement hai.","w":["Dimerisation me $i=0.5$.","Non-electrolyte ka $i$ exactly 1 hota hai.","Association particles kam karti hai."],"t":"$\\ce{CaCl2}$, $\\ce{MgCl2}$ type salts $\\ce{AB2}$ ke examples hain — $i=3$."},{"id":278,"c":"Raoult's law","q":"Which of the following statements is NOT correct?","opt":["Addition of a non-volatile solute to a solvent lowers the vapour pressure of the solvent at constant temperature.","Raoult's law for the solvent in a solution can be regarded as a special case of Henry's law in which the Henry's law constant equals the vapour pressure of the pure solvent.","For a solution of a non-volatile solute, the relative lowering of vapour pressure equals the mole fraction of the solute.","In a mixture of two volatile liquids, the total vapour pressure is the sum of the partial pressures of the two components, each calculated from the mole fraction of that component in the vapour phase."],"ans":3,"cpt":"Raoult's law me partial pressure liquid phase ke mole fraction se calculate hota hai, vapour phase ke mole fraction se nahi.","m":"Formula me kaun sa mole fraction aata hai — ye check karo.","s":["Relative lowering $= x_2$ — sahi.","Solute dalne par $p$ ghat ta hai — sahi.","Raoult's law, Henry's law ka special case ($K_H = p^{\\circ}$) hai — sahi.","Partial pressure liquid phase ke mole fraction se nikalta hai ($p_1 = p_1^{\\circ}x_1$), vapour phase ke $y_1$ se nahi — galat statement."],"r":"Raoult's law me liquid phase ka mole fraction ($x$) use hota hai; vapour phase ka $y$ nahi — isliye ye statement NOT correct hai.","w":["Ye sahi hai.","Ye sahi hai.","Ye standard interpretation hai."],"t":"$p_1 = p_1^{\\circ}x_1$ (liquid) aur $y_1 = p_1/p_{\\text{total}}$ (vapour) — dono alag hain."},{"id":279,"c":"Raoult's law","q":"Which of the following statements is correct?","opt":["For an ideal binary mixture of two volatile liquids, the total vapour pressure is independent of the composition of the liquid phase.","For an ideal binary mixture of two volatile liquids, the reciprocal of the total vapour pressure equals $\\dfrac{y_1}{p_1^{\\circ}}+\\dfrac{y_2}{p_2^{\\circ}}$, where $y_1$ and $y_2$ are the mole fractions in the vapour phase.","For an ideal binary mixture, the total vapour pressure is the geometric mean of the vapour pressures of the two pure components.","For a binary mixture showing positive deviation, the total vapour pressure is always intermediate between the vapour pressures of the two pure components."],"ans":1,"cpt":"Ideal binary mixture ke liye $y_1 = p_1^{\\circ}x_1/p$ aur $y_2 = p_2^{\\circ}x_2/p$. Inhe jodne par $\\dfrac{1}{p} = \\dfrac{y_1}{p_1^{\\circ}}+\\dfrac{y_2}{p_2^{\\circ}}$ milta hai.","m":"$y_1+y_2 = 1$ se derive karo.","s":["$x_1 = \\dfrac{y_1p}{p_1^{\\circ}}$, $x_2 = \\dfrac{y_2p}{p_2^{\\circ}}$.","$x_1+x_2 = 1 \\Rightarrow p\\left(\\dfrac{y_1}{p_1^{\\circ}}+\\dfrac{y_2}{p_2^{\\circ}}\\right) = 1$.","$\\dfrac{1}{p} = \\dfrac{y_1}{p_1^{\\circ}}+\\dfrac{y_2}{p_2^{\\circ}}$ — statement sahi."],"r":"Derivation se $\\dfrac{1}{p} = \\dfrac{y_1}{p_1^{\\circ}}+\\dfrac{y_2}{p_2^{\\circ}}$ milta hai, isliye option B sahi hai.","w":["Ideal mixture ka $p$ composition par linearly depend karta hai.","Geometric mean ka koi basis nahi.","Positive deviation me $p$ dono pure components se bhi zyada ho sakta hai."],"t":"Ye relation 'vapour phase composition diya ho to $p$ nikaalna' wale questions me kaam aata hai."},{"id":280,"c":"Vapour pressure","q":"Which of the following statements is NOT correct?","opt":["The lowering of vapour pressure in $\\mathrm{mm\\,Hg}$ caused by dissolving a fixed mass of a given non-volatile solute in a fixed mass of solvent is the same for every solvent.","The values of $K_f$ and $K_b$ are characteristic of the solvent and do not depend on the nature of the solute.","The osmotic pressure of a solution is directly proportional to its molar concentration at constant temperature.","The ebullioscopic constant of a solvent is numerically equal to the elevation in boiling point produced by a $1$ molal solution of a non-electrolyte which neither dissociates nor associates."],"ans":0,"cpt":"Absolute lowering $= p^{\\circ}x_2$ — isme $p^{\\circ}$ (solvent-specific) aata hai, isliye har solvent ke liye same nahi hoga.","m":"Formula likho: absolute lowering solvent ke vapour pressure par depend karti hai.","s":["Absolute lowering $= p^{\\circ}x_2$ — $p^{\\circ}$ solvent par depend karta hai, isliye ye har solvent me same nahi — galat statement.","$K_f$, $K_b$ solute-independent hain — sahi.","$\\pi \\propto C$ — sahi.","$K_b$ ki definition sahi hai."],"r":"Absolute lowering solvent ke vapour pressure par depend karti hai, isliye 'same for every solvent' wali statement NOT correct hai.","w":["Ye sahi hai.","$\\pi \\propto C$ sahi hai.","$K_b$ ki definition sahi hai."],"t":"Relative lowering solvent-independent hoti hai, absolute lowering nahi — yahi is question ka core hai."},{"id":281,"c":"Osmosis","q":"Which of the following statements is NOT correct?","opt":["In osmosis, solvent molecules move through a semipermeable membrane from the solution side to the pure solvent side.","The osmotic pressure of a solution can be determined by measuring the height of the solution column that stops the net flow of solvent.","For a dilute solution, the osmotic pressure is given by $\\pi V = nRT$.","Osmosis is a spontaneous process in which solvent molecules move through a semipermeable membrane."],"ans":0,"cpt":"Osmosis me solvent pure solvent side se solution side jata hai. Solution se pure solvent ki taraf jaana reverse osmosis hai.","m":"Direction yaad karo: solvent kam solute se zyada solute ki taraf jata hai.","s":["Osmosis spontaneous hai — sahi.","Solution column ki height se $\\pi$ measure hota hai — sahi.","Dilute solution me $\\pi V = nRT$ — sahi.","Osmosis me solvent solution se pure solvent ki taraf jata hai — galat statement."],"r":"Osmosis me movement pure solvent se solution ki taraf hoti hai, ulta nahi — isliye ye statement NOT correct hai.","w":["Height method sahi hai.","Dilute solution ka relation sahi hai.","Ye osmosis ki sahi definition hai."],"t":"Osmosis (natural) $\\rightarrow$ pure solvent se solution; RO (forced) $\\rightarrow$ solution se pure solvent."},{"id":282,"c":"Vapour pressure","q":"Which of the following statements is correct?","opt":["The relative lowering of vapour pressure of a solution of a non-volatile solute equals the mole fraction of the solvent.","The lowering of vapour pressure of a solution of a non-volatile solute is equal to the product of the vapour pressure of the pure solvent and the mole fraction of the solute.","Both the lowering of vapour pressure and the relative lowering of vapour pressure have the unit of pressure.","The relative lowering of vapour pressure has no unit only for ideal solutions."],"ans":1,"cpt":"$\\Delta p = p^{\\circ}x_2$: lowering solute ke mole fraction ke proportional hoti hai. Relative lowering dimensionless hoti hai.","m":"Dono expressions likho: $\\Delta p = p^{\\circ}x_2$ aur $\\Delta p/p^{\\circ} = x_2$.","s":["$\\Delta p = p^{\\circ}x_2$ — sahi statement.","Relative lowering solvent ke mole fraction ke barabar nahi hoti.","Relative lowering unitless hai, pressure ka unit nahi.","Unitless hona ideal solutions tak limited nahi hai."],"r":"$\\Delta p = p^{\\circ}x_2$ — absolute lowering pure solvent ke vapour pressure aur solute ke mole fraction ka product hai.","w":["Relative lowering solute ke mole fraction ke barabar hoti hai, solvent ke nahi.","Relative lowering dimensionless hai.","Har solution ke liye relative lowering dimensionless hoti hai."],"t":"Do forms yaad rakho: absolute lowering $= p^{\\circ}x_2$, relative lowering $= x_2$."},{"id":283,"c":"van't Hoff factor","q":"Match the Column I (electrolyte, complete dissociation assumed) with Column II (van't Hoff factor). Column I: (a) $\\ce{Na3PO4}$ (b) $\\ce{K2Cr2O7}$ (c) $\\ce{MgSO4}$ (d) $\\ce{Sc2(SO4)3}$. Column II: (i) $2$ (ii) $3$ (iii) $4$ (iv) $5$","opt":["a-iii, b-i, c-ii, d-iv","a-ii, b-iii, c-i, d-iv","a-iv, b-iii, c-i, d-ii","a-iii, b-ii, c-i, d-iv"],"ans":3,"cpt":"Ions gino: $\\ce{Na3PO4}$: 3+1 = 4; $\\ce{K2Cr2O7}$: 2+1 = 3; $\\ce{MgSO4}$: 1+1 = 2; $\\ce{Sc2(SO4)3}$: 2+3 = 5.","m":"Har formula unit ke ions gino.","s":["$\\ce{Na3PO4} \\rightarrow 3\\ce{Na+} + \\ce{PO4^{3-}}$: 4 $\\rightarrow$ (iii).","$\\ce{K2Cr2O7} \\rightarrow 2\\ce{K+} + \\ce{Cr2O7^{2-}}$: 3 $\\rightarrow$ (ii).","$\\ce{MgSO4}$: 2 $\\rightarrow$ (i).","$\\ce{Sc2(SO4)3}$: 5 $\\rightarrow$ (iv)."],"r":"Mapping a-iii, b-ii, c-i, d-iv sahi hai.","w":["$\\ce{Na3PO4}$ ka $i=5$ nahi.","$\\ce{K2Cr2O7}$ ka $i=4$ nahi.","$\\ce{Sc2(SO4)3}$ ka $i=2$ nahi."],"t":"$\\ce{K2Cr2O7}$ me dichromate ion ek hi particle hai — Cr ke atoms alag nahi hote."},{"id":284,"c":"van't Hoff factor","q":"Match the Column I (solute in benzene) with Column II (van't Hoff factor). Column I: (a) benzoic acid, completely dimerised (b) acetic acid, $50\\%$ dimerised (c) naphthalene (d) a solute completely associated into trimers. Column II: (i) $1$ (ii) $0.75$ (iii) $0.50$ (iv) $0.33$","opt":["a-iv, b-ii, c-i, d-iii","a-iii, b-i, c-ii, d-iv","a-ii, b-iii, c-i, d-iv","a-iii, b-ii, c-i, d-iv"],"ans":3,"cpt":"Dimer ke liye $i = 1-\\alpha/2$; trimer ke liye $i = 1-2\\alpha/3$. Naphthalene normal solute hai ($i=1$).","m":"Har case ka formula lagao.","s":["Complete dimerisation ($\\alpha=1$): $i = 0.5$ $\\rightarrow$ (iii).","50% dimerised: $i = 1-0.25 = 0.75$ $\\rightarrow$ (ii).","Naphthalene: $i = 1$ $\\rightarrow$ (i).","Complete trimerisation: $i = 1/3 = 0.33$ $\\rightarrow$ (iv)."],"r":"Mapping a-iii, b-ii, c-i, d-iv sahi hai.","w":["Complete dimer ka $i=0.75$ nahi.","Acetic acid 50% ka $i=0.5$ nahi.","Trimer ka $i=0.5$ nahi, $0.33$ hota hai."],"t":"Association ke liye $i = 1-\\alpha+\\alpha/n$; dimer me $n=2$, trimer me $n=3$."},{"id":285,"c":"Formulae","q":"Match the Column I (quantity) with Column II (correct expression; symbols have their usual meaning). Column I: (a) total vapour pressure of an ideal binary solution (b) mole fraction of component 1 in the vapour phase of an ideal solution (c) relative lowering of vapour pressure (d) molar mass of a solute from freezing point depression. Column II: (i) $p_1^{\\circ}x_1+p_2^{\\circ}x_2$ (ii) $\\dfrac{p_1^{\\circ}x_1}{p_{\\text{total}}}$ (iii) $\\dfrac{p_1^{\\circ}-p_1}{p_1^{\\circ}}$ (iv) $\\dfrac{1000\\,iK_fw_2}{\\Delta T_fw_1}$","opt":["a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv","a-iv, b-ii, c-iii, d-i","a-i, b-ii, c-iii, d-iv"],"ans":3,"cpt":"Chaar standard expressions: Raoult's law total pressure, vapour mole fraction, relative lowering, molar mass formula.","m":"Har expression ka structure pehchano.","s":["Total $p = p_1^{\\circ}x_1+p_2^{\\circ}x_2$ $\\rightarrow$ (i).","$y_1 = p_1^{\\circ}x_1/p_{\\text{total}}$ $\\rightarrow$ (ii).","Relative lowering $\\rightarrow$ (iii).","$M_2 = \\dfrac{1000 iK_fw_2}{\\Delta T_fw_1}$ $\\rightarrow$ (iv)."],"r":"Mapping a-i, b-ii, c-iii, d-iv sahi hai.","w":["$y_1$ total pressure ka expression nahi hai.","Relative lowering $y_1$ ka formula nahi hai.","$M_2$ total vapour pressure nahi hai."],"t":"Molar mass formula me $w_1$ gram me hota hai, isliye 1000 ka factor aata hai."},{"id":286,"c":"Non-ideal solutions","q":"Match the Column I (nature of interaction on mixing) with Column II (behaviour of the solution). Column I: (a) A-B interactions similar in strength to A-A and B-B (b) A-B interactions stronger than A-A and B-B (c) A-B interactions weaker than A-A and B-B (d) hydrogen bonds of the pure component broken on adding a non-polar liquid. Column II: (i) positive deviation with positive $\\Delta H_{\\text{mix}}$ (ii) ideal behaviour with $\\Delta H_{\\text{mix}} = 0$ (iii) negative deviation with negative $\\Delta H_{\\text{mix}}$ (iv) positive deviation because the escaping tendency of the associated liquid increases","opt":["a-ii, b-iii, c-i, d-iv","a-ii, b-i, c-iii, d-iv","a-iii, b-ii, c-i, d-iv","a-ii, b-iii, c-iv, d-i"],"ans":0,"cpt":"Similar interactions $\\rightarrow$ ideal; stronger $\\rightarrow$ negative deviation; weaker (ya H-bonds tootna) $\\rightarrow$ positive deviation.","m":"Interaction strength ko deviation type se jodo.","s":["Similar interactions $\\rightarrow$ (ii) ideal.","Stronger $\\rightarrow$ (iii) negative deviation.","Weaker $\\rightarrow$ (i) positive deviation.","H-bond breaking $\\rightarrow$ (iv) escaping tendency badhna."],"r":"Mapping a-ii, b-iii, c-i, d-iv sahi hai.","w":["Stronger interactions ideal nahi dete.","Weaker interactions negative deviation nahi dete.","H-bond breaking ka result negative deviation nahi hai."],"t":"H-bond tootna = positive deviation (jaise ethanol + hexane)."},{"id":287,"c":"Colligative properties","q":"Match the Column I ($0.10\\,\\mathrm{m}$ aqueous solution; complete dissociation assumed) with Column II (value of the change in transition temperature, $K_f = 1.86$ and $K_b = 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$). Column I: (a) depression in freezing point of $\\ce{NaCl}$ (b) depression in freezing point of glucose (c) elevation in boiling point of glucose (d) depression in freezing point of $\\ce{Al2(SO4)3}$. Column II: (i) $0.052$ (ii) $0.186$ (iii) $0.372$ (iv) $0.930$","opt":["a-ii, b-iii, c-i, d-iv","a-iii, b-i, c-ii, d-iv","a-iv, b-ii, c-i, d-iii","a-iii, b-ii, c-i, d-iv"],"ans":3,"cpt":"$\\Delta T_f = iK_fm$ aur $\\Delta T_b = iK_bm$: $\\ce{NaCl}$ ($i=2$): $2\\times1.86\\times0.1 = 0.372$; glucose: $0.186$; glucose $\\Delta T_b$: $0.052$; $\\ce{Al2(SO4)3}$ ($i=5$): $0.930$.","m":"Har case calculate karo.","s":["$\\ce{NaCl}$: $0.372\\,\\mathrm{K}$ $\\rightarrow$ (iii).","Glucose: $0.186\\,\\mathrm{K}$ $\\rightarrow$ (ii).","Glucose $\\Delta T_b$: $0.052\\,\\mathrm{K}$ $\\rightarrow$ (i).","$\\ce{Al2(SO4)3}$: $0.930\\,\\mathrm{K}$ $\\rightarrow$ (iv)."],"r":"Mapping a-iii, b-ii, c-i, d-iv sahi hai.","w":["$\\ce{NaCl}$ ka depression $0.186\\,\\mathrm{K}$ nahi, $0.372\\,\\mathrm{K}$ hai.","$\\ce{Al2(SO4)3}$ ka depression $0.372\\,\\mathrm{K}$ nahi, $i=5$ ki wajah se $0.930\\,\\mathrm{K}$ hai.","Glucose ka boiling point elevation $0.186\\,\\mathrm{K}$ nahi, $K_b$ se $0.052\\,\\mathrm{K}$ hota hai."],"t":"$K_f$ aur $K_b$ ki values yaad rakho — isse table/match questions seconds me solve hote hain."},{"id":288,"c":"Henry's law","q":"Match the Column I (data for a gas in water at $298\\,\\mathrm{K}$) with Column II (mole fraction of the gas in solution). Column I: (a) $K_H = 1.0\\times10^{3}\\,\\mathrm{bar}$, $p = 1.0\\,\\mathrm{bar}$ (b) $K_H = 4.0\\times10^{3}\\,\\mathrm{bar}$, $p = 0.80\\,\\mathrm{bar}$ (c) $K_H = 2.5\\times10^{4}\\,\\mathrm{bar}$, $p = 0.50\\,\\mathrm{bar}$ (d) $K_H = 6.0\\times10^{3}\\,\\mathrm{bar}$, $p = 0.30\\,\\mathrm{bar}$. Column II: (i) $2.0\\times10^{-5}$ (ii) $5.0\\times10^{-5}$ (iii) $1.0\\times10^{-3}$ (iv) $2.0\\times10^{-4}$","opt":["a-iii, b-i, c-iv, d-ii","a-iv, b-iii, c-i, d-ii","a-ii, b-iv, c-i, d-iii","a-iii, b-iv, c-i, d-ii"],"ans":3,"cpt":"$x = p/K_H$ — har case me division karo.","m":"Chaar chhoti divisions — systematically karo.","s":["(a) $1.0/10^{3} = 1.0\\times10^{-3}$ $\\rightarrow$ (iii).","(b) $0.80/4000 = 2.0\\times10^{-4}$ $\\rightarrow$ (iv).","(c) $0.50/2.5\\times10^{4} = 2.0\\times10^{-5}$ $\\rightarrow$ (i).","(d) $0.30/6000 = 5.0\\times10^{-5}$ $\\rightarrow$ (ii)."],"r":"Mapping a-iii, b-iv, c-i, d-ii sahi hai.","w":["(a) ka $x = 2\\times10^{-4}$ nahi.","(b) ka $x = 2\\times10^{-5}$ nahi.","(d) ka $x = 10^{-3}$ nahi."],"t":"$K_H$ badi $\\Rightarrow$ $x$ chhoti. Isse elimination se bhi answer mil jata hai."},{"id":289,"c":"Osmotic pressure","q":"Assertion (A): At the same temperature, $0.10\\,\\mathrm{M}$ aqueous glucose and $0.10\\,\\mathrm{M}$ aqueous urea solutions are isotonic. Reason (R): Osmotic pressure depends on the total number of solute particles present, and each of these solutes gives one particle per dissolved molecule.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Dono non-electrolytes hain ($i=1$) aur molarity same hai, isliye $\\pi = CRT$ barabar hai.","m":"$iC$ compare karo.","s":["Dono ek particle per molecule dete hain ($i=1$) — R sahi.","Barabar concentration se barabar $\\pi$ — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; ek particle per molecule hone se particle concentrations barabar hain.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Isotonic hone ke liye $iC$ same hona chahiye — $C$ akela kaafi nahi."},{"id":290,"c":"Vapour pressure","q":"Assertion (A): The vapour pressure of $0.10\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ is lower than that of $0.10\\,\\mathrm{m}$ aqueous urea at the same temperature. Reason (R): $\\ce{NaCl}$ dissociates into two ions, so the effective concentration of particles in the $\\ce{NaCl}$ solution is greater.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Vapour pressure lowering particle ki effective concentration par depend karti hai. $\\ce{NaCl}$ ka $i=2$, urea ka $i=1$, isliye $\\ce{NaCl}$ ka vapour pressure zyada girega.","m":"$i$ compare karo aur A se jodo.","s":["$\\ce{NaCl}$ se 2 ions bante hain — R sahi.","Zyada particles $\\Rightarrow$ zyada lowering $\\Rightarrow$ kam vapour pressure — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; zyada effective particles ki wajah se $\\ce{NaCl}$ ka vapour pressure kam hota hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Relative lowering $= i\\,x_2$ type relation se electrolyte ka effect zyada hota hai."},{"id":291,"c":"Non-ideal solutions","q":"Assertion (A): For a liquid mixture showing positive deviation from Raoult's law, the enthalpy of mixing is negative. Reason (R): Positive deviation occurs when the A-B interactions in the mixture are weaker than the A-A and B-B interactions in the pure components.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":3,"cpt":"Positive deviation me A-B interactions kamzor hoti hain, isliye heat absorb hoti hai — $\\Delta H_{\\text{mix}}$ positive hota hai, negative nahi.","m":"A ka sign check karo (galat hai), R sahi hai.","s":["Weak A-B interactions $\\Rightarrow$ positive deviation — R sahi.","Iska matlab $\\Delta H_{\\text{mix}} > 0$, isliye A galat hai.","Isliye A false, R true."],"r":"A galat hai (enthalpy positive hoti hai), R sahi hai.","w":["A sach nahi hai.","R galat nahi.","A sach nahi hai."],"t":"Positive deviation $\\rightarrow$ positive $\\Delta H$; negative deviation $\\rightarrow$ negative $\\Delta H$."},{"id":292,"c":"Solubility of gases","q":"Assertion (A): The solubility of oxygen in water decreases when the water is warmed at constant partial pressure of oxygen. Reason (R): Oxygen is a non-polar gas and water is a polar solvent, which is why oxygen dissolves only to a small extent in water.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":1,"cpt":"Warming par solubility ghat ti hai kyunki dissolution exothermic hai. R me polarity ka reason diya hai, jo solubility kam hone ka kaaran hai par temperature effect ka nahi.","m":"Dono sach hain, par R temperature effect ko explain nahi karta.","s":["Oxygen ki solubility warming par ghat ti hai — A sahi.","$\\ce{O2}$ non-polar aur water polar hai, isliye solubility kam — R sahi.","Par R temperature effect ka explanation nahi — isliye option B."],"r":"Dono statements sach hain, par R, A ke temperature effect ka kaaran nahi batata.","w":["R, A ka explanation nahi hai.","R galat nahi.","A sach hai."],"t":"Assertion-Reason me 'sahi statement but different reason' wale cases me option B chuno."},{"id":293,"c":"Colligative properties","q":"Assertion (A): The freezing point depression and the boiling point elevation of a solution both arise from the lowering of the vapour pressure of the solvent in the solution. Reason (R): Both these properties are proportional to the molality of the solution only when the solute is a non-electrolyte.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":2,"cpt":"Dono properties vapour pressure lowering se aati hain — A sahi. Par electrolyte ke liye bhi proportionality rehti hai, bas $i$ multiply hota hai — isliye R galat.","m":"R me 'only when non-electrolyte' ki condition check karo.","s":["Vapour pressure lowering dono ka common source hai — A sahi.","Electrolyte ke liye $\\Delta T_f = iK_fm$ — proportionality phir bhi hai, isliye R galat.","Isliye A true, R false."],"r":"A sahi hai; R galat hai kyunki electrolytes ke liye bhi molality ke saath proportionality rehti hai ($i$ ke saath).","w":["R galat hai.","A sach hai.","R galat hai, A sach hai."],"t":"$\\Delta T_f = iK_fm$ — proportionality molality ke saath hamesha rehti hai, bas proportionality constant $iK_f$ ban jata hai."},{"id":294,"c":"Non-ideal solutions","q":"Assertion (A): A mixture of phenol and aniline shows negative deviation from Raoult's law and forms a maximum boiling azeotrope. Reason (R): At a maximum boiling azeotrope the composition of the vapour becomes identical with that of the liquid, and therefore such a mixture cannot be separated by distillation.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":1,"cpt":"Phenol-aniline me H-bonding se negative deviation hoti hai aur maximum boiling azeotrope banta hai — A sahi. R me azeotrope ki property sahi batayi gayi hai, par wahi deviation ka kaaran nahi hai.","m":"Dono sach hain, par R, A ka explanation nahi — ye azeotrope ki property hai.","s":["Phenol-aniline negative deviation dikhata hai — A sahi.","Max boiling azeotrope par $y=x$ aur separation possible nahi — R sahi.","Par R deviation ka kaaran nahi — isliye option B."],"r":"Dono statements sach hain, par R, A ke deviation ka explanation nahi hai.","w":["R, A ka explanation nahi hai.","R galat nahi.","A sach hai."],"t":"Explanation check karne ka test: 'kyunki R, isliye A' — agar ye jodi banti hai to option A, warna B."},{"id":295,"c":"Azeotropes","q":"The boiling points of liquid mixtures of ethanol and water were measured at $1\\,\\mathrm{atm}$ and are given in the table ($x$ = mole fraction of ethanol in the liquid phase). From this table it follows that","opt":["the mixture is ideal because the boiling point changes smoothly with composition","the mixture shows a maximum boiling azeotrope at $x \\approx 0.85$ to $0.90$ and negative deviation from Raoult's law","the azeotrope is formed at $x = 0.20$, where the boiling point first drops steeply","the mixture shows a minimum boiling azeotrope at $x \\approx 0.85$ to $0.90$ and positive deviation from Raoult's law"],"ans":3,"fig":{"type":"table","head":["$x$ (ethanol)","Boiling point (K)"],"rows":[["0.00","373.2"],["0.20","361.0"],["0.50","354.0"],["0.70","352.0"],["0.85","351.15"],["0.90","351.15"],["0.95","351.30"],["1.00","351.50"]],"cap":"Boiling points of ethanol-water mixtures at 1 atm."},"cpt":"Azeotrope wo composition hai jahan boiling point minimum ya maximum hota hai aur composition change nahi hoti. Ethanol-water me minimum hota hai, jo positive deviation ka result hai.","m":"Table me sabse kam boiling point dhundo.","s":["Boiling point $x=0.85$ aur $0.90$ par $351.15\\,\\mathrm{K}$ — sabse kam.","Ye minimum $x \\approx 0.85$-$0.90$ par hai, isliye minimum boiling azeotrope.","Minimum boiling azeotrope positive deviation se banta hai."],"r":"Boiling point minimum $x \\approx 0.85$-$0.90$ par hai, isliye mixture minimum boiling azeotrope banata hai (positive deviation).","w":["Smooth change ideal behaviour prove nahi karta.","Maximum boiling azeotrope me boiling point maximum hota hai.","$x=0.20$ par sirf tezi se girta hai, minimum nahi hai."],"t":"EtOH-water azeotrope $\\approx 95\\%$ ethanol by mass hai, jo mole fraction $\\approx 0.9$ ke qareeb hota hai."},{"id":296,"c":"Osmotic pressure","q":"The osmotic pressures of solutions of a polymer in water at $300\\,\\mathrm{K}$ are given ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$): $5.0\\,\\mathrm{g\\,L^{-1}} \\rightarrow 1.23\\times10^{-3}\\,\\mathrm{atm}$; $10.0\\,\\mathrm{g\\,L^{-1}} \\rightarrow 2.46\\times10^{-3}\\,\\mathrm{atm}$; $20.0\\,\\mathrm{g\\,L^{-1}} \\rightarrow 4.92\\times10^{-3}\\,\\mathrm{atm}$. The molar mass of the polymer is nearly","opt":["$1.0\\times10^{4}\\,\\mathrm{g\\,mol^{-1}}$","$1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$","$2.5\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$","$1.0\\times10^{6}\\,\\mathrm{g\\,mol^{-1}}$"],"ans":1,"fig":{"type":"table","head":["Concentration ($\\mathrm{g\\,L^{-1}}$)","$\\pi$ (atm)"],"rows":[["5.0","$1.23\\times10^{-3}$"],["10.0","$2.46\\times10^{-3}$"],["20.0","$4.92\\times10^{-3}$"]],"cap":"Osmotic pressure of polymer solutions at 300 K."},"cpt":"$M = \\dfrac{C_{\\mathrm{g\\,L^{-1}}}RT}{\\pi}$ — ek hi row se nikal sakte hain, baaki verify karte hain.","m":"Pehli row se molarity $\\rightarrow$ molar mass.","s":["$RT = 24.63$.","$C = \\dfrac{1.23\\times10^{-3}}{24.63} = 4.99\\times10^{-5}\\,\\mathrm{mol\\,L^{-1}}$.","$M = \\dfrac{5.0}{4.99\\times10^{-5}} \\approx 1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M \\approx 1.0\\times10^{5}\\,\\mathrm{g\\,mol^{-1}}$.","w":["$10^{4}$ exponent galat hai.","$2.5\\times10^{5}$ zyada hai.","$10^{6}$ das guna zyada hai."],"t":"Polymer ke liye $\\pi$ typically $10^{-3}$-$10^{-4}$ atm hota hai — isse molar mass ka order check karo."},{"id":297,"c":"Abnormal molar mass","q":"The apparent molar mass of acetic acid in benzene was measured by freezing point depression and is given (true molar mass of acetic acid $= 60\\,\\mathrm{g\\,mol^{-1}}$): at $0.02\\,\\mathrm{m}$, $72\\,\\mathrm{g\\,mol^{-1}}$; at $0.05\\,\\mathrm{m}$, $90\\,\\mathrm{g\\,mol^{-1}}$; at $0.10\\,\\mathrm{m}$, $105\\,\\mathrm{g\\,mol^{-1}}$; at $0.20\\,\\mathrm{m}$, $115\\,\\mathrm{g\\,mol^{-1}}$. From this data, the fraction of acetic acid which exists as dimer in the $0.10$ molal solution is nearly","opt":["$0.57$","$0.86$","$0.43$","$0.14$"],"ans":1,"fig":{"type":"table","head":["Molality ($\\mathrm{mol\\,kg^{-1}}$)","Apparent molar mass ($\\mathrm{g\\,mol^{-1}}$)"],"rows":[["0.02","72"],["0.05","90"],["0.10","105"],["0.20","115"]],"cap":"Apparent molar mass of acetic acid in benzene (true value 60)."},"cpt":"$i = \\dfrac{\\text{true molar mass}}{\\text{apparent molar mass}}$, aur dimer ke liye $i = 1-\\dfrac{\\alpha}{2}$.","m":"Pehle $i$, phir $\\alpha$.","s":["$0.10\\,\\mathrm{m}$ par apparent molar mass $= 105$.","$i = \\dfrac{60}{105} = 0.5714$.","$1-\\dfrac{\\alpha}{2} = 0.5714 \\Rightarrow \\dfrac{\\alpha}{2} = 0.4286 \\Rightarrow \\alpha = 0.857$.","Yani lagbhag $86\\%$ (0.86) acid dimer ke roop me hai."],"r":"$\\alpha \\approx 0.86$, isliye acid ka lagbhag $86\\%$ dimer hai.","w":["$0.57$ $i$ ka value hai, $\\alpha$ nahi.","$0.43$ aadha $\\alpha$ hai (formula ki galti).","$0.14$ $1-\\alpha$ hai, dimerised fraction nahi."],"t":"Trap yahi hai: $i$ aur $\\alpha$ alag hain. Dimer ke liye $\\alpha = 2(1-i)$."},{"id":298,"c":"Vapour pressure","q":"When $8.0\\,\\mathrm{g}$ of a non-volatile non-electrolyte solute was dissolved in $92\\,\\mathrm{g}$ of benzene, the vapour pressure at $300\\,\\mathrm{K}$ fell from $80.0\\,\\mathrm{mm\\,Hg}$ to $71.9\\,\\mathrm{mm\\,Hg}$. Taking the molar mass of benzene as $78\\,\\mathrm{g\\,mol^{-1}}$, the molar mass of the solute is nearly","opt":["$90\\,\\mathrm{g\\,mol^{-1}}$","$60\\,\\mathrm{g\\,mol^{-1}}$","$120\\,\\mathrm{g\\,mol^{-1}}$","$30\\,\\mathrm{g\\,mol^{-1}}$"],"ans":1,"cpt":"$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2 = \\dfrac{n_2}{n_1+n_2}$; yahan
