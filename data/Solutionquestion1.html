 $n_1 = 92/78 = 1.179\\,\\mathrm{mol}$.","m":"Relative lowering nikaalo, $n_2$ solve karo, phir molar mass.","s":["$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = \\dfrac{8.1}{80.0} = 0.10125$.","$0.10125 = \\dfrac{n_2}{n_2+1.179} \\Rightarrow n_2 = 0.1328\\,\\mathrm{mol}$.","$M = \\dfrac{8.0}{0.1328} \\approx 60\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M \\approx 60\\,\\mathrm{g\\,mol^{-1}}$ (urea jaisa solute).","w":["$90$ denominator ki galti se aata hai.","$120$ double hai.","$30$ aadha hai."],"t":"$\\Delta p/p^{\\circ}$ me denominator $p^{\\circ}$ (pure solvent) hota hai — $p$ (solution) nahi."},{"id":299,"c":"van't Hoff factor","q":"The freezing points of four $0.10$ molal aqueous solutions are given ($K_f$ of water $= 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$): urea $\\rightarrow -0.186\\,^{\\circ}\\mathrm{C}$; $\\ce{KCl} \\rightarrow -0.372\\,^{\\circ}\\mathrm{C}$; $\\ce{CaCl2} \\rightarrow -0.520\\,^{\\circ}\\mathrm{C}$; $\\ce{K4[Fe(CN)6]} \\rightarrow -0.900\\,^{\\circ}\\mathrm{C}$. The van't Hoff factor of $\\ce{CaCl2}$ in these solutions is","opt":["$1.40$","$2.00$","$2.80$","$3.00$"],"ans":2,"fig":{"type":"table","head":["Solute","Freezing point ($^{\\circ}\\mathrm{C}$)","$i$"],"rows":[["urea","$-0.186$","1.00"],["$\\ce{KCl}$","$-0.372$","2.00"],["$\\ce{CaCl2}$","$-0.520$","2.80"],["$\\ce{K4[Fe(CN)6]}$","$-0.900$","4.84"]],"cap":"Freezing point data for 0.10 m solutions."},"cpt":"$i = \\dfrac{\\Delta T_f}{K_fm}$: $0.10$ molal ke liye denominator $1.86\\times0.1 = 0.186$.","m":"Sirf $\\ce{CaCl2}$ ki row use karo.","s":["Table se sirf $\\ce{CaCl2}$ wali row lo: $\\Delta T_f = 0.520\\,\\mathrm{K}$ at $0.10\\,\\mathrm{mol\\,kg^{-1}}$.","$\\Delta T_f = 0.520$.","$i = \\dfrac{0.520}{0.186} = 2.796 \\approx 2.80$.","Sahi option C: $i = 2.80$."],"r":"$i \\approx 2.80$ — expected 3 se kam, kyunki concentrated solution me ion pairing hoti hai.","w":["$1.40$ aadha hai.","$2.00$ $\\ce{KCl}$ ka value hai.","$3.00$ ideal value hai, par data 2.80 deta hai."],"t":"Data-based questions me calculated value hi answer hai — ideal value (3) se compare karke mat badalna."},{"id":300,"c":"Solubility of gases","q":"The solubility of carbon dioxide in water was measured at two temperatures and at two partial pressures: at $273\\,\\mathrm{K}$, $p = 1.0\\,\\mathrm{bar} \\rightarrow 0.076\\,\\mathrm{mol\\,L^{-1}}$ and $p = 2.0\\,\\mathrm{bar} \\rightarrow 0.152\\,\\mathrm{mol\\,L^{-1}}$; at $298\\,\\mathrm{K}$, $p = 1.0\\,\\mathrm{bar} \\rightarrow 0.034\\,\\mathrm{mol\\,L^{-1}}$ and $p = 2.0\\,\\mathrm{bar} \\rightarrow 0.068\\,\\mathrm{mol\\,L^{-1}}$. From this table it is correct to conclude that","opt":["the solubility is inversely proportional to pressure at each temperature, and it increases with rise in temperature","the solubility is proportional to pressure at each temperature, and at the same pressure it is about $2.2$ times greater at $273\\,\\mathrm{K}$ than at $298\\,\\mathrm{K}$","the solubility is proportional to pressure at each temperature, and at the same pressure it is about $2.2$ times greater at $298\\,\\mathrm{K}$ than at $273\\,\\mathrm{K}$","the solubility is independent of pressure but decreases with rise in temperature"],"ans":1,"fig":{"type":"table","head":["$p$ (bar)","Solubility at 273 K ($\\mathrm{mol\\,L^{-1}}$)","Solubility at 298 K ($\\mathrm{mol\\,L^{-1}}$)"],"rows":[["1.0","0.076","0.034"],["2.0","0.152","0.068"]],"cap":"Solubility of carbon dioxide in water."},"cpt":"Henry's law: solubility pressure ke proportional. Temperature badhne par solubility ghat ti hai, isliye 273 K par zyada.","m":"Ratio check karo dono temperatures par, phir same pressure par values compare karo.","s":["273 K: $0.076/1 = 0.076$ aur $0.152/2 = 0.076$ — proportional.","298 K: $0.034/1 = 0.068/2 = 0.034$ — proportional.","Same pressure par: $0.076/0.034 \\approx 2.24$, yani 273 K par lagbhag $2.2$ guna zyada."],"r":"Solubility pressure ke proportional hai aur low temperature par $2.2$ guna zyada hai — option B sahi.","w":["Solubility pressure ke inversely proportional nahi hai.","298 K par zyada nahi, kam hai.","Solubility pressure par strongly depend karti hai."],"t":"Soft drinks cold serve hote hain kyunki low temperature par $\\ce{CO2}$ zyada soluble hoti hai."},{"id":301,"c":"Vapour pressure","q":"The relative lowering of vapour pressure of a solution containing $4.0\\,\\mathrm{g}$ of a non-volatile non-electrolyte in $96.0\\,\\mathrm{g}$ of benzene is $0.020$. The molar mass of the solute is nearly (molar mass of benzene $= 78\\,\\mathrm{g\\,mol^{-1}}$)","opt":["$80\\,\\mathrm{g\\,mol^{-1}}$","$240\\,\\mathrm{g\\,mol^{-1}}$","$120\\,\\mathrm{g\\,mol^{-1}}$","$160\\,\\mathrm{g\\,mol^{-1}}$"],"ans":3,"cpt":"$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2 = \\dfrac{n_2}{n_1+n_2}$; yahan $n_1 = 96/78 = 1.231\\,\\mathrm{mol}$.","m":"$x_2$ diya hai, $n_2$ solve karo, phir molar mass.","s":["$0.020 = \\dfrac{n_2}{n_2+1.231} \\Rightarrow n_2 = 0.020(n_2+1.231)$.","$n_2(0.98) = 0.02462 \\Rightarrow n_2 = 0.02512\\,\\mathrm{mol}$.","$M = \\dfrac{4.0}{0.02512} \\approx 159 \\approx 160\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M \\approx 160\\,\\mathrm{g\\,mol^{-1}}$.","w":["$80$ aadha hai.","$240$ double hai.","$120$ denominator ki galti se aata hai."],"t":"Dilute solution me $x_2 \\approx \\dfrac{n_2}{n_1}$ approximation se bhi same answer ke qareeb pahunchte ho."},{"id":302,"c":"Raoult's law","q":"Two liquids A and B form an ideal solution. At $300\\,\\mathrm{K}$, $p_A^{\\circ} = 90\\,\\mathrm{mm\\,Hg}$ and $p_B^{\\circ} = 30\\,\\mathrm{mm\\,Hg}$. A liquid mixture of A and B has a total vapour pressure of $60\\,\\mathrm{mm\\,Hg}$. The mole fraction of A in the vapour phase in equilibrium with this liquid is","opt":["$0.25$","$0.50$","$0.60$","$0.75$"],"ans":3,"cpt":"Pehle total pressure se $x_A$ nikaalo: $p = p_A^{\\circ}x_A + p_B^{\\circ}(1-x_A)$. Phir $y_A = p_A/p$.","m":"Total pressure se composition, phir vapour composition.","s":["$60 = 90x + 30(1-x) \\Rightarrow 60 = 30+60x \\Rightarrow x_A = 0.5$.","$p_A = 90\\times0.5 = 45\\,\\mathrm{mm\\,Hg}$.","$y_A = 45/60 = 0.75$."],"r":"$y_A = 0.75$ — vapour A se rich hai kyunki $p_A^{\\circ}$ zyada hai.","w":["$0.25$ $y_B$ hai.","$0.50$ liquid ka mole fraction hai.","$0.60$ galat calculation se aata hai."],"t":"Total pressure diya ho to pehle composition solve karo — uske baad hi vapour composition nikal sakte ho."},{"id":303,"c":"Degree of dissociation","q":"A $0.10\\,\\mathrm{m}$ aqueous solution of a weak monobasic acid HA has a van't Hoff factor of $1.20$. The acid dissociation constant of HA, assuming that its concentration in $\\mathrm{mol\\,L^{-1}}$ is nearly equal to its molality, is","opt":["$2.0\\times10^{-2}$","$5.0\\times10^{-3}$","$1.2\\times10^{-2}$","$2.5\\times10^{-3}$"],"ans":1,"cpt":"Pehle $\\alpha = i-1$ nikaalo, phir $K_a = \\dfrac{C\\alpha^2}{1-\\alpha}$ lagao.","m":"Do steps: $i \\rightarrow \\alpha$, phir $K_a$.","s":["$i = 1+\\alpha \\Rightarrow \\alpha = 0.20$.","$K_a = \\dfrac{0.10\\times(0.20)^2}{1-0.20} = \\dfrac{0.10\\times0.04}{0.80}$.","$K_a = \\dfrac{0.004}{0.80} = 5.0\\times10^{-3}$."],"r":"$K_a = 5.0\\times10^{-3}$.","w":["$2.0\\times10^{-2}$ me denominator bhool gaye.","$1.2\\times10^{-2}$ galat $\\alpha$ se aata hai.","$2.5\\times10^{-3}$ aadha hai."],"t":"$K_a$ ke formula me $(1-\\alpha)$ denominator bhoolna sabse common galti hai — jab $\\alpha$ chhota ho tab hi $K_a \\approx C\\alpha^2$ ka approximation lagao."},{"id":304,"c":"Elevation of boiling point","q":"An aqueous solution containing $6.0\\,\\mathrm{g}$ of a non-volatile non-electrolyte in $500\\,\\mathrm{g}$ of water boils at $100.0624\\,^{\\circ}\\mathrm{C}$ at $1\\,\\mathrm{atm}$. Taking $K_b$ of water as $0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the molar mass of the solute is","opt":["$60\\,\\mathrm{g\\,mol^{-1}}$","$100\\,\\mathrm{g\\,mol^{-1}}$","$120\\,\\mathrm{g\\,mol^{-1}}$","$150\\,\\mathrm{g\\,mol^{-1}}$"],"ans":1,"cpt":"$\\Delta T_b = 100.0624-100 = 0.0624\\,\\mathrm{K}$; $m = \\dfrac{\\Delta T_b}{K_b}$.","m":"Molality, phir moles, phir molar mass.","s":["$m = \\dfrac{0.0624}{0.52} = 0.12\\,\\mathrm{mol\\,kg^{-1}}$.","$0.5\\,\\mathrm{kg}$ water me moles $= 0.06$.","$M = \\dfrac{6.0}{0.06} = 100\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M = 100\\,\\mathrm{g\\,mol^{-1}}$.","w":["$60$ galat molality se aata hai.","$120$ solvenT ki mass $1\\,\\mathrm{kg}$ lene se aata hai.","$150$ zyada hai."],"t":"Solvent ki mass $500\\,\\mathrm{g} = 0.5\\,\\mathrm{kg}$ — is step me decimal galti se answer double/half ho jata hai."},{"id":305,"c":"Degree of dissociation","q":"A $0.10\\,\\mathrm{m}$ aqueous solution of $\\ce{Na2SO4}$ has a degree of dissociation of $0.80$. Taking $K_f$ of water as $1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the freezing point of this solution is","opt":["$-0.186\\,^{\\circ}\\mathrm{C}$","$-0.372\\,^{\\circ}\\mathrm{C}$","$-0.484\\,^{\\circ}\\mathrm{C}$","$-0.558\\,^{\\circ}\\mathrm{C}$"],"ans":2,"cpt":"$\\ce{Na2SO4}$ se 3 ions bante hain ($n=3$), isliye $i = 1+(n-1)\\alpha = 1+2\\alpha$.","m":"Pehle $i$, phir $\\Delta T_f = iK_fm$.","s":["$i = 1+2(0.80) = 2.6$.","$\\Delta T_f = 2.6\\times1.86\\times0.1 = 0.4836\\,\\mathrm{K}$.","Freezing point $= -0.484\\,^{\\circ}\\mathrm{C}$."],"r":"$i = 2.6$ se $\\Delta T_f = 0.484\\,\\mathrm{K}$, isliye freezing point $-0.484\\,^{\\circ}\\mathrm{C}$.","w":["$-0.186$ non-electrolyte ki value hai.","$-0.372$ $i=2$ ke liye hoti hai.","$-0.558$ complete dissociation ($i=3$) ke liye hoti hai."],"t":"Partial dissociation ki wajah se $i$ complete value (3) se kam milta hai — answer do options ke beech me hota hai."},{"id":306,"c":"Osmotic pressure","q":"A $0.050\\,\\mathrm{M}$ aqueous solution of acetic acid has a degree of dissociation of $0.020$. Taking $R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$, the osmotic pressure of this solution at $300\\,\\mathrm{K}$ is nearly","opt":["$1.23\\,\\mathrm{atm}$","$1.26\\,\\mathrm{atm}$","$2.46\\,\\mathrm{atm}$","$1.20\\,\\mathrm{atm}$"],"ans":1,"cpt":"$i = 1+\\alpha = 1.02$, phir $\\pi = iCRT$.","m":"Pehle $i$, phir $CRT$.","s":["$i = 1+0.02 = 1.02$.","$\\pi = 1.02\\times0.050\\times0.0821\\times300$.","$0.050\\times24.63 = 1.2315$; $\\pi = 1.2315\\times1.02 = 1.256\\,\\mathrm{atm}$."],"r":"$\\pi \\approx 1.26\\,\\mathrm{atm}$ — bina $i$ ke value $1.23$ hoti.","w":["$1.23$ dissociation ignore karne se aata hai.","$2.46$ double hai.","$1.20$ kam hai."],"t":"Weak electrolyte ke liye $i$ ka effect chhota hota hai, par difference option me rakha jata hai — $i$ lagana mat bhoolna."},{"id":307,"c":"Osmotic pressure","q":"A $0.10\\,\\mathrm{M}$ aqueous glucose solution at $300\\,\\mathrm{K}$ is isotonic with a $0.12\\,\\mathrm{M}$ aqueous solution of a non-electrolyte at temperature $T$. The value of $T$ is","opt":["$250\\,\\mathrm{K}$","$275\\,\\mathrm{K}$","$330\\,\\mathrm{K}$","$360\\,\\mathrm{K}$"],"ans":0,"cpt":"Isotonic: $C_1T_1 = C_2T_2$ (dono non-electrolytes, $i=1$).","m":"$CRT$ barabar rakho aur $T$ nikaalo.","s":["Given: $C_1 = 0.10\\,\\mathrm{M}$ at $300\\,\\mathrm{K}$ aur $C_2 = 0.12\\,\\mathrm{M}$ at temperature $T$.","$0.10\\times300 = 0.12\\times T$.","$T = \\dfrac{30}{0.12} = 250\\,\\mathrm{K}$.","Sahi option A: $T = 250\\,\\mathrm{K}$."],"r":"$T = 250\\,\\mathrm{K}$.","w":["$275$ galat division hai.","$330$ $0.11$ M se aata hai.","$360$ ulta relation hai."],"t":"Same osmotic pressure par concentration badhne se temperature ghat ti hai — inverse relation yaad rakho."},{"id":308,"c":"Raoult's law","q":"Liquids A and B form an ideal solution with $p_A^{\\circ} = 600\\,\\mathrm{mm\\,Hg}$ and $p_B^{\\circ} = 400\\,\\mathrm{mm\\,Hg}$ at a given temperature. The mole fraction of A in the liquid phase for which the mole fraction of A in the vapour phase becomes $0.60$ is","opt":["$0.40$","$0.50$","$0.60$","$0.67$"],"ans":1,"cpt":"$y_A = \\dfrac{p_A^{\\circ}x}{p_A^{\\circ}x+p_B^{\\circ}(1-x)}$. $y_A = 0.60$ rakho aur $x$ solve karo.","m":"Equation banao aur $x$ ke liye solve karo.","s":["$0.60 = \\dfrac{600x}{600x+400(1-x)}$.","$0.60(600x+400-400x) = 600x$.","$0.60(200x+400) = 600x \\Rightarrow 120x+240 = 600x$.","$240 = 480x \\Rightarrow x = 0.50$."],"r":"$x = 0.50$ par $p_A = 300$, $p_B = 200$, $y_A = 300/500 = 0.60$ — verify ho gaya.","w":["$0.40$ me $y_A$ 0.60 nahi aata.","$0.60$ sirf $y_A$ ki value copy karna hai.","$0.67$ galat algebra se aata hai."],"t":"Answer ko wapas rakh kar verify karo: $x$ se partial pressures nikaalo aur $y$ check karo."},{"id":309,"c":"Henry's law","q":"At $298\\,\\mathrm{K}$, a gas dissolves in water to give a mole fraction of $2.0\\times10^{-5}$ when its partial pressure above the solution is $0.50\\,\\mathrm{bar}$. Its mole fraction in water at the same temperature when the partial pressure is raised to $2.0\\,\\mathrm{bar}$ is","opt":["$5.0\\times10^{-6}$","$8.0\\times10^{-5}$","$2.0\\times10^{-5}$","$2.0\\times10^{-4}$"],"ans":1,"cpt":"Henry's law: $x \\propto p$, isliye $\\dfrac{x_2}{x_1} = \\dfrac{p_2}{p_1}$.","m":"Ratio lagao — $K_H$ nikaalne ki zaroorat bhi nahi.","s":["Given: $x_1 = 2.0\\times10^{-5}$ at $p_1 = 0.50\\,\\mathrm{bar}$, naya pressure $p_2 = 2.0\\,\\mathrm{bar}$.","$\\dfrac{x_2}{2.0\\times10^{-5}} = \\dfrac{2.0}{0.50} = 4$.","$x_2 = 8.0\\times10^{-5}$.","Sahi option B: $x_2 = 8.0\\times10^{-5}$."],"r":"Pressure 4 guna badha to mole fraction bhi 4 guna badha — $8.0\\times10^{-5}$.","w":["$5.0\\times10^{-6}$ pressure ghatne ka case hai.","$2.0\\times10^{-5}$ purani value hai.","$2.0\\times10^{-4}$ me factor 10 galat hai."],"t":"Henry's law me ratio ka use karo: $x_2 = x_1(p_2/p_1)$ — $K_H$ ki zaroorat nahi."},{"id":310,"c":"Osmotic pressure","q":"Blood is approximately isotonic with a $0.155\\,\\mathrm{M}$ aqueous $\\ce{NaCl}$ solution. Considering complete dissociation of the electrolytes and no dissociation of non-electrolytes, which of the following solutions is hypertonic to blood?","opt":["$0.20\\,\\mathrm{M}$ $\\ce{CaCl2}$","$0.10\\,\\mathrm{M}$ $\\ce{CaCl2}$","$0.25\\,\\mathrm{M}$ glucose","$0.15\\,\\mathrm{M}$ $\\ce{NaCl}$"],"ans":0,"cpt":"Blood ki effective particle concentration $= 2\\times0.155 = 0.31\\,\\mathrm{M}$. Jo solution isse zyada particles de, wo hypertonic hoga.","m":"Har option ka $iC$ nikaalo aur $0.31$ se compare karo.","s":["$0.15\\,\\mathrm{M}$ $\\ce{NaCl}$: $2\\times0.15 = 0.30$ — thoda hypotonic.","$0.10\\,\\mathrm{M}$ $\\ce{CaCl2}$: $3\\times0.10 = 0.30$ — hypotonic.","$0.20\\,\\mathrm{M}$ $\\ce{CaCl2}$: $3\\times0.20 = 0.60$ — hypertonic.","$0.25\\,\\mathrm{M}$ glucose: $0.25$ — hypotonic."],"r":"$0.20\\,\\mathrm{M}$ $\\ce{CaCl2}$ ki effective concentration $0.60\\,\\mathrm{M}$ hai, jo blood ($0.31$) se zyada hai — isliye hypertonic.","w":["$0.30 < 0.31$ — hypotonic.","$0.25 < 0.31$ — hypotonic.","$0.30 < 0.31$ — hypotonic."],"t":"Hypertonic decide karne ke liye $iC$ compare karo, sirf molarity nahi."},{"id":311,"c":"Depression of freezing point","q":"$0.500\\,\\mathrm{g}$ of a non-volatile non-electrolyte is dissolved in $50.0\\,\\mathrm{g}$ of a solvent whose $K_f$ is $5.12\\,\\mathrm{K\\,kg\\,mol^{-1}}$. The freezing point of the solution is depressed by $0.256\\,\\mathrm{K}$. The molar mass of the solute is","opt":["$150\\,\\mathrm{g\\,mol^{-1}}$","$250\\,\\mathrm{g\\,mol^{-1}}$","$100\\,\\mathrm{g\\,mol^{-1}}$","$200\\,\\mathrm{g\\,mol^{-1}}$"],"ans":3,"cpt":"$M = \\dfrac{K_fw_2}{\\Delta T_f w_1(\\mathrm{kg})}$.","m":"Values seedha formula me rakho.","s":["$m = \\dfrac{0.256}{5.12} = 0.05\\,\\mathrm{mol\\,kg^{-1}}$.","$0.05\\,\\mathrm{kg}$ me moles $= 0.0025$.","$M = \\dfrac{0.500}{0.0025} = 200\\,\\mathrm{g\\,mol^{-1}}$."],"r":"$M = 200\\,\\mathrm{g\\,mol^{-1}}$.","w":["$150$ ka koi basis nahi.","$250$ galat division se aata hai.","$100$ double ho jata hai agar molality galat li jaye."],"t":"$0.500/0.0025$ me decimal dhyan se lagao — yahan $200$ aata hai, $20$ ya $2000$ nahi."},{"id":312,"c":"Colligative properties","q":"Equal masses of two non-electrolytes of molar masses $60\\,\\mathrm{g\\,mol^{-1}}$ and $120\\,\\mathrm{g\\,mol^{-1}}$ are dissolved separately in equal masses of the same solvent. The ratio of the elevations in boiling point produced by the first solute to that produced by the second solute is","opt":["$1:2$","$2:1$","$1:1$","$4:1$"],"ans":1,"cpt":"Same mass aur same solvent me $\\Delta T_b \\propto n \\propto \\dfrac{1}{M}$. Isliye ratio $= \\dfrac{M_2}{M_1}$.","m":"$\\Delta T_b$ ka ratio $= \\dfrac{1/M_1}{1/M_2} = \\dfrac{M_2}{M_1}$.","s":["Equal masses aur equal solvent mass liye gaye hain, isliye molality $\\propto 1/M$.","$\\dfrac{\\Delta T_{b1}}{\\Delta T_{b2}} = \\dfrac{1/60}{1/120} = \\dfrac{120}{60} = 2$.","Ratio $= 2:1$.","Sahi option B: ratio $2:1$."],"r":"Chhota molar mass zyada moles deta hai, isliye elevation double hoti hai — $2:1$.","w":["$1:2$ ulta ratio hai.","$1:1$ equal moles ka case hota.","$4:1$ squared ratio hai."],"t":"Same mass compare karte waqt $\\Delta T \\propto 1/M$ — molar mass ka ratio ulta karo."},{"id":313,"c":"Colligative properties","q":"Statement I: When a non-volatile solute is added to a solvent, the boiling point of the resulting solution rises while its freezing point falls. Statement II: The vapour pressure of the solution is lower than that of the pure solvent at the same temperature.","opt":["Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"Solute dalne par vapour pressure ghat ta hai. Isi se boiling point badhta hai aur freezing point ghat ta hai.","m":"Dono statements ek hi cause-effect chain ke hain.","s":["Solute dalne par $T_b$ badhta hai aur $T_f$ ghat ta hai — Statement I sahi.","Kaaran vapour pressure lowering hai — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; ek hi vapour pressure lowering dono effects deti hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Colligative properties ke saare questions ek hi chain se solve hote hain: $p\\downarrow \\Rightarrow T_b\\uparrow, T_f\\downarrow, \\pi\\uparrow$."},{"id":314,"c":"van't Hoff factor","q":"Statement I: The value of the van't Hoff factor of a strong electrolyte approaches the number of ions per formula unit as the solution is made more and more dilute. Statement II: At infinite dilution, interionic attractions become negligible and dissociation is essentially complete.","opt":["Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct"],"ans":1,"cpt":"Concentrated solution me ions ek doosre ke qareeb hote hain (ion pairing), isliye $i$ theoretical se kam. Dilute karne par ye effect ghat ta hai.","m":"Dilution ke effect ko ion-ion interaction se jodo.","s":["Infinite dilution par interionic attraction negligible — Statement II sahi.","Isliye $i$ theoretical value ke qareeb jata hai — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; dilution par ion pairing khatam hone se $i$ theoretical value tak pahunchta hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"$0.1\\,\\mathrm{M}$ $\\ce{KCl}$ ka $i$ $2$ se thoda kam hota hai; infinite dilution par $2$ ke barabar."},{"id":315,"c":"Azeotropes","q":"Statement I: An azeotropic mixture distils at constant temperature without change of composition at a given pressure, but its composition changes if the pressure is changed. Statement II: The composition of an azeotrope depends on the external pressure at which the distillation is carried out.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect"],"ans":2,"cpt":"Azeotropic composition pressure ke saath badal jati hai — isi principle par pressure-swing distillation kaam karti hai.","m":"Dono statements ek hi fact ke do roop hain.","s":["Fixed pressure par composition constant — Statement I ka pehla part sahi.","Pressure badalne par composition badal jati hai — Statement I ka doosra part sahi.","Statement II isi fact ko repeat karta hai — sahi.","Dono correct hain."],"r":"Dono statements correct hain; azeotropic composition pressure-dependent hoti hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Pressure-swing distillation: do different pressures par azeotropic compositions alag hone se separation possible hoti hai."},{"id":316,"c":"Raoult's law","q":"Statement I: For an ideal binary solution of two volatile liquids, the ratio of the vapour-phase mole fractions $y_1/y_2$ equals $(p_1^{\\circ}x_1)/(p_2^{\\circ}x_2)$. Statement II: In the vapour phase of an ideal binary solution, the component with the higher vapour pressure is always relatively richer than in the liquid phase.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"$y_1 = \\dfrac{p_1^{\\circ}x_1}{p}$, $y_2 = \\dfrac{p_2^{\\circ}x_2}{p}$, isliye ratio $= \\dfrac{p_1^{\\circ}x_1}{p_2^{\\circ}x_2}$. Aur jiska $p^{\\circ}$ zyada, uska $y/x$ ratio bhi zyada hota hai.","m":"Dono statements ko $y_1$ aur $y_2$ ke expressions se verify karo.","s":["Ratio $= \\dfrac{p_1^{\\circ}x_1}{p_2^{\\circ}x_2}$ — Statement I sahi.","$\\dfrac{y_1}{x_1} = \\dfrac{p_1^{\\circ}}{p}$, isliye zyada $p^{\\circ}$ wale ka $y/x$ bhi zyada — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; dono Raoult's law se seedha nikalte hain.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"$y_i/x_i = p_i^{\\circ}/p$ — is ratio ko 'relative volatility' ka basis kehte hain."},{"id":317,"c":"Concentration terms","q":"Statement I: A $1$ molal aqueous solution is not necessarily exactly as concentrated as a $1$ molar aqueous solution at the same temperature. Statement II: Molality is based on the mass of the solvent whereas molarity is based on the volume of the solution, and the two become numerically equal only under specific conditions of density and composition.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Molality mass par, molarity volume par based hai; dono sirf tab lagbhag barabar hote hain jab dilute ho aur density $\\approx1$ ho.","m":"Dono statements ko definition se jodo.","s":["1 molal aur 1 molar generally barabar nahi hote — Statement I sahi.","Dono ke base alag hain (mass vs volume) — Statement II sahi.","Dono correct hain."],"r":"Dono statements correct hain; base alag hone ki wajah se values generally alag hoti hain.","w":["Statement II galat nahi.","Statement I galat nahi.","Dono sahi hain."],"t":"Dilute aqueous solution me hi $M \\approx m$ hota hai — concentrated ya non-aqueous me farq bada hota hai."},{"id":318,"c":"Non-ideal solutions","q":"Statement I: For a binary liquid mixture showing negative deviation from Raoult's law, the total vapour pressure-composition curve shows a minimum, and the mixture forms a maximum boiling azeotrope. Statement II: Such a mixture can be separated into its pure components by ordinary distillation at that pressure.","opt":["Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Negative deviation me $p$ curve line ke neeche hota hai (minimum) aur max boiling azeotrope banta hai. Azeotrope ordinary distillation se alag nahi hota.","m":"Pehla statement concept-based hai, doosre me separation ka claim check karo.","s":["Negative deviation $\\Rightarrow$ minimum $p$ aur max boiling azeotrope — Statement I sahi.","Azeotrope ordinary distillation se separate nahi hota — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"Statement I sahi hai, par azeotrope ordinary distillation se alag nahi hota, isliye Statement II galat hai.","w":["Statement II galat hai.","Statement I galat nahi.","Statement I sahi hai."],"t":"Kisi bhi azeotrope (max ya min) ka separation ordinary distillation se possible nahi."},{"id":319,"c":"Vapour pressure","q":"Statement I: The lowering of vapour pressure in $\\mathrm{mm\\,Hg}$ produced by a given molality of a non-volatile solute is greater in a solvent having a higher vapour pressure. Statement II: The lowering of vapour pressure equals the product of the vapour pressure of the pure solvent and the mole fraction of the solute.","opt":["Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct"],"ans":3,"cpt":"$\\Delta p = p^{\\circ}x_2$: same $x_2$ par, jiska $p^{\\circ}$ zyada, uska absolute lowering zyada.","m":"Formula se statement I verify karo.","s":["$\\Delta p = p^{\\circ}x_2$ — Statement II sahi.","$p^{\\circ}$ zyada hone par $\\Delta p$ zyada — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; absolute lowering seedha $p^{\\circ}$ ke proportional hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Relative lowering solvent-independent hoti hai, absolute lowering nahi — ye farq yaad rakho."},{"id":320,"c":"Osmosis","q":"Statement I: When two solutions of the same non-electrolyte at different concentrations are separated by a semipermeable membrane, the solvent flows from the more concentrated into the more dilute solution. Statement II: Solvent flows in a direction that tends to equalise the osmotic pressures of the two solutions.","opt":["Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect"],"ans":1,"cpt":"Solvent hamesha dilute (kam solute) se concentrated (zyada solute) ki taraf jata hai — isse concentration barabar hone ki taraf badh ti hai.","m":"Direction check karo: 'concentrated se dilute' galat hai.","s":["Solvent dilute se concentrated ki taraf jata hai — Statement I galat.","Isse dono taraf osmotic pressure barabar hone ki koshish hoti hai — Statement II sahi.","Isliye Statement I incorrect, Statement II correct."],"r":"Direction ulti likhi hai, isliye Statement I galat; Statement II osmosis ka principle sahi batata hai.","w":["Statement I galat hai.","Statement II galat nahi.","Statement II sahi hai."],"t":"Osmosis ka purpose: concentration gradient ko kam karna — solvent kam solute wali side se zyada solute wali side jata hai."},{"id":321,"c":"Azeotropes","q":"Statement I: A liquid pair that shows positive deviation from Raoult's law only over a part of its composition range can never form an azeotrope with the other component. Statement II: An azeotrope can exist only at a composition where the vapour pressure-composition curve shows a maximum or a minimum.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Azeotrope wo composition hai jahan curve ka extremum hota hai. Positive deviation kaafi strong ho to extremum ban sakta hai, chahe deviation poore range me na ho.","m":"Pehli statement ka 'never' strong word check karo; doosri statement me 'maximum or minimum' condition.","s":["Statement I ka 'never' galat hai: partial positive deviation bhi strong ho to azeotrope ban sakta hai.","Statement II sahi hai: azeotrope sirf wahan banta hai jahan $p$–$x$ curve ka maximum ya minimum ho.","Isliye Statement I incorrect, Statement II correct."],"r":"Statement I galat hai (azeotrope ban sakta hai) aur Statement II sahi hai (extremum zaroori hai).","w":["Statement I galat hai.","Statement II galat nahi hai.","Statement II sahi hai — isliye 'both incorrect' galat."],"t":"Azeotrope formation ke liye curve ka extremum chahiye — deviation ka 'poora range' hona zaroori nahi."},{"id":322,"c":"Colligative properties","q":"Statement I: The relative lowering of vapour pressure, elevation in boiling point, depression in freezing point and osmotic pressure all yield the same value of molar mass for the same non-volatile non-electrolyte solute. Statement II: All four of these properties are proportional to the number of solute particles present in a given quantity of the solution.","opt":["Both Statement I and Statement II are correct","Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect"],"ans":0,"cpt":"Chaaron properties particle number par based hain, isliye non-electrolyte ke liye same molar mass dete hain (ideal dilute behaviour me).","m":"Dono statements ko particle-number argument se jodo.","s":["Chaaron properties particle number ke proportional hain — Statement II sahi.","Isliye same molar mass milta hai — Statement I sahi.","Dono correct hain."],"r":"Dono statements correct hain; ek hi particle count hone se same molar mass milta hai.","w":["Dono sahi hain.","Statement II galat nahi.","Statement I galat nahi."],"t":"Real measurements me thoda farq aa sakta hai (non-ideality), par NCERT level par ye same value dete hain."},{"id":323,"c":"Raoult's law","q":"Which of the following statements is NOT correct?","opt":["For an ideal binary solution, the total vapour pressure varies linearly with the mole fraction in the liquid phase but not with the mole fraction in the vapour phase.","For an ideal binary solution, the vapour-phase mole fraction of each component is always equal to its liquid-phase mole fraction.","For a binary solution showing positive deviation, the total vapour pressure at a given composition is greater than that predicted by Raoult's law.","For any binary solution, $x_1+x_2 = 1$ and $y_1+y_2 = 1$, where $x$ denotes mole fraction in the liquid and $y$ that in the vapour phase."],"ans":1,"cpt":"Ideal solution me $y_i = \\dfrac{p_i^{\\circ}x_i}{p}$, isliye $y_i = x_i$ sirf tab jab $p_1^{\\circ} = p_2^{\\circ}$ ho. Generally $y \\ne x$.","m":"$y_i$ ke formula ko dekho — $x_i$ se equal hone ki condition check karo.","s":["Mole fractions ka sum 1 — sahi.","$p$ vs $x$ linear hai; $p$ vs $y$ linear nahi — sahi.","Positive deviation me $p$ zyada — sahi.","$y_i$ hamesha $x_i$ ke barabar nahi hota — galat statement."],"r":"Ideal solution me bhi $y_i \\ne x_i$ (jab tak $p_1^{\\circ}=p_2^{\\circ}$ na ho), isliye ye statement NOT correct hai.","w":["Ye sahi hai.","Positive deviation ki sahi statement hai.","Ye sahi hai."],"t":"$y_1/x_1 = p_1^{\\circ}/p$ — ye ratio 1 se alag hota hai jab tak vapour pressures equal na hon."},{"id":324,"c":"Azeotropes","q":"Which of the following statements is correct?","opt":["For a system forming a minimum boiling azeotrope, the vapour pressure at the azeotropic composition is lower than the vapour pressures of both pure liquids.","Azeotropes are formed only by liquid pairs that obey Raoult's law over the entire composition range.","The azeotropic composition of an ethanol-water mixture does not change with a change in external pressure.","At the azeotropic composition the liquid boils at a constant temperature and the vapour in equilibrium has the same composition as the liquid."],"ans":3,"cpt":"Azeotrope ki definition: constant boiling temperature aur vapour ka composition liquid ke barabar.","m":"Har option ko definition se test karo.","s":["Min boiling azeotrope par $p$ maximum hota hai, lower nahi — galat.","Azeotropic composition pressure ke saath badalti hai — galat.","Azeotrope par $T_b$ constant aur $y=x$ — sahi.","Azeotropes non-ideal pairs banate hain, ideal nahi — galat."],"r":"Azeotrope ki sahi definition: constant boiling temperature aur vapour-liquid composition same.","w":["Min boiling azeotrope me $p$ maximum hota hai.","Azeotropes non-ideal pairs se bante hain.","Pressure badalne par composition badalti hai."],"t":"Min boiling $\\leftrightarrow$ max $p$; max boiling $\\leftrightarrow$ min $p$."},{"id":325,"c":"Colligative properties","q":"Which of the following statements about colligative properties is NOT correct?","opt":["The molal elevation constant of a solvent increases as the molar mass of the dissolved non-volatile solute increases.","All four of them are interrelated because each of them ultimately arises from the lowering of vapour pressure of the solvent.","They depend on the number of particles present and hence on the degree of dissociation of a weak electrolyte.","They can be used to determine the molar mass of a dissociating solute provided the van't Hoff factor is known."],"ans":0,"cpt":"$K_b$ sirf solvent par depend karta hai — solute ke molar mass se iska koi relation nahi.","m":"$K_b$ ki dependency list karo.","s":["$i$ known ho to molar mass nikal sakte hain — sahi.","Degree of dissociation particle number badalta hai — sahi.","Chaaron vapour pressure lowering se aate hain — sahi.","$K_b$ solute ke molar mass se badhta hai — galat statement."],"r":"$K_b$ solute ki nature/molar mass par depend nahi karta, isliye ye statement NOT correct hai.","w":["Ye sahi hai.","Ye sahi hai.","Interrelation sahi hai."],"t":"Solute ka effect $i$ ke through aata hai, $K_b$ ke through nahi."},{"id":326,"c":"Concentration terms","q":"Which of the following statements is correct?","opt":["The molality of a given solution changes appreciably when the solution is warmed.","The mass percentage of a given solution changes with temperature because the volume of the solution changes.","The molarity of a given solution is independent of temperature.","The mole fraction of the solute in a $1$ molal aqueous solution of any non-electrolyte is the same in magnitude, because it depends only on the number of moles of solute and solvent."],"ans":3,"cpt":"1 molal aqueous solution me hamesha $1$ mol solute aur $55.56$ mol water hote hain, isliye $x_2 = 0.0177$ — solute koi bhi ho.","m":"Definition se moles fix karo.","s":["1 molal = 1 mol solute + 1 kg water = 55.56 mol water.","$x_2 = \\dfrac{1}{56.56} = 0.0177$ — har non-electrolyte ke liye same — sahi.","Molality warming se nahi badalti.","Molarity temperature par depend karti hai.","Mass percentage temperature se nahi badalta (mass based hai)."],"r":"1 molal aqueous solution ka mole fraction hamesha $\\approx0.0177$ hota hai — yahi sahi statement hai.","w":["Molality warming se nahi badalti.","Mass percentage mass-based hai, isliye temperature-independent.","Molarity temperature-dependent hai."],"t":"1 molal aqueous $⇒ x_2 = 1/56.56$ — ye constant yaad rakho."},{"id":327,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["A solution of a non-volatile solute in a volatile solvent shows both elevation of boiling point and depression of freezing point.","Osmotic pressure measurement is routinely applicable to determine the molar mass of a highly volatile solute.","Relative lowering of vapour pressure can be used to determine the molar mass of a non-volatile non-electrolyte solute.","For a solution of a volatile solute in a volatile solvent, the simple relation $\\Delta T_b = K_bm$ has to be modified because the solute also contributes to the vapour pressure of the solution."],"ans":1,"cpt":"Highly volatile solute khud vapour phase me chala jata hai, isliye colligative relations (jo non-volatile solute ke liye bane hain) seedha apply nahi hote — osmotic pressure measurement routine nahi hai.","m":"Har method ki assumption check karo: solute non-volatile hona chahiye.","s":["Non-volatile solute ke saath dono effects aate hain — sahi.","Highly volatile solute ke liye osmotic pressure routine nahi — galat statement.","Relative lowering non-volatile non-electrolyte ke liye use hota hai — sahi.","Volatile solute ke liye relation modify karna padta hai — sahi."],"r":"Volatile solute ke liye colligative measurements complicate ho jate hain, isliye 'routinely applicable' wali statement NOT correct hai.","w":["Ye sahi hai.","Ye sahi hai.","Ye sahi hai."],"t":"Colligative properties ki silent assumption: solute non-volatile aur non-electrolyte (ya known $i$)."},{"id":328,"c":"Concentration terms","q":"Which of the following statements is NOT correct?","opt":["The solubility of a gas in water generally decreases on heating while the solubility of most solids in water generally increases on heating.","The osmotic pressure of a solution of fixed composition increases on raising its temperature.","The molality of a given solution changes on heating whereas its molarity does not.","The vapour pressure of a given liquid solution increases on raising its temperature."],"ans":2,"cpt":"Molality mass-based hai isliye heating se nahi badalti; molarity volume-based hai isliye badalti hai. Statement me bilkul ulta likha hai.","m":"Dono terms ka base check karo.","s":["Gas ki solubility heating par ghat ti hai, solids ki badh ti hai — sahi.","$\\pi \\propto T$ — sahi.","Vapour pressure temperature ke saath badhta hai — sahi.","Molality heating par nahi badalti, molarity badalti hai — galat statement."],"r":"Molality temperature-independent hai aur molarity temperature-dependent — isliye ye statement NOT correct hai.","w":["Ye sahi hai.","$\\pi \\propto T$ sahi hai.","Vapour pressure ka increase sahi hai."],"t":"Mass-based terms: temperature independent. Volume-based terms: temperature dependent."},{"id":329,"c":"Non-ideal solutions","q":"Which of the following statements is correct?","opt":["For a solution showing positive deviation from Raoult's law, the boiling point of the mixture at a given composition is higher than the value expected for ideal behaviour.","For a solution showing negative deviation, the vapour pressure is lower than the Raoult's law value and the mixture may form a maximum boiling azeotrope.","Ideal solutions always consist of components of nearly identical molar masses.","For a solution showing negative deviation from Raoult's law, $\\Delta V_{\\text{mix}}$ is positive."],"ans":1,"cpt":"Negative deviation: $p$ kam, strong interactions, $\\Delta V<0$, maximum boiling azeotrope.","m":"Har option ke signs check karo.","s":["Negative deviation me $\\Delta V$ negative hota hai — option galat.","Positive deviation me boiling point kam hota hai — option galat.","Negative deviation me $p$ kam aur max boiling azeotrope possible — sahi.","Ideal solutions ke liye molar mass same hona zaroori nahi (similar interactions chahiye)."],"r":"Negative deviation ki sahi definition aur consequence yahi hai.","w":["Positive deviation me mixture ka $T_b$ expected ideal value se kam hota hai, zyada nahi.","Ideal solutions ke liye molar mass same hona zaroori nahi — similar intermolecular forces chahiye.","Negative deviation me $\\Delta V_{\\text{mix}}$ negative hota hai, positive nahi."],"t":"Negative deviation ki chain: strong interactions $\\Rightarrow$ kam $p$ $\\Rightarrow$ zyada $T_b$ $\\Rightarrow$ max boiling azeotrope."},{"id":330,"c":"Osmosis","q":"Which of the following statements is NOT correct?","opt":["Osmotic pressure can be measured at room temperature and is therefore useful for substances that are unstable at elevated temperatures.","The osmotic pressure of a solution is numerically equal to the excess pressure that must be applied on the solution side to stop the net flow of solvent into it.","Osmotic pressure depends on the concentration of solute particles but not on the chemical nature of the solute particles.","Osmosis and diffusion are essentially the same phenomenon because both involve the movement of particles from a region of higher concentration to a region of lower concentration."],"ans":3,"cpt":"Osmosis sirf solvent ka movement hai semipermeable membrane ke through, aur direction kam solute se zyada solute ki taraf. Diffusion me solute bhi move karta hai aur membrane zaroori nahi.","m":"Osmosis aur diffusion ke definitions compare karo.","s":["Osmotic pressure ki definition sahi hai.","Colligative nature sahi hai (nature par depend nahi).","Osmosis aur diffusion same nahi hain — galat statement.","Room temperature measurement sahi hai."],"r":"Osmosis aur diffusion alag phenomena hain (osmosis me sirf solvent, membrane ke through), isliye ye statement NOT correct hai.","w":["Ye sahi hai.","Ye sahi hai.","Ye sahi hai."],"t":"Osmosis ke liye semipermeable membrane aur sirf solvent ka flow zaroori hai — diffusion me ye shart nahi."},{"id":331,"c":"Osmotic pressure","q":"Which of the following statements is correct?","opt":["A $0.10\\,\\mathrm{M}$ aqueous solution of a weak electrolyte exerts an osmotic pressure smaller than that of a $0.10\\,\\mathrm{M}$ solution of a strong electrolyte giving two ions, but larger than that of a $0.10\\,\\mathrm{M}$ solution of a non-electrolyte.","A $0.10\\,\\mathrm{M}$ aqueous solution of a weak electrolyte exerts a smaller osmotic pressure than a $0.10\\,\\mathrm{M}$ non-electrolyte solution at the same temperature.","The van't Hoff factor of a weak electrolyte decreases as the solution is diluted.","The van't Hoff factor of a strong electrolyte is exactly equal to the number of ions per formula unit at every concentration."],"ans":0,"cpt":"Weak electrolyte partially dissociates, isliye $1<i<2$ hota hai — uski particle concentration non-electrolyte se zyada par strong electrolyte se kam.","m":"$i$ ka range compare karo teen cases me.","s":["Non-electrolyte: $i=1$; weak electrolyte: $1<i<2$; strong (2 ions): $i=2$.","Isliye weak electrolyte ka $\\pi$ dono ke beech me hota hai — sahi.","Dilution par weak electrolyte ka $i$ badh ta hai, ghat ta nahi.","Strong electrolyte ka $i$ concentrated solution me 2 se kam ho sakta hai."],"r":"Weak electrolyte ka $i$ dono limits ke beech hota hai, isliye uska $\\pi$ bhi beech me hota hai.","w":["Weak electrolyte ka $\\pi$ non-electrolyte se kam nahi, zyada hota hai.","Dilution par $i$ badh ta hai.","Strong electrolyte ka $i$ hamesha exactly theoretical nahi hota."],"t":"Order: strong electrolyte $>$ weak electrolyte $>$ non-electrolyte (same molarity par)."},{"id":332,"c":"Reverse osmosis","q":"Which of the following statements is NOT correct?","opt":["Reverse osmosis is a spontaneous process that requires no external source of energy.","In reverse osmosis, the applied pressure forces water from the concentrated solution towards the dilute or pure water side.","The semipermeable membrane used in reverse osmosis must be permeable to water but essentially impermeable to the dissolved salt ions.","The osmotic pressure of sea water is of the order of about $30\\,\\mathrm{atm}$, and an applied pressure greater than this is needed for its desalination by reverse osmosis."],"ans":0,"cpt":"RO spontaneous nahi hai — isme external pressure lagana padta hai, yani energy chahiye.","m":"Spontaneity check karo: osmosis spontaneous hai, RO nahi.","s":["Membrane ki selectivity sahi hai.","Sea water ka $\\pi$ order $\\sim25$-$30\\,\\mathrm{atm}$ sahi hai.","Flow direction sahi hai.","RO spontaneous nahi, external energy chahiye — galat statement."],"r":"RO me external pressure lagana padta hai (energy input), isliye 'spontaneous' wali statement NOT correct hai.","w":["Ye sahi hai.","Ye sahi hai.","Direction sahi hai."],"t":"RO plant electricity use karte hain — kyunki ye non-spontaneous process hai."},{"id":333,"c":"van't Hoff factor","q":"Match the Column I ($0.10\\,\\mathrm{m}$ solution) with Column II (van't Hoff factor). Column I: (a) glucose in water (b) $\\ce{NaCl}$ in water, complete dissociation (c) $\\ce{CaCl2}$ in water, complete dissociation (d) benzoic acid in benzene, $50\\%$ dimerised. Column II: (i) $2$ (ii) $3$ (iii) $1$ (iv) $0.75$","opt":["a-iii, b-i, c-ii, d-iv","a-iv, b-i, c-ii, d-iii","a-iii, b-ii, c-i, d-iv","a-i, b-iii, c-ii, d-iv"],"ans":0,"cpt":"Glucose $i=1$; $\\ce{NaCl}$ $i=2$; $\\ce{CaCl2}$ $i=3$; 50% dimerised benzoic acid $i = 1-0.25 = 0.75$.","m":"Har case ka $i$ nikaalo.","s":["Glucose $\\rightarrow$ (iii).","$\\ce{NaCl}$ $\\rightarrow$ (i).","$\\ce{CaCl2}$ $\\rightarrow$ (ii).","50% dimerised $\\rightarrow$ (iv) $0.75$."],"r":"Mapping a-iii, b-i, c-ii, d-iv sahi hai.","w":["Glucose ka $i=2$ nahi.","$\\ce{NaCl}$ ka $i=3$ nahi.","$\\ce{CaCl2}$ ka $i=1$ nahi."],"t":"Dimerisation me $i = 1-\\alpha/2$ — $\\alpha = 0.5$ par $0.75$."},{"id":334,"c":"Colligative properties","q":"Match the Column I ($0.10\\,\\mathrm{m}$ aqueous solution unless stated; complete dissociation of electrolytes assumed) with Column II (freezing point; $K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$). Column I: (a) glucose (b) $\\ce{NaCl}$ (c) $\\ce{K2SO4}$ (d) $\\ce{Al2(SO4)3}$ of molality $0.05$. Column II: (i) $-0.186\\,^{\\circ}\\mathrm{C}$ (ii) $-0.372\\,^{\\circ}\\mathrm{C}$ (iii) $-0.465\\,^{\\circ}\\mathrm{C}$ (iv) $-0.558\\,^{\\circ}\\mathrm{C}$","opt":["a-i, b-ii, c-iv, d-iii","a-ii, b-i, c-iv, d-iii","a-i, b-iv, c-ii, d-iii","a-iii, b-ii, c-iv, d-i"],"ans":0,"cpt":"$\\Delta T_f = iK_fm$: glucose $0.186$; $\\ce{NaCl}$ ($i=2$) $0.372$; $\\ce{K2SO4}$ ($i=3$) $0.558$; $\\ce{Al2(SO4)3}$ ($i=5$, $0.05\\,\\mathrm{m}$) $0.465$.","m":"Har case calculate karo.","s":["Glucose $\\rightarrow$ (i) $-0.186$.","$\\ce{NaCl}$ $\\rightarrow$ (ii) $-0.372$.","$\\ce{K2SO4}$ $\\rightarrow$ (iv) $-0.558$.","$\\ce{Al2(SO4)3}$ ($0.05\\,\\mathrm{m}$) $\\rightarrow$ (iii) $-0.465$."],"r":"Mapping a-i, b-ii, c-iv, d-iii sahi hai.","w":["$\\ce{NaCl}$ ka freezing point glucose jaisa nahi hota.","$\\ce{K2SO4}$ ka $0.372$ nahi hota.","$\\ce{Al2(SO4)3}$ ka $0.186$ nahi hota."],"t":"$\\ce{Al2(SO4)3}$ ke liye molality $0.05$ hai — dhyan se padho, warna $0.930$ se galat match ho jayega."},{"id":335,"c":"Non-ideal solutions","q":"Match the Column I (type of solution) with Column II (vapour pressure behaviour). Column I: (a) ideal solution (b) solution showing positive deviation (c) solution showing negative deviation (d) azeotropic mixture. Column II: (i) vapour pressure lower than the Raoult's law value (ii) vapour pressure equal to the Raoult's law value (iii) mixture of definite composition boiling at constant temperature with vapour of the same composition (iv) vapour pressure higher than the Raoult's law value","opt":["a-iii, b-iv, c-i, d-ii","a-ii, b-i, c-iv, d-iii","a-iv, b-ii, c-i, d-iii","a-ii, b-iv, c-i, d-iii"],"ans":3,"cpt":"Ideal: $p$ = Raoult value. Positive: $p$ zyada. Negative: $p$ kam. Azeotrope: constant boiling, same composition.","m":"Har type ke behaviour se match karo.","s":["Ideal $\\rightarrow$ (ii).","Positive deviation $\\rightarrow$ (iv).","Negative deviation $\\rightarrow$ (i).","Azeotrope $\\rightarrow$ (iii)."],"r":"Mapping a-ii, b-iv, c-i, d-iii sahi hai.","w":["Ideal ka $p$ higher nahi hota.","Positive deviation ka $p$ lower nahi hota.","Azeotrope ka $p$ Raoult's value ke barabar hona zaroori nahi."],"t":"Azeotrope non-ideal hota hai — us par $p$ ideal value se alag hota hai, bas extremum par."},{"id":336,"c":"Applications","q":"Match the Column I (observation) with Column II (explanation). Column I: (a) aquatic species are more comfortable in cold water (b) a soft drink fizzes when opened (c) a diver ascending too rapidly may suffer bends (d) use of a helium-oxygen mixture by deep sea divers. Column II: (i) nitrogen dissolved in blood under high pressure forms bubbles when pressure is suddenly lowered (ii) solubility of oxygen is greater at lower temperatures (iii) dissolved carbon dioxide escapes when its partial pressure above the liquid is reduced (iv) helium is much less soluble in blood than nitrogen, reducing the risk of bubble formation","opt":["a-i, b-iii, c-ii, d-iv","a-iii, b-ii, c-i, d-iv","a-ii, b-iii, c-i, d-iv","a-ii, b-i, c-iii, d-iv"],"ans":2,"cpt":"Chaaron Henry's law ke applications hain: temperature effect, pressure release, decompression bubbles, kam soluble gas ka use.","m":"Har observation ko explanation se jodo.","s":["Cold water me $\\ce{O2}$ zyada soluble $\\rightarrow$ (ii).","Soft drink kholne par $\\ce{CO2}$ escape $\\rightarrow$ (iii).","Rapid ascent par $\\ce{N2}$ bubbles $\\rightarrow$ (i).","He-O₂ mixture $\\rightarrow$ (iv)."],"r":"Mapping a-ii, b-iii, c-i, d-iv sahi hai.","w":["Cold water O₂ ka effect hai, bends ka nahi.","Soft drink bends ka example nahi hai.","Aquatic species He ke use ka example nahi hai."],"t":"Henry's law application questions me key word dhundo: temperature, pressure release, decompression, solubility difference."},{"id":337,"c":"Units","q":"Match the Column I (quantity) with Column II (unit). Column I: (a) molality (b) molarity (c) mole fraction (d) Henry's law constant when solubility is expressed as mole fraction. Column II: (i) $\\mathrm{mol\\,L^{-1}}$ (ii) $\\mathrm{mol\\,kg^{-1}}$ (iii) bar (iv) no unit","opt":["a-ii, b-i, c-iii, d-iv","a-ii, b-i, c-iv, d-iii","a-i, b-ii, c-iv, d-iii","a-iv, b-i, c-ii, d-iii"],"ans":1,"cpt":"Molality $\\mathrm{mol\\,kg^{-1}}$, molarity $\\mathrm{mol\\,L^{-1}}$, mole fraction unitless, $K_H$ ka unit pressure (bar).","m":"Har quantity ka formula likho aur unit derive karo.","s":["Molality $\\rightarrow$ (ii).","Molarity $\\rightarrow$ (i).","Mole fraction $\\rightarrow$ (iv).","$K_H = p/x$ $\\rightarrow$ pressure ka unit (iii)."],"r":"Mapping a-ii, b-i, c-iv, d-iii sahi hai.","w":["Molality ka unit litre me nahi hota.","Molarity ka unit kg me nahi hota.","$K_H$ unitless nahi hai."],"t":"Unit questions me formula hi likh kar derive karo — ratne se confusion hoti hai."},{"id":338,"c":"van't Hoff factor","q":"Match the Column I (situation) with Column II (van't Hoff factor). Column I: (a) complete dissociation of a salt giving $n$ ions per formula unit (b) association into $n$ molecules with degree of association $\\alpha$ (c) dissociation of a weak electrolyte into $n$ ions with degree of dissociation $\\alpha$ (d) complete dimerisation. Column II: (i) $1+(n-1)\\alpha$ (ii) $n$ (iii) $1-\\alpha+\\dfrac{\\alpha}{n}$ (iv) $0.5$","opt":["a-ii, b-i, c-iii, d-iv","a-iv, b-iii, c-i, d-ii","a-ii, b-iii, c-i, d-iv","a-iii, b-ii, c-i, d-iv"],"ans":2,"cpt":"Chaaron standard expressions: complete dissociation $i=n$; association $i = 1-\\alpha+\\alpha/n$; weak dissociation $i = 1+(n-1)\\alpha$; complete dimer $i=0.5$.","m":"Har case ka formula pehchano.","s":["Complete dissociation $\\rightarrow$ (ii) $n$.","Association $\\rightarrow$ (iii).","Weak dissociation $\\rightarrow$ (i).","Complete dimerisation $\\rightarrow$ (iv) $0.5$."],"r":"Mapping a-ii, b-iii, c-i, d-iv sahi hai.","w":["Complete dissociation ka formula $1+(n-1)\\alpha$ nahi.","Association ka formula $n$ nahi.","Weak dissociation ka formula $1-\\alpha+\\alpha/n$ nahi."],"t":"Dissociation me $i$ 1 se $n$ tak jata hai; association me $1/n$ se $1$ tak."},{"id":339,"c":"Depression of freezing point","q":"Assertion (A): When a solution of a non-volatile solute is cooled, the solid that first separates out is the pure solvent, provided the solute is insoluble in the solid solvent. Reason (R): The depression of freezing point arises because the vapour pressure of the liquid solution becomes equal to that of the pure solid solvent at a lower temperature.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Freezing point par solution ka vapour pressure solid solvent ke vapour pressure ke barabar hota hai. Solute solid me na aaye to sirf solvent crystallise hota hai.","m":"Dono statements ek hi phenomenon ke do pehlu hain.","s":["Solution ka $p$ solid solvent ke $p$ se lower temperature par equal hota hai — R sahi.","Isliye pure solvent pehle crystallise hota hai — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; vapour pressure equality ki condition hi freezing point define karti hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Isi principle se freezing point depression ka use karke molar mass nikalte hain."},{"id":340,"c":"Abnormal molar mass","q":"Assertion (A): A $0.10\\,\\mathrm{m}$ aqueous solution of a solute that dimerises in water has a smaller freezing point depression than a $0.10\\,\\mathrm{m}$ aqueous solution of a non-electrolyte that does not associate. Reason (R): Dimerisation reduces the total number of solute particles present in the solution.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Dimerisation se particles aadhe ho jate hain ($i<1$), isliye $\\Delta T_f$ calculated se kam hoti hai.","m":"Particle count ka effect dono statements me check karo.","s":["Dimerisation particles kam karti hai — R sahi.","Kam particles $\\Rightarrow$ kam depression — A sahi.","R hi A ka explanation hai."],"r":"Dono sach hain; particle number ka ghatna hi depression ke kam hone ka kaaran hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Association me $i<1$: $0.1\\,\\mathrm{m}$ dimer solution ka $\\Delta T_f$ lagbhag $0.093\\,\\mathrm{K}$ (half of $0.186$)."},{"id":341,"c":"Elevation of boiling point","q":"$10\\,\\mathrm{g}$ of a non-volatile non-electrolyte solute is dissolved in $100\\,\\mathrm{g}$ of water and the boiling point of the solution is found to be $0.26\\,\\mathrm{K}$ higher than that of pure water. If $K_b$ for water is $0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the molar mass of the solute is","opt":["$100\\,\\mathrm{g\\,mol^{-1}}$","$150\\,\\mathrm{g\\,mol^{-1}}$","$200\\,\\mathrm{g\\,mol^{-1}}$","$250\\,\\mathrm{g\\,mol^{-1}}$"],"ans":2,"cpt":"$\\Delta T_b = K_b m$ aur $m = \\dfrac{w_2 \\times 1000}{M_2 \\times w_1\\,(\\mathrm{g})}$, isliye $M_2 = \\dfrac{K_b w_2 \\times 1000}{\\Delta T_b w_1}$.","m":"Direct molar mass formula lagao — pehle molality nikaalne ki zaroorat nahi.","s":["$M_2 = \\dfrac{0.52 \\times 10 \\times 1000}{0.26 \\times 100}$","Numerator $= 5200$, denominator $= 26$","$M_2 = 200\\,\\mathrm{g\\,mol^{-1}}$","Sahi option C."],"r":"Sahi jawab C: $200\\,\\mathrm{g\\,mol^{-1}}$.","w":["A option tab aata hai jab $1000$ ka factor chhoot jaye.","B option galat arithmetic se aata hai.","D option me $\\Delta T_b$ ko $0.52$ samajh liya gaya."],"t":"Formula me $w_1$ gram me daalo — kg me daalne par $1000$ ka factor confusion karta hai."},{"id":342,"c":"Osmotic pressure","q":"The osmotic pressure of a $0.10\\,\\mathrm{M}$ aqueous glucose solution at $300\\,\\mathrm{K}$ is ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$)","opt":["$1.23\\,\\mathrm{atm}$","$2.46\\,\\mathrm{atm}$","$4.92\\,\\mathrm{atm}$","$24.6\\,\\mathrm{atm}$"],"ans":1,"cpt":"$\\pi = CRT$ — glucose non-electrolyte hai isliye $i = 1$.","m":"Direct $CRT$ lagao, phir verify karo ki $C$ molarity hai (mol per litre).","s":["$\\pi = 0.10 \\times 0.0821 \\times 300$","$0.0821 \\times 300 = 24.63$","$\\pi = 0.10 \\times 24.63 = 2.46\\,\\mathrm{atm}$","Sahi option B."],"r":"Sahi jawab B: $2.46\\,\\mathrm{atm}$.","w":["A option $i = 0.5$ lene par aata hai.","C option me $0.20\\,\\mathrm{M}$ le liya gaya.","D option me $C$ ko $1.0\\,\\mathrm{M}$ maan liya gaya."],"t":"$RT$ ka value $300\\,\\mathrm{K}$ par $\\approx24.6\\,\\mathrm{L\\,atm\\,mol^{-1}}$ — ise yaad rakho, calculation fast hoti hai.","sim":{"title":"Osmotic pressure explore karo","sliders":[{"name":"C","label":"C (mol L^{-1})","min":0.02,"max":0.4,"step":0.02,"val":0.1},{"name":"T","label":"T (K)","min":270,"max":350,"step":5,"val":300},{"name":"i","label":"i","min":1,"max":3,"step":0.5,"val":1}],"calc":"var p = i*C*0.0821*T; return [['π', p.toFixed(3)+' atm'], ['CRT', (C*0.0821*T).toFixed(3)+' atm']];"}},{"id":343,"c":"Depression of freezing point","q":"$1.8\\,\\mathrm{g}$ of glucose ($M = 180\\,\\mathrm{g\\,mol^{-1}}$) is dissolved in $100\\,\\mathrm{g}$ of water. If $K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$ and the freezing point of pure water is $273.15\\,\\mathrm{K}$, the freezing point of the solution is","opt":["$-0.186\\,^{\\circ}\\mathrm{C}$","$-0.372\\,^{\\circ}\\mathrm{C}$","$-0.093\\,^{\\circ}\\mathrm{C}$","$+0.186\\,^{\\circ}\\mathrm{C}$"],"ans":0,"cpt":"Freezing point depression $\\Delta T_f = K_f m$ aur glucose ka $i = 1$.","m":"Pehle molality nikaalo, phir $\\Delta T_f$.","s":["Moles of glucose $= \\dfrac{1.8}{180} = 0.010$","Molality $= \\dfrac{0.010}{0.100} = 0.10\\,\\mathrm{mol\\,kg^{-1}}$","$\\Delta T_f = 1.86 \\times 0.10 = 0.186\\,\\mathrm{K}$","Freezing point $= 0 - 0.186 = -0.186\\,^{\\circ}\\mathrm{C}$ — option A."],"r":"Sahi jawab A: $-0.186\\,^{\\circ}\\mathrm{C}$.","w":["B option tab aata hai jab $i = 2$ le liya jaye.","C option me molality $0.05$ le li gayi.","D option me sign galat hai (freezing point lowers, rises nahi)."],"t":"Hamesha check karo: solution ka freezing point pure solvent se kam hota hai, isliye answer negative hoga."},{"id":344,"c":"Depression of freezing point","q":"What mass of urea ($M = 60\\,\\mathrm{g\\,mol^{-1}}$) must be dissolved in $500\\,\\mathrm{g}$ of water so that the solution freezes at $-0.372\\,^{\\circ}\\mathrm{C}$? ($K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$)","opt":["$3.0\\,\\mathrm{g}$","$6.0\\,\\mathrm{g}$","$12.0\\,\\mathrm{g}$","$1.8\\,\\mathrm{g}$"],"ans":1,"cpt":"$\\Delta T_f = K_f m \\Rightarrow m = \\dfrac{\\Delta T_f}{K_f}$; molality se moles, phir mass.","m":"Molality se aage badho: moles $= m \\times$ kg solvent, mass $=$ moles $\\times M$.","s":["$m = \\dfrac{0.372}{1.86} = 0.20\\,\\mathrm{mol\\,kg^{-1}}$","Moles $= 0.20 \\times 0.500 = 0.10$","Mass $= 0.10 \\times 60 = 6.0\\,\\mathrm{g}$","Sahi option B."],"r":"Sahi jawab B: $6.0\\,\\mathrm{g}$.","w":["A option me $250\\,\\mathrm{g}$ water le liya gaya.","C option me $1\\,\\mathrm{kg}$ water le liya gaya.","D option me molality $0.06$ le li gayi."],"t":"Solvent ka mass kg me badlo — $500\\,\\mathrm{g} = 0.5\\,\\mathrm{kg}$, yahin sabse zyada galti hoti hai."},{"id":345,"c":"Relative lowering of vapour pressure","q":"$20\\,\\mathrm{g}$ of a non-volatile non-electrolyte solute is dissolved in $180\\,\\mathrm{g}$ of water. The relative lowering of vapour pressure of the solution is $0.02$. The molar mass of the solute is","opt":["$49\\,\\mathrm{g\\,mol^{-1}}$","$90\\,\\mathrm{g\\,mol^{-1}}$","$98\\,\\mathrm{g\\,mol^{-1}}$","$196\\,\\mathrm{g\\,mol^{-1}}$"],"ans":2,"cpt":"$\\dfrac{p^{\\circ} - p}{p^{\\circ}} = x_2 = \\dfrac{n_2}{n_2 + n_1}$, jahan $n_1 = \\dfrac{180}{18} = 10$.","m":"Mole fraction ka equation banao aur $n_2$ solve karo.","s":["$\\dfrac{n_2}{n_2 + 10} = 0.02$","$n_2 = 0.02(n_2 + 10) \\Rightarrow 0.98\\,n_2 = 0.20$","$n_2 = 0.204$","$M = \\dfrac{20}{0.204} \\approx 98\\,\\mathrm{g\\,mol^{-1}}$ — option C."],"r":"Sahi jawab C: $98\\,\\mathrm{g\\,mol^{-1}}$.","w":["A option me solute ke moles $0.41$ le liye gaye.","B option me $n_1 = 10$ ki jagah $11$ le liya gaya.","D option me $M$ ko double kar diya gaya."],"t":"Relative lowering unitless hoti hai — $0.02$ ka matlab $2\\%$ kam hua vapour pressure."},{"id":346,"c":"van't Hoff factor","q":"A $0.010\\,\\mathrm{m}$ aqueous solution of $\\ce{CaCl2}$ freezes at a temperature $0.0465\\,\\mathrm{K}$ below the freezing point of water ($K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$). Assuming that only the first dissociation step is complete and the second step is partial, the values of $i$ and the degree of dissociation $\\alpha$ are","opt":["$i = 1.25$, $\\alpha = 0.25$","$i = 2.50$, $\\alpha = 0.75$","$i = 3.00$, $\\alpha = 1.00$","$i = 1.50$, $\\alpha = 0.50$"],"ans":1,"cpt":"$\\Delta T_f = iK_fm$, isliye $i = \\dfrac{\\Delta T_f}{K_fm}$. Aur $i = 1 + (n-1)\\alpha$ yahan $n = 3$ (teen ions).","m":"Pehle $i$ nikaalo measurement se, phir $\\alpha$ formula se.","s":["$i = \\dfrac{0.0465}{1.86 \\times 0.010} = \\dfrac{0.0465}{0.0186} = 2.5$","$i = 1 + 2\\alpha \\Rightarrow 2\\alpha = 1.5$","$\\alpha = 0.75$","Sahi option B."],"r":"Sahi jawab B: $i = 2.50$, $\\alpha = 0.75$.","w":["A option tab aata hai jab $n = 6$ le liya jaye.","C option complete dissociation ka case hai (isme $\\Delta T_f$ $0.0558$ hota).","D option me $n = 2$ le liya gaya (jaise $\\ce{NaCl}$ ke liye)."],"t":"$n$ hamesha formula unit me total ions hota hai: $\\ce{CaCl2} \\rightarrow 1 + 2 = 3$."},{"id":347,"c":"Osmotic pressure","q":"A solution containing $8.0\\,\\mathrm{g}$ of a non-electrolyte in $250\\,\\mathrm{mL}$ of solution has an osmotic pressure of $4.92\\,\\mathrm{atm}$ at $300\\,\\mathrm{K}$. The molar mass of the solute is ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$)","opt":["$80\\,\\mathrm{g\\,mol^{-1}}$","$120\\,\\mathrm{g\\,mol^{-1}}$","$320\\,\\mathrm{g\\,mol^{-1}}$","$160\\,\\mathrm{g\\,mol^{-1}}$"],"ans":3,"cpt":"$\\pi V = nRT = \\dfrac{w}{M}RT \\Rightarrow M = \\dfrac{wRT}{\\pi V}$; yahan $V$ litre me chahiye.","m":"Formula me $V$ ko litre me daalo, warna $1000$ ka error aa jata hai.","s":["$V = 0.250\\,\\mathrm{L}$","$M = \\dfrac{8.0 \\times 0.0821 \\times 300}{4.92 \\times 0.250}$","Numerator $= 197.0$, denominator $= 1.23$","$M = 160\\,\\mathrm{g\\,mol^{-1}}$ — option D."],"r":"Sahi jawab D: $160\\,\\mathrm{g\\,mol^{-1}}$.","w":["A option me solute ka mass $4.0\\,\\mathrm{g}$ liya gaya.","B option me $V = 0.333\\,\\mathrm{L}$ le liya gaya.","C option me $V$ ko mL me hi daal diya gaya (factor $1000$)."],"t":"Osmotic pressure method large molecules (proteins, polymers) ke liye best hai — kyunki dilute solution me bhi $\\pi$ measurable hoti hai."},{"id":348,"c":"Elevation of boiling point","q":"$3.725\\,\\mathrm{g}$ of $\\ce{KCl}$ ($M = 74.5\\,\\mathrm{g\\,mol^{-1}}$) is dissolved in $100\\,\\mathrm{g}$ of water. Assuming complete dissociation, the boiling point of the solution is ($K_b = 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$, boiling point of water $= 100\\,^{\\circ}\\mathrm{C}$)","opt":["$100.052\\,^{\\circ}\\mathrm{C}$","$100.104\\,^{\\circ}\\mathrm{C}$","$100.520\\,^{\\circ}\\mathrm{C}$","$100.260\\,^{\\circ}\\mathrm{C}$"],"ans":2,"cpt":"$\\ce{KCl}$ do ions deta hai isliye $i = 2$, aur $\\Delta T_b = iK_bm$.","m":"Molality nikaalo, $i$ se multiply karo, phir $100\\,^{\\circ}\\mathrm{C}$ me add karo.","s":["Moles of $\\ce{KCl} = \\dfrac{3.725}{74.5} = 0.050$","Molality $= \\dfrac{0.050}{0.100} = 0.50\\,\\mathrm{mol\\,kg^{-1}}$","$\\Delta T_b = 2 \\times 0.52 \\times 0.50 = 0.52\\,\\mathrm{K}$","Boiling point $= 100 + 0.52 = 100.520\\,^{\\circ}\\mathrm{C}$ — option C."],"r":"Sahi jawab C: $100.520\\,^{\\circ}\\mathrm{C}$.","w":["A option tab aata hai jab $i = 1$ le liya jaye ($0.26\\,\\mathrm{K}$ ka double confusion).","B option me molality $0.10$ le li gayi.","D option me $\\Delta T_b$ ko aadha kar diya gaya."],"t":"$\\ce{KCl}$ jaise strong electrolyte me $i = 2$ lagana mat bhoolo — warna answer aadha aa jata hai.","sim":{"title":"Boiling point elevation explore karo","sliders":[{"name":"m","label":"molality m","min":0.1,"max":1.0,"step":0.05,"val":0.5},{"name":"i","label":"i","min":1,"max":3,"step":1,"val":2}],"calc":"var dT = 0.52*i*m; return [['ΔT_b', dT.toFixed(3)+' K'], ['bp', (100+dT).toFixed(3)+' °C']];"}},{"id":349,"c":"Osmotic pressure","fig":{"type":"plot","xlab":"c (mol L^{-1})","ylab":"π (atm)","xmin":0,"xmax":0.2,"ymin":0,"ymax":10,"series":[{"name":"solute P","pts":[[0,0],[0.05,2.46],[0.1,4.92],[0.15,7.38]],"color":"#7fd1a0"},{"name":"solute Q","pts":[[0,0],[0.05,1.23],[0.1,2.46],[0.15,3.69]],"color":"#e0a170"}],"cap":"Osmotic pressure against concentration for two aqueous solutes at 300 K."},"q":"The graph shows osmotic pressure against concentration at $300\\,\\mathrm{K}$ for two aqueous solutes $P$ and $Q$. Which conclusion is correct?","opt":["$P$ has $i = 1$ and $Q$ has $i = 2$","$P$ has $i = 2$ and $Q$ has $i = 1$, both solutes being non-associating and neither forming dimers","Both have the same $i$ but different molar masses","$P$ is a polymer and $Q$ is a simple salt, so no comparison of $i$ is possible"],"ans":1,"cpt":"$\\pi = icRT$, isliye same $T$ par slope $= iRT$. Slope jitna zyada, $i$ utna zyada.","m":"Dono lines ka slope nikaalo aur ratio dekho.","s":["$Q$ ka slope $= \\dfrac{2.46}{0.10} = 24.6 = RT$ $\\Rightarrow i_Q = 1$.","$P$ ka slope $= \\dfrac{4.92}{0.10} = 49.2 = 2RT$ $\\Rightarrow i_P = 2$.","Ratio exactly $2$, isliye $P$ ke 2 particles per formula unit — option B."],"r":"Sahi jawab B: $P$ ka $i = 2$ aur $Q$ ka $i = 1$.","w":["A option lines ko ulta padhne se aata hai.","C option tab aata hai jab slope equal hota; yahan nahi.","D option galat hai — $\\pi$ vs $c$ ka slope $i$ seedha deta hai, molar mass se iska relation nahi."],"t":"$\\pi$ vs $c$ graph ki straight line ka slope $iRT$ hota hai — yeh graph ka sabse useful reading hai."},{"id":350,"c":"van't Hoff factor","fig":{"type":"table","head":["Solution","Molality $(\\mathrm{mol\\,kg^{-1}})$","Measured $\\Delta T_f$ $(\\mathrm{K})$"],"rows":[["P","0.10","0.372"],["Q","0.10","0.558"],["R","0.10","0.186"],["S","0.05","0.186"]],"cap":"Freezing point depressions of four aqueous solutions; $K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$."},"q":"From the given data for aqueous solutions at the same $K_f$, which solution has the highest van't Hoff factor, and what is its value?","opt":["$R$, $i = 1$","$Q$, $i = 3$","$P$, $i = 2$","$S$, $i = 2$"],"ans":1,"cpt":"$i = \\dfrac{\\Delta T_f}{K_fm}$ — har row ke liye nikaalo aur compare karo.","m":"Table ke chaar rows me formula lagao.","s":["$P$: $i = \\dfrac{0.372}{1.86 \\times 0.10} = 2$","$Q$: $i = \\dfrac{0.558}{0.186} = 3$","$R$: $i = 1$; $S$: $i = \\dfrac{0.186}{1.86 \\times 0.05} = 2$","Sabse zyada $i = 3$ hai $Q$ ke liye — option B."],"r":"Sahi jawab B: $Q$ ka $i = 3$.","w":["A option me sabse kam $i$ wala solution chun liya gaya.","C option $i = 2$ wala hai, jo maximum nahi hai.","D option ka molality aadha hai par $i$ phir bhi $2$ hai."],"t":"$S$ wale row me molality aadhi hai — agar $i$ nikaalne me molality bhool jaao to yeh row trap ban jati hai."},{"id":351,"c":"Osmotic pressure","q":"Statement I: Osmotic pressure is the most preferred colligative property for determining the molar mass of polymers and proteins. Statement II: Osmotic pressure is measurable at room temperature and has a large magnitude even in very dilute solutions.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Polymers ka molar mass bahut bada hota hai; dilute solution me bhi $\\pi$ measurable hoti hai aur heating ki zaroorat nahi padti (jisse polymer degrade na ho).","m":"Statement II ko Statement I ka reason samjho.","s":["$\\pi$ dilute solution me bhi bada signal deta hai — Statement II sahi.","Isliye polymers ke liye preferred hai — Statement I sahi.","Dono correct hain, aur II hi I ka reason hai — option A."],"r":"Dono statements sahi hain aur Statement II Statement I ki wajah hai.","w":["Statement II galat nahi hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"Yaad rakho: boiling point elevation aur freezing point depression bade molar mass ke liye accurate nahi hote — $\\pi$ wahan kaam aata hai."},{"id":352,"c":"Raoult's law","q":"Statement I: The vapour pressure of a solution of a non-volatile solute in a volatile solvent is always less than the vapour pressure of the pure solvent at the same temperature. Statement II: Solute particles occupy a part of the liquid surface, so fewer solvent molecules escape into the vapour phase.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Non-volatile solute surface par aa jata hai, solvent ke escaping molecules kam ho jate hain, isliye $p$ kam hota hai.","m":"Statement II ko microscopic explanation maano.","s":["Surface occupancy ka argument sahi hai — Statement II sahi.","Isliye $p$ kam hota hai — Statement I sahi.","Dono sahi, II hi I ka explanation — option A."],"r":"Dono statements sahi hain; surface par solute ke karan vapour pressure girti hai.","w":["Statement II galat nahi hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"Non-volatile solute ka matlab: uska apna vapour pressure ~0, par wo solvent ka vapour pressure bhi kam karta hai."},{"id":353,"c":"Colligative properties","q":"Statement I: $0.1\\,\\mathrm{m}$ aqueous solutions of $\\ce{NaCl}$ and urea have the same freezing point. Statement II: The depression in freezing point of a solution depends only on the molality of the solution and not on the nature of the solute.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":3,"cpt":"$\\ce{NaCl}$ dissociate hota hai ($i = 2$) aur urea nahi ($i = 1$), isliye same molality par freezing points alag honge.","m":"Dono statements ko $\\Delta T_f = iK_fm$ se test karo.","s":["Statement I: $\\Delta T_f$ values $2 \\times 0.186 = 0.372$ aur $0.186$ — alag hain, isliye Statement I galat.","Statement II: $i$ solute ki nature par depend karta hai, isliye 'only molality' galat.","Dono statements galat — option D."],"r":"Sahi jawab D: dono statements incorrect hain.","w":["A option tab aata hai jab $i$ ko ignore kiya jaye.","B option me Statement II ko sahi maan liya gaya.","C option me Statement I ko sahi maan liya gaya."],"t":"Colligative property 'nature par depend nahi karti' — yeh sirf non-electrolytes ke liye sach hai; electrolytes me $i$ aa jata hai."},{"id":354,"c":"Isotonic solutions","q":"Statement I: Two solutions are isotonic only if they have the same molar concentration, and this holds for electrolytes as well as non-electrolytes. Statement II: Isotonic solutions have equal osmotic pressure when separated by a semipermeable membrane at the same temperature.","opt":["Both Statement I and Statement II are correct","Both Statement I and Statement II are correct but Statement II is not the correct explanation of Statement I","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Isotonicity ka matlab $\\pi$ equal. $\\pi = iCRT$, isliye electrolytes me same $\\pi$ ke liye $iC$ equal chahiye, sirf $C$ nahi.","m":"Statement I ke 'as well as non-electrolytes' part par shak karo.","s":["Statement II: equal $\\pi$ at same $T$ — sahi definition.","Statement I: electrolytes ke liye same molarity zaroori nahi (jaise $0.1\\,\\mathrm{M}$ glucose $\\approx 0.05\\,\\mathrm{M}$ $\\ce{NaCl}$ ke isotonic hai) — galat.","Isliye option C."],"r":"Sahi jawab C: Statement I galat hai, Statement II sahi hai.","w":["A option tab aata hai jab $i$ ko ignore kiya jaye.","B option me Statement I ko sahi maan liya gaya.","D option me Statement II ko galat maan liya gaya."],"t":"Isotonic condition: $i_1C_1 = i_2C_2$ at same $T$ — molarity alone kaafi nahi."},{"id":355,"c":"Abnormal molar mass","q":"Statement I: All four colligative properties give the same molar mass for a solute only when the solute neither associates nor dissociates in the solvent. Statement II: The van't Hoff factor corrects the calculated molar mass for association or dissociation of the solute.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Association/dissociation particle number badalte hain, isliye observed colligative effect expected se alag hota hai; $i$ isi ko correct karta hai.","m":"Statement II ko Statement I ka supporting reason samjho.","s":["$i$ particle number ka correction hai — Statement II sahi.","Isliye $i = 1$ par hi chaaron properties consistent molar mass dete hain — Statement I sahi.","Dono sahi, II hi I ka explanation — option A."],"r":"Dono statements sahi hain aur Statement II Statement I ko explain karta hai.","w":["Statement II galat nahi hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"Calculated molar mass me correction: $M_{\\text{normal}} = i \\times M_{\\text{observed}}$."},{"id":356,"c":"Elevation of boiling point","q":"Statement I: Adding a non-volatile solute to a solvent raises its boiling point. Statement II: A liquid boils when its vapour pressure equals the external pressure, and the solution needs a higher temperature to reach that vapour pressure.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Solution ka vapour pressure har temperature par kam hota hai, isliye $760\\,\\mathrm{mm\\,Hg}$ tak pahunchne ke liye zyada temperature chahiye.","m":"Definition of boiling point ko reason ke roop me use karo.","s":["Boiling condition: $p = p_{\\text{ext}}$ — Statement II sahi.","$p$ kam hone se zyada $T$ chahiye — Statement I sahi.","Dono sahi, II hi I ka explanation — option A."],"r":"Dono statements sahi hain; vapour pressure ki equality hi boiling point define karti hai.","w":["Statement II galat nahi hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"Isi logic se pressure cooker me paani $120\\,^{\\circ}\\mathrm{C}$ tak pahunchta hai — external pressure badhne se boiling point badhta hai."},{"id":357,"c":"Concentration terms","q":"Assertion (A): The molarity of a solution decreases when the solution is heated. Reason (R): The volume of the solution increases on heating while the amount of solute remains the same.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Molarity $= \\dfrac{n}{V}$; heating se $V$ badhta hai, $n$ same rehta hai, isliye molarity girti hai.","m":"Formula me sirf $V$ ka temperature dependence dekho.","s":["Heating par volume expand hota hai — R sahi.","$n/V$ ghat ta hai — A sahi.","R hi A ka explanation — option A."],"r":"Dono sach hain aur volume expansion hi molarity ke ghatne ka kaaran hai.","w":["R hi explanation hai.","R galat nahi hai.","A sach hai."],"t":"Isi wajah se molarity temperature-dependent hoti hai, molality nahi — practical work me molality prefer karte hain."},{"id":358,"c":"Osmotic pressure","q":"Assertion (A): A $0.1\\,\\mathrm{M}$ aqueous solution of $\\ce{NaCl}$ has a higher osmotic pressure than a $0.1\\,\\mathrm{M}$ aqueous glucose solution at the same temperature. Reason (R): $\\ce{NaCl}$ dissociates into two ions in water, so the total number of particles in the solution is almost double.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$\\pi = iCRT$; $\\ce{NaCl}$ ka $i \\approx 2$ aur glucose ka $i = 1$, isliye $\\pi$ lagbhag double.","m":"Particle count ko $\\pi$ se jodo.","s":["$\\ce{NaCl} \\rightarrow \\ce{Na+} + \\ce{Cl-}$, $i \\approx 2$ — R sahi.","$\\pi = 2CRT$ vs $CRT$ — A sahi.","R hi A ka explanation — option A."],"r":"Dono sach hain; dissociation se particle number double hone par osmotic pressure lagbhag double ho jati hai.","w":["R hi explanation hai.","R galat nahi hai.","A sach hai."],"t":"Molarity barabar hone par bhi electrolyte ka $\\pi$ zyada hota hai — yehi isotonicity ka base hai."},{"id":359,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["For dilute solutions, the depression in freezing point is directly proportional to the molality of the solute.","For a dilute solution of a non-volatile solute, the relative lowering of vapour pressure equals the mole fraction of the solute.","For a solution containing a non-volatile solute, $\\pi V = inRT$ where $n$ is the number of moles of the solute and $i$ the van't Hoff factor.","The elevation in boiling point of a solution is independent of the nature of the solvent and depends only on the solute."],"ans":3,"cpt":"$\\Delta T_b = iK_bm$; $K_b$ solvent ka property hai (ebullioscopic constant), isliye solvent ki nature se elevation badalti hai.","m":"Har option me 'kis par depend karta hai' wala part check karo.","s":["$\\Delta T_f \\propto m$ dilute solutions me — sahi.","Relative lowering $= x_2$ — sahi.","$\\pi V = inRT$ — sahi.","$\\Delta T_b$ solvent ki nature par depend karta hai — isliye 'independent of solvent' galat."],"r":"Sahi jawab D: elevation solvent ke $K_b$ par bhi depend karti hai, isliye ye statement NOT correct hai.","w":["Ye sahi statement hai.","Ye sahi statement hai.","Ye sahi statement hai."],"t":"Solute deta hai $m$ aur $i$; solvent deta hai $K_b$ ya $K_f$ — dono mil kar $\\Delta T$ banate hain."},{"id":360,"c":"Colligative properties","q":"Which of the following statements is correct?","opt":["The unit of the molal depression constant is $\\mathrm{K\\,kg\\,mol^{-1}}$.","The unit of the molal elevation constant is $\\mathrm{K\\,mol\\,kg}$.","Osmotic pressure is a colligative property that depends on the chemical nature of the solute particles.","For a solution of a volatile solute in a volatile solvent, $\\Delta T_b = K_bm$ holds exactly at all concentrations."],"ans":0,"cpt":"$\\Delta T_f = K_fm$ se $K_f$ ka unit $= \\dfrac{\\mathrm{K}}{\\mathrm{mol\\,kg^{-1}}} = \\mathrm{K\\,kg\\,mol^{-1}}$.","m":"Unit derive karo formula se, yaad se nahi.","s":["$K_f = \\dfrac{\\Delta T_f}{m}$; unit $\\mathrm{K\\,kg\\,mol^{-1}}$ — option A sahi.","$K_b$ ka unit bhi wahi hai, isliye B galat.","Colligative property nature par depend nahi karti (particle number par karti hai) — C galat.","Volatile solute ke liye simple relation modify karna padta hai — D galat."],"r":"Sahi jawab A: $K_f$ ka unit $\\mathrm{K\\,kg\\,mol^{-1}}$ hai.","w":["$K_b$ ka unit $\\mathrm{K\\,kg\\,mol^{-1}}$ hota hai, $\\mathrm{K\\,mol\\,kg}$ nahi.","Colligative property particle number par depend karti hai, nature par nahi.","Volatile solute ke liye relation exactly valid nahi rehta."],"t":"Unit derive karne ka tareeka: formula likho, unit daalo, simplify karo — ratne ki galti nahi hogi."},{"id":361,"c":"Depression of freezing point","q":"$1.5\\,\\mathrm{g}$ of a non-electrolyte of molar mass $150\\,\\mathrm{g\\,mol^{-1}}$ is dissolved in $50\\,\\mathrm{g}$ of water. The freezing point of the solution is ($K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$)","opt":["$-0.186\\,^{\\circ}\\mathrm{C}$","$-0.372\\,^{\\circ}\\mathrm{C}$","$-0.744\\,^{\\circ}\\mathrm{C}$","$-0.093\\,^{\\circ}\\mathrm{C}$"],"ans":1,"cpt":"$\\Delta T_f = K_fm$ aur molality $= \\dfrac{\\text{moles of solute}}{\\text{kg of solvent}}$.","m":"Pehle moles, phir molality (kg me solvent), phir $\\Delta T_f$.","s":["Moles $= \\dfrac{1.5}{150} = 0.010$","Molality $= \\dfrac{0.010}{0.050} = 0.20\\,\\mathrm{mol\\,kg^{-1}}$","$\\Delta T_f = 1.86 \\times 0.20 = 0.372\\,\\mathrm{K}$","Freezing point $= -0.372\\,^{\\circ}\\mathrm{C}$ — option B."],"r":"Sahi jawab B: $-0.372\\,^{\\circ}\\mathrm{C}$.","w":["A option me $100\\,\\mathrm{g}$ water le liya gaya.","C option me molality $0.40$ le li gayi.","D option me molality $0.05$ le li gayi."],"t":"Solvent $50\\,\\mathrm{g}$ hai, isliye molality $0.01/0.05 = 0.2$ hoti hai — yahan $1000$ ka factor hi sab kuch hai."},{"id":362,"c":"Osmotic pressure","q":"$6.0\\,\\mathrm{g}$ of urea ($M = 60\\,\\mathrm{g\\,mol^{-1}}$) is dissolved in water to make $500\\,\\mathrm{mL}$ of solution. The osmotic pressure at $300\\,\\mathrm{K}$ is ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$)","opt":["$2.46\\,\\mathrm{atm}$","$4.
