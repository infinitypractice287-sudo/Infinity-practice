93\\,\\mathrm{atm}$","$9.85\\,\\mathrm{atm}$","$1.23\\,\\mathrm{atm}$"],"ans":1,"cpt":"$\\pi = CRT$; urea non-electrolyte hai, isliye $i = 1$. $C$ molarity hai (moles per litre solution).","m":"Moles nikaalo, volume se divide karo, phir $RT$ se multiply.","s":["Moles $= \\dfrac{6.0}{60} = 0.10$","$C = \\dfrac{0.10}{0.500} = 0.20\\,\\mathrm{mol\\,L^{-1}}$","$\\pi = 0.20 \\times 0.0821 \\times 300 = 4.93\\,\\mathrm{atm}$","Sahi option B."],"r":"Sahi jawab B: $4.93\\,\\mathrm{atm}$.","w":["A option me $C = 0.10$ le li gayi.","C option me $C = 0.40$ le li gayi.","D option me $C = 0.05$ le li gayi."],"t":"$500\\,\\mathrm{mL} = 0.5\\,\\mathrm{L}$ — volume convert karna pehla step hai."},{"id":363,"c":"van't Hoff factor","q":"A $0.050\\,\\mathrm{m}$ aqueous solution of a weak monobasic acid freezes at $-0.1116\\,^{\\circ}\\mathrm{C}$. If $K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the degree of dissociation of the acid is","opt":["$0.10$","$0.20$","$0.40$","$0.60$"],"ans":1,"cpt":"$i = \\dfrac{\\Delta T_f}{K_fm}$; monobasic acid do particles deta hai to $i = 1 + \\alpha$.","m":"Measurement se $i$, phir $\\alpha$.","s":["$i = \\dfrac{0.1116}{1.86 \\times 0.050} = \\dfrac{0.1116}{0.093} = 1.20$","$1 + \\alpha = 1.20$","$\\alpha = 0.20$, yani $20\\%$ dissociation","Sahi option B."],"r":"Sahi jawab B: $\\alpha = 0.20$.","w":["A option tab aata hai jab $i = 1.1$ mila ho (arithmetic slip).","C option me $i = 1.4$ maan liya gaya.","D option me $i = 1.6$ maan liya gaya."],"t":"Monobasic acid ke liye $i = 1 + \\alpha$; dibasic ke liye $i = 1 + 2\\alpha$."},{"id":364,"c":"Concentration terms","q":"A $10\\%$ (w/w) aqueous solution of glucose ($M = 180\\,\\mathrm{g\\,mol^{-1}}$) has a molality of nearly","opt":["$0.56\\,\\mathrm{mol\\,kg^{-1}}$","$0.62\\,\\mathrm{mol\\,kg^{-1}}$","$0.69\\,\\mathrm{mol\\,kg^{-1}}$","$1.00\\,\\mathrm{mol\\,kg^{-1}}$"],"ans":1,"cpt":"$10\\%$ (w/w) ka matlab $10\\,\\mathrm{g}$ solute + $90\\,\\mathrm{g}$ solvent, total $100\\,\\mathrm{g}$ solution.","m":"Solvent ka mass hi molality ka denominator hota hai — solution ka nahi.","s":["Moles of glucose $= \\dfrac{10}{180} = 0.0556$","Solvent $= 90\\,\\mathrm{g} = 0.090\\,\\mathrm{kg}$","$m = \\dfrac{0.0556}{0.090} = 0.617 \\approx 0.62\\,\\mathrm{mol\\,kg^{-1}}$","Sahi option B."],"r":"Sahi jawab B: $0.62\\,\\mathrm{mol\\,kg^{-1}}$.","w":["A option me solvent $100\\,\\mathrm{g}$ le liya gaya.","C option me solute $12\\,\\mathrm{g}$ le liya gaya.","D option me $180\\,\\mathrm{g}$ solvent le liya gaya."],"t":"Percentage solutions me denominator hamesha solvent hota hai (molality) — yahi sabse bada trap hai."},{"id":365,"c":"Henry's law","q":"The Henry's law constant for the solubility of a gas in water is $1.0\\times10^{5}\\,\\mathrm{bar}$ at a given temperature. At a partial pressure of $0.50\\,\\mathrm{bar}$, the mole fraction of the gas in the solution is","opt":["$5.0\\times10^{-6}$","$5.0\\times10^{-5}$","$2.0\\times10^{-5}$","$2.0\\times10^{-6}$"],"ans":0,"cpt":"Henry's law: $p = K_H x$, isliye $x = \\dfrac{p}{K_H}$.","m":"Seedha divide karo — $K_H$ bar me hai aur $p$ bar me hai, isliye unit ka jhanjhat nahi.","s":["$x = \\dfrac{0.50}{1.0\\times10^{5}}$","$x = 5.0\\times10^{-6}$","Sahi option A."],"r":"Sahi jawab A: $5.0\\times10^{-6}$.","w":["B option me $K_H$ ko $10^{4}$ le liya gaya.","C option me $p$ ko $2\\,\\mathrm{bar}$ le liya gaya.","D option me $p$ $0.2\\,\\mathrm{bar}$ le liya gaya."],"t":"$K_H$ jitna bada, gas utni kam soluble — $K_H$ solubility ka ulta measure hai."},{"id":366,"c":"Elevation of boiling point","q":"An aqueous solution of urea boils at $100.18\\,^{\\circ}\\mathrm{C}$. The mass of urea ($M = 60\\,\\mathrm{g\\,mol^{-1}}$) dissolved per kg of water is ($K_b = 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$)","opt":["$10.4\\,\\mathrm{g}$","$20.8\\,\\mathrm{g}$","$41.6\\,\\mathrm{g}$","$5.2\\,\\mathrm{g}$"],"ans":1,"cpt":"$\\Delta T_b = 0.18\\,\\mathrm{K}$, aur $\\Delta T_b = K_bm$ se molality milti hai; per kg water me mass $= m \\times M$.","m":"Molality nikaalo, phir $1\\,\\mathrm{kg}$ water ke liye direct mass.","s":["$m = \\dfrac{0.18}{0.52} = 0.346\\,\\mathrm{mol\\,kg^{-1}}$","Mass per kg water $= 0.346 \\times 60 = 20.8\\,\\mathrm{g}$","Sahi option B."],"r":"Sahi jawab B: $20.8\\,\\mathrm{g}$.","w":["A option me $m = 0.173$ le li gayi.","C option me mass double kar diya gaya.","D option me $\\Delta T_b$ ko $0.045$ le liya gaya."],"t":"Molality already 'per kg solvent' hoti hai — isliye $1\\,\\mathrm{kg}$ water ke liye extra division nahi chahiye."},{"id":367,"c":"Osmotic pressure","q":"The osmotic pressure of a $0.050\\,\\mathrm{M}$ aqueous solution of $\\ce{K2SO4}$ at $300\\,\\mathrm{K}$, assuming complete dissociation, is ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$)","opt":["$1.23\\,\\mathrm{atm}$","$2.46\\,\\mathrm{atm}$","$3.69\\,\\mathrm{atm}$","$7.39\\,\\mathrm{atm}$"],"ans":2,"cpt":"$\\ce{K2SO4} \\rightarrow 2\\ce{K+} + \\ce{SO4^{2-}}$ — teen ions, isliye $i = 3$; $\\pi = iCRT$.","m":"$i$ pehle decide karo, phir $CRT$ nikaalo.","s":["$i = 3$","$CRT = 0.050 \\times 0.0821 \\times 300 = 1.23\\,\\mathrm{atm}$","$\\pi = 3 \\times 1.23 = 3.69\\,\\mathrm{atm}$","Sahi option C."],"r":"Sahi jawab C: $3.69\\,\\mathrm{atm}$.","w":["A option $i = 1$ ka case hai.","B option me $i = 2$ le liya gaya.","D option me $i = 6$ le liya gaya."],"t":"$\\ce{K2SO4}$ ke ions gino: do potassium aur ek sulphate — total teen."},{"id":368,"c":"Abnormal molar mass","q":"A $0.10\\,\\mathrm{m}$ solution of benzoic acid in benzene is completely dimerised. If $K_f$ for benzene is $5.12\\,\\mathrm{K\\,kg\\,mol^{-1}}$, the depression in freezing point is","opt":["$0.512\\,\\mathrm{K}$","$0.256\\,\\mathrm{K}$","$0.128\\,\\mathrm{K}$","$1.024\\,\\mathrm{K}$"],"ans":1,"cpt":"Complete dimerisation me $i = \\dfrac{1}{2}$, isliye effective particle concentration aadhi ho jati hai.","m":"$i$ pehle, phir $iK_fm$.","s":["$i = 0.5$ (poora dimer)","$\\Delta T_f = 0.5 \\times 5.12 \\times 0.10$","$\\Delta T_f = 0.256\\,\\mathrm{K}$","Sahi option B."],"r":"Sahi jawab B: $0.256\\,\\mathrm{K}$.","w":["A option tab aata hai jab $i = 1$ le liya jaye.","C option me $i = 0.25$ le liya gaya.","D option me $i = 2$ le liya gaya (association ka ulta)."],"t":"Dimer banne par particles aadhe — isliye colligative effect bhi aadha."},{"id":369,"c":"Relative lowering of vapour pressure","q":"$30\\,\\mathrm{g}$ of a non-volatile non-electrolyte is dissolved in $90\\,\\mathrm{g}$ of water. The vapour pressure of the solution is $2.9\\%$ lower than that of pure water. The molar mass of the solute is nearly","opt":["$100\\,\\mathrm{g\\,mol^{-1}}$","$150\\,\\mathrm{g\\,mol^{-1}}$","$201\\,\\mathrm{g\\,mol^{-1}}$","$402\\,\\mathrm{g\\,mol^{-1}}$"],"ans":2,"cpt":"$\\dfrac{\\Delta p}{p^{\\circ}} = x_2 = 0.029$; water ke moles $= \\dfrac{90}{18} = 5$.","m":"Mole fraction ka equation banao aur $n_2$ solve karo, phir $M = w/n$.","s":["$\\dfrac{n_2}{n_2 + 5} = 0.029$","$n_2 = 0.029(n_2 + 5) \\Rightarrow 0.971\\,n_2 = 0.145$","$n_2 = 0.1493$","$M = \\dfrac{30}{0.1493} \\approx 201\\,\\mathrm{g\\,mol^{-1}}$ — option C."],"r":"Sahi jawab C: $201\\,\\mathrm{g\\,mol^{-1}}$.","w":["A option me solute ke moles double le liye gaye.","B option me water $90\\,\\mathrm{g}$ ki jagah $150\\,\\mathrm{g}$ le liya gaya.","D option me $M$ double kar diya gaya."],"t":"$2.9\\%$ lowering ka matlab $x_2 = 0.029$ — percentage ko decimal me badlo pehle."},{"id":370,"c":"Elevation of boiling point","fig":{"type":"plot","xlab":"molality (mol kg^{-1})","ylab":"ΔT_b (K)","xmin":0,"xmax":1,"ymin":0,"ymax":1.8,"series":[{"name":"solute X","pts":[[0,0],[0.25,0.39],[0.5,0.78],[0.75,1.17],[1,1.56]],"color":"#e0a170"},{"name":"solute Y","pts":[[0,0],[0.25,0.13],[0.5,0.26],[0.75,0.39],[1,0.52]],"color":"#7fd1a0"}],"cap":"Elevation in boiling point against molality in water ($K_b = 0.52\\,\\mathrm{K\\,kg\\,mol^{-1}}$)."},"q":"The graph shows $\\Delta T_b$ against molality for two aqueous solutes $X$ and $Y$. The lines are straight. Which conclusion is correct?","opt":["$X$ is a non-electrolyte and $Y$ is $\\ce{CaCl2}$","$Y$ is a non-electrolyte and $X$ is a solute giving three ions per formula unit","Both are non-electrolytes but $X$ has a larger molar mass","$X$ shows association and $Y$ shows dissociation"],"ans":1,"cpt":"$\\Delta T_b = iK_bm$, isliye slope $= iK_b$. Yahan $K_b = 0.52$, to slope se $i$ milta hai.","m":"Dono slopes nikaalo aur $0.52$ se divide karo.","s":["$Y$ ka slope $= \\dfrac{0.52}{1} = 0.52 = 1 \\times K_b$ $\\Rightarrow i_Y = 1$.","$X$ ka slope $= \\dfrac{1.56}{1} = 1.56 = 3 \\times K_b$ $\\Rightarrow i_X = 3$.","$i = 1$ non-electrolyte; $i = 3$ teen ions dene wala solute — option B."],"r":"Sahi jawab B: $Y$ non-electrolyte hai aur $X$ teen ions deta hai.","w":["A option me lines ulti padh li gayi hain.","C option galat hai — molar mass slope me nahi aata, sirf $i$ aata hai.","D option galat hai — association me slope $K_b$ se kam hota, yahan $X$ ka slope zyada hai."],"t":"$\\Delta T$ vs $m$ graph ka slope $iK_b$ hota hai — electrolyte pehchanne ka fastest tareeka."},{"id":371,"c":"Abnormal molar mass","fig":{"type":"table","head":["Solution","Molality $(\\mathrm{mol\\,kg^{-1}})$","$\\Delta T_f$ $(\\mathrm{K})$"],"rows":[["P","0.10","0.279"],["Q","0.10","0.372"],["R","0.10","0.093"],["S","0.05","0.186"]],"cap":"Freezing point depression data for four aqueous solutions; $K_f = 1.86\\,\\mathrm{K\\,kg\\,mol^{-1}}$."},"q":"Which solution in the table shows association of the solute, and what is its van't Hoff factor?","opt":["$P$, $i = 1.5$","$R$, $i = 0.5$","$Q$, $i = 2.0$","$S$, $i = 2.0$"],"ans":1,"cpt":"Association me $i<1$ hota hai, isliye $\\Delta T_f$ expected ($K_fm$) se kam hoti hai.","m":"Har row ka $i = \\dfrac{\\Delta T_f}{K_fm}$ nikaalo aur dekho kaunsa $1$ se kam hai.","s":["$P$: $i = \\dfrac{0.279}{0.186} = 1.5$","$Q$: $i = 2.0$; $S$: $i = \\dfrac{0.186}{0.093} = 2.0$","$R$: $i = \\dfrac{0.093}{0.186} = 0.5$ — sirf yahi $1$ se kam hai","Sahi option B."],"r":"Sahi jawab B: $R$ ka $i = 0.5$, isliye yahi association dikhata hai.","w":["A option me $i>1$ hai, yani dissociation.","C option me $i = 2$ dissociation hai.","D option me molality aadhi hai par $i$ phir bhi $2$ hai."],"t":"$i<1$ ka matlab association, $i>1$ ka matlab dissociation — sign of deviation se hi pata chal jata hai."},{"id":372,"c":"Osmotic pressure","q":"Statement I: The osmotic pressure of a given solution does not change when the temperature is raised, as long as the concentration is unchanged. Statement II: The osmotic pressure of a solution is directly proportional to the absolute temperature.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"$\\pi = iCRT$ — $T$ badhne par $\\pi$ badhti hai, isliye Statement I galat hai.","m":"Formula me $T$ ka position dekho.","s":["$\\pi \\propto T$ (kelvin me) — Statement II sahi.","Isliye $T$ badhne par $\\pi$ badhegi — Statement I galat.","Sahi option C."],"r":"Sahi jawab C: Statement I galat hai, Statement II sahi hai.","w":["A option tab aata hai jab $T$ ka effect ignore kiya jaye.","B option me Statement II ko galat maan liya gaya.","D option me Statement II ko galat maan liya gaya."],"t":"$T$ hamesha kelvin me daalo — Celsius me daalne se ratio galat ho jata hai."},{"id":373,"c":"Non-ideal solutions","q":"Statement I: For a binary solution showing positive deviation from Raoult's law, $\\Delta H_{\\text{mix}}$ is positive. Statement II: In such a solution, $A$-$B$ intermolecular attractions are weaker than the $A$-$A$ and $B$-$B$ attractions.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Positive deviation = kam strong $A$-$B$ attraction $\\Rightarrow$ mixing endothermic ($\\Delta H>0$) $\\Rightarrow$ $p$ zyada.","m":"Microscopic picture se macroscopic sign nikaalo.","s":["$A$-$B$ attractions weak — Statement II sahi.","Todne ke liye energy chahiye, isliye $\\Delta H_{\\text{mix}}>0$ — Statement I sahi.","Dono sahi, II hi I ka explanation — option A."],"r":"Dono statements sahi hain; weak $A$-$B$ interaction hi positive deviation ka kaaran hai.","w":["Statement II galat nahi hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"Ethanol + acetone positive deviation ka classic example hai — ethanol ke H-bonds toot jate hain."},{"id":374,"c":"Colligative properties","q":"Statement I: $0.10\\,\\mathrm{m}$ aqueous urea and $0.10\\,\\mathrm{m}$ aqueous glucose solutions have the same osmotic pressure at the same temperature. Statement II: Urea and glucose have the same molar mass, so equal masses give equal molality.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":1,"cpt":"Dono non-electrolytes hain aur molality same hai, isliye particle concentration same $\\Rightarrow$ same $\\pi$. Par molar masses $60$ aur $180$ hain, same nahi.","m":"Statement I ko $i$ aur $m$ se test karo; Statement II me molar mass check karo.","s":["$i = 1$ dono ke liye, $m$ bhi same, isliye $\\pi$ same — Statement I sahi.","Urea $60$, glucose $180\\,\\mathrm{g\\,mol^{-1}}$ — Statement II galat.","Sahi option B."],"r":"Sahi jawab B: Statement I sahi hai, Statement II galat hai.","w":["A option me molar masses same maan liye gaye.","C option me Statement I ko galat maan liya gaya.","D option me Statement I ko galat maan liya gaya."],"t":"Colligative properties molality par depend karti hain, molar mass par nahi — isliye alag molar mass wale solutes ka same effect ho sakta hai."},{"id":375,"c":"Colligative properties","q":"Statement I: $0.10\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ and $0.10\\,\\mathrm{m}$ aqueous glucose produce the same depression in freezing point. Statement II: The depression in freezing point of a dilute solution depends only on the molality and not on whether the solute dissociates.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":3,"cpt":"$\\ce{NaCl}$ ka $i \\approx 2$, glucose ka $i = 1$ — same molality par $\\Delta T_f$ alag hoti hai.","m":"Dono statements ko $i$ ke concept se test karo.","s":["$\\Delta T_f = 2 \\times 0.186 = 0.372\\,\\mathrm{K}$ ($\\ce{NaCl}$) vs $0.186\\,\\mathrm{K}$ (glucose) — Statement I galat.","Dissociation ka effect $i$ ke through aata hai, isliye 'only molality' galat — Statement II galat.","Sahi option D."],"r":"Sahi jawab D: dono statements incorrect hain.","w":["A option me $i$ ignore kiya gaya.","B option me Statement II ko sahi maan liya gaya.","C option me Statement I ko sahi maan liya gaya."],"t":"$i$ ke bina colligative calculation aadha-adhoora hai — electrolyte questions me $i$ pehle likho."},{"id":376,"c":"Raoult's law","q":"Statement I: If a volatile solute is added to a volatile solvent and the solute is more volatile than the solvent, the total vapour pressure of the mixture can be higher than that of the pure solvent. Statement II: In an ideal solution each component obeys Raoult's law and the total vapour pressure is the sum of the partial vapour pressures of the components.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"$p = p_1^{\\circ}x_1 + p_2^{\\circ}x_2$; agar $p_2^{\\circ} > p_1^{\\circ}$, to $p$ pure solvent ke $p_1^{\\circ}$ se zyada ho sakta hai.","m":"Total pressure ka expression likho aur extreme case ($x_2$ chhota) dekho.","s":["$p - p_1^{\\circ} = x_2(p_2^{\\circ} - p_1^{\\circ}) > 0$ jab $p_2^{\\circ} > p_1^{\\circ}$ — Statement I sahi.","Raoult's law + partial pressures ka sum — Statement II sahi.","Dono sahi, II hi I ka explanation — option A."],"r":"Dono statements sahi hain; partial pressures ka sum hi total pressure ka behaviour deta hai.","w":["Statement II galat nahi hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"Non-volatile solute hamesha $p$ ghatata hai; zyada volatile solute $p$ badha bhi sakta hai."},{"id":377,"c":"Ideal solutions","q":"Statement I: Benzene and toluene form a solution that shows a large negative deviation from Raoult's law. Statement II: Benzene and toluene have very similar molecular structures and similar magnitudes of intermolecular forces.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Similar structures aur similar forces ka matlab nearly ideal solution hai — large deviation nahi.","m":"'Large negative deviation' claim par shak karo.","s":["Benzene–toluene nearly ideal hai ($\\Delta H_{\\text{mix}} \\approx 0$) — Statement I galat.","Similar structure aur forces — Statement II sahi.","Sahi option C."],"r":"Sahi jawab C: Statement I galat hai, Statement II sahi hai.","w":["A option me deviation ka magnitude galat liya gaya.","B option me Statement II ko galat maan liya gaya.","D option me Statement II ko galat maan liya gaya."],"t":"Nearly ideal pairs: benzene–toluene, n-hexane–n-heptane, chlorobenzene–bromobenzene."},{"id":378,"c":"Non-ideal solutions","q":"Assertion (A): A mixture of chloroform and acetone shows negative deviation from Raoult's law. Reason (R): Chloroform and acetone form intermolecular hydrogen bonds, which makes the $A$-$B$ interaction stronger than the $A$-$A$ and $B$-$B$ interactions.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Negative deviation = strong $A$-$B$ attraction $\\Rightarrow$ kam vapour pressure $\\Rightarrow$ $\\Delta H_{\\text{mix}}<0$.","m":"Reason ko assertion ka mechanism samjho.","s":["Chloroform ka $\\ce{H}$ acetone ke $\\ce{C=O}$ ke saath H-bond banata hai — R sahi.","Strong interaction se $p$ kam hota hai, isliye negative deviation — A sahi.","R hi A ka explanation — option A."],"r":"Dono sach hain; naye H-bonds hi negative deviation ka kaaran hain.","w":["R hi explanation hai.","R galat nahi hai.","A sach hai."],"t":"Yaad rakho: positive deviation $\\leftrightarrow$ weak $A$-$B$ forces; negative deviation $\\leftrightarrow$ strong $A$-$B$ forces."},{"id":379,"c":"Abnormal molar mass","q":"Assertion (A): The van't Hoff factor of acetic acid dissolved in benzene is greater than one. Reason (R): Acetic acid molecules dimerise in benzene through hydrogen bonding.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":3,"cpt":"Dimerisation se particles kam hote hain, isliye $i<1$ hota hai — greater than one nahi.","m":"Association/dissociation ke sign compare karo.","s":["Acetic acid benzene me dimer banata hai — R sahi.","Dimerisation se $i \\approx 0.5 < 1$, isliye A galat.","Sahi option D."],"r":"Sahi jawab D: A galat hai par R sahi hai.","w":["A option tab aata hai jab association ko $i>1$ samjha jaye.","B option bhi isi galti par based hai.","C option me R ko galat maan liya gaya."],"t":"Association $\\Rightarrow i<1$; dissociation $\\Rightarrow i>1$ — yaad rakhne ka simple rule."},{"id":380,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["The osmotic pressure of a solution is directly proportional to the absolute temperature at consta .5$ le liya gaya."],"t":"$i$ ka factor aakhir me lagao — pehle $CRT$ nikaal lo to galti pakadna aasan hota hai."},{"id":382,"c":"Isotonic solutions","q":"A glucose solution is to be made isotonic with a $0.050\\,\\mathrm{M}$ aqueous $\\ce{NaCl}$ solution at the same temperature. The mass of glucose required per litre of the solution is ($M_{\\text{glucose}} = 180\\,\\mathrm{g\\,mol^{-1}}$)","opt":["$9.0\\,\\mathrm{g}$","$18.0\\,\\mathrm{g}$","$36.0\\,\\mathrm{g}$","$4.5\\,\\mathrm{g}$"],"ans":1,"cpt":"Isotonic condition: $i_1C_1 = i_2C_2$ at same temperature. $\\ce{NaCl}$ ka $i = 2$, glucose ka $i = 1$.","m":"Effective particle concentration barabar karo.","s":["$\\ce{NaCl}$: $iC = 2 \\times 0.050 = 0.100$","Glucose: $1 \\times C = 0.100 \\Rightarrow C = 0.100\\,\\mathrm{mol\\,L^{-1}}$","Mass $= 0.100 \\times 180 = 18.0\\,\\mathrm{g}$ per litre — option B."],"r":"Sahi jawab B: $18.0\\,\\mathrm{g\\,L^{-1}}$.","w":["A option me $i_{\\ce{NaCl}}$ bhool gaye.","C option me glucose ka $i$ bhi $2$ le liya gaya.","D option me $C$ aadhi kar di gayi."],"t":"Isotonicity molarity se nahi, $i \\times C$ se decide hoti hai."},{"id":383,"c":"van't Hoff factor","fig":{"type":"table","head":["Solute ($0.05\\,\\mathrm{m}$ aqueous)","Ions per formula unit","van't Hoff factor"],"rows":[["glucose","1","1"],["$\\ce{NaCl}$","2","2"],["$\\ce{K2SO4}$","3","3"],["$\\ce{[Co(NH3)6]Cl3}$","4","4"]],"cap":"Data supplied with the question; all solutions are $0.05\\,\\mathrm{m}$ so that values are mutually consistent."},"q":"Match Column I with Column II. Column I: (a) glucose (b) $\\ce{NaCl}$ (c) $\\ce{K2SO4}$ (d) $\\ce{[Co(NH3)6]Cl3}$. Column II: (i) $i = 1$ (ii) $i = 2$ (iii) $i = 3$ (iv) $i = 4$","opt":["a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iii, d-iv","a-i, b-iii, c-ii, d-iv","a-iv, b-ii, c-iii, d-i"],"ans":0,"cpt":"Complete dissociation me $i$ = formula unit ke ions ki total count. Glucose dissociate nahi hota, isliye $i = 1$.","m":"Har solute ke ions gino.","s":["Glucose $\\rightarrow$ (i) row$ positive deviation.","Curve par maximum hai $x_A \\approx 0.4$ par.","Maximum $p$ wali composition par boiling point minimum hota hai — yahi azeotrope hai.","Sahi option A."],"r":"Sahi jawab A: positive deviation + minimum boiling azeotrope $x_A \\approx 0.4$ par.","w":["B option me deviation ka sign ulta liya gaya.","C option galat hai — beech me curve ideal line se hat jata hai.","D option galat hai — maximum ka hona hi azeotrope ka signal hai."],"t":"$p$–$x$ graph par maximum $\\Rightarrow$ minimum boiling azeotrope; minimum $\\Rightarrow$ maximum boiling azeotrope."},{"id":387,"c":"Non-ideal solutions","fig":{"type":"table","head":["Solution","Measured $p$ (mm Hg)","Raoult's law $p$ (mm Hg)"],"rows":[["P","62","70"],["Q","78","70"],["R","70","70"],["S","74","70"]],"cap":"Total vapour pressure data for four binary liquid mixtures at the same temperature."},"q":"Which solution shows negative deviation from Raoult's law?","opt":["$Q$","$S$","$P$","$R$"],"ans":2,"cpt":"Negative deviation = measured vapour pressure Raoult's law value se kam.","m":"Har row me measured aur predicted ki tulna karo.","s":["$P$: $62 < 70$ $\\Rightarrow$ negative deviation.","$Q$: $78 > 70$ $\\Rightarrow$ positive deviation.","$R$: $70 = 70$ $\\Rightarrow$ ideal.","$S$: $74 > 70$ $\\Rightarrow$ positive deviation. Sahi option C."],"r":"Sahi jawab C: solution $P$ negative deviation dikhata hai.","w":["$Q$ ka $p$ zyada hai — positive deviation.","$S$ ka $p$ bhi zyada hai — positive deviation.","$R$ ideal behaviour dikhata hai."],"t":"Comparison hamesha measured vs Raoult's law predicted — sirf measured value dekh kar conclusion mat nikaalo."},{"id":388,"c":"Concentration terms","q":"Statement I: For dilute aqueous solutions, molarity and molality are numerically almost equal. Statement II: In a dilute aqueous solution, $1\\,\\mathrm{L}$ of the solution contains nearly $1\\,\\mathrm{kg}$ of solvent, and the mass of the dissolved solute is negligible.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Dilute aqueous solution ki density lagbhag $1\\,\\mathrm{g\\,mL^{-1}}$ hoti hai, isliye $1\\,\\mathrm{L} \\approx 1\\,\\mathrm{kg}$ solution $\\approx 1\\,\\mathrm{kg}$ solvent.","m":"Statement II ko Statement I ka reason samjho.","s":["$1\\,\\mathrm{L}$ solution $\\approx 1\\,\\mathrm{kg}$, solute ka mass negligible — Statement II sahi.","Isliye $\\mathrm{mol\\,L^{-1}} \\approx \\mathrm{mol\\,kg^{-1}}$ — Statement I sahi.","Dono sahi, II hi I ka explanation — option A."],"r":"Dono statements sahi hain; dilute aqueous solution ki density $\\approx 1$ hi wajah hai.","w":["Statement II galat nahi hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"Ye approximation sirf dilute aqueous solutions ke liye hai — concentrated ya non-aqueous solutions me mat lagao."},{"id":389,"c":"Depression of freezing point","q":"Statement I: $0.10\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ has a lower freezing point than $0.10\\,\\mathrm{m}$ aqueous $\\ce{CaCl2}$. Statement II: $\\ce{CaCl2}$ gives more ions per formula unit than $\\ce{NaCl}$, so it produces a larger depression.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"$\\ce{NaCl}$ $\\rightarrow$ 2 ions, $\\ce{CaCl2}$ $\\rightarrow$ 3 ions, isliye $\\ce{CaCl2}$ ka freezing point aur zyada girta hai.","m":"$i$ values compare karo: $2$ vs $3$.","s":["$\\Delta T_f$: $\\ce{NaCl}$ $= 2 \\times 0.186 = 0.372\\,\\mathrm{K}$; $\\ce{CaCl2}$ $= 3 \\times 0.186 = 0.558\\,\\mathrm{K}$.","Isliye $\\ce{CaCl2}$ ka freezing point zyada neeche hai — Statement I galat.","Zyada ions $\\Rightarrow$ zyada depression — Statement II sahi.","Sahi option C."],"r":"Sahi jawab C: Statement I galat hai, Statement II sahi hai.","w":["A option me values ulti maan li gayi.","B option me Statement II ko galat maan liya gaya.","D option me Statement II ko galat maan liya gaya."],"t":"Zyada ions wala electrolyte hamesha zyada colligative effect deta hai (same molality par)."},{"id":390,"c":"Non-ideal solutions","q":"Statement I: An ethanol-water mixture shows positive deviation from Raoult's law. Statement II: Hydrogen bonding between ethanol and water molecules is stronger than the hydrogen bonding between water molecules themselves.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":1,"cpt":"Ethanol-water me $A$-$B$ (ethanol-water) H-bonds water-water H-bonds se weak hote hain, isliye positive deviation.","m":"Reason ka sign check karo — strong $A$-$B$ hota to negative deviation aata.","s":["Ethanol-water positive deviation dikhata hai — Statement I sahi.","Agar ethanol-water H-bond strong hota to vapour pressure kam hoti (negative deviation) — isliye Statement II galat.","Sahi option B."],"r":"Sahi jawab B: Statement I sahi hai, Statement II galat hai.","w":["A option me reason ka sign galat liya gaya.","C option me Statement I ko galat maan liya gaya.","D option me Statement I ko galat maan liya gaya."],"t":"Positive deviation ke examples: ethanol-water, ethanol-acetone, $\\ce{CS2}$-acetone — sab me $A$-$B$ forces weak hoti hain."},{"id":391,"c":"Osmotic pressure","q":"Statement I: Osmotic pressure is a better method than elevation of boiling point for determining the molar mass of a polymer. Statement II: For a given mass of a high molar mass polymer, the molality is extremely small, so $\\Delta T_b$ is too small to be measured accurately while the osmotic pressure remains measurable.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Bade molar mass par moles per kg bahut kam hote hain; isliye $\\Delta T_b$ negligible par $\\pi$ (jo directly particle count se aati hai aur dilute me bhi measurable hai) kaam ki hoti hai.","m":"Statement II ko Statement I ka quantitative reason samjho.","s":["Large molar mass $\\Rightarrow$ chhoti molality $\\Rightarrow$ bahut chhoti $\\Delta T_b$ — Statement II sahi.","Isliye $\\pi$ better method hai — Statement I sahi.","Dono sahi, II hi I ka explanation — option A."],"r":"Dono statements sahi hain; bahut chhoti $\\Delta T_b$ hi $\\pi$ ko preferable banati hai.","w":["Statement II galat nahi hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"Polymer molar mass ke liye $\\pi$ ya light scattering jaise methods use karte hain, ebullioscopy nahi."},{"id":392,"c":"Concentration terms","q":"Statement I: Molality is preferred over molarity in colligative property calculations. Statement II: The molality of a solution increases when the solution is heated, because the solvent expands.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":1,"cpt":"Molality mass-based hai, isliye temperature se nahi badalti — Statement II galat hai.","m":"Statement II me 'molality' aur 'volume expansion' ka jod dekho.","s":["Molality temperature-independent hone ki wajah se preferred hai — Statement I sahi.","Molality heating se nahi badalti (molarity badalti hai) — Statement II galat.","Sahi option B."],"r":"Sahi jawab B: Statement I sahi hai, Statement II galat hai.","w":["A option me molality ki temperature-dependence maan li gayi.","C option me Statement I ko galat maan liya gaya.","D option me Statement I ko galat maan liya gaya."],"t":"Molality $=$ mol solute per kg solvent; molarity $=$ mol solute per litre solution — sirf molarity volume par depend karti hai."},{"id":393,"c":"Elevation of boiling point","q":"Statement I: $0.10\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ and $0.10\\,\\mathrm{m}$ aqueous urea solutions have the same boiling point. Statement II: The elevation of boiling point of a solution depends only on the solvent used and not on the solute.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":3,"cpt":"$\\Delta T_b = iK_bm$: $i$ aur $m$ dono solute par depend karte hain, $K_b$ solvent par. Isliye dono statements galat hain.","m":"Formula ke factors ko solvent/solute me baanto.","s":["$\\ce{NaCl}$ ka $i \\approx 2$, urea ka $i = 1$ — boiling points alag honge, Statement I galat.","$\\Delta T_b$ solute ($m$, $i$) par bhi depend karti hai — Statement II galat.","Sahi option D."],"r":"Sahi jawab D: dono statements incorrect hain.","w":["A option me $i$ ignore kiya gaya.","B option me Statement II ko sahi maan liya gaya.","C option me Statement I ko sahi maan liya gaya."],"t":"$K_b$ solvent deta hai, $m$ aur $i$ solute dete hain — dono milkar $\\Delta T_b$ banate hain."},{"id":394,"c":"Elevation of boiling point","q":"Assertion (A): The boiling point of $0.1\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ is higher than that of $0.1\\,\\mathrm{m}$ aqueous glucose. Reason (R): $\\ce{NaCl}$ dissociates into two ions, so its effective particle concentration in solution is about twice that of glucose.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"$\\Delta T_b = iK_bm$; $i = 2$ ($\\ce{NaCl}$) vs $i = 1$ (glucose) — isliye $\\ce{NaCl}$ ka boiling point zyada.","m":"Particle count ko boiling point se jodo.","s":["$\\ce{NaCl} \\rightarrow \\ce{Na+} + \\ce{Cl-}$ — R sahi.","$\\Delta T_b$: $2 \\times 0.052 = 0.104\\,\\mathrm{K}$ vs $0.052\\,\\mathrm{K}$ — A sahi.","R hi A ka explanation — option A."],"r":"Dono sach hain; double particle concentration hi zyada elevation ka kaaran hai.","w":["R hi explanation hai.","R galat nahi hai.","A sach hai."],"t":"$0.1\\,\\mathrm{m}$ $\\ce{NaCl}$ ka bp $\\approx 100.104\\,^{\\circ}\\mathrm{C}$ hota hai (complete dissociation par)."},{"id":395,"c":"Depression of freezing point","q":"Assertion (A): Depression of freezing point can be used to determine the molar mass of a non-volatile solute. Reason (R): For a given solvent, the depression in freezing point is inversely proportional to the molality of the solution.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":2,"cpt":"$\\Delta T_f = K_fm$ — depression molality ke directly proportional hai, inversely nahi.","m":"Proportionality check karo: $\\Delta T_f$ badhti hai jab $m$ badhti hai.","s":["$\\Delta T_f$ molar mass nikalne me use hoti hai — A sahi.","$\\Delta T_f \\propto m$ (directly) — R galat.","Sahi option C."],"r":"Sahi jawab C: A sach hai par R galat hai.","w":["A option me ulta proportionality maan li gayi.","B option bhi isi galti par based hai.","D option me A ko galat maan liya gaya."],"t":"$\\Delta T_f \\propto m \\propto \\dfrac{1}{M}$ (fixed mass of solute ke liye) — isliye molar mass nikal sakte hain."},{"id":396,"c":"van't Hoff factor","q":"Assertion (A): The van't Hoff factor of a strong electrolyte is always exactly equal to the number of ions per formula unit at every concentration. Reason (R): At high concentrations, ion pairing reduces the effective number of independent particles in solution.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":3,"cpt":"Concentrated solutions me ion pairing/activity effects ke kaaran $i$ theoretical value se kam milta hai.","m":"'Always exactly' wale claim par shak karo.","s":["Ion pairing se particles kam ho jate hain — R sahi.","Isliye $i$ hamesha exactly $n$ nahi hota — A galat.","Sahi option D."],"r":"Sahi jawab D: A galat hai par R sahi hai.","w":["A option tab aata hai jab ideal dilution maan li jaye.","B option bhi isi galti par based hai.","C option me R ko galat maan liya gaya."],"t":"$i$ ka measured value dilute solution me theoretical ke sabse kareeb hota hai."},{"id":397,"c":"Colligative properties","q":"Which of the following statements is NOT correct?","opt":["Osmotic pressure can be measured with an osmometer, and the pressure just sufficient to stop osmosis is numerically equal to the osmotic pressure of the solution.","Two solutions having the same osmotic pressure at the same temperature are called isotonic solutions.","For the same molality, an electrolyte produces a smaller depression in freezing point than a non-electrolyte.","Colligative properties can be used to determine the molar masses of solutes, including polymers and proteins."],"ans":2,"cpt":"Electrolyte ke zyada particles hote hain ($i>1$), isliye depression zyada hoti hai, kam nahi.","m":"$i$ ka effect yaad karo: $\\Delta T_f = iK_fm$.","s":["Osmometer se $\\pi$ ki measurement sahi hai.","Isotonic ki definition sahi hai.","Electrolyte ka $\\Delta T_f$ zyada hota hai, kam nahi — ye statement galat.","Molar mass determination sahi hai (especially $\\pi$ se)."],"r":"Sahi jawab C: electrolyte larger (not smaller) depression deta hai.","w":["Ye sahi statement hai.","Ye sahi statement hai.","Ye sahi statement hai."],"t":"$i>1$ ka matlab hamesha bada colligative effect — sign of deviation yaad rakho."},{"id":398,"c":"Non-ideal solutions","q":"Which of the following statements is correct?","opt":["For a solution showing positive deviation from Raoult's law, after mixing the molecules find it easier to escape into the vapour phase.","For a solution showing positive deviation, $\\Delta H_{\\text{mix}} < 0$ and $\\Delta V_{\\text{mix}} < 0$.","For a solution showing negative deviation, the vapour pressure is smaller than the Raoult's law value and the solution may form a maximum boiling azeotrope.","Azeotropic mixtures can be separated into pure components by fractional distillation."],"ans":2,"cpt":"Negative deviation: strong $A$-$B$ forces, $p$ kam, $\\Delta H<0$, $\\Delta V<0$, maximum boiling azeotrope.","m":"Har option me sign aur consequence match karo.","s":["Positive deviation ka matlab molecules ke liye escape karna aasan hota hai — par ye option ka wording aage check karne par ye sahi statement hai? Nahi — option A ka matlab sahi hai bas ye partial explanation hai.","Option B galat hai kyunki positive deviation ke liye $\\Delta H>0$, $\\Delta V>0$.","Option C poori tarah sahi hai: $p$ kam aur maximum boiling azeotrope possible.","Azeotropes fractional distillation se alag nahi hote — option D galat."],"r":"Sahi jawab C: negative deviation me $p$ kam hoti hai aur maximum boiling azeotrope ban sakta hai.","w":["Option A positive deviation ki sahi definition nahi deta (escape karna aasan hona $\\Delta H>0$ ke saath aata hai, par option apoorva hai aur option C poora sahi hai).","Option B me dono signs galat hain.","Option D galat hai — azeotropes constant boiling par distill hote hain."],"t":"Azeotrope ko simple/fractional distillation se separate nahi kar sakte — ye sirf composition badle bina distill hota hai."},{"id":399,"c":"Formulae","fig":{"type":"table","head":["Expression","Quantity"],"rows":[["$\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2$","relative lowering of vapour pressure"],["$\\Delta T_b = iK_bm$","elevation of boiling point"],["$\\Delta T_f = iK_fm$","depression of freezing point"],["$\\pi = iCRT$","osmotic pressure"]],"cap":"Four standard colligative relations."},"q":"Match Column I with Column II. Column I: (a) relative lowering of vapour pressure (b) elevation of boiling point (c) depression of freezing point (d) osmotic pressure. Column II: (i) $\\Delta T_b = iK_bm$ (ii) $\\pi = iCRT$ (iii) $\\dfrac{p^{\\circ}-p}{p^{\\circ}} = x_2$ (iv) $\\Delta T_f = iK_fm$","opt":["a-i, b-iii, c-iv, d-ii","a-iii, b-i, c-iv, d-ii","a-iii, b-iv, c-i, d-ii","a-ii, b-i, c-iii, d-iv"],"ans":1,"cpt":"Har property ka apna standard relation hai — inhe symbol ke saath yaad rakho.","m":"Formula me symbol pehchano: $K_b$ boiling, $K_f$ freezing, $CRT$ osmotic, $x_2$ vapour pressure.","s":["Relative lowering $\\rightarrow$ (iii) $x_2$.","Elevation $\\rightarrow$ (i) $K_bm$.","Depression $\\rightarrow$ (iv) $K_fm$.","Osmotic pressure $\\rightarrow$ (ii) $CRT$."],"r":"Sahi mapping a-iii, b-i, c-iv, d-ii — option B.","w":["A option me relative lowering aur elevation ki values swap ho gayi hain.","C option me $K_f$ aur $K_b$ swap ho gaye hain.","D option me $CRT$ galat property ke saath jod diya gaya."],"t":"$K_b$ = ebullioscopic (boiling), $K_f$ = cryoscopic (freezing) — naam se hi yaad ho jata hai."},{"id":400,"c":"van't Hoff factor","q":"The osmotic pressure of a $0.10\\,\\mathrm{M}$ aqueous solution of a weak monobasic electrolyte is $4.674\\,\\mathrm{atm}$ at $300\\,\\mathrm{K}$. The van't Hoff factor and the degree of dissociation are ($R = 0.0821\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$)","opt":["$i = 1.90$, $\\alpha = 0.90$","$i = 1.90$, $\\alpha = 0.45$","$i = 0.90$, $\\alpha = 0.90$","$i = 2.00$, $\\alpha = 1.00$"],"ans":0,"cpt":"$\\pi = iCRT \\Rightarrow i = \\dfrac{\\pi}{CRT}$; monobasic electrolyte do ions deta hai, isliye $i = 1 + \\alpha$.","m":"Pehle $i$ measurement se, phir $\\alpha$ formula se.","s":["$CRT = 0.10 \\times 0.0821 \\times 300 = 2.463\\,\\mathrm{atm}$","$i = \\dfrac{4.674}{2.463} = 1.90$","$1 + \\alpha = 1.90 \\Rightarrow \\alpha = 0.90$, yani $90\\%$ dissociation","Sahi option A."],"r":"Sahi jawab A: $i = 1.90$ aur $\\alpha = 0.90$.","w":["B option me $\\alpha$ ko $i$ se confuse kar diya gaya.","C option me $i$ ko $\\alpha$ samajh liya gaya.","D option complete dissociation ka case hai ($\\pi$ tab $4.93\\,\\mathrm{atm}$ hoti)."],"t":"$i = 1 + \\alpha$ aur $\\alpha = i - 1$ — yeh relation monobasic weak acid/base ke liye sabse zyada poocha jata hai."}]</script>
<script>
(function(){
  "use strict";

  var QUESTIONS = [];
  try { QUESTIONS = JSON.parse(document.getElementById('qdata').textContent); } catch(e) { QUESTIONS = []; }
  /* HTML-special characters ko escape karo: '<' '>' math ke andar bhi aate hain,
     warna browser unhe tag samajh kar text drop kar deta hai. */
  (function sanitize(){
    function f(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    (QUESTIONS||[]).forEach(function(q){
      ['q','cpt','m','r','t','c'].forEach(function(k){ if(typeof q[k]==='string') q[k]=f(q[k]); });
      ['opt','s','w'].forEach(function(k){ if(Array.isArray(q[k])) q[k]=q[k].map(f); });
      if(q.fig){
        if(typeof q.fig.cap==='string') q.fig.cap=f(q.fig.cap);
        if(Array.isArray(q.fig.head)) q.fig.head=q.fig.head.map(f);
        if(Array.isArray(q.fig.rows)) q.fig.rows=q.fig.rows.map(function(r){ return r.map(f); });
      }
    });
  })();
  var N = QUESTIONS.length;
  var KEY = 'mcq_all_v1';
  var MAXMARKS = 4 * N;

  var state = { cur:0, answers:{}, submitted:false, view:'quiz' };

  /* ---------------- storage ---------------- */
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        cur:state.cur, answers:state.answers, submitted:state.submitted, view:state.view
      }));
    }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var o = JSON.parse(raw);
      if(o && typeof o==='object'){
        state.answers = o.answers || {};
        state.cur = (typeof o.cur==='number' && o.cur>=0 && o.cur<N) ? o.cur : 0;
        state.submitted = !!o.submitted;
        state.view = o.submitted ? 'summary' : 'quiz';
      }
    }catch(e){}
  }

  /* ---------------- math rendering ---------------- */
  function mathify(el){
    if(!el) return;
    if(window.renderMathInElement){
      try{
        window.renderMathInElement(el, {
          delimiters:[
            {left:'$$', right:'$$', display:true},
            {left:'$', right:'$', display:false}
          ],
          throwOnError:false,
          ignoredTags:['script','noscript','style','textarea','pre','code','option'],
          ignoredClasses:['katex','no-math']
        });
        return;
      }catch(e){ /* fall through */ }
    }
    fallbackMath(el);
  }
  function cleanTex(s){
    s = String(s);
    // /frac{a}{b} -> (a)/(b)  (handles one level of nesting inside each argument)
    var guard = 0;
    while(/\\[dt]?frac\{/.test(s) && guard++ < 40){
      s = s.replace(/\\[dt]?frac\{((?:[^{}]|\{[^{}]*\})*)\}\{((?:[^{}]|\{[^{}]*\})*)\}/, function(_, a, b){
        var fa = a.replace(/\\[dt]?frac\{((?:[^{}]|\{[^{}]*\})*)\}\{((?:[^{}]|\{[^{}]*\})*)\}/g, function(m,x,y){ return x+'/'+y; });
        var fb = b.replace(/\\[dt]?frac\{((?:[^{}]|\{[^{}]*\})*)\}\{((?:[^{}]|\{[^{}]*\})*)\}/g, function(m,x,y){ return x+'/'+y; });
        return '(' + fa + ')/(' + fb + ')';
      });
    }
    s = s.replace(/\\[,;:!]/g, ' ').replace(/\\quad|\\qquad/g, '  ').replace(/\\ /g, ' ');
    s = s.replace(/\\ce\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g, '$1');
    s = s.replace(/\\mathrm\{([^{}]*)\}/g, '$1');
    s = s.replace(/\\text\{([^{}]*)\}/g, '$1');
    s = s.replace(/\^\{?\\circ\}?/g, '\u00b0');
    s = s.replace(/\\times/g, '\u00d7').replace(/\\to/g, '\u2192').replace(/\\rightarrow/g, '\u2192');
    s = s.replace(/\\le/g, '\u2264').replace(/\\ge/g, '\u2265').replace(/\\approx/g, '\u2248');
    s = s.replace(/\\pi/g, '\u03c0').replace(/\\Delta/g, '\u0394').replace(/\\alpha/g, '\u03b1').replace(/\\circ/g,'\u00b0');
    s = s.replace(/\\left|\\right/g, '');
    var sub = {'0':'\u2080','1':'\u2081','2':'\u2082','3':'\u2083','4':'\u2084','5':'\u2085','6':'\u2086','7':'\u2087','8':'\u2088','9':'\u2089','+':'\u208a','-':'\u208b','x':'\u2093','a':'\u2090','e':'\u2091','o':'\u2092'};
    var sup = {'0':'\u2070','1':'\u00b9','2':'\u00b2','3':'\u00b3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079','+':'\u207a','-':'\u207b','n':'\u207f','i':'\u2071'};
    function conv(t, map){ return t.split('').map(function(ch){ return map[ch]!==undefined?map[ch]:ch; }).join(''); }
    s = s.replace(/_\{([^{}]*)\}/g, function(_,t){ return conv(t, sub); });
    s = s.replace(/\^\{([^{}]*)\}/g, function(_,t){ return conv(t, sup); });
    s = s.replace(/_(\w)/g, function(_,t){ return conv(t, sub); });
    s = s.replace(/\^(\w)/g, function(_,t){ return conv(t, sup); });
    s = s.replace(/\\[a-zA-Z]+/g, '');
    s = s.replace(/[{}]/g, '');
    return s;
  }
  function fallbackMath(el){
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [], n;
    while((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(function(node){
      var t = node.nodeValue;
      if(t.indexOf('$') === -1) return;
      var out = t.replace(/\$\$([\s\S]+?)\$\$/g, function(_,x){ return cleanTex(x); })
                 .replace(/\$([^$]+?)\$/g, function(_,x){ return cleanTex(x); });
      node.nodeValue = out;
    });
  }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ---------------- SVG helpers ---------------- */
  function lbl(s){
    // markup: _{..} subscript, ^{..} superscript
    var out = esc(s);
    out = out.replace(/_\{([^{}]*)\}/g, '<tspan baseline-shift="sub" font-size="72%">$1</tspan>');
    out = out.replace(/\^\{([^{}]*)\}/g, '<tspan baseline-shift="super" font-size="72%">$1</tspan>');
    return out;
  }
  function plotSVG(spec){
    var W = 560, H = 330, ml = 64, mr = 18, mt = 22, mb = 52;
    var iw = W - ml - mr, ih = H - mt - mb;
    var xmin = spec.xmin!==undefined?spec.xmin:0, xmax = spec.xmax!==undefined?spec.xmax:1;
    var ymin = spec.ymin!==undefined?spec.ymin:0, ymax = spec.ymax!==undefined?spec.ymax:100;
    function X(v){ return ml + (v-xmin)/(xmax-xmin)*iw; }
    function Y(v){ return mt + ih - (v-ymin)/(ymax-ymin)*ih; }
    var s = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#1b1f27"/>';
    // grid
    var gx = spec.xgrid || 5, gy = spec.ygrid || 5, k;
    for(k=0;k<=gx;k++){
      var xv = xmin + (xmax-xmin)*k/gx, px = X(xv);
      s += '<line x1="'+px.toFixed(1)+'" y1="'+mt+'" x2="'+px.toFixed(1)+'" y2="'+(mt+ih)+'" stroke="#2b313d" stroke-width="1"/>';
      s += '<text x="'+px.toFixed(1)+'" y="'+(mt+ih+21)+'" fill="#9aa3b2" font-size="12.5" text-anchor="middle">'+esc(fmt(xv))+'</text>';
    }
    for(k=0;k<=gy;k++){
      var yv = ymin + (ymax-ymin)*k/gy, py = Y(yv);
      s += '<line x1="'+ml+'" y1="'+py.toFixed(1)+'" x2="'+(ml+iw)+'" y2="'+py.toFixed(1)+'" stroke="#2b313d" stroke-width="1"/>';
      s += '<text x="'+(ml-9)+'" y="'+(py+4).toFixed(1)+'" fill="#9aa3b2" font-size="12.5" text-anchor="end">'+esc(fmt(yv))+'</text>';
    }
    // axes
    s += '<line x1="'+ml+'" y1="'+(mt+ih)+'" x2="'+(ml+iw)+'" y2="'+(mt+ih)+'" stroke="#dcdfe4" stroke-width="1.6"/>';
    s += '<line x1="'+ml+'" y1="'+(mt+ih)+'" x2="'+ml+'" y2="'+mt+'" stroke="#dcdfe4" stroke-width="1.6"/>';
    // axis labels
    s += '<text x="'+(ml+iw/2)+'" y="'+(H-10)+'" fill="#c9d1e0" font-size="14" text-anchor="middle">'+lbl(spec.xlab||'')+'</text>';
    s += '<text x="16" y="'+(mt+ih/2)+'" fill="#c9d1e0" font-size="14" text-anchor="middle" transform="rotate(-90 16 '+(mt+ih/2)+')">'+lbl(spec.ylab||'')+'</text>';
    // series
    var colors = ['#7aa2f7','#5fbf8a','#e0a97a','#c99af0','#e0797a'];
    (spec.series||[]).forEach(function(se, idx){
      var col = se.color || colors[idx % colors.length];
      var pts = (se.pts||[]).map(function(p){ return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1); }).join(' ');
      var dash = se.dash ? ' stroke-dasharray="6 5"' : '';
      s += '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.6"'+dash+' stroke-linejoin="round"/>';
      if(se.dots !== false){
        (se.pts||[]).forEach(function(p){
          s += '<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="3.6" fill="'+col+'"/>';
        });
      }
    });
    // legend
    var ly = mt + 8;
    (spec.series||[]).forEach(function(se, idx){
      if(!se.name) return;
      var col = se.color || colors[idx % colors.length];
      s += '<line x1="'+(ml+iw-150)+'" y1="'+ly+'" x2="'+(ml+iw-124)+'" y2="'+ly+'" stroke="'+col+'" stroke-width="2.6"'+(se.dash?' stroke-dasharray="6 5"':'')+'/>';
      s += '<text x="'+(ml+iw-118)+'" y="'+(ly+4)+'" fill="#c9d1e0" font-size="12.5">'+lbl(se.name)+'</text>';
      ly += 18;
    });
    s += '</svg>';
    if(spec.cap) s += '<div class="figcap">'+spec.cap+'</div>';
    return s;
  }
  function fmt(v){
    if(Math.abs(v) >= 1000) return String(Math.round(v));
    if(Math.abs(v) >= 10) return String(Math.round(v*10)/10);
    return String(Math.round(v*100)/100);
  }
  function tableHTML(spec){
    var s = '<table class="figtable">';
    if(spec.head){
      s += '<thead><tr>' + spec.head.map(function(h){ return '<th>'+h+'</th>'; }).join('') + '</tr></thead>';
    }
    s += '<tbody>' + (spec.rows||[]).map(function(r){
      return '<tr>' + r.map(function(c){ return '<td>'+c+'</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table>';
    if(spec.cap) s += '<div class="figcap">'+spec.cap+'</div>';
    return s;
  }
  function osmosisSVG(){
    var s = '<svg viewBox="0 0 560 300" width="560" height="300" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect x="0" y="0" width="560" height="300" fill="#1b1f27"/>';
    s += '<rect x="40" y="60" width="480" height="190" fill="none" stroke="#dcdfe4" stroke-width="2" rx="6"/>';
    s += '<rect x="40" y="110" width="230" height="140" fill="#26405f" opacity="0.75"/>';
    s += '<rect x="290" y="90" width="230" height="160" fill="#2f4a37" opacity="0.75"/>';
    s += '<line x1="280" y1="60" x2="280" y2="250" stroke="#e0a97a" stroke-width="4" stroke-dasharray="7 6"/>';
    s += '<text x="280" y="282" fill="#e0a97a" font-size="13" text-anchor="middle">' + lbl('Semipermeable membrane') + '</text>';
    s += '<text x="155" y="88" fill="#cfd6e4" font-size="14" text-anchor="middle">' + lbl('P : 0.1 M glucose') + '</text>';
    s += '<text x="405" y="80" fill="#cfd6e4" font-size="14" text-anchor="middle">' + lbl('Q : 0.1 M NaCl') + '</text>';
    s += '<circle cx="110" cy="170" r="5" fill="#9ad3ff"/><circle cx="190" cy="200" r="5" fill="#9ad3ff"/>';
    s += '<circle cx="350" cy="150" r="4.5" fill="#f5b1b1"/><circle cx="430" cy="195" r="4.5" fill="#f5b1b1"/><circle cx="470" cy="140" r="4.5" fill="#f5b1b1"/>';
    s += '<text x="40" y="40" fill="#9aa3b2" font-size="13">' + lbl('Dono taraf same level, same temperature') + '</text>';
    s += '</svg>';
    return s;
  }
  function roSVG(){
    var s = '<svg viewBox="0 0 560 280" width="560" height="280" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect x="0" y="0" width="560" height="280" fill="#1b1f27"/>';
    s += '<rect x="60" y="70" width="440" height="150" fill="none" stroke="#dcdfe4" stroke-width="2" rx="6"/>';
    s += '<rect x="60" y="70" width="200" height="150" fill="#2f4a37" opacity="0.8"/>';
    s += '<rect x="330" y="70" width="170" height="150" fill="#26405f" opacity="0.8"/>';
    s += '<line x1="262" y1="70" x2="262" y2="220" stroke="#e0a97a" stroke-width="4" stroke-dasharray="7 6"/>';
    s += '<line x1="328" y1="70" x2="328" y2="220" stroke="#e0a97a" stroke-width="4" stroke-dasharray="7 6"/>';
    s += '<text x="295" y="248" fill="#e0a97a" font-size="12.5" text-anchor="middle">' + lbl('Membrane') + '</text>';
    s += '<text x="160" y="60" fill="#cfd6e4" font-size="13.5" text-anchor="middle">' + lbl('Pure water (product)') + '</text>';
    s += '<text x="415" y="60" fill="#cfd6e4" font-size="13.5" text-anchor="middle">' + lbl('Sea water + applied pressure') + '</text>';
    s += '<line x1="520" y1="145" x2="440" y2="145" stroke="#7aa2f7" stroke-width="3"/>';
    s += '<polygon points="440,138 426,145 440,152" fill="#7aa2f7"/>';
    s += '<text x="530" y="130" fill="#7aa2f7" font-size="13" text-anchor="end">' + lbl('p > pi') + '</text>';
    s += '<line x1="240" y1="175" x2="150" y2="175" stroke="#5fbf8a" stroke-width="3"/>';
    s += '<polygon points="150,168 136,175 150,182" fill="#5fbf8a"/>';
    s += '<text x="245" y="196" fill="#5fbf8a" font-size="12.5" text-anchor="end">' + lbl('water flow') + '</text>';
    s += '</svg>';
    return s;
  }
  function levelSVG(){
    var s = '<svg viewBox="0 0 520 300" width="520" height="300" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect x="0" y="0" width="520" height="300" fill="#1b1f27"/>';
    s += '<rect x="70" y="90" width="380" height="170" fill="#26405f" opacity="0.55"/>';
    s += '<path d="M70 110 L250 110 L250 90 L450 90" fill="none" stroke="#7aa2f7" stroke-width="3"/>';
    s += '<line x1="70" y1="90" x2="450" y2="90" stroke="#dcdfe4" stroke-width="1.5" stroke-dasharray="5 5"/>';
    s += '<text x="260" y="82" fill="#7aa2f7" font-size="13">' + lbl('solution level in tube') + '</text>';
    s += '<line x1="70" y1="110" x2="70" y2="260" stroke="#dcdfe4" stroke-width="2"/>';
    s += '<line x1="450" y1="110" x2="450" y2="260" stroke="#dcdfe4" stroke-width="2"/>';
    s += '<line x1="70" y1="260" x2="250" y2="260" stroke="#dcdfe4" stroke-width="2"/>';
    s += '<line x1="250" y1="260" x2="450" y2="260" stroke="#dcdfe4" stroke-width="2"/>';
    s += '<line x1="250" y1="110" x2="250" y2="260" stroke="#e0a97a" stroke-width="4" stroke-dasharray="7 6"/>';
    s += '<text x="250" y="282" fill="#e0a97a" font-size="13" text-anchor="middle">' + lbl('Semipermeable membrane') + '</text>';
    s += '<text x="160" y="130" fill="#cfd6e4" font-size="13.5">' + lbl('pure solvent') + '</text>';
    s += '<text x="345" y="130" fill="#cfd6e4" font-size="13.5">' + lbl('solution') + '</text>';
    s += '<text x="380" y="72" fill="#5fbf8a" font-size="13">' + lbl('h = osmotic pressure head') + '</text>';
    s += '</svg>';
    return s;
  }
  function figHTML(fig){
    if(!fig) return '';
    var inner = '';
    if(fig.type === 'table') inner = tableHTML(fig);
    else if(fig.type === 'plot') inner = plotSVG(fig);
    else if(fig.type === 'osmosis') inner = osmosisSVG();
    else if(fig.type === 'ro') inner = roSVG();
    else if(fig.type === 'level') inner = levelSVG();
    else if(fig.type === 'html') inner = fig.html;
    if(!inner) return '';
    var cls = (fig.type === 'table') ? 'figwrap' : 'figwrap no-math';
    var cap = '';
    if(fig.cap){
      cap = '<div class="figcap">' + fig.cap + '</div>';
      inner = inner.split('<div class="figcap">')[0];
    }
    return '<div class="' + cls + '">' + inner + '</div>' + cap;
  }

  /* ---------------- simulation ---------------- */
  function simHTML(q){
    var sim = q.sim;
    if(!sim) return '';
    var id = 'sim' + q.id;
    var s = '<div class="simbox" id="'+id+'"><h5>'+esc(sim.title||'Simulation')+'</h5>';
    (sim.sliders||[]).forEach(function(sl, i){
      s += '<div class="simrow"><label for="'+id+'_s'+i+'">'+cleanTex(sl.label)+'</label>';
      s += '<input type="range" id="'+id+'_s'+i+'" data-i="'+i+'" min="'+sl.min+'" max="'+sl.max+'" step="'+sl.step+'" value="'+sl.val+'">';
      s += '<span class="simval" id="'+id+'_v'+i+'">'+sl.val+'</span></div>';
    });
    s += '<div class="simout" id="'+id+'_out"></div></div>';
    return s;
  }
  function wireSim(q){
    var sim = q.sim; if(!sim) return;
    var box = document.getElementById('sim'+q.id); if(!box) return;
    var inputs = box.querySelectorAll('input[type=range]');
    var names = (sim.sliders||[]).map(function(s){ return s.name; });
    function run(){
      var vals = [];
      for(var i=0;i<inputs.length;i++){
        vals.push(parseFloat(inputs[i].value));
        var vv = document.getElementById('sim'+q.id+'_v'+i);
        if(vv) vv.textContent = inputs[i].value;
      }
      var res;
      try{
        var f = new Function(names.join(','), sim.calc);
        res = f.apply(null, vals);
      }catch(e){ res = [['error', String(e.message)]]; }
      var out = document.getElementById('sim'+q.id+'_out');
      if(out && res){
        out.innerHTML = res.map(function(pair){
          return '<div>'+pair[0]+' = <b>'+pair[1]+'</b></div>';
        }).join('');
      }
    }
    for(var i=0;i<inputs.length;i++){ inputs[i].addEventListener('input', run); }
    run();
  }

  /* ---------------- state helpers ---------------- */
  function rec(id){ return state.answers[id]; }
  function isCorrect(id){
    var r = rec(id);
    if(!r) return false;
    return r.sel === QUESTIONS[id-1].ans;
  }
  function stats(){
    var correct=0, wrong=0, unatt=0;
    for(var i=0;i<N;i++){
      var r = rec(QUESTIONS[i].id);
      if(!r) unatt++;
      else if(r.sel === QUESTIONS[i].ans) correct++;
      else wrong++;
    }
    return {correct:correct, wrong:wrong, unatt:unatt, score:correct*4-wrong, answered:correct+wrong};
  }
  function topbar(){
    var st = stats();
    document.getElementById('scoreChip').textContent = st.score;
    document.getElementById('ansChip').textContent = st.answered;
    document.getElementById('progressBar').style.width = (st.answered/N*100).toFixed(2)+'%';
  }
  var LETTERS = ['A','B','C','D'];

  function showConfirm(title, msg, yesLabel, onYes){
    var ov = document.getElementById('overlay');
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mText').textContent = msg;
    document.getElementById('mYes').textContent = yesLabel || 'Yes';
    ov.classList.add('on');
    function close(){ ov.classList.remove('on'); document.getElementById('mYes').onclick = null; document.getElementById('mNo').onclick = null; }
    document.getElementById('mYes').onclick = function(){ close(); onYes(); };
    document.getElementById('mNo').onclick = close;
  }

  /* ---------------- quiz view ---------------- */
  function renderQuiz(){
    state.view = 'quiz';
    var bnq = document.getElementById('bottomNav'); if(bnq) bnq.style.display = 'block';
    var app = document.getElementById('app');
    var q = QUESTIONS[state.cur];
    if(!q){ app.innerHTML = '<div class="card">No questions loaded.</div>'; return; }
    var r = rec(q.id);
    var answered = !!r;
    var html = '';
    html += '<div class="card">';
    html += '<div class="qtop"><span class="qnum">Q'+q.id+' <span class="hash">/ '+N+'</span></span><span class="tag">'+esc(q.c||'Solutions')+'</span></div>';
    html += '<div class="qtext">'+q.q+'</div>';
    html += figHTML(q.fig);
    html += simHTML(q);
    // options
    html += '<div id="opts">';
    for(var i=0;i<4;i++){
      var cls = 'opt';
      if(answered){
        cls += ' locked';
        if(i === q.ans) cls += ' correct';
        else if(i === r.sel) cls += ' wrong';
      }
      html += '<button class="'+cls+'" data-i="'+i+'" '+(answered?'disabled':'')+'>'+
              '<span class="ltr">'+LETTERS[i]+'</span><span class="ot">'+(q.opt[i]||'')+'</span></button>';
    }
    html += '</div>';
    if(answered){
      var ok = r.sel === q.ans;
      html += '<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Sahi jawab':'Galat jawab')+'</div>';
      html += explanationHTML(q, r);
    }
    html += '</div>';
    app.innerHTML = html;
    topbar();

    if(!answered){
      var btns = app.querySelectorAll('.opt');
      for(var k=0;k<btns.length;k++){
        btns[k].addEventListener('click', function(){
          var idx = parseInt(this.getAttribute('data-i'), 10);
          state.answers[q.id] = {sel: idx};
          save(); renderQuiz();
        });
      }
    }
    mathify(app);
    wireSim(q);
    document.getElementById('btnPrev').disabled = (state.cur === 0);
    document.getElementById('btnNext').disabled = (state.cur >= N-1);
    document.getElementById('btnSkip').disabled = answered;
    document.getElementById('btnGrid').textContent = 'Questions';
    document.getElementById('btnSubmit').style.display = '';
  }

  function explanationHTML(q, r){
    var h = '<div class="expl">';
    h += '<h4>Concept (zero se)</h4><p>'+(q.cpt||'')+'</p>';
    if(q.m) h += '<h4>Method aur kyun</h4><p>'+q.m+'</p>';
    if(q.s && q.s.length){
      h += '<h4>Step by step</h4><ol>';
      q.s.forEach(function(st){ h += '<li>'+st+'</li>'; });
      h += '</ol>';
    }
    h += '<div class="ansline">Sahi jawab: <b>('+LETTERS[q.ans]+')</b> '+q.opt[q.ans]+'</div>';
    if(q.r) h += '<h4>Sahi option ka reason</h4><p>'+q.r+'</p>';
    if(q.w && q.w.length){
      h += '<h4>Galat options kyun galat</h4><ul>';
      var wi = 0;
      for(var i=0;i<4;i++){
        if(i === q.ans) continue;
        if(q.w[wi]) h += '<li><b>('+LETTERS[i]+')</b> '+q.w[wi]+'</li>';
        wi++;
      }
      h += '</ul>';
    }
    if(q.t) h += '<div class="tipbox"><b>Tip:</b> '+q.t+'</div>';
    h += '</div>';
    return h;
  }

  /* ---------------- grid view ---------------- */
  function renderGrid(){
    state.view = 'grid';
    var app = document.getElementById('app');
    var st = stats();
    var h = '<div class="card"><div class="qtop"><span class="qnum">Question Grid</span><span class="tag">'+st.answered+' answered &middot; '+st.unatt+' left</span></div>';
    h += '<div class="toolbar">';
    h += '<select id="flt"><option value="all">All</option><option value="ans">Answered</option><option value="unans">Unanswered</option></select>';
    h += '<input type="number" id="goq" min="1" max="'+N+'" placeholder="Go to Q">';
    h += '<button class="btn" id="goBtn" style="flex:0 0 auto;padding:0 16px">Go</button>';
    h += '<button class="btn" id="closeGrid" style="flex:0 0 auto;padding:0 16px">Back</button>';
    h += '</div>';
    h += '<div class="gridpanel" id="gridpanel"></div></div>';
    app.innerHTML = h;
    buildGrid('all');
    document.getElementById('flt').addEventListener('change', function(){ buildGrid(this.value); });
    document.getElementById('goBtn').addEventListener('click', function(){
      var v = parseInt(document.getElementById('goq').value, 10);
      if(v>=1 && v<=N){ state.cur = v-1; save(); renderQuiz(); }
    });
    document.getElementById('goq').addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        var v = parseInt(this.value, 10);
        if(v>=1 && v<=N){ state.cur = v-1; save(); renderQuiz(); }
      }
    });
    document.getElementById('closeGrid').addEventListener('click', function(){ renderQuiz(); });
    topbar();
  }
  function buildGrid(filter){
    var panel = document.getElementById('gridpanel');
    if(!panel) return;
    var h = '';
    for(var i=0;i<N;i++){
      var q = QUESTIONS[i];
      var r = rec(q.id);
      var cls = 'gcell';
      if(r) cls += (r.sel === q.ans ? ' done-ok' : ' done-bad');
      if(i === state.cur) cls += ' cur';
      if(filter === 'ans' && !r) continue;
      if(filter === 'unans' && r) continue;
      h += '<button class="'+cls+'" data-i="'+i+'">'+q.id+'</button>';
    }
    panel.innerHTML = h || '<div class="mini">Is filter me koi question nahi.</div>';
    var cells = panel.querySelectorAll('.gcell');
    for(var k=0;k<cells.length;k++){
      cells[k].addEventListener('click', function(){
        state.cur = parseInt(this.getAttribute('data-i'),10);
        save(); renderQuiz();
      });
    }
  }

  /* ---------------- summary / review ---------------- */
  function renderSummary(){
    state.view = 'summary';
    var bns = document.getElementById('bottomNav'); if(bns) bns.style.display = 'none';
    var st = stats();
    var acc = (st.correct+st.wrong) ? (st.correct/(st.correct+st.wrong)*100) : 0;
    var h = '<div class="card">';
    h += '<div class="qtop"><span class="qnum">Result</span><span class="tag">Submitted</span></div>';
    h += '<div class="statgrid">';
    h += '<div class="stat"><div class="k">Score</div><div class="v">'+st.score+' / '+MAXMARKS+'</div></div>';
    h += '<div class="stat"><div class="k">Correct (+4)</div><div class="v" style="color:#5fbf8a">'+st.correct+'</div></div>';
    h += '<div class="stat"><div class="k">Wrong (&minus;1)</div><div class="v" style="color:#e0797a">'+st.wrong+'</div></div>';
    h += '<div class="stat"><div class="k">Unattempted</div><div class="v" style="color:#9aa3b2">'+st.unatt+'</div></div>';
    h += '<div class="stat"><div class="k">Accuracy</div><div class="v">'+acc.toFixed(1)+'%</div></div>';
    h += '</div>';
    h += '<div class="toolbar"><button class="btn" id="revAll" style="flex:1 1 180px">Review all answers</button>';
    h += '<button class="btn" id="goBack" style="flex:1 1 180px">Back to questions</button>';
    h += '<button class="btn warn" id="restart" style="flex:1 1 180px">Restart</button></div>';
    h += '<div id="reviewArea" style="margin-top:14px"></div>';
    h += '</div>';
    document.getElementById('app').innerHTML = h;
    document.getElementById('revAll').addEventListener('click', function(){ renderReview(0); var ra=document.getElementById('reviewArea'); if(ra) setTimeout(function(){ ra.scrollIntoView({behavior:'smooth',block:'start'}); }, 60); });
    document.getElementById('goBack').addEventListener('click', function(){ renderQuiz(); });
    document.getElementById('restart').addEventListener('click', function(){
      showConfirm('Restart?', 'Saare answers aur score delete ho jayenge. Ye wapas nahi aayenge.', 'Haan, restart', function(){
        state.answers = {}; state.cur = 0; state.submitted = false;
        try{ localStorage.removeItem(KEY); }catch(e){}
        save(); renderQuiz();
      });
    });
    topbar();
  }

  function renderReview(page){
    var st = stats();
    var area = document.getElementById('reviewArea');
    if(!area) return;
    var per = 20;
    var pages = Math.ceil(N/per);
    page = Math.max(0, Math.min(page, pages-1));
    var h = '<div class="toolbar" style="margin-bottom:10px">';
    h += '<button class="btn" id="revPrev" style="flex:0 0 auto;padding:0 14px">&#8592;</button>';
    h += '<span class="mini" style="flex:1;text-align:center">Page '+(page+1)+' / '+pages+' &nbsp;&middot;&nbsp; Q'+(page*per+1)+'&#8211;Q'+Math.min(N,(page+1)*per)+'</span>';
    h += '<button class="btn" id="revNext" style="flex:0 0 auto;padding:0 14px">&#8594;</button>';
    h += '</div>';
    for(var i=page*per; i<Math.min(N,(page+1)*per); i++){
      var q = QUESTIONS[i], r = rec(q.id);
      var cls = r ? (r.sel === q.ans ? 'ok' : 'bad') : 'skip';
      var yourTxt = r ? LETTERS[r.sel] : '&#8212;';
      h += '<div class="reviewrow '+cls+'" data-i="'+i+'">';
      h += '<div class="rq"><b>Q'+q.id+'.</b> '+q.q+'</div>';
      h += '<div class="rb">you: '+yourTxt+'<br>ans: '+LETTERS[q.ans]+'</div>';
      h += '</div>';
    }
    area.innerHTML = h;
    document.getElementById('revPrev').addEventListener('click', function(){ renderReview(page-1); });
    document.getElementById('revNext').addEventListener('click', function(){ renderReview(page+1); });
    var rows = area.querySelectorAll('.reviewrow');
    for(var k=0;k<rows.length;k++){
      rows[k].addEventListener('click', function(){
        state.cur = parseInt(this.getAttribute('data-i'),10);
        save(); renderQuiz();
      });
    }
    mathify(area);
  }

  /* ---------------- navigation ---------------- */
  function go(delta){
    var nx = state.cur + delta;
    if(nx < 0 || nx >= N) return;
    state.cur = nx;
    save();
    renderQuiz();
  }
  function skip(){
    var i = state.cur;
    for(var k=1;k<=N;k++){
      var j = (i+k) % N;
      if(!rec(QUESTIONS[j].id)){ state.cur = j; save(); renderQuiz(); return; }
    }
    go(1);
  }
  function submit(){
    var st = stats();
    var msg = 'Answered: '+st.answered+' | Unattempted: '+st.unatt+'\nCurrent score: '+st.score+' / '+MAXMARKS+'\n\nSubmit ke baad result dikhega aur answers lock ho jayenge.';
    showConfirm('Submit test?', msg, 'Submit', function(){
      state.submitted = true;
      save();
      renderSummary();
    });
  }

  document.getElementById('btnPrev').addEventListener('click', function(){ go(-1); });
  document.getElementById('btnNext').addEventListener('click', function(){ go(1); });
  document.getElementById('btnSkip').addEventListener('click', skip);
  document.getElementById('btnGrid').addEventListener('click', function(){
    if(state.view === 'grid') renderQuiz(); else renderGrid();
  });
  document.getElementById('btnSubmit').addEventListener('click', submit);

  /* ---------------- init ---------------- */
  load();
  topbar();
  if(state.submitted) renderSummary(); else renderQuiz();
})();
</script>
