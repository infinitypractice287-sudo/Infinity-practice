<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solutions — 400 MCQ Mastery (NEET UG)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{
    --bg:#12141a; --card:#1b1f27; --card2:#212631; --text:#dcdfe4; --muted:#9aa3b2;
    --green:#5fbf8a; --greenbg:#17301f; --red:#e0797a; --redbg:#33191c;
    --line:#2b313d; --accent:#7aa2f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px; line-height:1.7; -webkit-text-size-adjust:100%;
    padding-bottom:170px;
  }
  header{
    position:sticky; top:0; z-index:30; background:rgba(18,20,26,.96);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
    padding:10px 14px 8px;
  }
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:16px;letter-spacing:.2px}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    padding:5px 11px; border-radius:999px; font-size:13.5px; font-variant-numeric:tabular-nums;
  }
  .chip b{color:var(--accent);font-weight:700}
  #progressWrap{height:6px;background:var(--card2);border-radius:99px;margin-top:9px;overflow:hidden}
  #progressBar{height:100%;width:0%;background:linear-gradient(90deg,#5fbf8a,#7aa2f7);transition:width .25s}
  main{max-width:880px;margin:0 auto;padding:16px 14px 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;margin-bottom:14px}
  .qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .qnum{font-weight:700;color:var(--accent);font-size:15px}
  .tag{font-size:12.5px;color:var(--muted);background:var(--card2);border:1px solid var(--line);
       padding:3px 10px;border-radius:999px}
  .qtext{font-size:17.5px;line-height:1.75;margin:6px 0 14px}
  .figwrap{margin:10px 0 16px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
  .figcap{color:var(--muted);font-size:13.5px;margin-top:6px;text-align:center}
  svg{display:block;margin:0 auto;max-width:100%;height:auto}
  table.figtable{border-collapse:collapse;width:100%;font-size:15.5px;font-variant-numeric:tabular-nums}
  table.figtable th,table.figtable td{border:1px solid var(--line);padding:7px 10px;text-align:center}
  table.figtable th{background:#262c38;color:#e7ebf3;font-weight:600}
  table.figtable tr:nth-child(even) td{background:#1e232c}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;min-height:52px;
    background:var(--card2);color:var(--text);border:1.5px solid var(--line);
    border-radius:13px;padding:12px 14px;margin-bottom:10px;font-size:17px;line-height:1.65;
    text-align:left;cursor:pointer;transition:border-color .15s,background .15s;font-family:inherit;
  }
  .opt:hover:not(.locked){border-color:#3c4759}
  .opt .ltr{
    flex:0 0 30px;height:30px;border-radius:9px;background:#2c3442;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#cfd6e4;
  }
  .opt .ot{flex:1}
  .opt.correct{background:var(--greenbg);border-color:var(--green)}
  .opt.correct .ltr{background:var(--green);color:#0d1a12;border-color:var(--green)}
  .opt.wrong{background:var(--redbg);border-color:var(--red)}
  .opt.wrong .ltr{background:var(--red);color:#1a0d0e;border-color:var(--red)}
  .opt.locked{cursor:default}
  .verdict{font-weight:700;font-size:15.5px;margin:2px 0 12px}
  .verdict.ok{color:var(--green)}
  .verdict.no{color:var(--red)}
  .expl{background:#161a22;border:1px solid var(--line);border-left:4px solid var(--accent);
        border-radius:12px;padding:14px 15px;margin-top:8px}
  .expl h4{margin:14px 0 5px;font-size:15px;color:#a8b6cf;letter-spacing:.3px;text-transform:uppercase}
  .expl h4:first-child{margin-top:0}
  .expl p{margin:4px 0}
  .expl ol,.expl ul{margin:6px 0 6px 20px;padding:0}
  .expl li{margin:5px 0}
  .ansline{margin:10px 0 4px;padding:9px 12px;background:#1b2a22;border:1px solid #2d5340;border-radius:10px;color:#cfeedb}
  .ansline b{color:var(--green)}
  .tipbox{margin-top:10px;padding:10px 12px;background:#22242e;border:1px dashed #3b4354;border-radius:10px;color:#cbd3e2}
  .tipbox b{color:#f0c674}
  nav.bottom{
    position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(18,20,26,.97);
    border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  }
  .navrow{max-width:880px;margin:0 auto;display:flex;gap:8px}
  button.btn{
    flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:15.5px;font-weight:600;
    cursor:pointer;font-family:inherit;padding:0 10px;
  }
  button.btn:hover{border-color:#3c4759}
  button.btn.primary{background:#243a5e;border-color:#35507d;color:#dbe7ff}
  button.btn.warn{background:#3a2a2a;border-color:#5a3d3d;color:#ffdede}
  button.btn:disabled{opacity:.42;cursor:not-allowed}
  .gridpanel{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;margin-top:12px}
  .gcell{
    min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);font-size:13.5px;font-variant-numeric:tabular-nums;cursor:pointer;font-family:inherit;
    position:relative;padding:4px 2px;
  }
  .gcell.done-ok{background:var(--greenbg);border-color:#2f5c44;color:#bdf0d3}
  .gcell.done-bad{background:var(--redbg);border-color:#5c3033;color:#f5c9c9}
  .gcell.cur{outline:2px solid var(--accent);outline-offset:1px}
  .gcell.seen{background:#2a3140}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .toolbar input[type=number]{
    width:96px;min-height:44px;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:0 10px;font-size:15.5px;font-family:inherit;
  }
  .toolbar select{
    min-height:44px;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:0 10px;font-size:15px;font-family:inherit;
  }
  .mini{font-size:14px;color:var(--muted)}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat .k{font-size:13px;color:var(--muted)}
  .stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .reviewrow{
    display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);
    border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
  }
  .reviewrow.ok{border-left:4px solid var(--green)}
  .reviewrow.bad{border-left:4px solid var(--red)}
  .reviewrow.skip{border-left:4px solid #4a5468}
  .rq{flex:1;font-size:15.5px;line-height:1.6}
  .rb{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .simbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 14px}
  .simbox h5{margin:0 0 8px;font-size:14px;color:#a8b6cf;letter-spacing:.3px;text-transform:uppercase}
  .simrow{display:grid;grid-template-columns:1fr 64px;align-items:center;gap:4px 10px;margin:12px 0}
  .simrow label{grid-column:1 / 3;font-size:14.5px;color:var(--muted)}
  .simrow input[type=range]{grid-column:1;width:100%;accent-color:#7aa2f7;height:26px}
  .simval{grid-column:2;font-variant-numeric:tabular-nums;color:#cfd6e4;font-size:15px;text-align:right}
  .simout{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;padding-top:9px;border-top:1px solid var(--line)}
  .simout div{font-size:15.5px;font-variant-numeric:tabular-nums}
  .simout b{color:var(--accent)}
  .katex{font-size:1.06em}
  #overlay{position:fixed;inset:0;background:rgba(6,8,12,.72);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
  #overlay.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:430px;width:100%;padding:18px}
  .modal h3{margin:0 0 8px;font-size:18px}
  .modal p{margin:0 0 14px;color:#c9d1e0;white-space:pre-line;font-size:15.5px}
  .modal .mrow{display:flex;gap:10px}
  .modal .mrow .btn{flex:1}
  .hash{color:var(--muted)}
  @media (max-width:520px){
    body{font-size:16.5px}
    .qtext{font-size:16.5px}
    .opt{font-size:16px}
    .brand{font-size:14.5px}
    .chip{font-size:12.5px;padding:4px 9px}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">Solutions &mdash; 400 MCQ Mastery<small>NEET UG &middot; Chapter: Solutions &middot; +4 / &minus;1</small></div>
    <div class="chips">
      <span class="chip">Score <b id="scoreChip">0</b>/1600</span>
      <span class="chip">Answered <b id="ansChip">0</b>/400</span>
    </div>
  </div>
  <div id="progressWrap"><div id="progressBar"></div></div>
</header>

<main id="app"></main>

<nav class="bottom" id="bottomNav">
  <div class="navrow">
    <button class="btn" id="btnPrev">&#8592; Previous</button>

    <button class="btn primary" id="btnNext">Next &#8594;</button>

</nav>

</div></div>

<script id="qdata" type="application/json">[{"id":1,"c":"Concentration terms","q":"The component of a solution which is present in the larger amount is called the","opt":["dispersed phase","solute","dispersion medium","solvent"],"ans":3,"cpt":"Solution do ya zyada components ka homogeneous mixture hai. Binary solution me do components hote hain: solute (kam amount) aur solvent (zyada amount). Solvent hi wo medium hai jisme solute dissolve hota hai.","m":"Definition based question hai, isliye NCERT ki exact line se compare karo: zyada amount wala component = solvent.","s":["Solution me components ki amount compare karo.","Jo component zyada amount me hai wo solvent hai; jo kam amount me hai wo solute hai.","Yahan 'larger amount' likha hai, isliye answer solvent hai."],"r":"Solvent wo component hai jo zyada amount me hota hai aur baaki components ko dissolve karta hai; isliye larger amount wala component solvent kahlata hai.","w":["Dispersed phase colloid ka term hai, solution ka nahi.","Solute kam amount me hota hai, zyada me nahi.","Dispersion medium bhi colloid ka term hai, solution ka nahi."],"t":"Zyada amount = solvent, kam amount = solute. Confusion ho to socho: paani me namak — paani solvent, namak solute."},{"id":2,"c":"Concentration terms","q":"Molarity of a solution is defined as the number of moles of solute present in","opt":["$1\\,\\mathrm{kg}$ of solution","$1\\,\\mathrm{L}$ of solvent","$1\\,\\mathrm{kg}$ of solvent","$1\\,\\mathrm{L}$ of solution"],"ans":3,"cpt":"Molarity (M) solution ke volume par based hoti hai, solvent ke mass par nahi. Isliye molarity ka formula hai $M = \\dfrac{n_{\\text{solute}}}{V_{\\text{solution}}\\ (\\mathrm{L})}$.","m":"Concentration terms ko unke denominator se pehchano: volume of solution = molarity, mass of solvent = molality.","s":["Molarity ka matlab: moles of solute per litre of solution.","Yahan denominator me solution ka volume (litre) aata hai, solvent ka volume nahi.","Isliye definition '1 L of solution' hai."],"r":"Molarity $= \\dfrac{\\text{moles of solute}}{\\text{volume of solution in L}}$, isliye 1 litre solution wala option sahi hai.","w":["1 kg solution wali definition kisi standard term ki nahi hai.","1 kg solvent wali definition molality ki hai.","1 L solvent nahi — volume solution ka liya jata hai, solvent ka nahi."],"t":"Molarity me 'solution ka volume', molality me 'solvent ka mass'. Bas isi difference se saare numericals ban jaate hain."},{"id":3,"c":"Concentration terms","q":"The SI unit of molality is","opt":["$\\mathrm{mol\\,kg}$","$\\mathrm{mol\\,L^{-1}}$","$\\mathrm{mol^{-1}\\,kg}$","$\\mathrm{mol\\,kg^{-1}}$"],"ans":3,"cpt":"Molality (m) = moles of solute per kilogram of solvent. Isliye iska unit mol divided by kg hota hai.","m":"Unit ko definition se derive karo: moles ka unit mol, solvent ke mass ka unit kg.","s":["Molality $= \\dfrac{n_{\\text{solute}}\\ (\\mathrm{mol})}{w_{\\text{solvent}}\\ (\\mathrm{kg})}$.","mol ko kg se divide karne par unit $\\mathrm{mol\\,kg^{-1}}$ milta hai.","Isliye correct unit $\\mathrm{mol\\,kg^{-1}}$ hai."],"r":"Moles (mol) ko solvent ke mass (kg) se divide karne par unit $\\mathrm{mol\\,kg^{-1}}$ aata hai.","w":["$\\mathrm{mol\\,kg}$ me $\\mathrm{kg^{-1}}$ ka power missing hai — molality mass denominator me leti hai.","$\\mathrm{mol\\,L^{-1}}$ molarity ka unit hai, molality ka nahi.","$\\mathrm{mol^{-1}\\,kg}$ ulta ho gaya — molality me $\\mathrm{mol}$ numerator me hota hai."],"t":"Unit likhte waqt hamesha formula dekho: jo denominator me ho uska power minus hota hai."},{"id":4,"c":"Concentration terms","q":"Molality is independent of temperature because","opt":["it is expressed in terms of volume of solution, which changes with temperature","it is expressed in terms of mass of solvent, which does not change with temperature","it is expressed in terms of moles of solute only","solute and solvent do not expand on heating"],"ans":1,"cpt":"Molarity volume par based hai aur volume temperature ke saath expand/contract hota hai. Molality mass par based hai, aur mass temperature se change nahi hota (mass conserved rehta hai).","m":"Reason wale questions me puchho: 'is term me volume hai ya mass?'. Mass based terms temperature independent hote hain.","s":["Molality $= \\dfrac{\\text{moles of solute}}{\\text{mass of solvent in kg}}$.","Moles aur mass dono temperature se change nahi hote.","Isliye molality temperature ke saath constant rehti hai."],"r":"Kyunki molality sirf moles aur mass of solvent par depend karti hai, aur ye dono temperature se badalte nahi.","w":["Volume wali baat molarity ke liye sahi hai, molality ke liye nahi.","Sirf moles kaafi nahi; denominator (mass of solvent) bhi matter karta hai.","Ye statement galat hai — liquids heating par expand karte hain."],"t":"Mass aur moles temperature independent hote hain; volume nahi. Isliye molality, mole fraction aur mass % temperature independent hain."},{"id":5,"c":"Concentration terms","q":"For any solution containing two or more components, the sum of the mole fractions of all the components is always","opt":["equal to the total number of moles","one","zero","equal to the number of components"],"ans":1,"cpt":"Mole fraction $x_i = \\dfrac{n_i}{n_{\\text{total}}}$. Sabhi mole fractions ka sum lene par numerator me total moles aa jaata hai, jo denominator ke barabar hota hai.","m":"Definition se sum nikalo: $\\sum x_i = \\dfrac{\\sum n_i}{n_{\\text{total}}} = 1$.","s":["$x_1 = \\dfrac{n_1}{n_1+n_2}$, $x_2 = \\dfrac{n_2}{n_1+n_2}$.","Sum karo: $x_1+x_2 = \\dfrac{n_1+n_2}{n_1+n_2} = 1$.","Zyada components ke liye bhi yahi logic lagta hai."],"r":"Mole fractions ka sum hamesha 1 hota hai, chahe components 2 hon ya usse zyada.","w":["Total moles sum nahi hote; sum dimensionless 1 hota hai.","Sum zero kabhi nahi ho sakta, kyunki mole fractions positive hote hain.","Component ki sankhya (2, 3...) sum nahi hoti — sum hamesha 1 hai."],"t":"Mole fraction ka sum 1, aur vapour phase ke mole fractions ka sum bhi 1 ($y_1+y_2=1$)."},{"id":6,"c":"Concentration terms","q":"A concentration of $1\\,\\mathrm{ppm}$ of a solute in a solution means 1 part of solute in","opt":["$10^{3}$ parts of solution","$10^{4}$ parts of solution","$10^{6}$ parts of solution","$10^{9}$ parts of solution"],"ans":2,"cpt":"ppm ka full form parts per million hai, yani $10^{6}$ parts me 1 part. Dilute solutions ke liye use hota hai.","m":"'per million' ka matlab million ($10^{6}$) parts. Isliye seedha $10^{6}$ wala option.","s":["ppm = parts per million.","1 million $= 10^{6}$.","Isliye $1\\,\\mathrm{ppm}$ = $10^{6}$ parts of solution me 1 part solute."],"r":"$1\\,\\mathrm{ppm}$ ka matlab hai $10^{6}$ parts solution me 1 part solute (mass by mass).","w":["$10^{3}$ parts per thousand (ppt) hota hai, ppm nahi.","$10^{4}$ ka koi standard term nahi.","$10^{9}$ parts per billion (ppb) hota hai."],"t":"Yaad rakho: ppm $= 10^{6}$, ppb $= 10^{9}$. Dilute aqueous solution me $1\\,\\mathrm{ppm}\\approx 1\\,\\mathrm{mg\\,L^{-1}}$."},{"id":7,"c":"Concentration terms","q":"The concentration of a solute present in a very dilute aqueous solution is most conveniently expressed in terms of","opt":["molality","mole fraction","molarity","parts per million"],"ans":3,"cpt":"Bahut dilute solution me solute ki amount itni kam hoti hai ki molarity ya molality se number bahut chhota (jaise $10^{-6}$) aa jaata hai. Aise cases me ppm zyada convenient hai (jaise water me pollutants).","m":"Question me 'very dilute' keyword hai — isliye ppm/chhote units socho.","s":["Very dilute solution me solute ka amount bahut kam hota hai.","Molarity/molality likhne par numbers bahut chhote aur awkward aate hain.","ppm (ya ppb) se concentration easily padha jaata hai, isliye ye most convenient hai."],"r":"Very dilute solutions (pollutants, trace gases) ki concentration ppm me express karna sabse convenient hota hai.","w":["Molality bhi wahi problem deti hai.","Mole fraction bahut chhota number ($\\sim 10^{-6}$) deta hai, padhna mushkil.","Molarity dilute solution me bhi use ho sakti hai, par numbers bahut chhote aate hain — convenient nahi."],"t":"NEET me keywords pakdo: 'very dilute' $\\rightarrow$ ppm; 'biological macromolecule' $\\rightarrow$ osmotic pressure; 'accurate at different temperatures' $\\rightarrow$ molality."},{"id":8,"c":"Henry's law","q":"According to Henry's law, the partial pressure of a gas in the vapour phase ($p$) is directly proportional to","opt":["mass percentage of the gas in the solution","molarity of the gas in the solution","molality of the gas in the solution","mole fraction of the gas in the solution"],"ans":3,"cpt":"Henry's law: kisi gas ka partial pressure solution me uski mole fraction ke directly proportional hota hai. $p = K_H\\,x$, jahan $K_H$ Henry's law constant hai.","m":"Law ki exact statement yaad karo: proportionality mole fraction ke saath hai, mass % ya molarity ke saath nahi.","s":["Henry's law: $p \\propto x$ (mole fraction in solution).","Proportionality hatane par $p = K_H x$ milta hai.","Isliye correct answer mole fraction hai."],"r":"$p = K_H\\,x$ me $x$ gas ka mole fraction in solution hai; isliye partial pressure mole fraction ke proportional hai.","w":["Mass percentage se proportional nahi hota.","Molarity ke saath Henry's law nahi likhi jaati.","Molality ke saath bhi nahi — law sirf mole fraction use karta hai."],"t":"$p = K_H x$ — yahan $x$ solute (gas) ka mole fraction hai, aur $K_H$ ka unit pressure ka hota hai jab $x$ dimensionless ho."},{"id":9,"c":"Raoult's law","q":"For a binary solution of two volatile liquids, the partial vapour pressure of component 1 is given by $p_1 = p_1^{\\circ}x_1$. Here $p_1^{\\circ}$ represents the","opt":["vapour pressure of pure component 1","partial pressure of component 1 in the vapour phase","total vapour pressure of the solution","vapour pressure of the solution"],"ans":0,"cpt":"Raoult's law: $p_1 = p_1^{\\circ}x_1$. Yahan $p_1^{\\circ}$ us pure liquid 1 ka vapour pressure hai (same temperature par), aur $x_1$ liquid phase me uska mole fraction hai.","m":"Symbols ko definition se pehchano: circle ($^{\\circ}$) ka matlab 'pure state' hota hai.","s":["Raoult's law: $p_1 = p_1^{\\circ}x_1$.","$x_1$ liquid phase ka mole fraction hai.","$p_1^{\\circ}$ pure component 1 ka vapour pressure hai (us temperature par)."],"r":"Superscript $^{\\circ}$ pure substance ko darshata hai, isliye $p_1^{\\circ}$ pure component 1 ka vapour pressure hai.","w":["$p_1$ (bina circle) partial pressure hai; $p_1^{\\circ}$ uska pure-state vapour pressure hota hai.","Total vapour pressure $p = p_1+p_2$ hota hai, $p_1^{\\circ}$ nahi.","Vapour pressure of the solution total pressure hota hai, $p_1^{\\circ}$ nahi."],"t":"$p_1$ = solution me partial pressure, $p_1^{\\circ}$ = pure liquid ka vapour pressure. Circle dekhte hi 'pure' yaad karo."},{"id":10,"c":"Ideal solutions","q":"Which of the following pairs of values is characteristic of an ideal solution?","opt":["$\\Delta H_{\\text{mix}} = 0$ and $\\Delta V_{\\text{mix}} = 0$","$\\Delta H_{\\text{mix}} < 0$ and $\\Delta V_{\\text{mix}} < 0$","$\\Delta H_{\\text{mix}} > 0$ and $\\Delta V_{\\text{mix}} > 0$","$\\Delta H_{\\text{mix}} = 0$ and $\\Delta V_{\\text{mix}} > 0$"],"ans":0,"cpt":"Ideal solution me A-B interactions, A-A aur B-B interactions ke barabar hote hain. Isliye mixing par na heat nikalti hai na absorb hoti hai, aur na volume change hota hai.","m":"Ideal solution ki do conditions yaad karo: $\\Delta H_{\\text{mix}} = 0$ aur $\\Delta V_{\\text{mix}} = 0$, saath me Raoult's law ka palan.","s":["Ideal solution me unlike interactions = like interactions.","Isliye mixing par enthalpy change zero hota hai: $\\Delta H_{\\text{mix}} = 0$.","Volume bhi additivity follow karta hai: $\\Delta V_{\\text{mix}} = 0$."],"r":"Ideal solution ke liye $\\Delta H_{\\text{mix}} = 0$ aur $\\Delta V_{\\text{mix}} = 0$ dono satisfy hote hain.","w":["Negative enthalpy negative deviation ke liye hoti hai.","Positive enthalpy positive deviation ke liye hoti hai.","Ideal me volume change zero hota hai, positive nahi."],"t":"Ideal = zero heat + zero volume change + Raoult's law. Deviations me signs yaad rakho: positive deviation $\\Rightarrow \\Delta H>0$, negative deviation $\\Rightarrow \\Delta H<0$."},{"id":11,"c":"Colligative properties","q":"Which of the following is NOT a colligative property?","opt":["Osmotic pressure","Elevation in boiling point","Vapour pressure of the solution","Depression in freezing point"],"ans":2,"cpt":"Colligative properties wo hain jo sirf solute particles ki sankhya par depend karti hain: relative lowering of vapour pressure, elevation of boiling point, depression of freezing point aur osmotic pressure. Solution ka actual vapour pressure khud colligative property nahi hai — bas uske lowering ki relative value colligative hai.","m":"Har option ko test karo: kya ye sirf particle number par depend karta hai? Vapour pressure ki absolute value solvent ki nature aur temperature par bhi depend karti hai.","s":["Colligative properties: $\\pi$, $\\Delta T_b$, $\\Delta T_f$ aur relative lowering of vapour pressure.","Solution ka actual vapour pressure solute ki nature par bhi depend karta hai, sirf number par nahi.","Isliye 'vapour pressure of the solution' NOT colligative hai."],"r":"Solution ka vapour pressure absolute quantity hai (mm Hg me), ye sirf particle count se decide nahi hota; isliye ye colligative property nahi hai.","w":["Osmotic pressure pure colligative property hai.","Elevation in boiling point bhi colligative property hai.","Depression in freezing point colligative property hai."],"t":"Trap yahi hai: 'relative lowering of vapour pressure' colligative hai, par 'vapour pressure' khud nahi. NCERT me chaar colligative properties listed hain."},{"id":12,"c":"van't Hoff factor","q":"The van't Hoff factor ($i$) of a non-electrolyte solute which neither dissociates nor associates in solution is","opt":["less than $1$","$1$","$0$","$2$"],"ans":1,"cpt":"van't Hoff factor batata hai ki solution me actual particles kitne hain compared to formula units. $i = \\dfrac{\\text{normal molar mass}}{\\text{observed molar mass}} = \\dfrac{\\text{observed colligative property}}{\\text{calculated colligative property}}$.","m":"Agar solute na tootā hai na judta hai, to particles ki sankhya wahi rehti hai — isliye $i = 1$.","s":["Non-electrolyte dissociate nahi karta, isliye ek molecule = ek particle.","Association bhi nahi hoti, isliye particles ki sankhya same rehti hai.","Isliye $i = 1$."],"r":"Jab dissociation ya association nahi hoti, observed aur calculated values same rehti hain, isliye $i = 1$.","w":["$i < 1$ association ke liye hota hai.","$i = 0$ ka koi physical meaning nahi, particles zero nahi ho sakte.","$i = 2$ dissociation (do ions) ke liye hota hai."],"t":"$i = 1$ non-electrolyte, $i > 1$ dissociation, $i < 1$ association. Ye teen cases har numerical me kaam aate hain."},{"id":13,"c":"Concentration terms","q":"Statement I: The molarity of a solution changes when its temperature is changed. Statement II: Molarity is defined as the number of moles of solute per kilogram of solution.","opt":["Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct"],"ans":2,"cpt":"Molarity volume of solution par based hai, aur volume temperature ke saath change hota hai. Molality mass of solvent par based hai. 'Per kilogram of solution' wali koi standard definition nahi hai.","m":"Do statements ko alag-alag check karo: Statement I first, phir Statement II.","s":["Temperature badhne par solution expand karta hai, volume badhta hai, isliye molarity ghat ti hai — Statement I sahi.","Molarity ki definition: moles of solute per litre of solution, per kg of solution nahi — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"Molarity temperature ke saath change hoti hai (sahi), par iski definition per kg solution nahi, per litre solution hai.","w":["Statement I sahi hai, isliye 'both incorrect' galat option hai.","Statement I galat nahi hai, wo sahi hai.","Dono correct nahi hain — Statement II galat hai."],"t":"Definition ratne me 'solution ka litre' vs 'solvent ka kg' ka farq clear rakho — 90% errors yahin hote hain."},{"id":14,"c":"Concentration terms","q":"Statement I: The molality of a solution is independent of temperature. Statement II: Molality is expressed as the number of moles of solute per kilogram of solvent.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Molality mass of solvent par based hoti hai; mass temperature se change nahi hota, isliye molality temperature independent hoti hai.","m":"Statement I ki reason Statement II me hi hai — dono ko jodo.","s":["Molality $= \\dfrac{n_{\\text{solute}}}{w_{\\text{solvent}}(\\mathrm{kg})}$ — Statement II sahi.","Mass of solvent heating par nahi badalta, isliye molality constant rehti hai — Statement I sahi.","Dono correct hain aur II, I ko explain bhi karti hai."],"r":"Dono statements correct hain: molality mass of solvent par based hai, isliye wo temperature independent hai.","w":["Statement II galat nahi hai — ye molality ki sahi definition hai.","Statement I galat nahi hai.","Dono sahi hain, isliye 'both incorrect' galat hai."],"t":"Jab Statement II, Statement I ki definition de raha ho, dono correct hone par answer 'Both correct' hota hai (statement format me A)."},{"id":15,"c":"Solubility of gases","q":"Statement I: The solubility of most gases in water decreases with increase in temperature. Statement II: The dissolution of a gas in water is generally an exothermic process.","opt":["Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct"],"ans":2,"cpt":"Gas jab paani me ghulti hai to generally heat nikalati hai (exothermic), kyunki gas ke molecules ke beech ke attractions toot te hain aur solvent ke saath naye bante hain. Le Chatelier ke hisaab se exothermic process low temperature par favour hota hai.","m":"Temperature effect ko enthalpy of solution se link karo: exothermic $\\Rightarrow$ garam karne par solubility ghat ti hai.","s":["Gas ka dissolution generally exothermic hota hai ($\\Delta H_{\\text{sol}} < 0$).","Le Chatelier: exothermic process ko heating oppose karti hai.","Isliye temperature badhne par solubility ghat ti hai — dono statements sahi."],"r":"Dono statements correct hain: exothermic dissolution ki wajah se hi heating par gas ki solubility ghat ti hai.","w":["Dono sahi hain.","Statement II galat nahi hai; gas dissolution generally exothermic hota hai.","Statement I galat nahi hai; O₂, CO₂ sabki solubility heating par ghat ti hai."],"t":"Exception yaad rakho: kuch gases (jaise ammonia) ka dissolution exothermic nahi hota, par NCERT level par 'most gases' ke liye decrease hi likha jaata hai."},{"id":16,"c":"Henry's law","q":"Statement I: The value of Henry's law constant of a gas depends on the nature of the gas and on the temperature. Statement II: The solubility of a gas at a given partial pressure increases with increase in the value of Henry's law constant.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct"],"ans":1,"cpt":"Henry's law: $p = K_H x$, isliye $x = \\dfrac{p}{K_H}$. Matlab $K_H$ jitna bada, utni kam solubility (same pressure par). $K_H$ gas ki nature aur temperature par depend karta hai.","m":"Formula ko rearrange karke $K_H$ ka effect dekho — direct proportionality statement galat niklegi.","s":["$p = K_H x \\Rightarrow x = \\dfrac{p}{K_H}$.","Isliye $K_H$ badhne par $x$ (solubility) ghat ti hai — Statement II galat.","$K_H$ gas ki nature aur temperature par depend karta hai — Statement I sahi."],"r":"Statement I sahi hai ($K_H$ gas aur temperature par depend karta hai), par Statement II galat hai kyunki badi $K_H$ ka matlab kam solubility hoti hai.","w":["Statement II galat hai — seedha proportional nahi, inversely proportional hai.","Statement I sahi hai, isliye 'both incorrect' galat.","Statement I bilkul sahi hai, isliye ye option galat."],"t":"Yaad rakho: $K_H$ zyada $\\Rightarrow$ solubility kam. Isliye CO₂ ki $K_H$ O₂ se kam hoti hai (CO₂ zyada soluble)."},{"id":17,"c":"Non-ideal solutions","q":"Statement I: A mixture of chloroform and acetone shows positive deviation from Raoult's law. Statement II: Chloroform and acetone molecules form hydrogen bonds with each other.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Chloroform ($\\ce{CHCl3}$) me acidic H hota hai aur acetone ($\\ce{CH3COCH3}$) me carbonyl O. Dono ke beech naya hydrogen bond banta hai. Isse A-B interaction strong ho jaati hai, vapour pressure ghat ta hai — yani negative deviation.","m":"Pehchano: strong A-B interaction $\\Rightarrow$ negative deviation. Phir Statement I ko check karo.","s":["Chloroform aur acetone ke beech hydrogen bonding hoti hai — Statement II sahi.","Naya strong interaction banne se escaping tendency ghat ti hai.","Isliye vapour pressure Raoult's law se kam hota hai — negative deviation, yani Statement I galat."],"r":"Statement II sahi hai (H-bonding hoti hai) par iska result negative deviation hai, positive nahi — isliye Statement I galat.","w":["Statement I galat hai, isliye 'both correct' nahi.","Statement II galat nahi hai.","Statement II sahi hai, isliye 'both incorrect' galat."],"t":"Classic pairs: chloroform + acetone $\\rightarrow$ negative deviation (H-bonding); ethanol + water $\\rightarrow$ positive deviation (H-bonding toot ti hai)."},{"id":18,"c":"Ideal solutions","q":"Statement I: Benzene and toluene form an almost ideal solution. Statement II: The vapour pressure of an equimolar benzene-toluene mixture is the arithmetic mean of the vapour pressures of the two pure liquids at that temperature.","opt":["Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect","Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect"],"ans":2,"cpt":"Benzene aur toluene dono non-polar, similar size aur similar intermolecular forces wale hain. Isliye ye almost ideal solution banate hain. Ideal solution me total pressure $p = p_1^{\\circ}x_1 + p_2^{\\circ}x_2$ hota hai.","m":"Ideal solution ki condition (similar interactions) aur Raoult's law ki equation, dono ko check karo.","s":["Benzene aur toluene me similar dispersion forces hain, isliye ideal behaviour — Statement I sahi.","Equimolar mixture me $x_1 = x_2 = 0.5$.","$p = 0.5p_1^{\\circ} + 0.5p_2^{\\circ} = \\dfrac{p_1^{\\circ}+p_2^{\\circ}}{2}$ — arithmetic mean, Statement II sahi."],"r":"Dono statements correct hain; equimolar ideal mixture ka pressure dono pure vapour pressures ka average hota hai.","w":["Dono sahi hain.","Statement II galat nahi — Raoult's law se yahi nikalta hai.","Statement I galat nahi — benzene-toluene classic ideal pair hai."],"t":"Benzene + toluene = nearly ideal. Ye example NEET me baar baar aata hai, statement aur match dono me."},{"id":19,"c":"Azeotropes","q":"Statement I: An ethanol-water mixture forms a maximum boiling azeotrope. Statement II: An ethanol-water mixture shows positive deviation from Raoult's law.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Ethanol aur water ke beech hydrogen bonding pure liquids ke muqable kamzor hoti hai (ethanol ka non-polar part water ki H-bonding todta hai), isliye vapour pressure badh jaata hai = positive deviation. Positive deviation wali mixtures minimum boiling azeotrope banati hain, maximum boiling nahi.","m":"Rule: positive deviation $\\rightarrow$ minimum boiling azeotrope; negative deviation $\\rightarrow$ maximum boiling azeotrope.","s":["Ethanol-water me positive deviation hoti hai — Statement II sahi.","Positive deviation wali mixture ka boiling point ideal se kam hota hai.","Ethanol-water (95% ethanol) minimum boiling azeotrope hai, maximum boiling nahi — Statement I galat."],"r":"Statement II sahi hai; par positive deviation se minimum boiling azeotrope banta hai, isliye Statement I galat hai.","w":["Statement I galat hai.","Statement II galat nahi hai — ethanol-water positive deviation dikhata hai.","Statement II sahi hai, isliye 'both incorrect' galat."],"t":"Ethanol-water azeotrope: 95% ethanol (by mass), $78.15\\,^{\\circ}\\mathrm{C}$ par boil karta hai — ye pure ethanol ($78.3\\,^{\\circ}\\mathrm{C}$) se kam hai, yani minimum boiling."},{"id":20,"c":"Colligative properties","q":"Statement I: Colligative properties depend on the nature of the solute particles. Statement II: All colligative properties are directly proportional to the molality of the solution.","opt":["Both Statement I and Statement II are incorrect","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are correct"],"ans":0,"cpt":"Colligative properties sirf solute particles ki sankhya par depend karti hain, unki nature (size, charge, mass) par nahi. Isliye 'nature' wali statement galat hai. Doosri baat: relative lowering of vapour pressure mole fraction ke proportional hoti hai, molality ke nahi.","m":"Dono statements ko definition se test karo — dono me kuch na kuch galat hai.","s":["Colligative properties particle number par depend karti hain, nature par nahi — Statement I galat.","Relative lowering of vapour pressure $= x_2$ (mole fraction), molality ke proportional nahi — Statement II bhi galat.","Isliye dono statements incorrect hain."],"r":"Dono galat hain: colligative properties nature par depend nahi karti, aur relative lowering mole fraction par depend karti hai (molality par nahi).","w":["Statement I galat hai (nature par depend nahi karti).","Statement II bhi galat hai ($\\Delta T_b, \\Delta T_f$ molality par hain, par relative lowering nahi).","Statement I galat hai, isliye ye bhi galat."],"t":"Yaad rakho: relative lowering $= x_2$ (mole fraction), aur $\\Delta T_b, \\Delta T_f$ molality par. Isliye 'all colligative properties molality ke proportional' ek trap statement hai."},{"id":21,"c":"Colligative properties","q":"Statement I: The osmotic pressure of $0.1\\,\\mathrm{M}$ $\\ce{NaCl}$ solution is greater than that of $0.1\\,\\mathrm{M}$ glucose solution at the same temperature. Statement II: $\\ce{NaCl}$ dissociates into two ions, so the total number of particles in solution is greater in the $\\ce{NaCl}$ solution.","opt":["Both Statement I and Statement II are correct","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are incorrect"],"ans":0,"cpt":"Osmotic pressure particle ki sankhya par depend karta hai: $\\pi = iCRT$. Glucose non-electrolyte hai ($i = 1$), $\\ce{NaCl}$ ek formula unit se do ions deta hai ($i \\approx 2$), isliye $\\ce{NaCl}$ ka effective concentration double ho jata hai.","m":"$\\pi = iCRT$ me $i$ ko check karo: same $C$ aur $T$ par jiska $i$ bada, uska $\\pi$ bada.","s":["Glucose ke liye $i = 1$, $\\ce{NaCl}$ ke liye $i \\approx 2$.","$\\pi(\\ce{NaCl}) = 2CRT$ aur $\\pi(\\text{glucose}) = CRT$.","Isliye $\\ce{NaCl}$ ka osmotic pressure zyada hai — dono statements sahi."],"r":"Dono statements correct hain; $\\ce{NaCl}$ ke do ions particle number badha dete hain, isliye osmotic pressure zyada hota hai.","w":["Statement II galat nahi hai — $\\ce{NaCl}$ sach me do ions deta hai.","Statement I galat nahi hai.","Dono sahi hain."],"t":"$\\ce{NaCl} \\rightarrow \\ce{Na+} + \\ce{Cl-}$: ek molecule se do particles, isliye $i \\approx 2$."},{"id":22,"c":"Reverse osmosis","q":"Statement I: In reverse osmosis, the pressure applied on the solution side must be greater than the osmotic pressure of the solution. Statement II: In reverse osmosis, the semipermeable membrane permits the solute particles to pass through it.","opt":["Both Statement I and Statement II are correct","Statement I is incorrect but Statement II is correct","Statement I is correct but Statement II is incorrect","Both Statement I and Statement II are incorrect"],"ans":2,"cpt":"Osmosis me solvent khud dilute side se concentrated side jata hai. Reverse osmosis me hum bahar se pressure lagakar ise ulta karte hain — solution side par $p > \\pi$ lagate hain. Membrane sirf solvent (paani) ko jaane deti hai, ions ko rok leti hai.","m":"Do baatein check karo: (1) pressure kis direction me lagta hai, (2) membrane kya pass karne deti hai.","s":["RO me bahar ka pressure osmotic pressure se bada hona chahiye, tabhi paani solution side se bahar niklega — Statement I sahi.","Semipermeable membrane solvent ko jaane deti hai par solute (salt ions) ko rok leti hai — Statement II galat.","Isliye Statement I correct, Statement II incorrect."],"r":"Statement I sahi hai; Statement II galat hai kyunki RO membrane solute ko pass nahi karti, sirf solvent ko.","w":["Statement II galat hai — membrane solute ko rok ti hai.","Statement I galat nahi hai.","Statement I sahi hai, isliye 'both incorrect' galat."],"t":"RO ka one-liner: 'salt ko rok kar paani ko zabardasti bahar nikalna' — isliye membrane solute-impermeable hoti hai."},{"id":23,"c":"Concentration terms","q":"Which of the following statements is correct?","opt":["Normality of a solution is always numerically equal to its molarity.","Molarity of a given solution increases with increase in temperature.","Molality of a given solution changes with change in temperature.","Mole fraction of a solute in water remains unchanged when the temperature of the solution changes."],"ans":3,"cpt":"Temperature badhne par liquid expand karti hai, volume badhta hai. Volume par based terms (molarity, normality) badalte hain; mass aur moles par based terms (molality, mole fraction, mass %) nahi badalte.","m":"Har option me puchho: is term me volume hai kya? Volume ho to temperature se change hoga.","s":["Molarity $= n/V$: heating par $V$ badhta hai, isliye molarity ghat ti hai (badh ti nahi).","Molality mass par based hai, isliye temperature se change nahi hoti.","Mole fraction $= n_1/(n_1+n_2)$: moles temperature se change nahi hote, isliye ye constant rehta hai.","Normality $=$ molarity sirf tab jab n-factor 1 ho; hamesha nahi."],"r":"Mole fraction sirf moles ki ratio hai aur moles temperature se nahi badalte, isliye ye temperature change par unchanged rehta hai.","w":["Normality $= M \\times n$-factor, isliye hamesha equal nahi hoti.","Heating par molarity ghat ti hai, badh ti nahi.","Molality temperature independent hoti hai."],"t":"Temperature independent: molality, mole fraction, mass %, ppm (w/w). Temperature dependent: molarity, normality, % w/v."},{"id":24,"c":"Concentration terms","q":"Which of the following statements is NOT correct?","opt":["Molality has the unit $\\mathrm{mol\\,kg^{-1}}$.","Mole fraction is a dimensionless quantity.","Mass percentage is the mass of solute present in $100\\,\\mathrm{g}$ of solution.","Molarity is the mass of solute present in one litre of solution."],"ans":3,"cpt":"Molarity moles per litre hoti hai, mass per litre nahi. Mass per litre ko mass concentration kehte hain, molarity nahi.","m":"Definition ke words dhyan se padho: 'moles' aur 'mass' ka farq sabse bada trap hai.","s":["Mole fraction ratio hai, iska koi unit nahi — correct.","Molality ka unit $\\mathrm{mol\\,kg^{-1}}$ hai — correct.","Mass % $= \\dfrac{\\text{mass of solute}}{100\\,\\mathrm{g}\\ \\text{solution}}$ — correct.","Molarity 'moles of solute per litre', mass per litre nahi — ye galat statement hai."],"r":"Molarity moles per litre hoti hai; 'mass of solute per litre' galat definition hai, isliye wahi NOT correct statement hai.","w":["Molality ka unit sahi diya gaya hai.","Mole fraction truly dimensionless hai.","Mass percentage ki definition sahi hai."],"t":"Molarity $= n/V$, mass concentration $= w/V$. Dono alag hain — units me hi farq dikh jata hai ($\\mathrm{mol\\,L^{-1}}$ vs $\\mathrm{g\\,L^{-1}}$)."},{"id":25,"c":"Solubility of gases","q":"Which of the following statements about the solubility of a gas in a liquid is correct?","opt":["It decreases with increase in the partial pressure of the gas.","It decreases with increase in temperature at constant pressure of the gas.","It is completely independent of temperature.","It increases with increase in temperature at constant pressure."],"ans":1,"cpt":"Gas ka dissolution generally exothermic hota hai, isliye temperature badhne par solubility ghat ti hai. Aur Henry's law ke hisaab se partial pressure badhne par solubility badh ti hai.","m":"Do variables alag-alag check karo: temperature ka effect aur pressure ka effect.","s":["Gas dissolution exothermic $\\Rightarrow$ heating par solubility ghat ti hai.","Henry's law: $x = p/K_H$, isliye pressure badhne par solubility badh ti hai.","Isliye sirf 'decreases with increase in temperature' wala option sahi hai."],"r":"Temperature badhne par gas ki solubility ghat ti hai (exothermic dissolution), isliye doosra option sahi hai.","w":["Partial pressure badhne par solubility badh ti hai, ghat ti nahi.","Temperature ka effect hota hai, independent nahi.","Heating par solubility badh ti nahi, ghat ti hai."],"t":"Cold water me zyada oxygen ghulti hai — isliye aquatic species cold water me comfortable rehti hain. Ye NEET ka favourite application hai."},{"id":26,"c":"Ideal solutions","q":"Which of the following is NOT correct for an ideal solution?","opt":["It obeys Raoult's law over the entire range of concentration.","$\\Delta H_{\\text{mix}} = 0$","$\\Delta V_{\\text{mix}} = 0$","The magnitude of solute-solvent interactions in the solution differs from that of solute-solute and solvent-solvent interactions in the pure components."],"ans":3,"cpt":"Ideal solution me A-B interactions ki strength A-A aur B-B ke barabar hoti hai. Isliye heat aur volume change zero hote hain aur Raoult's law pure range me obey hota hai.","m":"Ideal solution ki teen conditions yaad karo; jo option inke ulta ho wahi NOT correct hoga.","s":["Ideal solution Raoult's law follow karta hai (poori range) — correct.","$\\Delta H_{\\text{mix}} = 0$ — correct.","$\\Delta V_{\\text{mix}} = 0$ — correct.","A-B interaction alag hona ideal ki condition ke bilkul ulta hai — ye galat statement hai."],"r":"Ideal solution me interactions same magnitude ke hote hain, isliye 'differs' wali statement galat hai.","w":["Ye ideal solution ki sahi property hai.","Ye bhi sahi property hai.","$\\Delta V_{\\text{mix}} = 0$ bhi sahi hai."],"t":"Ideal ke 3 mantras: same interaction, zero $\\Delta H$, zero $\\Delta V$, plus Raoult's law."},{"id":27,"c":"Henry's law","q":"Which of the following statements about Henry's law constant ($K_H$) is correct?","opt":["Its unit is the same as that of pressure.","Its unit is $\\mathrm{mol\\,L^{-1}}$.","It is independent of the nature of the gas.","Its value decreases with increase in temperature."],"ans":0,"cpt":"$p = K_H x$ me $x$ dimensionless hai, isliye $K_H$ ka unit pressure ka hi hoga (bar ya atm). $K_H$ gas ki nature aur temperature par depend karta hai.","m":"Unit nikalne ke liye formula ko rearrange karo: $K_H = p/x$.","s":["$K_H = p/x$; $x$ unitless hai.","Isliye $K_H$ ka unit pressure jaisa hoga (bar).","Temperature badhne par gas kam soluble hoti hai, yani $K_H$ badh jaata hai (decrease nahi)."],"r":"$K_H = p/x$ aur $x$ dimensionless hai, isliye $K_H$ ka unit pressure ka hota hai (bar/atm).","w":["Unit $\\mathrm{mol\\,L^{-1}}$ nahi — ye $x$ unitless hone ki wajah se pressure ka unit hai.","$K_H$ gas ki nature par depend karta hai (He aur CO₂ ki $K_H$ bilkul alag hai).","$K_H$ ka unit pressure ka hai; heating par ye badh jaata hai, ghat ta nahi."],"t":"$K_H$ ka unit = pressure, jab solubility mole fraction me ho. Agar solubility molarity me ho to unit alag hota hai — NEET me mole fraction wala hi puchha jata hai."},{"id":28,"c":"Azeotropes","q":"Which of the following statements about azeotropes is NOT correct?","opt":["They boil at a constant temperature without any change in composition.","They can be separated into their components by fractional distillation.","The composition of the vapour phase is the same as that of the liquid phase at the boiling point.","Minimum boiling azeotropes are formed by solutions showing positive deviation from Raoult's law."],"ans":1,"cpt":"Azeotrope ek aisi mixture hai jiska boiling point constant hota hai aur us composition par vapour aur liquid ka composition same hota hai. Isi wajah se fractional distillation se ye alag nahi ho sakti.","m":"Azeotrope ki definition ka core: 'constant composition distillate' — isse hi separation ka sawal solve hota hai.","s":["Azeotrope constant temperature par distill hota hai, composition nahi badalta — correct.","Azeotropic point par $y_1 = x_1$ — correct.","Kyunki vapour aur liquid ka composition same hai, fractional distillation se separation possible nahi — ye statement galat.","Positive deviation wale mixtures minimum boiling azeotrope banate hain — correct."],"r":"Azeotrope ko fractional distillation se alag nahi kiya ja sakta, isliye wahi statement NOT correct hai.","w":["Ye azeotrope ki sahi definition hai.","Azeotropic point par $y = x$ hota hai — sahi.","Positive deviation $\\rightarrow$ minimum boiling azeotrope, sahi."],"t":"Azeotrope ko todne ke liye pressure badalna padta hai ya chemical method lagta hai — simple distillation se nahi hota."},{"id":29,"c":"Osmotic pressure","q":"Which of the following relations for osmotic pressure is correct? (Here $C$ = molarity, $R$ = gas constant, $T$ = temperature in kelvin)","opt":["$\\pi = C/RT$","$\\pi = CRT$","$\\pi = MR/T$","$\\pi = CRT^{2}$"],"ans":1,"cpt":"Dilute solutions ke liye van't Hoff ne ideal gas jaisa relation diya: $\\pi V = nRT$, isliye $\\pi = \\dfrac{n}{V}RT = CRT$.","m":"$\\pi V = nRT$ se $\\pi$ nikaalo; $n/V$ ko $C$ likh do.","s":["$\\pi V = nRT$.","$\\pi = \\dfrac{n}{V}RT$.","$\\dfrac{n}{V} = C$, isliye $\\pi = CRT$."],"r":"Osmotic pressure $\\pi = CRT$ hota hai, jahan $C$ molarity hai.","w":["$C/RT$ dimensionally galat hai.","$M$ molar mass hai, molarity nahi; notation galat.","$T^{2}$ ka koi basis nahi — $\\pi$ sirf $T$ ke proportional hai."],"t":"$\\pi = CRT$ yaad rakho; electrolyte ke liye $\\pi = iCRT$. Ye ek line se bahut se numericals ban jaate hain."},{"id":30,"c":"van't Hoff factor","q":"Which of the following statements regarding the van't Hoff factor is NOT correct?","opt":["For acetic acid dissolved in benzene its value is less than $1$.","For a solution in which the solute associates, its value is greater than $1$.","For $\\ce{K2SO4}$ in dilute aqueous solution its value is close to $3$.","For a non-electrolyte solute its value is exactly $1$."],"ans":1,"cpt":"Association me do ya zyada molecules jud kar ek particle banate hain, isliye total particles kam ho jaate hain — $i < 1$. Dissociation me particles badhte hain — $i > 1$.","m":"Association aur dissociation ko particle count se jodo: judna $\\rightarrow$ kam particles $\\rightarrow i<1$.","s":["$\\ce{K2SO4} \\rightarrow 2\\ce{K+} + \\ce{SO4^{2-}}$: 3 ions, isliye $i \\approx 3$ — correct.","Acetic acid benzene me dimer banata hai, isliye $i < 1$ — correct.","Association me $i < 1$ hota hai, greater than 1 nahi — ye statement galat.","Non-electrolyte ke liye $i = 1$ — correct."],"r":"Association se particles ghat te hain, isliye $i$ ek se kam hota hai; 'greater than 1' wali statement galat hai.","w":["Acetic acid ka benzene me dimerisation classic example hai, sahi.","$\\ce{K2SO4}$ se 3 ions bante hain, $i \\approx 3$ sahi.","Non-electrolyte ke liye $i = 1$ sahi hai."],"t":"Association ($i<1$) ke examples: benzoic/acetic acid benzene me, carboxylic acids non-polar solvent me. Dissociation ($i>1$) ke examples: salts, acids, bases in water."},{"id":31,"c":"Vapour pressure","q":"Which of the following statements about relative lowering of vapour pressure is correct?","opt":["It depends on the nature of the solute.","It is not a colligative property.","It decreases as more solute is added to the solvent.","For a solution of a non-volatile solute, its value is equal to the mole fraction of the solute."],"ans":3,"cpt":"Non-volatile solute ke liye Raoult's law: $\\dfrac{p_1^{\\circ}-p_1}{p_1^{\\circ}} = x_2$, yani relative lowering solute ke mole fraction ke barabar hoti hai.","m":"Formula directly yaad karo: relative lowering $= x_2$. Isse saare options test ho jate hain.","s":["$\\dfrac{p_1^{\\circ}-p_1}{p_1^{\\circ}} = x_2$ likho.","Yani relative lowering solute ke mole fraction ke equal hai.","Ye sirf particle number par depend karta hai, nature par nahi, aur zyada solute dalne par badhta hai."],"r":"Relative lowering of vapour pressure exactly solute ke mole fraction ke barabar hoti hai (non-volatile solute ke liye).","w":["Ye solute ki nature par depend nahi karti, sirf mole fraction par.","Ye ek colligative property hai.","Zyada solute dalne par mole fraction badhta hai, isliye relative lowering badh ti hai."],"t":"Relative lowering $= x_2$ — ye formula molar mass nikalne ke liye use hota hai: $\\dfrac{p^{\\circ}-p}{p^{\\circ}} = \\dfrac{n_2}{n_1+n_2}$."},{"id":32,"c":"Osmosis","q":"Which of the following statements about osmosis is NOT correct?","opt":["Osmosis is the spontaneous flow of solvent molecules through a semipermeable membrane.","Solvent molecules move from a region of lower solute concentration towards a region of higher solute concentration.","Osmotic pressure is the extra pressure applied on the solution side to stop the flow of solvent into it.","Osmosis takes place only from a solution towards the pure solvent."],"ans":3,"cpt":"Osmosis me solvent dilute side (kam solute) se concentrated side (zyada solute) jata hai — yani pure solvent se solution ki taraf.","m":"Direction yaad karo: solvent always 'kam solute se zyada solute' ki taraf jata hai.","s":["Osmosis = solvent ka semipermeable membrane ke through spontaneous flow.","Direction: lower solute concentration $\\rightarrow$ higher solute concentration.","Yani pure solvent se solution ki taraf; 'solution se pure solvent' wali statement ulti hai — galat."],"r":"Osmosis pure solvent se solution ki taraf hota hai, isliye 'solution towards pure solvent' wali statement galat hai.","w":["Ye osmosis ki sahi definition hai.","Direction sahi likhi hai (kam se zyada solute).","Osmotic pressure ki definition sahi hai."],"t":"Reverse osmosis me yahi direction ulti kar di jaati hai — external pressure lagakar solvent ko solution se bahar nikala jata hai."},{"id":33,"c":"Concentration terms","q":"Match the Column I (concentration term) with Column II (unit/characteristic). Column I: (a) Molarity (b) Molality (c) Mole fraction (d) Normality. Column II: (i) $\\mathrm{mol\\,kg^{-1}}$ (ii) $\\mathrm{mol\\,L^{-1}}$ (iii) gram equivalents per litre of solution (iv) no unit","opt":["a-iv, b-i, c-ii, d-iii","a-ii, b-i, c-iii, d-iv","a-i, b-ii, c-iii, d-iv","a-ii, b-i, c-iv, d-iii"],"ans":3,"cpt":"Har concentration term ka apna denominator hota hai: molarity me litre solution, molality me kg solvent, mole fraction me total moles, normality me gram equivalents per litre.","m":"Ek-ek term ka unit likho, phir Column II se match karo.","s":["Molarity: $\\mathrm{mol\\,L^{-1}}$ $\\rightarrow$ (ii).","Molality: $\\mathrm{mol\\,kg^{-1}}$ $\\rightarrow$ (i).","Mole fraction: ratio hai, isliye no unit $\\rightarrow$ (iv).","Normality: gram equivalents per litre $\\rightarrow$ (iii)."],"r":"Sahi mapping a-ii, b-i, c-iv, d-iii hai.","w":["Molality ka unit $\\mathrm{mol\\,L^{-1}}$ nahi hota.","Mole fraction ka koi unit nahi hota.","Molarity ka unit equivalents per litre nahi hota."],"t":"Match me pehle wahi pairs fix karo jinke unit yaad hain — baaki elimination se ho jaate hain."},{"id":34,"c":"Non-ideal solutions","q":"Match the Column I (type of solution) with Column II (characteristic). Column I: (a) Ideal solution (b) Solution showing positive deviation (c) Solution showing negative deviation (d) Azeotrope. Column II: (i) mixture boils at constant temperature without change in composition (ii) $\\Delta H_{\\text{mix}} = 0$ (iii) $\\Delta H_{\\text{mix}} > 0$ and $\\Delta V_{\\text{mix}} > 0$ (iv) $\\Delta H_{\\text{mix}} < 0$ and $\\Delta V_{\\text{mix}} < 0$","opt":["a-i, b-iii, c-iv, d-ii","a-iii, b-ii, c-i, d-iv","a-ii, b-iii, c-iv, d-i","a-ii, b-iv, c-iii, d-i"],"ans":2,"cpt":"Ideal: zero enthalpy aur volume change. Positive deviation: A-B interaction kamzor, heat absorb hoti hai ($\\Delta H>0$). Negative deviation: A-B interaction strong, heat nikalti hai ($\\Delta H<0$). Azeotrope: constant boiling point par distill hota hai.","m":"Har type ke liye sign convention yaad karo aur uske baad eliminate karo.","s":["Ideal $\\rightarrow$ (ii) $\\Delta H = 0$.","Positive deviation $\\rightarrow$ (iii) $\\Delta H > 0, \\Delta V > 0$.","Negative deviation $\\rightarrow$ (iv) $\\Delta H < 0, \\Delta V < 0$.","Azeotrope $\\rightarrow$ (i) constant temperature par distill."],"r":"Mapping a-ii, b-iii, c-iv, d-i sahi hai.","w":["Ideal ke saath azeotrope wali property galat match hai.","Positive deviation ke saath $\\Delta H=0$ nahi aata.","Negative deviation ke saath zero enthalpy nahi hoti."],"t":"Sign rule: positive deviation = positive $\\Delta H$; negative deviation = negative $\\Delta H$. Ye kabhi mat ulatna."},{"id":35,"c":"Colligative properties","q":"Match the Column I (constant/property) with Column II (description). Column I: (a) Ebullioscopic constant (b) Cryoscopic constant (c) Henry's law constant (d) Osmotic pressure. Column II: (i) elevation in boiling point produced by a one molal solution (ii) depression in freezing point produced by a one molal solution (iii) relates partial pressure of a gas to its mole fraction in solution (iv) extra pressure applied on the solution side to prevent osmosis","opt":["a-iv, b-iii, c-ii, d-i","a-i, b-ii, c-iii, d-iv","a-i, b-ii, c-iv, d-iii","a-ii, b-i, c-iii, d-iv"],"ans":1,"cpt":"$K_b$ = 1 molal solution ka boiling point elevation; $K_f$ = 1 molal solution ka freezing point depression; $K_H$ Henry's law constant hai; osmotic pressure wo extra pressure hai jo osmosis rokta hai.","m":"Naam se hi kaam nikaal lo: ebullioscopic = boiling, cryoscopic = freezing.","s":["Ebullioscopic constant $\\rightarrow$ boiling point elevation (i).","Cryoscopic constant $\\rightarrow$ freezing point depression (ii).","$K_H$ $\\rightarrow$ gas ka partial pressure aur mole fraction ka relation (iii).","Osmotic pressure $\\rightarrow$ osmosis rokne wala extra pressure (iv)."],"r":"Mapping a-i, b-ii, c-iii, d-iv sahi hai.","w":["Ebullioscopic constant freezing point se related nahi hai.","Osmotic pressure $K_H$ se related nahi.","Henry's constant osmotic pressure nahi hai."],"t":"Word roots: ebullio = boil, cryo = cold. Bas isse match ka pehla step solve ho jata hai."},{"id":36,"c":"Osmotic pressure","q":"Match the Column I (term) with Column II (meaning). Column I: (a) Isotonic solutions (b) Hypotonic solution (c) Hypertonic solution (d) Reverse osmosis. Column II: (i) two solutions having the same osmotic pressure at a given temperature (ii) a solution having lower osmotic pressure than the solution with which it is compared (iii) a solution having higher osmotic pressure than the solution with which it is compared (iv) desalination of sea water by applying pressure greater than the osmotic pressure","opt":["a-ii, b-i, c-iv, d-iii","a-i, b-iii, c-ii, d-iv","a-i, b-ii, c-iii, d-iv","a-iv, b-ii, c-iii, d-i"],"ans":2,"cpt":"Isotonic = same osmotic pressure. Hypotonic = kam osmotic pressure (kam solute). Hypertonic = zyada osmotic pressure (zyada solute). Reverse osmosis = osmotic pressure se zyada pressure lagakar paani nikalna.","m":"Prefixes padho: iso = same, hypo = kam, hyper = zyada.","s":["Isotonic $\\rightarrow$ (i) same osmotic pressure.","Hypotonic $\\rightarrow$ (ii) lower osmotic pressure.","Hypertonic $\\rightarrow$ (iii) higher osmotic pressure.","Reverse osmosis $\\rightarrow$ (iv) desalination with $p > \\pi$."],"r":"Mapping a-i, b-ii, c-iii, d-iv sahi hai.","w":["Hypotonic ka matlab lower hai, higher nahi.","Isotonic ka matlab same hai, lower nahi.","Reverse osmosis ka matlab desalination hai, same pressure nahi."],"t":"RBC ke liye $0.9\\%$ $\\ce{NaCl}$ isotonic hai. Hypotonic me RBC phool kar phat jate hain; hypertonic me sikud jate hain."},{"id":37,"c":"Formulae","q":"Match the Column I (expression) with Column II (property described). Column I: (a) $\\Delta T_b = K_b m$ (b) $\\Delta T_f = K_f m$ (c) $\\Delta p/p_1^{\\circ} = x_2$ (d) $p_{\\text{total}} = p_1^{\\circ} + (p_2^{\\circ}-p_1^{\\circ})x_2$. Column II: (i) relative lowering of vapour pressure for a solution of a non-volatile solute (ii) depression in freezing point of a dilute solution (iii) total vapour pressure of an ideal binary mixture of two volatile liquids (iv) elevation in boiling point of a dilute solution","opt":["a-iv, b-i, c-ii, d-iii","a-i, b-ii, c-iii, d-iv","a-iv, b-ii, c-i, d-iii","a-ii, b-iv, c-iii, d-i"],"ans":2,"cpt":"Ye chaar standard formulae hain: $\\Delta T_b$ boiling point elevation, $\\Delta T_f$ freezing point depression, $\\Delta p/p^{\\circ}$ relative lowering, aur total pressure ka linear relation Raoult's law se aata hai.","m":"Subscript padho: $b$ = boiling, $f$ = freezing. Isse a aur b turant fix ho jate hain.","s":["$\\Delta T_b = K_b m$ $\\rightarrow$ boiling point elevation (iv).","$\\Delta T_f = K_f m$ $\\rightarrow$ freezing point depression (ii).","$\\Delta p/p^{\\circ} = x_2$ $\\rightarrow$ relative lowering (i).","$p_{\\text{total}} = p_1^{\\circ}+(p_2^{\\circ}-p_1^{\\circ})x_2$ $\\rightarrow$ ideal mixture ka total pressure (iii)."],"r":"Mapping a-iv, b-ii, c-i, d-iii sahi hai.","w":["$\\Delta T_b$ relative lowering nahi hai.","$\\Delta T_f$ boiling point se related nahi hai.","Relative lowering total vapour pressure ka formula nahi hai."],"t":"Yaad rakho: $b$ = boiling point (bubble), $f$ = freezing point (freeze). Subscript se hi answer lock ho jata hai."},{"id":38,"c":"van't Hoff factor","q":"Match the Column I (aqueous solution) with Column II (expected value of van't Hoff factor $i$). Column I: (a) $0.1\\,\\mathrm{m}$ $\\ce{NaCl}$ (b) $0.1\\,\\mathrm{m}$ glucose (c) $0.1\\,\\mathrm{m}$ $\\ce{CaCl2}$ (d) $0.1\\,\\mathrm{m}$ $\\ce{K4[Fe(CN)6]}$. Column II: (i) $i \\approx 1$ (ii) $i \\approx 2$ (iii) $i \\approx 3$ (iv) $i \\approx 5$","opt":["a-iv, b-i, c-iii, d-ii","a-ii, b-iii, c-i, d-iv","a-ii, b-i, c-iii, d-iv","a-i, b-ii, c-iii, d-iv"],"ans":2,"cpt":"van't Hoff factor = ek formula unit se bante particles ki sankhya (complete dissociation par). Glucose $\\rightarrow 1$, $\\ce{NaCl} \\rightarrow 2$, $\\ce{CaCl2} \\rightarrow 3$, $\\ce{K4[Fe(CN)6]} \\rightarrow 5$.","m":"Har formula unit ke ions gino: $\\ce{K4[Fe(CN)6]} = 4\\ce{K+} + 1$ complex anion = 5.","s":["Glucose dissociate nahi karta $\\rightarrow i \\approx 1$ (i).","$\\ce{NaCl} \\rightarrow \\ce{Na+}+\\ce{Cl-} \\rightarrow i \\approx 2$ (ii).","$\\ce{CaCl2} \\rightarrow \\ce{Ca^{2+}}+2\\ce{Cl-} \\rightarrow i \\approx 3$ (iii).","$\\ce{K4[Fe(CN)6]} \\rightarrow 4\\ce{K+}+\\ce{[Fe(CN)6]^{4-}} \\rightarrow i \\approx 5$ (iv)."],"r":"Mapping a-ii, b-i, c-iii, d-iv sahi hai.","w":["Glucose ke liye $i=2$ nahi hota.","$\\ce{CaCl2}$ ke liye $i=1$ galat hai.","$\\ce{K4[Fe(CN)6]}$ ke liye $i=2$ nahi hota, 5 hota hai."],"t":"Complex salt me coordination sphere ke andar ke ions alag nahi hote — sirf bahar wale ions count hote hain. $\\ce{[Fe(CN)6]^{4-}}$ ek hi particle hai."},{"id":39,"c":"Concentration terms","q":"Assertion (A): Molality is preferred over molarity for expressing concentration when accurate work is to be done in a laboratory whose temperature varies. Reason (R): Molality does not change with change in temperature.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Molarity volume par depend karti hai, aur volume temperature ke saath badalta hai. Molality mass par depend karti hai, jo temperature se nahi badalta.","m":"Aur R ko jodo: agar R sach me A ka kaaran hai to option A.","s":["Molality mass of solvent par based hai, isliye temperature change par constant rehti hai — R sahi.","Isi wajah se varying temperature par molality accurate rehti hai — A sahi.","R hi A ka kaaran hai."],"r":"Dono sach hain aur R hi A ka explanation hai: temperature-independent hone ki wajah se molality preferred hai.","w":["R ko alag nahi kiya ja sakta, yahi A ka kaaran hai.","R galat nahi hai.","A sach hai, isliye ye option galat."],"t":"Assertion-Reason me pehle R ko sach/galat decide karo; phir check karo ki R, A ko explain karta hai ya nahi."},{"id":40,"c":"Colligative properties","q":"Assertion (A): A $0.1\\,\\mathrm{m}$ aqueous solution of $\\ce{NaCl}$ has a higher boiling point than a $0.1\\,\\mathrm{m}$ aqueous solution of glucose. Reason (R): $\\ce{NaCl}$ gives two ions per formula unit in solution, so the number of solute particles is larger.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Boiling point elevation colligative property hai: $\\Delta T_b = iK_b m$. Same molality par jiska $i$ bada, uska $\\Delta T_b$ bada hoga.","m":"$i$ compare karo: glucose $i=1$, $\\ce{NaCl}$ $i=2$.","s":["Glucose ke liye $i=1$, $\\ce{NaCl}$ ke liye $i=2$.","$\\Delta T_b(\\ce{NaCl}) = 2K_b m$ jabki glucose ke liye $K_b m$.","Isliye $\\ce{NaCl}$ ka boiling point zyada — A sahi, aur R isi ka kaaran hai."],"r":"Dono sach hain; $\\ce{NaCl}$ ke do ions particle number badha dete hain, isliye boiling point zyada hota hai.","w":["R hi A ka explanation hai.","R galat nahi hai.","A sach hai."],"t":"Same molality par boiling point order: $\\ce{Al2(SO4)3} > \\ce{CaCl2} > \\ce{NaCl} >$ glucose. $i$ ke order se yaad rakho."},{"id":41,"c":"Non-ideal solutions","q":"Assertion (A): Benzene and toluene form an almost ideal solution. Reason (R): The enthalpy of mixing of benzene and toluene is large and positive.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":2,"cpt":"Benzene aur toluene dono non-polar, similar size ke molecules hain, isliye A-B interaction A-A aur B-B ke lagbhag barabar hoti hai. Ideal solution me $\\Delta H_{\\text{mix}} = 0$ hota hai, 'large and positive' nahi.","m":"Pehle A check karo (benzene-toluene ideal hai — haan), phir R ka sign dekho (positive $\\Delta H$ ideal ke liye galat).","s":["Benzene-toluene nearly ideal hai — A sach.","Ideal solution me $\\Delta H_{\\text{mix}} = 0$ hota hai.","R me 'large and positive' likha hai, jo galat hai — R false."],"r":"A sach hai par R galat hai, kyunki ideal mixture ka enthalpy of mixing zero hota hai.","w":["R sach nahi hai, isliye ye option galat.","A sach hai — benzene-toluene classic ideal pair hai.","A sach hai, isliye 'A false' galat hai."],"t":"Ideal pair = similar polarity + similar size. Benzene/toluene, hexane/heptane, chlorobenzene/bromobenzene."},{"id":42,"c":"Azeotropes","q":"Assertion (A): Solutions showing positive deviation from Raoult's law form minimum boiling azeotropes. Reason (R): Azeotropic mixtures can be separated into their components by fractional distillation.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":2,"cpt":"Positive deviation se vapour pressure badh jata hai, yani boiling point ghat jata hai — isliye minimum boiling azeotrope banta hai. Par azeotrope ka matlab hi ye hai ki vapour aur liquid ka composition same ho, isliye fractional distillation se separation possible nahi.","m":"A sach hai; R ki doosri baat (separation) check karo — azeotrope alag nahi hota.","s":["Positive deviation $\\rightarrow$ vapour pressure zyada $\\rightarrow$ boiling point kam $\\rightarrow$ minimum boiling azeotrope — A sach.","Azeotrope par $y=x$, isliye distillation se composition nahi badalta.","Isliye R galat hai."],"r":"A sach hai, R galat hai — azeotrope fractional distillation se separate nahi hota.","w":["R galat hai.","A sach hai, isliye 'A false' galat.","R galat hai, isliye ye bhi galat."],"t":"Azeotrope separation ke liye pressure swing distillation ya chemical treatment use hota hai, simple fractional distillation nahi."},{"id":43,"c":"Vapour pressure","q":"Assertion (A): The vapour pressure of $0.1\\,\\mathrm{m}$ aqueous $\\ce{NaCl}$ solution is greater than the vapour pressure of pure water at the same temperature. Reason (R): Addition of a non-volatile solute decreases the vapour pressure of the solvent.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":3,"cpt":"Non-volatile solute dalne par solvent ke surface par solvent molecules kam ho jate hain, isliye vapour pressure ghat ta hai, badhta nahi.","m":"A ka direction check karo: 'greater than pure water' — ye galat hai. R NCERT ki sahi line hai.","s":["Pehle given data note karo: $0.1\\,\\mathrm{m}$ $\\ce{NaCl}$ solution aur pure water, same temperature.","Solute dalne par vapour pressure ghat ta hai — R sach.","Isliye solution ka vapour pressure pure water se kam hoga, zyada nahi — A false.","Isliye sahi option D hai: A false, R true."],"r":"A galat hai (solution ka vapour pressure kam hota hai) jabki R sahi hai.","w":["A sach nahi hai — vapour pressure ghat ta hai.","R sach hai, isliye 'R false' galat.","A sach nahi hai."],"t":"Har colligative property ka source ek hi hai: solution ka vapour pressure kam ho jata hai."},{"id":44,"c":"van't Hoff factor","q":"Assertion (A): The van't Hoff factor of acetic acid dissolved in benzene is less than $1$. Reason (R): Acetic acid undergoes dimerisation in benzene.","opt":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"cpt":"Benzene non-polar solvent hai; acetic acid wahan hydrogen bonding se dimer ($\\ce{(CH3COOH)2}$) bana leta hai. Do molecules ek particle bante hain, isliye $i < 1$.","m":"Association $\\rightarrow$ kam particles $\\rightarrow i<1$, aur yahi R me likha hai.","s":["Acetic acid benzene me dimer banata hai — R sach.","Dimer banne se particles aadhe ho jate hain, isliye $i < 1$ — A sach.","R hi A ka kaaran hai."],"r":"Dono sach hain; dimerisation ki wajah se hi $i$ ek se kam hota hai.","w":["R hi explanation hai.","R galat nahi.","A sach hai."],"t":"Polar solvent (water) me acid dissociate hota hai ($i>1$), non-polar solvent (benzene) me dimer banata hai ($i<1$). Solvent badla to behaviour badal jata hai."},{"id":45,"c":"Raoult's law","q":"A graph is plotted between total vapour pressure ($y$-axis, mm Hg) and mole fraction of liquid A ($x$-axis, from 0 to 1) at constant temperature for a binary solution of two volatile liquids A and B which obeys Raoult's law. The graph is a straight line. At $x_A = 0$ the vapour pressure is $40\\,\\mathrm{mm\\,Hg}$ and at $x_A = 1$ it is $120\\,\\mathrm{mm\\,Hg}$. The total vapour pressure of the mixture at $x_A = 0.25$ is","opt":["$50\\,\\mathrm{mm\\,Hg}$","$60\\,\\mathrm{mm\\,Hg}$","$80\\,\\mathrm{mm\\,Hg}$","$100\\,\\mathrm{mm\\,Hg}$"],"ans":1,"fig":{"type":"plot","xlab":"x_{A} (mole fraction in liquid)","ylab":"p (mm Hg)","xmin":0,"xmax":1,"ymin":0,"ymax":140,"series":[{"name":"ideal solution (straight line)","pts":[[0,40],[0.25,60],[0.5,80],[0.75,100],[1,120]]}],"cap":"Graph of total vapour pressure against mole fraction of A for an ideal binary solution."},"sim":{"title":"Raoult's law explore karo","sliders":[{"name":"x","label":"x_{A} (0 se 1)","min":0,"max":1,"step":0.05,"val":0.25},{"name":"pA","label":"p^{o}_{A} (mm Hg)","min":20,"max":150,"step":5,"val":120},{"name":"pB","label":"p^{o}_{B} (mm Hg)","min":20,"max":150,"step":5,"val":40}],"calc":"var pt = pA*x + pB*(1-x); return [['p(A)', (pA*x).toFixed(1)+' mm Hg'], ['p(B)', (pB*(1-x)).toFixed(1)+' mm Hg'], ['p total', pt.toFixed(1)+' mm Hg']];"},"cpt":"Ideal solution me total vapour pressure $x_A$ ke saath linearly badalta hai: $p = p_A^{\\circ}x_A + p_B^{\\circ}(1-x_A)$. Graph straight line hota hai jiska intercept $p_B^{\\circ}$ aur slope $(p_A^{\\circ}-p_B^{\\circ})$ hota hai.","m":"Graph ki straight line ka use karo: $x_A = 0$ par $p = p_B^{\\circ} = 40$, $x_A = 1$ par $p = p_A^{\\circ} = 120$. Phir line ka equation banao.","s":["$x_A = 0$ par sirf B hai, isliye $p_B^{\\circ} = 40\\,\\mathrm{mm\\,Hg}$.","$x_A = 1$ par sirf A hai, isliye $p_A^{\\circ} = 120\\,\\mathrm{mm\\,Hg}$.","$x_A = 0.25$ par, $x_B = 0.75$.","$p = 120(0.25) + 40(0.75) = 30 + 30 = 60\\,\\mathrm{mm\\,Hg}$."],"r":"$p = p_A^{\\circ}x_A + p_B^{\\circ}x_B = 120(0.25) + 40(0.75) = 60\\,\\mathrm{mm\\,Hg}$.","w":["$50$ tab aata agar slope galat liya jaye; sahi value 60 hai.","80 to $x_A = 0.5$ par hota hai.","100 to $x_A = 0.75$ par hota hai."],"t":"Ideal mixture ke liye straight line ka equation hi Raoult's law hai: do end points se poora graph likh sakte ho."},{"id":46,"c":"Non-ideal solutions","q":"For a binary mixture of liquids A and B at $300\\,\\mathrm{K}$, the vapour pressure of pure A is $100\\,\\mathrm{mm\\,Hg}$ and that of pure B is $200\\,\\mathrm{mm\\,Hg}$. The total vapour pressure of the mixture containing $x_A = 0.5$, calculated from Raoult's law, is $150\\,\\mathrm{mm\\,Hg}$. The experimentally measured total vapour pressure of this mixture is $175\\,\\mathrm{mm\\,Hg}$. The mixture shows","opt":["positive deviation from Raoult's law","negative deviation from Raoult's law","ideal behaviour","behaviour that cannot be decided from the given data"],"ans":0,"fig":{"type":"table","head":["Quantity","Value"],"rows":[["$p^{\\circ}_{A}$","$100\\,\\mathrm{mm\\,Hg}$"],["$p^{\\circ}_{B}$","$200\\,\\mathrm{mm\\,Hg}$"],["$x_A$","$0.5$"],["$p$ (Raoult's law)","$150\\,\\mathrm{mm\\,Hg}$"],["$p$ (measured)","$175\\,\\mathrm{mm\\,Hg}$"]],"cap":"Data given in the question."},"cpt":"Positive deviation ka matlab: measured vapour pressure Raoult's law se predicted value se zyada. Negative deviation ka matlab: kam. Iska reason A-B interactions ka weak (positive) ya strong (negative) hona hai.","m":"Bas measured aur calculated pressure compare karo — koi formula lagane ki zarurat nahi.","s":["Calculated (Raoult) $= 150\\,\\mathrm{mm\\,Hg}$.","Measured $= 175\\,\\mathrm{mm\\,Hg}$.","$175 > 150$, isliye vapour pressure zyada hai $\\Rightarrow$ positive deviation."],"r":"Measured pressure predicted se zyada hai, isliye mixture positive deviation dikhata hai.","w":["Negative deviation me measured value kam hoti (yahan zyada hai).","Ideal hota to measured = predicted = 150 hota.","Data kaafi hai — direct comparison se decide ho jata hai."],"t":"Positive deviation ke saath yaad rakho: $\\Delta H > 0$, $\\Delta V > 0$, $p$ zyada, minimum boiling azeotrope."},{"id":47,"c":"Azeotropes","q":"The boiling points of mixtures of two liquids A and B at $1\\,\\mathrm{atm}$ are given in the table below, where $x_B$ is the mole fraction of B in the liquid mixture. The mixture behaves as an azeotrope containing approximately","opt":["$x_B = 0.2$","$x_B = 0.4$","$x_B = 0.6$","$x_B = 1.0$"],"ans":2,"fig":{"type":"table","head":["$x_B$","Boiling point ($^{\\circ}\\mathrm{C}$)"],"rows":[["0.0","80.0"],["0.2","78.5"],["0.4","77.0"],["0.6","76.0"],["0.8","77.5"],["1.0","82.0"]],"cap":"Boiling point of A-B mixtures at 1 atm."},"cpt":"Azeotrope wo composition hai jahan boiling point-composition curve par maximum ya minimum aata hai. Wahan par liquid ka composition distill karne par bhi nahi badalta.","m":"Table me sabse chhota ya sabse bada boiling point dhundo — wahi azeotropic composition hai.","s":["Table me boiling points compare karo: 80.0, 78.5, 77.0, 76.0, 77.5, 82.0.","Sabse kam boiling point $76.0\\,^{\\circ}\\mathrm{C}$ hai, jo $x_B = 0.6$ par hai.","Isliye azeotrope $x_B \\approx 0.6$ par hai (minimum boiling azeotrope)."],"r":"Minimum boiling point $x_B = 0.6$ par milta hai, isliye azeotropic composition lagbhag $x_B = 0.6$ hai.","w":["$x_B = 0.2$ par boiling point abhi ghat raha hai, minimum nahi hai.","$x_B = 0.4$ par bhi minimum nahi hai.","$x_B = 1.0$ pure B hai, maximum boiling point."],"t":"Azeotrope = curve ka extremum. Minimum boiling azeotrope $\\leftrightarrow$ positive deviation; maximum boiling azeotrope $\\leftrightarrow$ negative deviation."},{"id":48,"c":"Osmotic pressure","q":"The osmotic pressures of aqueous glucose solutions at $300\\,\\mathrm{K}$ are given in the table: for $0.010\\,\\mathrm{M}$, $\\pi = 0.246\\,\\mathrm{atm}$; for $0.020\\,\\mathrm{M}$, $\\pi = 0.492\\,\\mathrm{atm}$; for $0.030\\,\\mathrm{M}$, $\\pi = 0.738\\,\\mathrm{atm}$. Assuming the plot of $\\pi$ against concentration to be a straight line passing through the origin, the osmotic pressure of a $0.050\\,\\mathrm{M}$ glucose solution at the same temperature is","opt":["$0.246\\,\\mathrm{atm}$","$0.615\\,\\mathrm{atm}$","$1.23\\,\\mathrm{atm}$","$2.46\\,\\mathrm{atm}$"],"ans":2,"fig":{"type":"table","head":["Concentration ($\\mathrm{mol\\,L^{-1}}$)","$\\pi$ (atm)"],"rows":[["0.010","0.246"],["0.020","0.492"],["0.030","0.738"]],"cap":"Osmotic pressure of aqueous glucose solutions at 300 K."},"cpt":"$\\pi = CRT$: same temperature par $\\pi$ concentration ke directly proportional hota hai, isliye graph origin se guzarne wali straight line hoti hai. Slope $RT$ ke barabar hota hai.","m":"Data se proportionality constant (slope) nikaalo, phir nayi concentration par apply karo.","s":["Slope $= \\pi/C = 0.246/0.010 = 24.6\\,\\mathrm{atm\\,L\\,mol^{-1}}$.","Check: $0.492/0.020 = 24.6$ aur $0.738/0.030 = 24.6$ — same slope.","$C = 0.050\\,\\mathrm{M}$ ke liye $\\pi = 24.6 \\times 0.050 = 1.23\\,\\mathrm{atm}$."],"r":"Proportionality se $\\pi = 24.6\\,C$, isliye $0.050\\,\\mathrm{M}$ par $\\pi = 1.23\\,\\mathrm{atm}$.","w":["$0.246$ sirf $0.010\\,\\mathrm{M}$ ka value hai.","$0.615$ galat slope se aata hai.","$2.46$ $0.10\\,\\mathrm{M}$ ke liye hota hai."],"t":"Isi data se $RT = 24.6$, isliye $R = 24.6/300 = 0.082\\,\\mathrm{L\\,atm\\,K^{-1}\\,mol^{-1}}$ — dono approaches same answer deti hain."},{"id":49,"c":"Colligative properties","q":"Four aqueous solutions are prepared: (i) $0.1\\,\\mathrm{m}$ glucose, (ii) $0.05\\,\\mathrm{m}$ $\\ce{CaCl2}$, (iii) $0.1\\,\\mathrm{m}$ $\\ce{NaCl}$, (iv) $0.1\\,\\mathrm{m}$ $\\ce{K4[Fe(CN)6]}$. Assuming complete dissociation of the electrolytes, the solution having the highest freezing point is","opt":["$0.1\\,\\mathrm{m}$ glucose","$0.1\\,\\mathrm{m}$ $\\ce{NaCl}$","$0.05\\,\\mathrm{m}$ $\\ce{CaCl2}$","$0.1\\,\\mathrm{m}$ $\\ce{K4[Fe(CN)6]}$"],"ans":0,"cpt":"Freezing point depression particle ki total molality par depend karti hai: $\\Delta T_f = iK_f m$. Jitne kam particles, utni kam depression, yani freezing point utna zyada (0 ke qareeb).","m":"Har solution ki effective molality $= i \\times m$ nikaalo, phir sabse chhoti value chuno.","s":["Glucose: $i=1$, effective $= 0.1$.","$\\ce{CaCl2}$: $i=3$, effective $= 3\\times0.05 = 0.15$.","$\\ce{NaCl}$: $i=2$, effective $= 0.2$.","$\\ce{K4[Fe(CN)6]}$: $i=5$, effective $= 0.5$.","Sabse kam effective molality glucose ki hai, isliye uska freezing point sabse zyada hai."],"r":"Glucose ki effective particle molality sabse kam ($0.1$) hai, isliye uski depression sabse kam aur freezing point sabse zyada hai.","w":["$\\ce{NaCl}$ ki $0.2$ hai.","$\\ce{CaCl2}$ ki effective molality $0.15$ hai, glucose se zyada.","$\\ce{K4[Fe(CN)6]}$ ki $0.5$ hai — sabse kam freezing point."],"t":"Highest freezing point $\\leftrightarrow$ lowest particle concentration. Isliye har baar $i \\times m$ compare karo, sirf $m$ nahi."},{"id":50,"c":"Osmosis","q":"An apparatus consists of two compartments separated by a semipermeable membrane which allows only solvent (water) molecules to pass through it. Compartment P contains $0.1\\,\\mathrm{M}$ aqueous glucose solution and compartment Q contains $0.1\\,\\mathrm{M}$ aqueous $\\ce{NaCl}$ solution, both at the same temperature and at the same initial level. Considering complete dissociation of $\\ce{NaCl}$, it is correct to say that","opt":["compartment P is hypertonic and water moves from Q to P","the two solutions are isotonic and no net movement of water occurs","compartment Q is hypertonic and water moves from P to Q","solute particles move from Q to P through the membrane"],"ans":2,"fig":{"type":"osmosis"},"cpt":"Semipermeable membrane sirf solvent ko jaane deti hai. Solvent kam particle concentration wali side se zyada particle concentration wali side jata hai. Yahan Q me particles $0.1\\times2 = 0.2\\,\\mathrm{M}$ hain aur P me $0.1\\,\\mathrm{M}$.","m":"Effective particle concentration compare karo (molarity $\\times i$), phir direction decide karo.","s":["P: glucose, $i = 1$, effective $= 0.1\\,\\mathrm{M}$.","Q: $\\ce{NaCl}$, $i = 2$, effective $= 0.2\\,\\mathrm{M}$.","Q ka osmotic pressure zyada hai, isliye Q hypertonic hai.","Water P se Q ki taraf jayega (kam se zyada particle concentration ki taraf)."],"r":"Q me particles zyada hain, isliye Q hype
