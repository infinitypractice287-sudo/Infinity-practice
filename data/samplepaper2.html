<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>NEET UG Sample Paper 2 · 180 Questions</title><style>:root{--bg:#12141a;--card:#1b1f27;--text:#dcdfe4;--muted:#9aa3b2;--line:#303643;--green:#65c995;--red:#ed8787;--blue:#91a9f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 system-ui, sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top,.card{background:var(--card);border:1px solid #282e39;border-radius:15px;padding:17px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted);font-size:14px}.score{border:1px solid var(--line);border-radius:99px;padding:5px 12px}.bar{height:5px;background:#292e38;margin:10px 0 16px;border-radius:5px}.bar i{display:block;background:var(--blue);height:100%;width:0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:8px 0 15px}.grid button,.btn{background:#252b36;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:44px;cursor:pointer}.grid .done{background:#20382e}.grid .cur{outline:2px solid var(--blue)}.question{font-size:19px;font-weight:650;white-space:pre-wrap;margin:8px 0 15px}.fig{padding:10px;background:#151922;border:1px solid var(--line);border-radius:10px;margin:12px 0}.fig svg{width:100%;height:auto;max-height:180px}.opts{display:grid;gap:8px}.opt{display:flex;align-items:center;text-align:left;gap:10px;min-height:50px;background:#202530;color:var(--text);border:1px solid #394150;border-radius:10px;padding:10px 13px;cursor:pointer;font:inherit}.opt .l{font-weight:750;color:var(--blue);min-width:25px}.opt.correct{background:#19372c;border-color:#398b67}.opt.wrong{background:#3a2327;border-color:#a64e57}.opt:disabled{cursor:default}.ex{padding:13px;margin-top:12px;background:#171b22;border:1px solid var(--line);border-radius:10px}.ex h3{font-size:16px;color:#bac8ee;margin:7px 0 2px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn.primary{background:#35466f}.btn.submit{background:#314b3d}.flag{color:#ffd28b;border-left:3px solid #c69342;padding:6px 10px;margin:10px 0}.result{text-align:center}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:repeat(10,1fr)}.wrap{padding:10px}.question{font-size:18px}}</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"></head><body><main class="wrap"><header class="top"><div><b>NEET UG Sample Paper 2</b><div class="muted">All 180 questions · +4 correct · −1 incorrect · 0 unattempted</div></div><div class="score">Live <b id="score">0</b> / 720</div></header><div class="bar"><i id="progress"></i></div><div class="card"><b>Question map</b><div class="grid" id="grid"></div><div class="muted">Green = answered · numbered buttons jump to any question</div></div><article class="card" id="panel"><div class="muted" id="num"></div><div class="question" id="q"></div><div id="fig"></div><div class="opts" id="opts"></div><div id="feedback"></div><div id="explanation"></div><div class="nav"><button class="btn" id="prev">Previous</button><button class="btn primary" id="next">Next</button><button class="btn" id="skip">Skip</button><button class="btn submit" id="submit">Submit</button></div></article><section id="result" class="card result hidden"></section></main><script>
const raw=[{"id":1,"q":"A closed organ pipe has length $\\ell$. The air in it is vibrating in the 3rd overtone with maximum displacement amplitude $a$. What is the amplitude at a distance $\\ell/7$ from the closed end?","opt":["$a$","$\\dfrac{a}{2}$","$\\dfrac{a\\sqrt{3}}{2}$","$0$"],"ans":0,"flag":"","src":"The figure shows variation of displacement of particles in a closed organ pipe for 3rd overtone. For third overtone ℓ = 7𝜆 4 or 𝜆 = 4ℓ 7 or 𝜆 4 = ℓ 7 Hence the amplitude at P at a distance ℓ/7 from closed end is ' 𝑎 ' because there is an an","fig":"","c":"Closed pipes support standing waves with a displacement node at the closed end and an antinode at the open end. Amplitude depends on position: it is zero at a node and maximum at an antinode.","m":"For a closed pipe, only odd harmonics occur. The 3rd overtone is the 7th harmonic, so its wave number is $k=7\\pi/(2\\ell)$. The local amplitude is $a|\\sin(kx)|$.","s":["Measure position from the closed end: $x=\\ell/7$.","For the 7th harmonic, $kx=[7\\pi/(2\\ell)](\\ell/7)$.","Cancel $7$ and $\\ell$: $kx=\\pi/2$.","Evaluate the position factor: $|\\sin(\\pi/2)|=1$.","Multiply by the maximum amplitude: $a\\times1=a$."],"r":"Final answer: Option A, $a$.","w":["B halves the amplitude without applying the position factor.","C uses the wrong phase angle; at this position the phase is $\\pi/2$.","D treats the point as a node, but it is an antinode for this harmonic."],"t":"Closed-end node aur open-end antinode yaad rakho; odd harmonics hi allowed hote hain.","sim":""},{"id":2,"q":"Two bar magnets, each of magnetic moment $M$, are placed in the two arrangements shown. If the net magnetic moments in arrangements (a) and (b) are $M_A$ and $M_B$, respectively, find $M_A/M_B$.","opt":["$2$","$\\sqrt{3}$","$\\sqrt{2}$","$\\dfrac{1}{\\sqrt{3}}$"],"ans":1,"flag":"","src":"","fig":"<svg viewBox=\"0 0 540 205\" role=\"img\" aria-label=\"Two arrangements of equal bar magnets\"><g fill=\"none\" stroke=\"#cbd2df\" stroke-width=\"2\"><path d=\"M74 133 L214 32\"/><path d=\"M74 133 L205 38\"/><path d=\"M76 162 L225 162\"/><path d=\"M76 162 L218 162\"/><path d=\"M320 133 L462 32\"/><path d=\"M320 133 L452 38\"/><path d=\"M322 162 L472 162\"/></g><g font-size=\"15\" fill=\"#dcdfe4\" font-family=\"system-ui\"><text x=\"66\" y=\"126\">N</text><text x=\"210\" y=\"28\">S</text><text x=\"66\" y=\"182\">N</text><text x=\"219\" y=\"182\">S</text><text x=\"309\" y=\"137\">S</text><text x=\"459\" y=\"29\">N</text><text x=\"309\" y=\"182\">N</text><text x=\"466\" y=\"182\">S</text><text x=\"143\" y=\"188\">(a)</text><text x=\"386\" y=\"188\">(b)</text><text x=\"100\" y=\"152\">60°</text><text x=\"346\" y=\"152\">60°</text></g><path d=\"M88 157 A26 26 0 0 1 107 139\" fill=\"none\" stroke=\"#91a9f5\" stroke-width=\"2\"/><path d=\"M333 157 A26 26 0 0 1 352 139\" fill=\"none\" stroke=\"#91a9f5\" stroke-width=\"2\"/></svg>","c":"Magnetic moment is a vector. Its direction inside a bar magnet is from its south pole to its north pole. Equal vectors add according to the angle between their directions, not simply by adding their magnitudes.","m":"Find each moment direction from S to N in the given drawing. For two equal vectors $M$ at angle $\\theta$, the resultant magnitude is $\\sqrt{M^2+M^2+2M^2\\cos\\theta}$.","s":["In (a), the slanted magnet points from its S end to N (down-left); the horizontal magnet points from S to N (right-to-left). Their moment directions differ by $60^\\circ$.","Thus $M_A=\\sqrt{M^2+M^2+2M^2\\cos60^\\circ}$.","Use $\\cos60^\\circ=1/2$: $M_A=\\sqrt{2M^2+M^2}=\\sqrt{3M^2}=\\sqrt3M$.","In (b), the slanted moment points up-right and the horizontal moment points left; the angle is $120^\\circ$.","So $M_B=\\sqrt{2M^2+2M^2\\cos120^\\circ}=\\sqrt{2M^2-M^2}=M$.","Divide: $M_A/M_B=(\\sqrt3M)/M=\\sqrt3$."],"r":"Final answer: Option B, $\\sqrt{3}$.","w":["2 would require the two moments in (a) to point in exactly the same direction.","Correct: the resultants are $\\sqrt3M$ and $M$.","$\\sqrt2$ comes from adding equal vectors at a right angle, not the shown angles.","This reverses the ratio; the first resultant is larger than the second."],"t":"Pehle har magnet ka S-to-N direction mark karo, phir vector angle nikalo.","sim":""},{"id":3,"q":"In Young’s double-slit arrangement, water is filled in the space between the slits and the screen. What happens to the fringe pattern?","opt":["The fringe pattern shifts upwards, but fringe width remains unchanged.","Fringe width decreases and the central bright fringe shifts upwards.","Fringe width increases and the central bright fringe does not shift.","Fringe width decreases and the central bright fringe does not shift."],"ans":3,"flag":"","src":"Filling water does not change the relative phase difference between the slits and screen; it changes wavelength but not the zero path difference condition. So there is no shift in central maxima but fringe width decreases because fringe wid","fig":"","c":"The bright and dark fringes are formed by interference. The fringe width depends on the wavelength in the medium. Light travels more slowly in water, so its wavelength becomes shorter while its frequency stays the same.","m":"Use Young’s fringe-width relation $\\beta=\\lambda D/d$. In a medium of refractive index $n$, wavelength becomes $\\lambda/n$. Since the same medium fills the full space from slits to screen, both paths are changed symmetrically and the central maximum stays centered.","s":["In air, the fringe width is $\\beta=\\lambda D/d$.","For water, wavelength is $\\lambda_w=\\lambda/n_w$, with $n_w>1$.","Therefore $\\beta_w=\\lambda_wD/d=\\beta/n_w<\\beta$: the fringes get closer.","The two slit-to-screen paths have the same medium and symmetric geometry.","Hence no one path gets an extra relative phase; the central bright fringe does not shift."],"r":"Final answer: Option D, fringe width decreases and the central bright fringe does not shift.","w":["A uniform medium reduces wavelength, so the fringe width cannot stay unchanged; no upward shift is produced.","The width decrease is right, but identical medium on both paths means no central shift.","The wavelength becomes shorter, so fringe width decreases rather than increases."],"t":"Uniformly filling the whole optical path changes fringe spacing, not the central position.","sim":""},{"id":4,"q":"A mixture of two non-reacting gases A and B is kept at constant temperature. A is diatomic and B is monoatomic. If the ratio of their molecular masses is $M_A/M_B=4$, what is the ratio of their rms speeds $v_A/v_B$?","opt":["$1:1$","$1:2$","$1:\\sqrt{2}$","$\\sqrt{2}:1$"],"ans":1,"flag":"","src":"vrms = √3RTM So, vrms ∝ 1 √M (vrms )A (vrms )B = √MB MA = √14 = 1: 2","fig":"","c":"At the same temperature, gas molecules have the same average translational kinetic energy. A heavier molecule therefore moves more slowly. For rms speed, molecular mass matters; the number of atoms in a molecule does not add a separate factor.","m":"Use $v_{\\rm rms}=\\sqrt{3kT/M}$. Since both gases have the same temperature, constants cancel and $v_A/v_B=\\sqrt{M_B/M_A}$.","s":["Write the mass ratio: $M_A/M_B=4$, so $M_B/M_A=1/4$.","Substitute: $v_A/v_B=\\sqrt{1/4}$.","Take the square root: $v_A/v_B=1/2$.","Express as a ratio: $v_A:v_B=1:2$."],"r":"Final answer: Option B, $1:2$.","w":["Equal speeds would incorrectly ignore that A has four times the molecular mass.","Correct: the heavier gas has half the rms speed.","This applies the wrong mass dependence; speed scales as inverse square root of mass.","This would make A faster, though A is the heavier molecule."],"t":"At equal temperature, $v_{rms}\\propto1/\\sqrt{M}$.","sim":""},{"id":5,"q":"Assertion: An electric dipole experiences maximum force in a uniform electric field when its axis is at right angles to the field.\nReason: When the dipole axis is perpendicular to a uniform external electric field, the torque on it is zero. Choose the correct assertion–reason option.","opt":["Both Assertion and Reason are true, and Reason correctly explains Assertion.","Both Assertion and Reason are true, but Reason does not correctly explain Assertion.","Assertion is true, but Reason is false.","Both Assertion and Reason are false."],"ans":3,"flag":"","src":"Net force on dipole in uniform electric field is zero. 𝜏 = PEsin 𝜃 when 𝜃 = 90∘ ⇒ 𝜏 = 𝜏max = PE.","fig":"","c":"An electric dipole has equal and opposite charges. In a uniform field, the forces on the two charges are equal and opposite, so their vector sum is zero for every orientation. They can still form a turning effect called torque.","m":"Use net force $\\vec F=q\\vec E-q\\vec E=0$ for a uniform field. Torque magnitude is $\\tau=pE\\sin\\theta$, where $\\theta$ is the angle between dipole moment and field.","s":["The positive charge feels force $qE$ along the field.","The negative charge feels force $qE$ opposite the field.","Equal opposite forces cancel: net force is $qE-qE=0$ at every orientation. So the Assertion (maximum force at right angle) is false.","At right angles, $\\theta=90^\\circ$ and $\\sin90^\\circ=1$.","Thus torque is $\\tau=pE$, its maximum value—not zero. So the Reason is also false."],"r":"Final answer: Option D, both Assertion and Reason are false.","w":["The assertion is false, and the reason claims zero torque where torque is maximum.","Neither statement is true, so this cannot be correct.","The assertion is not true: a uniform field gives zero net force on a dipole."],"t":"Uniform field: net force zero; torque is maximum when dipole is perpendicular to the field.","sim":""},{"id":6,"q":"A semiconductor $X$ is made by doping germanium with arsenic ($Z=33$). A second semiconductor $Y$ is made by doping germanium with indium ($Z=49$). They are joined end to end and connected to a battery as shown. Which statement is correct?","opt":["$X$ is P-type, $Y$ is N-type, and the junction is forward biased.","$X$ is P-type, $Y$ is P-type, and the junction is forward biased.","$X$ is P-type, $Y$ is N-type, and the junction is reverse biased.","$X$ is N-type, $Y$ is P-type, and the junction is reverse biased."],"ans":3,"flag":"","src":"Arsenic has five valence electrons, so it a donor impurity. Hence 𝑋 becomes 𝑁-type semiconductor. Indium has only three outer electrons, so it is an acceptor impurity. Hence 𝑌 becomes 𝑃-type semiconductor. Also 𝑁 (i.e., ) is connected to po","fig":"<svg viewBox=\"0 0 520 220\" role=\"img\" aria-label=\"Circuit with X and Y semiconductor regions and a battery\"><g fill=\"none\" stroke=\"#d5dbe6\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M85 65H184M336 65H435V169H281M239 169H85V65\"/><path d=\"M239 151V187M281 158V180\"/><rect x=\"184\" y=\"47\" width=\"76\" height=\"36\" rx=\"2\" fill=\"#293447\"/><rect x=\"260\" y=\"47\" width=\"76\" height=\"36\" rx=\"2\" fill=\"#3a3042\"/></g><g fill=\"#dcdfe4\" font-family=\"system-ui\" font-size=\"17\" text-anchor=\"middle\"><text x=\"222\" y=\"71\">X</text><text x=\"298\" y=\"71\">Y</text><text x=\"229\" y=\"143\" font-size=\"13\">long line (+)</text><text x=\"290\" y=\"143\" font-size=\"13\">short line (−)</text></g></svg>","c":"Germanium is tetravalent. An impurity with five valence electrons donates an extra electron and makes n-type material. An impurity with three valence electrons leaves a hole and makes p-type material. A p–n junction is forward biased when p is connected to positive and n to negative.","m":"Classify the dopants by valence, then read the battery polarity from the long and short cell lines. Compare the p-side/n-side connections with the forward-bias rule.","s":["Arsenic is in group 15 and has five valence electrons; in Ge it donates an electron. Therefore $X$ is n-type.","Indium is in group 13 and has three valence electrons; it creates a hole. Therefore $Y$ is p-type.","In the diagram, the long cell line on the left is positive; the short line on the right is negative.","Thus $X$ (n side) is connected to positive and $Y$ (p side) to negative.","Forward bias needs p-to-positive and n-to-negative. Both connections here are opposite, so the junction is reverse biased."],"r":"Final answer: Option D, $X$ is N-type, $Y$ is P-type, and the junction is reverse biased.","w":["The dopant types are reversed: As makes n-type and In makes p-type.","Both regions cannot be p-type; arsenic is pentavalent and makes n-type Ge.","The material types are stated in reverse; the bias direction is reverse, but X is n-type and Y is p-type."],"t":"Cell symbol mein long line positive hoti hai; forward bias ke liye p ko positive jodo.","sim":""},{"id":7,"q":"In Bohr’s model of the hydrogen atom, which pair of quantities is quantized?","opt":["Energy and linear momentum","Linear and angular momentum","Energy and angular momentum","None of the above"],"ans":2,"flag":"Q7 has a potentially non-unique key. Source answer or wording appears ambiguous/inconsistent; expected key retained provisionally.","src":"According to Bohr's theory of the 𝐻 atom, electrons can revolve only in those orbits in which their angular momentum is an integral multiple of ℎ 2𝜋, where ℎ is Plank's constant. Angular momentum = 𝑚𝑣𝑟 = 2ℎ 2𝜋 Hence, angular momentum is qua","fig":"","c":"Quantized ka matlab allowed discrete values. Bohr model mein energy aur angular momentum discrete hain. Dhyaan: allowed circular orbits se linear momentum ka magnitude bhi discrete values leta hai, isliye original options mein wording overlap karti hai.","m":"Bohr ke direct postulates $L=n\\hbar$ aur $E_n=-13.6\\,\\text{eV}/n^2$ hain. In circular orbits mein $p_n=mv_n$ bhi har integer $n$ ke liye alag discrete value leta hai; isliye broad physical meaning mein option A bhi defend kiya ja sakta hai. Exam-intended answer aam taur par option C hota hai.","s":["Angular-momentum postulate: $L=n\\hbar$, jahan $n=1,2,3,\\ldots$; values discrete hain.","Hydrogen energy $E_n=-13.6\\,\\text{eV}/n^2$ hai; integer $n$ se energy levels discrete milte hain.","Circular orbit mein $L=rp$ aur Bohr radius $r_n$ bhi discrete hai; isliye $p_n=L_n/r_n$ bhi discrete values leta hai.","Isliye wording 'which pair are quantized' strict meaning mein A aur C dono ko sahi bana sakti hai.","Standard intended key direct Bohr-postulates wali pair—energy and angular momentum—hai, yani C; par question ko exactly-one-answer MCQ kehna ambiguous hai."],"r":"Intended answer: Option C, energy and angular momentum. FLAG: Option A may also be valid if linear momentum's discrete allowed-orbit values count as quantized.","w":["Energy is discrete, and linear momentum is also discrete across allowed Bohr orbits; A is a plausible second answer, so the question is ambiguous.","Energy and angular momentum are both quantized; this is the conventional intended key.","This is the conventional intended option, but not uniquely correct under the broader interpretation.","Not correct: at least energy and angular momentum are quantized."],"t":"Bohr ka explicit quantization rule angular momentum ke liye hai; exam wording agar derived quantities ko include kare, to momentum par ambiguity ho sakti hai.","sim":""},{"id":8,"q":"A transformer has 10 turns in its primary coil and 100 turns in its secondary coil. The primary voltage and current are 2 V and 1 A. If its efficiency is 90%, what are the secondary voltage and current, respectively?","opt":["20 V and 0.1 A","0.2 V and 1 A","20 V and 0.09 A","0.2 V and 0.9 A"],"ans":2,"flag":"","src":"The relationship between the number of turns ( 𝑁 ) and the voltage ( 𝑉 ) in a transformer is given by the transformer equation: 𝑉𝑠 𝑉𝑝 = 𝑁𝑠 𝑁𝑝 Given 𝑉𝑝 = 2 V, 𝑁𝑝 = 10, and 𝑁𝑠 = 100 : 𝑉𝑠 = 𝑉𝑝 × (𝑁𝑠𝑁𝑝) = 2 × (10010 ) = 20 V The efficiency (𝜂) ","fig":"","c":"A transformer changes voltage according to its turns ratio. It does not create energy: with efficiency below 100%, output power is a fraction of input power. The secondary voltage rises here, so its current must be much smaller.","m":"Use $V_s/V_p=N_s/N_p$ for the ideal voltage ratio, then $P_{out}=\\eta P_{in}$ and $P_{out}=V_sI_s$ to include efficiency.","s":["Turns ratio is $N_s/N_p=100/10=10$.","Secondary voltage is $V_s=2\\times10=20\\,\\text{V}$.","Input power is $P_{in}=V_pI_p=2\\times1=2\\,\\text{W}$.","Output power is $P_{out}=0.90\\times2=1.8\\,\\text{W}$.","Secondary current is $I_s=P_{out}/V_s=1.8/20=0.09\\,\\text{A}$."],"r":"Final answer: Option C, 20 V and 0.09 A.","w":["This uses 100% efficiency; it would give $2/20=0.1$ A.","A 10:1 step-up transformer cannot reduce 2 V to 0.2 V.","Correct: the turns ratio gives 20 V and efficiency gives 0.09 A."],"t":"Pehle turns ratio se voltage, phir efficiency se output power aur current nikalo.","sim":""},{"id":9,"q":"A horizontal tube has varying cross-section, with radii 0.1 m at M and 0.05 m at N. For a streamline flow of liquid, how does the volume flow rate compare at M and N?","opt":["It continuously changes with time.","It is greater at M than at N.","It is greater at N than at M.","It is the same at M and N."],"ans":3,"flag":"","src":"(d) According to principle of continuity, for a streamline flow of fluid through a tube of non- uniform crosssection the rate of flow of fluid (Q) is same at every point in the tube. i.e., Av = constant ⇒ A1v1 = A2v2 ===== PAGE 18 ===== The","fig":"<svg viewBox=\"0 0 520 185\" role=\"img\" aria-label=\"Streamline flow through a tube narrowing from M to N\"><path d=\"M70 65 C175 65 270 35 430 45 L430 75 C280 85 170 112 70 118 Z\" fill=\"#232a35\" stroke=\"#cbd2df\" stroke-width=\"2.4\"/><ellipse cx=\"73\" cy=\"91\" rx=\"10\" ry=\"27\" fill=\"#39465b\" stroke=\"#d4dbe7\" stroke-width=\"2\"/><ellipse cx=\"430\" cy=\"60\" rx=\"8\" ry=\"15\" fill=\"#39465b\" stroke=\"#d4dbe7\" stroke-width=\"2\"/><path d=\"M22 92H59\" stroke=\"#91a9f5\" stroke-width=\"3\"/><path d=\"M52 85L62 92L52 99\" fill=\"none\" stroke=\"#91a9f5\" stroke-width=\"3\"/><g fill=\"#dcdfe4\" font-size=\"17\" font-family=\"system-ui\"><text x=\"28\" y=\"77\">M</text><text x=\"445\" y=\"66\">N</text><text x=\"88\" y=\"153\" font-size=\"14\">wide cross-section</text><text x=\"354\" y=\"115\" font-size=\"14\">narrow section</text></g></svg>","c":"For steady flow, liquid does not pile up inside one section while disappearing from another. Incompressible liquid crossing any section per second must therefore have the same volume flow rate. The speed changes with area, but the flow rate does not.","m":"Use the continuity equation $Q=Av=\\text{constant}$ for steady incompressible flow. The narrower section has higher speed so that the same volume passes each second.","s":["At M, the cross-sectional area is $A_M=\\pi(0.1)^2=0.01\\pi\\,\\text{m}^2$.","At N, $A_N=\\pi(0.05)^2=0.0025\\pi\\,\\text{m}^2$; this area is one quarter of $A_M$.","Continuity gives $A_Mv_M=A_Nv_N$.","Since $A_N=A_M/4$, the speed at N is $v_N=4v_M$.","But volume flow rate is $Q=Av$: $Q_M=A_Mv_M$ and $Q_N=A_Nv_N=(A_M/4)(4v_M)=A_Mv_M=Q_M$."],"r":"Final answer: Option D, the flow rate is the same at M and N.","w":["In steady flow, the amount passing a section per unit time does not keep changing.","A larger cross-section does not mean a greater flow rate; speed is lower there.","Speed is greater at N, but the question asks flow rate. The product area × speed is equal."],"t":"Area kam ho to speed badhti hai; $Av$ constant rehta hai.","sim":""},{"id":10,"q":"Two bodies, each of mass $M$, are fixed with separation $2L$. A particle of mass $m$ is projected from the midpoint of the line joining their centres, perpendicular to that line. Let the gravitational constant be $G$. Which statement(s) is/are correct?\n(a) The minimum initial speed to escape the gravitational field is $4\\sqrt{GM/L}$.\n(b) The minimum initial speed to escape the gravitational field is $2\\sqrt{GM/L}$.\n(c) The minimum initial speed to escape the gravitational field is $\\sqrt{2GM/L}$.\n(d) The energy of the particle remains constant.","opt":["(a) and (b)","(b) and (d)","(a) and (c)","(a) and (d)"],"ans":1,"flag":"Q10 figure reconstructed conceptually; source supplied no separate figure.","src":"By C.O.M.E. − GMmL × 2 + 12 mv2 = 0 1 2 mv2 = 2GMmL ⇒ v = 2√GML Since the two masses 𝑀 are fixed, no external work is done on 𝑚. So mechanical energy of 𝑚 is conserved.","fig":"<svg viewBox=\"0 0 520 190\" role=\"img\" aria-label=\"Two fixed masses separated by 2L and a particle projected perpendicular from the midpoint\"><g stroke=\"#cbd2df\" stroke-width=\"2\" fill=\"#273244\"><circle cx=\"145\" cy=\"94\" r=\"28\"/><circle cx=\"375\" cy=\"94\" r=\"28\"/><circle cx=\"260\" cy=\"94\" r=\"7\" fill=\"#edc77a\"/></g><g fill=\"#dcdfe4\" font-family=\"system-ui\" text-anchor=\"middle\"><text x=\"145\" y=\"100\" font-size=\"16\">M</text><text x=\"375\" y=\"100\" font-size=\"16\">M</text><text x=\"260\" y=\"78\" font-size=\"14\">m</text><text x=\"260\" y=\"130\" font-size=\"14\">midpoint</text></g><path d=\"M145 144H375\" stroke=\"#9aa3b2\" stroke-width=\"1.5\"/><path d=\"M145 138V150M375 138V150\" stroke=\"#9aa3b2\" stroke-width=\"1.5\"/><text x=\"260\" y=\"169\" fill=\"#dcdfe4\" text-anchor=\"middle\" font-family=\"system-ui\">2L</text><path d=\"M260 88V26\" stroke=\"#91a9f5\" stroke-width=\"3\"/><path d=\"M253 38L260 25L267 38\" fill=\"none\" stroke=\"#91a9f5\" stroke-width=\"3\"/><text x=\"278\" y=\"37\" fill=\"#dcdfe4\" font-family=\"system-ui\" font-size=\"14\">projection</text><text x=\"185\" y=\"82\" fill=\"#9aa3b2\" font-family=\"system-ui\" font-size=\"13\">L</text><text x=\"326\" y=\"82\" fill=\"#9aa3b2\" font-family=\"system-ui\" font-size=\"13\">L</text></svg>","c":"The particle starts midway, so it is a distance $L$ from each fixed mass. Gravitational potential energy is the sum of contributions from both masses. Escape requires just enough initial kinetic energy to make total mechanical energy zero at infinity. Because the attracting masses are fixed and the force is conservative, the particle’s mechanical energy stays constant.","m":"Add the two gravitational potentials, set initial total energy to zero for the threshold escape speed, and separately use conservation of mechanical energy in a time-independent gravitational field.","s":["Distance to each fixed mass at launch is $L$.","Potential energy from one mass is $-GMm/L$; from both, $U=-GMm/L-GMm/L=-2GMm/L$.","At minimum escape speed, final energy at infinity is zero. So initial total energy is also zero: $\\tfrac12mv^2-2GMm/L=0$.","Move potential term: $\\tfrac12mv^2=2GMm/L$.","Multiply by $2/m$: $v^2=4GM/L$, hence $v=2\\sqrt{GM/L}$. This verifies statement (b), not (a) or (c).","The masses are fixed, so the gravitational potential does not depend explicitly on time. Kinetic plus potential energy is conserved; statement (d) is true.","The true pair is therefore (b) and (d)."],"r":"Final answer: Option B, statements (b) and (d).","w":["(b) is true but (a) is not; the escape speed is $2\\sqrt{GM/L}$, not twice that.","Correct: the threshold speed follows from total potential $-2GMm/L$, and mechanical energy is conserved.","(c) misses the contribution of the second mass; neither (a) nor (c) is correct.","(d) is true, but (a) gives an escape speed twice the calculated value."],"t":"Potential energies add. For multiple fixed masses, sum every $-GMm/r$ contribution before finding escape speed.","sim":""},{"id":11,"q":"A storage battery of emf 8.0 V and internal resistance 0.5Ω is being charged by 128 V DC supply using a series resistance of 11.5Ω, what is the terminal voltage of battery?","opt":["10 V","8 V","18 V","13 V"],"ans":3,"flag":"","src":"V = E + I. r. ⇒ V = 8 + (128 − 8)(0.5 + 11.5) × 0.5 ⇒ V = 8 + 5 = 13 volts","fig":""},{"id":12,"q":"The 𝑛 division of main scale coincides with (n + 1) division of vernier scale. Given one main scale division is equal to ' 𝑎 ' units. Find the least count of the vernier:-","opt":["𝑎 𝑛+1","(n + 1)","(𝑛+1) 𝑎","an"],"ans":0,"flag":"","src":"( n + 1 ) VSD = n MSD 1VSD = ( n n+1) MSD L.C. = 1MSD − 1VSD L.C. = [1 + 𝑛 𝑛+1] MSD L.C. = ( 1 𝑛+1) 𝑎 = 𝑎 𝑛+1","fig":""},{"id":13,"q":"A diatomic ideal gas undergoes a thermodynamic change according to the P − V diagram shown in the figure. The total heat given to the gas is nearly (ln 2 = 0.693)","opt":["2.5P0 V0","1.4P0 V0","3.9P0 V0","1.1P0 V0"],"ans":2,"flag":"Original figure/structure is not available as text; needs figure verification.","src":"𝑄 = 𝑄𝐴𝐵 + 𝑄𝐵𝐶 = nCvΔT + nRTln ( V2 V1) = n ⋅ 5R2 ⋅ P0 V0nR + 2P0 V0ln 2 = 2.5P0 V0 + 2P0 V0ln 2 = 3.9P0 V0","fig":""},{"id":14,"q":"A body is projected up with a speed ' 𝑢 ' and the time taken by it is 𝑇 to reach the maximum height H. Pick out the correct statement","opt":["It reaches H/2 in T/2 sec","It acquires velocity 𝑢/2 in T/2 sec","Its velocity is 𝑢/2 at 𝐻/2","Same velocity at 2 T"],"ans":1,"flag":"","src":"∵ T = u g ∴ u = gt ∵ v = u + at ∴ v = u − g × T2 = u − u2 ∴ v = u2 So, at t = T 2 , v = u 2","fig":""},{"id":15,"q":"The resistance of a conductor at 15∘C is 16Ω and at 100∘C is 20Ω. What will be temperature coefficient of resistance of the conductor?","opt":["0.010∘C−1","0.033∘C−1","0.003∘C−1","0.042∘C−1"],"ans":2,"flag":"","src":"R2 R1 = (1 + 𝛼 ⋅ 100)(1 + 𝛼 ⋅ 15) = 2016 ⇒ 4 + 400 ⋅∝= 5 + 75 ⋅∝ ⇒∝= 1325 ∘C−1 = 0.003∘C−1","fig":""},{"id":16,"q":"The amount of work done in blowing a soap bubble such that its diameter increases from 𝑑 to 𝐷 is (Here, 𝑆 = surface tension of solution)","opt":["𝜋(𝐷2 − 𝑑2)𝑆","2𝜋(𝐷2 − 𝑑2)𝑆","4𝜋(𝐷2 − 𝑑2)𝑆","8𝜋(𝐷2 − 𝑑2)𝑆"],"ans":1,"flag":"","src":"Change in surface area = 2 × 4𝜋[(𝐷/2)2 − (𝑑/2)2] = 2𝜋(𝐷2 − 𝑑2) ∴ Work done = surface tension × change in area = 2𝜋𝑆(𝐷2 − 𝑑2)","fig":""},{"id":17,"q":"Figure shows the position-time graph of an object in SHM. The correct equation representing motion is :-","opt":["2sin⁡ ( 2𝜋 5 𝑡 + 𝜋 6)","4sin⁡ ( 𝜋 5 𝑡 + 𝜋 6)","4sin⁡ ( 𝜋 6 𝑡 + 𝜋 3)","4sin⁡ ( 𝜋 6 𝑡 + 𝜋 6)"],"ans":3,"flag":"Original figure/structure is not available as text; needs figure verification.","src":"From diagram amplitude = 4 cm, Time period T = 12 s Let equation be x = Asin (𝜔t + 𝜙) At t = 0, x = 2 so 2 = 4sin (𝜙) ⇒ 𝜙 = 𝜋 6 ⇒ x = 4sin (2𝜋12 t + 𝜋6)","fig":""},{"id":18,"q":"Surface density of charge on a sphere of radius R in terms of electric field intensity E at a distance 𝑟(𝑟 > 𝑅) in free space is : (𝜀0 = permittivity of free space)","opt":["𝜖0E ( R r) 2","𝜖0ER r2","𝜖0E ( r R) 2","𝜖0Er R2"],"ans":2,"flag":"","src":"Ep = kq r2 = 1 4𝜋𝜖0 × q r2 Ep = 1 4𝜋𝜖0 × 𝜎×4𝜋R2 r2 E×𝜀0×r2 R2 = 𝜎 𝜎 = 𝜀0𝐸 (𝑟𝑅)2","fig":""},{"id":19,"q":"A hot black body emits the energy at the rate of 16 J m−2 s−1 and its most intense radiation corresponds to 20,000Å. When the temperature of this body is further increased and its most intense radiation corresponds to 10,000Å, then the energy radiated in Jm−2 s−1 will be :","opt":["4","1","64","256"],"ans":3,"flag":"","src":"E = 𝜎AT4 𝜆max ∝ 1 T 𝜆m1 T1 = 𝜆m2 T2 20,000 T1 = 10,000 T2 T1 T2 = 1 2 E1 E2 = ( T1 T2 ) 4 16 E2 = ( 1 2) 4 E2 = 16 × 16 = 256 J m2 s","fig":""},{"id":20,"q":"An electron of stationary hydrogen atom passes from the fifth energy level to the ground level. The velocity that the atom acquired as result of photon emission will be : (m is the mass of the atom, R is Rydberg constant and ℎ is Planck's constant)","opt":["25𝑚 24hR","24 m 25hR","24hR 25 m","25hR 24 m"],"ans":2,"flag":"","src":"1 𝜆 = R [ 1 (1)2 − 1 (5)2] 1 𝜆 = 24 25 R P = mv = h 𝜆 v = h m𝜆 = 24hR 25 m","fig":""},{"id":21,"q":"The acceleration of the 2 kg block, if the free end of string is pulled with a force of 20 N as shown, is","opt":["Zero","10 m/sec2","5 m/sec2","7.5 m/sec2"],"ans":1,"flag":"Original figure/structure is not available as text; needs figure verification.","src":"","fig":""},{"id":22,"q":"The minimum area of the disc needed to cut off all the light coming out of water (𝜇𝑤 = 4 3) from a point source of light placed 7 m below the water surface will be :","opt":["49 m2","208 m2","148 m2","198 m2"],"ans":3,"flag":"","src":"A = 𝜋r2 = 𝜋 ( h√𝜇2−1)2 = 227 × ( 7 √(43)2−1) 2 = 198 m2 ===== PAGE 19 =====","fig":""},{"id":23,"q":"A body of mass 5 kg strikes another body of mass 2.5 kg initially at rest. The bodies after collision coalesce and begin to move as a whole with a kinetic energy of 5 J. The kinetic energy of the first body before collision is :-","opt":["7.5 J","5 J","2.5 J","10 J"],"ans":0,"flag":"","src":"1 2 (5 + 2.5)v2 = 5 v2 = 107.5 = 43 ⇒ v = 2√3 By conservation of linear momentum 5v1 = (5 + 2.5)v ⇒ v1 = 7.55 × 2√3 = √3 m/s K.E. = 1 2 (5)(√3)2 = 7.5 J","fig":""},{"id":24,"q":"In a region, the potential is represented by 𝑉(𝑥, 𝑦, 𝑧) = 6𝑥 − 8𝑥𝑦 − 8𝑦 + 6𝑦𝑧, where 𝑉 is in volts and 𝑥, 𝑦, 𝑧 are in metres. The electric force experienced by a charge of 2 coulombs situated at the point (1,1,1)is :-","opt":["6√5 N","30 N","24 N","4√35 N"],"ans":3,"flag":"","src":"E⃗⃗ = − 𝜕V𝜕x iˆ − 𝜕V𝜕y jˆ − 𝜕V𝜕z kˆ = −[(6 − 8y)iˆ + (−8x − 8 + 6z)jˆ + (6y)kˆ ] At(1,1,1), E⃗⃗ = 2iˆ + 10jˆ − 6kˆ ⇒ (E⃗⃗ ) = √22 + 102 + 62 = √140 = 2√35 Force = qE = 2 × 2√35 = 4√35 N","fig":""},{"id":25,"q":"A cylinder containing water stands on a table of height H. A small hole is punched in the side of cylinder at its base. The stream of water strikes the ground at a horizontal distance R from the table. Then, the depth of water in the cylinder is :","opt":["H","R","√(RH)","R2/4H"],"ans":3,"flag":"","src":"Let h be the height of liquid surface in the vessel. The velocity of efflux is given by : veff. = √(2gh) If H be the height of table, then H = 12 gt2 or t = √(2H/g) ∴ R = veff × t = √2gh√2H/g R2 = 4hH or h = R2 4H","fig":""},{"id":26,"q":"The coercivity for a certain permanent magnet is 4.0 × 104 A/m. This magnet is placed inside a long solenoid of 40 turns /cm and a current is passed in the solenoid to demagnetise it completely. Find the current.","opt":["1 A","5 A","10 A","20 A"],"ans":2,"flag":"","src":"Formula: H = nI Solution : Now, using H = nI Number of turns per meter n = 40 turns /cm = 40 × 40 × 100 = 4000 turns /m For complete demagnetisation, H = Hc From eq. no. (i) Hc = nI 4.0 × 104 = 4000 × I I = 4.0 × 104 . 4000 = 10 A","fig":""},{"id":27,"q":"A wire of length ℓ, radius R is stretched by force F and a second wire of same material, with length 2ℓ and radius 2 R, is stretched with a force 2 F; then the ratio of elongations in the two wires is :","opt":["1: 2","1: 1","2: 1","None of these"],"ans":1,"flag":"","src":"Δl = Fl𝜋r2Y F2 = 2 F, F1 = F, r2 = 2R, r1 = R, ℓ2 = 2ℓ, ℓ1 = ℓ ∴ Δl1 Δl2 = F1 F2 × l1 l2 × r22 r12 = F2 F × 12l × 4R2R2 = 1","fig":""},{"id":28,"q":"The moment of inertia of a uniform disc about an axis passing through its centre and perpendicular to its plane is 1 kg m2. It is rotating with an angular velocity 100rad/sec. Another identical disc is gently placed on it so that their centers coincide. Now these two discs together continue to rotate about the same axis. Then the loss in kinetic energy in kilojoule is -","opt":["2.5","3.0","3.5","4.0"],"ans":0,"flag":"","src":"I1𝜔1 = I2𝜔2 ⇒ I × 100 = (I + I)𝜔′ ⇒ 𝜔′ = 50rad/s ΔK = 12 I𝜔2 − 12 (2I)(𝜔′)2 = 12 (1)(100)2 − 12 (2 × 1)(50)2 = 2500 J","fig":""},{"id":29,"q":"If initial charge on all the capacitors were zero, work done by the battery in the circuit shown is-","opt":["0.2 mJ","200 mJ","0.4 mJ","400 mJ"],"ans":2,"flag":"Original figure/structure is not available as text; needs figure verification.","src":"W Battery = V Battery × Q transfered = V × CV = CV2 = 4𝜇 F(10 V)2 = 4 × 10−4 J = 0.4 mJ","fig":""},{"id":30,"q":"A coil of area 0.1 m2 has 500 turns. The coil is placed in a magnetic field of strength 4 × 10−4 Wb/m2, with plane of coil is parallel to the field then it is rotated through 90∘ in 0.1 second. The average e.m.f. induced in the coil is :","opt":["0.2 volt","0.1 volt","0.05 volt","0.012 volt"],"ans":0,"flag":"","src":"e.m.f = −0𝜙 Δt = [0 − NBAΔt ) emf = NBAΔt = 500 × 4 × 10−4 × 0.10.1 = 0.2 V","fig":""},{"id":31,"q":"𝐴 bulb has voltage rating of 220 V and power rating of 40 W. What resistance should be connected to this bulb to make it glow with normal brightness if a voltage source of e.m.f. 330 V is available?","opt":["605Ω in parallel","605Ω in series","485Ω in series","None of these"],"ans":1,"flag":"","src":"Here V = 220 V; P = 40 W Resistance of the bulb, R = V2 P = (220)2 40 = 1210Ω Current in the circuit, 𝐼 = 330 1210+𝑆 Potential difference across the bulb, IR = ( 3301210 + S) 1210 As per question, 220 = 330×1210 1210+S On solving, we get S ","fig":""},{"id":32,"q":"The density of a cube is measured by measuring its mass and length of its sides. If the maximum errors in the measurement of mass and length are 3% and 2% respectively, then the maximum error in the measurement of density is","opt":["7%","5%","1%","9%"],"ans":3,"flag":"","src":"We know that, density, 𝜌 = 𝑀 𝑉 = [M] [L3] ∴ Δ𝜌𝜌 × 100 = Δ𝑀𝑀 × 100 + 3 Δ𝐿𝐿 × 100 = 3% + 3(2%) = 9%","fig":""},{"id":33,"q":"A radiation of energy 𝐸 falls normally on a perfectly reflecting surface. The momentum transferred to the surface is","opt":["𝐸 𝑐","2𝐸 𝑐","𝐸𝑐","𝐸 𝑐2"],"ans":1,"flag":"","src":"Initial momentum of surface 𝑃𝑖 = 𝐸𝐶 Where, 𝑐 = velocity of light (constant). Since, the surface is perfectly, reflecting, so the same momentum will be reflected completely. Final momentum 𝑃𝑓 = 𝐸𝑐 (negative value) ∴ Change in momentum Δ𝑝 = 𝑝","fig":""},{"id":34,"q":"The figure shows a logic circuit with two inputs A and B and an output C. The voltage wave forms of A, B and C are as given, then logic circuit will be equivalent to :-","opt":["AND gate","NAND gate","OR gate","NOR gate"],"ans":2,"flag":"Original figure/structure is not available as text; needs figure verification.","src":"===== PAGE 20 ===== Corresponding binary numbers of given waveforms. A = 0110010 B = 0011001 C = 0111011 } ⇒ OR gate","fig":""},{"id":35,"q":"An ideal choke takes a current of 8 A when connected to an AC source of 100 V and 50 Hz. A pure resistor under the same conditions takes a current of 10 A. If two are connected in series to an AC supply of 100 V and 40 Hz, then the current in the series combination of above resistor and inductor is","opt":["10 A","5 A","5√2 A","10√2 A"],"ans":2,"flag":"","src":"𝑋𝐿 = 100 8
