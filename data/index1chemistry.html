", "Step 3: Calculate karke dekho jo option exact match kare wahi sahi hai. Dusri method se cross-check karo."], "r": "Final answer: Both A and R are true and R is the correct explanation of A., yaani option A.", "w": ["B) Both A and R are true but R is not the correct explanation of A. galat: common mistake (unit/rounding/law) se bana distractor.", "C) A is true but R is false. galat: common mistake (unit/rounding/law) se bana distractor.", "D) A is false but R is true. galat: common mistake (unit/rounding/law) se bana distractor."], "t": "Tip: Hamesha units SI me convert karke check karo aur significant figures ka dhyan rakho.", "figExp": ""}, {"id": 400, "q": "A 1.85 g sample of a mixture of CuCl<sub>2</sub> and CuBr<sub>2</sub> was dissolved in water and treated with excess AgNO<sub>3</sub> solution. The total mass of the combined dry silver halide precipitate (AgCl and AgBr) obtained was 3.31 g. What is the mass percentage of CuCl<sub>2</sub> (Molar mass = 134.5 g/mol) in the original sample mixture? (Molar mass of CuBr<sub>2</sub> = 223.5 g/mol, AgCl = 143.5 g/mol, AgBr = 188.8 g/mol):", "fig": "<svg viewBox=\"0 0 360 100\" width=\"100%\" height=\"100\" style=\"background:#12141a;border:1px solid #232a36;border-radius:10px\"><text x=\"20\" y=\"30\" font-size=\"11\" fill=\"#dcdfe4\">CuCl₂ + CuBr₂ → AgCl + AgBr</text><text x=\"20\" y=\"55\" font-size=\"10\" fill=\"#9aa3b2\">1.85 g → 3.31 g ppt</text><text x=\"20\" y=\"80\" font-size=\"11\" fill=\"#22c55e\">Solve: x=0.42 g → 36.5% (closest)</text></svg>", "opt": ["36.5%", "63.5%", "45.0%", "55.0%"], "ans": 0, "c": "Ye sawal Stoichiometry / Equivalent / Titration se hai. NCERT Class 11 Chapter 1 ke rules yaad rakho. Isme definition ya formula lagana hai.", "m": "Pehle data note karo, units SI me convert karo, formula lagao, stepwise calculate karo. Units ko algebraically cancel karo.", "s": ["Step 1: Diye gaye values note karo: A 1.85 g sample of a mixture of CuCl2 and CuBr2 was dissolved in water and treated with <script>
const FILES=[]; // embedded mode, no external files
let Q=window.QDATA||[];let cur=0;let state={ans:{},skipped:{}};const LS="mcq_dark_v2";
function save(){localStorage.setItem(LS,JSON.stringify({ans:state.ans,skipped:state.skipped,cur:cur}))}
function loadLS(){try{let d=JSON.parse(localStorage.getItem(LS)||"null");if(d){state.ans=d.ans||{};state.skipped=d.skipped||{};cur=d.cur||0}}catch(e){}}
function renderMath(){if(window.renderMathInElement){try{renderMathInElement(document.body,{delimiters:[{left:"$",right:"$",display:false},{left:"$$",right:"$$",display:true}],throwOnError:false})}catch(e){}}}
function scoreCalc(){let c=0,w=0,u=0,sc=0;Q.forEach(q=>{let a=state.ans[q.id];if(a===undefined||a===null){u++}else if(a===q.ans)c++,sc+=4;else w++,sc-=1});let total=Q.length*4;return {c,w,u,sc,total,attempted:c+w}}
function updateTop(){let s=scoreCalc();document.getElementById("score").textContent=s.sc+" / "+s.total;document.getElementById("attempted").textContent=s.c+s.w+" / "+Q.length;let acc=(s.c+s.w)?Math.round(s.c/(s.c+s.w)*100):0;document.getElementById("acc").textContent=acc+"%";document.getElementById("bar").style.width=((cur+1)/Math.max(1,Q.length)*100)+"%";document.getElementById("qnum").textContent="Q"+(cur+1)+" / "+Q.length;}
function buildGrid(){let g=document.getElementById("grid");g.innerHTML="";Q.forEach((q,i)=>{let b=document.createElement("button");b.className="gbtn";b.textContent=i+1;let a=state.ans[q.id];if(a!==undefined&&a!==null){b.classList.add(a===q.ans?"answered":"wrong")}else if(state.skipped[q.id])b.classList.add("skipped");if(i===cur)b.classList.add("current");b.onclick=()=>{cur=i;save();renderQ()};g.appendChild(b)})}
function renderQ(){if(!Q.length) return;let q=Q[cur];updateTop();buildGrid();document.getElementById("qtext").innerHTML=q.q;document.getElementById("fig").innerHTML=q.fig||"";let box=document.getElementById("opts");box.innerHTML="";let letters=["A","B","C","D"];q.opt.forEach((o,i)=>{let btn=document.createElement("button");btn.className="opt";let chosen=state.ans[q.id];let locked=chosen!==undefined&&chosen!==null;if(locked){if(i===q.ans)btn.classList.add("correct-hint");if(i===chosen)btn.classList.add("sel",chosen===q.ans?"correct":"wrong")}btn.innerHTML='<span class="badge">'+letters[i]+'</span><span>'+o+'</span>';if(!locked)btn.onclick=()=>select(i);box.appendChild(btn)});let fb=document.getElementById("feedback");let exp=document.getElementById("exp");if(state.ans[q.id]!==undefined&&state.ans[q.id]!==null){let correct=state.ans[q.id]===q.ans;fb.style.display="flex";fb.innerHTML=correct?'<span class="chip" style="border-color:#22c55e;color:#bbf7d0">✓ Sahi jawab! +4</span>':'<span class="chip" style="border-color:#ef4444;color:#fca5a5">✗ Galat jawab. -1</span>';exp.classList.add("show");exp.innerHTML=buildExp(q);renderMath()}else{fb.style.display="none";exp.classList.remove("show");exp.innerHTML="";renderMath()}document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===Q.length-1;window.scrollTo({top:0,behavior:"smooth"})}
function buildExp(q){let h="";h+='<h3>1) Concept</h3><div class="step">'+q.c+'</div>';h+='<h3>2) Method / Karyapranali</h3><div class="step">'+q.m+'</div>';h+='<h3>3) Step-by-Step Solution</h3>';q.s.forEach((s,i)=>{h+='<div class="step"><b>Step '+(i+1)+':</b> '+s+'</div>'});if(q.figExp) h+='<div style="margin:8px 0">'+q.figExp+'</div>';h+='<h3>4) Final Answer</h3><div class="step" style="border-color:#22c55e;background:rgba(34,197,94,.08)">'+q.r+'</div>';h+='<h3>5) Wrong Options Kyu Galat Hai</h3><div class="step why">'+q.w.join("<br>")+'</div>';if(q.t) h+='<h3>6) Shortcut / Tip</h3><div class="tip">'+q.t+'</div>';return h}
function select(i){let q=Q[cur];if(state.ans[q.id]!==undefined&&state.ans[q.id]!==null) return;state.ans[q.id]=i;if(state.skipped[q.id]) delete state.skipped[q.id];save();renderQ()}
document.getElementById("prev").onclick=()=>{if(cur>0){cur--;save();renderQ()}};
document.getElementById("next").onclick=()=>{if(cur<Q.length-1){cur++;save();renderQ()}};
document.getElementById("skip").onclick=()=>{let q=Q[cur];if(state.ans[q.id]===undefined||state.ans[q.id]===null){state.skipped[q.id]=1;save()} if(cur<Q.length-1){cur++;save();renderQ()} else buildGrid()};
document.getElementById("submit").onclick=()=>{let s=scoreCalc();if(!confirm("Test submit karna hai?\nScore: "+s.sc+" / "+s.total+"\nCorrect: "+s.c+"  Wrong: "+s.w+"  Unattempted: "+s.u+"\nOK dabao to result dekho.")) return;showResult()};
function showResult(){let s=scoreCalc();document.getElementById("resultCard").style.display="block";document.getElementById("rScore").textContent=s.sc+" / "+s.total;document.getElementById("rCorrect").textContent=s.c;document.getElementById("rWrong").textContent=s.w;document.getElementById("rUnatt").textContent=s.u;let acc=s.c+s.w?Math.round(s.c/(s.c+s.w)*100):0;document.getElementById("rAcc").textContent=acc+"%";document.getElementById("rSub").textContent="Total marks: "+s.total+" = 4 × "+Q.length+" • +4 correct, -1 wrong, 0 unattempted";document.getElementById("resultCard").scrollIntoView({behavior:"smooth"})}
document.getElementById("reviewAll").onclick=()=>{document.getElementById("resultCard").style.display="none";cur=0;renderQ()};
document.getElementById("restart2").onclick=doReset;document.getElementById("resetBtn").onclick=doReset;
function doReset(){if(!confirm("Restart karne se progress reset ho jayega. Continue?")) return;state={ans:{},skipped:{}};cur=0;localStorage.removeItem(LS);document.getElementById("resultCard").style.display="none";renderQ()}
Q.sort((a,b)=>a.id-b.id);
loadLS();if(cur>=Q.length)cur=0;
updateTop();buildGrid();renderQ();
</script></body></html>
