.2,124.8 L96.8,122.8 L99.4,120.8 L102.0,118.8 L104.6,116.9 L107.2,115.1 L109.8,113.3 L112.4,111.6 L115.0,110.0 L117.6,108.4 L120.2,106.9 L122.8,105.5 L125.4,104.1 L128.0,102.8 L130.6,101.6 L133.2,100.4 L135.8,99.2 L138.4,98.2 L141.0,97.2 L143.6,96.3 L146.2,95.4 L148.8,94.6 L151.4,93.9 L154.0,93.2 L156.6,92.6 L159.2,92.0 L161.8,91.6 L164.4,91.2 L167.0,90.8 L169.6,90.5 L172.2,90.3 L174.8,90.1 L177.4,90.0 L180.0,90.0 L182.6,90.0 L185.2,90.1 L187.8,90.3 L190.4,90.5 L193.0,90.8 L195.6,91.2 L198.2,91.6 L200.8,92.0 L203.4,92.6 L206.0,93.2 L208.6,93.9 L211.2,94.6 L213.8,95.4 L216.4,96.3 L219.0,97.2 L221.6,98.2 L224.2,99.2 L226.8,100.4 L229.4,101.6 L232.0,102.8 L234.6,104.1 L237.2,105.5 L239.8,106.9 L242.4,108.4 L245.0,110.0 L247.6,111.6 L250.2,113.3 L252.8,115.1 L255.4,116.9 L258.0,118.8 L260.6,120.8 L263.2,122.8 L265.8,124.8 L268.4,127.0 L271.0,129.2 L273.6,131.5 L276.2,133.8 L278.8,136.2 L281.4,138.7 L284.0,141.2 L286.6,143.8 L289.2,146.4 L291.8,149.2 L294.4,152.0 L297.0,154.8 L299.6,157.7 L302.2,160.7 L304.8,163.7 L307.4,166.8 L310.0,170.0\"/><\/circle><\/svg>", "figcap": "Trajectory y = 2x − 0.1x²: lands at x = 20 m (y = 0).", "opts": ["5 m", "10 m", "20 m", "40 m"], "ans": 2, "sol": ["Step 1 — y = 2x − 0.1x².", "Step 2 — Landing: y = 0 (same level) → x(2 − 0.1x) = 0.", "Step 3 — x = 0 (projection) ya x = <span class=\"fr\"><span class=\"fn\">2<\/span><span class=\"fd\">0.1<\/span><\/span> = 20 m.", "Step 4 — Range = 20 m → option (C).", "Step 5 — (y = x tanθ − <span class=\"fr\"><span class=\"fn\">gx²<\/span><span class=\"fd\">2u²cos²θ<\/span><\/span> se: tanθ = 2, coefficient 0.1)"], "note": "Trajectory y = ax − bx²: range = a/b (y=0 roots se).", "wrong": {"0": "5 = <span class=\"fr\"><span class=\"fn\">2<\/span><span class=\"fd\">0.4<\/span><\/span>? — coefficient 0.1 hai, 0.4 nahi.", "1": "10 = 2×…? — a/b = 20.", "3": "40 = <span class=\"fr\"><span class=\"fn\">2<\/span><span class=\"fd\">0.05<\/span><\/span>? — coefficient galat."}}, {"n": 180, "type": "statement", "topic": "proj", "q": "Consider the following statements for two projectiles fired with the same speed u at angles θ and (90° − θ) with the horizontal (air resistance neglected). Statement I: They have a common horizontal range R, and the product of their maximum heights is <span class=\"fr\"><span class=\"fn\">R²<\/span><span class=\"fd\">16<\/span><\/span>. Statement II: H1 H2 = u⁴ sin²θ cos²θ/(4g²), whereas R² = u⁴ sin²2θ/g².", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: H1H2 = (<span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span>)(u²cos²θ/2g) = <span class=\"fr\"><span class=\"fn\">u⁴sin²θcos²θ<\/span><span class=\"fd\">4g²<\/span><\/span>.", "Step 2 — R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> = 2u²sinθcosθ/g → R² = 4u⁴sin²θcos²θ/g².", "Step 3 — H1H2 = <span class=\"fr\"><span class=\"fn\">R²<\/span><span class=\"fd\">16<\/span><\/span> ✓ TRUE.", "Step 4 — Statement II: H1H2 = <span class=\"fr\"><span class=\"fn\">u⁴sin²θcos²θ<\/span><span class=\"fd\">4g²<\/span><\/span> ✓ aur R² = u⁴sin²2θ/g² ✓ dono sahi expressions (sin2θ = 2sinθcosθ).", "Step 5 — Dono true → option (A)."], "note": "Complementary angles: H1·H2 = <span class=\"fr\"><span class=\"fn\">R²<\/span><span class=\"fd\">16<\/span><\/span>.", "wrong": {"1": "Both expressions verified — dono true.", "2": "Statement I sahi (<span class=\"fr\"><span class=\"fn\">R²<\/span><span class=\"fd\">16<\/span><\/span>).", "3": "Dono true hain."}}, {"n": 181, "type": "mcq", "topic": "proji", "q": "Which of the following is incorrect for a projectile launched from the top of a tower?", "fig": "", "figcap": "", "opts": ["The time of flight is obtained from the equation of vertical motion alone", "A ball dropped from the tower and a ball projected horizontally from the same tower hit the ground simultaneously", "The horizontal range of the projectile is independent of the vertical component of its initial velocity", "The trajectory of the projectile is still a parabola"], "ans": 2, "sol": ["Step 1 — (A) Tower se: time of flight vertical motion equation se ✓ correct.", "Step 2 — (B) Dropped ball aur horizontal-projected ball — dono vertical motion same (h, g) → same time ✓ correct.", "Step 3 — (C) 'Horizontal range VERTICAL component se independent' — GALAT! vy(0) time of flight change karti hai (zyada upar → zyada time → zyada range).", "Step 4 — (D) Trajectory parabola ✓ correct.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "From height: range = vx × T, aur T par vy(0) depend karta hai.", "wrong": {"0": "Vertical motion se T — sahi.", "1": "Simultaneous landing — sahi.", "3": "Parabola — sahi."}}, {"n": 182, "type": "assertion", "topic": "proj", "q": "Assertion (A): The magnitude of the change in momentum of a projectile of mass m over its complete flight, landing at the same level, is 2mu sinθ directed vertically downward. Reason (R): The change in momentum equals the impulse of the gravitational force, mgT, where the time of flight is T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span>.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Final velocity (u cosθ, −u sinθ), initial (u cosθ, +u sinθ).", "Step 2 — Δp = m(vf − vi) = m(0, −2u sinθ) → magnitude 2mu sinθ, downward ✓ Assertion TRUE.", "Step 3 — Reason: Impulse = mg×T = mg×(<span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span>) = 2mu sinθ downward ✓ TRUE.", "Step 4 — R exactly magnitude derive karta hai → correct explanation → option (A)."], "note": "Δp (full flight) = mgT = 2mu sinθ downward.", "wrong": {"1": "R correct explanation hai (impulse = Δp).", "2": "R true hai (mgT).", "3": "Assertion true hai (verified)."}}, {"n": 183, "type": "match", "topic": "proj", "q": "Match the Columns for a projectile of speed u projected at angle θ on level ground. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Ratio <span class=\"fr\"><span class=\"fn\">R<\/span><span class=\"fd\">H<\/span><\/span><\/div><div class=\"colitem\">(b) tan θ when R = 2H<\/div><div class=\"colitem\">(c) Angle of projection for maximum range<\/div><div class=\"colitem\">(d) Speed at the highest point when θ = 45°<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 45°<\/div><div class=\"colitem\">(ii) <span class=\"fr\"><span class=\"fn\">u<\/span><span class=\"fd\">√<span class=\"rad\">2<\/span><\/span><\/span><\/div><div class=\"colitem\">(iii) 4 cot θ<\/div><div class=\"colitem\">(iv) 2<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-iv, c-i, d-ii", "a-iv, b-iii, c-i, d-ii", "a-iii, b-i, c-iv, d-ii", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Standard relations:", "Step 2 — (a) <span class=\"fr\"><span class=\"fn\">R<\/span><span class=\"fd\">H<\/span><\/span> = [<span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span>]/[<span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span>] = 4cosθ/sinθ = 4cotθ → (iii)", "Step 3 — (b) R = 2H → tanθ = 2 → (iv)", "Step 4 — (c) Max range → 45° → (i)", "Step 5 — (d) Top pe speed (θ=45°) = u cos45° = <span class=\"fr\"><span class=\"fn\">u<\/span><span class=\"fd\">√<span class=\"rad\">2<\/span><\/span><\/span> → (ii)", "Step 6 — Toh a-iii, b-iv, c-i, d-ii → option (A)."], "note": "<span class=\"fr\"><span class=\"fn\">R<\/span><span class=\"fd\">H<\/span><\/span> = 4cotθ. R=2H → tanθ=2. Max range 45°. Top speed <span class=\"fr\"><span class=\"fn\">u<\/span><span class=\"fd\">√<span class=\"rad\">2<\/span><\/span><\/span> (45°).", "wrong": {"1": "<span class=\"fr\"><span class=\"fn\">R<\/span><span class=\"fd\">H<\/span><\/span> = 4cotθ — 45° nahi.", "2": "R = 2H → tanθ = 2 — 45° nahi.", "3": "<span class=\"fr\"><span class=\"fn\">u<\/span><span class=\"fd\">√<span class=\"rad\">2<\/span><\/span><\/span> top speed hai — 45° angle nahi (yeh (c) hai)."}}, {"n": 184, "type": "statement", "topic": "proj", "q": "Which of the following statements are correct for an oblique projectile landing at the same level (air resistance neglected)? (1) The average velocity over the complete flight has magnitude u cos θ. (2) The average speed over the complete flight is also u cos θ. (3) The magnitude of the change in velocity over the complete flight is 2u sin θ. (4) The acceleration is constant in both magnitude and direction.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Avg velocity = <span class=\"fr\"><span class=\"fn\">R<\/span><span class=\"fd\">T<\/span><\/span> = u cosθ (horizontal) ✓ TRUE.", "Step 2 — (2) 'Avg speed bhi u cosθ' — GALAT! Avg speed = path length/T > displacement/T (parabolic path lamba hai).", "Step 3 — (3) |Δv| = |2u sinθ (downward)| = 2u sinθ ✓ TRUE.", "Step 4 — (4) a = g, magnitude + direction dono constant ✓ TRUE.", "Step 5 — Correct: 1, 3, 4 → option (B)."], "note": "Avg speed = path length/T > avg velocity magnitude (curved path).", "wrong": {"0": "2 galat hai (path length > R) — D chuk jaoge.", "1": "2 FALSE — avg speed zyada hota hai.", "3": "2 galat hai — straight line mein hi equal hota."}}, {"n": 185, "type": "mcq", "topic": "proj", "q": "Which of the following statements is incorrect for a projectile?", "fig": "", "figcap": "", "opts": ["At a height h above the point of projection, its speed is √<span class=\"rad\">(u² − 2gh)<\/span>", "Its speed is the same at two points situated at the same height", "At the highest point, its velocity and acceleration are mutually parallel", "The vertical component of its velocity at the highest point is zero"], "ans": 2, "sol": ["Step 1 — (A) Height h pe speed = √<span class=\"rad\">(u²−2gh)<\/span> ✓ sahi (energy conservation).", "Step 2 — (B) Same height pe speed same (ascent/descent) ✓ sahi.", "Step 3 — (C) 'Top pe velocity aur acceleration MUTUALLY PARALLEL' — GALAT! Velocity horizontal, acceleration vertical (g) → PERPENDICULAR.", "Step 4 — (D) Top pe vy = 0 ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Top pe: v horizontal, a vertical → 90° between them (perpendicular).", "wrong": {"0": "Energy formula — sahi.", "1": "Symmetry — sahi.", "3": "vy = 0 — sahi."}}, {"n": 186, "type": "mcq", "topic": "proj", "q": "A projectile is fired with a speed of 20 m/s at 30° above the horizontal. Taking g = 10 m/s², sin 30° = 0.5, cos 30° = 0.866 and √<span class=\"rad\">325<\/span> = 18.03, the magnitude of its velocity 0.5 s after projection is", "fig": "", "figcap": "", "opts": ["5 m/s", "17.32 m/s", "18.03 m/s", "20 m/s"], "ans": 2, "sol": ["Step 1 — u = 20, θ = 30°. vx = 20×0.866 = 17.32. vy(0) = 20×0.5 = 10.", "Step 2 — t = 0.5 s: vy = 10 − 10×0.5 = 5 m/s.", "Step 3 — v = √<span class=\"rad\">(17.32² + 5²)<\/span> = √<span class=\"rad\">(300 + 25)<\/span> = √<span class=\"rad\">325<\/span> = 18.03 m/s (diya hai).", "Step 4 — Option (C)."], "note": "v(t) = √<span class=\"rad\">(vx² + (u sinθ − gt)<\/span>²).", "wrong": {"0": "5 = vy sirf — vx ghat gaya.", "1": "17.32 = vx sirf — vy ghat gaya.", "3": "20 = initial speed — 0.5 s pe kam ho chuka (vy decrease)."}}, {"n": 187, "type": "mcq", "topic": "rel", "q": "A man walks due east at 3 m/s while rain falls vertically downward at 4 m/s. The magnitude of the velocity of rain relative to the man is", "fig": "", "figcap": "", "opts": ["1 m/s", "5 m/s", "7 m/s", "12 m/s"], "ans": 1, "sol": ["Step 1 — Rain 4 m/s neeche, man 3 m/s east.", "Step 2 — Rain relative to man = √<span class=\"rad\">(3² + 4²)<\/span> = √<span class=\"rad\">(9+16)<\/span> = √<span class=\"rad\">25<\/span> = 5 m/s.", "Step 3 — Option (B) — 3-4-5 phir se!"], "note": "Perpendicular velocities: relative = Pythagoras.", "wrong": {"0": "1 = 4−3 — perpendicular hain, subtract nahi hota.", "2": "7 = 4+3 — yeh same direction ka formula.", "3": "12 = 3×4 — multiplication se koi matlab nahi."}}, {"n": 188, "type": "statement", "topic": "rel", "q": "Consider the following statements. Statement I: A passenger in a train moving on a straight horizontal track observes rain falling vertically, while a person standing on the ground observes the same rain falling obliquely. Statement II: For the rain to appear vertical to the passenger, the horizontal component of the rain's velocity relative to the ground must be equal to the velocity of the train.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Train mein passenger ko rain vertical dikta hai, ground observer ko oblique — yeh possible hai ✓ TRUE (train ki velocity rain ke horizontal component ko cancel karti hai).", "Step 2 — Statement II: Iske liye rain ka horizontal component (ground frame) = train ki velocity hona chahiye ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Rain vertical to moving observer: rain's horizontal component (ground) = observer's velocity.", "wrong": {"1": "Condition sahi — Statement II sahi.", "2": "Scenario sahi — Statement I sahi.", "3": "Dono true hain."}}, {"n": 189, "type": "mcq", "topic": "rel", "q": "Which of the following is incorrect about relative velocity?", "fig": "", "figcap": "", "opts": ["Velocity of A relative to B is vA − vB", "Velocity of A relative to B is the negative of the velocity of B relative to A", "If two particles move with equal speeds in mutually perpendicular directions, their relative velocity is zero", "Two particles moving with exactly the same velocity have zero relative velocity"], "ans": 2, "sol": ["Step 1 — (A) vAB = vA − vB ✓ sahi.", "Step 2 — (B) vAB = −vBA ✓ sahi.", "Step 3 — (C) 'Equal speeds perpendicular directions → relative velocity zero' — GALAT! |vA−vB| = √<span class=\"rad\">(v²+v²)<\/span> = v√<span class=\"rad\">2<\/span> (perpendicular).", "Step 4 — (D) Same velocity → relative zero ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Perpendicular equal speeds → relative = v√<span class=\"rad\">2<\/span>, zero nahi.", "wrong": {"0": "Sahi statement.", "1": "Sahi statement.", "3": "Sahi statement."}}, {"n": 190, "type": "diagram", "topic": "rel", "q": "Study the described vector diagram. From a common origin O, an arrow vA of length 5 units points due east and an arrow vB of length 5 units points due north. The velocity of A relative to B is represented by the arrow drawn from the head of vB to the head of vA. Taking √<span class=\"rad\">2<\/span> = 1.414, its magnitude and direction are", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 190\"><defs><marker id=\"m190\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt190\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr190\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg190\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"110.0\" y1=\"130.0\" x2=\"210.0\" y2=\"130.0\" stroke=\"#264653\" stroke-width=\"2.6\" marker-end=\"url(#m190)\"/><text x=\"150.0\" y=\"148.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">v_A = 5 (E)<\/text><line x1=\"110.0\" y1=\"130.0\" x2=\"110.0\" y2=\"30.0\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt190)\"/><text x=\"124.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">v_B = 5 (N)<\/text><line x1=\"110.0\" y1=\"30.0\" x2=\"210.0\" y2=\"130.0\" stroke=\"#e76f51\" stroke-width=\"2.4\" marker-end=\"url(#mr190)\"/><text x=\"196.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">v_A − v_B<\/text><text x=\"170.0\" y=\"158.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">5√2, 45° S of E<\/text><line x1=\"210.0\" y1=\"30.0\" x2=\"210.0\" y2=\"130.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><line x1=\"110.0\" y1=\"30.0\" x2=\"210.0\" y2=\"30.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><circle cx=\"110.0\" cy=\"130.0\" r=\"4\" fill=\"#264653\"/><\/svg>", "figcap": "Relative velocity v_A − v_B: from head of v_B to head of v_A.", "opts": ["5 units, due east", "5√<span class=\"rad\">2<\/span> units, 45° south of east", "5√<span class=\"rad\">2<\/span> units, 45° north of east", "10 units, due south"], "ans": 1, "sol": ["Step 1 — vA = 5 east = (5, 0), vB = 5 north = (0, 5).", "Step 2 — vA relative to B = vA − vB = (5, −5).", "Step 3 — Magnitude = √<span class=\"rad\">(25+25)<\/span> = 5√<span class=\"rad\">2<\/span> ≈ 7.07.", "Step 4 — Direction: +x (east) aur −y (south) → 45° south of east.", "Step 5 — Arrow: head of vB se head of vA tak. Option (B)."], "note": "vAB = vA − vB: head-to-head vector from B's head to A's head.", "wrong": {"0": "5 units east — yeh sirf x-component hai.", "2": "45° NORTH of east — yeh vB relative A ho.", "3": "10 south — magnitude + direction dono galat."}}, {"n": 191, "type": "match", "topic": "boat", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Velocity of rain relative to a moving man<\/div><div class=\"colitem\">(b) Velocity of a boat relative to the ground<\/div><div class=\"colitem\">(c) Minimum time taken by a boat to cross a river of width d<\/div><div class=\"colitem\">(d) Condition for the boat to reach the point directly opposite, that is, zero drift<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) d divided by the speed of the boat relative to water<\/div><div class=\"colitem\">(ii) upstream component of the boat's velocity equals the speed of the river current<\/div><div class=\"colitem\">(iii) velocity of rain minus velocity of man<\/div><div class=\"colitem\">(iv) velocity of boat relative to water plus velocity of water relative to ground<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-iv, c-i, d-ii", "a-iv, b-iii, c-i, d-ii", "a-iii, b-i, c-iv, d-ii", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Match karo:", "Step 2 — (a) Rain relative to moving man → v(rain) − v(man) → (iii)", "Step 3 — (b) Boat relative to ground → v(boat/water) + v(water/ground) → (iv)", "Step 4 — (c) Min time to cross width d → d/(boat speed in water) → (i)", "Step 5 — (d) Zero drift condition → upstream component = current speed → (ii)", "Step 6 — Toh a-iii, b-iv, c-i, d-ii → option (A)."], "note": "Rain: rain − man. Boat: boat/water + water/ground. Min time: <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span>. Zero drift: upstream = u.", "wrong": {"1": "Boat/ground = boat/water + water/ground — (iv), (iii) nahi.", "2": "<span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span> min time hai — upstream condition alag (d) hai.", "3": "Zero drift = upstream component = u — <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span> nahi."}}, {"n": 192, "type": "mcq", "topic": "kin2", "q": "The position vector of a particle is r = 4 sin(2πt) î + 4 cos(2πt) ĵ metre, where t is in second. The magnitude of the velocity of the particle is", "fig": "", "figcap": "", "opts": ["4 m/s", "8 m/s", "4π m/s", "8π m/s"], "ans": 3, "sol": ["Step 1 — r = (4 sin 2πt, 4 cos 2πt).", "Step 2 — v = <span class=\"fr\"><span class=\"fn\">dr<\/span><span class=\"fd\">dt<\/span><\/span> = (4×2π cos 2πt, −4×2π sin 2πt) = (8π cos 2πt, −8π sin 2πt).", "Step 3 — |v| = 8π√<span class=\"rad\">(cos²+sin²)<\/span> = 8π m/s.", "Step 4 — Option (D). ω = 2π rad/s, R = 4 m → v = Rω = 8π."], "note": "Circular motion: v = Rω. R = 4, ω = 2π → 8π.", "wrong": {"0": "4 = R — ω multiply nahi kiya.", "1": "8 = 4×2 — π ghat gaya.", "2": "4π = R×π? — ω = 2π hai, π nahi."}}, {"n": 193, "type": "statement", "topic": "ucm", "q": "Which of the following statements are correct for a particle in uniform circular motion? (1) The speed is constant but the velocity is not constant. (2) The magnitude of the centripetal acceleration is constant but its direction changes continuously. (3) The linear momentum of the particle is constant throughout the motion. (4) The average acceleration over one complete revolution is zero.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Speed constant, velocity not ✓ TRUE.", "Step 2 — (2) |ac| = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> constant, direction changes ✓ TRUE.", "Step 3 — (3) 'Linear momentum constant' — GALAT! p = mv — direction change hoti hai.", "Step 4 — (4) Avg acceleration over full revolution = 0 ✓ TRUE.", "Step 5 — Correct: 1, 2, 4 → option (B)."], "note": "UCM: momentum NOT constant (direction). Avg acceleration (full cycle) = 0.", "wrong": {"0": "3 galat hai (momentum direction changes) — D chuk jaoge.", "1": "3 FALSE — p = mv, direction badalti hai.", "3": "3 galat hai — momentum vector constant nahi."}}, {"n": 194, "type": "mcq", "topic": "ucm", "q": "Which of the following is incorrect for a particle in uniform circular motion?", "fig": "", "figcap": "", "opts": ["The angular speed is ω = 2π/T", "The centripetal acceleration is a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = ω²R", "For a fixed radius R, the time period is directly proportional to the speed v", "The frequency of revolution is the reciprocal of the time period"], "ans": 2, "sol": ["Step 1 — (A) ω = 2π/T ✓ sahi.", "Step 2 — (B) a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = ω²R ✓ sahi.", "Step 3 — (C) 'Fixed R pe T directly proportional to v' — GALAT! T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> — INVERSELY proportional (v double → T half).", "Step 4 — (D) Frequency = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">T<\/span><\/span> ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> — v double karo to T half (inverse).", "wrong": {"0": "ω = 2π/T — sahi.", "1": "a = ω²R — sahi.", "3": "ν = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">T<\/span><\/span> — sahi."}}, {"n": 195, "type": "assertion", "topic": "ucm", "q": "Assertion (A): The magnitude of the average acceleration of a particle in uniform circular motion (speed v, radius R) over one-sixth of a revolution is <span class=\"fr\"><span class=\"fn\">3v²<\/span><span class=\"fd\">(πR)<\/span><\/span>. Reason (R): Average acceleration is the change in velocity divided by the time interval; over one-sixth of a revolution the change in velocity has magnitude v and the time taken is <span class=\"fr\"><span class=\"fn\">πR<\/span><span class=\"fd\">(3v)<\/span><\/span>.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — One-sixth revolution: Δθ = <span class=\"fr\"><span class=\"fn\">360°<\/span><span class=\"fd\">6<\/span><\/span> = 60°.", "Step 2 — |Δv| = 2v sin(<span class=\"fr\"><span class=\"fn\">Δθ<\/span><span class=\"fd\">2<\/span><\/span>) = 2v sin30° = 2v×0.5 = v.", "Step 3 — Time = arc/speed = (R×60°)/v = <span class=\"fr\"><span class=\"fn\">(Rπ/3)<\/span><span class=\"fd\">v<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">πR<\/span><span class=\"fd\">(3v)<\/span><\/span>.", "Step 4 — a<sub>avg<\/sub> = |Δv|/Δt = v/(<span class=\"fr\"><span class=\"fn\">πR<\/span><span class=\"fd\">3v<\/span><\/span>) = 3v/(πR) ✓ Assertion TRUE.", "Step 5 — Reason dono facts deta hai ✓ TRUE → correct explanation → option (A)."], "note": "a<sub>avg<\/sub> over Δθ: |Δv| = 2v sin(<span class=\"fr\"><span class=\"fn\">Δθ<\/span><span class=\"fd\">2<\/span><\/span>), Δt = <span class=\"fr\"><span class=\"fn\">RΔθ<\/span><span class=\"fd\">v<\/span><\/span>.", "wrong": {"1": "R correct explanation hai (wahi steps).", "2": "R true hai (both facts verified).", "3": "Assertion true hai (3v/πR)."}}, {"n": 196, "type": "diagram", "topic": "ucm", "q": "Study the described graph. A graph is plotted with centripetal acceleration a (in m/s²) on the y-axis and radius R (in metre) on the x-axis, for a set of particles all moving with the same constant angular speed ω. The graph is a straight line passing through the origin and its slope is 4 s⁻². The value of ω is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 196\"><defs><marker id=\"m196\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt196\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr196\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg196\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"60.0\" y1=\"160.0\" x2=\"308.0\" y2=\"160.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"160.0\" x2=\"60.0\" y2=\"32.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"310.0\" y1=\"160.0\" x2=\"301.0\" y2=\"156.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"310.0\" y1=\"160.0\" x2=\"301.0\" y2=\"164.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"30.0\" x2=\"56.0\" y2=\"39.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"30.0\" x2=\"64.0\" y2=\"39.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><text x=\"314.0\" y=\"164.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">R (m)<\/text><text x=\"54.0\" y=\"26.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">a (m/s²)<\/text><line x1=\"60.0\" y1=\"160.0\" x2=\"290.0\" y2=\"40.0\" stroke=\"#2a9d8f\" stroke-width=\"2.6\"/><text x=\"250.0\" y=\"48.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">slope = ω² = 4 s⁻²<\/text><line x1=\"110.0\" y1=\"140.0\" x2=\"110.0\" y2=\"160.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><line x1=\"110.0\" y1=\"140.0\" x2=\"60.0\" y2=\"140.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"110.0\" y=\"176.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">1<\/text><text x=\"60.0\" y=\"176.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">0<\/text><text x=\"114.0\" y=\"142.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">Δa/ΔR<\/text><\/svg>", "figcap": "a vs R for fixed ω: straight line, slope = ω².", "opts": ["1 rad/s", "2 rad/s", "4 rad/s", "16 rad/s"], "ans": 1, "sol": ["Step 1 — a = ω²R (same ω for all particles).", "Step 2 — Graph: a vs R — straight line through origin, slope = ω².", "Step 3 — Slope = 4 s⁻² → ω² = 4 → ω = 2 rad/s.", "Step 4 — Option (B)."], "note": "a = ω²R: slope of a vs R = ω².", "wrong": {"0": "1 = √<span class=\"rad\">4<\/span>/2? — ω² = 4 → ω = 2.", "2": "4 = ω² — square root lo, ω = 2.", "3": "16 = 4²? — galat operation."}}, {"n": 197, "type": "match", "topic": "ucm", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Angular displacement in one complete revolution<\/div><div class=\"colitem\">(b) Angular speed when the time period is 2 s<\/div><div class=\"colitem\">(c) Centripetal acceleration for v = 2 m/s and R = 1 m<\/div><div class=\"colitem\">(d) Linear speed for ω = 3 rad/s and R = 2 m<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) π rad/s<\/div><div class=\"colitem\">(ii) 6 m/s<\/div><div class=\"colitem\">(iii) 2π radian<\/div><div class=\"colitem\">(iv) 4 m/s²<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-iv, d-ii", "a-iii, b-iv, c-i, d-ii", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "sol": ["Step 1 — Standard relations se values nikalo:", "Step 2 — (a) One revolution → 2π radian → (iii)", "Step 3 — (b) T = 2 s → ω = 2π/2 = π rad/s → (i)", "Step 4 — (c) v = 2, R = 1 → a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = 4 m/s² → (iv)", "Step 5 — (d) ω = 3, R = 2 → v = ωR = 6 m/s → (ii)", "Step 6 — Toh a-iii, b-i, c-iv, d-ii → option (A)."], "note": "ω = 2π/T; a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>; v = ωR. 2π rad/revolution.", "wrong": {"1": "π rad/s T=2 ka hai — 2π rad (angle) nahi.", "2": "4 m/s² a hai — 6 m/s (v) nahi.", "3": "6 m/s v hai — 4 m/s² nahi."}}, {"n": 198, "type": "mcq", "topic": "nucm", "q": "A particle moves on a circular path of radius 2 m such that its speed at time t is v = 2t m/s. The magnitude of its net acceleration at t = 1 s is", "fig": "", "figcap": "", "opts": ["2 m/s²", "2√<span class=\"rad\">2<\/span> m/s²", "4 m/s²", "8 m/s²"], "ans": 1, "sol": ["Step 1 — v = 2t → t = 1 pe v = 2 m/s.", "Step 2 — Tangential: at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> = 2 m/s².", "Step 3 — Centripetal: ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">2<\/span><\/span> = 2 m/s².", "Step 4 — Net: √<span class=\"rad\">(2²+2²)<\/span> = √<span class=\"rad\">8<\/span> = 2√<span class=\"rad\">2<\/span> m/s².", "Step 5 — Option (B)."], "note": "at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span>, ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, net = √<span class=\"rad\">(at²+ac²)<\/span>.", "wrong": {"0": "2 = sirf ek component — dono 2 hain, net 2√<span class=\"rad\">2<\/span>.", "2": "4 = 2×2? — Pythagoras: √<span class=\"rad\">(4+4)<\/span> = 2√<span class=\"rad\">2<\/span>.", "3": "8 = at+ac? — perpendicular hain, Pythagoras karo."}}, {"n": 199, "type": "statement", "topic": "nucm", "q": "Which of the following statements are correct for a particle in non-uniform circular motion? (1) The speed and the angular speed of the particle both change with time. (2) The centripetal acceleration at any instant equals <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, where v is the instantaneous speed. (3) At an instant when the speed is momentarily not changing, the net acceleration can be purely radial. (4) The tangential acceleration is always constant in non-uniform circular motion.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) Speed + angular speed dono change (non-UCM) ✓ TRUE.", "Step 2 — (2) ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> (instantaneous) ✓ TRUE.", "Step 3 — (3) Speed momentarily not changing (at = 0) → net purely radial ✓ TRUE.", "Step 4 — (4) 'Tangential acceleration HAMESHA constant' — GALAT! at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span>, variable ho sakta hai.", "Step 5 — Correct: 1, 2, 3 → option (A)."], "note": "Non-UCM: at variable ho sakta hai; at = 0 instant pe net = radial only.", "wrong": {"0": "4 galat hai (at variable ho sakta) — D chuk jaoge.", "1": "4 FALSE — 'always constant' galat.", "3": "4 galat hai — specific case nahi general rule."}}, {"n": 200, "type": "mcq", "topic": "nucm", "q": "Which of the following is incorrect for a particle in non-uniform circular motion?", "fig": "", "figcap": "", "opts": ["The net acceleration has both a tangential and a radial component", "The tangential acceleration is equal to Rα", "The magnitude of the net acceleration is equal to the sum at + ac", "The angle between the net acceleration and the radius is tan⁻¹(<span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span>)"], "ans": 2, "sol": ["Step 1 — (A) Net acceleration tangential + radial ✓ correct.", "Step 2 — (B) at = Rα ✓ correct.", "Step 3 — (C) '|a| = at + ac' — GALAT! Components perpendicular hain → |a| = √<span class=\"rad\">(at²+ac²)<\/span> (Pythagoras).", "Step 4 — (D) Angle with radius: tanφ = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> ✓ correct.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Perpendicular components: |a| = √<span class=\"rad\">(at²+ac²)<\/span>, not at+ac.", "wrong": {"0": "Dono components — sahi.", "1": "at = Rα — sahi.", "3": "tanφ = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> — sahi."}}, {"n": 201, "type": "mcq", "topic": "vec3", "q": "If A = 2î + 3ĵ − k̂, B = −î + 2ĵ + 4k̂ and C = 3î − ĵ + 2k̂, then the magnitude of the vector (A + B − C) is", "fig": "", "figcap": "", "opts": ["√<span class=\"rad\">41<\/span>", "√<span class=\"rad\">29<\/span>", "7", "√<span class=\"rad\">53<\/span>"], "ans": 0, "sol": ["Step 1 — A = (2,3,−1), B = (−1,2,4), C = (3,−1,2).", "Step 2 — A + B = (1, 5, 3).", "Step 3 — A + B − C = (1−3, 5−(−1), 3−2) = (−2, 6, 1).", "Step 4 — |.| = √<span class=\"rad\">(4 + 36 + 1)<\/span> = √<span class=\"rad\">41<\/span>.", "Step 5 — Option (A)."], "note": "Component-wise add/subtract, phir 3D Pythagoras.", "wrong": {"0": "√<span class=\"rad\">29<\/span> galat — calculation: (−2)²+6²+1² = 4+36+1 = 41.", "1": "7 = |−2+6+1|? — magnitudes add nahi hote.", "3": "√<span class=\"rad\">53<\/span> galat — components carefully: (−2, 6, 1)."}}, {"n": 202, "type": "statement", "topic": "vec3", "q": "Which of the following statements are correct for two unit vectors A and B with an angle θ between them? (1) The magnitude of A − B is 2 sin(θ/2). (2) The unit vector along A + B bisects the angle between A and B. (3) If θ = 120°, then A + B is also a unit vector. (4) If θ = 120°, then the magnitude of A − B is 1.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) |A−B| = √<span class=\"rad\">(2−2cosθ)<\/span> = 2sin(θ/2) ✓ TRUE.", "Step 2 — (2) A+B bisects the angle (equal magnitudes) ✓ TRUE.", "Step 3 — (3) θ = 120°: |A+B| = 2cos60° = 1 → unit ✓ TRUE.", "Step 4 — (4) θ = 120°: |A−B| = 2sin60° = √<span class=\"rad\">3<\/span> ≈ 1.73 ≠ 1 ✗ FALSE.", "Step 5 — Correct: 1, 2, 3 → option (A)."], "note": "Unit vectors: |A±B| = 2cos(θ/2) / 2sin(θ/2). θ=120°: sum = 1, diff = √<span class=\"rad\">3<\/span>.", "wrong": {"0": "4 galat hai (√<span class=\"rad\">3<\/span> ≠ 1) — D chuk jaoge.", "1": "4 FALSE — |A−B| = √<span class=\"rad\">3<\/span> at 120°.", "3": "4 galat hai — 2sin60° = √<span class=\"rad\">3<\/span>."}}, {"n": 203, "type": "mcq", "topic": "scv", "q": "Which of the following is NOT correct?", "fig": "", "figcap": "", "opts": ["The magnitude of the sum of two vectors equals the sum of their magnitudes only when they are in the same direction", "If A + B + C = 0 for three non-zero coplanar vectors, then any one of them is equal and opposite to the sum of the other two", "If three vectors have equal magnitudes and are equally inclined to one another in a plane, their resultant is twice any one of them", "A vector lying in a plane can be resolved into two components along two non-collinear directions in that plane"], "ans": 2, "sol": ["Step 1 — (A) |A+B| = |A|+|B| only same direction ✓ correct.", "Step 2 — (B) A+B+C = 0 → any one = −(sum of other two) ✓ correct.", "Step 3 — (C) 'Three equal vectors equally inclined in a plane → resultant twice any one' — GALAT! Equally inclined in plane = 120° apart → resultant ZERO (equilateral triangle).", "Step 4 — (D) Vector, two non-collinear directions mein resolve ho sakta hai ✓ correct.", "Step 5 — Not correct = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Three equal vectors 120° apart → resultant zer ue west: (−10, 0) → final (5, 8.66).", "Step 3 — Resultant = √<span class=\"rad\">(5² + 8.66²)<\/span> = √<span class=\"rad\">(25 + 75)<\/span> = √<span class=\"rad\">100<\/span> = 10 units.", "Step 4 — Option (C).", "Step 5 — (8.66² = 75, kyunki 8.66 = 5√<span class=\"rad\">3<\/span>.)"], "note": "Component-wise head-to-tail addition.", "wrong": {"0": "5 = sirf x-component — y ghat gaya.", "1": "8.66 = sirf y-component — x ghat gaya.", "3": "20 = 10+10 — direction ignore kiya."}}, {"n": 206, "type": "match", "topic": "dot", "q": "Match the Columns for two vectors, each of magnitude P, with an angle of 60° between them. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Magnitude of A + B<\/div><div class=\"colitem\">(b) Magnitude of A − B<\/div><div class=\"colitem\">(c) Angle made by A + B with A<\/div><div class=\"colitem\">(d) Value of A · B<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) P<\/div><div class=\"colitem\">(ii) P√<span class=\"rad\">3<\/span><\/div><div class=\"colitem\">(iii) 30°<\/div><div class=\"colitem\">(iv) <span class=\"fr\"><span class=\"fn\">P²<\/span><span class=\"fd\">2<\/span><\/span><\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iii, c-i, d-iv", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "sol": ["Step 1 — Equal P, θ = 60°:", "Step 2 — (a) |A+B| = 2P cos30° = 2P×(<span class=\"fr\"><span class=\"fn\">√<span class=\"rad\">3<\/span><\/span><span class=\"fd\">2<\/span><\/span>) = P√<span class=\"rad\">3<\/span> → (ii)", "Step 3 — (b) |A−B| = 2P sin30° = 2P×0.5 = P → (i)", "Step 4 — (c) A+B, A ke saath angle = θ/2 = 30° → (iii)", "Step 5 — (d) A·B = P²cos60° = <span class=\"fr\"><span class=\"fn\">P²<\/span><span class=\"fd\">2<\/span><\/span> → (iv)", "Step 6 — Toh a-ii, b-i, c-iii, d-iv → option (A)."], "note": "60° equal vectors: sum = P√<span class=\"rad\">3<\/span> (30° par), diff = P, dot = <span class=\"fr\"><span class=\"fn\">P²<\/span><span class=\"fd\">2<\/span><\/span>.", "wrong": {"1": "|A−B| = P — P√<span class=\"rad\">3<\/span> (sum) nahi.", "2": "30° sum ka angle hai — P nahi.", "3": "<span class=\"fr\"><span class=\"fn\">P²<\/span><span class=\"fd\">2<\/span><\/span> dot hai — 30° nahi."}}, {"n": 207, "type": "statement", "topic": "cross", "q": "Consider the following statements. Statement I: The vectors A = 3î + 4ĵ and B = 4î − 3ĵ are mutually perpendicular. Statement II: For two non-zero vectors, A × B = 0 is a necessary and sufficient condition for the two vectors to be perpendicular.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 1, "sol": ["Step 1 — Statement I: A·B = 3×4 + 4×(−3) = 12 − 12 = 0 → perpendicular ✓ TRUE.", "Step 2 — Statement II: 'A×B = 0 is necessary and sufficient for PERPENDICULAR' — GALAT! A×B = 0 → sinθ = 0 → θ = 0°/180° → PARALLEL condition hai. Perpendicular ka A·B = 0 hai.", "Step 3 — I true, II false → option (B)."], "note": "A×B = 0 → parallel. A·B = 0 → perpendicular. Common mix-up!", "wrong": {"1": "II galat hai — A×B = 0 parallel ka condition hai.", "2": "I true hai (dot zero verified).", "3": "I true, II false — 'both false' galat."}}, {"n": 208, "type": "mcq", "topic": "scv", "q": "Which of the following is incorrect about addition of vectors?", "fig": "", "figcap": "", "opts": ["The magnitude of the resultant of two vectors is maximum when they are parallel", "Two vectors of equal magnitude P at 120° have a resultant of magnitude P", "If A + B = C, then the magnitude of C is always greater than the magnitude of A", "Vector addition obeys the associative law"], "ans": 2, "sol": ["Step 1 — (A) Parallel (θ=0°) pe resultant max ✓ correct.", "Step 2 — (B) Equal P at 120° → resultant P ✓ correct.", "Step 3 — (C) 'A + B = C → |C| HAMESHA |A| se zyada' — GALAT! B opposite direction mein ho to |C| < |A| (e.g. A=5 east, B=3 west → C=2 < 5).", "Step 4 — (D) Associative law ✓ correct.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Resultant ek bhi component se chhota ho sakta hai (opposite direction contribution).", "wrong": {"0": "Max at parallel — sahi.", "1": "120° → P — sahi.", "3": "Associative — sahi."}}, {"n": 209, "type": "mcq", "topic": "vec3", "q": "For what value of λ are the vectors A = 2î + λĵ + k̂ and B = 4î − 2ĵ + 2k̂ parallel to each other?", "fig": "", "figcap": "", "opts": ["−1", "1", "−2", "2"], "ans": 0, "sol": ["Step 1 — Parallel vectors: components proportional.", "Step 2 — A = (2, λ, 1), B = (4, −2, 2).", "Step 3 — <span class=\"fr\"><span class=\"fn\">2<\/span><span class=\"fd\">4<\/span><\/span> = λ/(−2) = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">2<\/span><\/span>.", "Step 4 — <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">2<\/span><\/span> = λ/(−2) → λ = −1.", "Step 5 — Option (A). Verify: A = (2,−1,1), B = 2(2,−1,1) = (4,−2,2) ✓."], "note": "Parallel: A = kB → components proportional.", "wrong": {"0": "1 = <span class=\"fr\"><span class=\"fn\">2<\/span><span class=\"fd\">2<\/span><\/span>? — ratio λ/(−2) = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">2<\/span><\/span> se λ = −1.", "2": "−2 = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">2<\/span><\/span>? — sign + ratio galat.", "3": "2 = −2/(−1)? — proportionality check karo: λ = −1."}}, {"n": 210, "type": "mcq", "topic": "scv", "q": "A particle starts from the origin at t = 0 with velocity 5î m/s and moves in the x-y plane with a constant acceleration (3î + 2ĵ) m/s². Its y-coordinate at the instant its x-coordinate becomes 84 m is", "fig": "", "figcap": "", "opts": ["36 m", "72 m", "18 m", "12 m"], "ans": 0, "sol": ["Step 1 — u = (5, 0), a = (3, 2).", "Step 2 — x(t) = 5t + ½×3×t² = 5t + 1.5t². Set = 84: 1.5t² + 5t − 84 = 0 → 3t² + 10t − 168 = 0.", "Step 3 — t = (−10 + √<span class=\"rad\">(100 + 2016)<\/span>)/6 = <span class=\"fr\"><span class=\"fn\">(−10 + √<span class=\"rad\">2116<\/span>)<\/span><span class=\"fd\">6<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">(−10+46)<\/span><span class=\"fd\">6<\/span><\/span> = 6 s.", "Step 4 — y(t) = ½×2×t² = t² → y = 6² = 36 m.", "Step 5 — Option (A)."], "note": "x aur y alag se kinematics: x = 84 se t, phir y = t².", "wrong": {"0": "72 = 2×36 — coefficient galat (½ay = 1×t²).", "2": "18 = <span class=\"fr\"><span class=\"fn\">6²<\/span><span class=\"fd\">2<\/span><\/span>? — y = t² = 36.", "3": "12 = 2×6? — y = t² hai."}}, {"n": 211, "type": "statement", "topic": "kin2", "q": "Which of the following statements are correct for motion in a plane with constant acceleration? (1) The displacement after time t is given by r = ut + ½at² when the particle starts from the origin. (2) The components of velocity are obtained independently as vx = ux + ax t and vy = uy + ay t. (3) The path of such a particle is always a parabola. (4) A particle starting from rest with acceleration a = 2î + 2ĵ m/s² moves along a straight line.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) r = ut + ½at² (origin se start) ✓ TRUE.", "Step 2 — (2) vx = ux + axt, vy = uy + aay (independent) ✓ TRUE.", "Step 3 — (3) 'Path HAMESHA parabola' — GALAT! u = 0 (rest se start) → straight line; u ∥ a → straight line. Sirf general case mein parabola.", "Step 4 — (4) Rest se a = 2î+2ĵ → r = ½at² — a ke along straight line ✓ TRUE.", "Step 5 — Correct: 1, 2, 4 → option (B)."], "note": "Constant a: straight line (u=0 or u∥a), otherwise parabola.", "wrong": {"0": "3 galat hai (straight line cases) — D chuk jaoge.", "1": "3 FALSE — 'always parabola' galat.", "3": "3 galat hai — u=0 case straight line."}}, {"n": 212, "type": "diagram", "topic": "kin2", "q": "Study the following data table described in words. The position coordinates (x, y) of a particle in metre at different times are: t = 0 s → (0, 0); t = 1 s → (4, 3); t = 2 s → (16, 12); t = 3 s → (36, 27). The data follow x = 4t² and y = 3t², with t in second. The speed of the particle at t = 2 s is", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>t (s)<\/th><th>x (m)<\/th><th>y (m)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>4<\/td><td>3<\/td><\/tr><tr><td>2<\/td><td>16<\/td><td>12<\/td><\/tr><tr><td>3<\/td><td>36<\/td><td>27<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">x = 4t², y = 3t² → v = (8t, 6t)<\/p><\/div>", "figcap": "Position data following x = 4t², y = 3t²; speed at t = 2 s.", "opts": ["10 m/s", "20 m/s", "25 m/s", "30 m/s"], "ans": 1, "sol": ["Step 1 — x = 4t², y = 3t².", "Step 2 — vx = <span class=\"fr\"><span class=\"fn\">dx<\/span><span class=\"fd\">dt<\/span><\/span> = 8t, vy = <span class=\"fr\"><span class=\"fn\">dy<\/span><span class=\"fd\">dt<\/span><\/span> = 6t.", "Step 3 — t = 2: vx = 16, vy = 12.", "Step 4 — v = √<span class=\"rad\">(16²+12²)<\/span> = √<span class=\"rad\">(256+144)<\/span> = √<span class=\"rad\">400<\/span> = 20 m/s.", "Step 5 — Option (B)."], "note": "v = (<span class=\"fr\"><span class=\"fn\">dx<\/span><span class=\"fd\">dt<\/span><\/span>, <span class=\"fr\"><span class=\"fn\">dy<\/span><span class=\"fd\">dt<\/span><\/span>). 16-12-20 triangle.", "wrong": {"0": "10 = √<span class=\"rad\">(100)<\/span>? — components 16, 12 hain.", "2": "25 = 16+12+…? — Pythagoras: 20.", "3": "30 = 16+12+2? — magnitudes add nahi hote."}}, {"n": 213, "type": "assertion", "topic": "comp", "q": "Assertion (A): Two bodies projected horizontally from the same tower with different speeds strike the ground with the same vertical component of velocity. Reason (R): The vertical component of velocity at impact is √<span class=\"rad\">(2gh)<\/span>, which depends only on the height h and g.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Dono horizontally projected same tower se — vertical motion SAME: vy = √<span class=\"rad\">(2gh)<\/span>.", "Step 2 — Impact pe vertical component = √<span class=\"rad\">(2gh)<\/span> — sirf h aur g par ✓ Assertion TRUE.", "Step 3 — Reason: vy = √<span class=\"rad\">(2gh)<\/span>, h aur g par depend ✓ TRUE — wahi result.", "Step 4 — R correct explanation → option (A)."], "note": "vy(impact) = √<span class=\"rad\">(2gh)<\/span> — horizontal speed se independent.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (√<span class=\"rad\">2<\/span>gh).", "3": "Assertion true hai."}}, {"n": 214, "type": "mcq", "topic": "scv", "q": "Which of the following is incorrect for motion in a plane with constant acceleration?", "fig": "", "figcap": "", "opts": ["The average velocity over a time interval is <span class=\"fr\"><span class=\"fn\">(u + v)<\/span><span class=\"fd\">2<\/span><\/span>, where u and v are the initial and final velocities", "The instantaneous velocity is always directed along the tangent to the path", "The average acceleration over an interval equals the instantaneous acceleration at the midpoint only if the acceleration is variable", "The displacement depends on the initial velocity vector and the acceleration vector"], "ans": 2, "sol": ["Step 1 — (A) Constant a pe avg velocity = <span class=\"fr\"><span class=\"fn\">(u+v)<\/span><span class=\"fd\">2<\/span><\/span> ✓ correct (standard result).", "Step 2 — (B) Instantaneous velocity tangent ke along ✓ correct.", "Step 3 — (C) 'Avg acceleration = instantaneous at midpoint ONLY IF acceleration variable' — GALAT! Constant accelerat ; v = √<span class=\"rad\">(vx²+vy²)<\/span>; tanθ = <span class=\"fr\"><span class=\"fn\">vy<\/span><span class=\"fd\">vx<\/span><\/span>.", "wrong": {"1": "vx formula (i) hai — x formula nahi.", "2": "tanθ direction hai — vx formula nahi.", "3": "v magnitude (iv) hai — tanθ nahi."}}, {"n": 216, "type": "statement", "topic": "scv", "q": "Consider the following statements for a particle moving in a plane, where v is its velocity and a its acceleration. Statement I: If v · a is negative at an instant, the speed of the particle is decreasing at that instant. Statement II: If v · a is zero at every instant, the speed of the particle remains constant.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — d/dt(v²) = 2v·a → speed changing if v·a ≠ 0.", "Step 2 — Statement I: v·a < 0 → speed decreasing (force opposite-ish to motion) ✓ TRUE.", "Step 3 — Statement II: v·a = 0 always → speed constant (UCM jaisa) ✓ TRUE.", "Step 4 — Dono true → option (A)."], "note": "<span class=\"fr\"><span class=\"fn\">d(v²)<\/span><span class=\"fd\">dt<\/span><\/span> = 2v·a. v·a < 0 → speed↓; = 0 → speed const; > 0 → speed↑.", "wrong": {"1": "v·a = 0 → |v| constant — Statement II sahi.", "2": "v·a < 0 → speed decreasing — Statement I sahi.", "3": "Dono true hain."}}, {"n": 217, "type": "mcq", "topic": "ucm", "q": "The vectors A = cos ωt î + sin ωt ĵ and B = cos(<span class=\"fr\"><span class=\"fn\">ωt<\/span><span class=\"fd\">2<\/span><\/span>) î + sin(<span class=\"fr\"><span class=\"fn\">ωt<\/span><span class=\"fd\">2<\/span><\/span>) ĵ are functions of time t, where ω is a positive constant. The smallest positive value of t at which the two vectors are orthogonal to each other is", "fig": "", "figcap": "", "opts": ["π/(4ω)", "π/(2ω)", "π/ω", "<span class=\"fr\"><span class=\"fn\">2π<\/s  Statement II: The power delivered by this force to a particle moving with velocity v = (î + ĵ) m/s is 5 W.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — W = F·s = (2)(4) + (3)(−1) = 8 − 3 = 5 J ✓ Statement I TRUE.", "Step 2 — P = F·v = (2)(1) + (3)(1) = 5 W ✓ Statement II TRUE.", "Step 3 — Dono true → option (A)."], "note": "W = F·s, P = F·v — dono dot products.", "wrong": {"1": "P = F·v = 5 W — Statement II sahi.", "2": "W = 5 J — Statement I sahi.", "3": "Dono true hain."}}, {"n": 219, "type": "mcq", "topic": "scv", "q": "Which of the following is NOT correct for the scalar and vector products of vectors?", "fig": "", "figcap": "", "opts": ["A · (B + C) = A · B + A · C", "(A × B) · (A × B) = A²B² − (A · B)²", "If A × B = A × C and A is a non-zero vector, then B must be equal to C", "The vector A × B is perpendicular to the plane containing A and B"], "ans": 2, "sol": ["Step 1 — (A) Dot distributive ✓ sahi.", "Step 2 — (B) |A×B|² = A²B² − (A·B)² ✓ sahi (Lagrange identity).", "Step 3 — (C) 'A×B = A×C → B = C' — GALAT! A×(B−C) = 0 → B−C, A ke PARALLEL ho sakta hai; B = C zaroori nahi.", "Step 4 — (D) A×B, A aur B ke plane ke perpendicular ✓ sahi.", "Step 5 — Not correct = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "A×B = A×C → B−C ∥ A — B = C nahi zaroori.", "wrong": {"0": "Distributive — sahi.", "1": "Lagrange identity — sahi.", "3": "Perpendicular to plane — sahi."}}, {"n": 220, "type": "diagram", "topic": "cross", "q": "Study the described vector diagram. On a Cartesian sheet, vector A is drawn as an arrow from the origin to the point (0, 3) and vector B as an arrow from the same origin to the point (4, 0). The direction of the vector A × B is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for questio an>. Common angles: 45° (<span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">√<span class=\"rad\">2<\/span><\/span><\/span>), 60° (<span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">2<\/span><\/span>), 90° (0).", "wrong": {"1": "45° (b) ka hai — 90° nahi.", "2": "60° (c) ka hai — 45° nahi.", "3": "0° (d) ka hai — 90° nahi."}}, {"n": 223, "type": "mcq", "topic": "proj", "q": "A projectile is fired from the surface of the earth with a velocity of 5 m/s at an angle θ with the horizontal. Another projectile fired from another planet with a velocity of 3 m/s at the same angle θ follows a trajectory identical to that of the projectile fired from the earth. Taking g = 9.8 m/s² on the earth, the acceleration due to gravity on the other planet is", "fig": "", "figcap": "", "opts": ["3.53 m/s²", "5.88 m/s²", "16.3 m/s²", "9.8 m/s²"], "ans": 0, "sol": ["Step 1 — Identical trajectory → same equation: y = x tanθ − <span class=\"fr\"><span class=\"fn\">gx²<\/span><span class=\"fd\">(2u²cos²θ)<\/span><\/span>.", "Step 2 — Shape same → <span class=\"fr\"><span class=\"fn\">g<\/span><span class=\"fd\">u²<\/span><\/span> same dono planets pe: <span class=\"fr\"><span class=\"fn\">g₁<\/span><span class=\"fd\">u₁²<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">g₂<\/span><span class=\"fd\">u₂²<\/span><\/span>.", "Step 3 — g₂ = g₁×(u₂/u₁)² = 9.8×(<span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">5<\/span><\/span>)² = 9.8×0.36 = 3.528 ≈ 3.53 m/s².", "Step 4 — Option (A)."], "note": "Same trajectory: <span class=\"fr\"><span class=\"fn\">g<\/span><span class=\"fd\">u²<\/span><\/span> constant. g₂ = g₁(u₂/u₁)².", "wrong": {"0": "5.88 = 9.8×0.6 — (<span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">5<\/span><\/span>) square nahi kiya.", "2": "16.3 galat — g₂ = g₁×(<span class=\"fr\"><span class=\"fn\">9<\/span><span class=\"fd\">25<\/span><\/span>).", "3": "9.8 same — u alag hai, g bhi alag hona chahiye."}}, {"n": 224, "type": "statement", "topic": "proj", "q": "Which of the following statements are correct for a projectile fired with speed u at angles θ and (90° − θ) with the horizontal, landing at the same level (θ less than 45°)? (1) Both projections give the same horizontal range. (2) The ratio of the maximum heights for the two projections is tan²θ. (3) The sum of their times of flight is equal to the time of flight for a projection at 45° with the same speed. (4) The speeds at the highest point are u cos θ and u sin θ respectively.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Same range (complementary) ✓ TRUE.", "Step 2 — (2) H ratio: H(θ)/H(90°−θ) = sin²θ/cos²θ = tan²θ ✓ TRUE.", "Step 3 — (3) T(θ) + T(90°−θ) = (<span class=\"fr\"><span class=\"fn\">2u<\/span><span class=\"fd\">g<\/span><\/span>)(sinθ+cosθ); T(45°) = (<span class=\"fr\"><span class=\"fn\">2u<\/span><span class=\"fd\">g<\/span><\/span>)√<span class=\"rad\">2<\/span>. sinθ+cosθ = √<span class=\"rad\">2<\/span> sin(θ+45°) < √<span class=\"rad\">2<\/span> for θ < 45° ✗ FALSE.", "Step 4 — (4) Top speeds: u cosθ aur u sinθ ✓ TRUE.", "Step 5 — Correct: 1, 2, 4 → option (B)."], "note": "T(θ)+T(90°−θ) ≠ T(45°) generally (sirf θ=45° pe equal).", "wrong": {"0": "3 galat hai (sinθ+cosθ < √<span class=\"rad\">2<\/span> for θ<45°) — D chuk jaoge.", "1": "3 FALSE — sum only at 45° equals.", "3": "3 galat hai — identity check karo."}}, {"n": 225, "type": "mcq", "topic": "proj", "q": "Which of the following is NOT correct for a projectile fired from level ground at an angle θ (air resistance neglected)?", "fig": "", "figcap": "", "opts": ["The speed of the projectile at a given height is the same during ascent and descent", "The time taken to reach the maximum height is half of the total time of flight", "The angle between the velocity of projection and the velocity just before impact is θ", "The horizontal range is u² sin 2θ/g"], "a "Step 4 — Dono true → option (A)."], "note": "R = H → tanθ = 4 → θ ≈ 76°.", "wrong": {"1": "θ ≈ 75.96° > 75° — Statement II sahi.", "2": "tanθ = 4 — Statement I sahi.", "3": "Dono true hain."}}, {"n": 229, "type": "assertion", "topic": "proj", "q": "Assertion (A): For a projectile launched at 45° on level ground, the velocity at the instant of impact is perpendicular to the velocity of projection. Reason (R): The final velocity makes the same angle θ below the horizontal as the initial velocity makes above it, so the angle between the two velocities is 2θ, equal to 90° for θ = 45°.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — 45° projection: launch velocity 45° above horizontal.", "Step 2 — Impact velocity 45° below horizontal (same speed, symmetric).", "Step 3 — Angle between them = 45° + 45° = 90° ✓ Assertion TRUE.", "Step 4 — Reason: final velocity θ below horizontal, angle between = 2θ = 90° at θ = 45° ✓ TRUE → correct explanation.", "Step 5 — Option (A)."], "note": "Angle between launch & impact velocity = 2θ. 90° at θ = 45°.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (2θ argument).", "3": "Assertion true hai (90° at 45°)."}}, {"n": 230, "type": "match", "topic": "proj", "q": "Match the Columns for a projectile on level ground. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Condition R = 2H<\/div><div class=\"colitem\">(b) Condition R = H<\/div><div class=\"colitem\">(c) Condition for maximum horizontal range<\/div><div class=\"colitem\">(d) Condition for maximum height for a given u<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) θ = 90°<\/di >HA<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">0.75<\/span><span class=\"fd\">0.25<\/span><\/span> = 3 → HB = 3HA.", "Step 4 — (A) kehta hai HA = 3HB — ULTA — NOT VALID → option (A).", "Step 5 — (B) <span class=\"fr\"><span class=\"fn\">TB<\/span><span class=\"fd\">TA<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">sin60<\/span><span class=\"fd\">sin30<\/span><\/span> = √<span class=\"rad\">3<\/span> ✓ valid. (C) RA = RB ✓ valid. (D) HB = 3HA ✓ valid."], "note": "30°/60°: H ratio 1:3 (60° zyada), R same, T ratio 1:√<span class=\"rad\">3<\/span>.", "wrong": {"1": "TB = √<span class=\"rad\">3<\/span> TA sahi hai — (B) valid hai.", "2": "RA = RB sahi (complementary) — valid.", "3": "HB = 3HA sahi — valid (A wala ulta hai)."}}, {"n": 232, "type": "diagram", "topic": "proj", "q": "Study the following data table described in words. On a planet with no atmosphere, a projectile is launched from the origin and its coordinates (in metre) are recorded: t = 0 s → x = 0, y = 0; t = 1 s → x = 3, y = 2; t = 2 s → x = 6, y = 0. The coordinates follow x = 3t and y = 4t − 2t² with t in second. Taking tan 37° = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> and tan 53° = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span>, the angle of projection with the vertical is", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>t (s)<\/th><th>x (m)<\/th><th>y (m)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>6<\/td><td>0<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">x = 3t, y = 4t − 2t²<\/p><\/div><div class=\"figsub\"><svg class=\"fig\" viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"Diagram for question 232\"><defs><marker id=\"m232\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\ 2\"/><line x1=\"60.0\" y1=\"150.0\" x2=\"90.0\" y2=\"90.0\" stroke=\"#264653\" stroke-width=\"2.2\" marker-end=\"url(#m232)\"/><text x=\"100.0\" y=\"82.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#264653\" font-weight=\"normal\">u (37° with horizontal)<\/text><path d=\"M 92,150 A 32,32 0 0 0 83,126\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"1.4\"/><text x=\"106.0\" y=\"134.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9a441\" font-weight=\"normal\">37°<\/text><\/svg><\/div>", "figcap": "Planet projectile: x = 3t, y = 4t − 2t² → u_x = 3, u_y = 4 (37° with horizontal, 53° with vertical).", "opts": ["30°", "37°", "45°", "53°"], "ans": 1, "sol": ["Step 1 — x = 3t → vx = 3 (constant).", "Step 2 — y = 4t − 2t² → vy = 4 − 4t → vy(0) = 4.", "Step 3 — Angle with horizontal: tanθ = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span> → θ = 53°.", "Step 4 — Angle with VERTICAL = 90° − 53° = 37°.", "Step 5 — Option (B)."], "note": "vx, vy(0) se launch angle: tanθ = <span class=\"fr\"><span class=\"fn\">vy<\/span><span class=\"fd\">vx<\/span><\/span>. Vertical ke saath = 90°−θ.", "wrong": {"0": "30° — tan = 0.577, yahan <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span>.", "2": "45° — tan = 1, yahan <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span>.", "3": "53° horizontal ke saath hai — vertical ke saath 37°."}}, {"n": 233, "type": "statement", "topic": "proj", "q": "Which of the following statements are correct for an oblique projectile (air resistance neglected)? (1) At the highest point, the rate of change of speed is zero. (2) At the highest point, the magnitude of the rate of change of velocity is g. (3) The time of flight on level ground depends on the horizontal component of the initial velocity. (4) The speed just before impact equals the speed of projection.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Top pe rate of change of speed = 0 (v min, <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> = 0 instantaneously) ✓ TRUE.", "Step 2 — (2) |<span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span>| = g hamesha (acceleration magnitude) ✓ TRUE.", "Step 3 — (3) 'Time of flight horizontal component par depend' — GALAT! T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> — VERTICAL component par.", "Step 4 — (4) Impact speed = projection speed (same level) ✓ TRUE.", "Step 5 — Correct: 1, 2, 4 → option (B)."], "note": "T par vertical component depend karti hai, horizontal nahi.", "wrong": {"0": "3 galat hai (vertical component) — D chuk jaoge.", "1": "3 FALSE — T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span>.", "3": "3 galat hai — vy(0) matter karti hai."}}, {"n": 234, "type": "mcq", "topic": "proji", "q": "A projectile is fired up an inclined plane of inclination 30° with the horizontal, with a speed u at an angle θ with the horizontal, where θ is greater than 30°. The range of the projectile along the inclined plane is maximum when θ is equal to", "fig": "", "figcap": "", "opts": ["30°", "45°", "60°", "75°"], "ans": 2, "sol": ["Step 1 — Inclined plane (inclination α) pe max range:", "Step 2 — θ = 45° + α/2 (angle with horizontal).", "Step 3 — α = 30° → θ = 45° + 15° = 60°.", "Step 4 — Option (C)."], "note": "Inclined plane max range: θ = 45° + α/2 (up the plane).", "wrong": {"0": "30° = α — projection angle nahi.", "1": "45° level ground ka result — incline pe α/2 add hota.", "3": "75° = 45° + 30°? — α/2 = 15° hai, 30° nahi."}}, {"n": 235, "type": "mcq", "topic": "rel", "q": "Two particles A and B have velocities vA = (4î + 3ĵ) m/s and vB = (î + 7ĵ) m/s. The magnitude of the velocity of A relative to B is", "fig": "", "figcap": "", "opts": ["5 m/s", "7 m/s", "1 m/s", "√<span class=\"rad\">58<\/span> m/s"], "ans": 0, "sol": ["Step 1 — vA = (4,3), vB = (1,7).", "Step 2 — vA relative to B = vA − vB = (3, −4).", "Step 3 — |.| = √<span class=\"rad\">(9+16)<\/span> = 5 m/s.", "Step 4 — Option (A) — 3-4-5 phir se!"], "note": "vAB = vA − vB, Pythagoras.", "wrong": {"1": "7 = |3+4|? — perpendicular components, Pythagoras: 5.", "2": "1 = |4−3|? — components alag axes pe hain.", "3": "√<span class=\"rad\">58<\/span> = √<span class=\"rad\">(16+…)<\/span>? — galat subtraction."}}, {"n": 236, "type": "statement", "topic": "boat", "q": "Consider the following statements about a boat crossing a flowing river. Statement I: To cross the river along the shortest path, the velocity of the boat relative to the water must have an upstream component equal to the speed of the river current. Statement II: The shortest path across the river is possible only when the speed of the boat in still water is greater than the speed of the river current.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Shortest path (zero drift) ke liye upstream component = current ✓ TRUE.", "Step 2 — Statement II: Yeh possible only when v<sub>boat<\/sub> > v<sub>current<\/sub> ✓ TRUE (upstream component ≤ v<sub>boat<\/sub> ho chahiye).", "Step 3 — Dono true → option (A)."], "note": "Zero drift: v<sub>boat<\/sub> > v<sub>current<\/sub>, aim upstream sinα = <span class=\"fr\"><span class=\"fn\">u<\/span><span class=\"fd\">v<\/span><\/span>.", "wrong": {"1": "v > u condition sahi — Statement II sahi.", "2": "Upstream = u condition sahi — Statement I sahi.", "3": "Dono true hain."}}, {"n": 237, "type": "assertion", "topic": "rel", "q": "Assertion (A): A man standing on a railway platform observes rain falling vertically, while a passenger in a train moving horizontally observes the same rain falling at an angle with the vertical. Reason (R): The velocity of rain relative to the passenger has a horizontal component equal and opposite to the velocity of the train.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Platform pe person: rain vertical dikhta hai.", "Step 2 — Train ke passenger: rain relative = v(rain) − v(train) = (−v<sub>train<\/sub>, −v<sub>rain<\/sub>) → vertical se tilted ✓ Assertion TRUE.", "Step 3 — Reason: horizontal component = train velocity (opposite) ✓ TRUE → correct explanation.", "Step 4 — Option (A)."], "note": "Moving observer: rain tilt = observer's velocity (opposite direction).", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (relative velocity).", "3": "Assertion true hai."}}, {"n": 238, "type": "diagram", "topic": "rel", "q": "Study the described vector diagram. From a common origin O on a sheet, an arrow of length 12 units pointing due north represents the velocity of rain relative to the ground, and an arrow of length 5 units pointing due east represents the velocity of a car. The velocity of rain relative to the car is represented by the arrow drawn from the head of the car's velocity to the head of the rain's velocity. Taking √<span class=\"rad\">169<\/span> = 13, the magnitude of the velocity of rain relative to the car is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 238\"><defs><marker id=\"m238\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt238\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\ pan><span class=\"fd\">R<\/span><\/span> + mg."}}, {"n": 249, "type": "mcq", "topic": "vcer", "q": "For a body of mass m tied to a light string of length R and whirled in a vertical circle with the critical (minimum) speed needed to complete the circle, which of the following is NOT correct?", "fig": "", "figcap": "", "opts": ["The difference between the tensions at the lowest and the highest points is 6mg", "The minimum speed at the lowest point is √<span class=\"rad\">(5gR)<\/span>", "The centripetal acceleration of the body is constant in magnitude throughout the motion", "The motion is an example of non-uniform circular motion"], "ans": 2, "sol": ["Step 1 — Critical speed (complete circle): v<sub>top<\/sub> = √<span class=\"rad\">(gR)<\/span>.", "Step 2 — (A) T<sub>bottom<\/sub> − T<sub>top<\/sub> = 6mg ✓ correct (T<sub>b<\/sub> = 6mg, T<sub>t<\/sub> = 0 at critical).", "Step 3 — (B) v<sub>bottom<\/sub> = √<span class=\"rad\">(5gR)<\/span> ✓ correct (energy: ½v² = ½gR + 2gR).", "Step 4 — (C) 'Centripetal acceleration constant in magnitude' — GALAT! v changes → <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> changes.", "Step 5 — (D) Non-uniform circular motion ✓ correct (speed changes).", "Step 6 — Not correct = (C).", "Step 7 — Isliye sahi answer: Option (C)."], "note": "Vertical circle: speed varies → ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> varies. Non-UCM.", "wrong": {"0": "6mg difference — sahi.", "1": "√<span class=\"rad\">(5gR)<\/span> — sahi.", "3": "Non-UCM — sahi."}}, {"n": 250, "type": "statement", "topic": "ucm", "q": "With r, v and a denoting the position, velocity and acceleration vectors of a particle (r measured from the centre of the circle in circular motion and from the point of projection for a projectile), which of the following statements are correct? (1) For uniform circular motion, r · v = 0 at every instant. (2) For a projectile at its highest point, v · a = 0. (3) For uniform circular motion, r · a = −ω²R², a constant. (4) For a projectile at its highest point, r × v is a null vector.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) UCM: r ⊥ v (radial vs tangent) → r·v = 0 ✓ TRUE.", "Step 2 — (2) Projectile top: v horizontal, a = −gĵ vertical → v·a = 0 ✓ TRUE.", "Step 3 — (3) UCM: a = −ω²r → r·a = −ω²R² ✓ TRUE (constant).", "Step 4 — (4) Projectile top: r (from projection) aur v — dono horizontal component rakhte hain, parallel NAHI → r×v ≠ 0 ✗ FALSE.", "Step 5 — Correct: 1, 2, 3 → option (A)."], "note": "Projectile top: r×v non-zero (r ke horizontal component v ke parallel nahi hota exactly).", "wrong": {"0": "4 galat hai (r×v ≠ 0 at top) — D chuk jaoge.", "1": "4 FALSE — r aur v parallel nahi hain top pe.", "3": "4 galat hai — cross product non-zero."}}, {"n": 251, "type": "mcq", "topic": "vec3", "q": "The magnitude of the vector A = 6î − 2ĵ + 3k̂ is", "fig": "", "figcap": "", "opts": ["7", "√<span class=\"rad\">47<\/span>", "11", "√<span class=\"rad\">41<\/span>"], "ans": 0, "sol": ["Step 1 — A = 6î − 2ĵ + 3k̂.", "Step 2 — |A| = √<span class=\"rad\">(36 + 4 + 9)<\/span> = √<span class=\"rad\">49<\/span> = 7.", "Step 3 — Option (A)."], "note": "3D magnitude: √<span class=\"rad\">(x²+y²+z²)<\/span>.", "wrong": {"0": "√<span class=\"rad\">47<\/span> = √<span class=\"rad\">(36+4+7)<\/span>? — z² = 9 hai.", "2": "11 = 6+2+3 — magnitudes add nahi hote.", "3": "√<span class=\"rad\">41<\/span> = √<span class=\"rad\">(36+4+1)<\/span>? — z² = 9 hai."}}, {"n": 252, "type": "statement", "topic": "vec3", "q": "Which of the following statements are correct? (1) Multiplying a vector A by a positive real number λ changes its magnitude to λ times the original magnitude without changing its direction. (2) The unit vector in the direction of A = 3î + 4ĵ is 0.8î + 0.6ĵ. (3) Two vectors of different physical dimensions can never be added. (4) The vector (î + ĵ + k̂)/√<span class=\"rad\">3<\/span> is a unit vector.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Positive λ: magnitude λA, direction same ✓ TRUE.", "Step 2 — (2) Unit vector of (3,4): <span class=\"fr\"><span class=\"fn\">(3,4)<\/span><span class=\"fd\">5<\/span><\/span> = 0.6î+0.8ĵ — option mein 0.8î+0.6ĵ diya ✗ FALSE (components ulte).", "Step 3 — (3) Different dimensions add nahi ho sakte ✓ TRUE.", "Step 4 — (4) (î+ĵ+k̂)/√<span class=\"rad\">3<\/span>: magnitude √<span class=\"rad\">3<\/span>/√<span class=\"rad\">3<\/span> = 1 ✓ TRUE.", "Step 5 — Correct: 1, 3, 4 → option (B)."], "note": "Unit vector = <span class=\"fr\"><span class=\"fn\">(x,y,z)<\/span><span class=\"fd\">|A|<\/span><\/span> — order matters: <span class=\"fr\"><span class=\"fn\">(3,4)<\/span><span class=\"fd\">5<\/span><\/span> = 0.6î+0.8ĵ.", "wrong": {"0": "2 galat hai (0.8î+0.6ĵ ulta hai) — A chuk jaoge.", "1": "2 FALSE — sahi unit 0.6î+0.8ĵ hai.", "3": "2 galat hai — components check karo."}}, {"n": 253, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["The position vector of a point depends on the choice of origin", "The displacement vector of a particle is independent of the choice of origin", "The velocity vector is independent of the choice of origin but depends on the frame of reference", "The acceleration of a particle measured in two frames moving with constant relative velocity is different"], "ans": 3, "sol": ["Step 1 — (A) Position vector origin par depend karta hai ✓ correct.", "Step 2 — (B) Displacement origin-independent ✓ correct.", "Step 3 — (C) Velocity origin-independent, frame-dependent ✓ correct.", "Step 4 — (D) 'Acceleration two frames (constant relative velocity) mein DIFFERENT' — GALAT! Inertial frames (constant relative velocity) mein acceleration SAME rehta hai (Galilean invariance).", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Inertial frames (constant relative v): acceleration identical.", "wrong": {"0": "Origin-dependent — sahi.", "1": "Origin-independent — sahi.", "3": "Frame-dependent, origin-independent — sahi."}}, {"n": 254, "type": "assertion", "topic": "scv", "q": "Assertion (A): A vector can never be divided by another vector. Reason (R): Division of a vector by a vector is not defined in vector algebra, although a vector can be divided by a scalar.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Vector ko doosre vector se DIVIDE nahi kar sakte ✓ TRUE (vector/vector defined nahi hai).", "Step 2 — Reason: Vector algebra mein vector÷vector defined nahi; vector÷scalar defined hai ✓ TRUE.", "Step 3 — R exactly wahi reason hai → correct explanation.", "Step 4 — Option (A)."], "note": "Vector ÷ scalar OK (scale); vector ÷ vector undefined.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (definition).", "3": "Assertion true hai."}}, {"n": 255, "type": "diagram", "topic": "add", "q": "Study the described vector diagram. On a graph sheet, three arrows are drawn from the origin: X ending at (1, 2), Y ending at (−2, 1) and Z ending at (2, −1), with x and y in the same units. The magnitude of the vector X + Y + Z is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 255\"><defs><marker id=\"m255\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt255\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=
