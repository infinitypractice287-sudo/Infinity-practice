<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 11 Physics — Motion in a Plane — 450 MCQ Practice Set</title>
<style>
:root{
  --bg:#faf5ea; --card:#fffdf7; --card2:#f6efe0; --ink:#2b2b33; --soft:#5c5c66;
  --teal:#2a9d8f; --teal-soft:#dcefe9; --green:#3a8f5f; --green-soft:#e2f2e6;
  --red:#c65b4e; --red-soft:#f7e3de; --gold:#b98a2f; --gold-soft:#f4e8cd;
  --line:#e4d9c2; --grid:#f3ecdb; --shadow:0 1px 3px rgba(90,75,40,.08),0 4px 14px rgba(90,75,40,.06);
}
html[data-dark="1"]{
  --bg:#171a1f; --card:#1f242c; --card2:#252b35; --ink:#e8e4d8; --soft:#a7a398;
  --teal:#4cc2b2; --teal-soft:#20363a; --green:#63c08a; --green-soft:#24382c;
  --red:#e08a7d; --red-soft:#3c2622; --gold:#d8b25e; --gold-soft:#3a3221;
  --line:#333a45; --grid:#262c35; --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  font-size:17px;line-height:1.75;}
.qtext,.opt,.sol,.step{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;}
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.tb-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tb-title{font-weight:700;font-size:16.5px;letter-spacing:.2px}
.tb-title small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.tb-stats{display:flex;gap:10px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:14px}
.stat b{font-size:16px}
.stat.score b{color:var(--teal)}
.stat.wrong b{color:var(--red)}
.pbar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.pbar>div{height:100%;background:var(--teal);width:0%;transition:width .25s}
#darkBtn{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;padding:5px 12px;font-size:14px}
.layout{max-width:1180px;margin:0 auto;padding:18px;display:grid;grid-template-columns:230px 1fr;gap:18px}
.side{position:sticky;top:74px;align-self:start;max-height:calc(100vh - 92px);overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters button{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:8px;padding:3px 9px;font-size:12.5px}
.filters button.on{background:var(--teal);border-color:var(--teal);color:#fff}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
#grid button{cursor:pointer;min-height:30px;border:1px solid var(--line);background:var(--card2);color:var(--soft);border-radius:7px;font-size:12.5px;padding:0}
#grid button.ok{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
#grid button.bad{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:700}
#grid button.cur{outline:2px solid var(--gold);outline-offset:1px}
#grid button.hide{visibility:hidden}
#resetAll{width:100%;margin-top:10px;cursor:pointer;border:1px solid var(--red);background:transparent;color:var(--red);border-radius:9px;padding:7px;font-size:13.5px;font-weight:600}
.main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:16px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12.5px;border-radius:999px;padding:2px 11px;border:1px solid var(--line);background:var(--card2);color:var(--soft)}
.tag.topic{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.qnum{font-size:14px;color:var(--soft);margin-bottom:6px}
.qtext{font-size:18.5px;line-height:1.8;margin:0 0 14px}
.figwrap{margin:6px 0 14px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.fig{width:100%;height:auto;max-height:300px;display:block}
.figbox{overflow-x:auto}
table.figtbl{border-collapse:collapse;margin:0 auto;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14.5px}
.figtbl th,.figtbl td{border:1px solid var(--line);padding:5px 14px;text-align:center;background:var(--card)}
.figtbl th{background:var(--card2);font-weight:700}
.tnote{font-size:13px;color:var(--soft);margin:8px 0 0;text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.colbox{border:1.5px solid var(--line);border-radius:11px;background:var(--card2);padding:9px 13px}
.colhead{font-weight:800;color:var(--teal);margin-bottom:5px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;letter-spacing:.3px}
.colitem{padding:3.5px 0;border-bottom:1px dashed var(--grid);font-size:15.5px}
.colitem:last-child{border-bottom:none}
.figsub{margin-top:8px;display:flex;justify-content:center}
.figsub svg{max-width:260px}
.figcap{font-size:13.5px;color:var(--soft);text-align:center;margin-top:6px}
.opts{display:grid;gap:9px;margin:14px 0}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);
  border-radius:12px;padding:11px 14px;cursor:pointer;font-size:16.5px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--teal)}
.opt .ol{flex:0 0 auto;font-weight:800;color:var(--teal);font-family:ui-sans-serif,system-ui,sans-serif}
.opt.correct{background:var(--green-soft);border-color:var(--green)}
.opt.correct .ol{color:var(--green)}
.opt.chosen-wrong{background:var(--red-soft);border-color:var(--red)}
.opt.chosen-wrong .ol{color:var(--red)}
.opt.dim{opacity:.72}
.verdict{display:none;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15.5px;margin:4px 0 10px}
.verdict.show{display:block}
.verdict.good{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}
.verdict.badd{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
.solbox{display:none;border:1px solid var(--line);border-radius:14px;background:var(--card2);padding:16px 18px;margin-top:12px}
.solbox.show{display:block}
.solhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ansline{font-size:18px;font-weight:800}
.step{margin:7px 0;padding:8px 12px;background:var(--card);border-left:3px solid var(--teal);border-radius:0 9px 9px 0}
.notebox{margin-top:12px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:11px;padding:10px 14px;font-size:15px}
.notebox b{color:var(--gold)}
.whybox{margin-top:12px;background:var(--red-soft);border:1px solid var(--red);border-radius:11px;padding:10px 14px;font-size:15px}
.whybox b{color:var(--red)}
.deepbox{margin-top:12px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:11px;padding:10px 14px;font-size:15px}
.deepbox b{color:var(--teal)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
button.nav{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;padding:8px 16px;font-size:15px}
button.nav:disabled{opacity:.4;cursor:default}
button.retry{cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
.ofn{margin-left:auto;color:var(--soft);font-size:14.5px}
.kbd-hint{max-width:1180px;margin:0 auto 30px;padding:0 18px;color:var(--soft);font-size:13px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:var(--card2)}
/* book-style math: stacked fractions + radical overline */
.fr{display:inline-flex;flex-direction:column;vertical-align:-0.7em;text-align:center;line-height:1.25;margin:0 .12em;font-size:.92em}
.fr .fn{border-bottom:1.1px solid currentColor;padding:0 .18em}
.fr .fd{padding:0 .18em}
.rad{border-top:1.2px solid currentColor;padding:0 .1em;margin-left:.03em}
#printSheet{display:none}
@media (max-width:880px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none;order:2}
  #grid{grid-template-columns:repeat(10,1fr)}
  .cols{grid-template-columns:1fr}
  body{font-size:16px}
  .card{padding:16px}
}
@media print{
  .topbar,.side,.kbd-hint,.actions,.solbox,.verdict{display:none!important}
  body{background:#fdfbf5;font-size:12.5px}
  .app{display:none!important}
  #printSheet{display:block!important}
  #printSheet .pq{page-break-inside:avoid;border-bottom:1px dotted #bbb;padding:8px 2px}
  #printSheet .qtext{font-size:12.5px;margin:4px 0}
  #printSheet .opt{display:flex;padding:1px 0;border:none;background:none;font-size:12px}
  #printSheet .opts{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  #printSheet .figwrap{display:none}
  #printSheet h1{font-size:16px}
  #printSheet .cols{grid-template-columns:1fr 1fr;gap:4px}
  #printSheet .colitem{font-size:11.5px;padding:1px 0}
}
</style>
</head>

ment ki apni direction hoti hai — vector hai, scalar nahi.", "1": "Velocity = speed + direction, classic vector hai.", "3": "Acceleration velocity change ki direction rakhta hai — vector hai."}}, {"n": 2, "type": "mcq", "topic": "scv", "q": "According to NCERT, a vector quantity is one which has", "fig": "", "figcap": "", "opts": ["magnitude only", "direction only", "both magnitude and direction and obeys the laws of vector addition", "magnitude and direction but no unit"], "ans": 2, "sol": ["Step 1 — NCERT definition: vector quantity = magnitude + direction DONO + vector addition laws (triangle/parallelogram) follow karne chahiye.", "Step 2 — Option (A) 'magnitude only' — yeh scalar ki definition hai.", "Step 3 — Option (B) 'direction only' — adhoora.", "Step 4 — Option (D) 'magnitude and direction but no unit' — galat, vector bhi units rakhta hai (N, m/s, m/s²).", "Step 5 — Sirf (C) teeno conditions poori karta hai → Option (C)."], "note": "Vector = magnitude + direction + vector addition laws (NCERT definition).", "wrong": {"0": "Magnitude ke bina vector nahi banta — direction bhi chahiye.", "1": "Sirf direction se vector nahi banta.", "3": "Vector ki units hoti hain — 'no unit' bilkul galat hai."}}, {"n": 3, "type": "statement", "topic": "scv", "q": "Consider the following statements. Statement I: Distance travelled by a body is a scalar quantity. Statement II: Displacement of a body is a vector quantity.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Distance = poora path length — sirf magnitude (kitni raah), direction nahi → SCALAR. ✓ TRUE.", "Step 2 — Statement II: Displacement = initial se final ka shortest vector — magnitude + direction → VECTOR. ✓ TRUE.", "Step 3 — Dono statements true hain → option (A)."], "note": "Distance = scalar (path length); Displacement = vector (shortest, direction ke saath).", "wrong": {"1": "Statement II galat nahi — displacement vector hai.", "2": "Statement I galat nahi — distance scalar hai.", "3": "Dono TRUE hain, 'both false' bilkul galat hai."}}, {"n": 4, "type": "mcq", "topic": "scv", "q": "Which one of the following is NOT a vector quantity?", "fig": "", "figcap": "", "opts": ["Force", "Linear momentum", "Work", "Weight"], "ans": 2, "sol": ["Step 1 — Vector = magnitude + direction dono chahiye.", "Step 2 — Force — direction ke saath lagta hai → vector.", "Step 3 — Linear momentum p = mv — velocity ki direction leta hai → vector.", "Step 4 — Weight = mg — gravity ki direction (seedha neeche) ke saath → vector.", "Step 5 — Work = F·s = F s cosθ — DOT PRODUCT hai, sirf magnitude, direction nahi → SCALAR.", "Step 6 — Isliye Work NOT a vector quantity hai → option (C)."], "note": "Scalars: work, energy, power, temperature, current, pressure. Vectors: force, momentum, weight, velocity.", "wrong": {"0": "Force vector hai — direction ke saath lagta hai.", "1": "Momentum = mv, velocity ki direction leta hai → vector.", "3": "Weight = mg, hamesha neeche (direction ke saath) → vector."}}, {"n": 5, "type": "statement", "topic": "scv", "q": "Consider the following statements. Statement I: Two scalar quantities of the same kind are added by ordinary arithmetic. Statement II: Electric current has a direction but is still a scalar quantity.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Same kind ke scalars ko ordinary arithmetic (±) se joda jaata hai — kyunki direction nahi hoti. ✓ TRUE.", "Step 2 — Statement II: Electric current ki ek conventional direction hoti hai, PAR do currents ka addition vector law se nahi, simple algebra se hota hai (1 A + 2 A = 3 A, angle matter nahi karta) → current SCALAR hai. ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Current direction toh rakhta hai par vector nahi — kyunki triangle law follow nahi karta.", "wrong": {"1": "Current SCALAR hai — direction hona vector ka zaroori shart nahi, vector addition laws matter karte hain.", "2": "Statement I bilkul standard hai — true.", "3": "Dono true hain."}}, {"n": 6, "type": "mcq", "topic": "scv", "q": "Which of the following statements about a vector is NOT true?", "fig": "", "figcap": "", "opts": ["It has magnitude", "It has direction", "Two vectors are always added by simple algebraic addition of their magnitudes", "It can be represented graphically by an arrow"], "ans": 2, "sol": ["Step 1 — Vector ki pehchaan: (A) magnitude ✓, (B) direction ✓, (D) arrow se graphical representation ✓ — teeno TRUE.", "Step 2 — (C) kehta hai: 'Two vectors HAMESHA simple algebraic addition se jote hain' — YEH GALAT.", "Step 3 — Vectors mein direction matter karti hai — triangle/parallelogram law use hota hai. Simple algebraic addition tabhi jab dono same direction mein hon.", "Step 4 — Not true statement = (C).", "Step 5 — Isliye sahi answer: Option (C)."], "note": "Vector addition direction ke saath hota hai (triangle/parallelogram law) — simple arithmetic nahi.", "wrong": {"0": "Magnitude vector ki base hai — true.", "1": "Direction bhi zaroori hai — true.", "3": "Arrow se represent karna standard hai — true."}}, {"n": 7, "type": "match", "topic": "scv", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Speed<\/div><div class=\"colitem\">(b) Displacement<\/div><div class=\"colitem\">(c) Acceleration<\/div><div class=\"colitem\">(d) Time<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) metre<\/div><div class=\"colitem\">(ii) second<\/div><div class=\"colitem\">(iii) metre per second<\/div><div class=\"colitem\">(iv) metre per second squared<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-iv, d-ii", "a-iii, b-iv, c-i, d-ii", "a-ii, b-i, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Match ka rule: quantity → uska SI unit.", "Step 2 — (a) Speed = distance/time → metre per second → (iii)", "Step 3 — (b) Displacement = length ka vector → metre → (i)", "Step 4 — (c) Acceleration = velocity change per time → m/s² → (iv)", "Step 5 — (d) Time → second → (ii)", "Step 6 — Toh a-iii, b-i, c-iv, d-ii → option (A)."], "note": "SI units: speed m/s, displacement m, acceleration m/s², time s.", "wrong": {"1": "Speed ka unit metre nahi — m/s hai (distance per time).", "2": "Acceleration ka unit m/s² hai, metre nahi.", "3": "Time ka unit second hai, m/s² nahi."}}, {"n": 8, "type": "mcq", "topic": "scv", "q": "Two vectors can be added graphically by using", "fig": "", "figcap": "", "opts": ["the triangle law only", "the parallelogram law only", "both the triangle law and the parallelogram law", "ordinary rules of arithmetic only"], "ans": 2, "sol": ["Step 1 — Vector addition ke do graphical laws hain:", "Step 2 — Triangle law: pehla vector tail se head tak, doosra uske head se (head-to-tail). Tail se head = resultant.", "Step 3 — Parallelogram law: dono common point se, parallelogram banao — diagonal = resultant.", "Step 4 — Dono valid methods hain → option (C).", "Step 5 — (D) simple arithmetic — direction ghat jayegi, galat."], "note": "Triangle law: 2 vectors head-to-tail. Parallelogram law: common point + diagonal. Dono sahi.", "wrong": {"0": "Parallelogram law bhi kaam karta hai — 'only' galti.", "1": "Triangle law bhi kaam karta hai — 'only' galti.", "3": "Arithmetic se vector nahi banta — direction missing rehti hai."}}, {"n": 9, "type": "mcq", "topic": "add", "q": "Two vectors of magnitudes 3 units and 4 units act at right angles to each other. The magnitude of their resultant is", "fig": "", "figcap": "", "opts": ["5 units", "7 units", "1 unit", "12 units"], "ans": 0, "sol": ["Step 1 — Do vectors: 3 aur 4 units, RIGHT ANGLE (90°) pe.", "Step 2 — Perpendicular vectors ke liye Pythagoras: R = √<span class=\"rad\">(A² + B²)<\/span> = √<span class=\"rad\">(3² + 4²)<\/span>.", "Step 3 — 3² = 9, 4² = 16 → 9 + 16 = 25.", "Step 4 — √<span class=\"rad\">25<\/span> = 5 → R = 5 units.", "Step 5 — Yehi famous 3-4-5 right triangle hai → option (A)."], "note": "Perpendicular: R = √<span class=\"rad\">(A²+B²)<\/span>. 3-4-5 triangle hamesha yaad rakho.", "wrong": {"1": "3+4 = 7 tab hota jab dono SAME direction mein hoten.", "2": "4−3 = 1 tab hota jab OPPOSITE direction mein hoten.", "3": "12 = 3×4 — vectors ko multiply nahi, add karte hain."}}, {"n": 10, "type": "statement", "topic": "add", "q": "Consider the following statements. Statement I: The magnitude of the resultant of two vectors is maximum when the angle between them is 0°. Statement II: The magnitude of the resultant of two vectors is minimum when the angle between them is 180°.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Resultant ka formula: R = √<span class=\"rad\">(A² + B² + 2AB cosθ)<\/span>.", "Step 2 — θ = 0° (same direction): cos0° = 1 → R = A + B = MAXIMUM. Statement I ✓ TRUE.", "Step 3 — θ = 180° (opposite): cos180° = −1 → R = |A − B| = MINIMUM. Statement II ✓ TRUE.", "Step 4 — Dono true → option (A)."], "note": "θ=0° → R = A+B (max); θ=180° → R = |A−B| (min).", "wrong": {"1": "180° pe resultant minimum hota hai — Statement II sahi hai.", "2": "0° pe maximum — Statement I sahi hai.", "3": "Dono statements true hain."}}, {"n": 11, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["The magnitude of the resultant of two vectors is never greater than the sum of their magnitudes", "The magnitude of the difference of two vectors is never less than the difference of their magnitudes", "Vector addition is commutative, that is A + B = B + A", "The resultant of two vectors can be zero only when both the vectors are zero vectors"], "ans": 3, "sol": ["Step 1 — Har option ko check karo:", "Step 2 — (A) R ≤ A + B (triangle inequality) ✓ sahi statement.", "Step 3 — (B) |A−B| ≥ | |A|−|B| | — difference of magnitudes se kam nahi ho sakta ✓ sahi.", "Step 4 — (C) A + B = B + A — commutative law ✓ sahi.", "Step 5 — (D) 'Resultant zero ONLY jab dono zero hon' — GALAT! 3 N east + 3 N west = 0: dono non-zero par resultant null. Condition: equal magnitude, opposite direction.", "Step 6 — Incorrect statement = (D).", "Step 7 — Isliye sahi answer: Option (D)."], "note": "A + (−A) = 0 — do non-zero vectors ka resultant bhi zero ho sakta hai.", "wrong": {"0": "Yeh sahi statement hai — R kabhi A+B se zyada nahi hota.", "1": "Yeh bhi sahi hai — triangle inequality ka hissa.", "2": "Commutative law vector addition mein sahi hai."}}, {"n": 12, "type": "assertion", "topic": "scv", "q": "Assertion (A): The sum of two vectors can be a null vector even when neither of the two vectors is a null vector. Reason (R): Two vectors equal in magnitude but opposite in direction cancel each other.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: do non-zero vectors ka sum null ho sakta hai? HAAN — 3 N east + 3 N west = 0. ✓ TRUE.", "Step 2 — Reason: equal magnitude + opposite direction → cancel each other. ✓ TRUE.", "Step 3 — Kya R Assertion ka correct explanation hai? HAAN — null resultant isliye hi hota hai kyunki equal magnitude opposite direction cancel karte hain. R wahi condition batata hai jo Assertion ko true banata hai.", "Step 4 — Dono true + R correct explanation → option (A)."], "note": "Null resultant: same magnitude, opposite direction — A + (−A) = 0.", "wrong": {"1": "R sahi explanation hai — sirf 'true' kehna kaafi nahi.", "2": "R TRUE hai — false mat bolo.", "3": "Assertion TRUE hai — false mat bolo."}}, {"n": 13, "type": "diagram", "topic": "add", "q": "Study the described diagram. From a point O, an arrow P of length 3 cm is drawn pointing due east. From the tip of P, an arrow Q of length 4 cm is drawn pointing due north. Using the triangle law of vector addition, the magnitude of the resultant P + Q is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 13\"><defs><marker id=\"m13\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt13\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr13\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg13\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"70.0\" y1=\"140.0\" x2=\"130.0\" y2=\"140.0\" stroke=\"#264653\" stroke-width=\"2.6\" marker-end=\"url(#m13)\"/><text x=\"100.0\" y=\"158.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">P = 3 cm<\/text><line x1=\"130.0\" y1=\"140.0\" x2=\"130.0\" y2=\"60.0\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt13)\"/><text x=\"142.0\" y=\"105.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">Q = 4 cm<\/text><line x1=\"70.0\" y1=\"140.0\" x2=\"130.0\" y2=\"60.0\" stroke=\"#e76f51\" stroke-width=\"2\" stroke-dasharray=\"6 4\" marker-end=\"url(#mr13)\"/><text x=\"108.0\" y=\"96.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">R = ?<\/text><line x1=\"130.0\" y1=\"140.0\" x2=\"130.0\" y2=\"128.0\" stroke=\"#d9cfbe\" stroke-width=\"1\"/><line x1=\"130.0\" y1=\"128.0\" x2=\"118.0\" y2=\"128.0\" stroke=\"#d9cfbe\" stroke-width=\"1\"/><circle cx=\"70.0\" cy=\"140.0\" r=\"4\" fill=\"#264653\"/><text x=\"60.0\" y=\"158.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">O<\/text><\/svg>", "figcap": "Triangle law: P east, then Q north; R = OP to head of Q.", "opts": ["5 cm", "7 cm", "1 cm", "3.5 cm"], "ans": 0, "sol": ["Step 1 — Figure: P = 3 cm due east (O se), phir P ke head se Q = 4 cm due north.", "Step 2 — Triangle law: resultant = O se Q ke head tak ka seedha arrow.", "Step 3 — P (horizontal) aur Q (vertical) perpendicular hain → right triangle, legs 3 aur 4.", "Step 4 — R = √<span class=\"rad\">(3² + 4²)<\/span> = √<span class=\"rad\">(9 + 16)<\/span> = √<span class=\"rad\">25<\/span> = 5 cm.", "Step 5 — Resultant P + Q = 5 cm → option (A)."], "note": "3-4-5 triangle — perpendicular vectors ka resultant hypotenuse hota hai.", "wrong": {"1": "3 + 4 = 7 tab hota jab Q bhi east (P ki direction) mein hota.", "2": "4 − 3 = 1 tab hota jab Q west (opposite) ho.", "3": "3.5 = <span class=\"fr\"><span class=\"fn\">(3+4)<\/span><span class=\"fd\">2<\/span><\/span> — resultant average nahi, Pythagoras se nikalta hai."}}, {"n": 14, "type": "match", "topic": "scv", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A + B = B + A<\/div><div class=\"colitem\">(b) (A + B) + C = A + (B + C)<\/div><div class=\"colitem\">(c) A + 0 = A<\/div><div class=\"colitem\">(d) A + (−A) = 0<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) additive identity<\/div><div class=\"colitem\">(ii) additive inverse<\/div><div class=\"colitem\">(iii) commutative law<\/div><div class=\"colitem\">(iv) associative law<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-iv, c-i, d-ii", "a-iv, b-iii, c-i, d-ii", "a-iii, b-i, c-iv, d-ii", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Har identity ka naam yaad karo:", "Step 2 — (a) A + B = B + A → order badla, result same → COMMUTATIVE LAW → (iii)", "Step 3 — (b) (A + B) + C = A + (B + C) → grouping badli → ASSOCIATIVE LAW → (iv)", "Step 4 — (c) A + 0 = A → zero vector milane pe koi farak nahi → ADDITIVE IDENTITY → (i)", "Step 5 — (d) A + (−A) = 0 → apne negative se cancel → ADDITIVE INVERSE → (ii)", "Step 6 — Toh a-iii, b-iv, c-i, d-ii → option (A)."], "note": "Commutative: order. Associative: grouping. Identity: +0. Inverse: +(−A)=0.", "wrong": {"1": "A + B = B + A commutative hai, associative nahi.", "2": "A + (−A) = 0 inverse hai, identity nahi.", "3": "(A+B)+C = A+(B+C) associative hai, commutative nahi."}}, {"n": 15, "type": "mcq", "topic": "comp", "q": "A vector A makes an angle θ with the positive x-axis. Its x-component is", "fig": "", "figcap": "", "opts": ["A sin θ", "A cos θ", "A tan θ", "A / cos θ"], "ans": 1, "sol": ["Step 1 — Vector A, positive x-axis ke saath angle θ.", "Step 2 — Component = projection. X-component = adjacent side = A cosθ.", "Step 3 — Y-component = opposite side = A sinθ.", "Step 4 — Mnemonic: cos = 'co-adjacent' → x-axis (horizontal) ke saath cos aata hai.", "Step 5 — Ax = A cos θ → option (B)."], "note": "Ax = A cosθ, Ay = A sinθ. Cos hamesha horizontal (x) ke saath.", "wrong": {"0": "A sinθ y-component hai, x nahi.", "2": "A tanθ koi component nahi — tanθ = <span class=\"fr\"><span class=\"fn\">y<\/span><span class=\"fd\">x<\/span><\/span> ratio hai.", "3": "A/cosθ projection se bade padega — galat direction mein formula."}}, {"n": 16, "type": "statement", "topic": "ucm", "q": "Consider the following statements. Statement I: A rectangular component of a vector can be negative. Statement II: The magnitude of a rectangular component of a vector can never exceed the magnitude of the vector itself.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Component NEGATIVE ho sakta hai — e.g. vector 3rd quadrant mein ho to Ax < 0 aur Ay < 0 (direction negative axis ki taraf). ✓ TRUE.", "Step 2 — Statement II: |Ax| = A|cosθ| aur |cosθ| ≤ 1 hamesha → component ki magnitude KABHI vector se zyada nahi ho sakti. ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Component sign quadrant se; |component| ≤ |vector| (kyunki |cosθ|≤1).", "wrong": {"1": "|cosθ| ≤ 1 hamesha — Statement II sahi hai.", "2": "Negative component bilkul normal hai — Statement I sahi.", "3": "Dono true hain."}}, {"n": 17, "type": "mcq", "topic": "comp", "q": "Which of the following statements about resolution of a vector in a plane is incorrect?", "fig": "", "figcap": "", "opts": ["A vector in a plane can be resolved along any two mutually perpendicular directions", "For a vector A making angle θ with the x-axis, Ax = A cos θ and Ay = A sin θ", "For rectangular components, Ax² + Ay² = A²", "A vector lying in a plane can be resolved into three independent mutually perpendicular components in that plane"], "ans": 3, "sol": ["Step 1 — Resolution ke rules check karo:", "Step 2 — (A) Plane ka vector kisi bhi do perpendicular directions mein resolve ho sakta hai ✓.", "Step 3 — (B) Ax = A cosθ, Ay = A sinθ ✓ standard formula.", "Step 4 — (C) Ax² + Ay² = A² ✓ Pythagoras se.", "Step 5 — (D) 'Plane mein THREE independent mutually perpendicular components' — GALAT! Plane 2D hai — sirf 2 independent perpendicular directions hote hain. 3 components 3D space mein hote hain.", "Step 6 — Incorrect = (D).", "Step 7 — Isliye sahi answer: Option (D)."], "note": "2D plane → 2 independent components. 3D space → 3 (x, y, z).", "wrong": {"0": "True statement hai — axes choose kar sakte ho.", "1": "Standard component formula hai.", "2": "Pythagoras se sahi hai."}}, {"n": 18, "type": "assertion", "topic": "comp", "q": "Assertion (A): A vector lying in a plane can be resolved into two components along two mutually perpendicular directions. Reason (R): A vector possesses both magnitude and direction.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 1, "sol": ["Step 1 — Assertion: plane ka vector do mutually perpendicular directions mein resolve ho sakta hai — ✓ TRUE (e.g. x aur y axes).", "Step 2 — Reason: 'A vector magnitude aur direction dono rakhta hai' — yeh bhi TRUE statement hai (vector ki defining property).", "Step 3 — Par kya R Assertion ki EXPLANATION hai? NAHI — real reason yeh hai ki plane mein 2 independent perpendicular directions (2 degrees of freedom) hain, un dono ke components milke poora vector bana dete hain.", "Step 4 — Dono true, R not the correct explanation → option (B)."], "note": "2D mein 2 perpendicular components kaafi — plane ki 2 degrees of freedom ki wajah se.", "wrong": {"1": "R explanation hai — 'not the explanation' wala chuno.", "2": "R true hai (magnitude+direction vector ki defining property).", "3": "Assertion true hai (standard resolution)."}}, {"n": 19, "type": "diagram", "topic": "comp", "q": "Study the described figure. A force of 10 N pulls a block by means of a string that makes an angle of 60° above the horizontal ground. The arrow representing the force points upward and to the right. Take cos 60° = 0.5. The horizontal component of the force is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 19\"><defs><marker id=\"m19\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt19\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr19\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg19\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"40.0\" y1=\"150.0\" x2=\"300.0\" y2=\"150.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><rect x=\"180\" y=\"118\" width=\"46\" height=\"32\" rx=\"4\" fill=\"#e9e2d2\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"203.0\" y1=\"118.0\" x2=\"243.0\" y2=\"57.0\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt19)\"/><text x=\"256.0\" y=\"50.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">F = 10 N<\/text><line x1=\"243.0\" y1=\"57.0\" x2=\"243.0\" y2=\"150.0\" stroke=\"#d9cfbe\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/><line x1=\"243.0\" y1=\"150.0\" x2=\"203.0\" y2=\"150.0\" stroke=\"#d9cfbe\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/><line x1=\"203.0\" y1=\"150.0\" x2=\"243.0\" y2=\"150.0\" stroke=\"#e76f51\" stroke-width=\"2\" marker-end=\"url(#mr19)\"/><text x=\"228.0\" y=\"166.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">F cos60°<\/text><line x1=\"203.0\" y1=\"134.0\" x2=\"203.0\" y2=\"118.0\" stroke=\"#264653\" stroke-width=\"1.2\"/><path d=\"M 223,118 A 20,20 0 0 0 219,107\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"1.4\"/><text x=\"234.0\" y=\"100.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"bold\">60°<\/text><\/svg>", "figcap": "10 N at 60° above horizontal; horizontal component F cos60°.", "opts": ["5 N", "8.66 N", "10 N", "17.32 N"], "ans": 0, "sol": ["Step 1 — Force F = 10 N, string horizontal se 60° upar ki taraf.", "Step 2 — Horizontal component = adjacent side = F cosθ = 10 × cos60°.", "Step 3 — cos60° = 0.5 diya hai → 10 × 0.5 = 5 N.", "Step 4 — (Vertical component = F sin60° = 8.66 N — yahan pucha nahi).", "Step 5 — Horizontal component = 5 N → option (A)."], "note": "Horizontal component = F cosθ (ground ke parallel adjacent side).", "wrong": {"1": "8.66 N vertical component hai (F sin60°) — pucha horizontal ka tha.", "2": "10 N pura force hai — component asal force se chhota hota hai.", "3": "17.32 = F(cosθ+sinθ) — components ko aise joda nahi jaata."}}, {"n": 20, "type": "match", "topic": "comp", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A vector making 0° with the +x-axis<\/div><div class=\"colitem\">(b) A vector making 90° with the +x-axis<\/div><div class=\"colitem\">(c) A vector making 180° with the +x-axis<\/div><div class=\"colitem\">(d) A vector making 270° with the +x-axis<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) x-component zero, y-component negative<\/div><div class=\"colitem\">(ii) x-component positive, y-component zero<\/div><div class=\"colitem\">(iii) x-component negative, y-component zero<\/div><div class=\"colitem\">(iv) x-component zero, y-component positive<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-iv, c-iii, d-i", "a-iv, b-ii, c-iii, d-i", "a-ii, b-iii, c-iv, d-i", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Har direction ke components ka sign dekho:", "Step 2 — (a) 0° → +x axis par: x positive, y zero → (ii)", "Step 3 — (b) 90° → +y axis par: x zero, y positive → (iv)", "Step 4 — (c) 180° → −x axis par: x negative, y zero → (iii)", "Step 5 — (d) 270° → −y axis par: x zero, y negative → (i)", "Step 6 — Toh a-ii, b-iv, c-iii, d-i → option (A)."], "note": "0°→+x, 90°→+y, 180°→−x, 270°→−y. Direction circle bana lo.", "wrong": {"1": "90° pe x zero hoti hai, y positive — 'x positive' galat.", "2": "180° pe x NEGATIVE hoti hai (−x direction).", "3": "270° pe y NEGATIVE hoti hai (−y direction)."}}, {"n": 21, "type": "mcq", "topic": "scv", "q": "The scalar (dot) product of two mutually perpendicular vectors is", "fig": "", "figcap": "", "opts": ["zero", "maximum", "equal to the product of their magnitudes", "negative"], "ans": 0, "sol": ["Step 1 — Dot product ka formula: A·B = AB cosθ.", "Step 2 — Mutually perpendicular vectors ke liye θ = 90°.", "Step 3 — cos90° = 0.", "Step 4 — A·B = AB × 0 = ZERO.", "Step 5 — Geometric meaning: A ka B par projection zero hai (A bilkul B ke perpendicular) → overlap zero → option (A)."], "note": "θ=90° → A·B = 0. Perpendicular ka dot product hamesha zero.", "wrong": {"1": "Maximum θ=0° (parallel) pe hota — AB.", "2": "Product of magnitudes (AB) tab θ=0° pe.", "3": "Negative tab θ>90° pe (cos negative)."}}, {"n": 22, "type": "statement", "topic": "cross", "q": "Consider the following statements. Statement I: The dot product is commutative, that is A · B = B · A. Statement II: The cross product is commutative, that is A × B = B × A.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 1, "sol": ["Step 1 — Statement I: A·B = AB cosθ = BA cosθ = B·A — order change nahi hota ✓ commutative. TRUE.", "Step 2 — Statement II: Cross product commutative? NAHI! A×B = −(B×A) — order palatne se direction ulat (anticommutative). ✗ FALSE.", "Step 3 — I true, II false → option (B)."], "note": "Dot: commutative (A·B = B·A). Cross: anticommutative (A×B = −B×A).", "wrong": {"1": "II galat hai — cross product anticommutative hai, commutative nahi.", "2": "I true hai — dot product mein order matter nahi karta.", "3": "I TRUE hai — 'both false' galat."}}, {"n": 23, "type": "mcq", "topic": "scv", "q": "Which of the following is NOT correct for two vectors A and B with angle θ between them?", "fig": "", "figcap": "", "opts": ["A · B = AB cos θ", "The magnitude of A × B is AB sin θ", "A × B is a scalar quantity", "A · A = A²"], "ans": 2, "sol": ["Step 1 — Har formula check karo:", "Step 2 — (A) A·B = AB cosθ ✓ sahi dot formula.", "Step 3 — (B) |A×B| = AB sinθ ✓ sahi cross magnitude.", "Step 4 — (C) 'A×B is a scalar' — GALAT! Cross product VECTOR hai: magnitude AB sinθ, direction plane ke perpendicular (right-hand rule).", "Step 5 — (D) A·A = A² ✓ sahi (θ=0°, cos0°=1).", "Step 6 — Not correct = (C).", "Step 7 — Isliye sahi answer: Option (C)."], "note": "A·B = scalar (AB cosθ). A×B = vector (AB sinθ, ⊥ plane).", "wrong": {"0": "Standard dot formula — sahi.", "1": "Standard cross magnitude — sahi.", "3": "A·A = A² — sahi."}}, {"n": 24, "type": "assertion", "topic": "cross", "q": "Assertion (A): The cross product of two parallel vectors is a null vector. Reason (R): The angle between two parallel vectors is 90°.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 2, "sol": ["Step 1 — Assertion: parallel vectors ka cross product null? θ = 0° pe sin0° = 0 → A×B = AB×0 = 0 ✓ TRUE.", "Step 2 — Reason: 'Parallel vectors ka angle 90° hai' — GALAT! Parallel = 0° (ya anti-parallel = 180°). 90° PERPENDICULAR vectors ka angle hai. ✗ R FALSE.", "Step 3 — A true, R false → option (C)."], "note": "Parallel → θ=0°, sinθ=0 → cross zero. Perpendicular → θ=90°, sinθ=1 → cross max.", "wrong": {"0": "R galat hai (angle 90° nahi, 0°) — 'both true' chunne ka koi base nahi.", "1": "R TRUE nahi hai — parallel ka angle 0° hai, 90° nahi.", "3": "Assertion TRUE hai — parallel pe cross product zero hota hai."}}, {"n": 25, "type": "diagram", "topic": "dot", "q": "Study the described vector diagram. In the x-y plane, vector A is an arrow of length 5 units drawn along the positive x-axis from the origin, and vector B is an arrow of length 4 units drawn from the origin making an angle of 60° with A, above the x-axis. Take cos 60° = 0.5. The value of A · B is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 25\"><defs><marker id=\"m25\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt25\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr25\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg25\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"60.0\" y1=\"150.0\" x2=\"298.0\" y2=\"150.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"150.0\" x2=\"60.0\" y2=\"62.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"300.0\" y1=\"150.0\" x2=\"291.0\" y2=\"146.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"300.0\" y1=\"150.0\" x2=\"291.0\" y2=\"154.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"60.0\" x2=\"56.0\" y2=\"69.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"60.0\" x2=\"64.0\" y2=\"69.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><text x=\"304.0\" y=\"154.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">x<\/text><text x=\"54.0\" y=\"56.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">y<\/text><line x1=\"60.0\" y1=\"150.0\" x2=\"170.0\" y2=\"150.0\" stroke=\"#264653\" stroke-width=\"2.6\" marker-end=\"url(#m25)\"/><text x=\"118.0\" y=\"166.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">A = 5<\/text><line x1=\"60.0\" y1=\"150.0\" x2=\"104.0\" y2=\"73.8\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt25)\"/><text x=\"112.0\" y=\"66.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">B = 4<\/text><path d=\"M 96,150 A 36,36 0 0 0 78,118.7\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"1.4\"/><text x=\"112.0\" y=\"132.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"bold\">60°<\/text><circle cx=\"60.0\" cy=\"150.0\" r=\"4\" fill=\"#264653\"/><\/svg>", "figcap": "A along +x, B at 60° to A from same origin.", "opts": ["10 square units", "20 square units", "17.32 square units", "zero"], "ans": 0, "sol": ["Step 1 — Vector A = 5 units along +x, vector B = 4 units, A ke saath 60°.", "Step 2 — A·B = |A||B| cosθ = 5 × 4 × cos60°.", "Step 3 — cos60° = 0.5 (diya hai).", "Step 4 — = 20 × 0.5 = 10 square units.", "Step 5 — Geometric: B ka A par projection = 4 cos60° = 2, phir 5 × 2 = 10. Option (A)."], "note": "A·B = AB cosθ = |A| × (B ka A par projection).", "wrong": {"1": "20 = AB — yeh θ=0° (parallel) ka value hota.", "2": "17.32 = AB sin60° — YEH CROSS PRODUCT ka magnitude hai, dot ka nahi.", "3": "Zero θ=90° pe hota — yahan angle 60° hai."}}, {"n": 26, "type": "match", "topic": "vec3", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) î · î<\/div><div class=\"colitem\">(b) î · ĵ<\/div><div class=\"colitem\">(c) î × ĵ<\/div><div class=\"colitem\">(d) ĵ × î<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 1<\/div><div class=\"colitem\">(ii) 0<\/div><div class=\"colitem\">(iii) k̂<\/div><div class=\"colitem\">(iv) −k̂<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-i, b-ii, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-ii, b-i, c-iv, d-iii", "a-iv, b-ii, c-iii, d-i"], "ans": 0, "sol": ["Step 1 — Unit vectors ke products yaad karo (î, ĵ, k̂ mutually perpendicular, magnitude 1):", "Step 2 — (a) î·î = 1·1·cos0° = 1 → (i)", "Step 3 — (b) î·ĵ = 1·1·cos90° = 0 → (ii)", "Step 4 — (c) î×ĵ = k̂ (right-hand rule: x cross y = z) → (iii)", "Step 5 — (d) ĵ×î = −k̂ (order palta to sign palta) → (iv)", "Step 6 — Toh a-i, b-ii, c-iii, d-iv → option (A)."], "note": "î×ĵ=k̂, ĵ×k̂=î, k̂×î=ĵ (cyclic). Reverse → negative. Dot: same=1, different=0.", "wrong": {"1": "î·ĵ = 0 (perpendicular) — 1 nahi.", "2": "ĵ×î = −k̂, k̂ nahi — order matter karta hai.", "3": "î×ĵ = +k̂, −k̂ nahi."}}, {"n": 27, "type": "mcq", "topic": "proj", "q": "An object in flight after being projected is called a projectile, and (neglecting air resistance) the path of an oblique projectile is a", "fig": "", "figcap": "", "opts": ["straight line", "circle", "parabola", "hyperbola"], "ans": 2, "sol": ["Step 1 — Projectile = jo projection ke baad sirf gravity mein udta hai (air resistance neglect).", "Step 2 — Gravity sirf vertical direction mein act karta hai → horizontal velocity constant: x = u cosθ · t (t mein linear).", "Step 3 — Vertical: y = u sinθ · t − ½gt² (t mein quadratic).", "Step 4 — t ko eliminate karo → y = x tanθ − <span class=\"fr\"><span class=\"fn\">gx²<\/span><span class=\"fd\">(2u²cos²θ)<\/span><\/span> → x aur x² terms → PARABOLA.", "Step 5 — Path = parabola → option (C)."], "note": "Trajectory y = x tanθ − <span class=\"fr\"><span class=\"fn\">gx²<\/span><span class=\"fd\">(2u²cos²θ)<\/span><\/span> → parabola.", "wrong": {"0": "Straight line tab hoti jab g=0 ho — gravity hai to curve.", "1": "Circle banane ke liye force hamesha direction change karni chahiye — gravity constant vertical hai.", "3": "Hyperbola nahi — equation quadratic (x²) hai, parabola."}}, {"n": 28, "type": "mcq", "topic": "proj", "q": "For a projectile fired with speed u at an angle θ with the horizontal, the time of flight (landing on the same horizontal level) is", "fig": "", "figcap": "", "opts": ["u sin θ / g", "2u sin θ / g", "u² sin 2θ / g", "u² sin²θ / 2g"], "ans": 1, "sol": ["Step 1 — Vertical motion dekho: vy(0) = u sinθ upar, acceleration = g neeche.", "Step 2 — Highest point pe vy = 0 → time of ascent: t₁ = <span class=\"fr\"><span class=\"fn\">u sinθ<\/span><span class=\"fd\">g<\/span><\/span>.", "Step 3 — Same level par landing → ascent = descent (symmetric).", "Step 4 — Total time of flight T = 2 × <span class=\"fr\"><span class=\"fn\">u sinθ<\/span><span class=\"fd\">g<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span>.", "Step 5 — Option (B)."], "note": "T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> — sirf vertical component par depend karta hai.", "wrong": {"0": "<span class=\"fr\"><span class=\"fn\">u sinθ<\/span><span class=\"fd\">g<\/span><\/span> sirf ascent ka time hai — poora flight uska double.", "2": "<span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> horizontal RANGE ka formula hai, time ka nahi.", "3": "<span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> max HEIGHT ka formula hai."}}, {"n": 29, "type": "statement", "topic": "proj", "q": "Consider the following statements about a projectile (air resistance neglected). Statement I: At the highest point of its trajectory, the vertical component of its velocity is zero. Statement II: At the highest point of its trajectory, its acceleration is zero.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 1, "sol": ["Step 1 — Statement I: Highest point pe vertical component of velocity ZERO — ball upar jaane ki ability khatam, ab neeche girega. ✓ TRUE.", "Step 2 — Statement II: Highest point pe acceleration ZERO — GALAT! Gravity kabhi nahi chhutti: acceleration = g, vertically downward, flight ke HAR point pe (top pe bhi). ✗", "Step 3 — I true, II false → option (B)."], "note": "Projectile par a = g (neeche) hamesha — top pe vy = 0 par a = g rehta hai.", "wrong": {"1": "Top pe bhi a = g downward hai — Statement II galat.", "2": "Statement I sahi hai — top pe vy = 0.", "3": "Dono true nahi hain — II galat hai."}}, {"n": 30, "type": "mcq", "topic": "proj", "q": "Which of the following statements about projectile motion is incorrect (air resistance neglected)?", "fig": "", "figcap": "", "opts": ["The horizontal component of velocity remains constant throughout the flight", "The vertical component of velocity changes continuously due to gravity", "The acceleration of the projectile becomes zero at the highest point", "The trajectory of an oblique projectile is a parabola"], "ans": 2, "sol": ["Step 1 — (A) vx = u cosθ constant (horizontal force zero) ✓ correct.", "Step 2 — (B) vy = u sinθ − gt — gravity ki wajah se continuously change ✓ correct.", "Step 3 — (C) 'Highest point pe acceleration zero' — GALAT! a = g downward hamesha. ✗", "Step 4 — (D) Trajectory parabola ✓ correct.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Top pe: velocity = u cosθ (horizontal, minimum), acceleration = g (downward, constant).", "wrong": {"0": "vx constant — sahi statement.", "1": "vy gravity se change hota hai — sahi.", "3": "Parabola — sahi."}}, {"n": 31, "type": "mcq", "topic": "proj", "q": "Which of the following is NOT correct for a projectile launched with speed u at angle θ to the horizontal?", "fig": "", "figcap": "", "opts": ["Horizontal range R = u² sin 2θ / g", "Maximum height H = u² sin²θ / 2g", "Time of flight T = 2u sin θ / g", "Horizontal range is maximum when the angle of projection is 90°"], "ans": 3, "sol": ["Step 1 — (A) R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> ✓ sahi range formula.", "Step 2 — (B) H = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> ✓ sahi max height formula.", "Step 3 — (C) T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> ✓ sahi time of flight.", "Step 4 — (D) 'Range 90° pe maximum' — GALAT! θ=90° pe sin2θ = sin180° = 0 → R = 0 (seedha upar, seedha neeche — koi horizontal range nahi). Max range 45° pe hoti hai (sin90° = 1).", "Step 5 — Not correct = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Max range at θ=45°: sin2θ = 1 max. θ=90° pe R = 0.", "wrong": {"0": "Standard range formula — sahi.", "1": "Standard height formula — sahi.", "2": "Standard time formula — sahi."}}, {"n": 32, "type": "assertion", "topic": "proj", "q": "Assertion (A): For the same speed of projection, a projectile has the same horizontal range for angles of projection θ and (90° − θ). Reason (R): sin 2θ = sin (180° − 2θ).", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: same u, angles θ aur (90°−θ) → same horizontal range?", "Step 2 — R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span>. Angle (90°−θ) pe: sin2(90°−θ) = sin(180°−2θ) = sin2θ (identity: sin(180°−x) = sinx). Toh R same ✓ Assertion TRUE.", "Step 3 — Reason: sin2θ = sin(180°−2θ) — yahi identity R ko same banati hai ✓ TRUE.", "Step 4 — R exactly wahi reason hai jo Assertion ko prove karta hai → correct explanation.", "Step 5 — Option (A)."], "note": "Complementary angles (θ, 90°−θ) → same range: sin2θ = sin(180°−2θ).", "wrong": {"1": "R correct explanation hai — wahi trigonometric identity.", "2": "R TRUE hai (sin(180°−x) = sinx).", "3": "Assertion TRUE hai (e.g. 30° aur 60° same range dete hain)."}}, {"n": 33, "type": "diagram", "topic": "proj", "q": "Study the following data table described in words. A ball is projected horizontally with speed 10 m/s from the top of a tower, and the position of the ball is recorded (take g = 10 m/s²). At t = 0 s: horizontal distance 0 m, vertical fall 0 m. At t = 1 s: horizontal distance 10 m, vertical fall 5 m. At t = 2 s: horizontal distance 20 m, vertical fall 20 m. Following the same pattern, the vertical fall at t = 3 s will be", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>t (s)<\/th><th>horizontal x (m)<\/th><th>vertical fall y (m)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>10<\/td><td>5<\/td><\/tr><tr><td>2<\/td><td>20<\/td><td>20<\/td><\/tr><tr><td>3<\/td><td>30<\/td><td>?<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">x = 10t, y = ½gt² (g = 10 m/s²)<\/p><\/div>", "figcap": "Positions of horizontally projected ball (u = 10 m/s).", "opts": ["25 m", "30 m", "45 m", "50 m"], "ans": 2, "sol": ["Step 1 — Horizontal projection: vertical fall y = ½gt², g = 10 m/s².", "Step 2 — Pattern verify karo: t=1 → ½×10×1² = 5 m ✓ (table match); t=2 → ½×10×4 = 20 m ✓.", "Step 3 — t=3: y = ½ × 10 × 3² = 5 × 9 = 45 m.", "Step 4 — Vertical fall at t = 3 s = 45 m → option (C).", "Step 5 — (Horizontal distance 30 m hoga — 10 m/s × 3 s — par pucha vertical fall ka tha.)"], "note": "Free fall: y ∝ t² — pattern 1:4:9 (5, 20, 45, 80 m for g=10).", "wrong": {"1": "30 m horizontal distance hai (10×3) — vertical fall nahi.", "2": "50 m table ke pattern (½gt²) se match nahi karta.", "3": "25 m galat — ½×10×9 = 45 hai, 25 nahi."}}, {"n": 34, "type": "match", "topic": "proj", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Time of flight<\/div><div class=\"colitem\">(b) Maximum height<\/div><div class=\"colitem\">(c) Horizontal range<\/div><div class=\"colitem\">(d) Shape of trajectory<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 2u sin θ / g<\/div><div class=\"colitem\">(ii) u² sin²θ / 2g<\/div><div class=\"colitem\">(iii) u² sin 2θ / g<\/div><div class=\"colitem\">(iv) parabola<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-iv, b-ii, c-iii, d-i"], "ans": 0, "sol": ["Step 1 — Projectile ke standard formulas match karo:", "Step 2 — (a) Time of flight → T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> → (i)", "Step 3 — (b) Maximum height → H = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> → (ii)", "Step 4 — (c) Horizontal range → R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> → (iii)", "Step 5 — (d) Trajectory shape → parabola → (iv)", "Step 6 — Toh a-i, b-ii, c-iii, d-iv → option (A)."], "note": "T = 2usinθ/g; H = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span>; R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span>; path = parabola.", "wrong": {"1": "T ka formula 2usinθ/g hai — H wala (sin²) nahi.", "2": "H ka formula <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> hai.", "3": "R ka formula <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> hai."}}, {"n": 35, "type": "mcq", "topic": "rel", "q": "The velocity of a body A relative to a body B moving in the same plane is given by", "fig": "", "figcap": "", "opts": ["vA + vB", "vA − vB", "vB − vA", "vA × vB"], "ans": 1, "sol": ["Step 1 — 'A relative to B' = B ke frame mein A ki velocity.", "Step 2 — Formula: vA/B = vA − vB.", "Step 3 — Geometrically: vB ko ulat kar (−vB) banao, phir vA mein jodo.", "Step 4 — (C) vB − vA = B relative A hai (reverse). (D) cross product velocity ke liye nahi hota.", "Step 5 — Option (B)."], "note": "vAB = vA − vB. 'A relative to B' → A minus B (B ki velocity minus).", "wrong": {"0": "vA + vB galat — B ki velocity MINUS karni hai, plus nahi.", "2": "vB − vA yeh 'B relative to A' hai — bilkul opposite answer dega.", "3": "Cross product se velocity nahi banti — direction perpendicular ho jayegi."}}, {"n": 36, "type": "statement", "topic": "rel", "q": "Consider the following statements. Statement I: If two bodies move with exactly the same velocity, their relative velocity is zero. Statement II: The magnitude of relative velocity of two bodies can be greater than the speed of either body.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Exactly same velocity → vA − vB = 0 ✓ TRUE (e.g. do trains same speed, same direction — aapas mein rest).", "Step 2 — Statement II: Relative velocity ka magnitude speed se zyada ho sakta hai? HAAN — 10 m/s east aur 10 m/s west → relative = 20 m/s, dono se zyada ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Same velocity → relative zero. Opposite directions → relative = sum (zyada ho sakta hai).", "wrong": {"1": "Opposite directions mein relative 2v hota hai — Statement II sahi.", "2": "Same velocity pe relative zero — Statement I sahi.", "3": "Dono true hain."}}, {"n": 37, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["A passenger sitting in a moving train is at rest relative to a co-passenger", "The same passenger is in motion relative to a person standing on the platform", "Rest and motion are absolute and do not depend on the observer", "Relative velocity is a vector quantity"], "ans": 2, "sol": ["Step 1 — (A) Moving train mein passenger co-passenger ke relative rest ✓ correct (same velocity).", "Step 2 — (B) Wahi passenger platform ke person ke relative motion mein ✓ correct.", "Step 3 — (C) 'Rest aur motion ABSOLUTE hain, observer par depend nahi karte' — GALAT! Rest/motion RELATIVE hain — frame of reference par depend karte hain.", "Step 4 — (D) Relative velocity vector hai ✓ correct.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Rest and motion relative hain — observer/frame depend. Koi absolute rest nahi (Newtonian level).", "wrong": {"0": "Co-passenger ke relative rest — sahi.", "1": "Platform ke person ke relative motion — sahi.", "3": "Relative velocity vector hai — sahi."}}, {"n": 38, "type": "diagram", "topic": "rel", "q": "Study the described situation. Rain is falling vertically downward with a speed of 10 m/s and a man walks due east on horizontal ground with a speed of 10 m/s. There is no wind. In which direction must he hold his umbrella to protect himself?", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 38\"><defs><marker id=\"m38\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt38\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr38\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg38\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"230.0\" y1=\"40.0\" x2=\"230.0\" y2=\"130.0\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt38)\"/><text x=\"244.0\" y=\"86.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">rain 10 (↓)<\/text><line x1=\"230.0\" y1=\"40.0\" x2=\"150.0\" y2=\"40.0\" stroke=\"#264653\" stroke-width=\"2.6\" marker-end=\"url(#m38)\"/><text x=\"188.0\" y=\"30.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">man 10 (→)<\/text><line x1=\"230.0\" y1=\"40.0\" x2=\"150.0\" y2=\"120.0\" stroke=\"#e76f51\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\" marker-end=\"url(#mr38)\"/><text x=\"146.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">rain as seen: 45°<\/text><path d=\"M 214,56 A 22,22 0 0 1 214,82\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"1.4\"/><text x=\"204.0\" y=\"72.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"bold\">45°<\/text><line x1=\"120.0\" y1=\"168.0\" x2=\"156.0\" y2=\"148.0\" stroke=\"#264653\" stroke-width=\"3\"/><text x=\"138.0\" y=\"184.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">umbrella tilt<\/text><\/svg>", "figcap": "Rain 10 m/s down, man 10 m/s east: relative rain at 45° to vertical, leaning forward.", "opts": ["Vertically upward", "At 45° with the vertical, tilted towards the east", "At 45° with the vertical, tilted towards the west", "Horizontally towards the east"], "ans": 1, "sol": ["Step 1 — Rain: 10 m/s vertically neeche (ground frame). Man: 10 m/s due east.", "Step 2 — Rain relative to man = v(rain) − v(man) = (0, −10) − (10, 0) = (−10, −10).", "Step 3 — Matlab man ko lagta hai baarish upar-east se aa kar neeche-west ki taraf gir rahi hai (45° tilt).", "Step 4 — Umbrella wahi side cover karega jahan se baarish aa rahi hai → EAST (direction of motion) ki taraf tilt.", "Step 5 — Angle: tan⁻¹(<span class=\"fr\"><span class=\"fn\">10<\/span><span class=\"fd\">10<\/span><\/span>) = 45° with vertical → option (B)."], "note": "Vertical baarish + chalne wala man → baarish direction of motion ki taraf tilt karke dikhti hai. Umbrella bhi wahi taraf.", "wrong": {"0": "Vertically rakhoge to aage se aati baarish chehra hit karegi.", "2": "West = peeche ki taraf — baarish toh EAST se aa rahi hai man ko.", "3": "Sirf horizontally east — vertical component cover nahi hogi; 45° tilt chahiye."}}, {"n": 39, "type": "match", "topic": "rel", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Two cars moving in the same direction at 40 km/h and 60 km/h<\/div><div class=\"colitem\">(b) Two cars moving in opposite directions at 40 km/h and 60 km/h<\/div><div class=\"colitem\">(c) Two trains moving with equal velocities in the same direction<\/div><div class=\"colitem\">(d) A person walking at 4 km/h inside a train moving at 60 km/h, both in the same direction, as seen from the ground<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 0 km/h<\/div><div class=\"colitem\">(ii) 20 km/h<\/div><div class=\"colitem\">(iii) 100 km/h<\/div><div class=\"colitem\">(iv) 64 km/h<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-iii, c-i, d-iv", "a-iii, b-ii, c-i, d-iv", "a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Relative speed ka rule: same direction → difference; opposite → sum.", "Step 2 — (a) Same direction 40 aur 60 → 60 − 40 = 20 km/h → (ii)", "Step 3 — (b) Opposite direction 40 aur 60 → 40 + 60 = 100 km/h → (iii)", "Step 4 — (c) Equal velocities same direction → 0 km/h → (i)", "Step 5 — (d) Train 60 + andar ka 4 (same direction) → 60 + 4 = 64 km/h → (iv)", "Step 6 — Toh a-ii, b-iii, c-i, d-iv → option (A)."], "note": "Same direction: |v1−v2|. Opposite: v1+v2. Same velocity: 0.", "wrong": {"1": "Opposite direction mein SUM hota hai (100) — difference galat.", "2": "Equal velocities pe 0 hota hai, 100 nahi.", "3": "64 = 60 + 4 hai — 20 galat."}}, {"n": 40, "type": "mcq", "topic": "ucm", "q": "When an object follows a circular path at constant speed, the motion is called uniform circular motion. In such motion which of the following remains constant?", "fig": "", "figcap": "", "opts": ["Velocity", "Speed", "Acceleration vector", "Direction of motion"], "ans": 1, "sol": ["Step 1 — Uniform circular motion: speed constant, direction continuously change.", "Step 2 — Speed (magnitude) — CONSTANT ✓.", "Step 3 — Velocity (vector) — direction hamesha badalti hai → not constant.", "Step 4 — Acceleration vector — magnitude <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> constant hai par direction hamesha center ki taraf ghoomti hai → not constant.", "Step 5 — Direction of motion — har point par tangent ki taraf, badalta hai.", "Step 6 — Constant sirf SPEED → option (B)."], "note": "UCM: speed constant; velocity, acceleration, direction — sab change karte hain.", "wrong": {"0": "Velocity ki direction badalti hai — constant nahi.", "2": "Acceleration ka direction hamesha center ki taraf ghoomta rehta hai.", "3": "Circular path par direction of motion hamesha badalti hai."}}, {"n": 41, "type": "mcq", "topic": "ucm", "q": "For a particle in uniform circular motion with speed v on a circle of radius R, the magnitude and direction of its acceleration are", "fig": "", "figcap": "", "opts": ["<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, towards the centre", "<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, away from the centre", "vR, along the tangent", "zero, hence no direction"], "ans": 0, "sol": ["Step 1 — UCM: speed v constant, radius R.", "Step 2 — Centripetal acceleration ki magnitude: a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>.", "Step 3 — Direction: HAMESHA CENTER ki taraf (isliye 'centripetal' = center-seeking).", "Step 4 — Tangent ki taraf nahi — tangent direction speed change karta (yahan speed constant hai).", "Step 5 — Option (A)."], "note": "a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, always towards centre (centripetal).", "wrong": {"1": "Away from centre = centrifugal pseudo-force — real acceleration center ki taraf hoti hai.", "2": "vR koi standard quantity nahi; direction tangent nahi.", "3": "Zero acceleration = straight line (Newton 1st) — circle nahi banega."}}, {"n": 42, "type": "statement", "topic": "ucm", "q": "Consider the following statements. Statement I: In uniform circular motion the speed of the particle is constant. Statement II: In uniform circular motion the velocity of the particle is constant.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 1, "sol": ["Step 1 — Statement I: UCM mein SPEED (magnitude) constant — yehi definition hai ✓ TRUE.", "Step 2 — Statement II: UCM mein VELOCITY constant — GALAT! Velocity = speed + direction; direction har instant badalti hai (tangent ki taraf). ✗", "Step 3 — I true, II false → option (B)."], "note": "UCM: speed constant ✓, velocity NOT constant (direction change).", "wrong": {"1": "Direction change hoti hai — Statement II galat.", "2": "Speed constant hai — Statement I sahi.", "3": "I true, II false — 'both false' galat."}}, {"n": 43, "type": "mcq", "topic": "ucm", "q": "Which of the following is NOT correct for uniform circular motion?", "fig": "", "figcap": "", "opts": ["Angular speed ω = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">R<\/span><\/span>", "Time period T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span>", "Centripetal acceleration is provided by a real force such as tension, friction or gravity", "Work done by the centripetal force in one complete revolution is maximum"], "ans": 3, "sol": ["Step 1 — (A) ω = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">R<\/span><\/span> ✓ sahi (arc: s = Rθ → v = Rω).", "Step 2 — (B) T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> ✓ sahi (circumference/speed).", "Step 3 — (C) Centripetal force real force (tension, friction, gravity) se aati hai ✓ sahi.", "Step 4 — (D) 'One revolution mein centripetal force ka work MAXIMUM' — GALAT! Force hamesha velocity ke perpendicular → W = F·s·cos90° = ZERO (har instant pe).", "Step 5 — Not correct = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Centripetal force ⊥ velocity → work zero. Isliye speed/energy nahi badalti.", "wrong": {"0": "ω = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">R<\/span><\/span> sahi hai.", "1": "T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> sahi hai.", "2": "Real forces centripetal provide karte hain — sahi."}}, {"n": 44, "type": "assertion", "topic": "ucm", "q": "Assertion (A): In uniform circular motion the work done by the centripetal force on the body is zero. Reason (R): In uniform circular motion the speed of the body remains constant.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 1, "sol": ["Step 1 — Assertion: UCM mein centripetal force ka work zero — force hamesha velocity (displacement) ke perpendicular → W = F·s cos90° = 0 ✓ TRUE.", "Step 2 — Reason: 'UCM mein speed constant rehta hai' — ✓ TRUE (definition).", "Step 3 — Par R Assertion ki correct explanation NAHI hai. Work zero isliye hai kyunki F ⊥ dr; speed constant uska RESULT hai (work-energy theorem).", "Step 4 — Dono true, R not the correct explanation → option (B)."], "note": "Work zero: F⊥v. Speed constant: zero work ka result (work-energy theorem).", "wrong": {"1": "R explanation hai — 'not the explanation' wala chuno.", "2": "R true hai (UCM mein speed constant).", "3": "Assertion true hai (work = 0)."}}, {"n": 45, "type": "assertion", "topic": "ucm", "q": "Assertion (A): A particle performing uniform circular motion has zero acceleration. Reason (R): In uniform circular motion the velocity of the particle remains constant.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 3, "sol": ["Step 1 — Assertion: UCM mein acceleration ZERO — GALAT! Direction badalne ke liye a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> zaroori hai, non-zero.", "Step 2 — Reason: 'UCM mein velocity constant' — GALAT! Speed constant hai par direction badalti hai → velocity vector constant nahi.", "Step 3 — Dono false → option (D)."], "note": "UCM: velocity direction change karti hai → a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> towards centre, non-zero.", "wrong": {"0": "Assertion FALSE hai (a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>), R bhi false — 'both true' ka base nahi.", "1": "Assertion false hai — acceleration zero nahi hoti.", "2": "Assertion false hai — a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> non-zero hai; R bhi false hai."}}, {"n": 46, "type": "diagram", "topic": "ucm", "q": "Study the described graph. The speed–time graph of a particle is a horizontal straight line at v = 4 m/s from t = 0 s to t = 5 s. The particle is moving on a circular track of radius 2 m. The magnitude of its centripetal acceleration is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 46\"><defs><marker id=\"m46\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt46\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr46\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg46\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"50.0\" y1=\"140.0\" x2=\"178.0\" y2=\"140.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"50.0\" y1=\"140.0\" x2=\"50.0\" y2=\"42.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"180.0\" y1=\"140.0\" x2=\"171.0\" y2=\"136.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"180.0\" y1=\"140.0\" x2=\"171.0\" y2=\"144.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"50.0\" y1=\"40.0\" x2=\"46.0\" y2=\"49.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"50.0\" y1=\"40.0\" x2=\"54.0\" y2=\"49.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><text x=\"184.0\" y=\"144.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">t (s)<\/text><text x=\"44.0\" y=\"36.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">v (m/s)<\/text><line x1=\"50.0\" y1=\"40.0\" x2=\"180.0\" y2=\"40.0\" stroke=\"#2a9d8f\" stroke-width=\"2.6\"/><text x=\"116.0\" y=\"30.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">v = 4 m/s (constant)<\/text><text x=\"50.0\" y=\"158.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">0<\/text><text x=\"180.0\" y=\"158.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">5<\/text><path d=\"M300.0,95.0 L292.0,70.3 L271.0,55.1 L245.0,55.1 L224.0,70.3 L216.0,95.0 L224.0,119.7 L245.0,134.9 L271.0,134.9 L292.0,119.7 L300.0,95.0\" fill=\"none\" stroke=\"#d9cfbe\" stroke-width=\"1.6\"/><text x=\"258.0\" y=\"95.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a8291\" font-weight=\"normal\">O<\/text><line x1=\"258.0\" y1=\"95.0\" x2=\"292.0\" y2=\"95.0\" stroke=\"#d9cfbe\" stroke-width=\"1.4\"/><circle r=\"5\" fill=\"#2a9d8f\"><animateMotion dur=\"4s\" repeatCount=\"indefinite\" path=\"M 258.0,95.0 m 42.0,0 a 42.0,42.0 0 1,1 -84.0,0 a 42.0,42.0 0 1,1 84.0,0\"/><\/circle><text x=\"258.0\" y=\"158.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">circular track, R = 2 m<\/text><\/svg>", "figcap": "Speed–time graph is flat (v = 4 m/s); particle on a circle of radius 2 m.", "opts": ["2 m/s²", "4 m/s²", "8 m/s²", "16 m/s²"], "ans": 2, "sol": ["Step 1 — Graph: v = 4 m/s horizontal line — speed CONSTANT 4 m/s.", "Step 2 — Circular track: R = 2 m.", "Step 3 — Centripetal acceleration: a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">4²<\/span><span class=\"fd\">2<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">16<\/span><span class=\"fd\">2<\/span><\/span> = 8 m/s².", "Step 4 — Option (C)."], "note": "a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>. Constant-speed graph + radius → seedha formula.", "wrong": {"1": "4 m/s² galat calculation — <span class=\"fr\"><span class=\"fn\">16<\/span><span class=\"fd\">2<\/span><\/span> = 8.", "2": "16 = v² — R se divide nahi kiya.", "3": "2 = R hai — acceleration nahi; <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> lagao."}}, {"n": 47, "type": "mcq", "topic": "nucm", "q": "In non-uniform circular motion, the acceleration of the particle has", "fig": "", "figcap": "", "opts": ["only a radial (centripetal) component", "only a tangential component", "both a radial and a tangential component", "zero magnitude throughout"], "ans": 2, "sol": ["Step 1 — Non-uniform circular motion: speed BADALTI hai.", "Step 2 — Tangential acceleration at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> — speed (magnitude) change karti hai.", "Step 3 — Radial (centripetal) ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> — direction change karti hai (center ki taraf).", "Step 4 — Speed badhne ke liye at chahiye, circle banane ke liye ac — DONO present hain → option (C).", "Step 5 — Net a = √<span class=\"rad\">(at² + ac²)<\/span>, radius se thoda bahar ki taraf."], "note": "Non-UCM: a = ac (radial) + at (tangential) — mutually perpendicular.", "wrong": {"0": "Sirf radial = UCM (speed constant) — yahan speed badalti hai.", "1": "Sirf tangential = circle nahi banega (direction nahi badlegi).", "3": "Zero acceleration = straight line motion."}}, {"n": 48, "type": "statement", "topic": "nucm", "q": "Consider the following statements about non-uniform circular motion. Statement I: Tangential acceleration changes the magnitude of the velocity. Statement II: Centripetal acceleration changes the direction of the velocity.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Tangential acceleration SPEED (magnitude) change karti hai — at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> ✓ TRUE.", "Step 2 — Statement II: Centripetal acceleration DIRECTION change karti hai — <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, center ki taraf ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "at → speed change; ac → direction change. Dono mutually perpendicular.", "wrong": {"1": "ac direction change karti hai — Statement II sahi.", "2": "at speed change karti hai — Statement I sahi.", "3": "Dono true hain."}}, {"n": 49, "type": "statement", "topic": "nucm", "q": "Which of the following statements is/are correct for a particle in non-uniform circular motion? (1) Its angular speed changes with time. (2) Its total acceleration is the vector sum of the centripetal and tangential accelerations. (3) Its radial acceleration at any instant has magnitude <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>.", "fig": "", "figcap": "", "opts": ["1 and 2 only", "2 and 3 only", "1, 2 and 3", "1 and 3 only"], "ans": 2, "sol": ["Step 1 — (1) Non-uniform → speed badalti hai → angular speed ω = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">R<\/span><\/span> bhi badalta hai ✓.", "Step 2 — (2) Total acceleration = centripetal + tangential ka VECTOR SUM (mutually perpendicular) ✓.", "Step 3 — (3) Radial acceleration at any instant = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> (instantaneous speed v) ✓.", "Step 4 — Teeno correct → option (C)."], "note": "At any instant: ac = <span class=\"fr\"><span class=\"fn\">v²<\/span
