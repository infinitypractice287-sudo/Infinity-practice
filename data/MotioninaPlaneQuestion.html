=\"url(#mr106)\"/><text x=\"158.0\" y=\"166.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">3<\/text><line x1=\"225.0\" y1=\"150.0\" x2=\"225.0\" y2=\"90.0\" stroke=\"#e76f51\" stroke-width=\"2\" marker-end=\"url(#mr106)\"/><text x=\"238.0\" y=\"126.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">4<\/text><circle cx=\"90.0\" cy=\"150.0\" r=\"4\" fill=\"#264653\"/><text x=\"80.0\" y=\"166.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">t = 0<\/text><\/svg>", "figcap": "Position vector at t = 2 s: from origin to (3, 4) m.", "opts": ["1.25 m/s", "2.5 m/s", "5 m/s", "10 m/s"], "ans": 1, "sol": ["Step 1 — t = 0: (0,0). t = 2: (3, 4).", "Step 2 — Displacement = (3−0, 4−0) = (3, 4).", "Step 3 — |d| = √<span class=\"rad\">(9+16)<\/span> = 5 m.", "Step 4 — Average velocity = |d|/Δt = <span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">2<\/span><\/span> = 2.5 m/s.", "Step 5 — Option (B)."], "note": "Avg velocity = |displacement|/time. 3-4-5 se magnitude 5.", "wrong": {"0": "1.25 = <span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">4<\/span><\/span>? — time 2 s hai, 4 nahi.", "2": "5 = displacement — time se divide nahi kiya.", "3": "10 = 5×2? — multiplication galat, division hai."}}, {"n": 107, "type": "match", "topic": "scv", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Average velocity over a closed path<\/div><div class=\"colitem\">(b) Direction of instantaneous velocity<\/div><div class=\"colitem\">(c) Displacement<\/div><div class=\"colitem\">(d) Distance travelled<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) along the tangent to the path<\/div><div class=\"colitem\">(ii) zero<\/div><div class=\"colitem\">(iii) a vector<\/div><div class=\"colitem\">(iv) a scalar<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iii, c-i, d-iv", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "sol": ["Step 1 — Match karo:", "Step 2 — (a) Average velocity over closed path → displacement 0 → ZERO → (ii)", "Step 3 — (b) Instantaneous velocity ki direction → TANGENT ke along → (i)", "Step 4 — (c) Displacement → VECTOR (magnitude + direction) → (iii)", "Step 5 — (d) Distance → SCALAR (path length) → (iv)", "Step 6 — Toh a-ii, b-i, c-iii, d-iv → option (A)."], "note": "Closed path: avg velocity 0. Instantaneous v: tangent. Displacement: vector. Distance: scalar.", "wrong": {"1": "Tangent instantaneous velocity ka hai — closed path average ke liye zero.", "2": "Displacement vector hai — tangent nahi (woh velocity ka hai).", "3": "Distance scalar hai — zero nahi (path length)."}}, {"n": 108, "type": "mcq", "topic": "add", "q": "Two vectors of magnitudes 5 units and 3 units include an angle of 60° between them. Taking cos 60° = 0.5, the magnitude of their resultant is", "fig": "", "figcap": "", "opts": ["7 units", "8 units", "√<span class=\"rad\">34<\/span> units", "2 units"], "ans": 0, "sol": ["Step 1 — A = 5, B = 3, θ = 60°, cos60° = 0.5.", "Step 2 — R² = A² + B² + 2AB cosθ = 25 + 9 + 2×5×3×0.5.", "Step 3 — 2×5×3×0.5 = 15.", "Step 4 — R² = 25 + 9 + 15 = 49 → R = 7 units.", "Step 5 — Option (A)."], "note": "R = √<span class=\"rad\">(A²+B²+2AB cosθ)<\/span>. 60° pe cross term = AB.", "wrong": {"1": "8 = 5+3 — yeh 0° ka result hota.", "2": "√<span class=\"rad\">34<\/span> = √<span class=\"rad\">(25+9)<\/span> — yeh 90° ka result hota (cross term 0).", "3": "2 = 5−3 — yeh 180° ka result hota."}}, {"n": 109, "type": "statement", "topic": "dot", "q": "Consider the following statements. Statement I: If the magnitude of A + B is equal to the magnitude of A − B, then A and B are mutually perpendicular. Statement II: The square of the magnitude of A + B minus the square of the magnitude of A − B is equal to 4 A · B.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: |A+B| = |A−B| → square karo: A²+2A·B+B² = A²−2A·B+B² → A·B = 0 → perpendicular ✓ TRUE.", "Step 2 — Statement II: |A+B|² − |A−B|² = (A²+2A·B+B²) − (A²−2A·B+B²) = 4A·B ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "|A+B| = |A−B| ⟺ A⊥B. Difference of squares = 4A·B.", "wrong": {"1": "Identity 4A·B sahi hai — Statement II sahi.", "2": "Perpendicularity condition sahi — Statement I sahi.", "3": "Dono true hain."}}, {"n": 110, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["The resultant of two vectors of magnitudes 5 units and 3 units can never have magnitude 1 unit", "The magnitude of the resultant of two vectors can be smaller than the magnitude of either vector", "The angle between the resultant of two equal vectors and each of them is always 45°", "The minimum number of non-zero vectors whose vector sum can be zero is two"], "ans": 2, "sol": ["Step 1 — (A) 5 aur 3 ka resultant 1 ho sakta? Min = 5−3 = 2 — 1 possible NAHI ✓ sahi statement.", "Step 2 — (B) Resultant ek bhi vector se chhota ho sakta hai (e.g. 5 aur 4 opposite-ish) ✓ sahi.", "Step 3 — (C) 'Equal vectors ka resultant unke saath HAMESHA 45°' — GALAT! Resultant angle BISECT karta hai: angle = θ/2. 45° sirf θ=90° pe.", "Step 4 — (D) 2 non-zero vectors (equal, opposite) ka sum zero ho sakta hai ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Resultant of equal vectors: bisects the angle (θ/2), not always 45°.", "wrong": {"0": "Min resultant = |A−B| — sahi.", "1": "Resultant chhota ho sakta hai — sahi.", "3": "Two vectors ka sum zero ho sakta hai — sahi."}}, {"n": 111, "type": "assertion", "topic": "add", "q": "Assertion (A): The vector sum of three unit vectors taken along the three sides of an equilateral triangle in the same order is a null vector. Reason (R): By the polygon law, vectors forming a closed polygon and taken in order always have a zero resultant.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Equilateral triangle ke teen sides ke along three unit vectors, same order mein — sum null ✓ TRUE (polygon closed, head-to-tail).", "Step 2 — Reason: Polygon law — closed polygon ke vectors (in order) ka resultant ZERO ✓ TRUE.", "Step 3 — R exactly wahi law hai jo Assertion prove karta hai → correct explanation.", "Step 4 — Option (A)."], "note": "Closed polygon (head-to-tail) → resultant zero (polygon law).", "wrong": {"1": "R correct explanation hai — polygon law hi reason hai.", "2": "R true hai (polygon law).", "3": "Assertion true hai (equilateral triangle closed hai)."}}, {"n": 112, "type": "diagram", "topic": "add", "q": "Study the described vector diagram. From a point O, a vector P of length 4 units is drawn due east. From the head of P, a vector Q of length 3 units is drawn due north. From the head of Q, a vector R of length 4 units is drawn due west. The magnitude of the resultant P + Q + R is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 112\"><defs><marker id=\"m112\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt112\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker ts alag se add karo.", "wrong": {"1": "5 = 3-4-5? — yahan x cancel ho gaya, sirf 3 bacha.", "2": "7 = 4+3 — dono directions mein add galat.", "3": "11 = 4+3+4 — scalars jodne ka koi matlab nahi."}}, {"n": 113, "type": "match", "topic": "scv", "q": "Match the Columns for two vectors of magnitudes A = 5 units and B = 3 units (take cos 60° = 0.5). <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Magnitude of A + B when angle between them is 0°<\/div><div class=\"colitem\">(b) Magnitude of A + B when angle between them is 180°<\/div><div class=\"colitem\">(c) Magnitude of A + B when angle between them is 90°<\/div><div class=\"colitem\">(d) Magnitude of A − B when angle between them is 60°<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 8 units<\/div><div class=\"colitem\">(ii) 2 units<\/div><div class=\"colitem\">(iii) √<span class=\"rad\">34<\/span> units<\/div><div class=\"colitem\">(iv) √<span class=\"rad\">19<\/span> units<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-iii, b-ii, c-i, d-iv"], "ans": 0, "sol": ["Step 1 — A = 5, B = 3:", "Step 2 — (a) θ=0°: R = 5+3 = 8 → (i)", "Step 3 — (b) θ=180°: R = 5−3 = 2 → (ii)", "Step 4 — (c) θ=90°: R = √<span class=\"rad\">(25+9)<\/span> = √<span class=\"rad\">34<\/span> → (iii)", "Step 5 — (d) A−B at 60°: |A−B|² = 25+9−2×15×0.5 = 34−15 = 19 → √<span class=\"rad\">19<\/span> → (iv)", "Step 6 — Toh a-i, b-ii, c-iii, d-iv → option (A)."], "note": "0°: A+B; 180°: |A−B|; 90°: √<span class=\"rad\">(A²+B²)<\/span>; difference: minus sign wala formula.", "wrong": {"1": "A−B at 60° = √<span class=\"rad\">19<\/span> — 2 (180° case) nahi.", "2": "90° pe √<span class=\"rad\">34<\/span> — 2 nahi.", "3": "√<span class=\"rad\">34<\/span> = √<span class=\"rad\">(25+9)<\/span> — 8 (0°) nahi."}}, {"n": 114, "type": "statement", "topic": "scv", "q": "Consider the following statements. Statement I: The vector sum of three non-zero vectors can be zero. Statement II: The magnitude of the sum of two vectors is always greater than the magnitude of their difference.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 1, "sol": ["Step 1 — Statement I: Three non-zero vectors ka sum zero ho sakta hai? HAAN — e.g. 120° apart equal vectors ✓ TRUE.", "Step 2 — Statement II: '|A+B| HAMESHA |A−B| se zyada' — GALAT! θ obtuse (e.g. 120°) pe |A−B| > |A+B|. Example: A=B=1, θ=120°: |A+B| = 1, |A−B| = √<span class=\"rad\">3<\/span>.", "Step 3 — I true, II false → option (B)."], "note": "|A+B| vs |A−B|: acute angle pe sum zyada, obtuse pe difference zyada.", "wrong": {"1": "θ=120° ka example hai — Statement II galat.", "2": "Three vectors sum zero — Statement I sahi.", "3": "I true, II false."}}, {"n": 115, "type": "mcq", "topic": "comp", "q": "A vector of magnitude 20 units makes an angle of 30° with the positive y-axis. Taking sin 30° = 0.5 and cos 30° = 0.866, the magnitude of its x-component is", "fig": "", "figcap": "", "opts": ["10 units", "10√<span class=\"rad\">3<\/span> units", "20 units", "5 units"], "ans": 0, "sol": ["Step 1 — Vector magnitude 20, positive y-axis ke saath 30°.", "Step 2 — Matlab +x axis ke saath 60° (90° − 30°).", "Step 3 — X-component = 20 cos60° = 20 × 0.5 = 10.", "Step 4 — Ya directly: y-axis ke saath angle θy to x-component = A sinθy = 20 sin30° = 10.", "Step 5 — Option (A)."], "note": "y-axis ke saath angle diya ho: x-component = A sinθy, y-component = A cosθy.", "wrong": {"1": "10√<span class=\"rad\">3<\/span> = 20 sin60° — y-component hai, x nahi.", "2": "20 — y-axis ke along tab hota angle 0° pe.", "3": "5 = 20 sin15°? — angle ghataya galat."}}, {"n": 116, "type": "statement", "topic": "comp", "q": "Consider the following statements. Statement I: A vector in a plane can be resolved into two mutually perpendicular components in infinitely many ways, because the pair of perpendicular axes can be chosen in infinitely many ways. Statement II: Once a fixed pair of perpendicular axes is chosen, the resolution of a given vector is unique.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Plane ka vector infinitely many perpendicular axes pairs mein resolve ho sakta hai ✓ TRUE (axes rotate karo).", "Step 2 — Statement II: Fixed pair choose karo to resolution UNIQUE hai ✓ TRUE (Ax = A cosθ fixed).", "Step 3 — Dono true → option (A)."], "note": "Resolution axes-dependent (infinitely many ways); fixed axes pe unique.", "wrong": {"1": "Fixed axes pe unique — Statement II sahi.", "2": "Infinitely many axes pairs — Statement I sahi.", "3": "Dono true hain."}}, {"n": 117, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["For A = 3î + 4ĵ, the direction of A with the +x axis is tan⁻¹(<span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span>)", "If A = 5î + 12ĵ and B = 5î − 12ĵ, then both have magnitude 13 units", "The sum of the magnitudes of the two rectangular components of a vector can never exceed the magnitude of the vector", "For a vector in a plane making angles α and β with the x and y axes, cos²α + cos²β = 1"], "ans": 2, "sol": ["Step 1 — (A) tanθ = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span> for 3î+4ĵ ✓ sahi.", "Step 2 — (B) 5²+12² = 13² dono ke liye ✓ sahi.", "Step 3 — (C) 'Components of magnitudes ka sum HAMESHA vector se chhota' — GALAT! |Ax| + |Ay| ≥ A (equality sirf axis-along pe). Example: 3î+4ĵ: |Ax|+|Ay| = 3+4 = 7 > 5.", "Step 4 — (D) cos²α + cos²β = 1 (2D direction cosines) ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "|Ax| + |Ay| ≥ A — sum of magnitudes vector se BADA ho sakta hai.", "wrong": {"0": "Standard — sahi.", "1": "5-12-13 — sahi.", "3": "Direction cosine identity — sahi."}}, {"n": 118, "type": "assertion", "topic": "vec3", "q": "Assertion (A): For A = 2î + 3ĵ and B = 4î − ĵ, the unit vector along A + B is (6î + 2ĵ)/√<span class=\"rad\">40<\/span>. Reason (R): A + B = 6î + 2ĵ and a unit vector is obtained by dividing a vector by its own magnitude.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — A + B = (2+4)î + (3−1)ĵ = 6î + 2ĵ.", "Step 2 — |A+B| = √<span class=\"rad\">(36+4)<\/span> = √<span class=\"rad\">40<\/span>.", "Step 3 — Unit vector = (A+B)/|A+B| = (6î+2ĵ)/√<span class=\"rad\">40<\/span> ✓ Assertion TRUE.", "Step 4 — Reason: A + B = 6î+2ĵ ✓ aur unit vector = vector/its magnitude ✓ TRUE.", "Step 5 — R exactly calculation + definition deta hai → correct explanation.", "Step 6 — Option (A)."], "note": "Unit vector along S = S/|S|. Components add, magnitude divide.", "wrong": {"1": "R correct explanation hai — wahi steps hai.", "2": "R true hai (6î+2ĵ, unit = S/|S|).", "3": "Assertion true hai (verified)."}}, {"n": 119, "type": "diagram", "topic": "add", "q": "Study the following data table described in words. Four vectors have their x and y components listed as (x, y) in the same units: vector P = (2, 0), Q = (0, 2), R = (3, 0) and S = (0, 3). The magnitude of the vector P + Q + R + S is", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>vector<\/th><th>x component<\/th><th>y component<\/th><\/tr><\/thead><tbody><tr>  d-i", "a-iii, b-ii, c-iv, d-i"], "ans": 0, "sol": ["Step 1 — Har vector ka unit vector nikalo:", "Step 2 — (a) 6î−8ĵ: |A| = √<span class=\"rad\">(36+64)<\/span> = 10 → unit = (6î−8ĵ)/10 = 0.6î−0.8ĵ → (ii)", "Step 3 — (b) 5î+12ĵ: |A| = 13 → unit = (5î+12ĵ)/13 → (iii)", "Step 4 — (c) î+ĵ: |A| = √<span class=\"rad\">2<\/span> → unit = (î+ĵ)/√<span class=\"rad\">2<\/span> → (iv)", "Step 5 — (d) 3î+4ĵ: |A| = 5 → unit = 0.6î+0.8ĵ → (i)", "Step 6 — Toh a-ii, b-iii, c-iv, d-i → option (A)."], "note": "Unit vector = A/|A|. 3-4-5, 5-12-13, 1-1-√<span class=\"rad\">2<\/span> common.", "wrong": {"1": "0.6î−0.8ĵ 6î−8ĵ ka hai — 3î+4ĵ ka 0.6î+0.8ĵ hai.", "2": "(î+ĵ)/√<span class=\"rad\">2<\/span> î+ĵ ka hai — 3î+4ĵ nahi.", "3": "(5î+12ĵ)/13 5î+12ĵ ka hai — 6î−8ĵ nahi."}}, {"n": 121, "type": "mcq", "topic": "dot", "q": "The scalar product of two vectors is 6 units and the product of their magnitudes is 12 units. The angle between the two vectors is", "fig": "", "figcap": "", "opts": ["30°", "45°", "60°", "90°"], "ans": 2, "sol": ["Step 1 — A·B = AB cosθ.", "Step 2 — Diya: A·B = 6, AB = 12.", "Step 3 — cosθ = <span class=\"fr\"><span class=\"fn\">6<\/span><span class=\"fd\">12<\/span><\/span> = 0.5.", "Step 4 — θ = 60°.", "Step 5 — Option (C)."], "note": "cosθ = A·B/(AB). cos60° = 0.5.", "wrong": {"0": "30° cos = 0.866 — 0.5 nahi.", "1": "45° cos = 0.707 — 0.5 nahi.", "3": "90° cos = 0 — 0.5 nahi."}}, {"n": 122, "type": "statement", "topic": "dot", "q": "Consider the following statements. Statement I: If A · B equals the product of the magnitudes of A and B, the two vectors are parallel and point in the same direction. Statement II: If A · B equals minus the product of the magnitudes of A and B, the two vectors are antiparallel.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: A·B = AB (positive product) → cosθ = 1 → θ = 0° → parallel, same direction ✓ TRUE.", "Step 2 — Statement II: A·B = −AB → cosθ = −1 → θ = 180° → antiparallel ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "A·B = ±AB → parallel/antiparallel. A·B = 0 → perpendicular.", "wrong": {"1": "Antiparallel case sahi — Statement II sahi.", "2": "Parallel case sahi — Statement I sahi.", "3": "Dono true hain."}}, {"n": 123, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["A · (B + C) = A · B + A · C", "A × (B + C) = A × B + A × C", "If A · B = A · C and A is a non-zero vector, then B must be equal to C", "The cross product of a vector with itself is a null vector"], "ans": 2, "sol": ["Step 1 — (A) A·(B+C) = A·B + A·C ✓ dot distributive.", "Step 2 — (B) A×(B+C) = A×B + A×C ✓ cross distributive.", "Step 3 — (C) 'A·B = A·C → B = C' — GALAT! Iska matlab A·(B−C) = 0 → B−C, A ke perpendicular — B = C zaroori NAHI.", "Step 4 — (D) A×A = 0 ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "A·B = A·C → B−C ⊥ A — B = C nahi zaroori (dot product mein cancel nahi hota).", "wrong": {"0": "Distributive — sahi.", "1": "Distributive — sahi.", "3": "A×A = 0 — sahi."}}, {"n": 124, "type": "assertion", "topic": "dot", "q": "Assertion (A): The work done by a force F = 5î + 3ĵ N in producing a displacement s = 2î + 4ĵ m is 22 J. Reason (R): Work done is the scalar product of the force and the displacement, W = F · s.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — W = F·s = (5î+3ĵ)·(2î+4ĵ).", "Step 2 — = 5×2 + 3×4 = 10 + 12 = 22 J ✓ Assertion TRUE.", "Step 3 — Reason: Work = F·s (dot pro ontal se 90°−60° = 30°.", "Step 2 — Highest point pe vy = 0, sirf vx bachta hai.", "Step 3 — Speed at top = u cosθ_horizontal = 10 × cos30° = 10 × 0.866 = 8.66 m/s.", "Step 4 — Option (C).", "Step 5 — Dhyan: 'angle with vertical' diya hai — horizontal ke saath 30°."], "note": "Top pe speed = u cosθ (θ = angle with horizontal). Vertical ke saath angle diya ho to careful.", "wrong": {"0": "Zero tab hota θ=90° (vertical projection) pe — yahan 30° horizontal.", "1": "5 = 10 cos60° — angle galat (horizontal ke saath 30° hai, 60° nahi).", "3": "10 = initial speed — top pe vy gayab, speed kam hoti hai."}}, {"n": 128, "type": "mcq", "topic": "proj", "q": "The time of flight of a projectile landing at the same level is 4 s. Taking g = 10 m/s², the maximum height attained by it is", "fig": "", "figcap": "", "opts": ["10 m", "20 m", "40 m", "80 m"], "ans": 1, "sol": ["Step 1 — T = 4 s (same level landing).", "Step 2 — Time to top t₁ = <span class=\"fr\"><span class=\"fn\">T<\/span><span class=\"fd\">2<\/span><\/span> = 2 s.", "Step 3 — H = ½ g t₁² = ½ × 10 × 2² = 5 × 4 = 20 m.", "Step 4 — Option (B)."], "note": "H = ½g(<span class=\"fr\"><span class=\"fn\">T<\/span><span class=\"fd\">2<\/span><\/span>)² = <span class=\"fr\"><span class=\"fn\">gT²<\/span><span class=\"fd\">8<\/span><\/span>. T=4, g=10 → 20 m.", "wrong": {"0": "10 m = ½g(1)² — t₁ = 2 s hai, 1 s nahi.", "2": "40 = ½g(2)²… wait ½×10×4 = 20 — 40 galat (g=20 maana galat).", "3": "80 bilkul galat."}}, {"n": 129, "type": "statement", "topic": "proj", "q": "Consider the following statements for projectiles fired with the same speed (air resistance neglected). Statement I: The maximum heights of projectiles projected at 30° and 60° with the horizontal are in the ratio 1 : 3. Statement II: For fixed u and g, the maximum height is proportional to sin²θ.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II i bout the vertical line passing through the highest point"], "ans": 2, "sol": ["Step 1 — (A) Top pe velocity purely horizontal ✓ correct (vy = 0).", "Step 2 — (B) vy har second g change hota hai ✓ correct.", "Step 3 — (C) 'Horizontal acceleration = g cosθ' — GALAT! Horizontal force ZERO hai → horizontal acceleration = 0.", "Step 4 — (D) Trajectory vertical line (top ke through) ke about symmetric ✓ correct.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Projectile: ax = 0, ay = −g. Koi 'g cosθ' nahi.", "wrong": {"0": "Top pe vy = 0 — sahi.", "1": "g per second change — sahi.", "3": "Symmetry — sahi."}}, {"n": 134, "type": "assertion", "topic": "proj", "q": "Assertion (A): A bomb released from an aeroplane flying horizontally at 100 m/s at a height of 500 m lands 1000 m ahead of the point of release (take g = 10 m/s², neglect air resistance). Reason (R): The time of fall is √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span> = 10 s and the horizontal velocity of the bomb remains 100 m/s throughout the fall.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Aeroplane 100 m/s horizontal, h = 500 m.", "Step 2 — Fall time: h = ½gt² → t = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span> = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">1000<\/span><span class=\"fd\">10<\/span><\/span>)<\/span> = √<span class=\"rad\">100<\/span> = 10 s ✓.", "Step 3 — Bomb ki horizontal velocity = 100 m/s (plane se inherit, air resistance nahi).", "Step 4 — Range = 100 × 10 = 1000 m ✓ Assertion TRUE.", "Step 5 — Reason: t = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span> = 10 s ✓ aur horizontal velocity constant ✓ TRUE.", "Step 6 — R dono facts deta hai jo Assertion prove karte hain → correct explanation → option (A)."], "note": "Bomb drop: t = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span>, range = v<sub>plane<\/sub> × t.", "wrong": {"1": "R correct explanation hai — dono parts verified.", "2": "R true hai (both facts).", "3": "Assertion true hai (1000 m)."}}, {"n": 135, "type": "match", "topic": "proj", "q": "Match the Columns for an oblique projectile (air resistance neglected). <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Shape of the trajectory<\/div><div class=\"colitem\">(b) Acceleration throughout the flight<\/div><div class=\"colitem\">(c) Horizontal velocity throughout the flight<\/div><div class=\"colitem\">(d) Vertical velocity at the highest point<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) zero<\/div><div class=\"colitem\">(ii) constant, equal to u cos θ<\/div><div class=\"colitem\">(iii) constant, equal to g downward<\/div><div class=\"colitem\">(iv) parabola<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iv, b-iii, c-ii, d-i", "a-iii, b-iv, c-ii, d-i", "a-iv, b-ii, c-iii, d-i", "a-i, b-iii, c-ii, d-iv"], "ans": 0, "sol": ["Step 1 — Projectile properties match karo:", "Step 2 — (a) Trajectory shape → parabola → (iv)", "Step 3 — (b) Acceleration throughout → g downward, constant → (iii)", "Step 4 — (c) Horizontal velocity → u cosθ, constant → (ii)", "Step 5 — (d) Vertical velocity at top → zero → (i)", "Step 6 — Toh a-iv, b-iii, c-ii, d-i → option (A)."], "note": "Parabola; a = g↓; vx = u cosθ const; vy(top) = 0.", "wrong": {"1": "Acceleration g downward hai — parabola nahi (shape alag property).", "2": "u cosθ constant horizontal velocity hai — g downward nahi.", "3": "vy(top) = zero — u cosθ nahi."}}, {"n": 136, "type": "mcq", "topic": "rel", "q": "A man walks due east at 5 m/s and observes that rain appears to fall at 45° with the vertical. If there is no wind and the rain is actually falling vertically, the speed of the rain is", "fig": "", "figcap": "", "opts": ["2.5 m/s", "5 m/s", "5√<span class=\"rad\">2<\/span> m/s", "10 m/s"], "ans": 1, "sol": ["Step 1 — Man 5 m/s east; rain actually vertical speed v.", "Step 2 — Rain relative to man = (−5, −v).", "Step 3 — Angle with vertical: tan45° = <span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">v<\/span><\/span> = 1.", "Step 4 — v = 5 m/s.", "Step 5 — Option (B)."], "note": "tan(angle) = <span class=\"fr\"><span class=\"fn\">v<sub>man<\/sub><\/span><span class=\"fd\">v<sub>rain<\/sub><\/span><\/span>. 45° → speeds equal.", "wrong": {"0": "2.5 = <span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">2<\/span><\/span>? — tan45 = 1 hai, 0.5 nahi.", "2": "5√<span class=\"rad\">2<\/span> galat — ratio 1:1 hai.", "3": "10 = 5×2? — tan45° = 1 hai."}}, {"n": 137, "type": "statement", "topic": "rel", "q": "Consider the following statements. Statement I: The velocity of A relative to B is the time rate of change of the position of A relative to B. Statement II: If vA = 3î + 4ĵ and vB = 5î + 12ĵ (in m/s), the magnitude of the velocity of A relative to B is √<span class=\"rad\">68<\/span> m/s.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Relative velocity = rate of change of relative position ✓ TRUE (definition).", "Step 2 — Statement II: vA−vB = (3−5, 4−12) = (−2, −8). Magnitude = √<span class=\"rad\">(4+64)<\/span> = √<span class=\"rad\">68<\/span> ✓ TRUE.", "Step 3 — Dono true → option (A) 9\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt139\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr139\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg139\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"30.0\" y1=\"55.0\" x2=\"310.0\" y2=\"55.0\" stroke=\"#d9cfbe\" stroke-width=\"2\"/><line x1=\"30.0\" y1=\"150.0\" x2=\"310.0\" y2=\"150.0\" stroke=\"#d9cfbe\" stroke-width=\"2\"/><line x1=\"60.0\" y1=\"102.0\" x2=\"120.0\" y2=\"102.0\" stroke=\"#7a8291\" stroke-width=\"2\" marker-end=\"url(#m139)\"/><text x=\"90.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">current 3 m/s →<\/text><line x1=\"170.0\" y1=\"150.0\" x2=\"205.0\" y2=\"150.0\" stroke=\"#7a8291\" stroke-width=\"2.2\" marker-end=\"url(#m139)\"/><text x=\"214.0\" y=\"144.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#7a8291\" font-weight=\"normal\">3<\/text><line x1=\"170.0\" y1=\"150.0\" x2=\"95.0\" y2=\"50.0\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt139)\"/><text x=\"76.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">5 (aim 37° W of N)<\/text><line x1=\"170.0\" y1=\"150.0\" x2=\"170.0\" y2=\"50.0\" stroke=\"#e76f51\" stroke-width=\"2.4\" stroke-dasharray=\"6 4\" marker-end=\"url(#mr139)\"/><text x=\"182.0\" y=\"105.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">4 m/s N<\/text><path d=\"M 170,124 A 26,26 0 0 1 154.4,131.2\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"1.4\"/><text x=\"148.0\" y=\"146.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"bold\">37°<\/text><circle cx=\"170.0\" cy=\"150.0\" r=\"4\" fill=\"#264653\"/><text x=\"250.0\" y=\"105.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">100 m wide<\/text><\/svg>", "figcap": "Boat 5 m/s aims 37° west of north: resultant 4 m/s due north, t = 100/4 = 25 s.", "opts": ["20 s", "25 s", "33.3 s", "100 s"], "ans": 1, "sol": ["Step 1 — Zero drift: boat ko upstream aim karo.", "Step 2 — Boat speed 5 m/s, current 3 m/s.", "Step 3 — Upstream component = 3 (cancel), north component = √<span class=\"rad\">(5²−3²)<\/span> = √<span class=\"rad\">(25−9)<\/span> = √<span class=\"rad\">16<\/span> = 4 m/s.", "Step 4 — Time = width/north component = <span class=\"fr\"><span class=\"fn\">100<\/span><span class=\"fd\">4<\/span><\/span> = 25 s.", "Step 5 — Option (B)."], "note": "Zero drift: v<sub>eff<\/sub> = √<span class=\"rad\">(v²−u²)<\/span>, t = <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">√<span class=\"rad\">(v²−u²)<\/span><\/span><\/span>.", "wrong": {"0": "20 s = <span class=\"fr\"><span class=\"fn\">100<\/span><span class=\"fd\">5<\/span><\/span> — current ignore kiya (drift ho jayegi).", "2": "33.3 = <span class=\"fr\"><span class=\"fn\">100<\/span><span class=\"fd\">3<\/span><\/span> — current speed se divide, galat.", "3": "100 s = <span class=\"fr\"><span class=\"fn\">100<\/span><span class=\"fd\">1<\/span><\/span>? — bilkul galat."}}, {"n": 140, "type": "match", "topic": "boat", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Minimum time to cross a flowing river<\/div><div class=\"colitem\">(b) Zero drift, that is reaching the point directly opposite<\/div><div class=\"colitem\">(c) Rain appearing to fall vertically to a moving observer<\/div><div class=\"colitem\">(d) Two cars moving with exactly equal velocities<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) boat aimed perpendicular to the current<\/div><div class=\"colitem\">(ii) boat aimed upstream at an angle<\/div><div class=\"colitem\">(iii) rain and observer have equal horizontal components of velocity<\/div><div class=\"colitem\">(iv) relative velocity is zero<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-iv, b-ii, c-i, d-iii"], "ans": 0, "sol": ["Step 1 — Match karo:", "Step 2 — (a) Min time cross → boat current ke perpendicular aim → (i)", "Step 3 — (b) Zero drift → boat upstream aim → (ii)", "Step 4 — (c) Rain vertical to moving observer → rain aur observer ka horizontal component equal → (iii)", "Step 5 — (d) Equal velocities → relative velocity zero → (iv)", "Step 6 — Toh a-i, b-ii, c-iii, d-iv → option (A)."], "note": "Min time: ⊥ aim. Zero drift: upstream. Rain vertical: horizontal components equal. Same v: relative 0.", "wrong": {"1": "Zero drift upstream hai — ⊥ aim min time deta hai (drift ke saath).", "2": "⊥ aim min time deta hai — upstream zero drift deta hai.", "3": "Equal velocities → 0 relative — horizontal components ka alag case hai."}}, {"n": 141, "type": "mcq", "topic": "ucm", "q": "A particle in uniform circular motion completes 3 revolutions in 6 s. Its angular speed is", "fig": "", "figcap": "", "opts": ["<span class=\"fr\"><span class=\"fn\">π<\/span><span class=\"fd\">2<\/span><\/span> rad/s", "π rad/s", "2π rad/s", "3π rad/s"], "ans": 1, "sol": ["Step 1 — 3 revolutions in 6 s → frequency ν = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">6<\/span><\/span> = 0.5 rev/s.", "Step 2 — ω = 2πν = 2π × 0.5 = π rad/s.", "Step 3 — Option (B)."], "note": "ω = 2πν = 2π(<span class=\"fr\"><span class=\"fn\">n<\/span><span class=\"fd\">t<\/span><\/span>).", "wrong": {"0": "<span class=\"fr\"><span class=\"fn\">π<\/span><span class=\"fd\">2<\/span><\/span> = 2π×0.25 — frequency 0.5 hai.", "2": "2π = 1 rev/s — yahan 0.5 rev/s.", "3": "3π — rev count se directly, 2π factor nahi."}}, {"n": 142, "type": "statement", "topic": "ucm", "q": "Consider the following statements about uniform circular motion. Statement I: The angular velocity vector is directed along the axis of rotation and remains constant. Statement II: The time period is T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span>, so all particles with the same angular speed have the same time period irrespective of their radii.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Angular velocity vector axis ke along, constant (UCM) ✓ TRUE.", "Step 2 — Statement II: T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span> — same ω → same T, radius se independent ✓ TRUE (different radii wale bhi same T agar same ω).", "Step 3 — Dono true → option (A)."], "note": "T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span> — same angular speed = same period (radius independent).", "wrong": {"1": "T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span> radius-independent — Statement II sahi.", "2": "ω vector constant UCM mein — Statement I sahi.", "3": "Dono true hain."}}, {"n": 143, "type": "mcq", "topic": "ucm", "q": "Which of the following is incorrect for a particle in uniform circular motion?", "fig": "", "figcap": "", "opts": ["The centripetal acceleration is ω²R directed towards the centre", "The linear speed is related to angular speed as v = ωR", "The centripetal force acting on the particle is constant in both magnitude and direction", "The angular displacement in time t is θ = ωt"], "ans": 2, "sol": ["Step 1 — (A) a = ω²R towards centre ✓ sahi.", "Step 2 — (B) v = ωR ✓ sahi.", "Step 3 — (C) 'Centripetal force constant in magnitude AND direction' — GALAT! Magnitude constant (ω²R) par direction hamesha change (center ki taraf).", "Step 4 — (D) θ = ωt ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Centripetal FORCE: magnitude constant, direction changes (vector constant nahi).", "wrong": {"0": "ω²R — sahi.", "1": "v = ωR — sahi.", "3": "θ = ωt — sahi."}}, {"n": 144, "type": "mcq", "topic": "ucm", "q": "Which of the following is correct for a particle in uniform circular motion?", "fig": "", "figcap": "", "opts": ["Its velocity and acceleration are both constant", "Its angular velocity changes direction continuously", "The net force acting on it is always directed towards the centre", "Its displacement after one complete revolution is 2πR"], "ans": 2, "sol": ["Step 1 — (A) Velocity AND acceleration dono constant — GALAT (dono direction change).", "Step 2 — (B) Angular velocity direction continuously change — GALAT (UCM mein constant, axis fixed).", "Step 3 — (C) Net force HAMESHA towards centre ✓ CORRECT (centripetal force).", "Step 4 — (D) Displacement after one revolution = 2πR — GALAT (displacement = 0, 2πR distance hai).", "Step 5 — Correct = (C)."], "note": "UCM: net force = centripetal, always towards centre.", "wrong": {"0": "Dono direction change karte hain — 'constant' galat.", "1": "Angular velocity UCM mein constant hai.", "3": "One revolution → displacement 0 (distance 2πR)."}}, {"n": 145, "type": "statement", "topic": "ucm", "q": "Consider the following statements about a particle in uniform circular motion of radius R and angular speed ω. Statement I: The position vector r = R cos ωt î + R sin ωt ĵ has a constant magnitude R at all times. Statement II: The velocity of this particle has a constant magnitude Rω.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: r = R cosωt î + R sinωt ĵ → |r| = R√<span class=\"rad\">(cos²+sin²)<\/span> = R constant ✓ TRUE.", "Step 2 — Statement II: v = <span class=\"fr\"><span class=\"fn\">dr<\/span><span class=\"fd\">dt<\/span><\/span> = Rω(−sinωt, cosωt) → |v| = Rω constant ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Parametric circle: |r| = R, |v| = Rω constant.", "wrong": {"1": "|v| = Rω constant — Statement II sahi.", "2": "|r| = R constant — Statement I sahi.", "3": "Dono true hain."}}, {"n": 146, "type": "assertion", "topic": "ucm", "q": "Assertion (A): Two particles in uniform circular motion with the same time period T but radii in the ratio 1 : 2 have centripetal accelerations in the ratio 1 : 2. Reason (R): Centripetal acceleration can be written as a = <span class=\"fr\"><span class=\"fn\">4π²R<\/span><span class=\"fd\">T²<\/span><\/span>.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — a = <span class=\"fr\"><span class=\"fn\">4π²R<\/span><span class=\"fd\">T²<\/span><\/span> (centripetal acceleration).", "Step 2 — Same T, radii 1:2 → a ∝ R → ratio 1:2 ✓ Assertion TRUE.", "Step 3 — Reason: a = <span class=\"fr\"><span class=\"fn\">4π²R<\/span><span class=\"fd\">T²<\/span><\/span> ✓ TRUE — yahi formula ratio deta hai.", "Step 4 — R correct explanation hai.", "Step 5 — Option (A)."], "note": "Same T: a ∝ R. a = <span class=\"fr\"><span class=\"fn\">4π²R<\/span><span class=\"fd\">T²<\/span><\/span>.", "wrong": {"1": "R correct explanation hai (formula se ratio milta hai).", "2": "R true hai (standard formula).", "3": "Assertion true hai (1:2)."}}, {"n": 147, "type": "mcq", "topic": "nucm", "q": "A particle moving on a circle has tangential acceleration 3 m/s² and centripetal acceleration 4 m/s² at a certain instant. The magnitude of its net acceleration at that instant is", "fig": "", "figcap": "", "opts": ["1 m/s²", "3.5 m/s²", "5 m/s²", "7 m/s²"], "ans": 2, "sol": ["Step 1 — at = 3, ac = 4, mutually perpendicular.", "Step 2 — Net a = √<span class=\"rad\">(at² + ac²)<\/span> = √<span class=\"rad\">(9+16)<\/span> = √<span class=\"rad\">25<\/span> = 5 m/s².", "Step 3 — Option (C) — 3-4-5 phir se!"], "note": "Perpendicular components: net = Pythagoras.", "wrong": {"0": "1 = 4−3 — magnitudes subtract nahi hote (perpendicular hain).", "1": "3.5 = <span class=\"fr\"><span class=\"fn\">(3+4)<\/span><span class=\"fd\">2<\/span><\/span> — average nahi, vector sum.", "3": "7 = 3+4 — perpendicular pe Pythagoras, simple sum nahi."}}, {"n": 148, "type": "statement", "topic": "nucm", "q": "Consider the following statements about non-uniform circular motion. Statement I: Angular acceleration α is equal to the time rate of change of angular velocity. Statement II: If the angular position of a particle on a circle is θ = 2t² radian, its motion is non-uniform circular motion with constant angular acceleration 4 rad/s².", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: α = <span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span> — angular acceleration definition ✓ TRUE.", "Step 2 — Statement II: θ = 2t² → ω = <span class=\"fr\"><span class=\"fn\">dθ<\/span><span class=\"fd\">dt<\/span><\/span> = 4t → α = <span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span> = 4 rad/s² constant ✓ non-uniform, constant α ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "θ = 2t² → ω = 4t (changing) → non-UCM, α = 4 const.", "wrong": {"1": "α = 4 rad/s² constant — Statement II sahi.", "2": "Definition sahi — Statement I sahi.", "3": "Dono true hain."}}, {"n": 149, "type": "mcq", "topic": "nucm", "q": "Which of the following is incorrect for non-uniform circular motion?", "fig": "", "figcap": "", "opts": ["The net acceleration has both a radial and a tangential component", "The tangential component of acceleration changes the speed of the particle", "The angular speed of the particle remains constant even though its linear speed changes", "The tangent of the angle between the net acceleration and the radius is <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span>"], "ans": 2, "sol": ["Step 1 — (A) Net acceleration radial + tangential ✓ correct.", "Step 2 — (B) Tangential component speed change karti hai ✓ correct.", "Step 3 — (C) 'Angular speed constant though linear speed changes' — GALAT! ω = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">R<\/span><\/span> — v badhe to ω bhi badhta hai.", "Step 4 — (D) tan(angle between net a and radius) = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> ✓ correct.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "ω = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">R<\/span><\/span> — speed change toh angular speed bhi change karti hai.", "wrong": {"0": "Radial + tangential — sahi.", "1": "Speed change by at — sahi.", "3": "tan = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> — sahi."}}, {"n": 150, "type": "statement", "topic": "nucm", "q": "Consider the following statements about a particle in non-uniform circular motion (take tan 37° = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span>). Statement I: If at = 3 m/s² and ac = 4 m/s² at an instant, the net acceleration makes about 37° with the radius. Statement II: The tangent of the angle between the net acceleration and the radial direction equals <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span>.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: at = 3, ac = 4 → tanφ = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> → φ = 37° (tan37° = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> diya hai) ✓ TRUE.", "Step 2 — Statement II: tan(angle between net a and radial) = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> ✓ TRUE (right triangle: at perpendicular to ac).", "Step 3 — Dono true → option (A)."], "note": "tanφ = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> — net acceleration radius se thoda bahar, 3-4-5 se 37°.", "wrong": {"1": "tan = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> standard — Statement II sahi.", "2": "37° sahi (3-4-5) — Statement I sahi.", "3": "Dono true hain."}}, {"n": 151, "type": "mcq", "topic": "scv", "q": "Which of the following sets consists entirely of scalar quantities?", "fig": "", "figcap": "", "opts": ["Work, power and energy", "Force, momentum and impulse", "Torque, angular momentum and angular velocity", "Displacement, acceleration and electric current"], "ans": 0, "sol": ["Step 1 — Set check karo — sab scalar hona chahiye:", "Step 2 — (A) Work (J), Power (W), Energy (J) — teeno scalars ✓.", "Step 3 — (B) Force, momentum, impulse — teeno VECTORS ✗.", "Step 4 — (C) Torque, angular momentum, angular velocity — axial VECTORS ✗.", "Step 5 — (D) Displacement, acceleration — vectors; current — scalar (mixed) ✗.", "Step 6 — Option (A)."], "note": "Scalars: work, power, energy, heat, charge. Vectors: force, momentum, impulse, torque.", "wrong": {"1": "Teeno vectors hain (force, momentum, impulse).", "2": "Axial vectors hain teeno.", "3": "Mixed — displacement/acceleration vectors hain."}}, {"n": 152, "type": "statement", "topic": "ucm", "q": "Which of the following statements are correct? (1) The magnitude of a vector is always a non-negative scalar. (2) A scalar quantity can be negative, as in the case of temperature on the Celsius scale. (3) Angular speed is a vector quantity whereas angular velocity is a scalar quantity. (4) Work is a scalar although it is calculated from two vectors.", "fig": "", "figcap": "", "opts": ["1, 2 and 4 only", "1, 2 and 3 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) Vector ka magnitude non-negative scalar ✓ TRUE.", "Step 2 — (2) Scalar negative ho sakta hai (Celsius temperature, work) ✓ TRUE.", "Step 3 — (3) 'Angular speed vector, angular velocity scalar' — ULTA! Angular speed = scalar, angular velocity = vector ✗ FALSE.", "Step 4 — (4) Work = F·s — two vectors se scalar ✓ TRUE.", "Step 5 — Correct: 1, 2, 4 → option (A)."], "note": "Angular SPEED = scalar; angular VELOCITY = vector (axial).", "wrong": {"0": "3 galat hai (ulta bola gaya) — B (1,2,3) chuk jaoge.", "2": "3 FALSE hai — angular velocity vector hai.", "3": "Dono speed/vector galat — 3 false hai."}}, {"n": 153, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["Two vectors are equal if they have equal magnitudes and the same direction, regardless of their initial points", "A vector in space can be resolved into three mutually perpendicular rectangular components", "The sum of any two unit vectors is always a unit vector", "A vector multiplied by the real number zero gives a null vector"], "ans": 2, "sol": ["Step 1 — (A) Equal: same magnitude + direction, initial point matter nahi ✓ sahi.", "Step 2 — (B) Space (3D) mein vector 3 perpendicular components mein resolve hota hai ✓ sahi.", "Step 3 — (C) 'Sum of two unit vectors HAMESHA unit' — GALAT! î + î = 2î (magnitude 2). Sirf 90° pe (î+ĵ) magnitude √<span class=\"rad\">2<\/span>, 60° pe 1.", "Step 4 — (D) Vector × 0 = null vector ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "|û + v̂| = 2cos(θ/2) — 1 sirf θ=60° pe; θ=0° pe 2.", "wrong": {"0": "Definition sahi — sahi.", "1": "3D resolution sahi — sahi.", "3": "×0 = null — sahi."}}, {"n": 154, "type": "assertion", "topic": "scv", "q": "Assertion (A): It is meaningless to add a vector quantity to a scalar quantity. Reason (R): A scalar and a vector obey different algebraic rules and cannot be combined into one physical quantity by addition.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Vector + scalar add karna meaningless ✓ TRUE (5 m + 3 m/s kya hoga? units bhi alag).", "Step 2 — Reason: Scalar aur vector alag algebraic rules follow karte hain, ek physical quantity mein combine nahi ho sakte ✓ TRUE.", "Step 3 — R exactly wahi reason hai → correct explanation.", "Step 4 — Option (A)."], "note": "Vector + scalar meaningless — dimensions/units + algebraic rules alag.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (different rules).", "3": "Assertion true hai."}}, {"n": 155, "type": "diagram", "topic": "scv", "q": "Study the following data table described in words. A table has four rows, each row listing one quantity with three attributes: magnitude, direction, and whether it obeys the triangle law of vector addition. Row 1: magnitude 5 units, direction due east, does not obey the triangle law. Row 2: magnitude 5 units, direction due east, obeys the triangle law. Row 3: magnitude 5 units, no direction, obeys ordinary arithmetic only. Row 4: magnitude 5 units, direction due north, obeys the triangle law. How many of the listed quantities are vectors?", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>row<\/th><th>magnitude<\/th><th>direction<\/th><th>obey triangle law?<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>5 units<\/td><td>due east<\/td><td>NO<\/td><\/tr><tr><td>2<\/td><td>5 units<\/td><td>due east<\/td><td>yes<\/td><\/tr><tr><td>3<\/td><td>5 units<\/td><td>(none)<\/td><td>ordinary arithmetic<\/td><\/tr><tr><td>4<\/td><td>5 units<\/td><td>due north<\/td><td>yes<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">A vector needs magnitude + direction + triangle law → rows 2 and 4<\/p><\/div>", "figcap": "Three attributes for each quantity — count the vectors.", "opts": ["1", "2", "3", "4"], "ans": 1, "sol": ["Step 1 — Vector ki pehchaan: magnitude + direction + triangle law follow karne chahiye.", "Step 2 — Row 1: magnitude + direction hai par triangle law NAHI follow karta → VECTOR NAHI (scalar jaisa, e.g. current).", "Step 3 — Row 2: magnitude + direction + triangle law ✓ VECTOR.", "Step 4 — Row 3: direction NAHI hai → SCALAR.", "Step 5 — Row 4: magnitude + direction + triangle law ✓ VECTOR.", "Step 6 — Total vectors = 2 → option (B)."], "note": "Vector = magnitude + direction + triangle law. Teeno chahiye.", "wrong": {"0": "4 galat — row 1 aur 3 vectors nahi hain.", "2": "3 galat — row 3 (no direction) scalar hai.", "3": "4 galat — row 1 triangle law nahi follow karta."}}, {"n": 156, "type": "mcq", "topic": "scv", "q": "Two vectors A and B have equal magnitudes, and the magnitude of A + B is equal to the magnitude of either of them. The angle between A and B is", "fig": "", "figcap": "", "opts": ["60°", "90°", "120°", "150°"], "ans": 2, "sol": ["Step 1 — Equal magnitudes P, resultant bhi P.", "Step 2 — R² = P² + P² + 2P²cosθ = 2P²(1+cosθ).", "Step 3 — R = P → P² = 2P²(1+cosθ) → 1 = 2(1+cosθ) → cosθ = −<span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">2<\/span><\/span>.", "Step 4 — θ = 120°.", "Step 5 — Option (C)."], "note": "Resultant = each magnitude → angle = 120° (equilateral triangle).", "wrong": {"0": "60° pe R = P√<span class=\"rad\">3<\/span> — P nahi.", "1": "90° pe R = P√<span class=\"rad\">2<\/span> — P nahi.", "3": "150° pe R < P — P nahi."}}, {"n": 157, "type": "statement", "topic": "add", "q": "Which of the following statements are correct? (1) If two vectors of equal magnitude have a resultant equal in magnitude to either of them, the angle between them is 120°. (2) Any three vectors of equal magnitude lying in the same plane always add up to a null vector. (3) If A + B is a null vector, then A and B have equal magnitudes and opposite directions. (4) The magnitude of A − B can be greater than the magnitude of A + B.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Equal magnitudes, resultant = either → θ = 120° ✓ TRUE (previous result).", "Step 2 — (2) 'Any three equal vectors in a plane ALWAYS add to zero' — GALAT! Sirf 120° apart pe zero. Do same direction mein ho to resultant 2P direction.", "Step 3 — (3) A + B = 0 → equal magnitude, opposite direction ✓ TRUE.", "Step 4 — (4) |A−B| > |A+B| ho sakta hai (obtuse angle pe) ✓ TRUE.", "Step 5 — Correct: 1, 3, 4 → option (B)."], "note": "Three equal vectors: zero sirf 120° apart pe. |A−B| > |A+B| obtuse pe.", "wrong": {"0": "2 galat hai (120° condition chahiye) — D (all) chuk jaoge.", "1": "2 FALSE hai — always nahi.", "3": "2 galat hai — specific arrangement chahiye."}}, {"n": 158, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["If three vectors add to zero, they can be represented by the three sides of a triangle taken in order", "The angle between the resultant of two equal vectors and either of them is half the angle between the two vectors", "A + B = A − B implies that B is a null vector", "The resultant of two vectors of unequal magnitude can be perpendicular to the larger of the two vectors"], "ans": 3, "sol": ["Step 1 — (A) Three vectors sum zero → triangle sides (in order) ✓ sahi.", "Step 2 — (B) Equal vectors ka resultant angle bisect karta hai → angle = θ/2 ✓ sahi.", "Step 3 — (C) A + B = A − B → B = −B → B = 0 ✓ sahi.", "Step 4 — (D) 'Resultant of unequal vectors LARGER vector ke perpendicular ho sakta hai' — CHECK: (A+B)·A = A² + A·B = 0 → cosθ = −<span class=\"fr\"><span class=\"fn\">A<\/span><span class=\"fd\">B<\/span><\/span>. A > B (A larger) → <span class=\"fr\"><span class=\"fn\">A<\/span><span class=\"fd\">B<\/span><\/span> > 1 → |cosθ| > 1 impossible ✗ GALAT statement.", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Resultant smaller vector ke perpendicular ho sakta hai (cosθ = −<span class=\"fr\"><span class=\"fn\">B<\/span><span class=\"fd\">A<\/span><\/span>, B < A), larger ke nahi.", "wrong": {"0": "Triangle law — sahi.", "1": "Bisector — sahi.", "2": "B = 0 — sahi."}}, {"n": 159, "type": "assertion", "topic": "scv", "q": "Assertion (A): If A + B is perpendicular to A − B, then A and B have equal magnitudes. Reason (R): (A + B) · (A − B) = A² − B², which vanishes only when the magnitudes of A and B are equal.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — (A+B) ⊥ (A−B) → (A+B)·(A−B) = 0.", "Step 2 — A² − B² + A·B − A·B… expand: (A+B)·(A−B) = A·A − A·B + B·A − B·B = A² − B².", "Step 3 — = 0 → A² = B² → |A| = |B| ✓ Assertion TRUE.", "Step 4 — Reason: (A+B)·(A−B) = A²−B², vanish only when equal ✓ TRUE.", "Step 5 — R exact derivation hai → correct explanation → option (A)."], "note": "(A+B)⊥(A−B) ⟺ |A| = |B| (A²−B² = 0).", "wrong": {"1": "R correct explanation hai — wahi derivation.", "2": "R true hai (A²−B²).", "3": "Assertion true hai."}}, {"n": 160, "type": "diagram", "topic": "add", "q": "Study the described vector diagram. From a point O on a sheet, three arrows are drawn head-to-tail: P of length 2 cm pointing due north, Q of length 2 cm pointing due east starting from the head of P, and R of length 2√<span class=\"rad\">2<\/span> cm pointing south-west at 45° to the horizontal starting from the head of Q. Taking √<span class=\"rad\">2<\/span> = 1.414, the magnitude of the resultant P + Q + R is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 160\"><defs><marker id=\"m160\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt160\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr160\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg160\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"140.0\" y1=\"150.0\" x2=\"140.0\" y2=\"70.0\" stroke=\"#264653\" stroke-width=\"2.6\" marker-end=\"url(#m160)\"/><text x=\"128.0\" y=\"114.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">P = 2 (N)<\/text><line x1=\"140.0\" y1=\"70.0\" x2=\"220.0\" y2=\"70.0\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt160)\"/><text x=\"180.0\" y=\"58.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">Q = 2 (E)<\/text><line x1=\"220.0\" y1=\"70.0\" x2=\"140.0\" y2=\"150.0\" stroke=\"#d9a441\" stroke-width=\"2.6\" marker-end=\"url(#mg160)\"/><text x=\"208.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"normal\">R = 2√2 (SW)<\/text><circle cx=\"140.0\" cy=\"150.0\" r=\"5\" fill=\"#e76f51\"/><text x=\"118.0\" y=\"172.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#e76f51\" font-weight=\"normal\">R = 0 (closed triangle)<\/text><path d=\"M 140,124 A 26,26 0 0 0 118,146\" fill=\"none\" stroke=\"#7a8291\" stroke-width=\"1.4\"/><text x=\"176.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9a441\" font-weight=\"normal\">45°<\/text><\/svg>", "figcap": "P north, Q east, R southwest at 45°: the triangle closes → resultant zero.", "opts": ["zero", "2 cm", "2√<span class=\"rad\">2<\/span> cm", "4 cm"], "ans": 0, "sol": ["Step 1 — Head-to-tail: P = 2 north → (0, 2). Q = 2 east from P's head → (2, 2).", "Step 2 — R = 2√<span class=\"rad\">2<\/span> south-west at 45° → components (−2, −2) (SW = −x, −y equally).", "Step 3 — Sum = (0+2−2, 2+0−2) = (0, 0) → ZERO.", "Step 4 — Option (A) — triangle closed, polygon law se resultant null."], "note": "Closed head-to-tail chain → resultant zero (polygon law).", "wrong": {"1": "2 cm galat — chain closed hai (0,0).", "2": "2√<span class=\"rad\">2<\/span> sirf R ka magnitude hai — total sum zero.", "3": "4 = 2+2 — scalars add galat."}}, {"n": 161, "type": "match", "topic": "add", "q": "Match the Columns for two vectors, each of magnitude P. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Angle between them when the magnitude of the resultant is 2P<\/div><div class=\"colitem\">(b) Angle between them when the magnitude of the resultant is P<\/div><div class=\"colitem\">(c) Angle between them when the magnitude of the resultant is √<span class=\"rad\">2<\/span> P<\/div><div class=\"colitem\">(d) Angle between them when the magnitude of the resultant is zero<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 90°<\/div><div class=\"colitem\">(ii) 0°<\/div><div class=\"colitem\">(iii) 180°<\/div><div class=\"colitem\">(iv) 120°<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-iv, c-i, d-iii", "a-iv, b-ii, c-i, d-iii", "a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Equal magnitudes P, resultant formulas se angle nikalo:", "Step 2 — (a) R = 2P max → θ = 0° → (ii)", "Step 3 — (b) R = P → θ = 120° → (iv)", "Step 4 — (c) R = √<span class=\"rad\">2<\/span>P → R² = 2P²+2P²cosθ = 2P² → cosθ = 0 → θ = 90° → (i)", "Step 5 — (d) R = 0 → θ = 180° → (iii)", "Step 6 — Toh a-ii, b-iv, c-i, d-iii → option (A)."], "note": "R = 2Pcos(θ/2): 2P→0°, P→120°, √<span class=\"rad\">2<\/span>P→90°, 0→180°.", "wrong": {"1": "R = P → 120° — 0° galat.", "2": "R = √<span class=\"rad\">2<\/span>P → 90° — 120° galat.", "3": "R = 0 → 180° — 90° galat."}}, {"n": 162, "type": "statement", "topic": "dot", "q": "Consider the following statements. Statement I: The magnitude of the resultant of two vectors decreases continuously as the angle between them increases from 0° to 180°. Statement II: cos θ decreases continuously from 1 to −1 as θ increases from 0° to 180°, and R² = A² + B² + 2AB cos θ.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: θ 0°→180° badhta hai to cosθ 1→−1 (continuously) → R = √<span class=\"rad\">(A²+B²+2AB cosθ)<\/span> continuously DECREASES ✓ TRUE.", "Step 2 — Statement II: cosθ 1 se −1 tak continuously decreases, aur R² = A²+B²+2AB cosθ ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "R θ ke saath monotonically decreases: A+B se |A−B| tak.", "wrong": {"1": "R² formula sahi — Statement II sahi.", "2": "Monotonic decrease sahi — Statement I sahi.", "3": "Dono true hain."}}, {"n": 163, "type": "mcq", "topic": "comp", "q": "A vector A of magnitude 10 units makes an angle of 30° with the positive x-axis. Taking cos 30° = 0.866, the magnitude of its component along a direction that makes 60° with the positive x-axis is", "fig": "", "figcap": "", "opts": ["5 units", "8.66 units", "10 units", "zero"], "ans": 1, "sol": ["Step 1 — A = 10 at 30° from +x. Direction = 60° from +x.", "Step 2 — A aur direction ke beech ka angle = 60° − 30° = 30°.", "Step 3 — Component along that direction = A cos30° = 10 × 0.866 = 8.66 units.", "Step 4 — Option (B)."], "note": "Component along direction = A cos(angle between).", "wrong": {"0": "5 = 10 cos60° — angle 30° hai (difference), 60° nahi.", "2": "10 tab hota direction = A ki direction mein.", "3": "Zero tab direction perpendicular ho."}}, {"n": 164, "type": "statement", "topic": "ucm", "q": "Which of the following statements are correct? (1) The rectangular components of a vector depend on the choice of the axes. (2) A vector can be resolved into two components along two directions that are not mutually perpendicular. (3) The magnitude of a vector is always greater than either of its rectangular components. (4) If a vector makes 45° with the x-axis, its x and y components are equal in magnitude.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Rectangular components axes ke choice par depend ✓ TRUE.", "Step 2 — (2) Non-perpendicular directions mein bhi resolve ho sakta hai ✓ TRUE (oblique resolution).", "Step 3 — (3) 'Magnitude HAMESHA components se zyada' — GALAT! Vector x-axis ke along ho to |Ax| = A (equal, not greater).", "Step 4 — (4) 45° pe |Ax| = |Ay| = A/√<span class=\"rad\">2<\/span> ✓ TRUE.", "Step 5 — Correct: 1, 2, 4 → option (B)."], "note": "|Ax| ≤ A — equality when along axis. 45° → equal components.", "wrong": {"0": "3 galat hai (axis-along pe equal) — D chuk jaoge.", "1": "3 FALSE — 'always greater' galat.", "3": "3 galat hai — component equal ho sakta hai."}}, {"n": 165, "type": "mcq", "topic": "scv", "q": "Consider vectors A = Ax î + Ay ĵ and B = Bx î + By ĵ. Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["A + B = (Ax + Bx) î + (Ay + By) ĵ", "The magnitude of A + B is √[(Ax + Bx)² + (Ay + By)²]", "A and B are mutually perpendicular if <span class=\"fr\"><span class=\"fn\">Ax<\/span><span class=\"fd\">Bx<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">Ay<\/span><span class=\"fd\">By<\/span><\/span>", "The direction of A + B is given by tan θ = <span class=\"fr\"><span class=\"fn\">(Ay + By)<\/span><span class=\"fd\">(Ax + Bx)<\/span><\/span>"], "ans": 2, "sol": ["Step 1 — (A) Component-wise addition ✓ sahi.", "Step 2 — (B) |A+B| = √[(Ax+Bx)² + (Ay+By)²] ✓ sahi.", "Step 3 — (C) 'Perpendicular if <span class=\"fr\"><span class=\"fn\">Ax<\/span><span class=\"fd\">Bx<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">Ay<\/span><span class=\"fd\">By<\/span><\/span>' — GALAT! Yeh PARALLEL ka condition hai (proportional components). Perpendicular ke liye A·B = Ax·Bx + Ay·By = 0.", "Step 4 — (D) tanθ = <span class=\"fr\"><span class=\"fn\">(Ay+By)<\/span><span class=\"fd\">(Ax+Bx)<\/span><\/span> ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Parallel: <span class=\"fr\"><span class=\"fn\">Ax<\/span><span class=\"fd\">Bx<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">Ay<\/span><span class=\"fd\">By<\/span><\/span> (proportional). Perpendicular: Ax·Bx + Ay·By = 0.", "wrong": {"0": "Component addition — sahi.", "1": "Magnitude formula — sahi.", "3": "Direction formula — sahi."}}, {"n": 166, "type": "assertion", "topic": "dot", "q": "Assertion (A): The component of the vector A = 4î + 3ĵ along the direction of the unit vector n̂ = <span class=\"fr\"><span class=\"fn\">(4î + 3ĵ)<\/span><span class=\"fd\">5<\/span><\/span> has magnitude 5 units. Reason (R): The component of a vector A along a unit vector n̂ is given by the scalar product A · n̂.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — A = (4, 3), n̂ = <span class=\"fr\"><span class=\"fn\">(4,3)<\/span><span class=\"fd\">5<\/span><\/span> = (0.8, 0.6).", "Step 2 — Component along n̂ = A·n̂ = 4×0.8 + 3×0.6 = 3.2 + 1.8 = 5 ✓ Assertion TRUE.", "Step 3 — (Yeh makes sense: n̂ exactly A ke direction mein hai, isliye component = |A| = 5.)", "Step 4 — Reason: Component along unit vector = A·n̂ ✓ TRUE — yahi use hua.", "Step 5 — R correct explanation → option (A)."], "note": "Component along n̂ = A·n̂. A ke apne direction mein component = |A|.", "wrong": {"1": "R correct explanation hai (wahi formula).", "2": "R true hai (A·n̂ formula).", "3": "Assertion true hai (5 verified)."}}, {"n": 167, "type": "diagram", "topic": "comp", "q": "Study the described graph. On a graph sheet with x and y axes marked in the same units, a vector is drawn as an arrow from the point (1, 2) to the point (5, 5). The tangent of the angle made by this vector with the positive x-axis is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 167\"><defs><marker id=\"m167\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><pa \">Column II:<\/div><div class=\"colitem\">(i) magnitude 4, along −y direction<\/div><div class=\"colitem\">(ii) magnitude 3√<span class=\"rad\">2<\/span>, at 45° to +x axis<\/div><div class=\"colitem\">(iii) magnitude 4, at 60° to +x axis<\/div><div class=\"colitem\">(iv) magnitude 5, along +x direction<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-iv, c-i, d-iii", "a-iv, b-ii, c-i, d-iii", "a-ii, b-i, c-iv, d-iii", "a-iii, b-iv, c-i, d-ii"], "ans": 0, "sol": ["Step 1 — Magnitude + direction nikalo:", "Step 2 — (a) 3î+3ĵ: |A| = 3√<span class=\"rad\">2<\/span>, tanθ = 1 → 45° → (ii)", "Step 3 — (b) 5î: magnitude 5, +x → (iv)", "Step 4 — (c) −4ĵ: magnitude 4, −y → (i)", "Step 5 — (d) 2î+2√<span class=\"rad\">3<\/span>ĵ: |A| = √<span class=\"rad\">(4+12)<\/span> = 4, tanθ = 2√<span class=\"rad\">3<\/span>/2 = √<span class=\"rad\">3<\/span> → 60° → (iii)", "Step 6 — Toh a-ii, b-iv, c-i, d-iii → option (A)."], "note": "|A| = √<span class=\"rad\">(x²+y²)<\/span>; tanθ = <span class=\"fr\"><span class=\"fn\">y<\/span><span class=\"fd\">x<\/span><\/span> with quadrant.", "wrong": {"1": "5î +x hai — (iv), (ii) nahi.", "2": "−4ĵ −y hai — (i), (iv) nahi.", "3": "2î+2√<span class=\"rad\">3<\/span>ĵ 60° hai — 45° nahi."}}, {"n": 169, "type": "mcq", "topic": "dot", "q": "If A = 2î + 3ĵ − k̂ and B = î − 2ĵ + 3k̂, the value of A · B is", "fig": "", "figcap": "", "opts": ["7", "−7", "13", "−13"], "ans": 1, "sol": ["Step 1 — A·B = (2)(1) + (3)(−2) + (−1)(3).", "Step 2 — = 2 − 6 − 3 = −7.", "Step 3 — Option (B)."], "note": "3D dot: Σ AiBi. Signs carefully.", "wrong": {"0": "7 = 2+3+…? — signs: −6 aur −3 minus hain.", "2": "13 = 2+6+3+…? — signs galat.", "3": "−13 galat — 2−6−3 = −7."}}, {"n": 170, "type": "statement", "topic": "cross", "q": "Which of the following statements are correct? (1) A · B = 0 always implies that A and B are mutually perpendicular. (2) A × B = 0 implies that A and B are parallel, provided neither of them is a null vector. (3) (A × B) · A = 0 for any two vectors A and B. (4) (A · B)² + (magnitude of A × B)² = A²B² for any two vectors A and B.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "2, 3 and 4 only", "1, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) 'A·B = 0 ALWAYS implies perpendicular' — GALAT! Agar A ya B null ho to bhi zero (perpendicular nahi).", "Step 2 — (2) A×B = 0, non-zero vectors → parallel ✓ TRUE (sinθ = 0 → θ = 0°/180°).", "Step 3 — (3) (A×B)·A = 0 — A×B, A ke perpendicular hai ✓ TRUE.", "Step 4 — (4) (A·B)² + |A×B|² = A²B²(cos²θ+sin²θ) = A²B² ✓ TRUE.", "Step 5 — Correct: 2, 3, 4 → option (B)."], "note": "A·B = 0 → perpendicular OR null vector. Identity: (A·B)² + |A×B|² = A²B².", "wrong": {"0": "1 galat hai (null vector case) — D chuk jaoge.", "1": "1 FALSE — null vectors bhi 0 dete hain.", "3": "1 galat hai — 'always' strong word."}}, {"n": 171, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["A · B is a scalar quantity and it is commutative", "A × B is perpendicular to both A and B and it is anticommutative", "The vector product of two unit vectors is always a unit vector", "The scalar product of two mutually perpendicular vectors is zero"], "ans": 2, "sol": ["Step 1 — (A) A·B scalar, commutative ✓ sahi.", "Step 2 — (B) A×B perpendicular to both, anticommutative ✓ sahi.", "Step 3 — (C) 'Cross product of two unit vectors HAMESHA unit' — GALAT! |A×B| = sinθ — 1 sirf θ=90° pe; θ=0° pe 0.", "Step 4 — (D) Perpendicular vectors ka dot zero ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "|û×v̂| = sinθ — 1 sirf perpendicular pe.", "wrong": {"0": "Sahi statement.", "1": "Sahi statement.", "3": "Sahi statement."}}, {"n": 172, "type": "match", "topic": "cross", "q": "Match the Columns for A = 3î + 4ĵ and B = 5î + 12ĵ (for two-dimensional vectors, the magnitude of A × B is Ax By − Ay Bx). <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A · B<\/div><div class=\"colitem\">(b) Magnitude of A × B<\/div><div class=\"colitem\">(c) Magnitude of A<\/div><div class=\"colitem\">(d) Magnitude of B<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 5<\/div><div class=\"colitem\">(ii) 13<\/div><div class=\"colitem\">(iii) 16<\/div><div class=\"colitem\">(iv) 63<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iv, b-iii, c-i, d-ii", "a-iii, b-iv, c-i, d-ii", "a-iv, b-i, c-iii, d-ii", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — A = (3,4), B = (5,12):", "Step 2 — (a) A·B = 15 + 48 = 63 → (iv)", "Step 3 — (b) |A×B| = |3×12 − 4×5| = |36−20| = 16 → (iii)", "Step 4 — (c) |A| = √<span class=\"rad\">(9+16)<\/span> = 5 → (i)", "Step 5 — (d) |B| = √<span class=\"rad\">(25+144)<\/span> = 13 → (ii)", "Step 6 — Toh a-iv, b-iii, c-i, d-ii → option (A)."], "note": "2D cross magnitude = |AxBy − AyBx|. 3-4-5, 5-12-13.", "wrong": {"1": "|A×B| = 16 — 63 (dot) nahi.", "2": "|A| = 5 — 63 nahi.", "3": "|B| = 13 — 16 nahi."}}, {"n": 173, "type": "assertion", "topic": "cross", "q": "Assertion (A): For any two vectors A and B, the vector A × B is perpendicular to A + B. Reason (R): A × B is perpendicular to both A and B, and hence it is perpendicular to any linear combination of A and B.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — A×B, A ke perpendicular hai aur B ke perpendicular hai.", "Step 2 — A+B, A aur B ka linear combination hai.", "Step 3 — Koi bhi linear combination (αA + βB) bhi A×B ke perpendicular rahegi (kyunki (A×B)·A = 0 aur (A×B)·B = 0).", "Step 4 — ✓ Assertion TRUE. Reason yahi logic deta hai ✓ TRUE → correct explanation.", "Step 5 — Option (A)."], "note": "A×B ⊥ (plane of A,B) → ⊥ to any vector in that plane, including A+B.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (perpendicularity).", "3": "Assertion true hai."}}, {"n": 174, "type": "statement", "topic": "dot", "q": "Consider the following statements for two vectors A and B of magnitudes 5 units and 3 units, with the magnitude of A + B equal to 8 units. Statement I: A and B are parallel and point in the same direction. Statement II: From R² = A² + B² + 2 A · B, one obtains A · B = AB, so cos θ = 1.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: R = 8 = 5+3 → A aur B same direction (parallel) ✓ TRUE (R max only when parallel same direction).", "Step 2 — Statement II: R² = A²+2A·B+B² = 64 → 25+2A·B+9 = 64 → A·B = 15 = AB → cosθ = 1 → θ = 0° ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "R = A+B (max) → parallel same direction (θ=0°).", "wrong": {"1": "Both derivations sahi — dono true.", "2": "Statement I sahi (max resultant = parallel).", "3": "Dono true hain."}}, {"n": 175, "type": "mcq", "topic": "proj", "q": "A projectile is fired with speed u at an angle θ with the horizontal and lands at the same level. If its horizontal range is twice the maximum height attained, the angle of projection is", "fig": "", "figcap": "", "opts": ["30°", "45°", "60°", "tan⁻¹2"], "ans": 3, "sol": ["Step 1 — R = 2H.", "Step 2 — <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> = 2 × <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">g<\/span><\/span>.", "Step 3 — sin2θ = sin²θ → 2sinθcosθ = sin²θ.", "Step 4 — Divide sinθ: 2cosθ = sinθ → tanθ = 2.", "Step 5 — θ = tan⁻¹2 ≈ 63.4° → option (D)."], "note": "R = 2H → tanθ = 2. R = H → tanθ = 4. R = nH → tanθ = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">n<\/span><\/span>.", "wrong": {"0": "30° → tan = 0.577 — 2 nahi.", "1": "45° → tan = 1 — 2 nahi.", "2": "60° → tan = 1.73 — 2 nahi."}}, {"n": 176, "type": "statement", "topic": "proji", "q": "Which of the following statements are correct for an oblique projectile (air resistance neglected)? (1) At the highest point the speed is minimum but the acceleration is not zero. (2) The horizontal component of velocity remains constant while the vertical component changes by g in every second. (3) The time of flight depends only on the vertical component of the initial velocity and on g. (4) The horizontal range is maximum at 45° for every projectile, including one fired from a height.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) Top pe speed min (u cosθ), acceleration g (not zero) ✓ TRUE.", "Step 2 — (2) vx constant, vy har second g change ✓ TRUE.", "Step 3 — (3) T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> — sirf vertical component + g par depend ✓ TRUE.", "Step 4 — (4) 'Range 45° pe max for EVERY projectile including from height' — GALAT! Height se projection mein optimum angle 45° se CHHOTA hota hai.", "Step 5 — Correct: 1, 2, 3 → option (A)."], "note": "Level ground: 45° max range. From height: optimum < 45°.", "wrong": {"0": "4 galat hai (from height case) — D chuk jaoge.", "1": "4 FALSE — height ke case mein 45° nahi.", "3": "4 galat hai — specific condition chahiye."}}, {"n": 177, "type": "mcq", "topic": "proj", "q": "Which of the following is incorrect for a projectile fired from level ground (air resistance neglected)?", "fig": "", "figcap": "", "opts": ["The equation of its trajectory has the form y = ax − bx², that is, a parabola", "The projectile can be at the same height at two different instants, and the sum of those two times equals the time of flight", "The kinetic energy of the projectile is maximum at the highest point of its trajectory", "The horizontal component of its momentum remains constant throughout the flight"], "ans": 2, "sol": ["Step 1 — (A) Trajectory y = ax − bx² (parabola) ✓ sahi.", "Step 2 — (B) Same height do times pe, t₁+t₂ = T ✓ sahi (symmetry).", "Step 3 — (C) 'KE maximum at highest point' — GALAT! Top pe speed MINIMUM (u cosθ) → KE MINIMUM. Max KE projection/landing pe.", "Step 4 — (D) Horizontal momentum constant ✓ sahi (no horizontal force).", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "KE ∝ v². Top pe v min → KE min. Launch/impact pe v max → KE max.", "wrong": {"0": "Parabola — sahi.", "1": "Symmetry t₁+t₂ = T — sahi.", "3": "px = const — sahi."}}, {"n": 178, "type": "mcq", "topic": "proj", "q": "A projectile is launched with velocity v = 20î + 30ĵ m/s, where î is horizontal and ĵ is vertically upward (take g = 10 m/s²). After how much time will its velocity make an angle of 45° with the horizontal during its ascent?", "fig": "", "figcap": "", "opts": ["0.5 s", "1 s", "2 s", "3 s"], "ans": 1, "sol": ["Step 1 — v = (20, 30) m/s. vx = 20 constant.", "Step 2 — vy(t) = 30 − 10t.", "Step 3 — Velocity horizontal se 45° → tan45° = <span class=\"fr\"><span class=\"fn\">vy<\/span><span class=\"fd\">vx<\/span><\/span> = 1 → vy = 20.", "Step 4 — 30 − 10t = 20 → 10t = 10 → t = 1 s.", "Step 5 — Option (B)."], "note": "tanφ = <span class=\"fr\"><span class=\"fn\">vy<\/span><span class=\"fd\">vx<\/span><\/span>. 45° → vy = vx.", "wrong": {"0": "0.5 s pe vy = 25 → tan = 1.25 (51°) — 45° nahi.", "2": "2 s pe vy = 10 → tan = 0.5 (26.6°) — 45° nahi.", "3": "3 s pe vy = 0 — top pe, horizontal, 0°."}}, {"n": 179, "type": "diagram", "topic": "proj", "q": "Study the described trajectory data. A projectile follows the path given by y = 2x − 0.1x², where x is measu
