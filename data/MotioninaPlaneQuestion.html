div><div class=\"colitem\">(a) Angular speed when time period is π s<\/div><div class=\"colitem\">(b) Centripetal acceleration for v = 10 m/s and R = 5 m<\/div><div class=\"colitem\">(c) Time period when ω = 4 rad/s<\/div><div class=\"colitem\">(d) Linear speed when ω = 2 rad/s and R = 3 m<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 20 m/s²<\/div><div class=\"colitem\">(ii) 2 rad/s<\/div><div class=\"colitem\">(iii) 6 m/s<\/div><div class=\"colitem\">(iv) <span class=\"fr\"><span class=\"fn\">π<\/span><span class=\"fd\">2<\/span><\/span> s<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iv, d-iii", "a-ii, b-iv, c-i, d-iii", "a-iii, b-i, c-iv, d-ii"], "ans": 0, "sol": ["Step 1 — (a) T = π s → ω = 2π/π = 2 rad/s → (ii)", "Step 2 — (b) v = 10, R = 5 → a = <span class=\"fr\"><span class=\"fn\">100<\/span><span class=\"fd\">5<\/span><\/span> = 20 m/s² → (i)", "Step 3 — (c) ω = 4 → T = 2π/4 = <span class=\"fr\"><span class=\"fn\">π<\/span><span class=\"fd\">2<\/span><\/span> s → (iv)", "Step 4 — (d) ω = 2, R = 3 → v = 6 m/s → (iii)", "Step 5 — Toh a-ii, b-i, c-iv, d-iii → option (A)."], "note": "ω = 2π/T; a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>; T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span>; v = ωR.", "wrong": {"1": "20 m/s² (b) ka hai — 2 rad/s (a) nahi.", "2": "<span class=\"fr\"><span class=\"fn\">π<\/span><span class=\"fd\">2<\/span><\/span> s (c) ka hai — 20 nahi.", "3": "6 m/s (d) ka hai — <span class=\"fr\"><span class=\"fn\">π<\/span><span class=\"fd\">2<\/span><\/span> nahi."}}, {"n": 341, "type": "statement", "topic": "ucm", "q": "Consider the following statements for uniform circular motion. Statement I: The acceleration vector is always directed towards the centre, but its direction changes continuously. Statement II: The magnitude of the acceleration, <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, remains constant because v and R are constant.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Acceleration hamesha center ki taraf, direction continuously changing ✓ TRUE.", "Step 2 — Statement II: |a| = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> constant (v, R constant) ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "UCM: a magnitude constant (<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>), direction always radial (changing).", "wrong": {"1": "<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> constant — Statement II sahi.", "2": "Radial direction changing — Statement I sahi.", "3": "Dono true hain."}}, {"n": 342, "type": "mcq", "topic": "ucm", "q": "Two particles move in circles of radii R and 2R with the same angular speed ω. The ratio of their centripetal accelerations is", "fig": "", "figcap": "", "opts": ["1 : 2", "2 : 1", "1 : 4", "4 : 1"], "ans": 0, "sol": ["Step 1 — a = ω²R (same ω).", "Step 2 — Ratio a1:a2 = R1:R2 = R:2R = 1:2.", "Step 3 — Option (A)."], "note": "Same ω: a ∝ R.", "wrong": {"0": "2:1 — ratio ulta (a ∝ R).", "2": "1:4 — square nahi, linear in R.", "3": "4:1 — bilkul ulta."}}, {"n": 343, "type": "statement", "topic": "nucm", "q": "Which of the following statements are correct for non-uniform circular motion? (1) The tangential acceleration changes the magnitude of the velocity. (2) The centripetal acceleration changes the direction of the velocity. (3) The net acceleration is the vector sum of two mutually perpendicular components. (4) The angular acceleration is zero in non-uniform circular motion.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) Tangential → magnitude change ✓ TRUE.", "Step 2 — (2) Centripetal → direction change ✓ TRUE.", "Step 3 — (3) Net = vector sum of perpendicular components ✓ TRUE.", "Step 4 — (4) 'Angular acceleration zero in non-UCM' — GALAT! Non-UCM mein ω changes → α ≠ 0.", "Step 5 — Correct: 1, 2, 3 → option (A)."], "note": "Non-UCM: α = <span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span> ≠ 0 (by definition non-uniform).", "wrong": {"0": "4 galat hai (α ≠ 0) — D chuk jaoge.", "1": "4 FALSE — non-UCM mein angular acceleration non-zero.", "3": "4 galat hai — ω changing hai."}}, {"n": 344, "type": "mcq", "topic": "nucm", "q": "Which of the following is NOT correct for a particle in non-uniform circular motion?", "fig": "", "figcap": "", "opts": ["Its speed changes with time", "Its net acceleration has a tangential component", "The work done by the centripetal component of the force on it is non-zero", "Its angular velocity changes with time"], "ans": 2, "sol": ["Step 1 — (A) Speed changes ✓ correct.", "Step 2 — (B) Net acceleration tangential component rakhta hai ✓ correct.", "Step 3 — (C) 'Work done by centripetal component non-zero' — GALAT! Centripetal component ⊥ velocity → work ZERO.", "Step 4 — (D) Angular velocity changes ✓ correct.", "Step 5 — Not correct = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Centripetal component: work zero (⊥ v). Tangential: work non-zero.", "wrong": {"0": "Speed changes — sahi.", "1": "Tangential present — sahi.", "3": "ω changes — sahi."}}, {"n": 345, "type": "assertion", "topic": "nucm", "q": "Assertion (A): In non-uniform circular motion, the tangential component of acceleration is equal to the rate of change of speed. Reason (R): The tangential component of acceleration is the component of the net acceleration along the instantaneous direction of velocity.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: at = rate of change of speed ✓ TRUE.", "Step 2 — Reason: Tangential component = net acceleration ka component along instantaneous velocity ✓ TRUE.", "Step 3 — R definition deta hai → correct explanation → option (A)."], "note": "at = a·v̂ = d|v|/dt (tangential = along velocity).", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (component along v).", "3": "Assertion true hai."}}, {"n": 346, "type": "diagram", "topic": "nucm", "q": "Study the following data table described in words. A particle moves on a circle of radius 2 m with its speed increasing uniformly: t = 0 s → v = 3 m/s; t = 1 s → v = 4 m/s; t = 2 s → v = 5 m/s. Taking √<span class=\"rad\">65<\/span> = 8.06, the magnitude of the net acceleration at t = 1 s is", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>t (s)<\/th><th>v (m/s)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>3<\/td><\/tr><tr><td>1<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>5<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">R = 2 m, at = 1 m/s² (uniform)<\/p><\/div>", "figcap": "Speed on a circle of radius 2 m, increasing uniformly.", "opts": ["√<span class=\"rad\">65<\/span> m/s²", "9 m/s²", "8 m/s²", "65 m/s²"], "ans": 0, "sol": ["Step 1 — Speed: 3, 4, 5 m/s at t = 0, 1, 2 → at = 1 m/s² (uniform).", "Step 2 — t = 1 pe: v = 4 m/s, R = 2 m.", "Step 3 — ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">16<\/span><span class=\"fd\">2<\/span><\/span> = 8 m/s².", "Step 4 — Net = √<span class=\"rad\">(1 + 64)<\/span> = √<span class=\"rad\">65<\/span> m/s².", "Step 5 — Option (A)."], "note": "at from slope (1 m/s²), ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> at t=1.", "wrong": {"0": "9 = 8+1 — perpendicular hain, Pythagoras: √<span class=\"rad\">65<\/span>.", "2": "8 = sirf ac — at ghat gaya.", "3": "65 = ac²… √<span class=\"rad\">65<\/span> hai, 65 nahi (magnitude sqrt hoti hai)."}}, {"n": 347, "type": "match", "topic": "nucm", "q": "Match the Columns for circular motion. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Tangential acceleration<\/div><div class=\"colitem\">(b) Centripetal acceleration<\/div><div class=\"colitem\">(c) Angular acceleration<\/div><div class=\"colitem\">(d) Magnitude of net acceleration in non-uniform circular motion<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span><\/div><div class=\"colitem\">(ii) <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span><\/div><div class=\"colitem\">(iii) √<span class=\"rad\">(at² + ac²)<\/span><\/div><div class=\"colitem\">(iv) <span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span><\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iv, d-iii", "a-ii, b-iv, c-i, d-iii", "a-iii, b-i, c-ii, d-iv"], "ans": 0, "sol": ["Step 1 — Formulas match karo:", "Step 2 — (a) Tangential acceleration → <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> → (ii)", "Step 3 — (b) Centripetal acceleration → <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> → (i)", "Step 4 — (c) Angular acceleration → <span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span> → (iv)", "Step 5 — (d) Net (non-UCM) → √<span class=\"rad\">(at²+ac²)<\/span> → (iii)", "Step 6 — Toh a-ii, b-i, c-iv, d-iii → option (A)."], "note": "at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span>; ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>; α = <span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span>; a = √<span class=\"rad\">(at²+ac²)<\/span>.", "wrong": {"1": "<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> centripetal hai — <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> nahi.", "2": "<span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span> angular hai — <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> nahi.", "3": "√<span class=\"rad\">(at²+ac²)<\/span> net hai — <span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span> nahi."}}, {"n": 348, "type": "statement", "topic": "ucm", "q": "Which of the following statements are correct, where r, v and a are the position, velocity and acceleration vectors? (1) In uniform circular motion, v · a = 0 at every instant. (2) In uniform circular motion, the magnitude of r × v is equal to Rv, where r is measured from the centre. (3) For a projectile at its highest point, v · a = 0. (4) For a projectile at its highest point, v × a is a null vector.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) UCM: v·a = 0 (v⊥a) ✓ TRUE.", "Step 2 — (2) |r×v| = Rv (r⊥v, center se) ✓ TRUE.", "Step 3 — (3) Projectile top: v horizontal, a vertical → v·a = 0 ✓ TRUE.", "Step 4 — (4) Projectile top: v×a = 0? NAHI! v horizontal, a vertical → v×a non-zero (out of plane) ✗ FALSE.", "Step 5 — Correct: 1, 2, 3 → option (A)."], "note": "Projectile top: v×a non-zero (perpendicular vectors ka cross zero nahi).", "wrong": {"0": "4 galat hai (v×a ≠ 0) — D chuk jaoge.", "1": "4 FALSE — perpendicular vectors ka cross non-zero.", "3": "4 galat hai — v×a = v·g k̂ direction."}}, {"n": 349, "type": "mcq", "topic": "scv", "q": "Which of the following is NOT correct?", "fig": "", "figcap": "", "opts": ["The scalar product of two vectors is maximum when the two vectors are parallel", "The magnitude of the vector product of two vectors is maximum when the two vectors are perpendicular", "The scalar product of two unit vectors can be equal to 2", "The magnitude of the vector product of two unit vectors is at most 1"], "ans": 2, "sol": ["Step 1 — (A) Dot product max when parallel ✓ correct (cos=1).", "Step 2 — (B) Cross product max when perpendicular ✓ correct (sin=1).", "Step 3 — (C) 'Dot of two unit vectors = 2' — GALAT! û·v̂ = cosθ ≤ 1. Max 1 (parallel).", "Step 4 — (D) |û×v̂| = sinθ ≤ 1 ✓ correct.", "Step 5 — Not correct = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "û·v̂ ∈ [−1, 1]; |û×v̂| ∈ [0, 1].", "wrong": {"0": "Parallel max — sahi.", "1": "Perpendicular max — sahi.", "3": "≤ 1 — sahi."}}, {"n": 350, "type": "mcq", "topic": "proj", "q": "A projectile is fired with a speed of 20 m/s at 60° with the horizontal. Taking g = 10 m/s², sin 60° = 0.866, cos 60° = 0.5 and tan 30° = 0.577, the time at which its velocity makes an angle of 30° with the horizontal during ascent is", "fig": "", "figcap": "", "opts": ["1.15 s", "1.73 s", "0.58 s", "2 s"], "ans": 0, "sol": ["Step 1 — u = 20, θ = 60°. vx = 20×0.5 = 10. vy(0) = 20×0.866 = 17.32.", "Step 2 — Velocity horizontal se 30° (ascent) → tan30° = <span class=\"fr\"><span class=\"fn\">vy<\/span><span class=\"fd\">vx<\/span><\/span>.", "Step 3 — 0.577 = <span class=\"fr\"><span class=\"fn\">(17.32 − 10t)<\/span><span class=\"fd\">10<\/span><\/span> → 17.32 − 10t = 5.77.", "Step 4 — 10t = 11.55 → t = 1.155 ≈ 1.15 s.", "Step 5 — Option (A)."], "note": "tanφ = <span class=\"fr\"><span class=\"fn\">(u sinθ − gt)<\/span><span class=\"fd\">(u cosθ)<\/span><\/span>. φ = 30° solve karo.", "wrong": {"0": "1.73 = t<sub>top<\/sub> (<span class=\"fr\"><span class=\"fn\">u sinθ<\/span><span class=\"fd\">g<\/span><\/span>) — wahan velocity horizontal (0°) hoti hai.", "2": "0.58 galat — t = 1.15.", "3": "2 s = 2×1? — calculation karo: <span class=\"fr\"><span class=\"fn\">11.55<\/span><span class=\"fd\">10<\/span><\/span>."}}, {"n": 351, "type": "statement", "topic": "scv", "q": "Which of the following statements are correct? (1) The magnitude of a vector is invariant under rotation of the coordinate axes. (2) The components of a vector are invariant under rotation of the coordinate axes. (3) Every physical quantity having both magnitude and direction is necessarily a vector. (4) The scalar product of two vectors is invariant under rotation of the coordinate axes.", "fig": "", "figcap": "", "opts": ["1 and 4 only", "1, 2 and 3 only", "2 and 3 only", "1, 3 and 4 only"], "ans": 0, "sol": ["Step 1 — (1) Magnitude = √<span class=\"rad\">(Ax²+Ay²+Az²)<\/span> — axes ghumo par value same ✓ TRUE.", "Step 2 — (2) Components rotate ke saath BADALTE hain (Ax = A cosα naya α) ✗ FALSE.", "Step 3 — (3) 'Magnitude + direction = zaroori vector' — GALAT! Vector ko triangle/parallelogram law follow karna zaroori hai (e.g. current, time — direction hai lekin vector NAHI).", "Step 4 — (4) A·B = AB cosθ — geometric quantity, axes rotation mein invariant ✓ TRUE.", "Step 5 — Correct: 1 aur 4 only → option (A)."], "note": "Magnitude aur dot product invariant hain; components aur 'magnitude+direction' condition nahi.", "wrong": {"0": "2 aur 3 galat hain — B chuk jaoge.", "2": "1 aur 4 sahi hain — C sirf galat statements chunta.", "3": "2 aur 3 FALSE hain (components change; triangle law zaroori)."}}, {"n": 352, "type": "mcq", "topic": "vec3", "q": "A vector A = 3î + 4ĵ lying in the x-y plane is rotated anticlockwise about the origin through 90° without any change in its magnitude. The new vector is", "fig": "", "figcap": "", "opts": ["−4î + 3ĵ", "4î − 3ĵ", "−3î − 4ĵ", "3î − 4ĵ"], "ans": 0, "sol": ["Step 1 — 90° anticlockwise rotation: (x, y) → (−y, x).", "Step 2 — A = (3, 4) → (−4, 3).", "Step 3 — New vector = −4î + 3ĵ.", "Step 4 — Option (A).", "Step 5 — (Check: magnitude √<span class=\"rad\">(16+16)<\/span>... √<span class=\"rad\">(16+9)<\/span> = 5 same ✓, direction 90° pehle wale se aage ✓.)"], "note": "90° CCW: (x,y) → (−y, x). 90° CW: (x,y) → (y,−x).", "wrong": {"1": "(4, −3) — yeh 180° rotation + sign ya CW wala mix.", "2": "(−3, −4) — yeh 180° rotation hai.", "3": "(3, −4) — yeh mirror (x-axis flip) hai, rotation nahi."}}, {"n": 353, "type": "mcq", "topic": "cross", "q": "Which of the following is NOT correct?", "fig": "", "figcap": "", "opts": ["Two vectors of equal magnitude P inclined at 120° have a resultant of magnitude P", "The angle between A = î + ĵ and B = ĵ + k̂ is 60°", "A unit vector perpendicular to both A = î + ĵ + k̂ and B = î − ĵ + k̂ is (î − k̂)/√<span class=\"rad\">2<\/span>", "The scalar triple product A · (B × C) is zero whenever any two of the three vectors are mutually perpendicular"], "ans": 3, "sol": ["Step 1 — (A) Equal P at 120°: R = 2Pcos60° = P ✓ correct statement.", "Step 2 — (B) (î+ĵ)·(ĵ+k̂) = 1, |A| = |B| = √<span class=\"rad\">2<\/span> → cosθ = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">2<\/span><\/span> → 60° ✓ correct.", "Step 3 — (C) A×B = (2, 0, −2) → unit = (î−k̂)/√<span class=\"rad\">2<\/span> ✓ correct.", "Step 4 — (D) 'STP zero jab koi DO vectors mutually perpendicular' — GALAT! Perpendicularity STP zero nahi deti (e.g. î, ĵ, aur kisi bhi third vector — STP generally non-zero). Coplanarity chahiye.", "Step 5 — NOT correct = (D)."], "note": "STP = 0 iff coplanar — perpendicularity alone kaafi nahi.", "wrong": {"0": "R = P at 120° — sahi statement.", "1": "60° verified — sahi.", "3": "(î−k̂)/√<span class=\"rad\">2<\/span> verified — sahi."}}, {"n": 354, "type": "assertion", "topic": "comp", "q": "Assertion (A): For any vector A and any unit vector û, the identity A = (A · û)û + û × (A × û) holds. Reason (R): Any vector can be split into a component parallel to a chosen direction and a component perpendicular to that direction.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Identity check: û×(A×û) = A(û·û) − û(û·A) = A − (A·û)û.", "Step 2 — Toh (A·û)û + û×(A×û) = (A·û)û + A − (A·û)û = A ✓ Assertion TRUE.", "Step 3 — Reason: Koi bhi vector = parallel component + perpendicular component ✓ TRUE.", "Step 4 — (A·û)û = parallel part, û×(A×û) = perpendicular part — R exactly yahi identity explain karta hai.", "Step 5 — R correct explanation → option (A)."], "note": "A = A∥ + A⊥: A∥ = (A·û)û, A⊥ = û×(A×û). Vector identity (triple product se).", "wrong": {"1": "R correct explanation hai (identity hi decomposition hai).", "2": "R true hai (parallel+perpendicular split).", "3": "Assertion true hai (identity verified)."}}, {"n": 355, "type": "diagram", "topic": "kin2", "q": "Study the following data table described in words. For a particle moving in the x-y plane, the position coordinates (in metre) are: t = 0 s → (0, 0); t = 1 s → (2, 4); t = 2 s → (8, 8); t = 3 s → (18, 12). The data follow x = 2t² and y = 4t, with t in second. Taking √<span class=\"rad\">80<\/span> = 8.94, the magnitude of the instantaneous velocity at t = 2 s is", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>t (s)<\/th><th>x (m)<\/th><th>y (m)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>8<\/td><td>8<\/td><\/tr><tr><td>3<\/td><td>18<\/td><td>12<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">x = 2t², y = 4t → v = (4t, 4)<\/p><\/div>", "figcap": "Position data following x = 2t², y = 4t; speed at t = 2 s.", "opts": ["8.94 m/s", "8 m/s", "12 m/s", "10 m/s"], "ans": 0, "sol": ["Step 1 — x = 2t² → vx = <span class=\"fr\"><span class=\"fn\">dx<\/span><span class=\"fd\">dt<\/span><\/span> = 4t.", "Step 2 — y = 4t → vy = 4 (constant).", "Step 3 — t = 2 s: vx = 8 m/s, vy = 4 m/s.", "Step 4 — |v| = √<span class=\"rad\">(8² + 4²)<\/span> = √<span class=\"rad\">(64+16)<\/span> = √<span class=\"rad\">80<\/span> = 8.94 m/s.", "Step 5 — Option (A)."], "note": "Instantaneous velocity = (<span class=\"fr\"><span class=\"fn\">dx<\/span><span class=\"fd\">dt<\/span><\/span>, <span class=\"fr\"><span class=\"fn\">dy<\/span><span class=\"fd\">dt<\/span><\/span>) — derivative lo, magnitude nikalo.", "wrong": {"1": "8 = sirf vx — vy ghat gaya.", "2": "12 = 8+4? — magnitudes add nahi hote.", "3": "10 = 4t+...? — vx = 8, vy = 4, Pythagoras: 8.94."}}, {"n": 356, "type": "match", "topic": "dot", "q": "Match the Columns for two vectors, each of magnitude P, with 60° between them. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Magnitude of A + B<\/div><div class=\"colitem\">(b) Magnitude of A − B<\/div><div class=\"colitem\">(c) (A + B) · (A − B)<\/div><div class=\"colitem\">(d) Magnitude of A × B<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) P<\/div><div class=\"colitem\">(ii) zero<\/div><div class=\"colitem\">(iii) P√<span class=\"rad\">3<\/span><\/div><div class=\"colitem\">(iv) (<span class=\"fr\"><span class=\"fn\">√<span class=\"rad\">3<\/span><\/span><span class=\"fd\">2<\/span><\/span>)P²<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-i, c-ii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-iii, b-ii, c-i, d-iv", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "sol": ["Step 1 — Equal P, 60° between:", "Step 2 — (a) |A+B| = 2P cos30° = 2P(<span class=\"fr\"><span class=\"fn\">√<span class=\"rad\">3<\/span><\/span><span class=\"fd\">2<\/span><\/span>) = P√<span class=\"rad\">3<\/span> → (iii)", "Step 3 — (b) |A−B| = 2P sin30° = P → (i)", "Step 4 — (c) (A+B)·(A−B) = A² − B² = P² − P² = 0 → (ii)", "Step 5 — (d) |A×B| = P² sin60° = (<span class=\"fr\"><span class=\"fn\">√<span class=\"rad\">3<\/span><\/span><span class=\"fd\">2<\/span><\/span>)P² → (iv)", "Step 6 — Toh a-iii, b-i, c-ii, d-iv → option (A)."], "note": "60° equal vectors: sum P√<span class=\"rad\">3<\/span>, diff P, dot diff 0, cross (<span class=\"fr\"><span class=\"fn\">√<span class=\"rad\">3<\/span><\/span><span class=\"fd\">2<\/span><\/span>)P².", "wrong": {"1": "|A−B| = P (i) — P√<span class=\"rad\">3<\/span> (a) nahi.", "2": "c = 0 (ii) — P nahi.", "3": "(<span class=\"fr\"><span class=\"fn\">√<span class=\"rad\">3<\/span><\/span><span class=\"fd\">2<\/span><\/span>)P² (iv) — P nahi."}}, {"n": 357, "type": "mcq", "topic": "dot", "q": "The vectors A = (2t + 1)î + 3ĵ and B = î + (t − 2)ĵ are functions of time t (in second). The value of t at which they are mutually perpendicular is", "fig": "", "figcap": "", "opts": ["1 s", "2 s", "−1 s", "0.5 s"], "ans": 0, "sol": ["Step 1 — Perpendicular: A·B = 0.", "Step 2 — (2t+1)(1) + 3(t−2) = 0.", "Step 3 — 2t + 1 + 3t − 6 = 0 → 5t − 5 = 0.", "Step 4 — t = 1 s.", "Step 5 — Option (A).", "Step 6 — (Verify: t=1 → A = 3î+3ĵ, B = î−ĵ. A·B = 3−3 = 0 ✓.)"], "note": "A·B = 0 → t nikalo. Verify zaroor karo.", "wrong": {"1": "t = 2: A = 5î+3ĵ, B = î. A·B = 5 ≠ 0.", "2": "t = −1: A = −ĵ+3ĵ... A = −î+3ĵ, B = î−3ĵ. A·B = −1−9 = −10 ≠ 0.", "3": "t = 0.5: A = 2î+3ĵ, B = î−1.5ĵ. A·B = 2−4.5 = −2.5 ≠ 0."}}, {"n": 358, "type": "statement", "topic": "dot", "q": "Which of the following statements are correct? (1) If A · B = A · C and A is non-zero, then B = C. (2) If A × B = A × C and A is non-zero, then B = C. (3) If A · B = 0 and A × B = 0, then at least one of A and B is a null vector. (4) (A · B)² + (magnitude of A × B)² = A²B².", "fig": "", "figcap": "", "opts": ["1 and 2 only", "3 and 4 only", "1, 3 and 4 only", "2, 3 and 4 only"], "ans": 1, "sol": ["Step 1 — (1) A·B = A·C → A·(B−C) = 0 → B−C, A ke PERPENDICULAR — B = C zaroori NAHI ✗ FALSE.", "Step 2 — (2) A×B = A×C → A×(B−C) = 0 → B−C, A ke PARALLEL — B = C zaroori NAHI ✗ FALSE.", "Step 3 — (3) A·B = 0 AND A×B = 0 → cosθ = 0 AND sinθ = 0 ek saath possible NAHI (agar dono non-zero) → at least one null ✓ TRUE.", "Step 4 — (4) (A·B)² + |A×B|² = A²B²cos²θ + A²B²sin²θ = A²B² ✓ TRUE.", "Step 5 — Correct: 3 and 4 only → option (B)."], "note": "Dot/cross ki cancellation B = C nahi deti. Lagrange identity: (A·B)²+|A×B|² = A²B².", "wrong": {"0": "1 aur 2 DONO false hain — A galat.", "2": "1 FALSE hai (perpendicular difference).", "3": "2 FALSE hai (parallel difference)."}}, {"n": 359, "type": "mcq", "topic": "cross", "q": "Which of the following is NOT correct?", "fig": "", "figcap": "", "opts": ["The cross product of two polar vectors is an axial vector", "Under reflection of the coordinate axes, the scalar product of two vectors changes sign", "The vector product is distributive over addition but is not commutative", "The scalar triple product is invariant under cyclic permutation of the three vectors"], "ans": 1, "sol": ["Step 1 — (A) Polar × polar = axial (pseudovector) ✓ correct.", "Step 2 — (B) 'Reflection mein scalar product sign change' — GALAT! Polar-polar dot product reflection mein INVARIANT rehta hai. Cross product (axial) hi sign change karta hai.", "Step 3 — (C) Distributive but not commutative (A×B = −B×A) ✓ correct.", "Step 4 — (D) STP cyclic permutation mein invariant ✓ correct.", "Step 5 — NOT correct = (B)."], "note": "Reflection: polar vectors flip, axial don't. Dot (polar·polar) invariant; cross (polar×polar) flips.", "wrong": {"0": "Polar×polar = axial — sahi.", "3": "Cyclic invariant — sahi."}}, {"n": 360, "type": "assertion", "topic": "kin2", "q": "Assertion (A): A particle whose position vector is r = a(1 − cos ωt)î + a sin ωt ĵ moves on a circle of radius a whose centre is at the point (a, 0). Reason (R): The distance of the particle from the point (a, 0) remains constant and equal to a at all times.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — r = (a(1−cosωt), a sinωt).", "Step 2 — Distance from (a, 0): d² = (x−a)² + y² = (−a cosωt)² + (a sinωt)² = a²(cos²ωt + sin²ωt) = a².", "Step 3 — Constant distance a → circle radius a, centre (a, 0) ✓ Assertion TRUE.", "Step 4 — Reason: exactly yahi constant-distance property ✓ TRUE — wahi derivation.", "Step 5 — R correct explanation → option (A)."], "note": "r = a(1−cosωt)î + a sinωt ĵ: circle x²+y² = 2ax (centre (a,0), radius a).", "wrong": {"1": "R correct explanation hai (constant distance = circle ki definition).", "2": "R true hai (a² verified).", "3": "Assertion true hai."}}, {"n": 361, "type": "diagram", "topic": "nucm", "q": "Study the described graph. A graph of speed v (in m/s) versus time t (in s) for a particle is a straight line rising from v = 0 at t = 0 to v = 10 m/s at t = 5 s, so that v = 2t. The particle moves along a circular path of radius 2 m. Taking √<span class=\"rad\">1028<\/span> = 32.06, the magnitude of its net acceleration at t = 4 s is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 361\"><defs><marker id=\"m361\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt361\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr361\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L "><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 1<\/div><div class=\"colitem\">(ii) 2<\/div><div class=\"colitem\">(iii) 6<\/div><div class=\"colitem\">(iv) 12<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iv, b-iii, c-i, d-ii", "a-iii, b-iv, c-i, d-ii", "a-iv, b-i, c-iii, d-ii", "a-i, b-iii, c-iv, d-ii"], "ans": 0, "sol": ["Step 1 — (a) A·B = (1)(4) + (2)(−5) + (3)(6) = 4 − 10 + 18 = 12 → (iv)", "Step 2 — (b) |2î × 3ĵ| = 6|î×ĵ| = 6 → (iii)", "Step 3 — (c) î·(ĵ×k̂) = î·î = 1 → (i)", "Step 4 — (d) (î+ĵ)×(î−ĵ) = −(î×ĵ) − (ĵ×î) = −k̂ − k̂ = −2k̂ → magnitude 2 → (ii)", "Step 5 — Toh a-iv, b-iii, c-i, d-ii → option (A)."], "note": "Dot: 4−10+18 = 12. Cross: î×ĵ = k̂, (î+ĵ)×(î−ĵ) = −2k̂.", "wrong": {"1": "a-iii? — A·B = 12 (iv) hai.", "2": "b-i? — |2î×3ĵ| = 6 (iii).", "3": "c-iv? — î·(ĵ×k̂) = 1 (i)."}}, {"n": 363, "type": "statement", "topic": "triple", "q": "Consider the following statements. Statement I: The vectors A = î + 2ĵ + 3k̂, B = 2î + 3ĵ + 4k̂ and C = 3î + 4ĵ + 5k̂ are coplanar. Statement II: The scalar triple product of three coplanar vectors is zero.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — B×C = (3×5 − 4×4, 4×3 − 2×5, 2×4 − 3×3) = (−1, 2, −1).", "Step 2 — A·(B×C) = (1)(−1) + (2)(2) + (3)(−1) = −1 + 4 − 3 = 0.", "Step 3 — STP = 0 → coplanar ✓ Statement I TRUE.", "Step 4 — Statement II: Coplanar vectors ka STP zero ✓ TRUE (definition).", "Step 5 — Dono true → option (A).", "Step 6 — (Check: C − A = (2, 2, 2) = B − A... B−A = (1,1,1), C−A = (2,2,2) = 2(B−A) → collinear pairs → coplanar ✓.)"], "note": "STP = 0 iff coplanar. (B−A) aur (C−A) proportional → coplanar.", "wrong": {"1": "II definition hai — true.", "2": "I verified (STP = 0) — true.", "3": "Dono true hain."}}, {"n": 364, "type": "mcq", "topic": "dot", "q": "Two vectors A and B are such that the magnitude of (A + B) is 10 units and the magnitude of (A − B) is 6 units. The value of A · B is", "fig": "", "figcap": "", "opts": ["16", "32", "64", "8"], "ans": 0, "sol": ["Step 1 — |A+B|² = A² + B² + 2A·B = 100.", "Step 2 — |A−B|² = A² + B² − 2A·B = 36.", "Step 3 — Subtract: 4(A·B) = 64.", "Step 4 — A·B = 16.", "Step 5 — Option (A)."], "note": "|A+B|² − |A−B|² = 4(A·B) — standard trick.", "wrong": {"1": "32 = <span class=\"fr\"><span class=\"fn\">64<\/span><span class=\"fd\">2<\/span><\/span> — division galat (4A·B = 64).", "2": "64 = 4A·B — divide nahi kiya.", "3": "8 = <span class=\"fr\"><span class=\"fn\">64<\/span><span class=\"fd\">8<\/span><\/span>? — 4 se divide: 16."}}, {"n": 365, "type": "mcq", "topic": "comp", "q": "Which of the following is NOT correct for a vector A = Ax î + Ay ĵ confined to the x-y plane?", "fig": "", "figcap": "", "opts": ["Ax = A cos θ, where θ is the angle made by A with the +x axis", "Ay² = A² − Ax²", "The direction cosine of A with the z-axis is zero", "cos²α + cos²β = 1 holds only when A lies in the first quadrant"], "ans": 3, "sol": ["Step 1 — (A) Ax = A cosθ ✓ correct.", "Step 2 — (B) Ay² = A² − Ax² ✓ correct (Pythagoras).", "Step 3 — (C) z-axis ke saath direction cosine = <span class=\"fr\"><span class=\"fn\">Az<\/span><span class=\"fd\">A<\/span><\/span> = 0 ✓ correct.", "Step 4 — (D) 'cos²α+cos²β = 1 only first quadrant' — GALAT! 2D vector ke liye cos²α+cos²β = 1 HAMESHA (kisi bhi quadrant mein) — direction cosines ki definition se.", "Step 5 — NOT correct = (D)."], "note": "2D vector: cos²α+cos²β = 1 always (quadrant independent).", "wrong": {"0": "Ax = A cosθ — sahi.", "1": "Pythagoras — sahi.", "3": "Az = 0 → direction cosine zero — sahi."}}, {"n": 366, "type": "statement", "topic": "proj", "q": "Which of the following statements are correct for a projectile on level ground (air resistance neglected)? (1) The horizontal component of velocity remains constant. (2) The angular momentum about the point of projection changes at a constant rate. (3) The areal velocity about the point of projection is not constant. (4) The acceleration is constant in both magnitude and direction.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) vx = u cosθ constant ✓ TRUE.", "Step 2 — (2) L about projection: <span class=\"fr\"><span class=\"fn\">dL<\/span><span class=\"fd\">dt<\/span><\/span> = τ = r×(mg) = −mg(ux t) k̂ — t se depend, CONSTANT rate NAHI ✗ FALSE.", "Step 3 — (3) Areal velocity = <span class=\"fr\"><span class=\"fn\">L<\/span><span class=\"fd\">2m<\/span><\/span> — L change ho raha → not constant ✓ TRUE.", "Step 4 — (4) a = g constant (magnitude + direction) ✓ TRUE.", "Step 5 — Correct: 1, 3 and 4 only → option (B)."], "note": "Projectile: <span class=\"fr\"><span class=\"fn\">dL<\/span><span class=\"fd\">dt<\/span><\/span> = −mg ux t k̂ (varies) → areal velocity not constant.", "wrong": {"0": "2 FALSE hai (rate varies with t) — A chuk jaoge.", "2": "2 FALSE — torque t se badhta hai.", "3": "2 FALSE — constant rate nahi."}}, {"n": 367, "type": "mcq", "topic": "proji", "q": "A projectile is fired with speed u = 20 m/s at an angle θ = 60° with the horizontal from the foot of an inclined plane of inclination α = 30°. The range measured along the incline is given by R = 2u² cos θ sin(θ − α)/(g cos²α). Taking g = 10 m/s², cos 60° = 0.5, sin 30° = 0.5 and cos²30° = 0.75, the range along the incline is", "fig": "", "figcap": "", "opts": ["26.67 m", "40 m", "20 m", "13.33 m"], "ans": 0, "sol": ["Step 1 — R = 2u² cosθ sin(θ−α)/(g cos²α).", "Step 2 — = 2×400×0.5×sin30°/(10×0.75).", "Step 3 — = 2×400×0.5×0.<span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">7<\/span><\/span>.5 = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">7.5<\/span><\/span>.", "Step 4 — = 26.67 m.", "Step 5 — Option (A)."], "note": "Inclined plane range formula: R = 2u²cosθ·sin(θ−α)/(g cos²α).", "wrong": {"1": "40 = 2×20? — <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">7.5<\/span><\/span> = 26.67.", "2": "20 = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">10<\/span><\/span>? — cos²α = 0.75 divide karo.", "3": "13.33 = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">15<\/span><\/span> — 7.5 hai, 15 nahi."}}, {"n": 368, "type": "mcq", "topic": "proj", "q": "Which of the following is NOT correct for two projectiles fired with the same speed u at complementary angles θ and (90° − θ) on level ground?", "fig": "", "figcap": "", "opts": ["They have equal horizontal ranges", "They have equal times of flight", "The product of their maximum heights is <span class=\"fr\"><span class=\"fn\">R²<\/span><span class=\"fd\">16<\/span><\/span>, where R is the common range", "The product of their times of flight is 2u² sin 2θ/g²"], "ans": 1, "sol": ["Step 1 — (A) Equal ranges (complementary angles) ✓ correct.", "Step 2 — (B) 'Equal times of flight' — GALAT! T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> — θ aur 90°−θ ka T alag (sinθ ≠ cosθ, θ≠45°).", "Step 3 — (C) HA·HB = <span class=\"fr\"><span class=\"fn\">u⁴sin²θcos²θ<\/span><span class=\"fd\">4g²<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">(u²sin2θ/2g)²<\/span><span class=\"fd\">4<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">R²<\/span><span class=\"fd\">16<\/span><\/span> ✓ correct.", "Step 4 — (D) T1·T2 = 4u²sinθcosθ/g² = 2u²sin2θ/g² ✓ correct.", "Step 5 — NOT correct = (B)."], "note": "Complementary: R same, H ratio 1:3, T alag (sinθ vs cosθ).", "wrong": {"1": "R = R2 sahi — (A) correct hai.", "2": "<span class=\"fr\"><span class=\"fn\">R²<\/span><span class=\"fd\">16<\/span><\/span> product sahi — (C) correct hai.", "3": "2u²sin2θ/g² sahi — (D) correct hai."}}, {"n": 369, "type": "assertion", "topic": "proj", "q": "Assertion (A): For a projectile on leve rect for two particles moving with constant velocities? (1) Their relative velocity is constant. (2) The shortest separation between them occurs when the relative velocity is perpendicular to the relative position vector. (3) If they move with equal speeds, their relative velocity is zero. (4) Their relative acceleration is the vector difference of their accelerations.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Constant velocities → relative velocity constant ✓ TRUE.", "Step 2 — (2) Min separation jab <span class=\"fr\"><span class=\"fn\">d|r|²<\/span><span class=\"fd\">dt<\/span><\/span> = 2r·v<sub>rel<\/sub> = 0 → r ⊥ v<sub>rel<\/sub> ✓ TRUE.", "Step 3 — (3) 'Equal speeds → relative velocity zero' — GALAT! Directions alag ho to v<sub>rel<\/sub> non-zero (e.g. dono 10 m/s, 90° apart → 10√<span class=\"rad\">2<\/span>).", "Step 4 — (4) Relative acceleration = vector difference of accelerations ✓ TRUE (a<sub>rel<\/sub> = a₁ − a₂; yahan dono zero, par statement general correct hai).", "Step 5 — Correct: 1, 2 and 4 only → option (B)."], "note": "Min separation ⟺ r ⊥ v<sub>rel<\/sub>. Equal speeds ≠ zero relative velocity.", "wrong": {"0": "3 FALSE hai (directions matter) — A chuk jaoge.", "2": "3 FALSE — equal speed + different direction.", "3": "3 FALSE — example: 90° apart, 10√<span class=\"rad\">2<\/span> relative."}}, {"n": 380, "type": "mcq", "topic": "boat", "q": "A man can swim at 5 m/s in still water. He wishes to cross a river 200 m wide flowing at 3 m/s and reach the point on the other bank directly opposite his starting point. The time taken by him is", "fig": "", "figcap": "", "opts": ["50 s", "40 s", "66.7 s", "25 s"], "ans": 0, "sol": ["Step 1 — Zero drift: upstream component = current.", "Step 2 — v sinα = 3, v = 5 → sinα = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">5<\/span><\/span> → cosα = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">5<\/span><\/span>.", "Step 3 — Crossing speed (perpendicular) = v cosα = 5×(<span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">5<\/span><\/span>) = 4 m/s.", "Step 4 — t = d/(v cosα) = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">4<\/span><\/span> = 50 s.", "Step 5 — Option (A)."], "note": "Zero drift: t = <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">√<span class=\"rad\">(v²−u²)<\/span><\/span><\/span> = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">√<span class=\"rad\">(25−9)<\/span><\/span><\/span> = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">4<\/span><\/span> = 50 s.", "wrong": {"1": "40 = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">5<\/span><\/span> — yeh minimum time (⊥ row) ka hai, zero drift ka nahi.", "2": "66.7 = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">3<\/span><\/span> — current se divide nahi karo.", "3": "25 = <span class=\"fr\"><span class=\"fn\">200<\/span><span class=\"fd\">8<\/span><\/span>? — crossing speed 4 hai."}}, {"n": 381, "type": "mcq", "topic": "rel", "q": "Which of the following is NOT correct when rain falls vertically downward and a man runs horizontally?", "fig": "", "figcap": "", "opts": ["If rain falls at 10 m/s and the man runs at 10 m/s, the rain appears to fall at 45° with the vertical", "The velocity of rain relative to the man has a horizontal component equal and opposite to the velocity of the man", "If the man runs faster, the rain appears to fall more and more vertically", "The magnitude of the velocity of rain relative to the man increases as the man runs faster"], "ans": 2, "sol": ["Step 1 — Rain vertical: v<sub>rain<\/sub> = (0, −10) (example). Man: v<sub>man<\/sub> = (10, 0).", "Step 2 — (A) |v<sub>rel<\/sub>| = √<span class=\"rad\">(10²+10²)<\/span> = 10√<span class=\"rad\">2<\/span>, tan(angle with vertical) = <span class=\"fr\"><span class=\" =\"2.6\"/><text x=\"240.0\" y=\"60.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">slope = −2g = −20<\/text><line x1=\"190.0\" y1=\"95.0\" x2=\"190.0\" y2=\"170.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><line x1=\"190.0\" y1=\"95.0\" x2=\"60.0\" y2=\"95.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><circle cx=\"190.0\" cy=\"95.0\" r=\"4.5\" fill=\"#d9a441\"/><text x=\"206.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9a441\" font-weight=\"normal\">y = 10 m → v² = 200<\/text><text x=\"60.0\" y=\"186.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">0<\/text><text x=\"310.0\" y=\"186.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">20<\/text><\/svg>", "figcap": "v² vs y for vertical throw (u = 20 m/s): v² = 400 − 20y; half of max height → v = √200.", "opts": ["14.14 m/s", "10 m/s", "17.32 m/s", "20 m/s"], "ans": 0, "sol": ["Step 1 — v² = u² − 2gy = 400 − 20y (graph: slope −20, y-intercept 400).", "Step 2 — Max height: v² = 0 → y = 20 m.", "Step 3 — Half of max height: y = 10 m.", "Step 4 — v² = 400 − 20×10 = 400 − 200 = 200.", "Step 5 — v = √<span class=\"rad\">200<\/span> = 14.14 m/s.", "Step 6 — Option (A)."], "note": "v² vs y: straight line, slope = −2g. Half height → v² = <span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">2<\/span><\/span>.", "wrong": {"1": "10 = √<span class=\"rad\">100<\/span>? — v² = 200 hai.", "2": "17.32 = √<span class=\"rad\">300<\/span> — y = 5 m pe (<span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> height) wala value.", "3": "20 = initial speed — 10 m pe kam ho chuki hai."}}, {"n": 396, "type": "match", "topic": "ucm", "q": "Match the Columns. For a projectile on level ground, v = (u cos θ)î + (u sin θ − gt)ĵ and a = −gĵ. For uniform circular motion, r is measured from the centre. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) <span class=\"fr\"><span class=\"fn\">d(v²)<\/span><span class=\"fd\">dt<\/span><\/span> for a projectile at time t<\/div><div class=\"colitem\">(b) v · a for a projectile at time t<\/div><div class=\"colitem\">(c) r · v for uniform circular motion<\/div><div class=\"colitem\">(d) Magnitude of v × a for uniform circular motion<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) zero<\/div><div class=\"colitem\">(ii) <span class=\"fr\"><span class=\"fn\">v³<\/span><span class=\"fd\">R<\/span><\/span><\/div><div class=\"colitem\">(iii) −g(u sin θ − gt)<\/div><div class=\"colitem\">(iv) 2g²t − 2gu sin θ<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iv, b-iii, c-i, d-ii", "a-iii, b-iv, c-i, d-ii", "a-iv, b-i, c-iii, d-ii", "a-i, b-iii, c-iv, d-ii"], "ans": 0, "sol": ["Step 1 — Projectile: v = (u cosθ, u sinθ − gt), a = (0, −g).", "Step 2 — (a) <span class=\"fr\"><span class=\"fn\">d(v²)<\/span><span class=\"fd\">dt<\/span><\/span> = 2v·a = 2(−g)(u sinθ − gt) = 2g²t − 2gu sinθ → (iv).", "Step 3 — (b) v·a = −g(u sinθ − gt) → (iii).", "Step 4 — (c) UCM: r ⊥ v → r·v = 0 → (i).", "Step 5 — (d) |v×a| = v·(<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>) = <span class=\"fr\"><span class=\"fn\">v³<\/span><span class=\"fd\">R<\/span><\/span> → (ii).", "Step 6 — Toh a-iv, b-iii, c-i, d-ii → option (A)."], "note": "<span class=\"fr\"><span class=\"fn\">d(v²)<\/span><span class=\"fd\">dt<\/span><\/span> = 2v·a. UCM: r·v = 0, |v×a| = <span class=\"fr\"><span class=\"fn\">v³<\/span><span class=\"fd\">R<\/span><\/span>.", "wrong": {"1": "b-iii — 2g²t−2gu sinθ (a) nahi.", "2": "c-i (zero) — <span class=\"fr\"><span class=\"fn\">v³<\/span><span class=\"fd\">R<\/span><\/span> nahi.", "3": "a-iv — zero nahi."}}, {"n": 397, "type": "statement", "topic": "ucm", "q": "Which of the following statements are correct for a particle whose position vector is r = A cos ωt î + A sin ωt ĵ? (1) Its acceleration is always antiparallel to r. (2) The magnitude of its angular momentum about the origin is mωA². (3) Its areal velocity about the origin is <span class=\"fr\"><span class=\"fn\">ωA²<\/span><span class=\"fd\">2<\/span><\/span>. (4) Its jerk, that is the rate of change of acceleration, is parallel to its velocity.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — r = A(cosωt, sinωt): R = A, ω constant (UCM).", "Step 2 — (1) a = −ω²r → antiparallel to r ✓ TRUE.", "Step 3 — (2) |L| = mRv = mA·(ωA) = mωA² ✓ TRUE.", "Step 4 — (3) Areal velocity = <span class=\"fr\"><span class=\"fn\">L<\/span><span class=\"fd\">2m<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">ωA²<\/span><span class=\"fd\">2<\/span><\/span> ✓ TRUE.", "Step 5 — (4) 'Jerk, velocity ke PARALLEL' — GALAT! jerk = da/dt = −ω²v — velocity ke ANTIPARALLEL (opposite direction).", "Step 6 — Correct: 1, 2 and 3 only → option (A)."], "note": "UCM: jerk = −ω²v (anti-parallel to velocity — 'parallel' claim galat).", "wrong": {"0": "4 FALSE hai (jerk anti-parallel) — D chuk jaoge.", "2": "4 FALSE — direction opposite hai.", "3": "4 FALSE — −ω²v, not +ω²v."}}, {"n": 398, "type": "mcq", "topic": "nucm", "q": "A particle moves along a circle of radius R with speed v = v₀(1 + <span class=\"fr\"><span class=\"fn\">t<\/span><span class=\"fd\">τ<\/span><\/span>), where v₀ and τ are positive constants. Which of the following is NOT correct?", "fig": "", "figcap": "", "opts": ["Its tangential acceleration is v₀/τ", "Its centripetal acceleration at time t is <span class=\"fr\"><span class=\"fn\">v₀²(1 + <span class=\"fr\"><span class=\"fn\">t<\/span><span class=\"fd\">τ<\/span><\/span>)²<\/span><span class=\"fd\">R<\/span><\/span>", "The angle between its net acceleration and the radial direction is tan⁻¹[<span class=\"fr\"><span class=\"fn\">v₀R<\/span>< fn\">15<\/span><span class=\"fd\">3<\/span><\/span> = 5 m/s.", "Step 5 — Option (A)."], "note": "Avg velocity = |Δr|/Δt. 9-12-15 triangle.", "wrong": {"1": "15 = displacement — time se divide karo.", "2": "3 = √<span class=\"rad\">225<\/span>/50? — <span class=\"fr\"><span class=\"fn\">15<\/span><span class=\"fd\">3<\/span><\/span> = 5.", "3": "1.67 = <span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">3<\/span><\/span>? — inverted."}}, {"n": 407, "type": "mcq", "topic": "vec3", "q": "Three vertices of a triangle in three-dimensional space have position vectors a = î, b = 2ĵ and c = 3k̂. Taking √<span class=\"rad\">49<\/span> = 7, the area of the triangle is", "fig": "", "figcap": "", "opts": ["3.5 square units", "7 square units", "14 square units", "49 square units"], "ans": 0, "sol": ["Step 1 — Sides: b−a = (−1, 2, 0), c−a = (−1, 0, 3).", "Step 2 — (b−a)×(c−a) = (2×3 − 0×0, 0×(−1) − (−1)×3, (−1)×0 − 2×(−1)) = (6, 3, 2).", "Step 3 — |cross| = √<span class=\"rad\">(36 + 9 + 4)<\/span> = √<span class=\"rad\">49<\/span> = 7.", "Step 4 — Triangle area = ½ × 7 = 3.5 square units.", "Step 5 — Option (A)."], "note": "Triangle area = ½|(b−a)×(c−a)|. Parallelogram area = |cross|.", "wrong": {"1": "7 = parallelogram area — triangle ½ hai.", "2": "14 = 2×7 — double kiya.", "3": "49 = |cross|² — magnitude nahi."}}, {"n": 408, "type": "statement", "topic": "vec3", "q": "Consider the following statements. Statement I: If A + B + C = 0 and A, B, C are all unit vectors, then A · B + B · C + C · A = −<span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">2<\/span><\/span>. Statement II: For any three vectors, the square of the magnitude of A + B + C is A² + B² + C² + 2(A · B + B · C + C · A).", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — |A+B+C|² = A² + B² + C² + 2(A·B + B·C + C·A) ✓ Statement II TRUE (standard identity).", "Step 2 — A+B+C = 0 aur all unit: 0 = 3 + 2(A·B+B·C+C·A).", "Step 3 — A·B + B·C + C·A = −<span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">2<\/span><\/span> ✓ Statement I TRUE.", "Step 4 — Dono true → option (A)."], "note": "3 unit vectors sum zero (120° apart): pairwise dot sum = −<span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">2<\/span><\/span>.", "wrong": {"1": "I −<span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">2<\/span><\/span> verified — true.", "2": "II standard identity — true.", "3": "Dono true hain."}}, {"n": 409, "type": "mcq", "topic": "add", "q": "Which of the following is NOT correct for two unit vectors û and v̂?", "fig": "", "figcap": "", "opts": ["The magnitude of û + v̂ is less than or equal to 2", "û · v̂ = 1 implies û = v̂", "û × v̂ = 0 implies û = −v̂", "The magnitude of û − v̂ is less than or equal to 2"], "ans": 2, "sol": ["Step 1 — (A) |û+v̂| = 2cos(θ/2) ≤ 2 ✓ correct.", "Step 2 — (B) û·v̂ = 1 → cosθ = 1 → θ = 0 → û = v̂ ✓ correct.", "Step 3 — (C) 'û×v̂ = 0 → û = −v̂' — GALAT! sinθ = 0 → θ = 0° YA 180° → û = v̂ bhi possible. 'Imply −v̂' galat.", "Step 4 — (D) |û−v̂| = 2sin(θ/2) ≤ 2 ✓ correct.", "Step 5 — NOT correct = (C)."], "note": "û×v̂ = 0 → parallel (same ya opposite) — sirf −v̂ zaroori nahi.", "wrong": {"0": "≤ 2 — sahi.", "1": "θ = 0 — sahi.", "3": "≤ 2 — sahi."}}, {"n": 410, "type": "assertion", "topic": "triple", "q": "Assertion (A): For three non-coplanar vectors A, B and C, the scalar triple product A · (B × C) is non-zero. Reason (R): The magnitude of the scalar triple product equals the volume of the parallelepiped formed by the three vectors, which is non-zero for non-coplanar vectors.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Resultant, dono se chhota ho sakta hai (5 east + 4 west = 1) ✓ TRUE.", "Step 2 — (2) A+B = A−B → 2B = 0 → B null ✓ TRUE.", "Step 3 — (3) 'A+B aur A−B hamesha 90°' — GALAT! (A+B)·(A−B) = A²−B² — zero sirf jab |A| = |B|. Generally nahi.", "Step 4 — (4) A−B, B ke head se A ke head ki taraf ✓ TRUE (vector subtraction geometry).", "Step 5 — Correct: 1, 2 and 4 only → option (B)."], "note": "(A+B)·(A−B) = A²−B² — 90° only if equal magnitudes.", "wrong": {"0": "3 FALSE hai (equal magnitudes condition) — A chuk jaoge.", "2": "3 FALSE — A²−B² ≠ 0 generally.", "3": "3 FALSE — hamesha nahi."}}, {"n": 415, "type": "mcq", "topic": "comp", "q": "Which of the following is NOT correct about resolution of vectors?", "fig": "", "figcap": "", "opts": ["A vector can be resolved into components along two oblique directions", "The component of A along a unit vector n̂ is A · n̂", "If a vector is resolved along two non-perpendicular directions, the sum of the magnitudes of the components can exceed the magnitude of the vector", "The rectangular components of a vector are always positive"], "ans": 3, "sol": ["Step 1 — (A) Oblique directions mein resolve possible ✓ correct.", "Step 2 — (B) Component along n̂ = A·n̂ ✓ correct.", "Step 3 — (C) Non-perpendicular: component magnitudes ka sum > vector possible ✓ correct (e.g. 30°/150° decomposition).", "Step 4 — (D) 'Rectangular components hamesha positive' — GALAT! Quadrant pe depend (e.g. second quadrant: Ax negative, Ay positive).", "Step 5 — NOT correct = (D)."], "note": "Rectangular components signed hote hain — quadrant matter karta hai.", "wrong": {"0": "Oblique resolution — sahi.", "1": "A·n̂ — sahi.", "3": "Exceed possible — sahi."}}, {"n": 416, "type": "assertion", "topic": "triple", "q": "Assertion (A): If A, B and C are three mutually perpendicular unit vectors, then A · (B × C) is equal to +1 or −1. Reason (R): For three mutually perpendicular unit vectors, B × C is either A or −A.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Three mutually perpendicular unit vectors: B×C, A ke perpendicular, unit → B×C = ±A ✓ Reason TRUE.", "Step 2 — A·(B×C) = A·(±A) = ±1 ✓ Assertion TRUE.", "Step 3 — Sign orientation (right/left handed set) pe depend — R exactly yahi batata hai.", "Step 4 — R correct explanation → option (A)."], "note": "Mutually perpendicular unit vectors: STP = ±1 (handedness).", "wrong": {"1": "R correct explanation hai (B×C = ±A).", "2": "R true hai (±A).", "3": "Assertion true hai (±1)."}}, {"n": 417, "type": "mcq", "topic": "cross", "q": "For any two non-zero, non-parallel vectors A and B, the angle between (A + B) and (A × B) is", "fig": "", "figcap": "", "opts": ["90°", "0°", "45°", "dependent on the magnitudes of A and B"], "ans": 0, "sol": ["Step 1 — A×B, A aur B ke plane ke PERPENDICULAR hai.", "Step 2 — A+B, A aur B ke PLANE mein hai (linear combination).", "Step 3 — Plane ke perpendicular × plane ke andar ka vector → 90°.", "Step 4 — (A+B)·(A×B) = A·(A×B) + B·(A×B) = 0 + 0 = 0.", "Step 5 — Option (A) — 90°, hamesha."], "note": "(A+B)·(A×B) = 0 — A+B in-plane, A×B out-of-plane.", "wrong": {"1": "0° galat — perpendicular hain.", "2": "45° — nahi, hamesha 90°.", "3": "Magnitudes se independent — 90° fixed."}}, {"n": 418, "type": "match", "topic": "dot", "q": "Match the Columns for A = î + 2ĵ + 3k̂. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A · A<\/div><div class=\"colitem\">(b) Magnitude of A × A<\/div><div class=\"colitem\">(c) A · î<\/div><div class=\"colitem\">(d) Component of A along k̂<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Colu ween the two vectors", "A · B is maximum when θ = 0°", "A · B can be negative", "A · (B + C) = A · B + A · C holds only when B and C are mutually perpendicular"], "ans": 3, "sol": ["Step 1 — (A) A·B = AB cosθ ✓ correct.", "Step 2 — (B) θ = 0° pe max (AB) ✓ correct.", "Step 3 — (C) Obtuse angle pe negative ✓ correct.", "Step 4 — (D) 'Distributive ONLY when B⊥C' — GALAT! A·(B+C) = A·B + A·C HAMESHA (kisi bhi B, C ke liye).", "Step 5 — NOT correct = (D)."], "note": "Dot product distributive — always, no perpendicularity condition.", "wrong": {"0": "AB cosθ — sahi.", "1": "Max at 0° — sahi.", "3": "Can be negative — sahi."}}, {"n": 421, "type": "mcq", "topic": "proj", "q": "A projectile is fired with speed u at an angle θ with the horizontal on level ground. The magnitude of the change in its velocity between the point of projection and the highest point is", "fig": "", "figcap": "", "opts": ["u sin θ", "u cos θ", "u", "2u sin θ"], "ans": 0, "sol": ["Step 1 — v(0) = (u cosθ, u sinθ). Highest point: v = (u cosθ, 0).", "Step 2 — Δv = (0, −u sinθ).", "Step 3 — |Δv| = u sinθ.", "Step 4 — Option (A)."], "note": "Δv (launch→top) = vertical component ki change = u sinθ.", "wrong": {"1": "u cosθ = horizontal — unchanged hai.", "2": "u = speed — change alag hai.", "3": "2u sinθ = total Δv (launch→impact) — top tak nahi."}}, {"n": 422, "type": "statement", "topic": "proj", "q": "Which of the following statements are correct for a projectile at the highest point of its trajectory? (1) Its speed is minimum. (2) Its acceleration is g, vertically downward. (3) The rate of change of its speed is zero. (4) The radius of curvature of its trajectory is maximum at this point.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) Speed min at top (vy = 0, v = u cosθ) ✓ TRUE.", "Step 2 — (2) a = g vertically downward (hamesha) ✓ TRUE.", "Step 3 — (3) Rate of change of speed = 0 at top (v min, <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> = 0) ✓ TRUE.", "Step 4 — (4) 'Radius of curvature MAXIMUM at top' — GALAT! ρ = <span class=\"fr\"><span class=\"fn\">v³<\/span><span class=\"fd\">(gu cosθ)<\/span><\/span> — v min at top → ρ MINIMUM at top (<span class=\"fr\"><span class=\"fn\">u²cos²θ<\/span><span class=\"fd\">g<\/span><\/span>). Max launch/impact pe: <span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">(g cosθ)<\/span><\/span>.", "Step 5 — Correct: 1, 2 and 3 only → option (A)."], "note": "ρ(top) = <span class=\"fr\"><span class=\"fn\">u²cos²θ<\/span><span class=\"fd\">g<\/span><\/span> (MIN); ρ(launch) = <span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">(g cosθ)<\/span><\/span> (MAX). Trajectory top pe sabse tight.", "wrong": {"0": "4 FALSE hai (ρ min at top) — D chuk jaoge.", "1": "4 FALSE — v min → ρ min (ρ ∝ v³).", "3": "4 FALSE — max launch/impact pe hai."}}, {"n": 423, "type": "mcq", "topic": "proj", "q": "Which of the following is NOT correct for a projectile fired and landing on level ground, where H is the maximum height?", "fig": "", "figcap": "", "opts": ["The time of flight depends only on the vertical component of the initial velocity and on g", "The horizontal range equals the horizontal component of velocity multiplied by the time of flight", "The maximum height is attained at half of the horizontal range", "The product of the two times at which the projectile is at half of its maximum height is <span class=\"fr\"><span class=\"fn\">2H<\/span><span class=\"fd\">g<\/span><\/span>"], "ans": 3, "sol": ["Step 1 — (A) T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> — vertical component + g par depend ✓ correct.", "Step 2 — (B) R = u cosθ × T ✓ correct.", "Step 3 — (C) Max height at <span class=\"fr\"><span class=\"fn\">R<\/span><span class=\"fd\">2<\/span><\/span> (symmetry) ✓ correct.", "Step 4 — (D) 'Times at <span class=\"fr\"><span c n class=\"fn\">u²<\/span><span class=\"fd\">g<\/span><\/span> — sahi.", "1": "<span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">4g<\/span><\/span> — sahi.", "3": "90° between velocities — sahi."}}, {"n": 429, "type": "assertion", "topic": "proj", "q": "Assertion (A): The speed of a projectile at a given height is the same during ascent and descent. Reason (R): The horizontal component of velocity is constant, and the magnitude of the vertical component at a given height is the same during ascent and descent.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Same height pe: vx same (constant); |vy| same (vy² = vy0² − 2gy — square hai).", "Step 2 — v = √<span class=\"rad\">(vx² + vy²)<\/span> → same speed ascent/descent ✓ Assertion TRUE.", "Step 3 — Reason: exactly yahi components argument ✓ TRUE.", "Step 4 — R correct explanation → option (A)."], "note": "Same height: |vy| same (quadratic), vx same → v same.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (components).", "3": "Assertion true hai."}}, {"n": 430, "type": "mcq", "topic": "proj", "q": "A projectile fired with speed u at angle θ attains a maximum height H. If the acceleration due to gravity were doubled, with u and θ unchanged, the maximum height would become", "fig": "", "figcap": "", "opts": ["<span class=\"fr\"><span class=\"fn\">H<\/span><span class=\"fd\">2<\/span><\/span>", "H", "2H", "<span class=\"fr\"><span class=\"fn\">H<\/span><span class=\"fd\">4<\/span><\/span>"], "ans": 0, "sol": ["Step 1 — H = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> — H ∝ <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">g<\/span><\/span>.", "Step 2 — g doubled → H halved → <span class=\"fr\"><span class=\"fn\">H<\/span><span class=\"fd\">2<\/span><\/span>.", "Step 3 — Option (A)."], "note": "H ∝ <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">g<\/span><\/span>. g double → H half.", "wrong": {"1": "H same — g double hai.", "2": "2H — inverse relation ulta samjha.", "3": "<span class=\"fr\"><span class=\"fn\">H<\/span><span class=\"fd\">4<\/span><\/span> — g double hai, 4× nahi."}}, {"n": 431, "type": "statement", "topic": "proji", "q": "Which of the following statements are correct for a projectile fired on an inclined plane of inclination α? (1) The range up the inclined plane is maximum when the angle of projection with the horizontal is 45° + α/2. (2) For the same speed and the same angle with the horizontal, the range down the incline is greater than the range up the incline. (3) The trajectory is still a parabola. (4) For the same speed and the same angle with the horizontal, the time of flight up the incline equals the time of flight down the incline.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) Max range up incline at θ = 45° + α/2 ✓ TRUE.", "Step 2 — (2) Same u, same θ: down incline range > up incline ✓ TRUE (down mein zyada time + zyada distance).", "Step 3 — (3) Trajectory parabola (constant a) ✓ TRUE.", "Step 4 — (4) 'T<sub>up<\/sub> = T<sub>down<\/sub>' — GALAT! Down incline pe zyada time (flight lambi).", "Step 5 — Correct: 1, 2 and 3 only → option (A)."], "note": "Incline: R<sub>max<\/sub> at 45°+α/2; T<sub>down<\/sub> > T<sub>up<\/sub>.", "wrong": {"0": "4 FALSE hai (T<sub>down<\/sub> > T<sub>up<\/sub>) — D chuk jaoge.", "2": "4 FALSE — down flight lambi hai.", "3": "4 FALSE — times alag hain."}}, {"n": 432, "type": "match", "topic": "proj", "q": "Match the Columns for a projectile of mass 1 kg fired with u = 10 m/s at 60° with the horizontal (take g = 10 m/s², cos 60° = 0.5 and sin²60° = 0.75). <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Speed at the highest point<\/div><div class=\"colitem\">(b) Magnitude of acceleration at the highest point<\/div><div class=\"colitem\">(c) Maximum height<\/div><div class=\"colitem\">(d) Kinetic energy at the highest point<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 3.75 m<\/div><div class=\"colitem\">(ii) 5 m/s<\/div><div class=\"colitem\">(iii) 12.5 J<\/div><div class=\"colitem\">(iv) 10 m/s²<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-iv, c-i, d-iii", "a-iv, b-ii, c-i, d-iii", "a-ii, b-i, c-iv, d-iii", "a-iii, b-iv, c-i, d-ii"], "ans": 0, "sol": ["Step 1 — u = 10, θ = 60°, g = 10.", "Step 2 — (a) Speed at top = u cos60° = 10×0.5 = 5 m/s → (ii).", "Step 3 — (b) Acceleration at top = g = 10 m/s² → (iv).", "Step 4 — (c) H = <span class=\"fr\"><span class=\"fn\">u²sin²60°<\/span><span class=\"fd\">2g<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">100×0.75<\/span><span class=\"fd\">20<\/span><\/span> = 3.75 m → (i).", "Step 5 — (d) KE at top = ½mv<sub>top<\/sub>² = ½×1×25 = 12.5 J → (iii).", "Step 6 — Toh a-ii, b-iv, c-i, d-iii → option (A)."], "note": "Top: v = u cosθ, a = g. KE = ½m(u cosθ)².", "wrong": {"1": "b-iv (g) — 5 m/s nahi (yeh speed hai).", "2": "c-i (3.75 m) — 10 m/s² nahi.", "3": "d-iii (12.5 J) — 3.75 m nahi."}}, {"n": 433, "type": "diagram", "topic": "proj", "q": "Study the following data table described in words. For a projectile with u = 20 m/s and g = 10 m/s², the horizontal range R (in metre) at various angles of projection θ is: θ = 15° → 20; θ = 30° → 34.6; θ = 45° → 40; θ = 60° → 34.6; θ = 75° → 20. Which of the following conclusions is correct?", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>θ (°)<\/th><th>R (m)<\/th><\/tr><\/thead><tbody><tr><td>15<\/td><td>20<\/td><\/tr><tr><td>30<\/td><td>34.6<\/td><\/tr><tr><td>45<\/td><td>40<\/td><\/tr><tr><td>60<\/td><td>34.6<\/td><\/tr><tr><td>75<\/td><td>20<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">u = 20 m/s, g = 10: R = 40 sin2θ → R(θ) = R(90° − θ)<\/p><\/div>", "figcap": "Range at five angles — complementary symmetry.", "opts": ["R(θ) is equal to R(90° − θ)", "R increases continuously as θ increases from 0° to 90°", "R is maximum at θ = 60°", "R at 15° is one-fourth of R at 45°"], "ans": 0, "sol": ["Step 1 — Table: R(15°) = 20 = R(75°), R(30°) = 34.6 = R(60°).", "Step 2 — (A) R(θ) = R(90°−θ) ✓ sahi conclusion (symmetry).", "Step 3 — (B) R continuously increases — GALAT (45° pe max, phir kam).", "Step 4 — (C) Max at 60° — GALAT (45° pe 40, sabse zyada).", "Step 5 — (D) R(15°) = 20 = R(45°)/2, one-FOURTH NAHI (<span class=\"fr\"><span class=\"fn\">40<\/span><span class=\"fd\">4<\/span><\/span> = 10).", "Step 6 — Correct = (A)."], "note": "Complementary symmetry: R(θ) = R(90°−θ). Max at 45°.", "wrong": {"1": "R(45°) = 40 max — monotonically nahi.", "2": "40 > 34.6 — 45° max hai.", "3": "20 = <span class=\"fr\"><span class=\"fn\">40<\/span><span class=\"fd\">2<\/span><\/span> — half hai, quarter nahi."}}, {"n": 434, "type": "statement", "topic": "proj", "q": "Consider the following statements about the angular momentum of a projectile about the point of projection. Statement I: The angular momentum is zero at the highest point. Statement II: The angular momentum is non-zero at every instant after projection.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 2, "sol": ["Step 1 — L about projection point: L(0) = 0.", "Step 2 — <span class=\"fr\"><span class=\"fn\">dL<\/span><span class=\"fd\">dt<\/span><\/span> = τ = r×mg = −mg·ux·t k̂ (torque grows with t).", "Step 3 — L(t) = −<span class=\"fr\"><span class=\"fn\">(mg ux t²)<\/span><span class=\"fd\">2<\/span><\/span> — t > 0 pe NON-ZERO ✓ Statement II TRUE.", "Step 4 — Highest point: L = −<span class=\"fr\"><span class=\"fn\">mg ux t<sub>top<\/sub>²<\/span><span class=\"fd\">2<\/span><\/span> ≠ 0 (t<sub>top<\/sub> > 0) → Statement I (zero at top) FALSE.", "Step 5 — I false, II true → option (C)."], "note": "L about projection: <span class=\"fr\"><span class=\"fn\">dL<\/span><span class=\"fd\">dt<\/span><\/span> = −mgux t → L = −<span class=\"fr\"><span class=\"fn\">mguxt²<\/span><span class=\"fd\">2<\/span><\/span> ≠ 0 (top pe bhi).", "wrong": {"0": "II true hai (L non-zero) — B ulta.", "2": "I FALSE hai (top pe L ≠ 0) — A galat.", "3": "II true hai — D galat."}}, {"n": 435, "type": "mcq", "topic": "proj", "q": "Which of the following is NOT correct for a projectile fired and landing on level ground?", "fig": "", "figcap": "", "opts": ["The magnitude of the change in momentum over the complete flight is mgT, where T is the time of flight", "The impulse of the gravitational force over the complete flight is mgT, directed downward", "The work done by gravity over the complete flight is zero", "The work done by gravity during ascent is positive"], "ans": 3, "sol": ["Step 1 — (A) |Δp| = m|v<sub>f<\/sub> − v<sub>i<\/sub>| = m|(0, −2u sinθ)| = 2mu sinθ = mgT (T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span>) ✓ correct.", "Step 2 — (B) Impulse = F×T = mgT downward ✓ correct.", "Step 3 — (C) Same level start/end → gravity ki work = 0 ✓ correct.", "Step 4 — (D) 'Work by gravity during ascent positive' — GALAT! Ascent mein gravity neeche, displacement up → work NEGATIVE.", "Step 5 — NOT correct = (D)."], "note": "Gravity: ascent pe negative work, descent pe positive, total zero (same level).", "wrong": {"1": "mgT = 2mu sinθ verified — sahi.", "2": "Impulse mgT — sahi.", "3": "Total work zero — sahi."}}, {"n": 436, "type": "assertion", "topic": "proj", "q": "Assertion (A): A projectile fired from a horizontally moving vehicle has the same time of flight as one fired from stationary ground with the same vertical component of velocity. Reason (R): The horizontal velocity of the vehicle does not influence the vertical motion of the projectile.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Same vertical component of velocity → vertical motion identical → T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> same ✓ Assertion TRUE.", "Step 2 — Reason: Horizontal velocity, vertical motion ko affect nahi karta (independent components) ✓ TRUE.", "Step 3 — R exactly wahi explanation hai → correct explanation → option (A)."], "note": "Vertical motion independent: T sirf u sinθ aur g par.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (independence).", "3": "Assertion true hai."}}, {"n": 437, "type": "mcq", "topic": "rel", "q": "Rain is falling at 10 m/s at 30° with the vertical, tilted towards the east. A man walks due east at 5 m/s. Taking sin 30° = 0.5 and cos 30° = 0.866, the magnitude of the velocity of rain relative to the man is", "fig": "", "figcap": "", "opts": ["8.66 m/s", "5 m/s", "10 m/s", "11.18 m/s"], "ans": 0, "sol": ["Step 1 — Rain 10 m/s, 30° from vertical, east mein tilted: v<sub>rain<\/sub> = (10 sin30°, −10 cos30°) = (5, −8.66).", "Step 2 — Man: v<sub>man<\/sub> = (5, 0) (due east).", "Step 3 — v<sub>rel<\/sub> = v<sub>rain<\/sub> − v<sub>man<\/sub> = (5−5, −8.66) = (0, −8.66).", "Step 4 — |v<sub>rel<\/sub>| = 8.66 m/s (purely vertical!).", "Step 5 — Option (A)."], "note": "Man ki speed = rain ka horizontal component → relative purely vertical.", "wrong": {"1": "5 = sirf horizontal component cancel hua — vertical 8.66 bacha.", "2": "10 = rain ki speed — relative alag hai.", "3": "11.18 = √<span class=\"rad\">(100+25)<\/span>? — horizontal cancel ho gaya."}}, {"n": 438, "type": "statement", "topic": "rel", "q": "Which of the following statements are correct about relative motion? (1) If two particles move along two straight lines with constant velocities, the path of one as seen from the other is a straight line. (2) If two particles move on the same circle with the same constant angular speed, the magnitude of their relative velocity is constant. (3) A particle can appear stationary to an observer who is himself accelerating. (4) The magnitude of the relative velocity of two particles is always less than the sum of their speeds.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) Constant velocities → relative velocity constant → straight line relative path ✓ TRUE.", "Step 2 — (2) Same circle, same ω → separation angle constant → |v<sub>rel<\/sub>| = 2v sin(Δφ/2) constant ✓ TRUE.", "Step 3 — (3) Accelerating observer, particle ki velocity match karke, stationary dikha sakta hai ✓ TRUE.", "Step 4 — (4) 'Always LESS than sum of speeds' — GALAT! Triangle inequality |v₁−v₂| ≤ |v₁|+|v₂| — equality possible (ek rest pe: |v₁−0| = v₁ = sum).", "Step 5 — Correct: 1, 2 and 3 only → option (A)."], "note": "|v<sub>rel<\/sub>| ≤ sum of speeds — equality jab ek rest (strict 'less than' galat).", "wrong": {"0": "4 FALSE hai (equality case: ek particle rest) — D chuk jaoge.", "2": "4 FALSE — ≤ hai, < nahi.", "3": "4 FALSE — rest case equality."}}, {"n": 439, "type": "mcq", "topic": "boat", "q": "Which of the following is NOT correct for a boat of speed v in still water crossing a river of width d flowing with speed u?", "fig": "", "figcap": "", "opts": ["The minimum time to cross the river is <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span>", "Zero drift is possible only when v is greater than u", "When v is less than u, the boat can still cross in the minimum time <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span>, but with some drift", "When v is less than u, the minimum possible drift is zero"], "ans": 3, "sol": ["Step 1 — (A) Min time: boat ⊥ current → t = <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span> ✓ correct.", "Step 2 — (B) Zero drift only if v > u ✓ correct.", "Step 3 — (C) v < u: min time <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span> (⊥ row) with drift ✓ correct.", "Step 4 — (D) 'v < u pe minimum drift zero' — GALAT! Zero drift impossible (v < u); min drift non-zero hoti hai.", "Step 5 — NOT correct = (D)."], "note": "v < u: zero drift impossible; min drift = (u²−v²)·... (non-zero, d se related).", "wrong": {"0": "<span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span> min time — sahi.", "1": "v > u condition — sahi.", "3": "<span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span> with drift — sahi."}}, {"n": 440, "type": "assertion", "topic": "rel", "q": "Assertion (A): The shortest separation between two particles moving with constant velocities occurs at the instant when the line joining them is perpendicular to their relative velocity. Reason (R): At that instant the rate of change of their separation is zero.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Separation r(t) = r₀ + v<sub>rel<\/sub> t. |r|² min jab <span class=\"fr\"><span class=\"fn\">d|r|²<\/span><span class=\"fd\">dt<\/span><\/span> = 2r·v<sub>rel<\/sub> = 0 → r ⊥ v<sub>rel<\/sub> ✓ Assertion TRUE.", "Step 2 — Reason: Wahi instant pe d|sep|/dt = 0 (extremum condition) ✓ TRUE.", "Step 3 — R exactly wahi condition hai → correct explanation → option (A)."], "note": "Min separation ⟺ r ⊥ v<sub>rel<\/sub> ⟺ d|sep|/dt = 0.", "wrong": {"1": "R correct explanation hai (same condition).", "2": "R true hai (rate zero at min).", "3": "Assertion true hai."}}, {"n": 441, "type": "match", "topic": "rel", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Rain falling vertically at 4 m/s and a man walking horizontally at 3 m/s<\/div><div class=\"colitem\">(b) Two cars moving in the same direction at 20 m/s and 30 m/s<\/div><div class=\"colitem\">(c) Two cars moving in opposite directions at 20 m/s and 30 m/s<\/div><div class=\"colitem\">(d) A boat of speed 5 m/s aimed perpendicular to a river current of 3 m/s, giving the resultant speed relative to the ground<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 10 m/s<\/div><div class=\"colitem\">(ii) 5 m/s<\/div><div class=\"colitem\">(iii) √<span class=\"rad\">34<\/span> m/s<\/div><div class=\"colitem\">(iv) 50 m/s<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iv, d-iii", "a-ii, b-iv, c-i, d-iii", "a-iii, b-i, c-iv, d-ii"], "ans": 0, "sol": ["Step 1 — (a) Rain 4 ⊥ man 3: |v<sub>rel<\/sub>| = √<span class=\"rad\">(16+9)<\/span> = 5 → (ii).", "Step 2 — (b) Same direction 20 & 30: |v<sub>rel<\/sub>| = 10 → (i).", "Step 3 — (c) Opposite 20 & 30: |v<sub>rel<\/sub>| = 50 → (iv).", "Step 4 — (d) Boat 5 ⊥ current 3: |v| = √<span class=\"rad\">(25+9)<\/span> = √<span class=\"rad\">34<\/span> → (iii).", "Step 5 — Toh a-ii, b-i, c-iv, d-iii → option (A)."], "note": "Pythagoras (⊥), difference (same), sum (opposite).", "wrong": {"1": "b-i (10) — 5 nahi.", "2": "c-iv (50) — 10 nahi.", "3": "a-iii? — rain-man case 5 (ii) hai."}}, {"n": 442, "type": "diagram", "topic": "boat", "q": "Study the following data table described in words. A river is 100 m wide and flows at 2 m/s. A boat can move at 4 m/s in still water. Case 1: the boat is aimed perpendicular to the current; the recorded time of crossing is 25 s and the drift is 50 m. Case 2: the boat is aimed upstream at an angle so as to land at the point directly opposite; the recorded time of crossing is about 28.9 s and the drift is zero. Which of the following is correct?", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>case<\/th><th>aim<\/th><th>time (s)<\/th><th>drift (m)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>perpendicular to current<\/td><td>25<\/td><td>50<\/td><\/tr><tr><td>2<\/td><td>upstream (zero drift)<\/td><td>28.9<\/td><td>0<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">d = 100 m, u = 2 m/s, v = 4 m/s: t_min = d/v = 25 s; zero drift: d/√(v²−u²) = 100/√12 ≈ 28.9 s<\/p><\/div>", "figcap": "River crossing in two cases (recorded data).", "opts": ["The minimum time of crossing is 25 s", "The time of crossing with zero drift is 25 s", "The drift in Case 1 is 25 m", "The resultant speed of the boat in Case 1 is 6 m/s"], "ans": 0, "sol": ["Step 1 — d = 100 m, u = 2 m/s, v = 4 m/s.", "Step 2 — Case 1 (⊥ row): t = <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">100<\/span><span class=\"fd\">4<\/span><\/span> = 25 s; drift = u×t = 2×25 = 50 m ✓ matches.", "Step 3 — Case 2 (zero drift): v<sub>perp<\/sub> = √<span class=\"rad\">(v²−u²)<\/span> = √<span class=\"rad\">(16−4)<\/span> = √<span class=\"rad\">12<\/span> = 3.46 m/s → t = <span class=\"fr\"><span class=\"fn\">100<\/span><span class=\"fd\">3.46<\/span><\/span> = 28.9 s ✓ matches.", "Step 4 — (A) Min time = 25 s ✓ correct. (B) Zero-drift time 28.9 s, 25 NAHI. (C) Drift = 50 m, 25 NAHI. (D) Case 1 resultant = √<span class=\"rad\">(16+4)<\/span> = √<span class=\"rad\">20<\/span> ≈ 4.47 m/s, 6 NAHI.", "Step 5 — Correct = (A)."], "note": "Min time <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span> (+drift u·<span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">v<\/span><\/span>). Zero drift: <span class=\"fr\"><span class=\"fn\">d<\/span><span class=\"fd\">√<span class=\"rad\">(v²−u²)<\/span><\/span><\/span>.", "wrong": {"1": "Zero drift time = 28.9 s (slower crossing) — 25 nahi.", "2": "Drift = 50 m (2×25) — 25 nahi.", "3": "Resultant = √<span class=\"rad\">20<\/span> = 4.47 — 6 nahi (6 ho to v = 4, u = 2 same direction)."}}, {"n": 443, "type": "mcq", "topic": "ucm", "q": "A particle moves in a circle with constant speed v. The magnitude of the change in its velocity when it has turned through 60° is", "fig": "", "figcap": "", "opts": ["v", "2v", "v√<span class=\"rad\">2<\/span>", "v√<span class=\"rad\">3<\/span>"], "ans": 0, "sol": ["Step 1 — 60° turn: |Δv| = 2v sin(<span class=\"fr\"><span class=\"fn\">Δθ<\/span><span class=\"fd\">2<\/span><\/span>) = 2v sin30° = 2v×0.5 = v.", "Step 2 — Option (A)."], "note": "|Δv| = 2v sin(<span class=\"fr\"><span class=\"fn\">Δθ<\/span><span class=\"fd\">2<\/span><\/span>). 60° → v; 90° → v√<span class=\"rad\">2<\/span>; 180° → 2v.", "wrong": {"1": "2v = 180° turn ka value.", "2": "v√<span class=\"rad\">2<\/span> = 90° turn ka value.", "3": "v√<span class=\"rad\">3<\/span> = 120° turn ka value."}}, {"n": 444, "type": "statement", "topic": "ucm", "q": "Which of the following statements are correct for a particle in uniform circular motion of radius R and constant speed v? (1) The magnitude of displacement after half a revolution is 2R. (2) The distance travelled after half a revolution is πR. (3) The ratio of the magnitude of displacement to the distance after a quarter revolution is 2√<span class=\"rad\">2<\/span>/π. (4) The average speed over a quarter revolution is <span class=\"fr\"><span class=\"fn\">2v<\/span><span class=\"fd\">π<\/span><\/span>.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 o
