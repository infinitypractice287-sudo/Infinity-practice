><span class=\"fd\">R<\/span><\/span>, at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span>, a = √<span class=\"rad\">(ac² + at²)<\/span>.", "wrong": {"0": "Statement 1 sahi hai (speed change → ω change).", "1": "Statement 2 sahi hai (vector sum).", "3": "Statement 3 sahi hai (ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> instantaneously)."}}, {"n": 50, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["In uniform circular motion the angular velocity of the particle is constant", "In non-uniform circular motion the angular acceleration is non-zero", "In non-uniform circular motion the centripetal acceleration remains constant in magnitude", "Tangential acceleration is equal to the rate of change of speed"], "ans": 2, "sol": ["Step 1 — (A) UCM mein angular velocity constant ✓ correct statement.", "Step 2 — (B) Non-UCM mein angular acceleration non-zero ✓ correct (ω badalta hai, α = <span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span> ≠ 0).", "Step 3 — (C) 'Non-UCM mein centripetal acceleration magnitude CONSTANT' — GALAT! ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> aur v badalta hai → ac bhi badalti hai.", "Step 4 — (D) Tangential acceleration = rate of change of speed ✓ correct (at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span>).", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> — speed change hoti hai to ac bhi change karti hai (non-UCM).", "wrong": {"0": "UCM mein ω constant — sahi statement.", "1": "Non-UCM mein α ≠ 0 — sahi statement.", "3": "at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> — sahi statement."}}, {"n": 51, "type": "mcq", "topic": "scv", "q": "A vector A of magnitude 5 units points due east. It is multiplied by the real number −2. The resulting vector has", "fig": "", "figcap": "", "opts": ["magnitude 10 units, pointing due east", "magnitude 10 units, pointing due west", "magnitude 5 units, pointing due west", "magnitude −10 units, pointing due east"], "ans": 1, "sol": ["Step 1 — Vector A = 5 units due east. Isse real number −2 se multiply karo.", "Step 2 — Magnitude: |−2| × 5 = 10 units (magnitude hamesha non-negative).", "Step 3 — Direction: negative scalar se direction ULT (opposite) ho jati hai — east → WEST.", "Step 4 — Result: 10 units, due west → option (B)."], "note": "Negative scalar × vector → magnitude |λ|×A, direction opposite. Positive → same direction.", "wrong": {"0": "−2 se direction ulat jati hai — east nahi, WEST.", "2": "Magnitude 2×5 = 10 hota hai, 5 nahi (scalar 1 hai).", "3": "Magnitude negative nahi ho sakti — |−2×5| = 10."}}, {"n": 52, "type": "mcq", "topic": "vec3", "q": "Which one of the following is a unit vector?", "fig": "", "figcap": "", "opts": ["î + ĵ", "(î + ĵ)/√<span class=\"rad\">2<\/span>", "2î", "î − ĵ"], "ans": 1, "sol": ["Step 1 — Unit vector = magnitude exactly 1.", "Step 2 — (A) î + ĵ: magnitude = √<span class=\"rad\">(1+1)<\/span> = √<span class=\"rad\">2<\/span> ≠ 1 ✗.", "Step 3 — (B) (î + ĵ)/√<span class=\"rad\">2<\/span>: magnitude = √<span class=\"rad\">2<\/span>/√<span class=\"rad\">2<\/span> = 1 ✓.", "Step 4 — (C) 2î: magnitude 2 ✗.", "Step 5 — (D) î − ĵ: magnitude 2 ✗.", "Step 6 — Option (B). 45° direction wala unit vector (î+ĵ)/√<span class=\"rad\">2<\/span> hai."], "note": "Unit vector = A/|A|. |î+ĵ| = √<span class=\"rad\">2<\/span>, isliye (î+ĵ)/√<span class=\"rad\">2<\/span> unit hai.", "wrong": {"0": "|î+ĵ| = √<span class=\"rad\">2<\/span> ≈ 1.414 — 1 nahi.", "2": "|2î| = 2 — unit nahi.", "3": "|î−ĵ| = √<span class=\"rad\">2<\/span> — unit nahi."}}, {"n": 53, "type": "statement", "topic": "scv", "q": "Consider the following statements. Statement I: A null vector has zero magnitude and no definite direction. Statement II: Two vectors are equal only when they have equal magnitudes and the same direction.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Null vector ki magnitude zero hai, direction UNDEFINED (koi definite direction nahi) ✓ TRUE.", "Step 2 — Statement II: Do vectors equal tabhi jab magnitude equal AND direction SAME ho (initial point matter nahi karta) ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Null vector: magnitude 0, direction undefined. Equal vectors: same magnitude + same direction.", "wrong": {"1": "Direction same hona zaroori hai — Statement II sahi.", "2": "Null vector ki direction undefined hai — Statement I sahi.", "3": "Dono true hain."}}, {"n": 54, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["The position vector of a point P (x, y) in a plane is r = x î + y ĵ", "Displacement of a particle is the difference of its final and initial position vectors", "The magnitude of displacement is always equal to the distance travelled by the particle", "Average velocity of a particle in two dimensions is the displacement divided by the time interval"], "ans": 2, "sol": ["Step 1 — (A) r = x î + y ĵ — position vector ka standard form ✓ sahi.", "Step 2 — (B) Displacement = final − initial position vector ✓ sahi.", "Step 3 — (C) 'Magnitude of displacement HAMESHA distance ke barabar' — GALAT! sirf straight line (ek direction) motion mein barabar hota hai; curved path mein distance > |displacement|.", "Step 4 — (D) Average velocity = displacement/time ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "|displacement| ≤ distance — equality sirf straight-line motion mein.", "wrong": {"0": "Standard position vector form — sahi.", "1": "Displacement = r(f) − r(i) — sahi.", "3": "Average velocity definition — sahi."}}, {"n": 55, "type": "assertion", "topic": "scv", "q": "Assertion (A): A vector changes if it is rotated about its tail, even though its magnitude is kept unchanged. Reason (R): A vector is specified by both magnitude and direction, so a change in direction changes the vector.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Vector ko apne tail ke around rotate karo (magnitude same) → vector CHANGE hota hai? HAAN — direction badli, isliye naya vector ✓ TRUE.", "Step 2 — Reason: Vector = magnitude + direction; direction change = vector change ✓ TRUE.", "Step 3 — R exactly wahi reason hai → correct explanation.", "Step 4 — Option (A)."], "note": "Vector change = magnitude ya direction mein koi bhi badlav.", "wrong": {"1": "R correct explanation hai — direction change hi vector change hai.", "2": "R true hai (definition se).", "3": "Assertion true hai."}}, {"n": 56, "type": "match", "topic": "vec3", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Null vector<\/div><div class=\"colitem\">(b) Unit vector<\/div><div class=\"colitem\">(c) Equal vectors<\/div><div class=\"colitem\">(d) Negative of a vector A<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) magnitude one and no dimensions<\/div><div class=\"colitem\">(ii) zero magnitude<\/div><div class=\"colitem\">(iii) same magnitude and same direction<\/div><div class=\"colitem\">(iv) same magnitude but opposite direction<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iii, c-i, d-iv", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "sol": ["Step 1 — Definition match karo:", "Step 2 — (a) Null vector → zero magnitude → (ii)", "Step 3 — (b) Unit vector → magnitude 1, no dimensions/units → (i)", "Step 4 — (c) Equal vectors → same magnitude + same direction → (iii)", "Step 5 — (d) −A → same magnitude, opposite direction → (iv)", "Step 6 — Toh a-ii, b-i, c-iii, d-iv → option (A)."], "note": "Null: |v|=0. Unit: |v|=1. Equal: same |v| + same direction. −v: same |v|, opposite direction.", "wrong": {"1": "Unit vector ki magnitude 1 hai, zero nahi.", "2": "Equal vectors = same magnitude + direction — 'zero magnitude' galat.", "3": "−A ki magnitude same, direction opposite hai."}}, {"n": 57, "type": "mcq", "topic": "add", "q": "The magnitude of the resultant R of two vectors A and B with an angle θ between them is", "fig": "", "figcap": "", "opts": ["√<span class=\"rad\">(A² + B² + 2AB cos θ)<\/span>", "√<span class=\"rad\">(A² + B² − 2AB cos θ)<\/span>", "√<span class=\"rad\">(A² + B² + AB cos θ)<\/span>", "A + B cos θ"], "ans": 0, "sol": ["Step 1 — Resultant ka formula (parallelogram law se):", "Step 2 — R² = A² + B² + 2AB cosθ", "Step 3 — R = √<span class=\"rad\">(A² + B² + 2AB cosθ)<\/span>.", "Step 4 — Options check karo: (B) mein sign − hai (woh A−B ka hai), (C) coefficient galat, (D) adhoora.", "Step 5 — Option (A)."], "note": "R = √<span class=\"rad\">(A² + B² + 2AB cosθ)<\/span> — hamesha yaad rakho.", "wrong": {"1": "Minuss sign A − B ke liye hai — addition mein plus.", "2": "Coefficient 2AB hona chahiye, AB nahi.", "3": "A + B cosθ koi formula nahi — Pythagoras/parallelogram se derive karo."}}, {"n": 58, "type": "mcq", "topic": "proji", "q": "Two vectors, each of magnitude P, are inclined at 120° to each other. Taking cos 120° = −0.5, the magnitude of their resultant is", "fig": "", "figcap": "", "opts": ["P", "2P", "P√<span class=\"rad\">2<\/span>", "P√<span class=\"rad\">3<\/span>"], "ans": 0, "sol": ["Step 1 — Do vectors, each P, angle 120°.", "Step 2 — R = √<span class=\"rad\">(P² + P² + 2P² cos120°)<\/span>.", "Step 3 — cos120° = −0.5 (diya hai).", "Step 4 — = √<span class=\"rad\">(2P² + 2P²×(−0.5)<\/span>) = √<span class=\"rad\">(2P² − P²)<\/span> = √<span class=\"rad\">(P²)<\/span> = P.", "Step 5 — Resultant = P → option (A). Nice result: 120° pe resultant = each vector's magnitude."], "note": "Equal vectors 120° pe → resultant = same magnitude (P).", "wrong": {"1": "2P tab θ=0° (same direction) pe hota.", "2": "P√<span class=\"rad\">2<\/span> tab θ=90° pe hota.", "3": "P√<span class=\"rad\">3<\/span> tab θ=60° pe hota."}}, {"n": 59, "type": "statement", "topic": "add", "q": "Consider the following statements. Statement I: Vector addition is associative, that is (A + B) + C = A + (B + C). Statement II: The resultant of three or more vectors can be obtained by the polygon law of vector addition.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: (A+B)+C = A+(B+C) — associative law ✓ TRUE.", "Step 2 — Statement II: 3+ vectors ka resultant polygon law se milta hai (vectors ko head-to-tail chain karo, tail→head = resultant) ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Polygon law: head-to-tail chain, open tail se head tak = resultant. 3+ vectors ke liye.", "wrong": {"1": "Polygon law standard hai — Statement II sahi.", "2": "Associative law sahi — Statement I sahi.", "3": "Dono true hain."}}, {"n": 60, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["Subtraction of vectors is written as A − B = A + (−B)", "The angle α made by the resultant R with vector A is given by tan α = B sin θ / (A + B cos θ)", "For two perpendicular vectors of magnitudes 3 units and 4 units, the magnitude of A − B is 5 units", "Subtraction of vectors is commutative, that is A − B = B − A"], "ans": 3, "sol": ["Step 1 — (A) A − B = A + (−B) ✓ sahi definition.", "Step 2 — (B) tan α = B sinθ/(A + B cosθ) ✓ sahi (components se derive hota hai).", "Step 3 — (C) 3 aur 4 perpendicular: |A−B| = √<span class=\"rad\">(3²+4²)<\/span> = 5 ✓ sahi (perpendicular mein difference bhi Pythagoras se).", "Step 4 — (D) 'Subtraction commutative, A − B = B − A' — GALAT! A − B = −(B − A); generally A−B ≠ B−A.", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Vector subtraction ANTICOMMUTATIVE: A − B = −(B − A).", "wrong": {"0": "Standard definition — sahi.", "1": "Standard formula — sahi.", "2": "Perpendicular vectors ka difference bhi √<span class=\"rad\">(A²+B²)<\/span> — sahi."}}, {"n": 61, "type": "assertion", "topic": "add", "q": "Assertion (A): The resultant of two vectors of equal magnitude bisects the angle between them. Reason (R): Two vectors of equal magnitude are always mutually perpendicular to each other.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 2, "sol": ["Step 1 — Assertion: Equal magnitude vectors ka resultant unke beech ke angle ko BISECT karta hai? HAAN — parallelogram rhombus banta hai, jo diagonal angle bisect karta hai ✓ TRUE.", "Step 2 — Reason: 'Equal magnitude vectors HAMESHA mutually perpendicular hote hain' — GALAT! Angle kuch bhi ho sakta hai (0°, 60°, 120°…). ✗ R FALSE.", "Step 3 — A true, R false → option (C)."], "note": "Equal magnitudes → resultant bisects angle (rhombus diagonal). Perpendicularity koi zaroorat nahi.", "wrong": {"1": "Assertion true hai (resultant bisects) — 'A false' galat.", "2": "R TRUE nahi hai — equal magnitude vectors perpendicular nahi hone chahiye.", "3": "Assertion true hai — false mat bolo."}}, {"n": 62, "type": "diagram", "topic": "add", "q": "Study the described vector diagram. On a sheet of paper, an arrow A of length 10 units is drawn from a point O pointing due east, and an arrow B of length 10 units is also drawn from O pointing in a direction 120° anticlockwise from east, that is upwards and towards the west. Take cos 120° = −0.5. The magnitude of A + B is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 62\"><defs><marker id=\"m62\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt62\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr62\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg62\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"120.0\" y1=\"150.0\" x2=\"205.0\" y2=\"150.0\" stroke=\"#264653\" stroke-width=\"2.6\" marker-end=\"url(#m62)\"/><text x=\"152.0\" y=\"168.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">A = 10 (east)<\/text><line x1=\"120.0\" y1=\"150.0\" x2=\"77.5\" y2=\"76.4\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt62)\"/><text x=\"58.0\" y=\"68.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">B = 10<\/text><line x1=\"120.0\" y1=\"150.0\" x2=\"162.5\" y2=\"76.4\" stroke=\"#e76f51\" stroke-width=\"2\" stroke-dasharray=\"6 4\" marker-end=\"url(#mr62)\"/><text x=\"176.0\" y=\"106.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">A + B = ?<\/text><path d=\"M 148,150 A 28,28 0 0 0 106,125.6\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"1.4\"/><text x=\"140.0\" y=\"120.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"bold\">120°<\/text><circle cx=\"120.0\" cy=\"150.0\" r=\"4\" fill=\"#264653\"/><\/svg>", "figcap": "A = 10 east, B = 10 at 120° anticlockwise from east; find |A + B|.", "opts": ["10 units", "20 units", "10√<span class=\"rad\">3<\/span> units", "zero"], "ans": 0, "sol": ["Step 1 — A = 10 units due east (0°), B = 10 units, east se 120° anticlockwise (upar-west).", "Step 2 — Angle between = 120°. Equal magnitudes P = 10.", "Step 3 — R = √<span class=\"rad\">(10² + 10² + 2×10×10×cos120°)<\/span> = √<span class=\"rad\">(100 + 100 − 100)<\/span> = √<span class=\"rad\">100<\/span> = 10.", "Step 4 — Ya shortcut: equal vectors 120° pe → resultant = P = 10.", "Step 5 — Option (A)."], "note": "Equal vectors at 120° → resultant = P. Rhombus with 120° angle.", "wrong": {"1": "20 tab 0° (same direction) pe hota.", "2": "10√<span class=\"rad\">3<\/span> tab 60° pe hota.", "3": "Zero tab 180° (opposite) pe hota."}}, {"n": 63, "type": "match", "topic": "add", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Triangle law of addition<\/div><div class=\"colitem\">(b) Parallelogram law of addition<\/div><div class=\"colitem\">(c) Polygon law of addition<\/div><div class=\"colitem\">(d) Subtraction A − B<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) A + (−B)<\/div><div class=\"colitem\">(ii) two vectors are represented by two sides of a triangle taken in the same order<\/div><div class=\"colitem\">(iii) more than two vectors are represented by the sides of an open polygon taken in order<\/div><div class=\"colitem\">(iv) two vectors are represented by adjacent sides of a parallelogram drawn from a common point<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-iv, c-iii, d-i", "a-iv, b-ii, c-iii, d-i", "a-ii, b-iii, c-iv, d-i", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Har law ki description match karo:", "Step 2 — (a) Triangle law → 'two sides of a triangle taken in same order' → (ii)", "Step 3 — (b) Parallelogram law → 'adjacent sides of a parallelogram from common point' → (iv)", "Step 4 — (c) Polygon law → 'sides of an open polygon taken in order' → (iii)", "Step 5 — (d) Subtraction A − B → A + (−B) → (i)", "Step 6 — Toh a-ii, b-iv, c-iii, d-i → option (A)."], "note": "Triangle: 2 sides, same order. Parallelogram: adjacent sides. Polygon: 3+. Subtraction: + (−B).", "wrong": {"1": "Triangle law 2 sides ka hai, adjacent sides parallelogram ka.", "2": "Polygon law open polygon hai — '2 sides' galat.", "3": "Subtraction = A + (−B) — (i), (ii) nahi."}}, {"n": 64, "type": "mcq", "topic": "scv", "q": "A vector is expressed as A = 3î + 4ĵ. The magnitude of A is", "fig": "", "figcap": "", "opts": ["5 units", "7 units", "12 units", "1 unit"], "ans": 0, "sol": ["Step 1 — A = 3î + 4ĵ.", "Step 2 — |A| = √<span class=\"rad\">(3² + 4²)<\/span> = √<span class=\"rad\">(9 + 16)<\/span> = √<span class=\"rad\">25<\/span> = 5.", "Step 3 — Option (A) — 3-4-5 triangle wapas!"], "note": "|Aî + Bĵ| = √<span class=\"rad\">(A² + B²)<\/span>. 3-4-5 yaad rakho.", "wrong": {"1": "7 = 3+4 — magnitude add nahi hota (components perpendicular hain).", "2": "12 = 3×4 — multiplication se koi matlab nahi.", "3": "1 = 4−3 — yeh difference, magnitude nahi."}}, {"n": 65, "type": "statement", "topic": "ucm", "q": "Consider the following statements. Statement I: If Ax and Ay are the rectangular components of a vector, then tan θ = Ay / Ax, where θ is the angle made by the vector with the positive x-axis. Statement II: A unit vector has no physical dimensions and no units.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: tanθ = <span class=\"fr\"><span class=\"fn\">Ay<\/span><span class=\"fd\">Ax<\/span><\/span> — direction components ka ratio se milta hai ✓ TRUE (θ = tan⁻¹(<span class=\"fr\"><span class=\"fn\">Ay<\/span><span class=\"fd\">Ax<\/span><\/span>), quadrant dekhkar).", "Step 2 — Statement II: Unit vector dimensionless hai (A/|A| — units cancel) ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "tanθ = <span class=\"fr\"><span class=\"fn\">Ay<\/span><span class=\"fd\">Ax<\/span><\/span> (quadrant dhyan se). Unit vector dimensionless.", "wrong": {"1": "Unit vector dimensionless — Statement II sahi.", "2": "tanθ = <span class=\"fr\"><span class=\"fn\">Ay<\/span><span class=\"fd\">Ax<\/span><\/span> standard hai — Statement I sahi.", "3": "Dono true hain."}}, {"n": 66, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["For A = 6î + 8ĵ, the unit vector along A is 0.6î + 0.8ĵ", "The vectors 2î + 3ĵ and 4î + 6ĵ are parallel to each other", "The two rectangular components of a vector are independent of each other", "The x-component of a vector pointing along the y-axis is maximum"], "ans": 3, "sol": ["Step 1 — (A) A = 6î+8ĵ: |A| = 10 → unit = (6î+8ĵ)/10 = 0.6î+0.8ĵ ✓ sahi.", "Step 2 — (B) 2î+3ĵ aur 4î+6ĵ: (4î+6ĵ) = 2(2î+3ĵ) — scalar multiple → parallel ✓ sahi.", "Step 3 — (C) Components independent hain ✓ sahi.", "Step 4 — (D) 'Vector pointing along y-axis ka x-component MAXIMUM' — GALAT! Y-axis ke along x-component ZERO hoti hai (maximum toh x-axis ke along hoti).", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Vector y-axis par → x-component = 0 (zero, >x<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span> = 53°.", "2": "45° tan 1 hai — yahan <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span>.", "3": "60° tan √<span class=\"rad\">3<\/span> ≈ 1.732 — yahan <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span> ≈ 1.33."}}, {"n": 69, "type": "match", "topic": "scv", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A = 3î + 4ĵ<\/div><div class=\"colitem\">(b) A = 5î<\/div><div class=\"colitem\">(c) A = −5ĵ<\/div><div class=\"colitem\">(d) A = (î + ĵ)/√<span class=\"rad\">2<\/span><\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) magnitude 5, along +x direction<\/div><div class=\"colitem\">(ii) magnitude 5, along −y direction<\/div><div class=\"colitem\">(iii) magnitude 1, at 45° to the +x axis<\/div><div class=\"colitem\">(iv) magnitude 5, at 53° to the +x axis<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iv, b-i, c-ii, d-iii", "a-i, b-iv, c-ii, d-iii", "a-iv, b-ii, c-i, d-iii", "a-iii, b-i, c-ii, d-iv"], "ans": 0, "sol": ["Step 1 — Har vector ka magnitude + direction nikalo:", "Step 2 — (a) 3î+4ĵ: |A| = 5, tanθ = <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span> → 53° to +x → (iv)", "Step 3 — (b) 5î: magnitude 5, +x direction → (i)", "Step 4 — (c) −5ĵ: magnitude 5, −y direction → (ii)", "Step 5 — (d) (î+ĵ)/√<span class=\"rad\">2<\/span>: magnitude 1, 45° to +x → (iii)", "Step 6 — Toh a-iv, b-i, c-ii, d-iii → option (A)."], "note": "Magnitude √<span class=\"rad\">(x²+y²)<\/span>, direction tan⁻¹(<span class=\"fr\"><span class=\"fn\">y<\/span><span class=\"fd\">x<\/span><\/span>) with quadrant.", "wrong": {"1": "5î +x direction hai — (i), (iv) nahi.", "2": "−5ĵ −y direction hai — (ii), (i) nahi.", "3": "(î+ĵ)/√<span class=\"rad\">2<\/span> magnitude 1, 45° hai — (iii), (iv) nahi."}}, {"n": 70, "type": "mcq", "topic": "dot", "q": "If A = 2î + 3ĵ and B = 4î − 2ĵ, the value of A · B is", "fig": "", "figcap": "", "opts": ["2", "14", "−2", "10"], "ans": 0, "sol": ["Step 1 — A·B = Ax·Bx + Ay·By (component-wise multiplication + sum).", "Step 2 — Ax·Bx = 2 × 4 = 8.", "Step 3 — Ay·By = 3 × (−2) = −6.", "Step 4 — A·B = 8 + (−6) = 2.", "Step 5 — Option (A)."], "note": "Dot product component-wise: Σ Ai·Bi.", "wrong": {"1": "14 = 8+6 — sign ghat gayi (−6 minus hai).", "2": "−2 galat — 8−6 = +2 hai.", "3": "10 = 2×4+3×2? — By = −2 hai, sign dhyan se."}}, {"n": 71, "type": "statement", "topic": "dot", "q": "Consider the following statements. Statement I: The scalar product of two vectors is maximum when the two vectors are parallel. Statement II: The magnitude of the vector product of two vectors is maximum when the two vectors are mutually perpendicular.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: A·B = AB cosθ — max θ=0° (parallel) pe, = AB ✓ TRUE.", "Step 2 — Statement II: |A×B| = AB sinθ — max θ=90° (perpendicular) pe, = AB ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Dot max: parallel (cos=1). Cross max: perpendicular (sin=1).", "wrong": {"1": "Cross max perpendicular pe hota hai — Statement II sahi.", "2": "Dot max parallel pe hota hai — Statement I sahi.", "3": "Dono true hain."}}, {"n": 72, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["A · B = AB cos θ and the result is a scalar", "A × B = −(B × A)", "If A × B = 0 for two non-zero vectors, the two vectors must be perpendicular", "The direction of A × B is perpendicular to the plane containing A and B"], "ans": 2, "sol": ["Step 1 — (A) A·B = AB cosθ, scalar ✓ sahi.", "Step 2 — (B) A×B = −(B×A) ✓ sahi (anticommutative).", "Step 3 — (C) 'A×B = 0 for non-zero vectors → perpendicular' — GALAT! A×B = AB sinθ = 0 → sinθ = 0 → θ = 0°/180° → PARALLEL. Perpendicular pe cross MAX hota hai.", "Step 4 — (D) A×B plane ke perpendicular ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "A×B = 0 → parallel (θ=0°/180°). A·B = 0 → perpendicular (θ=90°). Mix-up common!", "wrong": {"0": "Sahi statement hai.", "1": "Anticommutative — sahi.", "3": "Direction perpendicular to plane — sahi."}}, {"n": 73, "type": "assertion", "topic": "cross", "q": "Assertion (A): Interchanging the order of the two vectors reverses the sign of their cross product. Reason (R): A × B = −(B × A), that is, the vector product is anticommutative.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Order palatne se cross product ka sign reverse hota hai ✓ TRUE.", "Step 2 — Reason: A×B = −(B×A), vector product anticommutative hai ✓ TRUE.", "Step 3 — R exactly wahi property hai jo Assertion batata hai → correct explanation.", "Step 4 — Option (A)."], "note": "A×B = −(B×A) — anticommutative (right-hand rule direction flip).", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (definition).", "3": "Assertion true hai."}}, {"n": 74, "type": "diagram", "topic": "cross", "q": "Study the described vector diagram. In an x-y plane, from a common origin O, vector A is an arrow of length 6 units along the positive x-axis and vector B is an arrow of length 8 units making 60° above the positive x-axis. Take sin 60° = 0.866. The magnitude of A × B is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 74\"><defs><marker id=\"m74\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt74\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr74\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg74\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"80.0\" y1=\"150.0\" x2=\"298.0\" y2=\"150.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"80.0\" y1=\"150.0\" x2=\"80.0\" y2=\"32.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"300.0\" y1=\"150.0\" x2=\"291.0\" y2=\"146.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"300.0\" y1=\"150.0\" x2=\"291.0\" y2=\"154.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"80.0\" y1=\"30.0\" x2=\"76.0\" y2=\"39.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"80.0\" y1=\"30.0\" x2=\"84.0\" y2=\"39.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><text x=\"304.0\" y=\"154.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">x<\/text><text x=\"74.0\" y=\"26.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">y<\/text><line x1=\"80.0\" y1=\"150.0\" x2=\"176.0\" y2=\"150.0\" stroke=\"#264653\" stroke-width=\"2.6\" marker-end=\"url(#m74)\"/><text x=\"128.0\" y=\"168.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">A = 6<\/text><line x1=\"80.0\" y1=\"150.0\" x2=\"144.0\" y2=\"39.2\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt74)\"/><text x=\"156.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">B = 8<\/text><path d=\"M 112,150 A 32,32 0 0 0 96,122.1\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"1.4\"/><text x=\"128.0\" y=\"136.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"bold\">60°<\/text><\/svg>", "figcap": "A = 6 along +x, B = 8 at 60°; find |A × B|.", "opts": ["24 square units", "48 square units", "41.6 square units", "zero"], "ans": 2, "sol": ["Step 1 — A = 6 units along +x, B = 8 units, 60° above +x.", "Step 2 — |A×B| = AB sinθ = 6 × 8 × sin60°.", "Step 3 — sin60° = 0.866 (diya hai).", "Step 4 — = 48 × 0.866 = 41.57 ≈ 41.6 square units.", "Step 5 — Option (C). Direction: +z (out of plane)."], "note": "|A×B| = AB sinθ — parallelogram area.", "wrong": {"0": "24 = 6×4? — sin60° = 0.866 hai, 0.5 nahi (woh cos hai).", "2": "48 = AB — yeh θ=90° (perpendicular) ka value hota.", "3": "Zero θ=0° (parallel) pe hota — yahan 60° hai."}}, {"n": 75, "type": "match", "topic": "cross", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A · B<\/div><div class=\"colitem\">(b) A × B<\/div><div class=\"colitem\">(c) A · A<\/div><div class=\"colitem\">(d) A × A<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) A²<\/div><div class=\"colitem\">(ii) a null vector<\/div><div class=\"colitem\">(iii) a scalar<\/div><div class=\"colitem\">(iv) a vector perpendicular to the plane containing A and B<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-iv, c-i, d-ii", "a-iv, b-iii, c-i, d-ii", "a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-ii, d-iv"], "ans": 0, "sol": ["Step 1 — Har quantity ka type match karo:", "Step 2 — (a) A·B → scalar (AB cosθ) → (iii)", "Step 3 — (b) A×B → vector, plane ke perpendicular → (iv)", "Step 4 — (c) A·A → A² (scalar) → (i)", "Step 5 — (d) A×A → zero vector (θ=0°, sin0°=0) → (ii)", "Step 6 — Toh a-iii, b-iv, c-i, d-ii → option (A)."], "note": "Dot → scalar. Cross → vector (⊥ plane). A×A = 0, A·A = A².", "wrong": {"1": "A·A = A² (scalar) — (i), (iii) nahi… wait: A·B scalar (iii), A·A = A² (i). Option (B) mein A·B ko (iv) diya — galat.", "2": "A×B vector (iv) hai, A² (i) nahi.", "3": "A×A zero (ii) hai, (iv) nahi."}}, {"n": 76, "type": "mcq", "topic": "proj", "q": "A projectile is fired with a speed of 20 m/s at an angle of 30° with the horizontal. Taking g = 10 m/s² and sin 30° = 0.5, its time of flight (landing at the same level) is", "fig": "", "figcap": "", "opts": ["1 s", "2 s", "3.46 s", "4 s"], "ans": 1, "sol": ["Step 1 — u = 20 m/s, θ = 30°, g = 10 m/s².", "Step 2 — Time of flight T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span>.", "Step 3 — sin30° = 0.5 (diya hai).", "Step 4 — T = 2 × 20 × 0.5 / 10 = <span class=\"fr\"><span class=\"fn\">20<\/span><span class=\"fd\">10<\/span><\/span> = 2 s.", "Step 5 — Option (B)."], "note": "T = <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span>. 30° → sin = 0.5, calculation easy.", "wrong": {"0": "1 s = ascent ka time (<span class=\"fr\"><span class=\"fn\">u sinθ<\/span><span class=\"fd\">g<\/span><\/span>) — poora flight double.", "2": "3.46 s = <span class=\"fr\"><span class=\"fn\">2×20×0.866<\/span><span class=\"fd\">10<\/span><\/span> — yeh 60° ka time hota.", "3": "4 s galat calculation — <span class=\"fr\"><span class=\"fn\">20<\/span><span class=\"fd\">10<\/span><\/span> = 2."}}, {"n": 77, "type": "mcq", "topic": "proj", "q": "For a given speed of projection u, the maximum horizontal range of a projectile landing at the same level is", "fig": "", "figcap": "", "opts": ["<span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">g<\/span><\/span>", "<span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">2g<\/span><\/span>", "<span class=\"fr\"><span class=\"fn\">2u²<\/span><span class=\"fd\">g<\/span><\/span>", "<span class=\"fr\"><span class=\"fn\">2u<\/span><span class=\"fd\">g<\/span><\/span>"], "ans": 0, "sol": ["Step 1 — R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span>. u fixed hai → R max jab sin2θ = 1 max ho.", "Step 2 — sin2θ = 1 → 2θ = 90° → θ = 45°.", "Step 3 — R<sub>max<\/sub> = <span class=\"fr\"><span class=\"fn\">u²×1<\/span><span class=\"fd\">g<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">g<\/span><\/span>.", "Step 4 — Option (A)."], "note": "Max range = <span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">g<\/span><\/span> at θ = 45°.", "wrong": {"1": "<span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">2g<\/span><\/span> = max HEIGHT at 45° (H<sub>max<\/sub> = <span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">4g<\/span><\/span> actually) — range ka formula nahi.", "2": "<span class=\"fr\"><span class=\"fn\">2u²<\/span><span class=\"fd\">g<\/span><\/span> — coefficient 2 galat.", "3": "<span class=\"fr\"><span class=\"fn\">2u<\/span><span class=\"fd\">g<\/span><\/span> units hi galat (m, not m²/s²… range ki units m chahiye)."}}, {"n": 78, "type": "statement", "topic": "proj", "q": "Consider the following statements about an oblique projectile. Statement I: At the highest point of the trajectory the speed of the projectile is minimum and is equal to u cos θ. Statement II: At the highest point of the trajectory the acceleration of the projectile is g, vertically downward.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Highest point pe speed MINIMUM — kyunki vy = 0, sirf vx = u cosθ bachta hai ✓ TRUE.", "Step 2 — Statement II: Highest point pe acceleration = g, vertically downward — gravity hamesha ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Top pe: v = u cosθ (min speed), a = g downward (constant).", "wrong": {"1": "a = g downward hamesha — Statement II sahi.", "2": "vy = 0 top pe → speed min — Statement I sahi.", "3": "Dono true hain."}}, {"n": 79, "type": "mcq", "topic": "proj", "q": "Which of the following is incorrect for projectile motion (air resistance neglected)?", "fig": "", "figcap": "", "opts": ["The equation of trajectory is y = x tan θ − <span class=\"fr\"><span class=\"fn\">gx²<\/span><span class=\"fd\">(2u² cos²θ)<\/span><\/span>", "The time taken to reach the maximum height is u sin θ/g", "At time t, the vertical component of velocity is u sin θ − gt", "The horizontal range of a projectile depends on the mass of the projectile"], "ans": 3, "sol": ["Step 1 — (A) Trajectory equation y = x tanθ − <span class=\"fr\"><span class=\"fn\">gx²<\/span><span class=\"fd\">(2u²cos²θ)<\/span><\/span> ✓ sahi.", "Step 2 — (B) Time to max height = <span class=\"fr\"><span class=\"fn\">u sinθ<\/span><span class=\"fd\">g<\/span><\/span> ✓ sahi.", "Step 3 — (C) vy(t) = u sinθ − gt ✓ sahi.", "Step 4 — (D) 'Range mass par depend karta hai' — GALAT! R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> mein mass nahi — sab objects same g se girete hain (vacuum).", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Range, height, time of flight — kisi bhi mass par depend nahi karte (air resistance neglect).", "wrong": {"0": "Standard trajectory equation — sahi.", "1": "Ascent time formula — sahi.", "2": "vy(t) kinematic — sahi."}}, {"n": 80, "type": "diagram", "topic": "proj", "q": "Study the described graph. For a projectile launched from level ground, the vertical component of velocity vy is plotted on the y-axis against time t on the x-axis. The graph is a straight line that starts at vy = +30 m/s at t = 0 s, falls linearly, crosses vy = 0 at t = 3 s, and reaches vy = −30 m/s at t = 6 s (take g = 10 m/s²). The time of flight of the projectile is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 80\"><defs><marker id=\"m80\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt80\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr80\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg80\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"70.0\" y1=\"100.0\" x2=\"278.0\" y2=\"100.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"100.0\" x2=\"70.0\" y2=\"32.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"280.0\" y1=\"100.0\" x2=\"271.0\" y2=\"96.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"280.0\" y1=\"100.0\" x2=\"271.0\" y2=\"104.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"66.0\" y2=\"39.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"74.0\" y2=\"39.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><text x=\"284.0\" y=\"104.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">t (s)<\/text><text x=\"64.0\" y=\"26.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">v_y<\/text><line x1=\"70.0\" y1=\"34.0\" x2=\"136.0\" y2=\"100.0\" stroke=\"#2a9d8f\" stroke-width=\"2.4\"/><line x1=\"136.0\" y1=\"100.0\" x2=\"202.0\" y2=\"166.0\" stroke=\"#2a9d8f\" stroke-width=\"2.4\"/><text x=\"60.0\" y=\"38.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">+30<\/text><text x=\"64.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">0<\/text><text x=\"60.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">−30<\/text><text x=\"70.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">0<\/text><text x=\"136.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">3<\/text><text x=\"202.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">6<\/text><line x1=\"136.0\" y1=\"100.0\" x2=\"136.0\" y2=\"30.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><line x1=\"70.0\" y1=\"34.0\" x2=\"280.0\" y2=\"34.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"240.0\" y=\"60.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">slope = −g<\/text><\/svg>", "figcap": "v_y vs t: +30 → 0 (t = 3 s) → −30 (t = 6 s). Time of flight = 6 s.", "opts": ["3 s", "6 s", "9 s", "12 s"], "ans": 1, "sol": ["Step 1 — Graph: vy t = 0 pe +30, t = 3 pe zero (top), t = 6 pe −30.", "Step 2 — Projectile same level pe tab wapas land karta jab vy initial jaisa (opposite sign) ho — yahan vy = −30 m/s at t = 6 s.", "Step 3 — Ya: T = 2 × (time to top) = 2 × 3 = 6 s.", "Step 4 — Time of flight = 6 s → option (B)."], "note": "vy-t graph: crossing of zero = top; return to initial vy (negative) = landing. T = 2t<sub>top<\/sub>.", "wrong": {"0": "3 s sirf ascent ka time hai — poora flight 6 s.", "2": "9 s galat — vy = −30 at 6 s hai, 9 s pe nahi.", "3": "12 s bilkul galat."}}, {"n": 81, "type": "statement", "topic": "proj", "q": "Consider the following statements. Statement I: Two projectiles fired with the same speed at angles 30° and 60° with the horizontal have equal horizontal ranges. Statement II: These two projectiles also attain equal maximum heights.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 1, "sol": ["Step 1 — Statement I: Same speed, 30° aur 60° — complementary angles (30+60 = 90) → same range R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> ✓ TRUE.", "Step 2 — Statement II: Equal max heights? H = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span>: H(30°) ∝ sin²30° = 0.25, H(60°) ∝ sin²60° = 0.75 — RATIO 1:3, equal NAHI ✗ FALSE.", "Step 3 — I true, II false → option (B)."], "note": "Complementary angles → same RANGE. Heights ka ratio sin²θ:sin²(90°−θ) = tan²θ (1:3 for <span class=\"fr\"><span class=\"fn\">30<\/span><span class=\"fd\">60<\/span><\/span>).", "wrong": {"1": "Heights 1:3 ratio mein hain — equal nahi (Statement II galat).", "2": "Range equal hai complementary angles pe — Statement I sahi.", "3": "I true, II false."}}, {"n": 82, "type": "mcq", "topic": "proji", "q": "A ball is projected horizontally from the top of a tower (air resistance neglected). Which of the following is incorrect?", "fig": "", "figcap": "", "opts": ["The time of flight depends only on the height of the tower and on g", "The horizontal distance covered depends on the speed of projection", "The vertical component of velocity after time t is gt downward", "The time of flight increases if the horizontal speed of projection is increased"], "ans": 3, "sol": ["Step 1 — Horizontal projection (tower se):", "Step 2 — (A) Time of flight = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span> — sirf height aur g par ✓ correct.", "Step 3 — (B) Horizontal distance = v×t — projection speed par depend ✓ correct.", "Step 4 — (C) vy after time t = gt downward ✓ correct.", "Step 5 — (D) 'Horizontal speed badhane se time of flight INCREASES' — GALAT! Time sirf height par depend karta hai — horizontal speed change se time NAHI badalta.", "Step 6 — Incorrect = (D).", "Step 7 — Isliye sahi answer: Option (D)."], "note": "Horizontal projection: T = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span> — horizontal speed se independent.", "wrong": {"0": "T = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span> — sahi.", "1": "x = v·T — sahi.", "2": "vy = gt — sahi."}}, {"n": 83, "type": "assertion", "topic": "proj", "q": "Assertion (A): The maximum height attained by a projectile does not depend on the mass of the projectile. Reason (R): The horizontal component of velocity of a projectile remains constant during its flight.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 1, "sol": ["Step 1 — Assertion: Max height mass se independent — H = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> mein mass nahi ✓ TRUE.", "Step 2 — Reason: 'Horizontal component of velocity flight mein constant rehta hai' — ✓ TRUE statement hai.", "Step 3 — Par R Assertion ki EXPLANATION NAHI hai — height mass-se-independent isliye hai kyunki gravity ki acceleration g har mass ke liye same hai (free fall mein mass cancel hota hai).", "Step 4 — Dono true, R not the correct explanation → option (B)."], "note": "Height/range mass-independent: g har mass ke liye same (F = ma mein m cancel).", "wrong": {"1": "R explanation hai — 'not the explanation' wala chuno.", "2": "R true hai (vx constant).", "3": "Assertion true hai."}}, {"n": 84, "type": "match", "topic": "proj", "q": "Match the Columns. For a projectile launched with u = 20 m/s at 45° to the horizontal (take g = 10 m/s², sin 45° = cos 45° = 0.707, sin 90° = 1): <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Horizontal range<\/div><div class=\"colitem\">(b) Maximum height<\/div><div class=\"colitem\">(c) Time of flight<\/div><div class=\"colitem\">(d) Speed at the highest point<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 10 m<\/div><div class=\"colitem\">(ii) 40 m<\/div><div class=\"colitem\">(iii) 2.8 s<\/div><div class=\"colitem\">(iv) 14.1 m/s<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iii, c-i, d-iv", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "sol": ["Step 1 — u = 20 m/s, θ = 45°, g = 10 m/s². Sab nikalo:", "Step 2 — (a) R = u²sin90°/g = <span class=\"fr\"><span class=\"fn\">400×1<\/span><span class=\"fd\">10<\/span><\/span> = 40 m → (ii)", "Step 3 — (b) H = <span class=\"fr\"><span class=\"fn\">u²sin²45°<\/span><span class=\"fd\">2g<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">400×0.5<\/span><span class=\"fd\">20<\/span><\/span> = 10 m → (i)", "Step 4 — (c) T = <span class=\"fr\"><span class=\"fn\">2×20×0.707<\/span><span class=\"fd\">10<\/span><\/span> = 2.828 ≈ 2.8 s → (iii)", "Step 5 — (d) Top pe speed = u cos45° = 20×0.707 = 14.1 m/s → (iv)", "Step 6 — Toh a-ii, b-i, c-iii, d-iv → option (A)."], "note": "45° projection: R = <span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">g<\/span><\/span>, H = <span class=\"fr\"><span class=\"fn\">u²<\/span><span class=\"fd\">4g<\/span><\/span>, T = <span class=\"fr\"><span class=\"fn\">√<span class=\"rad\">2<\/span>·u<\/span><span class=\"fd\">g<\/span><\/span>, top speed = <span class=\"fr\"><span class=\"fn\">u<\/span><span class=\"fd\">√<span class=\"rad\">2<\/span><\/span><\/span>.", "wrong": {"1": "H = 10 m hai — 40 range hai.", "2": "T = 2.8 s hai — 10 m height hai.", "3": "Top speed = 14.1 m/s — 2.8 s time hai."}}, {"n": 85, "type": "mcq", "topic": "rel", "q": "Car A moves due east at 20 m/s and car B moves due east at 12 m/s. The velocity of A relative to B is", "fig": "", "figcap": "", "opts": ["8 m/s due east", "8 m/s due west", "32 m/s due east", "32 m/s due west"], "ans": 0, "sol": ["Step 1 — Dono due east: vA = 20 m/s east, vB = 12 m/s east.", "Step 2 — vA relative to B = vA − vB = 20 − 12 = 8 m/s.", "Step 3 — Direction: east (A aage hai, B ko A aage ja raha dikhega).", "Step 4 — 8 m/s due east → option (A)."], "note": "Same direction: relative = difference, aage wali ki direction.", "wrong": {"1": "West tab hota jab B relative A maangta — direction ulat.", "2": "32 = 20+12 — opposite direction ka formula hai.", "3": "32 west — bilkul galat (sum bhi nahi)."}}, {"n": 86, "type": "statement", "topic": "boat", "q": "Consider the following statements about a boat crossing a flowing river. Statement I: The boat takes the minimum time to cross the river when it is rowed perpendicular to the direction of the river current, as seen from the water. Statement II: For the minimum time of crossing, the component of the boat's velocity perpendicular to the bank must be maximum.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Minimum crossing time — boat ko current ke PERPENDICULAR (water ke relative) row karo, taaki perpendicular component max ho ✓ TRUE.", "Step 2 — Statement II: Minimum time ke liye bank ke perpendicular component of boat velocity MAXIMUM hona chahiye — kyunki t = d/(v⊥) ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Min time: boat ⊥ current (water frame) → t<sub>min<\/sub> = d/v<sub>boat<\/sub>.", "wrong": {"1": "t = d/(v⊥) — perpendicular component max chahiye — Statement II sahi.", "2": "⊥ rowing min time deti hai — Statement I sahi.", "3": "Dono true hain."}}, {"n": 87, "type": "mcq", "topic": "rel", "q": "Which of the following is incorrect about relative velocity?", "fig": "", "figcap": "", "opts": ["Velocity of A relative to B is vA − vB", "vAB = −vBA", "Velocity of a body relative to itself is always zero", "Relative velocity of two bodies can be zero only when both the bodies are at rest"], "ans": 3, "sol": ["Step 1 — (A) vAB = vA − vB ✓ sahi.", "Step 2 — (B) vAB = −vBA ✓ sahi (symmetry).", "Step 3 — (C) Body apne relative to itself: v − v = 0 ✓ sahi.", "Step 4 — (D) 'Relative velocity zero ONLY jab dono at rest' — GALAT! Dono same velocity se chalte hain to relative zero (dono moving bhi ho sakte hain).", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Relative velocity zero: same velocity (rest ya both moving dono case).", "wrong": {"0": "Standard formula — sahi.", "1": "Symmetry property — sahi.", "2": "Self-relative zero — sahi."}}, {"n": 88, "type": "diagram", "topic": "boat", "q": "Study the described river-crossing diagram. A river flows due east with a speed of 3 m/s. A swimmer can swim at 4 m/s relative to still water and starts from the south bank, aiming to land at the point directly opposite on the north bank. In the vector diagram, his velocity relative to water is an arrow of length 4 pointing in an unknown direction, the current is an arrow of length 3 pointing due east, and the resultant velocity must point due north. Take sin 37° = 0.6 and sin 49° = 0.75. At what angle west of north must he aim?", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 88\"><defs><marker id=\"m88\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt88\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr88\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg88\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"30.0\" y1=\"55.0\" x2=\"310.0\" y2=\"55.0\" stroke=\"#d9cfbe\" stroke-width=\"2\"/><line x1=\"30.0\" y1=\"150.0\" x2=\"310.0\" y2=\"150.0\" stroke=\"#d9cfbe\" stroke-width=\"2\"/><line x1=\"60.0\" y1=\"102.0\" x2=\"120.0\" y2=\"102.0\" stroke=\"#7a8291\" stroke-width=\"2\" marker-end=\"url(#m88)\"/><text x=\"90.0\" y=\"92.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">current 3 m/s →<\/text><line x1=\"170.0\" y1=\"150.0\" x2=\"205.0\" y2=\"150.0\" stroke=\"#7a8291\" stroke-width=\"2.2\" marker-end=\"url(#m88)\"/><text x=\"214.0\" y=\"144.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#7a8291\" font-weight=\"normal\">3<\/text><line x1=\"170.0\" y1=\"150.0\" x2=\"95.0\" y2=\"83.8\" stroke=\"#2a9d8f\" stroke-width=\"2.6\" marker-end=\"url(#mt88)\"/><text x=\"78.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2a9d8f\" font-weight=\"normal\">4 (aim)<\/text><line x1=\"170.0\" y1=\"150.0\" x2=\"170.0\" y2=\"83.8\" stroke=\"#e76f51\" stroke-width=\"2.4\" stroke-dasharray=\"6 4\" marker-end=\"url(#mr88)\"/><text x=\"182.0\" y=\"112.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#e76f51\" font-weight=\"normal\">due north<\/text><path d=\"M 170,124 A 26,26 0 0 1 150.4,129.2\" fill=\"none\" stroke=\"#d9a441\" stroke-width=\"1.4\"/><text x=\"150.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"bold\">α ≈ 49°<\/text><circle cx=\"170.0\" cy=\"150.0\" r=\"4\" fill=\"#264653\"/><text x=\"60.0\" y=\"44.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a8291\" font-weight=\"normal\">north bank<\/text><text x=\"60.0\" y=\"168.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a8291\" font-weight=\"normal\">south bank<\/text><\/svg>", "figcap": "Swimmer aims upstream (α west of north): v sinα = 3, crossing component 4 m/s.", "opts": ["37° west of north", "49° west of north", "53° west of north", "90° west of north"], "ans": 1, "sol": ["Step 1 — Zero drift: resultant due north hona chahiye.", "Step 2 — Boat speed (water ke relative) = 4 m/s, current = 3 m/s east.", "Step 3 — Boat ko upstream (west of north) aim karna hai: upstream component = current = 3 m/s cancel kare.", "Step 4 — sinα = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> = 0.75 (α = angle west of north).", "Step 5 — sin49° = 0.75 (diya hai) → α = 49°.", "Step 6 — 49° west of north → option (B)."], "note": "Zero drift: aim upstream, sinα = v<sub>current<\/sub>/v<sub>boat<\/sub>.", "wrong": {"0": "37° sin = 0.6 — <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> = 0.75 nahi match.", "2": "53° sin = 0.8 — 0.75 nahi.", "3": "90° = directly west — toh north component zero, cross nahi hoga."}}, {"n": 89, "type": "match", "topic": "scv", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A moves due east at 30 m/s and B due east at 20 m/s<\/div><div class=\"colitem\">(b) A moves due east at 30 m/s and B due west at 20 m/s<\/div><div class=\"colitem\">(c) A moves due north at 30 m/s and B due east at 40 m/s<\/div><div class=\"colitem\">(d) A and B move with exactly the same velocity<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) zero<\/div><div class=\"colitem\">(ii) 10 m/s due east<\/div><div class=\"colitem\">(iii) 50 m/s due east<\/div><div class=\"colitem\">(iv) 50 m/s towards north-west<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-iii, c-iv, d-i", "a-iii, b-ii, c-iv, d-i", "a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Relative velocity = vA − vB nikalo (vectors):", "Step 2 — (a) Dono east: 30 − 20 = 10 m/s due east → (ii)", "Step 3 — (b) East + west (opposite): 30 + 20 = 50 m/s due east (A ki direction) → (iii)", "Step 4 — (c) A north 30, B east 40: vA−vB = (−40, 30) → magnitude 50, direction north-west → (iv)", "Step 5 — (d) Same velocity → zero → (i)", "Step 6 — Toh a-ii, b-iii, c-iv, d-i → option (A)."], "note": "Same direction: difference. Opposite: sum. Perpendicular: Pythagoras.", "wrong": {"1": "Opposite directions mein SUM (50 east) — 10 galat.", "2": "Perpendicular case 50 northwest — 50 east nahi.", "3": "Same velocity → 0 — 50 northwest galat."}}, {"n": 90, "type": "mcq", "topic": "ucm", "q": "A particle moves on a circle of radius 0.5 m with a uniform speed of 2 m/s. Its angular speed is", "fig": "", "figcap": "", "opts": ["1 rad/s", "2 rad/s", "4 rad/s", "8 rad/s"], "ans": 2, "sol": ["Step 1 — ω = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">R<\/span><\/span> (arc relation: v = Rω).", "Step 2 — v = 2 m/s, R = 0.5 m.", "Step 3 — ω = <span class=\"fr\"><span class=\"fn\">2<\/span><span class=\"fd\">0.5<\/span><\/span> = 4 rad/s.", "Step 4 — Option (C)."], "note": "ω = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">R<\/span><\/span> = 2π/T = 2πν.", "wrong": {"0": "1 rad/s = <span class=\"fr\"><span class=\"fn\">v<\/span><span class=\"fd\">(4R)<\/span><\/span>? — galat calculation; <span class=\"fr\"><span class=\"fn\">2<\/span><span class=\"fd\">0.5<\/span><\/span> = 4.", "1": "2 = v — R se divide nahi kiya.", "3": "8 = v×R? — multiplication galat, division hai."}}, {"n": 91, "type": "statement", "topic": "ucm", "q": "Consider the following statements about uniform circular motion. Statement I: The angular velocity of the particle is constant in both magnitude and direction. Statement II: The linear velocity vector of the particle is constant throughout the motion.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 1, "sol": ["Step 1 — Statement I: UCM mein angular velocity (magnitude ω AND direction axis ki taraf) constant ✓ TRUE.", "Step 2 — Statement II: Linear velocity vector constant — GALAT! Direction hamesha badalti hai (tangent). ✗", "Step 3 — I true, II false → option (B)."], "note": "UCM: ω constant (vector bhi, axis fixed); linear v not constant.", "wrong": {"1": "Direction change hoti hai — Statement II galat.", "2": "ω constant hai — Statement I sahi.", "3": "I true, II false."}}, {"n": 92, "type": "mcq", "topic": "ucm", "q": "Which of the following is incorrect for uniform circular motion?", "fig": "", "figcap": "", "opts": ["Angular speed ω = 2π/T", "Frequency ν = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">T<\/span><\/span>", "Centripetal acceleration is ω²R directed towards the centre", "The time period T is directly proportional to the frequency ν"], "ans": 3, "sol": ["Step 1 — (A) ω = 2π/T ✓ sahi.", "Step 2 — (B) ν = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">T<\/span><\/span> ✓ sahi.", "Step 3 — (C) a = ω²R towards centre ✓ sahi.", "Step 4 — (D) 'T directly proportional to ν' — GALAT! T = 1/ν — INVERSELY proportional.", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "T = 1/ν — inversely proportional. ω = 2πν.", "wrong": {"0": "ω = 2π/T — sahi.", "1": "ν = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">T<\/span><\/span> — sahi.", "2": "a = ω²R = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> — sahi."}}, {"n": 93, "type": "diagram", "topic": "ucm", "q": "Study the following data table described in words. For a particle in uniform circular motion, the angular position θ (in radian) is recorded as: t = 0 s → θ = 0 rad; t = 1 s → θ = 2 rad; t = 2 s → θ = 4 rad; t = 3 s → θ = 6 rad. Taking π = 3.14, the time period of the motion is", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>t (s)<\/th><th>θ (rad)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>4<\/td><\/tr><tr><td>3<\/td><td>6<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">θ = 2t → ω = 2 rad/s (uniform circular motion)<\/p><\/div><div class=\"figsub\"><svg class=\"fig\" viewBox=\"0 0 170 185\" role=\"img\" aria-label=\"Diagram for question 93\"><defs><marker id=\"m93\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt93\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr93\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg93\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><path d=\"M143.0,85.0 L131.9,50.9 L102.9,29.8 L67.1,29.8 L38.1,50.9 L27.0,85.0 L38.1,119.1 L67.1,140.2 L102.9,140.2 L131.9,119.1 L143.0,85.0\" fill=\"none\" stroke=\"#d9cfbe\" stroke-width=\"1.6\"/><circle cx=\"85.0\" cy=\"85.0\" r=\"3\" fill=\"#264653\"/><circle r=\"5\" fill=\"#2a9d8f\"><animateMotion dur=\"3.14s\" repeatCount=\"indefinite\" path=\"M 85.0,85.0 m 58.0,0 a 58.0,58.0 0 1,1 -116.0,0 a 58.0,58.0 0 1,1 116.0,0\"/><\/circle><text x=\"85.0\" y=\"172.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">ω = 2 rad/s<\/text><\/svg><\/div>", "figcap": "Angular position grows linearly: uniform circular motion, ω = 2 rad/s.", "opts": ["1.57 s", "3.14 s", "6.28 s", "2 s"], "ans": 1, "sol": ["Step 1 — Table: t = 0→θ=0, 1→2, 2→4, 3→6 rad.", "Step 2 — Pattern: θ = 2t — linear in t.", "Step 3 — Angular speed ω = <span class=\"fr\"><span class=\"fn\">dθ<\/span><span class=\"fd\">dt<\/span><\/span> = 2 rad/s (constant).", "Step 4 — Time period T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span> = 2π/2 = π rad… T = 2π/2 = π ≈ 3.14 s.", "Step 5 — Option (B)."], "note": "ω = 2π/T. θ = ωt se ω nikalo, phir T.", "wrong": {"0": "1.57 = <span class=\"fr\"><span class=\"fn\">π<\/span><span class=\"fd\">2<\/span><\/span> — yeh ω/2 wala galat.", "2": "6.28 = 2π — T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span> = π hai, 2π nahi.", "3": "2 s = θ(1s) — yeh angle hai, period nahi."}}, {"n": 94, "type": "statement", "topic": "ucm", "q": "Consider the following statements. Statement I: The acceleration vector of a particle in uniform circular motion, averaged over one complete cycle, is a null vector. Statement II: The velocity vector of a particle at any point of a circular path is along the tangent to the path at that point.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: One complete cycle mein acceleration vector ka average NULL — kyunki direction har direction leke aati hai, symmetrically cancel ✓ TRUE.", "Step 2 — Statement II: Velocity har point par TANGENT ki direction mein ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "UCM: v tangent; average acceleration (full cycle) = 0 (symmetric directions).", "wrong": {"1": "Full cycle mein acceleration average zero — Statement I sahi.", "2": "v tangent — standard — Statement II sahi.", "3": "Dono true hain."}}, {"n": 95, "type": "mcq", "topic": "ucm", "q": "Which of the following statements about uniform circular motion is NOT correct?", "fig": "", "figcap": "", "opts": ["The centripetal acceleration has constant magnitude <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>", "The direction of the centripetal acceleration changes from point to point on the circle", "The angular displacement in one complete revolution is 2π radian", "The average velocity of the particle over one complete revolution is <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">T<\/span><\/span>"], "ans": 3, "sol": ["Step 1 — (A) |ac| = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> constant ✓ correct.", "Step 2 — (B) ac ka direction point-to-point change (hamesha center ki taraf) ✓ correct.", "Step 3 — (C) One revolution mein angular displacement 2π rad ✓ correct.", "Step 4 — (D) 'Average velocity over one revolution = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">T<\/span><\/span>' — GALAT! Displacement = 0 (wahi point par wapas) → average velocity = 0. <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">T<\/span><\/span> = AVERAGE SPEED hai.", "Step 5 — Not correct = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Full revolution: displacement 0 → avg velocity 0; distance 2πR → avg speed v.", "wrong": {"0": "<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> constant — sahi.", "1": "Direction changes — sahi.", "2": "2π rad/revolution — sahi."}}, {"n": 96, "type": "assertion", "topic": "ucm", "q": "Assertion (A): A particle in uniform circular motion with speed v on a circle of radius R covers a distance 2πR in one time period. Reason (R): For a constant speed v, the time period T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> is independent of the radius R.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 2, "sol": ["Step 1 — Assertion: One time period mein distance 2πR — circle ka perimeter ✓ TRUE (constant speed v, time T: distance = vT = v×<span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> = 2πR).", "Step 2 — Reason: 'T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> is independent of radius R' — CHECK: T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span>, fixed v ke liye T ∝ R — R double karo to T double. So T DEPENDS on R ✗ R FALSE.", "Step 3 — A true, R false → option (C)."], "note": "T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> — fixed speed pe T ∝ R (radius badhe to period badhe).", "wrong": {"0": "R FALSE hai (T = <span class=\"fr\"><span class=\"fn\">2πR<\/span><span class=\"fd\">v<\/span><\/span> ∝ R) — 'both true' galat.", "1": "R true nahi hai — T radius par depend karta hai fixed v pe.", "3": "Assertion TRUE hai — distance 2πR sahi hai."}}, {"n": 97, "type": "mcq", "topic": "nucm", "q": "A car moves on a circular track of radius 50 m. Its speed increases uniformly from 10 m/s to 20 m/s in 5 s. Its tangential acceleration is", "fig": "", "figcap": "", "opts": ["2 m/s²", "10 m/s²", "50 m/s²", "0.4 m/s²"], "ans": 0, "sol": ["Step 1 — Tangential acceleration at = rate of change of SPEED.", "Step 2 — Speed 10 m/s se 20 m/s, time 5 s.", "Step 3 — at = <span class=\"fr\"><span class=\"fn\">(20 − 10)<\/span><span class=\"fd\">5<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">10<\/span><span class=\"fd\">5<\/span><\/span> = 2 m/s².", "Step 4 — Option (A)."], "note": "at = Δv/Δt (speed change per time).", "wrong": {"1": "10 = total change — per second nahi kiya.", "2": "50 = 10×5? — bilkul galat.", "3": "0.4 = <span class=\"fr\"><span class=\"fn\">2<\/span><span class=\"fd\">5<\/span><\/span>? — inverse calculation galat."}}, {"n": 98, "type": "statement", "topic": "nucm", "q": "Consider the following statements about non-uniform circular motion. Statement I: For a particle moving on a circle of radius R, the tangential acceleration is Rα, where α is the angular acceleration. Statement II: The radial (centripetal) acceleration at any instant has magnitude <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, where v is the instantaneous speed.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Tangential acceleration at = Rα (α = angular acceleration) ✓ TRUE (v = Rω → <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> = R·<span class=\"fr\"><span class=\"fn\">dω<\/span><span class=\"fd\">dt<\/span><\/span>).", "Step 2 — Statement II: Radial acceleration = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> at any instant (instantaneous speed v) ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "at = Rα = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span>; ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = ω²R.", "wrong": {"1": "ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> standard — Statement II sahi.", "2": "at = Rα standard — Statement I sahi.", "3": "Dono true hain."}}, {"n": 99, "type": "statement", "topic": "nucm", "q": "Consider the following statements. Statement I: The net acceleration of a particle in non-uniform circular motion is always directed radially towards the centre of the circle. Statement II: The tangential and centripetal components of acceleration are mutually perpendicular, so the net acceleration has magnitude √<span class=\"rad\">(at² + ac²)<\/span>.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 2, "sol": ["Step 1 — Statement I: 'Net acceleration HAMESHA radially towards centre' — GALAT! Non-UCM mein tangential component bhi hai → net acceleration center se thoda BAHAR ki taraf, purely radial NAHI. ✗", "Step 2 — Statement II: at aur ac mutually perpendicular → |a| = √<span class=\"rad\">(at² + ac²)<\/span> ✓ TRUE.", "Step 3 — I false, II true → option (C)."], "note": "Non-UCM: net a = √<span class=\"rad\">(ac²+at²)<\/span>, direction center se thoda bahar (tan = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span>).", "wrong": {"1": "II true hai (Pythagoras for perpendicular components).", "2": "I galat hai (tangential component present) — 'I true' wale options galat.", "3": "I false, II true — dono false galat."}}, {"n": 100, "type": "mcq", "topic": "nucm", "q": "Which of the following is incorrect for non-uniform circular motion?", "fig": "", "figcap": "", "opts": ["The speed of the particle changes with time", "Tangential acceleration acts along the tangent to the circular path", "When angular acceleration α is constant, ω = ω₀ + αt", "The radial (centripetal) acceleration of the particle is zero"], "ans": 3, "sol": ["Step 1 — (A) Speed changes with time — non-UCM ki definition ✓ correct.", "Step 2 — (B) Tangential acceleration tangent ke along ✓ correct.", "Step 3 — (C) ω = ω₀ + αt for constant α ✓ correct.", "Step 4 — (D) 'Centripetal acceleration zero' — GALAT! ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> non-zero (direction badalne ke liye zaroori).", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Non-UCM mein ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> non-zero rehti hai (direction change).", "wrong": {"0": "Speed change — sahi.", "1": "Tangential component tangent par — sahi.", "2": "ω = ω₀ + αt — sahi."}}, {"n": 101, "type": "mcq", "topic": "scv", "q": "Which of the following is a vector quantity?", "fig": "", "figcap": "", "opts": ["Work", "Electric current", "Torque", "Pressure"], "ans": 2, "sol": ["Step 1 — Vector = magnitude + direction + vector addition laws.", "Step 2 — (A) Work = F·s — scalar ✗.", "Step 3 — (B) Electric current — direction hoti hai par vector laws follow nahi karta → scalar ✗.", "Step 4 — (C) Torque τ = r × F — cross product, vector ✓ (axial vector).", "Step 5 — (D) Pressure = F/A — scalar ✗.", "Step 6 — Option (C)."], "note": "Torque, angular momentum, angular velocity = axial vectors. Work, current, pressure = scalars.", "wrong": {"0": "Work dot product hai — scalar.", "1": "Current scalar hai (vector laws nahi).", "3": "Pressure scalar hai (F/A, direction nahi)."}}, {"n": 102, "type": "mcq", "topic": "scv", "q": "A particle moves in the x-y plane from the point P (2 m, 3 m) to the point Q (5 m, 7 m). The magnitude of its displacement is", "fig": "", "figcap": "", "opts": ["5 m", "7 m", "12 m", "25 m"], "ans": 0, "sol": ["Step 1 — P(2, 3) se Q(5, 7).", "Step 2 — Displacement = (5−2, 7−3) = (3, 4).", "Step 3 — |d| = √<span class=\"rad\">(3² + 4²)<\/span> = √<span class=\"rad\">(9+16)<\/span> = √<span class=\"rad\">25<\/span> = 5 m.", "Step 4 — Option (A) — 3-4-5 triangle phir se!"], "note": "Δr = (Δx, Δy), |Δr| = √<span class=\"rad\">(Δx²+Δy²)<\/span>.", "wrong": {"1": "7 = Δy sirf — x component ghat gaya.", "2": "12 = 3+4+…? — magnitudes add nahi hote.", "3": "25 = 5² — yeh squared magnitude hai, magnitude nahi."}}, {"n": 103, "type": "statement", "topic": "scv", "q": "Consider the following statements. Statement I: Average velocity of a particle in two dimensions is a vector, whereas average speed is a scalar. Statement II: Average velocity of a particle can be zero even when the particle has actually moved.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Average velocity = displacement/time — vector; average speed = distance/time — scalar ✓ TRUE.", "Step 2 — Statement II: Average velocity zero ho sakta hai jab particle move karke wapas aa jaye (closed path) — displacement 0, distance > 0 ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Closed path: displacement 0 → avg velocity 0, par distance > 0.", "wrong": {"1": "Closed path ka example hai — Statement II sahi.", "2": "Velocity vector, speed scalar — Statement I sahi.", "3": "Dono true hain."}}, {"n": 104, "type": "mcq", "topic": "scv", "q": "Which of the following statements is incorrect?", "fig": "", "figcap": "", "opts": ["A vector multiplied by a real number always gives another vector", "A unit vector has magnitude 1 and carries no physical units", "Two vectors of different physical dimensions can be added provided they have equal magnitudes", "A null vector added to any vector leaves that vector unchanged"], "ans": 2, "sol": ["Step 1 — (A) Vector × real number = vector ✓ sahi.", "Step 2 — (B) Unit vector magnitude 1, no physical units ✓ sahi.", "Step 3 — (C) 'Different dimensions wale vectors add ho sakte hain' — GALAT! Force + velocity jodna meaningless hai (units match karne chahiye).", "Step 4 — (D) Null vector + any vector = same vector ✓ sahi.", "Step 5 — Incorrect = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Vectors add ho sakte hain sirf same physical quantity/dimension ke.", "wrong": {"0": "Scalar multiplication valid hai — sahi.", "1": "Unit vector definition — sahi.", "3": "Zero vector identity hai — sahi."}}, {"n": 105, "type": "assertion", "topic": "scv", "q": "Assertion (A): A vector remains unchanged if it is shifted parallel to itself without changing its magnitude and direction. Reason (R): A vector is specified only by its magnitude and direction, and not by its location in space.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Vector ko parallel shift karo (magnitude/direction same) → unchanged ✓ TRUE (free vector concept).", "Step 2 — Reason: Vector sirf magnitude + direction se define hota hai, position se nahi ✓ TRUE.", "Step 3 — R exactly wahi reason hai → correct explanation.", "Step 4 — Option (A)."], "note": "Free vector: position independent — sirf magnitude + direction matter.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (definition).", "3": "Assertion true hai."}}, {"n": 106, "type": "diagram", "topic": "kin2", "q": "Study the described graph. On a Cartesian graph sheet with x and y axes marked in metres, the position of a particle at t = 0 s is the origin (0, 0), and at t = 2 s its position vector is an arrow drawn from the origin to the point (3, 4). The magnitude of the average velocity of the particle over this interval is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 106\"><defs><marker id=\"m106\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.
