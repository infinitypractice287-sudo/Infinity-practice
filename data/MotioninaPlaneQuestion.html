<script>
"use strict";
/* ================= generic engine (independent of data) ================= */
const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
const META = DATA.meta, QS = DATA.questions;
const N = META.total, KEY = 'mip450_v1';
const AB = 'ABCD';
let state = { done: {}, cur: 1, filter: 'all', dark: false };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && typeof s.done === 'object') state = Object.assign(state, s);
} catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify({ done: state.done, dark: state.dark })); } catch (e) {} }
function q(n) { return QS[n - 1]; }

function stats() {
  let ok = 0, bad = 0;
  for (const k in state.done) {
    const v = state.done[k];
    if (v === q(+k).ans) ok++; else bad++;
  }
  return { ok, bad, score: ok * META.scoring.correct + bad * META.scoring.wrong, att: ok + bad };
}

function paintStats() {
  const s = stats();
  document.getElementById('score').textContent = s.score;
  document.getElementById('att').textContent = s.att;
  document.getElementById('nOK').textContent = s.ok;
  document.getElementById('nBAD').textContent = s.bad;
  document.getElementById('pfill').style.width = (100 * s.att / N).toFixed(2) + '%';
}

function gridVisible(n) {
  const v = state.done[n];
  if (state.filter === 'all') return true;
  if (state.filter === 'unseen') return v === undefined;
  if (state.filter === 'wrong') return v !== undefined && v !== q(n).ans;
  return v !== undefined && v === q(n).ans;
}

function paintGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for (let n = 1; n <= N; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    const v = state.done[n];
    if (v === q(n).ans) b.className = 'ok';
    else if (v !== undefined) b.className = 'bad';
    if (n === state.cur) b.className += ' cur';
    if (!gridVisible(n)) b.className += ' hide';
    b.addEventListener('click', () => { state.cur = n; render(); });
    g.appendChild(b);
  }
}

function figureHTML(Q) {
  if (!Q.fig) return '';
  return '<div class="figwrap">' + Q.fig + (Q.figcap ? '<div class="figcap">' + Q.figcap + '</div>' : '') + '</div>';
}

function render() {
  const Q = q(state.cur), n = state.cur;
  const chosen = state.done[n];
  const answered = chosen !== undefined;
  const isRight = answered && chosen === Q.ans;
  const topicName = META.topics[Q.topic] || Q.topic;
  const conc = (META.concepts && META.concepts[Q.topic]) || {};
  const card = document.getElementById('card');

  let optsHtml = Q.opts.map((o, i) => {
    let cls = 'opt';
    if (answered) {
      if (i === Q.ans) cls += ' correct';
      else if (i === chosen) cls += ' chosen-wrong';
      else cls += ' dim';
    }
    return '<div class="' + cls + '" data-i="' + i + '"><span class="ol">(' + AB[i] + ')</span><span>' + o + '</span></div>';
  }).join('');

  let verdict = '';
  if (answered) {
    verdict = isRight
      ? '<div class="verdict show good">✓ Sahi jawab! +' + META.scoring.correct + ' points.</div>'
      : '<div class="verdict show badd">✕ Galat. ' + META.scoring.wrong + ' points. Sahi jawab: (' + AB[Q.ans] + ')</div>';
  }

  let sol = '';
  if (answered) {
    let steps = Q.sol.map(s => '<div class="step">' + s + '</div>').join('');
    let extra = '';
    if (!isRight && Q.wrong[chosen]) {
      extra += '<div class="whybox"><b>Aapne (' + AB[chosen] + ') chuna — kyun galat hai:</b> ' + Q.wrong[chosen] + '</div>';
    }
    if (conc.mistake) extra += '<div class="deepbox" style="background:var(--gold-soft);border-color:var(--gold)"><b>Common mistake:</b> ' + conc.mistake + '</div>';
    if (conc.concept) extra += '<div class="deepbox"><b>Deep concept (' + topicName + '):</b> ' + conc.concept + '</div>';
    if (Q.note) extra += '<div class="notebox"><b>Yaad rakho / Shortcut:</b> ' + Q.note + '</div>';
    sol = '<div class="solbox show"><div class="solhead"><span class="ansline">Answer: (' + AB[Q.ans] + ')</span></div>'
      + steps + extra + figureHTML(Q) + '</div>';
  }

  card.innerHTML =
    '<div class="tags"><span class="tag topic">' + topicName + '</span>'
    + '<span class="tag">' + META.types[Q.type] + '</span>'
    + (answered ? '<span class="tag">' + (isRight ? '✓ +4' : '✕ −1') + '</span>' : '') + '</div>'
    + '<div class="qnum">Question ' + n + ' of ' + N + '</div>'
    + '<div class="qtext">' + Q.q + '</div>'
    + figureHTML(Q)
    + '<div class="opts" id="opts">' + optsHtml + '</div>'
    + verdict + sol
    + '<div class="actions">'
    + '<button class="nav" id="prevB" ' + (n === 1 ? 'disabled' : '') + '>← Prev</button>'
    + '<button class="nav" id="nextB" ' + (n === N ? 'disabled' : '') + '>Next →</button>'
    + (answered ? '<button class="retry" id="retryB" type="button">↺ dobara try karo</button>' : '')
    + '<span class="ofn">Question ' + n + ' of ' + N + '</span></div>';

  card.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => choose(+el.dataset.i));
  });
  const pb = document.getElementById('prevB'); if (pb) pb.addEventListener('click', () => nav(-1));
  const nb = document.getElementById('nextB'); if (nb) nb.addEventListener('click', () => nav(1));
  const rb = document.getElementById('retryB'); if (rb) rb.addEventListener('click', retry);
  paintGrid();
  paintStats();
}

function choose(i) {
  state.done[state.cur] = i;
  save(); render();
}
function retry() {
  delete state.done[state.cur];
  save(); render();
}
function nav(d) {
  const nx = state.cur + d;
  if (nx >= 1 && nx <= N) { state.cur = nx; render(); }
}

/* filters */
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  paintGrid();
});

/* full reset */
document.getElementById('resetAll').addEventListener('click', () => {
  if (!confirm('Poora test reset karein? (saara progress chala jayega)')) return;
  state.done = {}; state.cur = 1;
  save(); render();
});

/* dark mode */
const darkBtn = document.getElementById('darkBtn');
function applyDark() {
  document.documentElement.dataset.dark = state.dark ? '1' : '0';
  darkBtn.textContent = state.dark ? '☀️ light' : '🌙 dark';
}
darkBtn.addEventListener('click', () => { state.dark = !state.dark; applyDark(); save(); });

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key >= '1' && e.key <= '4') choose(+e.key - 1);
  else if (e.key === 'ArrowRight') nav(1);
  else if (e.key === 'ArrowLeft') nav(-1);
  else if (e.key === 'r' || e.key === 'R') retry();
});

/* print sheet: all questions rendered as a question paper */
(function buildPrint() {
  const p = document.getElementById('printSheet');
  let h = '<h1>Class 11 Physics — Motion in a Plane — 450 MCQ Practice Set — Question Paper (Print)</h1><p>Directions: Har question ka sirf ek option sahi hai. Total ' + N + ' questions · +4 sahi, −1 galat.</p>';
  for (const Q of QS) {
    h += '<div class="pq"><b>Q' + Q.n + '.</b> <span class="qtext">' + Q.q + '</span>'
       + '<div class="opts">' + Q.opts.map((o, i) => '<div class="opt"><b>(' + AB[i] + ')</b> ' + o + '</div>').join('') + '</div></div>';
  }
  p.innerHTML = h;
})();

applyDark();
render();
</script>
