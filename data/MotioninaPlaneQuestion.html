iddle\" font-size=\"13\" fill=\"#d9a441\" font-weight=\"normal\">Z(2,−1)<\/text><circle cx=\"170.0\" cy=\"100.0\" r=\"4\" fill=\"#264653\"/><\/svg>", "figcap": "Three vectors from origin: X(1,2), Y(−2,1), Z(2,−1).", "opts": ["√<span class=\"rad\">5<\/span>", "3", "√<span class=\"rad\">13<\/span>", "5"], "ans": 0, "sol": ["Step 1 — X = (1,2), Y = (−2,1), Z = (2,−1).", "Step 2 — Sum = (1−2+2, 2+1−1) = (1, 2).", "Step 3 — |sum| = √<span class=\"rad\">(1+4)<\/span> = √<span class=\"rad\">5<\/span>.", "Step 4 — Option (A)."], "note": "Component-wise addition.", "wrong": {"0": "3 = |X|+…? — sum (1,2) hai, magnitude √<span class=\"rad\">5<\/span>.", "2": "√<span class=\"rad\">13<\/span> galat — sum (1,2) hai.", "3": "5 = √<span class=\"rad\">25<\/span> — magnitude nahi."}}, {"n": 256, "type": "match", "topic": "triple", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A · (B × C)<\/div><div class=\"colitem\">(b) A × (B × C)<\/div><div class=\"colitem\">(c) A × A<\/div><div class=\"colitem\">(d) A · A<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) A²<\/div><div class=\"colitem\">(ii) a null vector<\/div><div class=\"colitem\">(iii) a scalar triple product equal to the volume of a parallelepiped<\/div><div class=\"colitem\">(iv) a vector lying in the plane of B and C<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-iv, c-ii, d-i", "a-iv, b-iii, c-ii, d-i", "a-iii, b-ii, c-iv, d-i", "a-i, b-iv, c-ii, d-iii"], "ans": 0, "sol": ["Step 1 — Products ka nature match karo:", "Step 2 — (a) A·(B×C) → scalar triple product = volume of parallelepiped → (iii)", "Step 3 — (b) A×(B×C) → vector, B aur C ke PLANE mein (vector triple product identity) → (iv)", "Step 4 — (c) A×A → null vector → (ii)", "Step 5 — (d) A·A → A² → (i)", "Step 6 — Toh a-iii, b-iv, c-ii, d-i → option (A)."], "note": "STP = scalar (volume). A×(B×C) = (A·C)B − (A·B)C — in plane of B,C.", "wrong": {"1": "A×(B×C) plane of B,C mein hai — volume (iii) nahi.", "2": "A×A null (ii) hai — A² nahi.", "3": "A·A = A² (i) hai — volume nahi."}}, {"n": 257, "type": "statement", "topic": "scv", "q": "Consider the following statements. Statement I: If λA = 0 and λ is a non-zero scalar, then A must be a null vector. Statement II: The product of a non-zero real number and a vector is zero only when the vector itself is a null vector.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: λA = 0, λ ≠ 0 → A = 0/λ = null ✓ TRUE.", "Step 2 — Statement II: Non-zero scalar × vector = zero only if vector null ✓ TRUE (same logic).", "Step 3 — Dono true → option (A)."], "note": "λ≠0, λA = 0 → A = 0 (null vector).", "wrong": {"1": "Both true — II wahi I ka paraphrase.", "2": "I true — II bhi true.", "3": "Dono true hain."}}, {"n": 258, "type": "mcq", "topic": "add", "q": "Two vectors have magnitudes 6 units and 8 units respectively, and the magnitude of their resultant is 10 units. The angle between the two vectors is", "fig": "", "figcap": "", "opts": ["0°", "60°", "90°", "120°"], "ans": 2, "sol": ["Step 1 — A = 6, B = 8, R = 10.", "Step 2 — Check: 6² + 8² = 36 + 64 = 100 = 10² → Pythagoras! ✓", "Step 3 — Matlab θ = 90° (R² = A²+B²+2ABcosθ → 100 = 100+96cosθ → cosθ = 0).", "Step 4 — Option (C) — 6-8-10 triangle!"], "note": "R² = A²+B² → θ = 90° (Pythagoras).", "wrong": {"0": "0° → R = 14 — 10 nahi.", "1": "60° → R = √<span class=\"rad\">(36+64+48)<\/span> = √<span class=\"rad\">148<\/span> ≈ 12.2 — 10 nahi.", "3": "120° → R = √<span class=\"rad\">(100−48)<\/span> = √<span class=\"rad\">52<\/span> ≈ 7.2 — 10 nahi."}}, {"n": 259, "type": "statement", "topic": "add", "q": "Which of the following statements are correct for two vectors of equal m ol": ["Step 1 — Tower se (height h) projection:", "Step 2 — (A) Time of flight > level ground ka ✓ correct (zyada height → zyada fall time).", "Step 3 — (B) Impact speed = √<span class=\"rad\">(u²+2gh)<\/span> — angle se independent ✓ correct (energy conservation).", "Step 4 — (C) 'Range maximum at 45°' — GALAT! Height se projection mein optimum angle 45° se CHHOTA hota hai.", "Step 5 — (D) Parabola ✓ correct.", "Step 6 — Not correct = (C).", "Step 7 — Isliye sahi answer: Option (C)."], "note": "From height: max range at θ < 45° (higher launch point).", "wrong": {"0": "Zyada time — sahi.", "1": "√<span class=\"rad\">(u²+2gh)<\/span> angle-independent — sahi.", "3": "Parabola — sahi."}}, {"n": 274, "type": "diagram", "topic": "proj", "q": "Study the described graph. For a projectile, the horizontal component of velocity vx (in m/s) is plotted on the y-axis against time t (in s) on the x-axis and is a horizontal straight line at vx = 10 m/s from t = 0 to t = 4 s. In a second graph, the vertical component vy (in m/s) against t (in s) is a straight line falling from +20 m/s at t = 0 to −20 m/s at t = 4 s (take g = 10 m/s²). The horizontal range of the projectile is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 274\"><defs><marker id=\"m274\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt274\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr274\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg274\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"40.0\" y1=\"105.0\" x2=\"148.0\" y2=\"105.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"40.0\" y1=\"105.0\" x2=\"40.0\" y2=\"37.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"150.0\" y1=\"105.0\" x2=\"141.0\" y2=\"101.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"150.0\" y1=\"105.0\" x2=\"141.0\" y2=\"109.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"40.0\" y1=\"35.0\" x2=\"36.0\" y2=\"44.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"40.0\" y1=\"35.0\" x2=\"44.0\" y2=\"44.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><text x=\"154.0\" y=\"109.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">t<\/text><text x=\"34.0\" y=\"31.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">v_x<\/text><line x1=\"40.0\" y1=\"55.0\" x2=\"150.0\" y2=\"55.0\" stroke=\"#264653\" stroke-width=\"2.4\"/><text x=\"95.0\" y=\"45.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a8291\" font-weight=\"normal\">v_x = 10 (flat)<\/text><line x1=\"190.0\" y1=\"105.0\" x2=\"318.0\" y2=\"105.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"190.0\" y1=\"105.0\" x2=\"190.0\" y2=\"37.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"320.0\" y1=\"105.0\" x2=\"311.0\" y2=\"101.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"320.0\" y1=\"105.0\" x2=\"311.0\" y2=\"109.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"190.0\" y1=\"35.0\" x2=\"186.0\" y2=\"44.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"190.0\" y1=\"35.0\" x2=\"194.0\" y2=\"44.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><text x=\"324.0\" y=\"109.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">t<\/text><text x=\"184.0\" y=\"31.0\" text-anchor=\"start\" font-size=\"12\" fill=\"#7a8291\" font-weight=\"normal\">v_y<\/text><line x1=\"190.0\" y1=\"55.0\" x2=\"320.0\" y2=\"155.0\" stroke=\"#2a9d8f\" stroke-width=\"2.4\"/><text x=\"182.0\" y=\"59.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a8291\" font-weight=\"normal\">+20<\/text><text x=\"196.0\" y=\"110.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a8291\" font-weight=\"normal\">0<\/text><text x=\"180.0\" y=\"159.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a8291\" font-weight=\"normal\">−20<\/text><text x=\"255.0\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a8291\" font-weight=\"normal\">slope −10<\/text><\/svg>", "figcap": "Two graphs: v_x constant 10 m/s; v_y from +20 to −20 in 4 s → range = 10 × 4 = 40 m.", "opts": ["20 m", "40 m", "80 m", "10 m"], "ans": 1, "sol": ["Step 1 — Graph 1: vx = 10 m/s constant (0 se 4 s).", "Step 2 — Graph 2: vy = +20 → −20, t = 4 s (linear, g = 10 ✓).", "Step 3 — Landing jab vy = −20 = −initial → T = 4 s.", "Step 4 — Range = vx × T = 10 × 4 = 40 m.", "Step 5 — Option (B)."], "note": "R = vx × T. vy graph se T nikalo (return to −vy₀).", "wrong": {"0": "20 = 10×2? — T = 4 s hai (vy −20 tak).", "2": "80 = 10×8? — T = 4 hai.", "3": "10 = vx sirf — T multiply nahi kiya."}}, {"n": 275, "type": "mcq", "topic": "proj", "q": "A projectile is fired at 30° to the horizontal with a speed of 40 m/s. Taking g = 10 m/s² and sin 30° = 0.5, the maximum height attained is", "fig": "", "figcap": "", "opts": ["20 m", "40 m", "80 m", "10 m"], "ans": 0, "sol": ["Step 1 — H = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">(40)²(0.5)²<\/span><span class=\"fd\">20<\/span><\/span>.", "Step 2 — = 1600 × 0.25 / 20 = <span class=\"fr\"><span class=\"fn\">400<\/span><span class=\"fd\">20<\/span><\/span> = 20 m.", "Step 3 — Option (A)."], "note": "H = <span class=\"fr\"><span class=\"fn\">(u sinθ)²<\/span><span class=\"fd\">2g<\/span><\/span>. 30° → u sinθ = 20.", "wrong": {"0": "40 = 2×20 — g=10 hai, ½ factor dhyan se: <span class=\"fr\"><span class=\"fn\">(20)²<\/span><span class=\"fd\">20<\/span><\/span> = 20.", "2": "80 = <span class=\"fr\"><span class=\"fn\">(20)²<\/span><span class=\"fd\">5<\/span><\/span>? — 2g = 20 hai.", "3": "10 galat — <span class=\"fr\"><span class=\"fn\">(u sinθ)²<\/span><span class=\"fd\">2g<\/span><\/span> = 20."}}, {"n": 276, "type": "statement", "topic": "proj", "q": "Consider the following statements for two projectiles fired with the same speed at 30° and 60° with the horizontal. Statement I: Both projectiles have the same horizontal range. Statement II: The time of flight of the projectile fired at 60° is √<span class=\"rad\">3<\/span> times that of the projectile fired at 30°.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: 30° aur 60° complementary → same range ✓ TRUE.", "Step 2 — Statement II: T(60°)/T(30°) = <span class=\"fr\"><span class=\"fn\">sin60<\/span><span class=\"fd\">sin30<\/span><\/span> = (<span class=\"fr\"><span class=\"fn\">√<span class=\"rad\">3<\/span><\/span><span class=\"fd\">2<\/span><\/span>)/(<span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">2<\/span><\/span>) = √<span class=\"rad\">3<\/span> ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Complementary: R same. T ratio = sinθ ratio = √<span class=\"rad\">3<\/span> (60°/30°).", "wrong": {"1": "√<span class=\"rad\">3<\/span> ratio sahi — Statement II sahi.", "2": "Same range — Statement I sahi.", "3": "Dono true hain."}}, {"n": 277, "type": "assertion", "topic": "proj", "q": "Assertion (A): The kinetic energy of a projectile at the highest point is not zero for an oblique projection. Reason (R): At the highest point the vertical component of velocity is zero but the horizontal component u cos θ is non-zero.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Oblique projection mein top pe KE non-zero ✓ TRUE (vy=0 par vx = u cosθ ≠ 0).", "Step 2 — Reason: Top pe vy = 0, vx = u cosθ non-zero ✓ TRUE — wahi reason.", "Step 3 — R correct explanation → option (A)."], "note": "Top pe KE = ½m(u cosθ)² — non-zero (oblique case).", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (components at top).", "3": "Assertion true hai."}}, {"n": 278, "type": "match", "topic": "proj", "q": "Match the Columns for a projectile of speed u projected at angle θ on level ground. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Time of flight<\/div><div class=\"colitem\">(b) Maximum height<\/div><div class=\"colitem\">(c) Horizontal range<\/div><div class=\"colitem\">(d) Radius of curvature of the trajectory at the highest point<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) u² cos²θ/g<\/div><div class=\"colitem\">(ii) u² sin 2θ/g<\/div><div class=\"colitem\">(iii) 2u sin θ/g<\/div><div class=\"colitem\">(iv) u² sin²θ/(2g)<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-iv, c-ii, d-i", "a-iv, b-iii, c-ii, d-i", "a-iii, b-ii, c-iv, d-i", "a-i, b-iv, c-ii, d-iii"], "ans": 0, "sol": ["Step 1 — Projectile relations:", "Step 2 — (a) Time of flight → <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> → (iii)", "Step 3 — (b) Max height → <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> → (iv)", "Step 4 — (c) Horizontal range → <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> → (ii)", "Step 5 — (d) Radius of curvature at top → <span class=\"fr\"><span class=\"fn\">u²cos²θ<\/span><span class=\"fd\">g<\/span><\/span> → (i)", "Step 6 — Toh a-iii, b-iv, c-ii, d-i → option (A)."], "note": "ρ(top) = <span class=\"fr\"><span class=\"fn\">v<sub>top<\/sub>²<\/span><span class=\"fd\">g<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">u²cos²θ<\/span><span class=\"fd\">g<\/span><\/span> (φ=0 at top).", "wrong": {"1": "H = <span class=\"fr\"><span class=\"fn\">u²sin²θ<\/span><span class=\"fd\">2g<\/span><\/span> — <span class=\"fr\"><span class=\"fn\">2u sinθ<\/span><span class=\"fd\">g<\/span><\/span> (T) nahi.", "2": "R = <span class=\"fr\"><span class=\"fn\">u²sin2θ<\/span><span class=\"fd\">g<\/span><\/span> — H formula nahi.", "3": "ρ(top) = <span class=\"fr\"><span class=\"fn\">u²cos²θ<\/span><span class=\"fd\">g<\/span><\/span> — T formula nahi."}}, {"n": 279, "type": "mcq", "topic": "proj", "q": "Which of the following is NOT correct for a projectile fired and landing on level ground?", "fig": "", "figcap": "", "opts": ["The magnitude of the average velocity over the complete flight is u cos θ", "The magnitude of the average acceleration over the complete flight is g", "The magnitude of the change in velocity over the complete flight is 2u sin θ", "The distance travelled by the projectile in the complete flight is equal to the horizontal range"], "ans": 3, "sol": ["Step 1 — (A) |Avg velocity| = <span class=\"fr\"><span class=\"fn\">R<\/span><span class=\"fd\">T<\/span><\/span> = u cosθ ✓ correct.", "Step 2 — (B) |Avg acceleration| = g (constant) ✓ correct.", "Step 3 — (C) |Δv| = 2u sinθ ✓ correct.", "Step 4 — (D) 'Distance = horizontal range' — GALAT! Path parabolic hai, lambai (arc length) > R (horizontal).", "Step 5 — Not correct = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "Distance (arc length) > horizontal range (curved path).", "wrong": {"0": "u cosθ — sahi.", "1": "g — sahi.", "3": "2u sinθ — sahi."}}, {"n": 280, "type": "diagram", "topic": "proj", "q": "Study the following data table described in words. For a projectile on level ground with u = 20 m/s and g = 10 m/s² (take sin 60° = 0.866), the table gives angle of projection θ (degree), horizontal range R (m) and maximum height H (m): θ = 30° gives R = 34.6, H = 5; θ = 45° gives R = 40, H = 10; θ = 60° gives R = 34.6, H = 15. Which of the following is NOT correct?", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>θ (°)<\/th><th>R (m)<\/th><th>H (m)<\/th><\/tr><\/thead><tbody><tr><td>30<\/td><td>34.6<\/td><td>5<\/td><\/tr><tr><td>45<\/td><td>40<\/td><td>10<\/td><\/tr><tr><td>60<\/td><td>34.6<\/td><td>15<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">u = 20 m/s, g = 10: R = 40 sin2θ, H = 20 sin²θ<\/p><\/div>", "figcap": "Projectile data at complementary angles 30° and 60°.", "opts": ["R is the same for 30° and 60°", "H is the same for 30° and 60°", "R is maximum at 45°", "H increases as θ increases from 30° to 60°"], "ans": 1, "sol": ["Step 1 — Table: 30°: R=34.6, H=5. 45°: R=40, H=10. 60°: R=34.6, H=15.", "Step 2 — (A) R same at 30° and 60° (34.6) ✓ correct.", "Step 3 — (B) 'H same at 30° and 60°' — GALAT! 5 vs 15 — alag.", "Step 4 — (C) R max at 45° (40) ✓ correct.", "Step 5 — (D) H increases 30°→60° (5→15) ✓ correct.", "Step 6 — Not correct = (B).", "Step 7 — Isliye sahi answer: Option (B)."], "note": "Complementary angles: R same, H alag (ratio 1:3).", "wrong": {"1": "R same (34.6) — sahi (A correct hai).", "2": "R max 45° — sahi.", "3": "H increases — sahi (5, 10, 15)."}}, {"n": 281, "type": "statement", "topic": "proj", "q": "Which of the following statements are correct for a projectile (air resistance neglected)? (1) The equation of trajectory is y = x tan θ − <span class=\"fr\"><span class=\"fn\">gx²<\/span><span class=\"fd\">(2u² cos²θ)<\/span><\/span>. (2) For projection on level ground, the trajectory is symmetric about the vertical line through the highest point. (3) If the horizontal range equals the maximum height, then tan θ = 4. (4) The angle between the velocity and the acceleration at the highest point is 90°.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 3, "sol": ["Step 1 — (1) y = x tanθ − <span class=\"fr\"><span class=\"fn\">gx²<\/span><span class=\"fd\">(2u²cos²θ)<\/span><\/span> ✓ TRUE.", "Step 2 — (2) Symmetry about vertical through top ✓ TRUE.", "Step 3 — (3) R = H → tanθ = 4 ✓ TRUE (derived earlier).", "Step 4 — (4) Top pe v horizontal, a vertical → 90° ✓ TRUE.", "Step 5 — All correct → option (D)."], "note": "R=H → tanθ=4. Top: v⊥a (90°).", "wrong": {"0": "Sab sahi — 'only' wale galat.", "1": "(1) standard trajectory.", "3": "(4) 90° at top."}}, {"n": 282, "type": "mcq", "topic": "proji", "q": "A projectile is fired horizontally from a height of 20 m with a speed of 15 m/s. Taking g = 10 m/s², the horizontal distance covered before it hits the ground is", "fig": "", "figcap": "", "opts": ["15 m", "30 m", "45 m", "60 m"], "ans": 1, "sol": ["Step 1 — Horizontal projection, h = 20 m, v = 15 m/s.", "Step 2 — Fall time: t = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span> = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">40<\/span><span class=\"fd\">10<\/span><\/span>)<\/span> = √<span class=\"rad\">4<\/span> = 2 s.", "Step 3 — Horizontal distance = 15 × 2 = 30 m.", "Step 4 — Option (B)."], "note": "t = √<span class=\"rad\">(<span class=\"fr\"><span class=\"fn\">2h<\/span><span class=\"fd\">g<\/span><\/span>)<\/span>, x = v·t.", "wrong": {"0": "15 = v — time multiply nahi kiya.", "2": "45 = 15×3? — t = 2 s hai.", "3": "60 = 15×4? — t = 2 hai."}}, {"n": 283, "type": "mcq", "topic": "rel", "q": "Car A travels due north at 20 m/s and car B travels due west at 20 m/s. The magnitude of the velocity of A relative to B is", "fig": "", "figcap": "", "opts": ["20 m/s", "20√<span class=\"rad\">2<\/span> m/s", "40 m/s", "zero"], "ans": 1, "sol": ["Step 1 — A: 20 north = (0, 20). B: 20 west = (−20, 0).", "Step 2 — vA relative to B = (0−(−20), 20−0) = (20, 20).", "Step 3 — |.| = √<span class=\"rad\">(400+400)<\/span> = 20√<span class=\"rad\">2<\/span> m/s.", "Step 4 — Option (B)."], "note": "Perpendicular velocities: relative = √<span class=\"rad\">(v1²+v2²)<\/span>.", "wrong": {"0": "20 = ek component — dono 20 hain.", "2": "40 = 20+20 — perpendicular hain, Pythagoras.", "3": "Zero — same velocity hoti to zero."}}, {"n": 284, "type": "statement", "topic": "rel", "q": "Which of the following statements are correct about relative velocity? (1) The velocity of A relative to B is vA − vB. (2) The relative velocity of two particles is the same for all observers moving with constant velocity relative to one another. (3) Two particles moving with equal speeds in opposite directions have relative speed equal to twice either speed. (4) A body can have zero velocity relative to one observer and non-zero velocity relative to another.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 3, "sol": ["Step 1 — (1) vAB = vA − vB ✓ TRUE.", "Step 2 — (2) Relative velocity, Galilean frames (constant relative velocity) mein same ✓ TRUE (Galilean invariance).", "Step 3 — (3) Opposite equal speeds → relative = 2× speed ✓ TRUE.", "Step 4 — (4) Body ek observer ke relative rest, doosre ke relative moving ✓ TRUE (e.g. train passenger).", "Step 5 — All correct → option (D)."], "note": "Relative velocity Galilean invariant; frame-dependent but origin-independent.", "wrong": {"0": "Sab sahi — 'only' wale galat.", "1": "(2) Galilean invariance sahi.", "3": "(4) train example sahi."}}, {"n": 285, "type": "mcq", "topic": "rel", "q": "Which of the following is NOT correct for a man walking in vertically falling rain?", "fig": "", "figcap": "", "opts": ["If the man walks faster, he must tilt the umbrella more towards the direction of motion", "The direction in which he holds the umbrella depends on the relative velocity of rain with respect to him", "If rain falls vertically and the man stands still, he holds the umbrella vertically", "The magnitude of the relative velocity of rain with respect to the man decreases as the man walks faster"], "ans": 3, "sol": ["Step 1 — (A) Zyada tez chalo → umbrella zyada tilt (direction of motion ki taraf) ✓ correct.", "Step 2 — (B) Umbrella direction relative velocity par depend ✓ correct.", "Step 3 — (C) Still + vertical rain → umbrella vertical ✓ correct.", "Step 4 — (D) 'Relative velocity DECREASES as man walks faster' — GALAT! |v<sub>rel<\/sub>| = √<span class=\"rad\">(v<sub>rain<\/sub>² + v<sub>man<\/sub>²)<\/span> — v<sub>man<\/sub> badhe to |v<sub>rel<\/sub>| INCREASES.", "Step 5 — Not correct = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "|v(rain/man)| = √<span class=\"rad\">(vr²+vm²)<\/span> — running speed up → relative speed up.", "wrong": {"0": "Zyada tilt — sahi.", "1": "Relative velocity direction — sahi.", "3": "Still pe vertical — sahi."}}, {"n": 286, "type": "assertion", "topic": "boat", "q": "Assertion (A): A boat crossing a river takes the minimum time when it is rowed perpendicular to the current with respect to the water. Reason (R): The time of crossing is d/(v cos α), where d is the width of the river and α is the angle made by the boat's velocity with the perpendicular to the bank; the time is minimum when α = 0.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Min time — boat current ke relative perpendicular row karo ✓ TRUE.", "Step 2 — Reason: t = d/(v cosα), α = boat velocity ka angle perpendicular se. Min t jab cosα = 1 (α = 0) ✓ TRUE.", "Step 3 — R derivation deta hai → correct explanation → option (A)."], "note": "t = d/(v cosα) min at α = 0 (⊥ to current).", "wrong": {"1": "R correct explanation hai (derivation).", "2": "R true hai (t = d/(vcosα)).", "3": "Assertion true hai."}}, {"n": 287, "type": "mcq", "topic": "rel", "q": "An arrow of length 5 units pointing due east represents the velocity of a swimmer relative to still water, and an arrow of length 3 units pointing due north represents the velocity of the river current, both drawn from a common origin. The magnitude of the resultant velocity of the swimmer relative to the ground is", "fig": "", "figcap": "", "opts": ["4 units", "√<span class=\"rad\">34<\/span> units", "8 units", "2 units"], "ans": 1, "sol": ["Step 1 — Swimmer relative to water = 5, current = 3 (perpendicular, both from origin — swimmer ⊥ current maan kar).", "Step 2 — Resultant relative to ground = √<span class=\"rad\">(5² + 3²)<\/span> = √<span class=\"rad\">(25+9)<\/span> = √<span class=\"rad\">34<\/span> units.", "Step 3 — Option (B)."], "note": "Perpendicular: resultant = Pythagoras. √<span class=\"rad\">34<\/span> ≈ 5.83.", "wrong": {"0": "4 = 5−3 — perpendicular hain.", "2": "8 = 5+3 — same direction ka formula.", "3": "2 = |5−…|? — galat."}}, {"n": 288, "type": "match", "topic": "boat", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) A man walking in vertically falling rain<\/div><div class=\"colitem\">(b) A boat crossing a river with zero drift<\/div><div class=\"colitem\">(c) Two cars moving in the same direction with speeds 30 m/s and 20 m/s<\/div><div class=\"colitem\">(d) Two particles with velocities 3î and 4ĵ m/s<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) relative speed 10 m/s<\/div><div class=\"colitem\">(ii) relative speed 5 m/s<\/div><div class=\"colitem\">(iii) umbrella tilted towards the direction of motion<\/div><div class=\"colitem\">(iv) boat aimed upstream<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iii, b-iv, c-i, d-ii", "a-iv, b-iii, c-i, d-ii", "a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-ii, d-iv"], "ans": 0, "sol": ["Step 1 — Match karo:", "Step 2 — (a) Man walking in vertical rain → umbrella direction of motion ki taraf tilt → (iii)", "Step 3 — (b) Boat zero drift → upstream aim → (iv)", "Step 4 — (c) 30 & 20 same direction → 10 m/s → (i)", "Step 5 — (d) 3î & 4ĵ → relative = √<span class=\"rad\">(9+16)<\/span> = 5 m/s → (ii)", "Step 6 — Toh a-iii, b-iv, c-i, d-ii → option (A)."], "note": "Umbrella: direction of motion. Zero drift: upstream. Same dir: diff. Perpendicular: Pythagoras.", "wrong": {"1": "Zero drift upstream hai — umbrella tilt alag case (a).", "2": "10 m/s same-direction hai — upstream nahi.", "3": "5 m/s perpendicular case hai — 10 nahi."}}, {"n": 289, "type": "mcq", "topic": "ucm", "q": "A particle moves in a circle of radius 0.5 m with a uniform speed and completes 5 revolutions per second. Its angular speed is", "fig": "", "figcap": "", "opts": ["5π rad/s", "10π rad/s", "2.5π rad/s", "10 rad/s"], "ans": 1, "sol": ["Step 1 — 5 rev/s → ν = 5 Hz.", "Step 2 — ω = 2πν = 2π×5 = 10π rad/s.", "Step 3 — Option (B)."], "note": "ω = 2πν. 5 rev/s → 10π rad/s.", "wrong": {"0": "5π — 2π factor half.", "2": "2.5π — frequency half.", "3": "10 rad/s — π ghat gaya."}}, {"n": 290, "type": "statement", "topic": "ucm", "q": "Which of the following statements are correct for a particle in uniform circular motion? (1) Its angular momentum about the centre is constant. (2) Its kinetic energy is constant. (3) Its linear momentum is constant. (4) Its areal velocity about the centre is constant.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Angular momentum about centre constant (L = mRv, constant) ✓ TRUE.", "Step 2 — (2) KE = ½mv² constant ✓ TRUE.", "Step 3 — (3) Linear momentum constant — GALAT (direction changes).", "Step 4 — (4) Areal velocity = <span class=\"fr\"><span class=\"fn\">L<\/span><span class=\"fd\">2m<\/span><\/span> constant ✓ TRUE.", "Step 5 — Correct: 1, 2, 4 → option (B)."], "note": "UCM: L, KE, areal velocity constant; linear p NOT (direction).", "wrong": {"0": "3 galat hai (p direction changes) — D chuk jaoge.", "1": "3 FALSE — p = mv, direction badalti hai.", "3": "3 galat hai — linear momentum vector constant nahi."}}, {"n": 291, "type": "mcq", "topic": "ucm", "q": "Which of the following is NOT correct for uniform circular motion?", "fig": "", "figcap": "", "opts": ["The velocity vector rotates at the same angular rate as the position vector", "The acceleration vector is always antiparallel to the position vector measured from the centre", "The magnitude of the average acceleration over one full revolution is <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>", "The centripetal force is perpendicular to the velocity at every instant"], "ans": 2, "sol": ["Step 1 — (A) Velocity vector, position vector jitne rate se ghoomta hai ✓ correct.", "Step 2 — (B) Acceleration, position vector (centre se) ke antiparallel ✓ correct (a = −(<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R²<\/span><\/span>)r).", "Step 3 — (C) 'Avg acceleration over full revolution = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>' — GALAT! Δv = 0 (wahi velocity wapas) → avg acceleration = 0.", "Step 4 — (D) Centripetal force ⊥ velocity ✓ correct.", "Step 5 — Not correct = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "Full revolution: Δv = 0 → avg acceleration zero.", "wrong": {"0": "Same angular rate — sahi.", "1": "Antiparallel to r — sahi.", "3": "F⊥v — sahi."}}, {"n": 292, "type": "mcq", "topic": "ucm", "q": "Which of the following is correct for uniform circular motion?", "fig": "", "figcap": "", "opts": ["The velocity vector is constant", "The acceleration is zero because the speed is constant", "The acceleration has constant magnitude but continuously changing direction", "The angular velocity changes direction continuously"], "ans": 2, "sol": ["Step 1 — (A) Velocity constant — GALAT (direction changes).", "Step 2 — (B) Acceleration zero — GALAT (a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>).", "Step 3 — (C) Acceleration: magnitude constant (<span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>), direction continuously changing ✓ CORRECT.", "Step 4 — (D) Angular velocity direction changes — GALAT (constant, axis fixed).", "Step 5 — Correct = (C)."], "note": "UCM acceleration: constant magnitude, changing direction (always radial).", "wrong": {"0": "Velocity direction change karta hai.", "1": "a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> non-zero.", "3": "Angular velocity constant (axis fixed)."}}, {"n": 293, "type": "diagram", "topic": "ucm", "q": "Study the described graph. For a particle in uniform circular motion, the centripetal acceleration a (in m/s²) is plotted on the y-axis against the speed v (in m/s) on the x-axis, with the radius fixed at 2 m. The graph is a parabola passing through the origin, and at v = 4 m/s the value of a is 8 m/s². The value of a at v = 6 m/s is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 293\"><defs><marker id=\"m293\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt293\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr293\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-star weight=\"normal\">4<\/text><text x=\"60.0\" y=\"190.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"#264653\" font-weight=\"normal\">0<\/text><\/svg>", "figcap": "a vs v parabola, R = 2 m: a = v²/2; (4, 8) marked.", "opts": ["12 m/s²", "18 m/s²", "9 m/s²", "36 m/s²"], "ans": 1, "sol": ["Step 1 — a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span>, R = 2 m fixed → a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">2<\/span><\/span>.", "Step 2 — Verify: v = 4 → a = <span class=\"fr\"><span class=\"fn\">16<\/span><span class=\"fd\">2<\/span><\/span> = 8 ✓ (graph match).", "Step 3 — v = 6: a = <span class=\"fr\"><span class=\"fn\">36<\/span><span class=\"fd\">2<\/span><\/span> = 18 m/s².", "Step 4 — Option (B)."], "note": "a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> — parabola a vs v, slope = <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">R<\/span><\/span>… a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">2<\/span><\/span>.", "wrong": {"0": "12 = <span class=\"fr\"><span class=\"fn\">36<\/span><span class=\"fd\">3<\/span><\/span>? — R = 2 hai, 12 nahi (<span class=\"fr\"><span class=\"fn\">36<\/span><span class=\"fd\">2<\/span><\/span> = 18).", "2": "9 = <span class=\"fr\"><span class=\"fn\">36<\/span><span class=\"fd\">4<\/span><\/span>? — R = 2 hai.", "3": "36 = v² — R se divide nahi kiya."}}, {"n": 294, "type": "match", "topic": "ucm", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) ω = 2π/T<\/div><div class=\"colitem\">(b) a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span><\/div><div class=\"colitem\">(c) v = ωR<\/div><div class=\"colitem\">(d) F = mω²R<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) centripetal acceleration<\/div><div class=\"colitem\">(ii) centripetal force<\/div><div class=\"colitem\">(iii) relation between linear and angular speed<\/div><div class=\"colitem\">(iv) angular speed in terms of time period<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-iv, b-i, c-iii, d-ii", "a-i, b-iv, c-iii, d-ii", "a-iv, b-iii, c-i, d-ii", "a-ii, b-i, c-iii, d-iv"], "ans": 0, "sol": ["Step 1 — Relations match karo:", "Step 2 — (a) ω = 2π/T → angular speed in terms of time period → (iv)", "Step 3 — (b) a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> → centripetal acceleration → (i)", "Step 4 — (c) v = ωR → linear-angular speed relation → (iii)", "Step 5 — (d) F = mω²R → centripetal force → (ii)", "Step 6 — Toh a-iv, b-i, c-iii, d-ii → option (A)."], "note": "ω = 2π/T; a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = ω²R; v = ωR; F = mω²R.", "wrong": {"1": "a = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> centripetal acceleration hai — T formula nahi.", "2": "v = ωR speed relation hai — acceleration nahi.", "3": "F = mω²R force hai — ω/T nahi."}}, {"n": 295, "type": "statement", "topic": "ucm", "q": "Consider the following statements. Statement I: In uniform circular motion, the acceleration vector averaged over one complete cycle is a null vector. Statement II: During one complete cycle the centripetal acceleration vector takes up all directions in the plane of the circle symmetrically.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: Full cycle mein acceleration vector ka average null ✓ TRUE (symmetric directions cancel).", "Step 2 — Statement II: Full cycle mein acceleration vector har direction leta hai symmetrically ✓ TRUE (wahi reason hai).", "Step 3 — Dono true → option (A)."], "note": "Full cycle: acceleration vectors cancel symmetrically → average zero.", "wrong": {"1": "Symmetric directions — Statement II sahi.", "2": "Average zero — Statement I sahi.", "3": "Dono true hain."}}, {"n": 296, "type": "mcq", "topic": "nucm", "q": "A particle moves on a circle of radius 2 m with speed v = 3t² m/s. Its tangential acceleration at t = 2 s is", "fig": "", "figcap": "", "opts": ["6 m/s²", "12 m/s²", "18 m/s²", "24 m/s²"], "ans": 1, "sol": ["Step 1 — v = 3t².", "Step 2 — at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span> = 6t.", "Step 3 — t = 2: at = 12 m/s².", "Step 4 — Option (B)."], "note": "at = <span class=\"fr\"><span class=\"fn\">dv<\/span><span class=\"fd\">dt<\/span><\/span>. v = 3t² → at = 6t.", "wrong": {"0": "6 = 6×1? — t = 2 hai.", "2": "18 = 3t²×3? — derivative 6t hai.", "3": "24 galat — 6×2 = 12."}}, {"n": 297, "type": "statement", "topic": "nucm", "q": "Which of the following statements are correct for a particle in non-uniform circular motion? (1) The net acceleration has a radial and a tangential component. (2) The radial component equals <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> at every instant, v being the instantaneous speed. (3) The tangential component equals the rate of change of speed. (4) The angle between the net acceleration and the radius is tan⁻¹(<span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span>).", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 3, "sol": ["Step 1 — (1) Net acceleration radial + tangential ✓ TRUE.", "Step 2 — (2) Radial = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> (instantaneous) ✓ TRUE.", "Step 3 — (3) Tangential = rate of change of speed ✓ TRUE.", "Step 4 — (4) tan(angle with radius) = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span> ✓ TRUE.", "Step 5 — All correct → option (D)."], "note": "Non-UCM: a = √<span class=\"rad\">(ac²+at²)<\/span>, tanφ = <span class=\"fr\"><span class=\"fn\">at<\/span><span class=\"fd\">ac<\/span><\/span>.", "wrong": {"0": "Sab sahi — 'only' wale galat.", "1": "(2) standard.", "3": "(4) standard."}}, {"n": 298, "type": "mcq", "topic": "nucm", "q": "Which of the following is NOT correct for a particle in non-uniform circular motion?", "fig": "", "figcap": "", "opts": ["Its angular velocity changes with time", "Its kinetic energy changes with time", "Its angular momentum about the centre remains constant in magnitude", "The work done by the net force on it is non-zero"], "ans": 2, "sol": ["Step 1 — (A) Angular velocity changes ✓ correct.", "Step 2 — (B) KE changes (v changes) ✓ correct.", "Step 3 — (C) 'Angular momentum about centre constant in magnitude' — GALAT! L = mRv — v changes → L changes.", "Step 4 — (D) Work done by net force non-zero (KE changes) ✓ correct.", "Step 5 — Not correct = (C).", "Step 6 — Isliye sahi answer: Option (C)."], "note": "L = mRv — speed vary toh angular momentum vary karta hai.", "wrong": {"0": "ω changes — sahi.", "1": "KE changes — sahi.", "3": "Work non-zero — sahi."}}, {"n": 299, "type": "assertion", "topic": "nucm", "q": "Assertion (A): In non-uniform circular motion, the net acceleration is not directed towards the centre of the circle. Reason (R): In non-uniform circular motion a tangential component of acceleration is present in addition to the centripetal component.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: Non-UCM mein net acceleration center ki taraf NOT directed ✓ TRUE (tangential component radial se bahar ki taraf kheenchti hai).", "Step 2 — Reason: Tangential component present hai in addition to centripetal ✓ TRUE — wahi reason.", "Step 3 — R correct explanation → option (A)."], "note": "Net a = ac + at — at ki wajah se purely radial nahi.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (at present).", "3": "Assertion true hai."}}, {"n": 300, "type": "diagram", "topic": "nucm", "q": "Study the following data table described in words. A particle moves on a circle of radius 1 m with its speed increasing uniformly: at t = 1 s, v = 2 m/s; at t = 2 s, v = 4 m/s; at t = 3 s, v = 6 m/s. Taking √<span class=\"rad\">260<\/span> = 16.1, the magnitude of the net acceleration of the particle at t = 2 s is", "fig": "<div class=\"figbox\"><table class=\"figtbl\"><thead><tr><th>t (s)<\/th><th>v (m/s)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>4<\/td><\/tr><tr><td>3<\/td><td>6<\/td><\/tr><\/tbody><\/table><p class=\"tnote\">R = 1 m, at = 2 m/s² (uniform)<\/p><\/div>", "figcap": "Speed on a circle of radius 1 m, increasing uniformly.", "opts": ["16 m/s²", "18 m/s²", "√<span class=\"rad\">260<\/span> m/s²", "4 m/s²"], "ans": 2, "sol": ["Step 1 — Speed: 2, 4, 6 m/s at t = 1, 2, 3 → at = 2 m/s² (uniform increase).", "Step 2 — t = 2 pe: v = 4 m/s, R = 1 m.", "Step 3 — ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">16<\/span><span class=\"fd\">1<\/span><\/span> = 16 m/s².", "Step 4 — Net = √<span class=\"rad\">(at² + ac²)<\/span> = √<span class=\"rad\">(4 + 256)<\/span> = √<span class=\"rad\">260<\/span> m/s².", "Step 5 — Option (C)."], "note": "at from table (2 m/s²), ac = <span class=\"fr\"><span class=\"fn\">v²<\/span><span class=\"fd\">R<\/span><\/span> at that instant.", "wrong": {"0": "16 = sirf ac — at ghat gaya.", "1": "18 = 16+2 — perpendicular hain, Pythagoras: √<span class=\"rad\">260<\/span>.", "3": "4 = sirf at — ac ghat gaya."}}, {"n": 301, "type": "mcq", "topic": "cross", "q": "Which of the following is an axial vector?", "fig": "", "figcap": "", "opts": ["Velocity", "Force", "Angular velocity", "Displacement"], "ans": 2, "sol": ["Step 1 — Axial vector = pseudo vector (cross product type): direction axis ke along, right-hand rule.", "Step 2 — (A) Velocity — polar vector ✗.", "Step 3 — (B) Force — polar vector ✗.", "Step 4 — (C) Angular velocity — AXIAL vector (τ = Iα, L = r×p jaisa) ✓.", "Step 5 — (D) Displacement — polar vector ✗.", "Step 6 — Option (C)."], "note": "Axial: angular velocity, angular momentum, torque. Polar: velocity, force, displacement.", "wrong": {"0": "Velocity polar hai.", "1": "Force polar hai.", "3": "Displacement polar hai."}}, {"n": 302, "type": "mcq", "topic": "vec3", "q": "The unit vector in the direction of A = 2î + 3ĵ + 6k̂ is", "fig": "", "figcap": "", "opts": ["(2î + 3ĵ + 6k̂)/7", "(2î + 3ĵ + 6k̂)/49", "(2î + 3ĵ + 6k̂)/√<span class=\"rad\">47<\/span>", "(î + ĵ + k̂)/7"], "ans": 0, "sol": ["Step 1 — |A| = √<span class=\"rad\">(2² + 3² + 6²)<\/span> = √<span class=\"rad\">(4+9+36)<\/span> = √<span class=\"rad\">49<\/span> = 7.", "Step 2 — Unit vector = A/|A| = (2î+3ĵ+6k̂)/7.", "Step 3 — Option (A)."], "note": "Unit = A/|A|. 2-3-6-7 (4+9+36=49).", "wrong": {"0": "/49 = |A|² — square nahi, |A| divide karo.", "2": "√<span class=\"rad\">47<\/span> galat — |A| = 7.", "3": "(î+ĵ+k̂)/7 — components wahi hone chahiye (2,3,6)."}}, {"n": 303, "type": "statement", "topic": "vec3", "q": "Which of the following statements are correct? (1) î · (ĵ × k̂) = 1. (2) î × (ĵ × k̂) = î. (3) (î × ĵ) · k̂ = 1. (4) î × (ĵ + k̂) = k̂ − ĵ.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 3 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) î·(ĵ×k̂) = î·î = 1 ✓ TRUE.", "Step 2 — (2) î×(ĵ×k̂) = î×î = 0 — î NAHI ✗ FALSE.", "Step 3 — (3) (î×ĵ)·k̂ = k̂·k̂ = 1 ✓ TRUE.", "Step 4 — (4) î×(ĵ+k̂) = î×ĵ + î×k̂ = k̂ − ĵ ✓ TRUE.", "Step 5 — Correct: 1, 3, 4 → option (B). e"], "ans": 0, "sol": ["Step 1 — Assertion: STP, do vectors interchange karne par sign change ✓ TRUE (antisymmetry).", "Step 2 — Reason: STP = signed volume of parallelepiped; interchange → handedness (chirality) reverse ✓ TRUE.", "Step 3 — R exactly wahi explanation hai → correct explanation.", "Step 4 — Option (A)."], "note": "A·(B×C) = −B·(A×C) — signed volume, interchange flips handedness.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (signed volume).", "3": "Assertion true hai."}}, {"n": 306, "type": "diagram", "topic": "add", "q": "Study the described vector diagram. On a graph sheet, three arrows are drawn from the origin: P ending at (6, 0), Q ending at (0, 8) and R ending at (−6, −2), with x and y measured in the same units. The magnitude of P + Q + R is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 306\"><defs><marker id=\"m306\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt306\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr306\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg306\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"170.0\" y1=\"120.0\" x2=\"318.0\" y2=\"120.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"170.0\" y1=\"120.0\" x2=\"170.0\" y2=\"22.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"320.0\" y1=\"120.0\" x2=\"311.0\" y2=\"116.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"320.0\ olitem\">(a) Component of A = 10î along the unit vector (3î + 4ĵ)/5<\/div><div class=\"colitem\">(b) Magnitude of the component of A = 10î perpendicular to that same direction<\/div><div class=\"colitem\">(c) Projection of A = 3î + 4ĵ on the +x direction<\/div><div class=\"colitem\">(d) Component of A = 3î + 4ĵ along the unit vector (î + ĵ)/√<span class=\"rad\">2<\/span><\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) 6 units<\/div><div class=\"colitem\">(ii) 8 units<\/div><div class=\"colitem\">(iii) 3 units<\/div><div class=\"colitem\">(iv) 4.95 units<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-iv, b-ii, c-iii, d-i"], "ans": 0, "sol": ["Step 1 — (a) A = 10î along (3î+4ĵ)/5 = (0.6, 0.8): component = 10×0.6 = 6 → (i)", "Step 2 — (b) Perpendicular component = 10×0.8 = 8 → (ii)", "Step 3 — (c) (3,4) ka +x projection = 3 → (iii)", "Step 4 — (d) (3,4) along (î+ĵ)/√<span class=\"rad\">2<\/span>: component = <span class=\"fr\"><span class=\"fn\">(3+4)<\/span><span class=\"fd\">√<span class=\"rad\">2<\/span><\/span><\/span> = <span class=\"fr\"><span class=\"fn\">7<\/span><span class=\"fd\">1.414<\/span><\/span> = 4.95 → (iv)", "Step 5 — Toh a-i, b-ii, c-iii, d-iv → option (A)."], "note": "Component along n̂ = A·n̂. <span class=\"fr\"><span class=\"fn\">7<\/span><span class=\"fd\">√<span class=\"rad\">2<\/span><\/span><\/span> ≈ 4.95.", "wrong": {"1": "Perpendicular = 8 — projection 6 nahi (a ke liye).", "2": "3 x-projection hai — 8 nahi.", "3": "4.95 (d) ka hai — 6 nahi."}}, {"n": 308, "type": "statement", "topic": "cross", "q": "Consider the following statements for two non-zero vectors A and B. Statement I: If the magnitude of A × B is equal to A · B, then the angle between A and B is 45°. Statement II: A · B is a scalar, whereas A × B is a vector perpendicular to both A and B.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: |A×B| = A·B → AB sinθ = AB cosθ → tanθ = 1 → θ = 45° ✓ TRUE.", "Step 2 — Statement II: A·B scalar, A×B vector perpendicular to both ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "|A×B| = A·B → θ = 45° (sin = cos).", "wrong": {"1": "Dot scalar, cross vector — Statement II sahi.", "2": "45° sahi — Statement I sahi.", "3": "Dono true hain."}}, {"n": 309, "type": "mcq", "topic": "comp", "q": "Which of the following is incorrect about resolution of a vector?", "fig": "", "figcap": "", "opts": ["A vector can be resolved into components along two directions that are not mutually perpendicular", "The component of a vector along a chosen direction is independent of the choice of the second direction only when the two directions are mutually perpendicular", "If a vector makes 30° with the +x axis, its x-component exceeds its y-component", "The sum of the magnitudes of the two components of a vector along mutually perpendicular directions equals the magnitude of the vector"], "ans": 3, "sol": ["Step 1 — (A) Oblique resolution possible ✓ correct.", "Step 2 — (B) Component along n̂ = A·n̂ ✓ correct.", "Step 3 — (C) Non-perpendicular directions mein sum of magnitudes vector se zyada ho sakta hai ✓ correct.", "Step 4 — (D) 'Rectangular components ka sum of magnitudes = vector magnitude' — GALAT! |Ax|+|Ay| ≥ A; equality sirf axis-aligned pe. Example: 3î+4ĵ: 3+4 = 7 > 5.", "Step 5 — Incorrect = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "|Ax| + |Ay| ≥ A (triangle inequality) — equality only axis-aligned.", "wrong": {"0": "Oblique — sahi.", "1": "A·n̂ — sahi.", "3": "Oblique pe exceed — sahi."}}, {"n": 310, "type": "mcq", "topic": "vec3", "q": "The angle between the vectors A = î + ĵ + k̂ and B = î + ĵ − k̂ is", "fig": "", "figcap": "", "op n\">vy0<\/span><span class=\"fd\">vx<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">8.66<\/span><\/span> = 0.577.", "Step 3 — tan30° = 0.577 (diya hai) → θ = 30°.", "Step 4 — Option (A)."], "note": "tanθ = <span class=\"fr\"><span class=\"fn\">vy0<\/span><span class=\"fd\">vx<\/span><\/span>. <span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">8.66<\/span><\/span> ≈ 0.577 = tan30°.", "wrong": {"0": "37° tan = 0.75 — yahan 0.577.", "2": "45° tan = 1 — nahi.", "3": "60° tan = 1.73 — nahi."}}, {"n": 326, "type": "statement", "topic": "proji", "q": "Which of the following statements are correct for a projectile launched from a height h above the ground with speed u at angle θ above the horizontal? (1) The speed just before impact is √<span class=\"rad\">(u² + 2gh)<\/span>. (2) The time of flight decreases if the vertical component of velocity is directed downward. (3) The horizontal range is maximum when θ = 45°. (4) The trajectory is a parabola.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 1, "sol": ["Step 1 — (1) Impact speed = √<span class=\"rad\">(u²+2gh)<\/span> ✓ TRUE (energy).", "Step 2 — (2) vy downward → time of flight kam ✓ TRUE.", "Step 3 — (3) 'Range maximum at θ = 45°' — GALAT! Height se projection mein optimum < 45°.", "Step 4 — (4) Parabola ✓ TRUE.", "Step 5 — Correct: 1, 2, 4 → option (B)."], "note": "From height: max range at θ < 45°.", "wrong": {"0": "3 galat hai (< 45° optimum) — D chuk jaoge.", "1": "3 FALSE — height ke case mein 45° nahi.", "3": "3 galat hai — specific case nahi general."}}, {"n": 327, "type": "mcq", "topic": "proj", "q": "Which of the following is NOT correct for a projectile in flight (air resistance neglected)?", "fig": "", "figcap": "", "opts": ["At the highest point the acceleration of the projectile is g, vertically downward", "The horizontal component of momentum is conserved throughout the flight", "The magnitude of the change in the vertical component of momentum over the complete flight is mgT, where T is the time of flight", "The angular momentum of the projectile about the point of projection remains constant throughout the flight"], "ans": 3, "sol": ["Step 1 — (A) Top pe a = g downward ✓ correct.", "Step 2 — (B) px = m u cosθ constant ✓ correct.", "Step 3 — (C) Δpy = mgT (impulse) ✓ correct.", "Step 4 — (D) 'Angular momentum about point of projection constant' — GALAT! Torque about projection point = r×mg ≠ 0 (r ka horizontal component) → L changes.", "Step 5 — Not correct = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "L about projection point: <span class=\"fr\"><span class=\"fn\">dL<\/span><span class=\"fd\">dt<\/span><\/span> = −mg u cosθ t — not constant.", "wrong": {"0": "a = g — sahi.", "1": "px constant — sahi.", "3": "Δpy = mgT — sahi."}}, {"n": 328, "type": "mcq", "topic": "scv", "q": "A ball is thrown vertically upward with a speed of 20 m/s from a platform moving horizontally at 10 m/s. Taking g = 10 m/s², the horizontal distance travelled by the ball before it returns to the platform is", "fig": "", "figcap": "", "opts": ["40 m", "20 m", "80 m", "10 m"], "ans": 0, "sol": ["Step 1 — Ball vertically up (20 m/s) platform (10 m/s horizontal) se.", "Step 2 — Ball ko dono velocities milti hain: horizontal 10 m/s (platform), vertical 20 m/s.", "Step 3 — Vertical: T = 2×<span class=\"fr\"><span class=\"fn\">20<\/span><span class=\"fd\">10<\/span><\/span> = 4 s (platform par wapas).", "Step 4 — Horizontal distance = 10 × 4 = 40 m.", "Step 5 — Option (A)."], "note": "Platform frame: ball straight up-down, par ground se 10 m/s horizontal bhi.", "wrong": {"0": "20 = 10×2? — T = 4 s hai.", "2": "80 = 10×8? — T = 4.", "3": "10 = vx — time multiply nahi kiya."}}, {"n": 329, "type": "statement", "topic": "rel", "q": "Which of the following statements are correct when rain falls vertically downward at 12 m/s and a man walks horizontally at 5 m/s? (1) The magnitude of the velocity of rain relative to the man is 13 m/s. (2) The man must tilt his umbrella towards the direction of motion. (3) The umbrella makes an angle tan⁻¹(<span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">12<\/span><\/span>) with the vertical. (4) If the man doubles his speed, the angle made by the umbrella with the vertical doubles.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — Rain 12 neeche, man 5 east.", "Step 2 — (1) |v<sub>rel<\/sub>| = √<span class=\"rad\">(12²+5²)<\/span> = √<span class=\"rad\">169<\/span> = 13 ✓ TRUE.", "Step 3 — (2) Umbrella direction of motion ki taraf tilt ✓ TRUE.", "Step 4 — (3) tan(angle) = <span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">12<\/span><\/span> → tan⁻¹(<span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">12<\/span><\/span>) ✓ TRUE.", "Step 5 — (4) 'Speed double → angle double' — GALAT! tan = <span class=\"fr\"><span class=\"fn\">10<\/span><span class=\"fd\">12<\/span><\/span> → angle = tan⁻¹(0.833) ≠ 2×tan⁻¹(<span class=\"fr\"><span class=\"fn\">5<\/span><span class=\"fd\">12<\/span><\/span>).", "Step 6 — Correct: 1, 2, 3 → option (A)."], "note": "Angle = tan⁻¹(<span class=\"fr\"><span class=\"fn\">v<sub>man<\/sub><\/span><span class=\"fd\">v<sub>rain<\/sub><\/span><\/span>) — speed double karo to angle double NAHI.", "wrong": {"0": "4 galat hai (tangent linear nahi) — D chuk jaoge.", "1": "4 FALSE — tan angle double nahi hota.", "3": "4 galat hai — tan⁻¹ non-linear."}}, {"n": 330, "type": "mcq", "topic": "scv", "q": "Which of the following is NOT correct about relative motion?", "fig": "", "figcap": "", "opts": ["The velocity of A relative to B is vA − vB", "The magnitude of the relative velocity of two particles can be greater than the sum of their speeds", "If two particles move with the same acceleration, their relative acceleration is zero", "The relative velocity of two particles is independent of the choice of origin"], "ans": 1, "sol": ["Step 1 — (A) vAB = vA − vB ✓ correct.", "Step 2 — (B) '|v<sub>rel<\/sub>| sum of speeds se zyada' — GALAT! Triangle inequality: |vA−vB| ≤ |vA|+|vB|. Max = sum (opposite directions).", "Step 3 — (C) Same acceleration → relative acceleration zero ✓ correct.", "Step 4 — (D) Origin independent ✓ correct.", "Step 5 — Not correct = (B).", "Step 6 — Isliye sahi answer: Option (B)."], "note": "|vA−vB| ≤ |vA| + |vB| — triangle inequality.", "wrong": {"0": "vA−vB — sahi.", "3": "Origin independent — sahi."}}, {"n": 331, "type": "assertion", "topic": "rel", "q": "Assertion (A): For two particles with velocities v₁ = (3î + 4ĵ) m/s and v₂ = (4î + 3ĵ) m/s, the magnitude of the velocity of the first relative to the second is √<span class=\"rad\">2<\/span> m/s. Reason (R): The velocity of A relative to B is the vector difference of the two velocities.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — v1−v2 = (3−4, 4−3) = (−1, 1).", "Step 2 — |.| = √<span class=\"rad\">(1+1)<\/span> = √<span class=\"rad\">2<\/span> m/s ✓ Assertion TRUE.", "Step 3 — Reason: Relative velocity = vector difference ✓ TRUE — wahi method.", "Step 4 — R correct explanation → option (A)."], "note": "vAB = vA − vB (vector difference).", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (definition).", "3": "Assertion true hai (√<span class=\"rad\">2<\/span> verified)."}}, {"n": 332, "type": "diagram", "topic": "rel", "q": "Study the described vector diagram. From a common origin O, an arrow of length 8 units pointing due east represents the velocity of car A, and an arrow of length 6 units pointing due north represents the velocity of "/><line x1=\"120.0\" y1=\"22.0\" x2=\"264.0\" y2=\"22.0\" stroke=\"#d9cfbe\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"170.0\" y=\"160.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a8291\" font-weight=\"normal\">(8, −6): 37° south of east<\/text><circle cx=\"120.0\" cy=\"130.0\" r=\"4\" fill=\"#264653\"/><\/svg>", "figcap": "Car A 8 east, car B 6 north: v_A − v_B = (8, −6), 37° south of east.", "opts": ["37° south of east", "53° south of east", "37° north of east", "45° south of east"], "ans": 0, "sol": ["Step 1 — vA = (8, 0) east, vB = (0, 6) north.", "Step 2 — vA relative to B = (8, −6).", "Step 3 — Direction: tan = <span class=\"fr\"><span class=\"fn\">6<\/span><span class=\"fd\">8<\/span><\/span> = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> → 37° below east.", "Step 4 — Below east = south of east → 37° south of east.", "Step 5 — Option (A) (tan37° = <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> diya hai)."], "note": "vAB direction: tan = |Δy|/|Δx|. 3-4-5 → 37°/53°.", "wrong": {"0": "53° south of east — tan <span class=\"fr\"><span class=\"fn\">4<\/span><span class=\"fd\">3<\/span><\/span> wala (<span class=\"fr\"><span class=\"fn\">x<\/span><span class=\"fd\">y<\/span><\/span> ulta).", "2": "North of east — y component negative hai (south).", "3": "45° — tan 1 nahi, <span class=\"fr\"><span class=\"fn\">3<\/span><span class=\"fd\">4<\/span><\/span> hai."}}, {"n": 333, "type": "match", "topic": "rel", "q": "Match the Columns. <div class=\"cols\"><div class=\"colbox\"><div class=\"colhead\">Column I:<\/div><div class=\"colitem\">(a) Rain falling vertically at 4 m/s and a man walking horizontally at 3 m/s<\/div><div class=\"colitem\">(b) Two cars moving in the same direction at 20 m/s and 30 m/s<\/div><div class=\"colitem\">(c) Two cars moving in opposite directions at 20 m/s and 30 m/s<\/div><div class=\"colitem\">(d) Two particles moving with exactly equal velocities<\/div><\/div><div class=\"colbox\"><div class=\"colhead\">Column II:<\/div><div class=\"colitem\">(i) zero<\/div><div class=\"colitem\">(ii) 5 m/s<\/div><div class=\"colitem\">(iii) 10 m/s<\/div><div class=\"colitem\">(iv) 50 m/s<\/div><\/div><\/div>", "fig": "", "figcap": "", "opts": ["a-ii, b-iii, c-iv, d-i", "a-iii, b-ii, c-iv, d-i", "a-ii, b-i, c-iii, d-iv", "a-iv, b-iii, c-ii, d-i"], "ans": 0, "sol": ["Step 1 — (a) Rain 4, man 3 → √<span class=\"rad\">(16+9)<\/span> = 5 → (ii)", "Step 2 — (b) 20 & 30 same direction → 10 → (iii)", "Step 3 — (c) 20 & 30 opposite → 50 → (iv)", "Step 4 — (d) Equal velocities → zero → (i)", "Step 5 — Toh a-ii, b-iii, c-iv, d-i → option (A)."], "note": "Pythagoras (perpendicular), difference (same), sum (opposite), zero (equal).", "wrong": {"1": "10 same-direction hai — 5 (perpendicular) nahi.", "2": "50 opposite hai — 10 nahi.", "3": "Zero equal velocities hai — 5 nahi."}}, {"n": 334, "type": "statement", "topic": "rel", "q": "Consider the following statements about two particles moving with velocities of magnitudes v and 2v in directions inclined at 60° to each other. Statement I: The magnitude of their relative velocity is √<span class=\"rad\">3<\/span> v. Statement II: The square of the magnitude of the difference of two vectors is v₁² + v₂² − 2v₁v₂ cos θ, where θ is the angle between them.", "fig": "", "figcap": "", "opts": ["Both Statement I and Statement II are true", "Statement I is true but Statement II is false", "Statement I is false but Statement II is true", "Both Statement I and Statement II are false"], "ans": 0, "sol": ["Step 1 — Statement I: |vA−vB|² = v² + (2v)² − 2·v·2v·cos60° = v² + 4v² − 2v² = 3v² → |vA−vB| = √<span class=\"rad\">3<\/span> v ✓ TRUE.", "Step 2 — Statement II: |v1−v2|² = v1²+v2²−2v1v2 cosθ ✓ TRUE.", "Step 3 — Dono true → option (A)."], "note": "Relative velocity: law of cosines (minus sign — difference).", "wrong": {"1": "Law of cosines sahi — Statement II sahi.", "2": "√<span class=\"rad\">3<\/span>v verified — Statement I sahi.", "3": "Dono true hain."}}, {"n": 335, "type": "mcq", "topic": "rel", "q": "Particle A moves with velocity (2î + 3ĵ) m/s and particle B with (6î + 6ĵ) m/s. The magnitude of the velocity of B relative to A is", "fig": "", "figcap": "", "opts": ["5 m/s", "7 m/s", "√<span class=\"rad\">13<\/span> m/s", "1 m/s"], "ans": 0, "sol": ["Step 1 — vB−vA = (6−2, 6−3) = (4, 3).", "Step 2 — |.| = √<span class=\"rad\">(16+9)<\/span> = 5 m/s.", "Step 3 — Option (A) — 3-4-5!"], "note": "vBA = vB − vA. Pythagoras.", "wrong": {"1": "7 = 4+3 — perpendicular hain, Pythagoras: 5.", "2": "√<span class=\"rad\">13<\/span> = √<span class=\"rad\">(16+…)<\/span>? — (4,3) hai, magnitude 5.", "3": "1 = |4−3|? — components alag axes pe."}}, {"n": 336, "type": "statement", "topic": "ucm", "q": "Which of the following statements are correct for a particle in uniform circular motion? (1) Its angular momentum about the centre is constant in both magnitude and direction. (2) Its areal velocity about the centre, dS/dt = L/(2m), is constant. (3) Its linear momentum is constant in magnitude but not in direction. (4) Its acceleration is constant in both magnitude and direction.", "fig": "", "figcap": "", "opts": ["1, 2 and 3 only", "1, 2 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4"], "ans": 0, "sol": ["Step 1 — (1) L about centre constant (mRv) ✓ TRUE.", "Step 2 — (2) Areal velocity = <span class=\"fr\"><span class=\"fn\">L<\/span><span class=\"fd\">2m<\/span><\/span> constant ✓ TRUE.", "Step 3 — (3) Linear momentum: magnitude constant, direction changing ✓ TRUE (statement sahi hai).", "Step 4 — (4) 'Acceleration constant in magnitude AND direction' — GALAT! Direction changes.", "Step 5 — Correct: 1, 2, 3 → option (A)."], "note": "UCM: p magnitude constant direction changes; a direction changes.", "wrong": {"0": "4 galat hai (a direction changes) — D chuk jaoge.", "1": "4 FALSE — acceleration direction badalti hai.", "3": "4 galat hai — magnitude constant, direction nahi."}}, {"n": 337, "type": "mcq", "topic": "ucm", "q": "Which of the following is NOT correct for uniform circular motion?", "fig": "", "figcap": "", "opts": ["The centripetal acceleration is always perpendicular to the velocity", "The centripetal force does no work on the particle", "The linear speed v and angular speed ω are related as v = ωR", "The time period of revolution is directly proportional to the angular speed"], "ans": 3, "sol": ["Step 1 — (A) Centripetal acceleration ⊥ velocity ✓ correct.", "Step 2 — (B) Centripetal force no work ✓ correct.", "Step 3 — (C) v = ωR ✓ correct.", "Step 4 — (D) 'T directly proportional to ω' — GALAT! T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span> — INVERSELY proportional.", "Step 5 — Not correct = (D).", "Step 6 — Isliye sahi answer: Option (D)."], "note": "T = <span class=\"fr\"><span class=\"fn\">2π<\/span><span class=\"fd\">ω<\/span><\/span> — inverse (ω up → T down).", "wrong": {"0": "F⊥a… a⊥v — sahi.", "1": "No work — sahi.", "3": "v = ωR — sahi."}}, {"n": 338, "type": "assertion", "topic": "ucm", "q": "Assertion (A): A particle in uniform circular motion has constant kinetic energy, but its linear momentum is not constant. Reason (R): Kinetic energy is a scalar depending on v², whereas momentum is a vector whose direction changes continuously.", "fig": "", "figcap": "", "opts": ["Both Assertion and Reason are true and Reason is the correct explanation of Assertion", "Both Assertion and Reason are true but Reason is not the correct explanation of Assertion", "Assertion is true but Reason is false", "Assertion is false and Reason is also false"], "ans": 0, "sol": ["Step 1 — Assertion: KE constant (v constant), linear momentum NOT constant (direction) ✓ TRUE.", "Step 2 — Reason: KE scalar (v² se), momentum vector (direction changes) ✓ TRUE.", "Step 3 — R exactly distinction batata hai → correct explanation.", "Step 4 — Option (A)."], "note": "KE ∝ v² scalar; p = mv vector — UCM mein alag behavior.", "wrong": {"1": "R correct explanation hai.", "2": "R true hai (scalar vs vector).", "3": "Assertion true hai."}}, {"n": 339, "type": "diagram", "topic": "ucm", "q": "Study the described graph. A graph is plotted with centripetal acceleration a (in m/s²) on the y-axis and <span class=\"fr\"><span class=\"fn\">1<\/span><span class=\"fd\">R<\/span><\/span> (in m⁻¹) on the x-axis, for particles moving with the same constant speed v, where R is the radius of the circle. The graph is a straight line through the origin with slope 16 m³/s². The value of v is", "fig": "<svg class=\"fig\" viewBox=\"0 0 340 200\" role=\"img\" aria-label=\"Diagram for question 339\"><defs><marker id=\"m339\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#264653\"/><\/marker><marker id=\"mt339\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#2a9d8f\"/><\/marker><marker id=\"mr339\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#e76f51\"/><\/marker><marker id=\"mg339\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"#d9a441\"/><\/marker><\/defs><line x1=\"60.0\" y1=\"160.0\" x2=\"308.0\" y2=\"160.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"160.0\" x2=\"60.0\" y2=\"32.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"310.0\" y1=\"160.0\" x2=\"301.0\" y2=\"156.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"310.0\" y1=\"160.0\" x2=\"301.0\" y2=\"164.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"30.0\" x2=\"56.0\" y2=\"39.0\" stroke=\"#264653\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"30.0\" x2=\"6
