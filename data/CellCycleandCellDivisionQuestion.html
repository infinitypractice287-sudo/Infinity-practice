const ALL = /*__DATA__*/[{"id": 1, "tag": "Direct MCQ", "q": "The sequence of events by which a cell duplicates its genome, synthesises the other cell constituents and then divides into two daughter cells is called:", "fig": null, "opt": ["Cell division", "Cell cycle", "Karyokinesis", "Cytokinesis"], "ans": 1, "c": "Cell cycle ek ordered sequence hai jisme cell pehle apna genome aur doosre components duplicate karta hai, phir do daughter cells mein divide hota hai. Iske char phases hote hain: $G_1$, $S$, $G_2$ aur $M$.", "m": "Definition yaad karo: duplication + division ka poora sequence = cell cycle.", "s": ["Cell division sirf $M$ phase ka hissa hai, poora sequence nahi.", "Karyokinesis = nucleus ka division, cytokinesis = cytoplasm ka division — ye dono sirf $M$ phase ke events hain.", "Jo term duplication se lekar division tak ka poora ghoorna (cycle) bataye, wahi answer hai: cell cycle."], "r": "", "w": ["Cell division sirf dividing step hai; interphase ke growth aur replication events ismein nahi aate.", "", "Karyokinesis sirf nuclear division hai, poora cycle nahi.", "Cytokinesis sirf cytoplasm ka batwara hai."], "t": "NCERT ki line: 'cell cycle = duplication of genome, synthesis of other constituents, then division into two cells' — yahi framing rat-lo.", "sim": null}, {"id": 2, "tag": "Direct MCQ", "q": "Which of the following is not a phase of interphase?", "fig": null, "opt": ["$G_1$ phase", "$S$ phase", "$G_2$ phase", "$M$ phase"], "ans": 3, "c": "Interphase = $G_1$ + $S$ + $G_2$. Ismein cell grow karta hai, DNA replicate hota hai aur division ki taiyari hoti hai. $M$ phase actual division phase hai, interphase ka hissa nahi.", "m": "Interphase ke teen G-phases/S ko pehchano; jo division phase hai wahi bahar wali option hai.", "s": ["Interphase ka structure: $G_1 \\rightarrow S \\rightarrow G_2$.", "$M$ phase alag se mitosis/meiosis wala phase hai.", "Isliye $M$ phase interphase ka hissa nahi."], "r": "", "w": ["$G_1$ interphase ka pehla gap phase hai.", "$S$ interphase ka DNA synthesis phase hai.", "$G_2$ interphase ka doosra gap phase hai.", ""], "t": "Formula: interphase $\\approx 95\\%$ time leta hai; $M$ phase bahut chhota hota hai.", "sim": null}, {"id": 3, "tag": "Direct MCQ", "q": "Replication of DNA takes place during which phase of the cell cycle?", "fig": null, "opt": ["$G_1$ phase", "$S$ phase", "$G_2$ phase", "$M$ phase"], "ans": 1, "c": "$S$ phase ka naam hi synthesis phase hai — ismein DNA replication hoti hai jisse DNA content $2C$ se $4C$ ho jata hai (diploid cell mein), lekin chromosome number $2n$ hi rehta hai.", "m": "Naam-based identification: $S$ = synthesis of DNA.", "s": ["$G_1$: sirf growth aur metabolism, DNA replication nahi.", "$S$: DNA replicate hoke double ho jata hai.", "$G_2$ aur $M$: replication ke baad ke phases."], "r": "", "w": ["$G_1$ mein cell grow karta hai par DNA replicate nahi hota.", "", "$G_2$ mein replication already ho chuka hota hai, ab mitosis ki taiyari hoti hai.", "$M$ phase mein chromosome divide hote hain, DNA synthesis nahi."], "t": "$S$ phase ke baad har chromosome mein 2 sister chromatids jud jaate hain — isliye chromatids double, chromosomes count same.", "sim": null}, {"id": 4, "tag": "Direct MCQ", "q": "The stage in which cells remain metabolically active but do not proliferate unless called on to do so is:", "fig": null, "opt": ["$G_1$ phase", "$G_0$ phase", "$S$ phase", "$G_2$ phase"], "ans": 1, "c": "$G_0$ = quiescent phase. Cell active cycle se $G_1$ ke raaste bahar nikalta hai. Metabolism chalti rehti hai (cell apna kaam karta hai), par division nahi karta jab tak signal na mile.", "m": "'Metabolically active par non-dividing' wali NCERT line seedha $G_0$ ki definition hai.", "s": ["Active cycle: $G_1 \\rightarrow S \\rightarrow G_2 \\rightarrow M$.", "$G_0$ is cycle ka exit point hai, $G_1$ se jaate hain.", "Neurons jaisi cells permanent $G_0$ mein; lymphocytes wapas aa sakti hain."], "r": "", "w": ["$G_1$ active cycle ka phase hai jahan se aage $S$ mein jana hota hai.", "", "$S$ mein DNA replication chal rahi hoti hai.", "$G_2$ mitosis ki taiyari wala phase hai."], "t": "Mature neuron = permanent $G_0$ ka classic example — aksar pucha jata hai.", "sim": null}, {"id": 5, "tag": "Direct MCQ", "q": "Mitosis is also referred to as:", "fig": null, "opt": ["Reduction division", "Equational division", "Direct division", "Heterotypic division"], "ans": 1, "c": "Mitosis mein daughter cells ka chromosome number parent ke barabar rehta hai ($2n \\rightarrow 2n$), isliye ise equational division kehte hain. Reduction division meiosis-I hai.", "m": "Chromosome number compare karo: same = equational, half = reductional.", "s": ["Parent diploid $2n$, replication ke baad mitosis.", "Anaphase mein chromatids alag hote hain, har daughter nucleus ko $2n$ milta hai.", "Number same = equational division."], "r": "", "w": ["Reduction division meiosis-I hai ($2n \\rightarrow n$).", "", "Direct division amitosis hai (spindle ke bina nucleus ka constriction).", "Heterotypic division bhi meiosis-I ke liye use hota hai, mitosis ke liye nahi."], "t": "Meiosis-II bhi equational hai par haploid cell mein hota hai — farak zaroor yaad rakho.", "sim": null}, {"id": 6, "tag": "Direct MCQ", "q": "The division of the cytoplasm of a cell into two daughter cells is known as:", "fig": null, "opt": ["Karyokinesis", "Cytokinesis", "Synapsis", "Terminalisation"], "ans": 1, "c": "Karyokinesis = nucleus ka division; cytokinesis = cytoplasm ka division. Cytokinesis karyokinesis ke baad hota hai.", "m": "Naam split karo: cyto = cytoplasm, kinesis = division.", "s": ["Pehle nucleus divide hota hai (karyokinesis).", "Phir cytoplasm bat-ta hai (cytokinesis).", "Animal cell: furrow; plant cell: cell plate."], "r": "", "w": ["Karyokinesis nucleus ka division hai.", "", "Synapsis homologous chromosomes ka pairing hai (meiosis).", "Terminalisation chiasmata ka ends ki taraf slide karna hai."], "t": "Karyokinesis bina cytokinesis = syncytium/multinucleate condition (coconut liquid endosperm).", "sim": null}, {"id": 7, "tag": "Direct MCQ", "q": "During which stage of mitosis do all the chromosomes arrange themselves at the equatorial plate?", "fig": null, "opt": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "ans": 1, "c": "Metaphase mein chromosomes spindle ke equator par align hote hain; kinetochores par opposite poles ki spindle fibres attach hoti hain. Ye morphology study ke liye best stage hai.", "m": "Keyword 'equatorial plate' seedha metaphase indicate karta hai.", "s": ["Prophase: condensation, envelope break.", "Metaphase: equator par alignment.", "Anaphase: chromatids separate; telophase: envelope reforms."], "r": "", "w": ["Prophase mein chromosomes condense hote hain, align nahi.", "", "Anaphase mein chromatids poles par jaate hain.", "Telophase mein chromosomes decondense aur envelope banta hai."], "t": "Metaphase chromosomes sabse zyada condensed hote hain — karyotyping isi stage par hoti hai.", "sim": null}, {"id": 8, "tag": "Direct MCQ", "q": "Splitting of the centromere and separation of sister chromatids towards opposite poles occurs during:", "fig": null, "opt": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "ans": 2, "c": "Anaphase ka defining event: centromere split, sister chromatids (ab daughter chromosomes) opposite poles ki taraf move karti hain.", "m": "Centromere splitting = anaphase ka signature event.", "s": ["Metaphase tak centromere intact, chromatids jude.", "Anaphase: centromere split, poleward movement.", "Telophase: chromosomes poles par pahunch jaate hain."], "r": "", "w": ["Prophase mein centromere split nahi hota, sirf condensation hoti hai.", "Metaphase mein alignment hoti hai, splitting nahi.", "", "Telophase mein envelope aur nucleolus reform hote hain."], "t": "Mitotic anaphase aur meiosis-II anaphase dono mein centromere split hota hai; anaphase-I mein nahi.", "sim": null}, {"id": 9, "tag": "Direct MCQ", "q": "At the end of meiosis, one diploid parent cell gives rise to:", "fig": null, "opt": ["Two diploid daughter cells", "Four haploid daughter cells", "Two haploid daughter cells", "Four diploid daughter cells"], "ans": 1, "c": "Meiosis mein ek DNA replication ke baad do nuclear divisions hote hain, jisse ek diploid ($2n$) cell se 4 haploid ($n$) daughter cells banti hain.", "m": "Meiosis ka product count: 1 replication + 2 divisions = 4 haploid cells.", "s": ["Meiosis-I: $2n \\rightarrow n$ (reduction).", "Meiosis-II: haploid cell ka equational division.", "Final: 4 cells, har ek mein $n$ chromosomes."], "r": "", "w": ["2 diploid cells mitosis ka product hai.", "", "2 haploid cells sirf ek division se banti, meiosis mein do divisions hain.", "4 diploid cells banana chromosome counting ke hisaab se impossible hai."], "t": "Plant mein: 1 microspore mother cell $\\rightarrow$ 4 pollen; female side mein 1 megaspore mother cell $\\rightarrow$ 4 megaspores (3 degenerate).", "sim": null}, {"id": 10, "tag": "Direct MCQ", "q": "The pairing of homologous chromosomes during prophase I of meiosis is called:", "fig": null, "opt": ["Synapsis", "Crossing over", "Terminalisation", "Disjunction"], "ans": 0, "c": "Synapsis = homologous chromosomes ka pairing, jo zygotene stage mein shuru hota hai; iske saath synaptonemal complex banta hai.", "m": "Pairing process ka naam synapsis hai; baaki options alag events hain.", "s": ["Leptotene: chromosomes condense.", "Zygotene: homologs pair (synapsis).", "Pachytene: crossing over; diplotene: chiasmata."], "r": "", "w": ["", "Crossing over pachytene mein non-sister chromatids ke beech segment exchange hai.", "Terminalisation chiasmata ka ends ki taraf khisakna hai.", "Disjunction homologs ka anaphase-I mein alag hona hai."], "t": "Synapsis ke baad paired homologs ko bivalent kehte hain; 4 chromatids dikhne par tetrad.", "sim": null}, {"id": 11, "tag": "Direct MCQ", "q": "The enzyme responsible for crossing over between homologous chromosomes is:", "fig": null, "opt": ["Recombinase", "DNA ligase", "DNA polymerase", "Helicase"], "ans": 0, "c": "Recombinase enzyme pachytene stage mein recombination nodules par non-sister chromatids ke beech crossing over catalyse karta hai.", "m": "Crossing over = recombination event, enzyme ka naam usi se related: recombinase.", "s": ["Recombination nodules pachytene mein bante hain.", "Wahan recombinase exchange catalyse karta hai.", "Baaki enzymes replication machinery ke hain."], "r": "", "w": ["", "DNA ligase okazaki fragments jodta hai.", "DNA polymerase naya DNA strand banata hai.", "Helicase DNA helix unwind karta hai."], "t": "Recombinase ka pachytene + recombination nodules — teeno ka combo ek hi favourite NEET frame hai.", "sim": null}, {"id": 12, "tag": "Direct MCQ", "q": "Cytokinesis in a plant cell begins with the formation of:", "fig": null, "opt": ["Cleavage furrow", "Cell plate", "Contractile ring", "Synaptonemal complex"], "ans": 1, "c": "Plant cells mein rigid cell wall hoti hai, isliye furrow nahi banta. Golgi-derived vesicles centre mein fuse hoke cell plate banati hain jo baad mein middle lamella banti hai.", "m": "Plant = cell plate (centrifugal growth); animal = furrow (centripetal).", "s": ["Vesicles equator par fuse hoti hain.", "Cell plate centre se bahar ki taraf badhti hai.", "Nayi wall banakar do daughter cells alag."], "r": "", "w": ["Cleavage furrow animal cells mein banta hai.", "", "Contractile ring (actin) animal cell ka furrow mechanism hai.", "Synaptonemal complex meiosis prophase-I ka structure hai."], "t": "Cell plate = future middle lamella — ye exact NCERT line bar-bar puchi jati hai.", "sim": null}, {"id": 13, "tag": "Statement-based", "q": "Consider the following statements about interphase. Statement I: Interphase is also called the resting phase of the cell cycle. Statement II: DNA replication occurs during the $S$ phase of interphase. Statement III: The cell grows and synthesises proteins during interphase. Statement IV: Interphase occupies less than half of the duration of a typical cell cycle. Which of the above statements are correct?", "fig": null, "opt": ["I and II only", "II and III only", "I, II and III", "II, III and IV"], "ans": 2, "c": "Interphase ko 'resting phase' kaha jata hai (purana naam, kyunki microscope mein division dikhta nahi), halanki metabolically sabse active hai. $S$ mein DNA replication, $G_1/G_2$ mein growth aur protein synthesis hota hai. Interphase lagbhag $95\\%$ samay leta hai.", "m": "Har statement ko ek-ek karke verify karo, phir combination match karo.", "s": ["I sahi: resting phase wala naam NCERT mein hai.", "II sahi: replication $S$ phase ka kaam hai.", "III sahi: growth/protein synthesis $G_1$-$G_2$ mein hota hai.", "IV galat: interphase $95\\%$ time leta hai, aadhe se kam nahi."], "r": "", "w": ["Ye I ko chhod deta hai, jabki 'resting phase' wala statement sahi hai.", "Ye IV include nahi karta par I ko bhi miss karta hai.", "", "IV galat hai isliye ye combination invalid hai."], "t": "'Resting' naam misleading hai — cell rest nahi kar raha, microscope se division nahi dikh raha bas.", "sim": null}, {"id": 14, "tag": "Statement-based", "q": "Consider the following statements about the $G_1$ phase. Statement I: The cell is metabolically active and continuously grows. Statement II: The DNA content of a diploid cell remains $2C$. Statement III: Replication of DNA takes place in this phase. Statement IV: Some cells leaving $G_1$ enter the $G_0$ stage. Which of the above statements are correct?", "fig": null, "opt": ["I, II and IV", "I, III and IV", "II and III only", "I and IV only"], "ans": 0, "c": "$G_1$ mein cell metabolically active hoke grow karta hai, DNA $2C$ hi rehta hai (replication abhi nahi hui). Kuch cells yahin se $G_0$ mein nikal jaati hain. Replication to $S$ phase mein hoti hai.", "m": "Phase-wise events table banao aur har statement match karo.", "s": ["I sahi: growth + metabolism wala gap phase.", "II sahi: replication se pehle DNA $2C$.", "III galat: replication $S$ phase ka kaam hai.", "IV sahi: $G_0$ ka entry point $G_1$ hai."], "r": "", "w": ["", "III galat hai (DNA replication $G_1$ mein nahi).", "III galat hone se ye combination bhi galat.", "II bhi sahi hai jo ismein chhoot raha hai."], "t": "$G_1$ ka restriction point cross karne ke baad cell $S$ phase mein commit ho jata hai.", "sim": null}, {"id": 15, "tag": "Statement-based", "q": "Consider the following statements about the $S$ phase. Statement I: Synthesis or replication of DNA takes place. Statement II: The amount of DNA per cell gets doubled. Statement III: The chromosome number of the cell gets doubled. Statement IV: In animal cells, the centriole duplicates in the cytoplasm. Which of the above statements are correct?", "fig": null, "opt": ["I and II only", "I, II and IV", "II, III and IV", "I, III and IV"], "ans": 1, "c": "$S$ phase mein DNA double hota hai ($2C \\rightarrow 4C$), par chromosome number same rehta hai kyunki dono sister chromatids ek hi centromere se jude rehte hain. Animal cell mein centriole bhi duplicate hota hai.", "m": "DNA double vs chromosome count same — ye $S$ phase ka classic trap hai.", "s": ["I sahi: synthesis isi phase mein.", "II sahi: DNA content $2C \\rightarrow 4C$.", "III galat: centromere count nahi badalta, chromosome number $2n$ hi rehta hai.", "IV sahi: centriole duplication cytoplasm mein $S$ phase mein hoti hai."], "r": "", "w": ["III galat hai aur IV chhoot raha hai.", "", "III galat statement include karta hai.", "III galat hone se ye bhi invalid."], "t": "Rule: chromosome gino centromere gino — chromatids double ho sakte hain, centromeres nahi.", "sim": null}, {"id": 16, "tag": "Statement-based", "q": "Consider the following statements about prophase of mitosis. Statement I: The chromosomal material condenses to form distinct chromosomes. Statement II: The centrioles begin to move towards opposite poles of the cell. Statement III: The nucleolus and nuclear envelope disappear by the end of this stage. Statement IV: Chromatids start moving towards the opposite poles. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "I, III and IV"], "ans": 0, "c": "Prophase: chromatin condenses, centrosomes/centrioles opposite poles par jaate hain, aur prophase ke end tak nucleolus + nuclear envelope gayab. Chromatid movement to anaphase ka event hai.", "m": "Stage ke start vs end events yaad karke galat statement (IV) nikalo.", "s": ["I sahi: condensation prophase ka pehla visible event.", "II sahi: centrioles poles par move karte hain.", "III sahi: late prophase/prometaphase tak envelope break.", "IV galat: poleward movement anaphase mein hoti hai."], "r": "", "w": ["", "IV galat event include karta hai.", "I sahi hai jo ismein nahi.", "II bhi sahi hai jo chhoot gaya."], "t": "Higher plant cells mein centrioles/asters nahi hote — spindle phir bhi banta hai.", "sim": null}, {"id": 17, "tag": "Statement-based", "q": "Consider the following statements about telophase of mitosis. Statement I: The chromosomes decondense and lose their individuality. Statement II: The nuclear envelope reforms around the chromosome clusters. Statement III: The nucleolus, Golgi complex and endoplasmic reticulum reform. Statement IV: The spindle apparatus is newly assembled in this stage. Which of the above statements are correct?", "fig": null, "opt": ["II and IV only", "I, II and III", "I, III and IV", "I and II only"], "ans": 1, "c": "Telophase prophase ka ulta hai: chromosomes decondense, envelope + nucleolus + ER/Golgi reform. Spindle to assemble prophase mein hua tha; telophase mein woh dis-assemble hota hai.", "m": "'Prophase ka reverse' socho — jo prophase mein bana woh telophase mein wapas reform hota hai.", "s": ["I sahi: decondensation telophase ka feature.", "II sahi: envelope clusters ke around reforms.", "III sahi: organelles wapas bante hain.", "IV galat: spindle telophase mein toot-ta hai, banta nahi."], "r": "", "w": ["IV galat hai aur I chhoot raha hai.", "", "IV galat include karta hai.", "III bhi sahi hai jo missing hai."], "t": "Telophase ke turant baad cytokinesis cytoplasm bat-ta hai.", "sim": null}, {"id": 18, "tag": "Statement-based", "q": "Consider the following statements about cytokinesis. Statement I: In animal cells, a cleavage furrow appears in the plasma membrane. Statement II: In plant cells, cytokinesis is achieved by formation of the cell plate. Statement III: Karyokinesis without cytokinesis produces a multinucleate syncytium, as in liquid endosperm of coconut. Statement IV: In plant cells, a cleavage furrow deepens and divides the cytoplasm. Which of the above statements are correct?", "fig": null, "opt": ["I and II only", "III and IV only", "I, II and III", "II, III and IV"], "ans": 2, "c": "Animal: furrow (centripetal); plant: cell plate (centrifugal). Agar nuclear division ke baad cytoplasm na bante to syncytium banta hai — coconut endosperm iska example. Plant mein furrow ban hi nahi sakta (cell wall rigid hai).", "m": "Animal vs plant cytokinesis ka comparison + syncytium concept.", "s": ["I sahi: animal plasma membrane furrow banati hai.", "II sahi: plant cell plate banata hai.", "III sahi: bina cytokinesis ke syncytium.", "IV galat: furrow animal ka mechanism hai, plant ka nahi."], "r": "", "w": ["III bhi sahi hai jo chhoot raha hai.", "IV galat hai.", "", "IV galat statement se ye combination fail."], "t": "Furrow = centripetal (bahar se andar); plate = centrifugal (andar se bahar) — direction ka trap bahut aata hai.", "sim": null}, {"id": 19, "tag": "Statement-based", "q": "Consider the following statements about meiosis. Statement I: It involves two sequential cycles of nuclear and cell division but only one cycle of DNA replication. Statement II: It occurs in diploid germ cells. Statement III: It results in the formation of four haploid daughter cells. Statement IV: The overall process is called equational division. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II and IV only", "I, III and IV", "I and IV only"], "ans": 0, "c": "Meiosis = 1 replication + 2 divisions, diploid germ cells mein, output 4 haploid cells. Overall process reductional hai (equational nahi) kyunki chromosome number half hota hai.", "m": "Meiosis ke 4 basic facts verify karo; galat label (equational) pakdo.", "s": ["I sahi: ek hi $S$ phase, do divisions.", "II sahi: germ cells diploid hoti hain.", "III sahi: 4 haploid products.", "IV galat: meiosis overall reductional division hai."], "r": "", "w": ["", "IV galat hai aur I/III missing hain.", "IV galat include karta hai.", "II sahi statement chhoot rahi hai."], "t": "Meiosis-II khud equational hai, par poora meiosis reductional hota hai — yahi shabd-trap hai.", "sim": null}, {"id": 20, "tag": "Statement-based", "q": "Consider the following statements about prophase I of meiosis. Statement I: It is longer and more complex than the prophase of mitosis. Statement II: It is subdivided into leptotene, zygotene, pachytene, diplotene and diakinesis. Statement III: Synapsis of homologous chromosomes occurs during zygotene. Statement IV: Crossing over takes place during diakinesis. Which of the above statements are correct?", "fig": null, "opt": ["II, III and IV", "I, II and III", "I and IV only", "I, III and IV"], "ans": 1, "c": "Prophase I sabse lamba/complex phase hai, 5 sub-stages mein banta hai. Synapsis zygotene mein; crossing over pachytene mein hoti hai, diakinesis mein nahi.", "m": "5 sub-stages ki sequence yaad karke har event ka stage match karo.", "s": ["I sahi: 5 sub-stages iski complexity dikhate hain.", "II sahi: sequence L-Z-P-D-D.", "III sahi: zygotene = synapsis.", "IV galat: crossing over pachytene ka event hai."], "r": "", "w": ["IV galat include karta hai.", "", "IV galat hai aur II chhoot raha hai.", "II sahi hai par missing hai."], "t": "Mnemonic: LeptZyPaDiDi — Leptotene, Zygotene, Pachytene, Diplotene, Diakinesis.", "sim": null}, {"id": 21, "tag": "Statement-based", "q": "Consider the following statements about the anaphase stages of meiosis. Statement I: In anaphase I, homologous chromosomes separate while sister chromatids remain together. Statement II: In anaphase I, sister chromatids remain associated at their centromeres. Statement III: In anaphase II, the sister chromatids separate. Statement IV: The centromere splits during anaphase I. Which of the above statements are correct?", "fig": null, "opt": ["I and II only", "II, III and IV", "I, II and III", "I, III and IV"], "ans": 2, "c": "Anaphase-I: homologs alag, centromere split nahi, sister chromatids jude. Anaphase-II: centromere split, sister chromatids alag — bilkul mitotic anaphase jaisa.", "m": "Centromere kab split hota hai — ye key hai: sirf mitotic anaphase aur anaphase-II mein.", "s": ["I sahi: reduction yahin hota hai.", "II sahi: centromeric cohesion anaphase-I mein protected rehta hai.", "III sahi: anaphase-II equational jaisa.", "IV galat: centromere anaphase-I mein nahi phat-ta."], "r": "", "w": ["III bhi sahi hai jo missing hai.", "IV galat include karta hai.", "", "IV galat hone se invalid."], "t": "Anaphase-I ke baad har chromosome mein 2 chromatids; anaphase-II ke baad 1 chromatid.", "sim": null}, {"id": 22, "tag": "Statement-based", "q": "Consider the following statements about the significance of cell divisions. Statement I: Mitosis keeps the chromosome number constant in the daughter cells. Statement II: Meiosis helps conserve the specific chromosome number of a species across generations. Statement III: Crossing over during meiosis leads to genetic variation. Statement IV: Mitosis reduces the chromosome number of the cell to half. Which of the above statements are correct?", "fig": null, "opt": ["I, III and IV", "II and IV only", "I, II and III", "I and II only"], "ans": 2, "c": "Mitosis number constant rakhta hai ($2n \\rightarrow 2n$); meiosis gametes mein $n$ banata hai jise fertilisation wapas $2n$ karta hai — species ka number conserve. Crossing over variation deta hai. Mitosis number kabhi half nahi karta.", "m": "Mitosis = conservation; meiosis = reduction + fertilisation cycle; variation sirf meiosis se.", "s": ["I sahi: equational division.", "II sahi: meiosis + fertilisation ka chakra number maintain karta hai.", "III sahi: recombination = variation.", "IV galat: half karna meiosis-I ka kaam hai."], "r": "", "w": ["IV galat include karta hai.", "IV galat hai.", "", "III bhi sahi statement missing hai."], "t": "Genetic variation evolution ka raw material hai — NCERT meiosis significance wali line.", "sim": null}, {"id": 23, "tag": "Correct finder", "q": "Which of the following statements about the $G_0$ phase is correct?", "fig": null, "opt": ["Cells in $G_0$ are metabolically completely inactive.", "Cells in $G_0$ remain metabolically active but do not proliferate.", "DNA replication takes place continuously in the $G_0$ phase.", "$G_0$ is a sub-stage of the $M$ phase."], "ans": 1, "c": "$G_0$ cells division nahi karti par apni normal metabolism chalati hain — neurons, muscle cells yahin permanent rehti hain. DNA replication bilkul nahi hoti aur ye $M$ phase ka hissa nahi, $G_1$ se exit hai.", "m": "'Active par non-proliferating' — yahi ek-line definition hai.", "s": ["$G_0$ ka entry point $G_1$ hai.", "Metabolism on, replication off.", "Kuch cells (lymphocytes) signal par wapas $G_1$ mein aa sakti hain."], "r": "", "w": ["Metabolically inactive nahi hoti; cell apna function karta rehta hai.", "", "Replication sirf $S$ phase mein hoti hai.", "$G_0$ interphase se bahar ki quiescent state hai, $M$ nahi."], "t": "Permanent $G_0$: neuron; reversible $G_0$: lymphocyte/hepatocyte.", "sim": null}, {"id": 24, "tag": "Incorrect finder", "q": "Which of the following statements about the $S$ phase is NOT correct?", "fig": null, "opt": ["DNA synthesis takes place during this phase.", "The amount of DNA per cell becomes double.", "In animal cells, the centriole duplicates in the cytoplasm.", "The ploidy of the cell changes from diploid to tetraploid."], "ans": 3, "c": "$S$ phase ke baad DNA $4C$ ho jata hai par ploidy $2n$ hi rehti hai kyunki chromatids ek hi centromere se jude hain. Ploidy tab badlegi jab centromeres alag hon (ya colchicine jaisa spindle block ho).", "m": "DNA content aur ploidy mein farak samjho: content double, ploidy same.", "s": ["DNA synthesis hota hai — sahi.", "Content $2C \\rightarrow 4C$ — sahi.", "Centriole duplicate — sahi.", "Ploidy $2n \\rightarrow 4n$ kabhi nahi hoti sirf $S$ phase se."], "r": "", "w": ["Ye $S$ phase ka core event hai, sahi statement.", "DNA doubling sahi fact hai.", "Centriole duplication bhi $S$ phase mein hoti hai.", ""], "t": "Tetraploid wahi cell hoga jisme spindle banne na paaye (colchicine) aur chromatids ek hi nucleus mein reh jayein.", "sim": null}, {"id": 25, "tag": "Correct finder", "q": "Select the correct statement about the metaphase of mitosis:", "fig": null, "opt": ["The chromosomes cluster at the opposite poles of the cell.", "Spindle fibers attach to the kinetochores of the chromosomes.", "The nuclear envelope reforms around the chromosomes.", "The nucleolus and Golgi bodies reappear in the cytoplasm."], "ans": 1, "c": "Metaphase mein har chromosome ke kinetochore par opposite poles se fibres attach hote hain aur chromosomes equator par align hote hain. Baaki events telophase/anaphase ke hain.", "m": "Metaphase ke do keywords: kinetochore attachment + equatorial alignment.", "s": ["Poles par clustering anaphase/telophase ka event hai.", "Kinetochore attachment metaphase ka hallmark hai.", "Envelope/nucleolus/Golgi ka reappear telophase mein hota hai."], "r": "", "w": ["Pole par to chromosomes anaphase ke baad pahunchte hain.", "", "Envelope reformation telophase ka event hai.", "Nucleolus/Golgi reappearance bhi telophase mein hota hai."], "t": "Kinetochore = centromere par bana protein disc; fibres isi par attach hote hain, seedha DNA par nahi.", "sim": null}, {"id": 26, "tag": "Incorrect finder", "q": "Which of the following statements about the anaphase of mitosis is NOT correct?", "fig": null, "opt": ["The centromere of each chromosome splits.", "The sister chromatids separate from each other.", "Each chromosome continues to retain two sister chromatids.", "The chromatids move towards the opposite poles of the cell."], "ans": 2, "c": "Anaphase mein centromere phat-ta hai, jisse dono sister chromatids alag hoke independent daughter chromosomes ban jaate hain. Isliye kisi chromosome mein do chromatids reh hi nahi sakte.", "m": "Anaphase ka defining event (centromere split) pakdo — jo statement uska opposite bole wahi NOT correct.", "s": ["Centromere split = anaphase.", "Har chromatid ab khud chromosome ban jata hai.", "Poleward movement shuru.", "Isliye 'do chromatids retain' wali line galat hai."], "r": "", "w": ["Centromere splitting anaphase ka sahi event hai.", "Sister chromatid separation bhi sahi event hai.", "", "Chromatid poleward movement bhi anaphase mein hota hai."], "t": "Anaphase ke baad chromosome count temporarily double dikhta hai (centromere count double).", "sim": null}, {"id": 27, "tag": "Correct finder", "q": "Select the correct statement from the following:", "fig": null, "opt": ["Mitosis reduces the chromosome number of the daughter cells to half.", "Meiosis II is the reduction division.", "Meiosis I is the reduction division.", "Meiosis produces four diploid daughter cells."], "ans": 2, "c": "Meiosis-I mein homologs alag hote hain ($2n \\rightarrow n$), yahi reductional division hai. Meiosis-II equational hai (haploid cell mein chromatids alag). Mitosis number same rakhta hai aur meiosis 4 haploid cells deta hai.", "m": "Reduction ka matlab: homologs ka separation — jo sirf anaphase-I mein hota hai.", "s": ["Mitosis: $2n \\rightarrow 2n$.", "Meiosis-I: $2n \\rightarrow n$ = reductional.", "Meiosis-II: $n \\rightarrow n$ = equational.", "Final products haploid hote hain."], "r": "", "w": ["Mitosis equational hai, number half nahi karta.", "Meiosis-II equational division hai.", "", "Meiosis 4 haploid cells banata hai, diploid nahi."], "t": "Pehla division reductional, doosra equational — yahi line simplest yaad karne ka trika hai.", "sim": null}, {"id": 28, "tag": "Direct MCQ", "q": "Which of the following is not a sub-stage of prophase I of meiosis?", "fig": null, "opt": ["Leptotene", "Zygotene", "Pachytene", "Interkinesis"], "ans": 3, "c": "Prophase-I ke 5 sub-stages: leptotene, zygotene, pachytene, diplotene, diakinesis. Interkinesis meiosis-I aur meiosis-II ke beech ka short gap hai, prophase-I ka hissa nahi.", "m": "5 names rat-lo; jo gap/resting jaisa naam hai wahi bahar.", "s": ["Prophase-I: L-Z-P-D-D.", "Interkinesis do divisions ke beech aata hai.", "Interkinesis mein DNA replication nahi hoti."], "r": "", "w": ["Leptotene prophase-I ka pehla sub-stage hai.", "Zygotene synapsis wala stage hai.", "Pachytene crossing over wala stage hai.", ""], "t": "Interkinesis = interphase jaisa par bina $S$ phase ke.", "sim": null}, {"id": 29, "tag": "Incorrect finder", "q": "Identify the statement that is NOT correct regarding the pachytene stage:", "fig": null, "opt": ["Crossing over occurs between non-sister chromatids of homologous chromosomes.", "Recombination nodules appear on the homologous chromosomes.", "The synaptonemal complex gets dissolved in this stage.", "The bivalent chromosomes clearly appear as tetrads."], "ans": 2, "c": "Synaptonemal complex pachytene mein stable rehta hai (crossing over isi par support se hota hai); woh dissolve to diplotene ke shuru mein hota hai. Baaki teen pachytene ke sahi features hain.", "m": "SC ka timeline: banta zygotene mein, kaam pachytene mein, toot-ta diplotene mein.", "s": ["Pachytene: recombination nodules + crossing over.", "Tetrad (4 chromatids) clearly visible.", "SC dissolution = diplotene ka pehla event, pachytene ka nahi."], "r": "", "w": ["Non-sister chromatid exchange pachytene ka core event hai.", "Recombination nodules pachytene mein hi aate hain.", "", "Tetrad appearance bhi pachytene ki pehchan hai."], "t": "Diplotene ki shuruaat SC dissolve hote hi mani jati hai — seedha NEET 2024 frame.", "sim": null}, {"id": 30, "tag": "Correct finder", "q": "Which of the following statements about chiasmata is correct?", "fig": null, "opt": ["They are first formed during the leptotene stage.", "They are X-shaped structures that mark the sites of crossing over.", "They undergo terminalisation during the zygotene stage.", "They are made up of spindle microtubules."], "ans": 1, "c": "Chiasmata X-shaped structures hain jin par homologs jude rehte hain; ye crossing over wale sites ke physical marks hain. Pehli baar diplotene mein dikhte hain aur diakinesis tak terminalise hote hain.", "m": "Chiasma = exchange site ka physical mark (X-shape).", "s": ["Leptotene mein sirf condensation, pairing tak nahi.", "Chiasmata diplotene mein visible.", "Terminalisation diplotene $\\rightarrow$ diakinesis mein.", "Ye protein/DNA junction hain, microtubule nahi."], "r": "", "w": ["Leptotene mein na pairing hoti hai na chiasmata.", "", "Terminalisation zygotene mein nahi, baad ke stages mein hoti hai.", "Chiasmata spindle fibres se bane nahi hote."], "t": "Crossing over pachytene mein complete hota hai par chiasmata diplotene mein dikhte hain — timing ka trap.", "sim": null}, {"id": 31, "tag": "Incorrect finder", "q": "Which of the following statements is NOT correct?", "fig": null, "opt": ["In plants, mitotic divisions are seen in both haploid and diploid cells.", "In animals, mitosis is generally seen only in diploid somatic cells.", "The haploid cells of male honey bees divide by mitosis.", "Animal gametes are produced by mitotic division of germ cells."], "ans": 3, "c": "Animals mein gametes meiosis se bante hain (germ cells $2n \\rightarrow$ gametes $n$), mitosis se nahi. Plant mein haploid/diploid dono cells mitosis kar sakti hain; male honey bee (drone) haploid hoke bhi mitosis karta hai.", "m": "Gamete formation ka division yaad karo: animals = meiosis.", "s": ["Plant life cycle alternation ke karan dono ploidy mein mitosis.", "Animal somatic mitosis generally diploid.", "Drone honey bee haploid mitosis ka exception.", "Animal gametes = meiotic product."], "r": "", "w": ["Plant mitosis haploid gametophyte mein bhi hoti hai — sahi.", "Animal somatic cells generally diploid mitosis — sahi.", "Drone ka example NCERT exception hai — sahi.", ""], "t": "Drone (n) apne sperm mitosis se banata hai — ye unusual example exam mein aata hai.", "sim": null}, {"id": 32, "tag": "Correct finder", "q": "Select the correct statement about cytokinesis:", "fig": null, "opt": ["Animal cells carry out cytokinesis by cell plate formation.", "Plant cells show the formation of a cleavage furrow.", "The cell plate represents the middle lamella between the walls of two adjacent cells.", "Cytokinesis always takes place before karyokinesis."], "ans": 2, "c": "Cell plate Golgi vesicles se banti hai aur future middle lamella represent karti hai. Animal cells furrow banati hain; plant cells plate. Cytokinesis hamesha karyokinesis ke baad hoti hai.", "m": "Plant cell plate ka fate = middle lamella — exact NCERT line.", "s": ["Animal: furrow, centripetal.", "Plant: plate, centrifugal.", "Plate $\\rightarrow$ middle lamella.", "Order: pehle karyokinesis, phir cytokinesis."], "r": "", "w": ["Cell plate plant cells ka mechanism hai.", "Cleavage furrow animal cells mein banta hai.", "", "Karyokinesis pehle, cytokinesis baad mein."], "t": "Agar cytokinesis na ho to syncytium — coconut endosperm wala link.", "sim": null}, {"id": 33, "tag": "Match the Columns", "q": "Match the phases of the cell cycle in Column I with their characteristic events in Column II. Column I: (a) $G_1$ phase (b) $S$ phase (c) $G_2$ phase (d) $M$ phase. Column II: (i) DNA replication takes place (ii) Actual mitotic division of the cell (iii) Cell growth and normal metabolic activities (iv) Protein synthesis and preparation for mitosis.", "fig": null, "opt": ["a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-ii, d-iv", "a-iii, b-iv, c-i, d-ii", "a-iv, b-i, c-iii, d-ii"], "ans": 0, "c": "$G_1$ = growth/metabolism; $S$ = DNA replication; $G_2$ = protein synthesis (tubulin etc.) aur mitosis ki taiyari; $M$ = actual division.", "m": "Har phase ka ek core event yaad karke sequence match karo.", "s": ["a $G_1$ $\\rightarrow$ iii (growth).", "b $S$ $\\rightarrow$ i (replication).", "c $G_2$ $\\rightarrow$ iv (mitosis prep).", "d $M$ $\\rightarrow$ ii (division)."], "r": "", "w": ["", "$G_1$ mein replication nahi hoti, pairing galat.", "$S$ ka event iv (protein prep) nahi, replication hai.", "$G_2$ growth-only phase nahi, taiyari wala phase hai."], "t": "$G_2$ mein tubulin proteins bante hain jo spindle banane ke kaam aate hain.", "sim": null}, {"id": 34, "tag": "Match the Columns", "q": "Match the stages of mitosis in Column I with their characteristic features in Column II. Column I: (a) Prophase (b) Metaphase (c) Anaphase (d) Telophase. Column II: (i) Chromosomes align at the equatorial plate (ii) Chromatin condenses into distinct chromosomes (iii) Nuclear envelope and nucleolus reappear (iv) Centromere splits and chromatids move to opposite poles.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iv, c-i, d-iii", "a-iii, b-i, c-iv, d-ii"], "ans": 0, "c": "Prophase condensation; metaphase equatorial alignment; anaphase centromere split + poleward movement; telophase envelope/nucleolus reappearance.", "m": "Chronological order mein events place karo.", "s": ["a $\\rightarrow$ ii (condensation).", "b $\\rightarrow$ i (alignment).", "c $\\rightarrow$ iv (split/movement).", "d $\\rightarrow$ iii (reformation)."], "r": "", "w": ["", "Prophase mein alignment nahi hoti.", "Anaphase ka event iii (reappearance) nahi.", "Telophase mein condensation nahi, decondensation hoti hai."], "t": "Telophase = prophase ka ulta — isse match jaldi solve hoga.", "sim": null}, {"id": 35, "tag": "Match the Columns", "q": "Match the sub-stages of prophase I in Column I with their characteristic events in Column II. Column I: (a) Leptotene (b) Zygotene (c) Pachytene (d) Diplotene. Column II: (i) Crossing over between non-sister chromatids (ii) Compaction of chromosomes (iii) Dissolution of synaptonemal complex and appearance of chiasmata (iv) Synapsis of homologous chromosomes.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-iv, b-ii, c-i, d-iii", "a-ii, b-i, c-iv, d-iii", "a-iii, b-iv, c-i, d-ii"], "ans": 0, "c": "Leptotene = compaction; zygotene = synapsis + SC banta hai; pachytene = crossing over; diplotene = SC dissolve + chiasmata visible.", "m": "L-Z-P-D sequence ke saath har event pin karo.", "s": ["a leptotene $\\rightarrow$ ii.", "b zygotene $\\rightarrow$ iv.", "c pachytene $\\rightarrow$ i.", "d diplotene $\\rightarrow$ iii."], "r": "", "w": ["", "Leptotene mein synapsis shuru nahi hoti.", "Zygotene ka event crossing over nahi, pairing hai.", "Diplotene ka kaam compaction nahi, SC dissolution hai."], "t": "Ye exact pairing NEET 2016/2024 mein bhi puchi ja chuki hai.", "sim": null}, {"id": 36, "tag": "Match the Columns", "q": "Match the terms in Column I with their descriptions in Column II. Column I: (a) Synapsis (b) Bivalent (c) Chiasmata (d) Terminalisation. Column II: (i) A pair of homologous chromosomes undergoing pairing (ii) Pairing of homologous chromosomes (iii) Sliding of chiasmata towards the ends of chromosomes (iv) X-shaped structures at the sites of crossing over.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iii, c-iv, d-i", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "c": "Synapsis = pairing process; bivalent = paired homologs ki jodi; chiasmata = X-shaped exchange marks; terminalisation = chiasmata ka ends ki taraf slide karna.", "m": "Process (synapsis) vs structure (bivalent, chiasma) vs movement (terminalisation) alag karo.", "s": ["a $\\rightarrow$ ii (pairing process).", "b $\\rightarrow$ i (paired structure).", "c $\\rightarrow$ iv (X-marks).", "d $\\rightarrow$ iii (sliding)."], "r": "", "w": ["", "Bivalent structure hai process nahi.", "Chiasmata sliding nahi, marks hain.", "Terminalisation structure nahi, movement hai."], "t": "Bivalent = 2 chromosomes; tetrad = unke 4 chromatids — dono shabd same jodi ke do view hain.", "sim": null}, {"id": 37, "tag": "Match the Columns", "q": "Match the type of division or event in Column I with its characteristic feature in Column II. Column I: (a) Animal cell cytokinesis (b) Plant cell cytokinesis (c) Karyokinesis (d) Amitosis. Column II: (i) Cell plate formation (ii) Cleavage furrow formation (iii) Direct division without spindle formation (iv) Division of the nucleus.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iii, d-iv", "a-iii, b-i, c-iv, d-ii"], "ans": 0, "c": "Animal = furrow; plant = plate; karyokinesis = nucleus division; amitosis = bina spindle ke direct constriction (bacteria).", "m": "Animal/plant aur nucleus/cytoplasm ke farak pe match banao.", "s": ["a $\\rightarrow$ ii (furrow).", "b $\\rightarrow$ i (plate).", "c $\\rightarrow$ iv (nucleus).", "d $\\rightarrow$ iii (direct)."], "r": "", "w": ["", "Plant furrow nahi banata.", "Karyokinesis direct division nahi, spindle-based hai.", "Amitosis nucleus ka direct split hai, furrow-based cytokinesis nahi."], "t": "Amitosis mein distinct chromosomes/spindle dono nahi dikhte.", "sim": null}, {"id": 38, "tag": "Match the Columns", "q": "Match the cell cycle stage in Column I with the DNA content given in Column II (diploid somatic cell, $G_1$ DNA $= 2C$). Column I: (a) $S$ phase (b) $G_1$ phase (c) Haploid gamete (d) $G_2$ phase. Column II: (i) DNA content doubles during this phase (ii) DNA content is $2C$ (iii) DNA content is $C$ (iv) DNA content is $4C$.", "fig": null, "opt": ["a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iv, d-iii", "a-i, b-iii, c-ii, d-iv", "a-iv, b-ii, c-iii, d-i"], "ans": 0, "c": "$G_1 = 2C$; $S$ ke dauraan $2C \\rightarrow 4C$; $G_2 = 4C$; gamete (meiosis ke baad) $= C$.", "m": "C-value ka chakra: $2C \\rightarrow 4C \\rightarrow 2C \\rightarrow C$.", "s": ["a $\\rightarrow$ i (doubling).", "b $\\rightarrow$ ii ($2C$).", "c $\\rightarrow$ iii ($C$).", "d $\\rightarrow$ iv ($4C$)."], "r": "", "w": ["", "$G_1$ doubling phase nahi.", "Gamete ka DNA $4C$ kabhi nahi, $C$ hota hai.", "$G_2$ $4C$ hota hai, $C$ nahi."], "t": "Chromosome number aur DNA content alag charts hain — ek $2n$ stable, doosra $2C$-$4C$-$C$ ghoomta hai.", "sim": null}, {"id": 39, "tag": "Assertion-Reason", "q": "Assertion (A): Interphase is referred to as the resting phase of the cell cycle. Reason (R): During interphase, the cell grows and carries out its normal metabolic activities.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 1, "c": "Dono statements sach hain. 'Resting phase' naam historical hai kyunki microscope mein koi division nahi dikhta; asal mein cell metabolically active rehta hai. R sach hai par 'resting' naam ki wajah nahi batata — naam ka reason visible division ki absence hai.", "m": "A/R pattern: pehle dono ki sachai, phir causal link check.", "s": ["A sahi: interphase ko resting phase kaha jata hai.", "R sahi: growth/metabolism chalte hain.", "R, A ka explanation nahi: naam bina visible division ke hone se pada."], "r": "", "w": ["R sach hai par causal explanation nahi banta.", "", "R galat nahi hai.", "Dono statements galat nahi hain."], "t": "NEET mein 'resting but metabolically active' wala nuance baar-baar aata hai.", "sim": null}, {"id": 40, "tag": "Assertion-Reason", "q": "Assertion (A): The amount of DNA per cell doubles during the $S$ phase. Reason (R): Replication of DNA takes place during the $S$ phase.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "A is false but R is true."], "ans": 0, "c": "$S$ phase mein replication hoti hai (R), isi wajah se DNA content double ho jata hai (A). R directly A ka cause hai.", "m": "Pehla statement fact, doosra usi fact ka mechanism — explanation wali option.", "s": ["Replication $S$ phase mein.", "Har chromosome mein 2 chromatids.", "Total DNA $2C \\rightarrow 4C$.", "Karan = R, kaam = A."], "r": "", "w": ["", "Yahan R seedha kaaran hai, isliye 'not explanation' galat.", "R bilkul sach hai.", "A bhi sach hai."], "t": "Chromosome number nahi badalta — sirf DNA content — yahi add-on trap hota hai.", "sim": null}, {"id": 41, "tag": "Assertion-Reason", "q": "Assertion (A): Mitosis is called the equational division. Reason (R): The daughter cells formed by mitosis have the same number of chromosomes as the parent cell.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Mitosis mein chromosome number same rehta hai ($2n \\rightarrow 2n$) — yahi wajah hai ki ise equational division kehte hain. R, A ki exact definition deta hai.", "m": "Naam (equational) ka matlab = equal number — R wahi explain kar raha.", "s": ["Daughter cells $2n$.", "Parent bhi $2n$.", "Equal number $\\Rightarrow$ equational.", "R = A ka definition-level explanation."], "r": "", "w": ["", "R direct explanation hai.", "R sach hai.", "Dono sach hain."], "t": "Meiosis-II bhi equational hai par haploid starting cell ke saath.", "sim": null}, {"id": 42, "tag": "Assertion-Reason", "q": "Assertion (A): In plant cells, cytokinesis takes place by the formation of a cell plate. Reason (R): The rigid cell wall of plant cells does not permit inward furrowing of the plasma membrane.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Plant cell wall rigid hone se membrane andar pinch nahi kar sakti; isliye centre mein plate banti hai. R, A ka structural kaaran hai.", "m": "Plant wall ka constraint = plate formation ki wajah.", "s": ["Rigid wall furrow ko rok-ti hai.", "Alternative: Golgi vesicles se plate.", "Plate middle lamella banti hai.", "R directly A kyun hota hai, batata hai."], "r": "", "w": ["", "Yahan cause-effect clear hai.", "R sach hai.", "Dono sach hain."], "t": "Animal cells mein wall nahi, isliye actin ring se furrow ban jata hai.", "sim": null}, {"id": 43, "tag": "Assertion-Reason", "q": "Assertion (A): Crossing over takes place during the pachytene stage of prophase I. Reason (R): The synaptonemal complex is formed during the diplotene stage.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 2, "c": "A sach hai: crossing over pachytene mein. R galat hai: synaptonemal complex zygotene mein banta hai aur diplotene ke shuru mein dissolve hota hai.", "m": "A ki sachai phir R ka stage verify karo.", "s": ["Crossing over $\\rightarrow$ pachytene: A true.", "SC assembly $\\rightarrow$ zygotene.", "SC dissolution $\\rightarrow$ diplotene.", "R ka stage galat, isliye option C."], "r": "", "w": ["R galat hai.", "R false hone se ye options nahi.", "", "A true hai."], "t": "Zygotene = SC banta hai; diplotene = SC toot-ta hai — ulta mat padh lena sabse common galti hai.", "sim": null}, {"id": 44, "tag": "Assertion-Reason", "q": "Assertion (A): Sister chromatids separate during anaphase I of meiosis. Reason (R): The centromere splits during anaphase I of meiosis.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 3, "c": "Dono galat hain. Anaphase-I mein homologs alag hote hain, sister chromatids jude rehte hain; centromere split hota hi nahi. Ye dono events anaphase-II (ya mitotic anaphase) ke hain.", "m": "Anaphase-I vs anaphase-II ka core farak: centromere split sirf II mein.", "s": ["Anaphase-I: homologs separate.", "Centromere intact, chromatids joined.", "Anaphase-II: centromere split, chromatids separate.", "Isliye A aur R dono false."], "r": "", "w": ["Dono statements false hain.", "R false hai.", "A bhi false hai.", ""], "t": "Sirf do jagah centromere split: mitotic anaphase aur anaphase-II.", "sim": null}, {"id": 45, "tag": "Diagram/Data", "q": "A diploid cell in $G_1$ contains 4 chromosomes, each with one chromatid. After completion of the $S$ phase, this cell will contain:", "fig": {"k": "chrom", "mode": "replicated"}, "opt": ["4 chromosomes and 4 chromatids", "8 chromosomes and 8 chromatids", "4 chromosomes and 8 chromatids", "8 chromosomes and 4 chromatids"], "ans": 2, "c": "$S$ phase mein har chromosome replicate hoke 2 sister chromatids banata hai, par centromere ek hi rehta hai — chromosome count $= 4$, chromatids $= 8$.", "m": "Chromosome = centromere count; chromatid = DNA molecule count.", "s": ["Starting: 4 centromeres, 4 chromatids.", "Replication: har centromere par 2 chromatids.", "Centromeres abhi bhi 4 $\\Rightarrow$ 4 chromosomes.", "Chromatids $= 4 \\times 2 = 8$."], "r": "", "w": ["Ye $G_1$ ki starting condition hai, $S$ ke baad ki nahi.", "Centromere count nahi badla, chromosomes 8 nahi hue.", "", "Chromatid count double hua hai, half nahi."], "t": "Ploidy tab tak nahi badalti jab tak centromere split na ho.", "sim": null}, {"id": 46, "tag": "Diagram based", "q": "A diagram of a dividing animal cell shows: nuclear envelope absent, centromeres have split, and single-chromatid chromosomes are being pulled towards opposite poles with their arms trailing behind the centromere. Identify the stage shown.", "fig": {"k": "stage", "phase": "anaphase", "plant": false, "note2": "Word-diagram: split centromeres, poleward movement in an animal cell"}, "opt": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "ans": 2, "c": "Centromere split + daughter chromosomes ka poleward movement = anaphase. Envelope absent hona bhi late mitosis ke stages se consistent hai.", "m": "Do signature features pakdo: split centromere + poleward movement.", "s": ["Prophase: envelope abhi toot raha, split nahi.", "Metaphase: equator par alignment, split nahi.", "Anaphase: split + movement — match.", "Telophase: poles par pahunch ke decondense hote."], "r": "", "w": ["Prophase mein centromere split nahi hota.", "Metaphase tak chromosomes equator par hain.", "", "Telophase mein movement khatam, envelope wapas banta hai."], "t": "Arms trailing, centromere aage — anaphase ki classic shape (V/J/L position-dependent).", "sim": null}, {"id": 47, "tag": "Diagram based", "q": "A dividing plant cell is drawn with a thin line-like structure forming at the centre of the cell and growing outwards towards the lateral walls, dividing the cytoplasm into two parts. This structure is the:", "fig": {"k": "plate", "cap": "Cell plate: centre se outward (centrifugal) growth"}, "opt": ["Cleavage furrow", "Cell plate", "Synaptonemal complex", "Equatorial plate"], "ans": 1, "c": "Centre se bahar ki taraf badhne wali line = cell plate, jo Golgi vesicles se banti hai aur future middle lamella hai.", "m": "Direction clue: outward growth = plant cell plate.", "s": ["Furrow bahar se andar (centripetal) animal mein.", "Plate andar se bahar (centrifugal) plant mein.", "SC meiosis ka pairing structure hai.", "Equatorial plate metaphase ka alignment plane hai, physical wall nahi."], "r": "", "w": ["Furrow animal cell mein banta hai, plant mein nahi.", "", "SC prophase-I ka protein structure hai.", "Equatorial plate ek imaginary plane hai, banti hui deewar nahi."], "t": "Cell plate aur equatorial plate naam similar hain par ek deewar hai, doosra alignment plane.", "sim": null}, {"id": 48, "tag": "Graph based", "q": "A graph plots DNA content ($C$-value) on the Y-axis against cell cycle stages on the X-axis: $2C$ in $G_1$, a gradual rise $2C \\rightarrow 4C$ during $S$, steady $4C$ in $G_2$, then a sudden fall from $4C$ back to $2C$ at the end of $M$. This sudden fall represents:", "fig": {"k": "line", "xl": ["G1", "S", "G2", "M end"], "yl": ["4C", "2C"], "ymin": 0, "ymax": 1, "yaxis": "DNA content", "series": [{"name": "C-value", "color": "#6cb2ff", "pts": [0.5, 1, 1, 0.5]}], "mark": {"x": "M end", "t": "sudden fall"}, "cap": "DNA content ka graph: fall tab hota hai jab cytoplasm do cells mein bat-ta hai"}, "opt": ["DNA replication", "Cytokinesis after mitosis", "Entry of the cell into $G_0$", "Crossing over of chromosomes"], "ans": 1, "c": "$4C$ DNA ek cell mein tha; cytokinesis ke baad do daughter nuclei/cells bante hain jismein se har ek ko $2C$ milta hai — isi liye per-cell DNA ek dam se gir jata hai.", "m": "Graph ka sudden drop = ek cell ka do cells mein bat-na.", "s": ["Replication gradual rise deta hai ($S$), fall nahi.", "Cytokinesis DNA ko do cells mein baant deta hai.", "$G_0$ entry DNA change nahi karti.", "Crossing over meiosis mein hota hai, mitotic cell cycle mein nahi."], "r": "", "w": ["Replication rise banati hai, fall nahi.", "", "$G_0$ mein DNA $2C$ hi rehta hai, graph girega nahi.", "Crossing over se DNA content change nahi hota."], "t": "Amount of DNA per cell graph mein har cytokinesis par vertical drop aata hai.", "sim": null}, {"id": 49, "tag": "Data-table", "q": "A table describes two dividing cells. Cell X: individual chromosomes, each with two chromatids, lie at the equatorial plate, spindle fibres from both poles attaching to each chromosome's kinetochore. Cell Y: homologous pairs (bivalents) lie at the equatorial plate, fibres from one pole attaching to one homolog and fibres from the opposite pole to its partner. Cell X and Cell Y respectively represent:", "fig": {"k": "table", "head": ["Feature", "Cell X", "Cell Y"], "rows": [["Aligning unit", "Single chromosome", "Bivalent (pair)"], ["Fibre attachment", "Both poles per chromosome", "One pole per homolog"], ["Division type", "Mitotic metaphase", "Metaphase I"]]}, "opt": ["Mitotic metaphase and metaphase I of meiosis", "Metaphase I and metaphase II of meiosis", "Anaphase I and anaphase II of meiosis", "Mitotic prophase and mitotic telophase"], "ans": 0, "c": "Single chromosomes equator par, dono poles se fibres = mitotic metaphase. Bivalents equator par, har homolog ek pole se = metaphase-I.", "m": "Alignment unit dekho: chromosome = mitosis, bivalent = meiosis-I.", "s": ["Cell X: individual chromosomes $\\rightarrow$ mitosis.", "Dono poles ka attachment mitotic metaphase.", "Cell Y: bivalents $\\rightarrow$ meiosis-I.", "Homolog-wise pole attachment metaphase-I ka feature."], "r": "", "w": ["", "Metaphase-II mein bivalents nahi, single chromosomes hote hain (haploid cell).", "Anaphase stages mein alignment nahi, separation hota hai.", "Prophase/telophase mein equatorial alignment hoti hi nahi."], "t": "Metaphase-I mein bivalent count $= n$ hota hai ($2n$ cell mein).", "sim": null}, {"id": 50, "tag": "Diagram based", "q": "A cell undergoing prophase I shows paired homologous chromosomes appearing as tetrads, with recombination nodules on them and exchange of segments between non-sister chromatids of the paired homologs. The sub-stage depicted is:", "fig": {"k": "bivalent"}, "opt": ["Leptotene", "Zygotene", "Pachytene", "Diakinesis"], "ans": 2, "c": "Tetrad + recombination nodules + non-sister chromatid exchange — teeno pachytene ke signatures hain.", "m": "Recombination nodules ka stage ek hi hai: pachytene.", "s": ["Leptotene: sirf thread-like condensation.", "Zygotene: pairing shuru, exchange nahi.", "Pachytene: nodules + crossing over.", "Diakinesis: terminalisation complete, envelope break."], "r": "", "w": ["Leptotene mein pairing tak nahi hui.", "Zygotene mein SC banta hai par exchange nahi hota.", "", "Diakinesis mein chiasmata terminalise hote hain, nodules nahi."], "t": "Recombinase enzyme bhi isi stage active hota hai — pachytene ka triple clue.", "sim": null}, {"id": 51, "tag": "Direct MCQ", "q": "The average duration of a complete cell cycle in a typical human (mammalian) cell is approximately:", "fig": null, "opt": ["1 hour", "12 hours", "24 hours", "48 hours"], "ans": 2, "c": "Ek typical mammalian cell (jaise human cultured cell) ka cell cycle lagbhag 24 ghante ka hota hai, jisme interphase ($G_1$ + $S$ + $G_2$) zyada tar samay leta hai aur $M$ phase sirf lagbhag 1 ghante ka hota hai.", "m": "NCERT ka standard number yaad karo: approx 24 hours.", "s": ["Interphase $\\approx 23$ hours.", "$M$ phase $\\approx 1$ hour.", "Total $\\approx 24$ hours."], "r": "", "w": ["1 hour sirf $M$ phase ka approx duration hai.", "12 hours aadha cycle hai, poora nahi.", "", "48 hours typical mammalian cycle se double hai."], "t": "Ye duration cell type ke hisaab se badal sakta hai, par NCERT average 24 hours deta hai.", "sim": null}, {"id": 52, "tag": "Direct MCQ", "q": "The concept of the cell cycle, dividing it into $G_1$, $S$, $G_2$ and $M$ phases, was given by:", "fig": null, "opt": ["Sutton and Boveri", "Howard and Pelc", "Walther Flemming", "Robert Hooke"], "ans": 1, "c": "Howard aur Pelc (1953) ne plant cells ($Vicia$) par kaam karke cell cycle ko $G_1$, $S$, $G_2$ aur $M$ phases mein divide karne ka concept diya.", "m": "Discovery-based factual yaad: cell cycle phases = Howard and Pelc.", "s": ["Sutton-Boveri: chromosome theory of inheritance.", "Howard-Pelc: cell cycle phasing.", "Flemming: mitosis describe kiya; Hooke: cell term diya."], "r": "", "w": ["Sutton-Boveri ka kaam inheritance theory tha.", "", "Flemming ne mitosis observe kiya, phase classification nahi di.", "Hooke ne cork mein cells dekhe."], "t": "Flemming ko mitosis ka father mana jata hai; phase-naming Howard-Pelc se.", "sim": null}, {"id": 53, "tag": "Direct MCQ", "q": "The longest stage among the four stages of mitosis is:", "fig": null, "opt": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "ans": 0, "c": "Prophase sabse lamba mitotic stage hai kyunki chromatin condensation, centrosome movement, spindle formation aur envelope breakdown — sab ismein hote hain. Anaphase sabse chhota hota hai.", "m": "Stage duration ranking yaad: prophase > metaphase > telophase > anaphase (approx).", "s": ["Prophase: taiyari ke multiple events, lamba.", "Metaphase: alignment, moderate.", "Anaphase: sirf minutes ka, shortest.", "Telophase: reformation, relatively short."], "r": "", "w": ["", "Metaphase prophase se chhota hota hai.", "Anaphase sabse chhota stage hai.", "Telophase bhi prophase se kam duration ka hai."], "t": "Root tip counting experiments mein prophase cells sabse zyada milti hain — duration wahi reason hai.", "sim": null}, {"id": 54, "tag": "Direct MCQ", "q": "The shortest stage of mitosis, lasting only a few minutes in most cells, is:", "fig": null, "opt": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "ans": 2, "c": "Anaphase bahut tez hota hai — centromere split aur chromatids ka poleward movement kuch hi minutes mein complete ho jata hai, isliye shortest stage hai.", "m": "Shortest = anaphase; longest = prophase — pair yaad rakho.", "s": ["Anaphase event ek-baar ka mechanical pull hai.", "Condensation/reformation jaise lamba kaam nahi.", "Isliye duration minimum."], "r": "", "w": ["Prophase sabse lamba stage hai.", "Metaphase anaphase se lamba hota hai.", "", "Telophase bhi anaphase se zyada samay leta hai."], "t": "Microscopy mein anaphase cells sabse kam milti hain kyunki stage hi chhota hai.", "sim": null}, {"id": 55, "tag": "Direct MCQ", "q": "In a mammalian cell cycle of about 24 hours duration, the $M$ phase (mitosis plus cytokinesis) generally lasts for about:", "fig": null, "opt": ["1 hour", "6 hours", "10 hours", "12 hours"], "ans": 0, "c": "24-hour cycle mein $M$ phase lagbhag 1 ghanta hota hai; baaki 23 ghante interphase ($G_1 \\approx 11$, $S \\approx 8$, $G_2 \\approx 4$ hours) ka hote hain.", "m": "$M$ phase = shortest slice of the cycle.", "s": ["Total 24 hours.", "Interphase $\\approx 95\\%$.", "$M$ phase $\\approx 1$ hour."], "r": "", "w": ["", "6 hours $G_2$ jaisa lamba phase hai, $M$ nahi.", "10-12 hours interphase ke phases ke range mein aata hai.", "$M$ phase ka fraction sabse chhota hai."], "t": "$G_1$ ki length sabse zyada variable hoti hai; $M$ lagbhag fixed ~1 hour.", "sim": null}, {"id": 56, "tag": "Direct MCQ", "q": "The spindle fibres formed during cell division are mainly made up of:", "fig": null, "opt": ["Actin protein", "Tubulin protein", "Histone protein", "Myosin protein"], "ans": 1, "c": "Spindle fibres microtubules hain aur microtubules ka building block tubulin protein ($\\alpha$/$β$-tubulin dimers) hai. Actin/myosin cleavage furrow (contractile ring) ka kaam karte hain; histones DNA packaging ke.", "m": "Fibre type $\\rightarrow$ protein: microtubule $\\rightarrow$ tubulin; microfilament $\\rightarrow$ actin.", "s": ["Spindle = microtubule structure.", "Microtubule monomer = tubulin.", "Actin ring furrow banata hai, spindle nahi."], "r": "", "w": ["Actin contractile ring/furrow mein hai.", "", "Histones chromatin packaging ke protein hain.", "Myosin actin ke saath furrow machinery mein."], "t": "Colchicine/vinca alkaloids tubulin par hi attack karte hain — isi link se spindle toot-ta hai.", "sim": null}, {"id": 57, "tag": "Direct MCQ", "q": "The small, disc-shaped proteinaceous structures present on the surface of the centromere, which serve as the sites of attachment of spindle fibres, are called:", "fig": null, "opt": ["Centrioles", "Kinetochores", "Chiasmata", "Nucleosomes"], "ans": 1, "c": "Kinetochore centromere par bana disc-shaped protein structure hai jahan spindle microtubules attach hote hain. Ye DNA se nahi, protein se bana hota hai.", "m": "Spindle attachment site ka naam = kinetochore.", "s": ["Centromere = chromosome ka constricted DNA region.", "Us par protein disc = kinetochore.", "Fibres kinetochore par attach, seedha DNA par nahi."], "r": "", "w": ["Centrioles centrosome ke andar ke organelles hain.", "", "Chiasmata crossing over ke marks hain.", "Nucleosomes histone + DNA ke packaging units hain."], "t": "Har sister chromatid ka apna kinetochore hota hai — isliye metaphase chromosome par do kinetochores.", "sim": null}, {"id": 58, "tag": "Numerical", "q": "How many mitotic divisions are required to produce 128 cells starting from a single cell?", "fig": null, "opt": ["6", "7", "8", "14"], "ans": 1, "c": "Har mitotic division cell count double karti hai. $n$ divisions ke baad cells $= 2^n$. $128 = 2^7$, isliye 7 divisions.", "m": "Power-of-two rule: cells $= 2^{\\text{divisions}}$.", "s": ["1 division $\\rightarrow 2 = 2^1$.", "Continue: $2^7 = 128$.", "Isliye divisions $= 7$."], "r": "", "w": ["$2^6 = 64$, 128 nahi.", "", "$2^8 = 256$, zyada hai.", "14 divisions se $2^{14} = 16384$ cells banti."], "t": "Formula: number of mitotic divisions for $N$ cells from one cell $= \\log_2 N$ (jab $N$ power of 2 ho).", "sim": null}, {"id": 59, "tag": "Direct MCQ", "q": "The stage of mitosis that is most suitable for studying the morphology and number of chromosomes is:", "fig": null, "opt": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "ans": 1, "c": "Metaphase mein chromosomes maximum condensed, distinct aur equator par aligned hote hain; har chromosome do clear chromatids dikhata hai — isliye morphology/counting/karyotyping ke liye best stage.", "m": "Max condensation + clean alignment = metaphase.", "s": ["Prophase mein condensation adhoori.", "Metaphase: sabse compact chromosomes.", "Anaphase mein chromosomes move kar rahe, photo clear nahi.", "Telophase mein decondense ho jate hain."], "r": "", "w": ["Prophase mein chromosomes abhi shorten ho rahe hote hain.", "", "Anaphase mein shape V/J/L hota hai, morphology study mushkil.", "Telophase mein individuality khatm ho jati hai."], "t": "Colchicine se cells metaphase par arrest karke karyotype slides banayi jati hain.", "sim": null}, {"id": 60, "tag": "Direct MCQ", "q": "The short-lived stage or gap between meiosis I and meiosis II, during which no DNA replication takes place, is called:", "fig": null, "opt": ["Interphase", "Interkinesis", "$G_0$ phase", "Diakinesis"], "ans": 1, "c": "Interkinesis do meiotic divisions ke beech ka brief gap hai. Ismein $S$ phase nahi hota — DNA replicate nahi karta; chromosomes already do chromatids ke saath aate hain.", "m": "Keyword: gap between two meiotic divisions = interkinesis.", "s": ["Interphase mein $S$ phase hota hai.", "Interkinesis mein replication nahi.", "Kayi organisms mein ye almost absent hota hai."], "r": "", "w": ["Interphase meiosis se pehle aata hai aur $S$ phase rakhta hai.", "", "$G_0$ quiescent somatic stage hai.", "Diakinesis prophase-I ka sub-stage hai."], "t": "Interkinesis mein chromosomes decondense ho sakte hain par dobara replicate nahi hote.", "sim": null}, {"id": 61, "tag": "Concept MCQ", "q": "Colchicine, a chemical that arrests dividing cells at metaphase, acts by:", "fig": null, "opt": ["Preventing DNA replication in the $S$ phase", "Inhibiting the formation of spindle fibres", "Dissolving the nuclear envelope", "Blocking cytokinesis only"], "ans": 1, "c": "Colchicine tubulin par bind karke microtubule polymerization rok deta hai, jisse spindle fibres ban hi nahi paate. Chromosomes metaphase tak condense hoke ruk jate hain — metaphase arrest.", "m": "Spindle inhibitor = colchicine; target = tubulin.", "s": ["DNA replication $S$ phase mein normal chalti hai.", "Spindle assembly blocked.", "Kinetochore fibres na milne par anaphase entry nahi.", "Result: metaphase arrest / polyploidy."], "r": "", "w": ["Colchicine $S$ phase ko nahi, spindle ko target karta hai.", "", "Envelope breakdown apne aap prophase mein ho jata hai.", "Cytokinesis bhi indirectly rukti hai par primary action spindle block hai."], "t": "Colchicum autumnale se milta hai; polyploidy induction aur karyotyping dono mein use.", "sim": null}, {"id": 62, "tag": "Concept MCQ", "q": "The primary oocytes in the human female ovary, from birth until puberty, remain arrested in which stage of prophase I?", "fig": null, "opt": ["Leptotene", "Zygotene", "Diplotene", "Diakinesis"], "ans": 2, "c": "Primary oocytes foetal life mein hi diplotene stage mein arrest ho jati hain (dictyate stage) aur puberty tak wahi rehti hain; har mahine ek oocyte cycle resume karta hai.", "m": "Long arrest wala prophase-I sub-stage = diplotene.", "s": ["Leptotene/zygotene early stages, arrest nahi.", "Pachytene mein crossing over khatam.", "Diplotene arrest = dictyate, saalon tak.", "Diakinesis resume hone par baad mein aati hai."], "r": "", "w": ["Leptotene mein chromosomes abhi condense ho rahe hote hain.", "Zygotene pairing stage hai, arrest point nahi.", "", "Diakinesis terminalisation wali last stage hai."], "t": "Ovulation ke waqt secondary oocyte metaphase-II mein arrest hota hai — doosra famous arrest.", "sim": null}, {"id": 63, "tag": "Statement-based", "q": "Consider the following statements about the $G_0$ phase. Statement I: Cells in this stage remain metabolically active but do not proliferate. Statement II: Mature nerve cells remain permanently in this stage. Statement III: Some cells in this stage can re-enter the $G_1$ phase under specific physiological conditions. Statement IV: DNA replication takes place continuously in this stage. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and III", "II, III and IV"], "ans": 2, "c": "$G_0$ cells active rehti hain par divide nahi karti; neurons permanent $G_0$; lymphocytes/hepatocytes signal par wapas $G_1$ mein aa sakti hain. DNA replication $G_0$ mein hoti hi nahi.", "m": "Har statement ko $G_0$ ki definition se test karo.", "s": ["I sahi: active but non-dividing.", "II sahi: neurons permanent.", "III sahi: reversible examples.", "IV galat: replication sirf $S$ phase mein."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV galat statement se invalid."], "t": "Permanent $G_0$ vs facultative $G_0$ ka farak exam mein trap banta hai.", "sim": null}, {"id": 64, "tag": "Statement-based", "q": "Consider the following statements about the centrosome and centrioles in an animal cell. Statement I: The centriole duplicates in the cytoplasm during the $S$ phase. Statement II: The two centrosomes begin to move towards opposite poles during prophase. Statement III: Each centrosome radiates out microtubules called asters. Statement IV: The cells of higher plants contain very prominent centrioles. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "I and III only"], "ans": 0, "c": "Animal cells: centriole $S$ phase mein duplicate, prophase mein centrosomes poles par jaate hain, astral rays nikalte hain. Higher plant cells mein centrioles/asters hote hi nahi — spindle anastral banta hai.", "m": "Animal vs higher-plant spindle ka farak pakdo.", "s": ["I sahi: centriole duplication $S$ phase.", "II sahi: prophase poleward movement.", "III sahi: asters = radiating microtubules.", "IV galat: higher plants anastral, centriole-less."], "r": "", "w": ["", "IV galat hai.", "IV galat include karta hai.", "II bhi sahi hai jo missing hai."], "t": "Lower plants (algae/fungi) mein centrioles mil sakte hain; higher flowering plants mein nahi.", "sim": null}, {"id": 65, "tag": "Statement-based", "q": "Consider the following statements about the metaphase of mitosis. Statement I: Complete disintegration of the nuclear envelope marks the start of this stage. Statement II: The chromosomes are moved to the spindle equator and get aligned along the metaphase plate. Statement III: Spindle fibres from opposite poles attach to the kinetochores of each chromosome. Statement IV: The nucleolus and Golgi complex reappear at the end of this stage. Which of the above statements are correct?", "fig": null, "opt": ["II and IV only", "I, II and III", "I, III and IV", "I and II only"], "ans": 1, "c": "Envelope ka poora break metaphase ki shuruaat hai; chromosomes equator par align; opposite poles ki fibres kinetochores par. Nucleolus/Golgi ka reappear telophase mein hota hai, metaphase ke end mein nahi.", "m": "Metaphase ke 3 features count karo, telophase wali statement nikalo.", "s": ["I sahi: envelope gone = metaphase start.", "II sahi: metaphase plate alignment.", "III sahi: bipolar kinetochore attachment.", "IV galat: reappearance telophase ka event."], "r": "", "w": ["IV galat aur I missing hai.", "", "IV galat include karta hai.", "III bhi sahi hai."], "t": "Spindle assembly checkpoint yahin ensure karta hai har kinetochore sahi attach ho.", "sim": null}, {"id": 66, "tag": "Statement-based", "q": "Consider the following statements about the anaphase of mitosis. Statement I: The centromere of each chromosome splits into two. Statement II: The daughter chromatids move towards opposite poles of the cell. Statement III: A chromosome with a median centromere appears V-shaped during its poleward movement. Statement IV: The chromosomes undergo decondensation in this stage. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and III", "II, III and IV"], "ans": 2, "c": "Anaphase: centromere split, chromatids poleward; metacentric chromosome V-shape banata hai (centromere aage, arms peeche). Decondensation telophase ka event hai, anaphase ka nahi.", "m": "Anaphase events vs telophase events alag karo.", "s": ["I sahi: split anaphase ka core.", "II sahi: poleward movement.", "III sahi: metacentric = V.", "IV galat: decondensation telophase mein."], "r": "", "w": ["IV galat aur II/III missing.", "I missing hai.", "", "IV galat statement se fail."], "t": "Shapes: metacentric V, sub-metacentric L/J, acrocentric rod-like, telocentric I.", "sim": null}, {"id": 67, "tag": "Statement-based", "q": "Consider the following statements about the diakinesis stage of prophase I. Statement I: Terminalisation of chiasmata is completed during this stage. Statement II: The chromosomes become fully condensed. Statement III: The nucleolus disappears and the nuclear envelope breaks down. Statement IV: The synaptonemal complex is newly assembled during this stage. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "I and III only"], "ans": 0, "c": "Diakinesis = prophase-I ka aakhri stage: chiasmata fully terminalised, chromosomes fully condensed, nucleolus/envelope gayab. SC to diplotene ke shuru mein hi dissolve ho chuka hota hai, diakinesis mein banta nahi.", "m": "Last stage = sab kuch 'completion/breakdown' — assembly wali line galat niklegi.", "s": ["I sahi: terminalisation complete.", "II sahi: max condensation.", "III sahi: nucleolus/envelope break.", "IV galat: SC diplotene mein dissolve hua."], "r": "", "w": ["", "IV galat hai.", "IV galat include karta hai.", "II bhi sahi statement missing hai."], "t": "Diakinesis ke baad cell metaphase-I mein enter karta hai.", "sim": null}, {"id": 68, "tag": "Statement-based", "q": "Consider the following statements about meiosis II. Statement I: It takes place in the haploid cells formed after meiosis I. Statement II: It is an equational division. Statement III: DNA replication takes place once again before meiosis II begins. Statement IV: The sister chromatids of each chromosome separate during anaphase II. Which of the above statements are correct?", "fig": null, "opt": ["I, II and IV", "II and III only", "I, III and IV", "I and II only"], "ans": 0, "c": "Meiosis-II haploid cells mein hota hai, equational hai (chromosome number same), anaphase-II mein chromatids alag. Interkinesis mein DNA replication hoti hi nahi.", "m": "Meiosis-II = haploid cell ka mitosis jaisa division, bina naye $S$ phase.", "s": ["I sahi: starting cell haploid.", "II sahi: $n \\rightarrow n$.", "III galat: no replication in interkinesis.", "IV sahi: centromere split, chromatids separate."], "r": "", "w": ["", "III galat hai.", "I aur IV missing hain.", "III galat statement se invalid."], "t": "Ek hi replication, do divisions — yahi meiosis ka defining rule hai.", "sim": null}, {"id": 69, "tag": "Statement-based", "q": "Consider the following statements about the types of meiosis. Statement I: Gametic meiosis occurs just before gamete formation, as in most animals. Statement II: Zygotic meiosis occurs in the zygote of haploid organisms such as many algae and fungi. Statement III: Sporic meiosis occurs during spore formation in plants. Statement IV: In human beings, meiosis is of the zygotic type. Which of the above statements are correct?", "fig": null, "opt": ["II and IV only", "I, II and III", "I, III and IV", "I and II only"], "ans": 1, "c": "Gametic (animals: gametes se pehle), zygotic (haploid algae/fungi: zygote mein), sporic (plants: spores bante waqt). Humans gametic meiosis dikhate hain, zygotic nahi.", "m": "Meiosis ka timing organism ke life cycle se match karo.", "s": ["I sahi: animal = gametic.", "II sahi: Chlamydomonas jaisa zygotic.", "III sahi: plant spore mother cells.", "IV galat: human meiosis gametic hai."], "r": "", "w": ["IV galat aur I/III missing.", "", "IV galat include karta hai.", "III bhi sahi statement missing hai."], "t": "Plant life cycle: sporic meiosis $\\rightarrow$ haploid spores $\\rightarrow$ gametophyte $\\rightarrow$ gametes by mitosis.", "sim": null}, {"id": 70, "tag": "Statement-based", "q": "Consider the following statements about amitosis. Statement I: It is a direct division that occurs without the formation of a spindle apparatus. Statement II: The nucleus elongates and undergoes a simple constriction. Statement III: It is commonly seen in prokaryotic cells such as bacteria. Statement IV: The chromatin condenses into well-defined chromosomes before division. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and III", "II, III and IV"], "ans": 2, "c": "Amitosis = direct division: na spindle, na distinct chromosomes; nucleus elongate hoke constrict ho jata hai — bacteria/prokaryotes typical. Chromatin condensation amitosis mein hoti hi nahi.", "m": "'No spindle, no chromosomes' — amitosis ki do negative pehchan.", "s": ["I sahi: spindle absent.", "II sahi: simple constriction.", "III sahi: prokaryote example.", "IV galat: condensation mitosis/meiosis mein hoti hai."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV galat include karta hai."], "t": "Amitosis mein genetic material equal divide hona guaranteed nahi — ek disadvantage.", "sim": null}, {"id": 71, "tag": "Statement-based", "q": "Consider the following statements about colchicine. Statement I: It inhibits the formation of spindle fibres. Statement II: It is obtained from the plant Colchicum autumnale. Statement III: Cells treated with colchicine get arrested at the metaphase stage. Statement IV: It mainly blocks the replication of DNA during the $S$ phase. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "I and III only"], "ans": 0, "c": "Colchicine Colchicum autumnale se, tubulin bind karke spindle ban-ne nahi deta; metaphase arrest aur polyploidy result. DNA replication ($S$ phase) isse affect nahi hoti.", "m": "Spindle poison vs DNA-synthesis blocker ka farak.", "s": ["I sahi: spindle inhibition.", "II sahi: source plant.", "III sahi: metaphase arrest.", "IV galat: $S$ phase blocked nahi hota."], "r": "", "w": ["", "IV galat hai.", "IV galat include karta hai.", "II bhi sahi statement missing hai."], "t": "Vincristine/vinblastine bhi spindle poison hain — source Catharanthus roseus.", "sim": null}, {"id": 72, "tag": "Statement-based", "q": "Consider the following statements for a human somatic cell with 46 chromosomes. Statement I: A $G_1$ cell contains 46 chromosomes and 46 chromatids. Statement II: A $G_2$ cell contains 46 chromosomes and 92 chromatids. Statement III: A cell in mitotic anaphase temporarily contains 92 chromosomes. Statement IV: Each daughter cell formed after mitosis contains 23 chromosomes. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "I, II and III", "II, III and IV", "II and III only"], "ans": 1, "c": "$G_1$: 46 chromosome, 46 chromatid. $G_2$: chromosome 46 (centromere same), chromatid 92. Anaphase: centromere split, temporarily 92 chromosomes. Mitotic daughter cell: 46 chromosomes, 23 nahi.", "m": "Centromere = chromosome; chromatid = DNA molecule count.", "s": ["I sahi: unreplicated DNA.", "II sahi: replication se chromatid double.", "III sahi: split centromeres = 92.", "IV galat: mitosis $2n \\rightarrow 2n$, 46 hi milte hain."], "r": "", "w": ["IV galat hai.", "", "IV galat include karta hai.", "I bhi sahi statement missing hai."], "t": "23 chromosome wali cell gamete hoti hai (meiosis ke baad), mitotic daughter nahi.", "sim": null}, {"id": 73, "tag": "Incorrect finder", "q": "Which of the following statements about interphase is NOT correct?", "fig": null, "opt": ["It occupies around 95 percent of the duration of the cell cycle.", "It involves both cell growth and DNA replication.", "It is the most active phase of the cell cycle in terms of metabolism.", "The chromosomes remain clearly visible throughout this phase."], "ans": 3, "c": "Interphase mein chromatin loosely spread rehta hai; distinct chromosomes microscope se clearly visible nahi hote — wo condense hoke prophase mein dikhte hain. Baaki teen statements interphase ke sahi facts hain.", "m": "Interphase ka morphology fact pakdo: chromatin, not chromosomes.", "s": ["$95\\%$ duration — sahi.", "Growth + replication dono — sahi.", "Metabolically most active — sahi.", "Distinct chromosomes sirf $M$ phase mein visible."], "r": "", "w": ["Duration fact sahi hai.", "Replication interphase k
