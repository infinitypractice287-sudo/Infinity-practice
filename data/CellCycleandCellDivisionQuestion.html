10", "2C"], ["Final gamete", "5", "5", "C"]]}, "opt": ["$G_2$ stage: 10 chromosomes and 10 chromatids", "Mitotic metaphase: 10 chromosomes and 20 chromatids", "Each cell after meiosis I: 5 chromosomes and 5 chromatids", "Each gamete after meiosis II: 10 chromosomes and 10 chromatids"], "ans": 1, "c": "Replicated cell (post-$S$) mein chromosome count $2n=10$ same rehta hai, chromatids double hoke 20 ho jate hain — mitotic metaphase yahi condition dikhata hai. Baaki options counts galat batate hain.", "m": "Chromosome = centromere count; chromatid = DNA molecule count.", "s": ["$G_2$: 10 chromosomes, 20 chromatids — option A 10/10 galat.", "Metaphase: split nahi hua, to 10/20 — option B sahi.", "Meiosis-I ke baad: 5 chromosomes, 10 chromatids — option C 5/5 galat.", "Gamete: 5/5 hota hai — option D 10/10 galat."], "r": "", "w": ["$G_2$ tak replication ho chuki, chromatids 20 hote hain, 10 nahi.", "", "Meiosis-I ke baad har chromosome mein 2 chromatids hote hain: 5/10.", "Gamete haploid hota hai: 5 chromosomes, 5 chromatids."], "t": "Question ke table aur option text dono ko saath padhna — NEET 2026 style data framing.", "sim": null}, {"id": 297, "tag": "Graph based", "q": "Two curves are plotted on the same graph against the phases of a cell cycle. Curve P remains nearly constant in height throughout $G_1$, $S$, $G_2$ and $M$, whereas Curve Q is low in $G_1$, rises through $S$ and $G_2$, peaks at the $G_2$-$M$ boundary, and falls sharply near the end of mitosis. If one curve represents cyclin concentration and the other represents CDK concentration, then:", "fig": {"k": "line", "xl": ["G1", "S", "G2", "M end"], "yl": ["High", "Low"], "ymin": 0, "ymax": 1, "yaxis": "Concentration", "series": [{"name": "Curve P (constant)", "color": "#4caf7d", "pts": [0.6, 0.6, 0.6, 0.6]}, {"name": "Curve Q (oscillating)", "color": "#d8a657", "pts": [0.1, 0.5, 1, 0.1]}], "cap": "Schematic: constant CDK vs oscillating cyclin"}, "opt": ["Curve P is cyclin and Curve Q is CDK", "Curve P is CDK and Curve Q is cyclin", "Both curves represent different cyclins", "Both curves represent different CDKs"], "ans": 1, "c": "CDK protein level stable rehta hai (P); cyclin synthesize-degrade hoke oscillate karta hai (Q), peak par MPF active.", "m": "Constant = enzyme (CDK); oscillating = regulator (cyclin).", "s": ["CDK levels constant.", "Cyclin levels rise/fall.", "Peak = mitotic cyclin.", "Sharp fall = APC degradation."], "r": "", "w": ["Cyclin constant nahi rehta.", "", "CDK oscillate nahi karta.", "Dono ek hi class ke nahi."], "t": "Graph pehchan: flat line CDK, saw-tooth line cyclin.", "sim": null}, {"id": 298, "tag": "Data based", "q": "In an onion root tip experiment, a student examines 500 cells and records: interphase 410, prophase 55, metaphase 20, anaphase 10, telophase 5. If the complete cell cycle lasts 20 hours, the approximate duration of the $M$ phase, calculated from the proportion of dividing cells, is:", "fig": {"k": "bar", "ymax": 410, "yaxis": "Cells", "groups": [{"label": "Inter.", "bars": [{"v": 410, "c": "#6cb2ff"}]}, {"label": "Pro.", "bars": [{"v": 55, "c": "#4caf7d"}]}, {"label": "Meta.", "bars": [{"v": 20, "c": "#d8a657"}]}, {"label": "Ana.", "bars": [{"v": 10, "c": "#e06c75"}]}, {"label": "Telo.", "bars": [{"v": 5, "c": "#9aa3b2"}]}], "legend": [{"n": "Cells counted", "c": "#6cb2ff"}], "cap": "Schematic root-tip count chart"}, "opt": ["0.4 hour", "1.8 hours", "3.6 hours", "9.5 hours"], "ans": 2, "c": "Dividing cells $= 55+20+10+5 = 90$. Fraction $= 90/500 = 0.18$. Duration $= 0.18 \\times 20 = 3.6$ hours.", "m": "Stage duration = (stage fraction) $\\times$ total cycle time.", "s": ["Mitotic cells = 90.", "Fraction $= 90/500$.", "$0.18 \\times 20 = 3.6$ h."], "r": "", "w": ["0.4 h galat fraction se.", "1.8 h aadha calculation hai.", "", "9.5 h interphase jaisa lamba estimate hai."], "t": "Interphase duration $= 410/500 \\times 20 = 16.4$ h — cross-check ke liye.", "sim": null}, {"id": 299, "tag": "Application/Numerical", "q": "A germ cell with $2n = 6$ undergoes meiosis. Meiosis I is normal, but during meiosis II in one of the two secondary cells, the sister chromatids of one chromosome fail to separate (nondisjunction), while the other secondary cell divides normally. The chromosome numbers in the four resulting gametes will be:", "fig": {"k": "table", "head": ["Gamete", "Source", "Count"], "rows": [["1", "Affected cell", "4"], ["2", "Affected cell", "2"], ["3", "Normal cell", "3"], ["4", "Normal cell", "3"]]}, "opt": ["3, 3, 3, 3", "4, 2, 3, 3", "4, 4, 2, 2", "6, 0, 3, 3"], "ans": 1, "c": "Normal secondary ($n=3$) do 3-3 gametes deta hai. Affected secondary mein ek chromosome dono ek taraf: ek gamete $n+1=4$, doosra $n-1=2$. Set: 4, 2, 3, 3.", "m": "II-error = 2 abnormal + 2 normal.", "s": ["Normal branch: 3, 3.", "Failed branch: 4, 2.", "Combined: 4, 2, 3, 3."], "r": "", "w": ["3,3,3,3 fully normal hota.", "", "4,4,2,2 meiosis-I error pattern hai.", "6,0 extreme multiple-error case hai."], "t": "Meiosis-I error chaaro gametes ko bigadta; II-error sirf do ko.", "sim": null}, {"id": 300, "tag": "Diagram sequencing", "q": "Four stages of a single meiotic sequence are described in words. Stage P: homologous chromosomes, each with two chromatids, are pulled to opposite poles; the centromeres remain unsplit. Stage Q: bivalent chromosomes lie at the equator with spindle fibres of opposite poles attached to the two homologs of each pair. Stage R: individual haploid chromosomes, each with two chromatids, align at a new equatorial plate. Stage S: the centromeres split and single-chromatid chromosomes move to opposite poles in each haploid cell. The correct chronological order is:", "fig": {"k": "table", "head": ["Stage", "Identity"], "rows": [["Q", "Metaphase I"], ["P", "Anaphase I"], ["R", "Metaphase II"], ["S", "Anaphase II"]]}, "opt": ["Q, P, R, S", "P, Q, S, R", "Q, R, P, S", "R, Q, P, S"], "ans": 0, "c": "Q = metaphase-I (bivalents at equator), P = anaphase-I (homologs apart), R = metaphase-II (haploid alignment), S = anaphase-II (centromere split). Sequence Q-P-R-S.", "m": "Pehle reductional division, phir equational.", "s": ["Metaphase-I $\\rightarrow$ anaphase-I.", "Interkinesis.", "Metaphase-II $\\rightarrow$ anaphase-II.", "Order Q-P-R-S."], "r": "", "w": ["", "Anaphase-I metaphase-I ke baad aata hai.", "Meiosis-II dono stages baad mein.", "R-S division-II ke andar ordered hain."], "t": "Centromere unsplit = meiosis-I; split = meiosis-II — sequence ka master clue.", "sim": null}, {"id": 301, "tag": "Numerical", "q": "The DNA content of a mature egg cell of an animal is measured as $X$ ($C$ amount of DNA). The DNA content of one of its diploid somatic cells at the end of the $G_2$ phase will be:", "fig": null, "opt": ["$X$", "$2X$", "$4X$", "$8X$"], "ans": 2, "c": "Egg haploid hai, DNA $= X = C$. Diploid somatic $G_1 = 2C = 2X$. $G_2$ tak replication se DNA double: $4C = 4X$.", "m": "Pehle egg ko $C$ se map karo, phir somatic C-value chakra lagao.", "s": ["Egg: $C = X$.", "Somatic $G_1$: $2C = 2X$.", "$G_2$ (post-$S$): $4C = 4X$."], "r": "", "w": ["$X$ gamete level hai.", "$2X$ somatic $G_1$ level hai.", "", "$8X$ impossible double-count hai."], "t": "Egg/sperm ka DNA hamesha minimum reference ($C$) hota hai.", "sim": null}, {"id": 302, "tag": "Application", "q": "A diploid cell with $2n = 12$ chromosomes enters the $S$ phase. Colchicine is added only after the cell has completed $S$ and $G_2$ and reached metaphase. If the cell then proceeds through chromatid separation without spindle formation or cytokinesis, the resulting single nucleus will contain:", "fig": null, "opt": ["12 chromosomes", "18 chromosomes", "24 chromosomes", "48 chromosomes"], "ans": 2, "c": "Metaphase tak 12 chromosomes, 24 chromatids. Spindle block par chromatids to alag hote hain par ek hi nucleus mein reh jate hain — nucleus mein 24 centromeres/chromosomes.", "m": "Colchicine after replication = doubled nucleus.", "s": ["Replication: 12 chr, 24 chromatids.", "No spindle: no partitioning.", "All 24 in one nucleus."], "r": "", "w": ["12 normal daughter count hai.", "18 odd count impossible.", "", "48 do blocked cycles ke baad banta."], "t": "Agar colchicine $S$ se pehle lagta to bhi replication normal chalti, result same doubling.", "sim": null}, {"id": 303, "tag": "Numerical", "q": "Starting from a single diploid microspore mother cell in a flowering plant, the number of pollen grains and the number of mitotic divisions needed inside each pollen grain to form the two male gametes respectively are:", "fig": null, "opt": ["2 pollen grains and 1 mitotic division each", "4 pollen grains and 1 mitotic division each", "4 pollen grains and 2 mitotic divisions each", "1 pollen grain and 3 mitotic divisions"], "ans": 1, "c": "Ek meiosis $\\rightarrow$ 4 microspores/pollen grains. Har pollen mein generative cell ek mitosis se 2 male gametes banati hai — yaani 1 mitotic division per pollen.", "m": "Meiosis count + pollen mitosis count alag karo.", "s": ["1 meiosis $\\rightarrow$ 4 pollen.", "Generative cell $\\rightarrow$ 2 gametes by 1 mitosis.", "Answer: 4 pollen, 1 division each."], "r": "", "w": ["Meiosis 4 products deta hai, 2 nahi.", "", "2 mitotic divisions ki zaroorat nahi hoti.", "1 pollen impossible hai."], "t": "Angiosperm pollen: 1 vegetative + 2 male gamete nuclei (3-celled mature pollen).", "sim": null}, {"id": 304, "tag": "Concept MCQ", "q": "In a human female, the secondary oocyte that is released at ovulation remains arrested at a specific stage until the entry of the sperm. This arrested stage is:", "fig": null, "opt": ["Diplotene of prophase I", "Metaphase I of meiosis I", "Metaphase II of meiosis II", "Telophase II of meiosis II"], "ans": 2, "c": "Primary oocyte ka lamba arrest diplotene (prophase-I) mein hota hai; ovulation ke waqt jo secondary oocyte nikalta hai woh metaphase-II mein arrested hota hai, aur sperm entry par hi meiosis-II complete hoti hai.", "m": "Do arrests alag stages: diplotene (primary) vs metaphase-II (secondary).", "s": ["Primary oocyte: diplotene arrest.", "Meiosis-I completes before ovulation.", "Secondary oocyte: metaphase-II arrest.", "Sperm entry $\\rightarrow$ completion."], "r": "", "w": ["Diplotene arrest primary oocyte ka hai.", "Metaphase-I par arrest nahi hota.", "", "Telophase-II fertilisation ke baad aata hai."], "t": "Ovulation wale cell ka naam 'secondary oocyte' padhke stage identify karo.", "sim": null}, {"id": 305, "tag": "Direct MCQ", "q": "The active maturation promoting factor (MPF) that triggers the onset of mitosis is biochemically a combination of:", "fig": null, "opt": ["Cyclin B and cyclin-dependent kinase 1 ($\\mathrm{CDK1}$)", "Actin and myosin", "Tubulin and the kinetochore protein", "Cyclin D and DNA polymerase"], "ans": 0, "c": "MPF = mitotic cyclin (cyclin B) + $\\mathrm{CDK1}$; active complex lamins phosphorylate karke envelope breakdown aur mitotic events trigger karta hai.", "m": "MPF identity rat-lo: cyclin B + $\\mathrm{CDK1}$.", "s": ["Cyclin B accumulates.", "Binds $\\mathrm{CDK1}$.", "Active MPF drives $G_2/M$.", "APC cyclin B degrade karke off karta hai."], "r": "", "w": ["", "Actin-myosin furrow machinery hai.", "Tubulin spindle ka monomer hai.", "Polymerase replication enzyme hai."], "t": "MPF ko 'M-phase promoting factor' bhi likha milta hai.", "sim": null}, {"id": 306, "tag": "Numerical", "q": "In a diploid cell with $2n = 20$, the number of bivalents at zygotene and the total number of chromatids at pachytene respectively are:", "fig": null, "opt": ["10 bivalents and 20 chromatids", "20 bivalents and 40 chromatids", "10 bivalents and 40 chromatids", "20 bivalents and 20 chromatids"], "ans": 2, "c": "Bivalents = homologous pairs = $n = 10$. Replication ho chuki, har chromosome 2 chromatid: total chromatids $= 20 \\times 2 = 40$.", "m": "Bivalent count $n$; chromatid count $4n$ at prophase-I.", "s": ["$2n=20 \\Rightarrow n=10$ pairs.", "Bivalents = 10.", "Chromatids = $2 \\times 20 = 40$."], "r": "", "w": ["20 bivalents tab hote agar $2n=40$ hota.", "20 chromatids unreplicated count hai.", "", "Dono counts ek saath galat hain."], "t": "Pachytene formula: bivalents $n$, tetrads $n$, chromatids $4n$.", "sim": null}, {"id": 307, "tag": "Numerical", "q": "A human cell is examined during anaphase I of meiosis, after the homologous chromosomes have started moving apart but before cytokinesis I. At this instant, the cell contains:", "fig": null, "opt": ["23 chromosomes and 46 chromatids", "46 chromosomes and 92 chromatids", "46 chromosomes and 46 chromatids", "92 chromosomes and 92 chromatids"], "ans": 1, "c": "Anaphase-I mein centromere split nahi hue — 46 chromosomes (23 homolog pairs separating), har chromosome 2 chromatid ka: total 92 chromatids, sab ek hi cell mein (cytokinesis pending).", "m": "Single cell gino jab tak cytokinesis na ho.", "s": ["Centromeres intact: 46 chromosomes.", "Har ek 2-chromatid: 92 chromatids.", "Split sirf anaphase-II/mitotic anaphase mein."], "r": "", "w": ["23/46 ek daughter cell (post-I) ka count hai.", "", "46/46 split-ke-baad condition hai.", "92 chromosomes impossible bina centromere split."], "t": "Reduction cytokinesis ke baad effective hoti hai, anaphase-I ke andar single cell mein poora genome rehta hai.", "sim": null}, {"id": 308, "tag": "Concept MCQ", "q": "The mitotic cyclins are selectively destroyed near the metaphase-anaphase boundary. This destruction is achieved through:", "fig": null, "opt": ["Direct dissolution by the spindle microtubules", "Ubiquitin-mediated protein degradation triggered by the Anaphase Promoting Complex", "Hydrolysis by the enzyme recombinase", "Cleavage by the actin contractile ring"], "ans": 1, "c": "APC ek ubiquitin-ligase hai jo cyclin B (aur securin) par ubiquitin tag lagata hai; proteasome use degrade karta hai — MPF off, anaphase entry.", "m": "Controlled protein removal = ubiquitin-proteasome route.", "s": ["APC ubiquitinates targets.", "Proteasome degrades.", "MPF activity falls.", "Anaphase proceeds."], "r": "", "w": ["Microtubules degrade nahi, pull karte hain.", "", "Recombinase crossing over ka enzyme hai.", "Actin ring furrow banati hai, protein tod-ti nahi."], "t": "Securin degradation separase release karta hai — cohesin cleavage ka trigger.", "sim": null}, {"id": 309, "tag": "Numerical", "q": "In an organism where the haploid chromosome number is $n = 9$, a diploid cell in the $G_2$ phase and a haploid cell in metaphase of mitosis respectively contain:", "fig": null, "opt": ["18 chromosomes with 36 chromatids, and 9 chromosomes with 18 chromatids", "18 chromosomes with 18 chromatids, and 9 chromosomes with 9 chromatids", "36 chromosomes with 36 chromatids, and 18 chromosomes with 18 chromatids", "9 chromosomes with 18 chromatids, and 18 chromosomes with 36 chromatids"], "ans": 0, "c": "Diploid $2n=18$; $G_2$ replicated: 18 chromosomes, 36 chromatids. Haploid mitotic cell ($n=9$) metaphase mein replicated: 9 chromosomes, 18 chromatids.", "m": "Ploidy decide chromosome count, replication decide chromatid count.", "s": ["Diploid: $2n=18$, double chromatids.", "Haploid: $n=9$, double chromatids.", "Metaphase tak split nahi."], "r": "", "w": ["", "Replicated cells double chromatid rakhti hain.", "36 chromosomes bina split impossible.", "Haploid cell 18 chromosomes nahi rakhta."], "t": "Haploid mitosis (drone bee) bhi same chromatid-doubling rule follow karta hai.", "sim": null}, {"id": 310, "tag": "Concept MCQ", "q": "A cell in the $G_0$ stage of the cell cycle will typically show:", "fig": null, "opt": ["$4C$ DNA and continuous centriole duplication", "$2C$ DNA with no DNA replication but active specialised metabolism", "$C$ DNA and a partially dissolved nuclear envelope", "$2C$ DNA with chromosomes fully condensed and visible under the microscope"], "ans": 1, "c": "$G_0$ cell $G_1$ se exit karti hai, isliye DNA $2C$; replication off, par cell apne function (secretion, signalling etc.) actively karti hai. Chromosomes condense nahi hote.", "m": "$G_0$ = $G_1$-like DNA, no cycling.", "s": ["Entry from $G_1$ $\\Rightarrow 2C$.", "No $S$ phase.", "Metabolism active.", "Chromatin decondensed."], "r": "", "w": ["$4C$ post-$S$ cells ka level hai.", "", "$C$ gamete level hai.", "Condensed chromosomes sirf $M$ phase mein."], "t": "Neuron permanent $G_0$ ka textbook example hai.", "sim": null}, {"id": 311, "tag": "Statement-based", "q": "Consider the following statements about the cell cycle and its regulation. Statement I: A cell that has crossed the restriction point in $G_1$ is normally committed to enter the $S$ phase even if growth factors are withdrawn later. Statement II: The protein $\\mathrm{p53}$ can halt the cycle at the $G_1/S$ checkpoint when DNA damage is detected. Statement III: Cyclin-dependent kinases remain present at relatively constant levels, while their cyclin partners oscillate in concentration. Statement IV: The spindle assembly checkpoint monitors the integrity of DNA before allowing the cell to begin replication. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "SAC kinetochore attachment check karta hai (metaphase-anaphase), DNA integrity nahi — IV galat. Pehle teeno sahi regulatory facts hain.", "m": "Har checkpoint ka kaam stage ke hisaab se map karo.", "s": ["Restriction point commitment sahi.", "$\\mathrm{p53}$ brake role sahi.", "CDK/cyclin behaviour sahi.", "SAC ka kaam galat bataya."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "DNA integrity $G_1/S$ aur $G_2/M$ check hoti hai, SAC par nahi.", "sim": null}, {"id": 312, "tag": "Statement-based", "q": "Consider the following statements about chromosome and chromatid counting in a $2n = 8$ cell. Statement I: A $G_1$ cell has 8 centromeres and 8 chromatids. Statement II: A $G_2$ cell has 8 centromeres and 16 chromatids. Statement III: A mitotic anaphase cell has 16 centromeres and 16 chromatids. Statement IV: Each cell after meiosis I has 4 centromeres and 4 chromatids. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II and IV"], "ans": 2, "c": "Meiosis-I ke baad har cell $n=4$ chromosomes (4 centromeres) par har chromosome 2-chromatid hota hai — 8 chromatids, 4 nahi; IV galat. Pehle teeno sahi hain.", "m": "Centromere = chromosome; har ek ke chromatid count alag se gino.", "s": ["$G_1$: 8/8.", "$G_2$: 8/16.", "Anaphase: split $\\Rightarrow$ 16/16.", "Post-I: 4/8 (IV 4/4 galat)."], "r": "", "w": ["IV galat hai.", "I/II missing hain.", "", "IV include karta hai."], "t": "Post-meiosis-I cell $2C$ DNA rakhti hai — chromatid count isi ka proof hai.", "sim": null}, {"id": 313, "tag": "Statement-based", "q": "Consider the following statements about the events of meiosis. Statement I: Crossing over is completed during pachytene, but the resulting chiasmata become visible only in diplotene. Statement II: The synaptonemal complex dissolves at the beginning of diplotene. Statement III: Terminalisation of chiasmata is completed by the end of diakinesis. Statement IV: The nucleolus disappears and the nuclear envelope breaks down during diakinesis. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Chaaron statements prophase-I ki exact event-timeline hain — sab sahi.", "m": "L-Z-P-D-D timeline yaad karke verify karo.", "s": ["Exchange pachytene, marks diplotene.", "SC dissolution diplotene start.", "Terminalisation diakinesis end.", "Envelope/nucleolus breakdown diakinesis."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "Saare NCERT-documented events hain.", ""], "t": "Timing gaps (exchange vs visibility) sabse common NEET trap hain.", "sim": null}, {"id": 314, "tag": "Statement-based", "q": "Consider the following statements about mitotic poisons and their targets. Statement I: Colchicine binds tubulin and prevents the polymerisation of spindle microtubules. Statement II: Vincristine and vinblastine also disrupt microtubule dynamics and arrest cells in metaphase. Statement III: Cytochalasin B disrupts actin microfilaments and interferes with cleavage furrow formation. Statement IV: A chemical that blocks DNA synthesis in the $S$ phase will cause cells to accumulate in metaphase. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "DNA-synthesis blocker cells ko $S$ phase/$G_1$-$S$ boundary par jamata hai, metaphase par nahi — IV galat. Pehle teeno sahi drug-target pairs hain.", "m": "Drug ka target = accumulation stage.", "s": ["Tubulin drugs $\\rightarrow$ metaphase.", "Actin drug $\\rightarrow$ furrow fail.", "Synthesis blocker $\\rightarrow S$ arrest.", "IV ka stage galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Colchicine metaphase, hydroxyurea $S$ phase — yaad rakho.", "sim": null}, {"id": 315, "tag": "Statement-based", "q": "Consider the following statements about cytokinesis and related phenomena. Statement I: The animal cell furrow advances centripetally, whereas the plant cell plate grows centrifugally. Statement II: The cell plate is formed from Golgi-derived vesicles and represents the future middle lamella. Statement III: Repeated karyokinesis without cytokinesis in the coconut endosperm produces a free-nuclear syncytium. Statement IV: A coenocytic fungal hypha results from repeated cytokinesis without any nuclear division. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II and IV"], "ans": 2, "c": "Coenocyte banta hai repeated nuclear division bina cytokinesis se — IV ka ulta likha hai. Pehle teeno sahi hain.", "m": "Multinucleate = karyokinesis without cytokinesis.", "s": ["Direction facts sahi.", "Vesicle/middle lamella sahi.", "Coconut example sahi.", "IV reversed, galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Fungal aseptate hyphae coenocyte ka classic example hain.", "sim": null}, {"id": 316, "tag": "Statement-based", "q": "Consider the following statements about nondisjunction. Statement I: If nondisjunction affects a homologous pair in meiosis I, all four gametes formed are abnormal. Statement II: If nondisjunction affects one chromosome in meiosis II, two gametes are normal and two are abnormal. Statement III: Nondisjunction of the X chromosome can produce gametes that lead to Turner syndrome ($45,\\mathrm{X}$) or Klinefelter syndrome ($47,\\mathrm{XXY}$) after fertilisation. Statement IV: Mitotic nondisjunction in an early embryo can produce a mosaic individual with two cell lines of different chromosome counts. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Error-stage logic, sex-chromose examples aur mitotic mosaicism — chaaron statements sahi hain.", "m": "Tree diagram socho: error ka level = affected branches.", "s": ["I-error: chaaro abnormal.", "II-error: do abnormal.", "Sex chromosome outcomes.", "Mitotic error $\\rightarrow$ mosaic."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "Clinical facts standard hain.", ""], "t": "Mosaicism tab banti hai jab error fertilisation ke baad mitosis mein ho.", "sim": null}, {"id": 317, "tag": "Statement-based", "q": "Consider the following statements about DNA content ($C$-value) changes. Statement I: In a diploid cell, the $S$ phase transforms the DNA content from $2C$ to $4C$ without any change in chromosome number. Statement II: A cell at metaphase I of meiosis contains $4C$ DNA. Statement III: Each nucleus at telophase I contains $2C$ DNA. Statement IV: The second meiotic division reduces the DNA content of each daughter nucleus from $2C$ to $C$. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "$C$-value chakra: $2C \\rightarrow 4C$ (S), $4C$ prophase/metaphase-I, $2C$ telophase-I, $C$ telophase-II — chaaron sahi.", "m": "Har cytokinesis per-cell DNA half karti hai.", "s": ["Replication doubles.", "Meiosis-I tak $4C$.", "First division $\\rightarrow 2C$.", "Second $\\rightarrow C$."], "r": "", "w": ["Sab sahi hain.", "Koi galat nahi.", "I/III bhi correct hain.", ""], "t": "Chromosome count ka chakra alag ($2n \\rightarrow n$) — mix mat karo.", "sim": null}, {"id": 318, "tag": "Statement-based", "q": "Consider the following statements about special types of division. Statement I: Endomitosis involves chromosome replication inside a nucleus that does not divide, raising its ploidy. Statement II: Polytene chromosomes result from repeated replication without separation of sister chromatids. Statement III: Amitosis in bacteria occurs without a spindle apparatus or condensation into distinct chromosomes. Statement IV: Free nuclear division involves repeated cytokinesis without karyokinesis. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Free nuclear division = karyokinesis bina cytokinesis; IV ka ulta hai. Pehle teeno sahi definitions hain.", "m": "Kya repeat hota hai, kya skip — wahi dekho.", "s": ["Endomitosis: replication repeat.", "Polytene: no chromatid separation.", "Amitosis: no spindle.", "IV reversed, galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Drosophila salivary gland polytene chromosomes endoreduplication ka model hain.", "sim": null}, {"id": 319, "tag": "Statement-based", "q": "Consider the following statements about the spindle apparatus. Statement I: Spindle fibres are microtubules built from tubulin dimers. Statement II: Kinetochore microtubules attach to the kinetochores, while polar microtubules overlap at the equator. Statement III: Animal cell spindles are astral, whereas higher plant cell spindles are anastral. Statement IV: The shortening of kinetochore microtubules helps move daughter chromosomes towards the poles during anaphase. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Composition, fibre classes, astral/anastral difference aur shortening mechanism — chaaron sahi.", "m": "Spindle ka structure + function combined.", "s": ["Tubulin composition.", "Fibre types.", "Aster difference.", "Shortening = poleward movement."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "Saare standard cell biology facts hain.", ""], "t": "Colchicine/vinca isi tubulin assembly ko target karte hain.", "sim": null}, {"id": 320, "tag": "Statement-based", "q": "Consider the following statements about the behaviour of cells in $G_0$. Statement I: Mature neurons and skeletal muscle cells are terminally differentiated and remain permanently in $G_0$. Statement II: Hepatocytes normally reside in $G_0$ but can re-enter $G_1$ to regenerate the liver after injury. Statement III: Lymphocytes in $G_0$ can be driven back into the cell cycle by antigenic stimulation. Statement IV: A cell enters $G_0$ from the $G_2$ phase immediately after completing DNA replication. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "$G_0$ entry $G_1$ se hoti hai; replicated ($4C$) cell $G_0$ mein nahi jata — IV galat. Pehle teeno sahi hain.", "m": "$G_0$ ka DNA hamesha $2C$ hota hai.", "s": ["Permanent examples sahi.", "Liver regeneration sahi.", "Lymphocyte stimulation sahi.", "Entry point galat bataya."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Facultative vs permanent $G_0$ ka farak exam mein trap banta hai.", "sim": null}, {"id": 321, "tag": "Statement-based", "q": "Consider the following statements about meiosis in the human female. Statement I: Primary oocytes are arrested in the diplotene stage of prophase I from foetal life. Statement II: The long suspended diplotene state in oocytes is sometimes referred to as the dictyate stage. Statement III: At ovulation, the secondary oocyte is arrested in metaphase II. Statement IV: Meiosis II is completed only after the entry of the sperm at fertilisation. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Do arrest points (diplotene/dictyate aur metaphase-II) aur sperm-triggered completion — chaaron statements sahi hain.", "m": "Female meiosis timeline sequence yaad karo.", "s": ["Foetal: diplotene arrest.", "Dictyate synonym.", "Ovulation: metaphase-II arrest.", "Fertilisation: completion."], "r": "", "w": ["Sab sahi hain.", "Koi galat nahi.", "II aur IV bhi standard facts hain.", ""], "t": "Polar bodies isi asymmetric division se banti hain.", "sim": null}, {"id": 322, "tag": "Statement-based", "q": "Consider the following statements comparing the two meiotic divisions. Statement I: Prophase I is long and elaborate with five sub-stages, whereas prophase II is short and simple. Statement II: DNA replicates once before meiosis I but not between meiosis I and meiosis II. Statement III: Interkinesis may be very brief or absent in many species. Statement IV: Meiosis I is reductional and meiosis II is equational. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Prophase length difference, single replication, short/absent interkinesis aur division nature — chaaron sahi.", "m": "Meiosis-I vs II ka complete comparison.", "s": ["5 sub-stages vs simple.", "One $S$ phase.", "Brief interkinesis.", "Reductional vs equational."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "Saare NCERT comparisons hain.", ""], "t": "Meiosis-II = haploid cell ka mitosis jaisa division.", "sim": null}, {"id": 323, "tag": "Incorrect finder", "q": "Which of the following statements about the $S$ phase is NOT correct?", "fig": null, "opt": ["In a diploid cell, DNA content changes from $2C$ to $4C$ while the chromosome count stays at $2n$.", "The centriole pair duplicates in the cytoplasm of animal cells during this phase.", "Histone protein synthesis is active to package the newly formed DNA.", "The number of centromeres in the cell doubles during this phase."], "ans": 3, "c": "Centromere count $S$ phase mein same rehta hai; double tab hote hain jab anaphase mein split ho. Baaki teeno $S$ phase ke sahi events hain.", "m": "Centromere = chromosome count; woh stable hai.", "s": ["DNA doubling sahi.", "Centriole duplication sahi.", "Histone synthesis sahi.", "Centromere doubling claim galat."], "r": "", "w": ["$C$-value change sahi hai.", "Centriole rule sahi hai.", "Histone fact sahi hai.", ""], "t": "Do chromatids ek centromere par — yahi stable count ka raaz hai.", "sim": null}, {"id": 324, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct about the kinetochore:", "fig": null, "opt": ["It is a proteinaceous disc assembled on each side of the centromere.", "It serves as the attachment site for spindle microtubules.", "Its proper attachment to spindle fibres is monitored by the spindle assembly checkpoint.", "It is the structure at which recombinase catalyses crossing over."], "ans": 3, "c": "Crossing over recombination nodules par hota hai (pachytene), kinetochore par nahi. Kinetochore ka kaam spindle attachment hai.", "m": "Kinetochore = attachment; nodule = exchange.", "s": ["Protein disc sahi.", "Attachment site sahi.", "SAC monitoring sahi.", "Recombinase claim galat."], "r": "", "w": ["Structure description sahi hai.", "Spindle role sahi hai.", "Checkpoint link sahi hai.", ""], "t": "Har sister chromatid ka apna kinetochore hota hai.", "sim": null}, {"id": 325, "tag": "Incorrect finder", "q": "Which of the following statements about the diplotene stage is NOT correct?", "fig": null, "opt": ["It begins with the dissolution of the synaptonemal complex.", "Homologous chromosomes start separating but remain joined at chiasmata.", "Recombination nodules first appear and crossing over begins in this stage.", "In human oocytes, arrest in this stage can persist for several decades."], "ans": 2, "c": "Nodules aur crossing over pachytene ke events hain; diplotene mein unke marks (chiasmata) bachte hain. Baaki teeno diplotene facts sahi.", "m": "Pachytene event ko diplotene mein dikhana = galat.", "s": ["SC dissolution sahi.", "Chiasma-held separation sahi.", "Exchange timing galat.", "Oocyte arrest sahi."], "r": "", "w": ["SC dissolve hona sahi event hai.", "Chiasmata holding sahi hai.", "", "Dictyate arrest documented hai."], "t": "Crossing over pachytene, visibility diplotene — yaad rakho.", "sim": null}, {"id": 326, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct regarding the Anaphase Promoting Complex:", "fig": null, "opt": ["It is a ubiquitin-ligase type protein-degradation machinery.", "It helps inactivate MPF by promoting the destruction of mitotic cyclin (cyclin B).", "A defective APC can block the transition from metaphase to anaphase.", "It directly polymerises tubulin to build the spindle fibres."], "ans": 3, "c": "APC protein degrade karwata hai, spindle banata nahi. Spindle assembly prophase mein tubulin polymerization se alag se hoti hai. Baaki teeno APC ke sahi functions hain.", "m": "APC = destruction tag machine.", "s": ["Ubiquitin-ligase identity sahi.", "Cyclin B/securin targets sahi.", "Defective APC anaphase rok deta hai.", "Tubulin polymerization APC ka kaam nahi."], "r": "", "w": ["Ubiquitin-ligase identity sahi hai.", "MPF inactivation sahi role hai.", "Metaphase arrest consequence sahi hai.", ""], "t": "APC ke do targets: securin (anaphase) aur cyclin B (mitotic exit).", "sim": null}, {"id": 327, "tag": "Incorrect finder", "q": "Which of the following statements about cytokinesis is NOT correct?", "fig": null, "opt": ["In animal cells, a contractile ring of actin microfilaments creates a cleavage furrow that deepens centripetally.", "In plant cells, Golgi-derived vesicles fuse at the equator to form the cell plate, which grows centrifugally.", "A cleavage furrow deepens centripetally to pinch the plant cell into two daughter cells.", "When karyokinesis is repeated without cytokinesis, a multinucleate syncytium can be formed."], "ans": 2, "c": "Plant cell rigid wall ke andar furrow pinch nahi kar sakta; wahan cell plate banti hai. Furrow animal mechanism hai. Baaki statements sahi hain.", "m": "Plant = plate, animal = furrow.", "s": ["Actin ring animal fact sahi.", "Vesicle plate plant fact sahi.", "Plant furrow claim galat.", "Syncytium exception sahi."], "r": "", "w": ["Animal furrow mechanism sahi hai.", "Plant plate mechanism sahi hai.", "", "Syncytium consequence sahi hai."], "t": "Cytochalasin B actin ring ko specifically disrupt karta hai.", "sim": null}, {"id": 328, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct about meiosis II:", "fig": null, "opt": ["It begins in a haploid cell and is an equational division in which sister chromatids separate.", "It reduces the chromosome number from diploid to haploid.", "It involves pairing of homologous chromosomes and formation of bivalents.", "It is preceded by a prolonged $S$ phase during which DNA is replicated again."], "ans": 3, "c": "Interkinesis mein $S$ phase hota hi nahi; DNA dobara replicate nahi hota. Baaki statements: A sahi (haploid equational), B galat-sounding par reduction meiosis-I ka kaam tha, C bhi galat (pairing meiosis-I). Question single-NOT pattern mein strongest false D hai kyunki ye directly golden rule todta hai.", "m": "Golden rule: ek replication, do divisions.", "s": ["Haploid start + equational — sahi fact.", "Reduction meiosis-I mein ho chuki.", "Pairing sirf meiosis-I.", "Dobara replication wali line sabse clearly galat."], "r": "", "w": ["Ye meiosis-II ka sahi nature hai.", "Pairing meiosis-I ka event hai par D stronger rule-break hai.", "B reduction-division confusion hai; D directly false rule hai.", ""], "t": "Interkinesis = bina $S$ phase ka gap — isse related sawal high-frequency hain.", "sim": null}, {"id": 329, "tag": "Incorrect finder", "q": "Which of the following statements about chiasmata is NOT correct?", "fig": null, "opt": ["They first become visible during the diplotene stage.", "They physically hold the homologous chromosomes together until anaphase I.", "They are the structures at which recombinase is active during crossing over.", "They are formed by astral rays attaching to the centrioles."], "ans": 3, "c": "Chiasmata homologs ke beech exchange-junction hain; astral rays/centrioles spindle pole structures hain — koi relation nahi. Baaki teeno sahi hain (recombinase pachytene mein future chiasma sites par active).", "m": "Exchange mark vs spindle structure.", "s": ["Diplotene visibility sahi.", "Cohesion role sahi.", "Recombinase site relation sahi.", "Astral ray link galat."], "r": "", "w": ["Timing fact sahi hai.", "Holding role sahi hai.", "Recombination nodule $\\rightarrow$ chiasma continuity sahi hai.", ""], "t": "Higher plant cells mein asters hote hi nahi, par chiasmata bante hain — yahi proof hai.", "sim": null}, {"id": 330, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct regarding colchicine-induced polyploidy:", "fig": null, "opt": ["Chromatids separate but cannot be partitioned into two nuclei because the spindle does not form.", "It has been used in crop improvement programmes to obtain polyploid varieties.", "A diploid cell passing through one blocked mitotic cycle can become tetraploid.", "It induces polyploidy by blocking DNA replication in the $S$ phase."], "ans": 3, "c": "Colchicine tubulin/spindle target karta hai, $S$ phase ki replication ko nahi. DNA normal replicate hota hai; problem distribution mein hai.", "m": "Spindle poison vs synthesis blocker.", "s": ["No partition — sahi mechanism.", "Breeding application sahi.", "$2n \\rightarrow 4n$ sahi.", "$S$ phase block claim galat."], "r": "", "w": ["Doubling mechanism sahi hai.", "Application documented hai.", "Tetraploid outcome correct hai.", ""], "t": "Hydroxyurea replication block karta hai; colchicine nahi.", "sim": null}, {"id": 331, "tag": "Incorrect finder", "q": "Which of the following statements about the occurrence of mitosis is NOT correct?", "fig": null, "opt": ["In plants, mitosis occurs in both haploid and diploid cells.", "In animals, mitosis is generally restricted to diploid somatic cells.", "The haploid drone honey bee produces its sperms by meiosis.", "It is the basis of growth, repair and asexual reproduction."], "ans": 2, "c": "Drone already haploid hai; reduction possible nahi, isliye sperm mitosis se bante hain. Baaki statements sahi hain.", "m": "Haploid organism meiosis nahi kar sakta.", "s": ["Plant haploid mitosis sahi.", "Animal general rule sahi.", "Drone mechanism galat.", "Mitosis roles sahi."], "r": "", "w": ["Plant life cycle fact sahi hai.", "Somatic diploid mitosis sahi hai.", "", "Growth/repair roles sahi hain."], "t": "Drone = parthenogenetic haploid male — favourite NEET exception.", "sim": null}, {"id": 332, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct about the $G_2$ phase:", "fig": null, "opt": ["Tubulin and other proteins required for mitosis are synthesised.", "The cell continues to grow and checks the replicated DNA for errors.", "The DNA content of a diploid cell is $4C$ in this phase.", "The chromosomes begin to separate towards opposite poles during this phase."], "ans": 3, "c": "$G_2$ interphase ka phase hai — chromosomes abhi condense bhi nahi hue, poleward separation to anaphase ka event hai. Baaki teeno $G_2$ facts sahi hain.", "m": "Interphase vs $M$ phase events.", "s": ["Protein synthesis sahi.", "Growth/check sahi.", "$4C$ content sahi.", "Poleward movement galat."], "r": "", "w": ["Tubulin synthesis sahi fact hai.", "$G_2/M$ check sahi hai.", "C-value sahi hai.", ""], "t": "Condensation prophase mein shuru hoti hai, $G_2$ mein chromatin hi rehta hai.", "sim": null}, {"id": 333, "tag": "Match the Columns", "q": "Match the mitotic poison or inhibitor in Column I with its precise target or effect in Column II. Column I: (a) Colchicine (b) Cytochalasin B (c) Vinblastine (d) A DNA-synthesis blocking drug. Column II: (i) Disrupts actin filaments and blocks the cleavage furrow (ii) Prevents spindle assembly by binding tubulin (iii) Arrests cells in or near the $S$ phase (iv) Vinca alkaloid that disrupts microtubule dynamics in cancer cells.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iv, c-i, d-iii", "a-iv, b-i, c-iii, d-ii"], "ans": 0, "c": "Tubulin drugs (colchicine, vinblastine) spindle target; actin drug (cytochalasin) furrow target; synthesis blocker $S$ phase.", "m": "Cytoskeleton vs synthesis classification.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Colchicine actin ko nahi, tubulin ko target karta hai.", "Vinblastine furrow block nahi karta.", "Synthesis blocker microtubule drug nahi."], "t": "Tubulin $\\rightarrow$ metaphase arrest; actin $\\rightarrow$ binucleate cells.", "sim": null}, {"id": 334, "tag": "Match the Columns", "q": "Match the event in Column I with the stage in Column II. Column I: (a) Appearance of recombination nodules (b) Dissolution of the synaptonemal complex (c) Completion of terminalisation of chiasmata (d) Start of synapsis of homologs. Column II: (i) Diakinesis (ii) Zygotene (iii) Pachytene (iv) Diplotene.", "fig": null, "opt": ["a-iii, b-iv, c-i, d-ii", "a-iv, b-iii, c-ii, d-i", "a-iii, b-i, c-iv, d-ii", "a-ii, b-iv, c-i, d-iii"], "ans": 0, "c": "Nodules pachytene; SC dissolution diplotene; terminalisation complete diakinesis; synapsis start zygotene.", "m": "L-Z-P-D-D signature events.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "Nodules diplotene mein nahi bante.", "SC dissolution diakinesis mein nahi.", "Synapsis leptotene mein shuru nahi hoti."], "t": "Exchange pachytene, marks diplotene — timing trap.", "sim": null}, {"id": 335, "tag": "Match the Columns", "q": "Match the condition in Column I with the resulting cell or tissue in Column II. Column I: (a) Repeated karyokinesis without cytokinesis (b) Repeated DNA replication without nuclear division (c) Direct nuclear constriction without spindle (d) Permanent exit from the cell cycle. Column II: (i) Amitosis of bacteria (ii) Syncytium of coconut liquid endosperm (iii) Terminally differentiated neuron (iv) Polytene or endopolyploid nucleus.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-i, b-ii, c-iv, d-iii", "a-iv, b-iii, c-i, d-ii", "a-ii, b-i, c-iii, d-iv"], "ans": 0, "c": "No cytokinesis $\\rightarrow$ syncytium; replication-only $\\rightarrow$ polytene nucleus; direct split $\\rightarrow$ amitosis; permanent exit $\\rightarrow$ neuron.", "m": "Har condition ka repeat/skip element dekho.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Amitosis syncytium nahi banata.", "Neuron endopolyploid nahi hota.", "Coconut amitosis se nahi banta."], "t": "Polytene chromosomes = endoreduplication ka visible proof.", "sim": null}, {"id": 336, "tag": "Match the Columns", "q": "Match the chromosome type in Column I with its anaphase shape in Column II. Column I: (a) Metacentric (b) Sub-metacentric (c) Acrocentric (d) Telocentric. Column II: (i) J or L-shaped (ii) I-shaped or rod-like (iii) V-shaped (iv) Nearly rod-like with a very short upper arm.", "fig": null, "opt": ["a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-ii, d-iv", "a-iii, b-iv, c-i, d-ii", "a-ii, b-i, c-iv, d-iii"], "ans": 0, "c": "Median centromere V; off-centre J/L; near-end acro nearly rod; terminal telo I.", "m": "Centromere position $\\rightarrow$ trailing arms ka shape.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "V-shape sirf metacentric ka.", "Telocentric J-shaped nahi hota.", "Acrocentric V nahi banata."], "t": "Human karyotype mein telocentric nahi milte.", "sim": null}, {"id": 337, "tag": "Match the Columns", "q": "Match the regulatory molecule or checkpoint in Column I with its function in Column II. Column I: (a) MPF (b) $\\mathrm{p53}$ (c) Spindle assembly checkpoint (d) Restriction point. Column II: (i) Monitors kinetochore attachment before anaphase (ii) Active cyclin-CDK complex that initiates mitosis (iii) Commitment point in $G_1$ beyond which the cell must divide (iv) Halts the cycle at $G_1/S$ in response to DNA damage.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iv, d-iii", "a-iv, b-iii, c-i, d-ii"], "ans": 0, "c": "MPF mitosis starter; $\\mathrm{p53}$ damage brake; SAC attachment monitor; restriction point commitment gate.", "m": "Driver, brake, monitor, gate — char roles.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "MPF checkpoint nahi, active complex hai.", "$\\mathrm{p53}$ mitosis initiate nahi karta.", "Restriction point SAC nahi hai."], "t": "$\\mathrm{p53}$ = 'guardian of the genome'.", "sim": null}, {"id": 338, "tag": "Match the Columns", "q": "Match the stage in Column I with the chromosome and DNA condition in Column II (parent cell $2n$, $G_1$ DNA $= 2C$). Column I: (a) Leptotene (b) Telophase I nucleus (c) Metaphase II cell (d) Final gamete. Column II: (i) $n$ chromosomes, two chromatids each, $2C$ DNA (ii) $n$ chromosomes, two chromatids each, $2C$ DNA at the new equator (iii) $2n$ chromosomes condensing, $4C$ DNA (iv) $n$ chromosomes, one chromatid each, $C$ DNA.", "fig": null, "opt": ["a-iii, b-i, c-ii, d-iv", "a-i, b-iii, c-iv, d-ii", "a-iv, b-i, c-ii, d-iii", "a-iii, b-ii, c-i, d-iv"], "ans": 0, "c": "Leptotene diploid condensing ($4C$); telophase-I aur metaphase-II dono haploid 2-chromatid ($2C$); final gamete haploid 1-chromatid ($C$).", "m": "Stage ke saath ploidy + chromatid state map karo.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ ii.", "d $\\rightarrow$ iv."], "r": "", "w": ["", "Leptotene haploid nahi hota.", "Gamete 2-chromatid nahi rakhta.", "Sequence mismatch wali pairing galat."], "t": "Telophase-I aur metaphase-II ki DNA condition same hoti hai; farak sirf spindle reformation ka hai.", "sim": null}, {"id": 339, "tag": "Assertion-Reason", "q": "Assertion (A): A cell in the $G_2$ phase has twice the DNA of a $G_1$ cell but is not considered tetraploid. Reason (R): Ploidy is defined by the number of centromeres (functional chromosome sets), and the sister chromatids formed in $S$ remain joined at one centromere each.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "$4C$ DNA hone par bhi centromere count $2n$ hi hai — cell diploid rehta hai. R ploidy ka precise rule dekar A explain karta hai.", "m": "Ploidy = centromere/set count, DNA amount nahi.", "s": ["$G_2$: $4C$ DNA.", "Centromeres: $2n$.", "Ploidy diploid.", "R exact reason deta hai."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Tetraploidy ke liye centromere count actually double hona chahiye (colchicine).", "sim": null}, {"id": 340, "tag": "Assertion-Reason", "q": "Assertion (A): The drone honey bee produces its male gametes by mitosis rather than meiosis. Reason (R): The drone develops from an unfertilised egg and is already haploid, so a reductional division would be meaningless.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Haploid organism meiosis kar hi nahi sakta (already $n$); mitosis se identical haploid gametes bante hain. R logic deta hai.", "m": "Ploidy decide karti hai division type.", "s": ["Drone: unfertilised egg.", "Haploid body.", "Mitosis for gametes.", "R explains A."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Queen (diploid) apne eggs meiosis se banati hai — contrast yaad rakho.", "sim": null}, {"id": 341, "tag": "Assertion-Reason", "q": "Assertion (A): Although crossing over is completed in pachytene, chiasmata are not seen until the diplotene stage. Reason (R): The synaptonemal complex that holds the homologs tightly together dissolves at the start of diplotene, exposing the points of exchange.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "SC tightly packed homologs ko cover rakhta hai; dissolve hote hi exchange points (chiasmata) visible. R visibility ka structural reason hai.", "m": "Structure removal $\\rightarrow$ mark visibility.", "s": ["Exchange pachytene.", "SC zygotene-pachytene present.", "Diplotene dissolution.", "Chiasmata visible."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Ye timing gap NEET ka repeated trap hai.", "sim": null}, {"id": 342, "tag": "Assertion-Reason", "q": "Assertion (A): A cell with a defective Anaphase Promoting Complex may remain arrested in metaphase for a prolonged period. Reason (R): Without APC activity, the proteins holding sister chromatids together are not degraded, so the chromatids cannot separate.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "APC securin degrade nahi kar payega to separase release nahi hogi, cohesin rahega, chromatids stuck — metaphase arrest. R exact molecular chain hai.", "m": "APC $\\rightarrow$ securin $\\rightarrow$ separase $\\rightarrow$ cohesin cleavage.", "s": ["APC off.", "Securin stable.", "Cohesin intact.", "No anaphase."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "NEET 2017 ka APC question isi chain par based tha.", "sim": null}, {"id": 343, "tag": "Assertion-Reason", "q": "Assertion (A): In plant cells, the new cell wall is laid down starting at the centre and growing outwards. Reason (R): Golgi-derived vesicles carrying wall materials fuse at the equator to form the cell plate, which then extends centrifugally.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Vesicles ka fusion site (equator) hi growth direction decide karta hai. R mechanism-level explanation hai.", "m": "Formation site $\\rightarrow$ direction.", "s": ["Vesicles equator par.", "Plate banti hai.", "Outward extension.", "Future middle lamella."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Phragmoplast is process ka microtubule scaffold hai.", "sim": null}, {"id": 344, "tag": "Assertion-Reason", "q": "Assertion (A): Nondisjunction in meiosis I produces a larger proportion of abnormal gametes than the same error in meiosis II. Reason (R): A meiosis I error sends a wrong chromosome set into both secondary cells, whereas a meiosis II error is confined to one of the two secondary cells.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Pehla split galat to poori tree corrupt; doosra split galat to aadhi branches. R proportion difference explain karta hai.", "m": "Tree-branch logic.", "s": ["I-error: 4/4 abnormal.", "II-error: 2/4 abnormal.", "Reason: error ka level.", "R explains A."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Risk calculation mein error-stage pehla step hona chahiye.", "sim": null}, {"id": 345, "tag": "Diagram based", "q": "A word-diagram of a dividing animal cell shows: an intact nuclear envelope with a visible nucleolus; chromatin partly condensed into thin threads; two centrosomes that have formed and begun moving apart with small asters; four-chromatid bivalents are absent; and the DNA content is $4C$. The cell depicted is in:", "fig": {"k": "stage", "phase": "prophase", "plant": false, "note2": "Schematic: early prophase — envelope intact, asters forming, 4C DNA, no bivalents"}, "opt": ["$G_1$ phase", "$S$ phase", "Early prophase of mitosis", "Pachytene of meiosis"], "ans": 2, "c": "$4C$ matlab post-$S$; envelope intact + condensing threads + moving centrosomes = early prophase. Bivalents na hone se meiosis reject.", "m": "DNA content + morphology + bivalent absence — teen clues.", "s": ["$4C$ $\\Rightarrow$ not $G_1$/$S$.", "Condensed chromatin $\\Rightarrow$ not interphase.", "No bivalents $\\Rightarrow$ mitosis.", "Envelope intact $\\Rightarrow$ early prophase."], "r": "", "w": ["$G_1$ DNA $2C$ hota hai.", "$S$ mein chromosomes visible nahi.", "", "Pachytene bivalents dikhata hai."], "t": "$4C$ + intact envelope = early mitotic prophase ki reliable combination.", "sim": null}, {"id": 346, "tag": "Data-table", "q": "A data table records four cells of the same diploid organism ($2n = 8$). Cell P: 8 chromosomes, 16 chromatids, bivalents absent. Cell Q: 4 bivalents, 16 chromatids, crossing over just completed. Cell R (per cell): 4 chromosomes, 8 chromatids, nuclear envelope reforming. Cell S (per cell): 4 chromosomes, 4 chromatids, envelope reformed. The stages represented by P, Q, R and S respectively are:", "fig": {"k": "table", "head": ["Cell", "Chr.", "Chromatids", "Marker"], "rows": [["P", "8", "16", "No bivalents"], ["Q", "4 bivalents", "16", "Crossing over done"], ["R", "4", "8", "Envelope reforms"], ["S", "4", "4", "Envelope formed"]]}, "opt": ["Mitotic $G_2$, pachytene, telophase I, telophase II", "Mitotic anaphase, zygotene, telophase II, telophase I", "Mitotic $G_2$, diakinesis, telophase II, telophase I", "Mitotic $G_1$, leptotene, anaphase II, telophase I"], "ans": 0, "c": "P replicated diploid without bivalents = mitotic $G_2$; Q bivalents + completed exchange = pachytene; R haploid 2-chromatid + reforming envelope = telophase-I; S haploid 1-chromatid = telophase-II.", "m": "Bivalents meiosis identify karate hain; chromatid count stage.", "s": ["P: $2n$, 2-chromatid, no bivalents.", "Q: 4 bivalents = pachytene.", "R: $n$ + 2-chromatid = telophase-I.", "S: $n$ + 1-chromatid = telophase-II."], "r": "", "w": ["", "Anaphase mein centromere split ho chuka hota.", "Telophase-II cell 1-chromatid hota hai.", "$G_1$ 16 chromatids nahi rakhta."], "t": "Bivalent presence/absence = mitosis vs meiosis-I ka fastest filter.", "sim": null}, {"id": 347, "tag": "Graph based", "q": "A graph plots the amount of DNA per cell (Y-axis) against time (X-axis) for a germ line undergoing complete meiosis. The trace shows: level $2C$ in $G_1$, smooth rise to $4C$ in $S$, plateau at $4C$, a vertical drop to $2C$, a short plateau, then a vertical drop to $C$. A vertical line drawn exactly at the first drop corresponds to which event?", "fig": {"k": "line", "xl": ["G1", "S", "After I", "Interk.", "After II"], "yl": ["4C", "2C", "C"], "ymin": 0, "ymax": 1, "yaxis": "DNA per cell", "series": [{"name": "C-value", "color": "#6cb2ff", "pts": [0.5, 1, 0.5, 0.5, 0.25]}], "mark": {"x": "After I", "t": "first drop"}, "cap": "Schematic: first vertical drop at the first cytokinesis"}, "opt": ["Crossing over in pachytene", "Cytokinesis I separating the two haploid nuclei", "Splitting of centromeres in anaphase II", "Entry into the $G_0$ stage"], "ans": 1, "c": "Per-cell DNA tab girta hai jab ek cell do cells mein bat-ta hai. First drop = cytokinesis-I ($4C$ wale cell se do $2C$ cells).", "m": "Vertical drop in C-value graph = cytokinesis.", "s": ["Rise = replication.", "Plateau = meiosis-I tak.", "Drop = partition.", "Second drop = cytokinesis-II."], "r": "", "w": ["Crossing over DNA amount nahi badalti.", "", "Centromere split chromosome count badalti hai, per-cell DNA nahi.", "$G_0$ somatic concept hai."], "t": "C-value graph ke har drop ke peeche ek cytokinesis hoti hai.", "sim": null}, {"id": 348, "tag": "Data based", "q": "In a root tip experiment, 400 cells are scored: interphase 340, prophase 36, metaphase 14, anaphase 6, telophase 4. If the total cell cycle duration is 25 hours, the approximate duration of prophase, calculated from its cell fraction, is:", "fig": {"k": "bar", "ymax": 340, "yaxis": "Cells", "groups": [{"label": "Inter.", "bars": [{"v": 340, "c": "#6cb2ff"}]}, {"label": "Pro.", "bars": [{"v": 36, "c": "#4caf7d"}]}, {"label": "Meta.", "bars": [{"v": 14, "c": "#d8a657"}]}, {"label": "Ana.", "bars": [{"v": 6, "c": "#e06c75"}]}, {"label": "Telo.", "bars": [{"v": 4, "c": "#9aa3b2"}]}], "legend": [{"n": "Cells counted", "c": "#6cb2ff"}], "cap": "Schematic root-tip count chart"}, "opt": ["1.0 hour", "2.25 hours", "5.5 hours", "8.75 hours"], "ans": 1, "c": "Prophase fraction $= 36/400 = 0.09$. Duration $= 0.09 \\times 25 = 2.25$ hours.", "m": "Stage time = fraction $\\times$ total cycle.", "s": ["Prophase cells = 36.", "Fraction $= 36/400 = 0.09$.", "$0.09 \\times 25 = 2.25$ h."], "r": "", "w": ["1.0 h galat fraction se.", "", "5.5 h interphase jaisa lamba estimate hai.", "8.75 h bahut zyada hai."], "t": "Relative duration principle: count $\\propto$ time spent.", "sim": null}, {"id": 349, "tag": "Application/Numerical", "q": "A germ cell with $2n = 4$ undergoes meiosis in which one pair of homologous chromosomes shows nondisjunction during meiosis I, while meiosis II in both resulting cells proceeds normally. The chromosome numbers of the four gametes formed will be:", "fig": {"k": "table", "head": ["Gamete", "Count"], "rows": [["1", "3"], ["2", "3"], ["3", "1"], ["4", "1"]], "cap": "Schematic: all four gametes abnormal after a meiosis-I error"}, "opt": ["2, 2, 2, 2", "3, 3, 1, 1", "3, 1, 2, 2", "4, 0, 2, 2"], "ans": 1, "c": "Meiosis-I error: ek secondary cell ko dono homologs ($n+1=3$), doosre ko kuch nahi ($n-1=1$). Normal meiosis-II har secondary ke do same-count gametes deta hai: 3, 3, 1, 1.", "m": "I-error $\\Rightarrow$ chaaro abnormal, do $n+1$, do $n-1$.", "s": ["Normal $n=2$.", "Failed pair ek taraf.", "Secondary cells: 3 and 1.", "Each duplicates by II: 3,3 and 1,1."], "r": "", "w": ["2,2,2,2 fully normal hai.", "", "3,1,2,2 meiosis-II error pattern hai.", "4,0 extreme case nahi hai."], "t": "I-error = 4 abnormal; II-error = 2 abnormal, 2 normal.", "sim": null}, {"id": 350, "tag": "Diagram based", "q": "A word-diagram of a meiotic cell ($2n = 8$) shows: the nuclear envelope is breaking down; four bivalents are fully condensed; each bivalent shows chiasmata close to its ends but none in the middle; the nucleolus has disappeared; and spindle fibres are attaching to the kinetochores. The sub-stage and the number of centromeres present in the cell respectively are:", "fig": {"k": "bivalent"}, "opt": ["Diplotene and 4", "Diakinesis and 8", "Pachytene and 16", "Zygotene and 8"], "ans": 1, "c": "Terminalised chiasmata + envelope breakdown = diakinesis. $2n=8$ matlab 8 chromosomes, har ek ek centromere — total 8 centromeres (bivalents 4 hain kyunki 4 pairs).", "m": "Stage = diakinesis; centromere count = chromosome count.", "s": ["Chiasmata at tips $\\Rightarrow$ terminalised.", "Envelope breaking $\\Rightarrow$ diakinesis.", "Chromosomes = 8.", "Centromeres = 8."], "r": "", "w": ["Diplotene mein terminalisation adhoori hoti hai.", "", "16 centromeres bina split impossible.", "Zygotene mein envelope intact rehta hai."], "t": "Bivalent count $n$, centromere count $2n$ — dono alag gino.", "sim": null}, {"id": 351, "tag": "Numerical (high-order)", "q": "A diploid cell with $2n = 24$ chromosomes is examined at mitotic metaphase. Each chromosome possesses two sister chromatids, and every chromatid carries one kinetochore on its side of the centromere. The total number of kinetochores present in this cell is:", "fig": null, "opt": ["12", "24", "48", "96"], "ans": 2, "c": "Har replicated chromosome par 2 sister chromatids aur har chromatid ka apna kinetochore. $24 \\times 2 = 48$ kinetochores.", "m": "Kinetochore count = chromatid count at metaphase.", "s": ["Chromosomes = 24.", "Chromatids = 48.", "1 kinetochore per chromatid.", "Total = 48."], "r": "", "w": ["12 = haploid number, yahan relevant nahi.", "24 = chromosome/centromere count.", "", "96 double-count hai."], "t": "Spindle assembly checkpoint har ek kinetochore ki attachment verify karta hai.", "sim": null}, {"id": 352, "tag": "Advanced concept", "q": "The activation of MPF requires removal of an inhibitory phosphate group from its $\\mathrm{CDK1}$ subunit. The enzyme that carries out this activating dephosphorylation at the $G_2$ to $M$ boundary is:", "fig": null, "opt": ["$\\mathrm{Wee1}$ kinase", "$\\mathrm{Cdc25}$ phosphatase", "Anaphase Promoting Complex", "Recombinase"], "ans": 1, "c": "$\\mathrm{Wee1}$ inhibitory phosphate lagata hai; $\\mathrm{Cdc25}$ phosphatase wahi phosphate hata ke $\\mathrm{CDK1}$ (MPF) activate karta hai. APC alag (degradation), recombinase alag (crossing over).", "m": "Kinase adds phosphate, phosphatase removes — name se enzyme identify karo.", "s": ["MPF = cyclin B + $\\mathrm{CDK1}$.", "Inhibitory phosphate on $\\mathrm{CDK1}$.", "$\\mathrm{Cdc25}$ removes it.", "Active MPF enters mitosis."], "r": "", "w": ["$\\mathrm{Wee1}$ inhibitory phosphorylation karta hai, activation nahi.", "", "APC proteins degrade karta hai.", "Recombinase meiosis ka enzyme hai."], "t": "$\\mathrm{Cdc25}$ ki kami se cell $G_2$ mein atak jati hai.", "sim": null}, {"id": 353, "tag": "Advanced concept", "q": "The retinoblastoma ($\\mathrm{Rb}$) protein in its active, hypophosphorylated state controls the restriction point in $G_1$. In this active form, it functions by:", "fig": null, "opt": ["Binding and sequestering the $\\mathrm{E2F}$ transcription factor, thereby preventing entry into the $S$ phase", "Directly degrading mitotic cyclin at the end of mitosis", "Catalysing the crossing over reaction during pachytene", "Polymerising tubulin to build the spindle fibres"], "ans": 0, "c": "Active $\\mathrm{Rb}$ $\\mathrm{E2F}$ ko pakad ke rakhta hai, jisse $S$-phase genes on nahi hote. Cyclin-CDK phosphorylate karke $\\mathrm{Rb}$ ko inactivate karta hai, $\\mathrm{E2F}$ free hoke $S$ phase shuru hota hai.", "m": "Restriction point ka molecular brake = $\\mathrm{Rb}$-$\\mathrm{E2F}$ interaction.", "s": ["Active $\\mathrm{Rb}$ binds $\\mathrm{E2F}$.", "No $S$-phase transcription.", "CDK phosphorylation releases $\\mathrm{E2F}$.", "Cell commits to division."], "r": "", "w": ["", "Cyclin degradation APC ka kaam hai.", "Crossing over recombinase karta hai.", "Tubulin polymerization spindle ka process hai."], "t": "$\\mathrm{Rb}$ loss-of-function = retinal tumours; classic tumour suppressor.", "sim": null}, {"id": 354, "tag": "Numerical", "q": "In an angiosperm, how many meiotic divisions in total are required for the formation of 200 viable seeds, considering that each seed needs one egg and one pollen grain for fertilisation?", "fig": null, "opt": ["200", "250", "400", "800"], "ans": 1, "c": "Female: 200 eggs $\\Rightarrow$ 200 meiosis. Male: 4 pollen per meiosis $\\Rightarrow 200/4 = 50$ meiosis. Total $200 + 50 = 250$.", "m": "Seeds formula: $n + n/4 = 1.25n$.", "s": ["Female = 200.", "Male = 50.", "Sum = 250."], "r": "", "w": ["200 sirf female count hai.", "", "400 double female-side estimate hai.", "800 poora double hai."], "t": "Angiosperm seed calculation mein dono gamete contributions count karo.", "sim": null}, {"id": 355, "tag": "Numerical", "q": "Starting from a single cell, the number of successive rounds (generations) of mitosis required to produce a tissue containing 64 cells, assuming every cell divides in each round, is:", "fig": null, "opt": ["5", "6", "7", "63"], "ans": 1, "c": "Har round cells double: $2^n = 64$. $2^6 = 64$, isliye 6 rounds.", "m": "Power-of-two rule.", "s": ["$2^5 = 32$.", "$2^6 = 64$.", "Answer 6."], "r": "", "w": ["5 rounds se 32 cells.", "", "7 rounds se 128 cells.", "63 total divisions ka count hai, rounds nahi."], "t": "Total mitotic events $= 64-1 = 63$, rounds $= 6$ — dono mat alag hain.", "sim": null}, {"id": 356, "tag": "Advanced concept", "q": "For sister chromatids to separate at anaphase, the enzyme separase must be released from its inhibitory partner. The Anaphase Promoting Complex triggers the ubiquitination and degradation of this inhibitory partner, which is:", "fig": null, "opt": ["Securin", "Cyclin A", "Histone $\\mathrm{H1}$", "Tubulin"], "ans": 0, "c": "Securin separase ko inhibit karta hai. APC securin ko ubiquitinate karke degrade karwata hai; free separase cohesin todti hai, chromatids separate.", "m": "APC chain: securin degradation $\\rightarrow$ separase $\\rightarrow$ cohesin cleavage.", "s": ["Securin bound to separase.", "APC ubiquitinates securin.", "Proteasome degrades it.", "Separase opens cohesin."], "r": "", "w": ["", "Cyclin A degradation bhi hoti hai par woh separase inhibitor nahi.", "Histone packaging protein hai.", "Tubulin spindle monomer hai."], "t": "Securin aur cyclin B — APC ke do key targets.", "sim": null}, {"id": 357, "tag": "Concept MCQ", "q": "A type of meiosis in which spore mother cells undergo reduction division to produce haploid spores that later grow into a haploid gametophyte is called sporic meiosis. A typical example of an organism showing sporic meiosis is:", "fig": null, "opt": ["Chlamydomonas, where the zygote itself undergoes meiosis", "Human beings, where meiosis directly forms gametes", "A fern such as Dryopteris, where meiosis forms spores", "A bacterium dividing by binary fission"], "ans": 2, "c": "Plants/ferns mein spore mother cells meiosis se haploid spores banati hain — sporic meiosis. Chlamydomonas zygotic, animals gametic, bacteria meiosis karte hi nahi.", "m": "Meiosis product dekho: spore = sporic, gamete = gametic, zygote division = zygotic.", "s": ["Fern: diploid sporophyte.", "Spore mother cells $\\rightarrow$ spores.", "Spores $\\rightarrow$ gametophyte.", "Sporic meiosis."], "r": "", "w": ["Chlamydomonas zygotic type hai.", "Humans gametic meiosis dikhate hain.", "", "Binary fission meiosis nahi."], "t": "Alternation of generations sporic meiosis ka direct result hai.", "sim": null}, {"id": 358, "tag": "Numerical (high-order)", "q": "In a diploid cell with $2n = 10$ undergoing meiosis, every bivalent must have at least one chiasma to ensure proper orientation on the spindle. The minimum number of chiasmata expected in this cell at the diplotene stage is:", "fig": null, "opt": ["5", "10", "20", "40"], "ans": 0, "c": "Bivalents = homologous pairs = $n = 5$. Ek chiasma per bivalent minimum, to minimum 5 chiasmata.", "m": "Chiasma minimum = bivalent count = $n$.", "s": ["$2n=10 \\Rightarrow n=5$ pairs.", "1 chiasma per pair.", "Minimum 5."], "r": "", "w": ["", "10 to total chromosome count hai, bivalent/chiasma minimum nahi.", "20 chromatid-level count hai, ek bivalent par minimum ek hi chiasma chahiye.", "40 extreme over-count hai; minimum rule n=$5$ deta hai."], "t": "Ek se zyada chiasma lambi chromosomes par common hai, par minimum rule $n$ hai.", "sim": null}, {"id": 359, "tag": "Advanced concept", "q": "In a dividing plant cell, the spindle microtubules and Golgi-derived vesicles become organised at the equator into a scaffold that guides the deposition and growth of the cell plate. This plant-specific structure is called the:", "fig": null, "opt": ["Midbody", "Phragmoplast", "Cleavage furrow", "Synaptonemal complex"], "ans": 1, "c": "Phragmoplast microtubules + actin + vesicles ka plant-specific scaffold hai jo cell plate construction guide karta hai. Midbody animal cytokinesis ka remnant hai; SC meiosis ka.", "m": "Plant plate scaffold = phragmoplast.", "s": ["Vesicles equator par.", "Microtubules guide karte hain.", "Plate grows outward.", "Structure: phragmoplast."], "r": "", "w": ["Midbody animal cell ka intercellular bridge hai.", "", "Furrow animal mechanism hai.", "SC prophase-I ka pairing structure hai."], "t": "Phragmoplast ke bina plant cytokinesis adhoora rehta hai.", "sim": null}, {"id": 360, "tag": "Numerical (high-order)", "q": "A diploid germ cell with $2n = 6$ is observed during anaphase I of meiosis, after the homologous chromosomes have begun moving to opposite poles but before cytokinesis I. The total number of centromeres present in this single cell at that instant is:", "fig": null, "opt": ["3", "6", "12", "24"], "ans": 1, "c": "Anaphase-I mein centromere split nahi hote; 6 chromosomes ke 6 centromeres hain, chahe homologs opposite poles ja rahe hon — cytokinesis tak sab ek hi cell mein.", "m": "Centromere count tab tak 6 hai jab tak split na ho.", "s": ["Starting: 6 centromeres.", "Anaphase-I: no split.", "Single cell still.", "Count = 6."], "r": "", "w": ["3 = ek future daughter ka count hai, poora cell ka nahi.", "", "12 split-ke-baad count hai.", "24 impossible hai."], "t": "Reduction cytokinesis ke baad effective hoti hai, anaphase-I ke andar nahi.", "sim": null}, {"id": 361, "tag": "Concept MCQ", "q": "The giant chromosomes found in the larval salivary gland cells of Drosophila and Chironomus arise because the DNA undergoes repeated rounds of replication inside a nucleus that neither divides nor separates the chromatids. This special process is:", "fig": null, "opt": ["Amitosis", "Endoreduplication leading to polytene chromosomes", "Zygotic meiosis", "Cleavage furrow formation"], "ans": 1, "c": "Repeated $S$ phases bina mitosis ke = endoreduplication/endomitosis; chromatids aligned reh kar polytene (giant) chromosomes banati hain.", "m": "Replication without division = endoreduplication.", "s": ["Repeated DNA synthesis.", "No nuclear division.", "No chromatid separation.", "Polytene giant chromosomes."], "r": "", "w": ["Amitosis direct nucleus split hai.", "", "Zygotic meiosis reduction division hai.", "Furrow animal cytokinesis hai."], "t": "Polytene bands aur puffs gene activity mapping mein use hote hain.", "sim": null}, {"id": 362, "tag": "Numerical (high-order)", "q": "The DNA content of a diploid somatic cell in the $G_1$ phase is measured as 10 picogram. A cell of the same lineage is examined during anaphase II of meiosis, after the centromeres have split but before the second cytokinesis. The DNA content of this cell at that instant is:", "fig": null, "opt": ["5 picogram", "10 picogram", "20 picogram", "40 picogram"], "ans": 1, "c": "$G_1 = 10$ pg $= 2C$. Meiosis-I ke baad har cell $2C = 10$ pg. Anaphase-II split DNA amount nahi badalta; cytokinesis-II ke baad hi $C = 5$ pg milega.", "m": "Cytokinesis tak per-cell DNA same.", "s": ["$G_1$: $2C = 10$ pg.", "Post-I: $2C$ per cell.", "Anaphase-II: still one cell, $2C$.", "Content = 10 pg."], "r": "", "w": ["5 pg final gamete ka content hai.", "", "20 pg $4C$ parent level hai.", "40 pg impossible."], "t": "Centromere split chromosome count badalti hai, DNA content nahi.", "sim": null}, {"id": 363, "tag": "Statement-based", "q": "Consider the following statements about the $S$ phase. Statement I: In a diploid cell, the DNA content changes from $2C$ to $4C$. Statement II: The chromosome number doubles along with the DNA content. Statement III: In animal cells, the centriole duplicates in the cytoplasm. Statement IV: Histone synthesis is active to package the newly replicated DNA. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, III and IV", "I, II, III and IV"], "ans": 2, "c": "Chromosome number stable (centromere same) — II galat. DNA doubling, centriole duplication aur histone synthesis sahi events hain.", "m": "$S$ phase: content double, count same.", "s": ["I: $2C \\rightarrow 4C$ sahi.", "II: chromosome doubling galat.", "III: centriole duplication sahi.", "IV: histone synthesis sahi."], "r": "", "w": ["II galat hai.", "II include karta hai.", "", "Koi 'all correct' option valid nahi."], "t": "Histone synthesis aur replication tightly coupled hote hain.", "sim": null}, {"id": 364, "tag": "Statement-based", "q": "Consider the following statements about the sub-stages of prophase I. Statement I: Leptotene shows gradual compaction and visibility of chromosomes. Statement II: Zygotene is marked by synapsis and assembly of the synaptonemal complex. Statement III: Pachytene shows recombination nodules and recombinase-mediated crossing over. Statement IV: In diakinesis, terminalisation of chiasmata is completed and the nuclear envelope breaks down. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II, III and IV"], "ans": 3, "c": "Chaaron statements L-Z-P-D-D ki exact timeline hain — sab sahi.", "m": "Sequence yaad karke har event verify karo.", "s": ["Leptotene compaction.", "Zygotene pairing.", "Pachytene exchange.", "Diakinesis terminalisation + breakdown."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "IV bhi sahi event hai.", ""], "t": "NEET 2024 ne leptotene/diplotene lines puchi — high-weightage.", "sim": null}, {"id": 365, "tag": "Statement-based", "q": "Consider the following statements about cell cycle checkpoints. Statement I: The $G_1/S$ checkpoint assesses cell size, nutrients, growth signals and DNA integrity. Statement II: The $G_2/M$ checkpoint blocks mitosis if replication is incomplete or DNA damage persists. Statement III: The spindle assembly checkpoint delays anaphase until every kinetochore is correctly attached. Statement IV: $\\mathrm{p53}$ can halt the cycle for DNA repair or induce apoptosis when damage is irreparable. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II, III and IV"], "ans": 3, "c": "Teen checkpoints + $\\mathrm{p53}$ guardian role — chaaron statements standard molecular facts hain.", "m": "Checkpoint-by-checkpoint verify.", "s": ["Restriction point checks.", "Replication gate.", "Attachment gate.", "$\\mathrm{p53}$ arrest/apoptosis."], "r": "", "w": ["Sab correct hain.", "Koi galat nahi.", "IV bhi documented role hai.", ""], "t": "$\\mathrm{p53}$ dysfunction cancers mein hallmark hai.", "sim": null}, {"id": 366, "tag": "Statement-based", "q": "Consider the following statements about cytokinesis. Statement I: The animal furrow advances centripetally while the plant cell plate grows centrifugally. Statement II: The plant cell plate is built from Golgi-derived vesicles and becomes the future middle lamella. Statement III: The phragmoplast organises microtubules and vesicles during plant cell plate formation. Statement IV: The dense intercellular bridge called the midbody is a characteristic structure of plant cell cytokinesis. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Midbody animal cell (actin/tubulin bridge) ka structure hai, plant ka nahi — IV galat. Pehle teeno plant/animal cytokinesis facts sahi hain.", "m": "Animal vs plant-specific structures alag karo.", "s": ["Direction facts sahi.", "Vesicle/middle lamella sahi.", "Phragmoplast plant-specific sahi.", "Midbody animal hai, IV galat."], "r": "", "w": ["", "IV galat hai.", "IV include karta hai.", "I bhi sahi statement missing hai."], "t": "Plant: phragmoplast; animal: midbody/contractile ring.", "sim": null}, {"id": 367, "tag": "Statement-based", "q": "Consider the following statements about nondisjunction. Statement I: Meiosis-I nondisjunction makes all four gametes abnormal. Statement II: Meiosis-II nondisjunction gives two normal and two abnormal gametes. Statement III: Abnormal gametes carry $n+1$ or $n-1$ chromosomes. Statement IV: Mitotic nondisjunction in an early embryo can produce a mosaic individual. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Error-level logic, gamete counts aur somatic mosaicism — chaaron statements sahi hain.", "m": "Tree logic: early error = more affected branches.", "s": ["I-error: 4 abnormal.", "II-error: 2 abnormal.", "$n\\pm1$ gametes.", "Post-zygotic error = mosaic."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "III/IV bhi standard hain.", ""], "t": "Mosaic lines ka chromosome count alag-alag ho sakta hai.", "sim": null}, {"id": 368, "tag": "Statement-based", "q": "Consider the following statements for a diploid cell ($G_1 = 2C$, $2n$). Statement I: A zygotene cell contains $4C$ DNA. Statement II: Each daughter cell after meiosis I contains $2C$ DNA but only $n$ chromosomes, each with two chromatids. Statement III: No DNA content change occurs during interkinesis. Statement IV: During anaphase II, the single cell temporarily contains $2n$ chromosomes after centromere splitting while its DNA remains $2C$ until cytokinesis. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Poora $C$-value/chromosome timeline sahi capture kiya gaya hai — chaaron statements correct hain.", "m": "Centromere count aur C-value dono axes pe verify karo.", "s": ["Post-$S$ prophase-I: $4C$.", "Post-I: $n$, $2C$, 2-chromatid.", "Interkinesis: no replication.", "Anaphase-II: temporary $2n$ in one cell, $2C$."], "r": "", "w": ["Sab sahi hain.", "Koi galat nahi.", "IV ka temporary-count trap samjho.", ""], "t": "Anaphase-II ka $2n$ sirf ek cell ke andar hota hai; cytokinesis ke baad har daughter $n$.", "sim": null}, {"id": 369, "tag": "Statement-based", "q": "Consider the following statements about MPF and the Anaphase Promoting Complex. Statement I: Active MPF is a complex of mitotic cyclin (cyclin B) and $\\mathrm{CDK1}$. Statement II: Active MPF phosphorylates nuclear lamins, contributing to envelope breakdown. Statement III: The APC promotes ubiquitination of securin and cyclin B, targeting them for degradation. Statement IV: The cellular concentration of $\\mathrm{CDK1}$ oscillates sharply during the cycle, while cyclin B concentration remains constant. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Ulta hai: cyclin B oscillate karta hai, $\\mathrm{CDK1}$ level constant — IV galat. Pehle teeno sahi molecular facts hain.", "m": "Constant enzyme ($\\mathrm{CDK1}$), oscillating regulator (cyclin).", "s": ["MPF composition sahi.", "Lamin phosphorylation sahi.", "APC targets sahi.", "IV concentrations ulta batata hai."], "r": "", "w": ["", "IV galat hai.", "IV include karta hai.", "I bhi sahi statement missing hai."], "t": "Cyclin synthesis se MPF on, APC degradation se off.", "sim": null}, {"id": 370, "tag": "Statement-based", "q": "Consider the following statements about special modes of nuclear division. Statement I: Amitosis is direct constriction of the nucleus without spindle or distinct chromosomes. Statement II: Endomitosis raises the ploidy of one nucleus by repeated replication without nuclear division. Statement III: Free nuclear division in coconut endosperm produces a multinucleate syncytium. Statement IV: A c
