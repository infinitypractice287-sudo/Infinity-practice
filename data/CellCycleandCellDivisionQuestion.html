oenocyte is formed by the fusion of many separate uninucleate cells. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Coenocyte repeated karyokinesis bina cytokinesis se banta hai; cell fusion se nahi (wo muscle fibre pattern hai) — IV galat. Pehle teeno sahi hain.", "m": "Coenocyte = division without partition; fusion = muscle.", "s": ["Amitosis direct split.", "Endomitosis replication-only.", "Coconut syncytium.", "IV ka mechanism galat."], "r": "", "w": ["", "IV galat hai.", "IV include karta hai.", "I bhi sahi statement missing hai."], "t": "Multinucleate ka source hamesha check karo: no-cytokinesis ya fusion.", "sim": null}, {"id": 371, "tag": "Statement-based", "q": "Consider the following statements about meiosis in the human female. Statement I: Primary oocytes arrest in diplotene (dictyate) from foetal life. Statement II: The secondary oocyte at ovulation is arrested in metaphase II. Statement III: Meiosis II is completed only after sperm entry. Statement IV: The first polar body divides to form two functional cells that participate in fertilisation. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Polar bodies degenerate kar jati hain, fertilise nahi karti — IV galat. Pehle teeno oogenesis facts sahi hain.", "m": "Polar bodies = non-functional by-products.", "s": ["Diplotene arrest sahi.", "Metaphase-II arrest sahi.", "Sperm-triggered completion sahi.", "IV functional claim galat."], "r": "", "w": ["", "IV galat hai.", "IV include karta hai.", "I bhi sahi statement missing hai."], "t": "Asymmetric division cytoplasm oocyte mein rakhta hai, nuclei polar bodies mein.", "sim": null}, {"id": 372, "tag": "Statement-based", "q": "Consider the following statements comparing mitosis and meiosis. Statement I: Both are preceded by one round of DNA replication in the $S$ phase. Statement II: Independent assortment of homologs occurs in meiosis I but not in mitosis. Statement III: Barring rare mutation, the two mitotic daughter cells are genetically identical to each other and to the parent. Statement IV: Meiosis gives four haploid cells after two nuclear divisions following one replication. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Chaaron statements dono divisions ke core comparison points hain — sab sahi.", "m": "Replication, assortment, identity, product count — verify.", "s": ["One $S$ phase.", "Assortment meiosis-only.", "Mitosis identity.", "Meiosis: 4 haploid."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "Saare NCERT comparisons hain.", ""], "t": "Variation ke do sources: crossing over + independent assortment.", "sim": null}, {"id": 373, "tag": "Incorrect finder", "q": "Which of the following statements is NOT correct?", "fig": null, "opt": ["The kinetochore is a disc-shaped protein structure assembled on the centromere for spindle attachment.", "The centromere is the constricted DNA region holding the two sister chromatids together.", "The kinetochore is a DNA-rich constriction, and spindle fibres attach directly to centromeric DNA without any protein intermediary.", "Correct attachment of every kinetochore is monitored by the spindle assembly checkpoint."], "ans": 2, "c": "Kinetochore protein hai, DNA-rich constriction nahi; fibres kinetochore par lagti hain, seedha DNA par nahi. Baaki teeno sahi hain.", "m": "Protein disc vs DNA region — ulta statement pakdo.", "s": ["Kinetochore protein — sahi.", "Centromere DNA — sahi.", "Direct-DNA claim galat.", "SAC monitoring sahi."], "r": "", "w": ["Kinetochore description sahi hai.", "Centromere description sahi hai.", "", "Checkpoint fact sahi hai."], "t": "Har chromatid par ek kinetochore banta hai.", "sim": null}, {"id": 374, "tag": "Correct finder", "q": "Select the correct statement about the $G_0$ phase:", "fig": null, "opt": ["All cells in $G_0$ have lost metabolic activity and cannot synthesise any proteins.", "Lymphocytes residing in $G_0$ can be stimulated by antigens to re-enter the $G_1$ phase and divide.", "A cell enters $G_0$ immediately after completing the $G_2$ phase.", "DNA replication continues at a slow rate throughout $G_0$."], "ans": 1, "c": "Lymphocytes facultative $G_0$ ki classic example hain — antigen stimulation par clonal expansion ke liye wapas cycle mein aati hain. $G_0$ cells active rehti hain, $G_1$ se exit karti hain, replication off hoti hai.", "m": "Reversible $G_0$ example = lymphocyte/hepatocyte.", "s": ["Metabolism on hai.", "Re-entry possible.", "Entry from $G_1$.", "No replication."], "r": "", "w": ["$G_0$ metabolically active hota hai.", "", "$G_2$ se exit nahi hota.", "Replication sirf $S$ phase mein."], "t": "Permanent $G_0$ = neuron; reversible = lymphocyte.", "sim": null}, {"id": 375, "tag": "Incorrect finder", "q": "Which of the following statements about the diplotene stage is NOT correct?", "fig": null, "opt": ["It begins with dissolution of the synaptonemal complex.", "Homologs begin to separate but stay joined at the chiasmata.", "Human primary oocytes may remain arrested here for many years.", "Recombination nodules first appear and crossing over begins in this stage."], "ans": 3, "c": "Nodules aur crossing over pachytene ke events hain; diplotene mein sirf unke marks bachte hain. Baaki teeno diplotene facts sahi hain.", "m": "Pachytene event ko diplotene mein dikhana = galat.", "s": ["SC dissolution sahi.", "Chiasma-held separation sahi.", "Oocyte arrest sahi.", "Nodule timing galat."], "r": "", "w": ["SC dissolve hona sahi event hai.", "Chiasmata holding sahi hai.", "Dictyate arrest documented hai.", ""], "t": "Exchange pachytene, visibility diplotene — yaad rakho.", "sim": null}, {"id": 376, "tag": "Correct finder", "q": "Select the correct statement about the Anaphase Promoting Complex:", "fig": null, "opt": ["It is a ubiquitin-ligase machinery that marks proteins such as securin and cyclin B for degradation.", "It directly catalyses DNA replication during the $S$ phase.", "It assembles the synaptonemal complex during the zygotene stage.", "It is the contractile protein ring that forms the cleavage furrow."], "ans": 0, "c": "APC ubiquitin-ligase hai jo securin (separase release) aur cyclin B (MPF off) ko proteasome degradation ke liye tag karta hai — anaphase entry aur mitotic exit ka key regulator.", "m": "APC = protein-degradation tag machine.", "s": ["Targets: securin, cyclin B.", "Ubiquitin tag.", "Proteasome degrades.", "Anaphase proceeds."], "r": "", "w": ["", "Replication DNA polymerase ka kaam hai.", "SC prophase-I ka structure hai.", "Contractile ring actin-myosin hai."], "t": "APC defective ho to chromatids stuck — NEET 2017 frame.", "sim": null}, {"id": 377, "tag": "Incorrect finder", "q": "Which of the following statements about cytokinesis in higher plant cells is NOT correct?", "fig": null, "opt": ["Golgi-derived vesicles carrying wall materials fuse at the equator to form the cell plate.", "The cell plate grows centrifugally and ultimately represents the middle lamella of the new wall.", "A cleavage furrow deepens centripetally to pinch the plant cell into two daughter cells.", "The phragmoplast organises the microtubules and vesicles involved in cell plate formation."], "ans": 2, "c": "Rigid cell wall furrow ko allow nahi karti; plant cells plate banati hain. Furrow centripetal mechanism animal cells ka hai. Baaki teeno plant cytokinesis facts sahi hain.", "m": "Plant = plate (centrifugal); animal = furrow (centripetal).", "s": ["Vesicle fusion sahi.", "Plate direction/fate sahi.", "Furrow claim galat.", "Phragmoplast role sahi."], "r": "", "w": ["Golgi vesicle fact sahi hai.", "Middle lamella fate sahi hai.", "", "Phragmoplast plant-specific sahi fact hai."], "t": "Phragmoplast ke microtubules vesicles ko equator par guide karte hain.", "sim": null}, {"id": 378, "tag": "Correct finder", "q": "Select the correct statement about the enzyme recombinase:", "fig": null, "opt": ["It mediates exchange of segments between non-sister chromatids of homologous chromosomes at recombination nodules during pachytene.", "It catalyses polymerisation of tubulin into spindle microtubules.", "It phosphorylates the $\\mathrm{Rb}$ protein at the restriction point.", "It degrades cyclin B to allow exit from mitosis."], "ans": 0, "c": "Recombinase recombination nodules par pachytene mein non-sister chromatid exchange catalyse karta hai. Tubulin, $\\mathrm{Rb}$ aur cyclin B ke saath iska koi lena-dena nahi.", "m": "Recombinase $\\leftrightarrow$ crossing over (pachytene).", "s": ["Nodules pachytene mein.", "Enzyme wahan active.", "Non-sister exchange.", "Recombinant chromatids bante hain."], "r": "", "w": ["", "Tubulin polymerization spindle ka process hai.", "$\\mathrm{Rb}$ phosphorylation cyclin-CDK karta hai.", "Cyclin B degradation APC ka kaam hai."], "t": "Recombination nodule ki jagah hi future chiasma banti hai.", "sim": null}, {"id": 379, "tag": "Incorrect finder", "q": "Which of the following statements about interkinesis is NOT correct?", "fig": null, "opt": ["It is the short gap between meiosis I and meiosis II.", "A fresh round of DNA replication takes place during interkinesis.", "The chromosomes entering interkinesis already contain two sister chromatids each.", "In many organisms, interkinesis is very brief or almost absent."], "ans": 1, "c": "Interkinesis mein $S$ phase hota hi nahi — ek replication, do divisions wala rule. Baaki teeno sahi facts hain.", "m": "No DNA replication between the two meiotic divisions.", "s": ["Gap definition sahi.", "Replication claim galat.", "2-chromatid state sahi.", "Brief/absent observation sahi."], "r": "", "w": ["Definition sahi hai.", "", "Chromatid state sahi hai.", "Duration fact sahi hai."], "t": "Agar yahan replication hoti to $C$-value chakra toot jata.", "sim": null}, {"id": 380, "tag": "Correct finder", "q": "Select the correct statement about chromosome and DNA counting in a diploid cell:", "fig": null, "opt": ["In mitotic anaphase, the cell temporarily contains twice as many centromeres as in $G_1$, while the total DNA remains at the $4C$ level until cytokinesis.", "In mitotic anaphase, both the chromosome number and DNA content are halved within the single cell.", "After the $S$ phase, the cell is considered tetraploid because its DNA content has become $4C$.", "A $G_2$ cell contains twice the number of centromeres of a $G_1$ cell."], "ans": 0, "c": "Anaphase split se centromere count double (temporary), par DNA tab tak $4C$ hai jab tak cytokinesis na ho. $S$ phase ploidy nahi badalti; $G_2$ mein centromere count same rehta hai.", "m": "Centromere count vs DNA amount — do independent axes.", "s": ["$G_1$: $2n$, $2C$.", "$G_2$: $2n$, $4C$.", "Anaphase: $4n$ temporarily, $4C$.", "After cytokinesis: $2n$, $2C$ per cell."], "r": "", "w": ["", "DNA halving cytokinesis par hoti hai.", "$4C$ DNA wali cell diploid hi rehti hai.", "Centromeres $G_2$ mein double nahi hote."], "t": "Counting question mein hamesha pehle centromere gino, phir DNA molecules.", "sim": null}, {"id": 381, "tag": "Incorrect finder", "q": "Which of the following statements about colchicine is NOT correct?", "fig": null, "opt": ["It is obtained from Colchicum autumnale.", "It binds tubulin and prevents assembly of spindle microtubules.", "It blocks DNA synthesis in the $S$ phase and arrests cells before replication begins.", "It can induce polyploidy because chromatid separation is not followed by nuclear partitioning."], "ans": 2, "c": "Colchicine spindle (tubulin) target karta hai, $S$ phase ki DNA synthesis ko nahi. Baaki teeno sahi colchicine facts hain.", "m": "Spindle poison vs synthesis blocker.", "s": ["Source sahi.", "Mechanism sahi.", "$S$-block claim galat.", "Polyploidy outcome sahi."], "r": "", "w": ["Source plant sahi hai.", "Tubulin mechanism sahi hai.", "", "Doubling consequence sahi hai."], "t": "Hydroxyurea jaise drugs $S$ phase block karte hain.", "sim": null}, {"id": 382, "tag": "Correct finder", "q": "Select the correct statement about meiosis II:", "fig": null, "opt": ["It begins in a haploid cell and is an equational division in which sister chromatids separate.", "It reduces the chromosome number from diploid to haploid.", "It involves pairing of homologous chromosomes and formation of bivalents.", "It is preceded by a prolonged $S$ phase during which DNA is replicated again."], "ans": 0, "c": "Meiosis-II haploid cell mein mitosis jaisa equational division hai — centromere split, chromatids separate. Reduction, pairing aur dobara replication meiosis-I/interkinesis ke galat descriptions hain.", "m": "Haploid mitosis analogy.", "s": ["Starting cell haploid.", "Centromere splits.", "Daughters $n$.", "No pairing, no new $S$ phase."], "r": "", "w": ["", "Reduction meiosis-I mein ho chuki.", "Bivalents sirf meiosis-I mein.", "Interkinesis bina $S$ phase hota hai."], "t": "Meiosis-II products = 4 haploid, 1-chromatid gametes.", "sim": null}, {"id": 383, "tag": "Match the Columns", "q": "Match the inhibitor in Column I with its mechanism in Column II. Column I: (a) Colchicine (b) Vincristine (c) Cytochalasin B (d) Hydroxyurea. Column II: (i) Binds tubulin and prevents spindle assembly (ii) Vinca alkaloid that disrupts microtubule dynamics in cancer cells (iii) Disrupts actin microfilaments and blocks cleavage furrow formation (iv) Inhibits nucleotide synthesis and blocks DNA replication in the $S$ phase.", "fig": null, "opt": ["a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iv, d-iii", "a-i, b-iii, c-ii, d-iv", "a-iv, b-ii, c-i, d-iii"], "ans": 0, "c": "Tubulin drugs (colchicine, vincristine) spindle target; actin drug (cytochalasin) furrow target; hydroxyurea synthesis target.", "m": "Cytoskeleton vs DNA-synthesis classification.", "s": ["a $\\rightarrow$ i.", "b $\\rightarrow$ ii.", "c $\\rightarrow$ iii.", "d $\\rightarrow$ iv."], "r": "", "w": ["", "Vincristine actin drug nahi.", "Cytochalasin tubulin nahi todta.", "Hydroxyurea spindle poison nahi."], "t": "Drug + target + arrested stage teeno ek saath yaad karo.", "sim": null}, {"id": 384, "tag": "Match the Columns", "q": "Match the sub-stage of prophase I in Column I with its event in Column II. Column I: (a) Leptotene (b) Zygotene (c) Pachytene (d) Diakinesis. Column II: (i) Gradual compaction of chromosomes into thin threads (ii) Synapsis of homologs and assembly of the synaptonemal complex (iii) Recombination nodules and crossing over (iv) Completion of terminalisation and breakdown of the nuclear envelope.", "fig": null, "opt": ["a-ii, b-i, c-iii, d-iv", "a-i, b-ii, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-iii, b-ii, c-iv, d-i"], "ans": 1, "c": "L-Z-P-D-D order: compaction, synapsis, exchange, terminalisation/breakdown.", "m": "Sequence signature events.", "s": ["a $\\rightarrow$ i.", "b $\\rightarrow$ ii.", "c $\\rightarrow$ iii.", "d $\\rightarrow$ iv."], "r": "", "w": ["Leptotene pairing stage nahi.", "", "Pachytene mein SC assemble nahi, use hota hai.", "Diakinesis ka event compaction nahi."], "t": "NEET 2016/2024 ne ye exact pairing puchi.", "sim": null}, {"id": 385, "tag": "Match the Columns", "q": "Match the experimental condition in Column I with its direct consequence in Column II. Column I: (a) Colchicine treatment of a dividing cell (b) Cytochalasin B treatment (c) Nondisjunction during meiosis (d) Failure of the $G_1/S$ DNA-damage check. Column II: (i) Aneuploid gametes with $n+1$ or $n-1$ chromosomes (ii) Binucleate or multinucleate cell due to failed furrowing (iii) Replication of damaged DNA (iv) Chromosome doubling leading to polyploidy.", "fig": null, "opt": ["a-iv, b-ii, c-i, d-iii", "a-i, b-iv, c-iii, d-ii", "a-iv, b-i, c-ii, d-iii", "a-ii, b-iii, c-iv, d-i"], "ans": 0, "c": "Colchicine doubling, cytochalasin binucleate, nondisjunction aneuploid gametes function subLabel(s){
  // wrap digits directly following a letter or ) as subscript tspan
  const parts = [];
  const re = /([A-Za-z\)])(\d+)/g; let m, last = 0;
  while((m = re.exec(s))){
    if(m.index > last) parts.push(["t", s.slice(last, m.index)]);
    parts.push(["t", m[1]]);
    parts.push(["sub", m[2]]);
    last = m.index + m[0].length;
  }
  if(last < s.length) parts.push(["t", s.slice(last)]);
  let h = "";
  for(const p of parts){ h += p[0]==="sub" ? '<tspan baseline-shift="sub" font-size="70%">'+p[1]+'</tspan>' : p[1]; }
  return h;
}
function txt(x,y,s,size,anchor,color){
  return '<text x="'+x+'" y="'+y+'" font-size="'+(size||14)+'" fill="'+(color||"#dcdfe4")+'" text-anchor="'+(anchor||"middle")+'" font-family="sans-serif">'+subLabel(s)+"</text>";
}
const STROKE="#9aa3b2", ACCENT="#6cb2ff", GREEN="#4caf7d", RED="#e06c75", AMBER="#d8a657";
function svgChrom(x,y,rot,color){
  // replicated chromosome (two sister chromatids)
  return '<g transform="translate('+x+','+y+') rotate('+rot+')"><path d="M0,-26 C-9,-18 -9,-8 0,0 C9,-8 9,-18 0,-26 Z M0,0 C-9,8 -9,18 0,26 C9,18 9,8 0,0 Z" fill="'+(color||ACCENT)+'" opacity="0.85" stroke="'+STROKE+'" stroke-width="1.2"/><circle cx="0" cy="0" r="3.2" fill="#12141a" stroke="'+STROKE+'"/></g>';
}
function svgSingleChrom(x,y,rot,color){
  return '<g transform="translate('+x+','+y+') rotate('+rot+')"><path d="M0,-22 C-7,-14 -7,-6 0,0 C7,-6 7,-14 0,-22 Z M0,2 C-7,8 -7,16 0,22 C7,16 7,8 0,2 Z" fill="'+(color||GREEN)+'" opacity="0.85" stroke="'+STROKE+'" stroke-width="1.2"/></g>';
}

function renderFig(f){
  if(!f) return "";
  if(typeof f==="string") return '<div class="fig">'+f+"</div>";
  const fn=FIG[f.k]; if(!fn) return "";
  return '<div class="fig">'+fn(f)+"</div>";
}

/* ============ STATE ============ */
let state = load();
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const o=JSON.parse(raw); if(o && o.a) return {a:o.a||{}, cur:o.cur||1, submitted:!!o.submitted}; } }catch(e){}
  return {a:{}, cur:1, submitted:false};
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function curQ(){ return ALL[state.cur-1]; }
function stats(){
  let c=0,w=0,u=0;
  for(const q of ALL){ const sel=state.a[q.id]; if(sel===undefined) u++; else if(sel===q.ans) c++; else w++; }
  return {c,w,u,score:c*4-w};
}

/* ============ RENDER ============ */
function math(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false,strict:false}); }catch(e){}
  } else if(!window.__mathWait){
    window.__mathWait=true;
    window.addEventListener("load",()=>math(document.getElementById("card")));
    return;
  } else {
    // readable fallback if KaTeX CDN failed: rewrite TEXT NODES only,
    // preserving buttons and their event listeners (never touch innerHTML)

    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(tn => {
      if (tn.nodeValue.indexOf("$") === -1) return;
      const parts = tn.nodeValue.split(/(\$\$?[^$]+\$\$?)/g).filter(s => s !== "");

      const frag = document.createDocumentFragment();
      parts.forEach(p => {
        if (p.charAt(0) === "$") frag.appendChild(document.createTextNode(clean(p.replace(/^\$\$?|\$\$?$/g, ""))));

function render(){
  const q=curQ(), i=state.cur-1;
  const answered = state.a[q.id]!==undefined;
  const sel = state.a[q.id];
  let h='<div class="card">';
  h+='<div class="qmeta"><span>Question '+q.id+' / '+ALL.length+'</span><span>'+q.tag+'</span></div>';
  h+='<div class="qtext">'+q.q+'</div>';
  h+=renderFig(q.fig);
  h+='<div id="opts">';
  q.opt.forEach((o,idx)=>{
    let cls="opt";
    if(answered||state.submitted){
      cls+=" locked";
      if(idx===q.ans) cls+=" correct";
      else if(idx===sel) cls+=" wrong"; else cls+=" dim";
    }
    h+='<button class="'+cls+'" data-i="'+idx+'" '+(answered||state.submitted?"disabled":"")+'><span class="lab">'+LETTERS[idx]+'.</span><span>'+o+'</span></button>';
  });
  h+='</div>';
  if(answered){
    const ok=sel===q.ans;
    h+='<div class="feedback '+(ok?"ok":"no")+'">'+(ok?"Sahi jawab! Option "+LETTERS[q.ans]+" correct hai.":"Galat jawab. Aapki choice "+LETTERS[sel]+" thi; sahi jawab Option "+LETTERS[q.ans]+" hai.")+'</div>';
    h+=renderExp(q);
  } else if(state.submitted){
    h+='<div class="feedback no">Aapne ye question attempt nahi kiya tha. Sahi jawab Option '+LETTERS[q.ans]+' hai.</div>'+renderExp(q);
  }
  h+='</div>';
  document.getElementById("card").innerHTML=h;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.addEventListener("click",()=>choose(parseInt(b.dataset.i,10)));
  });
  const st=stats();
  document.getElementById("score").textContent=st.score;
  document.getElementById("maxscore").textContent=4*ALL.length;
  document.getElementById("ng").textContent=st.c;
  document.getElementById("nr").textContent=st.w;
  document.getElementById("nu").textContent=st.u;
  document.getElementById("bar").style.width=((ALL.length-st.u)/ALL.length*100)+"%";
  document.getElementById("prevBtn").disabled=state.cur===1;
  document.getElementById("nextBtn").disabled=state.cur===ALL.length;
  math(document.getElementById("card"));
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderExp(q){
  let h='<div class="exp">';
  h+='<h4>1. Concept (zero se)</h4><p>'+q.c+'</p>';
  if(q.m){ h+='<h4>2. Method</h4><p>'+q.m+'</p>'; }
  if(q.s && q.s.length){ h+='<h4>3. Step-by-step</h4><ol>'; q.s.forEach(x=>h+='<li>'+x+'</li>'); h+='</ol>'; }
  h+='<h4>4. Final answer</h4><p>Option <b>'+LETTERS[q.ans]+'</b> — '+q.opt[q.ans]+'</p>';
  if(q.w && q.w.length){
    h+='<h4>5. Galat options kyun galat</h4><div class="why">';
    q.w.forEach((x,idx)=>{ if(idx===q.ans) return; h+='<div><b style="color:#6cb2ff">'+LETTERS[idx]+':</b> '+x+'</div>'; });
    h+='</div>';
  }
  if(q.t){ h+='<div class="tip"><b>Tip:</b> '+q.t+'</div>'; }
  h+='</div>';
  return h;
}
function choose(idx){
  const q=curQ();
  if(state.a[q.id]!==undefined || state.submitted) return;
  state.a[q.id]=idx; save(); render();
}

/* ============ NAV ============ */
document.getElementById("prevBtn").onclick=()=>{ if(state.cur>1){state.cur--;save();render();} };
document.getElementById("nextBtn").onclick=()=>{ if(state.cur<ALL.length){state.cur++;save();render();} };
document.getElementById("skipBtn").onclick=()=>{ if(state.cur<ALL.length){state.cur++;save();render();} };

/* ============ GRID ============ */
let filter="all";
function buildGrid(){
  const g=document.getElementById("grid"); g.innerHTML="";
  ALL.forEach(q=>{
    const sel=state.a[q.id];
    const isAns=sel!==undefined;
    if(filter==="ans"&&!isAns) return; if(filter==="un"&&isAns) return;
    const b=document.createElement("button");
    b.className="gcell"+(isAns?(sel===q.ans?" g":" r"):"")+(q.id===state.cur?" cur":"");
    b.textContent=q.id;
    b.onclick=()=>{ state.cur=q.id; save(); closeModal("gridModal"); render(); };
    g.appendChild(b);
  });
}
document.querySelectorAll(".tabs button[data-f]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button[data-f]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); filter=b.dataset.f; buildGrid();
});
document.getElementById("gridBtn").onclick=()=>{ buildGrid(); document.getElementById("gridModal").classList.add("open"); };
document.getElementById("closeGrid").onclick=()=>closeModal("gridModal");
document.getElementById("goBtn").onclick=()=>{
  const v=parseInt(document.getElementById("goInput").value,10);
  if(v>=1&&v<=ALL.length){ state.cur=v; save(); closeModal("gridModal"); render(); }
};
function closeModal(id){ document.getElementById(id).classList.remove("open"); }

/* ============ SUBMIT / SCORE ============ */
document.getElementById("submitBtn").onclick=()=>{
  const st=stats();
  if(!confirm("Test submit karna sure ho? Attempted: "+(ALL.length-st.u)+" / "+ALL.length+". Submit ke baad answers change nahi honge.")) return;
  state.submitted=true; save();
  document.getElementById("finalScore").textContent=st.score+" / "+(4*ALL.length);
  document.getElementById("fc").textContent=st.c;
  document.getElementById("fw").textContent=st.w;
  document.getElementById("fu").textContent=st.u;
  const att=st.c+st.w;
  document.getElementById("fa").textContent=(att? (st.c/att*100).toFixed(1):"0.0")+" %";
  document.getElementById("scoreModal").classList.add("open");
};
document.getElementById("reviewBtn").onclick=()=>{ closeModal("scoreModal"); render(); };
document.getElementById("restartBtn").onclick=()=>{
  if(!confirm("Poora test restart karna hai? Saved progress delete ho jayega.")) return;
  localStorage.removeItem(STORE_KEY); state={a:{},cur:1,submitted:false}; render(); closeModal("scoreModal");
};
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{ if(e.target===m) m.classList.remove("open"); }));

render();
</script>
