ahi hain.", "m": "Mitosis = stability; meiosis = conservation + variation.", "s": ["Large cell divide hoke ratio restore.", "Identical daughters.", "Meiosis-fertilisation cycle.", "Recombination + assortment variation."], "r": "", "w": ["Sab sahi hain.", "Koi galat nahi.", "Saare NCERT significance points hain.", ""], "t": "Variation ke bina evolution ke liye raw material nahi milta.", "sim": null}, {"id": 222, "tag": "Statement-based", "q": "Consider the following statements about the behaviour of cells in $G_0$. Statement I: Mature neurons and skeletal muscle cells are terminally differentiated and remain permanently in $G_0$. Statement II: Hepatocytes normally reside in $G_0$ but can re-enter $G_1$ to regenerate the liver after injury. Statement III: Lymphocytes in $G_0$ can be driven back into the cell cycle by antigenic stimulation. Statement IV: A cell enters $G_0$ from the $G_2$ phase immediately after completing DNA replication. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Permanent vs facultative $G_0$ examples sahi; IV galat: $G_0$ entry $G_1$ se hoti hai, $G_2$ se nahi (replicated cell $G_0$ mein nahi jata).", "m": "Entry point $G_1$ hai — yahi trap hai.", "s": ["Neurons/muscle permanent.", "Liver reversible.", "Lymphocytes antigen-triggered.", "$G_2$ se $G_0$ entry hoti hi nahi."], "r": "", "w": ["", "IV galat hai.", "IV include karta hai.", "I bhi sahi statement missing hai."], "t": "$G_0$ cell ka DNA $2C$ hota hai, $4C$ nahi.", "sim": null}, {"id": 223, "tag": "Incorrect finder", "q": "Which of the following statements is NOT correct?", "fig": null, "opt": ["DNA content doubles during the $S$ phase but the chromosome number does not.", "A $G_2$ cell of a diploid organism contains twice the DNA of a $G_1$ cell.", "The ploidy of the cell changes from $2n$ to $4n$ immediately after completion of the $S$ phase.", "Each chromosome in $G_2$ is composed of two identical sister chromatids."], "ans": 2, "c": "$S$ phase ploidy nahi badalti — chromatids ek centromere se jude rehte hain, cell $2n$ hi rehta hai. $4n$ tab hoga jab spindle block se saare chromatids ek nucleus mein reh jayein.", "m": "$4C$ DNA $\\neq$ $4n$ ploidy.", "s": ["DNA double — sahi.", "$G_2$ $= 2 \\times G_1$ DNA — sahi.", "Ploidy change claim — galat.", "2 chromatid structure — sahi."], "r": "", "w": ["Centromere rule se sahi hai.", "C-value fact sahi hai.", "", "Ye structural fact sahi hai."], "t": "Ploidy = functional chromosome set count, DNA amount nahi.", "sim": null}, {"id": 224, "tag": "Correct finder", "q": "Select the correct statement about the bivalent and the tetrad:", "fig": null, "opt": ["A bivalent consists of two homologous chromosomes, and a tetrad refers to its four chromatids seen at pachytene.", "A bivalent has four chromosomes while a tetrad has two chromatids.", "The bivalent is formed during diakinesis and the tetrad during leptotene.", "Both the bivalent and the tetrad are structures of the spindle apparatus."], "ans": 0, "c": "Bivalent = paired homologs (2 chromosomes); pachytene mein unke 4 chromatids clearly visible = tetrad. Same unit ke do counting views.", "m": "Chromosome count vs chromatid count terminology.", "s": ["2 homologs pair.", "Har ek 2 chromatid.", "Total 4 = tetrad.", "Visible pachytene mein."], "r": "", "w": ["", "Counts ulte hain.", "Stages galat (pairing zygotene, visibility pachytene).", "Ye chromatin structures hain, spindle ki nahi."], "t": "Bivalent count = $n$; total chromatids at pachytene = $4n$.", "sim": null}, {"id": 225, "tag": "Incorrect finder", "q": "Which of the following statements about the diplotene stage is NOT correct?", "fig": null, "opt": ["It begins with the dissolution of the synaptonemal complex.", "Homologous chromosomes begin to separate but remain joined at the chiasmata.", "Recombination nodules first appear and crossing over begins in this stage.", "In human oocytes, arrest in this stage can persist for several decades."], "ans": 2, "c": "Recombination nodules aur crossing over pachytene ke events hain; diplotene mein sirf unke marks (chiasmata) visible bante hain. Baaki teeno diplotene facts sahi.", "m": "Pachytene event ko diplotene mein dikhana = galat.", "s": ["SC dissolution — sahi.", "Chiasma-held separation — sahi.", "Exchange pachytene ka — C galat.", "Oocyte dictyate arrest — sahi."], "r": "", "w": ["SC dissolve hona sahi event hai.", "Chiasmata holding sahi fact hai.", "", "Decades-long arrest documented hai."], "t": "Crossing over pachytene, visibility diplotene — timing yaad rakho.", "sim": null}, {"id": 226, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct regarding the Anaphase Promoting Complex:", "fig": null, "opt": ["It is a ubiquitin-ligase type protein-degradation machinery.", "It helps inactivate MPF by promoting the destruction of mitotic cyclin.", "A defective APC can block the transition from metaphase to anaphase.", "It directly polymerises tubulin to build the spindle fibres."], "ans": 3, "c": "APC ek ubiquitin-ligase hai jo securin aur cyclin B degrade karwata hai — spindle banane wala nahi. Spindle tubulin polymerization prophase mein alag se hota hai.", "m": "APC = degradation machine, builder nahi.", "s": ["Ubiquitination function sahi.", "Cyclin B destruction MPF off karta hai.", "Defective APC anaphase rok deta hai.", "Tubulin polymerisation APC ka kaam nahi."], "r": "", "w": ["Ubiquitin-ligase identity sahi hai.", "MPF inactivation sahi role hai.", "Metaphase arrest consequence sahi hai.", ""], "t": "APC ke defective hone par chromatids stuck reh jate hain — classic NEET 2017 frame.", "sim": null}, {"id": 227, "tag": "Incorrect finder", "q": "Which of the following statements about cytokinesis is NOT correct?", "fig": null, "opt": ["In animal cells, a contractile ring of actin and myosin generates the cleavage furrow.", "In plant cells, the cell plate starts at the centre and grows outward to meet the parent wall.", "In plant cells, the furrow deepens centripetally to pinch the cell into two.", "Failure of cytokinesis after karyokinesis can produce a binucleate or multinucleate cell."], "ans": 2, "c": "Plant cell wall rigid hone se furrow pinch kar hi nahi sakta; wahan cell plate banti hai. Furrow centripetal mechanism animal cells ka hai. Baaki statements sahi hain.", "m": "Plant = plate, animal = furrow — mixing wali line galat.", "s": ["Actin-myosin ring animal feature sahi.", "Centrifugal plate growth sahi.", "Plant furrow claim galat.", "Syncytium consequence sahi."], "r": "", "w": ["Ring mechanism sahi animal fact hai.", "Plate direction sahi plant fact hai.", "", "Multinucleate result sahi hai."], "t": "Cytochalasin B actin todke animal furrow ko specifically block karta hai.", "sim": null}, {"id": 228, "tag": "Correct finder", "q": "Select the statement that is NOT correct about meiosis II:", "fig": null, "opt": ["It takes place in haploid cells and resembles a normal mitotic division.", "The centromere splits and sister chromatids separate in anaphase II.", "DNA is replicated once more during the prolonged interkinesis.", "Each final daughter cell receives $n$ chromosomes, each with one chromatid."], "ans": 2, "c": "Interkinesis mein DNA replication hoti hi nahi — yahi to rule hai (ek replication, do divisions). Baaki teeno meiosis-II ke sahi features hain.", "m": "No $S$ phase between the two meiotic divisions.", "s": ["Haploid cell mein equational division — sahi.", "Centromere split anaphase-II — sahi.", "Replication claim — galat.", "Final $n$, 1-chromatid — sahi."], "r": "", "w": ["Haploid mitosis analogy sahi hai.", "Chromatid separation sahi event hai.", "", "Final gamete composition sahi hai."], "t": "Agar interkinesis mein replication hoti to $C$-value chakra hi fail ho jata.", "sim": null}, {"id": 229, "tag": "Incorrect finder", "q": "Which of the following statements about chiasmata is NOT correct?", "fig": null, "opt": ["They become visible in diplotene although crossing over occurred in pachytene.", "They physically hold the homologous chromosomes together until anaphase I.", "Their terminalisation is completed in diakinesis.", "They are formed by the attachment of astral rays to the centrioles."], "ans": 3, "c": "Chiasmata homologs ke beech exchange-junction hain; astral rays/centrioles spindle pole machinery hai — dono ka koi sambandh nahi. Baaki teeno sahi facts hain.", "m": "Chiasma = exchange mark, spindle structure nahi.", "s": ["Diplotene visibility sahi.", "Holding role till anaphase-I sahi.", "Diakinesis terminalisation sahi.", "Astral ray link galat."], "r": "", "w": ["Timing fact sahi hai.", "Cohesion role sahi hai.", "Terminalisation stage sahi hai.", ""], "t": "Chiasmata ki wajah se bivalents metaphase-I plate par stable rehte hain.", "sim": null}, {"id": 230, "tag": "Correct finder", "q": "Select the statement that is NOT correct regarding polyploidy induced by spindle inhibitors:", "fig": null, "opt": ["Colchicine-treated cells may double their chromosome number because chromatid separation is not followed by nuclear partitioning.", "Induced polyploidy has been used in breeding crop plants such as wheat and some fruits.", "A colchicine-treated diploid cell that completes one blocked cycle can become tetraploid.", "Colchicine induces polyploidy by preventing DNA replication in the $S$ phase."], "ans": 3, "c": "Colchicine spindle (tubulin) ko target karta hai, $S$ phase ki DNA replication ko nahi. Replication normal hoti hai; problem partition mein hai. Baaki statements sahi applications hain.", "m": "Spindle block vs replication block — farak samjho.", "s": ["Doubling mechanism sahi.", "Crop breeding use sahi.", "Diploid $\\rightarrow$ tetraploid sahi.", "$S$ phase block claim galat."], "r": "", "w": ["Doubling ka mechanism correct hai.", "Breeding application documented hai.", "Tetraploid outcome correct hai.", ""], "t": "Hydroxyurea jaise drugs DNA synthesis block karte hain, colchicine nahi.", "sim": null}, {"id": 231, "tag": "Incorrect finder", "q": "Which of the following statements about the occurrence of mitosis is NOT correct?", "fig": null, "opt": ["In plants, mitosis occurs in both haploid and diploid cells.", "In animals, mitosis is generally restricted to diploid somatic cells, with exceptions such as haploid male drones of honey bees.", "The drone honey bee produces its sperms by meiosis in its testes.", "Mitosis is the basis of growth, repair and asexual reproduction."], "ans": 2, "c": "Drone haploid ($n$) hai; uske sperm mitosis se bante hain, meiosis se nahi (meiosis ka matlab reduction, already haploid mein possible nahi). Baaki statements sahi hain.", "m": "Haploid organism meiosis nahi kar sakta — mitosis se gamete.", "s": ["Plant haploid/diploid mitosis sahi.", "Animal restriction + exception sahi.", "Drone sperm mechanism galat.", "Mitosis roles sahi."], "r": "", "w": ["Plant fact sahi hai.", "Exception sahi hai.", "", "Growth/repair roles sahi hain."], "t": "Drone virgin queen ke unfertilised egg se banta hai — haploid development.", "sim": null}, {"id": 232, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct about the $G_2$ phase:", "fig": null, "opt": ["Proteins needed for mitosis, including tubulin for spindle formation, are synthesised.", "The cell continues to grow and checks the replicated DNA for errors.", "The DNA content of a diploid cell is $4C$ in this phase.", "The chromosomes begin to separate towards opposite poles in this phase."], "ans": 3, "c": "Chromosome poleward separation anaphase ka event hai; $G_2$ to interphase ka phase hai jahan chromosomes condense tak nahi hue. Baaki teeno $G_2$ ke sahi features hain.", "m": "Interphase vs $M$ phase events alag karo.", "s": ["Tubulin synthesis sahi.", "Growth + DNA check sahi.", "$4C$ content sahi.", "Poleward movement galat — anaphase."], "r": "", "w": ["Protein synthesis sahi fact hai.", "Checkpoint role sahi hai.", "C-value sahi hai.", ""], "t": "$G_2/M$ checkpoint isi phase ke end par mitosis entry decide karta hai.", "sim": null}, {"id": 233, "tag": "Match the Columns", "q": "Match the event in Column I with the stage of the cell cycle in Column II. Column I: (a) Restriction point of commitment (b) Peak activity of MPF (c) APC-mediated protein degradation (d) Assembly of the synaptonemal complex. Column II: (i) Metaphase to anaphase transition (ii) $G_1$ to $S$ transition (iii) Zygotene of prophase I (iv) $G_2$ to $M$ transition.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iv, d-iii", "a-iv, b-iii, c-i, d-ii"], "ans": 0, "c": "Restriction point $G_1/S$; MPF peak $G_2/M$; APC action metaphase-anaphase; SC assembly zygotene.", "m": "Har regulatory event ka transition stage yaad karo.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Restriction point $G_1/S$ hai, M-phase nahi.", "MPF $G_2/M$ par peak hota hai.", "SC mitosis mein nahi banta."], "t": "MPF activation aur APC degradation cycle ke do opposite poles hain.", "sim": null}, {"id": 234, "tag": "Match the Columns", "q": "Match the condition in Column I with its consequence in Column II. Column I: (a) Colchicine treatment (b) Karyokinesis without cytokinesis (c) Nondisjunction (d) Failure of the $G_1/S$ DNA-damage check. Column II: (i) Multinucleate syncytium (ii) Aneuploid gametes ($n+1$ or $n-1$) (iii) Replication of damaged DNA (iv) Chromosome doubling (polyploidy).", "fig": null, "opt": ["a-iv, b-i, c-ii, d-iii", "a-i, b-iv, c-iii, d-ii", "a-iv, b-ii, c-i, d-iii", "a-ii, b-i, c-iv, d-iii"], "ans": 0, "c": "Colchicine $\\rightarrow$ polyploidy; no cytokinesis $\\rightarrow$ syncytium; nondisjunction $\\rightarrow$ aneuploid gametes; checkpoint failure $\\rightarrow$ damaged DNA replication.", "m": "Perturbation $\\rightarrow$ outcome mapping.", "s": ["a $\\rightarrow$ iv.", "b $\\rightarrow$ i.", "c $\\rightarrow$ ii.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Colchicine syncytium nahi, doubling deta hai.", "Nondisjunction syncytium nahi, aneuploidy deti hai.", "Checkpoint failure polyploidy nahi, mutation propagation deta hai."], "t": "Har perturbation ka 'sabse direct consequence' choose karo.", "sim": null}, {"id": 235, "tag": "Match the Columns", "q": "Match the sub-stage of prophase I in Column I with the correct combination of features in Column II. Column I: (a) Leptotene (b) Zygotene (c) Diplotene (d) Diakinesis. Column II: (i) Homologs separate except at chiasmata (ii) Thread-like chromosomes begin to compact (iii) Full condensation, chiasmata terminalised, envelope breaks (iv) Synapsis and synaptonemal complex assembly.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-iv, b-ii, c-iii, d-i", "a-ii, b-i, c-iv, d-iii", "a-iii, b-iv, c-i, d-ii"], "ans": 0, "c": "Leptotene compaction; zygotene synapsis; diplotene chiasma-held separation; diakinesis terminalisation + envelope break.", "m": "L-Z-P-D-D signature events.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Leptotene mein pairing nahi hoti.", "Diakinesis ka event i nahi, iii hai.", "Sequence mismatch galat."], "t": "Pachytene (crossing over) in chaaron ke beech ka missing link hai.", "sim": null}, {"id": 236, "tag": "Match the Columns", "q": "Match the structure in Column I with its composition or role in Column II. Column I: (a) Kinetochore (b) Recombination nodule (c) Contractile ring (d) Cell plate. Column II: (i) Actin microfilaments of animal cytokinesis (ii) Protein disc on the centromere for spindle attachment (iii) Golgi-vesicle-derived precursor of the plant wall (iv) Site of recombinase activity and crossing over.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iv, d-iii", "a-iv, b-iii, c-i, d-ii"], "ans": 0, "c": "Kinetochore attachment disc; nodule recombinase site; actin ring furrow; vesicle plate wall precursor.", "m": "Structure $\\rightarrow$ material/function.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Kinetochore actin structure nahi.", "Nodule plant wall se related nahi.", "Ring vesicle-derived nahi."], "t": "Kinetochore protein hai, centromere DNA region — classic distinction.", "sim": null}, {"id": 237, "tag": "Match the Columns", "q": "Match the cell type or tissue in Column I with its cell-cycle behaviour in Column II. Column I: (a) Mature neuron (b) Liver hepatocyte (c) Primary oocyte (d) Onion root tip meristem cell. Column II: (i) Continuously cycling mitotic cell (ii) Permanently arrested in $G_0$ (iii) Arrested for years in diplotene of prophase I (iv) Facultatively quiescent, re-enters $G_1$ after injury.", "fig": null, "opt": ["a-ii, b-iv, c-iii, d-i", "a-i, b-ii, c-iv, d-iii", "a-iv, b-iii, c-i, d-ii", "a-ii, b-i, c-iii, d-iv"], "ans": 0, "c": "Neuron permanent $G_0$; hepatocyte reversible $G_0$; oocyte diplotene arrest; meristem continuous mitosis.", "m": "Cell type $\\rightarrow$ division behaviour.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ iii.", "d $\\rightarrow$ i."], "r": "", "w": ["", "Neuron divide nahi karta.", "Oocyte meristem jaisi continuous nahi.", "Hepatocyte permanent arrest mein nahi."], "t": "Root tip onion = mitosis experiment ka standard material.", "sim": null}, {"id": 238, "tag": "Match the Columns", "q": "Match the division stage in Column I with the chromosome and DNA condition in Column II (parent cell $2n$, $G_1$ DNA $= 2C$). Column I: (a) Mitotic metaphase (b) Mitotic anaphase (c) Pachytene of meiosis I (d) A cell after meiosis II. Column II: (i) $2n$ chromosomes, each with one chromatid, $2C$ DNA temporarily at each pole (ii) $2n$ chromosomes, each with two chromatids, $4C$ DNA (iii) $n$ chromosomes, each with one chromatid, $C$ DNA (iv) $n$ bivalents with four chromatids each, $4C$ DNA.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iii, c-iv, d-i", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "c": "Metaphase $2n$/2-chromatid/$4C$; anaphase split ke baad single-chromatid chromosomes poles par; pachytene $n$ bivalents/$4C$; final gamete $n$/1-chromatid/$C$.", "m": "Stage-wise centromere aur C-value gino.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Metaphase tak centromere split nahi hota.", "Anaphase-II jaisi count metaphase par nahi.", "Gamete $4C$ kabhi nahi."], "t": "Anaphase ka count poora cell gino to temporary double dikhta hai; per-pole count normal hota hai.", "sim": null}, {"id": 239, "tag": "Assertion-Reason", "q": "Assertion (A): A cell treated with colchicine may end up with double the normal number of chromosomes. Reason (R): Colchicine blocks spindle formation, so separated chromatids cannot be partitioned into two daughter nuclei and remain within a single nucleus.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Spindle na bane to chromatids to alag hote hain par do nuclei nahi bant; ek hi nucleus doubled count ke saath banta hai. R exact mechanism hai.", "m": "Blocked partition = doubled nucleus.", "s": ["Tubulin targeted.", "No spindle.", "Chromatids retained.", "Ploidy double."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Ye induced polyploidy ka standard principle hai.", "sim": null}, {"id": 240, "tag": "Assertion-Reason", "q": "Assertion (A): The chromosome number of a cell does not increase during the $S$ phase even though its DNA content doubles. Reason (R): The two identical DNA molecules formed by replication remain attached as sister chromatids at a single centromere, so the number of centromeres, and hence chromosomes, stays unchanged.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Chromosome definition centromere count hai; replication chromatids badalti hai, centromere nahi. R, A ka precise reason hai.", "m": "Centromere rule = chromosome count rule.", "s": ["DNA double.", "Centromere same.", "Chromatids joined.", "Count unchanged."], "r": "", "w": ["", "R direct explanation hai.", "R sach hai.", "A sach hai."], "t": "Centromere split (anaphase) par hi count badalta hai.", "sim": null}, {"id": 241, "tag": "Assertion-Reason", "q": "Assertion (A): Meiosis II can be described as a mitotic division occurring in a haploid cell. Reason (R): In meiosis II, individual chromosomes align at the equator and their sister chromatids separate, just as in mitosis, but the starting cell is haploid.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Mechanism mitosis jaisa (alignment + chromatid separation), starting ploidy haploid — isliye 'haploid mitosis' analogy sahi. R explain karta hai.", "m": "Same machinery, different ploidy.", "s": ["Haploid cell.", "Equator alignment.", "Centromere split.", "Equational outcome."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Farq sirf itna ki is cell mein homologs nahi bachte (meiosis-I nikal chuka).", "sim": null}, {"id": 242, "tag": "Assertion-Reason", "q": "Assertion (A): Nondisjunction during meiosis I affects all four resulting gametes, whereas nondisjunction during meiosis II affects only two of them. Reason (R): An error in meiosis I sends a wrong chromosome set into both secondary cells, while an error in meiosis II is confined to one of the two secondary cells.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Error ka stage decide karta hai kitne gametes abnormal: I-error dono secondary cells ko corrupt, II-error sirf ek ko. R, A ki logic hai.", "m": "Tree socho: pehla split sab branches ko affect karta hai.", "s": ["I-error: chaaro $n\\pm1$.", "II-error: do abnormal, do normal.", "Reason: error ka location.", "R explains A."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Risk predict karne ke liye error-stage pehla question hona chahiye.", "sim": null}, {"id": 243, "tag": "Assertion-Reason", "q": "Assertion (A): In higher plants, cytokinesis cannot occur through a cleavage furrow. Reason (R): The rigid cell wall resists inward pinching, so plant cells instead build a new wall outward from a cell plate at the centre.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Wall ka mechanical constraint furrow ko impossible banata hai; plate alternative hai. R structural reason deta hai.", "m": "Structure (wall) $\\rightarrow$ mechanism (plate).", "s": ["Rigid wall.", "No inward pinch.", "Vesicle plate banti hai.", "Centrifugal growth."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Phragmoplast is plate construction ka scaffold hai.", "sim": null}, {"id": 244, "tag": "Assertion-Reason", "q": "Assertion (A): The pachytene stage, rather than the zygotene stage, is associated with genetic recombination. Reason (R): Although pairing begins in zygotene, the recombination nodules and recombinase-mediated exchange between non-sister chromatids appear only in pachytene.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Pairing (zygotene) aur exchange (pachytene) alag events hain; nodules pachytene marker hain. R, A ka reason hai.", "m": "Pairing $\\neq$ exchange — stages alag.", "s": ["Zygotene: synapsis.", "Pachytene: nodules + recombinase.", "Exchange complete.", "Chiasmata baad mein visible."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Chiasmata diplotene mein dikhte hain, exchange pachytene mein hota hai.", "sim": null}, {"id": 245, "tag": "Diagram based", "q": "A word-diagram shows a dividing cell with: an intact nuclear envelope with a visible nucleolus; chromatin partly condensed into thin threads; two pairs of centrioles formed and beginning to move apart; and no bivalents. If the DNA content is $4C$, the cell depicted is in:", "fig": {"k": "stage", "phase": "prophase", "plant": false, "note2": "Schematic: early prophase — envelope intact, centrioles moving, 4C DNA"}, "opt": ["$G_1$ phase", "$S$ phase", "Early prophase of mitosis", "Pachytene of meiosis"], "ans": 2, "c": "$4C$ DNA matlab replication ho chuki; envelope intact + condensation shuru + centrioles apart = early prophase. Bivalents na hone se meiosis reject; $G_1/S$ mein distinct condensed threads nahi dikhte.", "m": "DNA content + morphology dono combine karo.", "s": ["$4C$ $\\Rightarrow$ post-$S$.", "Envelope intact $\\Rightarrow$ early stage.", "Condensing threads + centrioles $\\Rightarrow$ prophase.", "No bivalents $\\Rightarrow$ mitosis."], "r": "", "w": ["$G_1$ DNA $2C$ hota hai.", "$S$ mein chromosomes visible nahi hote.", "", "Pachytene mein bivalents maujood hote."], "t": "$4C$ + intact envelope = early mitotic prophase ki reliable pehchan.", "sim": null}, {"id": 246, "tag": "Data-table", "q": "A data table records four cells of the same diploid organism ($2n = 6$). Cell P: 6 chromosomes, 12 chromatids, $4C$ DNA, no bivalents. Cell Q: 12 chromosomes, 12 chromatids, $4C$ DNA. Cell R (per cell): 3 chromosomes, 6 chromatids, $2C$ DNA. Cell S (per cell): 3 chromosomes, 3 chromatids, $C$ DNA. The stages represented by P, Q, R and S respectively are:", "fig": {"k": "table", "head": ["Cell", "Chr.", "Chromatids", "DNA"], "rows": [["P", "6", "12", "4C"], ["Q", "12", "12", "4C"], ["R", "3", "6", "2C"], ["S", "3", "3", "C"]]}, "opt": ["Mitotic $G_2$, mitotic anaphase, cell after meiosis I, cell after meiosis II", "Mitotic $G_1$, mitotic anaphase, cell after meiosis II, cell after meiosis I", "Mitotic $G_2$, cell after meiosis I, mitotic anaphase, cell after meiosis II", "Cell after meiosis II, mitotic $G_2$, mitotic $G_1$, mitotic anaphase"], "ans": 0, "c": "P = replicated unreduced ($G_2$); Q = split centromeres (anaphase, temporary 12); R = haploid 2-chromatid (post-I); S = haploid 1-chromatid (post-II).", "m": "Centromere count + chromatid count + C-value — triple match.", "s": ["P: $2n$, 2-chromatid $\\Rightarrow G_2$.", "Q: doubled centromeres $\\Rightarrow$ anaphase.", "R: $n$, 2-chromatid $\\Rightarrow$ post-I.", "S: $n$, 1-chromatid $\\Rightarrow$ post-II."], "r": "", "w": ["", "$G_1$ 12 chromatids nahi rakhta.", "Post-II mein 6 chromatids nahi ho sakte.", "Anaphase cell haploid nahi hota."], "t": "Q ka $4C$ tab tak hai jab tak cytokinesis DNA do cells mein nahi baant-deta.", "sim": null}, {"id": 247, "tag": "Graph based", "q": "A graph plots the number of chromosomes (solid line) and the amount of DNA in $C$ units (dashed line) against the stages of mitosis. Both start at $2n$ and $2C$ in $G_1$; the dashed line rises to $4C$ in $S$ and stays there through metaphase, while the solid line stays at $2n$; at anaphase the solid line jumps to $4n$; at the end of telophase/cytokinesis both return to $2n$ and $2C$ in each daughter cell. According to this graph, the anaphase jump in chromosome number from $2n$ to $4n$ is caused by:", "fig": {"k": "line", "xl": ["G1", "S", "G2", "Meta", "Ana", "Telo"], "yl": ["4n/4C", "2n/2C"], "ymin": 0, "ymax": 1, "yaxis": "Count", "series": [{"name": "Chromosomes", "color": "#4caf7d", "pts": [0.5, 0.5, 0.5, 0.5, 1, 0.5]}, {"name": "DNA", "color": "#6cb2ff", "pts": [0.5, 1, 1, 1, 1, 0.5]}], "cap": "Schematic: chromosome number jumps only at anaphase"}, "opt": ["Replication of DNA during anaphase", "Splitting of centromeres, with each chromatid becoming an independent chromosome", "Pairing of homologous chromosomes", "Formation of the cell plate"], "ans": 1, "c": "Anaphase mein har centromere phat-ta hai; har chromatid ab independent chromosome — count ek-dam double. DNA amount wahi rehta hai kyunki naya synthesis nahi hua.", "m": "Graph jump = centromere splitting event.", "s": ["$S$ phase sirf DNA badalta hai.", "Anaphase: centromere split.", "Chromatids = daughter chromosomes.", "Cell plate baad ka event hai."], "r": "", "w": ["Replication $S$ phase mein hoti hai.", "", "Pairing mitosis mein hota hi nahi.", "Cell plate count nahi badalti, bat-ti hai."], "t": "Graph mein DNA aur chromosome ki lines ka behaviour alag hota hai — yahi core concept hai.", "sim": null}, {"id": 248, "tag": "Graph/Data", "q": "A bar chart shows the duration of cell cycle phases in a cultured mammalian cell: $G_1$ about 11 hours, $S$ about 8 hours, $G_2$ about 4 hours, and $M$ about 1 hour. If a drug that blocks DNA synthesis is added to an asynchronous culture, after a few hours most of the cells will be found accumulated in or near the:", "fig": {"k": "bar", "ymax": 11, "yaxis": "Hours", "groups": [{"label": "G1", "bars": [{"v": 11, "c": "#6cb2ff"}]}, {"label": "S", "bars": [{"v": 8, "c": "#4caf7d"}]}, {"label": "G2", "bars": [{"v": 4, "c": "#d8a657"}]}, {"label": "M", "bars": [{"v": 1, "c": "#e06c75"}]}], "legend": [{"n": "Phase duration", "c": "#6cb2ff"}], "cap": "Schematic phase-duration chart"}, "opt": ["$M$ phase", "$G_0$ phase", "$S$ phase and the $G_1/S$ boundary", "Telophase"], "ans": 2, "c": "DNA synthesis blocker cells ko $S$ phase mein ghuste hi rok deta hai; jo $G_1$ mein hain woh $G_1/S$ boundary par jam ho jati hain. Mitosis/telophase/$G_0$ is block se directly affect nahi.", "m": "Drug ka target ($S$ phase) = accumulation site.", "s": ["Blocker replication machinery rokta hai.", "$S$ cells wahin ruk jati hain.", "$G_1$ cells boundary tak pahunch ke ruki.", "Baaki phases ki cells khatam hoke wahin jamengi."], "r": "", "w": ["$M$ phase spindle blockers se affect hota hai.", "$G_0$ ka drug se lena-dena nahi.", "", "Telophase bhi $M$ phase ka hissa hai."], "t": "Colchicine metaphase par jamata hai, DNA-synthesis blocker $S$ par — dono mat milao.", "sim": null}, {"id": 249, "tag": "Diagram based", "q": "A word-diagram of a cell in meiosis shows: the nuclear envelope has disappeared; bivalents are seen with homologous chromosomes still paired; chiasmata are visible but have moved close to the chromosome ends; the chromosomes are thick and fully condensed; and spindle fibres are attaching to the kinetochores. The sub-stage depicted is:", "fig": {"k": "bivalent"}, "opt": ["Leptotene", "Zygotene", "Diplotene", "Diakinesis"], "ans": 3, "c": "Terminalised chiasmata (ends par), full condensation, envelope gone = diakinesis — prophase-I ka aakhri sub-stage.", "m": "'Chiasmata near ends + envelope gone' diakinesis signature.", "s": ["Leptotene: thin threads.", "Zygotene: pairing start.", "Diplotene: chiasmata middle mein bhi.", "Diakinesis: terminalised, condensed, no envelope."], "r": "", "w": ["Leptotene mein bivalents tak nahi bante.", "Zygotene mein chiasmata nahi dikhte.", "Diplotene mein terminalisation adhoori hoti hai.", ""], "t": "Diakinesis ke turant baad metaphase-I aata hai.", "sim": null}, {"id": 250, "tag": "Data based", "q": "An experiment tracks a single diploid germ cell ($2n = 4$) through meiosis. Observation 1: two cells are formed, each containing 2 chromosomes, and every chromosome has two chromatids. Observation 2: later, four cells are formed, each with 2 chromosomes with one chromatid each. Observation 3: no DNA replication is seen between the two division cycles. Observation 4: the four final cells differ genetically from one another. Which combination of observations correctly reflects normal meiosis?", "fig": {"k": "table", "head": ["Obs.", "Content"], "rows": [["1", "2 cells, n=2, two chromatids each"], ["2", "4 cells, n=2, one chromatid each"], ["3", "No replication between divisions"], ["4", "Genetically different products"]]}, "opt": ["Observations 1 and 2 only", "Observations 2 and 3 only", "Observations 1, 2 and 3 only", "Observations 1, 2, 3 and 4"], "ans": 3, "c": "Chaaron observations normal meiosis ki hain: reductional I, equational II, no interkinesis replication, aur crossing over/independent assortment se genetic difference.", "m": "Meiosis ke defining rules chaaro ke through verify karo.", "s": ["Post-I: $n$, 2-chromatid.", "Post-II: $n$, 1-chromatid.", "Ek hi $S$ phase.", "Variation inherent."], "r": "", "w": ["3 aur 4 bhi sahi hain.", "1 bhi sahi observation hai.", "Koi observation galat nahi.", ""], "t": "Genetically identical products mitosis ka hallmark hai, meiosis ka nahi.", "sim": null}, {"id": 251, "tag": "Application (PYQ-style)", "q": "The Anaphase Promoting Complex (APC) is a protein-degradation machinery necessary for proper mitosis of animal cells. If the APC becomes defective in a dividing human cell, which one of the following is most likely to occur?", "fig": null, "opt": ["The chromosomes will fail to condense during prophase", "The cell will be unable to enter anaphase and the sister chromatids will not separate", "DNA replication will be blocked during the $S$ phase", "The nuclear envelope will fail to break down at the end of prophase"], "ans": 1, "c": "APC securin degrade karke separase release karta hai jisse cohesin tut-ta hai aur chromatids separate hote hain; saath hi cyclin B degrade hoke MPF off hota hai. Defective APC par anaphase entry block.", "m": "APC ka do kaam: securin degradation + cyclin B degradation.", "s": ["APC ubiquitinates securin.", "Separase active hoke cohesin todti hai.", "Defective APC $\\Rightarrow$ cohesin intact.", "Chromatids stuck, anaphase blocked."], "r": "", "w": ["Condensation prophase ka MPF-driven event hai, APC nahi.", "", "Replication $S$ phase machinery se chalti hai.", "Envelope breakdown prophase mein hota hai."], "t": "Ye NEET 2017 ka classic APC frame hai — high-priority.", "sim": null}, {"id": 252, "tag": "Numerical", "q": "In a flowering plant, how many meiotic divisions in total are required to form 480 viable seeds, given that each seed results from one fertilisation event involving one pollen grain and one egg cell?", "fig": null, "opt": ["480", "600", "120", "960"], "ans": 1, "c": "Female: 480 eggs $\\Rightarrow$ 480 meiosis. Male: 1 meiosis = 4 pollen, to $480/4 = 120$ meiosis. Total $480 + 120 = 600$.", "m": "$1.25n$ formula for seeds.", "s": ["Female divisions = 480.", "Male divisions = 120.", "Sum = 600."], "r": "", "w": ["480 sirf female half hai.", "", "120 sirf male half hai.", "960 double count hai."], "t": "Sirf male gametes puchte to 120; sirf eggs to 480 — question dono ka total maangta hai.", "sim": null}, {"id": 253, "tag": "Numerical", "q": "A human secondary oocyte ($n = 23$) is observed during anaphase II, after the centromeres have split but before the second cytokinesis is completed. At this instant, the cell contains:", "fig": null, "opt": ["23 chromosomes and 46 chromatids", "46 chromosomes and 46 chromatids", "46 chromosomes and 92 chromatids", "23 chromosomes and 23 chromatids"], "ans": 1, "c": "Anaphase-II se pehle 23 chromosomes (2 chromatid each). Centromere split hote hi 46 independent chromosomes, ab har ek 1 chromatid — phir bhi ek hi cell mein, isliye 46/46.", "m": "Split ke baad chromatids khud chromosomes ban jate hain.", "s": ["Before: 23 centromeres, 46 chromatids.", "Split: 46 centromeres.", "Cytokinesis pending: sab ek cell mein.", "Count: 46/46."], "r": "", "w": ["23/46 split se pehle ki condition hai.", "", "92 chromatid primary oocyte level hai.", "23/23 final ovum/polar body ka count hai."], "t": "Cytokinesis ke baad har daughter cell 23/23 ho jayega.", "sim": null}, {"id": 254, "tag": "Concept MCQ", "q": "Which one of the following events is characteristic of the $G_2$ phase of the cell cycle?", "fig": null, "opt": ["Replication of the DNA content of the cell", "Synthesis of tubulin and other proteins required for mitosis, along with continued cell growth", "Alignment of chromosomes at the equatorial plate", "Pairing of homologous chromosomes and crossing over"], "ans": 1, "c": "$G_2$ mein mitosis ki taiyari hoti hai — tubulin (spindle protein), doosre proteins, growth aur DNA error check. Replication $S$ phase ka kaam; alignment/pairing $M$ phase/meiosis events hain.", "m": "$G_2$ = prep-for-mitosis gap.", "s": ["Replication already complete.", "Tubulin synthesis key event.", "Equator alignment metaphase mein.", "Pairing sirf meiosis mein."], "r": "", "w": ["DNA replication $S$ phase ka event hai.", "", "Alignment metaphase ka feature hai.", "Pairing/crossing over meiosis prophase-I mein."], "t": "$G_2/M$ checkpoint isi taiyari aur DNA integrity ko verify karta hai.", "sim": null}, {"id": 255, "tag": "Direct MCQ", "q": "Vincristine and vinblastine, used as anti-cancer drugs because they arrest dividing cells in metaphase by disrupting the spindle apparatus, are obtained from which plant?", "fig": null, "opt": ["Colchicum autumnale", "Catharanthus roseus (Madagascar periwinkle)", "Allium cepa", "Nicotiana tabacum"], "ans": 1, "c": "Vinca alkaloids Catharanthus roseus se milte hain; ye tubulin bind karke microtubule dynamics disrupt karte hain — cancer cells metaphase mein arrest. Colchicine Colchicum se aata hai.", "m": "Drug $\\leftrightarrow$ plant source pairing.", "s": ["Vincristine/vinblastine = Catharanthus.", "Colchicine = Colchicum.", "Dono spindle poisons, sources alag."], "r": "", "w": ["Colchicum autumnale colchicine ka source hai, vinca alkaloids ka nahi.", "", "Allium cepa (onion) sirf experimental material hai, drug source nahi.", "Nicotiana tabacum (tobacco) bhi drug source nahi hai."], "t": "Anti-cancer use ke saath source aksar match question mein aata hai.", "sim": null}, {"id": 256, "tag": "Numerical", "q": "A diploid cell with $2n = 16$ chromosomes reaches the pachytene stage of prophase I. At this stage, the numbers of bivalents, centromeres and chromatids present in the cell respectively are:", "fig": null, "opt": ["8, 16 and 32", "16, 16 and 32", "8, 8 and 16", "16, 32 and 32"], "ans": 0, "c": "Bivalents = homologous pairs = $n = 8$. Centromeres = chromosome count = 16 (split nahi hue). Chromatids = $16 \\times 2 = 32$.", "m": "Teen count ek saath: pairs, centromeres, DNA molecules.", "s": ["$2n=16 \\Rightarrow n=8$ bivalents.", "Centromeres abhi 16.", "Har chromosome 2 chromatid $\\Rightarrow$ 32."], "r": "", "w": ["", "16 bivalents tab hote agar $2n=32$ hota.", "8 centromeres impossible unreplicated logic se.", "32 centromeres sirf anaphase split ke baad."], "t": "Pachytene: bivalent $n$, centromere $2n$, chromatid $4n$.", "sim": null}, {"id": 257, "tag": "Concept MCQ", "q": "A multinucleate (syncytial) condition in the human body, formed by fusion of cells rather than by failure of cytokinesis, is seen in:", "fig": null, "opt": ["Mature red blood cells", "Skeletal muscle fibres", "Mature neurons", "Spermatozoa"], "ans": 1, "c": "Skeletal muscle fibres embryonic myoblasts ke fusion se banti hain — ek membrane ke andar kai nuclei (syncytium by fusion). Coconut endosperm jaisa syncytium failure-of-cytokinesis type hota hai.", "m": "Do multinucleate mechanisms: fusion vs no cytokinesis.", "s": ["RBC anucleate hote hain.", "Muscle = fused myoblasts.", "Neuron single nucleus.", "Sperm single nucleus."], "r": "", "w": ["RBC mein nucleus hota hi nahi.", "", "Neuron uninucleate hai.", "Sperm bhi uninucleate hai."], "t": "Osteoclast bhi fusion se bana multinucleate cell hai — related example.", "sim": null}, {"id": 258, "tag": "Concept MCQ", "q": "Zygotic meiosis, in which the diploid zygote itself undergoes meiosis and the dominant plant body is haploid, is characteristically seen in:", "fig": null, "opt": ["Human beings and other mammals", "Haploid algae such as Chlamydomonas", "Flowering plants such as pea", "Ferns such as Dryopteris"], "ans": 1, "c": "Chlamydomonas jaisi haploid algae mein sirf zygote diploid hota hai; wahi meiosis karke haploid zoospores banata hai — zygotic meiosis. Animals gametic, plants sporic meiosis dikhate hain.", "m": "Meiosis ka timing life cycle se match karo.", "s": ["Animals: gametic.", "Haplontic algae: zygotic.", "Plants/ferns: sporic."], "r": "", "w": ["Mammals gametic meiosis karte hain.", "", "Angiosperms sporic (spore mother cells).", "Ferns bhi sporic."], "t": "Haplontic life cycle = zygotic meiosis ka doosra naam.", "sim": null}, {"id": 259, "tag": "Numerical", "q": "In a sexually reproducing animal, each gamete contains $C$ amount of DNA and $n$ chromosomes. Immediately after fertilisation, the zygote will contain:", "fig": null, "opt": ["$C$ amount of DNA and $n$ chromosomes", "$2C$ amount of DNA and $2n$ chromosomes", "$4C$ amount of DNA and $2n$ chromosomes", "$2C$ amount of DNA and $n$ chromosomes"], "ans": 1, "c": "Do gametes fuse: DNA $C + C = 2C$, chromosomes $n + n = 2n$. Zygote diploid banta hai.", "m": "Fertilisation = do haploid genomes ka sum.", "s": ["Gamete: $C$, $n$.", "Fusion of two.", "Zygote: $2C$, $2n$."], "r": "", "w": ["$C$/$n$ to ek gamete ka content hai.", "", "$4C$ replication ke baad aata hai, fertilisation par nahi.", "Chromosome number restore hoke $2n$ hota hai."], "t": "Meiosis half karta hai, fertilisation wapas restore — species number conservation.", "sim": null}, {"id": 260, "tag": "Application", "q": "Cytochalasin B is a mitotic inhibitor that disrupts actin microfilaments. A dividing animal cell treated with this chemical will most likely show:", "fig": null, "opt": ["Failure of spindle formation and metaphase arrest", "Blockage of DNA replication in the $S$ phase", "Failure of cleavage furrow formation, resulting in a binucleate cell", "Inability of chromosomes to condense in prophase"], "ans": 2, "c": "Cleavage furrow actin-myosin contractile ring se banta hai; actin toot-ne par furrow ban hi nahi payega, karyokinesis ho jayegi par cytokinesis fail — binucleate cell.", "m": "Target protein (actin) $\\rightarrow$ structure (ring) $\\rightarrow$ event (furrow).", "s": ["Actin ring furrow banati hai.", "Drug ring disrupt karta hai.", "Nuclei to divide ho jate hain.", "Cytoplasm partition fail."], "r": "", "w": ["Spindle tubulin-based hai, colchicine/vinca target.", "Replication polymerase machinery hai.", "", "Condensation MPF-driven hai."], "t": "Colchicine spindle (tubulin) rokti hai; cytochalasin furrow (actin) — dono confuse mat karo.", "sim": null}, {"id": 261, "tag": "Statement-based", "q": "Consider the following statements about the $G_0$ (quiescent) stage. Statement I: Cells enter the $G_0$ stage by exiting the active cell cycle from the $G_1$ phase. Statement II: Cells in $G_0$ remain metabolically active and carry out their specialised functions. Statement III: Mature neurons and striated muscle cells remain in a permanent $G_0$ state. Statement IV: A cell in $G_0$ contains $4C$ DNA because its DNA was replicated before it left the cycle. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "$G_0$ entry $G_1$ se hoti hai, isliye DNA $2C$ hi rehta hai — IV galat. Pehle teeno statements standard facts hain.", "m": "$G_0$ cell kabhi $S$ phase mein nahi gaya, to $4C$ impossible.", "s": ["Exit point $G_1$ — sahi.", "Metabolism on — sahi.", "Permanent examples — sahi.", "$4C$ claim galat."], "r": "", "w": ["", "IV galat hai.", "IV include karta hai.", "I bhi sahi statement missing hai."], "t": "$G_0$ ka DNA content hamesha $2C$ (diploid cell ke liye).", "sim": null}, {"id": 262, "tag": "Statement-based", "q": "Consider the following statements about the molecular regulation of the cell cycle. Statement I: The $G_1/S$ checkpoint, also called the restriction point, assesses cell size, growth signals and DNA integrity before commitment to division. Statement II: The $G_2/M$ checkpoint prevents entry into mitosis if DNA replication is incomplete or DNA damage remains unrepaired. Statement III: The spindle assembly checkpoint operates at the metaphase-anaphase transition and monitors kinetochore-spindle attachments. Statement IV: The tumour suppressor protein $\\mathrm{p53}$ promotes rapid progression through the cycle by directly activating all cyclin-dependent kinases. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and III", "II, III and IV"], "ans": 2, "c": "$\\mathrm{p53}$ brake hai: damage par cycle rokta hai, repair/apoptosis karwata hai — CDK activate nahi karta. IV galat, baaki teeno sahi.", "m": "$\\mathrm{p53}$ = guardian, gatekeeper, accelerator nahi.", "s": ["Restriction point checks sahi.", "$G_2/M$ gate sahi.", "SAC role sahi.", "$\\mathrm{p53}$ activation claim galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "$\\mathrm{p53}$ loss-of-function mutations bahut cancers mein milti hain.", "sim": null}, {"id": 263, "tag": "Statement-based", "q": "Consider the following statements comparing mitosis and meiosis. Statement I: Both processes are preceded by a single round of DNA replication in the $S$ phase. Statement II: Pairing of homologous chromosomes and chiasmata formation are exclusive to meiosis. Statement III: The centromere splits in the anaphase of mitosis and in anaphase II, but not in anaphase I. Statement IV: The two cells formed after meiosis I are genetically identical to each other and to the parent cell. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "II, III and IV"], "ans": 2, "c": "Crossing over/homolog mixing ki wajah se meiosis-I products genetically different hote hain — IV galat. Pehle teeno sahi comparison points hain.", "m": "Meiotic variation = identical products wali line reject.", "s": ["Ek $S$ phase dono se pehle.", "Pairing meiosis-only.", "Centromere timing sahi.", "IV genetic-identity claim galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Mitotic daughters clone jaisi; meiotic cells recombinants.", "sim": null}, {"id": 264, "tag": "Statement-based", "q": "Consider the following statements about DNA content in a diploid cell whose $G_1$ content is $2C$. Statement I: A cell in the zygotene stage of meiosis contains $4C$ DNA. Statement II: Each daughter nucleus at the end of meiosis I contains $2C$ DNA. Statement III: A cell in anaphase II, before the second cytokinesis, temporarily contains $2C$ DNA. Statement IV: Each mature gamete formed after meiosis II contains $C$ amount of DNA. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Poora $C$-value chakra: prophase-I $4C$, post-I $2C$, anaphase-II (single cell) $2C$, final gamete $C$ — chaaron sahi.", "m": "Har stage par DNA molecules gino.", "s": ["Replication $4C$ deti hai.", "Cytokinesis-I $\\rightarrow 2C$.", "Anaphase-II abhi ek cell, $2C$.", "Cytokinesis-II $\\rightarrow C$."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "III ka trap samjho: split DNA amount nahi badalti.", ""], "t": "Centromere split chromosome count badalti hai, DNA content nahi.", "sim": null}, {"id": 265, "tag": "Statement-based", "q": "Consider the following statements about the sub-stages of prophase I. Statement I: In leptotene, the chromosomes gradually become visible as thin threads due to compaction of chromatin. Statement II: In zygotene, homologous chromosomes start pairing and the synaptonemal complex begins to assemble. Statement III: In pachytene, recombination nodules appear and the enzyme recombinase mediates crossing over. Statement IV: In diakinesis, the nuclear envelope and nucleolus reappear and the spindle apparatus gets dissolved. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II and IV"], "ans": 2, "c": "Diakinesis mein envelope/nucleolus disappear hote hain aur spindle banta hai — IV ka ulta likha hai. Pehle teeno sahi hain.", "m": "Diakinesis = breakdown, reappearance nahi.", "s": ["Leptotene compaction sahi.", "Zygotene pairing sahi.", "Pachytene exchange sahi.", "IV reversed events, galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Reappearance telophase ka event hai, diakinesis ka nahi.", "sim": null}, {"id": 266, "tag": "Statement-based", "q": "Consider the following statements about cytokinesis. Statement I: In animal cells, the cleavage furrow deepens centripetally, from the periphery towards the centre. Statement II: In plant cells, the cell plate grows centrifugally, from the centre towards the lateral walls. Statement III: The cell plate ultimately represents the middle lamella between the walls of the two daughter cells. Statement IV: The cleavage furrow in animal cells is generated by spindle microtubules made of tubulin. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Furrow actin-myosin ring se banta hai, tubulin microtubules se nahi — IV galat. Pehle teeno sahi hain.", "m": "Furrow = actin; spindle = tubulin — do alag cytoskeletons.", "s": ["Centripetal furrow sahi.", "Centrifugal plate sahi.", "Middle lamella fate sahi.", "Tubulin claim galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Cytochalasin (actin) furrow todta hai; colchicine (tubulin) spindle.", "sim": null}, {"id": 267, "tag": "Statement-based", "q": "Consider the following statements about nondisjunction in a human germ cell. Statement I: Nondisjunction during meiosis I makes all four resulting gametes abnormal. Statement II: Nondisjunction during meiosis II makes only two of the four resulting gametes abnormal. Statement III: Fusion of an $n+1$ gamete with a normal $n$ gamete produces a trisomic ($2n+1$) zygote. Statement IV: Nondisjunction of the sex chromosomes can lead to conditions such as Turner syndrome ($45,\\mathrm{X}$). Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Error-stage logic, aneuploid gametes, trisomy calculation aur sex-chromosome example — chaaron statements bilkul sahi hain.", "m": "I-error = 4 abnormal; II-error = 2 abnormal.", "s": ["Meiosis-I tree dono branches corrupt.", "Meiosis-II ek branch limited.", "$n+1+n=2n+1$.", "Turner = missing sex chromosome."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "IV bhi clinical fact hai.", ""], "t": "Klinefelter ($47,\\mathrm{XXY}$) dusra common sex-chromosome aneuploidy.", "sim": null}, {"id": 268, "tag": "Statement-based", "q": "Consider the following statements about chromosome types based on centromere position. Statement I: A metacentric chromosome appears V-shaped during its poleward movement in anaphase. Statement II: A sub-metacentric chromosome appears L or J-shaped during anaphase. Statement III: An acrocentric chromosome has a very short arm and appears almost rod-like. Statement IV: Normal human chromosome sets contain several telocentric chromosomes with terminal centromeres. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II and IV"], "ans": 2, "c": "Human karyotype mein telocentric chromosomes hote hi nahi (acrocentric hote hain, satellite ke saath) — IV galat. Pehle teeno shape-position relationships sahi hain.", "m": "Human set = meta/sub-meta/acro, telo nahi.", "s": ["V = metacentric sahi.", "L/J = sub-metacentric sahi.", "Rod-like = acrocentric sahi.", "Telocentric claim galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Mouse jaisi species mein telocentric common hain, human mein nahi.", "sim": null}, {"id": 269, "tag": "Statement-based", "q": "Consider the following statements about mitotic inhibitors. Statement I: Colchicine is obtained from Colchicum autumnale. Statement II: Vincristine and vinblastine are obtained from Catharanthus roseus. Statement III: Both colchicine and the vinca alkaloids interfere with tubulin polymerisation and spindle function. Statement IV: Colchicine mainly blocks the replication of DNA during the $S$ phase of the cell cycle. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Dono spindle poisons hain, DNA synthesis blockers nahi — IV galat. Sources aur mechanism (I-III) sahi hain.", "m": "Spindle poison vs synthesis blocker.", "s": ["Colchicum source sahi.", "Catharanthus source sahi.", "Tubulin mechanism sahi.", "$S$ phase block claim galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Hydroxyurea/cytosine arabinoside jaise drugs $S$ phase block karte hain.", "sim": null}, {"id": 270, "tag": "Statement-based", "q": "Consider the following statements about special modes of nuclear division. Statement I: In amitosis, the nucleus constricts directly without spindle formation or appearance of distinct chromosomes. Statement II: In endomitosis, repeated chromosome replication within an intact nucleus raises the ploidy of that nucleus. Statement III: Free nuclear division in the liquid endosperm of coconut produces a multinucleate syncytium. Statement IV: Endomitosis followed by cytokinesis is the process that produces a syncytium.", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "II, III and IV"], "ans": 2, "c": "Syncytium banta hai cytokinesis skip hone se, endomitosis+cytokinesis se nahi — IV galat. Pehle teeno sahi definitions hain.", "m": "Syncytium = karyokinesis without cytokinesis.", "s": ["Amitosis direct split sahi.", "Endomitosis replication-only sahi.", "Coconut example sahi.", "IV ka mechanism ulta hai."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Endoreduplication single nucleus ko polyploid banati hai, multi-nucleate nahi.", "sim": null}, {"id": 271, "tag": "Statement-based", "q": "Consider the following statements about the occurrence and significance of cell divisions. Statement I: Mitosis brings about growth and tissue repair in multicellular organisms. Statement II: Crossing over during meiosis generates genetic variation that acts as raw material for evolution. Statement III: The haploid male honey bee (drone) produces its gametes by mitosis. Statement IV: In animals, meiosis takes place in the somatic cells to maintain the diploid chromosome number. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II and IV"], "ans": 2, "c": "Meiosis germ cells mein hoti hai, somatic mein nahi — IV galat. Pehle teeno sahi hain.", "m": "Somatic = mitosis; germ line = meiosis.", "s": ["Growth/repair mitosis.", "Variation meiosis.", "Drone exception sahi.", "Somatic meiosis claim galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Somatic mutation lineage tak seemit; germ-line mutation agle generation tak jati hai.", "sim": null}, {"id": 272, "tag": "Statement-based", "q": "Consider the following statements for a diploid cell with $2n = 14$. Statement I: A $G_1$ cell contains 14 chromosomes and 14 chromatids. Statement II: A $G_2$ cell contains 14 chromosomes and 28 chromatids. Statement III: Each cell after meiosis I contains 7 chromosomes and 14 chromatids. Statement IV: Each gamete after meiosis II contains 7 chromosomes and 14 chromatids. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II and IV"], "ans": 2, "c": "Final gamete mein har chromosome 1 chromatid ka hota hai — 7 chromosomes, 7 chromatids; IV galat. Pehle teeno counts sahi hain.", "m": "Final gamete: $n$ chromosomes, 1 chromatid each.", "s": ["$G_1$: 14/14.", "$G_2$: 14/28.", "Post-I: 7/14.", "Post-II: 7/7 (IV 14 batata, galat)."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Meiosis-II ke baad har chromatid independent chromosome hota hai.", "sim": null}, {"id": 273, "tag": "Incorrect finder", "q": "Which of the following statements about the $S$ phase is NOT correct?", "fig": null, "opt": ["The amount of DNA per cell doubles from $2C$ to $4C$ in a diploid cell.", "The chromosome number of the cell doubles along with the DNA content.", "In animal cells, the centriole duplicates in the cytoplasm during this phase.", "Each chromosome at the end of this phase consists of two sister chromatids."], "ans": 1, "c": "Chromosome number stable rehta hai — centromere count nahi badalta; sirf DNA/chromatid double hote hain.", "m": "Content double, count same — classic trap.", "s": ["DNA doubling sahi.", "Chromosome doubling claim galat.", "Centriole duplication sahi.", "2-chromatid structure sahi."], "r": "", "w": ["$2C \\rightarrow 4C$ sahi fact hai.", "", "Centriole $S$ phase mein duplicate karta hai.", "Chromatid structure correct hai."], "t": "Chromosome count badlega sirf centromere split par.", "sim": null}, {"id": 274, "tag": "Correct finder", "q": "Select the correct statement about the maturation promoting factor (MPF):", "fig": null, "opt": ["It is an active complex of mitotic cyclin (cyclin B) and cyclin-dependent kinase 1 that drives the $G_2$ to $M$ transition.", "It catalyses the crossing over reaction during the pachytene stage.", "It is a microtubule-based structure that physically pulls the chromosomes apart.", "It remains active throughout the $G_0$ stage to keep the cell quiescent."], "ans": 0, "c": "MPF = cyclin B + $\\mathrm{CDK1}$; phosphorylate karke envelope breakdown, spindle events trigger. Recombinase alag, spindle alag, $G_0$ mein MPF off.", "m": "MPF identity ek line mein: cyclin-CDK complex.", "s": ["Complex formation $G_2$ end.", "$M$ entry trigger.", "APC ise off karta hai.", "Baaki options alag machinery."], "r": "", "w": ["", "Crossing over recombinase karta hai.", "Spindle microtubules khud MPF nahi.", "$G_0$ mein division machinery silent rehti hai."], "t": "MPF ko 'M-phase promoting factor' bhi likha milta hai.", "sim": null}, {"id": 275, "tag": "Incorrect finder", "q": "Which of the following statements about the diplotene stage is NOT correct?", "fig": null, "opt": ["It begins with the dissolution of the synaptonemal complex.", "The homologous chromosomes begin to separate but remain joined at the chiasmata.", "Human primary oocytes may remain arrested in this stage for many years.", "The recombination nodules appear for the first time and crossing over begins in this stage."], "ans": 3, "c": "Nodules aur crossing over pachytene ke events hain; diplotene mein sirf unke physical marks (chiasmata) bachte hain. Baaki teeno diplotene facts sahi.", "m": "Pachytene event ko diplotene mein dikhana = galat.", "s": ["SC dissolution sahi.", "Chiasma-held separation sahi.", "Oocyte arrest sahi.", "Nodule/exchange timing galat."], "r": "", "w": ["SC dissolve hona sahi event hai.", "Chiasmata holding sahi hai.", "Dictyate arrest documented hai.", ""], "t": "Exchange pachytene, marks diplotene — timing yaad rakho.", "sim": null}, {"id": 276, "tag": "Correct finder", "q": "Select the correct statement about the centromere and the kinetochore:", "fig": null, "opt": ["The kinetochore is a constricted DNA region, while the centromere is a protein disc.", "The kinetochore is a disc-shaped protein structure assembled on the centromere and serves as the site of spindle fibre attachment.", "Spindle fibres attach directly to the centromeric DNA, bypassing the kinetochore.", "The kinetochore appears only during telophase to assist nuclear envelope reformation."], "ans": 1, "c": "Centromere DNA region hai (constriction), kinetochore us par bana protein disc jahan fibres lagte hain. Har sister chromatid ka apna kinetochore.", "m": "DNA region vs protein structure.", "s": ["Centromere = chromatin region.", "Kinetochore = protein assembly.", "Spindle attachment kinetochore par.", "Formation prophase/prometaphase mein."], "r": "", "w": ["Ulta hai: kinetochore protein, centromere DNA.", "", "Attachment protein disc par hota hai.", "Kinetochore division ke early stages mein banta hai."], "t": "Spindle assembly checkpoint har kinetochore ki attachment verify karta hai.", "sim": null}, {"id": 277, "tag": "Incorrect finder", "q": "Which of the following statements about meiosis II is NOT correct?", "fig": null, "opt": ["It occurs in haploid cells and is an equational division.", "The sister chromatids separate during anaphase II.", "A fresh round of DNA replication takes place before the start of meiosis II.", "The four final daughter cells each contain $n$ chromosomes with one chromatid each."], "ans": 2, "c": "Interkinesis mein replication hoti hi nahi — yahi meiosis ka golden rule hai. Baaki teeno meiosis-II ke sahi facts hain.", "m": "One replication, two divisions.", "s": ["Haploid start sahi.", "Chromatid separation sahi.", "Replication claim galat.", "Final composition sahi."], "r": "", "w": ["Equational nature sahi hai.", "Anaphase-II event sahi hai.", "", "Gamete composition sahi hai."], "t": "Agar interkinesis mein $S$ phase hota to $C$-value chakra toot jata.", "sim": null}, {"id": 278, "tag": "Correct finder", "q": "Select the correct statement about the synaptonemal complex:", "fig": null, "opt": ["It is a tripartite proteinaceous structure that stabilises pairing of homologous chromosomes during zygotene and pachytene.", "It is formed of microtubules and connects the centrioles to the kinetochores.", "It first appears during the diakinesis stage and persists through telophase I.", "It is the structure at which the cell plate is formed in plant cells."], "ans": 0, "c": "SC tripartite (three-part) protein ladder hai jo homologs ko zygotene-pachytene mein hold karta hai aur crossing over support karta hai; diplotene mein dissolve.", "m": "Pairing scaffold = synaptonemal complex.", "s": ["Zygotene assembly.", "Pachytene stability.", "Diplotene dissolution.", "Microtubule/wall structures alag hain."], "r": "", "w": ["", "Spindle microtubules alag machinery hai.", "Diakinesis tak SC dissolve ho chuka hota hai.", "Cell plate cytokinesis structure hai."], "t": "SC ke bina synapsis/crossing over efficient nahi hota.", "sim": null}, {"id": 279, "tag": "Incorrect finder", "q": "Which of the following statements about mitosis in higher plant cells is NOT correct?", "fig": null, "opt": ["Centrioles and asters are absent, yet a spindle apparatus is formed.", "Cytokinesis occurs through the formation of a cell plate.", "A cleavage furrow deepens centripetally to divide the cytoplasm.", "The cell plate is built from Golgi-derived vesicles carrying wall materials."], "ans": 2, "c": "Cleavage furrow animal cell feature hai; rigid wall wali plant cell furrow bana hi nahi sakti — plate banti hai. Baaki teeno plant mitosis facts sahi hain.", "m": "Furrow = animal, plate = plant.", "s": ["Anastral spindle sahi.", "Plate cytokinesis sahi.", "Furrow claim galat.", "Vesicle mechanism sahi."], "r": "", "w": ["Higher plants anastral hote hain.", "Plate mechanism sahi hai.", "", "Golgi vesicle role correct hai."], "t": "Phragmoplast vesicles ko equator par organise karta hai.", "sim": null}, {"id": 280, "tag": "Correct finder", "q": "Select the correct statement about chiasmata:", "fig": null, "opt": ["They first become visible during the leptotene stage.", "They are X-shaped structures marking the sites where crossing over has occurred, and their terminalisation is completed in diakinesis.", "They are protein discs that attach the chromosomes to the spindle fibres.", "They permanently fuse the homologous chromosomes so that they never separate."], "ans": 1, "c": "Chiasmata exchange sites ke X-marks hain, diplotene mein visible, diakinesis tak terminalise, aur anaphase-I mein homologs alag hote hain (permanent fusion nahi).", "m": "Exchange mark + terminalisation timing.", "s": ["Leptotene mein nahi bante.", "Diplotene visibility.", "Diakinesis terminalisation.", "Anaphase-I separation."], "r": "", "w": ["Leptotene sirf compaction stage hai.", "", "Kinetochore attachment disc alag structure hai.", "Homologs anaphase-I mein separate hote hain."], "t": "Chiasmata ki wajah se bivalent metaphase-I plate par stable rehta hai.", "sim": null}, {"id": 281, "tag": "Incorrect finder", "q": "Which of the following statements about interkinesis is NOT correct?", "fig": null, "opt": ["It is the short gap between meiosis I and meiosis II.", "No DNA replication takes place during interkinesis.", "The chromosomes entering interkinesis already consist of two sister chromatids each.", "It is generally much longer than the interphase preceding meiosis I."], "ans": 3, "c": "Interkinesis chhota ya almost absent hota hai; pre-meiotic interphase (with $S$ phase) lamba. Baaki teeno sahi facts hain.", "m": "Duration + no-replication.", "s": ["Gap definition sahi.", "No $S$ phase sahi.", "2-chromatid state sahi.", "Longer claim galat."], "r": "", "w": ["Definition sahi hai.", "No-replication rule sahi hai.", "Chromatid state sahi hai.", ""], "t": "Kayi species mein interkinesis skip-sa hota hai.", "sim": null}, {"id": 282, "tag": "Correct finder", "q": "Select the correct statement about nondisjunction:", "fig": null, "opt": ["It produces gametes that are all genetically identical and diploid.", "It results from failure of homologous chromosomes or sister chromatids to separate and can cause aneuploidy.", "It occurs only during mitosis and never during meiosis.", "It changes the DNA sequence of genes but never alters chromosome numbers."], "ans": 1, "c": "Nondisjunction separation failure hai jo chromosome number bigadta hai ($n\\pm1$) — aneuploidy. Sequence mutation alag cheez hai, aur ye meiosis mein commonly hota hai.", "m": "Count error, not sequence error.", "s": ["Anaphase separation fail.", "Gametes $n+1$/$n-1$.", "Meiosis-I/II dono possible.", "Aneuploid zygote."], "r": "", "w": ["Diploid identical gametes nahi bante.", "", "Meiotic nondisjunction common hai.", "Number directly alter hota hai."], "t": "Trisomy 21 nondisjunction ka famous consequence hai.", "sim": null}, {"id": 283, "tag": "Match the Columns", "q": "Match the inhibitor in Column I with its mechanism of action in Column II. Column I: (a) Colchicine (b) Cytochalasin B (c) Vinblastine (d) Hydroxyurea. Column II: (i) Disrupts actin microfilaments and blocks cleavage furrow formation (ii) Inhibits ribonucleotide reduction and blocks DNA synthesis in the $S$ phase (iii) Binds tubulin and prevents spindle microtubule assembly (iv) Tubulin-binding vinca alkaloid used as an anti-cancer mitotic poison.", "fig": null, "opt": ["a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-ii, d-iv", "a-iii, b-iv, c-i, d-ii", "a-iv, b-i, c-iii, d-ii"], "ans": 0, "c": "Colchicine/vinblastine dono tubulin par (colchicine assembly block, vinca cancer drug); cytochalasin actin/furrow; hydroxyurea DNA synthesis.", "m": "Cytoskeleton target vs synthesis target.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "Colchicine actin ko nahi, tubulin ko target karta hai.", "Vinblastine furrow block nahi karta.", "Hydroxyurea spindle poison nahi."], "t": "Tubulin drugs metaphase arrest; actin drugs binucleate cells banate hain.", "sim": null}, {"id": 284, "tag": "Match the Columns", "q": "Match the stage of meiosis II in Column I with its characteristic event in Column II. Column I: (a) Prophase II (b) Metaphase II (c) Anaphase II (d) Telophase II. Column II: (i) Splitting of centromere and separation of sister chromatids (ii) Nuclear envelope breaks down and a new spindle forms in the haploid cell (iii) Chromosomes decondense and nuclear envelope reforms (iv) Individual chromosomes align at the equator of the haploid cell.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-iv, b-ii, c-iii, d-i", "a-ii, b-i, c-iv, d-iii", "a-iii, b-iv, c-i, d-ii"], "ans": 0, "c": "Meiosis-II mitosis jaisa sequence haploid cell mein: prophase spindle, metaphase alignment, anaphase split, telophase reformation.", "m": "PMAT order apply karo.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Centromere split anaphase ka event hai.", "Alignment metaphase ka event hai.", "Reformation telophase ka event hai."], "t": "Starting cell haploid hai, isliye bivalents nahi milte.", "sim": null}, {"id": 285, "tag": "Match the Columns", "q": "Match the cell or tissue in Column I with its division behaviour in Column II. Column I: (a) Mature neuron (b) Liver hepatocyte (c) Primary oocyte (d) Drone honey bee cell. Column II: (i) Gamete formation by mitosis in a haploid organism (ii) Permanently arrested in $G_0$ (iii) Long arrest in the diplotene stage of prophase I (iv) Re-enters $G_1$ from $G_0$ after injury.", "fig": null, "opt": ["a-ii, b-iv, c-iii, d-i", "a-i, b-ii, c-iv, d-iii", "a-iv, b-iii, c-i, d-ii", "a-ii, b-i, c-iii, d-iv"], "ans": 0, "c": "Neuron permanent $G_0$; hepatocyte reversible $G_0$; oocyte diplotene arrest; drone haploid mitosis.", "m": "Cell type $\\rightarrow$ cycle behaviour.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ iii.", "d $\\rightarrow$ i."], "r": "", "w": ["", "Neuron divide nahi karta.", "Oocyte liver jaisa regenerative nahi.", "Drone meiosis nahi kar sakta."], "t": "Drone virgin queen ke unfertilised egg se banta hai.", "sim": null}, {"id": 286, "tag": "Match the Columns", "q": "Match the stage in Column I with the DNA content in Column II ($G_1$ value of the diploid cell $= 2C$). Column I: (a) $G_1$ phase (b) $S$ phase (c) $G_2$ phase (d) Mature gamete. Column II: (i) $C$ (ii) $2C$ (iii) Gradual change from $2C$ to $4C$ (iv) $4C$.", "fig": null, "opt": ["a-ii, b-iii, c-iv, d-i", "a-i, b-iii, c-iv, d-ii", "a-ii, b-iv, c-iii, d-i", "a-iii, b-ii, c-i, d-iv"], "ans": 0, "c": "$G_1 = 2C$; $S$ = transition; $G_2 = 4C$; gamete $= C$.", "m": "C-value chakra.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iii.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ i."], "r": "", "w": ["", "Gamete $4C$ nahi ho sakta.", "$G_2$ plateau $4C$ hai.", "$S$ phase fixed value nahi, transition hai."], "t": "Graph mein $S$ phase slope, baaki plateaus dikhte hain.", "sim": null}, {"id": 287, "tag": "Match the Columns", "q": "Match the term in Column I with its description in Column II. Column I: (a) Bivalent (b) Synapsis (c) Chiasma (d) Terminalisation. Column II: (i) Pairing of homologous chromosomes (ii) Sliding of chiasmata towards the chromosome ends (iii) A pair of homologous chromosomes held together (iv) X-shaped site of crossing over between homologs.", "fig": null, "opt": ["a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-ii, d-iv", "a-iii, b-iv, c-i, d-ii", "a-iv, b-i, c-iii, d-ii"], "ans": 0, "c": "Bivalent structure, synapsis process, chiasma mark, terminalisation movement.", "m": "Structure vs process vs mark vs movement.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "Synapsis structure nahi, pairing process hai.", "Chiasma sliding nahi, mark hai.", "Terminalisation structure nahi."], "t": "Bivalent = tetrad ka chromosome-view; tetrad = chromatid-view.", "sim": null}, {"id": 288, "tag": "Match the Columns", "q": "Match the regulatory element in Column I with the transition it controls in Column II. Column I: (a) $G_1/S$ checkpoint (b) $G_2/M$ checkpoint (c) Spindle assembly checkpoint (d) MPF. Column II: (i) Metaphase to anaphase transition (ii) Commitment to enter the $S$ phase (iii) Active driver of entry into the $M$ phase (iv) Entry into mitosis after verified DNA replication.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-i, c-iv, d-iii", "a-iv, b-iii, c-i, d-ii"], "ans": 0, "c": "Restriction point $S$ commitment; $G_2/M$ replication gate; SAC anaphase gate; MPF mitosis entry driver.", "m": "Har element ka transition stage.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "SAC $G_1$ par nahi hota.", "MPF checkpoint nahi, active kinase complex hai.", "$G_2/M$ attachment check nahi karta."], "t": "MPF on karta hai, APC off karta hai.", "sim": null}, {"id": 289, "tag": "Assertion-Reason", "q": "Assertion (A): The metaphase stage is the most suitable stage for preparing a karyotype and studying chromosome morphology. Reason (R): At metaphase the chromosomes are maximally condensed, clearly visible as two chromatids, and neatly aligned for examination.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Max condensation + clean alignment karyotype ko possible banati hai. R directly A ka reason hai.", "m": "Stage quality = study suitability.", "s": ["Condensation peak.", "Distinct chromatids.", "Equator alignment.", "Colchicine arrest isi stage par."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Karyotyping colchicine-treated metaphase spreads se hoti hai.", "sim": null}, {"id": 290, "tag": "Assertion-Reason", "q": "Assertion (A): Meiosis helps conserve the characteristic chromosome number of a species across generations. Reason (R): The process of fertilisation fuses two haploid gametes and restores the diploid number in the zygote.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Meiosis gametes ko haploid banata hai aur fertilisation do $n$ ko jodke $2n$ restore karti hai — dono milke number conserve karte hain. R conservation ka mechanism batata hai.", "m": "Meiosis + fertilisation = constant ploidy cycle.", "s": ["Gametes $n$.", "Fusion $2n$.", "Har generation same number.", "R explains A."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Sirf meiosis adhura conservation hai — fertilisation ka role bhi zaroori.", "sim": null}, {"id": 291, "tag": "Assertion-Reason", "q": "Assertion (A): Colchicine treatment can convert a diploid dividing cell into a tetraploid one. Reason (R): In the absence of a spindle, the duplicated chromatids separate but are retained within a single nucleus, doubling the chromosome number.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "No partition $\\Rightarrow$ doubled nucleus. R exact mechanism hai.", "m": "Spindle block = polyploidy route.", "s": ["Tubulin targeted.", "Chromatids separate.", "Single nucleus retains all.", "$2n \\rightarrow 4n$."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Polyploid breeding (wheat, seedless fruits) isi principle par hai.", "sim": null}, {"id": 292, "tag": "Assertion-Reason", "q": "Assertion (A): The liquid endosperm of coconut is a natural syncytium. Reason (R): It undergoes repeated free nuclear divisions in which karyokinesis is not immediately followed by cytokinesis.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Multiple nuclei ek cytoplasm mein — yahi syncytium definition hai, aur R uska mechanism deta hai.", "m": "No cytokinesis = multinucleate.", "s": ["Nuclei divide repeatedly.", "Wall formation delayed.", "Common cytoplasm.", "Syncytium banta hai."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Baad mein cell walls banakar cellular endosperm banta hai.", "sim": null}, {"id": 293, "tag": "Assertion-Reason", "q": "Assertion (A): Genetic recombination during meiosis is associated with the pachytene stage rather than the zygotene stage. Reason (R): Although synapsis begins in zygotene, recombinase-mediated exchange at recombination nodules occurs only in pachytene.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Pairing aur exchange alag stages; R stage-specific reason deta hai.", "m": "Zygotene = pairing, pachytene = exchange.", "s": ["Synapsis zygotene.", "Nodules pachytene.", "Recombinase active.", "Chiasmata baad mein visible."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Chiasmata diplotene mein dikhte hain par exchange pachytene mein hota hai.", "sim": null}, {"id": 294, "tag": "Assertion-Reason", "q": "Assertion (A): The centromere does not split during anaphase I of meiosis. Reason (R): In anaphase I, the homologous chromosomes separate while the sister chromatids of each chromosome remain associated at their centromeres.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Centromeric cohesin protected rehta hai, isliye centromere intact aur chromatids jude. R, A ka direct explanation hai.", "m": "Anaphase-I = homolog separation only.", "s": ["Homologs apart.", "Centromere intact.", "2-chromatid chromosomes.", "Reduction complete."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Centromere split sirf mitotic anaphase aur anaphase-II mein.", "sim": null}, {"id": 295, "tag": "Diagram based", "q": "A word-diagram of a dividing cell shows: the nucleolus has disappeared and the nuclear envelope is breaking down; the homologous chromosomes are fully condensed and remain paired as bivalents; the chiasmata have moved to the tips of the chromosomes and are fully terminalised; and the spindle fibres are beginning to attach to the kinetochores. The depicted sub-stage is:", "fig": {"k": "bivalent"}, "opt": ["Leptotene", "Zygotene", "Diplotene", "Diakinesis"], "ans": 3, "c": "Terminalised chiasmata + full condensation + envelope breakdown = diakinesis, prophase-I ka aakhri sub-stage.", "m": "'Fully terminalised' keyword.", "s": ["Leptotene: threads.", "Zygotene: pairing.", "Diplotene: chiasmata middle tak.", "Diakinesis: terminalised + breakdown."], "r": "", "w": ["Leptotene mein bivalents nahi.", "Zygotene mein terminalisation nahi.", "Diplotene mein envelope intact rehta hai.", ""], "t": "Diakinesis ke baad metaphase-I shuru hota hai.", "sim": null}, {"id": 296, "tag": "Data-table", "q": "A data table records the chromosome number, chromatid number and DNA content of a $2n = 10$ diploid cell at four stages. Which row is correctly recorded?", "fig": {"k": "table", "head": ["Stage", "Chr.", "Chromatids", "DNA"], "rows": [["G2", "10", "20", "4C"], ["Mitotic metaphase", "10", "20", "4C"], ["Post meiosis I", "5", "
