a key event hai.", "Activity fact bhi sahi hai.", ""], "t": "'Resting phase' naam ke bawajoo ye active phase hai — naming trap.", "sim": null}, {"id": 74, "tag": "Correct finder", "q": "Select the correct statement about the spindle apparatus:", "fig": null, "opt": ["It is made up of microfilaments of actin protein.", "It is formed during the telophase stage.", "Its fibres attach to the kinetochores of the chromosomes.", "It is found only in plant cells."], "ans": 2, "c": "Spindle microtubules (tubulin) prophase se banta hai aur kinetochores par attach hota hai; plant aur animal dono cells mein banta hai. Actin microfilaments furrow ka kaam karte hain.", "m": "Spindle = tubulin microtubules + kinetochore attachment, universal in dividing cells.", "s": ["Actin nahi, tubulin.", "Formation prophase mein, telophase mein disassembly.", "Attachment kinetochore par — sahi.", "Plant + animal dono mein spindle."], "r": "", "w": ["Actin fibres contractile ring ke hain.", "Telophase mein spindle toot-ta hai.", "", "Plant cells bhi spindle banati hain (anastral sahi par spindle ke saath)."], "t": "Higher plant spindle anastral hota hai par microtubule-based wahi mechanism hai.", "sim": null}, {"id": 75, "tag": "Incorrect finder", "q": "Which of the following statements about the diplotene stage is NOT correct?", "fig": null, "opt": ["The synaptonemal complex gets dissolved at the beginning of this stage.", "The homologous chromosomes begin to separate from each other.", "Chiasmata become visible for the first time in this stage.", "Crossing over between non-sister chromatids is initiated in this stage."], "ans": 3, "c": "Crossing over pachytene mein complete ho chuka hota hai; diplotene mein sirf uske marks (chiasmata) visible bante hain jab SC dissolve hota hai aur homologs alag hone lagte hain.", "m": "Pachytene ka event (crossing over) ko diplotene mein dikhana = galat statement.", "s": ["SC dissolution diplotene start — sahi.", "Homologs separate except at chiasmata — sahi.", "Chiasmata first visible — sahi.", "Crossing over pachytene event — diplotene wali line galat."], "r": "", "w": ["SC dissolution sahi diplotene event hai.", "Separation ka start sahi fact hai.", "Chiasmata visibility sahi hai.", ""], "t": "Oocyte ka saalon wala arrest bhi isi diplotene (dictyate) mein hota hai.", "sim": null}, {"id": 76, "tag": "Correct finder", "q": "Select the correct statement about the significance of meiosis:", "fig": null, "opt": ["It increases the chromosome number of the species with every generation.", "It helps conserve the chromosome number of a species across generations.", "It produces daughter cells that are genetically identical to the parent cell.", "It is the mechanism of tissue repair and growth in multicellular organisms."], "ans": 1, "c": "Meiosis gametes mein chromosome half ($n$) karta hai; fertilisation do gametes jodke wapas $2n$ banata hai — is tarah species ka number generation dar generation conserve rehta hai. Crossing over variation bhi deta hai.", "m": "Meiosis + fertilisation ka chakra = chromosome number conservation.", "s": ["Gametes: $n$.", "Fertilisation: $n + n = 2n$.", "Number har generation mein same.", "Growth/repair aur identical daughters mitosis ke features hain."], "r": "", "w": ["Number increase nahi hota, fertilisation ke baad wapas $2n$ aata hai.", "", "Identical daughters mitosis deta hai, meiosis nahi.", "Growth/repair mitosis ka kaam hai."], "t": "Conservation + variation — meiosis significance ke do pillars.", "sim": null}, {"id": 77, "tag": "Incorrect finder", "q": "Which of the following statements about cytokinesis is NOT correct?", "fig": null, "opt": ["In animal cells, it begins with the appearance of a furrow in the plasma membrane.", "In plant cells, it begins with the formation of the cell plate at the centre.", "In animal cells, the furrow extends centripetally to divide the cytoplasm.", "In plant cells, the cell plate grows from the periphery towards the centre."], "ans": 3, "c": "Plant cell plate centre se periphery (centrifugal) ki taraf badhti hai, periphery se centre nahi. Animal furrow centripetal grow karta hai.", "m": "Direction trap: plate = centre $\\rightarrow$ outside.", "s": ["Animal furrow: outside $\\rightarrow$ inside.", "Plant plate: inside $\\rightarrow$ outside.", "Option D direction ulta batata hai."], "r": "", "w": ["Animal furrow appearance sahi fact hai.", "Plant plate centre se start hoti hai — sahi.", "Centripetal furrow bhi sahi description hai.", ""], "t": "Centripetal vs centrifugal — ye exact word-pair NCERT mein hai, rat-lo.", "sim": null}, {"id": 78, "tag": "Correct finder", "q": "Select the correct statement about free nuclear division:", "fig": null, "opt": ["It involves repeated cytokinesis without any karyokinesis.", "It involves repeated karyokinesis without cytokinesis, producing a multinucleate condition.", "It is seen during the formation of mature bone cells.", "It results in the formation of the cleavage furrow in animal cells."], "ans": 1, "c": "Free nuclear division = baar-baar nucleus divide (karyokinesis) par cytoplasm na bat-na, jisse ek hi cell mein kaafi nuclei — syncytium/coenocyte. Coconut ka liquid endosperm classic example hai.", "m": "Nuclear division yes, cytoplasmic division no = syncytium.", "s": ["Karyokinesis repeat hota hai.", "Cytokinesis skip/late hota hai.", "Multinucleate cytoplasm banta hai."], "r": "", "w": ["Ulta hai: cytokinesis nahi, karyokinesis repeat hota hai.", "", "Bone cells iska example nahi.", "Furrow to normal animal cytokinesis hai."], "t": "Syncytium (coconut) vs skeletal muscle (cell fusion) — dono multinucleate par mechanisms alag.", "sim": null}, {"id": 79, "tag": "Incorrect finder", "q": "Which of the following statements about metaphase I of meiosis is NOT correct?", "fig": null, "opt": ["The bivalent chromosomes arrange themselves on the equatorial plate.", "The microtubules from opposite poles attach to the pair of homologous chromosomes.", "Spindle fibres from one pole attach to one chromosome of each homologous pair.", "The centromere of each chromosome splits in this stage."], "ans": 3, "c": "Metaphase-I mein centromere split nahi hota — wo to anaphase-II ya mitotic anaphase ka event hai. Yahaan bivalents align hote hain aur har homolog ek pole se connected hota hai.", "m": "Centromere split wala option har meiosis-I stage question mein sabse common galat statement hai.", "s": ["Bivalent alignment — sahi.", "Opposite pole attachments — sahi.", "One pole per homolog — sahi.", "Centromere remains intact in meiosis-I — D galat."], "r": "", "w": ["Bivalents equator par hote hain — sahi.", "Bipolar homolog attachment sahi hai.", "Ek pole ek homolog se — sahi.", ""], "t": "Metaphase (mitosis): dono poles ek chromosome par; metaphase-I: ek pole ek homolog par.", "sim": null}, {"id": 80, "tag": "Correct finder", "q": "Select the correct statement comparing mitosis in plant and animal cells:", "fig": null, "opt": ["Centrioles are present in both plant and animal mitotic cells.", "Asters are formed around the centrosomes in animal cells but not in higher plant cells.", "Cytokinesis occurs by cell plate formation in animal cells.", "Plant cells undergo amitosis instead of mitosis."], "ans": 1, "c": "Animal spindle astral (centriole + aster), higher plant spindle anastral (na centriole, na aster). Plant plate se, animal furrow se divide; plant mitosis normal mitosis hi hai, amitosis nahi.", "m": "Astral vs anastral spindle yaad karo.", "s": ["Higher plants mein centrioles absent.", "Animal centrosomes asters banate hain.", "Cell plate plant mechanism hai.", "Plant cells mitosis se hi badhti hain."], "r": "", "w": ["Higher plants mein centrioles nahi hote.", "", "Cell plate plants mein, animals mein furrow.", "Plant mitosis standard spindle-based division hai."], "t": "Lower plants mein centrioles ho sakte hain; 'higher plant' shabd important hai.", "sim": null}, {"id": 81, "tag": "Incorrect finder", "q": "Which of the following statements about telophase of mitosis is NOT correct?", "fig": null, "opt": ["The chromosomes reach the opposite spindle poles.", "The nuclear envelope reforms around the chromosome clusters.", "The chromosomes condense further to become thicker and shorter.", "The nucleolus, Golgi complex and endoplasmic reticulum reappear."], "ans": 2, "c": "Telophase mein chromosomes decondense (patle/lambi chromatin wapas), aur thicken nahi hote. Condensation prophase ka event tha; telophase uska ulta hai.", "m": "Telophase = prophase reversed — jo prophase mein bana woh yahan ulta.", "s": ["Poles par arrival — sahi.", "Envelope reformation — sahi.", "Condensation prophase ka, telophase mein decondensation — C galat.", "Organelle reappearance — sahi."], "r": "", "w": ["Pole arrival telophase tak complete hota hai.", "Envelope reforms — sahi.", "", "Nucleolus/ER/Golgi reappearance sahi event hai."], "t": "Telophase + cytokinesis milke do daughter cells complete karte hain.", "sim": null}, {"id": 82, "tag": "Correct finder", "q": "Select the correct statement about crossing over:", "fig": null, "opt": ["It occurs between sister chromatids of the same chromosome.", "It is catalysed by the enzyme recombinase.", "It takes place during the zygotene stage.", "It leads to identical daughter cells after meiosis."], "ans": 1, "c": "Crossing over non-sister chromatids (homologous pair) ke beech recombinase enzyme se pachytene mein hota hai; genetically different gametes bante hain.", "m": "Enzyme + stage + chromatid type — teeno facts verify karo.", "s": ["Sister chromatids ke beech nahi, non-sister homologs ke beech.", "Recombinase catalyse karta hai.", "Stage pachytene hai, zygotene nahi.", "Variation aata hai, identical cells nahi."], "r": "", "w": ["Exchange non-sister chromatids mein hota hai.", "", "Zygotene pairing ka stage hai.", "Crossing over variation deta hai."], "t": "Recombination nodules pachytene mein hi visible hote hain.", "sim": null}, {"id": 83, "tag": "Match the Columns", "q": "Match the sub-stages of prophase I in Column I with their characteristic events in Column II. Column I: (a) Leptotene (b) Zygotene (c) Diplotene (d) Diakinesis. Column II: (i) Synapsis of homologous chromosomes starts (ii) Compaction of chromosomes and their gradual visibility (iii) Completion of terminalisation of chiasmata (iv) Chiasmata appear and homologs start separating.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iv, c-i, d-iii", "a-iii, b-i, c-iv, d-ii"], "ans": 0, "c": "Leptotene = compaction; zygotene = synapsis; diplotene = chiasmata visible + homolog separation; diakinesis = terminalisation complete.", "m": "L-Z-P-D-D order ke events pin karo.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Leptotene mein synapsis shuru nahi hota.", "Diakinesis ka event iii hai, iv nahi.", "Sequence ulta-pulta wali options galat."], "t": "NEET 2024 ne bhi prophase-I pairing puchi thi — high-weightage area.", "sim": null}, {"id": 84, "tag": "Match the Columns", "q": "Match the structures in Column I with their descriptions in Column II. Column I: (a) Spindle fibre (b) Cell plate (c) Synaptonemal complex (d) Kinetochore. Column II: (i) Structure formed of Golgi-derived vesicles, precursor of the new wall (ii) Disc-shaped structure on the centromere for spindle attachment (iii) Microtubule made of tubulin (iv) Structure that holds paired homologous chromosomes together.", "fig": null, "opt": ["a-iii, b-i, c-iv, d-ii", "a-i, b-iii, c-ii, d-iv", "a-iii, b-iv, c-i, d-ii", "a-iv, b-i, c-iii, d-ii"], "ans": 0, "c": "Spindle = tubulin microtubule; plate = Golgi vesicles se wall precursor; SC = homolog pairing scaffold; kinetochore = centromere ka attachment disc.", "m": "Har structure ka composition/function ek-ek karke match karo.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "Fibre vesicle se nahi banti.", "Kinetochore pairing structure nahi.", "SC microtubule nahi, protein ladder hai."], "t": "Kinetochore protein hai, centromere DNA region — dono confuse mat karo.", "sim": null}, {"id": 85, "tag": "Match the Columns", "q": "Match the stages of meiosis in Column I with the key event occurring in them in Column II. Column I: (a) Anaphase I (b) Anaphase II (c) Telophase I (d) Metaphase II. Column II: (i) Splitting of centromere and separation of sister chromatids (ii) Separation of homologous chromosomes (iii) Alignment of chromosomes at the equator in a haploid cell (iv) Formation of two haploid nuclei at opposite poles.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iii, c-iv, d-i", "a-iv, b-i, c-ii, d-iii"], "ans": 0, "c": "Anaphase-I: homologs separate; anaphase-II: centromere split + chromatids separate; telophase-I: 2 haploid nuclei; metaphase-II: haploid cell mein equatorial alignment.", "m": "Reduction division vs equational division ke events alag karo.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Centromere anaphase-I mein split nahi hota.", "Telophase alignment stage nahi.", "Metaphase-II mein homologs nahi, single chromosomes align hote hain."], "t": "Anaphase-I ke baad har chromosome mein 2 chromatids; anaphase-II ke baad 1.", "sim": null}, {"id": 86, "tag": "Match the Columns", "q": "Match the phenomena in Column I with their examples or locations in Column II. Column I: (a) Amitosis (b) Free nuclear division (c) Mitosis in haploid cells (d) Permanent $G_0$ stage. Column II: (i) Liquid endosperm of coconut (ii) Mature neurons of human beings (iii) Cells of male honey bee (drone) (iv) Bacterial cells.", "fig": null, "opt": ["a-iv, b-i, c-iii, d-ii", "a-i, b-iv, c-ii, d-iii", "a-iv, b-iii, c-i, d-ii", "a-ii, b-i, c-iv, d-iii"], "ans": 0, "c": "Amitosis = bacteria; free nuclear = coconut endosperm; haploid mitosis = drone bee; permanent $G_0$ = neurons.", "m": "Example-based matching — har phenomenon ka signature example yaad karo.", "s": ["a $\\rightarrow$ iv.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iii.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "Endosperm amitosis nahi, syncytium hai.", "Neuron dividing example nahi, $G_0$ hai.", "Drone haploid mitosis karta hai."], "t": "Drone bee n hai par sperm mitosis se banata hai — favourite exception.", "sim": null}, {"id": 87, "tag": "Match the Columns", "q": "Match the types of cell division in Column I with their characteristic nature in Column II. Column I: (a) Mitosis (b) Meiosis I (c) Meiosis II (d) Amitosis. Column II: (i) Direct division without spindle formation (ii) Equational division occurring in a haploid cell (iii) Equational division occurring in a diploid cell (iv) Reductional division.", "fig": null, "opt": ["a-iii, b-iv, c-ii, d-i", "a-ii, b-iv, c-iii, d-i", "a-iii, b-ii, c-iv, d-i", "a-i, b-iv, c-ii, d-iii"], "ans": 0, "c": "Mitosis = diploid (usually) equational; meiosis-I = reductional; meiosis-II = haploid cell mein equational; amitosis = direct spindle-less division.", "m": "Ploidy + equational/reductional do labels saath mein use karo.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ ii.", "d $\\rightarrow$ i."], "r": "", "w": ["", "Mitosis reductional nahi.", "Meiosis-I equational nahi.", "Amitosis spindle-based division nahi."], "t": "Meiosis-II ko 'haploid mitosis' sochna concept clear rakhta hai.", "sim": null}, {"id": 88, "tag": "Match the Columns", "q": "Match the stages of mitosis in Column I with their characteristic events in Column II. Column I: (a) Prophase (b) Metaphase (c) Anaphase (d) Telophase. Column II: (i) Chromatids move towards opposite poles (ii) Initiation of condensation of chromosomal material (iii) Reappearance of nucleolus and nuclear envelope (iv) Alignment of chromosomes at the equatorial plate.", "fig": null, "opt": ["a-ii, b-iv, c-i, d-iii", "a-iv, b-ii, c-i, d-iii", "a-ii, b-i, c-iv, d-iii", "a-iii, b-iv, c-ii, d-i"], "ans": 0, "c": "Prophase condensation start; metaphase alignment; anaphase poleward movement; telophase envelope/nucleolus reappear.", "m": "Chronological order = condensation $\\rightarrow$ alignment $\\rightarrow$ movement $\\rightarrow$ reformation.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Prophase alignment stage nahi.", "Anaphase reformation stage nahi.", "Telophase condensation nahi, decondensation hoti hai."], "t": "Telophase prophase ka mirror image hai — yahi shortcut sabse fast.", "sim": null}, {"id": 89, "tag": "Assertion-Reason", "q": "Assertion (A): The metaphase stage of mitosis is the best stage to study the morphology of chromosomes. Reason (R): At metaphase, the chromosomes are maximally condensed and each is clearly seen as two sister chromatids.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Metaphase chromosomes max condensed aur distinct hote hain (R), isi wajah se morphology study/karyotyping ke liye best stage hai (A). R directly A ka kaaran hai.", "m": "Study-friendly stage ka kaaran = condensation — explanation wali option.", "s": ["Max condensation metaphase par.", "Do chromatids clear dikhte hain.", "Shape/size/count easy.", "R = A ka reason."], "r": "", "w": ["", "R direct explanation hai.", "R sach hai.", "A bhi sach hai."], "t": "Colchicine metaphase arrest isi property ka practical use hai.", "sim": null}, {"id": 90, "tag": "Assertion-Reason", "q": "Assertion (A): Colchicine treatment can induce polyploidy in plant cells. Reason (R): Colchicine inhibits the formation of spindle fibres, so the duplicated chromosomes fail to separate into two nuclei.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Spindle na bane to chromatids to alag ho jate hain par do nuclei nahi bant; saare chromosomes ek hi nucleus mein reh jate hain — chromosome number double (polyploidy). R exact mechanism hai.", "m": "Spindle block $\\rightarrow$ single nucleus with doubled count.", "s": ["Tubulin polymerization blocked.", "Anaphase partitioning fail.", "Chromatids ek nucleus mein retain.", "Ploidy double — R explains A."], "r": "", "w": ["", "R mechanism-level explanation hai.", "R sach hai.", "A bhi sach hai."], "t": "Seedless fruits/wheat breeding mein induced polyploidy ka use hota hai.", "sim": null}, {"id": 91, "tag": "Assertion-Reason", "q": "Assertion (A): Meiosis I is called the reductional division. Reason (R): During anaphase I, the homologous chromosomes separate and go to opposite poles while sister chromatids stay together.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Homologs ke separate hone se har daughter nucleus ko sirf $n$ chromosomes milte hain — number half, isliye reductional. R yahi mechanism batata hai.", "m": "Reduction ka direct cause = homolog separation in anaphase-I.", "s": ["Anaphase-I: homologs apart.", "Sister chromatids joined.", "Daughter nuclei haploid.", "R = A ka reason."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Centromere split nahi hota anaphase-I mein — yahi chromatids joined rehne ka reason.", "sim": null}, {"id": 92, "tag": "Assertion-Reason", "q": "Assertion (A): No DNA replication takes place during interkinesis. Reason (R): The DNA of the cell was already replicated once before the beginning of meiosis I, and the chromosomes still retain two chromatids each.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Meiosis se pehle ek baar replication ho chuki; har chromosome mein abhi 2 chromatids hain, isliye interkinesis mein dobara $S$ phase ki zaroorat nahi. R, A ka logical basis hai.", "m": "One replication, two divisions rule.", "s": ["Pre-meiotic $S$ phase complete.", "Chromosomes already replicated.", "Interkinesis bina $S$ ke.", "R explains A."], "r": "", "w": ["", "R direct explanation hai.", "R sach hai.", "A sach hai."], "t": "Agar interkinesis mein replication hota to meiosis ka DNA-C value chakra hi bigad jata.", "sim": null}, {"id": 93, "tag": "Assertion-Reason", "q": "Assertion (A): In human females, the diplotene stage may last for several years in the primary oocytes. Reason (R): The primary oocytes get arrested in the diplotene stage of prophase I and resume division only from puberty onwards, one at a time in each cycle.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Foetal life mein arrest (dictyate/diplotene) aur puberty tak pause — isi ki wajah se stage saalon tak lamba chalti hai. R, A ki exact wajah hai.", "m": "Arrest timing = long duration ka reason.", "s": ["Primary oocytes foetus mein banti hain.", "Diplotene arrest puberty tak.", "Har month ek resume.", "R explains A."], "r": "", "w": ["", "R causal explanation hai.", "R sach hai.", "A sach hai."], "t": "Second arrest metaphase-II mein hota hai, fertilisation tak — dono mat milao.", "sim": null}, {"id": 94, "tag": "Assertion-Reason", "q": "Assertion (A): Mitosis maintains genetic similarity between the parent cell and the daughter cells. Reason (R): Crossing over and pairing of homologous chromosomes do not take place during mitosis.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Mitosis mein na synapsis, na recombination — replicated genome identical copies mein bat-ta hai, isliye daughters genetically same. R, A ka mechanism hai.", "m": "Variation sources (pairing/crossing over) mitosis mein absent — isliye identical.", "s": ["No synapsis in mitosis.", "No recombination.", "Sister chromatids exact copies.", "Daughters = parent genome."], "r": "", "w": ["", "R mechanism-level reason hai.", "R sach hai.", "A sach hai."], "t": "Mutation ke alawa mitotic daughters clone jaisi hoti hain.", "sim": null}, {"id": 95, "tag": "Diagram/Data", "q": "During anaphase, the shape of a moving chromosome depends on the position of its centromere. A dividing cell shows chromosomes with the centromere situated exactly in the middle and two equal arms, so each chromosome appears V-shaped as it moves towards the pole. Such a chromosome is described as:", "fig": {"k": "stage", "phase": "anaphase", "plant": false, "note2": "Schematic: median centromere chromosomes lead with centromere, arms trail giving a V shape"}, "opt": ["Telocentric", "Acrocentric", "Sub-metacentric", "Metacentric"], "ans": 3, "c": "Metacentric chromosome ka centromere bilkul middle hota hai (equal arms); anaphase mein centromere aage aur dono equal arms peeche trail karti hain — V-shape.", "m": "Centromere position $\\rightarrow$ name $\\rightarrow$ anaphase shape.", "s": ["Median centromere = metacentric.", "Equal arms = V.", "Sub-metacentric = J/L; acrocentric = rod-like; telocentric = I."], "r": "", "w": ["Telocentric: centromere terminal, I-shape.", "Acrocentric: centromere ek end ke paas, rod jaisa.", "Sub-metacentric: thoda off-centre, J/L shape.", ""], "t": "Shape order yaad: V (meta) $\\rightarrow$ L/J (sub-meta) $\\rightarrow$ rod (acro) $\\rightarrow$ I (telo).", "sim": null}, {"id": 96, "tag": "Data-table", "q": "A plant cell has 8 chromosomes in its $G_1$ stage ($2n = 8$). A student records chromosome and chromatid numbers at different stages as given below. Which entry is correct?", "fig": {"k": "table", "head": ["Stage", "Chromosomes", "Chromatids"], "rows": [["G2", "8", "16"], ["Mitotic metaphase", "8", "16"], ["Mitotic anaphase", "16", "16"], ["Daughter cell (end)", "8", "8"]], "cap": "Schematic table: centromere count vs chromatid count"}, "opt": ["$G_2$ stage: 8 chromosomes and 8 chromatids", "Metaphase of mitosis: 16 chromosomes and 16 chromatids", "Anaphase of mitosis: 16 chromosomes and 16 chromatids", "Each daughter cell after cytokinesis: 4 chromosomes and 4 chromatids"], "ans": 2, "c": "Anaphase mein 8 centromeres split hoke 16 ho jate hain — 16 chromosomes, aur ab har chromatid khud chromosome hai to 16 chromatids (single-chromatid count).", "m": "Stage-by-stage centromere/chromatid counting.", "s": ["$G_2$: 8 chr, 16 chromatids — option A 8/8 batata hai, galat.", "Metaphase: 8 chr, 16 chromatids — B 16/16 galat.", "Anaphase: split $\\Rightarrow$ 16/16 — C sahi.", "Daughter: 8/8 — D 4/4 galat."], "r": "", "w": ["$G_2$ mein chromatids 16 hote hain.", "Metaphase tak centromeres 8 hi, chromosomes 16 nahi.", "", "Mitosis number maintain karta hai, daughter 8/8 hota hai."], "t": "Anaphase count temporary double dikhta hai par cytokinesis ke baad har cell $2n$ par wapas.", "sim": null}, {"id": 97, "tag": "Diagram based", "q": "A diagram of a dividing cell shows: nuclear envelope absent, pairs of homologous chromosomes being pulled apart towards opposite poles, each moving chromosome still consisting of two sister chromatids joined at the centromere, and the centromeres have not split. The depicted stage is:", "fig": {"k": "stage", "phase": "anaphase1", "plant": false, "note2": "Schematic: homologs separate, sister chromatids stay joined"}, "opt": ["Anaphase of mitosis", "Anaphase I of meiosis", "Anaphase II of meiosis", "Telophase I of meiosis"], "ans": 1, "c": "Homologous pairs ka alag hona + unsplit centromeres + 2 chromatids per chromosome = anaphase-I. Mitotic/II anaphase mein centromere split hota.", "m": "Do clues combine: homolog separation + no centromere split.", "s": ["Mitotic anaphase: centromere split.", "Anaphase-I: homologs apart, centromere intact.", "Anaphase-II: haploid cell, centromere split.", "Telophase-I: chromosomes poles par, envelope reform."], "r": "", "w": ["Mitotic anaphase mein chromatids alag hote hain.", "", "Anaphase-II mein bhi centromere phat-ta hai.", "Telophase-I mein movement khatam ho chuki hoti hai."], "t": "Reduction yahin hoti hai — isliye meiosis-I reductional.", "sim": null}, {"id": 98, "tag": "Graph/Pie based", "q": "A pie chart represents the duration of the phases of a typical cell cycle. The largest sector, about 95 percent of the chart, is labelled interphase; the remaining small sector represents the $M$ phase. From this data, it can be concluded that:", "fig": {"k": "pie", "slices": [{"n": "Interphase", "pct": 95, "c": "#6cb2ff"}, {"n": "M phase", "pct": 5, "c": "#d8a657"}], "cap": "Schematic pie: interphase dominates the cycle"}, "opt": ["The $M$ phase is the longest phase of the cell cycle", "The cell spends most of its time in interphase", "DNA replication occurs throughout the $M$ phase", "Interphase is a metabolically inactive resting period"], "ans": 1, "c": "$95\\%$ sector interphase ka matlab cell ka zyada tar samay interphase mein bit-ta hai. $M$ phase chhota hai, replication $S$ (interphase) mein hoti hai, aur interphase metabolically active hai.", "m": "Sector size = relative duration.", "s": ["Bada sector = lamba duration.", "Interphase $\\approx 95\\%$.", "$M$ phase short.", "Activity/replication facts accordingly."], "r": "", "w": ["$M$ phase sabse chhota sector hai.", "", "Replication interphase ke $S$ phase mein.", "Interphase active hai, inactive nahi."], "t": "Microscope count mein interphase nuclei sabse zyada milti hain — same logic.", "sim": null}, {"id": 99, "tag": "Data based", "q": "In an onion root tip experiment, a student counts the cells in different stages and records: interphase 120 cells, prophase 40, metaphase 12, anaphase 6, telophase 2 (total 180 cells). Based on the relative duration principle, the percentage of cells found in interphase is approximately:", "fig": {"k": "bar", "ymax": 120, "yaxis": "Cell count", "groups": [{"label": "Interphase", "bars": [{"v": 120, "c": "#6cb2ff"}]}, {"label": "Prophase", "bars": [{"v": 40, "c": "#4caf7d"}]}, {"label": "Metaphase", "bars": [{"v": 12, "c": "#d8a657"}]}, {"label": "Anaphase", "bars": [{"v": 6, "c": "#e06c75"}]}, {"label": "Telophase", "bars": [{"v": 2, "c": "#9aa3b2"}]}], "legend": [{"n": "Cells counted", "c": "#6cb2ff"}], "cap": "Schematic bar chart of the root-tip count data"}, "opt": ["22.2 percent", "33.3 percent", "66.7 percent", "95.0 percent"], "ans": 2, "c": "Relative duration principle: kisi stage mein cells ka fraction = us stage ki duration fraction. Interphase fraction $= 120/180 = 2/3 \\approx 66.7\\%$.", "m": "Percentage = (stage cells $\\div$ total cells) $\\times 100$.", "s": ["Interphase cells $= 120$.", "Total $= 180$.", "$\\dfrac{120}{180} \\times 100 = 66.7\\%$."], "r": "", "w": ["22.2% $\\approx$ prophase fraction ($40/180$).", "33.3% galat ratio hai.", "", "95% textbook approx hai par is dataset ka nahi."], "t": "Dataset-specific calculation hamesha karo; textbook 95% ko blindly mat choose karo.", "sim": null}, {"id": 100, "tag": "Graph based", "q": "A graph plots chromosome number on the Y-axis and the stages of meiosis on the X-axis. The curve starts at the $2n$ level, shows a sharp fall to $n$ after the first nuclear division, remains at $n$ through prophase II and metaphase II, shows a temporary doubling during anaphase II, and finally settles at $n$ in each of the four daughter nuclei. The first sharp fall from $2n$ to $n$ is caused by:", "fig": {"k": "line", "xl": ["Start", "Meiosis I end", "Pro II", "Ana II", "Gametes"], "yl": ["2n", "n"], "ymin": 0, "ymax": 1, "yaxis": "Chromosome number", "series": [{"name": "Chromosomes", "color": "#4caf7d", "pts": [1, 0.5, 0.5, 1, 0.5]}], "mark": {"x": "Meiosis I end", "t": "2n to n"}, "cap": "Schematic graph of chromosome number across meiosis"}, "opt": ["Splitting of centromeres in anaphase II", "Separation of homologous chromosomes during anaphase I", "Crossing over during pachytene", "DNA replication during the $S$ phase"], "ans": 1, "c": "Anaphase-I mein homologs alag hoke opposite poles jate hain; har naye nucleus ko ek set ($n$) milta hai — yahi $2n \\rightarrow n$ drop hai.", "m": "Graph ka first drop = reduction event = anaphase-I.", "s": ["Start: $2n$.", "Anaphase-I: homologs separate.", "Telophase-I nuclei: $n$.", "Baaki events number kam nahi karte."], "r": "", "w": ["Centromere split anaphase-II mein temporary doubling deta hai.", "", "Crossing over DNA amount change nahi karta.", "Replication DNA badalti hai, chromosome number nahi."], "t": "DNA content ka graph alag hota hai ($4C \\rightarrow 2C \\rightarrow C$); chromosome number ka alag — dono compare karte raho.", "sim": null}, {"id": 101, "tag": "Concept MCQ", "q": "The major cell cycle control point at which a cell becomes committed to divide and beyond which it must complete the full cycle, including DNA replication and mitosis, is the:", "fig": null, "opt": ["$G_2/M$ checkpoint", "Spindle assembly checkpoint", "$G_1/S$ checkpoint", "Telophase checkpoint"], "ans": 2, "c": "$G_1/S$ checkpoint (restriction point) par cell size, nutrients, growth signals aur DNA integrity check hote hain. Isse cross karte hi cell $S$ phase mein DNA replicate karne ko committed ho jata hai aur phir cycle complete karna padta hai.", "m": "'Commitment to divide' wali language = restriction point = $G_1/S$.", "s": ["$G_1$ end par decision hota hai.", "Conditions favourable to aage badho.", "$S$ phase entry = irreversible commitment.", "Baaki checkpoints baad ke stages monitor karte hain."], "r": "", "w": ["$G_2/M$ replication ke baad ki checking hai.", "Spindle checkpoint metaphase-anaphase par hai.", "", "Telophase checkpoint naam ka major control point nahi."], "t": "Yeast mein ise 'Start' kehte hain; mammalian cells mein 'restriction point'.", "sim": null}, {"id": 102, "tag": "Direct MCQ", "q": "The key regulatory proteins whose concentration rises and falls in a cyclical manner during the cell cycle, and which activate the cyclin-dependent kinases, are called:", "fig": null, "opt": ["Histones", "Cyclins", "Tubulins", "Chiasmata"], "ans": 1, "c": "Cyclins ki concentration oscillate karti hai (synthesis + degradation); woh CDKs ko bind karke activate karte hain. CDK level stable rehta hai, activity cyclin par depend karti hai.", "m": "'Cyclical' naam se hi cyclin yaad aata hai.", "s": ["CDKs enzyme hain, level constant.", "Cyclin regulatory subunits hain.", "Binding se active complex banta hai.", "Histones/tubulin/chiasmata alag structures hain."], "r": "", "w": ["Histones DNA packaging protein hain.", "", "Tubulin spindle microtubule ka monomer hai.", "Chiasmata crossing over ke marks hain."], "t": "Mitotic cyclin (cyclin B) ka degradation anaphase entry ke liye zaroori hai.", "sim": null}, {"id": 103, "tag": "Concept MCQ", "q": "A cyclin-dependent kinase (CDK) can bring about phosphorylation of target proteins and drive the cell cycle forward only when it is:", "fig": null, "opt": ["Present alone in the cytoplasm in an active form", "Bound to its specific cyclin partner", "Attached to the kinetochore of a chromosome", "Embedded in the nuclear envelope"], "ans": 1, "c": "CDK akela inactive hota hai; cyclin binding uski conformation change karti hai jisse active site khulti hai aur woh target proteins phosphorylate karta hai.", "m": "CDK activity rule: no cyclin, no activity.", "s": ["CDK protein poora cycle bana rehta hai.", "Cyclin aata hai, bind karta hai.", "Active complex phosphorylation karta hai.", "Cyclin degrade hote hi CDK wapas inactive."], "r": "", "w": ["Akela CDK inactive hai.", "", "Kinetochore spindle attachment site hai, CDK activation nahi.", "Envelope par embedding iska mechanism nahi."], "t": "MPF = cyclin B + $\\mathrm{CDK1}$ — sabse famous active complex.", "sim": null}, {"id": 104, "tag": "Concept MCQ", "q": "The $G_2/M$ checkpoint mainly ensures that before a cell enters mitosis:", "fig": null, "opt": ["All chromosomes are properly attached to spindle fibres", "DNA replication is complete and any damaged DNA has been repaired", "The cell has grown to twice its original size only", "The cleavage furrow has been fully formed"], "ans": 1, "c": "$G_2/M$ checkpoint check karta hai ki $S$ phase ka DNA replication poora hua aur damage repair hua ya nahi. Koi bhi unreplicated/broken DNA ho to mitosis entry ruk jati hai.", "m": "Checkpoint ka stage yaad karo: $G_2$ ke baad mitosis, to checking replication ki.", "s": ["Spindle attachment to baad mein (metaphase) check hota hai.", "Replication completeness $G_2/M$ par verify.", "Damage repair na ho to cycle ruka.", "Furrow to cytokinesis ka structure hai."], "r": "", "w": ["Spindle attachment SAC (metaphase-anaphase) ka kaam hai.", "", "Sirf size check nahi, DNA integrity bhi.", "Furrow bahut baad banta hai."], "t": "$\\mathrm{p53}$ jaise proteins damage detect karke checkpoint activate karte hain.", "sim": null}, {"id": 105, "tag": "Concept MCQ", "q": "The spindle assembly checkpoint, which monitors the proper attachment of every kinetochore to spindle fibres and delays anaphase until all attachments are correct, operates at the:", "fig": null, "opt": ["$G_1$ to $S$ transition", "$S$ to $G_2$ transition", "Metaphase to anaphase transition", "Telophase to $G_1$ transition"], "ans": 2, "c": "Spindle assembly checkpoint (SAC) metaphase-anaphase boundary par kaam karta hai. Jab tak har kinetochore dono poles se sahi attach na ho, APC activate nahi hone deta, anaphase ruk jata hai.", "m": "Kinetochore attachment check = metaphase tak ka kaam.", "s": ["Metaphase tak alignment complete.", "Har kinetochore ka attachment verify.", "Sab sahi hote hi anaphase signal.", "$G_1/S$ ka DNA check alag hai."], "r": "", "w": ["$G_1/S$ DNA damage/growth check karta hai.", "$S/G_2$ replication transition hai.", "", "Telophase ke baad interphase aata hai, SAC nahi."], "t": "Ek bhi unattached kinetochore poore anaphase ko rok deta hai — kyunki n+1/n-1 gametes ka risk.", "sim": null}, {"id": 106, "tag": "Direct MCQ", "q": "The failure of homologous chromosomes or sister chromatids to separate properly during cell division, resulting in daughter cells with abnormal chromosome numbers, is called:", "fig": null, "opt": ["Synapsis", "Nondisjunction", "Terminalisation", "Condensation"], "ans": 1, "c": "Nondisjunction = proper separation na hona. Meiosis-I mein homologs ya meiosis-II/mitosis mein sister chromatids fail hote hain, jisse $n+1$ ya $n-1$ cells banti hain (aneuploidy).", "m": "Definition match: 'failure to separate' = nondisjunction.", "s": ["Synapsis pairing hai, failure nahi.", "Nondisjunction anaphase error hai.", "Result: extra/missing chromosome.", "Terminalisation/condensation normal events hain."], "r": "", "w": ["Synapsis normal pairing process hai.", "", "Terminalisation chiasma movement hai.", "Condensation prophase ka normal event hai."], "t": "Trisomy 21 (Down syndrome) nondisjunction ka famous result hai.", "sim": null}, {"id": 107, "tag": "Concept MCQ", "q": "The process in which chromosomes replicate repeatedly inside a nucleus that does not undergo nuclear or cytoplasmic division, leading to a polyploid or polytene condition, is known as:", "fig": null, "opt": ["Amitosis", "Endomitosis (endoreduplication)", "Zygotic meiosis", "Cleavage"], "ans": 1, "c": "Endomitosis/endoreduplication mein baar-baar $S$ phase chalta hai par mitosis/cytokinesis nahi, to ek hi nucleus mein chromosomes ki copies badhti jati hain — polytene chromosomes (Drosophila salivary gland) isi se bante hain.", "m": "Repeated replication without division = endomitosis.", "s": ["Normal cycle: replication + division.", "Endomitosis: replication only, repeat.", "Single nucleus, multiple copies.", "Amitosis mein constriction hota hai."], "r": "", "w": ["Amitosis direct nucleus split hai.", "", "Zygotic meiosis zygote ka reduction division hai.", "Cleavage furrow cytokinesis ka hissa hai."], "t": "Polytene chromosomes par bands puffs dikhte hain — endoreduplication ka classic evidence.", "sim": null}, {"id": 108, "tag": "Direct MCQ", "q": "A multinucleate mass of cytoplasm formed by repeated nuclear divisions (karyokinesis) not followed by cytokinesis is termed a:", "fig": null, "opt": ["Synaptonemal complex", "Coenocyte or syncytium", "Bivalent", "Kinetochore"], "ans": 1, "c": "Karyokinesis repeat par cytokinesis na ho to ek cytoplasm mein kai nuclei — syncytium (animal) ya coenocyte (plant/fungi). Coconut liquid endosperm aur aseptate fungal hyphae examples hain.", "m": "Multinucleate cytoplasm ka naam: syncytium/coenocyte.", "s": ["Nucleus divide hota rehta hai.", "Cytoplasm partition nahi hota.", "Ek cell, multiple nuclei.", "Baaki options single-nucleus structures hain."], "r": "", "w": ["SC meiosis ka pairing scaffold hai.", "", "Bivalent paired homologs hain.", "Kinetochore centromere ka protein disc hai."], "t": "Skeletal muscle bhi multinucleate hai par cell fusion se — exception yaad rakho.", "sim": null}, {"id": 109, "tag": "Numerical", "q": "In a diploid animal cell whose $G_1$ DNA content is $2C$ and chromosome number is $2n$, the correct combination of DNA content and chromosome number at the end of meiosis I (in each daughter cell) is:", "fig": null, "opt": ["$2C$ DNA and $n$ chromosomes", "$4C$ DNA and $2n$ chromosomes", "$C$ DNA and $n$ chromosomes", "$2C$ DNA and $2n$ chromosomes"], "ans": 0, "c": "Meiosis-I ke baad homologs alag hote hain: chromosome number $2n \\rightarrow n$, par har chromosome mein 2 chromatids hain to DNA content $4C$ se ghate bhi $2C$ rehta hai. $C$ aur $n$ to meiosis-II ke baad milte hain.", "m": "Do alag axes: chromosome count (centromere) aur DNA content (C-value).", "s": ["Start: $2n$, $4C$ (replication ke baad).", "Anaphase-I: homologs separate.", "Daughter cell: $n$ chromosomes, har ek 2-chromatid.", "DNA abhi $2C$, meiosis-II mein $C$ hoga."], "r": "", "w": ["", "$4C$, $2n$ to meiosis se pehle ki cell hai.", "$C$, $n$ final gamete ki condition hai (meiosis-II ke baad).", "$2n$ reduction ke baad nahi reh sakta."], "t": "Meiosis-I: number half, DNA abhi double-chromatid; yahi sabse bada counting trap hai.", "sim": null}, {"id": 110, "tag": "Numerical", "q": "If a diploid cell has $2n = 6$ chromosomes in the $G_1$ stage, then immediately after the completion of the $S$ phase, the number of chromosomes and chromatids in that cell will respectively be:", "fig": null, "opt": ["6 and 6", "12 and 12", "6 and 12", "12 and 6"], "ans": 2, "c": "$S$ phase DNA replicate karta hai: har chromosome 2 sister chromatids ban jata hai. Centromere count same (6), chromatids double (12).", "m": "Chromosome = centromere (unchanged); chromatid = doubles.", "s": ["$G_1$: 6 centromeres, 6 chromatids.", "$S$: har centromere par 2 chromatids.", "Chromosomes: 6.", "Chromatids: $6 \\times 2 = 12$."], "r": "", "w": ["6,6 to $G_1$ ki starting condition hai.", "Centromere nahi badle, chromosome 12 nahi hue.", "", "Chromatid double hote hain, reverse impossible."], "t": "Ploidy $2n$ hi rehti hai; sirf DNA content $2C \\rightarrow 4C$.", "sim": null}, {"id": 111, "tag": "Statement-based", "q": "Consider the following statements about cell cycle checkpoints. Statement I: The $G_1/S$ checkpoint assesses cell size, availability of nutrients, growth signals and integrity of DNA. Statement II: The $G_2/M$ checkpoint prevents entry into mitosis if DNA replication is incomplete or DNA is damaged. Statement III: The spindle assembly checkpoint ensures that all kinetochores are correctly attached before anaphase begins. Statement IV: Checkpoints are controlled only by external growth factors and do not involve any intracellular proteins. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Pehle teen checkpoints ke sahi functions hain. IV galat: checkpoints intracellular proteins (cyclins, CDKs, $\\mathrm{p53}$, APC) se chalte hain; external factors sirf modulators hain.", "m": "Control mechanism internal hai — 'only external' wali line turant galat.", "s": ["I: restriction point features sahi.", "II: replication/DNA check sahi.", "III: SAC ka kinetochore role sahi.", "IV: intracellular machinery core hai, galat."], "r": "", "w": ["", "IV galat statement include karta hai.", "I bhi sahi hai jo missing.", "IV galat hai."], "t": "Checkpoint failure = uncontrolled division = cancer ka molecular basis.", "sim": null}, {"id": 112, "tag": "Statement-based", "q": "Consider the following statements about cyclins and cyclin-dependent kinases. Statement I: CDK levels remain roughly constant throughout the cell cycle, whereas cyclin levels oscillate. Statement II: Active cyclin-CDK complexes phosphorylate specific target proteins to drive cycle progression. Statement III: The mitotic cyclin-CDK complex is also referred to as the maturation (mitosis) promoting factor, MPF. Statement IV: Cyclins function as enzymes that directly replicate the DNA during the $S$ phase. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and III", "II, III and IV"], "ans": 2, "c": "CDK constant, cyclin oscillating; complex phosphorylation karta hai; cyclin B-$\\mathrm{CDK1}$ = MPF. Cyclin enzyme nahi hai aur DNA replication DNA polymerase se hoti hai.", "m": "Kaun enzyme hai, kaun regulator — IV ko wahi pakadta hai.", "s": ["I: concentration behaviour sahi.", "II: phosphorylation mechanism sahi.", "III: MPF naming sahi.", "IV: cyclin DNA replicate nahi karta, galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV galat include karta hai."], "t": "MPF hi nuclear envelope breakdown (lamin phosphorylation) trigger karta hai.", "sim": null}, {"id": 113, "tag": "Statement-based", "q": "Consider the following statements about the quiescent ($G_0$) stage. Statement I: Cells enter $G_0$ from the $G_1$ phase by exiting the active cell cycle. Statement II: Cells in $G_0$ remain metabolically active and carry out their specialised functions. Statement III: All cells that enter $G_0$ remain there permanently and can never divide again. Statement IV: Lymphocytes can be stimulated by appropriate signals to leave $G_0$ and re-enter the $G_1$ phase. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and IV", "II, III and IV"], "ans": 2, "c": "$G_0$ entry $G_1$ se hoti hai, metabolism chalti rehti hai, aur sab cells permanent nahi hotin — lymphocytes/hepatocytes wapas cycle mein aa sakti hain. Sirf neurons jaisi terminally differentiated cells permanent rehti hain.", "m": "'All... never' wali absolute statement III galat niklegi.", "s": ["I: exit point $G_1$ — sahi.", "II: active metabolism — sahi.", "III: reversible examples maujood, galat.", "IV: lymphocyte stimulation — sahi."], "r": "", "w": ["III galat hai.", "I missing hai.", "", "III galat include karta hai."], "t": "Permanent $G_0$ = neuron/muscle; facultative $G_0$ = liver/lymphocyte.", "sim": null}, {"id": 114, "tag": "Statement-based", "q": "Consider the following statements about karyokinesis and cytokinesis. Statement I: Karyokinesis is the division of the nucleus and cytokinesis is the division of the cytoplasm. Statement II: Karyokinesis is completed before cytokinesis begins. Statement III: Cytokinesis is always an obligatory step that must follow every karyokinesis. Statement IV: Karyokinesis without cytokinesis results in a multinucleate condition. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "II, III and IV"], "ans": 2, "c": "Definitions sahi, order sahi (pehle nucleus phir cytoplasm), aur bina cytokinesis ke syncytium banta hai. III galat: cytokinesis skip ho sakti hai (free nuclear division, coconut endosperm).", "m": "'Always/obligatory' wali statement ko exception se test karo.", "s": ["I: definitions sahi.", "II: order sahi.", "III: syncytium example isse galat sabit karta hai.", "IV: multinucleate result sahi."], "r": "", "w": ["III galat hai.", "I missing hai.", "", "III galat include karta hai."], "t": "Endosperm mein pehle free nuclei, baad mein cell wall banti hai.", "sim": null}, {"id": 115, "tag": "Statement-based", "q": "Consider the following statements about nondisjunction. Statement I: Nondisjunction can occur during anaphase I if homologous chromosomes fail to separate. Statement II: Nondisjunction can occur during anaphase II if sister chromatids fail to separate. Statement III: It produces gametes with $n+1$ or $n-1$ chromosome numbers. Statement IV: It always results in genetically identical diploid gametes. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and III", "II, III and IV"], "ans": 2, "c": "Nondisjunction dono meiotic anaphases mein ho sakta hai aur gametes ko $n+1$/$n-1$ banata hai. Identical diploid gametes iska result hai hi nahi — aneuploidy hoti hai.", "m": "Outcome count: extra ya missing chromosome, diploid nahi.", "s": ["I: meiosis-I error possible.", "II: meiosis-II error possible.", "III: $n+1$/$n-1$ correct.", "IV: 'always identical diploid' galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Meiosis-I error = chaaro abnormal gametes; meiosis-II error = do abnormal, do normal.", "sim": null}, {"id": 116, "tag": "Statement-based", "q": "Consider the following statements about the counting of chromosomes and chromatids in a $2n = 4$ diploid cell. Statement I: A $G_1$ cell has 4 chromosomes and 4 chromatids. Statement II: A $G_2$ cell has 4 chromosomes and 8 chromatids. Statement III: Each cell after meiosis I has 2 chromosomes and 4 chromatids. Statement IV: Each cell after meiosis II has 2 chromosomes and 2 chromatids. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II, III and IV"], "ans": 3, "c": "Chaaron statements counting rules se sahi hain: $G_1$ unreplicated, $G_2$ replicated (chromosome same, chromatid double), meiosis-I ke baad haploid par 2-chromatid chromosomes, meiosis-II ke baad haploid single-chromatid.", "m": "Har stage par centromere aur DNA molecule dono gino.", "s": ["$G_1$: 4 centromeres, 4 DNA molecules.", "$G_2$: 4 centromeres, 8 DNA molecules.", "After I: 2 centromeres, 4 chromatids.", "After II: 2 centromeres, 2 chromatids."], "r": "", "w": ["II aur IV bhi sahi hain.", "I aur III bhi sahi hain.", "Koi bhi statement galat nahi.", ""], "t": "Final gamete: $n=2$ chromosomes, har ek 1 chromatid, DNA $= C$.", "sim": null}, {"id": 117, "tag": "Statement-based", "q": "Consider the following statements about the changes in DNA content ($C$-value) during meiosis. Statement I: The DNA content is $4C$ in the $G_2$ stage, just before meiosis begins. Statement II: At the end of meiosis I, each daughter nucleus contains $2C$ DNA. Statement III: At the end of meiosis II, each daughter nucleus contains $C$ amount of DNA. Statement IV: DNA replication takes place again during interkinesis, raising the content from $2C$ to $4C$. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "C-value chakra: pre-meiotic $S$ se $4C$, meiosis-I ke baad $2C$, meiosis-II ke baad $C$. Interkinesis mein replication hoti hi nahi, isliye IV galat.", "m": "$4C \\rightarrow 2C \\rightarrow C$ — do division, ek replication.", "s": ["$G_2$: $4C$ sahi.", "Telophase-I: $2C$ sahi.", "Telophase-II: $C$ sahi.", "Interkinesis bina $S$ phase — IV galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Interkinesis mein chromosomes 2-chromatid hi rehte hain, nayi DNA synthesis nahi.", "sim": null}, {"id": 118, "tag": "Statement-based", "q": "Consider the following statements about the centromere and kinetochore. Statement I: The centromere is the constricted region of a chromosome that holds the two sister chromatids together. Statement II: The kinetochore is a disc-shaped protein structure assembled on the centromere. Statement III: Spindle fibres of the spindle apparatus attach to the kinetochores during metaphase. Statement IV: The kinetochore is made of DNA and serves as the site of crossing over. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and III", "I, III and IV"], "ans": 2, "c": "Centromere DNA region hai, kinetochore us par bana protein disc; fibres kinetochore par lagte hain. Crossing over ka site chiasma hai, kinetochore DNA se bana bhi nahi.", "m": "DNA region (centromere) vs protein structure (kinetochore) ka farak.", "s": ["I: centromere definition sahi.", "II: kinetochore protein disc sahi.", "III: attachment site sahi.", "IV: kinetochore protein hai, galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "Har replicated chromosome par do kinetochores bante hain (ek per chromatid side).", "sim": null}, {"id": 119, "tag": "Statement-based", "q": "Consider the following statements comparing plant and animal cell division. Statement I: Asters are formed around the centrosomes in animal cells but are absent in higher plant cells. Statement II: Cytokinesis in animal cells occurs by furrowing, while in plant cells it occurs by cell plate formation. Statement III: The cell plate in plants grows centrifugally, from the centre towards the periphery. Statement IV: The cleavage furrow in animal cells also grows centrifugally, from the centre outwards. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Animal: astral spindle + centripetal furrow; higher plant: anastral spindle + centrifugal cell plate. IV furrow ka direction ulta batata hai (furrow centripetal hota hai).", "m": "Furrow = outside-in; plate = inside-out.", "s": ["I: aster difference sahi.", "II: mechanism difference sahi.", "III: plate direction sahi.", "IV: furrow centripetal hai, galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Direction words (centripetal/centrifugal) NCERT se exact aate hain.", "sim": null}, {"id": 120, "tag": "Statement-based", "q": "Consider the following statements about the significance of mitosis. Statement I: It is restricted to diploid cells in all groups of organisms. Statement II: It helps in the growth of multicellular organisms by increasing the number of cells. Statement III: It restores the nucleo-cytoplasmic ratio as the cell grows. Statement IV: It forms the basis of asexual reproduction in many lower organisms. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II, III and IV", "I, II and IV", "I and IV only"], "ans": 1, "c": "Mitosis haploid cells mein bhi hota hai (plants, drone bee) — I galat. Growth, nucleo-cytoplasmic ratio restoration aur asexual reproduction sab sahi roles hain.", "m": "'Restricted to diploid in all organisms' ko drone/plant examples se todho.", "s": ["I: haploid mitosis examples maujood, galat.", "II: growth role sahi.", "III: ratio restoration sahi.", "IV: asexual reproduction basis sahi."], "r": "", "w": ["I galat hai.", "", "I include karta hai.", "II/III missing hain."], "t": "NCERT: mitosis in both haploid and diploid plant cells; animals mein generally diploid.", "sim": null}, {"id": 121, "tag": "Incorrect finder", "q": "Which of the following statements about the $G_1/S$ checkpoint is NOT correct?", "fig": null, "opt": ["It is also called the restriction point in animal cells.", "It checks whether the DNA is damaged before replication begins.", "A cell that passes this checkpoint is normally committed to complete DNA replication.", "It monitors the attachment of kinetochores to the spindle fibres."], "ans": 3, "c": "Kinetochore-spindle attachment spindle assembly checkpoint (metaphase-anaphase) ka kaam hai, $G_1/S$ ka nahi. Baaki teen restriction point ke sahi features hain.", "m": "Har option ko uske stage se match karo.", "s": ["Restriction point naam sahi.", "Damage check sahi.", "Commitment concept sahi.", "Kinetochore monitoring alag checkpoint hai."], "r": "", "w": ["Restriction point = $G_1/S$ ka doosra naam.", "Pre-replication DNA check yahin hota hai.", "Commitment isi checkpoint ka core idea hai.", ""], "t": "Teen checkpoints ka kaam alag-alag yaad rakho: $G_1/S$, $G_2/M$, SAC.", "sim": null}, {"id": 122, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct with respect to the spindle assembly checkpoint:", "fig": null, "opt": ["It operates at the transition from metaphase to anaphase.", "It delays anaphase until every chromosome is properly attached to spindle fibres from both poles.", "It acts before the beginning of the $S$ phase to check DNA integrity.", "Failure of this checkpoint can lead to unequal distribution of chromosomes."], "ans": 2, "c": "$S$ phase se pehle DNA integrity check $G_1/S$ checkpoint karta hai. SAC ka kaam metaphase-anaphase par attachment verify karna hai; fail hone par nondisjunction/aneuploidy.", "m": "Stage mismatch pakdo: SAC = M phase, $S$ phase nahi.", "s": ["SAC timing sahi statement.", "Attachment condition sahi.", "$S$ phase DNA check alag — C galat.", "Unequal distribution consequence sahi."], "r": "", "w": ["Metaphase-anaphase boundary sahi timing hai.", "Bipolar attachment condition sahi hai.", "", "Nondisjunction risk sahi consequence hai."], "t": "APC isi checkpoint ke green signal ke baad activate hota hai.", "sim": null}, {"id": 123, "tag": "Correct finder", "q": "Which of the following statements about the DNA content and chromosome number during the $S$ phase is correct?", "fig": null, "opt": ["Both the DNA content and the chromosome number double immediately.", "The DNA content doubles but the chromosome number remains unchanged.", "The chromosome number doubles but the DNA content remains unchanged.", "Both the DNA content and chromosome number remain unchanged."], "ans": 1, "c": "$S$ phase mein replication se DNA double ($2C \\rightarrow 4C$) hota hai par sister chromatids ek centromere se jude rehte hain, isliye chromosome number $2n$ unchanged.", "m": "Content vs count: content double, count same.", "s": ["DNA molecules double.", "Centromeres same count.", "Chromosome = centromere count.", "Isliye sirf DNA content double."], "r": "", "w": ["Chromosome number tab double hota hai jab centromere split ho (anaphase).", "", "DNA bina badle chromosome double nahi ho sakta.", "DNA clearly double hota hai."], "t": "Graph mein C-value rise hota hai, chromosome line flat rehti hai.", "sim": null}, {"id": 124, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct about meiosis I:", "fig": null, "opt": ["Homologous chromosomes pair and exchange segments during prophase I.", "The centromere splits during anaphase I.", "Two haploid cells, each with replicated chromosomes, are formed at its end.", "It is the reductional division of meiosis."], "ans": 1, "c": "Anaphase-I mein centromere split nahi hota — homologs alag hote hain, sister chromatids jude rehte hain. Centromere splitting anaphase-II (ya mitotic anaphase) ka event hai.", "m": "Meiosis-I ka sabse tested trap: no centromere split.", "s": ["Pairing + exchange prophase-I sahi.", "Centromere intact anaphase-I — B galat.", "Haploid 2-chromatid cells banti hain.", "Reductional designation sahi."], "r": "", "w": ["Synapsis/crossing over sahi events hain.", "", "Products haploid with 2 chromatids hote hain.", "$2n \\rightarrow n$ reductional hai."], "t": "Centromeric cohesin anaphase-I mein protected rehta hai.", "sim": null}, {"id": 125, "tag": "Correct finder", "q": "Which of the following statements about the bivalent and the tetrad is correct?", "fig": null, "opt": ["A bivalent consists of two homologous chromosomes, and a tetrad refers to its four chromatids.", "A bivalent has two chromatids while a tetrad has two chromosomes.", "The bivalent is formed during diakinesis and the tetrad during leptotene.", "The bivalent is a protein structure and the tetrad is a lipid structure."], "ans": 0, "c": "Bivalent = paired homologous chromosomes ki jodi (2 chromosomes); pachytene mein unke 4 chromatids clearly dikhte hain jinhe tetrad kehte hain. Dono same unit ke do views hain, protein/lipid structures nahi.", "m": "Bivalent count by chromosomes, tetrad count by chromatids.", "s": ["2 homologs pair = bivalent.", "Har homolog 2 chromatid $\\Rightarrow$ total 4 = tetrad.", "Visible pachytene stage mein.", "DNA-protein chromatin structures hain."], "r": "", "w": ["", "Bivalent mein 4 chromatids hote hain, 2 nahi.", "Dono pachytene tak visible, diakinesis/leptotene wale stages galat.", "Ye chromatin structures hain, lipid nahi."], "t": "$2n$ cell mein bivalent count $= n$ hota hai.", "sim": null}, {"id": 126, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct regarding the synaptonemal complex:", "fig": null, "opt": ["It is a tripartite, ladder-like structure formed between paired homologous chromosomes.", "Its formation begins during the zygotene stage.", "It helps in stabilising the pairing of homologous chromosomes and facilitates crossing over.", "It gets dissolved during the leptotene stage before synapsis begins."], "ans": 3, "c": "Synaptonemal complex (SC) zygotene mein banta hai, pachytene tak stable rehkar crossing over support karta hai, aur diplotene ke shuru mein dissolve hota hai. Leptotene mein to pairing shuru bhi nahi hui.", "m": "SC ka timeline: zygotene banao $\\rightarrow$ pachytene use $\\rightarrow$ diplotene todo.", "s": ["Tripartite ladder structure — sahi.", "Assembly zygotene — sahi.", "Pairing stabilisation/crossing over role — sahi.", "Leptotene dissolution impossible, galat."], "r": "", "w": ["Structure description sahi hai.", "Zygotene assembly sahi stage hai.", "Stabilisation role correct hai.", ""], "t": "SC dissolve hote hi chiasmata pehli baar visible hote hain (diplotene).", "sim": null}, {"id": 127, "tag": "Correct finder", "q": "Which of the following statements about the recombination nodule is correct?", "fig": null, "opt": ["It is a structure on the spindle fibre that attaches to the kinetochore.", "It appears during the pachytene stage and marks the site where crossing over occurs.", "It is formed during telophase and helps in nuclear envelope reformation.", "It is identical to the cell plate formed during plant cytokinesis."], "ans": 1, "c": "Recombination nodules pachytene mein SC par bante hain; inhi par recombinase enzyme exchange catalyse karta hai — yaani crossing over ke physical sites.", "m": "Pachytene ka feature = nodules + recombinase + exchange.", "s": ["Spindle/kinetochore alag machinery hai.", "Nodules pachytene marker hain.", "Telophase/cell plate se koi relation nahi."], "r": "", "w": ["Kinetochore par spindle fibre lagti hai, nodule nahi.", "", "Nodules telophase structure nahi.", "Cell plate plant cytokinesis banati hai."], "t": "Nodule ki position hi future chiasma ki position hoti hai.", "sim": null}, {"id": 128, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct about the anaphase of mitosis:", "fig": null, "opt": ["The centromere of each chromosome splits simultaneously.", "The two daughter chromatids, now called daughter chromosomes, travel to opposite poles.", "A sub-metacentric chromosome appears J-shaped during its poleward movement.", "Homologous chromosomes pair up and form chiasmata during this stage."], "ans": 3, "c": "Homolog pairing aur chiasmata sirf meiosis prophase-I mein bante hain; mitotic anaphase mein centromere split hoke chromatids poles par jaate hain. Sub-metacentric J-shape sahi observation hai.", "m": "Mitosis vs meiosis event mix wala option pakdo.", "s": ["Centromere split — sahi.", "Daughter chromosomes poleward — sahi.", "J-shape sub-metacentric — sahi.", "Pairing/chiasmata meiosis-I event, galat."], "r": "", "w": ["Split anaphase ka defining event hai.", "Poleward movement correct hai.", "Shape centromere position se derive hota hai.", ""], "t": "Mitosis mein na synapsis hota hai na recombination — genetic stability isi se aati hai.", "sim": null}, {"id": 129, "tag": "Correct finder", "q": "Which of the following statements about terminalisation of chiasmata is correct?", "fig": null, "opt": ["It is the sliding of chiasmata towards the ends of the homologous chromosomes.", "It begins during the zygotene stage and ends in the pachytene stage.", "It involves the formation of the synaptonemal complex.", "It causes the doubling of DNA content in the cell."], "ans": 0, "c": "Terminalisation = chiasmata ka chromosome arms par slip hoke telomeres (ends) tak pahunchna. Ye diplotene se shuru hoke diakinesis mein complete hota hai; DNA content se iska koi lena-dena nahi.", "m": "Definition word 'sliding towards ends' yaad karo.", "s": ["Chiasmata diplotene mein dikhte hain.", "Terminalisation diakinesis tak chalti hai.", "SC dissolve ho chuka hota hai.", "DNA amount nahi badalta."], "r": "", "w": ["", "Zygotene/pachytene mein terminalisation nahi, wahan pairing/exchange hota hai.", "SC is stage tak dissolve ho chuka hota hai.", "DNA content $S$ phase decide karta hai."], "t": "Diakinesis mein chiasmata sirf tips par dikhte hain — fully terminalised state.", "sim": null}, {"id": 130, "tag": "Incorrect finder", "q": "Select the statement that is NOT correct regarding interkinesis:", "fig": null, "opt": ["It is the short resting period between meiosis I and meiosis II.", "No replication of DNA takes place during this period.", "The chromosomes remain in their replicated, two-chromatid state.", "It is generally much longer than the interphase preceding meiosis I."], "ans": 3, "c": "Interkinesis generally bahut chhota ya almost absent hota hai; pre-meiotic interphase (jisme $S$ phase hota hai) usse kahin lamba hota hai. Baaki teeno statements sahi hain.", "m": "Duration + no-replication — do facts yaad rakho.", "s": ["Gap between I and II — sahi.", "No DNA replication — sahi.", "2-chromatid state — sahi.", "'Longer than interphase' galat."], "r": "", "w": ["Definition sahi hai.", "No-$S$ phase rule sahi hai.", "Chromatids already replicated rehte hain.", ""], "t": "Kayi species mein interkinesis skip-sa hi hota hai, seedha meiosis-II shuru.", "sim": null}, {"id": 131, "tag": "Match the Columns", "q": "Match the checkpoints in Column I with their functions in Column II. Column I: (a) $G_1/S$ checkpoint (b) $G_2/M$ checkpoint (c) Spindle assembly checkpoint. Column II: (i) Checks completion of DNA replication and DNA repair before mitosis (ii) Checks cell size, growth signals and DNA damage before committing to division (iii) Monitors kinetochore-spindle attachment before anaphase.", "fig": null, "opt": ["a-ii, b-i, c-iii", "a-i, b-ii, c-iii", "a-iii, b-i, c-ii", "a-ii, b-iii, c-i"], "ans": 0, "c": "$G_1/S$ = commitment/DNA damage check; $G_2/M$ = replication completion/repair; SAC = kinetochore attachment.", "m": "Har checkpoint ko uske stage ke hisaab se map karo.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iii."], "r": "", "w": ["", "Replication check $G_2/M$ ka kaam hai.", "SAC $G_1/S$ par nahi hota.", "Pairing order galat hai."], "t": "Teen checkpoints = teen transition points: $G_1/S$, $G_2/M$, metaphase-anaphase.", "sim": null}, {"id": 132, "tag": "Match the Columns", "q": "Match the regulatory structures in Column I with their descriptions in Column II. Column I: (a) Cyclin (b) CDK (c) MPF (d) APC. Column II: (i) Enzyme activated by binding with cyclin (ii) Regulatory protein whose level oscillates (iii) Complex that triggers passage through the metaphase-anaphase transition (iv) Active mitotic cyclin-CDK complex that drives entry into $M$ phase.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iv, c-i, d-iii", "a-iv, b-i, c-iii, d-ii"], "ans": 0, "c": "Cyclin oscillating regulator; CDK enzyme jo cyclin se active; MPF = cyclin B + $\\mathrm{CDK1}$; APC protein-degradation machinery jo anaphase transition trigger karti hai.", "m": "Regulator vs enzyme vs active complex vs degradation machine.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Cyclin enzyme nahi, regulator hai.", "MPF khud CDK nahi, complex hai.", "APC MPF nahi, ubiquitination machinery hai."], "t": "APC securin/cyclin B degrade karke chromatid separation allow karta hai.", "sim": null}, {"id": 133, "tag": "Match the Columns", "q": "Match the sub-stages of prophase I in Column I with the chromosome behaviour in Column II. Column I: (a) Zygotene (b) Pachytene (c) Diplotene (d) Diakinesis. Column II: (i) Recombination nodules and crossing over (ii) Assembly of the synaptonemal complex during synapsis (iii) Full condensation and completion of terminalisation (iv) Beginning of separation of homologs and appearance of chiasmata.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-iv, b-i, c-ii, d-iii", "a-ii, b-iii, c-iv, d-i"], "ans": 0, "c": "Zygotene = synapsis/SC; pachytene = nodules/crossing over; diplotene = SC dissolve, chiasmata; diakinesis = terminalisation complete.", "m": "L-Z-P-D-D sequence ke signature events.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ iii."], " rod; telocentric = terminal = I.", "m": "Position $\\rightarrow$ shape sequence yaad karo.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "V-shape sirf metacentric ka hai.", "Telocentric ka centromere terminal hota hai.", "Acrocentric J-shape nahi, rod-like hota hai."], "t": "Centromere aage, arms peeche — shape wahi se banta hai.", "sim": null}, {"id": 136, "tag": "Match the Columns", "q": "Match the event in Column I with the phase in Column II. Column I: (a) DNA content rises from $2C$ to $4C$ (b) Nucleolus and nuclear envelope disappear (c) Centromere splits (d) Cell plate or furrow is formed. Column II: (i) Anaphase (ii) Cytokinesis (iii) $S$ phase (iv) Late prophase.", "fig": null, "opt": ["a-iii, b-iv, c-i, d-ii", "a-i, b-iii, c-iv, d-ii", "a-iii, b-i, c-ii, d-iv", "a-iv, b-iii, c-i, d-ii"], "ans": 0, "c": "DNA doubling $S$ phase; envelope/nucleolus ka gayab hona late prophase; centromere split anaphase; plate/furrow cytokinesis.", "m": "Event ko phase ke signature se jodo.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "Doubling anaphase mein nahi.", "Envelope break $S$ phase mein nahi.", "Furrow prophase ka event nahi."], "t": "Late prophase ko prometaphase-like condition bhi kaha jata hai.", "sim": null}, {"id": 137, "tag": "Assertion-Reason", "q": "Assertion (A): A cell in the $G_2$ phase has twice the amount of DNA compared to a cell in the $G_1$ phase. Reason (R): DNA replication during the $S$ phase doubles the DNA content without changing the chromosome number.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "$S$ phase replication se DNA $2C \\rightarrow 4C$ ho jata hai (R), isliye $G_2$ cell mein $G_1$ se double DNA hota ction ki wajah.", "s": ["Golgi vesicles equator par.", "Fusion se plate banti hai.", "Plate centrifugally expand.", "Future middle lamella."], "r": "", "w": ["", "R mechanism-level reason hai.", "R sach hai.", "A sach hai."], "t": "Animal furrow ulta direction (centripetal) follow karta hai.", "sim": null}, {"id": 140, "tag": "Assertion-Reason", "q": "Assertion (A): Nondisjunction can lead to conditions such as trisomy or monosomy in the offspring. Reason (R): Failure of proper chromosome separation produces gametes carrying one extra or one missing chromosome.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "$n+1$ gamete normal $n$ se mile to trisomy ($2n+1$); $n-1$ wale se monosomy ($2n-1$). R, A ka seedha mechanism hai.", "m": "Gamete aneuploidy $\\rightarrow$ zygote aneuploidy.", "s": ["Separation fail.", "Gametes $n+1$/$n-1$.", "Fertilisation with $n$.", "Trisomy/monosomy banti hai."], "r": "", "w": ["", "R causal explanation hai.", "R sach hai.", "A sach hai."], "t": "Down syndrome ($+21$), Turner ($45,\\mathrm{X}$) isi category ke examples.", "sim": null}, {"id": 141, "tag": "Assertion-Reason", "q": "Assertion (A): The recombination nodules appear during the pachytene stage of prophase I. Reason (R): These nodules are the sites at which the enzyme recombinase mediates crossing over between non-sister chromatids.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Pachytene mein nodules bante hain (A) kyunki exchange ka enzyme machinery inhi par assemble hoti hai (R). R, A ka functional reason hai.", "m": "Structure + uska enzyme role.", "s": ["Nodules pachytene marker.", "Recombinase wahan active.", "Non-sister exchange.", "Chiasma baad mein mark banega."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Chiasmata diplotene mein dikhte hain, exchange pachytene mein hota hai.", "sim": null}, {"id": 142, "tag": "Assertion-Reason", "q": "Assertion (A): Meiosis II is not a reduction division even though it occurs during meiosis. Reason (R): Meiosis II separates the sister chromatids of haploid cells and does not reduce the chromosome number further.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Meiosis-II haploid cell mein equational division hai: chromatids alag hote hain par number $n$ hi rehta hai — reduction nahi. R yahi explain karta hai.", "m": "Reduction ka matlab homolog separation; wo meiosis-I mein ho chuka.", "s": ["Start cell haploid ($n$).", "Centromere split.", "Daughter bhi $n$.", "Isliye equational."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Meiosis-II ko haploid mitosis ki tarah treat karo.", "sim": null}, {"id": 143, "tag": "Numerical", "q": "A diploid cell with $2n = 10$ undergoes complete meiosis. The number of chromosomes and the amount of DNA (relative $C$-value) in each of the four final daughter cells will respectively be:", "fig": {"k": "table", "head": ["Stage", "Chromosomes", "DNA"], "rows": [["G1 (parent)", "10 (2n)", "2C"], ["After meiosis I", "5 (n)", "2C"], ["After meiosis II", "5 (n)", "C"]], "cap": "Schematic table of chromosome and DNA changes"}, "opt": ["10 chromosomes and $2C$ DNA", "5 chromosomes and $C$ DNA", "5 chromosomes and $2C$ DNA", "10 chromosomes and $4C$ DNA"], "ans": 1, "c": "Meiosis-I number half karta hai ($10 \\rightarrow 5$), meiosis-II DNA half karta hai ($2C \\rightarrow C$). Final gamete: $n=5$ chromosomes, $C$ DNA.", "m": "Do alag halvings: number anaphase-I mein, DNA anaphase-II/cytokinesis-II mein.", "s": ["Parent: $2n=10$, $2C$ ($G_1$).", "Replication: $4C$, number same.", "Meiosis-I: $n=5$, $2C$.", "Meiosis-II: $n=5$, $C$."], "r": "", "w": ["10/$2C$ mitotic daughter jaisi condition hai.", "", "5/$2C$ meiosis-I ke baad ki cell hai.", "10/$4C$ $G_2$ parent jaisi hai."], "t": "Final gamete ka formula: chromosomes $n$, DNA $C$.", "sim": null}, {"id": 144, "tag": "Diagram based", "q": "A dividing cell is described as follows: the nuclear envelope has broken down, the chromosomes are fully condensed and lie scattered, each chromosome has two sister chromatids, the spindle is forming, and the chromosomes have not yet reached the equator. The stage is:", "fig": {"k": "stage", "phase": "prophase", "plant": false, "note2": "Schematic: late prophase — envelope breaking, spindle forming, no equatorial alignment yet"}, "opt": ["Early prophase", "Late prophase (prometaphase-like condition)", "Metaphase", "Telophase"], "ans": 1, "c": "Envelope breakdown + condensed scattered chromosomes + forming spindle + equator tak na pahunchna = late prophase (prometaphase jaisi). Early prophase mein envelope intact hota hai; metaphase mein alignment ho chuki.", "m": "Do clues combine: envelope gone + alignment not yet.", "s": ["Early prophase: envelope intact.", "Late prophase: envelope break, spindle form.", "Metaphase: equator aligned.", "Telophase: envelope wapas banta hai."], "r": "", "w": ["Early prophase mein envelope/envelope intact hota hai.", "", "Metaphase tak chromosomes equator par hote hain.", "Telophase poles par reformation stage hai."], "t": "NCERT late prophase ko 'envelope disappearance' wale end point se define karta hai.", "sim": null}, {"id": 145, "tag": "Application", "q": "In an experiment, a cell population is treated with a chemical that blocks the $G_1/S$ checkpoint function even in cells with damaged DNA. The most direct consequence expected in these cells is:", "fig": null, "opt": ["Cells with damaged DNA enter the $S$ phase and replicate the faulty DNA", "The cells permanently stop at metaphase", "Cytokinesis occurs without any nuclear division", "The synaptonemal complex gets assembled in somatic cells"], "ans": 0, "c": "$G_1/S$ checkpoint hi damaged DNA ko $S$ phase mein ghusne se rokta hai. Block ho jaye to faulty DNA replicate hoga, mutations daughter cells mein chala jayega — cancer-prone situation.", "m": "Checkpoint ka normal kaam ulta karke consequence socho.", "s": ["Normal: damage $\\Rightarrow$ cycle ruki.", "Block: no quality gate.", "$S$ phase replication of damaged template.", "Mutations fix/fail."], "r": "", "w": ["", "Metaphase arrest spindle blockers (colchicine) dete hain.", "Cytokinesis-only block alag phenomenon hai.", "SC sirf meiotic germ cells mein banta hai."], "t": "$\\mathrm{p53}$ loss isi checkpoint ko kamzor karta hai — 'guardian of genome' ka title.", "sim": null}, {"id": 146, "tag": "Data-table", "q": "A data table records the DNA content of a diploid cell ($G_1$ value $= 2C$) at four stages. Stage 1: $2C$ DNA, chromosomes with one chromatid each. Stage 2: $4C$ DNA, chromosomes with two chromatids each. Stage 3: $2C$ DNA in each of two cells, $n$ chromosomes with two chromatids each. Stage 4: $C$ DNA in each of four cells, $n$ chromosomes with one chromatid each. The correct sequence representing $G_1$, $G_2$, the end of meiosis I and the end of meiosis II respectively is:", "fig": {"k": "table", "head": ["Stage", "DNA", "Chromosomes/chromatids"], "rows": [["Stage 1", "2C", "2n, 1 chromatid each"], ["Stage 2", "4C", "2n, 2 chromatids each"], ["Stage 3", "2C (x2 cells)", "n, 2 chromatids each"], ["Stage 4", "C (x4 cells)", "n, 1 chromatid each"]], "cap": "Schematic data table of the four described stages"}, "opt": ["Stage 1, Stage 2, Stage 3, Stage 4", "Stage 2, Stage 1, Stage 4, Stage 3", "Stage 1, Stage 3, Stage 2, Stage 4", "Stage 4, Stage 2, Stage 3, Stage 1"], "ans": 0, "c": "Stage 1 = $G_1$ ($2C$, 1 chromatid); Stage 2 = $G_2$ ($4C$, 2 chromatids); Stage 3 = meiosis-I end ($n$, $2C$, 2 chromatids); Stage 4 = meiosis-II end ($n$, $C$, 1 chromatid).", "m": "C-value aur chromatid count dono columns match karo.", "s": ["$2C$/1-chromatid = $G_1$.", "$4C$/2-chromatid = $G_2$.", "$n$/2-chromatid/$2C$ = post-I.", "$n$/1-chromatid/$C$ = post-II."], "r": "", "w": ["", "Stage 2 $G_1$ nahi ho sakta (DNA $4C$).", "Stage 3 replicated chromatids ke saath hai, $G_1$ nahi.", "Stage 4 final gamete hai, starting stage nahi."], "t": "$C$-value aur chromatid number dono ek saath verify karna confusion khatam karta hai.", "sim": null}, {"id": 147, "tag": "Graph based", "q": "A graph plots the concentration of a mitotic cyclin (Y-axis) against the phases of the cell cycle (X-axis). The curve is nearly zero during $G_1$, rises steadily through $S$ and $G_2$, peaks at the $G_2$ to $M$ transition, and then drops sharply near the end of mitosis. The sharp drop in cyclin concentration is most directly associated with:", "fig": {"k": "line", "xl": ["G1", "S", "G2", "M (late)"], "yl": ["High", "Low"], "ymin": 0, "ymax": 1, "yaxis": "Cyclin level", "series": [{"name": "Mitotic cyclin", "color": "#d8a657", "pts": [0.05, 0.45, 1, 0.08]}], "mark": {"x": "M (late)", "t": "sharp drop"}, "cap": "Schematic cyclin oscillation curve"}, "opt": ["The start of DNA replication", "Targeted degradation of the cyclin near the metaphase-anaphase transition", "Reassembly of the nuclear envelope", "Formation of the synaptonemal complex"], "ans": 1, "c": "APC cyclin B ko ubiquitinate karke degrade karwata hai metaphase-anaphase ke aas-paas; isi se MPF activity girti hai aur anaphase/exit possible hota hai. Graph ka sharp drop yahi degradation hai.", "m": "Oscillation ka girna = protein destruction, synthesis nahi.", "s": ["Cyclin $G_1$ mein low.", "Accumulation $S$/$G_2$ mein.", "Peak = MPF active.", "APC-mediated drop anaphase transition par."], "r": "", "w": ["Replication $S$ phase event hai, drop nahi.", "", "Envelope reassembly cyclin girne ka kaaran nahi, conseq
