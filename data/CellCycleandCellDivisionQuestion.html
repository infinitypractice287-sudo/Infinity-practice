uence phase hai.", "SC meiosis ka structure hai."], "t": "Cyclin synthesis se activation, degradation se inactivation — dono milke oscillation banate hain.", "sim": null}, {"id": 148, "tag": "Bar graph", "q": "A bar graph shows the number of chromosomes (solid bars) and chromatids (hatched bars) in a $2n = 8$ cell at different stages. Group P: 8 chromosomes, 8 chromatids. Group Q: 8 chromosomes, 16 chromatids. Group R: 16 chromosomes, 16 chromatids. Group S: 4 chromosomes, 8 chromatids (per cell). The groups representing $G_1$, $G_2$, mitotic anaphase and a cell after meiosis I respectively are:", "fig": {"k": "bar", "ymax": 16, "yaxis": "Count", "groups": [{"label": "P", "bars": [{"v": 8, "c": "#6cb2ff"}]}, {"label": "Q", "bars": [{"v": 16, "c": "#4caf7d"}]}, {"label": "R", "bars": [{"v": 16, "c": "#d8a657"}]}, {"label": "S", "bars": [{"v": 8, "c": "#e06c75"}]}], "legend": [{"n": "Chromosomes/chromatids", "c": "#6cb2ff"}], "cap": "Schematic bars: P 8/8, Q 8/16, R 16/16, S 4/8"}, "opt": ["P, Q, R, S", "Q, P, S, R", "P, R, Q, S", "S, Q, R, P"], "ans": 0, "c": "P ($8/8$) = $G_1$; Q ($8/16$) = $G_2$ (replicated); R ($16/16$) = anaphase (split centromeres); S ($4/8$) = meiosis-I ke baad ($n$ chromosomes, 2 chromatids each).", "m": "Centromere count = chromosomes; DNA molecules = chromatids.", "s": ["$G_1$: unreplicated $\\Rightarrow$ P.", "$G_2$: same centromeres, double chromatids $\\Rightarrow$ Q.", "Anaphase: 16 centromeres, 16 single chromatids $\\Rightarrow$ R.", "Post-meiosis-I: $n=4$, 8 chromatids $\\Rightarrow$ S."], "r": "", "w": ["", "Q replicated hai, $G_1$ nahi.", "R anaphase hai, $G_2$ nahi.", "S reduced cell hai, starting nahi."], "t": "Anaphase ka temporary doubling sirf ek cell ke andar hota hai; cytokinesis ke baad $2n$ wapas.", "sim": null}, {"id": 149, "tag": "Application/Numerical", "q": "A gamete-forming cell undergoes meiosis, but during anaphase I one homologous pair fails to separate, while all other pairs behave normally. If the parent cell was $2n = 8$, the chromosome numbers in the two cells formed after meiosis I will be:", "fig": {"k": "table", "head": ["Cell", "Expected", "After nondisjunction"], "rows": [["Cell 1", "4", "5"], ["Cell 2", "4", "3"]], "cap": "Schematic: one pair moves together into the same pole"}, "opt": ["4 and 4", "5 and 3", "8 and 0", "6 and 2"], "ans": 1, "c": "Normal case mein dono cells ko 4-4 milte. Ek pair fail hoke ek hi pole chala jata hai: ek cell ko ek extra (5), doosre ko ek kam (3).", "m": "$n+1$ aur $n-1$ wala split calculate karo.", "s": ["Normal: $8/2 = 4$ per cell.", "Failed pair dono ek taraf.", "Recipient: $4+1 = 5$.", "Other: $4-1 = 3$."], "r": "", "w": ["4/4 normal separation hota.", "", "8/0 tab hota agar saare pairs ek taraf jayein.", "6/2 do pairs fail hone par banta."], "t": "Aage meiosis-II normal chale to gametes: do $n+1=5$, do $n-1=3$.", "sim": null}, {"id": 150, "tag": "Diagram based", "q": "A researcher studies a tissue and notes: no asters around the poles, a line of vesicles appearing at the equator and fusing to form a plate growing outwards, and a new wall being laid down between two daughter nuclei. This tissue belongs to:", "fig": {"k": "plate", "cap": "Schematic: anastral plant cell division with outward-growing cell plate"}, "opt": ["An animal, showing cleavage furrow cytokinesis", "A higher plant, showing cell plate cytokinesis", "An animal, undergoing amitosis", "A bacterium, undergoing binary fission"], "ans": 1, "c": "Anastral spindle + vesicle line + centrifugal plate + nayi wall = higher plant cell cytokinesis. Animal mein furrow/asters hote; bacteria prokaryotic fission karte hain.", "m": "Teen plant-specific markers ek saath: no aster, vesicles, cell plate.", "s": ["No asters $\\Rightarrow$ higher plant.", "Vesicles equator par $\\Rightarrow$ plate.", "Outward growth + new wall confirm.", "Animal/bacteri mechanisms alag."], "r": "", "w": ["Animal furrow banata, plate nahi.", "", "Amitosis spindle-less direct split hai.", "Binary fission prokaryote process hai, wall-plate nahi."], "t": "Phragmoplast (microtubule + vesicle scaffold) isi plate ko guide karta hai.", "sim": null}, {"id": 151, "tag": "Direct MCQ", "q": "The complete disintegration of the nuclear envelope, which allows the chromosomes to spread through the cytoplasm and get attached to spindle fibres, marks the beginning of which stage of mitosis?", "fig": null, "opt": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "ans": 1, "c": "NCERT ke hisaab se nuclear envelope ka poora disintegration metaphase ki shuruaat hai; ab chromosomes cytoplasm mein freely spindle fibres se attach hoke equator par align karte hain.", "m": "Stage boundary event: envelope gone = metaphase start.", "s": ["Prophase: condensation + envelope break start.", "Full disintegration: metaphase start.", "Anaphase: split; telophase: envelope reform."], "r": "", "w": ["Prophase mein break shuru hota hai, complete nahi.", "", "Anaphase tak envelope pehle se gayab hota hai.", "Telophase mein envelope wapas banta hai."], "t": "'Start of metaphase = complete disintegration' — exact NCERT line.", "sim": null}, {"id": 152, "tag": "Direct MCQ", "q": "Colchicine, the commonly used mitotic inhibitor that arrests dividing cells at metaphase, is obtained from which of the following plants?", "fig": null, "opt": ["Colchicum autumnale", "Allium cepa", "Nicotiana tabacum", "Pisum sativum"], "ans": 0, "c": "Colchicine Colchicum autumnale (autumn crocus, family Liliaceae) se milta hai. Ye tubulin bind karke spindle assembly rok deta hai.", "m": "Chemical $\\leftrightarrow$ source plant yaad karo.", "s": ["Colchicine = Colchicum.", "Vincristine/vinblastine = Catharanthus.", "Onion/tobacco/pea experimental plants hain."], "r": "", "w": ["", "Allium cepa onion hai, root tip experiment use hota hai.", "Nicotiana tobacco hai.", "Pisum pea (Mendel) hai."], "t": "Vinca alkaloids ka source Catharanthus roseus (Madagascar periwinkle) hai — dono sources compare karke yaad rakho.", "sim": null}, {"id": 153, "tag": "Direct MCQ", "q": "During the complete process of meiosis, how many cycles of DNA replication and how many nuclear divisions take place respectively?", "fig": null, "opt": ["Two cycles of DNA replication and one nuclear division", "One cycle of DNA replication and two nuclear divisions", "Two cycles of DNA replication and two nuclear divisions", "One cycle of DNA replication and one nuclear division"], "ans": 1, "c": "Meiosis ka defining rule: ek hi baar DNA replication (pre-meiotic $S$ phase), phir do nuclear divisions (meiosis-I aur II), output 4 haploid cells.", "m": "'1 replication : 2 divisions' ratio rat-lo.", "s": ["$S$ phase sirf ek baar.", "Interkinesis mein replication nahi.", "Do divisions $\\Rightarrow$ 4 cells."], "r": "", "w": ["Do replication se ploidy pattern bigad jata.", "", "Ek division do-nuclei (mitosis) deta hai.", "2:2 replication division meiosis nahi hai."], "t": "Isi rule ki wajah se interkinesis mein $S$ phase nahi hota.", "sim": null}, {"id": 154, "tag": "Direct MCQ", "q": "In meiosis, the splitting of the centromere and separation of sister chromatids takes place during:", "fig": null, "opt": ["Anaphase I", "Telophase I", "Anaphase II", "Metaphase I"], "ans": 2, "c": "Anaphase-II mein centromere split hoke sister chromatids alag hoti hain — bilkul mitotic anaphase jaisa. Anaphase-I mein sirf homologs alag hote hain.", "m": "Centromere split = mitotic anaphase ya anaphase-II.", "s": ["Anaphase-I: homologs apart, centromere intact.", "Metaphase-I: bivalent alignment.", "Anaphase-II: centromere split."], "r": "", "w": ["Anaphase-I centromere nahi phat-ta.", "Telophase-I envelope reformation stage hai.", "", "Metaphase-I mein splitting hoti hi nahi."], "t": "Sirf do jagah centromere split: mitotic anaphase aur anaphase-II.", "sim": null}, {"id": 155, "tag": "Numerical", "q": "A normal human somatic cell ($2n = 46$) at the end of the $G_2$ phase contains:", "fig": null, "opt": ["46 chromosomes and 92 chromatids", "92 chromosomes and 92 chromatids", "46 chromosomes and 46 chromatids", "23 chromosomes and 46 chromatids"], "ans": 0, "c": "$G_2$ tak replication ho chuki: har chromosome 2 chromatids ka, par centromere 46 hi. Isliye 46 chromosomes, 92 chromatids.", "m": "Chromosome = centromere count; chromatid = double after $S$.", "s": ["$G_1$: 46/46.", "$S$: DNA double.", "$G_2$: 46 centromeres, 92 chromatids."], "r": "", "w": ["", "92 chromosomes tab honge jab centromere split ho (anaphase).", "46/46 $G_1$ condition hai.", "23 chromosomes gamete mein hote hain."], "t": "Human cell ka DNA content $G_2$ mein $4C$ hota hai.", "sim": null}, {"id": 156, "tag": "Numerical", "q": "How many meiotic divisions are required to produce 800 functional male gametes in a flowering plant?", "fig": null, "opt": ["800", "400", "200", "100"], "ans": 2, "c": "Ek microspore mother cell ek meiosis se 4 pollen banata hai; har pollen mitosis se 2 male gametes deta hai — yaani ek meiotic division effectively 4 functional male gametes (pollen units) deti hai. $800/4 = 200$ meiotic divisions.", "m": "Male side: 1 meiosis = 4 pollen (gamete precursors).", "s": ["1 meiosis $\\rightarrow$ 4 microspores.", "$800 \\div 4 = 200$.", "Female side hota to 1 meiosis = 1 functional egg."], "r": "", "w": ["800 divisions female-side logic hai (har egg ke liye ek meiosis).", "400 galat ratio hai; ye 2-products assumption se aata.", "", "100 bhi galat count hai, 8-products wali galti se."], "t": "Seeds ke sawaal mein male + female dono count karne padte hain; yahan sirf male gametes hai.", "sim": null}, {"id": 157, "tag": "Numerical", "q": "Starting from a single cell, how many successive mitotic divisions are needed to produce 256 cells?", "fig": null, "opt": ["7", "8", "16", "256"], "ans": 1, "c": "Har mitotic division cells double: $2^n = 256$. $2^8 = 256$, isliye 8 divisions.", "m": "Power of two rule.", "s": ["$2^7 = 128$.", "$2^8 = 256$.", "Answer 8."], "r": "", "w": ["7 divisions se 128 cells banti.", "", "16 divisions se 65536 cells.", "256 divisions bahut zyada hain."], "t": "Formula $n = \\log_2(\\text{cells})$ jab har cell divide kare.", "sim": null}, {"id": 158, "tag": "Numerical", "q": "In human females, how many meiotic divisions are required for the formation of 200 functional ova (eggs)?", "fig": null, "opt": ["50", "100", "200", "400"], "ans": 2, "c": "Oogenesis mein ek oocyte ki ek meiosis se sirf ek functional ovum banta hai (baaki 3 polar bodies degenerate). Isliye 200 ova $\\Rightarrow$ 200 meiotic divisions.", "m": "Female asymmetry: 1 meiosis = 1 functional egg.", "s": ["Primary oocyte $\\rightarrow$ 1 ovum + polar bodies.", "200 ova chahiye.", "Divisions = 200."], "r": "", "w": ["50 male-side 4-products logic hai, oogenesis par lagu nahi.", "100 bhi galat hai, har ovum ke liye alag meiosis chahiye.", "", "400 double count hai, polar bodies functional eggs nahi."], "t": "Male 4 functional products, female 1 — yahi difference trick hai.", "sim": null}, {"id": 159, "tag": "Concept MCQ", "q": "In a diploid somatic cell ($G_1$ DNA $= 2C$), the maximum amount of DNA per cell during the entire cell cycle is reached in the:", "fig": null, "opt": ["$G_1$ phase", "$S$ phase", "$G_2$ phase", "$G_0$ phase"], "ans": 2, "c": "$S$ phase ke end tak DNA $4C$ ho jata hai aur poora $G_2$ (aur prophase/metaphase) tak $4C$ hi rehta hai. Maximum level $G_2$ mein sustained milta hai; $G_0/G_1$ mein $2C$.", "m": "C-value peak $= 4C$, jo post-$S$ phases mein hai.", "s": ["$G_1$: $2C$.", "$S$: $2C \\rightarrow 4C$ (transition).", "$G_2$: full $4C$."], "r": "", "w": ["$G_1$ minimum diploid level hai.", "$S$ transition hai, peak nahi.", "", "$G_0$ $2C$ par non-dividing hai."], "t": "Cytokinesis ke baad per-cell DNA wapas $2C$.", "sim": null}, {"id": 160, "tag": "Concept MCQ", "q": "Which of the following groups of cells in the human body most commonly remains permanently arrested in the $G_0$ stage and does not divide again?", "fig": null, "opt": ["Skin epidermal cells and bone marrow cells", "Mature neurons and skeletal muscle cells", "Liver cells and lymphocytes", "Germinal epithelial cells of the gonads"], "ans": 1, "c": "Mature neurons aur skeletal muscle cells terminally differentiated hain — permanent $G_0$, inka division capacity khatam. Skin/marrow/germinal cells continuously divide; liver/lymphocytes reversible $G_0$.", "m": "Permanent $G_0$ = terminally differentiated cells.", "s": ["Neurons: no centriole division.", "Muscle: post-mitotic.", "Liver/lymphocyte wapas cycle mein aa sakte."], "r": "", "w": ["Skin/bone marrow actively dividing hain.", "", "Liver/lymphocyte facultative $G_0$ hain.", "Germinal cells gametes banati rehti hain."], "t": "Brain/spinal injury repair mushkil isi permanent $G_0$ ki wajah se hai.", "sim": null}, {"id": 161, "tag": "Direct MCQ", "q": "A bivalent (pair of homologous chromosomes) during the pachytene stage of prophase I consists of:", "fig": null, "opt": ["Two chromatids in total", "Three chromatids in total", "Four chromatids in total", "Eight chromatids in total"], "ans": 2, "c": "Bivalent = 2 homologous chromosomes; har chromosome 2 sister chromatids ka, total $2 \\times 2 = 4$ chromatids — isiliye ise tetrad bhi kehte hain.", "m": "Bivalent count chromosomes se, tetrad count chromatids se.", "s": ["2 homologs pair.", "Har ek replicated (2 chromatids).", "Total 4 chromatids."], "r": "", "w": ["2 chromatid unreplicated chromosome jaisa hota.", "3 chromatid structure possible nahi.", "", "8 chromatid do bivalents ka count hai."], "t": "$2n$ cell mein pachytene par bivalent count $= n$.", "sim": null}, {"id": 162, "tag": "Direct MCQ", "q": "The stage of prophase I at which the chiasmata are seen fully terminalised and the homologous chromosomes remain attached only at their ends is:", "fig": null, "opt": ["Zygotene", "Pachytene", "Diplotene", "Diakinesis"], "ans": 3, "c": "Diakinesis (last sub-stage) mein terminalisation complete ho jati hai; chiasmata sirf chromosome ends par bachte hain, chromosomes fully condensed, envelope break hone lagta hai.", "m": "'Fully terminalised' keyword = diakinesis.", "s": ["Diplotene: chiasmata visible, terminalisation shuru.", "Diakinesis: terminalisation complete.", "Ends par attachment bachi."], "r": "", "w": ["Zygotene pairing stage hai.", "Pachytene exchange stage hai.", "Diplotene mein chiasmata abhi middle mein bhi ho sakte.", ""], "t": "Diakinesis ke baad metaphase-I shuru.", "sim": null}, {"id": 163, "tag": "Statement-based", "q": "Consider the following statements about the events of prophase I. Statement I: In leptotene, chromosomes undergo gradual compaction and become visible under the light microscope as thin threads. Statement II: In zygotene, homologous chromosomes start pairing and the synaptonemal complex begins to form. Statement III: In pachytene, recombination nodules appear and crossing over occurs between non-sister chromatids. Statement IV: In diplotene, terminalisation of chiasmata is completed and the nuclear envelope breaks down. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "I, III and IV"], "ans": 0, "c": "Pehle teen bilkul sahi sequence ke events hain. IV galat: terminalisation complete aur envelope breakdown diakinesis mein hota hai, diplotene mein nahi — diplotene mein chiasmata abhi-ABHI visible hote hain.", "m": "5 sub-stages ki timeline se IV ko reject karo.", "s": ["Leptotene compaction — sahi.", "Zygotene synapsis/SC — sahi.", "Pachytene nodules/exchange — sahi.", "Diplotene events IV mein diakinesis wale diye — galat."], "r": "", "w": ["", "IV galat include karta hai.", "I missing hai.", "II bhi sahi statement missing hai."], "t": "Diplotene = SC dissolve + chiasmata first seen; diakinesis = terminalisation complete.", "sim": null}, {"id": 164, "tag": "Statement-based", "q": "Consider the following statements about the molecular regulation of the cell cycle. Statement I: Cyclin-dependent kinases remain enzymatically inactive unless bound to their appropriate cyclin partners. Statement II: The concentration of cyclins oscillates during the cycle while CDK levels remain relatively stable. Statement III: Active cyclin-CDK complexes phosphorylate target proteins to push the cell into the next phase. Statement IV: The tumour suppressor protein $\\mathrm{p53}$ promotes rapid progression through the cycle by directly activating all cyclin-dependent kinases. Which of the above statements are correct?", "fig": null, "opt": ["I and IV only", "II and III only", "I, II and III", "II, III and IV"], "ans": 2, "c": "CDK-cyclin activation, oscillation aur phosphorylation — I, II, III sahi. IV galat: $\\mathrm{p53}$ cycle ko halt karta hai DNA damage par (CDK activate nahi, balki arrest/apoptosis trigger).", "m": "$\\mathrm{p53}$ ka role brake hai, accelerator nahi.", "s": ["CDK needs cyclin — sahi.", "Cyclin oscillates — sahi.", "Phosphorylation mechanism — sahi.", "$\\mathrm{p53}$ = guardian, halts cycle — IV galat."], "r": "", "w": ["IV galat hai.", "I missing hai.", "", "IV include karta hai."], "t": "$\\mathrm{p53}$ mutation = checkpoint failure = cancer.", "sim": null}, {"id": 165, "tag": "Statement-based", "q": "Consider the following statements comparing mitosis and meiosis. Statement I: Mitosis involves one division cycle and produces two diploid daughter cells, whereas meiosis involves two division cycles and produces four haploid cells. Statement II: Pairing of homologous chromosomes and chiasmata formation are exclusive to meiosis. Statement III: The centromere splits during anaphase of mitosis and anaphase II of meiosis, but not during anaphase I. Statement IV: Both mitosis and meiosis are preceded by replication of DNA during the $S$ phase. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Chaaron statements standard NCERT comparisons hain — sab sahi: division count, exclusive meiosis events, centromere split timing aur pre-division replication.", "m": "Har statement ko dono divisions ke table se verify karo.", "s": ["I: product count sahi.", "II: synapsis/chiasmata meiosis-only.", "III: split timing sahi.", "IV: ek $S$ phase dono se pehle."], "r": "", "w": ["Koi statement galat nahi.", "II/IV missing hain.", "I/III bhi sahi hain.", ""], "t": "Ye 4 points likh ke table bana lo, almost har comparison question inhi se banta hai.", "sim": null}, {"id": 166, "tag": "Statement-based", "q": "Consider the following statements about the $C$-value in a diploid cell whose $G_1$ content is $2C$. Statement I: The DNA content becomes $4C$ at the end of the $S$ phase. Statement II: The DNA content of a cell in metaphase of mitosis is $4C$. Statement III: Each daughter nucleus at the end of meiosis I contains $2C$ DNA. Statement IV: Each daughter nucleus at the end of meiosis II contains $C$ amount of DNA. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "$S$ ke end $4C$; mitotic metaphase tak $4C$; meiosis-I end $2C$; meiosis-II end $C$ — chaaron levels correct hain.", "m": "C-value chakra: $2C \\rightarrow 4C \\rightarrow 2C \\rightarrow C$.", "s": ["Replication doubles.", "Cytokinesis-I halves per cell.", "Cytokinesis-II halves again.", "Saari statements match."], "r": "", "w": ["Sab sahi hain, koi reject nahi.", "I/III bhi verify ho chuke.", "II bhi sahi ($4C$ metaphase).", ""], "t": "Chromosome count ka alag chakra ($2n \\rightarrow n$) isse mix mat karo.", "sim": null}, {"id": 167, "tag": "Statement-based", "q": "Consider the following statements about cytokinesis in plant and animal cells. Statement I: In animal cells, a cleavage furrow appears and deepens centripetally to divide the cytoplasm. Statement II: In plant cells, the cell plate grows centrifugally from the centre towards the existing lateral walls. Statement III: The cell plate represents the middle lamella between the walls of the two future daughter cells. Statement IV: The cleavage furrow is formed by the fusion of Golgi-derived vesicles at the equator. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Furrow centripetal (actin ring), plate centrifugal (Golgi vesicles), plate = future middle lamella — I, II, III sahi. IV galat: Golgi vesicles se cell plate banti hai, furrow actin-myosin ring se.", "m": "Vesicles = plate (plant); ring = furrow (animal).", "s": ["Furrow direction — sahi.", "Plate direction — sahi.", "Middle lamella fate — sahi.", "Vesicle-furrow mixing — IV galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Phragmoplast plant mein vesicles ko equator par organise karta hai.", "sim": null}, {"id": 168, "tag": "Statement-based", "q": "Consider the following statements about nondisjunction in a human germ cell. Statement I: Nondisjunction during meiosis I means the two homologous chromosomes of a pair fail to separate. Statement II: Nondisjunction during meiosis II means the sister chromatids fail to separate. Statement III: It can produce gametes with $n+1$ or $n-1$ chromosome numbers. Statement IV: Fertilisation involving such a gamete can result in a zygote that is trisomic or monosomic for that chromosome. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II, III and IV"], "ans": 3, "c": "Chaaron statements nondisjunction ki complete mechanism + consequences hain — sab sahi.", "m": "Do error types ($I$ vs $II$) + gamete count + zygote condition.", "s": ["Meiosis-I error: homologs stuck.", "Meiosis-II error: chromatids stuck.", "Gametes $n\\pm1$.", "Zygote $2n\\pm1$."], "r": "", "w": ["Sab correct hain.", "Koi adhura nahi.", "III/IV bhi sahi consequences hain.", ""], "t": "Turner ($45,\\mathrm{X}$) monosomy, Down ($+21$) trisomy — clinical links.", "sim": null}, {"id": 169, "tag": "Statement-based", "q": "Consider the following statements about amitosis and free nuclear division. Statement I: Amitosis is a direct division in which the nucleus constricts without formation of a spindle or distinct chromosomes. Statement II: Amitosis is the characteristic mode of division in prokaryotic cells such as bacteria. Statement III: Free nuclear division involves repeated karyokinesis without cytokinesis, producing a syncytium. Statement IV: The liquid endosperm of coconut is an example of a multinucleate syncytium formed this way. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Amitosis (direct, prokaryotes) aur free nuclear division (syncytium, coconut) — chaaron facts sahi hain.", "m": "Do alag phenomena: direct split vs repeated nuclear division.", "s": ["No spindle/chromosomes — sahi.", "Bacteria example — sahi.", "Karyokinesis without cytokinesis — sahi.", "Coconut example — sahi."], "r": "", "w": ["Sab sahi hain.", "Koi galat nahi.", "I/II bhi correct hain.", ""], "t": "Bacterial binary fission ko amitosis-type direct division mana jata hai.", "sim": null}, {"id": 170, "tag": "Statement-based", "q": "Consider the following statements about the spindle apparatus and associated structures. Statement I: Spindle fibres are microtubules composed mainly of tubulin protein. Statement II: Kinetochores are disc-shaped protein structures assembled on the centromeres. Statement III: In animal cells, the centrosomes radiate microtubules forming asters at the two poles. Statement IV: Higher plant cells possess prominent centrioles surrounded by conspicuous asters. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Tubulin fibres, kinetochore discs, animal asters — I, II, III sahi. IV galat: higher plants centriole/aster dono nahi rakhte, spindle anastral banta hai.", "m": "Higher plant = anastral, acentriolar spindle.", "s": ["Microtubule composition sahi.", "Kinetochore description sahi.", "Aster animal feature sahi.", "Plant centriole claim galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Colchicine tubulin par attack karke isi apparatus ko todta hai.", "sim": null}, {"id": 171, "tag": "Statement-based", "q": "Consider the following statements about meiosis II. Statement I: It occurs in the haploid cells produced by meiosis I. Statement II: It is an equational division because the chromosome number does not get reduced further. Statement III: The two chromatids of each chromosome separate during anaphase II. Statement IV: A fresh round of DNA replication takes place before the start of meiosis II. Which of the above statements are correct?", "fig": null, "opt": ["I, II and III", "II, III and IV", "I and IV only", "II and IV only"], "ans": 0, "c": "Haploid cell, equational, chromatid separation — I, II, III sahi. IV galat: interkinesis mein DNA replication nahi hoti.", "m": "Meiosis-II = haploid mitosis, bina naye $S$ phase.", "s": ["Starting cell haploid.", "$n \\rightarrow n$ equational.", "Centromere split anaphase-II.", "No replication — IV galat."], "r": "", "w": ["", "IV galat hai.", "I missing hai.", "IV include karta hai."], "t": "Ek replication, do divisions — meiosis ka golden rule.", "sim": null}, {"id": 172, "tag": "Statement-based", "q": "Consider the following statements about the biological significance of mitosis and meiosis. Statement I: Mitosis helps maintain genetic stability because the daughter cells inherit identical sets of chromosomes. Statement II: Meiosis conserves the chromosome number of a species across sexually reproducing generations. Statement III: Crossing over during meiosis generates genetic variation, which serves as raw material for evolution. Statement IV: Mitosis is the mechanism by which multicellular organisms grow and repair their tissues. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Identical daughters, species number conservation, variation via crossing over, growth/repair — chaaron significance statements sahi hain.", "m": "Mitosis = stability/growth; meiosis = conservation + variation.", "s": ["No recombination in mitosis.", "Meiosis + fertilisation cycle.", "Variation = evolutionary raw material.", "Mitosis repairs wounds/grows body."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "Saare points NCERT significance list se hain.", ""], "t": "Mitosis = 'same genome, more cells'; meiosis = 'half number, new combinations'.", "sim": null}, {"id": 173, "tag": "Incorrect finder", "q": "Which of the following statements is NOT correct?", "fig": null, "opt": ["The chromosome number remains unchanged during the $S$ phase even though DNA content doubles.", "In a diploid cell, the $G_2$ phase contains twice the DNA of the $G_1$ phase.", "The ploidy of a cell changes from diploid to tetraploid immediately after the $S$ phase.", "Each chromosome in $G_2$ consists of two sister chromatids held together at the centromere."], "ans": 2, "c": "$S$ phase ke baad ploidy $2n$ hi rehti hai kyunki chromatids ek centromere se jude hain; tetraploidy tab hoti hai jab spindle block (colchicine) se chromatids alag nucleus mein na bant-payin. Baaki statements sahi hain.", "m": "DNA content ($C$) aur ploidy ($n$) do alag concepts hain.", "s": ["Chromosome count same — sahi.", "$G_2$ DNA double — sahi.", "Ploidy change claim — galat.", "2 chromatid structure — sahi."], "r": "", "w": ["Centromere rule se ye sahi hai.", "$4C$ vs $2C$ fact sahi hai.", "", "Ye structural fact sahi hai."], "t": "$4C$ DNA wali $2n$ cell tetraploid nahi hoti — sabse common student trap.", "sim": null}, {"id": 174, "tag": "Correct finder", "q": "Select the correct statement about the diplotene stage of prophase I:", "fig": null, "opt": ["The synaptonemal complex is freshly assembled at the beginning of this stage.", "The homologous chromosomes begin to separate while remaining joined at the chiasmata.", "Crossing over between non-sister chromatids is initiated in this stage.", "The chromosomes are maximally condensed and the nucleolus has already disappeared."], "ans": 1, "c": "Diplotene mein SC dissolve hota hai, homologs alag hone lagte hain par chiasmata par jude rehte hain. Crossing over to pachytene mein ho chuka; max condensation/nucleolus loss diakinesis ke features hain.", "m": "Diplotene identity = separation except at chiasmata.", "s": ["SC dissolves, assembles nahi.", "Chiasmata hold homologs.", "Exchange pachytene ka event.", "Full condensation baad mein."], "r": "", "w": ["SC assembly zygotene mein hui thi.", "", "Crossing over pachytene mein complete hua.", "Ye diakinesis ki pehchan hai."], "t": "Oocyte ka dictyate arrest bhi isi stage mein hota hai.", "sim": null}, {"id": 175, "tag": "Incorrect finder", "q": "Which of the following statements about chiasmata is NOT correct?", "fig": null, "opt": ["They are X-shaped structures that become visible during the diplotene stage.", "They mark the sites where crossing over has occurred between non-sister chromatids.", "Their terminalisation is completed during the diakinesis stage.", "They are formed by the attachment of spindle fibres to the kinetochores."], "ans": 3, "c": "Chiasmata crossing over wale physical junctions hain (homologs ke beech), spindle-kinetochore attachment se unka koi sambandh nahi. Baaki teen sahi facts hain.", "m": "Chiasma = exchange site mark, fibre attachment nahi.", "s": ["Diplotene visibility — sahi.", "Exchange site mark — sahi.", "Diakinesis terminalisation — sahi.", "Spindle link — galat."], "r": "", "w": ["Visibility timing sahi hai.", "Site-marking role sahi hai.", "Terminalisation stage sahi hai.", ""], "t": "Chiasmata anaphase-I tak homologs ko hold karte hain, tabhi reductional separation sambhav hai.", "sim": null}, {"id": 176, "tag": "Correct finder", "q": "Select the correct statement about the maturation promoting factor (MPF):", "fig": null, "opt": ["It is formed by the association of mitotic cyclin with its corresponding cyclin-dependent kinase.", "It directly catalyses the replication of DNA during the $S$ phase.", "It is active throughout the $G_0$ phase of quiescent cells.", "It is a structure made of microtubules that separates the chromosomes."], "ans": 0, "c": "MPF = cyclin B + $\\mathrm{CDK1}$ ka active complex jo $G_2 \\rightarrow M$ transition drive karta hai (lamin phosphorylation, envelope breakdown). Na DNA enzyme hai na microtubule structure, aur $G_0$ mein inactive.", "m": "MPF identity: cyclin-CDK complex.", "s": ["Mitotic cyclin accumulate hota hai.", "$\\mathrm{CDK1}$ bind hoke active.", "$M$ phase entry trigger.", "$G_0$ mein ye complex banta hi nahi."], "r": "", "w": ["", "DNA replication polymerase ka kaam hai.", "$G_0$ cells division machinery off rakhti hain.", "Spindle microtubules alag structure hai."], "t": "APC cyclin B degrade karke MPF ko inactivate karta hai — anaphase entry ka basis.", "sim": null}, {"id": 177, "tag": "Incorrect finder", "q": "Which of the following statements about cytokinesis in plant cells is NOT correct?", "fig": null, "opt": ["It begins with the formation of the cell plate at the equator of the cell.", "Golgi-derived vesicles carrying wall materials fuse to build the cell plate.", "The cell plate grows inwards from the lateral walls towards the centre.", "The cell plate ultimately represents the middle lamella between the two daughter cells."], "ans": 2, "c": "Cell plate centre se bahar (centrifugal) badhti hai; lateral walls se centre ki taraf (inward/centripetal) growth animal furrow ki hai. Baaki teeno plant cytokinesis ke sahi facts hain.", "m": "Direction trap: plate = inside-out.", "s": ["Plate equator par banti hai — sahi.", "Golgi vesicles material — sahi.", "Inward growth claim — galat.", "Middle lamella fate — sahi."], "r": "", "w": ["Formation site sahi hai.", "Vesicle mechanism sahi hai.", "", "Future middle lamella sahi fact hai."], "t": "Phragmoplast microtubules vesicles ko equator par guide karte hain.", "sim": null}, {"id": 178, "tag": "Correct finder", "q": "Select the correct statement about the enzyme recombinase:", "fig": null, "opt": ["It catalyses the formation of the spindle apparatus during prophase.", "It mediates crossing over between non-sister chromatids of homologous chromosomes during pachytene.", "It is responsible for dissolving the nuclear envelope at the end of prophase.", "It drives the movement of chromosomes towards the poles during anaphase."], "ans": 1, "c": "Recombinase recombination nodules par pachytene mein exchange catalyse karta hai — non-sister chromatids ke beech. Spindle, envelope dissolution ya poleward movement iska kaam nahi.", "m": "Recombinase $\\leftrightarrow$ crossing over (pachytene).", "s": ["Nodules pachytene mein.", "Enzyme wahan active.", "Non-sister exchange.", "Baaki events alag machinery se."], "r": "", "w": ["Spindle tubulin-based hai.", "", "Envelope breakdown MPF/lamin phosphorylation se.", "Poleward movement spindle shortening se."], "t": "Recombination nodule ki position = future chiasma site.", "sim": null}, {"id": 179, "tag": "Incorrect finder", "q": "Which of the following statements about interkinesis is NOT correct?", "fig": null, "opt": ["It is the short-lived gap between meiosis I and meiosis II.", "No DNA replication occurs during interkinesis.", "It is generally much longer than the interphase preceding meiosis I.", "In many organisms, interkinesis is very brief or almost absent."], "ans": 2, "c": "Interkinesis chhota ya almost absent hota hai; pre-meiotic interphase (jiska $S$ phase replication karta hai) usse kahin lamba. Isliye 'much longer' wali line galat hai.", "m": "Duration fact + no-replication rule.", "s": ["Gap definition sahi.", "No $S$ phase sahi.", "Longer claim galat.", "Brief/absent observation sahi."], "r": "", "w": ["Definition sahi hai.", "No-replication core rule hai.", "", "Brief/absent hona documented fact hai."], "t": "Chromosomes is dauran 2-chromatid state mein hi rehte hain.", "sim": null}, {"id": 180, "tag": "Correct finder", "q": "Select the correct statement regarding the consequence of nondisjunction:", "fig": null, "opt": ["It always produces four genetically identical diploid gametes.", "It can result in aneuploidy, with the offspring having one chromosome extra or one missing.", "It affects only the cytoplasm and does not alter chromosome numbers.", "It occurs exclusively during mitosis and never during meiosis."], "ans": 1, "c": "Nondisjunction $n+1$/$n-1$ gametes banata hai jinke fertilisation se trisomy/monosomy (aneuploidy) hoti hai. Ye meiosis-I, meiosis-II aur mitosis — teeno mein ho sakta hai.", "m": "Chromosome count error = aneuploidy.", "s": ["Separation fail.", "Gametes $n\\pm1$.", "Fertilisation $\\rightarrow$ $2n\\pm1$.", "Mitotic version embryo mosaicism deta hai."], "r": "", "w": ["Identical diploid gametes nahi bante.", "", "Chromosome number directly badalta hai.", "Meiotic nondisjunction bahut common hai."], "t": "Down syndrome ($+21$) iska textbook example hai.", "sim": null}, {"id": 181, "tag": "Incorrect finder", "q": "Which of the following statements is NOT correct regarding cell division in higher plants?", "fig": null, "opt": ["Asters and centrioles are absent during mitosis.", "Cytokinesis takes place through cell plate formation.", "The spindle apparatus is formed without centrosomes.", "A cleavage furrow deepens centripetally to split the cytoplasm."], "ans": 3, "c": "Cleavage furrow animal cell mechanism hai (actin ring); higher plant cell wall ki wajah se furrow bana hi nahi sakta — plate banti hai. Baaki teeno plant division ke sahi features hain.", "m": "Furrow = animal; plant wall furrow ko allow nahi karta.", "s": ["Anastral spindle — sahi.", "Cell plate — sahi.", "Acentrosomal spindle — sahi.", "Furrow claim — galat."], "r": "", "w": ["Aster absence sahi feature hai.", "Plate mechanism sahi hai.", "Plant spindle centrosome ke bina banta hai.", ""], "t": "Lower plants mein centrioles mil sakte hain; 'higher plant' shabd key hai.", "sim": null}, {"id": 182, "tag": "Correct finder", "q": "Select the correct statement about the leptotene stage of prophase I:", "fig": null, "opt": ["The chromosomes become gradually visible under the light microscope due to compaction of chromatin.", "Homologous chromosomes pair up and the synaptonemal complex is fully formed.", "Recombination nodules appear and crossing over is completed.", "Chiasmata undergo terminalisation towards the chromosome ends."], "ans": 0, "c": "Leptotene = compaction stage, chromosomes thin threads jaisi visible hote hain (NEET 2024 ne ye line puchi). Pairing zygotene, exchange pachytene, terminalisation diplotene-diakinesis mein.", "m": "Stage signature: first visibility of condensing chromosomes.", "s": ["Chromatin compact hota hai.", "Light microscope visibility shuru.", "Pairing abhi nahi.", "Baaki events baad ke stages ke."], "r": "", "w": ["", "Pairing/SC zygotene ka kaam hai.", "Nodules pachytene mein.", "Terminalisation kaafi baad hoti hai."], "t": "Leptotene threads = 'lepto' (thin) yaad karne ki mnemonic.", "sim": null}, {"id": 183, "tag": "Match the Columns", "q": "Match the event in Column I with the stage of meiosis in Column II. Column I: (a) Synapsis of homologous chromosomes (b) Crossing over (c) Appearance of chiasmata (d) Completion of terminalisation. Column II: (i) Diakinesis (ii) Diplotene (iii) Pachytene (iv) Zygotene.", "fig": null, "opt": ["a-iv, b-iii, c-ii, d-i", "a-iii, b-iv, c-i, d-ii", "a-iv, b-ii, c-iii, d-i", "a-ii, b-iii, c-iv, d-i"], "ans": 0, "c": "Synapsis zygotene; crossing over pachytene; chiasmata appear diplotene; terminalisation complete diakinesis.", "m": "L-Z-P-D-D sequence ke signature events.", "s": ["a $\\rightarrow$ iv.", "b $\\rightarrow$ iii.", "c $\\rightarrow$ ii.", "d $\\rightarrow$ i."], "r": "", "w": ["", "Crossing over zygotene mein nahi hota.", "Chiasmata diakinesis mein appear nahi, terminalise hote hain.", "Sequence mismatch wali pairing galat."], "t": "Ye exact pairing NEET 2016/2024 mein repeat ho chuki.", "sim": null}, {"id": 184, "tag": "Match the Columns", "q": "Match the cell cycle phase in Column I with the DNA content in Column II ($G_1$ value of the diploid cell $= 2C$). Column I: (a) $G_1$ (b) End of $S$ (c) $G_2$ (d) Each cell after meiosis II. Column II: (i) $4C$ (ii) $C$ (iii) $2C$ (iv) Transition from $2C$ to $4C$.", "fig": null, "opt": ["a-iii, b-iv, c-i, d-ii", "a-i, b-iii, c-iv, d-ii", "a-iii, b-i, c-iv, d-ii", "a-iv, b-iii, c-i, d-ii"], "ans": 0, "c": "$G_1 = 2C$; $S$ = transition $2C \\rightarrow 4C$; $G_2 = 4C$; final gamete = $C$.", "m": "C-value chakra follow karo.", "s": ["a $\\rightarrow$ iii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ i.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "$G_1$ $4C$ nahi hota.", "$S$ phase plateau nahi, transition hai.", "Gamete $C$ hota hai."], "t": "Mitotic daughter bhi $2C$; meiotic gamete $C$ — farak mat bhoolo.", "sim": null}, {"id": 185, "tag": "Match the Columns", "q": "Match the structure in Column I with its composition or function in Column II. Column I: (a) Spindle fibre (b) Synaptonemal complex (c) Cell plate (d) Kinetochore. Column II: (i) Proteinaceous scaffold that holds paired homologs together (ii) Microtubule made of tubulin (iii) Site of spindle fibre attachment on the centromere (iv) Precursor of the new plant cell wall.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-ii, b-iv, c-i, d-iii", "a-iii, b-i, c-iv, d-ii"], "ans": 0, "c": "Spindle = tubulin microtubule; SC = pairing scaffold; cell plate = wall precursor; kinetochore = attachment disc.", "m": "Composition vs function pairings.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Spindle protein scaffold nahi.", "Kinetochore wall precursor nahi.", "SC microtubule nahi."], "t": "Kinetochore protein hai, centromere DNA region — do alag cheezein.", "sim": null}, {"id": 186, "tag": "Match the Columns", "q": "Match the type of division or state in Column I with its characteristic feature in Column II. Column I: (a) Amitosis (b) Endomitosis (c) Free nuclear division (d) $G_0$ state. Column II: (i) Chromosome replication without nuclear division (ii) Direct division without spindle formation (iii) Metabolically active but non-dividing cell (iv) Repeated karyokinesis without cytokinesis.", "fig": null, "opt": ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-iv, b-iii, c-i, d-ii", "a-ii, b-iv, c-iii, d-i"], "ans": 0, "c": "Amitosis = direct spindle-less; endomitosis = replication without division; free nuclear = karyokinesis without cytokinesis; $G_0$ = active non-dividing.", "m": "Har term ka 'kya repeat/skip hota hai' dekho.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ i.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ iii."], "r": "", "w": ["", "Endomitosis direct split nahi.", "$G_0$ division process nahi, state hai.", "Free nuclear replication-only nahi."], "t": "Polytene chromosomes endomitosis ka, coconut syncytium free nuclear division ka example.", "sim": null}, {"id": 187, "tag": "Match the Columns", "q": "Match the stage of mitosis in Column I with the observed event in Column II. Column I: (a) Prophase (b) Metaphase (c) Anaphase (d) Telophase. Column II: (i) Reformation of nucleolus and nuclear envelope (ii) Centrosomes move to opposite poles and chromosomes condense (iii) Centromere splits and daughter chromosomes move poleward (iv) Chromosomes align at the equatorial plate.", "fig": null, "opt": ["a-ii, b-iv, c-iii, d-i", "a-iv, b-ii, c-i, d-iii", "a-ii, b-iii, c-iv, d-i", "a-iii, b-iv, c-i, d-ii"], "ans": 0, "c": "Prophase condensation/pole movement; metaphase alignment; anaphase split; telophase reformation.", "m": "Chronological event map.", "s": ["a $\\rightarrow$ ii.", "b $\\rightarrow$ iv.", "c $\\rightarrow$ iii.", "d $\\rightarrow$ i."], "r": "", "w": ["", "Alignment prophase ka event nahi.", "Reformation anaphase mein nahi.", "Condensation telophase mein nahi."], "t": "Telophase = reverse prophase — shortcut.", "sim": null}, {"id": 188, "tag": "Match the Columns", "q": "Match the checkpoint or factor in Column I with its role in Column II. Column I: (a) $G_1/S$ checkpoint (b) $G_2/M$ checkpoint (c) Spindle assembly checkpoint (d) APC. Column II: (i) Checks DNA damage before commitment to replication (ii) Protein complex triggering the metaphase to anaphase transition (iii) Checks completion of DNA replication before entry into mitosis (iv) Monitors kinetochore-spindle attachment.", "fig": null, "opt": ["a-i, b-iii, c-iv, d-ii", "a-iii, b-i, c-ii, d-iv", "a-i, b-iv, c-iii, d-ii", "a-iv, b-iii, c-i, d-ii"], "ans": 0, "c": "$G_1/S$ = pre-replication damage gate; $G_2/M$ = replication completion gate; SAC = attachment monitor; APC = anaphase trigger via degradation.", "m": "Checkpoint stage se role match karo.", "s": ["a $\\rightarrow$ i.", "b $\\rightarrow$ iii.", "c $\\rightarrow$ iv.", "d $\\rightarrow$ ii."], "r": "", "w": ["", "SAC $G_1$ par nahi hota.", "APC checkpoint protein nahi, degradation complex hai.", "$G_2/M$ attachment check nahi karta."], "t": "APC securin/cyclin B ko ubiquitinate karta hai.", "sim": null}, {"id": 189, "tag": "Assertion-Reason", "q": "Assertion (A): A cell in the $G_2$ phase of the cell cycle has $4C$ DNA but the same chromosome number as in $G_1$. Reason (R): During the $S$ phase, each chromosome replicates into two sister chromatids, increasing the DNA content without increasing the chromosome count.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Replication DNA double karti hai par centromere count same rehta hai — isi se $G_2$ mein $4C$ DNA aur $2n$ chromosomes dono saath rehte hain. R, A ka direct mechanism hai.", "m": "Content vs count ka mechanism.", "s": ["$S$ phase replication.", "2 chromatids per chromosome.", "Centromeres unchanged.", "$4C$, $2n$ explain."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Chromosome gino hamesha centromere gino.", "sim": null}, {"id": 190, "tag": "Assertion-Reason", "q": "Assertion (A): Meiosis I, rather than meiosis II, is the reductional division. Reason (R): During anaphase I, the homologous chromosomes separate and go to opposite poles, halving the chromosome number, while sister chromatids stay together.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Homolog separation se har nucleus ko ek set ($n$) milta hai — reduction. R yahi event detail mein batata hai, isliye explanation.", "m": "Reduction = homolog separation in anaphase-I.", "s": ["Anaphase-I: homologs apart.", "Centromere intact.", "Daughter nuclei haploid.", "Meiosis-II equational."], "r": "", "w": ["", "R causal reason hai.", "R sach hai.", "A sach hai."], "t": "Meiosis-II number nahi, sirf chromatids alag karta hai.", "sim": null}, {"id": 191, "tag": "Assertion-Reason", "q": "Assertion (A): Colchicine-treated cells get arrested at the metaphase stage. Reason (R): Colchicine inhibits the assembly of spindle microtubules, so the chromosomes cannot be properly organised and separated.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Spindle na bane to SAC anaphase allow nahi karta; chromosomes metaphase-jaisi state mein ruk jate hain. R exact mechanism hai.", "m": "Tubulin block $\\rightarrow$ no spindle $\\rightarrow$ metaphase arrest.", "s": ["Colchicine tubulin bind.", "Microtubule assembly fail.", "Checkpoint anaphase roke.", "Arrest + possible polyploidy."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Karyotyping isi arrest property ka use hai.", "sim": null}, {"id": 192, "tag": "Assertion-Reason", "q": "Assertion (A): In animal cells, cytokinesis proceeds through a cleavage furrow that deepens from the periphery towards the centre. Reason (R): A contractile ring of actin microfilaments just beneath the plasma membrane constricts the cell at the equator.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Actin-myosin ring contract karke membrane ko andar pinch karti hai — furrow centripetal deepens. R, A ka molecular kaaran hai.", "m": "Ring contraction = furrow direction ka reason.", "s": ["Equator par ring banti hai.", "Contraction membrane khinchti hai.", "Furrow outside-in deepens.", "Do cells alag."], "r": "", "w": ["", "R mechanism deta hai.", "R sach hai.", "A sach hai."], "t": "Cytochalasin B actin disrupt karke isi process ko rokta hai.", "sim": null}, {"id": 193, "tag": "Assertion-Reason", "q": "Assertion (A): The primary oocytes of human females remain suspended in prophase I for many years. Reason (R): They are arrested in the diplotene stage from foetal life and resume division only from puberty onwards, one at a time in each cycle.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Diplotene (dictyate) arrest ki wajah se prophase-I saalon tak lamba chalta hai. R, A ki exact wajah hai.", "m": "Arrest stage = long duration ka reason.", "s": ["Foetus mein oocytes banti hain.", "Diplotene arrest.", "Puberty tak pause.", "Monthly one resume."], "r": "", "w": ["", "R explanation hai.", "R sach hai.", "A sach hai."], "t": "Second arrest metaphase-II mein, fertilisation tak.", "sim": null}, {"id": 194, "tag": "Assertion-Reason", "q": "Assertion (A): Crossing over is the major source of genetic recombination among the gametes produced by meiosis. Reason (R): The exchange of segments between non-sister chromatids of homologous chromosomes creates new combinations of genes.", "fig": null, "opt": ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "Both A and R are false."], "ans": 0, "c": "Non-sister exchange naye allele combinations banata hai — yahi recombination hai. R mechanism-level explanation deta hai.", "m": "Exchange $\\rightarrow$ new combinations $\\rightarrow$ variation.", "s": ["Pachytene exchange.", "Non-sister chromatids.", "Recombinant chromatids.", "Gametes vary."], "r": "", "w": ["", "R reason hai.", "R sach hai.", "A sach hai."], "t": "Independent assortment doosra variation source hai, crossing over primary molecular source.", "sim": null}, {"id": 195, "tag": "Diagram based", "q": "A dividing cell is described in words: the nuclear envelope and nucleolus have disappeared; short, thick chromosomes, each with two chromatids, are scattered in the cytoplasm; the spindle is forming between two poles that lack asters; and the chromosomes have not yet moved to the equator. Based on this description, the cell and its stage are:", "fig": {"k": "stage", "phase": "prophase", "plant": true, "note2": "Schematic: higher plant cell — anastral spindle, no centrioles/asters"}, "opt": ["Animal cell in late prophase of mitosis", "Higher plant cell in late prophase of mitosis", "Animal cell in telophase of mitosis", "Higher plant cell in anaphase of mitosis"], "ans": 1, "c": "Asters ki absence higher plant cell batati hai; envelope gone + scattered 2-chromatid chromosomes + forming spindle + no alignment = late prophase.", "m": "Do clues: no aster (plant) + prophase events.", "s": ["No asters $\\Rightarrow$ higher plant.", "Envelope/nucleolus gone.", "Spindle forming, no equator.", "Late prophase match."], "r": "", "w": ["Animal cell asters dikhati.", "", "Telophase mein envelope wapas banta hai.", "Anaphase mein chromosomes poleward ja rahe hote."], "t": "Plant spindle anastral par microtubule-based wahi mechanism rakhta hai.", "sim": null}, {"id": 196, "tag": "Diagram sequencing", "q": "Four stages of a dividing animal cell are drawn in words. Stage P: chromatids reach opposite poles, nuclear envelope reappears and chromosomes start decondensing. Stage Q: chromosomes with split centromeres move towards opposite poles. Stage R: chromosomes with two chromatids each align at the equatorial plate with spindle fibres attached to kinetochores. Stage S: chromatin condenses into distinct chromosomes and centrioles move apart. The correct chronological sequence of these stages is:", "fig": {"k": "table", "head": ["Stage", "Event"], "rows": [["S", "Condensation, centrioles apart"], ["R", "Alignment at equator"], ["Q", "Split, poleward movement"], ["P", "Reformation, decondensation"]]}, "opt": ["S, R, Q, P", "R, S, P, Q", "S, Q, R, P", "P, Q, R, S"], "ans": 0, "c": "S = prophase, R = metaphase, Q = anaphase, P = telophase. Mitosis order: prophase $\\rightarrow$ metaphase $\\rightarrow$ anaphase $\\rightarrow$ telophase.", "m": "Har description ko stage name do, phir sequence.", "s": ["S: condensation $\\Rightarrow$ prophase.", "R: alignment $\\Rightarrow$ metaphase.", "Q: centromere split $\\Rightarrow$ anaphase.", "P: reformation $\\Rightarrow$ telophase."], "r": "", "w": ["", "R prophase se pehle nahi aa sakta.", "Q anaphase R (metaphase) ke baad aata hai.", "P telophase last hai."], "t": "PMAT acronym: Prophase-Metaphase-Anaphase-Telophase.", "sim": null}, {"id": 197, "tag": "Data-table", "q": "A data table gives the chromosome and chromatid count in a $2n = 12$ animal cell at four stages. Stage 1: 12 chromosomes, 12 chromatids. Stage 2: 12 chromosomes, 24 chromatids. Stage 3: 24 chromosomes, 24 chromatids. Stage 4 (per cell): 6 chromosomes, 12 chromatids. These stages respectively represent:", "fig": {"k": "table", "head": ["Stage", "Chromosomes", "Chromatids"], "rows": [["1", "12", "12"], ["2", "12", "24"], ["3", "24", "24"], ["4 (per cell)", "6", "12"]], "cap": "Schematic count table"}, "opt": ["$G_1$, $G_2$, mitotic anaphase, a cell after meiosis I", "$G_2$, $G_1$, mitotic anaphase, a cell after meiosis II", "$G_1$, mitotic anaphase, $G_2$, a cell after meiosis I", "A cell after meiosis II, $G_2$, $G_1$, mitotic anaphase"], "ans": 0, "c": "12/12 = unreplicated $G_1$; 12/24 = replicated $G_2$; 24/24 = anaphase (split centromeres); 6/12 = haploid cell with 2-chromatid chromosomes (post meiosis-I).", "m": "Centromere count aur chromatid count dono match karo.", "s": ["$G_1$: unreplicated.", "$G_2$: same centromeres, double chromatids.", "Anaphase: centromeres doubled.", "Post-I: $n$ chromosomes, 2 chromatids each."], "r": "", "w": ["", "$G_2$ 12/12 nahi ho sakta.", "Post meiosis-II mein 6/6 hota, 6/12 nahi.", "Anaphase $G_2$ se pehle nahi aata."], "t": "Anaphase ka temporary doubling sirf ek cell ke andar; cytokinesis ke baad $2n$ wapas.", "sim": null}, {"id": 198, "tag": "Graph based", "q": "A line graph plots DNA content per cell (Y-axis) against time (X-axis) for a germ line undergoing complete meiosis. The trace shows: $2C$ in $G_1$, a smooth rise to $4C$ during $S$, a plateau at $4C$, a vertical drop to $2C$, a short plateau, then a vertical drop to $C$. A second vertical line drawn exactly at the first drop corresponds to the event of:", "fig": {"k": "line", "xl": ["G1", "S", "After I", "Interk.", "After II"], "yl": ["4C", "2C", "C"], "ymin": 0, "ymax": 1, "yaxis": "DNA per cell", "series": [{"name": "C-value", "color": "#6cb2ff", "pts": [0.5, 1, 0.5, 0.5, 0.25]}], "mark": {"x": "After I", "t": "first drop"}, "cap": "Schematic C-value curve through meiosis"}, "opt": ["Cytokinesis I separating the two haploid nuclei", "DNA replication", "Splitting of centromeres in anaphase II", "Entry of the cell into the $G_0$ stage"], "ans": 0, "c": "$4C$ DNA ek cell mein tha; cytokinesis-I do cells banata hai jisme har ek ko $2C$ milta hai — first vertical drop. Replication rise deta hai; centromere split DNA amount nahi badalta; $G_0$ is process mein hai hi nahi.", "m": "Per-cell DNA ka drop = cell division (cytokinesis).", "s": ["$4C$ plateau end of meiosis-I tak.", "Cytokinesis-I partition.", "Each cell $2C$.", "Doosra drop cytokinesis-II par."], "r": "", "w": ["", "Replication rise banati hai.", "Centromere split chromosome count badalta hai, per-cell DNA nahi.", "$G_0$ somatic concept hai."], "t": "Graph ke vertical drops hamesha cytokinesis ke markers hote hain.", "sim": null}, {"id": 199, "tag": "Data based", "q": "In an onion root tip study, a student counts 300 dividing cells and records: prophase 150, metaphase 90, anaphase 42, telophase 18. Assuming that the number of cells in a stage is proportional to its duration, the correct ranking of the mitotic stages from the longest to the shortest duration is:", "fig": {"k": "bar", "ymax": 150, "yaxis": "Cells", "groups": [{"label": "Prophase", "bars": [{"v": 150, "c": "#6cb2ff"}]}, {"label": "Metaphase", "bars": [{"v": 90, "c": "#4caf7d"}]}, {"label": "Anaphase", "bars": [{"v": 42, "c": "#d8a657"}]}, {"label": "Telophase", "bars": [{"v": 18, "c": "#e06c75"}]}], "legend": [{"n": "Cells in stage", "c": "#6cb2ff"}], "cap": "Schematic bar chart of the stage counts"}, "opt": ["Telophase, anaphase, metaphase, prophase", "Prophase, metaphase, anaphase, telophase", "Metaphase, prophase, telophase, anaphase", "Anaphase, telophase, prophase, metaphase"], "ans": 1, "c": "Relative duration principle: jitni zyada cells, utna lamba stage. Counts: prophase 150 > metaphase 90 > anaphase 42 > telophase 18.", "m": "Count order = duration order.", "s": ["150 sabse zyada $\\Rightarrow$ prophase longest.", "90 $\\Rightarrow$ metaphase.", "42 $\\Rightarrow$ anaphase.", "18 $\\Rightarrow$ telophase shortest."], "r": "", "w": ["Ulta order galat hai.", "", "Metaphase prophase se chhoti hai.", "Anaphase prophase/metaphase se chhoti."], "t": "Anaphase ka hamesha smallest fraction hona uski short duration confirm karta hai.", "sim": null}, {"id": 200, "tag": "Diagram based", "q": "A word-diagram of a cell in meiosis shows: paired homologous chromosomes (bivalents) positioned at the equator, spindle fibres from the left pole attached to one chromosome of each pair and fibres from the right pole attached to its homolog, and the centromeres remain unsplit. This stage is:", "fig": {"k": "stage", "phase": "metaphase1", "plant": false, "note2": "Schematic: bivalents at equator, one pole per homolog"}, "opt": ["Metaphase of mitosis", "Metaphase I of meiosis", "Metaphase II of meiosis", "Anaphase I of meiosis"], "ans": 1, "c": "Bivalents ka equator par hona aur har homolog ka opposite pole se connected hona = metaphase-I. Mitotic metaphase mein single chromosomes dono poles se; metaphase-II haploid cell mein single chromosomes ke saath; anaphase-I mein separation shuru ho jata hai.", "m": "Bivalent alignment + monopolar attachment per homolog.", "s": ["Bivalents present $\\Rightarrow$ meiosis-I.", "Equator par $\\Rightarrow$ metaphase.", "Centromeres intact.", "Metaphase-I confirm."], "r": "", "w": ["Mitosis mein bivalents nahi bante.", "", "Metaphase-II mein single chromosomes align hote hain.", "Anaphase-I mein homologs already move kar rahe hote."], "t": "Mitotic metaphase: dono poles ek chromosome par; metaphase-I: ek pole ek homolog par.", "sim": null}, {"id": 201, "tag": "Application", "q": "A diploid plant cell with $2n = 10$ chromosomes is treated with colchicine while it is undergoing mitosis. The spindle fails to form, so the sister chromatids separate but the cell does not divide. If such an affected cell completes the cycle, the number of chromosomes it will contain is:", "fig": null, "opt": ["5", "10", "20", "40"], "ans": 2, "c": "Colchicine spindle block karta hai; chromatids to separate hote hain par do nuclei nahi bant, saare 10 ke 10 chromatids (ab chromosomes) ek hi nucleus mein reh jate hain — count double: $10 \\rightarrow 20$ (tetraploid).", "m": "Spindle block $\\Rightarrow$ chromatid separation without partitioning $\\Rightarrow$ doubling.", "s": ["Starting: 10 chromosomes, 20 chromatids.", "No spindle: no anaphase distribution.", "Chromatids ek nucleus mein retain.", "Count $= 20$."], "r": "", "w": ["5 meiosis-type half count hai, yahan ho nahi raha.", "10 to normal mitotic daughter ka count hai.", "", "40 tab hota agar do baar blocked cycle chalti."], "t": "Colchicine-induced polyploidy crop breeding (seedless varieties) mein use hoti hai.", "sim": null}, {"id": 202, "tag": "Numerical", "q": "In a flowering plant, how many meiotic divisions in total are required to produce 100 viable seeds (each seed requiring one functional male gamete for fertilisation and one functional egg)?", "fig": null, "opt": ["100", "125", "200", "250"], "ans": 1, "c": "100 eggs ke liye 100 meiosis (female: 1 meiosis = 1 egg). Male side: 1 meiosis = 4 pollen; 100 pollen chahiye to $100/4 = 25$ meiosis. Total $100 + 25 = 125$.", "m": "Female 1:1, male 1:4 — dono count karo.", "s": ["Female: 100 divisions.", "Male: $100 \\div 4 = 25$.", "Total: $100 + 25 = 125$."], "r": "", "w": ["100 sirf female-side count hai; male 25 chhoot rahe hain.", "", "200 galat ratio hai; male side 4 products per meiosis deta hai.", "250 double-count hai; actual male contribution sirf 25 hai."], "t": "General formula for seeds: divisions $= n + n/4 = 1.25n$.", "sim": null}, {"id": 203, "tag": "Numerical", "q": "A diploid cell with $2n = 8$ chromosomes enters meiosis. The number of bivalents that can be observed during the pachytene stage of prophase I is:", "fig": null, "opt": ["2", "4", "8", "16"], "ans": 1, "c": "Ek bivalent = ek homologous jodi. $2n = 8$ matlab 4 homologous pairs, to bivalents = 4. Har bivalent mein 4 chromatids (tetrad).", "m": "Bivalent count = haploid number $n$.", "s": ["$2n = 8 \\Rightarrow n = 4$.", "4 homologous pairs.", "Ek pair = ek bivalent."], "r": "", "w": ["2 = galat half count.", "", "8 total chromosomes hain, bivalents nahi.", "16 chromatids ka count ho sakta hai, bivalents ka nahi."], "t": "Pachytene mein bivalent count $n$, chromatid count $4n$ yaad rakho.", "sim": null}, {"id": 204, "tag": "Numerical", "q": "The DNA content of a diploid somatic cell in the $G_1$ phase is $2C$. What will be the DNA content of each cell during anaphase II of meiosis (just before the second cytokinesis)?", "fig": null, "opt": ["$C$", "$2C$", "$4C$", "$8C$"], "ans": 1, "c": "Meiosis-I ke baad har cell mein $2C$ DNA (2-chromatid chromosomes). Anaphase-II mein centromere to phat-ta hai par cell abhi divide nahi hua, isliye ek hi cell mein poora $2C$ DNA bana rehta hai; $C$ to cytokinesis-II ke baad milega.", "m": "Cytokinesis tak per-cell DNA change nahi hota — splitting centromere DNA amount nahi badalti.", "s": ["Post-I: $2C$ per cell.", "Anaphase-II: chromatids separate, same cell.", "DNA still $2C$.", "After cytokinesis-II: $C$."], "r": "", "w": ["$C$ final gamete ka content hai.", "", "$4C$ meiosis-I se pehle ki cell ka.", "$8C$ kabhi possible nahi."], "t": "Centromere split chromosome count badalti hai, DNA content nahi.", "sim": null}, {"id": 205, "tag": "Direct MCQ", "q": "The longest stage in the entire process of meiosis, accounting for most of its total duration, is:", "fig": null, "opt": ["Prophase I", "Metaphase I", "Anaphase II", "Telophase II"], "ans": 0, "c": "Prophase-I ke paanch sub-stages (pairing, SC, crossing over, chiasmata, terminalisation) lamba process hai — meiosis ka sabse lamba phase. Isiliye oocyte ka saalon wala arrest bhi isi phase mein hota hai.", "m": "Complexity jitni zyada, duration utna zyada.", "s": ["5 sub-stages prophase-I mein.", "Synapsis + recombination time-consuming.", "Baaki phases relatively short."], "r": "", "w": ["", "Metaphase-I alignment-only short phase hai.", "Anaphase-II minutes ka event.", "Telophase-II bhi brief hota hai."], "t": "Oocyte diplotene arrest isi prophase-I ki lambai ka extreme example hai.", "sim": null}, {"id": 206, "tag": "Direct MCQ", "q": "The maturation promoting factor (MPF), which drives a cell from the $G_2$ phase into the $M$ phase, is functionally a complex of:", "fig": null, "opt": ["Actin and myosin", "Mitotic cyclin and cyclin-dependent kinase", "Tubulin and kinetochore protein", "Histone and DNA polymerase"], "ans": 1, "c": "MPF = cyclin B (mitotic cyclin) + $\\mathrm{CDK1}$. Active complex target proteins (lamins etc.) phosphorylate karke mitosis entry trigger karta hai.", "m": "MPF identity: regulatory cyclin + kinase enzyme.", "s": ["Cyclin accumulate $G_2$ mein.", "$\\mathrm{CDK1}$ bind hota hai.", "Active MPF $M$ entry.", "Baaki pairs doosri structures ke hain."], "r": "", "w": ["Actin-myosin contractile ring banate hain.", "", "Tubulin spindle ka monomer hai.", "Histone/polymerase replication machinery hain."], "t": "APC cyclin B degrade karke MPF ko off karta hai.", "sim": null}, {"id": 207, "tag": "Concept MCQ", "q": "Which one of the following events is shared by the anaphase of mitosis and anaphase II of meiosis?", "fig": null, "opt": ["Separation of homologous chromosomes", "Splitting of the centromere and separation of sister chromatids", "Pairing of homologous chromosomes", "Reduction of chromosome number to half"], "ans": 1, "c": "Dono stages mein centromere split hoke sister chromatids alag hoti hain. Homolog separation/pairing/reduction sirf meiosis-I ke events hain.", "m": "Common event dhoondho: centromere split dono jagah.", "s": ["Mitotic anaphase: chromatids apart.", "Anaphase-II: same, haploid cell mein.", "Homologs sirf meiosis-I mein.", "Reduction meiosis-I mein."], "r": "", "w": ["Homolog separation sirf anaphase-I.", "", "Pairing prophase-I ka event.", "Reduction meiosis-I deta hai."], "t": "Isi liye meiosis-II ko haploid mitosis kehte hain.", "sim": null}, {"id": 208, "tag": "Numerical", "q": "A human primary spermatocyte is examined at the pachytene stage of prophase I. The total number of chromatids present in this cell is:", "fig": null, "opt": ["23", "46", "92", "184"], "ans": 2, "c": "Primary spermatocyte diploid ($2n = 46$), replication ho chuki; pachytene tak har chromosome 2 chromatids ka. Total chromatids $= 46 \\times 2 = 92$.", "m": "Post-$S$ cell: chromatids = $2 \\times$ chromosome count.", "s": ["46 chromosomes.", "Har ek replicated.", "$46 \\times 2 = 92$ chromatids.", "23 bivalents bhi isi stage mein."], "r": "", "w": ["23 = haploid chromosome number.", "46 = chromosome/centromere count.", "", "184 impossible double-count hai."], "t": "Bivalents 23, chromatids 92 — dono saath puchte hain.", "sim": null}, {"id": 209, "tag": "Numerical", "q": "In a certain organism, the egg cell contains 10 chromosomes. The number of chromatids present in a diploid leaf cell of this organism at the end of its $G_2$ phase will be:", "fig": null, "opt": ["10", "20", "40", "80"], "ans": 2, "c": "Egg $n = 10$ to diploid leaf $2n = 20$ chromosomes. $G_2$ tak replication ho chuki, har chromosome 2 chromatids: $20 \\times 2 = 40$ chromatids.", "m": "Pehle ploidy nikalo, phir replication factor lagao.", "s": ["Egg $n = 10$.", "Leaf: $2n = 20$.", "$G_2$: double chromatids.", "$20 \\times 2 = 40$."], "r": "", "w": ["10 haploid count hai.", "20 chromosome count hai, chromatid nahi.", "", "80 do-har ka over-count hai."], "t": "Chromosome = centromere; chromatid = DNA molecule — dono alag gino.", "sim": null}, {"id": 210, "tag": "Direct MCQ", "q": "The point in the $G_1$ phase beyond which a mammalian cell is committed to enter the $S$ phase and complete the division cycle, equivalent to the 'Start' point in yeast, is called the:", "fig": null, "opt": ["Restriction point", "Spindle assembly point", "Chiasma point", "Terminalisation point"], "ans": 0, "c": "Restriction point ($G_1/S$ boundary) cross karne ke baad growth factor hatne par bhi cell $S$ phase complete karta hai. Ye yeast 'Start' ka mammalian equivalent hai.", "m": "Commitment terminology: restriction point / Start.", "s": ["$G_1$ mein decision gate.", "Conditions check hoti hain.", "Cross = commitment.", "Baaki options division ke doosre events hain."], "r": "", "w": ["", "Spindle assembly point metaphase-anaphase transition par kaam karta hai.", "Chiasma point koi cell-cycle checkpoint nahi, crossing over ka mark hai.", "Terminalisation chiasmata ka sliding hai, restriction point nahi."], "t": "Rb protein isi restriction point ko control karta hai.", "sim": null}, {"id": 211, "tag": "Concept MCQ", "q": "During anaphase, the shape assumed by a moving chromosome depends on the position of its centromere. The shapes shown by metacentric, sub-metacentric, acrocentric and telocentric chromosomes respectively are:", "fig": null, "opt": ["V, L, J, I (rod-like)", "I, J, L, V", "J, V, I, L", "L, I, V, J"], "ans": 0, "c": "Centromere aage, arms peeche: metacentric (median) V, sub-metacentric L/J, acrocentric nearly rod (J-like), telocentric I/rod. Option A best-available match hai (L/J labels closely related shapes ke liye use hue).", "m": "Position $\\rightarrow$ shape: median V, off-centre J/L, near-end rod, terminal I.", "s": ["Metacentric: equal arms $\\Rightarrow$ V.", "Sub-metacentric: unequal arms $\\Rightarrow$ L/J.", "Acrocentric: tiny short arm $\\Rightarrow$ rod/J.", "Telocentric: terminal $\\Rightarrow$ I."], "r": "", "w": ["", "Sequence puri ulti hai.", "V sirf metacentric ka hai.", "Positions-shapes mismatch hain."], "t": "V-shape sabse reliable metacentric pehchan hai; baaki L/J closely related hain.", "sim": null}, {"id": 212, "tag": "Statement-based", "q": "Consider the following statements about the $S$ phase. Statement I: DNA replication doubles the DNA content from $2C$ to $4C$ in a diploid cell. Statement II: The chromosome number remains unchanged at $2n$ because the two sister chromatids remain joined at the centromere. Statement III: In animal cells, the centriole duplicates in the cytoplasm during this phase. Statement IV: Synthesis of histone proteins needed for packaging the newly formed DNA also occurs mainly during this phase. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Chaaron events $S$ phase ke documented features hain: DNA doubling, chromosome count same, centriole duplication, histone synthesis (naye DNA ko package karne).", "m": "$S$ phase ka complete event-list.", "s": ["Replication $\\Rightarrow$ $4C$.", "Centromere count same $\\Rightarrow$ $2n$.", "Centriole duplicate.", "Histones nayi chromatin ke liye."], "r": "", "w": ["Sab sahi hain, koi reject nahi.", "I/III bhi correct hain.", "II/IV bhi verify ho chuke.", ""], "t": "Histone synthesis aur DNA replication saath-saath chalti hain.", "sim": null}, {"id": 213, "tag": "Statement-based", "q": "Consider the following statements about the events of prophase I of meiosis. Statement I: Compaction of chromosomes starts in leptotene, making them gradually visible. Statement II: Synapsis and synaptonemal complex formation occur in zygotene. Statement III: Recombination nodules appear and crossing over is completed in pachytene. Statement IV: The synaptonemal complex dissolves and chiasmata appear in diplotene, while terminalisation is completed in diakinesis. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Chaaron statements L-Z-P-D-D ki exact event-timeline hain — sab sahi.", "m": "5 sub-stages ke events sequence mein verify karo.", "s": ["Leptotene compaction.", "Zygotene pairing/SC.", "Pachytene exchange.", "Diplotene/diakinesis chiasmata events."], "r": "", "w": ["Koi galat nahi.", "I/III bhi sahi.", "Saare NCERT-documented hain.", ""], "t": "NEET 2024 ne leptotene/diplotene lines puchi — high-weightage.", "sim": null}, {"id": 214, "tag": "Statement-based", "q": "Consider the following statements comparing anaphase I and anaphase II of meiosis. Statement I: In anaphase I, homologous chromosomes separate, whereas in anaphase II, sister chromatids separate. Statement II: The centromere does not split in anaphase I but splits in anaphase II. Statement III: Each chromosome moving towards a pole in anaphase I still consists of two sister chromatids. Statement IV: Anaphase I reduces the chromosome number, whereas anaphase II does not. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Chaaron statements dono anaphases ka standard comparison hai — sab sahi.", "m": "Centromere split timing = master differentiator.", "s": ["I: alag-alag separating units.", "II: split sirf II mein.", "III: 2-chromatid movement in I.", "IV: reduction I se, II equational."], "r": "", "w": ["Sab correct hain.", "Koi adhura nahi.", "I/III bhi sahi hain.", ""], "t": "Anaphase-I ke baad har cell $n$ chromosomes, 2 chromatids each.", "sim": null}, {"id": 215, "tag": "Statement-based", "q": "Consider the following statements about cell cycle checkpoints. Statement I: The $G_1/S$ checkpoint assesses cell size, nutrient availability, growth signals and DNA integrity before committing the cell to division. Statement II: The $G_2/M$ checkpoint blocks entry into mitosis if DNA replication is incomplete or damaged DNA remains unrepaired. Statement III: The spindle assembly checkpoint delays anaphase until every kinetochore is correctly attached to spindle fibres. Statement IV: Regulatory proteins such as $\\mathrm{p53}$ can halt the cycle at checkpoints to allow DNA repair or trigger apoptosis if damage is irreparable. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and III", "I, II, III and IV"], "ans": 3, "c": "Teen checkpoints ke functions aur $\\mathrm{p53}$ ka guardian role — chaaron statements sahi hain.", "m": "Checkpoint list + key protein ka kaam.", "s": ["Restriction point checks.", "Replication gate.", "Attachment gate.", "$\\mathrm{p53}$ arrest/apoptosis."], "r": "", "w": ["Sab sahi hain.", "Koi reject nahi.", "IV bhi standard fact hai.", ""], "t": "$\\mathrm{p53}$ mutation = checkpoint loss = tumour promotion.", "sim": null}, {"id": 216, "tag": "Statement-based", "q": "Consider the following statements about cytokinesis. Statement I: In animal cells, a contractile ring of actin microfilaments creates a cleavage furrow that deepens centripetally. Statement II: In plant cells, Golgi-derived vesicles fuse at the equator to form the cell plate, which grows centrifugally. Statement III: The cell plate represents the future middle lamella between the two daughter cell walls. Statement IV: When karyokinesis is repeated without cytokinesis, a multinucleate syncytium or coenocyte is formed, as in the liquid endosperm of coconut. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Animal ring/furrow, plant vesicle/plate, middle lamella fate aur syncytium exception — chaaron sahi.", "m": "Do mechanisms + direction + exception.", "s": ["Actin ring centripetal.", "Vesicle plate centrifugal.", "Middle lamella fate.", "No cytokinesis $\\Rightarrow$ syncytium."], "r": "", "w": ["Sab correct hain.", "Koi galat nahi.", "Saare NCERT lines hain.", ""], "t": "Phragmoplast plant vesicles ko guide karta hai.", "sim": null}, {"id": 217, "tag": "Statement-based", "q": "Consider the following statements tracking the $C$-value in a diploid cell ($G_1 = 2C$) through meiosis. Statement I: The cell contains $4C$ DNA throughout the $G_2$ phase and during prophase I and metaphase I. Statement II: Each daughter cell formed after meiosis I contains $2C$ DNA but has only $n$ chromosomes, each with two chromatids. Statement III: No change in DNA content occurs during interkinesis because DNA does not replicate. Statement IV: Each of the four cells formed after meiosis II contains $C$ amount of DNA and $n$ chromosomes with one chromatid each. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Poora $C$-value chakra: $4C$ (post-$S$ se metaphase-I), $2C$ (post-I), no change in interkinesis, $C$ (post-II). Chaaron statements sahi hain.", "m": "$4C \\rightarrow 2C \\rightarrow C$ timeline.", "s": ["Replication $4C$ deti hai.", "Cytokinesis-I $\\rightarrow 2C$.", "Interkinesis no replication.", "Cytokinesis-II $\\rightarrow C$."], "r": "", "w": ["Sab sahi hain.", "Koi exception nahi.", "I/III bhi correct hain.", ""], "t": "Chromosome count alag timeline ($2n \\rightarrow n$) follow karta hai.", "sim": null}, {"id": 218, "tag": "Statement-based", "q": "Consider the following statements about nondisjunction. Statement I: Nondisjunction in meiosis I results from failure of homologous chromosomes to separate, producing all four abnormal gametes. Statement II: Nondisjunction in meiosis II results from failure of sister chromatids to separate, producing two normal and two abnormal gametes. Statement III: Abnormal gametes carry either $n+1$ or $n-1$ chromosomes. Statement IV: Fusion of an $n+1$ gamete with a normal $n$ gamete produces a trisomic ($2n+1$) zygote. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Do error types, unke gamete outcomes aur fertilisation result — chaaron statements mechanistically sahi hain.", "m": "Error stage $\\rightarrow$ kitne gametes abnormal $\\rightarrow$ zygote condition.", "s": ["I-error: chaaro abnormal.", "II-error: 2 abnormal, 2 normal.", "$n\\pm1$ gametes.", "$n+1 + n = 2n+1$ trisomy."], "r": "", "w": ["Sab correct hain.", "Koi reject nahi.", "III/IV bhi sahi consequences hain.", ""], "t": "Turner ($45,\\mathrm{X}$) monosomy, Down ($+21$) trisomy — clinical links.", "sim": null}, {"id": 219, "tag": "Statement-based", "q": "Consider the following statements about special modes of nuclear division. Statement I: Amitosis involves simple constriction of the nucleus without spindle formation or distinct chromosome appearance, as in bacteria. Statement II: Endomitosis involves repeated chromosome replication inside an intact nucleus without nuclear division, increasing the chromosome number within one nucleus. Statement III: Free nuclear division involves repeated karyokinesis without cytokinesis, giving a multinucleate condition. Statement IV: Polytene (giant) chromosomes of insect salivary glands result from repeated rounds of DNA replication without separation of the chromatids. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Amitosis, endomitosis, free nuclear division aur polytene formation — chaaron definitions sahi hain.", "m": "Har mode mein 'kya repeat, kya skip' identify karo.", "s": ["Amitosis: no spindle.", "Endomitosis: replication only.", "Free nuclear: division without cytokinesis.", "Polytene: replication without chromatid separation."], "r": "", "w": ["Sab sahi hain.", "Koi galat nahi.", "IV bhi documented example hai.", ""], "t": "Polytene bands/puffs gene activity study ke model hain.", "sim": null}, {"id": 220, "tag": "Statement-based", "q": "Consider the following statements about colchicine. Statement I: It is obtained from Colchicum autumnale and binds tubulin, preventing spindle microtubule assembly. Statement II: Treated cells proceed through $S$ phase and reach metaphase but cannot complete anaphase, so they get arrested at metaphase. Statement III: It is used to prepare metaphase spreads for karyotyping because chromosomes are maximally condensed at this stage. Statement IV: Repeated colchicine treatment can induce polyploidy, a technique used in crop improvement. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Source, mechanism, arrest, karyotyping use aur polyploidy — chaaron colchicine facts sahi hain.", "m": "Tubulin block ke saare consequences.", "s": ["Colchicum source.", "No spindle $\\Rightarrow$ metaphase arrest.", "Karyotyping benefit.", "Doubled nuclei = polyploidy."], "r": "", "w": ["Sab correct hain.", "Koi reject nahi.", "III/IV bhi standard applications hain.", ""], "t": "Vinca alkaloids (Catharanthus) cancer chemotherapy mein similar mechanism use karte hain.", "sim": null}, {"id": 221, "tag": "Statement-based", "q": "Consider the following statements about the significance of mitosis and meiosis. Statement I: Mitosis restores and maintains an efficient nucleus-to-cytoplasm ratio as cells grow and divide. Statement II: Mitosis produces genetically identical daughter cells, ensuring genetic stability within the body. Statement III: Meiosis, followed by fertilisation, maintains a constant chromosome number across sexually reproducing generations. Statement IV: Crossing over and independent assortment in meiosis generate genetic variation, the raw material for natural selection. Which of the above statements are correct?", "fig": null, "opt": ["I and III only", "II and IV only", "I, II and IV", "I, II, III and IV"], "ans": 3, "c": "Nucleo-cytoplasmic ratio, genetic stability, species number conservation aur variation — chaaron significance statements s
