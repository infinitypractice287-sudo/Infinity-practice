      };
    }
  },

  adiabatic: {
    title: "Simulation · Adiabatic compression",
    label: "Density ratio (final / initial)",
    min: 1, max: 3, step: 0.05, start: 2,
    draw: function(r){
      var g = 1.4;
      var ratio = Math.pow(r, g);
      var W = 300, H = 170;
      var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="300" height="170" role="img" aria-label="p-V curve">';
      s += '<line x1="40" y1="145" x2="275" y2="145" stroke="#4b5568" stroke-width="1.2"/>';
      s += '<line x1="40" y1="145" x2="40" y2="18" stroke="#4b5568" stroke-width="1.2"/>';
      s += '<text x="250" y="163" fill="#6f7a8d" font-size="11">V</text>';
      s += '<text x="24" y="24" fill="#6f7a8d" font-size="11">p</text>';
      var pts = [];
      for(var i=0;i<=40;i++){
        var f = i/40;
        var vv = 1 + f*1.0;
        var pp = Math.pow(1/vv, g);
        var X = 40 + (vv-1)/1.0*220;
        var Y = 140 - (pp-0.25)/(1.0-0.25)*115;
        pts.push(X.toFixed(1) + "," + Y.toFixed(1));
      }
      s += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#7c9cff" stroke-width="2"/>';
      s += '</svg>';
      return {
        val: "$\\rho_2/\\rho_1=" + r.toFixed(2) + "$",
        html: s + '<p>$p_2=p_1\\left(\\dfrac{\\rho_2}{\\rho_1}\\right)^{\\gamma}=' + ratio.toFixed(2) + '\\,p$</p>'
      };
    }
  },

  firstorder: {
    title: "Simulation · Curves ka intersection",
    label: "Rate constant k",
    min: 0.005, max: 0.06, step: 0.001, start: 0.02,
    draw: function(k){
      var th = Math.log(2)/k;
      var W = 300, H = 170, x0 = 40, y0 = 140, xw = 230, yh = 110;
      var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="300" height="170" role="img" aria-label="concentration vs time">';
      s += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + (x0+xw) + '" y2="' + y0 + '" stroke="#4b5568" stroke-width="1.2"/>';
      s += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="18" stroke="#4b5568" stroke-width="1.2"/>';
      s += '<text x="' + (x0+xw-14) + '" y="' + (y0+18) + '" fill="#6f7a8d" font-size="11">t</text>';
      var tmax = th*4;
      function X(t){ return x0 + t/tmax*xw; }
      function Y(c){ return y0 - c*yh; }
      var a = [], b = [];
      for(var i=0;i<=60;i++){
        var t = tmax*i/60;
        var c1 = Math.exp(-k*t), c2 = 1-c1;
        a.push(X(t).toFixed(1) + "," + Y(c1).toFixed(1));
        b.push(X(t).toFixed(1) + "," + Y(c2).toFixed(1));
      }
      s += '<polyline points="' + a.join(" ") + '" fill="none" stroke="#7c9cff" stroke-width="2"/>';
      s += '<polyline points="' + b.join(" ") + '" fill="none" stroke="#7fd39a" stroke-width="2"/>';
      s += '<circle cx="' + X(th).toFixed(1) + '" cy="' + Y(0.5).toFixed(1) + '" r="4" fill="#ffd479"/>';
      s += '<text x="' + X(th).toFixed(1) + '" y="' + (Y(0.5)+18) + '" fill="#ffd479" font-size="10" text-anchor="middle">t</text>';
      s += '</svg>';
      return {
        val: "$k=" + k.toFixed(3) + "\\,\\mathrm{s^{-1}}$",
        html: s + '<p>Dono curves wahin milte hain jahan $[X]=[Y]$, yaani $t=\\dfrac{\\ln 2}{k}=' + th.toFixed(1) + '\\,\\mathrm{s}$ — yeh $t_{1/2}$ hi hai.</p>'
      };
    }
  },

  boiling: {
    title: "Simulation · Ionisation badlo",
    label: "Degree of ionisation α",
    min: 0, max: 1, step: 0.01, start: 0.9,
    draw: function(alpha){
      var i = 1 + alpha*3;

      var barW = Math.min(240, dT/0.25*240);
      var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="300" height="150" role="img" aria-label="boiling point elevation">';
      s += '<rect x="30" y="55" width="240" height="26" fill="#20252f" stroke="#333b4b"/>';
      s += '<rect x="30" y="' + 55 + '" width="' + barW.toFixed(1) + '" height="26" fill="#7c9cff"/>';
      s += '<text x="30" y="48" fill="#9aa3b2" font-size="11">ΔTb = ' + dT.toFixed(3) + ' K</text>';
      s += '<text x="30" y="112" fill="#9aa3b2" font-size="12">i = 1 + α(n−1) = ' + i.toFixed(2) + '</text>';
      s += '<text x="30" y="132" fill="#cfe0ff" font-size="12">Tb = 373.15 + ΔTb = ' + Tb.toFixed(2) + ' K</text>';
      s += '</svg>';
      return {
        val: "$\\alpha=" + alpha.toFixed(2) + "$",
        html: s
      };
    }
  }
};

  function loadState(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var o = JSON.parse(raw);
        if(o && typeof o === "object"){
          ST.ans = (o.ans && typeof o.ans === "object") ? o.ans : {};
          ST.cur = parseInt(o.cur,10) || 1;
          ST.submitted = !!o.submitted;
        }
      }
    }catch(e){}
    if(!(ST.cur >= 1 && ST.cur <= N)) ST.cur = 1;
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){}
  }

  /* ---------- math ---------- */
  function math(el){
    if(!el) return;
    if(typeof window.renderMathInElement !== "function") return;
    try{
      window.renderMathInElement(el, {
        delimiters:[
          {left:"$$", right:"$$", display:true},
          {left:"$", right:"$", display:false}
        ],
        throwOnError:false,
        strict:false,
        ignoredTags:["script","noscript","style","textarea","pre","option"]
      });
    }catch(e){}
  }

  /* ---------- scoring ---------- */
  function stats(){
    var correct=0, wrong=0, unattempted=0;
    for(var i=0;i<DATA.length;i++){
      var q = DATA[i];
      var a = ST.ans[q.id];
      if(a === undefined || a === null){ unattempted++; }
      else if(a === q.ans){ correct++; }
      else { wrong++; }
    }
    var score = correct*4 - wrong;
    var attempted = correct + wrong;
    var acc = attempted ? (correct*100/attempted) : 0;
    return {correct:correct, wrong:wrong, unattempted:unattempted, score:score, acc:acc, attempted:attempted};
  }

  /* ---------- header ---------- */
  function hud(){
    var s = stats();
    document.getElementById("scoreChip").textContent = s.score;
    document.getElementById("countChip").textContent = s.attempted;
    document.getElementById("totalChip").textContent = N;
    document.getElementById("barFill").style.width = (s.attempted*100/N).toFixed(2)+"%";
  }

  /* ---------- explanation builder ---------- */
  function explanationHTML(q, chosen){
    var ok = (chosen === q.ans);
    var h = "";
    h += '<div class="card expl">';
    h += '<div class="verdict ' + (ok?"ok":"bad") + '">' + (ok ? "✔ Sahi jawab" : "✘ Galat jawab") + '</div>';
    h += '<div class="block"><h4>1 · Concept zero se</h4><div>' + q.c + '</div></div>';
    h += '<div class="block"><h4>2 · Method kaun sa aur kyun</h4><div>' + q.m + '</div></div>';
    h += '<div class="block"><h4>3 · Step by step</h4><ol>';
    for(var i=0;i<q.s.length;i++){ h += '<li>' + q.s[i] + '</li>'; }
    h += '</ol></div>';
    h += '<div class="block"><h4>4 · Final answer</h4><div class="final">Option (' + (q.ans+1) + ') &nbsp;' + LETTERS[q.ans] + ' — ' + q.opt[q.ans] + '</div></div>';
    h += '<div class="block"><h4>5 · Baaki options kyun galat</h4><ul class="reasons">';
    for(var j=0;j<4;j++){
      if(j === q.ans) continue;
      var t = (q.r && q.r[j]) ? q.r[j] : "";
      if(!t) continue;
      h += '<li><span class="rl">(' + (j+1) + ')</span>' + t + '</li>';
    }
    h += '</ul></div>';
    if(q.w && q.w.length){
      h += '<div class="block warn"><h4>Dhyan rakho</h4><ul>';
      for(var k=0;k<q.w.length;k++){ h += '<li>' + q.w[k] + '</li>'; }
      h += '</ul></div>';
    }
    if(q.t){ h += '<div class="block tip"><h4>Tip</h4><div>' + q.t + '</div></div>'; }
    h += '</div>';
    return h;
  }

  /* ---------- render one question ---------- */
  function renderQ(){
    var q = DATA[ST.cur-1];
    var chosen = ST.ans[q.id];
    var answered = (chosen !== undefined && chosen !== null);
    var reveal = answered || ST.submitted;

    document.getElementById("qnum").textContent = "Q" + q.id;
    document.getElementById("qsubj").textContent = q.sub || "";
    document.getElementById("qstate").textContent = reveal
      ? (answered ? (chosen===q.ans ? "Answered · correct" : "Answered · wrong") : "Not attempted")
      : "Not attempted yet";

    var qt = document.getElementById("qText");
    qt.innerHTML = q.q;
    var fg = document.getElementById("qFig");
    if(q.fig){ fg.innerHTML = q.fig; fg.style.display=""; } else { fg.innerHTML=""; fg.style.display="none"; }

    var wrap = document.getElementById("opts");
    wrap.innerHTML = "";
    q.opt.forEach(function(o, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      var right = (i === q.ans);
      var tag = "";
      if(reveal){
        b.disabled = true;
        if(right){ b.className += " correct"; tag = ' <span class="tag ok">Sahi jawab</span>'; }
        else if(i === chosen){ b.className += " wrong"; tag = ' <span class="tag bad">Aapki choice</span>'; }
      }
      b.innerHTML = '<span class="lt">' + LETTERS[i] + '</span><span class="ot">' + o + tag + '</span>';
      if(!reveal){
        b.addEventListener("click", function(){ choose(i); });
      }
      wrap.appendChild(b);
    });

    var ex = document.getElementById("expl");
    if(reveal && answered){ ex.innerHTML = explanationHTML(q, chosen); }
    else { ex.innerHTML = ""; }

    renderSim(q);
    math(qt); math(fg); math(wrap); math(ex);
    hud();
  }

  function choose(i){
    var q = DATA[ST.cur-1];
    if(ST.ans[q.id] !== undefined) return;
    if(ST.submitted) return;
    ST.ans[q.id] = i;
    save();
    renderQ();
    var ex = document.getElementById("expl");
    if(ex.scrollIntoView){ try{ ex.scrollIntoView({behavior:"smooth", block:"start"}); }catch(e){} }
  }

  /* ---------- simulation ---------- */
  function renderSim(q){
    var host = document.getElementById("simWrap");
    host.innerHTML = "";
    if(!q.sim || !SIMS[q.sim]) return;
    var S = SIMS[q.sim];
    var box = document.createElement("div");
    box.className = "sim";
    box.innerHTML =
      '<h4>' + S.title + '</h4>' +
      '<div class="srow"><span>' + S.label + '</span>' +
      '<input type="range" min="' + S.min + '" max="' + S.max + '" step="' + S.step + '" value="' + S.start + '" id="simRange">' +
      '<span class="sval" id="simVal"></span></div>' +
      '<div class="sout" id="simOut"></div>';
    host.appendChild(box);
    var rng = box.querySelector("#simRange");
    var out = box.querySelector("#simOut");
    var val = box.querySelector("#simVal");
    function upd(){
      var v = parseFloat(rng.value);
      var r = S.draw(v);
      val.innerHTML = r.val;
      out.innerHTML = r.html;
      math(out);
    }
    rng.addEventListener("input", upd);
    upd();
  }

  /* ---------- nav ---------- */
  function goTo(id){
    if(id < 1) id = 1;
    if(id > N) id = N;
    ST.cur = id;
    save();
    showQuiz();
    renderQ();
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function next(){ if(ST.cur < N) goTo(ST.cur+1); }
  function prev(){ if(ST.cur > 1) goTo(ST.cur-1); }

  function showQuiz(){
    document.getElementById("quizView").classList.remove("hidden");
    document.getElementById("gridView").classList.add("hidden");
    document.getElementById("resultView").classList.add("hidden");
  }
  function showGrid(){
    document.getElementById("quizView").classList.add("hidden");
    document.getElementById("resultView").classList.add("hidden");
    document.getElementById("gridView").classList.remove("hidden");
    buildGrid();
    window.scrollTo({top:0});
  }

  /* ---------- grid ---------- */
  function buildGrid(){
    var g = document.getElementById("grid");
    var f = document.getElementById("filterSel").value;
    g.innerHTML = "";
    DATA.forEach(function(q){
      var a = ST.ans[q.id];
      var answered = (a !== undefined && a !== null);
      if(f === "answered" && !answered) return;
      if(f === "unanswered" && answered) return;
      var b = document.createElement("button");
      b.className = "gbtn";
      b.textContent = q.id;
      if(answered){
        if(ST.submitted){ b.className += (a === q.ans) ? " ok" : " bad"; }
        else { b.className += " answered"; }
      }
      if(q.id === ST.cur) b.className += " cur";
      b.addEventListener("click", function(){ goTo(q.id); });
      g.appendChild(b);
    });
    var lg = document.getElementById("legend");
    lg.innerHTML = '<span><i style="background:#1d3a29;border:1px solid #2f5d3e"></i>Correct</span>' +
                   '<span><i style="background:#3a2122;border:1px solid #6b3331"></i>Wrong</span>' +
                   '<span><i style="background:#20252f;border:1px solid #333b4b"></i>Not attempted</span>';
  }

  /* ---------- result ---------- */
  function showResult(){
    var s = stats();
    document.getElementById("resSub").textContent = "Marking: +4 correct, −1 wrong, 0 unattempted · Total " + (4*N);
    document.getElementById("resScore").innerHTML = s.score + ' <span>/ ' + (4*N) + '</span>';
    document.getElementById("resStats").innerHTML =
      '<div class="stat"><b>' + s.correct + '</b><s>Correct</s></div>' +
      '<div class="stat"><b>' + s.wrong + '</b><s>Wrong</s></div>' +
      '<div class="stat"><b>' + s.unattempted + '</b><s>Unattempted</s></div>' +
      '<div class="stat"><b>' + s.acc.toFixed(1) + '%</b><s>Accuracy</s></div>';
    document.getElementById("quizView").classList.add("hidden");
    document.getElementById("gridView").classList.add("hidden");
    document.getElementById("resultView").classList.remove("hidden");
    window.scrollTo({top:0});
  }

  /* ---------- wiring ---------- */
  document.getElementById("prevBtn").addEventListener("click", prev);
  document.getElementById("nextBtn").addEventListener("click", next);
  document.getElementById("skipBtn").addEventListener("click", next);
  document.getElementById("gridBtn").addEventListener("click", showGrid);
  document.getElementById("gridBtn2").addEventListener("click", showGrid);
  document.getElementById("closeGrid").addEventListener("click", function(){ showQuiz(); renderQ(); });
  document.getElementById("filterSel").addEventListener("change", buildGrid);
  document.getElementById("gotoBtn").addEventListener("click", function(){
    var v = parseInt(document.getElementById("gotoInput").value, 10);
    if(!isNaN(v)) goTo(v);
  });
  document.getElementById("gotoInput").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      var v = parseInt(this.value, 10);
      if(!isNaN(v)) goTo(v);
    }
  });
  document.getElementById("submitBtn").addEventListener("click", function(){
    var s = stats();
    var msg = "Submit karna hai? " + s.attempted + " attempted, " + s.unattempted + " chhoot rahe hain.";
    if(window.confirm(msg)){
      ST.submitted = true;
      save();
      showResult();
    }
  });
  document.getElementById("reviewBtn").addEventListener("click", function(){
    ST.cur = 1; save(); showGrid();
  });
  document.getElementById("restartBtn").addEventListener("click", function(){
    if(window.confirm("Restart? Saare answers mit jayenge.")){
      ST = {ans:{}, cur:1, submitted:false};
      save();
      showQuiz(); renderQ(); hud();
      window.scrollTo({top:0});
    }
  });
  document.addEventListener("keydown", function(e){
    if(document.getElementById("quizView").classList.contains("hidden")) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "select" || tag === "textarea") return;
    if(["1","2","3","4"].indexOf(e.key) >= 0){
      var i = parseInt(e.key,10) - 1;
      var q = DATA[ST.cur-1];
      if(ST.ans[q.id] === undefined && !ST.submitted){ choose(i); }
    } else if(e.key === "ArrowRight"){ next(); }
    else if(e.key === "ArrowLeft"){ prev(); }
  });

  /* ---------- boot ----------
     KaTeX ki script tags "defer" par hain, isliye wo parse ke baad chalte hain.
     Isliye apna boot DOMContentLoaded par rakha hai — tab KaTeX ready hota hai. */
  function boot(){
    loadState();
    if(ST.submitted){ showResult(); }
    else { showQuiz(); renderQ(); }
    hud();
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
  window.addEventListener("load", function(){
    // agar KaTeX der se aaya ho to current question dobara render karo
    if(typeof window.renderMathInElement === "function" && !document.getElementById("quizView").classList.contains("hidden")){
      renderQ();
    }
  });
})();
</script>
