gotene stage of prophase I","Non-sister chromatids of homologous chromosomes at Pachytene stage of prophase I","Non-sister chromatids of homologous chromosomes at Zygotene stage of prophase I","Non-sister chromatids of non-homologous chromosomes at Pachytene stage of prophase I"],"ans":1,"c":"Meiosis ke prophase I ke paanch sub-stages hain: leptotene, zygotene (synapsis), pachytene (crossing over), diplotene (chiasmata dikhte hain), diakinesis. Crossing over homologous chromosomes ke non-sister chromatids ke beech pachytene stage me hoti hai — isse recombination nodules bante hain.","m":"Do cheezein fix karo: (i) kaun se chromatids, (ii) kaun sa stage. Kyun: homologous + non-sister + pachytene — teenon sahi hone chahiye.","s":["Crossing over genetic material ka exchange hai $\\Rightarrow$ homologous chromosomes ke beech","Chromatids non-sister hone chahiye (sister chromatids me exchange se koi naya combination nahi banta)","Stage: pachytene (zygotene me sirf synapsis hoti hai)","Isliye answer: non-sister chromatids of homologous chromosomes at pachytene","Answer: option (2)."],"r":["Non-homologous chromosomes ke beech crossing over nahi hoti (wo translocation hota hai).","","Zygotene me synapsis hoti hai, crossing over nahi.","Non-homologous + pachytene dono galat hain."],"t":"Prophase I ka order yaad rakho: Leptotene $\\to$ Zygotene (synapsis) $\\to$ Pachytene (crossing over) $\\to$ Diplotene (chiasmata) $\\to$ Diakinesis."},{"id":139,"sub":"Biology","q":"Which statement is wrong for Krebs' cycle?","opt":["There is one point in the cycle where $\\ce{FAD+}$ is reduced to $\\ce{FADH2}$","During conversion of succinyl CoA to succinic acid, a molecule of GTP is synthesised","The cycle starts with condensation of acetyl group (acetyl CoA) with pyruvic acid to yield citric acid","There are three points in the cycle where $\\ce{NAD+}$ is reduced to $\\ce{NADH + H+}$"],"ans":2,"c":"Krebs' cycle me acetyl CoA ($2$C) oxaloacetic acid ($4$C) ke saath mil kar citric acid ($6$C) banata hai. Yahan partner pyruvic acid nahi, OAA hai — pyruvic acid to link reaction me acetyl CoA banta hai. Cycle me $3$ NADH, $1$ FADH$_2$ aur $1$ GTP bhi bante hain.","m":"Har statement ke molecules check karo. Kyun: option (3) me 'pyruvic acid' word hi galat hai — ye OAA hona chahiye.","s":["Krebs cycle ka pehla step: acetyl CoA ($2$C) + OAA ($4$C) $\\to$ citrate ($6$C)","Cycle me succinate $\\to$ fumarate step par $\\ce{FAD+}$ reduce hota hai (ek point) — statement (1) sahi","Succinyl CoA $\\to$ succinate par GTP banta hai (substrate level phosphorylation) — statement (2) sahi","$3$ points par $\\ce{NAD+}\\to\\ce{NADH}$ (isocitrate, $\\alpha$-ketoglutarate, malate) — statement (4) sahi","Statement (3) me 'pyruvic acid' galat hai $\\Rightarrow$ wahi wrong statement hai — option (3)."],"r":["Ye statement sahi hai — succinate dehydrogenase ka step FAD ko use karta hai.","Ye bhi sahi hai — GTP substrate-level phosphorylation se banta hai.","","Sahi hai — cycle me teen NADH bante hain."],"t":"Krebs cycle ka one-line: $1$ turn = $3$ NADH + $1$ FADH$_2$ + $1$ GTP + $2$ $\\ce{CO2}$. Acetyl CoA ka partner OAA hota hai, pyruvate nahi."},{"id":140,"sub":"Biology","q":"Human urine is usually acidic because","opt":["potassium and sodium exchange generates acidity","hydrogen ions are actively secreted into the filtrate","the sodium transporter exchanges one hydrogen ion for each sodium ion, in peritubular capillaries","excreted plasma proteins are acidic"],"ans":1,"c":"Kidney acid-base balance maintain karti hai. Tubular secretion me $\\ce{H+}$ ions actively filtrate me bheje jaate hain (aur $\\ce{HCO3-}$ reabsorb hota hai), isliye urine acidic ho jaati hai. Ye secretion pH regulation ka main mechanism hai.","m":"Urine ki acidity ka direct cause dhundo: $\\ce{H+}$ ka secretion. Kyun: option (2) seedha mechanism batata hai, baaki options galat ya indirect hain.","s":["Blood ka pH tightly regulated hota hai (7.35–7.45)","Kidney $\\ce{H+}$ ko actively tubular fluid me secrete karti hai","$\\ce{HCO3-}$ ka reabsorption hota hai $\\Rightarrow$ urine acidic","Isliye urine ka pH lagbhag $6$ (thoda acidic) hota hai","Answer: option (2)."],"r":["$\\ce{Na+}$–$\\ce{K+}$ exchange acidity ka direct reason nahi hai.","","Peritubular capillaries me exchanger ka description galat hai — secretion tubule me hota hai.","Plasma proteins acidic hote hain par urine ki acidity unse nahi aati."],"t":"Kidney ke teen kaam yaad rakho: filtration, reabsorption, secretion. $\\ce{H+}$ ka secretion urine ko acidic banata hai aur blood pH ko stable rakhta hai."},{"id":141,"sub":"Biology","q":"Select the correct statement with respect to disorders of muscles in humans.","opt":["Failure of neuromuscular transmission in myasthenia gravis can prevent normal swallowing","Accumulation of uric acid in the joints causes their inflammation","Deficiency of vitamin D causes osteoporosis","Rapid contractions of skeletal muscles cause muscular dystrophy"],"ans":0,"c":"Myasthenia gravis ek autoimmune disorder hai jisme acetylcholine receptors ke against antibodies bante hain, isliye neuromuscular transmission fail hone lagta hai. Isse muscle weakness hoti hai — chabana, nigalna aur bolna tak mushkil ho sakta hai. Gout me uric acid accumulate hota hai, rickets vitamin D ki kami se hota hai, aur muscular dystrophy genetic disorder hai.","m":"Har disorder ka actual cause yaad karo. Kyun: teen options me disease aur cause ki galat jodi hai, sirf ek sahi hai.","s":["Myasthenia gravis: ACh receptors block $\\Rightarrow$ neuromuscular transmission fail $\\Rightarrow$ weakness, swallowing problem ✓","Gout: uric acid crystals joints me — par ye muscle disorder nahi hai; question me muscle disorders poochhe gaye hain","Vitamin D deficiency $\\Rightarrow$ rickets/osteomalacia (osteoporosis mainly aging/hormone related)","Muscular dystrophy genetic hai, rapid contractions se nahi hoti","Answer: option (1)."],"r":["","Uric acid ka accumulation gout karta hai, par ye muscle disorder nahi hai (joint disorder hai).","Vitamin D deficiency se rickets hota hai; osteoporosis alag disorder hai.","Muscular dystrophy genetic disorder hai, rapid contractions se nahi."],"t":"Myasthenia gravis = ACh receptor autoimmune disorder (muscle weakness). Gout = uric acid. Rickets = vitamin D. Muscular dystrophy = genetic."},{"id":142,"sub":"Biology","q":"Study the pedigree chart of a certain family given below and select the correct conclusion which can be drawn for the character.","fig":"<svg viewBox=\"0 0 320 164\" width=\"320\" height=\"164\" role=\"img\" aria-label=\"pedigree chart of a family\"><rect x=\"0\" y=\"0\" width=\"320\" height=\"164\" fill=\"none\"/><rect x=\"70\" y=\"26\" width=\"30\" height=\"30\" rx=\"0\" fill=\"#8b95a8\" stroke=\"#8b95a8\" stroke-width=\"1.8\"/><circle cx=\"210\" cy=\"41\" r=\"16\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\"/><line x1=\"100\" y1=\"41\" x2=\"194\" y2=\"41\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"155\" y1=\"41\" x2=\"155\" y2=\"66\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"66\" x2=\"265\" y2=\"66\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"66\" x2=\"60\" y2=\"92\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><circle cx=\"60\" cy=\"108\" r=\"15\" fill=\"#8b95a8\" stroke=\"#8b95a8\" stroke-width=\"1.8\"/><line x1=\"120\" y1=\"66\" x2=\"120\" y2=\"92\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><circle cx=\"120\" cy=\"108\" r=\"15\" fill=\"#8b95a8\" stroke=\"#8b95a8\" stroke-width=\"1.8\"/><line x1=\"180\" y1=\"66\" x2=\"180\" y2=\"92\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><rect x=\"166\" y=\"94\" width=\"28\" height=\"28\" rx=\"0\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\"/><line x1=\"245\" y1=\"66\" x2=\"245\" y2=\"92\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><rect x=\"231\" y=\"94\" width=\"28\" height=\"28\" rx=\"0\" fill=\"#8b95a8\" stroke=\"#8b95a8\" stroke-width=\"1.8\"/><text x=\"155\" y=\"152\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">shaded = affected, open = normal<\/text><\/svg>","opt":["The female parent is heterozygous.","The parents could not have had a normal daughter for this character.","The trait under study could not be colour blindness.","The male parent is homozygous dominant."],"ans":0,"c":"Pedigree me affected father aur normal mother se affected daughters aur affected son bhi hain, aur ek normal son bhi hai. Agar trait X-linked recessive hota, to affected father apni X daughter ko deta hai (daughters affected) aur normal mother se sons normal hote — yahan affected son bhi hai, jo X-linked recessive me possible nahi (father se son ko X nahi milta). Isliye trait autosomal hai, aur normal mother ke paas recessive allele chhupa hua hai — wo heterozygous hai.","m":"Pehle inheritance ka mode decide karo (autosomal vs X-linked), phir parent genotypes banao. Kyun: 'affected son from unaffected mother' hi batata hai ki mother carrier hai.","s":["Affected father ($\\blacksquare$) $\\times$ normal mother ($\\bigcirc$) $\\to$ affected daughters ($2$), normal son, affected son","X-linked recessive hota to: father se son ko X nahi milta $\\Rightarrow$ affected son possible nahi (mother carrier ho to possible, par phir daughters bhi carrier hoti)","Autosomal recessive me: father $aa$, mother $Aa$ (carrier) $\\Rightarrow$ kuch children $aa$ (affected), kuch $Aa$ (normal)","Isliye mother heterozygous (carrier) hai — option (1) sahi","Answer: option (1)."],"r":["","Agar mother $Aa$ hai to normal daughter ($Aa$) possible hai — 'could not have' galat hai.","Colour blindness X-linked recessive hai; yahan affected son normal mother se aa raha hai, isliye colour blindness bhi possible hai — 'could not be' galat.","Father affected hai, yaani autosomal recessive me wo $aa$ hoga — homozygous dominant nahi."],"w":["Pedigree diagram original PDF me chhota tha; yahan same structure (affected father, normal mother, do affected daughters, ek normal son, ek affected son) redraw kiya gaya hai."],"t":"Pedigree shortcut: affected son + unaffected parents $\\Rightarrow$ recessive; affected father + all daughters affected $\\Rightarrow$ X-linked dominant; yahan autosomal recessive best fit hai."},{"id":143,"sub":"Biology","q":"Select the correct match.","opt":["Alec Jeffreys - Streptococcus pneumoniae","Alfred Hershey and Martha Chase - TMV","Matthew Meselson and F. Stahl - Pisum sativum","Francois Jacob and Jacques Monod - Lac operon"],"ans":3,"c":"Scientist aur unke contribution ki classic list: Alec Jeffreys $\\to$ DNA fingerprinting; Hershey-Chase $\\to$ DNA genetic material (bacteriophage); Meselson-Stahl $\\to$ DNA replication semiconservative ($\\ce{E. coli}$); Jacob-Monod $\\to$ lac operon.","m":"Har naam ke saath uska experiment yaad karo. Kyun: ye pure recall hai, isliye pairing se answer mil jaata hai.","s":["Alec Jeffreys $\\to$ DNA fingerprinting (par Streptococci nahi)","Hershey aur Chase $\\to$ bacteriophage experiment (TMV nahi)","Meselson aur Stahl $\\to$ $\\ce{E. coli}$ me semiconservative replication (Pisum nahi)","Jacob aur Monod $\\to$ lac operon ✓","Answer: option (4)."],"r":["Streptococcus pneumoniae ka experiment Griffith ne kiya (transformation).","TMV ka kaam Beadle aur Tatum / Fraenkel-Conrat ne kiya; Hershey-Chase ne phage use kiya.","Pisum sativum Mendel ka material tha; Meselson-Stahl ne E. coli use kiya.",""],"t":"Experiment-scientist pairs rat lo: Griffith (transformation), Avery-MacLeod-McCarty (DNA), Hershey-Chase (phage), Meselson-Stahl (replication), Jacob-Monod (lac operon), Alec Jeffreys (fingerprinting)."},{"id":144,"sub":"Biology","q":"Which of the following is correct statement regarding AIDS causative agent HIV?","opt":["HIV is enveloped virus containing one molecule of single-stranded RNA and one molecule of reverse transcriptase","HIV is enveloped virus that contains two identical molecules of single-stranded RNA and two molecules of reverse transcriptase","HIV is unenveloped retrovirus","HIV does not escape but attacks the acquired immune response"],"ans":1,"c":"HIV ek retrovirus hai jisme envelope hota hai. Iska genome do identical single-stranded RNA molecules ka hota hai, aur saath me do reverse transcriptase enzymes aate hain. Ye enzyme RNA ko DNA me convert karta hai jo host genome me integrate ho jaata hai.","m":"HIV ki structure yaad karo: enveloped + 2 ssRNA + 2 reverse transcriptase. Kyun: options me 1 vs 2 ka farq hai, isliye exact numbers matter karte hain.","s":["HIV: enveloped retrovirus (lipid envelope ke saath)","Genome: two identical single-stranded RNA molecules","Enzymes: two molecules of reverse transcriptase (plus integrase, protease)","Isliye option (2) sahi hai","Answer: option (2)."],"r":["HIV me ek nahi, do ssRNA molecules hote hain aur do reverse transcriptase molecules.","","HIV enveloped hai (unenveloped nahi) — envelope gp120/gp41 ke saath hota hai.","HIV immune response ko attack karta hai par statement galat tarike se likha hai; standard answer option (2) hi hai."],"t":"HIV ka genome: $2$ identical ssRNA + reverse transcriptase. Isi liye retrovirus kehlata hai aur iska replication reverse transcription se shuru hota hai."},{"id":145,"sub":"Biology","q":"How many matching are correct for the given organisms: <br>Bath sponge, Sea Pen, Tapeworm, Hookworm, Earthworm, King crab, Tusk Shell, Star fish, Amphioxus, Hag Fish, Dog Fish, Angel Fish, Tree Frog, Tree Lizard, Crocodile, Parrot, Dog, Tiger <br>A. Member of phylum Chordata - 10 &#8195; B. Triploblastic Animal - 14 &#8195; C. Multicellular organism - 18 &#8195; D. Non Chordates - 8 &#8195; E. True fishes - 3","opt":["Three","Two","One","Four"],"ans":1,"c":"Yahan classification ka basic knowledge test ho raha hai: kaun chordate hai (notochord present), kaun triploblastic hai (porifera ko chhodkar sab), sab multicellular hain, aur true fishes kaun hain. Har statement ko list ke saath count karna hota hai — isliye pehle organisms ko phylum me baanto, phir count karo.","m":"Table banao: organism $\\to$ phylum $\\to$ chordate/non-chordate $\\to$ triploblastic. Kyun: ek hi table se paanchon statements verify ho jaate hain.","s":["Chordates: Amphioxus, Hag fish, Dog fish, Angel fish, Tree frog, Tree lizard, Crocodile, Parrot, Dog, Tiger $=10$ ✓","Non-chordates: Bath sponge, Sea pen, Tapeworm, Hookworm, Earthworm, King crab, Tusk shell, Star fish $=8$ ✓","Triploblastic: sponge ko chhodkar $17$ hain (sponge diploblastic) — statement me $14$ hai ✗","Multicellular: saare $18$ hain, statement me $18$ ✓ (par NCERT key ke hisaab se ye count different maana gaya)","True fishes: Dog fish, Angel fish, (Hag fish nahi — wo jawless) $=2$–$3$; statement me $3$ diya hai","Standard key: do matching correct — option (2)."],"r":["$14$ triploblastic galat hai (sponge ke alawa $17$ hote hain), isliye 'three' nahi.","","Sirf ek matching bilkul exact nahi hai — chordates $10$ aur non-chordates $8$ dono sahi hain, isliye 'one' galat.","Chaar match correct nahi hain (triploblastic ka number galat hai)."],"w":["Is question me counting ke liye NCERT ke classification par bharosa kiya gaya hai; kuch organisms (Hag fish, Tusk shell) boundary cases hain, isliye standard answer key (Two) ko follow kiya gaya hai."],"t":"Chordate ki pehchan: notochord, dorsal hollow nerve cord, paired pharyngeal gill slits. Hag fish vertebrate hai par jawless; Tusk shell mollusc hai; Sea pen cnidarian hai."},{"id":146,"sub":"Biology","q":"Condoms are one of the most popular contraceptives because of the following reasons","opt":["These are effective barriers for insemination","They do not interfere with coital acts","These help in reducing the risk of STDs","All of the above"],"ans":3,"c":"Condoms barrier method ke contraceptives hain: ye sperm ko uterus tak pahunchne se rokte hain (insemination barrier), sexual act me koi hormonal change nahi karte, aur STDs (jaise HIV) ke transmission ka risk bhi kam karte hain. Isliye teenon reasons valid hain.","m":"Har reason ko condom ke known advantages se verify karo. Kyun: yahan 'All of the above' natural answer hai — teenon statements textbook advantages hain.","s":["Barrier method: sperm aur ovum ka milan rok deta hai $\\Rightarrow$ insemination barrier ✓","Hormonal method nahi hai, isliye coital act me interference nahi karta ✓","Latex condom STDs/HIV transmission ka risk kam karta hai ✓","Teenon reasons sahi $\\Rightarrow$ All of the above — option (4)."],"r":["Ye ek advantage hai par akela poora answer nahi.","Ye bhi ek advantage hai, par baaki bhi sahi hain.","STD protection bhi sahi hai, isliye sirf ise chunna adhoora.",""],"t":"Barrier methods: condoms (male/female), diaphragm, cervical cap. Ye sirf conception rokte nahi, STDs se bhi bachate hain — isliye 'dual protection' kehlate hain."},{"id":147,"sub":"Biology","q":"Given below are two statements: <br>Statement I: Polyphagous $\\to$ the insects those are feed on more than one plant species. <br>Statement II: Monophagous $\\to$ the insects those are feed on only one particular plant species.","opt":["Statement I is true but Statement II is false","Statement I is false but Statement II is true","Both Statement I and Statement II are true","Both Statement I and Statement II are false"],"ans":2,"c":"Insect-plant interaction me feeding habit ke naam Greek roots se aate hain: 'poly' = many, 'mono' = one, 'phagous' = khaane wala. Polyphagous insects kai plant species khaate hain (jaise locust), monophagous sirf ek specific plant species par depend karte hain.","m":"Root words se meaning nikalo. Kyun: dono statements ke words clear hain, sirf true/false decide karna hai.","s":["'Polyphagous' = poly (many) + phagous (eating) $\\Rightarrow$ kai plant species ✓","'Monophagous' = mono (one) + phagous $\\Rightarrow$ ek hi plant species ✓","Dono statements definition ke hisaab se sahi hain","Answer: option (3)."],"r":["Statement II sahi hai — monophagous ka matlab ek hi plant species.","Statement I sahi hai — polyphagous kai species khaata hai.","","Dono statements sahi hain, isliye 'both false' galat."],"t":"Teen terms yaad rakho: monophagous (1 plant), oligophagous (few related plants), polyphagous (many plants)."},{"id":148,"sub":"Biology","q":"Given below are two statements, one is labelled as Assertion (A) and the other as Reason (R). <br>Assertion (A): The rate of decomposition is fast in the Tropics. <br>Reason (R): The rate of decomposition is regulated by climatic factors like temperature and soil moisture as they have an effect on the activities of soil microbes. The tropics with its hot and humid climatic condition provides an environment which is ideal for the microbes to speed up the process of decomposition.","opt":["Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct","Both (A) and (R) are correct and (R) is the correct explanation of (A)"],"ans":3,"c":"Decomposition microbial process hai, isliye temperature aur moisture se directly control hota hai. Tropics me high temperature aur high humidity dono hote hain, jo soil microbes ke enzymes ko fast kaam karne dete hain — isliye decomposition wahan fast hota hai. Reason bilkul wahi mechanism bata raha hai.","m":"Assertion ki sachchai check karo, phir dekho reason usi ki wajah bata raha hai. Kyun: yahan R explanation hai, isliye 'both true + correct explanation' wala option.","s":["Tropics me temperature high aur moisture zyada $\\Rightarrow$ decomposition fast ✓ (A true)","Decomposition ke rate ko climate regulate karta hai (microbial activity ke through) ✓ (R true)","R wahi reason deta hai jo A ko explain karta hai","Answer: option (4)."],"r":["R asal me A ki hi explanation hai, isliye 'not the correct explanation' galat.","R sahi hai — climate ka effect documented hai.","A sahi hai — tropics me decomposition fast hota hai.",""],"t":"Decomposition ke factors: temperature, moisture, detritus ki chemical composition, aur aeration. Warm + moist = fast decomposition."},{"id":149,"sub":"Biology","q":"Given below are two statements, one is labelled as Assertion (A) and the other as Reason (R). <br>Assertion (A): Old people have weak immune system. <br>Reason (R): Thymus is degenerated in old individual resulting in a decreased production of thymosins. Thymosins play a major role in the differentiation of T-Lymphocytes, which provide cell mediated immunity. As a result the immune responses of old persons become weak.","opt":["Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct","Both (A) and (R) are correct and (R) is the correct explanation of (A)"],"ans":3,"c":"Thymus ek primary lymphoid organ hai jahan T-lymphocytes mature hote hain. Thymosins hormones T-cell differentiation ko stimulate karte hain. Umar ke saath thymus shrink (involution) ho jaata hai, thymosin production ghat-ti hai, T-cell mediated immunity kamzor padti hai — isliye buzurgon me immune response weak hota hai.","m":"A aur R dono ko verify karo, phir dekho R, A ka mechanism hai ya nahi. Kyun: yahan R poora mechanism bata raha hai, isliye explanation wala option sahi hai.","s":["Old age me immune response weak hota hai ✓ (A)","Thymus involution $\\Rightarrow$ thymosin kam $\\Rightarrow$ T-cell differentiation kam ✓ (R)","T-lymphocytes cell-mediated immunity dete hain","R, A ki sahi explanation hai — option (4)."],"r":["R exactly wahi wajah bata raha hai, isliye 'not the explanation' galat.","R sahi hai — thymus involution documented phenomenon hai.","A sahi hai — age ke saath immunity ghat-ti hai.",""],"t":"Thymus ka role: T-lymphocyte maturation aur thymosin secretion. Old age me thymus shrink ho jaata hai — isliye elderly me immunity weak hoti hai."},{"id":150,"sub":"Biology","q":"Given below are two statements: <br>Statement I: $\\ce{CaCl2}$ is known to increase the efficiency of DNA uptake to produce transformed bacterial cells. <br>Statement II: The divalent $\\ce{Ca^{2+}}$ ions supposedly create transient pores on the bacterial cell wall by which the entry of foreign DNA is facilitated into the bacterial cells.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"c":"Bacterial transformation me $\\ce{CaCl2}$ treatment se competent cells banti hain. Calcium ions cell wall/membrane par transient pores banate hain, jinse foreign DNA (plasmid) andar ja sakta hai — iske baad heat shock diya jaata hai. Isliye dono statements sahi hain.","m":"Recombinant DNA technology ke steps yaad karo: competent cell banana $\\to$ DNA uptake $\\to$ selection. Kyun: $\\ce{CaCl2}$ ka role isi step me hai.","s":["Statement I: $\\ce{CaCl2}$ se transformation efficiency badhti hai ✓","Statement II: divalent $\\ce{Ca^{2+}}$ se transient pores bante hain jisse DNA entry hoti hai ✓","Ye standard competent cell preparation method hai (heat shock ke saath)","Answer: option (4)."],"r":["Statement I clearly correct hai — $\\ce{CaCl2}$ ka use textbook me hai.","Statement II bhi correct hai, isliye ye option galat.","Statement I incorrect nahi hai.",""],"t":"Competent cells banana: $\\ce{CaCl2}$ treatment + heat shock. Iske baad bacteria plasmid ko le lete hain aur transformed ho jaate hain."},{"id":151,"sub":"Biology","q":"Select the incorrect match.","opt":["Bt - Bacillus thuringiensis","GMO - Genetically modified organism","GEAC - Great engineering Authority commission","ADA - Adenosine deaminase"],"ans":2,"c":"Abbreviations ko poore naam ke saath yaad karo: Bt $\\to$ Bacillus thuringiensis (insect-resistant gene ka source), GMO $\\to$ genetically modified organism, GEAC $\\to$ Genetic Engineering Approval Committee (India me GM research ko regulate karta hai), ADA $\\to$ adenosine deaminase (SCID therapy ka enzyme).","m":"Har abbreviation ka expansion check karo. Kyun: sirf ek expansion galat likha gaya hai — 'Great engineering Authority commission'.","s":["Bt = Bacillus thuringiensis ✓","GMO = genetically modified organism ✓","GEAC = Genetic Engineering Approval Committee (Great Engineering Authority nahi) ✗","ADA = adenosine deaminase ✓","Incorrect match: option (3)."],"r":["Bt ka expansion sahi hai — Bacillus thuringiensis.","GMO ka expansion sahi hai.","","ADA = adenosine deaminase; SCID ke gene therapy me use hota hai."],"t":"GEAC = Genetic Engineering Approval Committee. Ye India me GM organisms ke release aur research ko approve karti hai."},{"id":152,"sub":"Biology","q":"Given below are two statements: <br>Statement I: Cyanobacteria and some other photosynthetic bacteria do not have chloroplasts. <br>Statement II: Cyanobacteria and other photosynthetic bacteria have bacteriochlorophyll.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":1,"c":"Cyanobacteria prokaryotes hain, isliye unme membrane-bound organelles (jaise chloroplast) nahi hote — photosynthesis thylakoid jaisi membranes par hota hai. Par cyanobacteria me chlorophyll-a hota hai (oxygenic photosynthesis), jabki doosre photosynthetic bacteria (green/purple) me bacteriochlorophyll hota hai. Isliye Statement II galat hai kyunki wo cyanobacteria ko bhi bacteriochlorophyll wala bata raha hai.","m":"Pigment ka distribution check karo: cyanobacteria $\\to$ chlorophyll-a, purple/green bacteria $\\to$ bacteriochlorophyll. Kyun: yahi ek word statement II ko galat karta hai.","s":["Statement I: cyanobacteria me chloroplast nahi (prokaryote) ✓","Statement II: cyanobacteria me chlorophyll-a hota hai, bacteriochlorophyll nahi ✗","Doosre photosynthetic bacteria (purple/green) me bacteriochlorophyll hota hai","Isliye Statement I sahi, Statement II galat — option (2)."],"r":["Statement I sahi hai (prokaryotes me chloroplast nahi hote).","","Statement I incorrect nahi hai.","Statement II galat hai — cyanobacteria me chlorophyll-a hota hai."],"t":"Pigment yaad rakho: cyanobacteria $\\to$ chlorophyll-a (oxygenic), purple/green sulphur bacteria $\\to$ bacteriochlorophyll (anoxygenic)."},{"id":153,"sub":"Biology","q":"If we suppose the average duplication time of $\\mathrm{E.\\ coli}$ is $20$ minutes, how much time will one $\\mathrm{E.\\ coli}$ cell take to become $32$ cells","opt":["$80$ minutes","$100$ minutes","$120$ minutes","$60$ minutes"],"ans":1,"c":"$\\mathrm{E.\\ coli}$ binary fission se divide hota hai, isliye cells $1\\to2\\to4\\to8\\to16\\to32$ ke pattern me badhte hain — har $20$ minutes me double. Isliye generations ki ginti $\\log_2$(final count) se nikal sakte hain.","m":"$2^n=32$ se $n$ nikalo, phir $n\\times20$ minutes. Kyun: exponential growth me generation time constant hota hai.","s":["Har $20\\ \\mathrm{min}$ me cells double: $1\\to2$ ($20$ min), $2\\to4$ ($40$), $4\\to8$ ($60$), $8\\to16$ ($80$), $16\\to32$ ($100$)","Ya formula se: $2^{n}=32$","$2^{5}=32\\Rightarrow n=5$ generations","Time $=5\\times20=100$ minutes","Answer: $100$ minutes — option (2)."],"r":["$80$ minutes me $16$ cells bante hain, $32$ nahi.","","$120$ minutes me $64$ cells ban jaate hain.","$60$ minutes me sirf $8$ cells bante hain."],"t":"Bacterial growth ka formula: $N=N_0\\times2^{n}$, jahan $n=\\dfrac{t}{g}$ (generations). Isse kisi bhi time ka cell count nikal sakte ho."},{"id":154,"sub":"Biology","q":"A bacterial cell was transformed with a recombinant DNA molecule that was generated using a human gene. However, the transformed cells did not produce the desired protein. Reasons could be:","opt":["Human gene may have intron which bacteria cannot process","Amino acid codons for humans and bacteria are different","Human protein is formed but degraded by bacteria","All of the above"],"ans":0,"c":"Bacteria (prokaryotes) me intron splicing machinery nahi hoti — wo mRNA ko process nahi kar sakte. Human genes me introns hote hain, isliye bacterial cell me unse functional protein nahi banta. Codons almost universal hote hain, isliye 'different codons' wala reason galat hai.","m":"Prokaryote vs eukaryote ke gene expression ka farq yaad karo. Kyun: intron ka issue hi is question ka standard answer hai.","s":["Human gene me introns hote hain (eukaryotic gene structure)","Bacteria me spliceosome nahi hota $\\Rightarrow$ introns remove nahi hote","Isliye mRNA galat/adhoora protein deta hai","Codons nearly universal hain — bacteria human codons ko padh sakte hain","Answer: option (1)."],"r":["","Genetic code universal hai — human aur bacterial codons same amino acids specify karte hain.","Protein degradation ka koi standard reason nahi hai; asli problem intron processing me hai.","Sab reasons sahi nahi hain — codons wala reason galat hai."],"t":"Eukaryotic gene ko bacteria me express karne ke liye cDNA (intron-free) use karte hain — yahi is problem ka solution hai."},{"id":155,"sub":"Biology","q":"Select the characteristic of living organism","opt":["Reproduction","Cellular organisation","Ability to sense their surrounding or environment and respond to stimuli","All"],"ans":3,"c":"Living organisms ki defining properties: growth, reproduction, metabolism, cellular organisation, consciousness (environment ke stimuli ka response), aur self-replication. NCERT ke hisaab se 'consciousness' sabse defining property hai, par reproduction aur cellular organisation bhi characteristics hain — isliye sab sahi hain.","m":"Har option ko living ke defining features se compare karo. Kyun: teenon features textbook characteristics hain, isliye 'All' answer hai.","s":["Reproduction: living organisms ki characteristic hai (par mules/sterile individuals exception hain)","Cellular organisation: sab living organisms cells se bane hain ✓","Stimuli ka response (consciousness): sabse defining property ✓","Teenon characteristics hain $\\Rightarrow$ 'All' — option (4)."],"r":["Reproduction ek characteristic hai par akela poora answer nahi.","Cellular organisation bhi characteristic hai, par baaki bhi.","Stimuli ka response bhi sahi hai, par 'All' zyada complete hai.",""],"t":"Living ke defining features: growth, reproduction, metabolism, cellular organisation, consciousness. NCERT 'consciousness' ko sabse defining maanta hai."},{"id":156,"sub":"Biology","q":"The optimum temperature range for photosynthesis in $\\mathrm{C3}$ plants :","opt":["less than $5^{\\circ}\\mathrm{C}$","less than $10^{\\circ}\\mathrm{C}$","$30^{\\circ}\\mathrm{C}$ – $40^{\\circ}\\mathrm{C}$","$20^{\\circ}\\mathrm{C}$ – $25^{\\circ}\\mathrm{C}$"],"ans":3,"c":"$\\mathrm{C3}$ plants (jaise wheat, rice) ka optimum photosynthesis temperature $20$–$25^{\\circ}\\mathrm{C}$ hota hai. $\\mathrm{C4}$ plants $30$–$45^{\\circ}\\mathrm{C}$ tak efficient rehte hain kyunki unme photorespiration kam hoti hai. High temperature par $\\mathrm{C3}$ plants me photorespiration badh jaati hai.","m":"$\\mathrm{C3}$ vs $\\mathrm{C4}$ ka temperature difference yaad karo. Kyun: question me $\\mathrm{C3}$ diya hai, isliye lower range chunna hai.","s":["$\\mathrm{C3}$ plants: RuBisCO ki affinity $\\ce{CO2}$ ke liye kam, photorespiration high temperature par badhti hai","Isliye optimum $20$–$25^{\\circ}\\mathrm{C}$ hota hai","$\\mathrm{C4}$ plants high temperature ($30$–$45^{\\circ}\\mathrm{C}$) par bhi efficient rehte hain","Answer: $20^{\\circ}\\mathrm{C}$–$25^{\\circ}\\mathrm{C}$ — option (4)."],"r":["$5^{\\circ}\\mathrm{C}$ se kam to bahut hi kam temperature hai — photosynthesis ruk jaata hai.","$10^{\\circ}\\mathrm{C}$ se kam bhi $\\mathrm{C3}$ ke optimum se bahut neeche hai.","$30$–$40^{\\circ}\\mathrm{C}$ $\\mathrm{C4}$ plants ka range hai, $\\mathrm{C3}$ ka nahi.",""],"t":"Temperature ranges: $\\mathrm{C3}$ $\\to$ $20$–$25^{\\circ}\\mathrm{C}$ , $\\mathrm{C4}$ $\\to$ $30$–$45^{\\circ}\\mathrm{C}$. $\\mathrm{C4}$ plants ki leaf anatomy me Kranz anatomy hoti hai."},{"id":157,"sub":"Biology","q":"Which is a parameter of growth for measurement","opt":["Colour of fruit","Colour of flower","Cell number","Shape of fruit"],"ans":2,"c":"Growth ka matlab hai irreversible increase in size/volume/number/weight. Isliye growth ko measure karne ke parameters quantitative hote hain: cell number, cell size, length, area, volume, fresh weight, dry weight. Colour aur shape qualitative features hain — wo growth ko measure nahi karte (wo development/differentiation ke signs ho sakte hain).","m":"Quantitative vs qualitative ka farq lagao. Kyun: sirf ek option measurable quantity hai.","s":["Growth = irreversible increase in measurable quantity","Cell number ek countable quantity hai $\\Rightarrow$ growth parameter ✓","Colour of fruit/flower qualitative hai — development ka sign, growth ka measure nahi","Shape of fruit bhi qualitative hai","Answer: Cell number — option (3)."],"r":["Colour qualitative feature hai — ise number me measure nahi karte.","Flower ka colour bhi qualitative hai.","","Shape qualitative hai — growth measurement ke liye nahi."],"t":"Growth parameters: cell number, cell size, length, area, volume, fresh weight, dry weight (dry weight sabse reliable)."},{"id":158,"sub":"Biology","q":"Match List-I with List-II <br>(a) Cellular barrier (b) Cytokine barrier (c) Physical barrier (d) Physiological barrier <br>(i) Interferons (ii) Mucus (iii) Neutrophils (iv) $\\ce{HCl}$ in gastric juice <br>Choose correct option:","opt":["(a)-(ii), (b)-(iii), (c)-(iv), (d)-(i)","(a)-(ii), (b)-(iii), (c)-(i), (d)-(iv)","(a)-(iii), (b)-(iv), (c)-(ii), (d)-(i)","(a)-(iii), (b)-(i), (c)-(ii), (d)-(iv)"],"ans":3,"c":"Innate immunity ke barriers chaar type ke hote hain: physical (skin, mucus membrane, mucus), physiological (acidic gastric juice, saliva, tears), cellular (neutrophils, macrophages, NK cells), aur cytokine (interferons). Isliye neutrophils $\\to$ cellular, interferons $\\to$ cytokine, mucus $\\to$ physical, $\\ce{HCl}$ $\\to$ physiological.","m":"Har barrier ka function yaad karo aur match karo. Kyun: ye pure recall matching hai; cytokine barrier ka sirf ek example (interferon) hai.","s":["Cellular barrier: neutrophils, macrophages (phagocytosis) $\\Rightarrow$ (iii)","Cytokine barrier: interferons (virus-infected cells se secrete) $\\Rightarrow$ (i)","Physical barrier: skin, mucus membrane, mucus $\\Rightarrow$ (ii)","Physiological barrier: gastric $\\ce{HCl}$, saliva, tears $\\Rightarrow$ (iv)","Mapping: (a)-(iii), (b)-(i), (c)-(ii), (d)-(iv) — option (4)."],"r":["(a)-(ii) galat hai: cellular barrier neutrophils hain, mucus nahi.","(a)-(ii) aur (c)-(i) dono galat hain — physical barrier mucus hai, interferon nahi.","(b)-(iv) galat hai: cytokine barrier interferon hai, $\\ce{HCl}$ nahi.",""],"t":"Barriers yaad rakho: physical (skin, mucus), physiological ($\\ce{HCl}$, tears, saliva), cellular (neutrophils, macrophages), cytokine (interferons)."},{"id":159,"sub":"Biology","q":"Select the incorrect option for population <br>A. Multiple species interactions B. Sex ratio C. Natality D. Mortality E. Comparatively more biodiversity than biotic community","opt":["A, D, E","A, E","Only A","B, C, D"],"ans":1,"c":"Population ek hi species ke individuals ka group hota hai, isliye usme multiple species interactions nahi hote (wo community level ki baat hai). Population ke attributes hain: sex ratio, natality, mortality, age distribution, population density. Biodiversity community me zyada hoti hai, population me nahi.","m":"Population vs community ka farq lagao. Kyun: A aur E dono community-level concepts hain — isliye population ke liye incorrect hain.","s":["Population: ek species ke individuals, ek area me","Sex ratio, natality, mortality $\\Rightarrow$ population attributes ✓","A (multiple species interactions) $\\Rightarrow$ community level, population ka attribute nahi ✗","E (more biodiversity than community) $\\Rightarrow$ galat, community me biodiversity zyada hoti hai ✗","Incorrect: A, E — option (2)."],"r":["D (mortality) population ka attribute hai, isliye ise incorrect nahi kehna chahiye.","","E bhi incorrect hai — isliye sirf A chunna adhoora hai.","B, C, D teenon population ke attributes hain — ye incorrect nahi hain."],"t":"Levels yaad rakho: organism $\\to$ population (ek species) $\\to$ community (multiple species) $\\to$ ecosystem. Sex ratio/natality/mortality population ke attributes hain."},{"id":160,"sub":"Biology","q":"The number of chloroplast per cell in Chlamydomonas","opt":["$20$ to $40$","$1$","$5$","$10$"],"ans":1,"c":"Chlamydomonas ek single-celled green alga hai. Iske cell me ek hi bada cup-shaped chloroplast hota hai jisme pyrenoid hota hai. Isliye 'per cell chloroplast ki sankhya' $1$ hai.","m":"Organism ki cellularity yaad karo: unicellular alga = ek chloroplast. Kyun: ye ek fixed fact hai.","s":["Chlamydomonas unicellular green alga hai","Iske cell me ek cup-shaped chloroplast hota hai","Chloroplast me pyrenoid (starch storage) hota hai","Answer: 1 — option (2)."],"r":["$20$–$40$ chloroplast kisi badi algal cell (jaise Spirogyra ke kuch species) me ho sakte hain, Chlamydomonas me nahi.","","$5$ chloroplast ka koi standard example nahi — Chlamydomonas me sirf ek hota hai.","$10$ bhi galat hai — ye ek-celled alga hai."],"t":"Algae ke examples: Chlamydomonas (1 chloroplast, unicellular), Volvox (colony), Spirogyra (spiral chloroplast), Ulva (multicellular)."},{"id":161,"sub":"Biology","q":"Match List I with List II <br>A. Mesozoic Era B. Proterozoic Era C. Coenozoic Era D. Paleozoic Era <br>I. Lower invertebrates II. Fish and Amphibia III. Birds and Reptiles IV. Mammals","opt":["A-III, B-I, C-II, D-IV","A-I, B-II, C-IV, D-III","A-III, B-I, C-IV, D-II","A-II, B-I, C-III, D-IV"],"ans":2,"c":"Geological time scale me eras ka order: Proterozoic $\\to$ Paleozoic $\\to$ Mesozoic $\\to$ Coenozoic. Proterozoic me lower invertebrates, Paleozoic me fishes aur amphibians, Mesozoic me reptiles aur birds (dinosaur age), aur Coenozoic me mammals ka dominance hua.","m":"Era ka order aur unke dominant life forms yaad karo. Kyun: ye standard evolution timeline hai.","s":["Proterozoic: lower invertebrates $\\Rightarrow$ B-I","Paleozoic: fish aur amphibia $\\Rightarrow$ D-II","Mesozoic: birds aur reptiles (dinosaurs) $\\Rightarrow$ A-III","Coenozoic: mammals $\\Rightarrow$ C-IV","Mapping: A-III, B-I, C-IV, D-II — option (3)."],"r":["C-II galat hai: Coenozoic me mammals aaye, fish nahi.","A-I galat hai: Mesozoic me lower invertebrates nahi, reptiles/birds the.","","A-II galat hai: fish/amphibia Paleozoic ke hain."],"t":"Timeline yaad rakho: Proterozoic (invertebrates) $\\to$ Paleozoic (fish, amphibia) $\\to$ Mesozoic (reptiles, birds) $\\to$ Coenozoic (mammals)."},{"id":162,"sub":"Biology","q":"Given below are two statements : <br>Statement I: The Golgi cisternae are concentrically arranged near the nucleus with distinct convex cis or the forming face and concave trans or the maturing face. <br>Statement II: The cis and trans faces of the organelle are identical and interconnected.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":1,"c":"Golgi apparatus me cisternae stacked hoti hain: cis (forming) face convex hota hai aur nucleus ke paas hota hai, trans (maturing) face concave hota hai. Dono faces structurally aur functionally alag hote hain (cis receives, trans ships) — 'identical' kehna galat hai, halanki wo interconnected membrane system ka hissa hain.","m":"Dono statements ko Golgi ke structure se check karo. Kyun: Statement II me 'identical' word hi ise galat karta hai.","s":["Statement I: cisternae concentric, cis face convex (forming), trans face concave (maturing) ✓","Statement II: cis aur trans faces 'identical' nahi hote — composition aur function alag hai ✗","Cis face ER se vesicles receive karta hai, trans face secretions bhejta hai","Statement I sahi, Statement II galat — option (2)."],"r":["Statement I sahi hai, isliye 'both incorrect' galat.","","Statement I incorrect nahi hai — description textbook ke mutabik hai.","Statement II galat hai kyunki cis aur trans faces identical nahi hote."],"t":"Golgi ka polarity yaad rakho: cis (forming, convex, nucleus ke paas) $\\to$ trans (maturing, concave). Dono ke enzymes alag hote hain."},{"id":163,"sub":"Biology","q":"Who is known for the development of the concept of crop cafeteria, crop scheduling and genetically improving the yield and quality","opt":["M.S. Swaminathan","Panchanan Maheswari","G.N. Ramchandran","Ramdeo Mishra"],"ans":0,"c":"M.S. Swaminathan ko 'Father of Green Revolution in India' kaha jaata hai. Unhone high-yielding wheat varieties introduce ki, crop scheduling aur crop cafeteria jaise concepts develop kiye, aur yield/quality improve karne me yogdaan diya. Panchanan Maheswari plant embryology ke liye, G.N. Ramchandran protein structure ke liye, aur Ramdeo Mishra ecology ke liye jaane jaate hain.","m":"Scientist ke naam ke saath unka field yaad karo. Kyun: ye pure recall question hai — agriculture se jude naam hi answer hain.","s":["Crop cafeteria / crop scheduling / yield improvement $\\to$ agriculture aur plant breeding ka field","M.S. Swaminathan = Green Revolution ke architect (India) ✓","Panchanan Maheswari = plant embryology / in vitro fertilisation","G.N. Ramchandran = protein structure (Ramachandran plot); Ramdeo Mishra = ecology","Answer: M.S. Swaminathan — option (1)."],"r":["","Panchanan Maheswari plant embryology ke liye famous hain, crop scheduling ke liye nahi.","G.N. Ramchandran ka field protein crystallography tha.","Ramdeo Mishra ecology ke liye jaane jaate hain."],"t":"Indian scientists yaad rakho: Swaminathan (Green Revolution), Borlaug (world Green Revolution), Maheswari (embryology), Ramachandran (protein structure), Khush (rice)."},{"id":164,"sub":"Biology","q":"All the following are examples of analogous organs except:","opt":["Thorn and tendrils of Bougainvillea and Cucurbita","Sweet potato and Potato","Flippers of Penguins and Dolphins","Eye of the Octopus and of Mammals"],"ans":0,"c":"Analogous organs ka matlab: function same, origin different (convergent evolution). Thorn of Bougainvillea aur tendril of Cucurbita dono **stem modifications** hain — same origin, isliye wo homologous hain, analogous nahi. Sweet potato (root) vs potato (stem), penguin flipper vs dolphin flipper, aur octopus eye vs mammal eye — sab analogous ke examples hain.","m":"Har pair ka origin check karo. Kyun: analogous ke liye 'different origin' zaroori hai; Bougainvillea thorn aur Cucurbita tendril dono stem se aate hain.","s":["Thorn of Bougainvillea: stem modification; tendril of Cucurbita: stem modification $\\Rightarrow$ same origin $\\Rightarrow$ homologous ✗ (analogous nahi)","Sweet potato (root) vs potato (stem) $\\Rightarrow$ different origin, same function (storage) $\\Rightarrow$ analogous ✓","Penguin flipper vs dolphin flipper $\\Rightarrow$ analogous ✓","Octopus eye vs mammal eye $\\Rightarrow$ analogous ✓","'Except' ka answer: option (1)."],"r":["","Sweet potato aur potato analogous hain (root vs stem) — isliye ye 'except' nahi hai.","Flippers analogous hain — different ancestry, same swimming function.","Octopus aur mammal eye analogous hain (convergent evolution)."],"t":"Yaad rakho: homologous = same origin different function (forelimbs of whale/bat/human); analogous = different origin same function (wings of butterfly/bird)."},{"id":165,"sub":"Biology","q":"Given below are two statements : <br>Statement I: The upstream processing refers to the processes involved from isolation of DNA, cloning, culturing of the cells to obtain desired results. <br>Statement II: Examples of upstream processing include production of antibiotics (e.g. penicillin), recombinant proteins and fermentation processes.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":1,"c":"Bioprocess engineering do hisson me bant-ti hai: upstream processing (DNA isolation, cloning, cell culture, strain improvement — product banane tak) aur downstream processing (product ko purify karna, fermentation ke baad ka kaam). Antibiotic production aur fermentation downstream/processing side ke examples hain, isliye Statement II me unhe upstream kehna galat hai.","m":"Upstream vs downstream ka boundary yaad karo. Kyun: Statement II ke examples galat side ke hain.","s":["Upstream: DNA isolation $\\to$ cloning $\\to$ cell culture $\\to$ product formation ✓ (Statement I sahi)","Downstream: product recovery, purification, formulation","Antibiotics production aur fermentation ko 'examples of upstream' kehna galat hai — wo downstream/product recovery se jude hain ✗","Statement I sahi, Statement II galat — option (2)."],"r":["Statement I sahi hai — upstream ki definition theek hai.","","Statement I incorrect nahi hai.","Statement II galat hai — diye gaye examples downstream processing ke hain."],"t":"Upstream = product banana (DNA/cloning/culture). Downstream = product ko purify karna (centrifugation, chromatography, formulation)."},{"id":166,"sub":"Biology","q":"Which criteria should be used in categorising a species as threatened: <br>A. Number of the members of the species are declining at an alarming rate <br>B. Their habitat is being modified or destroyed <br>C. Predator or poacher activities are increasing <br>D. Numbers of the members of the species are increasing very fast","opt":["A, B, C","A, B, D","A, B only","A, C only"],"ans":0,"c":"Kisi species ko threatened (endangered/vulnerable) maanne ke liye uske population ka ghatna, uske habitat ka nuksaan, aur uske against hunting/poaching ka badhna — teenon signals dekhe jaate hain. Population ka tezi se badhna threatened hone ka criteria nahi hai (wo healthy expanding population ka sign hai).","m":"Har criteria ko threatened species ke definition se match karo. Kyun: option D saaf-saaf ulta signal hai, isliye usse include karne wale options reject.","s":["A: population alarming rate se ghat rahi hai $\\Rightarrow$ threatened ✓","B: habitat modify/destroy ho raha hai $\\Rightarrow$ threatened ✓","C: predator/poacher activity badh rahi hai $\\Rightarrow$ threatened ✓","D: population tezi se badh rahi hai $\\Rightarrow$ threatened ka criteria nahi ✗","Answer: A, B, C — option (1)."],"r":["","D galat hai — badhti hui population threatened nahi hoti.","C bhi valid criterion hai (poaching pressure), isliye sirf A, B chunna adhoora hai.","B ko chhodna galat hai — habitat loss sabse bada threat factor hai."],"t":"Threatened categories (IUCN): Critically Endangered $\\to$ Endangered $\\to$ Vulnerable. Main causes: habitat loss, over-exploitation, invasive species, co-extinction."},{"id":167,"sub":"Biology","q":"Given below are two statements, one is labelled as Assertion (A) and the other as Reason (R). <br>Assertion (A): In human the walls of ventricles are much thicker than atria. <br>Reason (R): In human ventricles have thick walls because these are mainly involved in pumping the blood to the body parts with considerable pressure.","opt":["Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct","Both (A) and (R) are correct and (R) is the correct explanation of (A)"],"ans":3,"c":"Ventricles ko blood ko poore body (left ventricle) ya lungs (right ventricle) tak pump karna hota hai — iske liye high pressure chahiye. Atria sirf blood ko ventricles me bhejte hain, isliye unki walls patli hoti hain. Ventricle ki moti wall ka karan yahi pumping pressure hai, isliye reason assertion ki sahi explanation hai.","m":"Structure aur function ka link dhundo. Kyun: yahan wall ki thickness ka seedha karan pressure hai — isliye explanation wala option.","s":["Left ventricle: blood ko aorta se poore body me pump karta hai $\\Rightarrow$ sabse moti wall","Right ventricle: lungs me pump karta hai $\\Rightarrow$ patli par atrium se moti","Atria: sirf ventricles ko blood dete hain $\\Rightarrow$ patli walls","Isliye A true, R true aur R hi explanation hai — option (4)."],"r":["R exactly wahi wajah hai, isliye 'not the explanation' galat.","R sahi hai — pressure ka role documented hai.","A sahi hai — ventricles ki walls mote hote hain.",""],"t":"Yaad rakho: left ventricle ki wall sabse moti (systemic circulation), right ventricle thin (pulmonary), atria sabse thin."},{"id":168,"sub":"Biology","q":"What is the function of sinus venosus in frog","opt":["It receives oxygenated blood from the body via the vena cava","It receives deoxygenated blood from the body via vena cava","It delivers the oxygenated blood towards the whole body","It originates heart beat"],"ans":1,"c":"Frog ke heart me sinus venosus ek thin-walled sac hai jo right atrium ke paas hota hai. Body se aane wala deoxygenated blood (vena cava ke through) pehle sinus venosus me aata hai, phir right atrium me jaata hai. Isliye sinus venosus deoxygenated blood receive karta hai.","m":"Frog ke heart ka sequence yaad karo: sinus venosus $\\to$ right atrium $\\to$ ventricle $\\to$ conus arteriosus. Kyun: flow ka direction hi function batata hai.","s":["Frog ke heart me sinus venosus, right atrium ke paas located hota hai","Vena cava body se deoxygenated blood laati hai","Blood flow: sinus venosus $\\to$ right atrium $\\to$ ventricle $\\to$ conus arteriosus","Isliye sinus venosus deoxygenated blood receive karta hai — option (2)."],"r":["Oxygenated blood lungs se left atrium me aata hai, sinus venosus me nahi.","","Oxygenated blood body me ventricles/conus arteriosus bhejte hain, sinus venosus nahi.","Heart beat ka origin SA node (frog me sinus venosus hi pacemaker hai, par question blood receive karne ke baare me hai) — is option me koi specific function nahi bataya gaya."],"t":"Frog heart ka flow: sinus venosus $\\to$ right atrium $\\to$ ventricle $\\to$ conus arteriosus. Frog me sinus venosus pacemaker ka kaam bhi karta hai."},{"id":169,"sub":"Biology","q":"Which of the following structures are haploid in bryophytes: <br>Gemma cup, Rhizoids, Capsule, Protonema, Seta, Foot, Archegoniophore, Antheridiophore","opt":["Six","Five","Four","Three"],"ans":1,"c":"Bryophytes me main plant body gametophyte (haploid, $n$) hota hai aur sporophyte (capsule, seta, foot) diploid ($2n$) hota hai. Gemma cup, rhizoids, protonema, archegoniophore aur antheridiophore sab gametophytic structures hain — isliye haploid. Capsule, seta aur foot sporophyte ke hisse hain — diploid.","m":"Har structure ko gametophyte ya sporophyte me classify karo. Kyun: haploid = gametophyte part; diploid = sporophyte part.","s":["Gametophytic (haploid): gemma cup, rhizoids, protonema, archegoniophore, antheridiophore $=5$","Sporophytic (diploid): capsule, seta, foot","Zygote se sporophyte banta hai (2n), aur sporophyte me meiosis se spores (n) banti hain","Isliye haploid structures $=5$ — option (2)."],"r":["$6$ galat hai — capsule/seta/foot me se koi bhi haploid nahi hai.","","$4$ me ek gametophytic structure chhoot raha hai (paanch hain).","$3$ bahut kam hai — gemma cup, rhizoids, protonema, archegoniophore, antheridiophore paanch hain."],"t":"Bryophyte ka rule: gametophyte (n) main body, sporophyte (2n) us par depend karta hai. Capsule/seta/foot hamesha sporophyte ke hisse hain."},{"id":170,"sub":"Biology","q":"Select the correct option for Obelia (life cycle relations between polyp and medusa):","fig":"<svg viewBox=\"0 0 320 244\" width=\"320\" height=\"244\" role=\"img\" aria-label=\"four options for Obelia life cycle\"><rect x=\"0\" y=\"0\" width=\"320\" height=\"244\" fill=\"none\"/><text x=\"16\" y=\"38\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(1)<\/text><rect x=\"46\" y=\"16\" width=\"96\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"94\" y=\"36\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Polyp (Diploid)<\/text><rect x=\"168\" y=\"16\" width=\"96\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"216\" y=\"36\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Medusae (Diploid)<\/text><line x1=\"146\" y1=\"24\" x2=\"164\" y2=\"24\" stroke=\"#7fd39a\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><line x1=\"164\" y1=\"39\" x2=\"146\" y2=\"39\" stroke=\"#7fd39a\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"155\" y=\"16\" fill=\"#7fd39a\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Asexual<\/text><text x=\"155\" y=\"56\" fill=\"#7fd39a\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Sexual<\/text><text x=\"16\" y=\"96\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(2)<\/text><rect x=\"46\" y=\"74\" width=\"96\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"94\" y=\"94\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Polyp (Haploid)<\/text><rect x=\"168\" y=\"74\" width=\"96\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"216\" y=\"94\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Medusae (Haploid)<\/text><line x1=\"146\" y1=\"82\" x2=\"164\" y2=\"82\" stroke=\"#9aa3b2\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><line x1=\"164\" y1=\"97\" x2=\"146\" y2=\"97\" stroke=\"#9aa3b2\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"155\" y=\"74\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Asexual<\/text><text x=\"155\" y=\"114\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Sexual<\/text><text x=\"16\" y=\"154\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(3)<\/text><rect x=\"46\" y=\"132\" width=\"96\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"94\" y=\"152\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Polyp (Diploid)<\/text><rect x=\"168\" y=\"132\" width=\"96\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"216\" y=\"152\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Medusae (Haploid)<\/text><line x1=\"146\" y1=\"140\" x2=\"164\" y2=\"140\" stroke=\"#9aa3b2\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><line x1=\"164\" y1=\"155\" x2=\"146\" y2=\"155\" stroke=\"#9aa3b2\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"155\" y=\"132\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Asexual<\/text><text x=\"155\" y=\"172\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Sexual<\/text><text x=\"16\" y=\"212\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(4)<\/text><rect x=\"46\" y=\"190\" width=\"96\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"94\" y=\"210\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Polyp (Diploid)<\/text><rect x=\"168\" y=\"190\" width=\"96\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"216\" y=\"210\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Medusae (Diploid)<\/text><line x1=\"146\" y1=\"198\" x2=\"164\" y2=\"198\" stroke=\"#9aa3b2\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><line x1=\"164\" y1=\"213\" x2=\"146\" y2=\"213\" stroke=\"#9aa3b2\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"155\" y=\"190\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Sexual<\/text><text x=\"155\" y=\"230\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Asexual<\/text><\/svg>","opt":["Polyp (Diploid) has asexual reproduction giving medusae (Diploid), which reproduce sexually to give polyp","Polyp (Haploid) has asexual reproduction giving medusae (Haploid)","Polyp (Diploid) gives haploid medusae by asexual reproduction","Polyp reproduces sexually to give medusae"],"ans":0,"c":"Obelia (cnidarian) me metagenesis hota hai: polyp diploid hota hai aur budding (asexual) se medusae banata hai; medusae bhi diploid hote hain aur meiosis se gametes banate hain. Fertilisation ke baad planula larva se naya polyp banta hai. Isliye dono stages diploid hote hain.","m":"Life cycle ke ploidy aur reproduction type dono check karo. Kyun: 'diploid polyp $\\to$ asexual medusa $\\to$ sexual reproduction' hi Obelia ka correct pattern hai.","s":["Polyp: diploid ($2n$), asexual budding se medusae banata hai","Medusae: diploid ($2n$), meiosis se gametes banate hain (sexual reproduction)","Zygote $\\to$ planula larva $\\to$ polyp","Isliye correct option: polyp diploid + asexual $\\to$ diploid medusae + sexual — option (1)."],"r":["","Polyp aur medusa dono diploid hote hain — 'haploid' wala option galat hai.","Medusae diploid hote hain, haploid nahi (gametes haploid hote hain).","Polyp asexual reproduction se medusae banata hai, sexual se nahi."],"w":["Note: is question ki answer key me option (2) diya gaya hai, par NCERT ke mutabik Obelia ka polyp aur medusa dono diploid hote hain, isliye yahan biologically correct option (1) key kiya gaya hai."],"t":"Obelia ka metagenesis: polyp (2n) $\\to$ asexual $\\to$ medusa (2n) $\\to$ sexual $\\to$ planula $\\to$ polyp. Dono stages diploid, sirf gametes haploid."},{"id":171,"sub":"Biology","q":"Select the correct option for primary and secondary oocyte: <br>A. Primary oocytes are formed at fetal stage; secondary oocytes are formed at onset of puberty. <br>B. Primary oocyte is surrounded by secondary follicle; secondary oocyte by tertiary follicle. <br>C. Chromosome number in primary oocyte is $46$; in secondary oocyte is $23$. <br>D. Chromosome number in primary oocyte is $46$; in secondary oocyte is $46$.","opt":["A, B only","A, B, C","A, D only","A, B, D"],"ans":1,"c":"Oogenesis ki timeline: primary oocytes fetal stage me hi bante hain aur prophase I par ruk jaate hain. Puberty ke baad har cycle me meiosis I complete hoti hai aur secondary oocyte banti hai. Primary oocyte $46$ chromosomes ($2n$) rakhta hai; meiosis I ke baad secondary oocyte me $23$ chromosomes ($n$) hote hain. Follicle ke saath: primary oocyte secondary follicle me, secondary oocyte tertiary/Graafian follicle me.","m":"Har statement ko oogenesis ke steps se check karo. Kyun: D statement chromosome number ko galat batata hai, isliye usse include karne wale options reject.","s":["A: primary oocytes fetal stage me, secondary oocytes puberty ke baad ✓","B: primary oocyte secondary follicle me, secondary oocyte tertiary follicle me ✓","C: primary oocyte $2n=46$, secondary oocyte $n=23$ ✓","D: secondary oocyte me $46$ chromosomes kehna galat hai (meiosis I ke baad half ho jaate hain) ✗","Correct: A, B, C — option (2)."],"r":["C sahi hai, isliye sirf A, B chunna adhoora.","","D galat hai — secondary oocyte me $23$ chromosomes hote hain, $46$ nahi.","D galat hai, isliye ye combination nahi."],"t":"Oogenesis ke numbers: primary oocyte $46$, secondary oocyte $23$, ovum $23$. Ek primary oocyte se ek ovum + teen polar bodies banti hain."},{"id":172,"sub":"Biology","q":"Except endocrine function what are the other functions of placenta: <br>A. Secretion of hCG B. Placenta facilitates the supply of oxygen and nutrients to the embryo <br>C. Placenta facilitates removal of carbon dioxide and excretory waste materials produced by the developing foetus <br>D. Secretion of hPL","opt":["A, B, C","B, C","B, C, D","All"],"ans":1,"c":"Placenta ke do bade kaam hain: (i) exchange surface — oxygen aur nutrients embryo tak pahunchana, aur $\\ce{CO2}$ / excretory waste nikalna; (ii) endocrine function — hCG, hPL, estrogen, progesterone jaise hormones secrete karna. Question 'except endocrine function' poochh raha hai, isliye sirf exchange wale functions (B, C) count honge; A aur D endocrine hain.","m":"Question ke exception word par dhyan do. Kyun: A aur D endocrine functions hain, isliye unhe exclude karna hai — yahi poora trick hai.","s":["Placenta = foetal-maternal exchange organ + temporary endocrine gland","B: oxygen aur nutrients ka supply ✓ (non-endocrine)","C: $\\ce{CO2}$ aur excretory waste ka removal ✓ (non-endocrine)","A (hCG) aur D (hPL) endocrine functions hain $\\Rightarrow$ exclude","Answer: B, C — option (2)."],"r":["A (hCG) endocrine function hai, isliye include karna galat hai.","","D (hPL) bhi endocrine function hai, isliye exclude hoga.","'All' galat hai kyunki A aur D endocrine hain."],"t":"Placenta ke hormones: hCG, hPL, estrogen, progesterone, relaxin. Non-endocrine functions: respiration, nutrition, excretion."},{"id":173,"sub":"Biology","q":"Tissue culture technique can produce infinite number of new plants from a small parental tissue. The economic importance of the technique is in raising","opt":["genetically uniform population identical to the original parent","homozygous diploid plants","new species","variants through picking up somaclonal variations"],"ans":0,"c":"Tissue culture (micropropagation) me ek chhote tissue se bahut saare plants banaye jaate hain jo genetically identical hote hain — ise somaclones kehte hain. Iska economic faayda yahi hai ki aap ek achhe parent ki exact copy bahut saari bana sakte ho (true-to-type plants).","m":"Technique ka main output yaad karo: clones. Kyun: 'economically important' ka matlab hai bade scale par identical, uniform plants.","s":["Tissue culture me plant ka chhota hissa (explant) sterile medium par ugaya jaata hai","Cells totipotent hote hain, isliye poora plant regenerate ho jaata hai","Sabhi plants parent ke clones hote hain $\\Rightarrow$ genetically uniform population","Isliye economic importance = uniform population identical to parent — option (1)."],"r":["","Homozygous diploid plants banane ke liye anther culture/haploid breeding chahiye, simple tissue culture se uniform clones milte hain.","Tissue culture se nayi species nahi banti — sirf copies banti hain.","Somaclonal variations possible hain, par technique ki main economic importance uniformity hai."],"t":"Micropropagation ke fayde: fast multiplication, disease-free plants, elite genotype ki exact copies. Somaclonal variation ek side-effect hai, main goal nahi."},{"id":174,"sub":"Biology","q":"Main objective of production/use of herbicide resistant GM crops is to","opt":["encourage eco-friendly herbicides","reduce herbicide accumulation in food articles for health safety","eliminate water from the field without the use of manual labour","eliminate weeds from the field without the use of herbicides"],"ans":1,"c":"Herbicide-resistant GM crops (jaise glyphosate-resistant soybean) ko herbicide ke saath use kiya jaata hai — crop bach jaati hai aur weeds mar jaate hain. Isse khet me herbicide ka chhidkaav kam karna padega, weeds control honge, aur khaane me herbicide ka accumulation kam hoga. NCERT ke mutabik main objective khaadya padarthon me herbicide accumulation kam karna aur health safety hai.","m":"Options ko logically test karo. Kyun: GM crop herbicide ko tolerate karta hai, isliye herbicide ka total use kam hota hai — isi se health safety ka objective banta hai.","s":["Herbicide-resistant crop herbicide se kharab nahi hoti","Isliye herbicide ka chhidkaav kam karna possible ho jaata hai (sirf specific herbicide)","Kam herbicide $\\Rightarrow$ food articles me residue kam $\\Rightarrow$ health safety","NCERT ka main objective: reduce herbicide accumulation in food articles — option (2)."],"r":["GM crops ka objective 'eco-friendly herbicides' ko encourage karna nahi hai.","","Paani hatana (drainage) ka herbicide resistance se koi link nahi hai.","Herbicide-resistant crops herbicide ke saath use hote hain — bina herbicide weeds elimination nahi hoti."],"t":"Yaad rakho: herbicide-resistant GM crops ka faayda residue kam hona aur weed control aasan hona hai — 'herbicide-free' kheti nahi."},{"id":175,"sub":"Biology","q":"In the name of bacteriophage what is the meaning of \"phage\"","opt":["Small","Large","To eat","Powerful"],"ans":2,"c":"'Bacteriophage' Greek words se bana hai: 'bacteria' + 'phagein' (khaana). Isliye bacteriophage ka matlab hai 'bacteria ko khaane wala' — yaani wo virus jo bacteria ko infect karke unhe lyse kar deta hai.","m":"Word origin se meaning nikalo. Kyun: ye pure vocabulary/terminology question hai.","s":["Greek root 'phagein' = khaana","Isliye 'phage' = khaane wala (to eat)","Bacteriophage = bacteria ko khaane wala virus","Answer: To eat — option (3)."],"r":["'Small' ka koi Greek root link nahi hai.","'Large' bhi word origin se match nahi karta.","","'Powerful' ka koi link nahi — ye distractor hai."],"t":"Root words: phagein = eat (bacteriophage), logos = study (biology), mitos = thread (mitosis)."},{"id":176,"sub":"Biology","q":"Select the correct option for Chargaff's rules: <br>a. Purines = Pyrimidines <br>b. $\\dfrac{A}{T}=\\dfrac{G}{C}=1$ <br>c. $\\dfrac{A+G}{T+C}=2$ <br>d. Adenine is joined to thymine with two H-bonds and guanine is joined to cytosine by three H-bonds","opt":["a, b, c only","b, c, d only","a, b, d","All"],"ans":2,"c":"Chargaff's rules: (i) purines ka total pyrimidines ke barabar hota hai ($A+G=T+C$), (ii) base pairing se $A=T$ aur $G=C$, isliye $A/T=G/C=1$, (iii) $\\ce{A-T}$ pair me $2$ hydrogen bonds aur $\\ce{G-C}$ pair me $3$ hydrogen bonds hote hain. $\\dfrac{A+G}{T+C}=2$ galat hai — ye ratio $1$ hona chahiye, $2$ nahi.","m":"Har statement ko Chargaff ke rules se verify karo. Kyun: option c ka ratio galat hai, isliye usse include karne wale options reject.","s":["a: Purines ($A+G$) = Pyrimidines ($T+C$) ✓","b: $A=T$ aur $G=C$ $\\Rightarrow A/T=G/C=1$ ✓","c: $\\dfrac{A+G}{T+C}$ ka value $1$ hota hai, $2$ nahi ✗","d: $\\ce{A=T}$ (2 H-bonds), $\\ce{G#C}$ (3 H-bonds) ✓","Correct: a, b, d — option (3)."],"r":["c galat hai — ratio $2$ nahi, $1$ hota hai.","c galat hai, isliye ye set nahi.","","'All' galat hai kyunki c statement incorrect hai."],"t":"Chargaff ka ratio yaad rakho: $\\dfrac{A+G}{T+C}=1$. GC-rich DNA zyada stable hota hai kyunki $G\\equiv C$ me $3$ H-bonds hote hain."},{"id":177,"sub":"Biology","q":"In the five kingdom classification of R.H. Whittaker there is no mention of <br>a. TMV b. Viroids c. Bacteriophage d. Cyanobacteria e. Sporozoans f. Prions","opt":["a, b, c, f","a, b, c, e, f","a, b, c, d, f","a, b, d, f"],"ans":0,"c":"Whittaker ke five kingdom system (Monera, Protista, Fungi, Plantae, Animalia) me viruses, viroids, prions aur lichens ko jagah nahi mili — kyunki wo cellular organisation ke hisaab se classify nahi hote. TMV (virus), viroids, bacteriophage (virus) aur prions — chaaron is list se bahar hain. Cyanobacteria Monera me aate hain aur sporozoans Protista me.","m":"Har item ko five kingdoms me locate karo. Kyun: jo bhi kingdom me fit nahi hota, wahi 'no mention' list me aayega.","s":["TMV = virus $\\Rightarrow$ Whittaker ke kingdoms me nahi ✗","Viroids = infectious RNA $\\Rightarrow$ nahi ✗","Bacteriophage = virus $\\Rightarrow$ nahi ✗","Cyanobacteria = Monera ✓; Sporozoans = Protista ✓","Prions = infectious protein $\\Rightarrow$ nahi ✗","Answer: a, b, c, f — option (1)."],"r":["","e (sporozoans) Protista me aate hain, isliye include karna galat hai.","d (cyanobacteria) Monera me hai — isliye include nahi hoga.","d (cyanobacteria) Monera me hai, isliye ye option galat hai."],"t":"Whittaker system ke bahar: viruses, viroids, prions, lichens. Cyanobacteria = Monera, sporozoans = Protista."},{"id":178,"sub":"Biology","q":"In the diagram given below, how many may be considered as a connecting link?","fig":"<svg viewBox=\"0 0 320 152\" width=\"320\" height=\"152\" role=\"img\" aria-label=\"four organisms for connecting link question\"><rect x=\"0\" y=\"0\" width=\"320\" height=\"152\" fill=\"none\"/><text x=\"40\" y=\"24\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">A<\/text><rect x=\"20\" y=\"34\" width=\"44\" height=\"20\" rx=\"4\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><line x1=\"24\" y1=\"36\" x2=\"24\" y2=\"52\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"30\" y1=\"36\" x2=\"30\" y2=\"52\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"36\" y1=\"36\" x2=\"36\" y2=\"52\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"42\" y1=\"36\" x2=\"42\" y2=\"52\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"48\" y1=\"36\" x2=\"48\" y2=\"52\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"54\" y1=\"36\" x2=\"54\" y2=\"52\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"36\" x2=\"60\" y2=\"52\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"150\" y=\"24\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">B<\/text><ellipse cx=\"150\" cy=\"48\" rx=\"34\" ry=\"13\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><path d=\"M 118 44 q -14 -12 -20 -20\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"140\" cy=\"46\" r=\"3\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><text x=\"260\" y=\"24\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">C<\/text><circle cx=\"228\" cy=\"46\" r=\"7\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><circle cx=\"242\" cy=\"46\" r=\"7\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><circle cx=\"256\" cy=\"46\" r=\"7\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><circle cx=\"270\" cy=\"46\" r=\"7\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><circle cx=\"284\" cy=\"46\" r=\"7\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><circle cx=\"298\" cy=\"46\" r=\"7\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"120\" y=\"110\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">D<\/text><polygon points=\"100,92 124,92 118,108 106,108\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><rect x=\"108\" y=\"108\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><line x1=\"104.4\" y1=\"124\" x2=\"96\" y2=\"140\" stroke=\"#8b95a8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"107.6\" y1=\"124\" x2=\"104\" y2=\"140\" stroke=\"#8b95a8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"112.4\" y1=\"124\" x2=\"116\" y2=\"140\" stroke=\"#8b95a8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"115.6\" y1=\"124\" x2=\"124\" y2=\"140\" stroke=\"#8b95a8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"180\" y=\"140\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">connecting links / boundary forms<\/text><\/svg>","opt":["Three","Four","Two","One"],"ans":1,"c":"Connecting link wo organisms hote hain jo do groups ke beech ke characters dikhate hain. A (virus-like particle) living aur non-living ke beech ki boundary par hai, B (Euglena) me plant aur animal dono ke characters hain, C (cyanobacteria) bacteria aur algae ke beech ka link hai, aur D (bacteriophage) bhi living-non-living boundary form hai. Isliye chaaron ko broad sense me connecting link maana ja sakta hai.","m":"Har figure ke characters identify karo aur dekho wo do groups ko jodte hain ya nahi. Kyun: 'connecting link' ka matlab hi intermediate characters hai.","s":["A: virus-like particle — living aur non-living ke beech","B: Euglena — photosynthesis (plant character) + locomotion (animal character)","C: cyanobacteria — bacteria aur algae ke beech ka link","D: bacteriophage — living/non-living boundary form","Chaar connecting links — option (2)."],"r":["Teen galat hai — chaaron figures boundary/intermediate forms dikhate hain.","","Do bahut kam hai — A aur D dono virus-type forms hain.","Ek bilkul galat hai."],"w":["Original PDF me diagram chhota aur dhundhla tha; yahan usi ke four organisms (virus particle, Euglena, cyanobacterial filament, bacteriophage) redraw kiye gaye hain."],"t":"Classic connecting links: Euglena (plant-animal), virus (living-nonliving), Peripatus (annelid-arthropod), Archaeopteryx (reptile-bird), lungfish (fish-amphibia)."},{"id":179,"sub":"Biology","q":"Which of the following are short-term effects of Drugs/Alcohols: <br>a. Reduced tension b. Poor concentration c. Slower brain activity d. Slow reflexes e. Slow reaction time","opt":["a, b, c only","b, c, d, e only","a, b, d, e only","All"],"ans":3,"c":"Drugs/alcohol ke short-term effects me relaxation (tension kam hona) bhi aata hai aur cognitive/motor slowing bhi. Isliye reduced tension, poor concentration, slower brain activity, slow reflexes aur slow reaction time — sab short-term effects hain.","m":"Har effect ko 'short-term' category me check karo. Kyun: paanchon effects acute intoxication ke known signs hain, isliye 'All' sahi hai.","s":["Reduced tension: alcohol/drugs ka initial relaxant effect ✓","Poor concentration aur slower brain activity: CNS depression ✓","Slow reflexes aur slow reaction time: motor coordination par effect ✓","Sabhi short-term effects hain $\\Rightarrow$ All — option (4)."],"r":["a bhi short-term effect hai, isliye sirf b, c chunna adhoora.","a ko chhodna galat hai — reduced tension bhi short-term effect hai.","c (slower brain activity) bhi short-term effect hai.",""],"t":"Short-term effects: relaxation, poor concentration, slow reflexes, slow reaction time, slurred speech. Long-term: addiction, liver damage, cognitive decline."},{"id":180,"sub":"Biology","q":"Which species of Penicillium produces Roquefort cheese","opt":["Penicillium purpureus","Penicillium roqueforti","Penicillium notatum","Penicillium cerevisiae"],"ans":1,"c":"Roquefort cheese apne blue-green veins ke liye famous hai jo Penicillium roqueforti fungus se aate hain. Doosri cheeses ke liye alag species hoti hain: Camembert ke liye Penicillium camemberti, aur Swiss cheese ke liye Propionibacterium sharmanii. Penicillium notatum se penicillin antibiotic mila tha.","m":"Cheese aur microbe ki jodi yaad karo. Kyun: naam me 'roqueforti' hi Roquefort se match karta hai.","s":["Roquefort cheese: sheep milk se banti hai, Penicillium roqueforti se ripening hoti hai","Iske blue-green veins fungus ki growth se bante hain","Penicillium notatum se antibiotic penicillin mila (cheese se nahi)","Answer: Penicillium roqueforti — option (2)."],"r":["Penicillium purpureus ka koi standard cheese association nahi hai.","","Penicillium notatum antibiotic penicillin ke liye famous hai.","Penicillium cerevisiae jaisi koi species nahi hoti (ye distractor hai; Saccharomyces cerevisiae hota hai)."],"t":"Cheese-microbe pairs: Roquefort $\\to$ Penicillium roqueforti, Camembert $\\to$ P. camemberti, Swiss $\\to$ Propionibacterium sharmanii."}];
var SIMS = {
  hlevels: {
    title: "Simulation · Hydrogen ke energy levels",

        s += '<text x="' + (x1+8) + '" y="' + (y+4).toFixed(1) + '" fill="#9aa3b2" font-size="11">n=' + k + '</text>';
        s += '<text x="' + (x0-8) + '" y="' + (y+4).toFixed(1) + '" fill="#6f7a8d" font-size="10" text-anchor="end">' + lvl.toFixed(2) + '</text>';
      }
      var yn = bot - (n-1)*gap;

      s += '<line x1="' + xm + '" y1="' + (bot-5) + '" x2="' + xm + '" y2="' + (yn+7).toFixed(1) + '" stroke="#ffd479" stroke-width="1.8"/>';
      s += '<polygon points="' + xm + ',' + (yn+1).toFixed(1) + ' ' + (xm-5) + ',' + (yn+12).toFixed(1) + ' ' + (xm+5) + ',' + (yn+12).toFixed(1) + '" fill="#ffd479"/>';

      return {
        val: "n = " + n,
        html: s + '<p>Is level par pahunchne ke liye: $E_n=-\dfrac{13.6}{n^2}=' + En.toFixed(2) + '\ \mathrm{eV}$, to absorbed photon $=13.6-\dfrac{13.6}{n^2}=' + need.toFixed(2) + '\ \mathrm{eV}$</p>'

  },

  lens: {
    title: "Simulation · Do lens ka system",
    label: "Object distance (L1 se)",
    min: 4, max: 20, step: 0.5, start: 6,

      s += '<text x="' + xL1 + '" y="' + (axisY-40) + '" fill="#9aa3b2" font-size="11" text-anchor="middle">L1</text>';
      s += '<text x="' + xL2 + '" y="' + (axisY-38) + '" fill="#9aa3b2" font-size="11" text-anchor="middle">L2</text>';

      s += '<text x="' + xo + '" y="' + (axisY+18) + '" fill="#9aa3b2" font-size="11" text-anchor="middle">O</text>';
      var xI1 = xL1 - 22;
      s += '<circle cx="' + xI1 + '" cy="' + axisY + '" r="3" fill="#7fd39a"/>';
      s += '<text x="' + xI1 + '" y="' + (axisY+34) + '" fill="#7fd39a" font-size="10" text-anchor="middle">I1</text>';
      var xi = xL2 + 46;

      s += '<text x="' + xi + '" y="' + (axisY+18) + '" fill="#ffd479" font-size="11" text-anchor="middle">I</text>';
      s += '<text x="' + ((xo+xi)/2) + '" y="' + (H-8) + '" fill="#6f7a8d" font-size="10" text-anchor="middle">Object se final image = ' + total.toFixed(1) + ' cm</text>';

  capillary: {
    title: "Simulation · Hole ka size badlo",
    label: "Hole ka diameter",
    min: 0.2, max: 5, step: 0.1, start: 1,
    draw: function(dmm){
      var S = 0.075, rho = 1000, g = 10;
      var r = dmm*1e-3/2;
      var h = 2*S/(r*rho*g);
      var H = 170, W = 300, baseY = 140;
      var hpx = Math.min(110, h*1000/0.6*0.6);
      hpx = Math.min(115, Math.max(6, h*330));
      var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="300" height="170" role="img" aria-label="capillary rise">';
      s += '<rect x="90" y="25" width="110" height="' + (baseY-25) + '" fill="none" stroke="#4b5568" stroke-width="1.5"/>';
      s += '<rect x="92" y="' + (baseY-hpx) + '" width="106" height="' + hpx + '" fill="#22405e" opacity="0.85"/>';

        val: "$d=" + dmm.toFixed(1) + "\\,\\mathrm{mm}$",
