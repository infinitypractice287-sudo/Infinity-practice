<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET UG 2027 — Sample Paper 4 · 180 MCQ Practice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{
  --bg:#12141a; --card:#1b1f27; --card2:#212734; --line:#2c333f;
  --text:#dcdfe4; --muted:#9aa3b2; --accent:#7c9cff;
  --ok:#4f9d69; --okbg:#17281d; --okline:#2f5d3e;
  --bad:#c2635f; --badbg:#2a1a1b; --badline:#6b3331;
  --warn:#c9a227;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.7; -webkit-text-size-adjust:100%;
}
.wrap{max-width:920px;margin:0 auto;padding:0 14px 90px}
/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:30;background:rgba(18,20,26,.96);
  border-bottom:1px solid var(--line);backdrop-filter:blur(6px);
}
.head-in{max-width:920px;margin:0 auto;padding:10px 14px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.45}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{
  background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap
}
.chip b{color:#fff;font-weight:600}
.bar{height:6px;background:#20252f;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5f7ff0,#7c9cff);transition:width .25s}
/* ---------- buttons ---------- */
button{font-family:inherit;font-size:15px}
.btn{
  background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:12px;padding:11px 16px;cursor:pointer;min-height:46px;
  transition:.15s border-color,.15s background;
}
.btn:hover{border-color:#3d4658}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:#26324f;border-color:#3a4c78;color:#e7ecff}
.btn.danger{background:#3a2224;border-color:#5e3436;color:#f0d6d5}
.btn.ghost{background:transparent}
/* ---------- question ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.qnum{background:#26324f;color:#dbe4ff;border:1px solid #3a4c78;border-radius:10px;padding:3px 11px;font-weight:700;font-size:15px}
.subj{color:var(--muted);font-size:13.5px;letter-spacing:.4px;text-transform:uppercase}
.state{margin-left:auto;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-bottom:14px}
.qtext{font-size:17.5px;line-height:1.75}
.qtext p{margin:.35em 0}
.fig{margin:14px 0 4px;display:flex;justify-content:center}
.fig svg{max-width:100%;height:auto}
.fig table.figtab{border-collapse:collapse;font-size:15.5px;width:100%}
.fig table.figtab th,.fig table.figtab td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.fig table.figtab th{background:#20252f;color:#cfd6e4;font-weight:600}
.figcap{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:#20252f;border:1.6px solid #303848;border-radius:14px;
  color:var(--text);padding:12px 14px;min-height:54px;cursor:pointer;font-size:17px;
  line-height:1.55;transition:.14s;
}
.opt:hover:not(:disabled){border-color:#4a5872;background:#232937}
.opt:disabled{cursor:default}
.opt .lt{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:#2b3242;color:#cfd6e4;font-weight:700;font-size:14.5px
}
.opt .ot{flex:1 1 auto;min-width:0}
.opt.correct{border-color:var(--okline);background:var(--okbg)}
.opt.correct .lt{background:#2c5a3c;color:#dff5e4}
.opt.wrong{border-color:var(--badline);background:var(--badbg)}
.opt.wrong .lt{background:#5b2f2e;color:#fbe3e2}
.tag{margin-left:8px;font-size:13.5px;font-weight:700;white-space:nowrap}
.tag.ok{color:#7fd39a}
.tag.bad{color:#e7908c}
/* ---------- explanation ---------- */
.expl{padding:16px}
.expl h3{margin:0 0 4px;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:#a9b6d6}
.expl .verdict{font-size:17px;font-weight:700;margin:2px 0 12px}
.expl .verdict.ok{color:#7fd39a}
.expl .verdict.bad{color:#e7908c}
.block{margin:12px 0;padding:12px 14px;border-radius:12px;background:#1f242e;border:1px solid #2b3340}
.block h4{margin:0 0 6px;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:#93a0bd}
.block ol,.block ul{margin:6px 0 0;padding-left:22px}
.block li{margin:6px 0}
.block.tip{background:#182620;border-color:#2b4a39}
.block.tip h4{color:#8fce9f}
.block.warn{background:#2a2318;border-color:#4d4021}
.block.warn h4{color:#e0c26a}
.final{font-weight:700;color:#cfe0ff}
.reasons li{list-style:none;margin:6px 0}
.reasons{padding-left:0!important}
.reasons .rl{display:inline-block;min-width:22px;color:#9fb0d0;font-weight:700}
/* ---------- nav ---------- */
.nav{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.nav .btn{flex:1 1 130px}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:8px}
/* ---------- grid ---------- */
.grid-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.grid-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input[type=number]{background:#20252f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;min-height:44px}
input[type=number]{width:100px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.gbtn{
  aspect-ratio:1/1;border-radius:10px;border:1.5px solid #333b4b;background:#20252f;color:#cfd6e4;
  font-weight:600;font-size:14.5px;cursor:pointer;display:grid;place-items:center
}
.gbtn.answered{border-color:#4d5f8c;background:#26324f;color:#dfe7ff}
.gbtn.ok{border-color:var(--okline);background:#1d3a29;color:#c8f0d4}
.gbtn.bad{border-color:var(--badline);background:#3a2122;color:#f6d7d5}
.gbtn.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* ---------- result ---------- */
.result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.result h2{margin:0 0 4px;font-size:22px}
.bigscore{font-size:44px;font-weight:800;color:#fff;line-height:1.15}
.bigscore span{font-size:19px;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.stat{background:#1f242e;border:1px solid #2b3340;border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:21px;color:#fff}
.stat s{display:block;text-decoration:none;color:var(--muted);font-size:13px}
/* ---------- sim ---------- */
.sim{background:#1f242e;border:1px solid #2b3340;border-radius:12px;padding:12px 14px;margin-top:14px}
.sim h4{margin:0 0 8px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#93a0bd}
.sim input[type=range]{width:100%;accent-color:#7c9cff;height:28px}
.sim .srow{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted)}
.sim .sval{color:#cfe0ff;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sim .sout{margin-top:8px;font-size:15.5px}
.sim .sout svg{max-width:100%;height:auto;display:block;margin:8px auto}
/* ---------- misc ---------- */
.hidden{display:none!important}
.center{text-align:center}
.muted{color:var(--muted)}
.katex{font-size:1.03em}
.katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
@media (max-width:560px){
  body{font-size:16.5px}
  .qtext{font-size:17px}
  .opt{font-size:16.5px;padding:11px 12px}
  .head-in{padding:8px 12px}
  .brand small{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="head-in">
    <div class="brand">NEET UG 2027 · Sample Paper 4
      <small>180 questions · Physics + Chemistry + Biology · +4 / −1 / 0</small>
    </div>
    <div class="hud">
      <span class="chip">Score <b id="scoreChip">0</b></span>
      <span class="chip"><b id="countChip">0</b>/<span id="totalChip">180</span> answered</span>
      <button class="btn ghost" id="gridBtn" style="min-height:38px;padding:6px 12px;font-size:14px">Question grid</button>
    </div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
</header>

<div class="wrap">
  <section id="quizView">
    <div class="qhead">
      <span class="qnum" id="qnum">Q1</span>
      <span class="subj" id="qsubj">Physics</span>
      <span class="state" id="qstate"></span>
    </div>
    <div class="card">
      <div class="qtext" id="qText"></div>
      <div class="fig" id="qFig"></div>
      <div class="opts" id="opts"></div>
      <div id="simWrap"></div>
    </div>
    <div id="expl"></div>
    <div class="nav">
      <button class="btn" id="prevBtn">← Previous</button>
      <button class="btn" id="skipBtn">Skip</button>
      <button class="btn" id="nextBtn">Next →</button>
    </div>
    <div class="foot">
      <button class="btn ghost" id="gridBtn2">Question grid</button>
      <button class="btn danger" id="submitBtn">Submit test</button>
    </div>
  </section>

  <section id="gridView" class="hidden">
    <div class="grid-box">
      <div class="grid-tools">
        <select id="filterSel">
          <option value="all">All questions</option>
          <option value="answered">Answered</option>
          <option value="unanswered">Unanswered</option>
        </select>
        <input type="number" id="gotoInput" min="1" max="180" placeholder="Q no.">
        <button class="btn" id="gotoBtn">Go to Q</button>
        <button class="btn ghost" id="closeGrid">Back</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section id="resultView" class="hidden">
    <div class="result">
      <h2>Result</h2>
      <div class="muted" id="resSub"></div>
      <div class="bigscore" id="resScore">0 <span>/ 720</span></div>
      <div class="stats" id="resStats"></div>
      <div class="nav">
        <button class="btn primary" id="reviewBtn">Review all answers</button>
        <button class="btn danger" id="restartBtn">Restart</button>
      </div>
    </div>
  </section>
</div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var DATA = [{"id":1,"sub":"Physics","q":"A hydrogen atom absorbs a photon of energy $12.09\\ \\mathrm{eV}$ from the ground state. To which energy level does it jump? (Use $E_n=-\\dfrac{13.6}{n^2}\\ \\mathrm{eV}$)","fig":"<svg viewBox=\"0 0 360 170\" width=\"360\" height=\"170\" role=\"img\" aria-label=\"hydrogen energy level diagram\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"170\" fill=\"none\"/><line x1=\"70\" y1=\"150\" x2=\"300\" y2=\"150\" stroke=\"#8b95a8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"308\" y=\"154\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">n=1<\/text><text x=\"64\" y=\"154\" fill=\"#6f7a8d\" font-size=\"11\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">-13.60<\/text><line x1=\"70\" y1=\"95\" x2=\"300\" y2=\"95\" stroke=\"#8b95a8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"308\" y=\"99\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">n=2<\/text><text x=\"64\" y=\"99\" fill=\"#6f7a8d\" font-size=\"11\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">-3.40<\/text><line x1=\"70\" y1=\"60\" x2=\"300\" y2=\"60\" stroke=\"#7c9cff\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><text x=\"308\" y=\"64\" fill=\"#7c9cff\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">n=3<\/text><text x=\"64\" y=\"64\" fill=\"#6f7a8d\" font-size=\"11\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">-1.51<\/text><line x1=\"70\" y1=\"38\" x2=\"300\" y2=\"38\" stroke=\"#8b95a8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"308\" y=\"42\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">n=4<\/text><text x=\"64\" y=\"42\" fill=\"#6f7a8d\" font-size=\"11\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">-0.85<\/text><line x1=\"70\" y1=\"22\" x2=\"300\" y2=\"22\" stroke=\"#8b95a8\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"308\" y=\"26\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">n=5<\/text><text x=\"64\" y=\"26\" fill=\"#6f7a8d\" font-size=\"11\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">-0.54<\/text><line x1=\"120\" y1=\"148\" x2=\"120\" y2=\"66\" stroke=\"#ffd479\" stroke-width=\"2\" marker-end=\"url(#ah)\"/><text x=\"128\" y=\"112\" fill=\"#ffd479\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">12.09 eV absorbed<\/text><text x=\"36\" y=\"14\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">E (eV)<\/text><\/svg>","opt":["2","4","3","5"],"ans":2,"c":"Hydrogen atom ke energy levels fixed hote hain: $E_n=-\\dfrac{13.6}{n^2}\\ \\mathrm{eV}$. Ground state $n=1$ par $E_1=-13.6\\ \\mathrm{eV}$. Photon absorb karne par atom ki total energy badh jaati hai, yaani $E_{\\text{final}}=E_1+h\\nu$. Kyunki levels discrete hain, sirf ek hi integer $n$ ke liye energy match karegi — isliye photon energy ko $n$ me convert karna hi asli kaam hai.","m":"Method: energy conservation + energy-level formula. Pehle final energy nikalo ($E_1+12.09$), phir $n^2=\\dfrac{13.6}{|E_n|}$ se level. Ye method chuna kyunki sawaal me diya hai ki atom ground state se jump karta hai, to initial energy known hai aur sirf final state unknown hai.","s":["$E_{\\text{final}}=-13.6+12.09=-1.51\\ \\mathrm{eV}$","$E_n=-\\dfrac{13.6}{n^2}\\Rightarrow \\dfrac{13.6}{n^2}=1.51$","$n^2=\\dfrac{13.6}{1.51}=9.006$","$n=\\sqrt{9.006}\\approx 3.0$ — poora number mila, matlab $n=3$","Photon ki energy bilkul $n=1\\to n=3$ jump se match karti hai, isliye final level $n=3$."],"r":["$n=2$ ke liye $13.6\\left(1-\\frac{1}{4}\\right)=10.2\\ \\mathrm{eV}$ chahiye — $12.09\\ \\mathrm{eV}$ se kam hai, itni energy se atom $n=2$ se aage nikal jayega.","$n=4$ ke liye $13.6\\left(1-\\frac{1}{16}\\right)=12.75\\ \\mathrm{eV}$ chahiye — utni energy mili hi nahi, isliye $n=4$ possible nahi.","","$n=5$ ke liye $13.6\\left(1-\\frac{1}{25}\\right)=13.06\\ \\mathrm{eV}$ chahiye — $12.09\\ \\mathrm{eV}$ kaafi nahi."],"w":["$12.09$ ko seedha $13.6/n^2$ me daal dena galti hai — pehle final energy ($-1.51\\ \\mathrm{eV}$) nikalna zaroori hai, tabhi $n$ milega."],"t":"Yaad rakho: $h\\nu=13.6\\left(1-\\dfrac{1}{n^2}\\right)\\mathrm{eV}$. $n=2\\to 10.2$, $n=3\\to 12.09$, $n=4\\to 12.75$ — ye teen numbers NEET me baar-baar aate hain.","sim":"hlevels"},{"id":2,"sub":"Physics","q":"A nucleus has a binding energy of $175\\ \\mathrm{MeV}$ and mass number $25$. What is its binding energy per nucleon?","opt":["$6.5\\ \\mathrm{MeV}$","$6.8\\ \\mathrm{MeV}$","$7.0\\ \\mathrm{MeV}$","$7.5\\ \\mathrm{MeV}$"],"ans":2,"c":"Binding energy (BE) poore nucleus ko uske nucleons me todne ke liye chahiye energy hai. Mass number $A$ = protons + neutrons ki total ginti. Har nucleon par kitni energy bandhi hai, wo nucleus ki stability batati hai — isi ko BE per nucleon kehte hain, aur yahi comparison ka standard scale hai.","m":"Simple definition-based division: total BE ko $A$ se baant do. Koi formula manipulation nahi chahiye kyunki dono quantity de di gayi hain.","s":["Formula: $\\text{BE per nucleon}=\\dfrac{\\text{total BE}}{A}$","Values rakho: $\\dfrac{175\\ \\mathrm{MeV}}{25}$","$25\\times 7=175$, isliye division poora number deta hai","$\\text{BE per nucleon}=7.0\\ \\mathrm{MeV}$","Final answer: option (3)."],"r":["$6.5\\ \\mathrm{MeV}$ tab aata agar total BE $162.5\\ \\mathrm{MeV}$ hoti — galti se divide ke bajaye kuch aur number le liya.","$6.8\\ \\mathrm{MeV}$ approx $170/25$ hai, yaani total BE ko galat padhna.","","$7.5\\ \\mathrm{MeV}$ $187.5/25$ deta hai — ye numbers diye hi nahi gaye."],"t":"Fe-56 ke paas BE/nucleon lagbhag $8.8\\ \\mathrm{MeV}$ hota hai — sabse zyada. Isi liye middle ke nuclei zyada stable hote hain."},{"id":3,"sub":"Physics","q":"Which of the following elements is NOT commonly used as a dopant in $\\ce{Si}$ or $\\ce{Ge}$?","opt":["Phosphorus $(\\ce{P})$","Boron $(\\ce{B})$","Arsenic $(\\ce{As})$","Carbon $(\\ce{C})$"],"ans":3,"c":"Doping ka matlab hai tetravalent semiconductor ($\\ce{Si}$, $\\ce{Ge}$, valency 4) me thoda sa aisa atom daalna jo ya ek extra electron de (pentavalent, n-type) ya ek electron kam de (trivalent, p-type). Isse charge carriers ban jaate hain aur conductivity badh jaati hai.","m":"Har option ki valency dekho aur host ($\\ce{Si}$, $\\ce{Ge}$, group 14) se compare karo. Jo atom na extra electron de na hole banaye, wo dopant nahi ban sakta.","s":["$\\ce{Si}$ aur $\\ce{Ge}$ group 14 ke hain, valency $=4$.","$\\ce{P}$ (group 15, valency 5): ek extra electron deta hai $\\to$ n-type dopant.","$\\ce{As}$ (group 15, valency 5): same tarah n-type dopant.","$\\ce{B}$ (group 13, valency 3): ek electron ki kami $\\to$ p-type dopant.","$\\ce{C}$ bhi group 14 ka hai (valency 4), isliye na electron deta hai na hole — carrier produce nahi karta. Ye dopant nahi hai."],"r":["$\\ce{P}$ pentavalent donor hai — bahut common n-type dopant.","$\\ce{B}$ trivalent acceptor hai — standard p-type dopant.","$\\ce{As}$ bhi pentavalent donor hai, $\\ce{Si}$ me use hota hai.",""],"t":"Yaad rakho: donor = group 15 ($\\ce{P}$, $\\ce{As}$, $\\ce{Sb}$), acceptor = group 13 ($\\ce{B}$, $\\ce{Al}$, $\\ce{Ga}$). Group 14 ka atom dopant nahi banta."},{"id":4,"sub":"Physics","q":"A ball is thrown upwards at $35\\ \\mathrm{m\\,s^{-1}}$ from a $45\\ \\mathrm{m}$ high tower. What is its velocity when it hits the ground? (Take $g=10\\ \\mathrm{m\\,s^{-2}}$)","fig":"<svg viewBox=\"0 0 360 196\" width=\"360\" height=\"196\" role=\"img\" aria-label=\"ball thrown up from a tower\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"196\" fill=\"none\"/><rect x=\"40\" y=\"40\" width=\"22\" height=\"120\" rx=\"0\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><line x1=\"20\" y1=\"160\" x2=\"340\" y2=\"160\" stroke=\"#8b95a8\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"24\" y1=\"160\" x2=\"16\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"40\" y1=\"160\" x2=\"32\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"56\" y1=\"160\" x2=\"48\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"72\" y1=\"160\" x2=\"64\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"88\" y1=\"160\" x2=\"80\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"104\" y1=\"160\" x2=\"96\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"120\" y1=\"160\" x2=\"112\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"136\" y1=\"160\" x2=\"128\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"152\" y1=\"160\" x2=\"144\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"168\" y1=\"160\" x2=\"160\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"184\" y1=\"160\" x2=\"176\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"160\" x2=\"192\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"216\" y1=\"160\" x2=\"208\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"232\" y1=\"160\" x2=\"224\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"248\" y1=\"160\" x2=\"240\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"264\" y1=\"160\" x2=\"256\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"280\" y1=\"160\" x2=\"272\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"296\" y1=\"160\" x2=\"288\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"312\" y1=\"160\" x2=\"304\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"328\" y1=\"160\" x2=\"320\" y2=\"168\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><circle cx=\"51\" cy=\"40\" r=\"5\" fill=\"#ffd479\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><line x1=\"51\" y1=\"30\" x2=\"51\" y2=\"8\" stroke=\"#7fd39a\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><text x=\"51\" y=\"26\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">u = 35 m s<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>(-1)<\/text><line x1=\"70\" y1=\"46\" x2=\"70\" y2=\"150\" stroke=\"#e7908c\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><text x=\"78\" y=\"100\" fill=\"#e7908c\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">v = ?<\/text><text x=\"51\" y=\"182\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">45 m<\/text><text x=\"120\" y=\"186\" fill=\"#6f7a8d\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">ground<\/text><text x=\"300\" y=\"120\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">g = 10 m s<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>(-2)<\/text><\/svg>","opt":["$45\\ \\mathrm{m\\,s^{-1}}$","$50\\ \\mathrm{m\\,s^{-1}}$","$40\\ \\mathrm{m\\,s^{-1}}$","$46.1\\ \\mathrm{m\\,s^{-1}}$"],"ans":3,"c":"Jab ball upar phenki jaati hai to pehle wo upar jaati hai (velocity ghat-ti hai), ruk kar wapas aati hai, aur tower se neeche gir jaati hai. Poore safar me acceleration ek hi hai: $g=10\\ \\mathrm{m\\,s^{-2}}$ neeche ki taraf. Time pata nahi hai, isliye velocity–displacement relation sabse seedha raasta hai.","m":"Third equation of motion $v^2=u^2+2as$ use karo. Kyun: hamein sirf velocity chahiye, time nahi. Displacement net hai $45\\ \\mathrm{m}$ neeche, isliye $s=+45\\ \\mathrm{m}$ lekar acceleration bhi neeche ki taraf positive lo — signs consistent rakhna hi asli trick hai.","s":["Neeche ki direction positive lo: $u=+35\\ \\mathrm{m\\,s^{-1}}$ (upar phenki, isliye shuru me negative hoga — dhyan se), $a=+10\\ \\mathrm{m\\,s^{-2}}$, $s=+45\\ \\mathrm{m}$.","Consistent convention: neeche positive, to $u=-35\\ \\mathrm{m\\,s^{-1}}$ aur $a=+10\\ \\mathrm{m\\,s^{-2}}$.","$v^2=u^2+2as=(-35)^2+2(10)(45)$","$v^2=1225+900=2125$","$v=\\sqrt{2125}=\\sqrt{25\\times 85}=5\\sqrt{85}\\approx 46.1\\ \\mathrm{m\\,s^{-1}}$ (direction neeche)","Final answer: option (4)."],"r":["$45\\ \\mathrm{m\\,s^{-1}}$ tab aata jab $u^2$ ko $2gs$ ke saath galat jodte — ye ek 'achha lagne wala' round number hai, sirf isliye mat chuno.","$50\\ \\mathrm{m\\,s^{-1}}$ ke liye $v^2=2500$ chahiye, par $2125$ mila.","$40\\ \\mathrm{m\\,s^{-1}}$ to $v^2=1600$ deta hai, jo $35\\ \\mathrm{m\\,s^{-1}}$ se bhi kam speed hai — upar phenki ball ground par isse tez hi giregi.",""],"w":["Sign galti sabse common hai: upar phenki ball ke liye $u$ negative lena zaroori hai jab aap neeche ko positive maan rahe hain. Warna $v^2=1225-900=325$ jaisa galat answer aa jayega."],"t":"Agar sirf speed chahiye to $v=\\sqrt{u^2+2gh}$ seedha lagao — upar phenkne se final speed badh jaati hai, kam nahi hoti."},{"id":5,"sub":"Physics","q":"Two parallel wires $0.03\\ \\mathrm{m}$ apart carry $8\\ \\mathrm{A}$ and $3\\ \\mathrm{A}$ in opposite directions. What is the force per unit length? ($\\mu_0=4\\pi\\times 10^{-7}\\ \\mathrm{T\\,m\\,A^{-1}}$)","opt":["$8\\times 10^{-6}\\ \\mathrm{N\\,m^{-1}}$","$3.2\\times 10^{-5}\\ \\mathrm{N\\,m^{-1}}$","$1.6\\times 10^{-4}\\ \\mathrm{N\\,m^{-1}}$","$2.4\\times 10^{-5}\\ \\mathrm{N\\,m^{-1}}$"],"ans":2,"c":"Current-carrying wire apne chaaron taraf magnetic field banati hai. Doosri wire ke andar ke charges is field me force feel karte hain, isliye wires ek doosre par force lagati hain. Same direction me current ho to attraction, opposite direction me repulsion — yahan currents opposite hain, to force repulsive hoga (magnitude poocha hai).","m":"Formula $\\dfrac{F}{l}=\\dfrac{\\mu_0 I_1 I_2}{2\\pi d}$ seedha lagao. Kyun: ye do infinite parallel wires ke liye standard result hai, aur question me 'per unit length' maanga gaya hai, isliye $l$ ko $1$ rakhna hai.","s":["$\\dfrac{F}{l}=\\dfrac{\\mu_0 I_1 I_2}{2\\pi d}$","Values: $\\mu_0=4\\pi\\times10^{-7}$, $I_1=8\\ \\mathrm{A}$, $I_2=3\\ \\mathrm{A}$, $d=0.03\\ \\mathrm{m}$","Numerator: $4\\pi\\times10^{-7}\\times 8\\times 3=96\\pi\\times10^{-7}$","Denominator: $2\\pi\\times 0.03=0.06\\pi$","$\\dfrac{F}{l}=\\dfrac{96\\pi\\times10^{-7}}{0.06\\pi}=\\dfrac{96}{0.06}\\times10^{-7}=1600\\times10^{-7}$","$=1.6\\times10^{-4}\\ \\mathrm{N\\,m^{-1}}$ — option (3)."],"r":["$8\\times10^{-6}$ aata hai agar $\\mu_0$ ki jagah $4\\pi$ chhod dein — factor $20$ ka farq pad jata hai.","$3.2\\times10^{-5}$ tab milta hai jab $2\\pi d$ ki jagah sirf $d$ ho, yaani $2\\pi$ ka factor miss ho jaye.","","$2.4\\times10^{-5}$ me numerator me sirf ek current liya gaya lagta hai — dono currents ka product chahiye."],"t":"Formula yaad rakhne ka short way: $\\dfrac{F}{l}=2\\times10^{-7}\\dfrac{I_1I_2}{d}$ — kyunki $\\mu_0/2\\pi=2\\times10^{-7}$."},{"id":6,"sub":"Physics","q":"A material with susceptibility $\\chi=3\\times 10^{-4}$ has a relative permeability $\\mu_r$ of:","opt":["$1.0003$","$1.0005$","$1.001$","$1.003$"],"ans":0,"c":"Magnetic susceptibility $\\chi$ batati hai ki material external magnetic field ke response me kitna magnetise hota hai. Relative permeability $\\mu_r$ batati hai ki material ke andar field vacuum ke muqable kitna guna ho jata hai. Dono judde hue hain simple relation se: $\\mu_r=1+\\chi$.","m":"Direct relation $\\mu_r=1+\\chi$ lagao. Diamagnetic ke liye $\\chi$ negative chhota, paramagnetic ke liye positive chhota, ferromagnetic ke liye bahut bada hota hai — yahan chhota positive value hai, matlab paramagnetic.","s":["$\\mu_r=1+\\chi$","$\\chi=3\\times10^{-4}=0.0003$","$\\mu_r=1+0.0003$","$\\mu_r=1.0003$ — option (1)."],"r":["","$1.0005$ ke liye $\\chi=5\\times10^{-4}$ chahiye hota.","$1.001$ ke liye $\\chi=1\\times10^{-3}$, diye gaye se lagbhag $3$ guna bada.","$1.003$ ke liye $\\chi=3\\times10^{-3}$ — das guna zyada."],"t":"$10^{-4}$ ka matlab hai decimal ke baad 4 jagah: $0.0003$. Isi conversion me sabse zyada galti hoti hai."},{"id":7,"sub":"Physics","q":"A magnetic dipole of moment $0.6\\ \\mathrm{A\\,m^{2}}$ is in a uniform field of $0.4\\ \\mathrm{T}$ at $60^{\\circ}$. What is the torque on it?","opt":["$0.21\\ \\mathrm{N\\,m}$","$0.32\\ \\mathrm{N\\,m}$","$0.45\\ \\mathrm{N\\,m}$","$0.58\\ \\mathrm{N\\,m}$"],"ans":0,"c":"Magnetic dipole (current loop ya magnet) ko uniform field me rakhne par do barabar-opposite forces lagti hain jo loop ko ghumane ki koshish karti hain — ye torque hai. Torque $=MB\\sin\\theta$, jahan $\\theta$ dipole moment aur field ke beech ka angle hai. Jab $\\theta=0$ torque zero, jab $\\theta=90^{\\circ}$ torque maximum.","m":"$\\tau=MB\\sin\\theta$ direct lagao. Kyun $\\sin$: torque sirf field ke perpendicular component se aata hai; parallel component koi ghumaav nahi deta.","s":["$\\tau=MB\\sin\\theta$","$M=0.6\\ \\mathrm{A\\,m^{2}}$, $B=0.4\\ \\mathrm{T}$, $\\theta=60^{\\circ}$","$MB=0.6\\times0.4=0.24$","$\\sin 60^{\\circ}=\\dfrac{\\sqrt{3}}{2}=0.866$","$\\tau=0.24\\times0.866=0.2078\\ \\mathrm{N\\,m}$","Round off: $\\tau\\approx 0.21\\ \\mathrm{N\\,m}$ — option (1)."],"r":["","$0.32$ aata hai agar $\\sin 60^{\\circ}$ ki jagah $\\tan$ ya $\\cos$ le liya jaye — angle ka function galat chunna.","$0.45$ tab milta hai jab $\\sin\\theta$ chhod kar $\\theta$ ko degree me hi multiply kar dein.","$0.58$ lagbhag $MB$ ka double hai — koi extra factor $\\times 2$ lag gaya."],"t":"$MB$ ko pehle ek baar alag likho ($0.24$), phir trigonometric factor lagao. Isse options turant narrow ho jaate hain."},{"id":8,"sub":"Physics","q":"The dimensional formula of momentum is $[\\mathrm{M\\,L\\,T^{-1}}]$. What is the dimensional formula of impulse?","opt":["$[\\mathrm{M\\,L\\,T^{-2}}]$","$[\\mathrm{M\\,L^{2}\\,T^{-1}}]$","$[\\mathrm{M\\,L\\,T^{-1}}]$","$[\\mathrm{M\\,L^{2}\\,T^{-2}}]$"],"ans":2,"c":"Impulse ka matlab hai force ka effect ek time interval tak. Definition se impulse $=F\\times t$ (ya force ka time-integral) aur Newton ke doosre law se impulse = change in momentum. Isliye impulse aur momentum ke dimensions bilkul same hote hain — ye dimensional analysis ka classic result hai.","m":"Do tareeke hain: (i) $J=F\\Delta t$ ke dimensions, (ii) impulse = change in momentum ke dimensions. Dono se same answer aata hai, isliye ye cross-check bhi hai.","s":["Method 1: $J=F\\cdot t$","$F$ ka dimension $[\\mathrm{M\\,L\\,T^{-2}}]$, $t$ ka $[\\mathrm{T}]$","Multiply: $[\\mathrm{M\\,L\\,T^{-2}}][\\mathrm{T}]=[\\mathrm{M\\,L\\,T^{-1}}]$","Method 2: impulse = $\\Delta p$, aur $p$ ka dimension already diya hai $[\\mathrm{M\\,L\\,T^{-1}}]$","Dono methods se same: $[\\mathrm{M\\,L\\,T^{-1}}]$ — option (3)."],"r":["$[\\mathrm{M\\,L\\,T^{-2}}]$ force ka dimension hai, impulse ka nahi.","$[\\mathrm{M\\,L^{2}\\,T^{-1}}]$ angular momentum ka dimension hai.","","$[\\mathrm{M\\,L^{2}\\,T^{-2}}]$ energy ya work ka dimension hai."],"t":"Impulse = momentum change — isliye dimensional formula yaad karne ki zaroorat nahi, sidha momentum ka hi likh do."},{"id":9,"sub":"Physics","q":"A lift ascends with an acceleration of $2\\ \\mathrm{m\\,s^{-2}}$ for $3\\ \\mathrm{s}$, then moves at constant speed for $4\\ \\mathrm{s}$. If a ball is dropped from the lift $5\\ \\mathrm{s}$ after starting, how far does it fall in $1\\ \\mathrm{s}$ relative to the lift? (Take $g=10\\ \\mathrm{m\\,s^{-2}}$)","fig":"<svg viewBox=\"0 0 340 190\" width=\"340\" height=\"190\" role=\"img\" aria-label=\"ball dropped inside a moving lift\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"190\" fill=\"none\"/><rect x=\"70\" y=\"20\" width=\"120\" height=\"140\" rx=\"4\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><line x1=\"130\" y1=\"20\" x2=\"130\" y2=\"0\" stroke=\"#9aa3b2\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"130\" cy=\"90\" r=\"6\" fill=\"#ffd479\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><line x1=\"130\" y1=\"100\" x2=\"130\" y2=\"140\" stroke=\"#e7908c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><text x=\"140\" y=\"130\" fill=\"#e7908c\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">a<tspan baseline-shift=\"sub\" font-size=\"70%\"><\/tspan>(rel) = g = 10 m s<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>(-2)<\/text><line x1=\"196\" y1=\"90\" x2=\"196\" y2=\"50\" stroke=\"#7fd39a\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><text x=\"202\" y=\"74\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">lift 6 m s<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>(-1)<\/text><text x=\"130\" y=\"176\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Ball dropped at t = 5 s<\/text><\/svg>","opt":["$4\\ \\mathrm{m}$","$6\\ \\mathrm{m}$","$5\\ \\mathrm{m}$","$7\\ \\mathrm{m}$"],"ans":2,"c":"Relative motion ka sawaal hai. Jab ball chhooti hai, us waqt ball ki velocity lift ke barabar hoti hai (kyunki wo lift ke saath chal rahi thi). Lift ki velocity $t=5\\ \\mathrm{s}$ par constant hai ($3\\ \\mathrm{s}$ ke acceleration ke baad lift accelerate nahi kar rahi). Ball par sirf gravity lagti hai, lift par kuch nahi — isliye lift ke frame me ball ka relative acceleration $g$ hi banta hai.","m":"Relative frame use karo: $a_{\\text{rel}}=g$ (kyunki lift ki velocity constant hai, us frame me pseudo force zero). Phir $s=\\frac12 a_{\\text{rel}}t^2$ se distance. Kyun: lift ke andar se dekho to ball bilkul aise girti dikhti hai jaise stationary lift me.","s":["$0$ se $3\\ \\mathrm{s}$: lift ka acceleration $a=2\\ \\mathrm{m\\,s^{-2}}$","$t=3\\ \\mathrm{s}$ par lift ki velocity: $v=0+2\\times3=6\\ \\mathrm{m\\,s^{-1}}$","$3$ se $7\\ \\mathrm{s}$ tak lift constant velocity par hai — isliye $t=5\\ \\mathrm{s}$ par bhi lift ki velocity $6\\ \\mathrm{m\\,s^{-1}}$ hai","Ball bhi us waqt $6\\ \\mathrm{m\\,s^{-1}}$ se upar ja rahi hai, to relative initial velocity $u_{\\text{rel}}=6-6=0$","Relative acceleration: $a_{\\text{rel}}=-10\\ \\mathrm{m\\,s^{-2}}$ (lift ka acceleration zero hai)","$s=\\frac12(10)(1)^2=5\\ \\mathrm{m}$ neeche, lift ke respect me — option (3)."],"r":["$4\\ \\mathrm{m}$ tab aata hai agar lift ka $2\\ \\mathrm{m\\,s^{-2}}$ bhi relative acceleration me jod dein — par $t=5\\ \\mathrm{s}$ par lift accelerate nahi kar rahi.","$6\\ \\mathrm{m}$ lift ki velocity hai, distance nahi — units ka confusion.","","$7\\ \\mathrm{m}$ kisi bhi sahi combination se nahi aata, ye distractor hai."],"w":["$t=3\\ \\mathrm{s}$ ke baad lift ki acceleration zero ho jaati hai. Isliye relative acceleration me $a_{\\text{lift}}$ add/subtract mat karo."],"t":"Rule: ball chhoote waqt uski velocity lift ki velocity ke barabar hoti hai. Isi se $u_{\\text{rel}}=0$ milta hai aur sawaal aadha ho jata hai."},{"id":10,"sub":"Physics","q":"A spring ($k=700\\ \\mathrm{N\\,m^{-1}}$) is compressed from $0.1\\ \\mathrm{m}$ to $0.15\\ \\mathrm{m}$. What is the work done by the spring force?","opt":["$-5\\ \\mathrm{J}$","$-4.4\\ \\mathrm{J}$","$-4\\ \\mathrm{J}$","$-3.5\\ \\mathrm{J}$"],"ans":1,"c":"Spring force hamesha apne natural length ki taraf lagta hai: compressed ho to bahar dhakelta hai, stretched ho to andar kheenchta hai. Isliye jab spring aur compress hoti hai, spring force displacement ke opposite hota hai — isliye spring force ka work negative hota hai aur spring me potential energy store hoti hai.","m":"Work by spring force $=-\\left(\\Delta \\text{PE}\\right)$ with $PE=\\frac12kx^2$. Kyun: spring force conservative hai, isliye $W_{\\text{spring}}=-\\left(U_f-U_i\\right)$. Sirf final–initial stretch ka square difference chahiye.","s":["$W=-\\dfrac12 k\\left(x_2^2-x_1^2\\right)$","$x_1=0.1\\ \\mathrm{m}$, $x_2=0.15\\ \\mathrm{m}$","$x_1^2=0.01$, $x_2^2=0.0225$","Difference: $0.0225-0.01=0.0125\\ \\mathrm{m^2}$","$W=-\\dfrac12\\times700\\times0.0125=-350\\times0.0125$","$=-4.375\\ \\mathrm{J}\\approx -4.4\\ \\mathrm{J}$ — option (2)."],"r":["$-5\\ \\mathrm{J}$ tab aata hai agar $x=0.1$ aur $0.15$ ko jod dein ya $\\frac12k(0.15)^2$ akela le lein.","","$-4\\ \\mathrm{J}$ rounding se bhi nahi aata — ye $0.0125$ ki jagah $0.0115$ jaisa koi galat difference hai.","$-3.5\\ \\mathrm{J}$ lagbhag $\\frac12\\times700\\times0.01$ hai, matlab sirf initial compression ka PE liya gaya."],"t":"Sign ka rule: spring force ka work negative hota hai jab spring ko aur deform karte ho (force aur displacement opposite)."},{"id":11,"sub":"Physics","q":"A $12\\ \\mathrm{V}$ battery with negligible internal resistance is connected to a $3\\,\\Omega$ and $6\\,\\Omega$ resistor in series. What is the power dissipated in the $6\\,\\Omega$ resistor?","opt":["$8\\ \\mathrm{W}$","$10.67\\ \\mathrm{W}$","$12\\ \\mathrm{W}$","$14\\ \\mathrm{W}$"],"ans":1,"c":"Series me same current har resistor se guzarta hai, aur voltage unke resistance ke ratio me bat jaata hai. Power ke teen form hain: $P=I^2R$, $P=V^2/R$, $P=VI$. Series me current common hota hai, isliye $P=I^2R$ sabse seedha hai.","m":"Pehle equivalent resistance se total current nikalo, phir $P=I^2R$ sirf $6\\,\\Omega$ ke liye. Kyun: series me current same hai, isliye ek hi current dono me use hoga aur power ratio seedha $3:6$ hoga.","s":["$R_{\\text{eq}}=3+6=9\\,\\Omega$","$I=\\dfrac{V}{R_{\\text{eq}}}=\\dfrac{12}{9}=\\dfrac{4}{3}\\ \\mathrm{A}$","$P=I^2R=\\left(\\dfrac43\\right)^2\\times 6$","$\\left(\\dfrac43\\right)^2=\\dfrac{16}{9}$","$P=\\dfrac{16}{9}\\times6=\\dfrac{96}{9}=10.67\\ \\mathrm{W}$ — option (2)."],"r":["$8\\ \\mathrm{W}$ tab aata hai agar $I$ ko $2\\ \\mathrm{A}$ le lein (sirf $6\\,\\Omega$ se divide karke) — series me total $9\\,\\Omega$ se divide karna hota hai.","","$12\\ \\mathrm{W}$ matlab poora $12\\ \\mathrm{V}\\times 1\\ \\mathrm{A}$ — ye dono resistors ka total power hai, sirf $6\\,\\Omega$ ka nahi.","$14\\ \\mathrm{W}$ total power se bhi zyada hai, possible nahi."],"w":["Series me voltage divide hota hai ($4\\ \\mathrm{V}$ aur $8\\ \\mathrm{V}$), current nahi. $V^2/R$ lagana ho to pehle sahi voltage nikalo."],"t":"Quick check: total power $=\\dfrac{V^2}{R_{\\text{eq}}}=\\dfrac{144}{9}=16\\ \\mathrm{W}$, aur $3\\,\\Omega:6\\,\\Omega=1:2$ ke ratio me bat kar $5.33\\ \\mathrm{W}+10.67\\ \\mathrm{W}$."},{"id":12,"sub":"Physics","q":"A water sample of volume $2$ litres is compressed by a pressure of $2.5\\times10^{6}\\ \\mathrm{N\\,m^{-2}}$. If the bulk modulus of water is $2.2\\times10^{9}\\ \\mathrm{N\\,m^{-2}}$, what is the change in volume?","opt":["$2\\times10^{-6}\\ \\mathrm{m^{3}}$","$3\\times10^{-6}\\ \\mathrm{m^{3}}$","$2.27\\times10^{-6}\\ \\mathrm{m^{3}}$","$1.5\\times10^{-6}\\ \\mathrm{m^{3}}$"],"ans":2,"c":"Bulk modulus $B$ batata hai ki koi material pressure ke against kitna resist karta hai: $B=-\\dfrac{\\Delta p}{\\Delta V/V}$. Water ko compress karne par volume thoda kam hota hai, isliye $\\Delta V$ negative aata hai; compressibility $=1/B$ hoti hai.","m":"$B=-\\dfrac{\\Delta p\\cdot V}{\\Delta V}$ ko rearrange karke $\\Delta V=\\dfrac{\\Delta p\\cdot V}{B}$ lagao. Kyun: hamein sirf volume change chahiye, aur teenon quantities di hui hain.","s":["$V=2$ litre $=2\\times10^{-3}\\ \\mathrm{m^{3}}$ (SI me badalna zaroori)","$\\Delta p=2.5\\times10^{6}\\ \\mathrm{N\\,m^{-2}}$, $B=2.2\\times10^{9}\\ \\mathrm{N\\,m^{-2}}$","$\\Delta V=\\dfrac{\\Delta p\\cdot V}{B}=\\dfrac{2.5\\times10^{6}\\times 2\\times10^{-3}}{2.2\\times10^{9}}$","Numerator: $5.0\\times10^{3}$","$\\Delta V=\\dfrac{5.0}{2.2}\\times10^{3-9}=2.2727\\times10^{-6}\\ \\mathrm{m^{3}}$","$\\Delta V\\approx2.27\\times10^{-6}\\ \\mathrm{m^{3}}$ — option (3)."],"r":["$2\\times10^{-6}$ lagbhag $5/2.5$ se aata hai, matlab $B$ ki jagah $2.5\\times10^{9}$ jaisa koi number le liya.","$3\\times10^{-6}$ ka koi sahi combination nahi banta; ye rounding na karke koi galat division hai.","","$1.5\\times10^{-6}$ tab aata hai jab $2$ litre ko $2\\times10^{-2}$ likh dein — litre$\\to$m$^3$ conversion ki galti."],"w":["$1$ litre $=10^{-3}\\ \\mathrm{m^{3}}$. Yahi conversion sabse zyada marks khaata hai is question me."],"t":"Answer chhota hona chahiye: $B$ bahut bada hai, isliye pressure ke baad volume change micro-level par hi hoga."},{"id":13,"sub":"Physics","q":"A wire of length $15\\ \\mathrm{m}$ and cross-sectional area $2\\times10^{-6}\\ \\mathrm{m^{2}}$ has a resistance of $30\\,\\Omega$. What is the resistivity of the material?","opt":["$4.0\\times10^{-6}\\,\\Omega\\,\\mathrm{m}$","$4.5\\times10^{-6}\\,\\Omega\\,\\mathrm{m}$","$5.0\\times10^{-6}\\,\\Omega\\,\\mathrm{m}$","$5.5\\times10^{-6}\\,\\Omega\\,\\mathrm{m}$"],"ans":0,"c":"Resistivity $\\rho$ material ka apna property hai (geometry se independent), jabki resistance $R$ wire ki length aur area par depend karti hai: $R=\\dfrac{\\rho l}{A}$. Lambi wire ka resistance zyada, moti wire ka resistance kam — isi ko samet kar $\\rho=\\dfrac{RA}{l}$ milta hai.","m":"$\\rho=\\dfrac{RA}{l}$ lagao. Kyun: hamein material-level quantity chahiye, aur $R$, $A$, $l$ teenon diye hain.","s":["$\\rho=\\dfrac{R\\,A}{l}$","$\\rho=\\dfrac{30\\times 2\\times10^{-6}}{15}$","$\\dfrac{30}{15}=2$","$\\rho=2\\times2\\times10^{-6}$","$\\rho=4\\times10^{-6}\\,\\Omega\\,\\mathrm{m}$ — option (1)."],"r":["","$4.5\\times10^{-6}$ tab aata hai agar length $13.3\\ \\mathrm{m}$ jaisa koi galat number use ho jaye.","$5.0\\times10^{-6}$ $30\\times2.5\\times10^{-6}/15$ se aata hai, yaani area galat liya.","$5.5\\times10^{-6}$ kisi bhi diye gaye number se nahi banta."],"t":"Resistivity ki SI unit $\\Omega\\,\\mathrm{m}$ hoti hai (sirf $\\Omega$ nahi) — units se bhi answer guess kar sakte ho."},{"id":14,"sub":"Physics","q":"A soap film supports $2.0\\times10^{-2}\\ \\mathrm{N}$ over a $40\\ \\mathrm{cm}$ slider. What is the surface tension?","opt":["$0.015\\ \\mathrm{N\\,m^{-1}}$","$0.020\\ \\mathrm{N\\,m^{-1}}$","$0.025\\ \\mathrm{N\\,m^{-1}}$","$0.030\\ \\mathrm{N\\,m^{-1}}$"],"ans":2,"c":"Soap film ke do surface hote hain (aage aur peeche), isliye force do surfaces par lagta hai. Slider ki length $l$ par film ka total contact length $2l$ hota hai. Surface tension $S$ per unit length force hai: $F=2Sl$ — do surface ka factor $-2$ hi is question ki jaan hai.","m":"$S=\\dfrac{F}{2l}$ use karo, plain bubble ke liye $S=\\dfrac{F}{l}$ use hota, par yahan film hai. Kyun $2l$: ek hi slider ke saath film ke do surfaces hain.","s":["$F=2Sl$ (do surfaces)","$l=40\\ \\mathrm{cm}=0.4\\ \\mathrm{m}$","$S=\\dfrac{F}{2l}=\\dfrac{2.0\\times10^{-2}}{2\\times0.4}$","Denominator: $2\\times0.4=0.8$","$S=\\dfrac{0.02}{0.8}=0.025\\ \\mathrm{N\\,m^{-1}}$ — option (3)."],"r":["$0.015$ kisi rounding se nahi aata — ye koi intermediate number utha kar likha gaya hai.","$0.020$ tab aata hai jab $F=2Sl$ me $2$ chhod dein aur $l$ ko $1\\ \\mathrm{m}$ maan lein, yaani do surface ka factor miss.","","$0.030$ lagbhag $0.02/0.66$ hai — length galat li gayi."],"t":"Yaad rakho: soap film = do surface ($2l$), soap bubble = do surface bhi, aur liquid drop = ek surface ($2S/r$ hi sahi). Har jagah factor alag hota hai."},{"id":15,"sub":"Physics","q":"A $4\\ \\mathrm{kg}$ block on a $37^{\\circ}$ incline ($\\mu_s=0.5$) is pulled upward by a rope at $53^{\\circ}$ to the incline with just enough force to start motion. What is the tension? (Take $g=10\\ \\mathrm{m\\,s^{-2}}$, $\\sin 37^{\\circ}=0.6$, $\\cos 37^{\\circ}=0.8$, $\\sin 53^{\\circ}=0.8$, $\\cos 53^{\\circ}=0.6$)","fig":"<svg viewBox=\"0 0 360 190\" width=\"360\" height=\"190\" role=\"img\" aria-label=\"block on an inclined plane pulled by a rope\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"190\" fill=\"none\"/><polygon points=\"40,150 280,150 280,60\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><path d=\"M 78 150 A 38 38 0 0 0 70 128\" fill=\"none\" stroke=\"#9aa3b2\" stroke-width=\"1.3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"88\" y=\"144\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">37°<\/text><polygon points=\"132.0,107.5 156.0,89.5 172.0,101.5 148.0,119.5\" fill=\"none\" stroke=\"#7c9cff\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"164.0\" y=\"135.5\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">4 kg<\/text><line x1=\"154.0\" y1=\"97.5\" x2=\"234.0\" y2=\"33.5\" stroke=\"#7fd39a\" stroke-width=\"2\" marker-end=\"url(#ah)\"/><text x=\"244.0\" y=\"25.5\" fill=\"#7fd39a\" font-size=\"13\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">T<\/text><path d=\"M 202.0 59.5 A 34 34 0 0 0 222.0 65.5\" fill=\"none\" stroke=\"#ffd479\" stroke-width=\"1.3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"226.0\" y=\"51.5\" fill=\"#ffd479\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">53°<\/text><line x1=\"146.0\" y1=\"115.5\" x2=\"118.0\" y2=\"135.5\" stroke=\"#9aa3b2\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><text x=\"92.0\" y=\"143.5\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">f<\/text><text x=\"120\" y=\"178\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">μ<tspan baseline-shift=\"sub\" font-size=\"70%\">s<\/tspan> = 0.5<\/text><\/svg>","opt":["$50\\ \\mathrm{N}$","$75\\ \\mathrm{N}$","$40\\ \\mathrm{N}$","$200\\ \\mathrm{N}$"],"ans":2,"c":"Block incline par hai, to weight ko do parts me todna padta hai: incline ke along $mg\\sin 37^{\\circ}$ (neeche), aur perpendicular $mg\\cos 37^{\\circ}$ (incline ke andar). Rope incline ke saath $53^{\\circ}$ par hai, isliye tension ka bhi do component banega: along $T\\cos 53^{\\circ}$ (upar ki taraf) aur perpendicular $T\\sin 53^{\\circ}$ (block ko incline se uthaane ki koshish). Normal force ghat jaata hai, isliye friction bhi ghat jaata hai — yahi asli trap hai.","m":"Equilibrium of limiting case: along incline $T\\cos 53^{\\circ}=mg\\sin 37^{\\circ}+f$, aur perpendicular $N=mg\\cos 37^{\\circ}-T\\sin 53^{\\circ}$ with $f=\\mu N$. Kyun: 'just enough force to start motion' ka matlab impending motion, jab friction apne maximum ($\\mu_s N$) par hai.","s":["Incline ke along balance: $T\\cos 53^{\\circ}=mg\\sin 37^{\\circ}+\\mu N$","Perpendicular balance: $N=mg\\cos 37^{\\circ}-T\\sin 53^{\\circ}$","$N$ ki value pehli equation me rakho: $T\\cos 53^{\\circ}=mg\\sin 37^{\\circ}+\\mu\\left(mg\\cos 37^{\\circ}-T\\sin 53^{\\circ}\\right)$","$T\\cos 53^{\\circ}+\\mu T\\sin 53^{\\circ}=mg\\left(\\sin 37^{\\circ}+\\mu\\cos 37^{\\circ}\\right)$","Broads: $T(0.6+0.5\\times0.8)=4\\times10(0.6+0.5\\times0.8)$","Dono side bracket $=1$, to $T=40\\ \\mathrm{N}$ — option (3)."],"r":["$50\\ \\mathrm{N}$ tab aata hai jab friction ko neeche ki taraf nahi, upar ki taraf lein — par block upar khisakne wala hai, to friction neeche hoga.","$75\\ \\mathrm{N}$ me $N=mg\\cos37^{\\circ}$ ko bina $T\\sin53^{\\circ}$ ghatae use kiya gaya, isliye friction zyada lag gaya.","","$200\\ \\mathrm{N}$ lagbhag $mg$ ka aadha hai — poore weight ko tension se barabar maan lena, incline ka angle hi ignore kar dena."],"w":["Rope incline ke saath angled hai, isliye wo normal force ko kam karta hai. $N=mg\\cos\\theta$ seedha likh dena is question me galti hai."],"t":"Jab bhi rope incline ke saath tirchha ho, do equations banao: along aur perpendicular. Friction ko hamesha motion ke opposite lagao."},{"id":16,"sub":"Physics","q":"In a single-slit diffraction pattern, what is the angular width of the central maximum if the slit width is $2.0\\,\\mu\\mathrm{m}$ and the wavelength is $400\\ \\mathrm{nm}$? ($\\sin^{-1}(0.2)=11.5^{\\circ}$)","opt":["$15^{\\circ}$","$30^{\\circ}$","$23^{\\circ}$","$10^{\\circ}$"],"ans":2,"c":"Single slit me central maximum dono taraf pehle minima ke beech hota hai. Minimum ki condition $a\\sin\\theta=\\lambda$ hai, jahan $a$ slit width hai. Central maximum ke ek taraf ka angle $\\theta$, doosri taraf bhi utna — isliye total angular width $2\\theta$ hoti hai, sirf $\\theta$ nahi.","m":"Pehle $\\sin\\theta=\\lambda/a$ se $\\theta$ nikalo, phir width $=2\\theta$. Kyun $2\\theta$: central maximum symmetric hai, centre se dono taraf equal angle tak phaila hai.","s":["$\\sin\\theta=\\dfrac{\\lambda}{a}=\\dfrac{400\\times10^{-9}}{2.0\\times10^{-6}}$","$\\dfrac{4\\times10^{-7}}{2\\times10^{-6}}=0.2$","Diya hai $\\sin^{-1}(0.2)=11.5^{\\circ}$, to $\\theta=11.5^{\\circ}$","Angular width $=2\\theta=2\\times11.5^{\\circ}$","$=23^{\\circ}$ — option (3)."],"r":["$15^{\\circ}$ kisi bhi sahi step se nahi aata — distractor.","$30^{\\circ}$ tab aata hai agar $a$ ko galat lein ya $2\\theta$ ke baad phir koi factor lagayein.","","$10^{\\circ}$ sirf $\\theta$ ke qareeb hai — ye aadhi width hai, poori width nahi."],"w":["Width of central maximum $=2\\theta$; width of secondary maximum bhi lagbhag $\\theta$ hoti hai par wo poochha nahi gaya hai."],"t":"Ratio $\\lambda/a$ ko bina powers ke likho: $400\\ \\mathrm{nm}/2000\\ \\mathrm{nm}=0.2$ — calculator ki zaroorat hi nahi."},{"id":17,"sub":"Physics","q":"A string vibrates with a stationary wave $y=0.1\\sin\\left(\\dfrac{2\\pi x}{3}\\right)\\cos(150\\pi t)$. What is the distance between a node and the next antinode?","opt":["$0.5\\ \\mathrm{m}$","$1\\ \\mathrm{m}$","$0.75\\ \\mathrm{m}$","$1.5\\ \\mathrm{m}$"],"ans":2,"c":"Stationary wave me node wo point hai jahan displacement hamesha zero, aur antinode wo jahan amplitude maximum. Standard form $y=A\\sin(kx)\\cos(\\omega t)$ se $k=\\dfrac{2\\pi}{\\lambda}$ milta hai. Node aur antinode ke beech ka gap hamesha $\\dfrac{\\lambda}{4}$ hota hai — ye geometry har stationary wave me same rehti hai.","m":"Pehle $k$ ko compare karke $\\lambda$ nikalo, phir $\\lambda/4$ le lo. Kyun $\\lambda/4$: node se agla antinode quarter wavelength par hota hai (node–node gap $\\lambda/2$ hota hai, uske beech antinode).","s":["Compare: $k=\\dfrac{2\\pi}{3}$","$k=\\dfrac{2\\pi}{\\lambda}\\Rightarrow \\dfrac{2\\pi}{\\lambda}=\\dfrac{2\\pi}{3}$","$\\lambda=3\\ \\mathrm{m}$","Node se agla antinode $=\\dfrac{\\lambda}{4}=\\dfrac{3}{4}$","$=0.75\\ \\mathrm{m}$ — option (3)."],"r":["$0.5\\ \\mathrm{m}$ $\\lambda/6$ hai — koi aur ratio, is sawaal me nahi.","$1\\ \\mathrm{m}$ $= \\lambda/3$ — ye do antinodes ke beech ka gap bhi nahi hota.","","$1.5\\ \\mathrm{m}=\\lambda/2$ — ye do consecutive nodes (ya do antinodes) ke beech ka gap hai, node–antinode ka nahi."],"t":"Ek line me yaad rakho: node–node $=\\lambda/2$, node–antinode $=\\lambda/4$, antinode–antinode $=\\lambda/2$."},{"id":18,"sub":"Physics","q":"If $p$ represents radiation pressure, $v$ represents speed of light and $q$ represents radiation energy striking a unit area per second, then non-zero integers $a$, $b$ and $c$ are such that $p^{a}q^{b}v^{c}$ is dimensionless, then","opt":["$a=1,\\ b=1,\\ c=-1$","$a=1,\\ b=-1,\\ c=1$","$a=-1,\\ b=1,\\ c=1$","$a=1,\\ b=1,\\ c=1$"],"ans":1,"c":"Radiation pressure = force/area, aur radiation energy per unit area per second = power/area. Dimensions likh kar dekho to dono me kaafi similarity hai. Dimensional analysis ka rule: kisi bhi physical equation me dono side ke dimensions same hone chahiye, isliye hum powers aise chunte hain ki product dimensionless (M$^0$L$^0$T$^0$) ban jaye.","m":"Teen quantities ke dimensions likho, phir $M$, $L$, $T$ ke powers alag-alag zero rakho — teen equations, teen unknowns. Kyun ye method: dimensionless condition hi seedha equations deti hai.","s":["$p=\\dfrac{F}{A}$: dimension $[\\mathrm{M\\,L^{-1}\\,T^{-2}}]$","$q=\\dfrac{\\text{energy}}{\\text{area}\\cdot\\text{time}}$: $[\\mathrm{M\\,T^{-3}}]$","$v$: $[\\mathrm{L\\,T^{-1}}]$","Power compare karo: $M$: $a+b=0$; $L$: $-a+c=0$; $T$: $-2a-3b-c=0$","$a+b=0\\Rightarrow b=-a$; $c=a$","$T$ equation: $-2a+3a-a=0$ — satisfied for any $a$; non-zero integer chuno $a=1$","$a=1,\\ b=-1,\\ c=1$ — option (2)."],"r":["$a=1,b=1,c=-1$ se $M$ power $2$ aa jaati hai, zero nahi.","","$a=-1,b=1,c=1$ se $M$ power $0$ milta hai par $L$ power $-1-1=-2$ aa jaati hai — dimensionless nahi.","$a=b=c=1$ se $M$ power $2$, $L$ power $0$, $T$ power $-6$ — dimensionless nahi."],"t":"Radiation pressure ka shortcut: $p=\\dfrac{q}{v}$ (energy density ka relation), isliye $p\\,q^{-1}v$ dimensionless — seedha $a=1,b=-1,c=1$."},{"id":19,"sub":"Physics","q":"In the following logic circuit the sequence of the inputs $A$ and $B$ are $(0,0)$, $(0,1)$, $(1,0)$ and $(1,1)$. The output $Y$ for this sequence will be","fig":"<svg viewBox=\"0 0 340 165\" width=\"340\" height=\"165\" role=\"img\" aria-label=\"logic circuit with AND, OR and NAND gates\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"165\" fill=\"none\"/><text x=\"16\" y=\"52\" fill=\"#dcdfe4\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">A<\/text><text x=\"16\" y=\"76\" fill=\"#dcdfe4\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">B<\/text><line x1=\"26\" y1=\"48\" x2=\"96\" y2=\"48\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"26\" y1=\"72\" x2=\"96\" y2=\"72\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><circle cx=\"26\" cy=\"48\" r=\"2.6\" fill=\"#8b95a8\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><circle cx=\"26\" cy=\"72\" r=\"2.6\" fill=\"#8b95a8\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><path d=\"M 96 30 L 128 30 A 24 24 0 0 1 128 78 L 96 78 Z\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"110\" y=\"58\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">AND<\/text><path d=\"M 96 96 Q 112 120 96 146 Q 132 146 150 121 Q 132 96 96 96 Z\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"116\" y=\"124\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OR<\/text><line x1=\"58\" y1=\"48\" x2=\"58\" y2=\"108\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"58\" y1=\"72\" x2=\"58\" y2=\"84\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"58\" y1=\"108\" x2=\"96\" y2=\"108\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"58\" y1=\"84\" x2=\"96\" y2=\"84\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><circle cx=\"58\" cy=\"48\" r=\"2.6\" fill=\"#8b95a8\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><line x1=\"150\" y1=\"54\" x2=\"196\" y2=\"54\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"172\" y=\"46\" fill=\"#ffd479\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">P<\/text><line x1=\"150\" y1=\"121\" x2=\"172\" y2=\"121\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"172\" y1=\"121\" x2=\"172\" y2=\"84\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"172\" y1=\"84\" x2=\"196\" y2=\"84\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"182\" y=\"108\" fill=\"#ffd479\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Q<\/text><path d=\"M 196 50 L 224 50 A 20 20 0 0 1 224 90 L 196 90 Z\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"248\" cy=\"70\" r=\"4.2\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"210\" y=\"74\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">NAND<\/text><line x1=\"252\" y1=\"70\" x2=\"300\" y2=\"70\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><circle cx=\"300\" cy=\"70\" r=\"3.2\" fill=\"#7fd39a\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"310\" y=\"75\" fill=\"#7fd39a\" font-size=\"14\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Y<\/text><\/svg>","opt":["$1,0,1,0$","$0,1,0,1$","$1,1,1,0$","$0,0,1,1$"],"ans":2,"c":"Yahan do gates parallel me hain: upar AND gate ($P=A\\cdot B$) aur neeche OR gate ($Q=A+B$). Dono ka output NAND gate me jaata hai, to $Y=\\overline{P\\cdot Q}=\\overline{(A\\cdot B)\\cdot(A+B)}$. Truth table banane se pehle expression likhna zaroori hai, warna sequence me galti ho jaati hai.","m":"Pehle expression simplify karo: $(A\\cdot B)\\cdot(A+B)=A\\cdot B$ (absorption law), isliye $Y=\\overline{A\\cdot B}$, yaani sirf NAND. Phir chaar inputs ke liye values nikalo. Kyun simplify: isse table banane me galti kam hoti hai.","s":["$P=A\\cdot B$ (AND), $Q=A+B$ (OR)","$PQ=(A\\cdot B)(A+B)=AB\\cdot A+AB\\cdot B=AB+AB=AB$","$Y=\\overline{AB}$ — matlab circuit effectively NAND hai","$(0,0)$: $AB=0\\Rightarrow Y=1$","$(0,1)$: $AB=0\\Rightarrow Y=1$","$(1,0)$: $AB=0\\Rightarrow Y=1$","$(1,1)$: $AB=1\\Rightarrow Y=0$","Sequence: $1,1,1,0$ — option (3)."],"r":["$1,0,1,0$ kisi gate ke sahi output se match nahi karta — ye XOR-type pattern hai jo yahan nahi hai.","$0,1,0,1$ ulta pattern hai; agar NAND ki jagah AND hota tab bhi aisa nahi aata.","","$0,0,1,1$ AND gate ka output sequence hai, poore circuit ka nahi."],"w":["Bina expression likhe seedha mental table banane se OR gate ka role miss ho jaata hai. Pehle $Y$ likho, phir table."],"t":"Absorption law yaad rakho: $AB(A+B)=AB$. Ye ek line me poora circuit simplify kar deta hai."},{"id":20,"sub":"Physics","q":"A stone is allowed to fall from the top of a tower $100\\ \\mathrm{m}$ high and at the same time another stone is projected vertically upwards from the ground with a velocity of $25\\ \\mathrm{m\\,s^{-1}}$. The two stones will meet after","opt":["$4\\ \\mathrm{s}$","$0.4\\ \\mathrm{s}$","$0.04\\ \\mathrm{s}$","$40\\ \\mathrm{s}$"],"ans":0,"c":"Dono stones ek hi vertical line par hain, ek neeche gir raha hai aur doosra upar ja raha hai. Milne ka matlab hai dono ki position (ground se height) same. Relative motion se socho to dono ek doosre ki taraf relative speed $(0+25)=25\\ \\mathrm{m\\,s^{-1}}$ se badh rahe hain, aur beech ki doori $100\\ \\mathrm{m}$ hai — isliye time seedha $100/25$ aata hai.","m":"Do equations banao aur jod do: girta stone $100-\\frac12gt^2$, upar wala $25t-\\frac12gt^2$; barabar rakho. Kyun jodna: $\\frac12gt^2$ dono me cancel ho jaata hai, isliye $g$ ka koi role nahi rehta.","s":["Girta stone ki height (ground se): $h_1=100-\\dfrac12(10)t^2$","Upar jaata stone ki height: $h_2=25t-\\dfrac12(10)t^2$","Milne par $h_1=h_2$: $100-5t^2=25t-5t^2$","$5t^2$ dono side cancel: $100=25t$","$t=\\dfrac{100}{25}=4\\ \\mathrm{s}$ — option (1)."],"r":["","$0.4\\ \\mathrm{s}$ me to doori sirf $10\\ \\mathrm{m}$ cover hoti hai — bahut kam.","$0.04\\ \\mathrm{s}$ me $1\\ \\mathrm{m}$ bhi nahi — decimal shift ki galti.","$40\\ \\mathrm{s}$ me pehla stone $800\\ \\mathrm{m}$ gir chuka hota, tower hi $100\\ \\mathrm{m}$ hai."],"t":"Opposite direction wale do objects ke liye relative speed $=u_1+u_2$, aur relative acceleration $=0$ (dono par same $g$). Isliye $t=\\dfrac{d}{u_1+u_2}$."},{"id":21,"sub":"Physics","q":"Which of the following nuclear fragments corresponding to nuclear fission between neutron $({}^{1}_{0}\\mathrm{n})$ and uranium isotope $({}^{235}_{92}\\mathrm{U})$ is correct:","opt":["${}^{144}_{56}\\ce{Ba}+{}^{89}_{36}\\ce{Kr}+4\\,{}^{1}_{0}\\mathrm{n}$","${}^{140}_{56}\\ce{Xe}+{}^{94}_{38}\\ce{Sr}+3\\,{}^{1}_{0}\\mathrm{n}$","${}^{153}_{51}\\ce{Sb}+{}^{99}_{41}\\ce{Nb}+3\\,{}^{1}_{0}\\mathrm{n}$","${}^{144}_{56}\\ce{Ba}+{}^{89}_{36}\\ce{Kr}+3\\,{}^{1}_{0}\\mathrm{n}$"],"ans":3,"c":"Fission me uranium ka bhaari nucleus neutron absorb karke do medium nuclei me toot jaata hai, saath me kuch neutrons nikalte hain. Nuclear reaction me do conservation laws hamesha lagte hain: mass number $A$ (nucleons ki ginti) aur atomic number $Z$ (protons) — dono side barabar hone chahiye.","m":"Har option ke liye $A$ aur $Z$ ka sum dono taraf check karo. Kyun: sirf wahi option correct ho sakta hai jisme dono conservation laws satisfy hon.","s":["Left side: $A=235+1=236$, $Z=92+0=92$","Option (4): $A=144+89+3=236$ ✓, $Z=56+36+0=92$ ✓","Option (1): $A=144+89+4=237$ ✗ (ek nucleon zyada)","Option (2): $\\ce{Xe}$ ka $Z=54$ diya hai, to $Z=54+38=92$ ✓ par $A=140+94+3=237$ ✗","Option (3): $Z=51+41=92$ ✓ par $A=153+99+3=255$ ✗","Sirf option (4) dono conservation satisfy karta hai."],"r":["$4$ neutrons lene se $A=237$ ho jaata hai, jabki left side $236$ hai.","${}^{140}_{56}\\ce{Xe}$ me $Z=56$ par xenon ka $Z=54$ hota hai, aur $A$ ka sum bhi $237$ hai.","${}^{153}_{51}\\ce{Sb}$ ka mass number $255$ tak le jaata hai — mass number hi match nahi karta.",""],"t":"Fission equation check karne ka 10-second rule: pehle sirf mass number jodo, 90% options wahin reject ho jaate hain."},{"id":22,"sub":"Physics","q":"A projectile is thrown with velocity $v$ making an angle $\\theta$ with the horizontal. It just crosses the tops of two poles, each of height $h$, after $1\\ \\mathrm{s}$ and $3\\ \\mathrm{s}$ respectively. The time of flight of the projectile is","fig":"<svg viewBox=\"0 0 360 196\" width=\"360\" height=\"196\" role=\"img\" aria-label=\"projectile crossing two poles of equal height\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"196\" fill=\"none\"/><defs><marker id=\"ah\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#8b95a8\"/><\/marker><\/defs><line x1=\"20\" y1=\"150\" x2=\"340\" y2=\"150\" stroke=\"#8b95a8\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M 30 148 Q 180 -30 330 148\" fill=\"none\" stroke=\"#7c9cff\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"120\" y1=\"150\" x2=\"120\" y2=\"86\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"112\" y1=\"86\" x2=\"128\" y2=\"86\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"150\" x2=\"240\" y2=\"86\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"232\" y1=\"86\" x2=\"248\" y2=\"86\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"120\" y=\"78\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">pole, height h<\/text><text x=\"240\" y=\"78\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">pole, height h<\/text><circle cx=\"120\" cy=\"86\" r=\"3.4\" fill=\"#7fd39a\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><circle cx=\"240\" cy=\"86\" r=\"3.4\" fill=\"#7fd39a\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"112\" y=\"176\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">t = 1 s<\/text><text x=\"252\" y=\"176\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">t = 3 s<\/text><line x1=\"30\" y1=\"168\" x2=\"330\" y2=\"168\" stroke=\"#ffd479\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><text x=\"180\" y=\"186\" fill=\"#ffd479\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">time of flight T = ?<\/text><\/svg>","opt":["$1\\ \\mathrm{s}$","$3\\ \\mathrm{s}$","$4\\ \\mathrm{s}$","$7.8\\ \\mathrm{s}$"],"ans":2,"c":"Projectile ki height time ke quadratic function hai: $y=ut\\sin\\theta-\\frac12gt^2$. Jab do different times par height same हो, to wo do times us quadratic ke do roots hain. Quadratic ke roots ka sum $=-\\dfrac{b}{a}=\\dfrac{2u\\sin\\theta}{g}$ — aur ye bilkul time of flight $T$ hi hai.","m":"Same height ke do times $t_1$ aur $t_2$ diye hain, isliye quadratic ke roots ka sum use karo. Kyun: isse $u\\sin\\theta$ nikalne ki zaroorat hi nahi padti, seedha $T$ mil jaata hai.","s":["Height equation: $h=ut\\sin\\theta-\\dfrac12gt^2$","Rearrange: $\\dfrac12gt^2-(u\\sin\\theta)\\,t+h=0$","Roots $t_1=1\\ \\mathrm{s}$ aur $t_2=3\\ \\mathrm{s}$ (dono par height $h$)","Roots ka sum: $t_1+t_2=\\dfrac{2u\\sin\\theta}{g}$","Time of flight: $T=\\dfrac{2u\\sin\\theta}{g}=t_1+t_2$","$T=1+3=4\\ \\mathrm{s}$ — option (3)."],"r":["$1\\ \\mathrm{s}$ sirf pehli pole ka time hai, poora flight nahi.","$3\\ \\mathrm{s}$ doosri pole ka time hai; projectile uske baad bhi udta rehta hai.","","$7.8\\ \\mathrm{s}$ me koi pattern nahi — ye kisi aur data ke liye hota, jaise alag heights par."],"w":["Do times same height ke hain, isliye unka sum $T$ deta hai — average ya difference nahi. Difference se sirf $\\sqrt{u^2\\sin^2\\theta-2gh}$ ka info milta hai."],"t":"Yaad rakho: kisi bhi horizontal line ko projectile do times par cross karta hai, aur un dono times ka sum hamesha $T$ hota hai."},{"id":23,"sub":"Physics","q":"The angular momentum for the electron in Bohr's orbit is $M$. If the electron is assumed to revolve in fourth orbit of hydrogen atom, then the change in angular momentum will be","opt":["$M$","$3M$","Zero","$2M$"],"ans":1,"c":"Bohr model me angular momentum quantised hai: $L_n=\\dfrac{nh}{2\\pi}$, yaani $L_n=nL_1$. Pehli orbit ($n=1$) ka angular momentum $M=\\dfrac{h}{2\\pi}$ maan kar, chauthi orbit ka $4M$ hoga. 'Change' matlab difference — final minus initial.","m":"$L_n=nL$ relation seedha lagao aur difference nikalo. Kyun: question me $M$ ko ek orbit ka angular momentum diya hai, aur orbit number diya hai, to ratio se kaam chal jata hai.","s":["Bohr condition: $L_n=\\dfrac{nh}{2\\pi}=nM$ (jahan $M=\\dfrac{h}{2\\pi}$)","Ground orbit ($n=1$): $L_1=M$","Fourth orbit ($n=4$): $L_4=4M$","Change: $\\Delta L=L_4-L_1=4M-M$","$\\Delta L=3M$ — option (2)."],"r":["$M$ sirf ek orbit ka angular momentum hai; change $4M-M$ hota hai.","","Zero tab hota jab dono orbits same hon — yahan $n$ badal raha hai.","$2M$ $n=3$ ke liye aata ($3M-M$), chauthi orbit ke liye nahi."],"t":"Bohr model ke do formulas saath yaad rakho: $L=\\dfrac{nh}{2\\pi}$ aur $r_n\\propto n^2$, $E_n\\propto -\\dfrac{1}{n^2}$."},{"id":24,"sub":"Physics","q":"A ball of mass $1\\ \\mathrm{kg}$ hangs in equilibrium from two strings $OA$ and $OB$ as shown in figure. What are the tensions in strings $OA$ and $OB$, respectively? (Take $g=10\\ \\mathrm{m\\,s^{-2}}$)","fig":"<svg viewBox=\"0 0 360 190\" width=\"360\" height=\"190\" role=\"img\" aria-label=\"ball hanging from two strings\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"190\" fill=\"none\"/><line x1=\"40\" y1=\"40\" x2=\"320\" y2=\"40\" stroke=\"#8b95a8\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"44\" y1=\"40\" x2=\"36\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"62\" y1=\"40\" x2=\"54\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"80\" y1=\"40\" x2=\"72\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"98\" y1=\"40\" x2=\"90\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"40\" x2=\"108\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"134\" y1=\"40\" x2=\"126\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"152\" y1=\"40\" x2=\"144\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"170\" y1=\"40\" x2=\"162\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"188\" y1=\"40\" x2=\"180\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"206\" y1=\"40\" x2=\"198\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"224\" y1=\"40\" x2=\"216\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"242\" y1=\"40\" x2=\"234\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"260\" y1=\"40\" x2=\"252\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"278\" y1=\"40\" x2=\"270\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"296\" y1=\"40\" x2=\"288\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"314\" y1=\"40\" x2=\"306\" y2=\"30\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"40\" x2=\"180\" y2=\"120\" stroke=\"#7fd39a\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"40\" x2=\"180\" y2=\"120\" stroke=\"#7c9cff\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"70\" y=\"30\" fill=\"#7fd39a\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">A<\/text><text x=\"292\" y=\"30\" fill=\"#7c9cff\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">B<\/text><text x=\"120\" y=\"62\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">30°<\/text><text x=\"246\" y=\"62\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">60°<\/text><circle cx=\"180\" cy=\"120\" r=\"8\" fill=\"#3a3320\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><text x=\"180\" y=\"125\" fill=\"#ffd479\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">O<\/text><text x=\"180\" y=\"104\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">90°<\/text><line x1=\"180\" y1=\"132\" x2=\"180\" y2=\"176\" stroke=\"#e7908c\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><text x=\"215\" y=\"172\" fill=\"#e7908c\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">W = 10 N<\/text><text x=\"112\" y=\"108\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">T<tspan baseline-shift=\"sub\" font-size=\"70%\"><\/tspan>(1)<\/text><text x=\"250\" y=\"108\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">T<tspan baseline-shift=\"sub\" font-size=\"70%\"><\/tspan>(2)<\/text><\/svg>","opt":["$5\\ \\mathrm{N}$, zero","Zero, $5\\ \\mathrm{N}$","$5\\ \\mathrm{N}$, $5\\sqrt{3}\\ \\mathrm{N}$","$5\\sqrt{3}\\ \\mathrm{N}$, $5\\ \\mathrm{N}$"],"ans":2,"c":"Ball equilibrium me hai, matlab teen forces (do tensions aur weight) ka vector sum zero hai. Aisi teen concurrent forces ke liye Lami's theorem sabse fast hai: $\\dfrac{T_1}{\\sin\\alpha_1}=\\dfrac{T_2}{\\sin\\alpha_2}=\\dfrac{W}{\\sin\\alpha_3}$, jahan angles opposite forces ke hote hain.","m":"Lami's theorem chuno kyunki teen forces ek point par milti hain aur equilibrium me hain. Alternative: horizontal/vertical components — dono se same answer aata hai, par Lami me arithmetic kam hai.","s":["Figure se: strings ke beech $90^{\\circ}$, to $T_1$ ke saamne ka angle $150^{\\circ}$ aur $T_2$ ke saamne $120^{\\circ}$","Weight $W=mg=1\\times10=10\\ \\mathrm{N}$","Lami: $\\dfrac{T_1}{\\sin 150^{\\circ}}=\\dfrac{T_2}{\\sin 120^{\\circ}}=\\dfrac{10}{\\sin 90^{\\circ}}$","$\\sin 150^{\\circ}=0.5$, $\\sin 120^{\\circ}=\\dfrac{\\sqrt3}{2}$, $\\sin 90^{\\circ}=1$","$T_1=10\\times0.5=5\\ \\mathrm{N}$","$T_2=10\\times\\dfrac{\\sqrt3}{2}=5\\sqrt3\\approx8.66\\ \\mathrm{N}$ — option (3)."],"r":["$5\\ \\mathrm{N}$ aur zero: agar ek string bilkul vertical hoti tab aisa hota, par yahan dono strings tilted hain.","Zero aur $5\\ \\mathrm{N}$: yahi galti ulti taraf — tension zero kabhi ho hi nahi sakti jab string khinchi hui ho.","","$5\\sqrt3$ aur $5$: values sahi hain par order ulta hai — $T_1$ chhote angle ($150^{\\circ}$) ke saamne hai, isliye chhoti tension."],"w":["Lami me angle hamesha doosri do forces ke beech ka hota hai, force aur string ke beech ka nahi. Yahan $30^{\\circ}$/$60^{\\circ}$ ko hi rakh dena sabse badi galti hai."],"t":"Check karne ka tareeka: dono tensions ka vertical component milakar $10\\ \\mathrm{N}$ aana chahiye — $5\\sin? + 8.66\\sin?$ se verify kar lo."},{"id":25,"sub":"Physics","q":"A proton and an $\\alpha$-particle are accelerated from rest by $2\\ \\mathrm{V}$ and $4\\ \\mathrm{V}$ potentials, respectively. The ratio of their de-Broglie wavelength is","opt":["$16:1$","$2:1$","$8:1$","$4:1$"],"ans":3,"c":"Charged particle ko potential $V$ se accelerate karne par uski kinetic energy $qV$ ho jaati hai. de-Broglie wavelength $\\lambda=\\dfrac{h}{p}$ aur $p=\\sqrt{2mK}=\\sqrt{2mqV}$ — isliye $\\lambda=\\dfrac{h}{\\sqrt{2mqV}}$. Bhaari aur zyada charge wala particle chhoti wavelength deta hai.","m":"$\\lambda\\propto\\dfrac{1}{\\sqrt{mqV}}$ ratio banao, values rakho. Kyun: proportionality me sirf mass, charge aur voltage chahiye, $h$ cancel ho jaata hai.","s":["$\\lambda=\\dfrac{h}{\\sqrt{2mqV}}$","Proton: $m_p=1u$, $q_p=e$, $V_p=2\\ \\mathrm{V}$ $\\Rightarrow m q V=1\\times1\\times2=2$","$\\alpha$-particle: $m_\\alpha=4u$, $q_\\alpha=2e$, $V_\\alpha=4\\ \\mathrm{V}$ $\\Rightarrow 4\\times2\\times4=32$","$\\dfrac{\\lambda_p}{\\lambda_\\alpha}=\\sqrt{\\dfrac{32}{2}}=\\sqrt{16}$","$=4$, yaani $4:1$ — option (4)."],"r":["$16:1$ aa jaata hai agar square root lena bhool jayein — wavelength me $\\sqrt{}$ hota hai.","$2:1$ sirf charges ka ratio hai ($2$), poora expression nahi.","$8:1$ tab aata hai jab voltage ka ratio double count ho jaye.",""],"t":"$\\alpha$-particle ke liye hamesha $m=4m_p$, $q=2e$ rakho — NEET me ye ratio baar-baar kaam aata hai."},{"id":26,"sub":"Physics","q":"A stone is dropped from the top of a tall tower. The ratio of the kinetic energy of the stone at the end of three seconds to the increase in the kinetic energy of the stone during the next three seconds is","opt":["$1:1$","$1:2$","$1:3$","$1:9$"],"ans":2,"c":"Free fall me velocity $v=gt$ se badhti hai, to kinetic energy $t^2$ ke proportion me badhti hai. Do alag cheezein poochhi gayi hain: (i) $t=3\\ \\mathrm{s}$ par total KE, (ii) $3\\ \\mathrm{s}$ se $6\\ \\mathrm{s}$ ke beech KE me *increase* — ye difference hai, second KE nahi.","m":"$v=gt$ se velocities nikalo, phir $\\frac12mv^2$ se energies. Kyun difference: 'increase during next three seconds' ka matlab $K(6)-K(3)$ hai.","s":["$t=3\\ \\mathrm{s}$: $v=10\\times3=30\\ \\mathrm{m\\,s^{-1}}$","$K_1=\\frac12m(30)^2=450m\\ \\mathrm{J}$","$t=6\\ \\mathrm{s}$: $v=10\\times6=60\\ \\mathrm{m\\,s^{-1}}$","$K_2=\\frac12m(60)^2=1800m\\ \\mathrm{J}$","Increase $\\Delta K=1800m-450m=1350m\\ \\mathrm{J}$","Ratio $=\\dfrac{450m}{1350m}=\\dfrac{1}{3}$, yaani $1:3$ — option (3)."],"r":["$1:1$ tab aata agar K.E. velocity ke saath linear hoti — par wo $v^2$ par depend karti hai.","$1:2$ tab aata hai agar increase ki jagah total KE at $6\\ \\mathrm{s}$ lein ($450:900$).","","$1:9$ sirf times ke square ka ratio hai ($3^2:9^2$), energies ka nahi."],"t":"'Increase during interval' ka matlab hamesha $\\Delta K$ hota hai, na ki interval ke end par KE. Ye ek word poore question ka answer badal deta hai."},{"id":27,"sub":"Physics","q":"A point source of $100\\ \\mathrm{W}$ emits light with $5\\%$ efficiency. At a distance of $5\\ \\mathrm{m}$ from the source, the intensity produced by the electric field component is","opt":["$\\dfrac{1}{10\\pi}\\ \\mathrm{W\\,m^{-2}}$","$\\dfrac{1}{20\\pi}\\ \\mathrm{W\\,m^{-2}}$","$\\dfrac{1}{2\\pi}\\ \\mathrm{W\\,m^{-2}}$","$\\dfrac{1}{40\\pi}\\ \\mathrm{W\\,m^{-2}}$"],"ans":3,"c":"Point source se light spherical wavefront me faileti hai, isliye intensity $I=\\dfrac{P}{4\\pi r^2}$ hoti hai (power surface area se divide). Electromagnetic wave ki total energy electric aur magnetic field me barabar bat jaati hai — isliye total intensity ka aadha electric field component se aata hai.","m":"Pehle useful power (efficiency), phir $4\\pi r^2$ se total intensity, phir half karke electric part. Kyun half: EM wave me $u_E=u_B$ hoti hai, energy ka aadha hissa each field ka.","s":["Radiated power: $P=100\\times\\dfrac{5}{100}=5\\ \\mathrm{W}$","$I_{\\text{total}}=\\dfrac{P}{4\\pi r^2}=\\dfrac{5}{4\\pi(5)^2}=\\dfrac{5}{100\\pi}$","$I_{\\text{total}}=\\dfrac{1}{20\\pi}\\ \\mathrm{W\\,m^{-2}}$","Electric field component: $I_E=\\dfrac12 I_{\\text{total}}$","$I_E=\\dfrac12\\times\\dfrac{1}{20\\pi}=\\dfrac{1}{40\\pi}\\ \\mathrm{W\\,m^{-2}}$ — option (4)."],"r":["$\\dfrac{1}{10\\pi}$ bina half kiye aa jaata hai (ya efficiency galat lagane par).","$\\dfrac{1}{20\\pi}$ total intensity hai — electric component nahi.","$\\dfrac{1}{2\\pi}$ me $4\\pi r^2$ ki jagah $r^2$ use hua hai aur efficiency bhi ignore hui.",""],"w":["$100\\ \\mathrm{W}$ poora light nahi hai — sirf $5\\%$ light me convert hota hai. Pehla step hamesha efficiency apply karna hai."],"t":"EM wave me: $I=\\dfrac12\\varepsilon_0E_0^2c$ (electric part) aur itna hi magnetic part. Total $I=\\dfrac{P}{4\\pi r^2}$."},{"id":28,"sub":"Physics","q":"A ring of radius $R$ is first rotated with an angular velocity $\\omega_0$ and then carefully placed on a rough horizontal surface. The coefficient of friction between the surface and the ring is $\\mu$. Time after which its angular speed is reduced to half is","fig":"<svg viewBox=\"0 0 360 170\" width=\"360\" height=\"170\" role=\"img\" aria-label=\"ring rotating on a rough surface\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"170\" fill=\"none\"/><line x1=\"30\" y1=\"130\" x2=\"330\" y2=\"130\" stroke=\"#8b95a8\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"34\" y1=\"130\" x2=\"27\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"130\" x2=\"43\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"66\" y1=\"130\" x2=\"59\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"82\" y1=\"130\" x2=\"75\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"98\" y1=\"130\" x2=\"91\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"114\" y1=\"130\" x2=\"107\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"130\" y1=\"130\" x2=\"123\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"146\" y1=\"130\" x2=\"139\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"162\" y1=\"130\" x2=\"155\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"178\" y1=\"130\" x2=\"171\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"194\" y1=\"130\" x2=\"187\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"210\" y1=\"130\" x2=\"203\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"226\" y1=\"130\" x2=\"219\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"242\" y1=\"130\" x2=\"235\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-li
