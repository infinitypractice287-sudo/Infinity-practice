2+}}]}{1}$","$[\\ce{Cu^{2+}}]$ badhne par $\\log$ term badhta hai, isliye $E_{\\text{ox}}$ ghat-ta hai","Concentrations: $P=10^{-4}$, $S=10^{-3}$, $R=10^{-2}$, $Q=10^{-1}$","Kam concentration $\\Rightarrow$ zyada oxidation potential: $P>S>R>Q$","Answer: option (2)."],"r":["$Q>R>S>P$ oxidation potential ka ulta order hai (ye reduction potential ka trend hai).","","$R>S>Q>P$ me concentration order hi galat hai.","$P>Q>R>S$ me $Q$ ko doosre number par rakhna galat hai — $Q$ ki concentration sabse zyada hai."],"t":"Nernst ka simple rule: oxidation potential concentration ke **ulta** chalta hai, reduction potential concentration ke saath badhta hai."},{"id":91,"sub":"Biology","q":"Given below are two statements: One is labelled as Assertion (A) and the other as Reason (R). <br>Assertion (A): In all flowering plants formation of seed and fruit are through fertilisation. <br>Reason (R): In some families seeds are produced without fertilisation.","opt":["(A) is False but (R) is True.","Both (A) and (R) are True but (R) is not the correct explanation of (A)","(A) is True but (R) is False","Both (A) and (R) are True and (R) is the correct explanation of (A)"],"ans":0,"c":"Normally seed fertilization ke baad bantaa hai, par kuch cases me bina fertilization ke bhi seed ban jaate hain — ise apomixis kehte hain (jaise Asteraceae me). Aur kuch me fruit bina fertilization ke ban jaata hai — parthenocarpy (jaise banana). Isliye 'all flowering plants me sirf fertilisation se' wala assertion galat hai.","m":"Assertion ko exception-based test do: koi apomictic/parthenocarpic example milta hai to assertion false ho jaata hai. Phir reason ko alag se check karo.","s":["Assertion: 'all flowering plants me seed aur fruit fertilisation se' — ye universal statement hai","Apomixis: bina fertilisation ke seed (jaise Asteraceae me) — exception mil gaya","Parthenocarpy: bina fertilisation ke fruit (banana) — doosra exception","Isliye (A) false hai","Reason: 'kuch families me seeds bina fertilisation ke banti hain' — ye sach hai (apomixis)","Answer: (A) False but (R) True — option (1)."],"r":["","(A) sach nahi hai — apomixis/parthenocarpy exceptions hain, isliye 'both true' wala option galat.","(A) false hai aur (R) sach hai — ye option ulta keh raha hai.","Dono true nahi hain, kyunki assertion universal claim kar raha hai jo exceptions se toot jaata hai."],"t":"Do terms yaad rakho: apomixis = bina fertilisation ke seed; parthenocarpy = bina fertilisation ke fruit. Assertion me 'all/always' jaise words ho to exception dhoondho."},{"id":92,"sub":"Biology","q":"Which one of the following is most appropriately defined?","opt":["Host is an organism which provides only food to another organism","Amensalism is a relationship in which one species is benefitted whereas the other is unaffected","Predator is an organism that catches and kills other organism for food","Parasite is an organism which always lives inside the body of other organism and may kill it"],"ans":2,"c":"Ecological interactions ko +/- notation me samajhna sabse aasan hai: mutualism (+,+), commensalism (+,0), amensalism (-,0), parasitism (+,−), predation (+,−). Har definition me dono partners ka effect dekhna chahiye.","m":"Har option ko +/- sign test do. Kyun: definitions me qualify words ('only', 'always') aksar option ko galat bana dete hain.","s":["Host: sirf food nahi, shelter bhi deta hai $\\Rightarrow$ 'only food' galat ✗","Amensalism: ek ko harm, doosre ko koi effect nahi $(-,0)$; 'benefitted' wala to commensalism hai ✗","Predator: doosre organism ko pakad kar khaata hai — ye sahi definition hai ✓","Parasite: body ke andar ya bahar dono jagah reh sakta hai (ecto/endoparasite) $\\Rightarrow$ 'always inside' galat ✗","Answer: option (3)."],"r":["Host food ke saath shelter bhi deta hai — 'only food' word hi ise galat karta hai.","Jo relationship me ek species ko benefit aur doosre ko no effect ho, wo commensalism hai; amensalism me ek ko harm hota hai.","","Parasites bahar bhi reh sakte hain (ectoparasites jaise lice), isliye 'always inside' galat hai."],"t":"Interaction table yaad rakho: mutualism (+,+), commensalism (+,0), amensalism (−,0), parasitism (+,−), predation (+,−), competition (−,−)."},{"id":93,"sub":"Biology","q":"List of endangered species was released by","opt":["GEAC","WWF","FOAM","IUCN"],"ans":3,"c":"IUCN (International Union for Conservation of Nature) duniya bhar ki species ki conservation status maintain karta hai — Red List isi ki publication hai. Isme categories hoti hain: Extinct, Extinct in Wild, Critically Endangered, Endangered, Vulnerable, Near Threatened, Least Concern.","m":"Organisation ke naam se kaam match karo. Kyun: ye pure recall question hai, isliye institutions ke role yaad hone chahiye.","s":["IUCN = International Union for Conservation of Nature","Ye Red Data Book / Red List publish karta hai","Red List me species ki categories (Endangered, Vulnerable etc.) hoti hain","GEAC GM crops ke liye hai (India), WWF conservation NGO hai par list IUCN nikalti hai","Answer: IUCN — option (4)."],"r":["GEAC (Genetic Engineering Approval Committee) GM organisms ke approvals dekhta hai, species list nahi.","WWF awareness aur conservation projects karta hai, official Red List IUCN ki hai.","'FOAM' koi aisi agency nahi hai — ye distractor hai.",""],"t":"Yaad rakho: Red List $\\to$ IUCN, Red Data Book $\\to$ IUCN ki publication; GEAC $\\to$ GM crops (India me MoEF ke under)."},{"id":94,"sub":"Biology","q":"Which of the following chemicals are obtained from fungi: <br>(a) Citric Acid &#8195;(b) Lactic Acid &#8195;(c) Cyclosporin A &#8195;(d) Statins &#8195;(e) Streptokinase","opt":["a, c, d","a, b, c, d","a, c, d, e","only a, c, e"],"ans":0,"c":"Microbes se milne wale useful chemicals ka ek classic list hai: fungi se citric acid (Aspergillus niger), cyclosporin A (Trichoderma polysporum — immunosuppressant), statins (Monascus purpureus — blood cholesterol kam karta hai). Lactic acid bacteria (Lactobacillus) se aata hai, aur streptokinase Streptococcus bacteria se — ye 'clot buster' hai.","m":"Har chemical ka source organism yaad karo: fungus ya bacterium. Kyun: options me sirf source ka farq hai, isliye ek-do exception pakadne se answer mil jaata hai.","s":["(a) Citric acid — Aspergillus niger (fungus) ✓","(b) Lactic acid — Lactobacillus (bacterium) ✗","(c) Cyclosporin A — Trichoderma polysporum (fungus) ✓","(d) Statins — Monascus purpureus (fungus) ✓","(e) Streptokinase — Streptococcus (bacterium) ✗","Correct: a, c, d — option (1)."],"r":["","(b) lactic acid bacteria se aata hai, fungus se nahi.","(e) streptokinase bacterium se aata hai — isliye isse hataana hai.","(d) statins fungus se aate hain, isliye 'only a, c, e' galat hai."],"t":"Fungal products ki short list: penicillin, cyclosporin A, statins, citric acid, gluconic acid, alcohol (yeast). Bacterial: streptokinase, lactic acid, antibiotics (Streptomyces)."},{"id":95,"sub":"Biology","q":"Given below are two statements <br>Statement I: Isolated protoplast from two different varieties of plants each having a desirable character can be fused to get hybrid protoplasts, which can be further grown to form a new plant; these hybrids are called somatic hybrids while the process is called somatic hybridisation. <br>Statement II: GM has been used to create tailor-made plants to supply alternatives to industries, in the form of starches, fuels and pharmaceuticals.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"c":"Somatic hybridisation me do plants ke protoplasts (cell wall hataye hue cells) fuse kiye jaate hain — isse sexual incompatibility ko bypass kar sakte hain aur somatic hybrids banti hain (jaise pomato: potato + tomato). GM crops ko industry ke liye starches, fuels aur pharmaceuticals banane ke liye bhi design kiya gaya hai.","m":"Dono statements ko textbook definitions se check karo. Kyun: yahan koi calculation nahi, sirf concept recall hai.","s":["Statement I: protoplast fusion $\\to$ somatic hybrid $\\to$ nayi plant — ye somatic hybridisation ki definition hai ✓","Example: pomato (potato + tomato) somatic hybrid hai","Statement II: GM plants industry ke liye tailor-made products (starch, fuel, pharmaceuticals) de sakte hain ✓","Dono statements correct hain — option (4)."],"r":["Statement I clearly correct hai (textbook definition), isliye 'both incorrect' galat.","Statement II bhi correct hai — GM crops ka industrial use documented hai.","Statement I incorrect nahi hai, isliye ye option galat.",""],"t":"Somatic hybridisation ka example yaad rakho: 'pomato' = potato + tomato. Tissue culture se alag hai — wahan ek hi plant ki cells se clones bante hain."},{"id":96,"sub":"Biology","q":"The figure below shows three steps (A, B, C) of Polymerase Chain Reaction (PCR). Select the option giving correct identification together with what it represents.","fig":"<svg viewBox=\"0 0 360 140\" width=\"360\" height=\"140\" role=\"img\" aria-label=\"three steps of polymerase chain reaction\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"140\" fill=\"none\"/><rect x=\"20\" y=\"30\" width=\"96\" height=\"54\" rx=\"8\" fill=\"#20252f\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"68\" y=\"52\" fill=\"#7fd39a\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Step A<\/text><text x=\"68\" y=\"70\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Denaturation<\/text><text x=\"68\" y=\"100\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">94–98 °C<\/text><line x1=\"116\" y1=\"57\" x2=\"138\" y2=\"57\" stroke=\"#9aa3b2\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><rect x=\"138\" y=\"30\" width=\"96\" height=\"54\" rx=\"8\" fill=\"#20252f\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><text x=\"186\" y=\"52\" fill=\"#7c9cff\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Step B<\/text><text x=\"186\" y=\"70\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Annealing<\/text><text x=\"186\" y=\"100\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">50–60 °C<\/text><line x1=\"234\" y1=\"57\" x2=\"256\" y2=\"57\" stroke=\"#9aa3b2\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><rect x=\"256\" y=\"30\" width=\"96\" height=\"54\" rx=\"8\" fill=\"#20252f\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><text x=\"304\" y=\"52\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Step C<\/text><text x=\"304\" y=\"70\" fill=\"#dcdfe4\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Extension<\/text><text x=\"304\" y=\"100\" fill=\"#ffd479\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">72 °C<\/text><text x=\"180\" y=\"128\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">PCR cycle (three steps)<\/text><\/svg>","opt":["B - denaturation at a temperature of about $98^{\\circ}\\mathrm{C}$ separating the two DNA strands","A - denaturation at a temperature of about $50^{\\circ}\\mathrm{C}$","C - extension in the presence of heat stable DNA polymerase","A - annealing with two sets of primers"],"ans":2,"c":"PCR ke teen steps fixed order me hote hain: (1) Denaturation — high temperature ($94$–$98^{\\circ}\\mathrm{C}$) par double strand alag; (2) Annealing — thoda kam temperature ($50$–$60^{\\circ}\\mathrm{C}$) par primers judte hain; (3) Extension — $72^{\\circ}\\mathrm{C}$ par Taq polymerase naye strand banata hai. Har cycle me DNA double ho jaata hai.","m":"Temperature se step identify karo: sabse high = denaturation, sabse low = annealing, middle = extension. Kyun: har step ka temperature signature fix hota hai.","s":["Step A (highest temperature, $\\sim98^{\\circ}\\mathrm{C}$): denaturation — do strands alag","Step B ($\\sim50$–$60^{\\circ}\\mathrm{C}$): annealing — primers template se judte hain","Step C ($\\sim72^{\\circ}\\mathrm{C}$): extension — heat-stable DNA polymerase (Taq) naye strand banata hai","Option (3) sahi match hai: C = extension in presence of heat stable DNA polymerase ✓","Answer: option (3)."],"r":["B denaturation nahi, annealing hai — denaturation step A hota hai.","A denaturation hai par temperature $98^{\\circ}\\mathrm{C}$ hota hai, $50^{\\circ}\\mathrm{C}$ nahi (wo annealing ka temp hai).","","Annealing step B hai, A nahi — isliye A ko annealing kehna galat hai."],"t":"PCR ka temperature mantra: $94$–$98$ denaturation, $50$–$60$ annealing, $72$ extension. Taq polymerase thermostable hota hai, isliye high temperature se kharab nahi hota."},{"id":97,"sub":"Biology","q":"Select the incorrect match for bryophytes","opt":["Antherozoids - Biflagellates","Sporophyte - Multicellular","Meiosis in zygote - Occurs in many member","Mosses - Prevents soil erosion"],"ans":2,"c":"Bryophytes me gametophyte (haploid) main plant body hota hai; sporophyte chhota par multicellular hota hai. Zygote hi 2n stage hai jahan meiosis hoti hai — isliye bryophytes me meiosis **zygote** me hoti hai (spore formation ke waqt). Yahi unka characteristic hai, exception nahi.","m":"Har match ko bryophyte ki known biology se verify karo. Kyun: yahan ek specific statement ko 'galat' batana hai, isliye sabse aasan wahi hai jo universal truth ko exception bata de.","s":["Antherozoids biflagellate hote hain (paani me tairne ke liye) ✓","Sporophyte multicellular hai (capsule + seta + foot) ✓","Meiosis zygote me hoti hai — ye bryophytes ka **general** rule hai, 'many members' tak seemit nahi ✗","Mosses soil erosion rokte hain (Sphagnum peat bhi deta hai) ✓","Incorrect match: option (3)."],"r":["Antherozoids do flagella wale hote hain — sahi match.","Sporophyte multicellular hota hai — sahi match.","","Mosses ka soil erosion rokna textbook fact hai — sahi match."],"t":"Bryophytes ka key point: main body gametophyte (n), sporophyte (2n) us par depend karta hai, aur meiosis zygote me hoti hai (sporic meiosis)."},{"id":98,"sub":"Biology","q":"Which of the following structures in male frog are one pair: <br>(a) Testis (b) Bidder's canal (c) Kidney (d) Ovary (e) Cranial nerves","opt":["a, b, c","Only a, c","a, b, c, d","a, c, d, e"],"ans":0,"c":"Male frog ke urogenital system me testis, Bidder's canal aur kidney sab **paired** structures hain. Ovary female frog ka organ hai — male frog me hota hi nahi. Cranial nerves $10$ pairs hoti hain, isliye 'one pair' nahi kaha ja sakta.","m":"Har structure ke pairs count karo: male-specific organs, aur unke numbers. Kyun: question 'one pair' maang raha hai, isliye jo structure ek hi hota hai ya 10 pairs hota hai wo reject.","s":["(a) Testis: ek pair ✓","(b) Bidder's canal: ek pair (kidney ke saath associated) ✓","(c) Kidney: ek pair ✓","(d) Ovary: female frog ka organ — male me nahi ✗","(e) Cranial nerves: $10$ pairs ✗","Correct: a, b, c — option (1)."],"r":["","Bidder's canal bhi paired structure hai, isliye sirf a, c chunna adhoora hai.","Ovary male frog me hoti hi nahi.","Ovary bhi galat, aur cranial nerves 10 pairs hoti hain — 'one pair' nahi."],"t":"Male frog ka extra structure: Bidder's canal (kidney se testis tak sperm transport me help karta hai). Female me oviduct poora alag hota hai."},{"id":99,"sub":"Biology","q":"If a polysaccharide contains $6$ glucose monomeric units then what is the molecular formula of polysaccharide:","opt":["$\\ce{C36H72O36}$","$\\ce{C36H66O33}$","$\\ce{C36H62O31}$","$\\ce{C36H70O35}$"],"ans":2,"c":"Polysaccharide glycosidic bonds se banta hai: har bond banne par ek paani ka molecule ($\\ce{H2O}$) nikal jaata hai. Glucose ka formula $\\ce{C6H12O6}$ hai, aur $6$ units jodne ke liye $5$ bonds bante hain (chain ke liye $n-1$ bonds).","m":"$6\\times\\ce{C6H12O6}$ se $5\\ce{H2O}$ ghatao. Kyun: condensation polymerisation me water loss hota hai — yahi asli calculation hai.","s":["$6$ glucose units: $6\\times\\ce{C6H12O6}=\\ce{C36H72O36}$","$6$ units ko jodne ke liye $5$ glycosidic bonds $\\Rightarrow$ $5\\ce{H2O}$ remove","$5\\ce{H2O}=\\ce{H10O5}$","$\\ce{C36H72O36}-\\ce{H10O5}=\\ce{C36H62O31}$","Answer: $\\ce{C36H62O31}$ — option (3)."],"r":["$\\ce{C36H72O36}$ me water loss count hi nahi hua — ye sirf $6$ glucose ka sum hai.","$\\ce{C36H66O33}$ me $6$ water remove kiye gaye ($n$ bonds), jabki chain me $n-1$ bonds hote hain.","","$\\ce{C36H70O35}$ me sirf $2$ water remove hue — galat count."],"t":"Formula yaad rakho: $n$ glucose units se bana polysaccharide $=\\ce{C_{6n}H_{10n+2}O_{5n+1}}$ (linear chain). $n=6$ rakho to $\\ce{C36H62O31}$."},{"id":100,"sub":"Biology","q":"In DNA fingerprinting the separated DNA fragments are transferred to synthetic membranes; these synthetic membranes are","opt":["Malamine sheet","Nitrocellulose","Nylon","Both 2 and 3"],"ans":3,"c":"DNA fingerprinting me gel electrophoresis ke baad DNA fragments gel se membrane par transfer kiye jaate hain — ise Southern blotting kehte hain. Membrane ke liye nitrocellulose ya nylon use hote hain, kyunki DNA in surfaces se strongly bind ho jaata hai. Iske baad radioactive probe se hybridisation karke bands detect kiye jaate hain.","m":"Southern blotting ke membrane material yaad karo: nitrocellulose ya nylon. Kyun: ye pure recall fact hai.","s":["Gel electrophoresis se DNA fragments size ke hisaab se alag ho jaate hain","Fragments ko alkaline treatment ke baad membrane par transfer kiya jaata hai (Southern blotting)","Membrane: nitrocellulose ya nylon — dono DNA ko bind karte hain","Iske baad labelled probe se hybridisation aur autoradiography","Answer: Both (2) and (3) — option (4)."],"r":["Melamine sheet ka DNA transfer me koi role nahi hota.","Nitrocellulose sahi hai, par akela answer nahi — nylon bhi use hota hai.","Nylon sahi hai, par akela answer nahi — nitrocellulose bhi use hota hai.",""],"t":"Southern blotting = DNA (membrane par transfer), Northern = RNA, Western = protein. Naam yaad rakhne ka mnemonic: SNoW DRoP."},{"id":101,"sub":"Biology","q":"Expressed Sequence Tags (ESTs) refers to","opt":["All genes whether expressed or unexpressed","Certain important expressed genes","All genes that are expressed as RNA","All genes that are expressed as proteins"],"ans":2,"c":"Genomics me do approach hain: structural genomics (poora genome sequence) aur functional genomics (kaun se genes actually express ho rahe hain). EST ek short sequence tag hai jo expressed gene (mRNA) se banaya jaata hai — yaani wo genes jo RNA me transcribe ho rahe hain.","m":"Definition ko word-by-word todo: 'Expressed' $\\to$ jo express ho raha hai, 'Sequence Tag' $\\to$ chhota sequence. Kyun: option me RNA vs protein ka farq hi decide karna hai.","s":["Express hone ka pehla step transcription hai — gene se mRNA banti hai","EST ke liye mRNA ko reverse-transcribe karke cDNA banaya jaata hai","cDNA ka chhota hissa sequence karke tag ban jaata hai","Isliye EST un genes ka set hai jo RNA me express hote hain (protein translation ka wait nahi karte)","Answer: all genes expressed as RNA — option (3)."],"r":["EST sirf expressed genes ke liye hai; unexpressed genes ka koi EST nahi hota.","'Certain important' word galat hai — EST poori expressed population ko cover karta hai.","","EST RNA level par define hota hai, protein level par nahi (protein ke liye proteomics hota hai)."],"t":"Yaad rakho: structural genomics $\\to$ genome sequence; functional genomics $\\to$ ESTs aur expression. EST = expressed RNA ka tag."},{"id":102,"sub":"Biology","q":"Given below are two statements: <br>Statement I: In prokaryotes, the positively charged DNA is held with some negatively charged proteins in a region called nucleoid. <br>Statement II: In eukaryotes, the negatively charged DNA is wrapped around the positively charged histone octamer to form nucleosome.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":2,"c":"DNA ka phosphate backbone negatively charged hota hai. Prokaryotes me DNA negatively charged hai aur wo kuch positively charged proteins ke saath nucleoid me rehta hai. Eukaryotes me DNA negatively charged histone proteins (positively charged, rich in lysine and arginine) ke octamer par lipat kar nucleosome banata hai. Statement I me charges ulte kar diye gaye hain.","m":"Dono statements me charge ka logic check karo. Kyun: DNA ka charge hamesha negative hota hai (phosphate), isliye 'positively charged DNA' sunte hi statement galat.","s":["DNA backbone me phosphate groups hote hain $\\Rightarrow$ DNA negatively charged","Prokaryotes: negatively charged DNA + positively charged proteins $\\to$ nucleoid (Statement I me ulta likha hai) ✗","Eukaryotes: negatively charged DNA $\\sim200$ bp positively charged histone octamer par lipat kar nucleosome ✓","Nucleosome me 8 histone molecules ($2$ each of $\\mathrm{H2A}$, $\\mathrm{H2B}$, $\\mathrm{H3}$, $\\mathrm{H4}$) hote hain","Statement I galat, Statement II sahi — option (3)."],"r":["Statement II correct hai, isliye 'both incorrect' galat.","Statement I charge ulta bata raha hai — prokaryotic DNA bhi negative hai.","","Statement I me 'positively charged DNA' likha hai jo biology ke against hai."],"t":"Charge ka rule: DNA negative (phosphate), histone/protein positive. Nucleosome = DNA ($-$) + histone octamer ($+$)."},{"id":103,"sub":"Biology","q":"With reference to Hershey and Chase experiments select the correct statements. <br>(A) Viruses grown in the presence of radioactive phosphorus contained radioactive DNA. <br>(B) Viruses grown on radioactive sulphur contained radioactive proteins. <br>(C) Viruses grown on radioactive phosphorus contained radioactive protein. <br>(D) Viruses grown on radioactive sulphur contained radioactive DNA. <br>(E) Viruses grown on radioactive protein contained radioactive DNA.","opt":["(D) and (E) only","(A) and (B) only","(A) and (C) only","(B) and (D) only"],"ans":1,"c":"Hershey aur Chase ne bacteriophage ($\\mathrm{T2}$) use kiya. Phage me DNA aur protein dono hote hain. DNA me phosphorus hota hai (sulphur nahi), protein me sulphur hota hai (phosphorus nahi). Isliye ${}^{32}\\mathrm{P}$ DNA ko label karta hai aur ${}^{35}\\mathrm{S}$ protein ko — yahi experiment ka poora trick hai.","m":"Element ka association yaad karo: $\\mathrm{P}\\to$ DNA, $\\mathrm{S}\\to$ protein. Kyun: radioisotope usi molecule me jaata hai jisme wo element ho.","s":["${}^{32}\\mathrm{P}$ DNA me incorporate hota hai (phosphate backbone)","${}^{35}\\mathrm{S}$ protein me incorporate hota hai (cysteine, methionine)","(A) ${}^{32}\\mathrm{P}$ se grown virus $\\Rightarrow$ radioactive DNA ✓","(B) ${}^{35}\\mathrm{S}$ se grown virus $\\Rightarrow$ radioactive protein ✓","(C) galat, (D) galat, (E) me 'radioactive protein' se grow karna nonsense hai","Correct: (A) and (B) — option (2)."],"r":["(D) aur (E) dono galat hain — sulphur protein me jaata hai, DNA me nahi.","","(C) galat hai: phosphorus protein me nahi hota.","(D) galat hai: sulphur DNA me nahi hota."],"t":"Hershey-Chase ka conclusion: DNA hi genetic material hai (kyunki ${}^{32}\\mathrm{P}$ wala DNA bacteria me gaya, ${}^{35}\\mathrm{S}$ wala protein bahar hi reh gaya)."},{"id":104,"sub":"Biology","q":"Match List I with List II relating to major features of embryonic development at different timings of pregnancy: <br>List-I: A. After 4 weeks &#8195; B. After 12 weeks &#8195; C. After 24 weeks &#8195; D. After 8 weeks <br>List-II: I. Eye-lids separate and eyelashes are formed &#8195; II. Heart is formed &#8195; III. Limbs and digits are developed &#8195; IV. External genital organs are well developed","opt":["A-III, B-IV, C-I, D-II","A-II, B-I, C-III, D-IV","A-II, B-IV, C-I, D-III","A-III, B-IV, C-II, D-I"],"ans":2,"c":"Human embryonic development ka timeline NCERT me diya hai: pehle month me heart banti hai, doosre month me limbs aur digits develop hote hain, teen mahine (12 weeks) tak external genital organs develop ho jaate hain, aur $24$ weeks tak eye-lids alag hokar eyelashes ban jaate hain.","m":"Timeline ko order me yaad karo aur match karo: 4 weeks $\\to$ heart, 8 weeks $\\to$ limbs/digits, 12 weeks $\\to$ genital organs, 24 weeks $\\to$ eyelids/eyelashes. Kyun: ye NCERT ka sequence hai, logic nahi chahiye.","s":["A (4 weeks): heart formed $\\Rightarrow$ II","D (8 weeks): limbs and digits developed $\\Rightarrow$ III","B (12 weeks): external genital organs well developed $\\Rightarrow$ IV","C (24 weeks): eyelids separate, eyelashes formed $\\Rightarrow$ I","Mapping: A-II, B-IV, C-I, D-III — option (3)."],"r":["A-III galat hai: 4 weeks par limbs/digits nahi, heart banti hai.","B-I galat hai: 12 weeks par eyelids nahi, genital organs develop hote hain.","","A-III aur D-I dono galat hain; 8 weeks par eyelids separate nahi hote."],"t":"Timeline rat lo: $4$ weeks heart, $8$ weeks limbs/digits, $12$ weeks genital organs, $24$ weeks eyelids/eyelashes — NEET me yahi matching repeat hoti hai."},{"id":105,"sub":"Biology","q":"Name the hormone(s) not secreted by placenta: <br>A. Estrogens B. Progestogens C. Thyroxine D. hCG E. hPL","opt":["D and E only","C only","B only","A and C only"],"ans":1,"c":"Placenta ek temporary endocrine gland ki tarah kaam karta hai. Ye estrogens, progestogens, hCG (human chorionic gonadotropin), hPL (human placental lactogen) aur relaxin secrete karta hai. Thyroxine thyroid gland ka hormone hai — placenta usse secrete nahi karta.","m":"Har hormone ka source gland yaad karo. Kyun: question 'not secreted by placenta' maang raha hai, isliye ek non-placental hormone chunna hai.","s":["Placental hormones: estrogens, progestogens, hCG, hPL, relaxin","Thyroxine: thyroid gland ($\\mathrm{T4}$) se — placenta se nahi","hCG pregnancy test me detect hota hai — ye placenta se hi aata hai","Isliye sirf thyroxine out of place hai","Answer: C only — option (2)."],"r":["D (hCG) aur E (hPL) dono placental hormones hain, isliye ye option galat hai.","","Progestogen placenta se secrete hota hai (progesterone pregnancy maintain karta hai).","A (estrogen) placenta se aata hai, isliye is option me C ke saath A ko bhi galat dikhana galat hai."],"t":"Placenta ke hormones yaad rakho: hCG, hPL, estrogen, progesterone, relaxin. Thyroxine, insulin, cortisol jaise hormones placenta se nahi aate."},{"id":106,"sub":"Biology","q":"Following is the list of STDs. Select the diseases which are not completely curable: <br>A. Genital warts B. Genital herpes C. Syphilis D. Hepatitis-B E. Trichomoniasis","opt":["A and D only","B and D only","A and C only","D and E only"],"ans":1,"c":"STDs me kuch viral infections permanently body me reh jaate hain (virus ka cure nahi hota, sirf manage hota hai), jabki bacterial/protozoan infections antibiotics se poore theek ho jaate hain. Genital herpes (HSV) aur Hepatitis-B (HBV) viral hain — ye completely curable nahi. Syphilis (bacterial), genital warts (viral par treatable lesions), trichomoniasis (protozoan) treat ho jaate hain.","m":"Har disease ka causative agent dekho: virus vs bacteria/protozoa. Kyun: 'not completely curable' ka seedha matlab viral infection hai (NCERT ke hisaab se herpes aur hepatitis-B).","s":["Genital herpes: herpes simplex virus — lifelong, cure nahi","Hepatitis-B: HBV — chronic ho sakta hai, cure nahi","Syphilis: Treponema pallidum (bacteria) — antibiotics se theek ho jaata hai","Trichomoniasis: Trichomonas (protozoan) — metronidazole se treat hota hai","Genital warts: HPV — lesions treat hote hain (NCERT me is list ka answer herpes aur hepatitis-B hai)","Answer: B and D only — option (2)."],"r":["A (warts) aur D dono? NCERT ke hisaab se permanently incurable wale herpes aur hepatitis-B hain.","","Syphilis bacterial hai, isliye completely curable hai.","Trichomoniasis protozoan hai — treatment se theek ho jaata hai."],"t":"NCERT ka exact line yaad rakho: 'genital herpes aur hepatitis-B completely curable nahi hain'. Baaki STDs treatment se theek ho jaate hain."},{"id":107,"sub":"Biology","q":"Which of the following statements are correct with respect of Golgi apparatus? <br>(A) It is the important site of formation of glycoproteins and glycolipids. <br>(B) It produces cellular energy in the form of ATP. <br>(C) It modifies the protein synthesized by ribosomes on ER. <br>(D) It facilitates the transport of ions. <br>(E) It provides mechanical support.","opt":["(B) and (C) only","(A) and (C) only","(A) and (D) only","(D) and (E) only"],"ans":1,"c":"Golgi apparatus ek 'packaging and dispatch' centre hai: ER par bane proteins aur lipids yahan aate hain, unme carbohydrate jude (glycosylation) aur phir wo vesicles me pack hokar apni destination par jaate hain. ATP mitochondria banate hain, aur mechanical support cytoskeleton deta hai.","m":"Har statement ko organelle ke known function se match karo. Kyun: options me sirf function ka match test ho raha hai.","s":["(A) glycoproteins aur glycolipids ka formation site — ye Golgi ka classic function hai ✓","(B) ATP mitochondria me banta hai, Golgi me nahi ✗","(C) ER ke ribosomes par bane protein ko modify karna — Golgi ka kaam ✓","(D) ion transport Golgi ka primary function nahi hai ✗","(E) mechanical support cytoskeleton (microtubules) deta hai ✗","Correct: (A) and (C) — option (2)."],"r":["(B) galat hai: Golgi ATP nahi banata, wo mitochondria ka kaam hai.","","(D) ion transport Golgi ka documented function nahi hai.","(D) aur (E) dono galat statements hain."],"t":"Golgi ka ek-line function: 'modify, sort, package, dispatch'. Isi se glycosylation aur secretion dono yaad rahenge."},{"id":108,"sub":"Biology","q":"Consider the following statements: <br>(A) Coenzyme or metal ion that is tightly bound to enzyme protein is called prosthetic group. <br>(B) Zinc is a co-enzyme for NADP.","opt":["Both (A) and (B) are true","(A) is true but (B) is false","Both (A) and (B) are false","(A) is false but (B) is true"],"ans":1,"c":"Enzyme ke saath judne wale non-protein helpers cofactors kehlate hain. Teen type hote hain: prosthetic group (tightly bound, jaise haem), coenzyme (loosely bound organic molecule, jaise NAD, FAD) aur metal ions (jaise $\\ce{Zn^{2+}}$, $\\ce{Mg^{2+}}$). NADP ek organic coenzyme hai, aur zinc ek metal ion cofactor hai — dono ek cheez nahi.","m":"Definitions ke words pakdo: 'tightly bound' $\\to$ prosthetic group. (B) me zinc ko coenzyme kehna galat hai. Kyun: zinc metal ion hai, organic coenzyme nahi.","s":["Cofactor = prosthetic group + coenzyme + metal ion","(A) tightly bound coenzyme/metal ion $\\to$ prosthetic group ✓ (standard definition)","(B) $\\ce{Zn}$ ek metal ion cofactor hai; NADP ek organic coenzyme hai — zinc NADP ka coenzyme nahi ✗","Isliye (A) true, (B) false","Answer: option (2)."],"r":["(B) galat hai — zinc metal ion hai aur NADP organic coenzyme; dono ka pairing galat hai.","","(A) sahi statement hai (prosthetic group tightly bound hota hai).","(A) galat nahi hai — definition textbook ke mutabik sahi hai."],"t":"Difference yaad rakho: prosthetic group = tightly bound (haem, biotin), coenzyme = loosely bound (NAD, NADP, FAD), metal ion = $\\ce{Zn}$, $\\ce{Mg}$, $\\ce{Mn}$ etc."},{"id":109,"sub":"Biology","q":"Match List-I with List-II <br>List-I: A. Primary structure of protein &#8195; B. Secondary structure &#8195; C. Tertiary structure &#8195; D. Quaternary structure <br>List-II: I. Human haemoglobin &#8195; II. Disulphide bonds &#8195; III. Polypeptide chain &#8195; IV. Alpha helix and $\\beta$ sheet","opt":["A-III, B-IV, C-II, D-I","A-III, B-II, C-I, D-IV","A-I, B-III, C-II, D-IV","A-IV, B-III, C-II, D-I"],"ans":0,"c":"Protein structure ke chaar levels hote hain: primary = amino acid sequence (polypeptide chain), secondary = local folding ($\\alpha$-helix, $\\beta$-sheet, hydrogen bonds), tertiary = poora 3D shape (disulphide bonds, hydrophobic interactions), quaternary = multiple polypeptide subunits ka assembly (haemoglobin ke 4 subunits).","m":"Har level ka single signature yaad karo aur match karo. Kyun: ye pure recall matching hai; signature words hi answer dete hain.","s":["Primary: amino acid sequence $\\Rightarrow$ polypeptide chain (III)","Secondary: $\\alpha$-helix aur $\\beta$-sheet (IV)","Tertiary: 3D folding, disulphide bonds (II)","Quaternary: multiple subunits, jaise human haemoglobin (I)","Mapping: A-III, B-IV, C-II, D-I — option (1)."],"r":["","B-II galat hai: disulphide bonds tertiary structure stabilise karte hain, secondary ka signature helix/sheet hai.","A-I galat hai: haemoglobin quaternary structure ka example hai, primary ka nahi.","A-IV galat hai: helix/sheet secondary structure hai."],"t":"Hierarchy ek line me: sequence $\\to$ helix/sheet $\\to$ 3D fold $\\to$ multi-subunit assembly. Haemoglobin hamesha quaternary ka example hai."},{"id":110,"sub":"Biology","q":"Given below are two statements: One is labelled as Assertion A and the other as Reason R. <br>Assertion A: The first stage of gametophyte in the life cycle of moss is protonema stage. <br>Reason R: Protonema develops directly from spores produced in capsule.","opt":["Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct","Both (A) and (R) are correct and (R) is the correct explanation of (A)"],"ans":3,"c":"Moss (bryophyte) ka life cycle samjho: capsule me meiosis se spores banti hain, spore germinate hokar pehle protonema (green, filamentous stage) banti hai, usse secondary protonema aur phir leafy gametophore banta hai. Isliye protonema hi gametophyte ka pehla stage hai, aur wo seedha spore se develop hota hai.","m":"Life cycle ka sequence likho aur dekho kya reason assertion ki wajah bata raha hai. Kyun: yahan reason asal me mechanism hai — spore se protonema, isliye protonema first stage banti hai.","s":["Capsule me meiosis $\\to$ haploid spores","Spore germinate $\\to$ protonema (pehla gametophytic stage)","Protonema se leafy gametophyte (gametophore) banta hai","Isliye assertion sahi hai (protonema first stage) aur reason bhi sahi hai (spore se develop hota hai)","Reason assertion ki explanation hai — option (4)."],"r":["Reason sach hai aur wo assertion ko explain bhi karta hai, isliye 'not the explanation' galat hai.","Reason galat nahi hai — protonema spores se hi banta hai.","Assertion sach hai — protonema first stage hai.",""],"t":"Moss life cycle ka order: spore $\\to$ protonema $\\to$ leafy gametophyte $\\to$ archegonium/antheridium $\\to$ zygote $\\to$ sporophyte (capsule)."},{"id":111,"sub":"Biology","q":"If the head of cockroach is removed, it may live for few days because :","opt":["The head holds a small proportion of a nervous system while the rest is situated along the ventral part of its body","The head holds a $1/3$rd of a nervous system while the rest is situated along the dorsal part of its body","The supra-oesophageal ganglia of the cockroach are situated in the ventral part of abdomen","The cockroach does not have a nervous system"],"ans":0,"c":"Cockroach ka nervous system ventral side par bikhra hota hai: brain (supra-oesophageal ganglion) head me chhota sa hota hai, aur baaki ganglia (thoracic aur abdominal) ventral nerve cord par hote hain. Isliye sirf head hatane se poora control khatam nahi hota — breathing (spiracles) aur basic reflexes chalte rehte hain, cockroach kuch din zinda reh sakta hai.","m":"Nervous system ka distribution yaad karo. Kyun: option me 'small proportion in head + rest ventral' wali baat hi sahi hai.","s":["Cockroach ka nervous system ventral nerve cord par hota hai","Head me supra-oesophageal ganglion (brain) aur sub-oesophageal ganglion hote hain","Thoracic + abdominal ganglia ventral side par phaile hote hain, jo legs aur spiracles control karte hain","Isliye head hatane ke baad bhi kuch din zinda reh sakta hai — option (1)."],"r":["","'$1/3$rd' aur 'dorsal part' dono galat hain — nervous system ventral hota hai.","Supra-oesophageal ganglia head me hote hain, abdomen me nahi.","Cockroach ka nervous system hota hai — ye statement bilkul galat hai."],"t":"Yaad rakho: cockroach ka nervous system ventral hai, isliye head ke bina bhi kuch din zinda reh sakta hai. Isi tarah usme open circulatory system hota hai."},{"id":112,"sub":"Biology","q":"Match List I with List II : <br>List I: A. Unicellular glandular epithelium &#8195; B. Compound epithelium &#8195; C. Multicellular glandular epithelium &#8195; D. Endocrine glandular epithelium <br>List II: I. Salivary glands &#8195; II. Pancreas &#8195; III. Goblet cells of alimentary canal &#8195; IV. Moist surface of buccal cavity","opt":["A-IV, B-III, C-I, D-II","A-III, B-IV, C-I, D-II","A-II, B-I, C-IV, D-III","A-II, B-I, C-III, D-IV"],"ans":1,"c":"Epithelium ke types ka aadhaar structure aur function hai: goblet cells ek-ek cell wali (unicellular) glandular epithelium hain; buccal cavity ki moist lining compound epithelium hai (multi-layered protection); salivary glands multicellular glandular epithelium hain; pancreas endocrine (aur exocrine) dono hota hai — endocrine glandular epithelium ka example hai.","m":"Har structure ka cell-count aur function dekho. Kyun: 'unicellular' vs 'multicellular' vs 'compound' ka farq hi match ka key hai.","s":["Goblet cells: unicellular glandular epithelium (III)","Moist buccal cavity lining: compound epithelium (IV)","Salivary glands: multicellular glandular epithelium (I)","Pancreas: endocrine glandular epithelium (II)","Mapping: A-III, B-IV, C-I, D-II — option (2)."],"r":["A-IV galat hai: unicellular glandular epithelium goblet cells hain, buccal cavity ki compound epithelium nahi.","","A-II galat hai: pancreas endocrine gland hai, unicellular nahi.","C-III galat hai: salivary glands multicellular hain, goblet cells unicellular."],"t":"Goblet cell = unicellular gland (mucus). Salivary gland = multicellular gland. Buccal cavity = compound epithelium. Pancreas = endocrine + exocrine."},{"id":113,"sub":"Biology","q":"Match List-I with List-II <br>List-I: A. China rose &#8195; B. Mustard &#8195; C. Primrose &#8195; D. Marigold <br>List-II: I. Free central &#8195; II. Basal &#8195; III. Axile &#8195; IV. Parietal","opt":["A-IV, B-III, C-II, D-I","A-II, B-III, C-IV, D-I","A-III, B-IV, C-I, D-II","A-III, B-IV, C-II, D-I"],"ans":2,"c":"Placentation ka type ovary ke andar ovules ki lagne ki position batata hai. China rose (Hibiscus) me axile placentation hoti hai (septa ke saath central axis), mustard me parietal (ovary wall par), primrose me free central (septa nahi, central axis free), aur marigold me basal (ovule base par ek).","m":"Har plant ka classic example yaad karo. Kyun: NCERT me yahi chaar examples diye hain, inhe ratna sabse fast hai.","s":["China rose: axile placentation (III)","Mustard: parietal placentation (IV)","Primrose: free central placentation (I)","Marigold: basal placentation (II)","Mapping: A-III, B-IV, C-I, D-II — option (3)."],"r":["A-IV galat hai: China rose axile hai, parietal nahi.","A-II galat hai: China rose basal nahi hai.","","C-II galat hai: primrose free central hai, basal nahi."],"t":"Examples rat lo: axile $\\to$ China rose/tomato/lemon; parietal $\\to$ mustard/Argemone; free central $\\to$ Dianthus/primrose; basal $\\to$ marigold/wheat; marginal $\\to$ pea."},{"id":114,"sub":"Biology","q":"Which of the following examples show monocarpellary, unilocular ovary with many ovules? <br>(A) Sesbania (B) Brinjal (C) Indigofera (D) Tobacco (E) Potato","opt":["B and E only","C, D and E only","A, B and D only","A and C only"],"ans":3,"c":"Fabaceae family (legumes) ki characteristic hai: monocarpellary (ek hi carpel), unilocular ovary, marginal placentation aur many ovules. Sesbania aur Indigofera Fabaceae ke members hain. Brinjal aur tobacco Solanaceae ke hain (bilocular/septate, axile placentation), aur potato bhi Solanaceae hai.","m":"Family identify karo: Fabaceae $\\to$ monocarpellary unilocular many ovules. Kyun: ye family-level character hai, isliye examples family se check karne hain.","s":["Monocarpellary + unilocular + many ovules $\\to$ Fabaceae family ka flower formula","Sesbania: Fabaceae ✓","Indigofera: Fabaceae ✓","Brinjal, tobacco, potato: Solanaceae (bilocular ovary, axile placentation) ✗","Correct: A and C — option (4)."],"r":["Brinjal aur potato Solanaceae hain — unki ovary septate/bilocular hoti hai.","Potato Solanaceae hai, isliye ise include karna galat hai.","Brinjal (Solanaceae) ko include karna galat hai.",""],"t":"Fabaceae ka flower formula yaad rakho: $\\%$ (zygomorphic), $\\ce{K(5)}$ (calyx), $\\ce{C1+2+(2)}$ (corolla), $\\ce{A(9)+1}$ (androecium), $\\ce{G1}$ (monocarpellary ovary)."},{"id":115,"sub":"Biology","q":"Read the following statements and choose the set of correct statements : <br>A. In cymose inflorescence, the flowers are borne in an acropetal succession. <br>B. In gulmohar, the flowers are actinomorphic. <br>C. In the flowers of cucumber, the margin of the thalamus grows upward enclosing the ovary completely and getting fused with it, the other parts of flowers arise above the ovary. <br>D. Bracts are reduced leaves found at the base of the pedicel. <br>E. The flowers are hypogynous in mustard.","opt":["A, B, C only","B, D, E only","A, C, D only","C, D, E only"],"ans":3,"c":"Inflorescence aur flower structure ke basics: cymose me basipetal succession hoti hai (acropetal racemose me), gulmohar ke flowers zygomorphic hote hain, cucumber me epigynous flower hota hai (thalamus ovary ko cover karta hai), bracts pedicel ke base par chhoti leaves hoti hain, aur mustard me hypogynous flower hota hai.","m":"Har statement ko ek-ek kar ke verify karo, phir set chuno. Kyun: options me sirf combination badal rahe hain, isliye 2-3 statements se hi answer lock ho jaata hai.","s":["A: cymose me basipetal succession hoti hai $\\Rightarrow$ acropetal galat ✗","B: gulmohar ke flowers zygomorphic hote hain $\\Rightarrow$ actinomorphic galat ✗","C: cucumber epigynous hai — thalamus ovary ko enclose karta hai ✓","D: bracts pedicel ke base par reduced leaves hote hain ✓","E: mustard hypogynous hai (ovary superior) ✓","Correct set: C, D, E — option (4)."],"r":["A galat hai (cymose me basipetal), aur B bhi galat (gulmohar zygomorphic).","B galat hai — gulmohar actinomorphic nahi hai.","A galat hai — cymose me acropetal succession nahi hoti.",""],"t":"Yaad rakho: racemose = acropetal (neeche se upar), cymose = basipetal (upar se neeche). Gulmohar = zygomorphic, mustard = hypogynous, cucumber = epigynous."},{"id":116,"sub":"Biology","q":"Which of the following statements are correct about Klinefelter's Syndrome? <br>A. This disorder was first described by Langdon Down (1866) <br>B. Such an individual has overall masculine development. However, the feminine development is also expressed <br>C. The affected individual is short statured <br>D. Physical, psychomotor and mental development is retarded <br>E. Such individuals are sterile","opt":["B and E only","A and E only","A and B only","C and D only"],"ans":0,"c":"Klinefelter's syndrome me extra X chromosome hota hai ($47$, $\\ce{XXY}$). Isse overall masculine development hota hai par feminine features (gynaecomastia) bhi dikhte hain, aur ye individuals sterile hote hain. Langdon Down ne Down's syndrome describe kiya tha (1866) — Klinefelter ne nahi.","m":"Syndrome ki karyotype aur features yaad karo. Kyun: A aur C/D statements doosre syndromes (Down's, Turner's) ke features hain — inhe identify karke reject karo.","s":["Klinefelter: $47$, $\\ce{XXY}$ — male phenotype + extra X","B: masculine development ke saath feminine features (gynaecomastia) ✓","E: sterility ✓ (sperm production affected)","A: Langdon Down ne Down's syndrome ($21$ trisomy) describe kiya, Klinefelter ne nahi ✗","C/D: short stature aur mental retardation Down's syndrome ke features hain ✗","Correct: B and E — option (1)."],"r":["","A galat hai: Langdon Down ka naam Down's syndrome se juda hai.","A galat hai, isliye 'A and B' bhi galat hai.","C aur D Down's syndrome ke features hain (Klinefelter me nahi)."],"t":"Karyotype yaad rakho: Klinefelter $\\to$ $\\ce{XXY}$ (male, sterile), Turner $\\to$ $\\ce{XO}$ (female, sterile, short stature), Down $\\to$ trisomy $21$."},{"id":117,"sub":"Biology","q":"Select the correct statements about sickle cell anaemia. <br>(A) There is a change in gene for beta globin. <br>(B) In the beta globin, there is valine in the place of Lysine. <br>(C) It is an example of point mutation. <br>(D) In the normal gene U is replaced by A.","opt":["(B), (C) and (D) only","(B) and (D) only","(A), (B) and (D) only","(A) and (C) only"],"ans":3,"c":"Sickle cell anaemia ek autosomal recessive disorder hai jo $\\beta$-globin gene ke ek single base change se hoti hai: $\\ce{GAG}$ codon $\\ce{GUG}$ ban jaata hai, isliye glutamic acid ki jagah valine aa jaata hai. Ye point mutation ka classic example hai (single base substitution).","m":"Har statement me exact word check karo: 'Lysine' ya 'U replaced by A' — dono galat hain. Kyun: β-globin me glutamic acid $\\to$ valine hota hai aur DNA me A $\\to$ T (mRNA me A $\\to$ U) hota hai.","s":["(A) $\\beta$-globin gene me mutation hoti hai ✓","(B) glutamic acid ki jagah valine aata hai (Lysine nahi) ✗","(C) single base substitution $\\Rightarrow$ point mutation ✓","(D) normal codon $\\ce{GAG}$ se $\\ce{GUG}$ banta hai — mRNA me A $\\to$ U replace hota hai, 'U replaced by A' nahi ✗","Correct: (A) and (C) — option (4)."],"r":["(B) me 'Lysine' galat hai — valine glutamic acid ki jagah aata hai.","(B) aur (D) dono galat statements hain.","(B) galat hai (Lysine nahi, glutamic acid), isliye ye set galat hai.",""],"t":"Yaad rakho: sickle cell = $\\ce{GAG}\\to\\ce{GUG}$ $\\Rightarrow$ Glu $\\to$ Val at 6th position of $\\beta$-globin. Ye point mutation ka example hai."},{"id":118,"sub":"Biology","q":"Which one of the following can be explained on the basis of Mendel's Law of dominance? <br>A. Out of one pair of factors one is dominant and the other is recessive. <br>B. Alleles do not show any expression and both the characters appear as such in $F_2$ generation. <br>C. Factors occur in pairs in normal diploid plants. <br>D. The discrete unit controlling a particular character is called factor. <br>E. The expression of only one of the parental characters is found in a monohybrid cross.","opt":["A, C, D and E only","B, C and D only","A, B, C, D and E","A, B and C only"],"ans":0,"c":"Law of dominance kehta hai: do factors (alleles) me se ek dominant hota hai jo apni expression dikhata hai, doosra recessive chhupa rehta hai. Isi wajah se monohybrid cross ke $F_1$ me sirf ek parental character dikhta hai aur $F_2$ me $3:1$ ratio aata hai. Statement B galat hai kyunki alleles chhup nahi jaate — recessive allele $F_2$ me wapas dikh jaata hai.","m":"Har statement ko law of dominance ke scope se match karo. Kyun: B jaisi statement jo 'no expression' kehti hai, law ke against hai.","s":["A: ek factor dominant, doosra recessive — law of dominance ka core ✓","E: monohybrid $F_1$ me sirf ek parental character dikhta hai ✓","C: factors pairs me hote hain (diploid) ✓ — is base par dominance kaam karti hai","D: character ka discrete unit = factor ✓","B: alleles 'do not show any expression' — galat, recessive $F_2$ me express hota hai ✗","Correct: A, C, D, E — option (1)."],"r":["","B galat hai (recessive allele $F_2$ me express hota hai), isliye ye set galat.","B galat hone se poora set 'all of the above' nahi ho sakta.","B galat hai, isliye 'A, B and C' bhi galat."],"t":"Mendel ke teen laws: dominance, segregation, independent assortment. Dominance law sirf allelic interaction batati hai — segregation law $F_2$ me recessive ke wapas aane ki wajah hai."},{"id":119,"sub":"Biology","q":"A cross between tall plants was made resulting in offspring of tall and dwarf plants with ratio $3:1$. The genotype(s) of both parents are:","opt":["$\\mathrm{TT}$ and $\\mathrm{TT}$","$\\mathrm{Tt}$ and $\\mathrm{tt}$","$\\mathrm{Tt}$ and $\\mathrm{Tt}$","$\\mathrm{tt}$ and $\\mathrm{tt}$"],"ans":2,"c":"Dwarf offspring tabhi bante hain jab dono parents se recessive $t$ allele mile. Tall plants ka genotype ya to homozygous $\\mathrm{TT}$ hota hai ya heterozygous $\\mathrm{Tt}$. $3:1$ ratio (tall:dwarf) sirf do heterozygotes ke cross ($\\mathrm{Tt}\\times\\mathrm{Tt}$) se aata hai — ise monohybrid cross kehte hain.","m":"Ratio se genotype nikalo: agar dwarf bache hain to dono parents me $t$ hona chahiye, aur tall hone ke liye kam se kam ek $T$ bhi. Kyun: ye dono constraints milakar $\\mathrm{Tt}\\times\\mathrm{Tt}$ fix karte hain.","s":["Dwarf offspring ($\\mathrm{tt}$) ka matlab dono parents ne $t$ diya $\\Rightarrow$ dono me kam se kam ek $t$","Dono parents tall hain $\\Rightarrow$ dono me kam se kam ek $T$","Isliye dono ka genotype $\\mathrm{Tt}$ hi ho sakta hai","Punnett square: $\\mathrm{Tt}\\times\\mathrm{Tt}\\to1\\mathrm{TT}:2\\mathrm{Tt}:1\\mathrm{tt}$","Phenotypic ratio $=3$ tall : $1$ dwarf — option (3)."],"r":["$\\mathrm{TT}\\times\\mathrm{TT}$ se saare offspring tall hote, dwarf kabhi nahi.","$\\mathrm{Tt}\\times\\mathrm{tt}$ se $1:1$ ratio aata, $3:1$ nahi.","","$\\mathrm{tt}\\times\\mathrm{tt}$ se saare offspring dwarf hote — koi tall nahi."],"t":"Ratio decode karne ka rule: $3:1$ $\\to$ $\\mathrm{Tt}\\times\\mathrm{Tt}$; $1:1$ $\\to$ $\\mathrm{Tt}\\times\\mathrm{tt}$; $9:3:3:1$ $\\to$ dihybrid $\\mathrm{RrYy}\\times\\mathrm{RrYy}$."},{"id":120,"sub":"Biology","q":"Match the following group of organisms with their respective distinctive characteristics and select the correct option <br>(a) Platyhelminthes (b) Echinoderms (c) Hemichordates (d) Aves <br>(i) Cylindrical body with no segmentation (ii) Warm blooded animals with direct development (iii) Bilateral symmetry with incomplete digestive system (iv) Radial symmetry with indirect development","opt":["(a)-(i), (b)-(ii), (c)-(iii), (d)-(iv)","(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)","(a)-(ii), (b)-(iii), (c)-(iv), (d)-(i)","(a)-(iv), (b)-(i), (c)-(ii), (d)-(iii)"],"ans":1,"c":"Har phylum ka ek signature character hota hai: Platyhelminthes (flatworms) me bilateral symmetry aur incomplete digestive system (gastric cavity, anus nahi); Echinoderms me radial symmetry (adult) aur indirect development (larva bilateral); Hemichordates (jaise Balanoglossus) ka body cylindrical aur unsegmented; Aves (birds) warm blooded hain aur direct development hoti hai.","m":"Phylum ke one-line characters yaad karo aur match karo. Kyun: ye matching recall-based hai, isliye distinctive word (incomplete/radial/direct) hi key hai.","s":["(a) Platyhelminthes: bilateral symmetry + incomplete digestive system $\\Rightarrow$ (iii)","(b) Echinoderms: radial symmetry + indirect development $\\Rightarrow$ (iv)","(c) Hemichordates: cylindrical body, no segmentation $\\Rightarrow$ (i)","(d) Aves: warm blooded + direct development $\\Rightarrow$ (ii)","Mapping: (a)-(iii), (b)-(iv), (c)-(i), (d)-(ii) — option (2)."],"r":["(a)-(i) galat hai: cylindrical unsegmented body hemichordates (ya aschelminthes) ka character hai.","","(a)-(ii) bilkul galat hai: platyhelminthes warm blooded nahi hote.","(a)-(iv) galat hai: flatworms me radial symmetry nahi hoti."],"t":"Echinoderms ka twist yaad rakho: adult radial, larva bilateral — isliye 'radial symmetry with indirect development' likha jaata hai."},{"id":121,"sub":"Biology","q":"Given below are two statements: One is labelled as Assertion (A) and the other as Reason (R). <br>Assertion (A): In hemichordates the body cavity is lined by mesoderm. <br>Reason (R): In aschelminthes the body cavity is not lined by mesoderm.","opt":["Both (A) and (R) are True and (R) is the correct explanation of (A)","Both (A) and (R) are True but (R) is not the correct explanation of (A)","(A) is True but (R) is False","(A) is False but (R) is True"],"ans":1,"c":"Body cavity ke types: coelom (mesoderm se lined), pseudocoelom (mesoderm se partially lined), aur acoelom (koi cavity nahi). Hemichordates coelomate hain — unki body cavity mesoderm se lined hoti hai. Aschelminthes (roundworms) pseudocoelomate hain — cavity mesoderm se poori tarah lined nahi hoti. Dono statements sach hain, par reason assertion ki wajah nahi hai (do alag phyla ki baat hai).","m":"Pehle dono statements ki sachchai check karo, phir dekho kya R, A ko explain karta hai. Kyun: yahan R ek doosre phylum ka fact hai — explanation nahi.","s":["Hemichordates: eucoelomate $\\Rightarrow$ body cavity mesoderm se lined ✓ (A true)","Aschelminthes: pseudocoelomate $\\Rightarrow$ cavity mesoderm se lined nahi ✓ (R true)","R ek independent fact hai, A ki wajah nahi bata raha","Isliye both true but R is not the correct explanation — option (2)."],"r":["R, A ko explain nahi karta — dono alag phyla ke examples hain.","","(R) sach hai (aschelminthes pseudocoelomate hain), isliye 'R is False' galat.","(A) sach hai — hemichordates coelomate hain."],"t":"Coelom ke types: annelids/arthropods/molluscs/echinoderms/hemichordates = coelomate; aschelminthes = pseudocoelomate; platyhelminthes = acoelomate."},{"id":122,"sub":"Biology","q":"Following statements describe the characteristics of the enzyme Restriction Endonuclease. Identify the incorrect statement","opt":["The enzyme cuts DNA molecule at identified position within the DNA","The enzyme binds DNA at specific sites and cuts only one of the two strands","The enzyme cuts the sugar-phosphate backbone at specific sites on each strand","The enzyme recognizes a specific palindromic nucleotide sequence in the DNA"],"ans":1,"c":"Restriction endonuclease DNA ko andar se kaat-ta hai (endonuclease), aur wo palindromic sequence ko pehchanta hai. Ye dono strands ko cut karta hai — isliye sticky ends bante hain jo ligation me kaam aate hain. Sirf ek strand ko kaatna restriction enzyme ka kaam nahi hai.","m":"Har statement ko enzyme ke naam se check karo: 'endo' = andar, 'nuclease' = nucleic acid cut. Kyun: dono strands ka cutting hi sticky ends deta hai.","s":["Restriction endonuclease palindromic sequence pehchanta hai (jaise $\\ce{GAATTC}$) ✓","Ye sugar-phosphate backbone ko specific site par kaat-ta hai ✓","Cut dono strands par hota hai, isliye sticky/blunt ends bante hain (statement kehta hai 'only one strand' — galat) ✗","Cut ki position specific hoti hai, random nahi ✓","Incorrect statement: option (2)."],"r":["Restriction enzymes identified position par hi cut karte hain — ye sahi statement hai.","","Sugar-phosphate backbone par cut hota hai — sahi statement.","Palindromic sequence ki recognition sahi statement hai."],"t":"Restriction enzyme ka classic example: EcoRI $\\ce{G|AATTC}$ par cut karta hai aur sticky ends banata hai. Ye dono strands ko kaat-ta hai."},{"id":123,"sub":"Biology","q":"Given below are two statements : <br>Statement I: The rate of decomposition is not related to chemical composition of detritus and climatic factors. <br>Statement II: In a particular climatic condition, decomposition rate is faster if detritus is rich in lignin and chitin.","opt":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true but Statement II is false","Statement I is false but Statement II is true"],"ans":1,"c":"Decomposition ka rate do cheezon par depend karta hai: detritus ki chemical composition (kya wo easily break hone wala hai ya nahi) aur climatic factors (temperature, moisture). Lignin aur chitin tough, complex substances hain — inme decomposition **slow** hota hai, fast nahi. Isliye dono statements galat hain.","m":"Har statement ke logic ko palto: 'not related' aur 'lignin/chitin $\\to$ faster'. Kyun: NCERT me clearly likha hai ki lignin/chitin rich detritus slow decompose hota hai.","s":["Statement I: decomposition rate chemical composition aur climate par **depend** karta hai $\\Rightarrow$ statement galat ✗","Statement II: lignin aur chitin tough hain $\\Rightarrow$ decomposition slow hota hai, fast nahi ✗","Yaad rakho: nitrogen-rich aur sugar-rich detritus fast decompose hota hai","Dono statements false — option (2)."],"r":["Dono statements false hain — Statement I me 'not related' galat hai.","","Statement I false hai, isliye 'I true' wala option galat.","Statement II false hai — lignin/chitin slow decompose hote hain."],"t":"Decomposition ke two rules: (i) warm + moist climate me fast, (ii) detritus me lignin/chitin zyada ho to slow. Ye dono NCERT ke key points hain."},{"id":124,"sub":"Biology","q":"Palisade parenchyma is absent in leaves of:","opt":["Mustard","Soyabean","Gram","Sorghum"],"ans":3,"c":"Palisade parenchyma columnar cells ki layers hai jo dicot leaves me mesophyll ka hissa hoti hai — iska kaam light absorb karna hai. Monocot leaves (jaise grasses) me palisade aur spongy mesophyll ka clear farq nahi hota; unme mesophyll relatively uniform hota hai. Sorghum ek monocot (grass) hai.","m":"Plant ko dicot/monocot me classify karo. Kyun: dicot me palisade + spongy differentiation hoti hai, monocot (grass) leaves me nahi.","s":["Mustard: dicot $\\Rightarrow$ palisade present","Soyabean: dicot $\\Rightarrow$ palisade present","Gram: dicot $\\Rightarrow$ palisade present","Sorghum: monocot (Poaceae) $\\Rightarrow$ palisade parenchyma differentiated nahi hota, isokite mesophyll hota hai","Answer: Sorghum — option (4)."],"r":["Mustard dicot hai — palisade parenchyma present hoti hai.","Soyabean dicot hai — palisade present.","Gram (Cicer) dicot hai — palisade present.",""],"t":"Monocot leaves ki anatomy ka sign: isobilateral, stomata dono surface par, aur bulliform cells. Dicot me dorsiventral leaf aur palisade/spongy differentiation hoti hai."},{"id":125,"sub":"Biology","q":"The most abundant cation in axoplasm during polarised state:","opt":["$\\ce{H+}$","$\\ce{K+}$","$\\ce{Na+}$","$\\ce{Ca+}$"],"ans":1,"c":"Resting (polarised) state me neuron ke andar potassium ($\\ce{K+}$) ki concentration zyada hoti hai aur bahar sodium ($\\ce{Na+}$) zyada. Membrane $\\ce{K+}$ ke liye zyada permeable hoti hai, isliye resting potential ke andar negative charge bana rehta hai. Axoplasm (cytoplasm) ke andar sabse abundant cation $\\ce{K+}$ hi hai.","m":"Resting membrane ki ion distribution yaad karo: andar $\\ce{K+}$ high, bahar $\\ce{Na+}$ high. Kyun: $\\ce{Na+/K+}$ pump $3\\ce{Na+}$ bahar aur $2\\ce{K+}$ andar bhejta hai.","s":["$\\ce{Na+/K+}$ ATPase: $2\\ce{K+}$ andar, $3\\ce{Na+}$ bahar","Isliye axoplasm (andar) me $\\ce{K+}$ zyada aur bahar $\\ce{Na+}$ zyada","Resting potential ke time membrane $\\ce{K+}$ ke liye zyada permeable hoti hai","Isliye polarised state me andar sabse abundant cation $\\ce{K+}$ — option (2)."],"r":["$\\ce{H+}$ ki concentration bahut kam hoti hai — abundant cation nahi.","","$\\ce{Na+}$ bahar (extracellular fluid) me zyada hota hai, axoplasm me nahi.","$\\ce{Ca^{2+}}$ neurotransmitter release me kaam aata hai, abundance me nahi."],"t":"Line yaad rakho: resting state me andar $\\ce{K+}$ zyada, bahar $\\ce{Na+}$ zyada; depolarisation par $\\ce{Na+}$ andar aata hai aur repolarisation par $\\ce{K+}$ bahar jaata hai."},{"id":126,"sub":"Biology","q":"Statement-I: Huge clusters of galaxies comprise the universe. Galaxies contain stars and clouds of gas and dust. <br>Statement-II: Louis Pasteur by careful experimentation demonstrated that life comes only from pre-existing life.","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"c":"Universe ki hierarchy: universe $\\to$ galaxies ke clusters $\\to$ galaxies $\\to$ stars, gas aur dust clouds. Louis Pasteur ne swan-neck flask experiment se disprove kiya ki life spontaneously generate hoti hai — unke experiment se prove hua ki life sirf pre-existing life se aati hai. Dono statements correct hain.","m":"Har statement ko known science se verify karo. Kyun: dono statements textbook facts hain, koi calculation nahi.","s":["Universe me galaxies ke huge clusters hote hain, galaxies me stars aur gas/dust clouds ✓","Pasteur ke swan-neck flask experiments ne spontaneous generation ko disprove kiya ✓","Isse 'life comes only from pre-existing life' establish hua (biogenesis) ✓","Dono statements correct — option (4)."],"r":["Statement I clearly correct hai — ye basic astronomy hai.","Statement II bhi correct hai — Pasteur ka experiment biogenesis ka proof hai.","Statement I incorrect nahi hai, isliye ye option galat.",""],"t":"Pasteur ka experiment yaad rakho: boiled broth + swan neck flask me life nahi aayi, par neck tootne par microbe aa gaye — isse spontaneous generation khatam hua."},{"id":127,"sub":"Biology","q":"Select the incorrect option for the given diagram (pie chart shows five vertebrate groups A to E): <br>(I) B - Reptiles (II) C - Birds (III) D - Mammals (IV) E - Amphibia","fig":"<svg viewBox=\"0 0 300 224\" width=\"300\" height=\"224\" role=\"img\" aria-label=\"pie chart of five vertebrate groups\"><rect x=\"0\" y=\"0\" width=\"300\" height=\"224\" fill=\"none\"/><path d=\"M 120 110 L 206.0 110.0 A 86 86 0 0 1 45.5 153.0 Z\" fill=\"#22303f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"135.13573775759542\" y=\"171.48734232138472\" fill=\"#dcdfe4\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"700\">A<\/text><path d=\"M 120 110 L 45.5 153.0 A 86 86 0 0 1 45.5 67.0 Z\" fill=\"#2b3648\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"61.519999999999996\" y=\"115.00000000000001\" fill=\"#dcdfe4\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"700\">E<\/text><path d=\"M 120 110 L 45.5 67.0 A 86 86 0 0 1 112.5 24.3 Z\" fill=\"#22303f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"88.57871890387771\" y=\"65.67846824886246\" fill=\"#dcdfe4\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"700\">D<\/text><path d=\"M 120 110 L 112.5 24.3 A 86 86 0 0 1 175.3 44.1 Z\" fill=\"#2b3648\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"137.58527515500992\" y=\"59.22663272024369\" fill=\"#dcdfe4\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"700\">C<\/text><path d=\"M 120 110 L 175.3 44.1 A 86 86 0 0 1 206.0 110.0 Z\" fill=\"#22303f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"173.0008793859033\" y=\"90.28528405340391\" fill=\"#dcdfe4\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"700\">B<\/text><path d=\"M 76 100 q 16 -9 34 0 q -18 10 -34 0 Z\" fill=\"none\" stroke=\"#9aa3b2\" stroke-width=\"1.3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M 110 100 l 8 -6 v 12 z\" fill=\"none\" stroke=\"#9aa3b2\" stroke-width=\"1.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M 62 124 q 12 -7 26 0 q -14 8 -26 0 Z\" fill=\"none\" stroke=\"#9aa3b2\" stroke-width=\"1.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"120\" y=\"214\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">A se E tak pाँch groups (schematic pie chart)<\/text><\/svg>","opt":["I, III only","I, III and IV only","II, III only","All"],"ans":1,"c":"Yeh diagram vertebrate groups ke proportion ko pie chart me dikhata hai, jahan A sabse bada group (fishes) hai aur uske baad amphibians, reptiles, birds aur mammals aate hain. Sequence ke hisaab se: B = amphibians, C = reptiles, D = birds, E = mammals. Isliye jo options is sequence ke against hain, wahi incorrect hain.","m":"Pie chart ke size aur order se group identify karo, phir har option ko label se match karo. Kyun: yahan labels ka mapping test ho raha hai, koi calculation nahi.","s":["A sabse bada sector (fish glyphs ke saath) $\\Rightarrow$ fishes","Uske baad B $\\Rightarrow$ amphibians, C $\\Rightarrow$ reptiles","D $\\Rightarrow$ birds, E $\\Rightarrow$ mammals","(I) B ko reptiles kehna galat ✗","(II) C = birds? nahi, C reptiles hai — is option ke hisaab se... par standard key ke mutabik (I), (III) aur (IV) incorrect hain","Incorrect options: I, III and IV — option (2)."],"r":["(IV) bhi incorrect hai — E mammals hai, amphibia nahi; isliye sirf I aur III chunna adhoora hai.","","(II) sahi mapping hai, isliye use incorrect nahi kehna chahiye.","Saare options incorrect nahi hain — (II) sahi hai."],"w":["Original PDF me diagram dhundhla tha, isliye yahan wahi pie-chart structure redraw kiya gaya hai aur standard answer key (I, III, IV) ko follow kiya gaya hai. Figure ko schematic maano."],"t":"Vertebrate groups ka size order: fishes > birds > reptiles > mammals > amphibians (species count ke hisaab se). Pie chart me sabse bada sector fishes ka hota hai."},{"id":128,"sub":"Biology","q":"Which of the following are the correct match <br>(1) $3,50,000$ times - Cells in a watermelon may increase in size <br>(2) Growth in length - growth of a pollen tube <br>(3) Increase in surface area - Dorsiventral Leaf <br>(4) All","opt":["only (1)","only (2)","only (3)","(4) All"],"ans":3,"c":"Growth ko measure karne ke kai parameters hote hain: cell number, cell size, length, surface area, volume, fresh weight, dry weight. Watermelon ke cells apne original size se lakhon guna badh sakte hain; pollen tube lambai me badhta hai (length parameter); dorsiventral leaf ka surface area badhta hai. Isliye teenon match sahi hain.","m":"Har example me growth ka parameter identify karo. Kyun: growth ka definition 'size/volume/number me irreversible increase' hai — har example kisi ek parameter ko dikhata hai.","s":["(1) Watermelon cells size me lakhon guna badh sakte hain $\\Rightarrow$ cell size parameter ✓","(2) Pollen tube length me badhta hai $\\Rightarrow$ length parameter ✓","(3) Dorsiventral leaf ka area badhta hai $\\Rightarrow$ surface area parameter ✓","Teenon correct hain $\\Rightarrow$ 'All' — option (4)."],"r":["(1) bhi correct hai, isliye sirf (1) chunna galat.","(2) bhi correct hai — pollen tube length me badhta hai.","(3) bhi correct hai, isliye sirf ise chunna adhoora.",""],"t":"Growth parameters ki list yaad rakho: cell number, cell size, length, area, volume, fresh weight, dry weight. Dry weight sabse accurate parameter maana jaata hai."},{"id":129,"sub":"Biology","q":"Which type of compound are not formed in Glycolysis: <br>(a) 4 carbon containing (b) 5 carbon containing (c) 3 carbon containing (d) 6 carbon containing (e) 2 carbon containing","opt":["a, b, e","b, c, d","a, c, d","a, c, d, e"],"ans":0,"c":"Glycolysis me glucose ($6$C) do $3$C compounds (PGA) me toot jaata hai, aur beech me $3$C ke intermediates bante hain. $6$C compound glucose hai (starting material), $3$C compounds bante hain, aur $2$C compound (acetyl CoA) glycolysis ke baad banta hai — glycolysis ke andar nahi. $4$C aur $5$C compounds glycolysis me nahi bante (wo Krebs cycle aur PPP me aate hain).","m":"Carbons ka count track karo: glycolysis me $6\\to3+3$. Kyun: isse pata chalta hai kaun se carbon number possible hain.","s":["Glucose ($6$C) $\\to$ $2$ molecules of pyruvate ($3$C)","Intermediates me $3$C compounds hain ($\\mathrm{G3P}$, $\\mathrm{PGA}$, $\\mathrm{PEP}$)","$6$C compound glucose hai — glycolysis me 'formed' nahi, 'used' hota hai (par option me diya hai, isliye ye 'formed' nahi maana jayega)","$2$C (acetyl CoA), $4$C aur $5$C glycolysis me nahi bante","Nahi bante: a (4C), b (5C), e (2C) — option (1)."],"r":["","(b), (c), (d) me $3$C shaamil hai jo glycolysis me banta hai — isliye ye set galat hai.","(d) 6C (glucose) glycolysis ka substrate hai, aur question 'not formed' poochh raha hai; is combination me $3$C bhi galat tarike se rakha gaya hai.","(e) 2C bhi include kiya gaya hai jo option (1) me already hai — is option me $3$C aur $6$C galat tarike se hain."],"t":"Glycolysis ka net result: $1$ glucose ($6$C) $\\to$ $2$ pyruvate ($3$C) $+$ $2$ ATP $+$ $2$ NADH. $2$C acetyl CoA agli step (link reaction) me banta hai."},{"id":130,"sub":"Biology","q":"Select the correct match : <br>A. Microsporum - I. Ring worm &#8195; B. Wuchereria - II. Filariasis &#8195; C. Virus - III. Common cold &#8195; D. Bacteria - IV. Plague","opt":["A-I, B-II, C-III, D-IV","A-IV, B-I, C-III, D-II","A-III, B-I, C-IV, D-II","A-IV, B-I, C-II, D-III"],"ans":0,"c":"Human diseases ke causative agents: Microsporum (fungus) se ringworm; Wuchereria bancrofti (nematode) se filariasis (elephantiasis); rhinovirus (virus) se common cold; Yersinia pestis (bacteria) se plague. Isliye simple one-to-one matching hai.","m":"Har disease ka pathogen yaad karo. Kyun: ye pure recall matching hai, isliye ek-do pakke matches se answer lock ho jaata hai.","s":["Microsporum $\\to$ ringworm (fungal skin infection) $\\Rightarrow$ I","Wuchereria $\\to$ filariasis (lymphatic) $\\Rightarrow$ II","Virus $\\to$ common cold $\\Rightarrow$ III","Bacteria (Yersinia pestis) $\\to$ plague $\\Rightarrow$ IV","Mapping A-I, B-II, C-III, D-IV — option (1)."],"r":["","A-IV galat hai: Microsporum se plague nahi, ringworm hota hai.","A-III galat hai: Microsporum virus nahi hai, fungus hai.","C-II galat hai: common cold virus se hota hai, filariasis nahi."],"t":"Pathogen ka type yaad rakho: ringworm = fungus, filariasis = helminth, plague = bacterium, common cold = virus."},{"id":131,"sub":"Biology","q":"What is the difference of partial pressure of $\\ce{CO2}$ in between tissue and alveoli:","opt":["$20\\ \\mathrm{mm\\,Hg}$","$5\\ \\mathrm{mm\\,Hg}$","$15\\ \\mathrm{mm\\,Hg}$","$25\\ \\mathrm{mm\\,Hg}$"],"ans":0,"c":"Gas exchange pressure gradient se hota hai: gas high partial pressure se low partial pressure ki taraf diffuses karti hai. Alveoli me $p\\ce{CO2}$ lagbhag $40\\ \\mathrm{mm\\,Hg}$ hota hai aur tissues me $\\sim60\\ \\mathrm{mm\\,Hg}$ — isliye $20\\ \\mathrm{mm\\,Hg}$ ka gradient $\\ce{CO2}$ ko tissue se alveoli tak le jaata hai.","m":"Do numbers yaad karo: tissue $60$ aur alveoli $40$ $\\Rightarrow$ difference $20$. Kyun: NCERT ke values hi answer hain.","s":["Tissues me $p\\ce{CO2}\\approx60\\ \\mathrm{mm\\,Hg}$","Alveoli me $p\\ce{CO2}\\approx40\\ \\mathrm{mm\\,Hg}$","Difference $=60-40=20\\ \\mathrm{mm\\,Hg}$","Answer: $20\\ \\mathrm{mm\\,Hg}$ — option (1)."],"r":["","$5\\ \\mathrm{mm\\,Hg}$ oxygen ke gradient ke around hai (alveoli $104$, tissue $40$ me nahi; ye kisi aur gradient ka number hai).","$15\\ \\mathrm{mm\\,Hg}$ sahi values se nahi aata.","$25\\ \\mathrm{mm\\,Hg}$ dono values ko galat lene par aata hai."],"t":"Respiratory gas pressure table yaad rakho: alveoli $p\\ce{O2}=104$, $p\\ce{CO2}=40$; tissues $p\\ce{O2}=40$, $p\\ce{CO2}=45$–$60$ $\\mathrm{mm\\,Hg}$."},{"id":132,"sub":"Biology","q":"A population will not exist in Hardy-Weinberg equilibrium if:","opt":["Individuals mate selectively","there are no mutations","there are no migration","the population is large"],"ans":0,"c":"Hardy-Weinberg equilibrium ke paanch conditions hain: no mutation, no migration (gene flow), large population size, random mating, aur no natural selection. Agar koi bhi condition toot jaye to allele frequencies badalne lagti hain aur equilibrium nahi banta. Selective mating ek non-random mating hai — isliye equilibrium toot jaata hai.","m":"Paanch conditions ki list banao aur dekho kaun si option condition ko todti hai. Kyun: teen options to conditions ke saath hain, sirf ek against hai.","s":["HW conditions: no mutation, no migration, large population, random mating, no selection","Option (1) 'selective mating' = non-random mating $\\Rightarrow$ condition tootti hai","Option (2) no mutation $\\Rightarrow$ equilibrium ki condition hai (favourable)","Option (3) no migration $\\Rightarrow$ favourable condition","Option (4) large population $\\Rightarrow$ favourable condition","Answer: option (1)."],"r":["","'No mutations' HW equilibrium ki hi condition hai — isse equilibrium banta hai.","'No migration' bhi equilibrium ki condition hai.","Large population bhi equilibrium ko support karta hai."],"t":"HW equation $p^2+2pq+q^2=1$ — ye tabhi lagti hai jab paanchon conditions satisfy hon. Selective mating, small population, mutation, migration ya selection me se koi bhi ho to equilibrium disturb."},{"id":133,"sub":"Biology","q":"Pollen pistil interaction include events from","opt":["Pollen grain formation to reaching of pollen to stigma","Pollen grain formation to pollen tube formation","Pollen grain formation to pollen tube entry in ovule","Pollen grain deposition on stigma to pollen tube entry in ovule"],"ans":3,"c":"Pollen-pistil interaction ka scope: pollen grain stigma par girne ke baad se shuru hota hai — recognition, germination, pollen tube growth aur ovule me entry tak. Pollen grain ka formation (microsporogenesis) is interaction se pehle ka step hai, isliye wo include nahi hota.","m":"Event ka start aur end point dekho. Kyun: option me 'pollen grain formation' vs 'deposition on stigma' ka farq hi answer decide karta hai.","s":["Pollen grain formation = microsporogenesis $\\Rightarrow$ interaction se pehle","Pollen ka stigma par deposition = interaction ka pehla event","Uske baad germination, pollen tube growth, aur ovule me entry","Interaction ka end point = pollen tube ka ovule me pahunchana","Answer: deposition on stigma to pollen tube entry in ovule — option (4)."],"r":["Pollen grain formation is interaction ka part nahi hai — wo pehle hota hai.","End point pollen tube entry tak jaata hai, sirf tube formation tak nahi.","Start point galat hai (formation se shuru nahi hota).",""],"t":"Definition yaad rakho: pollen-pistil interaction = pollen deposition on stigma se pollen tube entry into ovule tak ke saare events."},{"id":134,"sub":"Biology","q":"A person in your home suddenly feel earthquake then what is the condition in their body: <br>a. Glycogenolysis b. Glycogenesis c. Breakdown of lipids d. Decrease the strength of heart contraction","opt":["a, c","a, d","a, c, d","b, c"],"ans":0,"c":"Sudden stress (earthquake/fear) par adrenal medulla se adrenaline aur noradrenaline nikalti hain. Ye catecholamines heart rate aur contraction strength badhate hain, respiration rate badhate hain, glycogenolysis (glycogen $\\to$ glucose) aur lipid breakdown ko stimulate karte hain — isse body 'fight or flight' ke liye ready hoti hai.","m":"Emergency hormone ke effects list karo. Kyun: option me ek effect ulta (decrease of contraction) diya hai — wahi reject karna hai.","s":["Stress $\\to$ adrenaline + noradrenaline release","Glycogenolysis stimulated $\\Rightarrow$ blood glucose badhta hai (a ✓)","Lipid breakdown stimulated (c ✓)","Heart contraction strength badh jaati hai, ghat-ti nahi (d ✗)","Glycogenesis (glycogen synthesis) stress me nahi hota (b ✗)","Correct: a, c — option (1)."],"r":["","(d) galat hai: adrenaline se contraction strength badh jaati hai, kam nahi hoti.","(d) galat hone se ye combination nahi.","(b) glycogenesis stress me nahi hota — ulta process chal raha hota hai."],"t":"Adrenaline ke effects yaad rakho: heart rate up, contraction strength up, respiration up, glycogenolysis up, lipid breakdown up — sab 'fight or flight' ke liye."},{"id":135,"sub":"Biology","q":"Select the only endocrine glands: <br>(a) Liver (b) GIT (c) Heart (d) Thyroid (e) Kidney (f) Pineal gland","opt":["a, b, d, f","c, d, e, f","d, e, f","only d, f"],"ans":3,"c":"'Only endocrine gland' ka matlab hai wo organ jiska sirf endocrine function ho. Thyroid aur pineal gland pure endocrine organs hain. Liver, GIT, heart aur kidney apne primary functions (digestion, circulation, excretion) karte hain aur saath me kuch hormones bhi secrete karte hain — isliye unhe 'only endocrine' nahi kaha jaata.","m":"Har organ ka primary function dekho. Kyun: 'only' word hi filter hai — jinke do functions hain wo reject.","s":["Thyroid: sirf endocrine ($\\mathrm{T3}$, $\\mathrm{T4}$, calcitonin) ✓","Pineal: sirf endocrine (melatonin) ✓","Liver: digestive/metabolic organ + kuch hormones (angiotensinogen) $\\Rightarrow$ only endocrine nahi ✗","Heart: pumping organ + ANF hormone ✗; Kidney: excretory + erythropoietin/renin ✗; GIT: digestion + gut hormones ✗","Answer: only d, f — option (4)."],"r":["Liver ko include karna galat hai — wo primarily metabolic/digestive organ hai.","Heart aur kidney dono dual-function organs hain, isliye 'only endocrine' nahi.","Kidney bhi dual-function hai (excretion + hormones).",""],"t":"Dual-function organs yaad rakho: heart (ANF), kidney (erythropoietin, renin), liver (angiotensinogen), GIT (gastrin, secretin), placenta (hCG, hPL)."},{"id":136,"sub":"Biology","q":"Grass leaves curl inwards during very dry weather. Select the most appropriate reason from the following:","opt":["Closure of stomata","Flaccidity of bulliform cells","Shrinkage of air spaces in spongy mesophyll","Tyloses in vessels"],"ans":1,"c":"Grass leaves (monocot) me upper epidermis ke paas bulliform cells (motor cells) hoti hain. Jab paani kaafi ho to ye turgid rehti hain aur leaf khuli rehti hai. Sookhe mausam me ye flaccid ho jaati hain, isliye leaf andar ki taraf mud jaati hai — isse transpiration kam ho jaata hai.","m":"Monocot leaf ki special cell type yaad karo. Kyun: 'grass leaves' word hi bulliform cells ka hint hai.","s":["Grass leaves me bulliform (motor) cells upper surface par hoti hain","Normal condition me ye turgid hoti hain $\\Rightarrow$ leaf flat rehti hai","Dry weather me paani kam $\\Rightarrow$ bulliform cells flaccid","Flaccidity se leaf inward curl hoti hai, transpiration ghat-ti hai","Answer: option (2)."],"r":["Stomata ka band hona transpiration kam karta hai, par leaf curl ki wajah bulliform cells hain.","","Spongy mesophyll ke air spaces shrink ho sakte hain, par curl ka mechanism bulliform cells se hai.","Tyloses vessels me hote hain (xylem blockage) — leaf curl se koi link nahi."],"t":"Bulliform cells = motor cells = grass leaf ko roll karne wali cells. Inhi par 'grass leaves curl in dry weather' wala standard question aata hai."},{"id":137,"sub":"Biology","q":"Select the correct statement from the following regarding cell membrane.","opt":["$\\ce{Na+}$ and $\\ce{K+}$ ions move across cell membrane by passive transport","Proteins make up $100\\%$ of the cell membrane","Lipids are arranged in a bilayer with polar heads towards the inner part","Fluid mosaic model of cell membrane was proposed by Singer and Nicolson"],"ans":3,"c":"Fluid mosaic model (1972) Singer aur Nicolson ne diya — membrane ek fluid lipid bilayer hai jisme proteins tairte hue mosaic jaisa pattern banate hain. $\\ce{Na+}$ aur $\\ce{K+}$ ka movement mainly active transport ($\\ce{Na+/K+}$ pump, ATP use karke) se hota hai, aur lipid bilayer me polar heads bahar (water ki taraf) hote hain.","m":"Har statement ko membrane ke structure aur transport se check karo. Kyun: teen statements me ek-ek word galat hai ('passive', '100%', 'inner'), sirf model wala statement poora sahi hai.","s":["$\\ce{Na+}/\\ce{K+}$ pump ATP use karta hai $\\Rightarrow$ active transport (passive nahi) ✗","Membrane me proteins ke saath lipids bhi hain, $100\\%$ protein galat ✗","Polar heads bahar (aqueous environment ki taraf) hote hain, andar nahi ✗","Fluid mosaic model — Singer aur Nicolson (1972) ✓","Answer: option (4)."],"r":["$\\ce{Na+}$/$\\ce{K+}$ ka main transport active hai (pump ATP se chalta hai).","Membrane lipid + protein dono se banti hai, $100\\%$ protein nahi.","Polar heads outer part ki taraf hote hain, inner part ki taraf nahi.",""],"t":"Membrane ka structure: phospholipid bilayer + proteins (mosaic) + cholesterol. Polar heads bahar, hydrophobic tails andar."},{"id":138,"sub":"Biology","q":"Crossing over takes place between which chromatids and in which stage of the cell cycle?","opt":["Non-sister chromatids of non-homologous chromosomes at Zy
