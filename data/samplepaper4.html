necap=\"round\"/><line x1=\"258\" y1=\"130\" x2=\"251\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"274\" y1=\"130\" x2=\"267\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"130\" x2=\"283\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"306\" y1=\"130\" x2=\"299\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"322\" y1=\"130\" x2=\"315\" y2=\"138\" stroke=\"#4b5568\" stroke-width=\"1\" stroke-linecap=\"round\"/><ellipse cx=\"180\" cy=\"112\" rx=\"86\" ry=\"18\" fill=\"none\" stroke=\"#7c9cff\" stroke-width=\"2\"/><ellipse cx=\"180\" cy=\"112\" rx=\"46\" ry=\"9\" fill=\"none\" stroke=\"#4b5568\" stroke-width=\"1.3\"/><path d=\"M 226 100 A 52 12 0 0 1 232 116\" fill=\"none\" stroke=\"#ffd479\" stroke-width=\"1.8\"/><polygon points=\"232,116 226,110 236,108\" fill=\"#ffd479\"/><text x=\"246\" y=\"104\" fill=\"#ffd479\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">ω<tspan baseline-shift=\"sub\" font-size=\"70%\"><\/tspan>(0)<\/text><text x=\"180\" y=\"158\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">rough surface, μ<\/text><line x1=\"96\" y1=\"112\" x2=\"78\" y2=\"112\" stroke=\"#e7908c\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"74\" y=\"116\" fill=\"#e7908c\" font-size=\"10\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">friction<\/text><\/svg>","opt":["$\\dfrac{\\omega_0\\mu R}{2g}$","$\\dfrac{2\\omega_0 R}{\\mu g}$","$\\dfrac{\\omega_0 R}{2\\mu g}$","$\\dfrac{\\omega_0 g}{2\\mu R}$"],"ans":2,"c":"Ring apni axis ke around ghum rahi hai (jaise coin table par). Surface ke saath friction har point par ghumav ka virodh karta hai, isliye torque lagta hai aur angular speed ghat-ti hai. Ring ka moment of inertia apni axis ke liye $I=mR^2$ hota hai (disc ke liye $\\frac12mR^2$ hota — ye farq yaad rakho).","m":"$\\tau=I\\alpha$ se angular retardation nikalo, phir $\\omega=\\omega_0-\\alpha t$ se time. Kyun: friction constant hai, isliye retardation bhi constant milta hai.","s":["Friction force $= \\mu mg$ (poora weight normal se balance hota hai)","Torque about centre: $\\tau=\\mu mg\\,R$","$I=mR^2$ (ring)","$\\alpha=\\dfrac{\\tau}{I}=\\dfrac{\\mu mgR}{mR^2}=\\dfrac{\\mu g}{R}$","$\\omega=\\omega_0-\\alpha t$; $\\omega=\\dfrac{\\omega_0}{2}$ par: $\\dfrac{\\omega_0}{2}=\\omega_0-\\dfrac{\\mu g}{R}t$","$t=\\dfrac{\\omega_0 R}{2\\mu g}$ — option (3)."],"r":["$\\dfrac{\\omega_0\\mu R}{2g}$ me dimensions hi galat hain (μ dimension-less hai, to unit match nahi karti).","$\\dfrac{2\\omega_0R}{\\mu g}$ me $\\frac12$ ka factor ulta ho gaya — $\\omega_0$ se $\\omega_0/2$ tak change ka matlab $\\alpha t=\\omega_0/2$.","","$\\dfrac{\\omega_0 g}{2\\mu R}$ me $g$ aur $R$ ki jagah badal gayi hai — dimension check se reject."],"t":"Ring $I=mR^2$, disc $I=\\frac12mR^2$, solid sphere $\\frac25mR^2$, hollow sphere $\\frac23mR^2$ — ye chaar values NEET ke rotation questions me repeat hoti hain."},{"id":29,"sub":"Physics","q":"A microscope is focused on an object at the bottom of a bucket. If liquid with refractive index $5/3$ is poured inside the bucket, then microscope have to be raised by $30\\ \\mathrm{cm}$ to focus the object again. The height of the liquid in the bucket is","opt":["$75\\ \\mathrm{cm}$","$50\\ \\mathrm{cm}$","$12\\ \\mathrm{cm}$","$18\\ \\mathrm{cm}$"],"ans":0,"c":"Liquid bharne se object upar utha hua dikhta hai — ye refraction ke karan apparent shift hai. Real depth $h$ ho to apparent depth $\\dfrac{h}{\\mu}$ hoti hai, isliye shift $\\Delta=h\\left(1-\\dfrac{1}{\\mu}\\right)$. Microscope ko utna hi upar uthana padta hai jitna shift hota hai.","m":"$\\Delta=h\\left(1-\\dfrac{1}{\\mu}\\right)$ me $\\Delta=30\\ \\mathrm{cm}$ rakho aur $h$ nikalo. Kyun: normal viewing (near-normal rays) ke liye yahi standard formula hai.","s":["Shift: $\\Delta=h\\left(1-\\dfrac{1}{\\mu}\\right)$","$\\mu=\\dfrac53 \\Rightarrow \\dfrac{1}{\\mu}=\\dfrac35$","$30=h\\left(1-\\dfrac35\\right)=h\\times\\dfrac25$","$h=30\\times\\dfrac52$","$h=75\\ \\mathrm{cm}$ — option (1)."],"r":["","$50\\ \\mathrm{cm}$ tab aata hai agar $\\mu=1.5$ le lein ($\\Delta=h/3$) — par yahan $\\mu=5/3$ hai.","$12\\ \\mathrm{cm}$ me formula invert ho gaya ($h=\\Delta\\times\\frac25$).","$18\\ \\mathrm{cm}$ sirf $30\\times\\frac35$ hai — ek step adhoora."],"t":"Kashti ke paani me object hamesha upar dikhta hai, neeche nahi — isliye shift positive hota hai aur microscope ko upar uthana padta hai."},{"id":30,"sub":"Physics","q":"The gravitational field due to a mass distribution is $E=\\dfrac{k}{x^{3}}$ in the $x$-direction ($k$ is a constant). Taking the gravitational potential to be zero at infinity, its value at a distance $x/\\sqrt{2}$ is","opt":["$\\dfrac{k}{x}$","$\\dfrac{k}{2x}$","$\\dfrac{k}{x^{2}}$","$\\dfrac{k}{2x^{2}}$"],"ans":2,"c":"Gravitational potential aur field ka relation: $E=-\\dfrac{dV}{dx}$, yaani $V=-\\int E\\,dx$. Potential ko infinity par zero rakha gaya hai, isliye $V(r)=-\\int_{\\infty}^{r}E\\,dx$. Yahi definition se integrate karna hai, kyunki seedha formula ($-GM/r$) yahan lag nahi sakta — field $1/x^3$ hai, point mass ka nahi.","m":"Definite integral $\\int_{\\infty}^{r}$ lagao. Kyun: reference point infinity hai, aur field ka expression diya hai.","s":["$V(r)=-\\displaystyle\\int_{\\infty}^{r}E\\,dx=-\\int_{\\infty}^{r}k x^{-3}dx$","$\\int x^{-3}dx=-\\dfrac{1}{2x^{2}}$","$V(r)=-\\left[-\\dfrac{k}{2x^{2}}\\right]_{\\infty}^{r}=-k\\left(\\dfrac{1}{2r^{2}}-0\\right)\\times(-1)$","Simplify: $V(r)=\\dfrac{k}{2r^{2}}$","$r=\\dfrac{x}{\\sqrt{2}}\\Rightarrow r^{2}=\\dfrac{x^{2}}{2}$","$V=\\dfrac{k}{2\\cdot x^{2}/2}=\\dfrac{k}{x^{2}}$ — option (3)."],"r":["$\\dfrac{k}{x}$ me $1/x^3$ ko ek baar integrate karne par $1/x^2$ aata hai, $1/x$ nahi.","$\\dfrac{k}{2x}$ me power bhi galat aur factor $\\frac12$ bhi bacha hua hai.","","$\\dfrac{k}{2x^{2}}$ tab aata hai jab $r=x$ rakha jaye; yahan $r=x/\\sqrt2$ hai, isliye $\\frac12$ cancel ho jaata hai."],"w":["Integration ke baad $\\frac12$ aata hai, aur $r=x/\\sqrt2$ rakhne par $r^2=x^2/2$ se wahi $\\frac12$ cancel hota hai. Dono steps alag-alag likho."],"t":"Potential hamesha field ke integration se milta hai: $V_B-V_A=-\\int_A^B \\vec E\\cdot d\\vec r$. Reference infinity par zero hai to $V(r)=-\\int_\\infty^r E\\,dr$."},{"id":31,"sub":"Physics","q":"A point object $O$ is placed in front of two thin symmetrical coaxial convex lenses $M_1$ and $M_2$ with focal length $24\\ \\mathrm{cm}$ and $9\\ \\mathrm{cm}$ respectively. The distance between two lenses is $10\\ \\mathrm{cm}$ and the object is placed $6\\ \\mathrm{cm}$ away from lens $M_1$ as shown in the figure. The distance between the object and the image formed by the system of two lenses is","fig":"<svg viewBox=\"0 0 360 180\" width=\"360\" height=\"180\" role=\"img\" aria-label=\"two coaxial convex lenses with an object\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"180\" fill=\"none\"/><line x1=\"20\" y1=\"100\" x2=\"340\" y2=\"100\" stroke=\"#9aa3b2\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-dasharray=\"5 4\"/><ellipse cx=\"200\" cy=\"100\" rx=\"12\" ry=\"46\" fill=\"none\" stroke=\"#7c9cff\" stroke-width=\"2\"/><ellipse cx=\"280\" cy=\"100\" rx=\"12\" ry=\"40\" fill=\"none\" stroke=\"#7c9cff\" stroke-width=\"2\"/><text x=\"200\" y=\"44\" fill=\"#7c9cff\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">L<tspan baseline-shift=\"sub\" font-size=\"70%\"><\/tspan>(1)<\/text><text x=\"280\" y=\"50\" fill=\"#7c9cff\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">L<tspan baseline-shift=\"sub\" font-size=\"70%\"><\/tspan>(2)<\/text><text x=\"200\" y=\"168\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">f = 24 cm<\/text><text x=\"288\" y=\"168\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">f = 9 cm<\/text><circle cx=\"140\" cy=\"100\" r=\"5\" fill=\"#ffd479\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><text x=\"140\" y=\"86\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">O<\/text><line x1=\"140\" y1=\"122\" x2=\"200\" y2=\"122\" stroke=\"#8b95a8\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"170\" y=\"138\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">6 cm<\/text><line x1=\"200\" y1=\"122\" x2=\"280\" y2=\"122\" stroke=\"#8b95a8\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"240\" y=\"138\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">10 cm<\/text><circle cx=\"308\" cy=\"100\" r=\"4\" fill=\"#7fd39a\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"308\" y=\"86\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">I = ?<\/text><\/svg>","opt":["$34\\ \\mathrm{cm}$","$8\\ \\mathrm{cm}$","$4\\ \\mathrm{cm}$","$18\\ \\mathrm{cm}$"],"ans":0,"c":"Do lenses ka system step-by-step solve hota hai: pehli lens ka image doosri lens ka object banta hai. Sign convention (Cartesian) me object left me ho to $u$ negative. Pehli lens ka image virtual bhi ho sakta hai — uski position ko doosri lens ke liye object distance banana padta hai (lenses ke beech ki doori jodkar).","m":"Lens formula $\\dfrac1v-\\dfrac1u=\\dfrac1f$ do baar lagao, beech me image ko object maano. Kyun: har lens apna independent image banati hai; system ka final image doosri lens ka output hai.","s":["Lens 1: $u=-6\\ \\mathrm{cm}$, $f=+24\\ \\mathrm{cm}$","$\\dfrac1v-\\dfrac1{-6}=\\dfrac1{24}\\Rightarrow \\dfrac1v+\\dfrac16=\\dfrac1{24}$","$\\dfrac1v=\\dfrac1{24}-\\dfrac16=\\dfrac{1-4}{24}=-\\dfrac{3}{24}=-\\dfrac18$","$v=-8\\ \\mathrm{cm}$: image $M_1$ se $8\\ \\mathrm{cm}$ baayein (virtual, same side as object)","Ye image lens 2 ke liye object hai: $u_2=-(10+8)=-18\\ \\mathrm{cm}$, $f_2=+9\\ \\mathrm{cm}$","$\\dfrac1{v_2}-\\dfrac1{-18}=\\dfrac19\\Rightarrow \\dfrac1{v_2}=\\dfrac19-\\dfrac1{18}=\\dfrac1{18}$","$v_2=+18\\ \\mathrm{cm}$: final image $M_2$ se $18\\ \\mathrm{cm}$ daayein (real)","Object se image ki doori $=6+10+18=34\\ \\mathrm{cm}$ — option (1)."],"r":["","$8\\ \\mathrm{cm}$ sirf pehli lens ke image ki doori hai (magnitude), poore system ka answer nahi.","$4\\ \\mathrm{cm}$ kisi bhi sahi step se nahi aata.","$18\\ \\mathrm{cm}$ sirf doosri lens se final image ki doori hai; object se doori poochhi gayi hai."],"w":["Pehli lens ka image virtual hai aur object ke same side — isliye doosri lens ke liye distance $10+8=18\\ \\mathrm{cm}$ hoti hai, $10-8$ nahi."],"t":"Two-lens problems me hamesha diagram par distances likho. Virtual image ka matlab hai lens ke us taraf jahan object hai, to doori add hoti hai."},{"id":32,"sub":"Physics","q":"One end of steel wire is fixed to ceiling of an elevator moving up with an acceleration $2\\ \\mathrm{m\\,s^{-2}}$ and a load of $10\\ \\mathrm{kg}$ hangs from the other end. Area of cross-section of the wire is $2\\ \\mathrm{cm^{2}}$. The longitudinal strain in the wire is (Take $g=10\\ \\mathrm{m\\,s^{-2}}$ and $Y=2\\times10^{11}\\ \\mathrm{N\\,m^{-2}}$)","opt":["$4\\times10^{11}$","$3\\times10^{-6}$","$8\\times10^{-6}$","$2\\times10^{-6}$"],"ans":1,"c":"Elevator upar accelerate kar raha hai, to lift ke frame me load ko extra force chahiye: $T=m(g+a)$. Ye tension wire me stress banata hai, aur stress/strain = Young's modulus. Strain dimensionless hota hai, isliye answer me $10^{-6}$ hona chahiye — units se bhi guess ho jaata hai.","m":"Pehle effective tension (pseudo force ke saath), phir stress $=T/A$, phir strain $=\\sigma/Y$. Kyun: teenon quantities chain me judi hain aur $Y$ ka definition yahi hai.","s":["Tension: $T=m(g+a)=10(10+2)=120\\ \\mathrm{N}$","Area: $A=2\\ \\mathrm{cm^2}=2\\times10^{-4}\\ \\mathrm{m^{2}}$","Stress: $\\sigma=\\dfrac{T}{A}=\\dfrac{120}{2\\times10^{-4}}=6\\times10^{5}\\ \\mathrm{N\\,m^{-2}}$","$Y=\\dfrac{\\sigma}{\\text{strain}}\\Rightarrow \\text{strain}=\\dfrac{\\sigma}{Y}$","$\\text{strain}=\\dfrac{6\\times10^{5}}{2\\times10^{11}}=3\\times10^{-6}$","Strain $=3\\times10^{-6}$ (unit-less) — option (2)."],"r":["$4\\times10^{11}$ Young's modulus ki magnitude hai, strain nahi — aur strain dimensionless hota hai.","","$8\\times10^{-6}$ tab aata hai agar $T=mg$ le kar $a$ ko multiply kar dein, ya area ko $10^{-5}$ likh dein.","$2\\times10^{-6}$ $a=2$ ko tension me add na karke kuch aur jodne se aata hai."],"w":["Area ko $\\mathrm{cm^2}\\to\\mathrm{m^2}$ me badalna zaroori hai: $1\\ \\mathrm{cm^2}=10^{-4}\\ \\mathrm{m^2}$, isliye $2\\ \\mathrm{cm^2}=2\\times10^{-4}\\ \\mathrm{m^2}$."],"t":"Lift upar accelerate kare to tension badhta hai $m(g+a)$, neeche accelerate kare to ghatta hai $m(g-a)$ — aisa likh kar yaad rakho."},{"id":33,"sub":"Physics","q":"In Young's double slit experiment intensity at a point is $(1/4)$ of the maximum intensity. Angular position of this point is","opt":["$\\sin^{-1}\\left(\\dfrac{\\lambda}{d}\\right)$","$\\sin^{-1}\\left(\\dfrac{\\lambda}{2d}\\right)$","$\\sin^{-1}\\left(\\dfrac{\\lambda}{3d}\\right)$","$\\sin^{-1}\\left(\\dfrac{\\lambda}{4d}\\right)$"],"ans":1,"c":"YDSE me do coherent sources ke interference se intensity $I=I_{\\max}\\cos^{2}\\left(\\dfrac{\\phi}{2}\\right)$ hoti hai, jahan $\\phi$ phase difference hai. Phase difference path difference se juda hai: $\\phi=\\dfrac{2\\pi}{\\lambda}\\Delta x$, aur screen par angle $\\theta$ ke liye $\\Delta x=d\\sin\\theta$. Isliye angle nikalne ke liye intensity ka ratio hi kaafi hai.","m":"Intensity ratio se $\\cos^2(\\phi/2)$ nikalo, phir $\\Delta x$, phir $\\sin\\theta$. Kyun: question me sirf intensity ratio diya hai, slit separation aur wavelength symbolic hain.","s":["$I=I_{\\max}\\cos^{2}\\left(\\dfrac{\\phi}{2}\\right)$","$\\dfrac{I_{\\max}}{4}=I_{\\max}\\cos^{2}\\left(\\dfrac{\\phi}{2}\\right)\\Rightarrow \\cos\\left(\\dfrac{\\phi}{2}\\right)=\\dfrac12$","$\\dfrac{\\phi}{2}=\\dfrac{\\pi}{3}\\Rightarrow \\phi=\\dfrac{2\\pi}{3}$","$\\phi=\\dfrac{2\\pi}{\\lambda}\\Delta x\\Rightarrow \\Delta x=\\dfrac{\\lambda}{3}$","$d\\sin\\theta=\\dfrac{\\lambda}{3}\\Rightarrow \\sin\\theta=\\dfrac{\\lambda}{3d}$","$\\theta=\\sin^{-1}\\left(\\dfrac{\\lambda}{3d}\\right)$ — option (3)."],"r":["$\\dfrac{\\lambda}{d}$ first maximum ki position hai, jahan intensity maximum ($I_{\\max}$) hoti hai.","$\\dfrac{\\lambda}{2d}$ first minimum ($I=0$) ki position hai — quarter intensity nahi.","$\\dfrac{\\lambda}{3d}$ yahan sahi answer hai, isliye ise galat nahi likhna.","$\\dfrac{\\lambda}{4d}$ par intensity $\\cos^2(\\pi/4)=1/2$ hoti hai, $1/4$ nahi."],"t":"Intensity–path difference ka table yaad rakho: $\\Delta x=0\\to I_{\\max}$; $\\lambda/4\\to I_{\\max}/2$; $\\lambda/3\\to I_{\\max}/4$; $\\lambda/2\\to 0$."},{"id":34,"sub":"Physics","q":"A vessel whose bottom has round holes with diameter of $1\\ \\mathrm{mm}$ is filled with water. Assuming that surface tension acts only at holes, then the maximum height to which the water can be filled in vessel without leakage is (Surface tension of water is $75\\times10^{-3}\\ \\mathrm{N\\,m^{-1}}$ and $g=10\\ \\mathrm{m\\,s^{-2}}$)","opt":["$3\\ \\mathrm{cm}$","$0.3\\ \\mathrm{cm}$","$3\\ \\mathrm{mm}$","$3\\ \\mathrm{m}$"],"ans":0,"c":"Chhote hole par paani ki surface ek concave meniscus banati hai (jaise capillary tube me). Surface tension se pressure difference $2S/r$ banta hai jo paani ke column ke hydrostatic pressure $h\\rho g$ ko balance karta hai. Jab tak $h\\rho g\\le\\dfrac{2S}{r}$, paani leak nahi hota.","m":"$\\rho g h=\\dfrac{2S}{r}$ equating karke $h$ nikalo. Kyun: leakage tab shuru hota hai jab hydrostatic pressure surface tension ka pressure jita le.","s":["Balance condition: $h\\rho g=\\dfrac{2S}{r}$","$r=\\dfrac{d}{2}=\\dfrac{1\\ \\mathrm{mm}}{2}=0.5\\times10^{-3}\\ \\mathrm{m}$","$h=\\dfrac{2S}{r\\rho g}=\\dfrac{2\\times75\\times10^{-3}}{0.5\\times10^{-3}\\times1000\\times10}$","Numerator $=150\\times10^{-3}=0.15$; denominator $=5$","$h=\\dfrac{0.15}{5}=0.03\\ \\mathrm{m}=3\\ \\mathrm{cm}$ — option (1)."],"r":["","$0.3\\ \\mathrm{cm}$ me ek factor $10$ ki galti hai (radius ko $5\\times10^{-3}$ lena).","$3\\ \\mathrm{mm}$ aadha answer hai — diameter aur radius ka confusion.","$3\\ \\mathrm{m}$ me $100$ ka factor galat — ye tab aata hai jab $\\rho=1000$ ko chhod dein."],"w":["Formula me radius aata hai, diameter nahi. $1\\ \\mathrm{mm}$ diameter ka matlab $r=0.5\\ \\mathrm{mm}$ hai."],"t":"Yaad rakho: $h=\\dfrac{2S}{r\\rho g}$ — capillary rise ka formula hi hai, bas yahan meniscus concave ki taraf hai."},{"id":35,"sub":"Physics","q":"A conducting circular loop is placed in a uniform magnetic field of $0.4\\ \\mathrm{T}$ with its plane perpendicular to the field. Somehow, the radius of the loop starts expanding at a constant rate of $1\\ \\mathrm{mm\\,s^{-1}}$. The magnitude of induced emf in the loop at an instant when the radius of the loop is $2\\ \\mathrm{cm}$ will be (in $\\mu\\mathrm{V}$)","fig":"<svg viewBox=\"0 0 340 160\" width=\"340\" height=\"160\" role=\"img\" aria-label=\"expanding circular loop in a magnetic field\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"160\" fill=\"none\"/><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"140\" stroke=\"#7c9cff\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><circle cx=\"60\" cy=\"28\" r=\"2\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><circle cx=\"60\" cy=\"42\" r=\"2\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><circle cx=\"60\" cy=\"56\" r=\"2\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><circle cx=\"60\" cy=\"70\" r=\"2\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><circle cx=\"60\" cy=\"84\" r=\"2\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><circle cx=\"60\" cy=\"98\" r=\"2\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><circle cx=\"60\" cy=\"112\" r=\"2\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><circle cx=\"60\" cy=\"126\" r=\"2\" fill=\"#7c9cff\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><text x=\"24\" y=\"16\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">B = 0.4 T<\/text><circle cx=\"215\" cy=\"80\" r=\"44\" fill=\"none\" stroke=\"#ffd479\" stroke-width=\"2\"/><line x1=\"215\" y1=\"80\" x2=\"259\" y2=\"80\" stroke=\"#ffd479\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><text x=\"238\" y=\"96\" fill=\"#ffd479\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">r = 2 cm<\/text><line x1=\"172\" y1=\"34\" x2=\"152\" y2=\"26\" stroke=\"#7fd39a\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><text x=\"120\" y=\"24\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">dr/dt = 1 mm s<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>(-1)<\/text><text x=\"215\" y=\"148\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">loop ka plane ⊥ B<\/text><\/svg>","opt":["$25$","$50$","$37.5$","$14.25$"],"ans":1,"c":"Faraday's law: induced emf $=\\left|\\dfrac{d\\Phi}{dt}\\right|$, jahan flux $\\Phi=BA$ aur $A=\\pi r^2$. Yahan field constant hai, par area badal raha hai kyunki radius badh raha hai. Isliye chain rule se $\\dfrac{dA}{dt}=2\\pi r\\dfrac{dr}{dt}$ — physics me sabse zyada miss hone wala step yahi hai.","m":"$\\varepsilon=B\\dfrac{dA}{dt}=B\\cdot2\\pi r\\dfrac{dr}{dt}$ lagao. Kyun: flux ka sirf area part time ke saath badal raha hai.","s":["$\\Phi=BA=B\\pi r^{2}$","$\\varepsilon=\\left|\\dfrac{d\\Phi}{dt}\\right|=B\\pi\\cdot2r\\dfrac{dr}{dt}$","Values: $B=0.4\\ \\mathrm{T}$, $r=2\\times10^{-2}\\ \\mathrm{m}$, $\\dfrac{dr}{dt}=10^{-3}\\ \\mathrm{m\\,s^{-1}}$","$\\varepsilon=0.4\\times2\\pi\\times2\\times10^{-2}\\times10^{-3}$","$=0.4\\times4\\pi\\times10^{-5}=1.6\\pi\\times10^{-5}\\ \\mathrm{V}$","$=16\\pi\\ \\mu\\mathrm{V}\\approx50.3\\ \\mu\\mathrm{V}\\approx50\\ \\mu\\mathrm{V}$ — option (2)."],"r":["$25$ lagbhag aadha hai — $2\\pi r$ ki jagah $\\pi r$ lene se aata hai.","","$37.5$ kisi bhi exact combination se nahi aata ($\\frac34\\times50$), ye distractor hai.","$14.25$ me $2r$ ki jagah $r$ aur $\\pi\\approx3$ jaisa rounding lagta hai."],"t":"$\\pi$ ko $3.14$ lo to $16\\pi=50.24$. NEET options me $\\pi$-based numbers aate hain, isliye $\\pi$ ko $3$ maan kar jaldi mat karo."},{"id":36,"sub":"Physics","q":"If there are no heat losses, the heat released by the condensation of $x$ gram of steam at $100^{\\circ}\\mathrm{C}$ into water at $100^{\\circ}\\mathrm{C}$ can be used to convert $y$ gram of ice at $0^{\\circ}\\mathrm{C}$ into water at $100^{\\circ}\\mathrm{C}$. Then the ratio $y:x$ is nearly","opt":["$1:1$","$2.5:1$","$2:1$","$3:1$"],"ans":3,"c":"Is question me do processes hain: (i) steam condense hoti hai — sirf latent heat nikalta hai (temperature $100^{\\circ}\\mathrm{C}$ hi rehta hai), (ii) ice pehle pighalti hai (latent heat) phir $0$ se $100^{\\circ}\\mathrm{C}$ tak garam hoti hai (specific heat). Energy conservation: diya gaya heat = liya gaya heat.","m":"Heat balance equation banao: $xL_{\\text{steam}}=y\\left(L_{\\text{ice}}+c_w\\Delta T\\right)$. Kyun: 'no heat losses' ka matlab poora heat doosri side use hota hai.","s":["Steam se nikalne wala heat: $Q_{\\text{out}}=x\\times540\\ \\mathrm{cal}$","Ice pighalne ke liye: $y\\times80\\ \\mathrm{cal}$","Ice-water ko $0\\to100^{\\circ}\\mathrm{C}$ garam karne ke liye: $y\\times1\\times100=100y\\ \\mathrm{cal}$","Balance: $540x=80y+100y=180y$","$\\dfrac{y}{x}=\\dfrac{540}{180}=3$","$y:x=3:1$ — option (4)."],"r":["$1:1$ tab aata hai agar sirf latent heats compare karein ($540$ vs $540$ nahi hota) — heating part chhoot jaye.","$2.5:1$ lagbhag $\\frac{540}{216}$ jaisa koi galat denominator hai.","$2:1$ tab aata hai agar ice ke heating ko $0\\to100$ ke bajaye sirf $80$ cal/g lein.",""],"w":["Steam ke condensation ke baad bana water bhi $100^{\\circ}\\mathrm{C}$ par hi rehta hai (kyunki ice-water mixture $100^{\\circ}\\mathrm{C}$ tak jaata hai) — isliye uske cooling ka heat count nahi karte."],"t":"Latent heat: $L_{\\text{ice}}=80\\ \\mathrm{cal\\,g^{-1}}$, $L_{\\text{steam}}=540\\ \\mathrm{cal\\,g^{-1}}$, water $c=1\\ \\mathrm{cal\\,g^{-1}\\,{^{\\circ}C^{-1}}}$ — in teen numbers se aadha paper ban jaata hai."},{"id":37,"sub":"Physics","q":"If a circuit made up of a resistance $1\\,\\Omega$ and inductance $0.01\\ \\mathrm{H}$; and alternating emf $200\\ \\mathrm{V}$ at $50\\ \\mathrm{Hz}$ is connected, then the phase difference between the current and the emf in the circuit is","opt":["$\\tan^{-1}(\\pi)$","$\\tan^{-1}\\left(\\dfrac{\\pi}{2}\\right)$","$\\tan^{-1}\\left(\\dfrac{\\pi}{4}\\right)$","$\\tan^{-1}\\left(\\dfrac{\\pi}{3}\\right)$"],"ans":0,"c":"LR circuit me current emf se peeche rehta hai kyunki inductor change ko resist karta hai. Phase angle $\\tan\\phi=\\dfrac{X_L}{R}$ se milta hai, jahan inductive reactance $X_L=\\omega L=2\\pi fL$. Emf ki value $200\\ \\mathrm{V}$ phase ke liye zaroori nahi — sirf impedance ke liye chahiye hoti hai.","m":"$\\tan\\phi=\\dfrac{X_L}{R}$ lagao. Kyun: resistance current ke saath in-phase hai, inductance $90^{\\circ}$ aage hai, isliye angle ka tangent $X_L/R$ hota hai.","s":["$X_L=2\\pi fL=2\\pi\\times50\\times0.01$","$=2\\pi\\times0.5=\\pi\\,\\Omega$","$\\tan\\phi=\\dfrac{X_L}{R}=\\dfrac{\\pi}{1}=\\pi$","$\\phi=\\tan^{-1}(\\pi)\\approx72^{\\circ}$ — option (1)."],"r":["","$\\dfrac{\\pi}{2}$ tab aata hai agar $X_L=1.57\\,\\Omega$ ho, yaani $fL$ galat liya jaye.","$\\dfrac{\\pi}{4}$ tab aata hai jab $X_L=R$, jo yahan nahi hai.","$\\dfrac{\\pi}{3}$ kisi bhi diye gaye number se nahi banta."],"t":"$60^{\\circ}$ ($\\pi/3$) ya $45^{\\circ}$ ($\\pi/4$) jaisi 'achhi' values aksar galat options hoti hain — asli answer $\\tan^{-1}(\\pi)$ hai, jo approx $72^{\\circ}$ hai."},{"id":38,"sub":"Physics","q":"One kg of a diatomic gas is at a pressure of $8\\times10^{4}\\ \\mathrm{N\\,m^{-2}}$. The density of the gas is $4\\ \\mathrm{kg\\,m^{-3}}$. What is the energy of the gas due to its thermal motion?","opt":["$3\\times10^{4}\\ \\mathrm{J}$","$5\\times10^{4}\\ \\mathrm{J}$","$6\\times10^{4}\\ \\mathrm{J}$","$7\\times10^{4}\\ \\mathrm{J}$"],"ans":1,"c":"Thermal motion ki energy = internal energy. Ideal gas ke liye $U=\\dfrac{f}{2}nRT$ aur $pV=nRT$, isliye $U=\\dfrac{f}{2}pV$. Diatomic gas ke liye degrees of freedom $f=5$ (3 translation + 2 rotation, room temperature par vibration nahi). Volume density se nikalta hai: $V=\\dfrac{m}{\\rho}$.","m":"$U=\\dfrac{f}{2}pV$ lagao, volume ko $V=m/\\rho$ se nikalo. Kyun: temperature nahi diya, par $p$, $m$, $\\rho$ diye hain, to $pV$ raasta sabse short hai.","s":["Volume: $V=\\dfrac{m}{\\rho}=\\dfrac{1}{4}=0.25\\ \\mathrm{m^{3}}$","Diatomic: $f=5$","$U=\\dfrac{f}{2}pV=\\dfrac{5}{2}\\times8\\times10^{4}\\times0.25$","$8\\times10^{4}\\times0.25=2\\times10^{4}$","$U=\\dfrac52\\times2\\times10^{4}=5\\times10^{4}\\ \\mathrm{J}$ — option (2)."],"r":["$3\\times10^{4}$ monoatomic ($f=3$) ka answer hai — diatomic me $f=5$ hota hai.","","$6\\times10^{4}$ tab aata hai agar $f=6$ (vibration bhi gin lein) — room temperature par diatomic ke liye $f=5$.","$7\\times10^{4}$ kisi standard $f$ se nahi aata."],"w":["Diatomic ke liye $f=5$, monoatomic ke liye $f=3$, polyatomic (non-linear) ke liye $f=6$ — ye table yaad rakho."],"t":"$pV=nRT$ ko yaad rakhne se internal energy ka formula turant $U=\\frac{f}{2}pV$ ban jaata hai — moles nikalne ki zaroorat nahi."},{"id":39,"sub":"Physics","q":"A particle of mass $m$ and charge $q$ is in an electric and magnetic field given by $\\mathbf{E}=2\\hat{\\mathbf{i}}+3\\hat{\\mathbf{j}}$, $\\mathbf{B}=4\\hat{\\mathbf{j}}+6\\hat{\\mathbf{k}}$. The charged particle is shifted from the origin to the point $P(x=1;\\ y=1)$ along a straight path. The magnitude of the total work done is","opt":["$0.35q$","$(0.15)q$","$2.5q$","$5q$"],"ans":3,"c":"Magnetic force $\\mathbf{F}=q\\mathbf{v}\\times\\mathbf{B}$ hamesha velocity ke perpendicular hoti hai, isliye magnetic field ka work **hamesha zero** hota hai. Sirf electric field work karta hai, aur electrostatic field conservative hai — work sirf initial aur final position par depend karta hai, path par nahi.","m":"$W=q\\mathbf{E}\\cdot\\mathbf{d}$ lagao aur magnetic part ko ignore karo. Kyun: $\\mathbf{v}\\perp\\mathbf{F}_B$ hone se $\\mathbf{F}_B\\cdot\\mathbf{d}=0$ hamesha.","s":["Magnetic field ka work zero: $W_B=0$","Displacement: $\\mathbf{d}=(1-0)\\hat{\\mathbf{i}}+(1-0)\\hat{\\mathbf{j}}=\\hat{\\mathbf{i}}+\\hat{\\mathbf{j}}$","$W=q\\mathbf{E}\\cdot\\mathbf{d}=q(2\\hat{\\mathbf{i}}+3\\hat{\\mathbf{j}})\\cdot(\\hat{\\mathbf{i}}+\\hat{\\mathbf{j}})$","Dot product: $2\\times1+3\\times1=5$","$W=5q$ (joules, agar $q$ coulomb me ho) — option (4)."],"r":["$0.35q$ aur $(0.15)q$ kisi bhi component combination se nahi aate — ye $\\mathbf{B}$ ko bhi work me jodne ki koshish ke results hain.","$(0.15)q$ magnetic field ke components ($4$ aur $6$) se koi adhoora calculation hai.","$2.5q$ sirf ek component ($2$ ya $3$) lene se aata hai.",""],"t":"Ek line yaad rakho: magnetic force kabhi work nahi karta. Isliye aise questions me $\\mathbf{B}$ sirf distraction hota hai."},{"id":40,"sub":"Physics","q":"A gas at pressure $p$ is adiabatically compressed, so that its density becomes twice that of initial value. Given that $\\gamma=\\dfrac{C_p}{C_V}=7/5$, what will be the final pressure of the gas?","opt":["$2p$","$\\dfrac{7}{5}p$","$2.63p$","$p$"],"ans":2,"c":"Adiabatic process me heat exchange nahi hota, isliye $pV^{\\gamma}=$ constant. Density $\\rho=\\dfrac{m}{V}$, to $V\\propto\\dfrac{1}{\\rho}$ — isliye density double hone ka matlab volume aadha hona hai. Phir $p\\propto\\rho^{\\gamma}$ lag jaata hai.","m":"$pV^{\\gamma}=\\text{const}$ ko density form me badlo: $p\\rho^{-\\gamma}=$ const. Kyun: question me volume nahi, density ratio diya hai.","s":["$p_1V_1^{\\gamma}=p_2V_2^{\\gamma}$","$V\\propto\\dfrac{1}{\\rho}\\Rightarrow \\dfrac{V_1}{V_2}=\\dfrac{\\rho_2}{\\rho_1}=2$","$p_2=p_1\\left(\\dfrac{V_1}{V_2}\\right)^{\\gamma}=p\\left(2\\right)^{7/5}$","$2^{1.4}=2^{1}\\times2^{0.4}=2\\times1.3195$","$=2.639\\approx2.63$","$p_2\\approx2.63p$ — option (3)."],"r":["$2p$ isothermal / Boyle's law ka result hai ($pV=$ const), adiabatic ka nahi.","$\\dfrac75p$ me $\\gamma$ ko multiplier bana diya — $\\gamma$ power me aata hai, multiplier nahi.","","$p$ tab aata hai agar process me pressure hi na badle — compression me to pressure badhna hi hai."],"w":["Density double = volume half. Ratio ulta likhne se $p_2=p/2^{1.4}$ jaisa galat answer aa jaata hai."],"t":"$2^{1.4}$ yaad rakho: $2^{1.4}\\approx2.64$, $3^{1.4}\\approx4.66$ — adiabatic compression ke numericals me seedha kaam aata hai.","sim":"adiabatic"},{"id":41,"sub":"Physics","q":"A wire of length $10\\ \\mathrm{cm}$ and radius $\\sqrt{7}\\times10^{-4}\\ \\mathrm{m}$ is connected across the right gap of a meter bridge. When a resistance of $4.5\\,\\Omega$ is connected on the left gap by using a resistance box, the balance length is found to be at $60\\ \\mathrm{cm}$ from the left end. If the resistivity of the wire is $R\\times 10^{-7}\\,\\Omega\\,\\mathrm{m}$, then value of $R$ is","fig":"<svg viewBox=\"0 0 360 165\" width=\"360\" height=\"165\" role=\"img\" aria-label=\"metre bridge circuit\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"165\" fill=\"none\"/><rect x=\"30\" y=\"40\" width=\"300\" height=\"14\" rx=\"0\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.4\"/><line x1=\"30\" y1=\"47\" x2=\"330\" y2=\"47\" stroke=\"#9aa3b2\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><text x=\"44\" y=\"30\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">0<\/text><text x=\"316\" y=\"30\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">100 cm<\/text><line x1=\"210.0\" y1=\"40\" x2=\"210.0\" y2=\"62\" stroke=\"#ffd479\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><text x=\"210.0\" y=\"76\" fill=\"#ffd479\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">balance 60 cm<\/text><line x1=\"30\" y1=\"60\" x2=\"14\" y2=\"74\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"330\" y1=\"60\" x2=\"346\" y2=\"74\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><rect x=\"4\" y=\"74\" width=\"90\" height=\"30\" rx=\"4\" fill=\"#17281d\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"49\" y=\"94\" fill=\"#7fd39a\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">4.5 Ω<\/text><rect x=\"246\" y=\"74\" width=\"96\" height=\"30\" rx=\"4\" fill=\"#1b2436\" stroke=\"#7c9cff\" stroke-width=\"1.6\"/><text x=\"294\" y=\"94\" fill=\"#7c9cff\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">wire R<\/text><line x1=\"94\" y1=\"89\" x2=\"246\" y2=\"89\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"14\" y1=\"104\" x2=\"14\" y2=\"120\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"346\" y1=\"104\" x2=\"346\" y2=\"120\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"14\" y1=\"120\" x2=\"346\" y2=\"120\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><rect x=\"150\" y=\"108\" width=\"60\" height=\"26\" rx=\"4\" fill=\"#2a2318\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><text x=\"180\" y=\"126\" fill=\"#ffd479\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">cell<\/text><text x=\"180\" y=\"152\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">meter bridge<\/text><\/svg>","opt":["63","70","66","35"],"ans":2,"c":"Meter bridge ek Wheatstone bridge hai jisme do gaps hain: left gap me known resistance aur right gap me unknown wire. Balance par dono side ke resistance ka ratio unke corresponding wire lengths ke ratio ke barabar hota hai. Balance length $60\\ \\mathrm{cm}$ left se hai, matlab left gap ka resistance $60\\ \\mathrm{cm}$ ke saamne hai aur right gap ka $40\\ \\mathrm{cm}$ ke saamne.","m":"Do steps: (i) bridge condition se unknown resistance, (ii) $R=\\rho\\dfrac{l}{A}$ se resistivity. Kyun: bridge resistance deta hai, resistivity material property hai jo geometry se nikalni padti hai.","s":["Balance condition: $\\dfrac{R_{\\text{left}}}{R_{\\text{right}}}=\\dfrac{60}{40}$","$\\dfrac{4.5}{R}=\\dfrac{60}{40}=\\dfrac32$","$R=4.5\\times\\dfrac{2}{3}=3\\,\\Omega$","Area: $A=\\pi r^{2}=\\pi\\left(\\sqrt7\\times10^{-4}\\right)^{2}=7\\pi\\times10^{-8}\\ \\mathrm{m^{2}}$","$\\rho=\\dfrac{RA}{l}=\\dfrac{3\\times 7\\pi\\times10^{-8}}{0.1}=21\\pi\\times10^{-7}$","$\\pi=\\dfrac{22}{7}\\Rightarrow \\rho=21\\times\\dfrac{22}{7}\\times10^{-7}=66\\times10^{-7}\\,\\Omega\\,\\mathrm{m}$","$R=66$ — option (3)."],"r":["$63$ tab aata hai agar $\\pi=3$ lein — question me $22/7$ hi lena hai, warna $3$ ka factor galat ho jata hai.","$70$ lagbhag $21\\pi$ ko $\\pi=3.33$ lene se aata hai.","","$35$ $\\dfrac{22}{7}\\times\\ldots$ ka adha hai, yaani resistance ratio ulta lagane se aata hai."],"w":["$\\sqrt7$ diya gaya hai kyunki area me square karne par $7$ aata hai — isi se $\\pi=22/7$ ke saath sundar cancellation hota hai. Wahi hint hai."],"t":"Meter bridge me balance point left se naapa gaya hai to $\\dfrac{R_{\\text{left}}}{R_{\\text{right}}}=\\dfrac{l}{100-l}$ — $l$ aur $100-l$ ulta mat karo."},{"id":42,"sub":"Physics","q":"The potential energy of a simple harmonic oscillator of mass $2\\ \\mathrm{kg}$ in its mean position is $5\\ \\mathrm{J}$. If its total energy is $9\\ \\mathrm{J}$ and its amplitude is $0.01\\ \\mathrm{m}$, find its time period.","opt":["$\\dfrac{\\pi}{25}\\ \\mathrm{s}$","$\\dfrac{\\pi}{50}\\ \\mathrm{s}$","$\\dfrac{\\pi}{100}\\ \\mathrm{s}$","$\\dfrac{3\\pi}{100}\\ \\mathrm{s}$"],"ans":2,"c":"SHM me energy mean position ke reference par measure hoti hai. Question me mean position par PE $5\\ \\mathrm{J}$ diya hai — matlab reference zero mean position par nahi hai, kuch offset hai. Total energy mean position par hi maximum KE hoti hai: $E_{\\text{total}}=\\frac12m\\omega^{2}A^{2}$ (ye amplitude form reference se independent hai, kyunki amplitude ke point par KE zero hoti hai).","m":"$\\frac12m\\omega^2A^2=E_{\\text{total}}$ se $\\omega$ nikalo, phir $T=2\\pi/\\omega$. Kyun: total energy and amplitude diye hain aur $T$ poochha hai — yahi seedha raasta hai.","s":["Total energy $E=9\\ \\mathrm{J}$, $m=2\\ \\mathrm{kg}$, $A=0.01\\ \\mathrm{m}$","$E=\\dfrac12m\\omega^{2}A^{2}\\Rightarrow 9=\\dfrac12\\times2\\times\\omega^{2}\\times(0.01)^{2}$","$9=\\omega^{2}\\times10^{-4}$","$\\omega^{2}=9\\times10^{4}\\Rightarrow \\omega=300\\ \\mathrm{rad\\,s^{-1}}$","$T=\\dfrac{2\\pi}{\\omega}=\\dfrac{2\\pi}{300}=\\dfrac{\\pi}{150}$","Hmm — check: energy $=\\frac12 kA^2$; $k=m\\omega^2$. $9=\\frac12\\times2\\times\\omega^2\\times10^{-4}$ gives $\\omega^2=9\\times10^4$, $\\omega=300$.","$T=\\dfrac{2\\pi}{300}=\\dfrac{\\pi}{150}\\approx0.021\\ \\mathrm{s}$; options me $\\dfrac{\\pi}{100}$ diya hai, jo $A=0.0122$ jaisa deta — isliye question ka intended number $A=0.01$ ke saath $\\omega\\approx314$ hai.","Intended solution: $K_{\\max}=E_{\\text{tot}}-PE_{\\text{mean}}=9-5=4\\ \\mathrm{J}$, $4=\\frac12m\\omega^2A^2\\Rightarrow\\omega^2=\\dfrac{4\\times2}{2\\times10^{-4}}=4\\times10^4$","$\\omega=200$, $T=\\dfrac{2\\pi}{200}=\\dfrac{\\pi}{100}$ — option (3)."],"r":["$\\dfrac{\\pi}{25}$ ka matlab $\\omega=50$, jo amplitude ke saath match nahi karta.","$\\dfrac{\\pi}{50}$ me $\\omega=100$ — energy equation se nahi aata.","","$\\dfrac{3\\pi}{100}$ me extra factor $3$ hai, kisi bhi step se justified nahi."],"w":["Question thoda ambiguous hai (mean position par PE $5\\ \\mathrm{J}$ ka kya matlab). Standard interpretation: oscillating KE ka maximum $=E_{\\text{tot}}-PE_{\\text{mean}}=4\\ \\mathrm{J}$, aur usi se $T=\\pi/100\\ \\mathrm{s}$ aata hai. Isi interpretation par answer keyed hai."],"t":"SHM me $K_{\\max}=\\frac12m\\omega^2A^2$ aur $T=2\\pi\\sqrt{m/k}$ — dono ko jod kar $\\omega$ nikalna sabse safe hai."},{"id":43,"sub":"Physics","q":"An electric dipole is placed at an angle of $60^{\\circ}$ with an electric field of intensity $10^{5}\\ \\mathrm{N\\,C^{-1}}$. It experiences a torque equal to $8\\sqrt{3}\\ \\mathrm{N\\,m}$. Calculate the charge on the dipole, if the dipole length is $2\\ \\mathrm{cm}$.","opt":["$-8\\times10^{3}\\ \\mathrm{C}$","$8.54\\times10^{-4}\\ \\mathrm{C}$","$8\\times10^{-3}\\ \\mathrm{C}$","$0.85\\times10^{-6}\\ \\mathrm{C}$"],"ans":2,"c":"Electric dipole ka moment $p=q\\times 2a$ hota hai, jahan $2a$ charge separation hai. Field me dipole par torque $\\tau=pE\\sin\\theta$ lagta hai jo dipole ko field ke along align karne ki koshish karta hai. Torque maximum hota hai jab dipole field ke perpendicular ho ($\\theta=90^{\\circ}$) aur zero jab align ho.","m":"$\\tau=pE\\sin\\theta=q(2a)E\\sin\\theta$ se $q$ nikalo. Kyun: torque, field, angle aur length diye hain, aur sirf charge unknown hai.","s":["$\\tau=q(2a)E\\sin\\theta$","$2a=2\\ \\mathrm{cm}=2\\times10^{-2}\\ \\mathrm{m}$, $E=10^{5}\\ \\mathrm{N\\,C^{-1}}$, $\\theta=60^{\\circ}$","$q=\\dfrac{\\tau}{2aE\\sin\\theta}=\\dfrac{8\\sqrt3}{2\\times10^{-2}\\times10^{5}\\times\\sin 60^{\\circ}}$","Denominator: $2\\times10^{-2}\\times10^{5}=2\\times10^{3}$; $\\sin 60^{\\circ}=\\dfrac{\\sqrt3}{2}$","Denominator $=2\\times10^{3}\\times\\dfrac{\\sqrt3}{2}=\\sqrt3\\times10^{3}$","$q=\\dfrac{8\\sqrt3}{\\sqrt3\\times10^{3}}=8\\times10^{-3}\\ \\mathrm{C}$ — option (3)."],"r":["Negative charge dipole me ho sakta hai, par magnitude pehle sahi hona chahiye — $10^{3}$ ka order bhi galat hai.","$8.54\\times10^{-4}$ me $\\sin 60^{\\circ}$ ki jagah $\\cos$ jaisa kuch use hua aur power bhi galat.","","$0.85\\times10^{-6}$ me $10^{3}$ ka factor do baar ghat gaya — $E$ ka power galat lagaya."],"t":"Order-of-magnitude check: $q=\\dfrac{\\tau}{pE}$ jaisa hai, to $\\tau/(\\text{length}\\times E)$ ka order $8/(10^{-2}\\times10^{5})=8\\times10^{-3}$ turant dikh jaata hai."},{"id":44,"sub":"Physics","q":"A progressive wave gets reflected at a boundary such that the ratio of amplitudes of the reflected and incident wave is $1:2$. Find the percentage of energy transmitted.","opt":["$50\\%$","$75\\%$","$25\\%$","$37.5\\%$"],"ans":1,"c":"Wave ki energy amplitude ke square ke proportional hoti hai ($E\\propto A^2$). Boundary par kuch energy reflect hoti hai aur baaki transmit hoti hai. Isliye amplitude ratio ko pehle intensity ratio me badalna padta hai, phir transmitted fraction $=1-$ reflected fraction.","m":"$\\left(\\dfrac{A_r}{A_i}\\right)^2$ se reflected energy fraction nikalo, phir $1-$ karo. Kyun: energy $A^2$ par depend karti hai, $A$ par nahi.","s":["$\\dfrac{A_r}{A_i}=\\dfrac12$","Reflected energy fraction: $\\left(\\dfrac12\\right)^{2}=\\dfrac14$","Transmitted fraction $=1-\\dfrac14=\\dfrac34$","Percentage $=\\dfrac34\\times100$","$=75\\%$ — option (2)."],"r":["$50\\%$ amplitude ratio ko hi percentage maan lena hai — energy me square lagna bhool gaye.","","$25\\%$ reflected fraction hai, transmitted nahi.","$37.5\\%$ $\\frac34$ ka aadha hai — koi bhi justified step isse nahi deta."],"t":"Energy $\\propto A^2$ — ye ek line poore wave-energy chapter (interference, beats, reflection) ka base hai."},{"id":45,"sub":"Physics","q":"Two identical metal plates are given positive charges $Q_1$ and $Q_2$ $(Q_2 \\lt Q_1)$, respectively. If they are now brought close together to form a parallel plate capacitor with capacitance $C$, the potential difference between them is","opt":["$\\dfrac{Q_1+Q_2}{2C}$","$\\dfrac{Q_1+Q_2}{C}$","$\\dfrac{Q_1-Q_2}{C}$","$\\dfrac{Q_1-Q_2}{2C}$"],"ans":3,"c":"Jab do charged conducting plates paas aate hain, to charge unke outer aur inner surfaces par redistribute hota hai. Inner surfaces par equal-opposite charge hota hai (kyunki andar ka field plates ke beech tak seemit hota hai) aur outer surfaces par charge equally bat jaata hai. Capacitor ka potential difference sirf inner (opposite) charges se banta hai.","m":"Charge distribution ka logic: outer surface par total charge $\\dfrac{Q_1+Q_2}{2}$ per plate, inner par $\\dfrac{Q_1-Q_2}{2}$ aur $-\\dfrac{Q_1-Q_2}{2}$. Phir $V=\\dfrac{q_{\\text{inner}}}{C}$. Kyun: sirf inner charges ke beech field hoti hai.","s":["Total charge $=Q_1+Q_2$, jo dono plates ke outer surfaces par barabar bat jaata hai","Inner surface charge (plate 1): $q=Q_1-\\dfrac{Q_1+Q_2}{2}=\\dfrac{Q_1-Q_2}{2}$","Inner surface charge (plate 2): $-\\dfrac{Q_1-Q_2}{2}$","$V=\\dfrac{q}{C}=\\dfrac{(Q_1-Q_2)/2}{C}$","$V=\\dfrac{Q_1-Q_2}{2C}$ — option (4)."],"r":["$\\dfrac{Q_1+Q_2}{2C}$ outer surfaces ka charge hai — wo potential difference nahi banata.","$\\dfrac{Q_1+Q_2}{C}$ total charge ko capacitance se divide karna — galat model.","$\\dfrac{Q_1-Q_2}{C}$ me $\\frac12$ ka factor chhoot gaya — inner charge aadha hota hai.",""],"w":["Do plates ke beech field sirf inner charges se banti hai. Outer charges ka field dono taraf cancel ho jaata hai — isliye unhe count nahi karte."],"t":"Yaad rakho: parallel plate capacitor ka charge $=\\dfrac{Q_1-Q_2}{2}$. Agar dono plates par $+Q$ ho to $V=0$ aur capacitor me energy zero — ye sanity check hai."},{"id":46,"sub":"Chemistry","q":"Which one of the following statement is incorrect about transition elements?","opt":["The last electron enters into the $d$-orbital","Their properties are in between those of $s$-block elements and $p$-block elements","The transition element with smallest atomic number is scandium","Transition metals like $\\ce{Zn}$ and $\\ce{Sc}$ do not show variable oxidation state"],"ans":3,"c":"Transition elements $d$-block ke wo elements hain jinke atom ya common ions me $d$-orbital partially filled hota hai. Inki properties $s$-block (bahut electropositive) aur $p$-block (zyada electronegative) ke beech ki hoti hain, aur inme variable oxidation states dikhti hain kyunki $4s$ aur $3d$ electrons paas-paas energy par hote hain.","m":"Har option ko definition se check karo. Sabse aasan test: 'kya ye element/ion $d$-orbital partially filled rakhta hai?' Jo statement is rule ko todta hai, wahi incorrect hai.","s":["Statement 1: $\\ce{Sc}$ [Ar]$3d^{1}4s^{2}$ — last electron $d$ me hi jaata hai ✓","Statement 2: $d$-block ki properties $s$-block aur $p$-block ke beech hoti hain ✓ (electropositive character reduce hota hai, electronegativity badhti hai)","Statement 3: $d$-block ka pehla element $\\ce{Sc}$ ($Z=21$) hai ✓","Statement 4: $\\ce{Sc}$ sirf $+3$ dikhata hai (variable nahi), par $\\ce{Zn}$ bhi $+2$ hi dikhata hai — dono ko ek saath 'variable oxidation state dikhate hain' bolna galat hai ✗","Incorrect statement = option (4)."],"r":["$d$-block ki definition hi 'last electron $d$-orbital me' hai — ye sahi statement hai.","Ye periodic table ka classic trend hai — $d$-block bridge jaisa kaam karta hai.","$\\ce{Sc}$ hi pehla transition element hai, sahi statement.",""],"t":"$\\ce{Sc}$ ($+3$ only) aur $\\ce{Zn}$ ($+2$ only) dono 'variable oxidation state nahi dikahte' wali exception hain — NEET me ye exception hi poochha jaata hai."},{"id":47,"sub":"Chemistry","q":"Which of the following orders are correct: <br>(a) $\\ce{F}<\\ce{Cl}<\\ce{Br}<\\ce{I}$ : Atomic size <br>(b) $\\ce{F}>\\ce{Cl}>\\ce{Br}>\\ce{I}$ : Ionisation energy <br>(c) $\\ce{F}>\\ce{Cl}>\\ce{Br}>\\ce{I}$ : Electron gain enthalpy <br>(d) $\\ce{F}>\\ce{Cl}>\\ce{Br}>\\ce{I}$ : Electronegativity <br>(e) $\\ce{F2}>\\ce{Cl2}>\\ce{Br2}>\\ce{I2}$ : Bond energy","opt":["a, b, c, d and e","b, c and d only","a, b, d and e only","a, b and d only"],"ans":3,"c":"Halogen group (17) me neeche jaate hue naya shell add hota hai, isliye size badhta hai aur valence electrons nucleus se door ho jaate hain. Isse ionisation energy aur electronegativity ghat-ti hai. Par electron gain enthalpy me $\\ce{F}$ ki chhoti size (electron-electron repulsion) ke karan anomaly hai.","m":"Har option ko periodic trend + halogen anomaly ke saath check karo. Sabse important anomaly: $\\ce{F}$ ki electron gain enthalpy $\\ce{Cl}$ se kam negative hai, aur $\\ce{F2}$ ka bond energy $\\ce{Cl2}$ se kam hai.","s":["(a) size: $\\ce{F}<\\ce{Cl}<\\ce{Br}<\\ce{I}$ ✓ (niche jaate hue shell badhta hai)","(b) ionisation energy: $\\ce{F}>\\ce{Cl}>\\ce{Br}>\\ce{I}$ ✓ (size badhne par IE ghat-ti hai)","(c) electron gain enthalpy: trend $\\ce{Cl}>\\ce{F}>\\ce{Br}>\\ce{I}$ hai — $\\ce{F}$ chhoti hai isliye incoming electron ka repulsion zyada hai ✗","(d) electronegativity: $\\ce{F}>\\ce{Cl}>\\ce{Br}>\\ce{I}$ ✓","(e) bond energy: $\\ce{Cl2}>\\ce{Br2}>\\ce{F2}>\\ce{I2}$ — $\\ce{F2}$ me lone pair repulsion se bond weak hai ✗","Correct: a, b, d — option (4)."],"r":["'c' aur 'e' dono halogen anomalies hain, isliye sab sahi nahi ho sakte.","'(a)' bilkul sahi trend hai (size neeche badhta hai), isliye b ko chunna galat hai.","'(e)' galat hai kyunki $\\ce{F2}$ ka bond sabse weak hota hai halogens me.",""],"t":"Do anomalies rat lo: electron gain enthalpy $\\ce{Cl}>\\ce{F}$ aur bond energy $\\ce{Cl2}>\\ce{F2}$ — inhi par saare halogen questions tike hain."},{"id":48,"sub":"Chemistry","q":"The correct order of acidic strength is :-","opt":["$\\ce{Cl2O7}>\\ce{SO3}>\\ce{P4O10}$","$\\ce{CO2}>\\ce{N2O5}>\\ce{SO3}$","$\\ce{Na2O}>\\ce{MgO}>\\ce{Al2O3}$","$\\ce{K2O}>\\ce{CaO}>\\ce{MgO}$"],"ans":0,"c":"Oxide ki acidic character uske central atom ki electronegativity aur oxidation state par depend karti hai. Zyada oxidation state aur zyada electronegativity wala atom apna oxide acidic banata hai; metals ke oxides basic hote hain. Period me left se right jaate hue basic $\\to$ amphoteric $\\to$ acidic hota hai.","m":"Har option ke central atom ki oxidation state aur electronegativity compare karo. Kyun: acidic strength roughly $=\\dfrac{\\text{oxidation state}\\times\\text{electronegativity}}{\\text{size}}$ jaisa trend follow karti hai.","s":["$\\ce{Cl2O7}$: $\\ce{Cl}$ ka $+7$, electronegativity high ($3.16$) $\\Rightarrow$ strongest acid","$\\ce{SO3}$: $\\ce{S}$ ka $+6$, $\\ce{EN}=2.58$","$\\ce{P4O10}$: $\\ce{P}$ ka $+5$, $\\ce{EN}=2.19$","To $\\ce{Cl2O7}>\\ce{SO3}>\\ce{P4O10}$ ✓ (period me left$\\to$right oxide acidity badhti hai)","Option (2) galat: $\\ce{SO3}$ ($+6$, $\\ce{S}$ zyada EN) $\\ce{N2O5}$ se zyada acidic hai","Option (3)/(4) galat: ye metal oxides basic hain, acidic nahi."],"r":["","$\\ce{N2O5}$ se $\\ce{SO3}$ zyada acidic hota hai ($\\ce{S}$ ki EN $\\ce{N}$ se zyada nahi, par $+6$ oxidation state decisive hai) — isliye ye order ulta hai.","$\\ce{Na2O}$, $\\ce{MgO}$, $\\ce{Al2O3}$ metal oxides hain, inki acidity badhne ka order basic-to-amphoteric hai — 'acidic strength' ke liye galat.","$\\ce{K2O}$, $\\ce{CaO}$, $\\ce{MgO}$ sab basic hain, acidity order nahi."],"t":"Period me oxide ki acidity: $\\ce{Na2O}<\\ce{MgO}<\\ce{Al2O3}<\\ce{SiO2}<\\ce{P4O10}<\\ce{SO3}<\\ce{Cl2O7}$ — ek hi line yaad kar lo."},{"id":49,"sub":"Chemistry","q":"$\\ce{[SiF6]^{2-}}$ is known whereas $\\ce{[SiCl6]^{2-}}$ is not, because","opt":["In $\\ce{[SiCl6]^{2-}}$ interaction between lone pair of chloride ion and $\\ce{Si^{4+}}$ is very strong","In $\\ce{[SiCl6]^{2-}}$ back bonding is not possible","Six large chloride ions cannot be accommodated around $\\ce{Si^{4+}}$ due to limitation of its size","$\\ce{Si}$ has no vacant orbital for accepting lone pair"],"ans":2,"c":"$\\ce{Si^{4+}}$ bahut chhota ion hai (radius bahut kam). Octahedral complex me 6 ligands ko uske around fit karna padta hai. $\\ce{F-}$ chhota hai isliye $\\ce{[SiF6]^{2-}}$ ban jaata hai, par $\\ce{Cl-}$ bada hai — 6 bade ions chhote $\\ce{Si^{4+}}$ ke around fit nahi hote (steric repulsion).","m":"Size-based argument chuno. Kyun: halogen ke andar sirf size ka farq hai; electronic configuration ya vacant orbital ka farq nahi (dono me $\\ce{Si}$ ke paas same orbitals hain).","s":["$\\ce{Si^{4+}}$ ka size bahut chhota hai, isliye coordination number $6$ achieve karna mushkil hota hai","$\\ce{F-}$ ionic radius chhota $\\Rightarrow$ 6 fluorides easily fit ho jaate hain $\\Rightarrow$ $\\ce{[SiF6]^{2-}}$ stable","$\\ce{Cl-}$ ionic radius bada $\\Rightarrow$ octahedral arrangement me strong steric repulsion","Ligand-ligand repulsion itni zyada ki $\\ce{[SiCl6]^{2-}}$ nahi banta","Reason = option (3)."],"r":["Lone pair–$\\ce{Si^{4+}}$ interaction asal me bond formation hi hai; ye 'strong' hona complex ko todta nahi.","Back bonding ka is sawaal me koi role nahi — $\\ce{[SiF6]^{2-}}$ me bhi back bonding nahi hoti.","","$\\ce{Si}$ ke paas $d$-orbitals hain aur $sp^{3}d^{2}$ hybridization possible hai — orbital ki kami nahi hai."],"t":"Yaad rakho: $\\ce{SiF6^{2-}}$ exist karta hai, $\\ce{SiCl6^{2-}}$ nahi — reason hamesha chloride ka bada size aur steric hindrance hai."},{"id":50,"sub":"Chemistry","q":"Correct order of bond strength is :","opt":["$3p\\pi-3p\\pi>2p\\pi-3d\\pi>2p\\pi-3p\\pi>2p\\pi-2p\\pi$","$2p\\pi-3d\\pi>2p\\pi-3p\\pi>2p\\pi-2p\\pi>3p\\pi-3p\\pi$","$2p\\pi-2p\\pi>2p\\pi-3d\\pi>2p\\pi-3p\\pi>3p\\pi-3p\\pi$","$2p\\pi-2p\\pi>2p\\pi-3p\\pi>2p\\pi-2d\\pi>3p\\pi-3p\\pi$"],"ans":2,"c":"$\\pi$-bond ki strength orbital overlap par depend karti hai. Do orbitals ke size/energy paas-paas hon to overlap accha hota hai. $2p\\pi-2p\\pi$ sabse strong hai kyunki dono orbitals compact aur same size ke hain. Jab ek orbital $2p$ aur doosra $3p$ ya $3d$ ho, to size mismatch se overlap kamzor hota hai. $3p\\pi-3p\\pi$ diffuse orbitals ke karan sabse weak hoti hai.","m":"Overlap ke rules: same shell (size match) > mixed shell > bigger shell. Isi order par options ko filter karo. Kyun: bond strength $\\propto$ orbital overlap.","s":["$2p\\pi-2p\\pi$: dono compact, same size $\\Rightarrow$ best overlap $\\Rightarrow$ strongest","$2p\\pi-3d\\pi$: $3d$ diffuse hai par sidewise overlap possible; $2p-3p$ se behtar mana jaata hai","$2p\\pi-3p\\pi$: size mismatch zyada, overlap kam","$3p\\pi-3p\\pi$: dono diffuse, sidewise overlap sabse kamzor","Order: $2p\\pi-2p\\pi>2p\\pi-3d\\pi>2p\\pi-3p\\pi>3p\\pi-3p\\pi$ — option (3)."],"r":["$3p\\pi-3p\\pi$ ko sabse strong dikhana bilkul galat hai — diffuse orbitals ka overlap kamzor hota hai.","$2p\\pi-2p\\pi$ ko doosre number par rakhna galat hai; wahi sabse strong hai.","","$2p\\pi-2d\\pi$ jaisa combination practically nahi hota kyunki $2d$ orbital exist hi nahi karta."],"t":"Rule: jitna achha overlap, utni strong bond. Same-shell orbitals ka overlap hamesha best hota hai."},{"id":51,"sub":"Chemistry","q":"Bonding in which of the following diatomic molecule(s) become(s) stronger, on the basis of MO Theory, by removal of an electron? <br>(A) $\\ce{F2}$&#8195;(B) $\\ce{N2}$&#8195;(C) $\\ce{O2}$&#8195;(D) $\\ce{C2}$&#8195;(E) $\\ce{B2}$","opt":["(A), (B), (C) only","(B), (C), (E) only","(A), (C) only","(D) only"],"ans":2,"c":"MO theory me bond strength bond order se aati hai: $\\text{BO}=\\dfrac{N_b-N_a}{2}$. Electron nikalne par agar electron antibonding orbital se jaata hai, to $N_a$ ghatta hai aur bond order badh jaata hai — bond strong hota hai. Agar electron bonding orbital se nikalta hai, bond order ghatta hai.","m":"Har molecule ka MO configuration likho, phir HOMO (highest occupied MO) dekho: antibonding se electron nikalna = bond order up. Kyun: sirf BO ka change hi bond strength ka change batata hai.","s":["$\\ce{F2}$: $18$ electrons, HOMO $\\pi^{*}$ (antibonding), BO $=1$. $\\ce{F2+}$ me BO $=1.5$ $\\Rightarrow$ stronger ✓","$\\ce{O2}$: HOMO $\\pi^{*}$ (antibonding), BO $=2$. $\\ce{O2+}$ me BO $=2.5$ $\\Rightarrow$ stronger ✓","$\\ce{N2}$: HOMO $\\sigma$ (bonding), BO $=3$. $\\ce{N2+}$ me BO $=2.5$ $\\Rightarrow$ weaker ✗","$\\ce{C2}$: HOMO $\\pi$ (bonding), BO $=2$. $\\ce{C2+}$ me BO $=1.5$ $\\Rightarrow$ weaker ✗","$\\ce{B2}$: HOMO $\\pi$ (bonding), BO $=1$. $\\ce{B2+}$ me BO $=0.5$ $\\Rightarrow$ weaker ✗","Sirf (A) aur (C) — option (3)."],"r":["$\\ce{N2}$ ka electron bonding $\\sigma$ orbital se nikalta hai, isliye bond order ghatta hai — 'stronger' nahi hota.","$\\ce{B2}$ aur $\\ce{N2}$ dono bonding orbital se electron khote hain.","","$\\ce{C2}$ ka HOMO bonding $\\pi$ hai, to bond kamzor hota hai — akela (D) galat hai."],"t":"Shortcut: jis molecule ka HOMO antibonding ho ($\\ce{O2}$, $\\ce{F2}$, $\\ce{NO}$, $\\ce{O2^-}$ type), wahan electron nikalne se bond order badhta hai."},{"id":52,"sub":"Chemistry","q":"Figure depicts the change in concentration of species $X$ and $Y$ as a function of time. The point of intersection of the two curves represents","fig":"<svg viewBox=\"0 0 330 190\" width=\"330\" height=\"190\" role=\"img\" aria-label=\"concentration of X and Y vs time with an intersection point\"><rect x=\"0\" y=\"0\" width=\"330\" height=\"190\" fill=\"none\"/><text x=\"40\" y=\"24\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">concentration<\/text><line x1=\"70\" y1=\"30\" x2=\"70\" y2=\"160\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"160\" x2=\"320\" y2=\"160\" stroke=\"#8b95a8\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"310\" y=\"178\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Time<\/text><path d=\"M 70 46 Q 140 130 190 142 L 320 148\" fill=\"none\" stroke=\"#7c9cff\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"96\" y=\"60\" fill=\"#7c9cff\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">X<\/text><path d=\"M 70 158 Q 150 120 210 88 L 320 74\" fill=\"none\" stroke=\"#7fd39a\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"90\" y=\"150\" fill=\"#7fd39a\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Y<\/text><circle cx=\"190\" cy=\"112\" r=\"4\" fill=\"#ffd479\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><text x=\"190\" y=\"132\" fill=\"#ffd479\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">intersection<\/text><\/svg>","opt":["$t_{1/2}$","$t_{3/4}$","$t_{2/3}$","data insufficient to predict"],"ans":0,"c":"Graph me $X$ ki concentration ghat rahi hai aur $Y$ ki badh rahi hai (product ban raha hai). Chemical kinetics me $t_{1/2}$ (half life) ka matlab hai wo time jab reactant ki concentration apni initial value ka aadha reh jaye. Intersection par $[X]=[Y]$ likha ja sakta hai, par wo half-life sirf tab hai jab $X\\to Y$ first-order conversion ho.","m":"Graph padho: $X$ centre se shuru hoke girta hai, $Y$ zero se shuru hoke chadhta hai. Jab dono equal ho jaate hain, tab reactant ka aadha part product me badal chuka hai (agar initial $Y=0$ hai) — isliye intersection $=t_{1/2}$.","s":["$t=0$ par: $[X]=[X]_0$, $[Y]=0$","Reaction $X\\to Y$ ke liye $[X]+[Y]=[X]_0$ (mass balance)","Intersection par $[X]=[Y]$, isliye $2[X]=[X]_0\\Rightarrow [X]=\\dfrac{[X]_0}{2}$","$[X]$ apni initial value ka aadha $\\Rightarrow$ ye half-life ka point hai","Point of intersection $=t_{1/2}$ — option (1)."],"r":["","$t_{3/4}$ par $[X]$ initial ka $\\frac14$ bachta hai, intersection par aadha bachta hai.","$t_{2/3}$ ka koi standard meaning nahi hota kinetics me.","Data kaafi hai: mass balance se seedha $[X]=[X]_0/2$ nikalta hai."],"t":"Graph me jahan do curves milte hain, wahan values equal hoti hain. Mass balance se aadha hissa reactant, aadha product — yahi half-life ka signature hai.","sim":"firstorder"},{"id":53,"sub":"Chemistry","q":"Conditions for ionic bond formation is/are : <br>(a) Small cation, large anion <br>(b) Low IP of cation, high electron affinity of anion <br>(c) Large cation, small anion <br>(d) Less lattice energy","opt":["a, d","b, c and d","b and c","a, b"],"ans":3,"c":"Ionic bond tab banta hai jab ek atom electron kho kar cation bane aur doosra electron le kar anion bane, aur ye process energetically favourable ho. Favourable condition: cation ka ionisation potential kam ho (electron dena aasan), anion ki electron affinity zyada ho (electron lena faayda), aur lattice energy zyada ho (packing tight). Chhota cation aur bada anion lattice energy badhata hai.","m":"Har point ko energetics se judge karo: cation banana aasan + anion banana faayda + lattice energy zyada. Jo options in tino ke against jaayein, reject.","s":["(a) chhota cation, bada anion $\\Rightarrow$ ions paas aa sakte hain, lattice energy zyada ✓","(b) cation ka low IP + anion ki high electron affinity $\\Rightarrow$ electron transfer aasan ✓","(c) bada cation, chhota anion $\\Rightarrow$ lattice energy kam, favourabilty kam ✗","(d) 'kam lattice energy' favourable condition nahi hai ✗","Correct pair: (a) aur (b) — option (4)."],"r":["'d' galat hai: ionic bond ki stability zyada lattice energy se aati hai, kam se nahi.","'c' aur 'd' dono galat conditions hain.","'c' (large cation + small anion) lattice energy ghatata hai, isliye galat.",""],"t":"Lattice energy $\\propto\\dfrac{q^+q^-}{r^++r^-}$ — isliye chhote ions wale ionic compounds zyada stable hote hain."},{"id":54,"sub":"Chemistry","q":"Consider the following statements and select the correct option using the codes given. <br>(i) $\\ce{[Cr(NH3)6][Cr(CN)6]}$ and $\\ce{[Cr(NH3)4(CN)2][Cr(NH3)2(CN)4]}$ are coordination isomers. <br>(ii) $\\ce{[Cr(py)2(H2O)2Cl2]Cl}$ and $\\ce{[Cr(py)2(H2O)Cl3]H2O}$ are linkage isomers. <br>(iii) $\\ce{[Pt(NH3)4Br2]Cl2}$ and $\\ce{[Pt(NH3)4Cl2]Br2}$ are linkage isomers. <br>(iv) $\\ce{[NiCl2(PPh3)2]}$ (tetrahedral) exhibits geometrical isomerism.","opt":["(i) only","(i) and (ii) only","(ii) and (iii) only","(iii) and (iv) only"],"ans":0,"c":"Isomerism ke types me naam se hi pata chal jaata hai kaun sa ligand distribution badal raha hai: coordination isomerism me cation aur anion complexes ke beech ligands ki adla-badli hoti hai; ionisation isomerism me counter ion badalta hai; linkage isomerism me ambidentate ligand alag atom se bandhta hai; tetrahedral complexes me geometrical isomerism nahi hoti (kyunki chaaron position equivalent hain).","m":"Har statement me complex ke andar kya badla hai, wo dekho. Kyun: naam galat hone ki sabse badi wajah 'ligand kaise shift hua' ko galat samajhna hai.","s":["(i) dono complexes me ligands $(\\ce{NH3}/\\ce{CN})$ dono complexes ke beech bat gaye hain $\\Rightarrow$ coordination isomerism ✓","(ii) $\\ce{Cl-}$ counter ion aur $\\ce{H2O}$ ki jagah badli hai $\\Rightarrow$ ye ionisation isomerism hai, linkage nahi ✗","(iii) $\\ce{Br-}$ aur $\\ce{Cl-}$ counter ions ki jagah badli $\\Rightarrow$ ionisation isomerism, linkage nahi ✗","(iv) tetrahedral complex me saare positions equivalent hote hain $\\Rightarrow$ geometrical isomerism possible nahi ✗","Sirf (i) sahi — option (1)."],"r":["","Statement (ii) me ambidentate ligand nahi hai; sirf counter ion badla hai — wo ionisation isomerism hai.","Statement (iii) bhi ionisation isomerism ka example hai ($\\ce{Cl-}$ vs $\\ce{Br-}$ counter ions).","Tetrahedral complex me geometrical isomerism nahi hoti, isliye (iv) galat hai."],"t":"Ambidentate ligands yaad rakho: $\\ce{NO2^-}$ (N ya O), $\\ce{SCN^-}$ (S ya N), $\\ce{CN^-}$ (C ya N), $\\ce{CO}$ — inke through bandhna linkage isomerism hai."},{"id":55,"sub":"Chemistry","q":"Two reactions $R_1$ and $R_2$ have identical pre-exponential factors. Activation energy of $R_1$ exceeds that of $R_2$ by $10\\ \\mathrm{kJ\\,mol^{-1}}$. If $k_1$ and $k_2$ are rate constants for reactions $R_1$ and $R_2$ respectively at $300\\ \\mathrm{K}$, then $\\ln\\left(\\dfrac{k_2}{k_1}\\right)$ is equal to: ($R=8.314\\ \\mathrm{J\\,mol^{-1}\\,K^{-1}}$)","opt":["8","12","6","4"],"ans":3,"c":"Arrhenius equation: $k=Ae^{-E_a/RT}$. $A$ same hai, to rate constants ka ratio sirf exponential factor par depend karta hai. Zyada $E_a$ wali reaction slow hoti hai (yahan $R_1$), isliye $k_2>k_1$ aur $\\ln(k_2/k_1)$ positive aayega.","m":"Ratio banao: $\\ln\\left(\\dfrac{k_2}{k_1}\\right)=\\dfrac{E_{a1}-E_{a2}}{RT}$. Kyun: $A$ cancel ho jaata hai aur sirf energy difference bachta hai.","s":["$k_1=Ae^{-E_{a1}/RT}$, $k_2=Ae^{-E_{a2}/RT}$","$\\dfrac{k_2}{k_1}=e^{(E_{a1}-E_{a2})/RT}$","$\\ln\\left(\\dfrac{k_2}{k_1}\\right)=\\dfrac{E_{a1}-E_{a2}}{RT}$","$E_{a1}-E_{a2}=10\\ \\mathrm{kJ\\,mol^{-1}}=10^{4}\\ \\mathrm{J\\,mol^{-1}}$","$RT=8.314\\times300=2494.2\\ \\mathrm{J\\,mol^{-1}}$","$\\ln\\left(\\dfrac{k_2}{k_1}\\right)=\\dfrac{10^{4}}{2494.2}=4.01\\approx4$ — option (4)."],"r":["$8$ aata hai agar $10\\ \\mathrm{kJ}$ ki jagah $20\\ \\mathrm{kJ}$ use ho jaye.","$12$ kisi bhi sahi combination se nahi aata.","$6$ tab aata hai agar $R=8.314$ ke saath $T=200\\ \\mathrm{K}$ jaisa koi galat number lein.",""],"t":"$RT$ at $300\\ \\mathrm{K}$ lagbhag $2.5\\ \\mathrm{kJ\\,mol^{-1}}$ hota hai — isse $10\\ \\mathrm{kJ}$ ka ratio seedha $4$ dikh jaata hai."},{"id":56,"sub":"Chemistry","q":"Select the correct $M-C$ bond length order:","opt":["$\\ce{[Ni(CO)4]}>\\ce{[Co(CO)4]^{-}}>\\ce{[Fe(CO)4]^{2-}}$","$\\ce{[Ni(CO)4]}<\\ce{[Co(CO)4]^{-}}<\\ce{[Fe(CO)4]^{2-}}$","$\\ce{[Ni(CO)4]}<\\ce{[Co(CO)4]^{-}}=\\ce{[Fe(CO)4]^{2-}}$","$\\ce{[Ni(CO)4]}=\\ce{[Co(CO)4]^{-}}=\\ce{[Fe(CO)4]^{2-}}$"],"ans":1,"c":"Metal carbonyl me $\\ce{CO}$ ka $\\pi^{*}$ orbital metal ke $d$-electrons se back donation leta hai (synergic bonding). Jitna zyada negative charge metal par ho, utna zyada back donation hota hai, $\\pi^{*}$ me zyada electrons jaate hain, aur $M-C$ bond short + strong ho jaata hai; saath hi $C-O$ bond lambi ho jaati hai.","m":"Metal par negative charge ka trend dekho: $\\ce{Fe^{2-}}>\\ce{Co^{-}}>\\ce{Ni^{0}}$ (zyada negative charge = zyada back bonding = chhoti $M-C$ bond). Kyun: back bonding ki strength hi bond length decide karti hai.","s":["$\\ce{Ni(CO)4}$: metal $\\ce{Ni^{0}}$, neutral","$\\ce{[Co(CO)4]^{-}}$: metal $\\ce{Co^{-}}$, ek extra electron $\\Rightarrow$ zyada back bonding","$\\ce{[Fe(CO)4]^{2-}}$: metal $\\ce{Fe^{2-}}$, do extra electrons $\\Rightarrow$ sabse zyada back bonding","Back bonding zyada $\\Rightarrow$ $M-C$ bond chhoti","Order: $\\ce{[Ni(CO)4]}>\\ce{[Co(CO)4]^{-}}>\\ce{[Fe(CO)4]^{2-}}$ — option (1)... check: bond length chhoti hone ka matlab '<' hai, to $\\ce{[Ni(CO)4]}<\\ce{[Co(CO)4]^{-}}<\\ce{[Fe(CO)4]^{2-}}$","Correct option: (2)."],"r":["Ye order back bonding ke trend ke ulta hai — negative charge badhne par $M-C$ bond chhoti hoti hai, badi nahi.","","'$=$' tab hota jab teenon par same charge ho — yahan charge alag hai.","Teenon equal kabhi nahi ho sakte kyunki metal charge alag hai."],"w":["Dhyan do: bond length ka order ulta hota hai bond strength ke order se. Back bonding zyada = $M-C$ chhoti aur mazboot, $C-O$ lambi aur kamzor."],"t":"Isocyanide vs carbonyl ka farq bhi yaad rakho: $\\ce{CO}$ me $C$ se bandhta hai, $\\ce{NC^-}$ me bhi $C$ se — dono me back bonding strong hoti hai."},{"id":57,"sub":"Chemistry","q":"For which of the following process $q=\\Delta U$?","fig":"<svg viewBox=\"0 0 340 180\" width=\"340\" height=\"180\" role=\"img\" aria-label=\"p-V diagram with four processes from point O\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"180\" fill=\"none\"/><defs><marker id=\"ah\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#8b95a8\"/><\/marker><\/defs><line x1=\"60\" y1=\"150\" x2=\"320\" y2=\"150\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"150\" x2=\"60\" y2=\"20\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><text x=\"306\" y=\"168\" fill=\"#9aa3b2\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">V<\/text><text x=\"40\" y=\"26\" fill=\"#9aa3b2\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">p<\/text><circle cx=\"60\" cy=\"40\" r=\"3.4\" fill=\"#7fd39a\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"72\" y=\"34\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">O<\/text><line x1=\"60\" y1=\"40\" x2=\"300\" y2=\"40\" stroke=\"#7fd39a\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"272\" y=\"30\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">A<\/text><line x1=\"60\" y1=\"40\" x2=\"262\" y2=\"108\" stroke=\"#7c9cff\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"268\" y=\"118\" fill=\"#7c9cff\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">B<\/text><path d=\"M 60 40 Q 130 118 236 132\" fill=\"none\" stroke=\"#ffd479\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"244\" y=\"126\" fill=\"#ffd479\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">C<\/text><line x1=\"60\" y1=\"40\" x2=\"60\" y2=\"142\" stroke=\"#e7908c\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"52\" y=\"120\" fill=\"#e7908c\" font-size=\"12\" text-anchor=\"end\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">D<\/text><\/svg>","opt":["$O\\to A$","$O\\to B$","$O\\to C$","$O\\to D$"],"ans":3,"c":"First law of thermodynamics: $\\Delta U=q-w$ (ya $q=\\Delta U+w$ kaam ki sign convention ke saath). Agar $w=0$ ho, to $q=\\Delta U$. Work volume change se aata hai: $w=p\\Delta V$. Isliye $q=\\Delta U$ tab hota hai jab volume constant ho — yaani isochoric process.","m":"Graph me dekho kaun sa path vertical hai (volume constant). Kyun: vertical line par $\\Delta V=0\\Rightarrow w=0\\Rightarrow q=\\Delta U$.","s":["$q=\\Delta U+w$, jahan $w=p\\Delta V$","$q=\\Delta U$ ke liye $w=0$ chahiye $\\Rightarrow$ $\\Delta V=0$","Graph me $O\\to A$: horizontal (pressure constant) $\\Rightarrow$ isobaric, $w\\ne0$","$O\\to B$ aur $O\\to C$: dono me volume badalta hai $\\Rightarrow$ $w\\ne0$","$O\\to D$: vertical neeche, volume constant (isochoric) $\\Rightarrow$ $w=0$","Answer: $O\\to D$ — option (4)."],"r":["$O\\to A$ isobaric hai (pressure constant), volume badalta hai isliye work hota hai.","$O\\to B$ me bhi volume change ho raha hai (expansion), to $w\\ne0$.","$O\\to C$ curved expansion hai, isme work definitely hota hai.",""],"t":"Graph ke naam yaad rakho: horizontal = isobaric, vertical = isochoric, hyperbola = isothermal, steep curve = adiabatic."},{"id":58,"sub":"Chemistry","q":"Assertion: $\\ce{Eu^{2+}}$ and $\\ce{Yb^{2+}}$ are reducing agents. <br>Reason: Both ions have stable half filled configuration.","opt":["Both assertion and reason are true and reason is the correct explanation of assertion","Both assertion and reason are true but reason is not the correct explanation of assertion","Assertion is true but reason is false","Both assertion and reason are false"],"ans":2,"c":"Lanthanoid ions me stability ka rule: $f^{0}$, $f^{7}$ aur $f^{14}$ configurations relatively stable hote hain. $\\ce{Eu^{2+}}$ ($4f^{7}$) aur $\\ce{Yb^{2+}}$ ($4f^{14}$) dono stable configurations rakhte hain, par inme se electron nikalna aasan hota hai kyunki ye $+3$ state (jo lanthanoids ke liye common hai) aur bhi stable hoti hai — isliye ye reducing agents hain.","m":"Pehle assertion verify karo (kya ye reducing agents hain?), phir reason ki configuration check karo. Kyun: reason galat configuration bata raha ho to 'correct explanation' option automatically reject ho jaata hai.","s":["Assertion: $\\ce{Eu^{2+}}\\to\\ce{Eu^{3+}}$ aur $\\ce{Yb^{2+}}\\to\\ce{Yb^{3+}}$ aasani se hote hain $\\Rightarrow$ dono reducing agents ✓","$\\ce{Eu}$: $[\\ce{Xe}]4f^{7}6s^{2}$; $\\ce{Eu^{2+}}$: $4f^{7}$ — half filled ✓","$\\ce{Yb}$: $[\\ce{Xe}]4f^{14}6s^{2}$; $\\ce{Yb^{2+}}$: $4f^{14}$ — completely filled, half filled nahi ✗","Reason 'both have half filled configuration' galat hai (ek $f^{7}$, doosra $f^{14}$)","Assertion true, reason false — option (3)."],"r":["Reason galat hai, isliye 'correct explanation' wala option nahi.","Reason true nahi hai — $\\ce{Yb^{2+}}$ ka $f^{14}$ completely filled hai, half filled nahi.","","Assertion sach hai: dono $+3$ state me jaana pasand karte hain, isliye reducing hain."],"t":"Lanthanoid ke stable configurations: $f^{0}$ ($\\ce{La^{3+}}$, $\\ce{Ce^{4+}}$), $f^{7}$ ($\\ce{Gd^{3+}}$, $\\ce{Eu^{2+}}$), $f^{14}$ ($\\ce{Yb^{2+}}$, $\\ce{Lu^{3+}}$)."},{"id":59,"sub":"Chemistry","q":"The equilibrium constant for the reaction $\\ce{N2(g) + O2(g) <=> 2NO(g)}$ is $4\\times10^{-4}$ at $2000\\ \\mathrm{K}$. In presence of a catalyst, equilibrium is attained ten times faster. Therefore, the equilibrium constant, in presence of the catalyst, at $2000\\ \\mathrm{K}$ is","opt":["$40\\times10^{-4}$","$4\\times10^{-6}$","$4\\times10^{-3}$","$4\\times10^{-4}$"],"ans":3,"c":"Catalyst forward aur backward dono reactions ki rate ko barabar guna badhata hai. Isliye equilibrium jaldi aata hai, par equilibrium ki position (yaani $K$) nahi badalti. $K$ sirf temperature par depend karta hai.","m":"Concept-based: catalyst $K$ ko nahi badalta, sirf rate badhata hai. Kyun: $K=\\dfrac{k_f}{k_b}$, aur catalyst dono ko same factor se badhata hai, isliye ratio same rehta hai.","s":["Catalyst equilibrium tak pahunchne ka time ghatata hai (yahan $10$ guna fast)","$K=\\dfrac{k_f}{k_b}$; catalyst $k_f$ aur $k_b$ dono ko same factor se badhata hai","Isliye ratio $K$ unchanged rehta hai","Temperature bhi same hai ($2000\\ \\mathrm{K}$), to $K$ ki value badalne ka koi reason nahi","$K=4\\times10^{-4}$ — option (4)."],"r":["$40\\times10^{-4}$ me $10$ ka factor catalyst ke '10 times faster' se aaya — rate aur equilibrium constant alag cheezein hain.","$4\\times10^{-6}$ me $100$ ka factor ghat gaya — koi justification nahi.","$4\\times10^{-3}$ me $K$ $10$ guna badh gaya — possible nahi.",""],"t":"Ek line yaad rakho: catalyst sirf rate badhata hai, equilibrium constant aur enthalpy change nahi. Sirf temperature $K$ ko badalta hai."},{"id":60,"sub":"Chemistry","q":"In Kjeldahl's method for the estimation of nitrogen, the formula used to calculate the percentage of nitrogen is","opt":["$\\%\\,\\ce{N}=\\dfrac{1.4\\,V w}{N}$","$\\%\\,\\ce{N}=\\dfrac{1.4\\,V N}{w}$","$\\%\\,\\ce{N}=\\dfrac{V N w}{1.8}$","$\\%\\,\\ce{N}=\\dfrac{1.4\\,N w}{V}$"],"ans":1,"c":"Kjeldahl's method me organic compound ko conc. $\\ce{H2SO4}$ ke saath digest kiya jaata hai; nitrogen $(\\ce{NH4)2SO4}$ me badal jaata hai. Phir $\\ce{NaOH}$ daal kar $\\ce{NH3}$ nikalti hai jo known volume ke standard acid me absorb hoti hai, aur bachi acid ko titre karke nitrogen ka amount nikalta hai.","m":"Formula ke dimensions check karo: percentage dimensionless hona chahiye. $V$ = acid ka volume (mL), $N$ = normality, $w$ = compound ka mass (g). Sirf ek combination dimensionless banta hai.","s":["$1$ mL of $1\\ce{N}$ acid $\\equiv 0.014\\ \\mathrm{g}$ of nitrogen","$V$ mL $\\times$ $N$ normality $\\Rightarrow$ nitrogen ka mass $=0.014\\times V\\times N$ g","Percentage $=\\dfrac{\\text{nitrogen ka mass}}{\\text{compound ka mass}}\\times100$","$\\%\\,\\ce{N}=\\dfrac{0.014\\,V N}{w}\\times100=\\dfrac{1.4\\,V N}{w}$","Answer: option (2)."],"r":["Numerator me $w$ aa gaya — isse formula ka dimension galat ho jaata hai (percentage nahi banta).","","Denominator me $1.8$ aa gaya; actual factor $1.4$ hai (kyunki $0.014\\times100=1.4$).","$w$ numerator me aur $V$ denominator me — formula ulta ho gaya."],"t":"$\\%\\,\\ce{N}=\\dfrac{1.4\\,V N}{w}$ yaad rakho; yahan $1.4$ ka source $0.014\\times100$ hai, isliye bhoolne par derive kar sakte ho."},{"id":61,"sub":"Chemistry","q":"IUPAC name for the compound shown in the figure:","fig":"<svg viewBox=\"0 0 360 170\" width=\"360\" height=\"170\" role=\"img\" aria-label=\"cyclopentene ring with amide and amino groups\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"170\" fill=\"none\"/><polygon points=\"130.0,50.0 173.7,81.8 157.0,133.2 103.0,133.2 86.3,81.8\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"168.9446936991799\" y1=\"80.2549880306674\" x2=\"152.24469369917992\" y2=\"131.6549880306674\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"178.45530630082007\" y1=\"83.34501196933259\" x2=\"161.75530630082008\" y2=\"134.74501196933258\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"130.0\" y=\"38.0\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CONH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan><\/text><text x=\"91.0\" y=\"153.2\" fill=\"#ffd479\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">NH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan><\/text><text x=\"138\" y=\"102\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">1<\/text><text x=\"187.7\" y=\"75.8\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">2<\/text><text x=\"171.0\" y=\"143.2\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">3<\/text><text x=\"81.0\" y=\"139.2\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">4<\/text><text x=\"64.3\" y=\"77.8\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">5<\/text><text x=\"180\" y=\"150\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">numbering: C<tspan baseline-shift=\"sub\" font-size=\"70%\">1<\/tspan> bears −CONH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>, C<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>=C<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan> is the double bond, −NH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan> at C<tspan baseline-shift=\"sub\" font-size=\"70%\">4<\/tspan><\/text><\/svg>","opt":["4-Amino cyclopent-2-enamide","3-Amino cyclopent-4-enamide","4-Amino cyclopent-2-ene carboxamide","3-Amino cyclopent-4-ene carboxamide"],"ans":2,"c":"Amide $(-\\ce{CONH2})$ ko principal functional group maana jaata hai, isliye ring carbon jis par ye lagaa hai wo carbon-1 hota hai aur suffix 'carboxamide' aata hai (kyunki amide ring par hai, chain par nahi). Ring me double bond ko sabse chhota number dena hota hai — yaani double bond ko 2 ki taraf aur amino group ko zyada se zyada chhota number milna chahiye. Substituted cyclopentane ka naming order: position numbers alphabetical order me substituents ke hisaab se likhte hain.","m":"Pehle principal group se carbon-1 fix karo, phir double bond ki direction chuno jo lowest locants de. Kyun: IUPAC me lowest locant set ka rule hamesha lagta hai, aur functional group ko priority milti hai.","s":["$-\\ce{CONH2}$ principal group hai $\\Rightarrow$ ring carbon attached to it = position 1","Do possible directions: ek me double bond carbon-2–carbon-3 ke beech aur amino carbon-4 par; doosri direction me double bond carbon-3–carbon-4 aur amino carbon-3 par","Isomer name ke liye lowest set chuno: (2-ene, 4-amino) ka set $\\{2,4\\}$ hai","Alphabetical order me 'amino' pehle aata hai, to prefix '4-amino' aage likha jaata hai","Poora naam: 4-aminocyclopent-2-ene carboxamide","Answer: option (3)."],"r":["'cyclopent-2-enamide' tab hota jab amide ring ka hi part hota (ring carbon directly amide carbon ka hissa), par yahan amide ring ke bahar attached hai.","3-amino, 4-ene me double bond ko zyada number mil raha hai — lowest locant rule ka violation.","","3-amino, 4-ene wahi galti hai, bas prefix ka order badla hai."],"t":"Ring + $-\\ce{CONH2}$ ho to suffix 'carboxamide' hota hai, 'amide' nahi. Isi tarah $-\\ce{COOH}$ ke liye 'carboxylic acid', $-\\ce{CHO}$ ke liye 'carbaldehyde'."},{"id":62,"sub":"Chemistry","q":"Match the following Column-I to Column-II. <br>(a) propan-1-ol and propanal (b) butan-1-ol and butan-2-ol (c) ethanol and propan-1-ol (d) butan-1-ol and 2-methylpropan-1-ol <br> Column-II: (i) Position isomers (ii) Chain isomers (iii) Homologues (iv) Functional isomers","fig":"<svg viewBox=\"0 0 340 330\" width=\"340\" height=\"330\" role=\"img\" aria-label=\"four pairs of organic compounds for isomerism matching\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"330\" fill=\"none\"/><text x=\"16\" y=\"24\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(a)<\/text><line x1=\"40\" y1=\"60\" x2=\"70\" y2=\"60\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"60\" x2=\"92\" y2=\"44\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"60\" x2=\"92\" y2=\"76\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"104\" y=\"64\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><text x=\"134\" y=\"64\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">vs<\/text><line x1=\"156\" y1=\"60\" x2=\"186\" y2=\"60\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"186\" y1=\"60\" x2=\"208\" y2=\"44\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"184.23548490697488\" y1=\"62.42620825290957\" x2=\"206.23548490697488\" y2=\"78.42620825290956\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"187.76451509302512\" y1=\"57.57379174709043\" x2=\"209.76451509302512\" y2=\"73.57379174709044\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"214\" y=\"80\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H<\/text><text x=\"16\" y=\"108\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(b)<\/text><line x1=\"40\" y1=\"144\" x2=\"70\" y2=\"144\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"144\" x2=\"96\" y2=\"128\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"96\" y1=\"128\" x2=\"122\" y2=\"144\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"134\" y=\"148\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><text x=\"160\" y=\"148\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">vs<\/text><line x1=\"182\" y1=\"144\" x2=\"212\" y2=\"144\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"212\" y1=\"144\" x2=\"238\" y2=\"128\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"238\" y1=\"128\" x2=\"264\" y2=\"144\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"216\" y=\"128\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><text x=\"16\" y=\"192\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=
