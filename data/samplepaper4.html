\"normal\">(c)<\/text><line x1=\"40\" y1=\"228\" x2=\"70\" y2=\"228\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"228\" x2=\"96\" y2=\"212\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"108\" y=\"232\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><text x=\"134\" y=\"232\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">vs<\/text><line x1=\"156\" y1=\"228\" x2=\"186\" y2=\"228\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"186\" y1=\"228\" x2=\"212\" y2=\"212\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"212\" y1=\"212\" x2=\"238\" y2=\"228\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"250\" y=\"232\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><text x=\"16\" y=\"276\" fill=\"#7fd39a\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(d)<\/text><line x1=\"40\" y1=\"312\" x2=\"70\" y2=\"312\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"312\" x2=\"96\" y2=\"296\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"96\" y1=\"296\" x2=\"122\" y2=\"312\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"134\" y=\"316\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><text x=\"160\" y=\"316\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">vs<\/text><line x1=\"186\" y1=\"312\" x2=\"216\" y2=\"312\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"216\" y1=\"312\" x2=\"240\" y2=\"296\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"296\" x2=\"266\" y2=\"312\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"296\" x2=\"256\" y2=\"280\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"278\" y=\"316\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><\/svg>","opt":["(a) → (iv); (b) → (iii); (c) → (ii); (d) → (i)","(a) → (iv); (b) → (i); (c) → (iii); (d) → (ii)","(a) → (iii); (b) → (ii); (c) → (i); (d) → (iv)","(a) → (iii); (b) → (i); (c) → (ii); (d) → (iv)"],"ans":3,"c":"Isomerism ke types ka matlab samajh lo: functional isomers me functional group badal jaata hai ($\\ce{-OH}$ vs $\\ce{-CHO}$); position isomers me same functional group alag position par hota hai; chain isomers me carbon skeleton (branching) badalta hai; homologues me $\\ce{CH2}$ ka farq hota hai (alag molecular formula).","m":"Har pair ka molecular formula pehle check karo. Agar formula same hai to isomerism ka type dekho; agar ek $\\ce{CH2}$ ka farq hai to homologue hai. Kyun: ye ek test 4 me se 3 pairs turant decide kar deta hai.","s":["(a) propan-1-ol $\\ce{C3H8O}$ aur propanal $\\ce{C3H6O}$: formula same, group $\\ce{-OH}$ vs $\\ce{-CHO}$ $\\Rightarrow$ functional isomers (iv)","(b) butan-1-ol aur butan-2-ol, dono $\\ce{C4H10O}$: $\\ce{-OH}$ ki position badli $\\Rightarrow$ position isomers (i)","(c) ethanol $\\ce{C2H6O}$ aur propan-1-ol $\\ce{C3H8O}$: $\\ce{CH2}$ ka farq $\\Rightarrow$ homologues (iii)","(d) butan-1-ol aur 2-methylpropan-1-ol, dono $\\ce{C4H10O}$: chain branching $\\Rightarrow$ chain isomers (ii)","Mapping: (a)-(iv), (b)-(i), (c)-(iii), (d)-(ii) — option (2)."],"r":["(b) position isomers hain, homologues nahi — dono ka formula $\\ce{C4H10O}$ same hai.","(c) me molecular formula alag hai, isliye position isomerism possible nahi.","(a) functional isomers hain kyunki group hi badal gaya.",""],"t":"Formula same $\\Rightarrow$ isomer; formula me $\\ce{CH2}$ ka farq $\\Rightarrow$ homologue. Ye ek line aadhe organic isomerism questions solve kar deti hai."},{"id":63,"sub":"Chemistry","q":"Which of the following cyclopentane derivative is optically inactive?","fig":"<svg viewBox=\"0 0 360 270\" width=\"360\" height=\"270\" role=\"img\" aria-label=\"four cyclopentane derivatives for optical activity\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"270\" fill=\"none\"/><polygon points=\"58.0,26.0 86.5,46.7 75.6,80.3 40.4,80.3 29.5,46.7\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"58.0\" y1=\"26.0\" x2=\"58.0\" y2=\"4.0\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"58.0\" y=\"-2.0\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><line x1=\"86.5\" y1=\"46.7\" x2=\"86.5\" y2=\"68.7\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"86.5\" y=\"78.7\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H<\/text><line x1=\"40.4\" y1=\"80.3\" x2=\"40.4\" y2=\"58.3\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"40.4\" y=\"52.3\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H<\/text><line x1=\"29.5\" y1=\"46.7\" x2=\"29.5\" y2=\"68.7\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"29.5\" y=\"78.7\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><text x=\"58\" y=\"114\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(1) trans-1,3-diol<\/text><polygon points=\" a3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"86.5\" y=\"212.7\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H<\/text><line x1=\"40.4\" y1=\"214.3\" x2=\"40.4\" y2=\"192.3\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"40.4\" y=\"186.3\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H<\/text><line x1=\"29.5\" y1=\"180.7\" x2=\"29.5\" y2=\"202.7\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"29.5\" y=\"212.7\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan><\/text><text x=\"58\" y=\"248\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(3) trans-1,3-dimethyl<\/text><polygon points=\"236.0,160.0 264.5,180.7 253.6,214.3 218.4,214.3 207.5,180.7\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"236.0\" y1=\"160.0\" x2=\"236.0\" y2=\"138.0\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"236.0\" y=\"132.0\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H<\/text><line x1=\"264.5\" y1=\"180.7\" x2=\"264.5\" y2=\"202.7\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"264.5\" y=\"212.7\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">OH<\/text><line x1=\"218.4\" y1=\"214.3\" x2=\"218.4\" y2=\"192.3\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"218.4\" y=\"186.3\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan><\/text><line x1=\"207.5\" y1=\"180.7\" x2=\"207.5\" y2=\"202.7\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"207.5\" y=\"212.7\" fill=\"#7fd39a\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H<\/text><text x=\"236\" y=\"248\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(4) 1-methyl-3-ol<\/text><\/svg>","opt":["trans-1,3-diol","cis-1,3-diol","trans-1,3-dimethyl","1-methyl-3-ol"],"ans":2,"c":"Optical activity ke liye molecule me chirality honi chahiye — yaani uska mirror image superimposable na ho. Agar molecule me symmetry ka plane (plane of symmetry) ya centre of inversion ho, to wo achiral hota hai aur optically inactive ho jaata hai. Cyclopentane derivatives me cis/trans geometry se symmetry decide hoti hai.","m":"Har structure me plane of symmetry dhoondho. Kyun: plane ya centre of symmetry mil gaya to molecule apne mirror image par superimpose ho jaata hai — optical activity khatam.","s":["trans-1,3-diol: koi plane of symmetry nahi $\\Rightarrow$ chiral $\\Rightarrow$ optically active","cis-1,3-diol: bhi asymmetric (1 aur 3 positions par same group hone par bhi trans/cis ke karan mirror image alag) $\\Rightarrow$ optically active","trans-1,3-dimethylcyclopentane: ring ke centre se guzarta hua plane of symmetry hai (dono $\\ce{CH3}$ ek doosre ke mirror position par) $\\Rightarrow$ achiral","1-methyl-3-ol: do alag groups hain, symmetry nahi $\\Rightarrow$ optically active","Optically inactive = trans-1,3-dimethylcyclopentane — option (3)."],"r":["trans-1,3-diol me symmetry plane nahi hota, isliye wo chiral hai.","cis-1,3-diol bhi chiral hai — cis hone se symmetry plane nahi aa jaata.","","1-methyl-3-ol me do different substituents hain, to koi symmetry element nahi."],"t":"Cyclic compounds me: 1,3- or 1,4- disubstitution jaise 1,4-dimethylcyclohexane me symmetry plane ban jaata hai. cis/trans ka chhota sa farq optical activity badal deta hai."},{"id":64,"sub":"Chemistry","q":"Match the following column. <br>(P) $\\ce{C6H6 + CO ->[HCl][AlCl3] C6H5CHO}$ &#8195; (Q) $\\ce{CH3CH2Br ->[AgF] CH3CH2F}$ &#8195; (R) $\\ce{PhN2Cl ->[Cu2Cl2] Ph-Cl}$ &#8195; (S) $\\ce{Ph-CH3 ->[CrO2Cl2][H3O+] Ph-CHO}$ <br> Column-II: (A) Etard reaction (B) Gattermann-Koch reaction (C) Swarts reaction (D) Sandmeyer reaction","fig":"<svg viewBox=\"0 0 360 236\" width=\"360\" height=\"236\" role=\"img\" aria-label=\"four named reactions table\"><rect x=\"0\" y=\"0\" width=\"360\" height=\"236\" fill=\"none\"/><rect x=\"16\" y=\"10\" width=\"34\" height=\"44\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"33\" y=\"38\" fill=\"#ffd479\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">P<\/text><rect x=\"50\" y=\"10\" width=\"296\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"60\" y=\"30\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">C<tspan baseline-shift=\"sub\" font-size=\"70%\">6H<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">6<\/tspan> + CO  →  C<tspan baseline-shift=\"sub\" font-size=\"70%\">6H<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">5CHO<\/tspan><\/text><text x=\"60\" y=\"48\" fill=\"#7c9cff\" font-size=\"10.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">reagent: HCl / AlCl<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan><\/text><rect x=\"16\" y=\"60\" width=\"34\" height=\"44\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"33\" y=\"88\" fill=\"#ffd479\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Q<\/text><rect x=\"50\" y=\"60\" width=\"296\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"60\" y=\"80\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3CH<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">2Br<\/tspan>  →  CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3CH<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">2F<\/tspan><\/text><text x=\"60\" y=\"98\" fill=\"#7c9cff\" font-size=\"10.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">reagent: AgF<\/text><rect x=\"16\" y=\"110\" width=\"34\" height=\"44\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"33\" y=\"138\" fill=\"#ffd479\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">R<\/text><rect x=\"50\" y=\"110\" width=\"296\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"60\" y=\"130\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">PhN<tspan baseline-shift=\"sub\" font-size=\"70%\">2Cl<\/tspan>  →  Ph-Cl<\/text><text x=\"60\" y=\"148\" fill=\"#7c9cff\" font-size=\"10.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">reagent: Cu<tspan baseline-shift=\"sub\" font-size=\"70%\">2Cl<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan><\/text><rect x=\"16\" y=\"160\" width=\"34\" height=\"44\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"33\" y=\"188\" fill=\"#ffd479\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">S<\/text><rect x=\"50\" y=\"160\" width=\"296\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"60\" y=\"180\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Ph-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>  →  Ph-CHO<\/text><text x=\"60\" y=\"198\" fill=\"#7c9cff\" font-size=\"10.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">reagent: CrO<tspan baseline-shift=\"sub\" font-size=\"70%\">2Cl<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan> / H<tspan baseline-shift=\"sub\" font-size=\"70%\">3O<\/tspan><tspan baseline-shift=\"super\" font-size=\"70%\">+<\/tspan><\/text><text x=\"180\" y=\"224\" fill=\"#9aa3b2\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Column-II: (A) Etard  (B) Gattermann-Koch  (C) Swarts  (D) Sandmeyer<\/text><\/svg>","opt":["P-B, Q-C, R-A, S-D","P-B, Q-D, R-C, S-A","P-C, Q-B, R-D, S-A","P-B, Q-C, R-D, S-A"],"ans":3,"c":"Named reactions yaad rakhne ka tareeka: har reaction ka ek signature reagent hota hai. $\\ce{CO + HCl}$ ke saath $\\ce{AlCl3}$ = Gattermann-Koch (benzene par formyl group); $\\ce{AgF}$/metal fluoride = Swarts (alkyl halide ko alkyl fluoride banane ke liye); diazonium salt + $\\ce{Cu2Cl2}$ = Sandmeyer; $\\ce{CrO2Cl2}$ = Etard (methyl group ko aldehyde me oxidise karna).","m":"Reagent ko identify karo, usse reaction ka naam aayega. Kyun: ye question pure reagent-recall par hai, koi mechanism nahi chahiye.","s":["P: $\\ce{C6H6 + CO + HCl}$ with $\\ce{AlCl3}$ $\\Rightarrow$ Gattermann-Koch reaction (B)","Q: $\\ce{CH3CH2Br}$ with $\\ce{AgF}$ $\\Rightarrow$ Swarts reaction (C)","R: $\\ce{PhN2Cl}$ with $\\ce{Cu2Cl2}$ $\\Rightarrow$ Sandmeyer reaction (D)","S: $\\ce{Ph-CH3}$ with $\\ce{CrO2Cl2}$ then hydrolysis $\\Rightarrow$ Etard reaction (A)","Mapping: P-B, Q-C, R-D, S-A — option (4)."],"r":["R-A/S-D ulte hain: Sandmeyer diazonium ke saath hota hai, Etard $\\ce{CrO2Cl2}$ ke saath.","Q-D galat hai — $\\ce{AgF}$ Sandmeyer ka reagent nahi hai.","P-C galat hai — Gattermann-Koch ka reagent $\\ce{CO/HCl}$ hai, fluorination nahi.",""],"t":"Fluorination ka ek aur naam yaad rakho: Swarts reaction ($\\ce{AgF}$, $\\ce{Hg2F2}$, $\\ce{CoF3}$) — kyunki $\\ce{F2}$ direct use karna dangerous hai."},{"id":65,"sub":"Chemistry","q":"Decreasing order of stability of given carbocation is - <br>(a) tropylium cation&#8195;(b) $\\ce{CH2=CH-CH2^{+}}$&#8195;(c) $\\ce{C6H5-CH2^{+}}$&#8195;(d) $\\ce{CH3-CH^{+}-CH3}$","fig":"<svg viewBox=\"0 0 340 196\" width=\"340\" height=\"196\" role=\"img\" aria-label=\"four carbocations for stability order\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"196\" fill=\"none\"/><polygon points=\"80.0,26.0 106.6,38.8 113.1,67.6 94.8,90.6 65.2,90.6 46.9,67.6 53.4,38.8\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"78.52571954196411\" y1=\"29.06373907685584\" x2=\"105.1257195419641\" y2=\"41.863739076855836\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"81.47428045803589\" y1=\"22.93626092314416\" x2=\"108.07428045803589\" y2=\"35.73626092314416\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"110.43941260232353\" y1=\"65.48309785315307\" x2=\"92.13941260232353\" y2=\"88.48309785315307\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"115.76058739767646\" y1=\"69.71690214684692\" x2=\"97.46058739767646\" y2=\"92.71690214684692\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"67.86058739767647\" y1=\"88.48309785315307\" x2=\"49.56058739767647\" y2=\"65.48309785315307\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"62.53941260232353\" y1=\"92.71690214684692\" x2=\"44.239412602323526\" y2=\"69.71690214684692\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"54.87428045803589\" y1=\"41.863739076855836\" x2=\"81.47428045803589\" y2=\"29.06373907685584\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"51.925719541964106\" y1=\"35.73626092314416\" x2=\"78.52571954196411\" y2=\"22.93626092314416\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"60\" r=\"13\" fill=\"none\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><text x=\"80\" y=\"65\" fill=\"#ffd479\" font-size=\"14\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">+<\/text><text x=\"80\" y=\"112\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(a) tropylium<\/text><text x=\"180\" y=\"52\" fill=\"#dcdfe4\" font-size=\"13\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>=CH-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan><tspan baseline-shift=\"super\" font-size=\"70%\">+<\/tspan><\/text><text x=\"264\" y=\"80\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(b) allyl<\/text><polygon points=\"210.0,114.0 230.8,126.0 230.8,150.0 210.0,162.0 189.2,150.0 189.2,126.0\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"234\" y1=\"138\" x2=\"262\" y2=\"138\" stroke=\"#8b95a8\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><text x=\"268\" y=\"142\" fill=\"#7c9cff\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan><tspan baseline-shift=\"super\" font-size=\"70%\">+<\/tspan><\/text><text x=\"210\" y=\"184\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(c) benzyl<\/text><text x=\"60\" y=\"152\" fill=\"#dcdfe4\" font-size=\"13\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>-CH<tspan baseline-shift=\"super\" font-size=\"70%\">+<\/tspan>-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan><\/text><text x=\"110\" y=\"184\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(d) 2° carbocation<\/text><\/svg>","opt":["a > c > b > d","a > b > c > d","c > a > b > d","c > b > a > d"],"ans":0,"c":"Carbocation ki stability positive charge ke delocalisation par depend karti hai. Aromatic (Hückel) system me charge delocalise ho to bahut zyada stability milti hai; benzyl type me ring ke saath resonance hoti hai; allyl me do structures ki resonance; simple secondary carbocation me sirf hyperconjugation hoti hai.","m":"Har carbocation ke resonance structures ginno aur dekho koi aromatic ring ban raha hai kya. Kyun: aromaticity + resonance structures ki sankhya hi stability ka order deti hai.","s":["(a) tropylium: 7-membered ring, $6\\pi$ electrons, aromatic $\\Rightarrow$ sabse zyada stable","(c) benzyl: ring ke saath resonance, 4 resonance structures $\\Rightarrow$ aromatic se kam, par allyl se zyada","(b) allyl: 2 resonance structures $\\Rightarrow$ benzyl se kam","(d) isopropyl: koi resonance nahi, sirf hyperconjugation ($6$ alpha H) $\\Rightarrow$ sabse kam","Order: a > c > b > d — option (1)."],"r":["","b > c rakhna galat hai: benzyl me extra phenyl ring ki resonance allyl se zyada stability deti hai.","c > a galat hai: tropylium aromatic hai, benzyl se zyada stable.","c > b > a me tropylium ko sabse neeche rakhna bilkul galat hai."],"t":"Stability order rat lo: tropylium (aromatic) > benzyl > allyl ≈ 3° > 2° > 1° > $\\ce{CH3+}$. Aromatic carbocation sabse upar hota hai."},{"id":66,"sub":"Chemistry","q":"$\\ce{CH3-CH2-CH=CH2}$ on treatment with $\\ce{Cl2}$ in the presence of light gives $P$, which on heating with alcoholic $\\ce{KOH}$ gives the major product $Q$. The major product $Q$ is :-","fig":"<svg viewBox=\"0 0 360 170\" " stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"43.34164078649987\" y1=\"140.68328157299976\" x2=\"79.34164078649988\" y2=\"122.68328157299975\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"40.65835921350013\" y1=\"135.31671842700024\" x2=\"76.65835921350012\" y2=\"117.31671842700025\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"123.4569287935359\" y1=\"142.6224718283646\" x2=\"159.4569287935359\" y2=\"122.62247182836461\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"120.5430712064641\" y1=\"137.3775281716354\" x2=\"156.5430712064641\" y2=\"117.37752817163539\" stroke=\"#7c9cff\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"240\" y=\"134\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">delocalised π system<\/text><\/svg>","opt":["$\\ce{CH2=CH-CH=CH2}$ (buta-1,3-diene)","$\\ce{CH3-CH(OH)-CH=CH2}$","$\\ce{CH3-CH(Br)-CH=CH2}$","$\\ce{CH2=CH-CH2-CH=CH2}$"],"ans":0,"c":"Alkene ke saath $\\ce{Cl2}$ aur light ($h\\nu$) free radical substitution deta hai, aur substitution allylic position par hoti hai kyunki allylic radical resonance se stabilised hota hai. Uske baad alcoholic $\\ce{KOH}$ elimination (dehydrohalogenation) karta hai, jisse ek aur double bond ban jaata hai — conjugated diene milta hai.","m":"Do steps: (i) allylic chlorination se P, (ii) $\\mathrm{E2}$ elimination se $Q$. Kyun: allylic position hi sabse reactive C–H hai, aur $\\ce{KOH}$/alcohol hamesha elimination karta hai (aqueous KOH substitution karta).","s":["But-1-ene: $\\ce{CH3-CH2-CH=CH2}$; allylic carbon = $\\ce{CH2}$ adjacent to double bond ($\\ce{CH3-CH2}$ wala carbon)","$h\\nu$ par $\\ce{Cl2}$ allylic H ko replace karta hai: P $=\\ce{CH3-CH(Cl)-CH=CH2}$","Alc. $\\ce{KOH}$ $\\beta$-hydrogen hatata hai $\\Rightarrow$ doosra double bond ban jaata hai","Elimination product: $\\ce{CH2=CH-CH=CH2}$","Ye buta-1,3-diene hai — conjugated system, zyada stable, major product","Answer: option (1)."],"r":["","$\\ce{CH3-CH(OH)-CH=CH2}$ aqueous $\\ce{KOH}$ (substitution) se banta hai, alcoholic se nahi.","$\\ce{CH3-CH(Br)-CH=CH2}$ me $\\ce{Br}$ hai — ye addition product hota hai ($\\ce{HBr}$ addition), yahan reagent $\\ce{Cl2}$ hai.","$\\ce{CH2=CH-CH2-CH=CH2}$ ek carbon zyada hai — starting material me sirf 4 carbon hain."],"t":"Yaad rakho: $\\ce{Cl2}$ + light = allylic substitution; $\\ce{Cl2}$ in dark/$\\ce{CCl4}$ = addition across double bond. Reagent ki condition hi product decide karti hai."},{"id":67,"sub":"Chemistry","q":"In which pair is the 1st species more stable than the 2nd?","fig":"<svg viewBox=\"0 0 400 180\" width=\"400\" height=\"180\" role=\"img\" aria-label=\"four pairs of species for stability comparison\"><rect x=\"0\" y=\"0\" width=\"400\" height=\"180\" fill=\"none\"/><text x=\"10\" y=\"18\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(1)<\/text><text x=\"36\" y=\"18\" fill=\"#dcdfe4\" font-size=\"10\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H−C(=O)−CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan><tspan baseline-shift=\"super\" font-size=\"70%\">-<\/tspan><\/text><text x=\"214\" y=\"18\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">vs<\/text><text x=\"232\" y=\"18\" fill=\"#dcdfe4\" font-size=\"10\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>−C(=O)−O<tspan baseline-shift=\"super\" font-size=\"70%\">-<\/tspan><\/text><text x=\"10\" y=\"46\" fill=\"#9aa3b2\" font-size=\"10\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(2)<\/text><text x=\"36\" y=\"46\" fill=\"#dcdfe4\" font-size=\"10\" art\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(4)<\/text><polygon points=\"70.0,104.0 90.9,119.2 82.9,143.8 57.1,143.8 49.1,119.2\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"70\" y=\"130\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">N<tspan baseline-shift=\"super\" font-size=\"70%\">-<\/tspan><\/text><text x=\"155\" y=\"130\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">vs<\/text><polygon points=\"240.0,104.0 260.9,119.2 252.9,143.8 227.1,143.8 219.1,119.2\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"240\" y=\"130\" fill=\"#7c9cff\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">N<tspan baseline-shift=\"super\" font-size=\"70%\">-<\/tspan><\/text><text x=\"190\" y=\"168\" fill=\"#9aa3b2\" font-size=\"9.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">imide anions (N<tspan baseline-shift=\"super\" font-size=\"70%\">-<\/tspan> dono C=O ke beech)<\/text><\/svg>","opt":["$\\ce{H-C(=O)-CH2^{-}}$ vs $\\ce{CH3-C(=O)-O^{-}}$","$\\ce{CH3-C(=O)-CH^{-}-CH2-C(=O)-CH3}$ vs $\\ce{CH3-C(=O)-CH^{-}-C(=O)-CH3}$","$\\ce{CH3-CH^{-}-C(=O)-CH3}$ vs $\\ce{CH3-CH2-CH^{-}-C(=O)-CH3}$","imide anion with $\\ce{N^{-}}$ between two $\\ce{C=O}$ vs the other imide anion"],"ans":3,"c":"Carbanion/anion ki stability negative charge ke delocalisation par depend karti hai. Jitne zyada electron-withdrawing groups (jaise $\\ce{C=O}$) charge ke paas hon, utna zyada resonance stabilisation milti hai. Do carbonyl ke beech wala carbanion (beta-dicarbonyl) extra stable hota hai, aur imide anion me nitrogen ke dono taraf carbonyl hote hain — charge oxygen par delocalise ho jaata hai.","m":"Har pair me resonance structures aur charge ka delocalisation compare karo. Kyun: anion stability = resonance + inductive effect; dono options me structure ka farq yahi hai.","s":["(1) me pehla species ek aldehyde ka alpha-carbanion hai (kam resonance), doosra acetate jaisa enolate (zyada stable) $\\Rightarrow$ pehla kam stable","(2) me dono dicarbonyl carbanions hain, dono me charge do carbonyl ke beech — barabar/lagbhag same; first 'more stable' nahi","(3) me dono ek hi tarah ke ketone carbanions hain, sirf chain length alag — first zyada stable nahi","(4) imide anion: nitrogen ke dono taraf $\\ce{C=O}$ $\\Rightarrow$ charge oxygen par delocalise, dono carbonyl se stabilisation","Pair (4) me pehla species (five-membered, dono $\\ce{C=O}$ ke beech $\\ce{N^-}$) zyada resonance-stabilised hai","Answer: option (4)."],"r":["Yahan doosra species (acetate-type enolate) zyada stable hai, pehla nahi.","Dono dicarbonyl carbanions me koi bada farq nahi — '1st more stable' prove nahi hota.","Chain length badhne se stability ka koi clear reason nahi — is pair me first zyada stable nahi.",""],"t":"Anion stability ka rule: charge ke paas jitne zyada $\\ce{C=O}$, $\\ce{-NO2}$, $\\ce{-CN}$ jaisae EWG honge, utna zyada stable. Do carbonyl ke beech ka carbanion sabse stable hota hai."},{"id":68,"sub":"Chemistry","q":"Assertion: p-Nitrophenol is a stronger acid than o-nitrophenol. <br>Reason: Intramolecular hydrogen bonding makes the o-isomer weaker acid than p-isomer.","opt":["Both Assertion and Reason are true and Reason is the correct explanation of Assertion","Both Assertion and Reason are true but Reason is not the correct explanation of Assertion","Assertion is true but Reason is false","Both Assertion and Reason are false"],"ans":0,"c":"Phenol ki acidity is baat par depend karti hai ki phenoxide ion kitna stable hai. $\\ce{-NO2}$ group electron-withdrawing hai, isliye phenoxide par negative charge delocalise karke stability badhata hai. o-Nitrophenol me $\\ce{-OH}$ aur $\\ce{-NO2}$ ke beech intramolecular hydrogen bonding hoti hai, jo $\\ce{O-H}$ bond ko thoda strong bana deti hai aur proton release karna mushkil karti hai.","m":"Do cheezein check karo: assertion (kaun zyada acidic?) aur reason (kya wajah sahi hai?). Kyun: reason asal me assertion ki hi explanation hai — dono ko alag-alag verify karo.","s":["p-Nitrophenol me $\\ce{-NO2}$ para position par hai $\\Rightarrow$ phenoxide ion par $-M$ effect se negative charge delocalise $\\Rightarrow$ zyada stable","o-Nitrophenol me intramolecular H-bonding se $\\ce{OH}$ ka proton 'pakda' hua rehta hai","Isliye o-nitrophenol ka deprotonation mushkil $\\Rightarrow$ kam acidic","Data: p-nitrophenol ka $\\mathrm{p}K_a\\approx7.15$, o-nitrophenol ka $\\approx7.23$ — p zyada acidic ✓","Assertion true, reason sahi wajah bata raha hai $\\Rightarrow$ option (1)."],"r":["","Reason asal me assertion ki hi wajah hai — intramolecular H-bonding hi acidity ka farq banati hai.","Reason sach hai, isliye 'reason false' wala option galat.","Assertion sach hai: p-nitrophenol zyada acidic hai."],"t":"Ortho isomers me intramolecular H-bonding ho sakti hai, isliye unki acidity/solubility para isomers se alag hoti hai. Ye pattern salicylic acid jaise questions me bhi aata hai."},{"id":69,"sub":"Chemistry","q":"$\\ce{Ph-C#C-CH3 ->[Hg^{2+}][H3O+] A}$ ; Here 'A' is:","fig":"<svg viewBox=\"0 0 340 160\" width=\"340\" height=\"160\" role=\"img\" aria-label=\"hydration of an alkyne giving a ketone\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"160\" fill=\"none\"/><text x=\"20\" y=\"26\" fill=\"#dcdfe4\" font-size=\"13\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Ph-C≡C-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan><\/text><text x=\"56\" y=\"48\" fill=\"#ffd479\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Hg<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>(2+) / H<tspan baseline-shift=\"sub\" font-size=\"70%\">3O<\/tspan><tspan baseline-shift=\"super\" font-size=\"70%\">+<\/tspan><\/text><line x1=\"150\" y1=\"22\" x2=\"200\" y2=\"22\" stroke=\"#7fd39a\" stroke-width=\"1.8\" marker-end=\"url(#ah)\"/><text x=\"210\" y=\"26\" fill=\"#7fd39a\" font-size=\"13\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">A<\/text><text x=\"20\" y=\"88\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Markovnikov addition of water to the alkyne gives a ketone:<\/text><text x=\"40\" y=\"122\" fill=\"#7c9cff\" font-size=\"13\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Ph-C(OH)=CH-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan><\/text><line x1=\"160\" y1=\"118\" x2=\"200\" y2=\"118\" stroke=\"#7fd39a\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"208\" y=\"122\" fill=\"#7fd39a\" font-size=\"13\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Ph-C(=O)-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan><\/text><text x=\"40\" y=\"148\" fill=\"#9aa3b2\" font-size=\"10.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">enol (unstable)<\/text><text x=\"208\" y=\"148\" fill=\"#7fd39a\" font-size=\"10.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">propiophenone<\/text><\/svg>","opt":["$\\ce{Ph-C(=O)-CH2-CH3}$","$\\ce{Ph-CH2-C(=O)-CH3}$","$\\ce{Ph-C(OH)=CH-CH3}$","$\\ce{Ph-CH(OH)-CH2-CH3}$"],"ans":0,"c":"Alkyne par $\\ce{Hg^{2+}}$ ki catalysis me paani ka addition hota hai — ye Markovnikov addition hai. Markovnikov ka rule: proton us carbon par jaata hai jahan pehle se zyada hydrogen hai, isliye $\\ce{OH}$ doosre (zyada substituted) carbon par lagta hai. Pehle enol banta hai jo turant keto form me tautomerise ho jaata hai.","m":"Markovnikov addition + keto-enol tautomerism. Kyun: alkyne hydration ka final product hamesha ketone hota hai (terminal alkyne ke case me aldehyde), enol unstable hota hai.","s":["$\\ce{Ph-C#C-CH3}$: internal alkyne, do carbons — ek par $\\ce{Ph}$, doosre par $\\ce{CH3}$","$\\ce{Hg^{2+}/H3O+}$ se $\\ce{H2O}$ add hota hai; $\\ce{H}$ us carbon par jaata hai jahan zyada H hai ($\\ce{C-CH3}$ side)","Intermediate enol: $\\ce{Ph-C(OH)=CH-CH3}$ (A se pehle ka stage)","Enol tautomerise hokar ketone banata hai: $\\ce{Ph-C(=O)-CH2-CH3}$","Answer: option (1)."],"r":["","$\\ce{Ph-CH2-C(=O)-CH3}$ anti-Markovnikov product hai — yahan Markovnikov lagta hai.","$\\ce{Ph-C(OH)=CH-CH3}$ enol hai — ye intermediate hai, final product nahi (keto form zyada stable).","$\\ce{Ph-CH(OH)-CH2-CH3}$ alkyne ke hydration ka product nahi (ye reduction ka product hota)."],"t":"Alkyne hydration ka yaad rakhne wala rule: internal alkyne $\\to$ ketone, terminal alkyne ($\\ce{R-C#CH}$) $\\to$ aldehyde, aur anti-Markovnikov chahiye to hydroboration ($\\ce{BH3}$/$\\ce{H2O2}$) use karo."},{"id":70,"sub":"Chemistry","q":"Predict the correct reactivity of the compounds towards $\\mathrm{S_N1}$ reaction -","opt":["$\\ce{C6H5-CH2-Br}<\\ce{C6H5-CH(CH3)Br}<(\\ce{C6H5})2\\ce{CH-Br}<(\\ce{C6H5})2\\ce{C(CH3)Br}$","$\\ce{C6H5-CH(CH3)Br}<\\ce{C6H5-CH2-Br}<(\\ce{C6H5})2\\ce{CH-Br}<(\\ce{C6H5})2\\ce{C(CH3)Br}$","$(\\ce{C6H5})2\\ce{CH-Br}<\\ce{C6H5-CH(CH3)Br}<\\ce{C6H5-CH2-Br}<(\\ce{C6H5})2\\ce{C(CH3)Br}$","$(\\ce{C6H5})2\\ce{C(CH3)Br}<(\\ce{C6H5})2\\ce{CH-Br}<\\ce{C6H5-CH(CH3)Br}<\\ce{C6H5-CH2-Br}$"],"ans":0,"c":"$\\mathrm{S_N1}$ reaction ka rate carbocation intermediate ki stability par depend karta hai (rate-determining step carbocation ka banna hai). Benzylic carbocations resonance se stabilised hote hain; jitne zyada phenyl groups (resonance) aur alkyl groups (hyperconjugation) ho, utna zyada stable carbocation aur utna fast $\\mathrm{S_N1}$.","m":"Har molecule ke carbocation ki stability compare karo: 1° benzyl < 2° benzyl < 2° diphenylmethyl < 3° (diphenyl + methyl). Kyun: $\\mathrm{S_N1}$ ka rate = carbocation stability.","s":["$\\ce{C6H5-CH2-Br}$: benzyl cation (1° benzylic), resonance se stable","$\\ce{C6H5-CH(CH3)Br}$: 2° benzylic — ek phenyl + ek methyl $\\Rightarrow$ zyada stable","$(\\ce{C6H5})2\\ce{CH-Br}$: diphenylmethyl — do phenyl resonance $\\Rightarrow$ bahut stable","$(\\ce{C6H5})2\\ce{C(CH3)Br}$: diphenyl + methyl $\\Rightarrow$ do phenyl resonance + hyperconjugation $\\Rightarrow$ sabse stable","Rate order: 1° benzyl < 2° benzyl < diphenylmethyl < diphenylmethyl+Me — option (1)."],"r":["","2° benzyl ko 1° benzyl se kam reactive dikhana galat hai — do methyl/phenyl hone se carbocation zyada stable hota hai.","Bilkul ulta order hai: jitna zyada substituted, utna fast $\\mathrm{S_N1}$.","Ye decreasing order hai; question increasing reactivity maang raha hai."],"t":"$\\mathrm{S_N1}$ = stability of carbocation (3° > 2° > 1°, benzylic/allylic extra), $\\mathrm{S_N2}$ = steric hindrance (1° > 2° > 3°). Dono trends ulti hoti hain — confuse mat karo."},{"id":71,"sub":"Chemistry","q":"When benzene is treated with $\\ce{CO}$ and $\\ce{HCl}$ in presence of anhydrous aluminium chloride, benzaldehyde is formed. This reaction is known as","opt":["Friedel-Crafts reaction","Rosenmund reaction","Stephen reaction","Gattermann Koch reaction"],"ans":3,"c":"Benzene ring par formyl group ($\\ce{-CHO}$) lagane ke kai naam hain, aur unhe reagents se pehchaano: $\\ce{CO + HCl}$ with $\\ce{AlCl3}$ = Gattermann-Koch; $\\ce{HCN + HCl}$ with $\\ce{AlCl3}$ = Gattermann; $\\ce{SnCl2/HCl}$ = Stephen (nitrile se aldehyde); $\\ce{Pd/BaSO4}$ + $\\ce{H2}$ = Rosenmund (acid chloride se aldehyde).","m":"Reagent ko naam se match karo — yahan $\\ce{CO/HCl/AlCl3}$ hai. Kyun: ye pure recall question hai, mechanism se option filter nahi hoga.","s":["Reagents: $\\ce{C6H6 + CO + HCl}$ with anhydrous $\\ce{AlCl3}$","$\\ce{CO}$ aur $\\ce{HCl}$ mil kar formyl group dete hain ($\\ce{H-C(=O)Cl}$ jaisa species)","$\\ce{AlCl3}$ Lewis acid catalyst ka kaam karta hai","Product: benzaldehyde $\\ce{C6H5CHO}$","Ye Gattermann-Koch reaction hai — option (4)."],"r":["Friedel-Crafts me alkyl ya acyl halide ($\\ce{CH3Cl}$, $\\ce{CH3COCl}$) use hote hain, $\\ce{CO/HCl}$ nahi.","Rosenmund reduction me acid chloride ko $\\ce{Pd/BaSO4}$ par hydrogenate karke aldehyde banate hain.","Stephen reaction me nitrile ko $\\ce{SnCl2/HCl}$ se aldehyde banate hain.",""],"t":"Char formyl reactions yaad rakho: Gattermann-Koch ($\\ce{CO/HCl}$), Gattermann ($\\ce{HCN/HCl}$), Etard ($\\ce{CrO2Cl2}$), Rosenmund (reduction) — NEET har saal inhi me se ek poochhta hai."},{"id":72,"sub":"Chemistry","q":"Which of the following statements are correct for glucose:- <br>(1) It gives positive test with Schiff's reagent (2) It reacts with $\\ce{NaHSO3}$ and $\\ce{NH3}$ (3) It gives positive test with 2,4-DNP (4) It gives positive test with Fehling solution","opt":["only (1)","only (2)","only (3)","only (4)"],"ans":3,"c":"Glucose ek aldohexose hai, par uske open-chain aldehyde form ki concentration bahut kam hoti hai kyunki wo cyclic hemiacetal form me rehta hai. Isliye kuch reagent (jo free $\\ce{-CHO}$ ke liye specific hain) glucose ke saath positive nahi dete, par weak oxidising agents (Fehling's, Tollens) positive dete hain.","m":"Har test ki specificity check karo: Schiff's aur $\\ce{NaHSO3}$ free aldehyde ke liye sensitive hain, Fehling's ke liye mild oxidation kaafi hai. Kyun: glucose ka cyclic form aldehyde ko 'chhupa' deta hai.","s":["Glucose ka open chain: $\\ce{CHO-(CHOH)4-CH2OH}$; ring form me ye hemiacetal ban jaata hai","Schiff's reagent test: glucose negative deta hai (free $\\ce{-CHO}$ bahut kam)","$\\ce{NaHSO3}$ addition: glucose ke saath nahi hota (NaHSO3 aldehyde ke saath bisulphite add hota hai, par glucose ke case me nahi)","2,4-DNP: ketones/aldehydes ke liye, par glucose ke case me ye standard correct statement nahi maana jaata","Fehling's solution: glucose positive test deta hai (mild oxidation $\\ce{-CHO}$ ko $\\ce{-COOH}$ banata hai, $\\ce{Cu^{2+}}$ red $\\ce{Cu2O}$)","Correct: only (4)."],"r":["Glucose Schiff's reagent ke saath positive nahi deta — cyclic form me aldehyde masked hai.","$\\ce{NaHSO3}$ ke saath glucose nahi judta; ye test free aldehydes ke liye hai.","2,4-DNP glucose ke liye diye gaye options me correct statement nahi hai; standard answer Fehling's hai.",""],"t":"Yaad rakho: glucose Fehling's aur Tollens dono positive deta hai, par Schiff's aur $\\ce{NaHSO3}$ ke saath negative — kyunki cyclic hemiacetal form dominant hai."},{"id":73,"sub":"Chemistry","q":"Which is maximum reactive towards nucleophile?","opt":["$\\ce{CH3CONH2}$","$\\ce{CH3COOCH3}$","$\\ce{CH3COCl}$","$\\ce{CH3COOC2H5}$"],"ans":2,"c":"Acid derivatives me nucleophilic acyl substitution ka rate leaving group ki ability par depend karta hai. Achha leaving group wo hota hai jo protonated hokar stable anion bane — yani weak base. $\\ce{Cl-}$ bahut weak base hai (HCl strong acid), isliye acid chloride sabse reactive hota hai. Amide me $\\ce{NH2-}$ bahut strong base hai, isliye amide sabse kam reactive.","m":"Leaving group ki basicity compare karo: kam basic =better leaving = zyada reactive. Kyun: nucleophilic acyl substitution me pehla step addition, doosra elimination (leaving group ka jaana) — elimination hi rate determine karta hai.","s":["Order of leaving group ability: $\\ce{Cl^-}>\\ce{-OCOCH3}>\\ce{-OR}>\\ce{-NH2}$","$\\ce{-NH2}$ sabse strong base $\\Rightarrow$ sabse kharab leaving group $\\Rightarrow$ amide least reactive","$\\ce{CH3COCl}$ me $\\ce{Cl-}$ weak base hai aur resonance se $\\ce{-Cl}$ ka lone pair donation bhi kam hota hai","Isliye acid chloride sabse reactive: hydrolysis, alcoholysis, ammonolysis sab fast","Answer: $\\ce{CH3COCl}$ — option (3)."],"r":["Amide sabse kam reactive hota hai kyunki $\\ce{NH2-}$ strong base hai aur nitrogen ka lone pair resonance se carbonyl ko stabilise karta hai.","Ester acid chloride se kam reactive hota hai ($\\ce{-OCH3}$ chloride se better base).","","Ethyl ester bhi ester hi hai — acid chloride se kam reactive."],"t":"Reactivity order rat lo: acid chloride > anhydride > ester > amide. Isi order me leaving group ki basicity badhti hai."},{"id":74,"sub":"Chemistry","q":"$\\ce{CH3-CH2-Br ->[KCN] A ->[H2O/H^{+},\\ \\Delta] B ->[NH3,\\ \\Delta] C ->[Br2/KOH] D}$; Product 'D' is :-","fig":"<svg viewBox=\"0 0 350 202\" width=\"350\" height=\"202\" role=\"img\" aria-label=\"four step organic conversion sequence\"><rect x=\"0\" y=\"0\" width=\"350\" height=\"202\" fill=\"none\"/><rect x=\"10\" y=\"20\" width=\"118\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"69\" y=\"40\" fill=\"#dcdfe4\" font-size=\"11.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>-Br<\/text><line x1=\"130\" y1=\"35\" x2=\"196\" y2=\"35\" stroke=\"#7fd39a\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"163\" y=\"28\" fill=\"#ffd479\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">KCN<\/text><rect x=\"200\" y=\"20\" width=\"140\" height=\"30\" rx=\"6\" fill=\"#17281d\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"270\" y=\"40\" fill=\"#7fd39a\" font-size=\"11.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">A = CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>-CN<\/text><rect x=\"10\" y=\"64\" width=\"118\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"69\" y=\"84\" fill=\"#dcdfe4\" font-size=\"11.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">A<\/text><line x1=\"130\" y1=\"79\" x2=\"196\" y2=\"79\" stroke=\"#7fd39a\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"163\" y=\"72\" fill=\"#ffd479\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">H<tspan baseline-shift=\"sub\" font-size=\"70%\">2O<\/tspan> / H<tspan baseline-shift=\"super\" font-size=\"70%\">+<\/tspan> , Δ<\/text><rect x=\"200\" y=\"64\" width=\"140\" height=\"30\" rx=\"6\" fill=\"#17281d\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"270\" y=\"84\" fill=\"#7fd39a\" font-size=\"11.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">B = CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>-COOH<\/text><rect x=\"10\" y=\"108\" width=\"118\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"69\" y=\"128\" fill=\"#dcdfe4\" font-size=\"11.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">B<\/text><line x1=\"130\" y1=\"123\" x2=\"196\" y2=\"123\" stroke=\"#7fd39a\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"163\" y=\"116\" fill=\"#ffd479\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">NH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan> , Δ<\/text><rect x=\"200\" y=\"108\" width=\"140\" height=\"30\" rx=\"6\" fill=\"#17281d\" stroke=\"#7fd39a\" stroke-width=\"1.6\"/><text x=\"270\" y=\"128\" fill=\"#7fd39a\" font-size=\"11.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">C = CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>-CONH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan><\/text><rect x=\"10\" y=\"152\" width=\"118\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"69\" y=\"172\" fill=\"#dcdfe4\" font-size=\"11.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">C<\/text><line x1=\"130\" y1=\"167\" x2=\"196\" y2=\"167\" stroke=\"#7fd39a\" stroke-width=\"1.7\" marker-end=\"url(#ah)\"/><text x=\"163\" y=\"160\" fill=\"#ffd479\" font-size=\"10.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Br<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan> / KOH<\/text><rect x=\"200\" y=\"152\" width=\"140\" height=\"30\" rx=\"6\" fill=\"#2a2318\" stroke=\"#ffd479\" stroke-width=\"1.6\"/><text x=\"270\" y=\"172\" fill=\"#ffd479\" font-size=\"11.5\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">D = ?<\/text><\/svg>","opt":["$\\ce{CH3-NH2}$","$\\ce{CH3-CH2-NH2}$","$\\ce{CH3-CH3}$","$\\ce{CH4}$"],"ans":1,"c":"Ye ek chain-length building sequence hai: (i) $\\ce{KCN}$ se ek carbon badh jaata hai aur nitrile banta hai, (ii) hydrolysis se carboxylic acid, (iii) amide, (iv) $\\ce{Br2/KOH}$ (Hofmann bromamide) se ek carbon kam ho jaata hai aur amine banti hai. Hofmann rearrangement me carbonyl carbon hat jaata hai, isliye carbon count ek kam ho jaata hai.","m":"Har step ka reagent pehchano aur carbon count track karo. Kyun: carbon count hi is question ka asli test hai — $\\ce{KCN}$ se $+1$, Hofmann se $-1$.","s":["$\\ce{CH3-CH2-Br + KCN -> CH3-CH2-CN}$ (A): carbon $2\\to3$, nitrile","Hydrolysis: $\\ce{CH3-CH2-COOH}$ (B): propanoic acid, carbon $3$","$\\ce{NH3}$ + heat: $\\ce{CH3-CH2-CONH2}$ (C): propanamide, carbon $3$","$\\ce{Br2/KOH}$ (Hofmann): $\\ce{CH3-CH2-CONH2 -> CH3-CH2-NH2 + CO3^{2-}}$","Carbon $3\\to2$: ethylamine banti hai","Answer: $\\ce{CH3-CH2-NH2}$ — option (2)."],"r":["$\\ce{CH3-NH2}$ tab aata agar starting material $\\ce{CH3Br}$ hota (carbon count ek kam).","","$\\ce{CH3-CH3}$ reduction product hai ($\\ce{Zn/Hg + HCl}$ type), Hofmann ka product nahi.","$\\ce{CH4}$ me carbon count bilkul galat ho jaata hai."],"w":["Hofmann bromamide reaction me amine ka carbon count amide se ek kam hota hai — ye step NEET me alag se poochha jaata hai."],"t":"Chain badhane ka reagent: $\\ce{KCN}$ (ek carbon add). Chain ghatane ka reagent: $\\ce{Br2/KOH}$ (Hofmann, ek carbon remove). Dono ko saath yaad rakho."},{"id":75,"sub":"Chemistry","q":"Which of the following will not react with $\\ce{NaHSO3}$ :-","fig":"<svg viewBox=\"0 0 350 180\" width=\"350\" height=\"180\" role=\"img\" aria-label=\"four carbonyl compounds for NaHSO3 test\"><rect x=\"0\" y=\"0\" width=\"350\" height=\"180\" fill=\"none\"/><text x=\"16\" y=\"24\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(1)  Ph-CHO  (benzaldehyde)<\/text><text x=\"16\" y=\"54\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(2)  CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>-O-C<tspan baseline-shift=\"sub\" font-size=\"70%\">6H<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">4<\/tspan>-CHO  (anisaldehyde)<\/text><text x=\"16\" y=\"84\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(3)  CH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>-C<tspan baseline-shift=\"sub\" font-size=\"70%\">6H<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">4<\/tspan>-CH<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>-C(=O)-Ph  (ketone)<\/text><text x=\"16\" y=\"114\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(4)  cyclohexane-CHO  (cyclic aldehyde)<\/text><text x=\"16\" y=\"150\" fill=\"#9aa3b2\" font-size=\"10.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Dhyan se dekho: (1), (2), (4) aldehydes hain;<\/text><text x=\"16\" y=\"168\" fill=\"#9aa3b2\" font-size=\"10.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">(3) ek ketone hai — NaHSO<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan> sirf aldehyde / methyl ketone se judta hai.<\/text><\/svg>","opt":["$\\ce{Ph-CHO}$","$\\ce{CH3-O-C6H4-CHO}$","$\\ce{CH3-C6H4-CH2-C(=O)-Ph}$","cyclohexanecarbaldehyde"],"ans":2,"c":"Sodium bisulphite ($\\ce{NaHSO3}$) aldehydes aur **methyl ketones** ke saath nucleophilic addition karke crystalline bisulphite adduct deta hai. Bade ketones (jaise aryl alkyl ketones) ke saath ye reaction steric hindrance aur kam electrophilicity ke karan nahi hota. Isliye test se aldehydes aur methyl ketones ko doosre carbonyls se alag karte hain.","m":"Har option me carbonyl ka type dekho: aldehyde hai ya methyl ketone, ya bada ketone. Kyun: $\\ce{NaHSO3}$ ka rule specifically 'aldehyde + methyl ketone' hai.","s":["$\\ce{Ph-CHO}$: aromatic aldehyde $\\Rightarrow$ reaction hota hai (adduct banta hai)","Anisaldehyde ($\\ce{CH3-O-C6H4-CHO}$): aldehyde $\\Rightarrow$ reaction hota hai","$\\ce{CH3-C6H4-CH2-C(=O)-Ph}$: ye ek aryl benzyl ketone hai — na methyl ketone, na aldehyde, aur bulky $\\Rightarrow$ reaction nahi hota","Cyclohexanecarbaldehyde: aldehyde $\\Rightarrow$ reaction hota hai","Answer: option (3)."],"r":["Aldehyde hai, isliye $\\ce{NaHSO3}$ ke saath adduct banata hai.","Ye bhi aldehyde hai — reaction hota hai.","","Cyclohexanecarbaldehyde aldehyde hai, isliye react karta hai."],"t":"$\\ce{NaHSO3}$ test ka scope yaad rakho: sab aldehydes + aliphatic methyl ketones ($\\ce{CH3-CO-R}$). Aryl methyl ketones jaise acetophenone bhi react karte hain, par bade ketones nahi."},{"id":76,"sub":"Chemistry","q":"Third excitation energy of $\\ce{Li^{2+}}$ ion is","opt":["$108.81\\ \\mathrm{eV}$","$114.75\\ \\mathrm{eV}$","$51\\ \\mathrm{eV}$","$48.36\\ \\mathrm{eV}$"],"ans":1,"c":"$\\ce{Li^{2+}}$ hydrogen jaisa ion hai ($Z=3$, ek electron). Excitation energy ka matlab ground state se kisi excited state tak ki energy difference. 'Third excitation energy' ka matlab ground state ($n=1$) se teesri excited state tak ka jump — counting me $n=1\\to2$ pehli excitation, $1\\to3$ doosri, $1\\to4$ teesri. Isliye $n=1\\to n=4$ lena hai.","m":"$\\Delta E=13.6Z^{2}\\left(\\dfrac{1}{1^{2}}-\\dfrac{1}{n^{2}}\\right)$ lagao with $n=4$. Kyun: 'third excitation' ka matlab hi $n=1\\to4$ transition hai — ye counting sabse badi trap hai.","s":["$\\ce{Li^{2+}}$: $Z=3$, hydrogen-like","Excitation counting: 1st $=n=2$, 2nd $=n=3$, 3rd $=n=4$","$\\Delta E=13.6\\times Z^{2}\\left(\\dfrac{1}{1^{2}}-\\dfrac{1}{4^{2}}\\right)$","$=13.6\\times9\\times\\left(1-\\dfrac{1}{16}\\right)$","$=13.6\\times9\\times\\dfrac{15}{16}=\\dfrac{1836}{16}=114.75\\ \\mathrm{eV}$","Answer: $114.75\\ \\mathrm{eV}$ — option (2)."],"r":["$108.81\\ \\mathrm{eV}$ tab aata hai agar $n=3$ (doosri excitation) lein: $13.6\\times9\\times\\frac89=108.8$.","","$51\\ \\mathrm{eV}$ bina $Z^2$ factor ke approximate value hai (hydrogen ke liye $n=4$ par $\\sim12.75$; ye kuch aur hai).","$48.36\\ \\mathrm{eV}$ kisi bhi standard combination se nahi aata."],"w":["'Third excitation energy' ko third energy level ($n=3$) mat samajhna — excitation count $n=2$ se shuru hota hai. Isliye third excitation $n=4$ par jaata hai."],"t":"$Z^2$ factor ko pehle nikaal lo: $\\ce{Li^{2+}}$ ke liye $13.6\\times9=122.4\\ \\mathrm{eV}$ (ionisation energy). Uske baad $1-\\frac{1}{n^2}$ se har level ki energy mil jaati hai."},{"id":77,"sub":"Chemistry","q":"Which of the following statements regarding an orbital is correct :-","opt":["An orbital is a definite trajectory around the nucleus in which electron can move","An orbital always has spherical trajectory","It is the region around the nucleus where there is $90\\%$ to $100\\%$ probability of finding all electrons in an atom","An orbital is characterised by the three distinct quantum numbers $n$, $\\ell$ and $m$"],"ans":3,"c":"Quantum mechanics me orbital ek definite path nahi hai — ye space ka wo region hai jahan electron milne ki probability high hoti hai (usually max probability region). Heisenberg ke uncertainty principle ke karan trajectory ki baat hi nahi hoti. Ek orbital ko teen quantum numbers $n$, $\\ell$ aur $m$ se poora describe kiya jaata hai; chautha number $s$ electron ke spin ka hota hai, orbital ka nahi.","m":"Har statement ko quantum mechanical model se check karo. Kyun: 'trajectory' jaise classical words hi galat option ka signal hote hain.","s":["Statement 1: 'definite trajectory' — Bohr model ki bhasa hai, quantum mechanics me galat ✗","Statement 2: sirf $s$-orbital spherical hota hai; $p$, $d$, $f$ orbitals alag shapes ke hote hain ✗","Statement 3: 'all electrons' galat hai — ek orbital me maximum 2 electrons hote hain ✗","Statement 4: ek orbital $n$, $\\ell$, $m$ teenon se uniquely define hota hai ✓","Answer: option (4)."],"r":["Orbital trajectory nahi hoti — probability distribution hoti hai (uncertainty principle).","Sirf $s$-orbital spherical hai; $p$ dumbbell, $d$ double dumbbell hote hain.","Ek orbital me maximum 2 electrons aa sakte hain, 'all electrons' nahi.",""],"t":"Orbital = 3 quantum numbers ($n,\\ell,m$), electron = 4 quantum numbers ($n,\\ell,m,s$). Ye farq ek line me clear kar lo."},{"id":78,"sub":"Chemistry","q":"Value of equilibrium constant $(K_P)$ for a reaction $\\ce{A(g) <=> 2B(g)}$ is $0.0005\\ \\mathrm{atm}$. What does it indicate? <br>(I) Products are more stable than reactants. (II) Reactants are very less dissociated. (III) Reactants are more stable than products. (IV) Value of $K_C$ will be less than $K_P$ at $300\\ \\mathrm{K}$.","opt":["II and III","III and IV","II, III and IV","I, II, III and IV"],"ans":2,"c":"$K_P$ ki chhoti value ka matlab hai equilibrium reactant side par jhuka hua hai — reactants zyada stable hain aur kam dissociate hote hain. $K_P$ aur $K_C$ ka relation: $K_P=K_C(RT)^{\\Delta n}$. Yahan $\\Delta n=2-1=1$ positive hai, isliye $K_P=K_C(RT)$ aur $K_C=\\dfrac{K_P}{RT}$, jo $K_P$ se chhoti hogi (RT>1).","m":"Do hisse: (i) $K$ ki magnitude se stability, (ii) $K_P$–$K_C$ relation se value compare. Kyun: question me dono concepts test ho rahe hain, options bhi combine kiye gaye hain.","s":["$K_P=0.0005\\ll 1$ $\\Rightarrow$ equilibrium me reactants zyada $\\Rightarrow$ reactants zyada stable (III ✓)","$K_P$ chhota $\\Rightarrow$ dissociation bahut kam (II ✓)","$K_P$ chhota hai to products zyada stable nahi ho sakte (I ✗)","$\\Delta n=2-1=1$; $K_P=K_C(RT)^{1}$","$K_C=\\dfrac{K_P}{RT}=\\dfrac{0.0005}{0.0821\\times300}$, jo $K_P$ se chhoti hai (IV ✓)","Correct: II, III and IV — option (3)."],"r":["IV bhi sahi hai ($K_C<K_P$), isliye sirf II aur III chunna adhoora hai.","II bhi sahi hai — reactants kam dissociate hote hain.","","(I) galat hai: $K$ chhota matlab products kam stable, zyada nahi."],"t":"$K_P=K_C(RT)^{\\Delta n}$ — agar $\\Delta n>0$ to $K_P>K_C$; $\\Delta n<0$ to $K_P<K_C$; $\\Delta n=0$ to $K_P=K_C$."},{"id":79,"sub":"Chemistry","q":"The mass of $\\ce{Mg3N2}$ produced if $48\\ \\mathrm{g}$ of $\\ce{Mg}$ metal is reacted with $34\\ \\mathrm{g}$ of $\\ce{NH3}$ gas is <br>$\\ce{3Mg + 2NH3 -> Mg3N2 + 3H2}$","fig":"<svg viewBox=\"0 0 340 124\" width=\"340\" height=\"124\" role=\"img\" aria-label=\"chemical equation for magnesium nitride formation\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"124\" fill=\"none\"/><text x=\"20\" y=\"30\" fill=\"#dcdfe4\" font-size=\"13\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">3Mg + 2NH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan> → Mg<tspan baseline-shift=\"sub\" font-size=\"70%\">3N<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan> + 3H<tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan><\/text><text x=\"20\" y=\"56\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">48 g      34 g      ?<\/text><text x=\"20\" y=\"80\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">moles:  2 mol     2 mol<\/text><text x=\"20\" y=\"108\" fill=\"#7c9cff\" font-size=\"11.5\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">M(Mg) = 24,  M(NH<tspan baseline-shift=\"sub\" font-size=\"70%\">3<\/tspan>) = 17,  M(Mg<tspan baseline-shift=\"sub\" font-size=\"70%\">3N<\/tspan><tspan baseline-shift=\"sub\" font-size=\"70%\">2<\/tspan>) = 100<\/text><\/svg>","opt":["$\\dfrac{200}{3}\\ \\mathrm{g}$","$\\dfrac{100}{3}\\ \\mathrm{g}$","$\\dfrac{400}{3}\\ \\mathrm{g}$","$\\dfrac{150}{3}\\ \\mathrm{g}$"],"ans":0,"c":"Stoichiometry ka pehla step: dono reactants ke moles nikaalo, balanced equation ke coefficients se compare karke limiting reagent dhundo. Uske baad sirf limiting reagent se product ka mass nikaalo — excess reagent ka hisaab nahi lagta.","m":"Moles $\\to$ coefficient ratio $\\to$ limiting reagent $\\to$ product. Kyun: yahan dono reactants diye hain, isliye limiting reagent ke bina answer galat aayega.","s":["Moles of $\\ce{Mg}=\\dfrac{48}{24}=2$ mol","Moles of $\\ce{NH3}=\\dfrac{34}{17}=2$ mol","Equation: $3\\ce{Mg}+2\\ce{NH3}\\to\\ce{Mg3N2}+3\\ce{H2}$","$\\ce{Mg}$ ke liye required $\\ce{NH3}=\\dfrac{2}{3}\\times2=1.33$ mol, jo available $2$ mol se kam hai $\\Rightarrow$ $\\ce{Mg}$ limiting reagent","$3$ mol $\\ce{Mg}$ se $1$ mol $\\ce{Mg3N2}$; to $2$ mol $\\ce{Mg}$ se $\\dfrac{2}{3}$ mol $\\ce{Mg3N2}$","Mass $=\\dfrac{2}{3}\\times100=\\dfrac{200}{3}\\ \\mathrm{g}\\approx66.7\\ \\mathrm{g}$ — option (1)."],"r":["","$\\dfrac{100}{3}\\ \\mathrm{g}$ tab aata hai agar $\\ce{NH3}$ ko limiting maan lein (par yahan $\\ce{Mg}$ limiting hai).","$\\dfrac{400}{3}\\ \\mathrm{g}$ me $2$ mol ka double count ho gaya.","$\\dfrac{150}{3}\\ \\mathrm{g}$ kisi bhi sahi ratio se nahi aata."],"w":["$\\ce{Mg3N2}$ ka molar mass $=3(24)+2(14)=72+28=100\\ \\mathrm{g\\,mol^{-1}}$ — ye dhyaan se likho, warna numeric hi galat ho jayega."],"t":"Limiting reagent ka fast test: har reactant ke liye $\\dfrac{\\text{moles}}{\\text{coefficient}}$ nikaalo, jiska value chhota ho wahi limiting hai."},{"id":80,"sub":"Chemistry","q":"An oxide, $\\ce{X2O3}$ is oxidised to $\\ce{XO4^{-}}$ by $\\ce{Cr2O7^{2-}}$ in acidic medium. The number of moles of $\\ce{X2O3}$ oxidised per mole of $\\ce{Cr2O7^{2-}}$ will be :-","opt":["2","$3/4$","$3/2$","$4/3$"],"ans":1,"c":"Redox titration me equivalents ka rule lagta hai: oxidising agent ke equivalents = reducing agent ke equivalents. $\\ce{Cr2O7^{2-}}$ acidic medium me $\\ce{Cr^{6+}}$ se $\\ce{Cr^{3+}}$ me jaata hai (per Cr $3$ electron gain, per dichromate $6$ electron gain). $\\ce{X}$ ka oxidation state $\\ce{X2O3}$ me $+3$ aur $\\ce{XO4^{-}}$ me $+7$ hota hai (per X $4$ electron loss).","m":"$n$-factor nikalo dono ke, phir equivalents equate karo. Kyun: mole ratio seedha $n$-factors ke inverse ratio se milta hai.","s":["$\\ce{Cr2O7^{2-}}\\to2\\ce{Cr^{3+}}$: per Cr $3e^-$ gain, per dichromate $6e^-$ gain $\\Rightarrow$ $n=6$","$\\ce{X2O3}$ me X ka OS: $2x-6=0\\Rightarrow x=+3$","$\\ce{XO4^{-}}$ me X ka OS: $x-8=-1\\Rightarrow x=+7$","Per X: $4e^-$ loss, per $\\ce{X2O3}$: $8e^-$ loss $\\Rightarrow$ $n=8$","Equivalents barabar: $6\\times1=n_{\\ce{X2O3}}\\times8$","$n_{\\ce{X2O3}}=\\dfrac{6}{8}=\\dfrac34$ mol per mole of dichromate — option (2)."],"r":["$2$ tab aata hai agar $n$-factors ignore kar dein.","","$\\dfrac32$ me ratio ulta ho gaya (dichromate ka $n$ aur oxide ka $n$ badal gaya).","$\\dfrac43$ me $n=8$ aur $6$ ulta lag gaya."],"t":"Equivalent concept yaad rakho: $\\dfrac{n_1}{n_2}=\\dfrac{N_2}{N_1}$ jaisa ratio; yahan moles ka ratio $=\\dfrac{n\\text{-factor of oxidant}}{n\\text{-factor of reductant}}$."},{"id":81,"sub":"Chemistry","q":"Lead has been placed in group 1st and 2nd because","opt":["it shows valency one and two","it forms insoluble $\\ce{PbCl2}$","it forms lead sulphide","its chloride is partly soluble in water"],"ans":3,"c":"Qualitative analysis me cations ko groups me baantne ka aadhaar unke reagents ke saath precipitate banana hai. Group 1 me dilute $\\ce{HCl}$ se insoluble chloride banta hai, group 2 me acidic medium me sulphide. $\\ce{PbCl2}$ paani me thoda soluble hai — kuch hissa group 1 me precipitate hota hai, aur jo bacha wo group 2 me $\\ce{PbS}$ ban jaata hai. Isliye lead dono groups me dikh jaata hai.","m":"Grouping ka reason dhundo: solubility behaviour. Kyun: 'kis group me kaun se reagent se precipitate banta hai' — yahi principle hai.","s":["Group 1 reagent: dilute $\\ce{HCl}$ $\\Rightarrow$ $\\ce{PbCl2}$ (white ppt) banta hai","$\\ce{PbCl2}$ paani me partially soluble hai; hot water me poori tarah ghul jaata hai","Isliye group 1 me precipitation complete nahi hoti","Bacha hua $\\ce{Pb^{2+}}$ acidic medium me $\\ce{H2S}$ ke saath $\\ce{PbS}$ (black) deta hai — group 2","Isliye Pb ko group 1 aur 2 dono me rakha jaata hai — option (4)."],"r":["Valency $+1$ aur $+2$ dikhana grouping ka aadhaar nahi hai ($\\ce{Pb}$ mainly $+2$ dikhata hai).","$\\ce{PbCl2}$ insoluble hota to poora group 1 me hi aa jaata, group 2 me nahi.","$\\ce{PbS}$ group 2 me banta hai, par grouping ka reason chloride ki partial solubility hai.",""],"t":"Group 1 ke exceptions: $\\ce{Pb^{2+}}$ aur $\\ce{Hg2^{2+}}$ (chlorides partially soluble) — inhe 'group 1 aur 2' dono me likha jaata hai."},{"id":82,"sub":"Chemistry","q":"The enthalpy of combustion of carbon, hydrogen and sucrose are $-393.5$, $-286.2$ and $-5644.2\\ \\mathrm{kJ\\,mol^{-1}}$ respectively. Calculate the enthalpy of formation of sucrose :-","opt":["$-6323.9\\ \\mathrm{kJ}$","$-2226\\ \\mathrm{kJ}$","$+2226\\ \\mathrm{kJ}$","$+6323.9\\ \\mathrm{kJ}$"],"ans":1,"c":"Formation reaction me product 1 mole hota hai aur reactants elements hote hain: $12\\ce{C}+11\\ce{H2}+5.5\\ce{O2}\\to\\ce{C12H22O11}$. Hess's law se: $\\Delta H_f = \\sum \\Delta H_c(\\text{reactants})-\\Delta H_c(\\text{product})$ kyunki combustion reactions ko ulta jod kar formation banaya jaata hai.","m":"$12\\ce{C}+11\\ce{H2}+\\dfrac{11}{2}\\ce{O2}\\to\\ce{C12H22O11}$ likho, phir $\\sum\\Delta H_c$ reactants $-$ product. Kyun: combustion reactions ko reverse karke add karna hi Hess ka tarika hai.","s":["Formation equation: $12\\ce{C}+11\\ce{H2}+\\dfrac{11}{2}\\ce{O2}\\to\\ce{C12H22O11}$","$\\Delta H_f=\\left[12\\Delta H_c(\\ce{C})+11\\Delta H_c(\\ce{H2})\\right]-\\Delta H_c(\\text{sucrose})$","$=12(-393.5)+11(-286.2)$","$=-4722.0-3148.2=-7870.2\\ \\mathrm{kJ}$","$=-7870.2-(-5644.2)=-2226.0\\ \\mathrm{kJ}$","Answer: $-2226\\ \\mathrm{kJ}$ — option (2)."],"r":["$-6323.9$ kisi bhi sahi sum se nahi aata, ye distractor hai.","","$+2226$ sign galat hai: sucrose ka formation exothermic hota hai (glucose/fructose se banti hai, par elements se banana energy release karta hai).","$+6323.9$ magnitude aur sign dono galat."],"t":"Hess's law ka short form: $\\Delta H_{\\text{reaction}}=\\sum\\Delta H_f(\\text{products})-\\sum\\Delta H_f(\\text{reactants})$. Combustion diya ho to formation nikalne ke liye ise ulta chalana padta hai."},{"id":83,"sub":"Chemistry","q":"The osmotic pressure of $1\\ \\mathrm{M}$ $\\ce{KCl}$ solution at $27^{\\circ}\\mathrm{C}$ is:","opt":["$2.46\\ \\mathrm{atm}$","$24.6\\ \\mathrm{atm}$","$1.21\\ \\mathrm{atm}$","$49.2\\ \\mathrm{atm}$"],"ans":3,"c":"Osmotic pressure $\\pi=iCRT$ hota hai, jahan $i$ van't Hoff factor hai. $\\ce{KCl}$ electrolyte hai — paani me do ions ($\\ce{K+}$, $\\ce{Cl-}$) me poori tarah dissociate ho jaata hai, isliye $i=2$. Ideal value ko $i=1$ lene par answer aadha aa jaata hai — yahi sabse common galti hai.","m":"$\\pi=iCRT$ me $i=2$ rakho. Kyun: strong electrolyte ke liye particle count double ho jaata hai, isliye actual pressure double hota hai.","s":["$C=1\\ \\mathrm{M}$, $R=0.0821\\ \\mathrm{L\\,atm\\,mol^{-1}\\,K^{-1}}$, $T=27+273=300\\ \\mathrm{K}$","$\\ce{KCl}\\to\\ce{K+}+\\ce{Cl-}$ $\\Rightarrow$ $i=2$","$\\pi=iCRT=2\\times1\\times0.0821\\times300$","$0.0821\\times300=24.63\\ \\mathrm{atm}$","$\\pi=2\\times24.63=49.26\\ \\mathrm{atm}$","Answer: $49.2\\ \\mathrm{atm}$ — option (4)."],"r":["$2.46$ me decimal shift ho gaya hai (do baar $10$ ka factor).","$24.6\\ \\mathrm{atm}$ van't Hoff factor $i=1$ lene par aata hai — $\\ce{KCl}$ dissociate hota hai.","$1.21$ koi bhi justified calculation nahi deta.",""],"t":"$i$ ki values rat lo: $\\ce{NaCl}$/$i=2$, $\\ce{KCl}$/$i=2$, $\\ce{CaCl2}$/$i=3$, $\\ce{Al2(SO4)3}$/$i=5$, aur non-electrolyte (glucose/urea) $i=1$."},{"id":84,"sub":"Chemistry","q":"$0.1$ molal aqueous solution of an electrolyte $\\ce{AB3}$ is $90\\%$ ionised. The boiling point of the solution at $1\\ \\mathrm{atm}$ is ($K_b=0.52\\ \\mathrm{K\\,kg\\,mol^{-1}}$):-","opt":["$273.19\\ \\mathrm{K}$","$374.92\\ \\mathrm{K}$","$378.4\\ \\mathrm{K}$","$373.34\\ \\mathrm{K}$"],"ans":3,"c":"Boiling point elevation colligative property hai: $\\Delta T_b=iK_bm$. Electrolyte ke partial ionisation ke karan van't Hoff factor $1$ se zyada hota hai. $\\ce{AB3}$ chaar ions deta hai ($\\ce{A^{3+}}+3\\ce{B-}$), isliye poori ionisation par $i=4$ hota hai; $90\\%$ ionisation par $i=1+\\alpha(n-1)$.","m":"Pehle $i$ nikalo ($\\alpha$ aur $n$ se), phir $\\Delta T_b$, phir $T_b=T_b^{\\circ}+\\Delta T_b$. Kyun: water ka normal boiling point $373.15\\ \\mathrm{K}$ hai, usi par elevation jodna hai.","s":["$\\ce{AB3 -> A^{3+} + 3B^{-}}$: $n=4$","$i=1+\\alpha(n-1)=1+0.9(4-1)=1+2.7=3.7$","$\\Delta T_b=iK_bm=3.7\\times0.52\\times0.1$","$=3.7\\times0.052=0.1924\\ \\mathrm{K}$","$T_b=373.15+0.1924=373.34\\ \\mathrm{K}$","Answer: $373.34\\ \\mathrm{K}$ — option (4)."],"r":["$273.19\\ \\mathrm{K}$ ice point ($273\\ \\mathrm{K}$) se shuru karna — aqueous solution ka boiling point $373\\ \\mathrm{K}$ ke aas-paas hota hai.","$374.92\\ \\mathrm{K}$ me $i=4$ (poori ionisation) aur bada $\\Delta T$ aa jaata hai; $90\\%$ ionisation hai.","$378.4\\ \\mathrm{K}$ me molality ya $i$ kai guna badh gaya.",""],"t":"$1$ atm par pure water ka boiling point $373.15\\ \\mathrm{K}$ ($100^{\\circ}\\mathrm{C}$) hota hai — koi bhi aqueous solution isse thoda zyada hi hoga, kam kabhi nahi."},{"id":85,"sub":"Chemistry","q":"$\\ce{N2O5}$ is decomposed according to the given reaction. If initial pressure of $\\ce{N2O5}$ is $100$ torr and after $10\\ \\mathrm{min}$ total pressure of reaction mixture becomes $150$ torr then rate of decomposition of $\\ce{N2O5}$ is <br>$\\ce{2N2O5 -> 4NO2 + O2}$","opt":["$3.33\\ \\mathrm{torr\\,min^{-1}}$","$6.67\\ \\mathrm{torr\\,min^{-1}}$","$5\\ \\mathrm{torr\\,min^{-1}}$","$10\\ \\mathrm{torr\\,min^{-1}}$"],"ans":0,"c":"Gas phase reaction me pressure ko concentration ki tarah use kar sakte hain. Total pressure se decomposed amount nikalne ke liye ICE table banao: jo $\\ce{N2O5}$ ghata, wo $2:4:1$ ratio me products me badalta hai. Rate of decomposition = $\\ce{N2O5}$ ke pressure me kami / time.","m":"ICE table se $x$ nikalo, phir $\\dfrac{2x}{t}$. Kyun: total pressure me teenon gases ka contribution hai, isliye seedha difference lena galat hoga.","s":["Initial: $\\ce{N2O5}=100$, $\\ce{NO2}=0$, $\\ce{O2}=0$ (torr)","Mana $2x$ torr $\\ce{N2O5}$ decompose hua","Equilibrium: $\\ce{N2O5}=100-2x$, $\\ce{NO2}=4x$, $\\ce{O2}=x$","Total $=(100-2x)+4x+x=100+3x=150$","$3x=50\\Rightarrow x=16.67$ torr","Decomposed $\\ce{N2O5}=2x=33.33$ torr in $10\\ \\mathrm{min}$","Rate $=\\dfrac{33.33}{10}=3.33\\ \\mathrm{torr\\,min^{-1}}$ — option (1)."],"r":["","$6.67$ tab aata hai agar $x$ ko hi decomposed amount maan lein ($2x$ nahi).","$5$ tab aata hai agar $3x$ ko seedha rate samajh lein.","$10$ me total pressure change ($50$ torr) ko hi decomposition maan liya gaya."],"t":"ICE table me stoichiometric coefficients ko $x$ ke saath multiply karna mat bhoolo — $\\ce{2N2O5}$ ke liye change $-2x$ hota hai, $-x$ nahi."},{"id":86,"sub":"Chemistry","q":"The activation energies of the forward and backward reactions in the case of a chemical reaction are $30.5$ and $45.4\\ \\mathrm{kJ\\,mol^{-1}}$ respectively. The reaction is :","opt":["Exothermic","Endothermic","Neither exothermic nor endothermic","Independent of temperature"],"ans":0,"c":"Activation energy ka diagram banao: reactants se transition state tak chadhne ke liye $E_{a,\\text{forward}}$ chahiye, aur products se wapas reactants tak $E_{a,\\text{backward}}$. Enthalpy change $\\Delta H=E_{a,f}-E_{a,b}$ hota hai. Yahan $E_{a,f}<E_{a,b}$, matlab products ki energy reactants se kam hai — energy release hui.","m":"$\\Delta H=E_{a}(\\text{forward})-E_{a}(\\text{backward})$ lagao aur sign dekho. Kyun: energy diagram me difference hi enthalpy change hai.","s":["$\\Delta H=E_{a,f}-E_{a,b}$","$=30.5-45.4$","$=-14.9\\ \\mathrm{kJ\\,mol^{-1}}$","Negative $\\Delta H$ $\\Rightarrow$ heat release hoti hai","Reaction exothermic hai — option (1)."],"r":["","Endothermic tab hota jab $E_{a,f}>E_{a,b}$ ($\\Delta H>0$).","Bilkul neutral tab hota jab dono activation energies equal hon.","Har reaction temperature par depend karta hai — ye statement kisi bhi case me galat hai."],"t":"Yaad rakho: $E_{a,\\text{forward}}-E_{a,\\text{backward}}=\\Delta H$. Exothermic me backward activation energy hamesha badi hoti hai."},{"id":87,"sub":"Chemistry","q":"Mass of $\\ce{Cu}$ which deposits at cathode during electrolysis of $\\ce{CuSO4(aq)}$ solution, if $1.12\\ \\mathrm{L}$ $\\ce{O2(g)}$ is evolved at anode at $1\\ \\mathrm{atm}$ and $273\\ \\mathrm{K}$: (Atomic weight of $\\ce{Cu}=63.5$)","opt":["$1.12\\ \\mathrm{g}$","$2.24\\ \\mathrm{g}$","$6.35\\ \\mathrm{g}$","$63.5\\ \\mathrm{g}$"],"ans":2,"c":"Electrolysis me cathode par reduction aur anode par oxidation hoti hai, aur dono me same number of electrons flow karte hain (Faraday's laws). Anode par paani oxidise hokar $\\ce{O2}$ deta hai ($4\\ce{OH-}\\to\\ce{O2}+2\\ce{H2O}+4e^-$), isliye $1$ mol $\\ce{O2}$ ke liye $4$ mol electrons chahiye. Cathode par $\\ce{Cu^{2+}}+2e^-\\to\\ce{Cu}$ ke liye $2$ mol electrons per mol Cu.","m":"Electrons ke equivalents equate karo: $\\ce{O2}$ ke eq = $\\ce{Cu}$ ke eq. Kyun: same circuit me same charge flow hota hai — Faraday ka second law.","s":["STP ($273\\ \\mathrm{K}$, $1\\ \\mathrm{atm}$) par $1$ mol gas $=22.4\\ \\mathrm{L}$","Moles of $\\ce{O2}=\\dfrac{1.12}{22.4}=0.05$ mol","$\\ce{O2}$ ke liye $4e^-$ per molecule: electrons $=0.05\\times4=0.2$ mol","$\\ce{Cu^{2+}}+2e^-\\to\\ce{Cu}$: $0.2$ mol electrons se $\\dfrac{0.2}{2}=0.1$ mol Cu","Mass $=0.1\\times63.5=6.35\\ \\mathrm{g}$","Answer: $6.35\\ \\mathrm{g}$ — option (3)."],"r":["$1.12\\ \\mathrm{g}$ sirf volume ka number hai — mass nahi.","$2.24\\ \\mathrm{g}$ tab aata hai agar $n$-factor $4$/$2$ ulta lag jaye.","","$63.5\\ \\mathrm{g}$ matlab poora $1$ mol Cu — electrons ka hisaab hi nahi laga."],"t":"Anode par $\\ce{O2}$ ke liye $n$-factor $4$ hota hai ($4e^-$ per $\\ce{O2}$). Isliye $\\ce{O2}$ ke equivalents $=4\\times$moles, aur Cu ke $=2\\times$moles."},{"id":88,"sub":"Chemistry","q":"What is the concentration of $\\ce{Ba^{2+}}$ when $\\ce{BaF2}$ ($K_{sp}=1.0\\times10^{-6}$) begins to precipitate from a solution that is $0.30\\ \\mathrm{M}$ $\\ce{F-}$?","opt":["$9.0\\times10^{-7}\\ \\mathrm{M}$","$3.3\\times10^{-6}\\ \\mathrm{M}$","$1.1\\times10^{-5}\\ \\mathrm{M}$","$3.0\\times10^{-7}\\ \\mathrm{M}$"],"ans":2,"c":"Precipitation tab shuru hoti hai jab ionic product $Q>K_{sp}$. $\\ce{BaF2}$ ke liye $K_{sp}=[\\ce{Ba^{2+}}][\\ce{F-}]^{2}$ (fluoride ka square aata hai kyunki do $\\ce{F-}$ ions hain). Threshold par $Q=K_{sp}$ hota hai, isliye required $[\\ce{Ba^{2+}}]=\\dfrac{K_{sp}}{[\\ce{F-}]^{2}}$.","m":"$K_{sp}$ expression me di gayi $[\\ce{F-}]$ ko square karke rakho. Kyun: stoichiometry $1:2$ hai, isliye fluoride ka square aata hai — yahi sabse badi galti ki jagah hai.","s":["$\\ce{BaF2(s) <=> Ba^{2+} + 2F-}$","$K_{sp}=[\\ce{Ba^{2+}}][\\ce{F-}]^{2}$","$[\\ce{F-}]=0.30\\ \\mathrm{M}\\Rightarrow [\\ce{F-}]^{2}=0.09$","$[\\ce{Ba^{2+}}]=\\dfrac{1.0\\times10^{-6}}{0.09}$","$=1.11\\times10^{-5}\\ \\mathrm{M}$","Answer: $1.1\\times10^{-5}\\ \\mathrm{M}$ — option (3)."],"r":["$9.0\\times10^{-7}$ tab aata hai agar $[\\ce{F-}]$ ka square na karein.","$3.3\\times10^{-6}$ me $[\\ce{F-}]$ ka koi aur power use hua hai.","","$3.0\\times10^{-7}$ me $K_{sp}$ ko $3$ se divide kiya gaya — koi scientific aadhaar nahi."],"t":"$K_{sp}$ likhte waqt coefficients ko exponent banate hain: $\\ce{BaF2}\\to[\\ce{Ba^{2+}}][\\ce{F-}]^{2}$, $\\ce{Ag2CrO4}\\to[\\ce{Ag+}]^{2}[\\ce{CrO4^{2-}}]$. Rat lo."},{"id":89,"sub":"Chemistry","q":"$\\ce{CH3NH2}$ ($0.08$ mole, $\\mathrm{p}K_b=3.3$) is added to $0.02$ moles of $\\ce{HCl}$ and the solution is diluted to one litre, resulting pH of solution is:-","opt":["$10.4$","$10.7$","$11.17$","$5$"],"ans":2,"c":"Yahan strong acid ($\\ce{HCl}$) ne amine ka kuch hissa neutralize karke salt bana diya — bacha hua amine + bana hua salt mil kar **basic buffer** banate hain. Buffer ke liye Henderson–Hasselbalch equation: $\\mathrm{pOH}=\\mathrm{p}K_b+\\log\\dfrac{[\\text{salt}]}{[\\text{base}]}$, phir $\\mathrm{pH}=14-\\mathrm{pOH}$.","m":"Neutralisation ke baad bache base aur bane salt ke moles nikalo, phir buffer equation. Kyun: acid kam hai (limiting), isliye partial neutralisation hoga aur buffer banega.","s":["$\\ce{CH3NH2 + HCl -> CH3NH3+ Cl-}$; $0.08$ mol amine, $0.02$ mol acid","Acid limiting hai: $0.02$ mol salt banta hai, base bachta hai $0.08-0.02=0.06$ mol","$\\mathrm{pOH}=\\mathrm{p}K_b+\\log\\dfrac{[\\text{salt}]}{[\\text{base}]}=3.3+\\log\\dfrac{0.02}{0.06}$","$\\log\\dfrac{1}{3}=-0.477$","$\\mathrm{pOH}=3.3-0.477=2.823$","$\\mathrm{pH}=14-2.823=11.18\\approx11.17$ — option (3)."],"r":["$10.4$ me pOH ka calculation thoda galat hai (ratio invert ya log galat).","$10.7$ tab aata hai agar salt/base ratio $1/1$ lein.","","$5$ acidic hai — amine ka buffer acidic kaise ho sakta hai?"],"w":["$\\mathrm{pOH}=\\mathrm{p}K_b+\\log\\dfrac{\\text{salt}}{\\text{base}}$ — ratio salt/base hota hai, base/salt nahi. Isse sign flip ho jaata hai."],"t":"Buffer ka quick check: equimolar par $\\mathrm{pH}=\\mathrm{p}K_a$, aur $\\mathrm{pOH}=\\mathrm{p}K_b$. Yahan salt kam hai (base zyada), isliye solution zyada basic hoga (pH $\\mathrm{p}K_b$ wale se zyada)."},{"id":90,"sub":"Chemistry","q":"If standard oxidation potential of $\\ce{Cu/Cu^{2+}}$ is $-0.34\\ \\mathrm{V}$, then the correct order of oxidation potential in volts of the below electrodes follow the order : <br>$P=\\ce{Cu^{2+}}(0.0001\\ \\mathrm{M})/\\ce{Cu(s)}$; $Q=\\ce{Cu^{2+}}(0.1\\ \\mathrm{M})/\\ce{Cu(s)}$; $R=\\ce{Cu^{2+}}(0.01\\ \\mathrm{M})/\\ce{Cu(s)}$; $S=\\ce{Cu^{2+}}(0.001\\ \\mathrm{M})/\\ce{Cu(s)}$","fig":"<svg viewBox=\"0 0 340 192\" width=\"340\" height=\"192\" role=\"img\" aria-label=\"four copper electrodes with different concentrations\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"192\" fill=\"none\"/><rect x=\"30\" y=\"12\" width=\"34\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"47\" y=\"33\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">P<\/text><rect x=\"64\" y=\"12\" width=\"190\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"76\" y=\"33\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Cu<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>{2+} 0.0001 M<\/text><rect x=\"30\" y=\"50\" width=\"34\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"47\" y=\"71\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Q<\/text><rect x=\"64\" y=\"50\" width=\"190\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"76\" y=\"71\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Cu<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>{2+} 0.1 M<\/text><rect x=\"30\" y=\"88\" width=\"34\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"47\" y=\"109\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">R<\/text><rect x=\"64\" y=\"88\" width=\"190\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"76\" y=\"109\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Cu<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>{2+} 0.01 M<\/text><rect x=\"30\" y=\"126\" width=\"34\" height=\"30\" rx=\"6\" fill=\"#20252f\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"47\" y=\"147\" fill=\"#ffd479\" font-size=\"13\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">S<\/text><rect x=\"64\" y=\"126\" width=\"190\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"#8b95a8\" stroke-width=\"1.6\"/><text x=\"76\" y=\"147\" fill=\"#dcdfe4\" font-size=\"12\" text-anchor=\"start\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Cu<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>{2+} 0.001 M<\/text><text x=\"180\" y=\"180\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\" font-family=\"Segoe UI,Arial,sans-serif\" font-weight=\"normal\">Same electrode, sirf [Cu<tspan baseline-shift=\"super\" font-size=\"70%\"><\/tspan>{2+}] alag hai<\/text><\/svg>","opt":["$Q>R>S>P$","$P>S>R>Q$","$R>S>Q>P$","$P>Q>R>S$"],"ans":1,"c":"Nernst equation se electrode potential concentration par depend karta hai. Oxidation potential $E_{\\text{ox}}=E^{\\circ}_{\\text{ox}}-\\dfrac{0.059}{n}\\log\\dfrac{1}{[\\ce{Cu^{2+}}]}$ — matlab jitni kam concentration, utni zyada oxidation potential (kyunki oxidation se $\\ce{Cu^{2+}}$ banta hai, aur kam concentration me banana aasan hota hai).","m":"Nernst equation likho aur $[\\ce{Cu^{2+}}]$ ka effect dekho. Kyun: same electrode, sirf concentration alag hai — isliye sirf log term ka sign matter karta hai.","s":["Oxidation: $\\ce{Cu(s) -> Cu^{2+} + 2e^-}$","Nernst (oxidation potential): $E_{\\text{ox}}=E^{\\circ}_{\\text{ox}}-\\dfrac{0.059}{2}\\log\\dfrac{[\\ce{Cu^{
