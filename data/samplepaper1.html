<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET UG 2027 — Full Sample Paper (Q1 to Q180)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #12141a;
    --surface: #171a22;
    --card: #1b1f27;
    --card2: #222733;
    --border: #2c3342;
    --text: #dcdfe4;
    --muted: #9aa3b2;
    --accent: #58a6ff;
    --accent-bg: #19273a;
    --green: #3fb950;
    --green-soft: #7ee787;
    --green-bg: #182b20;
    --red: #e5534b;
    --red-soft: #f47067;
    --red-bg: #2d1b1e;
    --amber: #f0b72f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    font-size: 17.5px;
    line-height: 1.72;
    -webkit-font-smoothing: antialiased;
  }
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .progress-track {
    width: 100%;
    height: 4px;
    background: #232834;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    width: 0%;
    transition: width 0.25s ease;
  }
  .topbar {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .brand-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .title-pill {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.2px;
  }
  .sub-badge {
    font-size: 13px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1px solid #2b4466;
  }
  .stats-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .score-pill {
    font-size: 14px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 8px;
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--green-soft);
  }
  .mini-btn {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    min-height: 36px;
    transition: border-color 0.15s, background 0.15s;
  }
  .mini-btn:hover { border-color: var(--accent); background: #262d3d; }
  .mini-btn.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  .sec-bar {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 10px;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .sec-tab {
    flex: 0 0 auto;
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .sec-tab.current {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: #365985;
  }
  .palette-drawer {
    max-width: 900px;
    margin: 0 auto 12px;
    padding: 12px 16px;
    background: var(--card);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    max-height: 270px;
    overflow-y: auto;
  }
  .palette-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .palette-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
    gap: 6px;
  }
  .q-num-btn {
    height: 38px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .q-num-btn:hover { border-color: var(--accent); color: var(--text); }
  .q-num-btn.current { outline: 2px solid var(--accent); color: var(--text); font-weight: 700; }
  .q-num-btn.right { background: var(--green-bg); border-color: var(--green); color: var(--green-soft); }
  .q-num-btn.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red-soft); }
  .container {
    max-width: 900px;
    margin: 20px auto 60px;
    padding: 0 16px;
  }
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 22px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
  }
  .q-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--muted);
  }
  .q-index {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--accent);
  }
  .q-marks-info { font-size: 13px; color: var(--muted); }
  .q-stem {
    font-size: 18px;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 18px;
  }
  .fig-box {
    margin: 14px 0 20px;
    padding: 12px;
    background: #151821;
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: center;
    overflow-x: auto;
  }
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .opt-btn {
    width: 100%;
    min-height: 54px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-radius: 11px;
    background: var(--card2);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-size: 17px;
    line-height: 1.6;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #272e3d;
  }
  .opt-btn:disabled { cursor: default; }
  .opt-letter {
    flex: 0 0 32px;
    height: 32px;
    border-radius: 8px;
    background: #171a22;
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--muted);
  }
  .opt-btn.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--text);
  }
  .opt-btn.correct .opt-letter {
    background: var(--green);
    border-color: var(--green);
    color: #12141a;
  }
  .opt-btn.wrong {
    background: var(--red-bg);
    border-color: var(--red);
    color: var(--text);
  }
  .opt-btn.wrong .opt-letter {
    background: var(--red);
    border-color: var(--red);
    color: #12141a;
  }
  .verdict-banner {
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 16px;
  }
  .verdict-banner.ok {
    background: var(--green-bg);
    border: 1px solid var(--green);
    color: var(--green-soft);
  }
  .verdict-banner.bad {
    background: var(--red-bg);
    border: 1px solid var(--red);
    color: var(--red-soft);
  }
  .exp-box {
    margin-top: 16px;
    padding: 18px 18px;
    background: #151922;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .exp-sec { margin-bottom: 13px; }
  .exp-sec:last-child { margin-bottom: 0; }
  .exp-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .steps-ol { padding-left: 22px; }
  .steps-ol li { margin-bottom: 8px; }
  .tip-pill {
    margin-top: 12px;
    padding: 11px 14px;
    background: #20231c;
    border-left: 3px solid var(--amber);
    border-radius: 8px;
    color: var(--text);
    font-size: 15.5px;
  }
  .sim-panel {
    margin-top: 14px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .sim-panel input[type="range"] { width: 100%; margin: 8px 0; accent-color: var(--accent); }
  .action-bar {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .nav-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .nav-btn {
    min-height: 48px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); background: #293142; }
  .nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .nav-btn.primary { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .nav-btn.submit-btn { background: var(--green-bg); border-color: var(--green); color: var(--green-soft); }
  .result-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 22px;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 12px;
    margin: 18px 0;
  }
  .kpi-card {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .kpi-val { font-size: 26px; font-weight: 800; color: var(--text); }
  .kpi-lbl { font-size: 13px; color: var(--muted); }
  .sub-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0 20px;
    font-size: 15.5px;
  }
  .sub-table th, .sub-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .sub-table th { color: var(--muted); font-size: 13.5px; }
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 18px 0;
  }
  .review-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(9, 11, 15, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    max-width: 430px;
    width: 100%;
    padding: 22px;
  }
  .hidden { display: none !important; }
  .math-fb { font-family: "Cambria Math", "Times New Roman", Georgia, serif; }
  .m-frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    padding: 0 3px;
    font-size: 0.9em;
    line-height: 1.15;
  }
  .m-frac > span:first-child { border-bottom: 1px solid var(--text); padding-bottom: 1px; }
  .m-sqrt { white-space: nowrap; }
  .m-rad { border-top: 1px solid var(--text); padding: 0 2px; }
  @media (max-width: 600px) {
    html, body { font-size: 16.5px; }
    .q-card { padding: 18px 15px; }
    .q-stem { font-size: 17px; }
    .opt-btn { font-size: 16px; padding: 11px 13px; }
  }
</style>
</head>
<body>

<header class="sticky-header">
  <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
  <div class="topbar">
    <div class="brand-left">
      <span class="title-pill">NEET UG Full Paper (1–180)</span>
      <span id="subBadge" class="sub-badge">Physics • Q1 / 180</span>
    </div>
    <div class="stats-right">
      <span id="scoreBadge" class="score-pill">Score: 0 / 720</span>
      <button id="timerBtn" class="mini-btn" type="button" onclick="toggleTimer()">⏱ 180:00</button>
      <button id="paletteBtn" class="mini-btn" type="button" onclick="togglePalette()">Q1–180 Grid ▾</button>
    </div>
  </div>
  <div id="secBar" class="sec-bar">
    <button class="sec-tab current" type="button" onclick="jumpSection(0)">Physics (1–45)</button>
    <button class="sec-tab" type="button" onclick="jumpSection(45)">Chemistry (46–90)</button>
    <button class="sec-tab" type="button" onclick="jumpSection(90)">Botany (91–135)</button>
    <button class="sec-tab" type="button" onclick="jumpSection(135)">Zoology (136–180)</button>
  </div>
  <div id="paletteDrawer" class="palette-drawer hidden">
    <div class="palette-legend">
      <span>● Click any question <b>1 to 180</b> to jump directly</span>
      <span style="color:var(--green-soft)">■ Correct (+4)</span>
      <span style="color:var(--red-soft)">■ Wrong (−1)</span>
      <span>■ Unattempted (0)</span>
    </div>
    <div id="paletteGrid" class="palette-grid"></div>
  </div>
</header>

<main class="container">
  <section id="examView">
    <div class="q-card">
      <div class="q-meta">
        <span id="qCounter" class="q-index">Question 1 of 180</span>
        <span id="qSubInfo" class="q-marks-info">Physics • +4 Correct / −1 Wrong</span>
      </div>
      <div id="qStem" class="q-stem"></div>
      <div id="qFig" class="fig-box hidden"></div>
      <div id="optList" class="options-list"></div>
      <div id="verdictBox" class="verdict-banner hidden"></div>
      <div id="expBox" class="exp-box hidden"></div>

      <div class="action-bar">
        <div class="nav-group">
          <button id="prevBtn" class="nav-btn" type="button" onclick="goPrev()">← Previous</button>
          <button id="skipBtn" class="nav-btn" type="button" onclick="doSkip()">Skip</button>
          <button id="nextBtn" class="nav-btn primary" type="button" onclick="goNext()">Next →</button>
        </div>
        <div class="nav-group">
          <button class="nav-btn submit-btn" type="button" onclick="openSubmitModal()">Submit Paper</button>
        </div>
      </div>
    </div>
  </section>

  <section id="resultView" class="hidden">
    <div id="resultSummary" class="result-box"></div>
    <div id="reviewSection" class="hidden" style="margin-top:24px;">
      <div id="reviewFilters" class="filter-bar"></div>
      <div id="reviewList"></div>
    </div>
  </section>
</main>

<div id="submitModal" class="modal-backdrop hidden">
  <div class="modal-card">
    <h3 style="margin-bottom:8px;font-size:20px;">Submit Full 180-Question Paper?</h3>
    <p id="modalSummaryText" style="color:var(--muted);margin-bottom:18px;font-size:16px;"></p>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button class="nav-btn" type="button" onclick="closeSubmitModal()">Cancel</button>
      <button class="nav-btn submit-btn" type="button" onclick="confirmSubmit()">Yes, Submit</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"id": 1, "q": "A man moves up on a $3\\text{ km}$ long incline road with speed of $2\\text{ m/s}$, then on a $3\\text{ km}$ level road with speed of $3\\text{ m/s}$ and moves down on a $3\\text{ km}$ long incline road with $6\\text{ m/s}$. Find the average speed of man.", "fig": "<svg viewBox=\"0 0 520 155\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Three-part road journey\"><rect width=\"520\" height=\"155\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><path d=\"M 35 122 L 175 52 L 345 52 L 485 122\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"35\" cy=\"122\" r=\"4.5\" fill=\"#60a5fa\"/><circle cx=\"175\" cy=\"52\" r=\"4.5\" fill=\"#f59e0b\"/><circle cx=\"345\" cy=\"52\" r=\"4.5\" fill=\"#3fb950\"/><circle cx=\"485\" cy=\"122\" r=\"4.5\" fill=\"#dcdfe4\"/><text x=\"95\" y=\"72\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\" transform=\"rotate(-26 95 72)\">3 km | 2 m/s</text><text x=\"260\" y=\"38\" fill=\"#f59e0b\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">3 km | 3 m/s</text><text x=\"424\" y=\"72\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\" transform=\"rotate(26 424 72)\">3 km | 6 m/s</text><text x=\"35\" y=\"142\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">Start (A)</text><text x=\"175\" y=\"72\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">B</text><text x=\"345\" y=\"72\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">C</text><text x=\"485\" y=\"142\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">End (D)</text><text x=\"260\" y=\"136\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">Total Distance = 3 + 3 + 3 = 9 km (9000 m)</text></svg>", "opt": ["$2\\text{ m/s}$", "$5\\text{ m/s}$", "$8\\text{ m/s}$", "$3\\text{ m/s}$"], "ans": 3, "c": "Average speed ka matlab sirf speeds ka simple average nikalna nahi hota! Physics me <b>Average Speed</b> hamesha <b>Total Distance</b> aur <b>Total Time</b> ka ratio hoti hai. Kyunki jab aadmi slow speed ($2\\text{ m/s}$) se chalta hai to wo us $3\\text{ km}$ hisse me sabse zyada waqt bitata hai, isliye final average speed slow wale hisse ki taraf jhuk jaati hai.", "m": "Hum basic definition $v_{\\text{avg}} = \\frac{\\text{Total Distance}}{\\text{Total Time}}$ lagayenge. Pehle har segment ki distance ko SI unit ($\\text{m}$) me badal kar alag-alag time $t_1, t_2, t_3$ nikalenge ($t = \\frac{d}{v}$), fir total distance ko total time se divide karenge.", "s": ["Pehle har road segment ki length ko kilometre se metre me badalte hain ($1\\text{ km} = 1000\\text{ m}$):<br>$d_1 = d_2 = d_3 = 3 \\times 1000 = 3000\\text{ m}$.", "Total Distance calculate karte hain:<br>$D = d_1 + d_2 + d_3 = 3000 + 3000 + 3000 = 9000\\text{ m}$.", "Pehle segment (uphill incline, $v_1 = 2\\text{ m/s}$) ka time $t_1$:<br>$t_1 = \\frac{d_1}{v_1} = \\frac{\\cancel{3000}^{1500}}{\\cancel{2}_{1}} = 1500\\text{ s}$ ($2$ se $3000$ divide hua to $1500$ aaya).", "Doosre segment (level road, $v_2 = 3\\text{ m/s}$) ka time $t_2$:<br>$t_2 = \\frac{d_2}{v_2} = \\frac{\\cancel{3000}^{1000}}{\\cancel{3}_{1}} = 1000\\text{ s}$ ($3$ se $3000$ seedha $1000$ baar kata).", "Teesre segment (downhill incline, $v_3 = 6\\text{ m/s}$) ka time $t_3$:<br>$t_3 = \\frac{d_3}{v_3} = \\frac{\\cancel{3000}^{500}}{\\cancel{6}_{1}} = 500\\text{ s}$ ($6 \\times 500 = 3000$).", "Ab teeno times ko jodkar Total Time $T$ nikalte hain:<br>$T = t_1 + t_2 + t_3 = 1500 + 1000 + 500 = 3000\\text{ s}$.", "Ab Average Speed nikalte hain ($1000$ upar-neeche cancel aur $9 \\div 3 = 3$):<br>$v_{\\text{avg}} = \\frac{D}{T} = \\frac{\\cancel{9000}^{9}}{\\cancel{3000}_{3}} = \\frac{9}{3} = \\color{#3fb950}{3\\text{ m/s}}$.", "Verification (Harmonic Mean method se check): $\\frac{3}{v_{\\text{avg}}} = \\frac{1}{2} + \\frac{1}{3} + \\frac{1}{6} = \\frac{3 + 2 + 1}{6} = \\frac{\\cancel{6}^{1}}{\\cancel{6}_{1}} = 1 \\Rightarrow v_{\\text{avg}} = 3\\text{ m/s}$."], "r": "Sahi jawab Option (D) hai: $\\color{#3fb950}{3\\text{ m/s}}$.", "w": ["Option (A) $2\\text{ m/s}$ galat hai — ye sirf pehle uphill segment ki speed hai, poori journey ki average speed nahi.", "Option (B) $5\\text{ m/s}$ galat hai — kai students galti se speeds ka rough average ya $\\frac{2 + 8}{2} = 5$ jaisa guess laga lete hain bina time nikale.", "Option (C) $8\\text{ m/s}$ galat hai — average speed kabhi bhi journey ki maximum speed ($6\\text{ m/s}$) se badi nahi ho sakti!"], "t": "Exam Shortcut: Jab $n$ equal distances alag-alag speeds $v_1, v_2, \\dots, v_n$ se cover hon, to $3\\text{ km}$ ki value kuch bhi ho cancel ho jaati hai! Seedha Harmonic Mean lagao: $\\frac{3}{v_{\\text{avg}}} = \\frac{1}{v_1} + \\frac{1}{v_2} + \\frac{1}{v_3}$. Aur yaad rakho — average speed hamesha minimum ($2$) aur maximum ($6$) ke beech hi hogi, isse Option C ($8\\text{ m/s}$) 1 second me eliminate ho jata hai!", "sim": null, "sub": "Physics"}, {"id": 2, "q": "If hydrogen gas is heated to a very high temperature, then the fraction of energy possessed by gas molecules correspond to rotational motion:", "fig": "<svg viewBox=\"0 0 520 155\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Degrees of freedom of H2 at very high temperature\"><rect width=\"520\" height=\"155\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><g transform=\"translate(88,78)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-38\" stroke=\"#60a5fa\" stroke-width=\"2\"/><polygon points=\"0,-43 -4,-35 4,-35\" fill=\"#60a5fa\"/><line x1=\"0\" y1=\"0\" x2=\"40\" y2=\"0\" stroke=\"#60a5fa\" stroke-width=\"2\"/><polygon points=\"45,0 37,-4 37,4\" fill=\"#60a5fa\"/><line x1=\"0\" y1=\"0\" x2=\"-24\" y2=\"24\" stroke=\"#60a5fa\" stroke-width=\"2\"/><polygon points=\"-28,28 -25,19 -19,25\" fill=\"#60a5fa\"/><circle cx=\"-12\" cy=\"0\" r=\"8\" fill=\"#232936\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><circle cx=\"14\" cy=\"0\" r=\"8\" fill=\"#232936\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"-4\" y1=\"0\" x2=\"6\" y2=\"0\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><text x=\"4\" y=\"54\" fill=\"#60a5fa\" font-size=\"12.5\" font-weight=\"600\" text-anchor=\"middle\">Translational = 3</text></g><g transform=\"translate(260,78)\"><line x1=\"-42\" y1=\"0\" x2=\"42\" y2=\"0\" stroke=\"#9aa3b2\" stroke-dasharray=\"3,3\"/><ellipse cx=\"0\" cy=\"0\" rx=\"14\" ry=\"34\" fill=\"none\" stroke=\"#3fb950\" stroke-width=\"2\"/><ellipse cx=\"0\" cy=\"0\" rx=\"28\" ry=\"13\" fill=\"none\" stroke=\"#3fb950\" stroke-width=\"2\" transform=\"rotate(-24)\"/><circle cx=\"-26\" cy=\"0\" r=\"9\" fill=\"#232936\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><circle cx=\"26\" cy=\"0\" r=\"9\" fill=\"#232936\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"-17\" y1=\"0\" x2=\"17\" y2=\"0\" stroke=\"#dcdfe4\" stroke-width=\"2.5\"/><text x=\"0\" y=\"54\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\">Rotational = 2 (2/7)</text></g><g transform=\"translate(432,78)\"><circle cx=\"-32\" cy=\"0\" r=\"9\" fill=\"#232936\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><circle cx=\"32\" cy=\"0\" r=\"9\" fill=\"#232936\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><polyline points=\"-23,0 -17,-7 -10,7 -3,-7 4,7 11,-7 18,7 23,0\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\"/><text x=\"0\" y=\"-26\" fill=\"#9aa3b2\" font-size=\"11\" text-anchor=\"middle\">1 KE + 1 PE</text><text x=\"0\" y=\"54\" fill=\"#f59e0b\" font-size=\"12.5\" font-weight=\"600\" text-anchor=\"middle\">Vibrational = 2</text></g></svg>", "opt": ["$\\frac{3}{5}$", "$\\frac{2}{7}$", "$\\frac{3}{7}$", "$\\frac{2}{5}$"], "ans": 1, "c": "Gas molecules ki total internal energy alag-alag tarah ke motion (<b>Degrees of Freedom</b>, $f$) me banti hoti hai. <b>Law of Equipartition of Energy</b> ke mutabik thermal equilibrium me har energy mode ko barabar average energy $\\frac{1}{2}k_B T$ milti hai. Hydrogen ($\\text{H}_2$) ek <b>linear diatomic molecule</b> hai: normal room temperature par isme sirf Translational ($3$) aur Rotational ($2$) motion active hote hain, lekin <b>very high temperature</b> par atoms ke beech bond spring ki tarah vibrate bhi karne lagta hai, jisse Vibrational mode ($2$ terms: $1$ Kinetic + $1$ Potential) bhi khul jata hai.", "m": "Ek molecule ki rotational energy $E_{\\text{rot}} = f_{\\text{rot}} \\times \\frac{1}{2}k_B T$ aur high temperature par total energy $E_{\\text{total}} = f_{\\text{total}} \\times \\frac{1}{2}k_B T$ likhkar dono ka ratio $\\frac{E_{\\text{rot}}}{E_{\\text{total}}}$ nikalenge.", "s": ["Hydrogen ($\\text{H}_2$) ke space me chalne ke <b>Translational degrees of freedom</b>: $f_{\\text{trans}} = 3$ ($x, y, z$ directions me).", "$\\text{H}_2$ bond axis ke perpendicular sirf $2$ independent axes par ghoom sakta hai, isliye <b>Rotational degrees of freedom</b>: $f_{\\text{rot}} = 2$.", "Sawal me <b>very high temperature</b> diya hai, isliye $1$ vibrational mode active hoga jisme $2$ squared energy terms hoti hain ($1$ kinetic + $1$ potential): $f_{\\text{vib}} = 2$.", "Total degrees of freedom jodte hain:<br>$f_{\\text{total}} = f_{\\text{trans}} + f_{\\text{rot}} + f_{\\text{vib}} = 3 + 2 + 2 = 7$.", "Har mode ko $\\frac{1}{2}k_B T$ energy milti hai, to:<br>$E_{\\text{rot}} = 2 \\times \\frac{1}{2}k_B T$ aur $E_{\\text{total}} = 7 \\times \\frac{1}{2}k_B T$.", "Rotational energy ka fraction nikalte hain ($\\frac{1}{2}k_B T$ upar-neeche poora cancel ho jayega):<br>$\\text{Fraction} = \\frac{E_{\\text{rot}}}{E_{\\text{total}}} = \\frac{2 \\times \\cancel{\\frac{1}{2}k_B T}}{7 \\times \\cancel{\\frac{1}{2}k_B T}} = \\color{#3fb950}{\\frac{2}{7}}$."], "r": "Sahi jawab Option (B) hai: $\\color{#3fb950}{\\frac{2}{7}}$.", "w": ["Option (A) $\\frac{3}{5}$ galat hai — ye room temperature ($f=5$) par translational energy ka fraction hai, high temperature rotational ka nahi.", "Option (C) $\\frac{3}{7}$ galat hai — ye high temperature ($f=7$) par <b>translational</b> motion ($f_{\\text{trans}}=3$) ka fraction hai, jabki sawal me <b>rotational</b> pucha hai.", "Option (D) $\\frac{2}{5}$ galat hai — sabse common trap! Ye moderate/room temperature par rotational fraction hota hai jab vibration active nahi hota ($f = 3 + 2 = 5$)."], "t": "Diatomic gas ($\\text{H}_2, \\text{O}_2, \\text{N}_2$) ke liye ye 3-level chart hamesha dimaag me rakho: Very Low $T \\rightarrow f = 3$; Room/Moderate $T \\rightarrow f = 5$ (rotational fraction $\\frac{2}{5}$); Very High $T \\rightarrow f = 7$ (rotational fraction $\\frac{2}{7}$).", "sim": null, "sub": "Physics"}, {"id": 3, "q": "The position ($x$) of a body moving along $x$-axis at time ($t$) is given by $x = 3t^2$, where $x$ is in metre and $t$ is in second. If mass of body is $2\\text{ kg}$, then find the instantaneous power delivered to body by force acting on it at $t = 4\\text{ s}$.", "fig": "<svg viewBox=\"0 0 520 135\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Body moving along x-axis under constant force\"><rect width=\"520\" height=\"135\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><line x1=\"35\" y1=\"92\" x2=\"485\" y2=\"92\" stroke=\"#9aa3b2\" stroke-width=\"2\"/><polygon points=\"490,92 480,87 480,97\" fill=\"#9aa3b2\"/><text x=\"482\" y=\"114\" fill=\"#9aa3b2\" font-size=\"13\">+x (m)</text><line x1=\"65\" y1=\"86\" x2=\"65\" y2=\"98\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><text x=\"65\" y=\"114\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">x = 0 (t = 0)</text><rect x=\"250\" y=\"52\" width=\"64\" height=\"40\" rx=\"6\" fill=\"#232936\" stroke=\"#60a5fa\" stroke-width=\"2.2\"/><text x=\"282\" y=\"77\" fill=\"#dcdfe4\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">2 kg</text><line x1=\"314\" y1=\"64\" x2=\"392\" y2=\"64\" stroke=\"#f59e0b\" stroke-width=\"2.4\"/><polygon points=\"398,64 389,59 389,69\" fill=\"#f59e0b\"/><text x=\"404\" y=\"68\" fill=\"#f59e0b\" font-size=\"12.5\" font-weight=\"600\">F = ma = 12 N</text><line x1=\"314\" y1=\"80\" x2=\"378\" y2=\"80\" stroke=\"#3fb950\" stroke-width=\"2.4\"/><polygon points=\"384,80 375,75 375,85\" fill=\"#3fb950\"/><text x=\"390\" y=\"84\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"600\">v(4) = 24 m/s</text><text x=\"165\" y=\"34\" fill=\"#dcdfe4\" font-size=\"13\">Position law: x(t) = 3t²</text><text x=\"282\" y=\"114\" fill=\"#60a5fa\" font-size=\"12\" text-anchor=\"middle\">x = 48 m (t = 4 s)</text></svg>", "opt": ["$288\\text{ W}$", "$280\\text{ W}$", "$290\\text{ W}$", "None"], "ans": 0, "c": "Kisi ek particular instant $t$ par force kis rate se body ko energy de rahi hai, use <b>Instantaneous Power</b> kehte hain. Jab force $F$ aur instantaneous velocity $v$ ek hi straight line ($x$-axis) ki direction me hon, to instantaneous power seedha force aur us pal ki velocity ke product ($P = F \\cdot v$) ke barabar hoti hai.", "m": "Position equation $x = 3t^2$ ko time $t$ ke respect me ek baar differentiate karke velocity $v = \\frac{dx}{dt}$ nikalenge aur doosri baar differentiate karke acceleration $a = \\frac{dv}{dt}$ nikalenge. Fir Newton's second law $F = ma$ aur $P = F \\cdot v$ me $t = 4\\text{ s}$ put karenge (aur Work-Energy method $P = \\frac{dK}{dt}$ se cross-check bhi karenge).", "s": ["Diya gaya position function hai:<br>$x = 3t^2$ (aur mass $m = 2\\text{ kg}$).", "Power rule $\\frac{d}{dt}(t^n) = n t^{n-1}$ lagakar velocity $v(t)$ nikalte hain:<br>$v(t) = \\frac{dx}{dt} = 3 \\times 2 t^{2-1} = 6t\\text{ m/s}$.", "$t = 4\\text{ s}$ par velocity nikalte hain:<br>$v(4) = 6 \\times 4 = 24\\text{ m/s}$.", "Ab velocity $v = 6t$ ko time $t$ ke respect me differentiate karke acceleration $a$ nikalte hain:<br>$a = \\frac{dv}{dt} = \\frac{d}{dt}(6t) = 6 \\times 1 = 6\\text{ m/s}^2$.", "Force $F = m \\times a$ calculate karte hain:<br>$F = 2\\text{ kg} \\times 6\\text{ m/s}^2 = 12\\text{ N}$.", "Ab $t = 4\\text{ s}$ par Instantaneous Power $P = F \\times v(4)$ nikalte hain:<br>$P = 12 \\times 24 = 12 \\times (20 + 4) = 240 + 48 = \\color{#3fb950}{288\\text{ W}}$.", "Alternate Verification ($P = \\frac{dK}{dt}$ se): $K = \\frac{1}{\\cancel{2}} \\times \\cancel{2} \\times (6t)^2 = 36t^2\\text{ J} \\Rightarrow P = \\frac{dK}{dt} = 36 \\times 2t = 72t = 72 \\times 4 = 288\\text{ W}$."], "r": "Sahi jawab Option (A) hai: $\\color{#3fb950}{288\\text{ W}}$.", "w": ["Option (B) $280\\text{ W}$ galat hai — ye $12 \\times 24$ ki multiplication me haste me $240 + 40 = 280$ kar dene ki calculation galti se aata hai.", "Option (C) $290\\text{ W}$ galat hai — $12 \\times 24 = 288\\text{ W}$ exact aata hai, rounding ki zarurat nahi hai.", "Option (D) None galat hai — kyunki exact sahi uttar $288\\text{ W}$ Option (A) me maujood hai."], "t": "Jab average power puchi jaye ($t=0$ se $t=4\\text{ s}$ tak) tab $\\frac{\\Delta K}{\\Delta t} = \\frac{36(4)^2}{4} = 144\\text{ W}$ aata — yaani constant acceleration ($u=0$) me <b>instantaneous power</b> at time $t$, <b>average power</b> ka theek double ($2 \\times 144 = 288\\text{ W}$) hoti hai! Sawal me 'instantaneous' shabd dhyan se padho.", "sim": null, "sub": "Physics"}, {"id": 4, "q": "A beaker is completely filled with water at $4^\\circ\\text{C}$. It will overflow if:", "fig": "<svg viewBox=\"0 0 520 170\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Anomalous expansion of water graph\"><rect width=\"520\" height=\"170\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><line x1=\"72\" y1=\"136\" x2=\"465\" y2=\"136\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><polygon points=\"471,136 462,131 462,141\" fill=\"#dcdfe4\"/><line x1=\"72\" y1=\"136\" x2=\"72\" y2=\"24\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><polygon points=\"72,18 67,27 77,27\" fill=\"#dcdfe4\"/><path d=\"M 105 58 Q 225 148 395 44\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\"/><line x1=\"236\" y1=\"101\" x2=\"236\" y2=\"136\" stroke=\"#3fb950\" stroke-width=\"1.8\" stroke-dasharray=\"4,3\"/><circle cx=\"236\" cy=\"101\" r=\"5\" fill=\"#3fb950\"/><text x=\"105\" y=\"154\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">0°C</text><text x=\"236\" y=\"154\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"middle\">4°C (Min Volume)</text><text x=\"415\" y=\"154\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">Temperature T (°C)</text><text x=\"30\" y=\"84\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\" transform=\"rotate(-90 30 84)\">Volume (V)</text><text x=\"145\" y=\"50\" fill=\"#f59e0b\" font-size=\"12\" text-anchor=\"middle\">Cooled (&lt; 4°C): V ↑</text><text x=\"365\" y=\"36\" fill=\"#f59e0b\" font-size=\"12\" text-anchor=\"middle\">Heated (&gt; 4°C): V ↑</text></svg>", "opt": ["heated above $4^\\circ\\text{C}$", "cooled below $4^\\circ\\text{C}$", "both heated and cooled above and below $4^\\circ\\text{C}$ respectively", "none of the above"], "ans": 2, "c": "Aam liquids garm karne par phailte (expand) hain aur thanda karne par sikudte (contract) hain. Lekin paani ($\\text{H}_2\\text{O}$) $0^\\circ\\text{C}$ se $4^\\circ\\text{C}$ ke beech <b>Anomalous Expansion of Water</b> dikhata hai! Paani ki <b>density $4^\\circ\\text{C}$ par sabse zyada (maximum)</b> hoti hai, iska matlab fixed mass ke paani ka <b>volume $4^\\circ\\text{C}$ par sabse kam (minimum)</b> hota hai.", "m": "Volume–Temperature relation $V = \\frac{m}{\\rho}$ use karenge. Kyunki $4^\\circ\\text{C}$ par $\\rho$ maximum aur $V$ minimum hai, isliye $4^\\circ\\text{C}$ se kisi bhi taraf jaane par (garm karne par bhi aur thanda karne par bhi) paani ka volume badhega.", "s": ["Shuruat me $T = 4^\\circ\\text{C}$ par paani ka volume $V_{\\min}$ hai aur beaker bilkul lbalab (brim tak) bhara hua hai.", "<b>Case 1 — Jab $4^\\circ\\text{C}$ se upar garm (heat) karte hain ($T > 4^\\circ\\text{C}$):</b> Thermal agitation badhne se molecules door hote hain, density $\\rho$ ghat-ti hai, isliye paani ka volume $V$ badhta hai $\\Rightarrow$ paani beaker se <b>overflow</b> karega.", "<b>Case 2 — Jab $4^\\circ\\text{C}$ se neeche thanda (cool) karte hain ($0^\\circ\\text{C} \\le T < 4^\\circ\\text{C}$):</b> Hydrogen bonding open cage-like structure banane lagti hai, jisse paani sikudne ke bajaye <b>phailta (expand)</b> hai ($V$ badhta hai), jabki kanch ka beaker thanda hokar halka sa sikudta hai $\\Rightarrow$ paani fir se <b>overflow</b> karega!", "Dono hi sthiti me paani beaker ke bahar chhalkega, isliye Option (C) bilkul sahi hai."], "r": "Sahi jawab Option (C) hai: $\\color{#3fb950}{\\text{both heated and cooled above and below } 4^\\circ\\text{C}\\text{ respectively}}$.", "w": ["Option (A) galat hai — ye adhura sach hai; garm karne par to overflow hoga hi, par $4^\\circ\\text{C}$ se thanda karne par bhi paani phailta hai.", "Option (B) galat hai — ye sirf thanda karne wala case batata hai aur garm karne wale expansion ko chhod deta hai.", "Option (D) galat hai — $4^\\circ\\text{C}$ volume curve ka minimum point hai, dono taraf volume badhta hi hai."], "t": "Neeche diye interactive temperature slider ko $4^\\circ\\text{C}$ se baayein ($0^\\circ\\text{C}$) aur daayein ($10^\\circ\\text{C}$) khiska kar dekho — dono taraf water level beaker ke kinare se upar nikalta saaf dikhega!", "sim": {"type": "water"}, "sub": "Physics"}, {"id": 5, "q": "A projectile is given initial velocity of $\\hat{i} + 2\\hat{j}$. The equation of the path is ($g = 10\\text{ m/s}^2$):", "fig": "<svg viewBox=\"0 0 520 175\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Projectile trajectory curve\"><rect width=\"520\" height=\"175\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><line x1=\"58\" y1=\"142\" x2=\"472\" y2=\"142\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><polygon points=\"478,142 469,137 469,147\" fill=\"#dcdfe4\"/><line x1=\"58\" y1=\"142\" x2=\"58\" y2=\"22\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><polygon points=\"58,16 53,25 63,25\" fill=\"#dcdfe4\"/><path d=\"M 58 142 Q 248 -18 438 142\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"3\"/><line x1=\"58\" y1=\"142\" x2=\"108\" y2=\"44\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/><polygon points=\"111,38 103,44 112,49\" fill=\"#f59e0b\"/><text x=\"165\" y=\"42\" fill=\"#f59e0b\" font-size=\"12.5\" font-weight=\"600\">u = î + 2ĵ (m/s)</text><line x1=\"248\" y1=\"62\" x2=\"248\" y2=\"142\" stroke=\"#9aa3b2\" stroke-dasharray=\"4,3\"/><circle cx=\"248\" cy=\"62\" r=\"4.5\" fill=\"#3fb950\"/><text x=\"248\" y=\"50\" fill=\"#3fb950\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">H<tspan font-size=\"9.5\" dy=\"2.5\">max</tspan><tspan dy=\"-2.5\"> = 0.2 m (x = 0.2 m)</tspan></text><text x=\"58\" y=\"160\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">O (0, 0)</text><text x=\"438\" y=\"160\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">R = 0.4 m</text><text x=\"36\" y=\"34\" fill=\"#dcdfe4\" font-size=\"12.5\">y</text><text x=\"470\" y=\"160\" fill=\"#dcdfe4\" font-size=\"12.5\">x</text></svg>", "opt": ["$y = 2x - 5x^2$", "$y = x - 5x^2$", "$4y = 2x - 5x^2$", "$y = 2x - 25x^2$"], "ans": 0, "c": "<b>Equation of Path (Trajectory)</b> ka matlab hota hai projectile ke coordinates $x$ aur $y$ ke beech aisa relation jisme time $t$ na ho. Horizontal direction ($x$-axis) me gravity ka koi asar nahi hota ($a_x = 0$), jabki vertical direction ($y$-axis) me lagataar downward acceleration $a_y = -g$ lagta hai.", "m": "Initial velocity vector $\\vec{u} = 1\\hat{i} + 2\\hat{j}\\text{ m/s}$ se $u_x = 1\\text{ m/s}$ aur $u_y = 2\\text{ m/s}$ padhenge. Horizontal equation $x = u_x t$ se $t$ nikal kar vertical motion equation $y = u_y t - \\frac{1}{2}gt^2$ me substitute kar denge.", "s": ["Diye gaye initial velocity vector $\\vec{u} = 1\\hat{i} + 2\\hat{j}$ ki comparison $\\vec{u} = u_x\\hat{i} + u_y\\hat{j}$ se karte hain:<br>$u_x = 1\\text{ m/s}$ aur $u_y = 2\\text{ m/s}$.", "Horizontal motion ($a_x = 0$) ke liye position likhte hain:<br>$x = u_x \\cdot t = 1 \\cdot t \\Rightarrow t = x$.", "Vertical motion ($a_y = -g = -10\\text{ m/s}^2$) ke liye equation likhte hain:<br>$y = u_y t - \\frac{1}{2} g t^2$.", "$u_y = 2$ aur $g = 10$ ki values rakhte hain ($2$ se $10$ kat-kar $5$ bacha):<br>$y = 2t - \\frac{1}{\\cancel{2}_{1}} \\times \\cancel{10}^{5} t^2 = 2t - 5t^2$.", "Ab Step 2 se $t = x$ substitute kar dete hain:<br>$\\color{#3fb950}{y = 2x - 5x^2}$.", "Alternate Verification (Standard formula $y = x\\tan\\theta - \\frac{gx^2}{2u_x^2}$ se): $\\tan\\theta = \\frac{u_y}{u_x} = \\frac{2}{1} = 2$ aur $u_x = 1$, to $y = 2x - \\frac{10 x^2}{2 \\times 1^2} = 2x - 5x^2$."], "r": "Sahi jawab Option (A) hai: $\\color{#3fb950}{y = 2x - 5x^2}$.", "w": ["Option (B) $y = x - 5x^2$ galat hai — yahan $\\tan\\theta = \\frac{u_y}{u_x} = \\frac{2}{1}$ ki jagah galti se $1$ le liya gaya hai.", "Option (C) $4y = 2x - 5x^2$ galat hai — $u_x$ aur $u_y$ ko ulta ($u_x = 2, u_y = 1$) rakhne ke baad galat cross-multiply karne se ye banta hai.", "Option (D) $y = 2x - 25x^2$ galat hai — $\\frac{1}{2}gt^2 = 5t^2$ ka fir se square karke $25$ likh dene ki common mistake se aata hai."], "t": "Jab initial velocity vector form $\\vec{u} = a\\hat{i} + b\\hat{j}$ me di ho, to $\\theta$ aur $\\cos\\theta$ nikalne me waqt barbaad mat karo — seedha yaad rakho: $y = \\frac{b}{a}x - \\frac{g}{2a^2}x^2$! Aur neeche time slider chala kar dekho kaise har pal $y = 2x - 5x^2$ follow hota hai.", "sim": {"type": "proj"}, "sub": "Physics"}, {"id": 6, "q": "Two protons (each of charge $Q$ and mass $m$) are separated by a distance $R$. What will be the speed of each proton when they reach infinity under their mutual repulsion?", "fig": "<svg viewBox=\"0 0 520 165\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Two protons repulsion to infinity\"><rect width=\"520\" height=\"165\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><text x=\"260\" y=\"24\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">Initial State (At rest: u = 0, separation = R)</text><circle cx=\"195\" cy=\"56\" r=\"13\" fill=\"#232936\" stroke=\"#60a5fa\" stroke-width=\"2.2\"/><text x=\"195\" y=\"60\" fill=\"#dcdfe4\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\">+Q</text><circle cx=\"325\" cy=\"56\" r=\"13\" fill=\"#232936\" stroke=\"#60a5fa\" stroke-width=\"2.2\"/><text x=\"325\" y=\"60\" fill=\"#dcdfe4\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\">+Q</text><line x1=\"210\" y1=\"56\" x2=\"310\" y2=\"56\" stroke=\"#f59e0b\" stroke-width=\"1.8\" stroke-dasharray=\"4,3\"/><text x=\"260\" y=\"50\" fill=\"#f59e0b\" font-size=\"12.5\" font-weight=\"600\" text-anchor=\"middle\">R</text><line x1=\"45\" y1=\"88\" x2=\"475\" y2=\"88\" stroke=\"#283040\" stroke-width=\"1.5\"/><text x=\"260\" y=\"108\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">Final State (At r → ∞, U<tspan font-size=\"9.5\" dy=\"2.5\">f</tspan><tspan dy=\"-2.5\"> = 0, equal speeds v)</tspan></text><circle cx=\"135\" cy=\"136\" r=\"13\" fill=\"#232936\" stroke=\"#3fb950\" stroke-width=\"2.2\"/><text x=\"135\" y=\"140\" fill=\"#dcdfe4\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\">+Q</text><line x1=\"118\" y1=\"136\" x2=\"62\" y2=\"136\" stroke=\"#3fb950\" stroke-width=\"2.4\"/><polygon points=\"56,136 65,131 65,141\" fill=\"#3fb950\"/><text x=\"88\" y=\"127\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"600\" text-anchor=\"middle\">v (mass m)</text><circle cx=\"385\" cy=\"136\" r=\"13\" fill=\"#232936\" stroke=\"#3fb950\" stroke-width=\"2.2\"/><text x=\"385\" y=\"140\" fill=\"#dcdfe4\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\">+Q</text><line x1=\"402\" y1=\"136\" x2=\"458\" y2=\"136\" stroke=\"#3fb950\" stroke-width=\"2.4\"/><polygon points=\"464,136 455,131 455,141\" fill=\"#3fb950\"/><text x=\"432\" y=\"127\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"600\" text-anchor=\"middle\">v (mass m)</text></svg>", "opt": ["$\\frac{Q}{mR}$", "$\\frac{2Q}{mR}$", "$\\frac{Q}{\\sqrt{4\\pi\\epsilon_0 m R}}$", "$\\frac{Q^2}{4\\pi\\epsilon_0 m R}$"], "ans": 2, "c": "Dono protons par positive charge $+Q$ hai, isliye chhodte hi electrostatic repulsion unhe ek-doosre se door dhakelta hai. Bahar se koi external force nahi lag rahi, isliye do laws ek saath kaam karte hain: <b>Conservation of Linear Momentum</b> (chuki shuru me system rest par tha aur dono ka mass $m$ barabar hai, dono ulte directions me <b>bilkul barabar speed $v$</b> se bhagenge!) aur <b>Conservation of Mechanical Energy</b> (shuru ki poori Electrostatic Potential Energy infinity par <b>dono protons</b> ki Kinetic Energy me badal jayegi!).", "m": "Total initial energy $U_i + K_i$ ko infinity ($r \\to \\infty$, jahan $U_f = 0$) ki total final energy $U_f + K_f$ ke barabar rakhenge, dhyan rakhte hue ki <b>dono</b> protons chal rahe hain isliye $K_f = \\frac{1}{2}mv^2 + \\frac{1}{2}mv^2 = mv^2$ hogi.", "s": ["Shuru me dono protons rest par hain, to initial kinetic energy:<br>$K_i = 0$.", "Distance $R$ par rakhe do charges $+Q$ aur $+Q$ ki initial electrostatic potential energy:<br>$U_i = \\frac{1}{4\\pi\\epsilon_0} \\frac{Q \\cdot Q}{R} = \\frac{Q^2}{4\\pi\\epsilon_0 R}$.", "Jab dono infinity ($r \\to \\infty$) par pahunchte hain, to electrostatic potential energy zero ho jati hai:<br>$U_f = 0$.", "Momentum conservation ($0 = m v_1 - m v_2 \\Rightarrow v_1 = v_2 = v$) se <b>dono</b> protons ki total final kinetic energy:<br>$K_f = \\frac{1}{2}mv^2 + \\frac{1}{2}mv^2 = \\left(\\frac{1 + 1}{2}\\right)mv^2 = \\frac{\\cancel{2}}{\\cancel{2}}mv^2 = mv^2$.", "Conservation of Mechanical Energy ($U_i + K_i = U_f + K_f$) lagate hain:<br>$\\frac{Q^2}{4\\pi\\epsilon_0 R} + 0 = 0 + m v^2$.", "Dono taraf $m$ se divide karte hain:<br>$v^2 = \\frac{Q^2}{4\\pi\\epsilon_0 m R}$.", "Dono taraf square root lete hain ($\\sqrt{Q^2} = Q$ bahar aa jayega):<br>$v = \\sqrt{\\frac{Q^2}{4\\pi\\epsilon_0 m R}} = \\color{#3fb950}{\\frac{Q}{\\sqrt{4\\pi\\epsilon_0 m R}}}$.", "Verification (Dimensional check): $\\frac{Q^2}{4\\pi\\epsilon_0 R}$ Energy ($\\text{J}$) hai, use $m$ se divide kiya to $\\frac{\\text{Energy}}{\\text{mass}} = v^2$ mila, aur square root lene par exact speed $v$ mili!"], "r": "Sahi jawab Option (C) hai: $\\color{#3fb950}{\\frac{Q}{\\sqrt{4\\pi\\epsilon_0 m R}}}$.", "w": ["Option (A) $\\frac{Q}{mR}$ galat hai — isme Coulomb constant $\\frac{1}{4\\pi\\epsilon_0}$ aur square root dono gayab hain, dimensions bhi speed ki nahi hain.", "Option (B) $\\frac{2Q}{mR}$ galat hai — ye bhi dimensionally galat expression hai.", "Option (D) $\\frac{Q^2}{4\\pi\\epsilon_0 m R}$ galat hai — sabse aam galti! Ye $v^2$ ki value hai; aakhri step me square root lena bhool jaane par student ye tick kar deta hai."], "t": "Dhyan dena: Agar ek proton <b>fixed</b> hota aur sirf doosra free hota, tab $K_f = \\frac{1}{2}mv^2$ hota aur uttar $\\frac{Q}{\\sqrt{2\\pi\\epsilon_0 m R}}$ aata! Yahan <b>dono free</b> hain isliye $\\frac{1}{2}mv^2 + \\frac{1}{2}mv^2$ judkar $mv^2$ ban gaya!", "sim": null, "sub": "Physics"}, {"id": 7, "q": "A vector is represented by $3\\hat{i} + \\hat{j} + 2\\hat{k}$. Its length in $XY$ plane is:", "fig": "<svg viewBox=\"0 0 520 185\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"3D vector projection onto XY plane\"><rect width=\"520\" height=\"185\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><polygon points=\"150,122 330,122 275,160 95,160\" fill=\"#1c2330\" stroke=\"#2f3a4f\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"122\" x2=\"365\" y2=\"122\" stroke=\"#9aa3b2\" stroke-width=\"1.8\"/><text x=\"378\" y=\"126\" fill=\"#dcdfe4\" font-size=\"13\">X</text><line x1=\"150\" y1=\"122\" x2=\"82\" y2=\"168\" stroke=\"#9aa3b2\" stroke-width=\"1.8\"/><text x=\"68\" y=\"172\" fill=\"#dcdfe4\" font-size=\"13\">Y</text><line x1=\"150\" y1=\"122\" x2=\"150\" y2=\"22\" stroke=\"#9aa3b2\" stroke-width=\"1.8\"/><text x=\"150\" y=\"16\" fill=\"#dcdfe4\" font-size=\"13\" text-anchor=\"middle\">Z</text><line x1=\"295\" y1=\"54\" x2=\"295\" y2=\"146\" stroke=\"#f59e0b\" stroke-width=\"1.8\" stroke-dasharray=\"4,3\"/><line x1=\"150\" y1=\"122\" x2=\"295\" y2=\"146\" stroke=\"#3fb950\" stroke-width=\"3\"/><polygon points=\"301,147 291,141 290,150\" fill=\"#3fb950\"/><line x1=\"150\" y1=\"122\" x2=\"295\" y2=\"54\" stroke=\"#60a5fa\" stroke-width=\"3\"/><polygon points=\"301,51 290,51 294,60\" fill=\"#60a5fa\"/><text x=\"212\" y=\"74\" fill=\"#60a5fa\" font-size=\"12.5\" font-weight=\"600\">A = 3î + ĵ + 2k̂</text><text x=\"310\" y=\"102\" fill=\"#f59e0b\" font-size=\"12\">z = 2</text><text x=\"235\" y=\"164\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"700\">XY projection = √(3² + 1²) = √10</text></svg>", "opt": ["$2$", "$\\sqrt{14}$", "$\\sqrt{10}$", "$\\sqrt{5}$"], "ans": 2, "c": "Kisi $3\\text{D}$ vector ki <b>$XY$-plane me length</b> ka matlab hota hai ki agar upar ($Z$-axis ki disha) se torch maari jaye, to $XY$-floor par us vector ki parछाईं (<b>orthogonal projection / component vector in $XY$-plane</b>) kitni lambi dikhegi. $XY$-plane par har point ka $z$-coordinate zero hota hai, isliye $z$-component ($2\\hat{k}$) projection me hissa nahi leta.", "m": "Vector $\\vec{A} = A_x\\hat{i} + A_y\\hat{j} + A_z\\hat{k}$ ka $XY$-plane component $\\vec{A}_{XY} = A_x\\hat{i} + A_y\\hat{j}$ likhenge aur Pythagoras theorem se uska magnitude $L_{XY} = \\sqrt{A_x^2 + A_y^2}$ nikalenge.", "s": ["Diye gaye vector $\\vec{A} = 3\\hat{i} + 1\\hat{j} + 2\\hat{k}$ ke teeno components likhte hain:<br>$A_x = 3$, $A_y = 1$, aur $A_z = 2$.", "$XY$-plane me projection vector sirf $\\hat{i}$ aur $\\hat{j}$ components se banta hai:<br>$\\vec{A}_{XY} = 3\\hat{i} + 1\\hat{j}$.", "Ab $XY$-plane me length $L_{XY}$ nikalte hain:<br>$L_{XY} = \\sqrt{A_x^2 + A_y^2} = \\sqrt{3^2 + 1^2}$.", "Squares kholkar jodte hain ($3^2 = 9$ aur $1^2 = 1$):<br>$L_{XY} = \\sqrt{9 + 1} = \\color{#3fb950}{\\sqrt{10}}$.", "Alternate Verification ($3\\text{D}$ Pythagoras se): Poori $3\\text{D}$ length $|\\vec{A}| = \\sqrt{3^2 + 1^2 + 2^2} = \\sqrt{9 + 1 + 4} = \\sqrt{14}$; aur $L_{XY} = \\sqrt{|\\vec{A}|^2 - A_z^2} = \\sqrt{14 - 2^2} = \\sqrt{14 - 4} = \\sqrt{10}$."], "r": "Sahi jawab Option (C) hai: $\\color{#3fb950}{\\sqrt{10}}$.", "w": ["Option (A) $2$ galat hai — ye vector ka $Z$-axis component ($A_z = 2$) hai, $XY$-plane ki length nahi.", "Option (B) $\\sqrt{14}$ galat hai — classic jaldbaazi trap! Ye poore $3\\text{D}$ vector ki kul lambai $\\sqrt{3^2+1^2+2^2}$ hai; student 'in $XY$ plane' padhna chhod dete hain.", "Option (D) $\\sqrt{5}$ galat hai — ye $Y$ aur $Z$ components ($\\sqrt{1^2 + 2^2} = \\sqrt{5}$) se nikal aata hai, jo asal me $YZ$-plane ki length hai."], "t": "Jis plane me length puchi ho, bas unhi do axes ke coefficients ka root-sum-square lo: $XY \\rightarrow \\sqrt{A_x^2 + A_y^2}$, $YZ \\rightarrow \\sqrt{A_y^2 + A_z^2}$, $XZ \\rightarrow \\sqrt{A_x^2 + A_z^2}$!", "sim": null, "sub": "Physics"}, {"id": 8, "q": "In the following figure, the pulley is massless and frictionless. The relation between $T_1$, $T_2$ and $T_3$ will be:", "fig": "<svg viewBox=\"0 0 520 205\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Pulley string tension figure\"><rect width=\"520\" height=\"205\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><rect x=\"92\" y=\"20\" width=\"10\" height=\"46\" fill=\"#2d3648\" stroke=\"#9aa3b2\" stroke-width=\"1.5\"/><line x1=\"102\" y1=\"34\" x2=\"232\" y2=\"96\" stroke=\"#dcdfe4\" stroke-width=\"2.4\"/><line x1=\"232\" y1=\"96\" x2=\"356\" y2=\"37\" stroke=\"#dcdfe4\" stroke-width=\"2.4\"/><line x1=\"232\" y1=\"26\" x2=\"232\" y2=\"96\" stroke=\"#9aa3b2\" stroke-width=\"1.6\" stroke-dasharray=\"4,3\"/><path d=\"M 205 83 A 30 30 0 0 1 232 66\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"1.8\"/><path d=\"M 232 66 A 30 30 0 0 1 259 83\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"1.8\"/><text x=\"213\" y=\"62\" fill=\"#f59e0b\" font-size=\"13.5\" font-weight=\"600\">θ</text><text x=\"245\" y=\"62\" fill=\"#f59e0b\" font-size=\"13.5\" font-weight=\"600\">θ</text><line x1=\"232\" y1=\"96\" x2=\"232\" y2=\"146\" stroke=\"#dcdfe4\" stroke-width=\"2.4\"/><rect x=\"210\" y=\"146\" width=\"44\" height=\"36\" rx=\"4\" fill=\"#232936\" stroke=\"#60a5fa\" stroke-width=\"2\"/><text x=\"232\" y=\"169\" fill=\"#dcdfe4\" font-size=\"13.5\" font-weight=\"700\" text-anchor=\"middle\">W₁</text><circle cx=\"366\" cy=\"48\" r=\"15\" fill=\"#232936\" stroke=\"#dcdfe4\" stroke-width=\"2.4\"/><circle cx=\"366\" cy=\"48\" r=\"3\" fill=\"#9aa3b2\"/><line x1=\"381\" y1=\"48\" x2=\"381\" y2=\"128\" stroke=\"#dcdfe4\" stroke-width=\"2.4\"/><rect x=\"359\" y=\"128\" width=\"44\" height=\"36\" rx=\"4\" fill=\"#232936\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"381\" y=\"151\" fill=\"#dcdfe4\" font-size=\"13.5\" font-weight=\"700\" text-anchor=\"middle\">W₂</text><text x=\"155\" y=\"84\" fill=\"#60a5fa\" font-size=\"14\" font-weight=\"700\">T₁</text><text x=\"302\" y=\"84\" fill=\"#60a5fa\" font-size=\"14\" font-weight=\"700\">T₂</text><text x=\"395\" y=\"96\" fill=\"#3fb950\" font-size=\"14\" font-weight=\"700\">T₃</text></svg>", "opt": ["$T_1 = T_2 \\neq T_3$", "$T_1 \\neq T_2 = T_3$", "$T_1 \\neq T_2 \\neq T_3$", "$T_1 = T_2 = T_3$"], "ans": 3, "c": "Is figure me do main physics concepts lag rahe hain: Pehla — jab system <b>equilibrium</b> (sthir avastha) me hai, to knot (jahan teeno rassiyan milti hain) par left aur right ke horizontal force components bilkul barabar hone chahiye. Doosra — jab ek single light string <b>massless aur frictionless pulley</b> ke upar se guzarti hai, to pulley ke dono taraf rassi ka tension bilkul same rehta hai.", "m": "Pehle central knot ka Free-Body Diagram (FBD) banakar horizontal force balance ($\\sum F_x = 0$) se $T_1$ aur $T_2$ ka relation nikalenge, fir ideal pulley ki property se $T_2$ aur $T_3$ ko compare karenge.", "s": ["Central knot (jiske neeche $W_1$ latka hai) par $T_1$ vertical ke saath left me angle $\\theta$ banata hai aur $T_2$ vertical ke saath right me barabar angle $\\theta$ banata hai.", "Knot ke horizontal components lete hain:<br>Leftward component $= T_1 \\sin\\theta$ aur Rightward component $= T_2 \\sin\\theta$.<svg viewBox=\"0 0 420 120\" width=\"100%\" style=\"max-width:420px;display:block;margin:8px auto\" role=\"img\" aria-label=\"Free body diagram at knot\"><rect width=\"420\" height=\"120\" rx=\"8\" fill=\"#12141a\" stroke=\"#283040\"/><circle cx=\"210\" cy=\"65\" r=\"5\" fill=\"#dcdfe4\"/><line x1=\"210\" y1=\"65\" x2=\"108\" y2=\"65\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><polygon points=\"102,65 111,60 111,70\" fill=\"#60a5fa\"/><text x=\"108\" y=\"48\" fill=\"#60a5fa\" font-size=\"12.5\" font-weight=\"600\">T₁ sin θ (Left)</text><line x1=\"210\" y1=\"65\" x2=\"312\" y2=\"65\" stroke=\"#3fb950\" stroke-width=\"2.5\"/><polygon points=\"318,65 309,60 309,70\" fill=\"#3fb950\"/><text x=\"242\" y=\"48\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"600\">T₂ sin θ (Right)</text><text x=\"210\" y=\"98\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">Horizontal balance: T₁ sin θ = T₂ sin θ ⇒ T₁ = T₂</text></svg>", "Equilibrium me horizontal net force zero hoti hai ($\\sum F_x = 0$):<br>$T_1 \\sin\\theta = T_2 \\sin\\theta$.", "Dono taraf $\\sin\\theta$ common hai to cancel ho jayega:<br>$T_1 \\cancel{\\sin\\theta} = T_2 \\cancel{\\sin\\theta} \\Rightarrow T_1 = T_2$.", "Ab pulley ko dekho: right wali rassi pulley ke upar se hokar $W_2$ tak ja rahi hai. Kyunki pulley <b>massless aur frictionless</b> hai, isliye pulley ke dono taraf tension barabar hogi:<br>$T_2 = T_3$.", "Step 4 ($T_1 = T_2$) aur Step 5 ($T_2 = T_3$) ko milane par:<br>$\\color{#3fb950}{T_1 = T_2 = T_3}$.", "Verification (Vertical balance check): $T_1\\cos\\theta + T_2\\cos\\theta = W_1 \\Rightarrow 2 T_2\\cos\\theta = W_1$ aur $T_3 = W_2$, jo har aisi equilibrium angle $\\theta$ jahan $\\cos\\theta = \\frac{W_1}{2W_2}$ ho, bilkul satisfy hota hai!"], "r": "Sahi jawab Option (D) hai: $\\color{#3fb950}{T_1 = T_2 = T_3}$.", "w": ["Option (A) $T_1 = T_2 \\neq T_3$ galat hai — horizontal symmetry to pakad li, par ideal frictionless pulley par $T_2 = T_3$ bhool gaye.", "Option (B) $T_1 \\neq T_2 = T_3$ galat hai — pulley par $T_2 = T_3$ sahi lagaya, lekin equal angle $\\theta$ se $T_1\\sin\\theta = T_2\\sin\\theta$ miss kar diya.", "Option (C) $T_1 \\neq T_2 \\neq T_3$ galat hai — $W_1$ aur $W_2$ alag dekhkar bina FBD banaye sab tensions alag maan lena galat hai."], "t": "Knot problems ka Golden Rule: Agar knot ke upar wali dono strings vertical se <b>barabar angle $\\theta$</b> banayein aur neeche wala load seedha vertical latke, to chahe neeche kitna bhi weight ho, dono upper strings ka tension <b>hamesha barabar ($T_1 = T_2$)</b> hoga!", "sim": null, "sub": "Physics"}, {"id": 9, "q": "The speed of a particle moving in a circle slows down at a rate of $3\\text{ m/sec}^2$. At some instant the magnitude of the total acceleration is $5\\text{ m/sec}^2$ and the particle speed is $12\\text{ m/sec}$. The radius of circle will be:", "fig": "<svg viewBox=\"0 0 520 190\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Circular motion tangential and centripetal acceleration\"><rect width=\"520\" height=\"190\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><circle cx=\"195\" cy=\"95\" r=\"68\" fill=\"none\" stroke=\"#9aa3b2\" stroke-width=\"1.8\" stroke-dasharray=\"5,4\"/><circle cx=\"195\" cy=\"95\" r=\"4\" fill=\"#dcdfe4\"/><text x=\"180\" y=\"99\" fill=\"#9aa3b2\" font-size=\"12.5\">O</text><circle cx=\"263\" cy=\"95\" r=\"6\" fill=\"#dcdfe4\"/><line x1=\"263\" y1=\"95\" x2=\"263\" y2=\"30\" stroke=\"#3fb950\" stroke-width=\"2.4\"/><polygon points=\"263,24 258,33 268,33\" fill=\"#3fb950\"/><text x=\"275\" y=\"36\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"600\">v = 12 m/s</text><line x1=\"263\" y1=\"95\" x2=\"263\" y2=\"148\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/><polygon points=\"263,154 258,145 268,145\" fill=\"#f59e0b\"/><text x=\"275\" y=\"152\" fill=\"#f59e0b\" font-size=\"12.5\" font-weight=\"600\">a<tspan font-size=\"9.5\" dy=\"2.5\">t</tspan><tspan dy=\"-2.5\"> = 3 m/s² (slowing)</tspan></text><line x1=\"263\" y1=\"95\" x2=\"205\" y2=\"95\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><polygon points=\"199,95 208,90 208,100\" fill=\"#60a5fa\"/><text x=\"228\" y=\"84\" fill=\"#60a5fa\" font-size=\"12\" font-weight=\"600\" text-anchor=\"middle\">a<tspan font-size=\"9.5\" dy=\"2.5\">c</tspan><tspan dy=\"-2.5\"> = 4</tspan></text><line x1=\"263\" y1=\"95\" x2=\"205\" y2=\"148\" stroke=\"#e5534b\" stroke-width=\"2.6\"/><polygon points=\"200,152 204,142 211,149\" fill=\"#e5534b\"/><text x=\"155\" y=\"164\" fill=\"#e5534b\" font-size=\"12.5\" font-weight=\"700\">a = 5 m/s²</text><text x=\"405\" y=\"88\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\">a² = a<tspan font-size=\"9.5\" dy=\"2.5\">t</tspan><tspan dy=\"-2.5\">² + a</tspan><tspan font-size=\"9.5\" dy=\"2.5\">c</tspan><tspan dy=\"-2.5\">²</tspan></text><text x=\"405\" y=\"112\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">5² = 3² + a<tspan font-size=\"9.5\" dy=\"2.5\">c</tspan><tspan dy=\"-2.5\">² ⇒ a</tspan><tspan font-size=\"9.5\" dy=\"2.5\">c</tspan><tspan dy=\"-2.5\"> = 4 m/s²</tspan></text></svg>", "opt": ["$12\\text{ m}$", "$24\\text{ m}$", "$36\\text{ m}$", "$48\\text{ m}$"], "ans": 2, "c": "Jab koi particle circle me ghoomte hue apni <b>speed badalta</b> hai (non-uniform circular motion), to us par <b>do perpendicular accelerations</b> ek saath lagti hain:<br>1. <b>Tangential acceleration ($a_t$):</b> Circle ke tangent ke along, jo sirf speed ghatane ya badhane ka kaam karti hai ($a_t = \\left|\\frac{dv}{dt}\\right|$).<br>2. <b>Centripetal acceleration ($a_c$):</b> Hamesha circle ke centre ki taraf, jo rasta modne ka kaam karti hai ($a_c = \\frac{v^2}{R}$).<br>Kyunki radius aur tangent hamesha $90^\\circ$ par hote hain, isliye total acceleration $a = \\sqrt{a_t^2 + a_c^2}$ hoti hai.", "m": "Pehle perpendicular relation $a^2 = a_t^2 + a_c^2$ me $a = 5\\text{ m/s}^2$ aur $a_t = 3\\text{ m/s}^2$ rakhkar centripetal acceleration $a_c$ nikalenge. Fir $a_c = \\frac{v^2}{R}$ me $v = 12\\text{ m/s}$ rakhkar radius $R$ solve karenge.", "s": ["Sawal me diya hai: speed ghatne ki rate (tangential acceleration magnitude) $a_t = 3\\text{ m/s}^2$, total acceleration $a = 5\\text{ m/s}^2$, aur speed $v = 12\\text{ m/s}$.", "Perpendicular vectors ke formula $a^2 = a_t^2 + a_c^2$ me values rakhte hain:<br>$5^2 = 3^2 + a_c^2$.", "Squares calculate karte hain ($5^2 = 25$ aur $3^2 = 9$):<br>$25 = 9 + a_c^2$.", "$9$ ko left side le jaakar ghatate hain:<br>$a_c^2 = 25 - 9 = 16 \\Rightarrow a_c = \\sqrt{16} = 4\\text{ m/s}^2$.", "Ab centripetal acceleration ka formula lagate hain:<br>$a_c = \\frac{v^2}{R} \\Rightarrow 4 = \\frac{12^2}{R}$.", "$12^2 = 12 \\times 12 = 144$ rakhkar $R$ nikalte hain ($4$ se $144$ ko divide karte hain: $4 \\times 30 = 120$ aur $4 \\times 6 = 24$, kul $36$):<br>$R = \\frac{\\cancel{144}^{36}}{\\cancel{4}_{1}} = \\color{#3fb950}{36\\text{ m}}$.", "Verification (Back-substitution): Agar $R = 36\\text{ m}$ hai, to $a_c = \\frac{144}{36} = 4\\text{ m/s}^2$, aur total acceleration $\\sqrt{3^2 + 4^2} = \\sqrt{9 + 16} = \\sqrt{25} = 5\\text{ m/s}^2$ — bilkul match!"], "r": "Sahi jawab Option (C) hai: $\\color{#3fb950}{36\\text{ m}}$.", "w": ["Option (A) $12\\text{ m}$ galat hai — $\\frac{v^2}{a_t}$ me $v$ ka square bhool kar $\\frac{48}{4}$ ya $\\frac{36}{3}$ jaisi adhori ginti karne se aata hai.", "Option (B) $24\\text{ m}$ galat hai — agar koi $a_c$ nikalne ke bajaye $a_t + a_c$ jaisa galat जोड़-घटाव ($5 + 1 = 6$, $\\frac{144}{6} = 24\\text{ m}$) kar de.", "Option (D) $48\\text{ m}$ galat hai — classic galti! Student $a_t = 3\\text{ m/s}^2$ ko hi centripetal maan kar $R = \\frac{v^2}{3} = \\frac{144}{3} = 48\\text{ m}$ nikal lete hain!"], "t": "$3\\text{–}4\\text{–}5$ Pythagorean triplet NEET Physics ka favourite pattern hai! Jahan total acceleration $5$ aur ek component $3$ dikhe, samajh jao doosra component turant $4$ hoga.", "sim": null, "sub": "Physics"}, {"id": 10, "q": "$1\\text{ joule}$ of energy is to be converted into new system of units in which length is measured in $10\\text{ metres}$, mass in $10\\text{ kg}$ and time in $1\\text{ minute}$. The numerical value of $1\\text{ J}$ in the new system is:", "fig": "<svg viewBox=\"0 0 520 150\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"SI to new unit conversion summary\"><rect width=\"520\" height=\"150\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><rect x=\"28\" y=\"22\" width=\"196\" height=\"106\" rx=\"8\" fill=\"#1b1f27\" stroke=\"#60a5fa\" stroke-width=\"1.6\"/><text x=\"126\" y=\"44\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">SI System (n₁ = 1)</text><text x=\"126\" y=\"68\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\">M₁ = 1 kg</text><text x=\"126\" y=\"89\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\">L₁ = 1 m</text><text x=\"126\" y=\"110\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\">T₁ = 1 s</text><line x1=\"234\" y1=\"75\" x2=\"282\" y2=\"75\" stroke=\"#f59e0b\" stroke-width=\"2.4\"/><polygon points=\"288,75 279,70 279,80\" fill=\"#f59e0b\"/><text x=\"260\" y=\"62\" fill=\"#f59e0b\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\">[M¹L²T⁻²]</text><rect x=\"296\" y=\"22\" width=\"196\" height=\"106\" rx=\"8\" fill=\"#1b1f27\" stroke=\"#3fb950\" stroke-width=\"1.6\"/><text x=\"394\" y=\"44\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">New System (n₂ = ?)</text><text x=\"394\" y=\"68\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\">M₂ = 10 kg</text><text x=\"394\" y=\"89\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\">L₂ = 10 m</text><text x=\"394\" y=\"110\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\">T₂ = 1 min = 60 s</text></svg>", "opt": ["$36 \\times 10^{-4}$", "$36 \\times 10^{-3}$", "$36 \\times 10^{-2}$", "$36 \\times 10^{-1}$"], "ans": 3, "c": "Kisi physical quantity ki asli value ($Q = n_1 u_1 = n_2 u_2$) unit system badalne se kabhi nahi badalti — bas numerical number $n$ aur unit size $u$ ek-doosre ke ulte hisaab se adjust ho jaate hain. Energy (Work = Force $\\times$ Displacement = $m a \\cdot s$) ka dimensional formula $[M^1 L^2 T^{-2}]$ hota hai.", "m": "Dimensional unit conversion formula $n_2 = n_1 \\left(\\frac{M_1}{M_2}\\right)^{1} \\left(\\frac{L_1}{L_2}\\right)^{2} \\left(\\frac{T_1}{T_2}\\right)^{-2}$ use karenge, jahan index $1$ SI system hai aur index $2$ naya system hai.", "s": ["Dono systems ki base units ko ek hi common unit ($\\text{kg}, \\text{m}, \\text{s}$) me likhte hain:<br>$M_1 = 1\\text{ kg},\\; M_2 = 10\\text{ kg}$<br>$L_1 = 1\\text{ m},\\; L_2 = 10\\text{ m}$<br>$T_1 = 1\\text{ s},\\; T_2 = 1\\text{ min} = 60\\text{ s}$, aur $n_1 = 1$.", "Energy ke dimensional powers $a = 1,\\; b = 2,\\; c = -2$ ko formula me rakhte hain:<br>$n_2 = 1 \\times \\left(\\frac{1\\text{ kg}}{10\\text{ kg}}\\right)^{1} \\times \\left(\\frac{1\\text{ m}}{10\\text{ m}}\\right)^{2} \\times \\left(\\frac{1\\text{ s}}{60\\text{ s}}\\right)^{-2}$.", "Units ($\\text{kg}, \\text{m}, \\text{s}$) upar-neeche cancel ho gayin; ab har bracket ko alag-alag solve karte hain:<br>Pehla bracket: $\\left(\\frac{1}{10}\\right)^{1} = \\frac{1}{10}$.<br>Doosra bracket: $\\left(\\frac{1}{10}\\right)^{2} = \\frac{1}{100}$.<br>Teesra bracket (negative power fraction ko palat deti hai!): $\\left(\\frac{1}{60}\\right)^{-2} = (60)^{2} = 60 \\times 60 = 3600$.", "Teeno results ko multiply karte hain (do zeroes upar-neeche seedhe cancel ho jayengi!):<br>$n_2 = \\frac{1}{10} \\times \\frac{1}{\\cancel{100}_{1}} \\times \\cancel{3600}^{36} = \\frac{36}{10}$.", "Power of $10$ ke roop me likhte hain ($\\frac{1}{10} = 10^{-1}$):<br>$n_2 = 3.6 = \\color{#3fb950}{36 \\times 10^{-1}}$.", "Verification (Direct unit substitution se): $1\\text{ new energy unit} = \\frac{(10\\text{ kg})(10\\text{ m})^2}{(60\\text{ s})^2} = \\frac{1000}{3600}\\text{ J} = \\frac{10}{36}\\text{ J} \\Rightarrow 1\\text{ J} = \\frac{36}{10} = 36 \\times 10^{-1}\\text{ new units}$!"], "r": "Sahi jawab Option (D) hai: $\\color{#3fb950}{36 \\times 10^{-1}}$.", "w": ["Option (A) $36 \\times 10^{-4}$ galat hai — $\\frac{36}{10}$ me decimal ya power of $10$ ko ulta ginkar $10^{-4}$ likh dene se aata hai.", "Option (B) $36 \\times 10^{-3}$ galat hai — agar $3600$ ki do zeroes hataane ke baad niche ka $1000$ j्यों-ka-tyon $\\frac{36}{1000} = 36 \\times 10^{-3}$ reh jaye (double cancellation error!).", "Option (C) $36 \\times 10^{-2}$ galat hai — agar length ka square $(10)^2 = 100$ lene ke baad ek factor $10$ extra bacha reh jaye ($3.6$ ko galti se $36 \\times 10^{-2}$ likh dena — jabki $36 \\times 10^{-2} = 0.36$ hota hai!)."], "t": "Aakhri step me $3.6$ ko scientific options me badalte waqt hamesha ulta check karo: $36 \\times 10^{-1} = \\frac{36}{10} = 3.6$ (Sahi!), jabki $36 \\times 10^{-2} = 0.36$! Bahut saare students poora sawal sahi karke aakhri $2$ second me $3.6 = 36 \\times 10^{-2}$ tick kar aate hain!", "sim": null, "sub": "Physics"}, {"id": 11, "sub": "Physics", "q": "Sixty-four spherical rain drops of equal size are falling vertically through air with a terminal velocity 1.5 m s⁻¹. If these drops coalesce to form a big spherical drop, then terminal velocity of big drop is:", "fig": "", "opt": ["8 m s⁻¹", "16 m s⁻¹", "24 m s⁻¹", "32 m s⁻¹"], "ans": 2, "c": "Stokes' law ke mutabik viscous medium (air) me girte hue spherical drop ki <b>terminal velocity</b> drop ke radius ke square ke directly proportional hoti hai ($v_T \\propto r^2$). Jab $N$ chhote drops milkar ek bada drop banate hain, to <b>total volume conserved</b> rehta hai.", "m": "Volume conservation $N \\cdot \\frac{4}{3}\\pi r^3 = \\frac{4}{3}\\pi R^3$ se bade drop ka radius $R$ nikalenge, fir $V_T = v_T \\left(\\frac{R}{r}\\right)^2$ lagayenge.", "s": ["$64$ chhote drops ka kul volume $=$ bade drop ka volume:<br>$64 \\times \\cancel{\\frac{4}{3}\\pi} r^3 = \\cancel{\\frac{4}{3}\\pi} R^3 \\Rightarrow R^3 = 64 r^3$.", "Dono taraf cube root lete hain ($4 \\times 4 \\times 4 = 64$):<br>$R = 4r$.", "Kyunki $v \\propto r^2$, isliye velocity ratio:<br>$\\frac{V}{v} = \\left(\\frac{R}{r}\\right)^2 = 4^2 = 16$.", "$v = 1.5\\text{ m s}^{-1}$ rakhne par:<br>$V = 16 \\times 1.5 = \\color{#3fb950}{24\\text{ m s}^{-1}}$."], "r": "Option <b>(C)</b> (24 m s⁻¹) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 8 m s⁻¹ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 16 m s⁻¹ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 32 m s⁻¹ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Shortcut: $N$ identical drops judne par $V_{\\text{big}} = N^{2/3} v_{\\text{small}} = 64^{2/3} \\times 1.5 = 16 \\times 1.5 = 24\\text{ m s}^{-1}$!", "sim": ""}, {"id": 12, "sub": "Physics", "q": "A uniform circular disc of radius $r$ is cut out from a larger uniform disc of radius $4r$ such that the edge of the circular hole touches the outer edge of the larger disc. The distance of the centre of mass of the remaining portion from the centre of the larger disc is:", "fig": "", "opt": ["$\\frac{r}{5}$", "$\\frac{r}{4}$", "$\\frac{r}{2}$", "$\\frac{r}{3}$"], "ans": 0, "c": "Cavity (kate hue hole) wale centre of mass sawalon me kate hue hisse ko <b>negative mass ($-m$)</b> maan kar main body ($+M$) ke saath jod dete hain. Uniform disc me mass seedha area ($\\pi R^2$) ke proportional hota hai.", "m": "Badi disc ka centre $O(0,0)$ par maankar $X_{\\text{cm}} = \\frac{M_1 x_1 - M_2 x_2}{M_1 - M_2}$ lagayenge.", "s": ["Mass $\\propto \\text{Area}$: Badi disc ($4r$) ka area $= \\pi(4r)^2 = 16\\pi r^2 \\Rightarrow M_1 = 16m$; chhoti kati disc ($r$) ka area $= \\pi r^2 \\Rightarrow M_2 = m$.", "Chhoti disc ka kinara badi disc ke kinare ko chhuta hai, isliye hole ka centre badi disc ke centre se $x_2 = 4r - r = 3r$ doori par hoga (aur $x_1 = 0$).", "Formula lagate hain:<br>$X_{\\text{cm}} = \\frac{16m(0) - m(3r)}{16m - m} = \\frac{-3\\cancel{m}r}{15\\cancel{m}} = -\\frac{\\cancel{3}^{1}}{\\cancel{15}_{5}}r = -\\frac{r}{5}$.", "Minus sign bas hole ke opposite side dikhata hai; centre se distance $= \\color{#3fb950}{\\frac{r}{5}}$."], "r": "Option <b>(A)</b> ($\\frac{r}{5}$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> $\\frac{r}{4}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $\\frac{r}{2}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $\\frac{r}{3}$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Negative mass trick cavity वाले sawalon ko $15$ second me bina integration ke solve kar deti hai!", "sim": ""}, {"id": 13, "sub": "Physics", "q": "A long straight wire of uniform linear charge density $\\lambda$ passes through a cube of edge length $\\ell$ first in such a manner that the electric flux through the cube is maximum, and then parallel to an edge so that the electric flux is minimum. The ratio of maximum flux to minimum flux is:", "fig": "", "opt": ["$\\sqrt{3} : 1$", "$3 : 1$", "$\\sqrt{2} : 1$", "$\\sqrt{3} : \\sqrt{2}$"], "ans": 0, "c": "<b>Gauss's Law</b> ke mutabik band surface se guzarne wala electric flux $\\Phi = \\frac{q_{\\text{in}}}{\\epsilon_0}$ hota hai. Linear charge density $\\lambda$ wale straight तार ke liye cube ke andar band aavesh $q_{\\text{in}} = \\lambda L_{\\text{in}}$ hota hai, jahan $L_{\\text{in}}$ cube ke andar aane wali wire ki lambai hai.", "m": "Cube ke andar wire ki maximum possible length <b>body diagonal</b> ($\\ell\\sqrt{3}$) hoti hai aur side ke parallel rakhne par minimum length <b>edge</b> ($\\ell$) hoti hai.", "s": ["Maximum length (body diagonal): $L_{\\max} = \\sqrt{\\ell^2 + \\ell^2 + \\ell^2} = \\ell\\sqrt{3} \\Rightarrow \\Phi_{\\max} = \\frac{\\lambda \\ell\\sqrt{3}}{\\epsilon_0}$.", "Minimum length (edge ke parallel): $L_{\\min} = \\ell \\Rightarrow \\Phi_{\\min} = \\frac{\\lambda \\ell}{\\epsilon_0}$.", "Dono ka ratio lete hain ($\\frac{\\lambda \\ell}{\\epsilon_0}$ cancel):<br>$\\frac{\\Phi_{\\max}}{\\Phi_{\\min}} = \\frac{\\cancel{\\lambda \\ell / \\epsilon_0} \\cdot \\sqrt{3}}{\\cancel{\\lambda \\ell / \\epsilon_0} \\cdot 1} = \\color{#3fb950}{\\sqrt{3} : 1}$."], "r": "Option <b>(A)</b> ($\\sqrt{3} : 1$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> $3 : 1$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $\\sqrt{2} : 1$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $\\sqrt{3} : \\sqrt{2}$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Cube ki Geometry yaad rakho: Edge $= \\ell$, Face diagonal $= \\ell\\sqrt{2}$, Body diagonal $= \\ell\\sqrt{3}$!", "sim": ""}, {"id": 14, "sub": "Physics", "q": "If a solid disc of moment of inertia $I$ and radius $r$ is melted and reshaped into a thin ring of radius $nr$ while keeping its total mass unchanged, its new moment of inertia becomes:", "fig": "", "opt": ["$n^2 I$", "$2n^2 I$", "$\\frac{n^2}{2} I$", "$I$"], "ans": 1, "c": "Moment of inertia mass distribution par depend karta hai: solid disc ke liye axis ke about $I_{\\text{disc}} = \\frac{1}{2}Mr^2$, jabki patli ring me saara mass circumference par hota hai isliye $I_{\\text{ring}} = MR^2$.", "m": "Pehle $I = \\frac{1}{2}Mr^2$ se $Mr^2 = 2I$ nikal lenge aur nayi ring ($R = nr$, mass $M$) ke formula $I' = M(nr)^2$ me substitute kar denge.", "s": ["Solid disc ka moment of inertia:<br>$I = \\frac{1}{2}Mr^2 \\Rightarrow Mr^2 = 2I$.", "Usi mass $M$ se bani radius $nr$ wali ring ka moment of inertia:<br>$I' = M(nr)^2 = n^2 (Mr^2)$.", "$Mr^2 = 2I$ rakhne par:<br>$I' = n^2 (2I) = \\color{#3fb950}{2n^2 I}$."], "r": "Option <b>(B)</b> ($2n^2 I$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> $n^2 I$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $\\frac{n^2}{2} I$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $I$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "$2$ se divide ya multiply me galti na ho, isliye hamesha $Mr^2$ ko $I$ ke terms me isolate karke substitute karo!", "sim": ""}, {"id": 15, "sub": "Physics", "q": "Blocks $A$ and $B$ shown in the figure move together towards the right with a constant velocity of $10\\text{ m/s}$. All surfaces in contact are rough and a horizontal force of $20\\text{ N}$ acts only on block $B$. The friction force applied by block $B$ on block $A$ is:", "fig": "<svg viewBox=\"0 0 500 155\" width=\"100%\" style=\"max-width:500px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Block A on Block B\"><rect width=\"500\" height=\"155\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><line x1=\"55\" y1=\"122\" x2=\"445\" y2=\"122\" stroke=\"#dcdfe4\" stroke-width=\"2.4\"/><path d=\"M75,122 l-10,12 M105,122 l-10,12 M135,122 l-10,12 M165,122 l-10,12 M195,122 l-10,12 M225,122 l-10,12 M255,122 l-10,12 M285,122 l-10,12 M315,122 l-10,12 M345,122 l-10,12 M375,122 l-10,12 M405,122 l-10,12\" stroke=\"#9aa3b2\" stroke-width=\"1.3\"/><rect x=\"175\" y=\"78\" width=\"130\" height=\"44\" rx=\"4\" fill=\"#232936\" stroke=\"#60a5fa\" stroke-width=\"2.2\"/><text x=\"240\" y=\"105\" fill=\"#dcdfe4\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\">B</text><rect x=\"208\" y=\"42\" width=\"64\" height=\"36\" rx=\"4\" fill=\"#232936\" stroke=\"#3fb950\" stroke-width=\"2.2\"/><text x=\"240\" y=\"65\" fill=\"#dcdfe4\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">A</text><line x1=\"175\" y1=\"98\" x2=\"108\" y2=\"98\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/><polygon points=\"101,98 111,93 111,103\" fill=\"#f59e0b\"/><text x=\"136\" y=\"88\" fill=\"#f59e0b\" font-size=\"13.5\" font-weight=\"700\" text-anchor=\"middle\">20 N</text><line x1=\"315\" y1=\"60\" x2=\"395\" y2=\"60\" stroke=\"#3fb950\" stroke-width=\"2.4\" stroke-dasharray=\"5,3\"/><polygon points=\"402,60 392,55 392,65\" fill=\"#3fb950\"/><text x=\"360\" y=\"47\" fill=\"#3fb950\" font-size=\"12.5\" font-weight=\"600\" text-anchor=\"middle\">v = 10 m/s (constant)</text><text x=\"415\" y=\"114\" fill=\"#9aa3b2\" font-size=\"12.5\">Rough Ground</text></svg>", "opt": ["0 N", "20 N", "10 N", "Insufficient data"], "ans": 0, "c": "Friction sirf tab lagta hai jab relative motion ho ya relative motion ki <b>tendency</b> (acceleration / external force) maujood ho. Agar koi block seedhi rekha me <b>constant velocity</b> ($a = 0$) se chal raha hai to Newton's second law se us par <b>net force zero</b> honi chahiye!", "m": "Sirf upar wale Block $A$ ka horizontal Free-Body Diagram (FBD) banakar $F_{\\text{net},A} = m_A a_A$ lagayenge.", "s": ["Dono blocks constant velocity $10\\text{ m/s}$ se chal rahe hain $\\Rightarrow$ Block $A$ ka acceleration $a_A = 0$.", "Block $A$ par horizontal direction me bahar se koi external force nahi lag rahi — ekmatra horizontal force $B$ dwara lagaya gaya friction $f_{AB}$ ho sakta hai.", "$F_{\\text{net},A} = m_A a_A \\Rightarrow f_{AB} = m_A \\times 0 = \\color{#3fb950}{0\\text{ N}}$."], "r": "Option <b>(A)</b> (0 N) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 20 N — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 10 N — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Insufficient data — upar ki derivation / NCERT rule se match nahi karta."], "t": "Classic NEET trap: 'All surfaces are rough' aur '$20\\text{ N}$' dekhkar student ghabra kar $10\\text{ N}$ ya $20\\text{ N}$ laga dete hain, jabki constant velocity par top block par friction hamesha $0\\text{ N}$ hota hai!", "sim": ""}, {"id": 16, "sub": "Physics", "q": "Two batteries of different e.m.f.'s and internal resistance connected in series with each other and with an external load resistor. The current is 3.0 A. When the polarity of one battery is reversed, the current becomes 1.0 A. The ratio of the e.m.f.'s of the two batteries is:", "fig": "", "opt": ["2.5", "2", "1.5", "1"], "ans": 1, "c": "Series aiding me dono cells ke e.m.f. judte hain ($E_{\\text{net}} = E_1 + E_2$), aur ek battery ki polarity palatne (series opposing) par e.m.f. ghat jaate hain ($E_{\\text{net}} = E_1 - E_2$), jabki circuit ka total resistance $R_{\\text{tot}} = R + r_1 + r_2$ dono cases me <b>bilkul same</b> rehta hai!", "m": "Dono currents ka ratio $\\frac{I_1}{I_2} = \\frac{E_1 + E_2}{E_1 - E_2}$ lekar componendo-dividendo lagayenge.", "s": ["Case 1 (same order): $I_1 = \\frac{E_1 + E_2}{R + r_1 + r_2} = 3.0\\text{ A}$.", "Case 2 (reversed polarity): $I_2 = \\frac{E_1 - E_2}{R + r_1 + r_2} = 1.0\\text{ A}$.", "Ratio lene par $(R + r_1 + r_2)$ cancel ho gaya:<br>$\\frac{E_1 + E_2}{E_1 - E_2} = \\frac{3}{1}$.", "Cross-multiply karte hain:<br>$E_1 + E_2 = 3E_1 - 3E_2 \\Rightarrow 4E_2 = 2E_1 \\Rightarrow \\frac{E_1}{E_2} = \\frac{\\cancel{4}^{2}}{\\cancel{2}_{1}} = \\color{#3fb950}{2}$."], "r": "Option <b>(B)</b> (2) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 2.5 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 1.5 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 1 — upar ki derivation / NCERT rule se match nahi karta."], "t": "Componendo-Dividendo direct trick: $\\frac{E_1}{E_2} = \\frac{I_1 + I_2}{I_1 - I_2} = \\frac{3 + 1}{3 - 1} = \\frac{4}{2} = 2$!", "sim": ""}, {"id": 17, "sub": "Physics", "q": "n identical bulbs are rated P watt and V volt. When they are connected in series, total power consumed is 20 watt and when connected in parallel they consume total power of 2000 watt. How many bulbs are used?", "fig": "", "opt": ["200 bulbs", "100 bulbs", "20 bulbs", "10 bulbs"], "ans": 3, "c": "Har bulb ka filament resistance $R$ same hai. Same supply voltage $V$ par series combination me total resistance $nR$ badh jata hai ($P_s = \\frac{V^2}{nR}$), jabki parallel combination me effective resistance $\\frac{R}{n}$ ghat jata hai ($P_p = \\frac{nV^2}{R}$).", "m": "$P_{\\text{parallel}}$ aur $P_{\\text{series}}$ ka ratio lenge jisse $V^2/R$ seedha cancel ho jayega.", "s": ["Series power: $P_s = \\frac{V^2}{nR} = 20\\text{ W}$.", "Parallel power: $P_p = \\frac{V^2}{R/n} = \\frac{nV^2}{R} = 2000\\text{ W}$.", "Dono ko divide karte hain:<br>$\\frac{P_p}{P_s} = \\frac{n \\cancel{(V^2/R)}}{\\cancel{(V^2/R)} / n} = n^2 = \\frac{\\cancel{2000}^{100}}{\\cancel{20}_{1}} = 100$.", "Square root lene par:<br>$n = \\sqrt{100} = \\color{#3fb950}{10\\text{ bulbs}}$."], "r": "Option <b>(D)</b> (10 bulbs) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 200 bulbs — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 100 bulbs — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 20 bulbs — upar ki derivation / NCERT rule se match nahi karta."], "t": "Direct formula yaad rakho: Identical resistors/bulbs ke liye $\\frac{P_{\\text{parallel}}}{P_{\\text{series}}} = n^2$!", "sim": ""}, {"id": 18, "sub": "Physics", "q": "A linear harmonic oscillator of force constant 6 × 10⁵ N/m and amplitude 4 cm, has a total energy 600 J. Select the correct statement.", "fig": "", "opt": ["Maximum potential energy is 600 J", "Maximum kinetic energy is 480 J", "Minimum potential energy is 120 J", "All of these"], "ans": 3, "c": "SHM me oscillation ki maximum kinetic energy hamesha $K_{\\max} = \\frac{1}{2}kA^2$ hoti hai! Lekin potential energy ka reference minimum value $U_{\\min}$ zero hona zaroori nahi hai — total energy $E = K_{\\max} + U_{\\min}$ hoti hai, aur extreme position ($K = 0$) par $U_{\\max} = E$ hoti hai!", "m": "$K_{\\max} = \\frac{1}{2}kA^2$ calculate karke $U_{\\min} = E - K_{\\max}$ aur $U_{\\max} = E$ teeno check karenge.", "s": ["Diya hai:
