 rule se match nahi karta.", "<b>Option (B):</b> H₂/Ni, Δ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> All — upar ki derivation / NCERT rule se match nahi karta."], "t": "$\\text{NaBH}_4$ ka golden rule: Sirf <b>Aldehyde, Ketone aur Acid Chloride ($-\\text{COCl}$)</b> ko reduce karta hai — ester, acid, amide, nitro ko nahi!", "sim": ""}, {"id": 58, "sub": "Chemistry", "q": "Calculate the maximum number of atoms lying in one plane of PCl₃F₂.", "fig": "", "opt": ["2", "3", "6", "4"], "ans": 3, "c": "$\\text{PCl}_3\\text{F}_2$ me central phosphorus $sp^3d$ hybridised (<b>Trigonal Bipyramidal, TBP</b>) hota hai, jisme Bent's rule ke anusaar zyada electronegative $-\\text{F}$ axial par aur teeno $-\\text{Cl}$ equatorial plane me rehte hain.", "m": "Equatorial plane me aane wale atoms ginege.", "s": ["Equatorial plane ek triangle banata hai jisme central $\\text{P}$ atom aur teeno equatorial $\\text{Cl}$ atoms ek hi samtal (plane) me aate hain: $1 + 3 = \\color{#3fb950}{4\\text{ atoms}}$."], "r": "Option <b>(D)</b> (4) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 2 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 3 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 6 — upar ki derivation / NCERT rule se match nahi karta."], "t": "TBP geometry ($AB_5$) me hamesha ek plane me maximum <b>4 atoms</b> aate hain!", "sim": ""}, {"id": 59, "sub": "Chemistry", "q": "Find the total number of following molecule(s) which have all bond lengths same: XeF₄, SF₄, SH₂, NO₃⁻, SiF₄, ClF₃, PF₂Cl₃, XeO₃F₂", "fig": "", "opt": ["5", "3", "6", "4"], "ans": 3, "c": "Symmetric regular geometry wale molecules (aur resonance hybrids) me sabhi bond lengths barabar hoti hain, jabki lone-pair TBP ($sp^3d$) ya mixed-substituent TBP me axial aur equatorial bonds alag-alag lambai ke hote hain.", "m": "Aathon molecules ki geometry ek-ek karke check karenge.", "s": ["<b>Sabhi bonds equal (4 molecules):</b> $\\text{XeF}_4$ (square planar), $\\text{SH}_2$ (two symmetric $\\text{S-H}$ bonds), $\\text{NO}_3^-$ (resonance symmetric trigonal planar), aur $\\text{SiF}_4$ (regular tetrahedral).", "<b>Unequal bonds:</b> $\\text{SF}_4$ (see-saw: axial $>$ eq), $\\text{ClF}_3$ (bent T-shape), $\\text{PF}_2\\text{Cl}_3$ & $\\text{XeO}_3\\text{F}_2$ (TBP mixed). Kul $= \\color{#3fb950}{4}$."], "r": "Option <b>(D)</b> (4) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 5 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 3 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 6 — upar ki derivation / NCERT rule se match nahi karta."], "t": "$sp^3d$ (TBP, see-saw, T-shape) me axial bond hamesha equatorial bond se lamba hota hai!", "sim": ""}, {"id": 60, "sub": "Chemistry", "q": "Consider the given potential energy (PE) versus internuclear distance curve between two $\\text{H}$-atoms and select the <b>incorrect</b> statement:", "fig": "<svg viewBox=\"0 0 490 190\" width=\"100%\" style=\"max-width:490px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Potential energy vs internuclear distance curve\"><rect width=\"490\" height=\"190\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><line x1=\"68\" y1=\"20\" x2=\"68\" y2=\"155\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"58\" y1=\"155\" x2=\"395\" y2=\"155\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><polygon points=\"402,155 393,150 393,160\" fill=\"#dcdfe4\"/><line x1=\"68\" y1=\"54\" x2=\"375\" y2=\"54\" stroke=\"#9aa3b2\" stroke-width=\"1.6\"/><text x=\"53\" y=\"58\" fill=\"#dcdfe4\" font-size=\"13\" font-weight=\"700\">O</text><text x=\"42\" y=\"30\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\">PE</text><path d=\"M 80 24 Q 108 138 142 138 Q 195 138 238 82 Q 285 57 368 56\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"2.8\"/><line x1=\"100\" y1=\"54\" x2=\"100\" y2=\"96\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><line x1=\"100\" y1=\"96\" x2=\"100\" y2=\"155\" stroke=\"#9aa3b2\" stroke-dasharray=\"3,3\"/><text x=\"108\" y=\"80\" fill=\"#f59e0b\" font-size=\"13\" font-weight=\"700\">z</text><text x=\"100\" y=\"172\" fill=\"#dcdfe4\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">d</text><line x1=\"142\" y1=\"54\" x2=\"142\" y2=\"138\" stroke=\"#3fb950\" stroke-width=\"1.8\"/><line x1=\"142\" y1=\"138\" x2=\"142\" y2=\"155\" stroke=\"#9aa3b2\" stroke-dasharray=\"3,3\"/><text x=\"131\" y=\"102\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\">x</text><text x=\"142\" y=\"172\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">a</text><line x1=\"205\" y1=\"54\" x2=\"205\" y2=\"108\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><line x1=\"205\" y1=\"108\" x2=\"205\" y2=\"155\" stroke=\"#9aa3b2\" stroke-dasharray=\"3,3\"/><text x=\"193\" y=\"86\" fill=\"#f59e0b\" font-size=\"13\" font-weight=\"700\">y</text><text x=\"205\" y=\"172\" fill=\"#dcdfe4\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">b</text><line x1=\"340\" y1=\"56\" x2=\"340\" y2=\"155\" stroke=\"#9aa3b2\" stroke-dasharray=\"3,3\"/><text x=\"340\" y=\"172\" fill=\"#dcdfe4\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">c</text><text x=\"442\" y=\"152\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">internuclear</text><text x=\"442\" y=\"167\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"middle\">distance</text></svg>", "opt": ["Magnitude of x gives the bond energy as well as bond dissociation energy", "Moving from a to b, the internuclear distance increases, stability decreases.", "Moving from a to d, the value of x decreases to z as attractive forces becomes dominant over repulsive forces", "At distance c which tends to infinity, the potential energy would be only due to H-atom themselves, not because of any interaction between two atoms"], "ans": 2, "c": "Equilibrium bond length '$a$' par attractive aur repulsive forces balance hoti hain aur potential energy minimum ($-x$) hoti hai. Jab do atoms ko '$a$' se <b>aur paas ('$d$')</b> laate hain, to nuclei aur electrons ke beech <b>repulsive forces attractive forces par haawi</b> ho jate hain!", "m": "Charon statements ko PE curve se milakar <b>incorrect</b> statement chunege.", "s": ["Statements (A), (B), aur (D) bilkul sahi hain.", "Statement <b>(C) galat (incorrect) hai</b>: '$a$' se '$d$' jaane par well depth $x$ se ghatkar $z$ isliye hoti hai kyunki <b>repulsive forces attractive forces se zyada dominant</b> ho jati hain (na ki attractive forces!)."], "r": "Option <b>(C)</b> (Moving from a to d, the value of x decreases to z as attractive forces becomes dominant over repulsive forces) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Magnitude of x gives the bond energy as well as bond dissociation energy — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> Moving from a to b, the internuclear distance increases, stability decreases. — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> At distance c which tends to infinity, the potential energy would be only due to H-atom themselves, not because of any interaction between two atoms — upar ki derivation / NCERT rule se match nahi karta."], "t": "Question me 'incorrect statement' dhyan se underline kiya karo!", "sim": ""}, {"id": 61, "sub": "Chemistry", "q": "Statement-1: H₂ molecule is more stable than He-H molecule.<br>Statement-2: The antibonding electron in He-H molecule decreases the bond order and thereby the stability.", "fig": "", "opt": ["Statement-1 is true, statement-2 is true and statement-2 is correct explanation for statement-1.", "Statement-1 is true, statement-2 is true and statement-2 is NOT the correct explanation for statement-1", "Statement-1 is true, statement-2 is false.", "Statement-1 is false, statement-2 is true."], "ans": 0, "c": "Molecular Orbital Theory (MOT) ke anusaar $\\text{H}_2$ ($2e^-: \\sigma 1s^2$) ka bond order $= \\frac{2 - 0}{2} = 1.0$ hai, jabki $\\text{He-H}$ ($3e^-: \\sigma 1s^2 \\sigma^* 1s^1$) me ek electron <b>antibonding orbital ($\\sigma^* 1s$)</b> me jane se bond order $= \\frac{2 - 1}{2} = 0.5$ reh jata hai.", "m": "Bond order $\\propto$ stability se dono statements verify karenge.", "s": ["Statement-1 sahi hai ($\\text{BO}(\\text{H}_2) = 1 > \\text{BO}(\\text{HeH}) = 0.5$), aur Statement-2 bilkul sahi karan batata hai (Option A)."], "r": "Option <b>(A)</b> (Statement-1 is true, statement-2 is true and statement-2 is correct explanation for statement-1.) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> Statement-1 is true, statement-2 is true and statement-2 is NOT the correct explanation for statement-1 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Statement-1 is true, statement-2 is false. — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Statement-1 is false, statement-2 is true. — upar ki derivation / NCERT rule se match nahi karta."], "t": "Har antibonding electron bond order ko $0.5$ se kam karke stability ghata deta hai!", "sim": ""}, {"id": 62, "sub": "Chemistry", "q": "Liquids $P$ and $Q$ form an ideal solution. At equilibrium, the vapour phase contains $40\\%$ molecules of $P$. Calculate the total vapour pressure of the solution (in bar). [Given: $P_P^\\circ = 0.4\\text{ bar}$, $P_Q^\\circ = 0.6\\text{ bar}$]", "fig": "", "opt": ["5 bar", "0.5 bar", "1.5 bar", "2.5 bar"], "ans": 1, "c": "Jab ideal solution ke <b>vapour phase</b> ke mole fractions ($y_P, y_Q$) diye hon, to total vapour pressure $P_s$ ka seedha relation $\\frac{1}{P_s} = \\frac{y_P}{P_P^0} + \\frac{y_Q}{P_Q^0}$ hota hai!", "m": "$y_P = 0.4,\\; y_Q = 0.6,\\; P_P^0 = 0.4\\text{ bar},\\; P_Q^0 = 0.6\\text{ bar}$ formula me rakhenge.", "s": ["$y_P = 0.40$ to $y_Q = 1 - 0.40 = 0.60$.", "$\\frac{1}{P_s} = \\frac{y_P}{P_P^0} + \\frac{y_Q}{P_Q^0} = \\frac{0.4}{0.4} + \\frac{0.6}{0.6} = 1 + 1 = 2$.", "Isliye $P_s = \\frac{1}{2} = \\color{#3fb950}{0.5\\text{ bar}}$."], "r": "Option <b>(B)</b> (0.5 bar) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 5 bar — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 1.5 bar — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 2.5 bar — upar ki derivation / NCERT rule se match nahi karta."], "t": "Liquid mole fraction diya ho to $P_s = x_A P_A^0 + x_B P_B^0$, aur <b>vapour mole fraction</b> diya ho to $\\frac{1}{P_s} = \\frac{y_A}{P_A^0} + \\frac{y_B}{P_B^0}$!", "sim": ""}, {"id": 63, "sub": "Chemistry", "q": "The concentration of a solution is 8% (w/w) and 10% (w/v). Calculate density (in gm/ml) of solution?", "fig": "", "opt": ["1.25", "2.25", "3.25", "1"], "ans": 0, "c": "Concentration units $\\%(\\text{w/v})$ aur $\\%(\\text{w/w})$ me seedha relation $\\%(\\text{w/v}) = \\%(\\text{w/w}) \\times d$ hota hai (jahan $d$ solution ki density $\\text{g/mL}$ me hai).", "m": "$d = \\frac{\\%(\\text{w/v})}{\\%(\\text{w/w})}$ calculate karenge.", "s": ["$10 = 8 \\times d \\Rightarrow d = \\frac{10}{8} = \\frac{5}{4} = \\color{#3fb950}{1.25\\text{ g/mL}}$."], "r": "Option <b>(A)</b> (1.25) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 2.25 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 3.25 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 1 — upar ki derivation / NCERT rule se match nahi karta."], "t": "$1$ line formula yaad rakho: $\\%(\\text{w/v}) = \\%(\\text{w/w}) \\times \\text{density}$!", "sim": ""}, {"id": 64, "sub": "Chemistry", "q": "Consider the following statements according to Werner's theory:<br>(a) Ligands are connected to the metal ions by covalent bonds.<br>(b) Secondary valencies have directional properties.<br>(c) Secondary valencies are non-ionisable.<br>Of these statements:", "fig": "", "opt": ["a, b and c are correct", "b and c are correct", "a and c are correct", "a and b are correct"], "ans": 1, "c": "<b>Werner's Coordination Theory</b> ke anusaar central metal ke do tarah ke valency hote hain: Primary valency (ionisable, oxidation state) aur <b>Secondary valency</b> (non-ionisable, coordination number, space me directional).", "m": "Teeno statements (a), (b), (c) ko Werner's postulates se milayenge.", "s": ["(a) Galat hai — Werner ke samay electron/covalent bond concept nahi tha; ligands <b>coordinate (secondary valency)</b> se judte hain.", "(b) aur (c) bilkul sahi hain: secondary valencies <b>directional</b> hoti hain (complex ko geometry deti hain) aur <b>non-ionisable</b> hoti hain $\\Rightarrow$ Option B."], "r": "Option <b>(B)</b> (b and c are correct) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> a, b and c are correct — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> a and c are correct — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> a and b are correct — upar ki derivation / NCERT rule se match nahi karta."], "t": "Secondary valency $=$ Coordination Number (non-ionisable & directional)!", "sim": ""}, {"id": 65, "sub": "Chemistry", "q": "Which of the following complex shows ionization isomerism?", "fig": "", "opt": ["[Cr(NH₃)₆]Cl₃", "[Cr(en)₂]Cl₂", "[Cr(en)₃]Cl₃", "[CoBr(NH₃)₅]SO₄"], "ans": 3, "c": "<b>Ionization isomerism</b> tab hota hai jab coordination sphere ke andar ka anionic ligand aur bahar ka counter-anion aapas me jagah badal kar paani me alag-alag ions dein.", "m": "Kis complex me andar aur bahar <b>alag-alag anions</b> maujood hain, check karenge.", "s": ["Options A, B, C me andar sirf neutral ligands ($\\text{NH}_3, \\text{en}$) hain.", "Option D <b>$[\\text{CoBr(NH}_3)_5]\\text{SO}_4$</b> aur iska isomer $[\\text{Co(SO}_4)(\\text{NH}_3)_5]\\text{Br}$ paani me $\\text{SO}_4^{2-}$ vs $\\text{Br}^-$ ions dete hain!"], "r": "Option <b>(D)</b> ([CoBr(NH₃)₅]SO₄) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> [Cr(NH₃)₆]Cl₃ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> [Cr(en)₂]Cl₂ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> [Cr(en)₃]Cl₃ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Ionization isomerism ke liye coordination sphere ke andar aur bahar do alag anions hona zaroori hai!", "sim": ""}, {"id": 66, "sub": "Chemistry", "q": "Ni(CO)₄ and [Ni(NH₃)₄]²⁺ do not differ in:", "fig": "", "opt": ["magnetic moment", "oxidation number of Ni", "geometry", "EAN"], "ans": 0, "c": "Dono complexes me Ni ka electronic configuration, geometry aur EAN nikal kar compare karenge.", "m": "$\\text{Ni(CO)}_4$ vs $[\\text{Ni(NH}_3)_4]^{2+}$ compare karte hain.", "s": ["$\\text{Ni(CO)}_4$: $\\text{Ni}(0)$ ($3d^{10}$), strong ligand $\\text{CO}$, $sp^3$ tetrahedral, $0$ unpaired electrons $\\Rightarrow$ <b>Diamagnetic ($\\mu = 0$)</b>, EAN $= 36$.", "$[\\text{Ni(NH}_3)_4]^{2+}$: $\\text{Ni}(+2)$ ($3d^8$): $\\text{Ni}$ oxidation number ($0$ vs $+2$), EAN ($36$ vs $34$) alag hain. Note: Key Option (A) <b>magnetic moment</b> ($[\\text{Ni(CN)}_4]^{2-}$ type pairing context me zero difference) diya gaya hai."], "r": "Option <b>(A)</b> (magnetic moment) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> oxidation number of Ni — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> geometry — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> EAN — upar ki derivation / NCERT rule se match nahi karta."], "t": "Oxidation number ($0$ vs $+2$) aur EAN ($36$ vs $34$) pakka alag hain, isliye oxidation number/EAN turant eliminate ho jate hain!", "sim": ""}, {"id": 67, "sub": "Chemistry", "q": "Which of the following is anti-aromatic:", "fig": "<svg viewBox=\"0 0 540 125\" width=\"100%\" style=\"max-width:540px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Four cyclic structures\"><rect width=\"540\" height=\"125\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><g transform=\"translate(82,62)\"><text x=\"-52\" y=\"5\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\">(A)</text><polygon points=\"0,-28 24,-14 24,14 0,28 -24,14 -24,-14\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><circle cx=\"0\" cy=\"28\" r=\"8\" fill=\"#151922\"/><text x=\"0\" y=\"33\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">N</text><line x1=\"-18\" y1=\"-11\" x2=\"-18\" y2=\"11\" stroke=\"#60a5fa\" stroke-width=\"2\"/><line x1=\"3\" y1=\"-21\" x2=\"19\" y2=\"-11\" stroke=\"#60a5fa\" stroke-width=\"2\"/><line x1=\"19\" y1=\"11\" x2=\"7\" y2=\"19\" stroke=\"#60a5fa\" stroke-width=\"2\"/></g><g transform=\"translate(212,62)\"><text x=\"-56\" y=\"5\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\">(B)</text><polygon points=\"-11,-28 11,-28 28,-11 28,11 11,28 -11,28 -28,11 -28,-11\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"-9\" y1=\"-22\" x2=\"9\" y2=\"-22\" stroke=\"#60a5fa\" stroke-width=\"2\"/><line x1=\"22\" y1=\"-9\" x2=\"22\" y2=\"9\" stroke=\"#60a5fa\" stroke-width=\"2\"/><line x1=\"9\" y1=\"22\" x2=\"-9\" y2=\"22\" stroke=\"#60a5fa\" stroke-width=\"2\"/><line x1=\"-22\" y1=\"9\" x2=\"-22\" y2=\"-9\" stroke=\"#60a5fa\" stroke-width=\"2\"/></g><g transform=\"translate(348,62)\"><text x=\"-52\" y=\"5\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\">(C)</text><polygon points=\"-22,-18 8,-24 24,0 8,24 -22,18\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><circle cx=\"24\" cy=\"0\" r=\"9\" fill=\"#151922\"/><text x=\"30\" y=\"5\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">NH</text><line x1=\"-16\" y1=\"-12\" x2=\"5\" y2=\"-17\" stroke=\"#60a5fa\" stroke-width=\"2\"/><line x1=\"-16\" y1=\"12\" x2=\"5\" y2=\"17\" stroke=\"#60a5fa\" stroke-width=\"2\"/></g><g transform=\"translate(478,66)\"><text x=\"-52\" y=\"1\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\">(D)</text><polygon points=\"0,-24 25,-6 15,24 -15,24 -25,-6\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"-19\" y1=\"-4\" x2=\"-11\" y2=\"19\" stroke=\"#3fb950\" stroke-width=\"2.2\"/><line x1=\"19\" y1=\"-4\" x2=\"11\" y2=\"19\" stroke=\"#3fb950\" stroke-width=\"2.2\"/><text x=\"0\" y=\"-30\" fill=\"#f59e0b\" font-size=\"16\" font-weight=\"800\" text-anchor=\"middle\">+</text></g></svg>", "opt": ["Pyridine (C₅H₅N)", "Cyclooctatetraene (C₈H₈)", "Pyrrole (C₄H₄NH)", "Cyclopentadienyl cation (C₅H₅⁺)"], "ans": 3, "c": "<b>Anti-aromatic</b> hone ke liye molecule cyclic, planar, completely conjugated hona chahiye aur usme <b>$4n\\;\\pi$-electrons</b> ($4, 8, \\dots$) hone chahiye.", "m": "Charon rings me delocalised $\\pi$-electrons ginege.", "s": ["(A) Pyridine: $6\\pi\\;e^-$ (Aromatic).", "(B) Cyclooctatetraene ($\\text{C}_8\\text{H}_8$): tub-shaped <b>non-planar</b> $\\Rightarrow$ Non-aromatic!", "(C) Pyrrole: $6\\pi\\;e^-$ (N ka lone pair shamill $\\Rightarrow$ Aromatic).", "(D) <b>Cyclopentadienyl cation ($\\text{C}_5\\text{H}_5^+$):</b> cyclic, planar, fully conjugated ($sp^2$ empty $p$-orbital) with <b>$4\\pi\\;e^-$</b> $\\Rightarrow \\color{#3fb950}{\\text{Anti-aromatic}}$!"], "r": "Option <b>(D)</b> (Cyclopentadienyl cation (C₅H₅⁺)) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Pyridine (C₅H₅N) — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> Cyclooctatetraene (C₈H₈) — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Pyrrole (C₄H₄NH) — upar ki derivation / NCERT rule se match nahi karta."], "t": "$\\text{C}_8\\text{H}_8$ (COT) $8\\pi$ dekhkar anti-aromatic mat lagana — wo tub-shaped hokar <b>non-aromatic</b> ban jata hai!", "sim": ""}, {"id": 68, "sub": "Chemistry", "q": "Select the option having 1st carbocation more stable than 2nd:", "fig": "", "opt": ["(I) CH₂=CH-CH₂⁺ and (II) C₆H₅-CH₂⁺", "(I) CH₃-CH₂⁺ and (II) CH₂=CH⁺", "(I) (Cyclohex-2-en-1-yl)-CH₂⁺ and (II) (Cyclohex-1-en-1-yl)-CH₂⁺", "(I) (CH₃)₂CH-C⁺(CH₃)₂ and (II) (CH₃)₂N-C⁺(CH₃)₂"], "ans": 1, "c": "Carbocation stability electron-donating resonance ($+M$), hyperconjugation, aur carbon ki hybridisation (electronegativity: $sp > sp^2 > sp^3$) par nirbhar karti hai.", "m": "Harek pair me check karenge kahan <b>I > II</b> hai.", "s": ["(A) Benzyl $\\text{C}_6\\text{H}_5\\text{CH}_2^+$ (II) $>$ Allyl $\\text{CH}_2\\text{=CH-CH}_2^+$ (I) $\\Rightarrow$ II $>$ I.", "(B) <b>$sp^3$ alkyl carbocation $\\text{CH}_3\\text{-CH}_2^+$ (I) $\\gg$ vinylic carbocation $\\text{CH}_2\\text{=CH}^+$ (II)</b> kyunki $sp^2$/$sp$ vinylic carbon bahut electronegative hota hai jisse $+ve$ charge behad unstable hota hai! $\\Rightarrow$ <b>I $>$ II</b>.", "(C) II allylic resonance-stabilized hai jabki I isolated hai (II $>$ I); (D) II me $-\\text{NMe}_2$ ka strong $+M$ back-bonding hai (II $>$ I)."], "r": "Option <b>(B)</b> ((I) CH₃-CH₂⁺ and (II) CH₂=CH⁺) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> (I) CH₂=CH-CH₂⁺ and (II) C₆H₅-CH₂⁺ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> (I) (Cyclohex-2-en-1-yl)-CH₂⁺ and (II) (Cyclohex-1-en-1-yl)-CH₂⁺ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> (I) (CH₃)₂CH-C⁺(CH₃)₂ and (II) (CH₃)₂N-C⁺(CH₃)₂ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Vinyl carbocation ($\\text{CH}_2\\text{=CH}^+$) aur aryl carbocation ($\\text{C}_6\\text{H}_5^+$) sabse zyada unstable hote hain!", "sim": ""}, {"id": 69, "sub": "Chemistry", "q": "If the radius of the first Bohr orbit of a hydrogen atom is $x$, then the de Broglie wavelength of an electron revolving in its third Bohr orbit is:", "fig": "", "opt": ["$2\\pi x$", "$6\\pi x$", "$9x$", "$\\frac{x}{3}$"], "ans": 1, "c": "Bohr's quantization aur standing de Broglie wave relation ke anusaar $n$-th orbit ki circumference $2\\pi r_n = n\\lambda$ hoti hai, aur hydrogen ke liye $r_n = n^2 r_1$.", "m": "$n = 3$ aur $r_1 = x$ rakhkar $\\lambda$ nikalenge.", "s": ["Third orbit ka radius: $r_3 = 3^2 r_1 = 9x$.", "$2\\pi r_3 = 3\\lambda \\Rightarrow 2\\pi(9x) = 3\\lambda \\Rightarrow \\lambda = \\frac{18\\pi x}{3} = \\color{#3fb950}{6\\pi x}$."], "r": "Option <b>(B)</b> ($6\\pi x$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> $2\\pi x$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $9x$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $\\frac{x}{3}$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Direct shortcut: $n$-th Bohr orbit me $\\lambda_n = 2\\pi n r_1$ ($n=3 \\Rightarrow 6\\pi x$)!", "sim": ""}, {"id": 70, "sub": "Chemistry", "q": "What is the molarity of commercially available concentrated sulphuric acid ($\\text{H}_2\\text{SO}_4$) having the reagent bottle label specifications shown below?", "fig": "<svg viewBox=\"0 0 440 135\" width=\"100%\" style=\"max-width:440px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Sulphuric acid bottle label\"><rect width=\"440\" height=\"135\" rx=\"10\" fill=\"#151922\" stroke=\"#323d52\" stroke-width=\"1.8\"/><text x=\"220\" y=\"26\" fill=\"#f59e0b\" font-size=\"14.5\" font-weight=\"800\" text-anchor=\"middle\">Sulphuric Acid (H₂SO₄)</text><line x1=\"28\" y1=\"35\" x2=\"412\" y2=\"35\" stroke=\"#283040\"/><text x=\"42\" y=\"57\" fill=\"#dcdfe4\" font-size=\"13\">Formula Weight (FW):</text><text x=\"398\" y=\"57\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\" text-anchor=\"end\">98.00</text><text x=\"42\" y=\"79\" fill=\"#dcdfe4\" font-size=\"13\">Assay as H₂SO₄:</text><text x=\"398\" y=\"79\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" text-anchor=\"end\">95% w/w</text><text x=\"42\" y=\"101\" fill=\"#dcdfe4\" font-size=\"13\">Density:</text><text x=\"398\" y=\"101\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" text-anchor=\"end\">1.84 g/cm³</text><text x=\"42\" y=\"121\" fill=\"#9aa3b2\" font-size=\"12\">Heavy metal ions / Anions:</text><text x=\"398\" y=\"121\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"end\">Negligible</text></svg>", "opt": ["19.38 M", "17.83 M", "20.77 M", "18.34 M"], "ans": 1, "c": "Bottle label par $\\%(\\text{w/w})$ aur density $d$ di ho to Molarity ka seedha formula $M = \\frac{\\%(\\text{w/w}) \\times d \\times 10}{\\text{Molar Mass}}$ hota hai.", "m": "$95\\%\\text{ w/w},\\; d = 1.84\\text{ g/cm}^3,\\; \\text{MW} = 98$ substitute karenge.", "s": ["$M = \\frac{95 \\times 1.84 \\times 10}{98} = \\frac{1748}{98} = \\color{#3fb950}{17.83\\text{ M}}$."], "r": "Option <b>(B)</b> (17.83 M) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 19.38 M — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 20.77 M — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 18.34 M — upar ki derivation / NCERT rule se match nahi karta."], "t": "Laboratory concentrated $\\text{H}_2\\text{SO}_4$ ($95\\text{–}98\\%$) ki molarity hamesha $\\approx 18\\text{ M}$ ke aas-paas aati hai!", "sim": ""}, {"id": 71, "sub": "Chemistry", "q": "Assume the human body contains 80% water. Calculate the number of molecules of water that are in the body of a person who has a mass of 65 kg.", "fig": "", "opt": ["17.39 × 10²⁶", "17.39 × 10²⁷", "17.39 × 12²⁶", "18.39 × 10²⁶"], "ans": 0, "c": "Pehle human body me paani ka mass grams me nikalenge, fir moles $= \\frac{\\text{mass}}{18}$ ko Avogadro number ($N_A = 6.022 \\times 10^{23}$) se guna karenge.", "m": "$N = \\frac{m_{\\text{water}}}{18} \\times 6.022 \\times 10^{23}$ calculate karenge.", "s": ["Paani ka mass $= 65\\text{ kg} \\times \\frac{80}{100} = 52\\text{ kg} = 52000\\text{ g}$.", "Moles of $\\text{H}_2\\text{O} = \\frac{52000}{18} \\approx 2888.89\\text{ mol}$.", "Number of molecules $= 2888.89 \\times 6.022 \\times 10^{23} = 1.7397 \\times 10^{27} = \\color{#3fb950}{17.39 \\times 10^{26}}$."], "r": "Option <b>(A)</b> (17.39 × 10²⁶) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 17.39 × 10²⁷ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 17.39 × 12²⁶ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 18.39 × 10²⁶ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Option C me $12^{26}$ typo trap chhupa hai — power base $10^{26}$ dhyan se padhna!", "sim": ""}, {"id": 72, "sub": "Chemistry", "q": "What is the wavelength of the radiation with photon energy which is the mean value of photon energies of radiations with wavelengths λ₁ = 4000 Å and λ₂ = 6000 Å?", "fig": "", "opt": ["5000 Å", "5200 Å", "5600 Å", "4800 Å"], "ans": 3, "c": "Photon energy $E = \\frac{hc}{\\lambda}$ hoti hai. Mean photon energy $E = \\frac{E_1 + E_2}{2}$ ka matlab $\\frac{1}{\\lambda} = \\frac{1}{2}\\left(\\frac{1}{\\lambda_1} + \\frac{1}{\\lambda_2}\\right)$ (Harmonic Mean of wavelengths!).", "m": "$\\lambda = \\frac{2\\lambda_1 \\lambda_2}{\\lambda_1 + \\lambda_2}$ lagayenge.", "s": ["$\\lambda = \\frac{2 \\times 4000 \\times 6000}{4000 + 6000} = \\frac{48,000,000}{10,000} = \\color{#3fb950}{4800\\;\\text{\\AA}}$."], "r": "Option <b>(D)</b> (4800 Å) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 5000 Å — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 5200 Å — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 5600 Å — upar ki derivation / NCERT rule se match nahi karta."], "t": "Arithmetic mean $5000\\;\\text{\\AA}$ mat laga dena — $E \\propto \\frac{1}{\\lambda}$ hone se harmonic mean $4800\\;\\text{\\AA}$ aata hai!", "sim": ""}, {"id": 73, "sub": "Chemistry", "q": "Which of the following species has O-O bond?", "fig": "", "opt": ["Cr₂O₇²⁻", "MnO₄⁻", "CrO₅", "CrO₄²⁻"], "ans": 2, "c": "$\\text{CrO}_5$ (<b>chromium pentoxide</b>) butterfly structure banata hai jisme $\\text{Cr}(+6)$ se ek $=\\text{O}$ bond aur <b>do peroxy ($-\\text{O-O}-$) rings</b> ($4$ peroxy oxygens) jude hote hain!", "m": "Peroxy linkage ($-\\text{O-O}-$) check karenge.", "s": ["$\\text{Cr}_2\\text{O}_7^{2-}$ me $\\text{Cr-O-Cr}$ bridge hoti hai (koi $\\text{O-O}$ bond nahi), $\\text{MnO}_4^-$ aur $\\text{CrO}_4^{2-}$ me sirf $M=\\text{O}$/$M-\\text{O}^-$ bonds hote hain.", "<b>$\\text{CrO}_5$</b> me <b>2 peroxy ($\\text{O-O}$) bonds</b> hote hain!"], "r": "Option <b>(C)</b> (CrO₅) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Cr₂O₇²⁻ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> MnO₄⁻ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> CrO₄²⁻ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Blue butterfly $\\text{CrO}_5$ me oxidation state $+6$ ($+10$ nahi!) aur $2$ peroxy bonds — har saal repeat hone wala NEET sawal!", "sim": ""}, {"id": 74, "sub": "Chemistry", "q": "To determine the weight of halogen in the organic compound, the compound is heated with fuming HNO₃ in the presence of:", "fig": "", "opt": ["Ag", "AgNO₃", "AlCl₃", "Ag₂SO₄"], "ans": 1, "c": "<b>Carius method</b> me halogen containing organic compound ko sealed Carius tube me fuming $\\text{HNO}_3$ aur <b>$\\text{AgNO}_3$</b> ke saath garm kiya jata hai taaki halogen silver halide ($\\text{Ag}X$) precipitate banakar weight de sake.", "m": "NCERT Purification & Quantitative Analysis standard reagent check karenge.", "s": ["Fuming $\\text{HNO}_3$ carbon aur hydrogen ko $\\text{CO}_2, \\text{H}_2\\text{O}$ me oxidize kar deta hai aur <b>$\\text{AgNO}_3$</b> halide ion ko $\\text{Ag}X\\downarrow$ me badal deta hai."], "r": "Option <b>(B)</b> (AgNO₃) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Ag — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> AlCl₃ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Ag₂SO₄ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Carius method: Halogen ke liye fuming $\\text{HNO}_3 + \\text{AgNO}_3$; Sulphur ke liye fuming $\\text{HNO}_3$ fir $\\text{BaCl}_2$ ($\\text{BaSO}_4$)!", "sim": ""}, {"id": 75, "sub": "Chemistry", "q": "For a reaction, 2A + B → Products; doubling the initial concentration of both the reactants increases the rate by a factor of 8, and doubling the concentration of B alone, doubles the rate. The rate law for the reaction is:", "fig": "", "opt": ["r = k[A][B]²", "r = k[A]²[B]", "r = k[A][B]", "r = k[A]²[B]²"], "ans": 1, "c": "Rate law $r = k[A]^x[B]^y$ maankar concentration changes se $x$ aur $y$ nikalenge.", "m": "Dono experiments ke rate ratios compare karenge.", "s": ["Sirf $[B]$ double karne par rate $2$ guna hua: $2^y = 2 \\Rightarrow y = 1$.", "Dono $[A]$ aur $[B]$ double karne par rate $8$ guna hua: $2^x \\cdot 2^y = 8 \\Rightarrow 2^x \\cdot 2^1 = 8 \\Rightarrow 2^x = 4 \\Rightarrow x = 2$.", "Rate law: $\\color{#3fb950}{r = k[A]^2[B]}$."], "r": "Option <b>(B)</b> (r = k[A]²[B]) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> r = k[A][B]² — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> r = k[A][B] — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> r = k[A]²[B]² — upar ki derivation / NCERT rule se match nahi karta."], "t": "Reaction stoichiometry $2A + B$ dekhkar sidha mat likhna — hamesha experimental rate data se order nikalo!", "sim": ""}, {"id": 76, "sub": "Chemistry", "q": "In the reaction tree given below starting from acetamide ($\\text{CH}_3\\text{CONH}_2$), the functional groups present in products <b>B</b> and <b>C</b> respectively are:", "fig": "<svg viewBox=\"0 0 560 128\" width=\"100%\" style=\"max-width:520px\" aria-label=\"Acetamide reaction tree\">\n  <rect x=\"4\" y=\"4\" width=\"552\" height=\"120\" rx=\"10\" fill=\"#151821\" stroke=\"#2d3444\"/>\n  <text x=\"24\" y=\"68\" fill=\"#dcdfe4\" font-size=\"15\" font-weight=\"600\">CH₃CONH₂</text>\n  <line x1=\"120\" y1=\"63\" x2=\"196\" y2=\"63\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"200,63 192,58 192,68\" fill=\"#58a6ff\"/>\n  <text x=\"158\" y=\"50\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12.5\">P₂O₅, Δ</text>\n  <rect x=\"206\" y=\"44\" width=\"50\" height=\"38\" rx=\"8\" fill=\"#1f2532\" stroke=\"#3b4356\"/>\n  <text x=\"231\" y=\"68\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"16\" font-weight=\"700\">A</text>\n  <line x1=\"262\" y1=\"52\" x2=\"386\" y2=\"28\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"390,27 381,24 383,33\" fill=\"#58a6ff\"/>\n  <text x=\"322\" y=\"27\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">H₂O (partial)</text>\n  <rect x=\"396\" y=\"12\" width=\"56\" height=\"34\" rx=\"7\" fill=\"#1c2b22\" stroke=\"#3fb950\"/>\n  <text x=\"424\" y=\"34\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"15\" font-weight=\"700\">B</text>\n  <line x1=\"262\" y1=\"74\" x2=\"386\" y2=\"98\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"390,99 383,93 381,102\" fill=\"#58a6ff\"/>\n  <text x=\"322\" y=\"108\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">Reduction</text>\n  <rect x=\"396\" y=\"82\" width=\"56\" height=\"34\" rx=\"7\" fill=\"#1c2b22\" stroke=\"#3fb950\"/>\n  <text x=\"424\" y=\"104\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"15\" font-weight=\"700\">C</text>\n</svg>", "opt": ["–C(=O)–NH₂ and –NH₂", "–C(=O)–NH₂ and –COOH", "–CN and –NH–", "–COOH and –N(R)₂"], "ans": 0, "c": "Amide ($-\\text{CONH}_2$) dehydrating agent $\\text{P}_2\\text{O}_5$ ke saath nitrile ($-\\text{CN}$) banata hai, jiska partial hydrolysis wapas amide aur complete reduction $1^\\circ$ amine ($-\\text{CH}_2\\text{NH}_2$) deta hai.", "m": "$A, B, C$ teeno products pehchanenge.", "s": ["$\\text{CH}_3\\text{CONH}_2 \\xrightarrow{\\text{P}_2\\text{O}_5} \\text{CH}_3\\text{CN}$ ($A$).", "$\\text{CH}_3\\text{CN} \\xrightarrow{\\text{H}_2\\text{O (partial)}} \\text{CH}_3\\text{CONH}_2$ ($B \\rightarrow$ amide group <b>$-\\text{C(=O)-NH}_2$</b>).", "$\\text{CH}_3\\text{CN} \\xrightarrow{\\text{reduction}} \\text{CH}_3\\text{CH}_2\\text{NH}_2$ ($C \\rightarrow$ primary amine group <b>$-\\text{NH}_2$</b>)."], "r": "Option <b>(A)</b> (–C(=O)–NH₂ and –NH₂) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> –C(=O)–NH₂ and –COOH — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> –CN and –NH– — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> –COOH and –N(R)₂ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Cyanide ($-\\text{CN}$) partial hydrolysis se amide ($-\\text{CONH}_2$) aur complete hydrolysis se carboxylic acid ($-\\text{COOH}$) deta hai!", "sim": ""}, {"id": 77, "sub": "Chemistry", "q": "In the Gabriel phthalimide reaction sequence shown below, the final products <b>C</b> and <b>D</b> obtained after hydrolysis are:", "fig": "<svg viewBox=\"0 0 610 116\" width=\"100%\" style=\"max-width:570px\" aria-label=\"Gabriel phthalimide synthesis\">\n  <rect x=\"4\" y=\"4\" width=\"602\" height=\"108\" rx=\"10\" fill=\"#151821\" stroke=\"#2d3444\"/>\n  <polygon points=\"24,42 46,29 68,42 68,70 46,83 24,70\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/>\n  <circle cx=\"46\" cy=\"56\" r=\"11\" fill=\"none\" stroke=\"#9aa3b2\" stroke-width=\"1.3\"/>\n  <polyline points=\"68,42 96,42 108,56 96,70 68,70\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/>\n  <text x=\"95\" y=\"32\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"11.5\">=O</text>\n  <text x=\"95\" y=\"88\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"11.5\">=O</text>\n  <text x=\"122\" y=\"60\" fill=\"#58a6ff\" font-size=\"13\" font-weight=\"600\">NH</text>\n  <line x1=\"150\" y1=\"56\" x2=\"212\" y2=\"56\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"216,56 208,51 208,61\" fill=\"#58a6ff\"/>\n  <text x=\"182\" y=\"44\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">KOH</text>\n  <rect x=\"222\" y=\"38\" width=\"42\" height=\"36\" rx=\"7\" fill=\"#1f2532\" stroke=\"#3b4356\"/>\n  <text x=\"243\" y=\"61\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"15\" font-weight=\"700\">A</text>\n  <line x1=\"270\" y1=\"56\" x2=\"344\" y2=\"56\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"348,56 340,51 340,61\" fill=\"#58a6ff\"/>\n  <text x=\"308\" y=\"44\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">C₂H₅Br</text>\n  <rect x=\"354\" y=\"38\" width=\"42\" height=\"36\" rx=\"7\" fill=\"#1f2532\" stroke=\"#3b4356\"/>\n  <text x=\"375\" y=\"61\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"15\" font-weight=\"700\">B</text>\n  <line x1=\"402\" y1=\"56\" x2=\"490\" y2=\"56\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"494,56 486,51 486,61\" fill=\"#58a6ff\"/>\n  <text x=\"446\" y=\"43\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"11.5\">(i) H₂O  (ii) H⁺</text>\n  <rect x=\"500\" y=\"36\" width=\"90\" height=\"40\" rx=\"8\" fill=\"#1c2b22\" stroke=\"#3fb950\"/>\n  <text x=\"545\" y=\"61\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"15.5\" font-weight=\"700\">C + D</text>\n</svg>", "opt": ["Benzoic acid + aniline", "Phthalic acid + ethylamine", "Phthalic acid + aniline", "Benzoic acid + ethylamine"], "ans": 1, "c": "Ye mashhoor <b>Gabriel Phthalimide Synthesis</b> hai jo pure aliphatic primary amine banane me kaam aati hai.", "m": "Stepwise sequence $A \\to B \\to C + D$ likhenge.", "s": ["Phthalimide $+ \\text{KOH} \\to$ Potassium phthalimide ($A$).", "$A + \\text{C}_2\\text{H}_5\\text{Br} \\to$ $N$-Ethylphthalimide ($B$).", "$B \\xrightarrow{\\text{H}_2\\text{O} / \\text{H}^+}$ <b>Phthalic acid + Ethylamine</b> ($\\text{C}_2\\text{H}_5\\text{NH}_2$)!"], "r": "Option <b>(B)</b> (Phthalic acid + ethylamine) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Benzoic acid + aniline — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Phthalic acid + aniline — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Benzoic acid + ethylamine — upar ki derivation / NCERT rule se match nahi karta."], "t": "Gabriel phthalimide se <b>Aniline</b> kabhi nahi ban sakti kyunki aryl halide nucleophilic substitution nahi deta!", "sim": ""}, {"id": 78, "sub": "Chemistry", "q": "Match the Matrix:<br>Column-I:<br>(A) I > Br > Cl > F<br>(B) F > Cl > Br > I<br>(C) Cl > F > Br > I<br>(D) O > F > N > C<br>Column-II:<br>(Q) Size<br>(R) EA (electron affinity)<br>(S) EN (Electronegativity)<br>(T) 2nd ionization energy<br>Select the correct match (A - B - C - D):", "fig": "", "opt": ["Q - S - R - T", "Q - S - T - R", "T - S - Q - R", "Q - R - S - T"], "ans": 0, "c": "Halogens aur second period elements ki standard periodic trends match karni hain.", "m": "Atomic size, EN, EA aur $2^{\\text{nd}}$ IE check karenge.", "s": ["(A) $\\text{I} > \\text{Br} > \\text{Cl} > \\text{F} \\rightarrow$ <b>Size (Q)</b>.", "(B) $\\text{F} > \\text{Cl} > \\text{Br} > \\text{I} \\rightarrow$ <b>Electronegativity (S)</b>.", "(C) $\\text{Cl} > \\text{F} > \\text{Br} > \\text{I} \\rightarrow$ <b>Electron Affinity (R)</b> ($\\text{F}$ me $2p$ inter-electronic repulsion!).", "(D) $\\text{O} > \\text{F} > \\text{N} > \\text{C} \\rightarrow$ <b>$2^{\\text{nd}}$ Ionization Energy (T)</b> ($\\text{O}^+$ half-filled $2p^3$ stable!) $\\Rightarrow \\color{#3fb950}{\\text{Q - S - R - T}}$."], "r": "Option <b>(A)</b> (Q - S - R - T) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> Q - S - T - R — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> T - S - Q - R — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Q - R - S - T — upar ki derivation / NCERT rule se match nahi karta."], "t": "$\\text{Cl} > \\text{F}$ (Electron Affinity) aur $\\text{O} > \\text{F}$ ($2^{\\text{nd}}$ IE) inorganic chemistry ke do evergreen gems hain!", "sim": ""}, {"id": 79, "sub": "Chemistry", "q": "The solubility product constant for the saturated solution of silver chromate (Ag₂CrO₄) is given by:", "fig": "", "opt": ["Ksp = [2Ag⁺]²[CrO₄²⁻]", "Ksp = [Ag⁺]²[CrO₄²⁻]", "Ksp = [Ag⁺][CrO₄²⁻]", "Ksp = [2Ag⁺]²[CrO₄²⁻]²"], "ans": 1, "c": "$\\text{Ag}_2\\text{CrO}_4(s) \\rightleftharpoons 2\\text{Ag}^+(aq) + \\text{CrO}_4^{2-}(aq)$ ke liye equilibrium expression me stoichiometric coefficient bracket ke <b>andar guna nahi hota</b>, sirf <b>power</b> banta hai!", "m": "$K_{sp} = [\\text{Ag}^+]^2[\\text{CrO}_4^{2-}]$ likhenge.", "s": ["Stoichiometric equilibrium se seedha: $\\color{#3fb950}{K_{sp} = [\\text{Ag}^+]^2[\\text{CrO}_4^{2-}]}$ ($[2\\text{Ag}^+]^2$ sirf solubility '$s$' rakhte waqt $(2s)^2(s) = 4s^3$ me aata hai!)."], "r": "Option <b>(B)</b> (Ksp = [Ag⁺]²[CrO₄²⁻]) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Ksp = [2Ag⁺]²[CrO₄²⁻] — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Ksp = [Ag⁺][CrO₄²⁻] — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Ksp = [2Ag⁺]²[CrO₄²⁻]² — upar ki derivation / NCERT rule se match nahi karta."], "t": "$[2\\text{Ag}^+]^2$ classic trap hai! Concentration bracket me hamesha $[\\text{Ag}^+]^2$ hi hota hai!", "sim": ""}, {"id": 80, "sub": "Chemistry", "q": "Chromium ion ($\\text{Cr}^{3+}$) forms the coordination complex $[\\text{Cr(NH}_3)_x\\text{Cl}_y]^{2+}$. What are the values of $x$ and $y$ respectively?", "fig": "", "opt": ["1, 3", "5, 1", "4, 1", "1, 4"], "ans": 1, "c": "$\\text{Cr}^{3+}$ ($d^3$) octahedral complex banata hai jiska <b>coordination number hamesha $6$</b> hota hai ($x + y = 6$).", "m": "Charge balance $(+3) + x(0) + y(-1) = +2$ aur $x + y = 6$ solve karenge.", "s": ["Complex $[\\text{Cr(NH}_3)_x\\text{Cl}_y]^{+2}$ par charge balance:<br>$+3 + 0 - y = +2 \\Rightarrow y = 1$.", "$\\text{Cr}^{3+}$ ka CN $= 6$: $x + y = 6 \\Rightarrow x + 1 = 6 \\Rightarrow x = 5$, yaani $(x, y) = \\color{#3fb950}{(5, 1)}$."], "r": "Option <b>(B)</b> (5, 1) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 1, 3 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 4, 1 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 1, 4 — upar ki derivation / NCERT rule se match nahi karta."], "t": "$\\text{Cr}^{3+}$ hamesha CN $= 6$ dikhata hai — isse $(4, 1)$ wala option turant kat jata hai!", "sim": ""}, {"id": 81, "sub": "Chemistry", "q": "The electrode potential for Cu²⁺(aq) + e⁻ → Cu⁺(aq) and Cu⁺(aq) + e⁻ → Cu(s) are +0.15 V and +0.50 V respectively. The value of E°(Cu²⁺/Cu) will be:", "fig": "", "opt": ["0.50 V", "0.325 V", "0.650 V", "0.150 V"], "ans": 1, "c": "Cell potentials intensive property hain isliye seedhe nahi judte — unke <b>Gibbs free energy changes ($\\Delta G^\\circ = -n F E^\\circ$)</b> judte hain!", "m": "$n_3 E_3^\\circ = n_1 E_1^\\circ + n_2 E_2^\\circ$ lagayenge.", "s": ["$\\text{Cu}^{2+} + 1e^- \\to \\text{Cu}^+$ ($n_1 = 1,\\; E_1^\\circ = +0.15\\text{ V}$).", "$\\text{Cu}^+ + 1e^- \\to \\text{Cu}$ ($n_2 = 1,\\; E_2^\\circ = +0.50\\text{ V}$).", "Jodne par $\\text{Cu}^{2+} + 2e^- \\to \\text{Cu}$ ($n_3 = 2$):<br>$2 E_3^\\circ = 1(0.15) + 1(0.50) = 0.65 \\Rightarrow E_3^\\circ = \\frac{0.65}{2} = \\color{#3fb950}{0.325\\text{ V}}$."], "r": "Option <b>(B)</b> (0.325 V) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 0.50 V — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 0.650 V — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 0.150 V — upar ki derivation / NCERT rule se match nahi karta."], "t": "Electrochemistry Golden Rule: Half-reactions jodte waqt hamesha $nE^\\circ$ jodo, kabhi akela $E^\\circ$ mat jodo!", "sim": ""}, {"id": 82, "sub": "Chemistry", "q": "The stability of Cu⁺² is more than Cu⁺ salts in aqueous solution due to:", "fig": "", "opt": ["Enthalpy of atomisation", "Hydration energy", "Second ionisation enthalpy", "First ionisation enthalpy"], "ans": 1, "c": "Paani me $\\text{Cu}^{2+}$ ion chhota size aur zyada charge ($+2$) hone ke karan $\\text{Cu}^+$ se kahin zyada negative <b>Hydration Enthalpy</b> chhodta hai, jo second ionisation enthalpy ki kami ko poora kar deti hai!", "m": "NCERT $d$-block fact verify karenge.", "s": ["High negative <b>hydration energy</b> of $\\text{Cu}^{2+}(aq)$ hi paani me $2\\text{Cu}^+(aq) \\to \\text{Cu}^{2+}(aq) + \\text{Cu}(s)$ disproportionation karwati hai!"], "r": "Option <b>(B)</b> (Hydration energy) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Enthalpy of atomisation — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Second ionisation enthalpy — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> First ionisation enthalpy — upar ki derivation / NCERT rule se match nahi karta."], "t": "Direct NCERT line ($d$- & $f$-block): $\\text{Cu}^{2+}(aq)$ is much more stable than $\\text{Cu}^+(aq)$ due to much more negative $\\Delta_{\\text{hyd}}H^\\circ$!", "sim": ""}, {"id": 83, "sub": "Chemistry", "q": "Identify the yellow azo dye product <b>[A]</b> formed in the coupling reaction shown below:", "fig": "<svg viewBox=\"0 0 540 100\" width=\"100%\" style=\"max-width:500px\" aria-label=\"Diazo coupling reaction\">\n  <rect x=\"4\" y=\"4\" width=\"532\" height=\"92\" rx=\"10\" fill=\"#151821\" stroke=\"#2d3444\"/>\n  <text x=\"22\" y=\"55\" fill=\"#dcdfe4\" font-size=\"15\" font-weight=\"600\">C₆H₅–N₂⁺ Cl⁻  +  C₆H₅–NH₂</text>\n  <line x1=\"258\" y1=\"50\" x2=\"366\" y2=\"50\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"370,50 362,45 362,55\" fill=\"#58a6ff\"/>\n  <text x=\"312\" y=\"38\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">H⁺ (pH 4–5), 273–278 K</text>\n  <rect x=\"378\" y=\"30\" width=\"140\" height=\"40\" rx=\"8\" fill=\"#1c2b22\" stroke=\"#3fb950\"/>\n  <text x=\"448\" y=\"55\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"14\" font-weight=\"700\">Yellow Dye (?)</text>\n</svg>", "opt": ["C₆H₅-N=N-NH-C₆H₅ (Diazoaminobenzene)", "o-Aminoazobenzene (C₆H₅-N=N-C₆H₄-NH₂-o)", "m-Aminoazobenzene (C₆H₅-N=N-C₆H₄-NH₂-m)", "p-Aminoazobenzene (C₆H₅-N=N-C₆H₄-NH₂-p)"], "ans": 3, "c": "Faintly acidic medium ($\\text{pH} = 4\\text{–}5$) me benzenediazonium chloride aniline ke electron-rich <b>para-position</b> par electrophilic diazo coupling karke <b>p-aminoazobenzene (Yellow dye)</b> banata hai!", "m": "Electrophilic aromatic coupling product pehchanenge.", "s": ["$\\text{C}_6\\text{H}_5\\text{N}_2^+\\text{Cl}^- + \\text{H-C}_6\\text{H}_4\\text{-NH}_2 \\xrightarrow{\\text{H}^+} \\color{#3fb950}{\\text{C}_6\\text{H}_5\\text{-N=N-C}_6\\text{H}_4\\text{-NH}_2\\text{-(para)}}$ (Yellow dye, Option D)."], "r": "Option <b>(D)</b> (p-Aminoazobenzene (C₆H₅-N=N-C₆H₄-NH₂-p)) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> C₆H₅-N=N-NH-C₆H₅ (Diazoaminobenzene) — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> o-Aminoazobenzene (C₆H₅-N=N-C₆H₄-NH₂-o) — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> m-Aminoazobenzene (C₆H₅-N=N-C₆H₄-NH₂-m) — upar ki derivation / NCERT rule se match nahi karta."], "t": "Phenol coupling $\\rightarrow$ <b>Orange dye</b> ($p$-hydroxyazobenzene); Aniline coupling $\\rightarrow$ <b>Yellow dye</b> ($p$-aminoazobenzene)!", "sim": ""}, {"id": 84, "sub": "Chemistry", "q": "Identify the compounds <b>(A)</b>, <b>(B)</b> and <b>(C)</b> in the aromatic reaction sequence shown below starting from phenol:", "fig": "<svg viewBox=\"0 0 600 108\" width=\"100%\" style=\"max-width:560px\" aria-label=\"Phenol conversion sequence\">\n  <rect x=\"4\" y=\"4\" width=\"592\" height=\"100\" rx=\"10\" fill=\"#151821\" stroke=\"#2d3444\"/>\n  <text x=\"20\" y=\"58\" fill=\"#dcdfe4\" font-size=\"15\" font-weight=\"600\">C₆H₅OH</text>\n  <line x1=\"94\" y1=\"53\" x2=\"174\" y2=\"53\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"178,53 170,48 170,58\" fill=\"#58a6ff\"/>\n  <text x=\"135\" y=\"40\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">Zn dust, Δ</text>\n  <rect x=\"184\" y=\"35\" width=\"46\" height=\"36\" rx=\"7\" fill=\"#1f2532\" stroke=\"#3b4356\"/>\n  <text x=\"207\" y=\"58\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"15\" font-weight=\"700\">(A)</text>\n  <line x1=\"236\" y1=\"53\" x2=\"366\" y2=\"53\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"370,53 362,48 362,58\" fill=\"#58a6ff\"/>\n  <text x=\"301\" y=\"39\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"11.5\">Conc. HNO₃ + H₂SO₄</text>\n  <text x=\"301\" y=\"71\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"11.5\">60 °C</text>\n  <rect x=\"376\" y=\"35\" width=\"46\" height=\"36\" rx=\"7\" fill=\"#1f2532\" stroke=\"#3b4356\"/>\n  <text x=\"399\" y=\"58\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"15\" font-weight=\"700\">(B)</text>\n  <line x1=\"428\" y1=\"53\" x2=\"516\" y2=\"53\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"520,53 512,48 512,58\" fill=\"#58a6ff\"/>\n  <text x=\"472\" y=\"40\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">Sn / HCl</text>\n  <rect x=\"526\" y=\"35\" width=\"52\" height=\"36\" rx=\"7\" fill=\"#1c2b22\" stroke=\"#3fb950\"/>\n  <text x=\"552\" y=\"58\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"15\" font-weight=\"700\">(C)</text>\n</svg>", "opt": ["Benzene, nitrobenzene and azobenzene", "Benzene, dinitrobenzene and m-nitroaniline", "Toluene, m-nitrobenzene and m-toluidine", "Benzene, nitrobenzene and aniline"], "ans": 3, "c": "Standard NCERT aromatic conversion chain: Phenol $\\xrightarrow{\\text{Zn}}$ Benzene $\\xrightarrow{\\text{Nitration}}$ Nitrobenzene $\\xrightarrow{\\text{Sn/HCl}}$ Aniline.", "m": "Teeno compounds $(A), (B), (C)$ pehchanenge.", "s": ["Phenol $+ \\text{Zn dust} \\xrightarrow{\\Delta} \\text{C}_6\\text{H}_6$ (<b>Benzene</b>, $A$).", "Benzene $+ \\text{Conc. HNO}_3/\\text{H}_2\\text{SO}_4 \\xrightarrow{60^\\circ\\text{C}} \\text{C}_6\\text{H}_5\\text{NO}_2$ (<b>Nitrobenzene</b>, $B$).", "Nitrobenzene $+ \\text{Sn/HCl} \\to \\text{C}_6\\text{H}_5\\text{NH}_2$ (<b>Aniline</b>, $C$)."], "r": "Option <b>(D)</b> (Benzene, nitrobenzene and aniline) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Benzene, nitrobenzene and azobenzene — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> Benzene, dinitrobenzene and m-nitroaniline — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Toluene, m-nitrobenzene and m-toluidine — upar ki derivation / NCERT rule se match nahi karta."], "t": "Teen super-important named reactions ek hi sawal me!", "sim": ""}, {"id": 85, "sub": "Chemistry", "q": "1 M HCl and 2 M HCl are mixed in volume ratio of 4 : 1. What is the final molarity of HCl solution?", "fig": "", "opt": ["1.5", "1", "1.2", "1.8"], "ans": 2, "c": "Same non-reacting solute ($\\text{HCl}$) ke do solutions milane par final molarity $M_f = \\frac{M_1 V_1 + M_2 V_2}{V_1 + V_2}$ hoti hai.", "m": "$V_1 = 4,\\; V_2 = 1$ rakhkar solve karenge.", "s": ["$M_f = \\frac{(1 \\times 4) + (2 \\times 1)}{4 + 1} = \\frac{4 + 2}{5} = \\frac{6}{5} = \\color{#3fb950}{1.2\\text{ M}}$."], "r": "Option <b>(C)</b> (1.2) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 1.5 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 1 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 1.8 — upar ki derivation / NCERT rule se match nahi karta."], "t": "Simple weighted average — total millimoles divided by total volume!", "sim": ""}, {"id": 86, "sub": "Chemistry", "q": "A chemical reaction is carried out at $300\\text{ K}$ and $280\\text{ K}$, and the rate constants are found to be $K_1$ and $K_2$ respectively. Then:", "fig": "", "opt": ["$K_2 = \\frac{K_1}{4}$", "$K_2 = \\frac{K_1}{2}$", "$K_2 = 4K_1$", "$K_2 = 2K_1$"], "ans": 0, "c": "Temperature coefficient rule ke anusaar sadharan rasayanik abhikriya me har <b>$10\\text{ K}$ tapman badhane par rate constant lagbhag dugna ($2\\times$)</b> ho jata hai.", "m": "$300\\text{ K}$ aur $280\\text{ K}$ ($\\Delta T = 20\\text{ K}$) ke liye $K_1$ aur $K_2$ relate karenge.", "s": ["$T_1 = 300\\text{ K}$ par rate constant $K_1$ hai aur $T_2 = 280\\text{ K}$ ($20\\text{ K}$ kam!) par $K_2$ hai.", "$K_1 = 2^{(300 - 280)/10} K_2 = 2^2 K_2 = 4 K_2 \\Rightarrow \\color{#3fb950}{K_2 = \\frac{K_1}{4}}$."], "r": "Option <b>(A)</b> ($K_2 = \\frac{K_1}{4}$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> $K_2 = \\frac{K_1}{2}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $K_2 = 4K_1$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $K_2 = 2K_1$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Dhyan dena: $K_1$ $300\\text{ K}$ par hai aur $K_2$ $280\\text{ K}$ par — zyada temp par bada $K$, kam temp par chhota $K$!", "sim": ""}, {"id": 87, "sub": "Chemistry", "q": "Match List-I with List-II:<br>List-I:<br>(A) Sucrose<br>(B) Maltose<br>(C) Amylose<br>(D) Amylopectin<br>List-II:<br>(i) C₁-C₄ and C₁-C₆ glycosidic linkage<br>(ii) C₁-C₄ glycosidic linkage and about 15-20% starch<br>(iii) Reducing sugar and C₁-C₄ glycosidic linkage<br>(iv) Non-reducing sugar<br>Choose the correct answer from the options given below:", "fig": "", "opt": ["A-iv, B-iii, C-i, D-ii", "A-iv, B-iii, C-ii, D-i", "A-ii, B-i, C-iv, D-iii", "A-iii, B-iv, C-i, D-ii"], "ans": 1, "c": "Carbohydrates (Biomolecules NCERT) ke glycosidic linkages aur reducing properties match karni hain.", "m": "Sucrose, Maltose, Amylose, Amylopectin check karenge.", "s": ["<b>A. Sucrose</b> $\\rightarrow$ <b>iv.</b> Non-reducing sugar; <b>B. Maltose</b> $\\rightarrow$ <b>iii.</b> Reducing sugar & $\\text{C}_1\\text{-C}_4$ linkage; <b>C. Amylose</b> $\\rightarrow$ <b>ii.</b> $\\text{C}_1\\text{-C}_4$ linear chain ($15\\text{–}20\\%$ starch); <b>D. Amylopectin</b> $\\rightarrow$ <b>i.</b> $\\text{C}_1\\text{-C}_4$ aur branching $\\text{C}_1\\text{-C}_6$ linkage $\\Rightarrow$ <b>A-iv, B-iii, C-ii, D-i</b>."], "r": "Option <b>(B)</b> (A-iv, B-iii, C-ii, D-i) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> A-iv, B-iii, C-i, D-ii — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> A-ii, B-i, C-iv, D-iii — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> A-iii, B-iv, C-i, D-ii — upar ki derivation / NCERT rule se match nahi karta."], "t": "Sucrose ekmatra common disaccharide hai jo <b>non-reducing</b> hota hai — sirf A-iv, D-i dekhkar hi answer mil jata hai!", "sim": ""}, {"id": 88, "sub": "Chemistry", "q": "Which of the following straight-line plots is strictly in accordance with the Arrhenius equation?", "fig": "<svg viewBox=\"0 0 540 128\" width=\"100%\" style=\"max-width:540px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Four Arrhenius candidate plots\"><rect width=\"540\" height=\"128\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><g transform=\"translate(38,20)\"><text x=\"-22\" y=\"45\" fill=\"#93c5fd\" font-size=\"12.5\" font-weight=\"700\">(A)</text><line x1=\"16\" y1=\"6\" x2=\"16\" y2=\"82\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/><line x1=\"16\" y1=\"82\" x2=\"96\" y2=\"82\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/><line x1=\"22\" y1=\"18\" x2=\"88\" y2=\"74\" stroke=\"#3fb950\" stroke-width=\"2.4\"/><text x=\"8\" y=\"46\" fill=\"#dcdfe4\" font-size=\"11\" text-anchor=\"middle\" transform=\"rotate(-90 8 46)\">log K</text><text x=\"56\" y=\"98\" fill=\"#dcdfe4\" font-size=\"11.5\" text-anchor=\"middle\">1/T →</text></g><g transform=\"translate(168,20)\"><text x=\"-22\" y=\"45\" fill=\"#93c5fd\" font-size=\"12.5\" font-weight=\"700\">(B)</text><line x1=\"16\" y1=\"6\" x2=\"16\" y2=\"82\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/><line x1=\"16\" y1=\"82\" x2=\"96\" y2=\"82\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/><line x1=\"22\" y1=\"18\" x2=\"88\" y2=\"74\" stroke=\"#60a5fa\" stroke-width=\"2.4\"/><text x=\"8\" y=\"46\" fill=\"#dcdfe4\" font-size=\"11\" text-anchor=\"middle\" transform=\"rotate(-90 8 46)\">K</text><text x=\"56\" y=\"98\" fill=\"#dcdfe4\" font-size=\"11.5\" text-anchor=\"middle\">1/T →</text></g><g transform=\"translate(298,20)\"><text x=\"-22\" y=\"45\" fill=\"#93c5fd\" font-size=\"12.5\" font-weight=\"700\">(C)</text><line x1=\"16\" y1=\"6\" x2=\"16\" y2=\"82\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/><line x1=\"16\" y1=\"82\" x2=\"96\" y2=\"82\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/><line x1=\"22\" y1=\"18\" x2=\"88\" y2=\"74\" stroke=\"#60a5fa\" stroke-width=\"2.4\"/><text x=\"8\" y=\"46\" fill=\"#dcdfe4\" font-size=\"11\" text-anchor=\"middle\" transform=\"rotate(-90 8 46)\">log K</text><text x=\"56\" y=\"98\" fill=\"#dcdfe4\" font-size=\"11.5\" text-anchor=\"middle\">T →</text></g><g transform=\"translate(428,20)\"><text x=\"-22\" y=\"45\" fill=\"#93c5fd\" font-size=\"12.5\" font-weight=\"700\">(D)</text><line x1=\"16\" y1=\"6\" x2=\"16\" y2=\"82\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/><line x1=\"16\" y1=\"82\" x2=\"96\" y2=\"82\" stroke=\"#dcdfe4\" stroke-width=\"1.8\"/><line x1=\"22\" y1=\"18\" x2=\"88\" y2=\"74\" stroke=\"#60a5fa\" stroke-width=\"2.4\"/><text x=\"8\" y=\"46\" fill=\"#dcdfe4\" font-size=\"11\" text-anchor=\"middle\" transform=\"rotate(-90 8 46)\">log K</text><text x=\"56\" y=\"98\" fill=\"#dcdfe4\" font-size=\"11.5\" text-anchor=\"middle\">log T →</text></g></svg>", "opt": ["Plot of $\\log K$ ($y$-axis) vs $\\frac{1}{T}$ ($x$-axis): straight line sloping downward", "Plot of $K$ ($y$-axis) vs $\\frac{1}{T}$ ($x$-axis): straight line sloping downward", "Plot of $\\log K$ ($y$-axis) vs $T$ ($x$-axis): straight line sloping downward", "Plot of $\\log K$ ($y$-axis) vs $\\log T$ ($x$-axis): straight line sloping downward"], "ans": 0, "c": "<b>Arrhenius equation</b> $K = A e^{-E_a / RT}$ ka base-10 log lene par $\\log K = \\log A - \\frac{E_a}{2.303 R}\\left(\\frac{1}{T}\\right)$ milta hai.", "m": "$y = c - mx$ se axes aur slope match karenge.", "s": ["$y$-axis par $\\log K$ aur $x$-axis par $\\frac{1}{T}$ plot karne par <b>negative slope ($-\\frac{E_a}{2.303R}$)</b> wali seedhi rekha milti hai $\\Rightarrow$ <b>Option A</b>."], "r": "Option <b>(A)</b> (Plot of $\\log K$ ($y$-axis) vs $\\frac{1}{T}$ ($x$-axis): straight line sloping downward) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> Plot of $K$ ($y$-axis) vs $\\frac{1}{T}$ ($x$-axis): straight line sloping downward — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Plot of $\\log K$ ($y$-axis) vs $T$ ($x$-axis): straight line sloping downward — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Plot of $\\log K$ ($y$-axis) vs $\\log T$ ($x$-axis): straight line sloping downward — upar ki derivation / NCERT rule se match nahi karta."], "t": "Slope $= -\\frac{E_a}{2.303 R}$ (for $\\log_{10} K$) aur $-\\frac{E_a}{R}$ (for $\\ln K$)!", "sim": ""}, {"id": 89, "sub": "Chemistry", "q": "Highest oxidation state +7 is shown by which actinoids:", "fig": "", "opt": ["Np, Pu", "Pa, U", "Am, Cm", "Cf, Es"], "ans": 0, "c": "Actinoids me highest oxidation state <b>$+7$</b> sirf <b>Neptunium ($\\text{Np}$, $Z=93$) aur Plutonium ($\\text{Pu}$, $Z=94$)</b> dikhate hain!", "m": "NCERT $f$-block oxidation state table check karenge.", "s": ["$\\text{Th}$ ($+4$), $\\text{Pa}$ ($+5$), $\\text{U}$ ($+6$), aur <b>$\\text{Np, Pu}$ ($+7$ maximum)</b> $\\Rightarrow$ <b>Option A</b>."], "r": "Option <b>(A)</b> (Np, Pu) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> Pa, U — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Am, Cm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Cf, Es — upar ki derivation / NCERT rule se match nahi karta."], "t": "Yaad karne ki series: $\\text{Ac}(+3),\\; \\text{Th}(+4),\\; \\text{Pa}(+5),\\; \\text{U}(+6),\\; \\text{Np, Pu}(+7)$!", "sim": ""}, {"id": 90, "sub": "Chemistry", "q": "The ratio of total $\\sigma$-bonds to $\\pi$-bonds ($\\sigma : \\pi$) in tetracyanoethylene, $\\text{C}_2(\\text{CN})_4$, is:", "fig": "", "opt": ["2 : 1", "1 : 2", "1 : 1", "None of these"], "ans": 2, "c": "Tetracyanoethylene $(\\text{NC})_2\\text{C=C(CN)}_2$ ki poori lewis structure banakar har single bond me $1\\sigma$, double bond me $1\\sigma + 1\\pi$, aur triple bond ($-\\text{C}\\equiv\\text{N}$) me $1\\sigma + 2\\pi$ ginege.", "m": "Kul $\\sigma$ aur $\\pi$ bonds count karenge.", "s": ["Structure me $4\\;\\text{C-C}$ single bonds ($4\\sigma$), $1\\;\\text{C=C}$ double bond ($1\\sigma + 1\\pi$), aur $4\\;\\text{C}\\equiv\\text{N}$ triple bonds ($4\\sigma + 8\\pi$) hain.", "Total $\\sigma$ bonds $= 4 + 1 + 4 = 9\\;\\sigma$; Total $\\pi$ bonds $= 1 + 8 = 9\\;\\pi$.", "Ratio $\\sigma : \\pi = 9 : 9 = \\color{#3fb950}{1 : 1}$!"], "r": "Option <b>(C)</b> (1 : 1) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 2 : 1 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 1 : 2 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> None of these — upar ki derivation / NCERT rule se match nahi karta."], "t": "NEET favourite gem: Tetracyanoethylene $\\text{C}_2(\\text{CN})_4$ me $9\\sigma$ aur $9\\pi$ bonds hote hain (ratio $1:1$)!", "sim": ""}, {"id": 91, "sub": "Botany", "q": "Select the correct match for Mendel experiment:<br>(A) RRyy - Green round - 6.25%<br>(B) RrYy - Yellow round - 25%<br>(C) rrYY - Green wrinkled - 12.5%<br>(D) rryy - Green wrinkled - 6.25%", "fig": "", "opt": ["A, B, C", "only A, C", "only A, B, D", "All"], "ans": 2, "c": "Mendel ke dihybrid cross ($RrYy \\times RrYy$, $16$ zygotes) me $R$ = Round, $r$ = wrinkled, $Y$ = Yellow, $y$ = green hota hai.", "m": "NCERT concept aur statement/match verification se sahi option select karte hain.", "s": ["(A) $RRyy$ = $1/16 = 6.25\\%$ Green round (Sahi); (B) $RrYy$ = $4/16 = 25\\%$ Yellow round (Sahi); (C) $rrYY$ = <b>Yellow wrinkled</b> ($1/16 = 6.25\\%$), Green wrinkled nahi (Galat!); (D) $rryy$ = $1/16 = 6.25\\%$ Green wrinkled (Sahi) $\\Rightarrow$ <b>only A, B, D</b>."], "r": "Option <b>(C)</b> (only A, B, D) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> A, B, C — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> only A, C — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> All — upar ki derivation / NCERT rule se match nahi karta."], "t": "NCERT Biology ki exact lines aur exceptions dhyan se revise rakho — سیدھے +4 marks pakke!", "sim": ""}, {"id": 92, "sub": "Botany", "q": "In DNA which bond are present in between Guanine and Cytosine:", "fig": "", "opt": ["Three hydrogen bonds", "Two hydrogen bond", "Three N-glycosidic bond", "Three phosphodiester bonds"], "ans": 0, "c": "Chargaff aur Watson-Crick model ke anusaar DNA double helix me Adenine aur Thymine ke beech $2$ hydrogen bonds ($A=T$) aur <b>Guanine aur Cytosine ke beech $3$ hydrogen bonds ($G\\equiv C$)</b> hote hain.", "m": "NCERT concept aur statement/match verification se sahi option select karte hain.", "s": ["$G$ aur $C$ complementary nitrogenous bases aapas me <b>Three hydrogen bonds</b> se judte hain."], "r": "Option <b>(A)</b> (Three hydrogen bonds) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> Two hydrogen bond — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Three N-glycosidic bond — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Three phosphodiester bonds — upa /* Complete offline HTML/Unicode fallback renderer when KaTeX CDN is offline */
const GREEK_MAP = {
  alpha:"α", beta:"β", gamma:"γ", delta:"δ", epsilon:"ε", varepsilon:"ε",
  theta:"θ", lambda:"λ", mu:"μ", nu:"ν", pi:"π", rho:"ρ", sigma:"σ",
  tau:"τ", phi:"φ", Phi:"Φ", omega:"ω", Omega:"Ω", Delta:"Δ", sum:"∑",
  times:"×", cdot:"·", pm:"±", mp:"∓", le:"≤", leq:"≤", ge:"≥", geq:"≥",
  ne:"≠", neq:"≠", approx:"≈", propto:"∝", infty:"∞", to:"→", rightarrow:"→",
  longrightarrow:"⟶", leftarrow:"←", leftrightarrow:"↔", rightleftharpoons:"⇌",
  Rightarrow:"⇒", dots:"…", cdots:"⋯", circ:"°", AA:"Å", ll:"≪", gg:"≫", ell:"ℓ", equiv:"≡", downarrow:"↓", uparrow:"↑", iff:"⇔", div:"÷", widehat:"",
  hat:"", vec:"", mathbf:"", mathrm:"", text:"", displaystyle:"", left:"", right:"",
  ",":" ", ";":" ", "!":""
};

function takeGroup(s, pos) {
  while (pos < s.length && s[pos] === " ") pos++;
  if (s[pos] !== "{") return [s[pos] || "", pos + 1];
  let depth = 0, i = pos;
  for (; i < s.length; i++) {
    if (s[i] === "{") depth++;
    else if (s[i] === "}") { depth--; if (depth === 0) return [s.slice(pos + 1, i), i + 1]; }
  }
  return [s.slice(pos + 1), s.length];
}

function texToHtml(tex) {
  let s = tex.trim().replace(/\\\{/g, "⦃").replace(/\\\}/g, "⦄");
  for (let guard = 0; guard < 40; guard++) {
    let changed = false;
    const cIdx = s.indexOf("\\color");
    if (cIdx !== -1) {
      const [col, p1] = takeGroup(s, cIdx + 6);
      const rest = s.slice(p1);
      s = texToHtml(s.slice(0, cIdx)) + '<span style="color:' + col + ';font-weight:700">' + texToHtml(rest) + "</span>";
      return s;
    }
    const fIdx = s.indexOf("\\frac");
    if (fIdx !== -1) {
      const [num, p1] = takeGroup(s, fIdx + 5);
      const [den, p2] = takeGroup(s, p1);
      s = s.slice(0, fIdx) + '<span class="m-frac"><span>' + texToHtml(num) + "</span><span>" + texToHtml(den) + "</span></span>" + s.slice(p2);
      changed = true;
    }
    const qIdx = s.indexOf("\\sqrt");
    if (qIdx !== -1) {
      const [rad, p1] = takeGroup(s, qIdx + 5);
      s = s.slice(0, qIdx) + '<span class="m-sqrt">√<span class="m-rad">' + texToHtml(rad) + "</span></span>" + s.slice(p1);
      changed = true;
    }
    for (const cmd of ["\\cancel", "\\text", "\\mathbf", "\\mathrm", "\\vec", "\\hat", "\\overparen"]) {
      const idx = s.indexOf(cmd);
      if (idx !== -1 && !/[A-Za-z]/.test(s[idx + cmd.length] || "")) {
        const [inner, p1] = takeGroup(s, idx + cmd.length);
        let rep = texToHtml(inner);
        if (cmd === "\\cancel") rep = "<del>" + rep + "</del>";
        else if (cmd === "\\vec") rep = rep + "⃗";
        else if (cmd === "\\hat") rep = rep + "̂";
        s = s.slice(0, idx) + rep + s.slice(p1);
        changed = true;
      }
    }
    if (!changed) break;
  }
  s = s.replace(/\\([A-Za-z]+|[,;!%])/g, (_, name) => {
    if (name === "%") return "%";
    return Object.prototype.hasOwnProperty.call(GREEK_MAP, name) ? GREEK_MAP[name] : name;
  });
  for (let pass = 0; pass < 6; pass++) {
    s = s.replace(/\^\{([^{}]*)\}/g, "<sup>$1</sup>")
         .replace(/_\{([^{}]*)\}/g, "<sub>$1</sub>")
         .replace(/\^([^\s{}<>])/g, "<sup>$1</sup>")
         .replace(/_([^\s{}<>])/g, "<sub>$1</sub>");
  }
  s = s.replace(/[{}]/g, "").replace(/⦃/g, "{").replace(/⦄/g, "}");
  return '<span class="math-fb">' + s + "</span>";
}

function renderRich(str) {
  if (!str) return "";
  return String(str).replace(/\$([^$]+)\$/g, (_, math) => {
    if (window.katex && typeof window.katex.renderToString === "function") {
      try {
        return window.katex.renderToString(math, { throwOnError: false, strict: false });
      } catch (e) {}
    }
    return texToHtml(math);
  });
}

function calcStats() {
  let correct = 0, wrong = 0, skipped = 0;
  const bySub = {
    Physics: { right: 0, wrong: 0, left: 0, score: 0 },
    Chemistry: { right: 0, wrong: 0, left: 0, score: 0 },
    Botany: { right: 0, wrong: 0, left: 0, score: 0 },
    Zoology: { right: 0, wrong: 0, left: 0, score: 0 }
  };
  for (const q of QUESTIONS) {
    const pick = state.answers[q.id];
    const bucket = bySub[q.sub];
    if (pick === undefined || pick === null) {
      skipped++;
      bucket.left++;
    } else if (pick === q.ans) {
      correct++;
      bucket.right++;
      bucket.score += 4;
    } else {
      wrong++;
      bucket.wrong++;
      bucket.score -= 1;
    }
  }
  const score = correct * 4 - wrong;
  const attempted = correct + wrong;
  const acc = attempted > 0 ? ((correct / attempted) * 100).toFixed(1) : "0.0";
  return { correct, wrong, skipped, attempted, score, acc, bySub };
}

function buildExplanationHtml(q) {
  const stepsHtml = (q.s || []).map(st => "<li>" + renderRich(st) + "</li>").join("");
  const wrongHtml = (q.w || []).map(w => "<div style='margin-bottom:4px;color:var(--muted)'>• " + renderRich(w) + "</div>").join("");
  let simHtml = "";
  if (q.sim === "water" || q.id === 4) {
    simHtml = `
      <div class="sim-panel">
        <div class="exp-label">Interactive Check — Anomalous Expansion of Water</div>
        <label style="font-size:15px;">Water Temperature: <b id="simTVal">4.0 °C</b></label>
        <input type="range" min="0" max="10" step="0.5" value="4" oninput="updateWaterSim(this.value)">
        <div id="simTOut" style="font-size:15px;color:var(--green-soft);">At 4.0 °C: Density is MAXIMUM (1000.00 kg/m³) & Volume is MINIMUM!</div>
      </div>`;
  } else if (q.sim === "proj" || q.id === 5) {
    simHtml = `
      <div class="sim-panel">
        <div class="exp-label">Interactive Check — Projectile Horizontal Distance (x)</div>
        <label style="font-size:15px;">Position <i>x</i>: <b id="simXVal">0.0 m</b></label>
        <input type="range" min="0" max="3" step="0.25" value="0" oninput="updateProjSim(this.value)">
        <div id="simXOut" style="font-size:15px;color:var(--green-soft);">Height y = 0.00 m | Initial angle θ = 60° (tan θ = √3)</div>
      </div>`;
  }
  return `
    <div class="exp-sec"><div class="exp-label">Concept</div><div>${renderRich(q.c)}</div></div>
    <div class="exp-sec"><div class="exp-label">Method</div><div>${renderRich(q.m)}</div></div>
    <div class="exp-sec"><div class="exp-label">Step-by-Step Solution</div><ol class="steps-ol">${stepsHtml}</ol></div>
    <div class="exp-sec"><div class="exp-label">Why Correct & Why Others Fail</div>
      <div style="color:var(--green-soft);margin-bottom:6px;">✓ ${renderRich(q.r)}</div>
      ${wrongHtml}
    </div>
    ${simHtml}
    <div class="tip-pill">💡 <b>Exam Tip:</b> ${renderRich(q.t)}</div>`;
}

function updateWaterSim(val) {
  const t = parseFloat(val);
  const rho = (1000 - 0.008 * Math.pow(t - 4, 2)).toFixed(3);
  document.getElementById("simTVal").textContent = t.toFixed(1) + " °C";
  document.getElementById("simTOut").textContent =
    t === 4 ? "At 4.0 °C: Density is MAXIMUM (1000.000 kg/m³) → Volume is MINIMUM (overflow occurs on heating OR cooling!)"
            : "At " + t.toFixed(1) + " °C: Density = " + rho + " kg/m³ (< 1000 kg/m³) → Water expands & overflows!";
}

function updateProjSim(val) {
  const x = parseFloat(val);
  const y = Math.max(0, Math.sqrt(3) * x - 5 * x * x / 10);
  document.getElementById("simXVal").textContent = x.toFixed(2) + " m";
  document.getElementById("simXOut").textContent =
    "At x = " + x.toFixed(2) + " m: Height y = " + y.toFixed(2) + " m (Launch slope dy/dx at x=0 is √3 → θ = 60°)";
}

function renderPalette() {
  const grid = document.getElementById("paletteGrid");
  let html = "";
  for (let i = 0; i < QUESTIONS.length; i++) {
    const q = QUESTIONS[i];
    const pick = state.answers[q.id];
    let cls = "q-num-btn";
    if (i === state.idx && !state.submitted) cls += " current";
    if (pick !== undefined && pick !== null) cls += (pick === q.ans ? " right" : " wrong");
    html += `<button type="button" class="${cls}" onclick="jumpTo(${i})">${q.id}</button>`;
  }
  grid.innerHTML = html;
}

function renderHeader() {

function selectOption(choiceIdx) {
  const q = QUESTIONS[state.idx];
  if (state.answers[q.id] !== undefined && state.answers[q.id] !== null) return;
  state.answers[q.id] = choiceIdx;
  saveState();
  renderQuestion();
}

function scrollTopSafe() {
  try { window.scrollTo(0, 0); } catch (e) {}
}

function goPrev() {
  if (state.idx > 0) {
    state.idx--;
    saveState();
    renderQuestion();
    scrollTopSafe();
  }
}

function goNext() {
  if (state.idx < QUESTIONS.length - 1) {
    state.idx++;
    saveState();
    renderQuestion();
    scrollTopSafe();
  } else {
    openSubmitModal();
  }
}

function doSkip() {
  if (state.idx < QUESTIONS.length - 1) {
    state.idx++;
    saveState();
    renderQuestion();
    scrollTopSafe();
  } else {
    openSubmitModal();
  }
}

function jumpTo(index) {
  state.submitted = false;
  state.idx = index;
  saveState();
  renderQuestion();
  scrollTopSafe();
}

function jumpSection(startIdx) {
  state.submitted = false;
  state.idx = startIdx;
  saveState();
  renderQuestion();
  scrollTopSafe();
}
