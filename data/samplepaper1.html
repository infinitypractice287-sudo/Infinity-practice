 $k = 6 \\times 10^5\\text{ N/m}$, $A = 4\\text{ cm} = 0.04\\text{ m}$, aur Total Energy $E = 600\\text{ J}$.", "Extreme point par $K = 0$, isliye <b>Maximum Potential Energy</b>:<br>$U_{\\max} = E = 600\\text{ J}$ (Option A sahi hai).", "<b>Maximum Kinetic Energy</b> calculate karte hain:<br>$K_{\\max} = \\frac{1}{2} k A^2 = \\frac{1}{\\cancel{2}_{1}} \\times \\cancel{6}^{3} \\times 10^5 \\times (4 \\times 10^{-2})^2 = 3 \\times 10^5 \\times 16 \\times 10^{-4} = 48 \\times 10 = 480\\text{ J}$ (Option B bhi sahi hai!).", "Mean position par <b>Minimum Potential Energy</b>:<br>$U_{\\min} = E - K_{\\max} = 600 - 480 = 120\\text{ J}$ (Option C bhi sahi hai) $\\Rightarrow$ $\\color{#3fb950}{\\text{All of these}}$."], "r": "Option <b>(D)</b> (All of these) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Maximum potential energy is 600 J — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> Maximum kinetic energy is 480 J — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Minimum potential energy is 120 J — upar ki derivation / NCERT rule se match nahi karta."], "t": "Jab sawal me $E$ aur $\\frac{1}{2}kA^2$ alag hon, to samajh jao non-zero baseline potential energy $U_0 = U_{\\min} = E - \\frac{1}{2}kA^2$ di gayi hai!", "sim": ""}, {"id": 19, "sub": "Physics", "q": "Calculate the equivalent capacitance between terminals $L$ and $N$ in the given capacitor network:", "fig": "<svg viewBox=\"0 0 520 215\" width=\"100%\" style=\"max-width:520px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Capacitor network between L and N\"><rect width=\"520\" height=\"215\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><circle cx=\"72\" cy=\"108\" r=\"4.5\" fill=\"#60a5fa\"/><text x=\"52\" y=\"113\" fill=\"#60a5fa\" font-size=\"15\" font-weight=\"700\">L</text><circle cx=\"448\" cy=\"108\" r=\"4.5\" fill=\"#3fb950\"/><text x=\"460\" y=\"113\" fill=\"#3fb950\" font-size=\"15\" font-weight=\"700\">N</text><line x1=\"76\" y1=\"108\" x2=\"120\" y2=\"108\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"400\" y1=\"108\" x2=\"444\" y2=\"108\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"120\" y1=\"36\" x2=\"120\" y2=\"180\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"400\" y1=\"36\" x2=\"400\" y2=\"180\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"120\" y1=\"36\" x2=\"196\" y2=\"36\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"196\" y1=\"24\" x2=\"196\" y2=\"48\" stroke=\"#f59e0b\" stroke-width=\"2.6\"/><line x1=\"204\" y1=\"24\" x2=\"204\" y2=\"48\" stroke=\"#f59e0b\" stroke-width=\"2.6\"/><text x=\"200\" y=\"18\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">2C</text><line x1=\"204\" y1=\"36\" x2=\"316\" y2=\"36\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"316\" y1=\"24\" x2=\"316\" y2=\"48\" stroke=\"#f59e0b\" stroke-width=\"2.6\"/><line x1=\"324\" y1=\"24\" x2=\"324\" y2=\"48\" stroke=\"#f59e0b\" stroke-width=\"2.6\"/><text x=\"320\" y=\"18\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">2C</text><line x1=\"324\" y1=\"36\" x2=\"400\" y2=\"36\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"120\" y1=\"80\" x2=\"196\" y2=\"80\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"196\" y1=\"69\" x2=\"196\" y2=\"91\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><line x1=\"204\" y1=\"69\" x2=\"204\" y2=\"91\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><text x=\"200\" y=\"64\" fill=\"#60a5fa\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">C</text><line x1=\"204\" y1=\"80\" x2=\"316\" y2=\"80\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"316\" y1=\"69\" x2=\"316\" y2=\"91\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><line x1=\"324\" y1=\"69\" x2=\"324\" y2=\"91\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><text x=\"320\" y=\"64\" fill=\"#60a5fa\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">C</text><line x1=\"324\" y1=\"80\" x2=\"400\" y2=\"80\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"260\" y1=\"80\" x2=\"260\" y2=\"104\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"249\" y1=\"104\" x2=\"271\" y2=\"104\" stroke=\"#3fb950\" stroke-width=\"2.5\"/><line x1=\"249\" y1=\"112\" x2=\"271\" y2=\"112\" stroke=\"#3fb950\" stroke-width=\"2.5\"/><text x=\"282\" y=\"112\" fill=\"#3fb950\" font-size=\"12\" font-weight=\"700\">C</text><line x1=\"260\" y1=\"112\" x2=\"260\" y2=\"136\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"120\" y1=\"136\" x2=\"196\" y2=\"136\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"196\" y1=\"125\" x2=\"196\" y2=\"147\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><line x1=\"204\" y1=\"125\" x2=\"204\" y2=\"147\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><text x=\"200\" y=\"160\" fill=\"#60a5fa\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">C</text><line x1=\"204\" y1=\"136\" x2=\"316\" y2=\"136\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"316\" y1=\"125\" x2=\"316\" y2=\"147\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><line x1=\"324\" y1=\"125\" x2=\"324\" y2=\"147\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/><text x=\"320\" y=\"160\" fill=\"#60a5fa\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">C</text><line x1=\"324\" y1=\"136\" x2=\"400\" y2=\"136\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"120\" y1=\"180\" x2=\"196\" y2=\"180\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"196\" y1=\"168\" x2=\"196\" y2=\"192\" stroke=\"#f59e0b\" stroke-width=\"2.6\"/><line x1=\"204\" y1=\"168\" x2=\"204\" y2=\"192\" stroke=\"#f59e0b\" stroke-width=\"2.6\"/><text x=\"200\" y=\"206\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">2C</text><line x1=\"204\" y1=\"180\" x2=\"316\" y2=\"180\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"316\" y1=\"168\" x2=\"316\" y2=\"192\" stroke=\"#f59e0b\" stroke-width=\"2.6\"/><line x1=\"324\" y1=\"168\" x2=\"324\" y2=\"192\" stroke=\"#f59e0b\" stroke-width=\"2.6\"/><text x=\"320\" y=\"206\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">2C</text><line x1=\"324\" y1=\"180\" x2=\"400\" y2=\"180\" stroke=\"#dcdfe4\" stroke-width=\"2\"/></svg>", "opt": ["$2C$", "$3C$", "$\\frac{3C}{2}$", "$6C$"], "ans": 1, "c": "Circuit me points $L$ aur $N$ ke beech <b>teen independent parallel branches</b> judi hain: upar wali branch ($2C$ aur $2C$ series me), beech ka <b>balanced Wheatstone bridge</b> (chaar arms $C$ aur beech me $C$), aur neeche wali branch ($2C$ aur $2C$ series me).", "m": "Teeno parallel branches ki equivalent capacitance alag-alag nikal kar $C_{\\text{eq}} = C_{\\text{top}} + C_{\\text{mid}} + C_{\\text{bot}}$ jod denge.", "s": ["Upper series branch: $C_{\\text{top}} = \\frac{2C \\times 2C}{2C + 2C} = \\frac{4C^2}{4C} = C$.", "Middle branch ek symmetric balanced Wheatstone bridge hai ($\\frac{C}{C} = \\frac{C}{C}$), isliye central capacitor $C$ me koi charge nahi jayega! Iski dono upper ($C, C$ series $= \\frac{C}{2}$) aur lower ($C, C$ series $= \\frac{C}{2}$) arms parallel me milkar:<br>$C_{\\text{mid}} = \\frac{C}{2} + \\frac{C}{2} = C$.", "Lower series branch: $C_{\\text{bot}} = \\frac{2C \\times 2C}{2C + 2C} = C$.", "Teeno parallel branches ko jodne par:<br>$C_{LN} = C + C + C = \\color{#3fb950}{3C}$."], "r": "Option <b>(B)</b> ($3C$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> $2C$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $\\frac{3C}{2}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $6C$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Balanced Wheatstone bridge me agar paanchon capacitors barabar ($C$) hon, to poore bridge ki net capacitance hamesha sirf $C$ hoti hai!", "sim": ""}, {"id": 20, "sub": "Physics", "q": "Gravitational potential difference between surface of a planet and a point situated at a height of 20 m above its surface is 2 joule/kg. If gravitational field is uniform, then the work done in taking a 5 kg body to height 4 meter above surface will be:", "fig": "", "opt": ["2 J", "20 J", "40 J", "10 J"], "ans": 0, "c": "Uniform gravitational field $g$ me potential difference $\\Delta V = g \\cdot h$ hota hai (bilkul $h$ ke directly proportional!), aur mass $m$ ko uthane me kiya gaya work $W = m \\cdot \\Delta V'$ hota hai.", "m": "Pehle $20\\text{ m}$ height ke $\\Delta V_1 = 2\\text{ J/kg}$ se $4\\text{ m}$ height ka $\\Delta V_2$ nikalenge, fir $m = 5\\text{ kg}$ se guna karenge.", "s": ["$20\\text{ m}$ par gravitational potential difference $= 2\\text{ J/kg} \\Rightarrow g = \\frac{2}{20} = 0.1\\text{ N/kg}$.", "$4\\text{ m}$ height tak le jaane me potential difference:<br>$\\Delta V_2 = g \\times h_2 = 0.1 \\times 4 = 0.4\\text{ J/kg}$.", "$m = 5\\text{ kg}$ body ke liye Work Done:<br>$W = m \\times \\Delta V_2 = 5 \\times 0.4 = \\color{#3fb950}{2\\text{ J}}$."], "r": "Option <b>(A)</b> (2 J) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 20 J — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 40 J — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 10 J — upar ki derivation / NCERT rule se match nahi karta."], "t": "Dharti wala $g = 9.8\\text{ m/s}^2$ kabhi mat laga dena — kisi unknown planet ke sawal me hamesha diya gaya data use karo!", "sim": ""}, {"id": 21, "sub": "Physics", "q": "Two circular coils mounted parallel to each other on the same axis carry steady currents. If an observer between the coils reports that one coil is carrying a clockwise current i, while the other is carrying a counter clockwise current i, between the two coils, then there is:", "fig": "", "opt": ["Steady repulsive force", "Zero force", "A repulsive force", "A steady attractive force"], "ans": 3, "c": "Dhyan se padho: observer <b>dono coils ke beech khada hokar</b> pehle ek coil ki taraf dekhta hai (clockwise) aur fir <b>$180^\\circ$ palat kar</b> doosri coil ki taraf dekhta hai (counter-clockwise)! Iska matlab ek hi single direction se dekhne par <b>dono coils me current bilkul ek hi direction (parallel sense) me beh raha hai</b>!", "m": "Same direction me steady current wali do parallel coaxial coils ke beech adjacent wire segments me parallel currents behne ke karan hamesha <b>steady attractive force</b> lagta hai.", "s": ["Maan lo observer pehle $-x$ ki taraf muh karke Coil $1$ me clockwise current dekhta hai $\\Rightarrow$ $+x$ se dekhne par wo counter-clockwise hai.", "Fir observer $+x$ ki taraf muh karke Coil $2$ me counter-clockwise current dekhta hai $\\Rightarrow$ dono coils me current <b>same sense</b> me ghoom raha hai!", "Dono coils opposite magnetic poles aamne-saamne banati hain (ek ka N-face doosri ke S-face ki taraf), isliye unke beech <b>A steady attractive force</b> lagta hai."], "r": "Option <b>(D)</b> (A steady attractive force) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Steady repulsive force — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> Zero force — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> A repulsive force — upar ki derivation / NCERT rule se match nahi karta."], "t": "Observer 'between the coils' classic IIT/NEET wording trap hai — hamesha dono coils ko ek hi axis side se dekhkar current direction compare karo!", "sim": ""}, {"id": 22, "sub": "Physics", "q": "A travelling wave pulse is represented by $y = \\frac{4}{3x^2 + 48t^2 + 24xt + 2}$, where $x$ and $y$ are in metres and $t$ is in seconds. The velocity of the wave is:", "fig": "", "opt": ["4 m/s", "2 m/s", "8 m/s", "12 m/s"], "ans": 0, "c": "Kisi bhi progressive wave pulse ki standard equation $y = f(x \\pm vt)$ ke roop ki hoti hai, jahan $(x \\pm vt)$ phase argument me $x$ aur $t$ ke coefficients ka ratio wave speed $v = \\left|\\frac{\\text{coeff of } t}{\\text{coeff of } x}\\right|$ deta hai.", "m": "Denominator ke quadratic hisse $3x^2 + 48t^2 + 24xt$ me se $3$ common lekar perfect square banayenge.", "s": ["Denominator se $3$ common lete hain:<br>$3x^2 + 24xt + 48t^2 = 3(x^2 + 8xt + 16t^2)$.", "Ye $(a + b)^2$ ka exact square hai:<br>$3(x + 4t)^2 \\Rightarrow y = \\frac{4}{3(x + 4t)^2 + 2}$.", "$y = f(x + vt)$ se compare karne par wave velocity:<br>$v = \\color{#3fb950}{4\\text{ m/s}}$."], "r": "Option <b>(A)</b> (4 m/s) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 2 m/s — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 8 m/s — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 12 m/s — upar ki derivation / NCERT rule se match nahi karta."], "t": "Shortcut: $ax^2 + bt^2$ dikhte hi wave speed check karo $v = \\sqrt{\\frac{b}{a}} = \\sqrt{\\frac{48}{3}} = \\sqrt{16} = 4\\text{ m/s}$!", "sim": ""}, {"id": 23, "sub": "Physics", "q": "Two identical bar magnets of equal magnetic dipole moment $M$ each are placed at an angle of $60^\\circ$ as shown in the figure. The magnitude of the resultant magnetic moment is:", "fig": "<svg viewBox=\"0 0 460 175\" width=\"100%\" style=\"max-width:460px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Two magnets at 60 degrees\"><rect width=\"460\" height=\"175\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><rect x=\"175\" y=\"128\" width=\"145\" height=\"12\" rx=\"2\" fill=\"#232936\" stroke=\"#60a5fa\" stroke-width=\"2\"/><g transform=\"translate(175,128) rotate(-60)\"><rect x=\"0\" y=\"-12\" width=\"140\" height=\"12\" rx=\"2\" fill=\"#232936\" stroke=\"#3fb950\" stroke-width=\"2\"/></g><path d=\"M 212 128 A 37 37 0 0 0 194 96\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\"/><text x=\"220\" y=\"114\" fill=\"#f59e0b\" font-size=\"14\" font-weight=\"700\">60°</text><text x=\"155\" y=\"124\" fill=\"#3fb950\" font-size=\"14\" font-weight=\"700\">N</text><text x=\"242\" y=\"22\" fill=\"#3fb950\" font-size=\"14\" font-weight=\"700\">S</text><text x=\"173\" y=\"158\" fill=\"#60a5fa\" font-size=\"14\" font-weight=\"700\">S</text><text x=\"318\" y=\"158\" fill=\"#60a5fa\" font-size=\"14\" font-weight=\"700\">N</text></svg>", "opt": ["$M$", "$\\sqrt{3}\\,M$", "$\\sqrt{2}\\,M$", "$\\frac{M}{2}$"], "ans": 0, "c": "Har bar magnet ka <b>Magnetic Moment vector $\\vec{M}$</b> hamesha <b>South pole se North pole ($S \\to N$)</b> ki disha me hota hai! Angle nikalte waqt dono vectors ki <b>tail-to-tail</b> ya <b>head-to-head</b> direction zaroor milao.", "m": "Pehle dono $\\vec{M}_1, \\vec{M}_2$ vectors ke beech ka true vector angle $\\theta$ nikalenge, fir $M_{\\text{net}} = \\sqrt{M^2 + M^2 + 2M^2\\cos\\theta}$ lagayenge.", "s": ["Horizontal magnet me $\\vec{M}_1$ ($S \\to N$) seedha right ($0^\\circ$) ki taraf hai.", "Inclined magnet me $S$ upar-right aur $N$ vertex par hai, yaani $\\vec{M}_2$ ($S \\to N$) vertex ki taraf नीचे-left ($60^\\circ$ ke opposite, $180^\\circ + 60^\\circ$ yaani $\\vec{M}_1$ se <b>$120^\\circ$ angle</b> par) hai!", "Do barabar vectors $M$ aur $M$ jab $120^\\circ$ par hote hain ($\\cos 120^\\circ = -\\frac{1}{2}$):<br>$M_{\\text{net}} = \\sqrt{M^2 + M^2 + 2M^2\\left(-\\frac{1}{2}\\right)} = \\sqrt{2M^2 - M^2} = \\color{#3fb950}{M}$."], "r": "Option <b>(A)</b> ($M$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> $\\sqrt{3}\\,M$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $\\sqrt{2}\\,M$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $\\frac{M}{2}$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Sabse zyada students bina pole dekhe seedha $\\theta = 60^\\circ$ rakhkar $\\sqrt{3}M$ laga aate hain — hamesha pehle $S \\to N$ arrow banao!", "sim": ""}, {"id": 24, "sub": "Physics", "q": "The surface tension of two liquids are 30 and 60 dyne cm⁻¹ respectively. Liquid drops form at the ends of two tubes of the same radius. The ratio of the weight of the two drops is:", "fig": "", "opt": ["1 : 2", "1 : 3", "2 : 3", "3 : 4"], "ans": 0, "c": "Tube ke सिरे se latakti hui boond tab tut-ti hai jab uska neeche ki taraf <b>weight ($W$)</b> circumference par lagne wale upar ki taraf <b>surface tension force ($2\\pi r T$)</b> ke barabar ho jaye (<b>Tate's Law</b>).", "m": "Same tube radius $r$ ke liye $W = 2\\pi r T \\Rightarrow \\frac{W_1}{W_2} = \\frac{T_1}{T_2}$ lagayenge.", "s": ["Drop tutne ki shart: $W = 2\\pi r T$.", "Dono tubes ki radius $r$ barabar hai, isliye ratio lene par $2\\pi r$ cancel ho gaya:<br>$\\frac{W_1}{W_2} = \\frac{T_1}{T_2} = \\frac{\\cancel{30}^{1}}{\\cancel{60}_{2}} = \\color{#3fb950}{1 : 2}$."], "r": "Option <b>(A)</b> (1 : 2) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 1 : 3 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 2 : 3 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 3 : 4 — upar ki derivation / NCERT rule se match nahi karta."], "t": "Drop counter stalagmometer method isi principle $\\frac{W_1}{W_2} = \\frac{T_1}{T_2}$ par kaam karta hai!", "sim": ""}, {"id": 25, "sub": "Physics", "q": "A conducting ring of radius r is placed perpendicularly inside a time varying magnetic field given by B = B₀ + αt. B₀ and α are positive constants. E.m.f. induced in the ring is:", "fig": "", "opt": ["-παr", "-παr²", "-πα²r²", "-πα²r"], "ans": 1, "c": "<b>Faraday's Law of Electromagnetic Induction</b> ke anusaar time-varying magnetic flux $\\Phi_B = B \\cdot A$ se ring me induced e.m.f. $\\varepsilon = -\\frac{d\\Phi_B}{dt}$ paida hota hai.", "m": "Ring ka area $A = \\pi r^2$ constant rakhkar $\\Phi_B = (B_0 + \\alpha t)\\pi r^2$ ko $t$ ke respect me differentiate karenge.", "s": ["Perpendicular magnetic field me flux: $\\Phi_B = B \\cdot A = (B_0 + \\alpha t)\\pi r^2$.", "Faraday's law lagate hain ($B_0$ constant ka derivative $0$, aur $\\alpha t$ ka derivative $\\alpha$):<br>$\\varepsilon = -\\frac{d}{dt}[(B_0 + \\alpha t)\\pi r^2] = -\\pi r^2(0 + \\alpha) = \\color{#3fb950}{-\\pi \\alpha r^2}$."], "r": "Option <b>(B)</b> (-παr²) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> -παr — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> -πα²r² — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> -πα²r — upar ki derivation / NCERT rule se match nahi karta."], "t": "Dimensions se bhi turant check kar sakte ho: area $\\pi r^2$ aur rate $\\alpha = \\frac{dB}{dt}$ dono sirf $-\\pi\\alpha r^2$ me sahi power me hain!", "sim": ""}, {"id": 26, "sub": "Physics", "q": "A 10 g ice cube is dropped into 45 g of water kept in a glass. If the water was initially at a temperature of 28°C and the temperature of ice -15°C, find the final temperature (in °C) of water. (Specific heat of ice = 0.5 cal/g/°C and L = 80 cal/g)", "fig": "", "opt": ["14", "7", "28", "None"], "ans": 1, "c": "<b>Principle of Calorimetry</b> ke anusaar garm paani jitni heat chhodega, barf pehle $-15^\\circ\\text{C}$ se $0^\\circ\\text{C}$ tak garm hogi, fir $0^\\circ\\text{C}$ par pighlegi, aur fir pighla hua paani final temperature $T_f$ tak garm hoga.", "m": "Pehle check karenge ki kya saari barf pighal sakti hai, fir $Q_{\\text{lost}} = Q_{\\text{gained}}$ solve karenge.", "s": ["$10\\text{ g}$ barf ko $-15^\\circ\\text{C}$ se $0^\\circ\\text{C}$ laane ki heat: $Q_1 = 10 \\times 0.5 \\times 15 = 75\\text{ cal}$.", "$10\\text{ g}$ barf ko $0^\\circ\\text{C}$ par pighlane ki heat: $Q_2 = 10 \\times 80 = 800\\text{ cal}$ (Kul $= 75 + 800 = 875\\text{ cal}$).", "$45\\text{ g}$ paani $28^\\circ\\text{C}$ se $0^\\circ\\text{C}$ tak aane me अधिकतम $45 \\times 1 \\times 28 = 1260\\text{ cal}$ de sakta hai ($1260 > 875$, yaani saari barf pighal jayegi!).", "Heat balance equation:<br>$45(28 - T_f) = 875 + 10(T_f - 0) \\Rightarrow 1260 - 45T_f = 875 + 10T_f$.", "$55T_f = 1260 - 875 = 385 \\Rightarrow T_f = \\frac{\\cancel{385}^{7}}{\\cancel{55}_{1}} = \\color{#3fb950}{7^\\circ\\text{C}}$."], "r": "Option <b>(B)</b> (7) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 14 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 28 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> None — upar ki derivation / NCERT rule se match nahi karta."], "t": "Ice-water calorimetry me hamesha pehle $Q_{\\text{melt}}$ vs $Q_{\\text{water}\\to 0^\\circ}$ compare karo taaki galti se negative answer na aaye!", "sim": ""}, {"id": 27, "sub": "Physics", "q": "An electric lamp marked 100 volt d.c. consumes a current of 10 A. If it is connected to a 200 volt, 50 Hz AC mains, calculate the inductance of choke (inductor coil) required.", "fig": "", "opt": ["5.5 × 10⁻² H", "5.5 × 10⁻⁴ H", "11.0 H", "11.0 × 10⁻² H"], "ans": 0, "c": "DC bulb ko high-voltage AC mains par bina power loss chalane ke liye series me <b>choke coil (pure inductor $L$)</b> lagate hain. Series $RL$ AC circuit me impedance $Z = \\sqrt{R^2 + X_L^2}$ hota hai jahan $X_L = 2\\pi f L$.", "m": "DC rating se lamp ka resistance $R = \\frac{V_{\\text{dc}}}{I}$ nikalenge, AC voltage se required $Z = \\frac{V_{\\text{rms}}}{I}$ nikalenge, fir $X_L = \\sqrt{Z^2 - R^2}$ se $L$ solve karenge.", "s": ["Lamp resistance: $R = \\frac{100\\text{ V}}{10\\text{ A}} = 10\\;\\Omega$.", "$200\\text{ V}$ AC par wahi $10\\text{ A}$ current rakhne ke liye required impedance:<br>$Z = \\frac{200\\text{ V}}{10\\text{ A}} = 20\\;\\Omega$.", "Inductive reactance:<br>$X_L = \\sqrt{Z^2 - R^2} = \\sqrt{20^2 - 10^2} = \\sqrt{400 - 100} = \\sqrt{300} \\approx 17.32\\;\\Omega$.", "Inductance $L = \\frac{X_L}{2\\pi f} = \\frac{17.32}{2 \\times 3.14 \\times 50} = \\frac{17.32}{314} \\approx 0.0551\\text{ H} = \\color{#3fb950}{5.5 \\times 10^{-2}\\text{ H}}$."], "r": "Option <b>(A)</b> (5.5 × 10⁻² H) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 5.5 × 10⁻⁴ H — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 11.0 H — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 11.0 × 10⁻² H — upar ki derivation / NCERT rule se match nahi karta."], "t": "Kabhi galti se $X_L = Z - R = 20 - 10 = 10\\;\\Omega$ mat kar dena — $R$ aur $X_L$ phasors $90^\\circ$ par hote hain!", "sim": ""}, {"id": 28, "sub": "Physics", "q": "Wires A and B are made from the same material. A has twice the diameter and three times the length of B. If the elastic limits are not reached, when each is stretched by the same tension, the ratio of energy stored in A to that in B is:", "fig": "", "opt": ["2 : 3", "3 : 4", "3 : 2", "6 : 1"], "ans": 1, "c": "Stretched wire me stored elastic potential energy $U = \\frac{1}{2} F \\Delta L = \\frac{F^2 L}{2 A Y}$ hoti hai, jahan $A = \\frac{\\pi d^2}{4}$ cross-sectional area hai.", "m": "Same material ($Y$ same) aur same tension ($F$ same) ke liye $U \\propto \\frac{L}{d^2}$ lagayenge.", "s": ["Diya hai: $L_A = 3L_B$ aur $d_A = 2d_B$.", "Formula $U = \\frac{F^2 L}{2 (\\pi d^2 / 4) Y}$ se $U \\propto \\frac{L}{d^2}$.", "Ratio lete hain:<br>$\\frac{U_A}{U_B} = \\frac{L_A}{L_B} \\times \\left(\\frac{d_B}{d_A}\\right)^2 = 3 \\times \\left(\\frac{1}{2}\\right)^2 = 3 \\times \\frac{1}{4} = \\color{#3fb950}{3 : 4}$."], "r": "Option <b>(B)</b> (3 : 4) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 2 : 3 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 3 : 2 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 6 : 1 — upar ki derivation / NCERT rule se match nahi karta."], "t": "Diameter vs Radius me farak nahi padta jab ratio le rahe hon, bas square karna mat bhoolna ($d_A = 2d_B \\Rightarrow A_A = 4A_B$)!", "sim": ""}, {"id": 29, "sub": "Physics", "q": "An object 2.5 cm high is placed at a distance of 10 cm from a concave mirror of radius of curvature 30 cm. The size of the image is:", "fig": "", "opt": ["9.2 cm", "10.5 cm", "5.6 cm", "7.5 cm"], "ans": 3, "c": "Concave mirror ke liye focal length $f = \\frac{R}{2} = -15\\text{ cm}$ hoti hai. Jab object focus ($15\\text{ cm}$) aur pole ke beech ($u = -10\\text{ cm}$) rakha ho, to mirror ke peeche badi (magnified) virtual image banti hai.", "m": "Mirror formula $\\frac{1}{v} + \\frac{1}{u} = \\frac{1}{f}$ ya direct magnification formula $m = \\frac{f}{f - u}$ lagayenge.", "s": ["Sign convention ke saath: $f = -15\\text{ cm}$, $u = -10\\text{ cm}$, $h_o = 2.5\\text{ cm}$.", "Magnification formula lagate hain:<br>$m = \\frac{f}{f - u} = \\frac{-15}{-15 - (-10)} = \\frac{-15}{-5} = +3$.", "Image height:<br>$h_i = m \\times h_o = 3 \\times 2.5\\text{ cm} = \\color{#3fb950}{7.5\\text{ cm}}$."], "r": "Option <b>(D)</b> (7.5 cm) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 9.2 cm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 10.5 cm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 5.6 cm — upar ki derivation / NCERT rule se match nahi karta."], "t": "Direct mirror/lens shortcut $m = \\frac{f}{f - u}$ yaad rakho — $v$ nikalne ka poora ek step bach jata hai!", "sim": ""}, {"id": 30, "sub": "Physics", "q": "<b>Assertion:</b> Balmer series lies in the visible region of the electromagnetic spectrum.<br><b>Reason:</b> $\\frac{1}{\\lambda} = R\\left(\\frac{1}{2^2} - \\frac{1}{n^2}\\right)$, where $n = 3, 4, 5, \\dots$", "fig": "", "opt": ["If both Assertion and Reason are true and Reason is the correct explanation of Assertion.", "If both Assertion and Reason are true but Reason is not the correct explanation of Assertion.", "If Assertion is true but Reason is false.", "If both Assertion and Reason are false."], "ans": 0, "c": "Hydrogen spectrum ki <b>Balmer series</b> me electron higher orbits ($n = 3, 4, 5, \\dots$) se $n_1 = 2$ state me koodta hai, jiski pehli char lines ($\\text{H}_\\alpha = 656\\text{ nm}$ se $\\text{H}_\\delta = 410\\text{ nm}$) seedhe $400\\text{–}700\\text{ nm}$ <b>visible region</b> me aati hain.", "m": "Rydberg formula $\\frac{1}{\\lambda} = R\\left(\\frac{1}{2^2} - \\frac{1}{n^2}\\right)$ se wavelengths $364.6\\text{ nm}$ se $656.3\\text{ nm}$ milti hain jo visible light explain karti hain.", "s": ["Assertion sahi hai: Hydrogen spectrum me sirf Balmer series visible light region me paayi jati hai.", "Reason bhi sahi hai: Balmer formula $\\frac{1}{\\lambda} = R\\left(\\frac{1}{2^2} - \\frac{1}{n^2}\\right)$ hi wo exact wavelengths deta hai jo $400\\text{–}700\\text{ nm}$ visible band me aati hain.", "Isliye <b>dono Assertion aur Reason true hain aur Reason sahi explanation hai</b> (Option A)."], "r": "Option <b>(A)</b> (If both Assertion and Reason are true and Reason is the correct explanation of Assertion.) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> If both Assertion and Reason are true but Reason is not the correct explanation of Assertion. — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> If Assertion is true but Reason is false. — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> If both Assertion and Reason are false. — upar ki derivation / NCERT rule se match nahi karta."], "t": "Series order yaad rakho: Lyman (UV), <b>Balmer (Visible)</b>, Paschen / Brackett / Pfund (Infrared)!", "sim": ""}, {"id": 31, "sub": "Physics", "q": "A body is situated in air at a height of $24\\text{ cm}$ above the free surface of water in a lake. If the refractive index of water is $\\frac{4}{3}$, where will the image of the body appear to a fish looking upward from inside the lake?", "fig": "", "opt": ["At a height of 32 cm from water surface", "At a height of 18 cm from water surface", "At a height of 6 cm from water surface", "At a height of 16 cm from water surface"], "ans": 0, "c": "Jab observer <b>denser medium (paani, $\\mu = \\frac{4}{3}$)</b> ke andar se bahar <b>rarer medium (hawa, $\\mu = 1$)</b> me rakhi vastu ko dekhta hai, to refraction ke karan vastu actual unchai se <b>aur zyada door (unchi)</b> dikhai deti hai!", "m": "Apparent height from water surface $h_{\\text{app}} = \\mu \\cdot h_{\\text{real}}$ lagayenge.", "s": ["Diya hai: water surface se unchai $h = 24\\text{ cm}$ aur refractive index $\\mu = \\frac{4}{3}$.", "Machhli ko dikhne wali apparent height:<br>$h_{\\text{app}} = \\mu \\times h = \\frac{4}{\\cancel{3}_{1}} \\times \\cancel{24}^{8} = 4 \\times 8 = \\color{#3fb950}{32\\text{ cm}}$."], "r": "Option <b>(A)</b> (At a height of 32 cm from water surface) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> At a height of 18 cm from water surface — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> At a height of 6 cm from water surface — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> At a height of 16 cm from water surface — upar ki derivation / NCERT rule se match nahi karta."], "t": "Hawa se paani me dekho to chhota dikhta hai ($\\frac{d}{\\mu}$), aur paani ke andar se bahar dekho to bada/uncha dikhta hai ($\\mu h$)!", "sim": ""}, {"id": 32, "sub": "Physics", "q": "When a uranium isotope ²³⁵₉₂U is bombarded with a neutron, it generates ⁸⁹₃₆Kr, three neutrons and:", "fig": "", "opt": ["⁹¹₄₀Zr", "¹⁰¹₃₆Kr", "¹⁰³₃₆Kr", "¹⁴⁴₅₆Ba"], "ans": 3, "c": "Har nuclear reaction me kul <b>Atomic Number ($Z$, charge)</b> aur kul <b>Mass Number ($A$, nucleons)</b> reaction se pehle aur baad me bilkul barabar rehte hain.", "m": "${}^{235}_{92}\\text{U} + {}^{1}_{0}\\text{n} \\to {}^{89}_{36}\\text{Kr} + 3\\,{}^{1}_{0}\\text{n} + {}^{A}_{Z} X$ me $Z$ aur $A$ balance karenge.", "s": ["Atomic number ($Z$) conservation:<br>$92 + 0 = 36 + 3(0) + Z \\Rightarrow Z = 92 - 36 = 56$ (Barium, $\\text{Ba}$).", "Mass number ($A$) conservation:<br>$235 + 1 = 89 + 3(1) + A \\Rightarrow 236 = 92 + A \\Rightarrow A = 236 - 92 = 144$.", "Isliye product nucleus $\\color{#3fb950}{^{144}_{56}\\text{Ba}}$ hai."], "r": "Option <b>(D)</b> (¹⁴⁴₅₆Ba) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> ⁹¹₄₀Zr — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> ¹⁰¹₃₆Kr — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> ¹⁰³₃₆Kr — upar ki derivation / NCERT rule se match nahi karta."], "t": "Neutron bombarding ($+1$ mass left side!) jodna kabhi mat bhoolna — varna $143$ aayega!", "sim": ""}, {"id": 33, "sub": "Physics", "q": "An object is put at a distance of 5 cm from the first focus of a convex lens of focal length 10 cm. If a real image is formed, its distance from the lens will be:", "fig": "", "opt": ["15 cm", "20 cm", "25 cm", "30 cm"], "ans": 3, "c": "<b>Real image</b> tabhi banti hai jab object convex lens ke focus ke <b>bahar</b> ($u > f$) rakha ho! Isliye 'first focus se $5\\text{ cm}$ door' ka matlab lens se $u = 10 + 5 = 15\\text{ cm}$ doori hai.", "m": "Lens formula $\\frac{1}{v} - \\frac{1}{u} = \\frac{1}{f}$ (ya <b>Newton's formula</b> $x_1 x_2 = f^2$) lagayenge.", "s": ["Method 1 (Newton's Lens Formula — 2 second me!): Focus se object distance $x_1 = 5\\text{ cm}$, to second focus se image distance $x_2 = \\frac{f^2}{x_1} = \\frac{10^2}{5} = \\frac{100}{5} = 20\\text{ cm}$.", "Lens ke optical centre se image distance:<br>$v = f + x_2 = 10 + 20 = \\color{#3fb950}{30\\text{ cm}}$.", "Verification ($\\frac{1}{v} - \\frac{1}{-15} = \\frac{1}{10}$): $\\frac{1}{v} = \\frac{1}{10} - \\frac{1}{15} = \\frac{3 - 2}{30} = \\frac{1}{30} \\Rightarrow v = 30\\text{ cm}$."], "r": "Option <b>(D)</b> (30 cm) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 15 cm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 20 cm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 25 cm — upar ki derivation / NCERT rule se match nahi karta."], "t": "Newton's formula $x_1 x_2 = f^2$ jab focus se doori di ho to sabse tez ब्रह्मास्त्र hai!", "sim": ""}, {"id": 34, "sub": "Physics", "q": "Assertion: The number of electrons in a p-type silicon semiconductor is less than the number of electrons in a pure silicon semiconductor at room temperature.<br>Reason: It is due to law of mass action.", "fig": "", "opt": ["If both Assertion and Reason are correct and Reason is the correct explanation of Assertion.", "If both Assertion and Reason are correct but Reason is not the correct explanation of Assertion.", "If Assertion is true but Reason is false.", "If Assertion is false but Reason is true."], "ans": 0, "c": "Thermal equilibrium me kisi bhi doped semiconductor ke liye <b>Law of Mass Action</b> $n_e \\cdot n_h = n_i^2$ hamesha lagu hota hai. $p$-type silicon me trivalent acceptor मिलाने se holes ki sankhya $n_h > n_i$ bahut badh jati hai, jisse recombination badhne ke karan free electrons $n_e = \\frac{n_i^2}{n_h} < n_i$ pure silicon se kam ho jate hain!", "m": "Assertion aur Reason dono ko Law of Mass Action $n_e n_h = n_i^2$ se verify karenge.", "s": ["Pure (intrinsic) silicon me $n_e = n_h = n_i$.", "$p$-type silicon me $n_h \\gg n_i$; Law of Mass Action $n_e n_h = n_i^2$ se $n_e = \\frac{n_i^2}{n_h} \\ll n_i$.", "Isliye Assertion bilkul sahi hai aur Reason (Law of Mass Action) uska exact sacha karan hai (Option A)."], "r": "Option <b>(A)</b> (If both Assertion and Reason are correct and Reason is the correct explanation of Assertion.) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> If both Assertion and Reason are correct but Reason is not the correct explanation of Assertion. — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> If Assertion is true but Reason is false. — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> If Assertion is false but Reason is true. — upar ki derivation / NCERT rule se match nahi karta."], "t": "$p$-type me majority carriers holes hote hain, isliye minority electrons intrinsic semiconductor se bhi <b>kam</b> ho jaate hain!", "sim": ""}, {"id": 35, "sub": "Physics", "q": "When a ray of light is incident at angle of 35° on an equilateral prism, then it passes symmetrically. Calculate the deviation of the ray. (Symmetrically means parallel to base)", "fig": "", "opt": ["30°", "15°", "10°", "45°"], "ans": 2, "c": "Equilateral prism ka prism angle $A = 60^\\circ$ hota hai. Jab kiran prism se <b>symmetrically</b> (base ke parallel) guzarti hai, to angle of emergence $e$ aur angle of incidence $i$ barabar hote hain ($i = e$).", "m": "Prism deviation formula $\\delta = i + e - A$ lagayenge.", "s": ["Equilateral prism ke liye $A = 60^\\circ$, aur symmetrical passage ke liye $e = i = 35^\\circ$.", "Deviation formula me rakhne par:<br>$\\delta = i + e - A = 35^\\circ + 35^\\circ - 60^\\circ = 70^\\circ - 60^\\circ = \\color{#3fb950}{10^\\circ}$."], "r": "Option <b>(C)</b> (10°) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 30° — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 15° — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 45° — upar ki derivation / NCERT rule se match nahi karta."], "t": "Symmetrical passage hi <b>minimum deviation</b> ki condition hoti hai: $\\delta_{\\min} = 2i - A$!", "sim": ""}, {"id": 36, "sub": "Physics", "q": "If a full wave rectifier circuit is operating in 50 Hz mains, then the fundamental frequency in the ripple will be:", "fig": "", "opt": ["50 Hz", "70.7 Hz", "100 Hz", "25 Hz"], "ans": 2, "c": "<b>Full-wave rectifier</b> AC cycle ke positive half aur negative half <b>dono</b> ko ek hi disha ke pulses me पलट deta hai, isliye ek complete AC time period me output me <b>do identical pulses</b> milte hain.", "m": "$f_{\\text{ripple}} = 2 f_{\\text{input}}$ lagayenge.", "s": ["Input AC mains frequency: $f = 50\\text{ Hz}$.", "Full-wave rectifier me ripple ki fundamental frequency:<br>$f_{\\text{ripple}} = 2 \\times 50\\text{ Hz} = \\color{#3fb950}{100\\text{ Hz}}$."], "r": "Option <b>(C)</b> (100 Hz) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 50 Hz — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 70.7 Hz — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 25 Hz — upar ki derivation / NCERT rule se match nahi karta."], "t": "Yaad rakho: Half-wave rectifier ripple $= f = 50\\text{ Hz}$; Full-wave rectifier ripple $= 2f = 100\\text{ Hz}$!", "sim": ""}, {"id": 37, "sub": "Physics", "q": "The distance between the objective and the eye piece of microscope is 16 cm and their focal lengths are respectively 0.4 cm and 2.5 cm. Calculate the magnifying power if the final image is formed at infinity.", "fig": "", "opt": ["327.5", "425", "123", "50"], "ans": 0, "c": "Compound microscope me jab final image <b>infinity (normal adjustment)</b> par banti hai, to intermediate image bilkul eyepiece ke focus par banti hai, isliye lens separation $L = v_o + f_e$ hota hai.", "m": "Pehle $v_o = L - f_e$ nikalenge, fir exact objective magnification $m_o = \\frac{v_o}{f_o} - 1$ aur eyepiece angular magnification $m_e = \\frac{D}{f_e}$ ($D = 25\\text{ cm}$) guna karenge.", "s": ["Lens separation $L = v_o + f_e \\Rightarrow 16 = v_o + 2.5 \\Rightarrow v_o = 13.5\\text{ cm}$.", "Lens formula se objective magnification:<br>$m_o = \\frac{v_o}{f_o} - 1 = \\frac{13.5}{0.4} - 1 = 33.75 - 1 = 32.75$.", "Final image infinity par hone se eyepiece magnification:<br>$m_e = \\frac{D}{f_e} = \\frac{25}{2.5} = 10$.", "Kul Magnifying Power:<br>$M = m_o \\times m_e = 32.75 \\times 10 = \\color{#3fb950}{327.5}$."], "r": "Option <b>(A)</b> (327.5) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 425 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 123 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 50 — upar ki derivation / NCERT rule se match nahi karta."], "t": "Approximate formula $\\frac{L}{f_o}\\frac{D}{f_e} = 400$ options me nahi hai — hamesha exact $L = v_o + f_e$ dhyan me rakho!", "sim": ""}, {"id": 38, "sub": "Physics", "q": "A uniform rope of total length $l$ lies on a horizontal rough table. If the coefficient of static friction between the rope and the table is $\\mu$, the maximum length $l_1$ of the overhanging part of the rope that can hang over the edge without sliding down is:", "fig": "", "opt": ["$\\frac{l}{\\mu}$", "$\\frac{l}{\\mu + 1}$", "$\\frac{\\mu l}{\\mu + 1}$", "$\\frac{\\mu l}{\\mu - 1}$"], "ans": 2, "c": "Rassi bina fisle tab tak latak sakti hai jab tak <b>latke hue bhaag ka weight</b> mej par rakhe bhaag par lagne wale <b>maximum static friction</b> se balance ho jaye.", "m": "Linear mass density $\\lambda = \\frac{M}{l}$ maankar $m_{\\text{hang}} g = \\mu m_{\\text{table}} g$ solve karenge.", "s": ["Latke hue hisse ($l_1$) ka weight $= \\left(\\frac{M}{l} l_1\\right) g$.", "Mej par rakhe hisse ($l - l_1$) ka limiting friction $= \\mu \\left(\\frac{M}{l} (l - l_1)\\right) g$.", "Critical balance par:<br>$l_1 = \\mu(l - l_1) = \\mu l - \\mu l_1 \\Rightarrow l_1(1 + \\mu) = \\mu l \\Rightarrow l_1 = \\color{#3fb950}{\\frac{\\mu l}{\\mu + 1}}$."], "r": "Option <b>(C)</b> ($\\frac{\\mu l}{\\mu + 1}$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> $\\frac{l}{\\mu}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> $\\frac{l}{\\mu + 1}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $\\frac{\\mu l}{\\mu - 1}$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Standard result seedha कंठस्थ rakho: $l_{\\max} = \\frac{\\mu}{\\mu + 1} l$!", "sim": ""}, {"id": 39, "sub": "Physics", "q": "A radio wave of frequency 90 MHz enters a ferrite rod. If εᵣ = 10³ and μᵣ = 10, then the velocity and wavelength of the wave in ferrite are:", "fig": "", "opt": ["3 × 10⁸ m s⁻¹; 3.33 × 10⁻² m", "3 × 10⁶ m s⁻¹; 3.33 × 10⁻² m", "3 × 10⁸ m s⁻¹; 3.33 × 10⁻¹ m", "3 × 10⁷ m s⁻¹; 3.33 × 10⁻³ m"], "ans": 1, "c": "Kisi medium ($\\varepsilon_r, \\mu_r$) me electromagnetic wave ki chaal $v = \\frac{c}{\\sqrt{\\mu_r \\varepsilon_r}}$ hoti hai aur wavelength $\\lambda = \\frac{v}{f}$ hoti hai (medium badalne par frequency $f$ kabhi nahi badalti!).", "m": "Pehle $v = \\frac{3 \\times 10^8}{\\sqrt{10 \\times 10^3}}$ nikalenge, fir $\\lambda = \\frac{v}{90 \\times 10^6}$ calculate karenge.", "s": ["Medium me EM wave velocity:<br>$v = \\frac{c}{\\sqrt{\\mu_r \\varepsilon_r}} = \\frac{3 \\times 10^8}{\\sqrt{10 \\times 10^3}} = \\frac{3 \\times 10^8}{\\sqrt{10^4}} = \\frac{3 \\times 10^8}{10^2} = 3 \\times 10^6\\text{ m s}^{-1}$.", "Wavelength in ferrite ($f = 90\\text{ MHz} = 90 \\times 10^6\\text{ Hz}$):<br>$\\lambda = \\frac{v}{f} = \\frac{3 \\times \\cancel{10^6}}{90 \\times \\cancel{10^6}} = \\frac{1}{30}\\text{ m} = \\color{#3fb950}{3.33 \\times 10^{-2}\\text{ m}}$."], "r": "Option <b>(B)</b> (3 × 10⁶ m s⁻¹; 3.33 × 10⁻² m) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 3 × 10⁸ m s⁻¹; 3.33 × 10⁻² m — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 3 × 10⁸ m s⁻¹; 3.33 × 10⁻¹ m — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 3 × 10⁷ m s⁻¹; 3.33 × 10⁻³ m — upar ki derivation / NCERT rule se match nahi karta."], "t": "$v = 3 \\times 10^6\\text{ m s}^{-1}$ milte hi sirf ek hi option (Option B) bachta hai!", "sim": ""}, {"id": 40, "sub": "Physics", "q": "A string fixed at both ends has consecutive standing wave modes for which the distances between adjacent nodes are 18 cm and 16 cm respectively. What is the minimum possible length of the string?", "fig": "", "opt": ["81 cm", "100 cm", "121 cm", "144 cm"], "ans": 3, "c": "Dono siron par bandhi string me $n$-th standing wave mode me $n$ loops bante hain, aur do lagataar nodes ke beech ki doori ek loop ki lambai $\\frac{\\lambda}{2} = \\frac{L}{n}$ ke barabar hoti hai.", "m": "Consecutive modes $n$ aur $(n+1)$ ke liye $L = n(18) = (n+1)(16)$ rakhkar $n$ aur $L$ nikalenge.", "s": ["$n$-th harmonic me adjacent node spacing $= \\frac{L}{n} = 18\\text{ cm} \\Rightarrow L = 18n$.", "Agle $(n+1)$-th harmonic me spacing $= \\frac{L}{n+1} = 16\\text{ cm} \\Rightarrow L = 16(n + 1)$.", "Dono ko barabar rakhne par:<br>$18n = 16n + 16 \\Rightarrow 2n = 16 \\Rightarrow n = 8$.", "Minimum length of string:<br>$L = 18 \\times 8 = \\color{#3fb950}{144\\text{ cm}}$ ($18$ aur $16$ ka LCM!)."], "r": "Option <b>(D)</b> (144 cm) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 81 cm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 100 cm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 121 cm — upar ki derivation / NCERT rule se match nahi karta."], "t": "Exam Trick: Consecutive node spacings $d_1$ aur $d_2$ diye hon to $\\frac{L}{d_2} - \\frac{L}{d_1} = 1$ ya LCM($18, 16$) $= 144\\text{ cm}$ check karo!", "sim": ""}, {"id": 41, "sub": "Physics", "q": "In a single slit diffraction experiment, first minima for λ₁ = 660 nm coincides with first maxima for wavelength λ₂, then λ₂ will be equal to:", "fig": "", "opt": ["240 nm", "345 nm", "440 nm", "330 nm"], "ans": 2, "c": "Single slit diffraction me <b>first minimum</b> ki position $a\\sin\\theta = 1\\cdot\\lambda_1$ hoti hai aur <b>first secondary maximum</b> ki position $a\\sin\\theta = \\frac{3}{2}\\lambda_2$ hoti hai.", "m": "Coincidence ke liye $1\\cdot\\lambda_1 = \\frac{3}{2}\\lambda_2$ barabar rakhenge.", "s": ["First minima condition for $\\lambda_1$: $a\\sin\\theta = \\lambda_1$.", "First secondary maxima condition for $\\lambda_2$: $a\\sin\\theta = \\frac{3}{2}\\lambda_2$.", "Dono coincide karti hain:<br>$\\frac{3}{2}\\lambda_2 = \\lambda_1 \\Rightarrow \\lambda_2 = \\frac{2}{\\cancel{3}_{1}} \\times \\cancel{660}^{220}\\text{ nm} = \\color{#3fb950}{440\\text{ nm}}$."], "r": "Option <b>(C)</b> (440 nm) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 240 nm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 345 nm — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 330 nm — upar ki derivation / NCERT rule se match nahi karta."], "t": "Diffraction me minima $n\\lambda$ par aur maxima $(2n+1)\\frac{\\lambda}{2}$ par bante hain — YDSE se ulta!", "sim": ""}, {"id": 42, "sub": "Physics", "q": "A polarizer and an analyzer are initially aligned for maximum transmitted intensity. When the analyzer is rotated by $30^\\circ$, the transmitted light intensity becomes $I$. When rotated further by another $30^\\circ$ in the same sense, the transmitted intensity becomes $I'$. The ratio $\\frac{I'}{I}$ is:", "fig": "", "opt": ["$\\frac{1}{2}$", "$\\frac{1}{3}$", "$\\frac{1}{4}$", "$\\frac{1}{\\sqrt{3}}$"], "ans": 1, "c": "<b>Malus's Law</b> ke mutabik analyzer se nikalne wali polarized light ki intensity $I(\\theta) = I_{\\max} \\cos^2\\theta$ hoti hai, jahan $\\theta$ polarizer aur analyzer ki pass-axes ke beech ka angle hai.", "m": "Initial angle $0^\\circ$ se $\\theta_1 = 30^\\circ$ aur total rotation $\\theta_2 = 60^\\circ$ par $\\frac{I'}{I} = \\frac{\\cos^2 60^\\circ}{\\cos^2 30^\\circ}$ nikalenge.", "s": ["$30^\\circ$ rotation par: $I = I_{\\max} \\cos^2 30^\\circ = I_{\\max} \\left(\\frac{\\sqrt{3}}{2}\\right)^2 = \\frac{3}{4} I_{\\max}$.", "Aur $30^\\circ$ ghumane par kul angle $= 30^\\circ + 30^\\circ = 60^\\circ$: $I' = I_{\\max} \\cos^2 60^\\circ = I_{\\max} \\left(\\frac{1}{2}\\right)^2 = \\frac{1}{4} I_{\\max}$.", "Ratio:<br>$\\frac{I'}{I} = \\frac{\\cancel{I_{\\max}} / \\cancel{4}}{3 \\cancel{I_{\\max}} / \\cancel{4}} = \\color{#3fb950}{\\frac{1}{3}}$."], "r": "Option <b>(B)</b> ($\\frac{1}{3}$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> $\\frac{1}{2}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $\\frac{1}{4}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $\\frac{1}{\\sqrt{3}}$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Dhyan dena: Doosra angle pehle se aur $30^\\circ$ ghumaya gaya hai (yaani pass axis se kul $60^\\circ$), isliye $\\cos^2 60^\\circ$ aayega!", "sim": ""}, {"id": 43, "sub": "Physics", "q": "Light of frequency 1.5 times the threshold frequency is incident on a photosensitive material. What will be the photoelectric current, if the frequency is halved and intensity is doubled?", "fig": "", "opt": ["Four times", "One-fourth", "Zero", "Doubled"], "ans": 2, "c": "<b>Einstein's Photoelectric Effect</b> ka niyam hai ki agar incident light ki frequency <b>threshold frequency ($\\nu_0$) se kam</b> ho jaye, to chahe intensity kitni bhi badha do, <b>ek bhi photoelectron bahar nahi nikalta</b>!", "m": "Nayi frequency $\\nu' = \\frac{\\nu}{2}$ calculate karke $\\nu_0$ se compare karenge.", "s": ["Initial frequency: $\\nu = 1.5\\,\\nu_0$.", "Frequency aadhi karne par nayi frequency:<br>$\\nu' = \\frac{1.5\\,\\nu_0}{2} = 0.75\\,\\nu_0$.", "Kyunki $\\nu' = 0.75\\,\\nu_0 < \\nu_0$ (threshold frequency se kam hai!), photoelectric emission bilkul ruk jayega $\\Rightarrow$ Photoelectric current $= \\color{#3fb950}{\\text{Zero}}$."], "r": "Option <b>(C)</b> (Zero) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Four times — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> One-fourth — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Doubled — upar ki derivation / NCERT rule se match nahi karta."], "t": "'Intensity is doubled' dekhkar 'Doubled' mat tick kar dena — pehle hamesha $\\nu' \\ge \\nu_0$ check karo!", "sim": ""}, {"id": 44, "sub": "Physics", "q": "A planar coil having 15 turns carries 20 A current. The coil is oriented with respect to the uniform magnetic field B = 0.5î T such that its directed area is A = -0.04î m². The potential energy of the coil in the given orientation is:", "fig": "", "opt": ["0", "+0.72 J", "6 J", "-1.44 J"], "ans": 2, "c": "Current-carrying coil ka magnetic dipole moment $\\vec{M} = N I \\vec{A}$ hota hai, aur uniform magnetic field $\\vec{B}$ me uski potential energy $U = -\\vec{M} \\cdot \\vec{B}$ hoti hai.", "m": "$\\vec{M} = N I \\vec{A}$ nikal kar dot product $U = -\\vec{M} \\cdot \\vec{B}$ lenge.", "s": ["Magnetic moment vector:<br>$\\vec{M} = N I \\vec{A} = 15 \\times 20 \\times (-0.04\\hat{i}) = -12\\hat{i}\\text{ A}\\cdot\\text{m}^2$.", "Potential energy:<br>$U = -\\vec{M} \\cdot \\vec{B} = -(-12\\hat{i}) \\cdot (0.5\\hat{i}) = +12 \\times 0.5 = \\color{#3fb950}{6\\text{ J}}$."], "r": "Option <b>(C)</b> (6 J) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 0 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> +0.72 J — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> -1.44 J — upar ki derivation / NCERT rule se match nahi karta."], "t": "$\\vec{M}$ aur $\\vec{B}$ anti-parallel ($180^\\circ$, unstable equilibrium) hain, isliye potential energy positive $+MB = +6\\text{ J}$ hogi!", "sim": ""}, {"id": 45, "sub": "Physics", "q": "Ice starts forming in lake with water at 0°C when the atmospheric temperature is -10°C. If the time taken for 1 cm of ice be 7 hours, then the time taken for the thickness of ice to change from 1 cm to 2 cm is:", "fig": "", "opt": ["7 hours", "14 hours", "28 hours", "21 hours"], "ans": 3, "c": "<b>Stefan's Ice Formation Law</b> ke mutabik jheel par barf ki motai $x_1$ se $x_2$ tak jamne me laga samay $t = \\frac{\\rho L}{2 k \\Delta T}(x_2^2 - x_1^2)$, yaani $(x_2^2 - x_1^2)$ ke directly proportional hota hai!", "m": "$\\frac{t_2}{t_1} = \\frac{2^2 - 1^2}{1^2 - 0^2}$ lagayenge.", "s": ["$0\\text{ cm}$ se $1\\text{ cm}$ jamne ka samay: $t_1 \\propto (1^2 - 0^2) = 1\\text{ unit} = 7\\text{ hours}$.", "$1\\text{ cm}$ se $2\\text{ cm}$ jamne ka samay: $t_2 \\propto (2^2 - 1^2) = 4 - 1 = 3\\text{ units}$.", "Isliye $t_2 = 3 \\times t_1 = 3 \\times 7 = \\color{#3fb950}{21\\text{ hours}}$."], "r": "Option <b>(D)</b> (21 hours) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 7 hours — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 14 hours — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 28 hours — upar ki derivation / NCERT rule se match nahi karta."], "t": "Successive equal thickness ($0\\to 1,\\; 1\\to 2,\\; 2\\to 3\\text{ cm}$) jamne ke times ka अनुपात hamesha odd numbers $1 : 3 : 5 : 7$ hota hai!", "sim": ""}, {"id": 46, "sub": "Chemistry", "q": "The relationship $\\log\\left(\\frac{K_p}{K_c}\\right) + \\log(RT) = 0$ holds true for which of the following gaseous equilibria?", "fig": "", "opt": ["PCl₅ ⇌ PCl₃ + Cl₂", "2SO₂ + O₂ ⇌ 2SO₃", "N₂ + 3H₂ ⇌ 2NH₃", "Both B and C"], "ans": 1, "c": "Gaseous equilibrium me $K_p$ aur $K_c$ ka relation $K_p = K_c (RT)^{\\Delta n_g}$ hota hai, jiska log lene par $\\log\\left(\\frac{K_p}{K_c}\\right) - \\Delta n_g \\log(RT) = 0$ milta hai.", "m": "Diye gaye equation $\\log\\left(\\frac{K_p}{K_c}\\right) + \\log(RT) = 0$ se compare karke $\\Delta n_g = -1$ wali reaction dhundhenge.", "s": ["Compare karne par $-\\Delta n_g = +1 \\Rightarrow \\Delta n_g = n_{\\text{products}(g)} - n_{\\text{reactants}(g)} = -1$.", "(A) $\\text{PCl}_5 \\rightleftharpoons \\text{PCl}_3 + \\text{Cl}_2$: $\\Delta n_g = 2 - 1 = +1$.", "(B) $2\\text{SO}_2 + \\text{O}_2 \\rightleftharpoons 2\\text{SO}_3$: $\\Delta n_g = 2 - (2 + 1) = -1$ (Bilkul match!).", "(C) $\\text{N}_2 + 3\\text{H}_2 \\rightleftharpoons 2\\text{NH}_3$: $\\Delta n_g = 2 - (1 + 3) = -2$."], "r": "Option <b>(B)</b> (2SO₂ + O₂ ⇌ 2SO₃) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> PCl₅ ⇌ PCl₃ + Cl₂ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> N₂ + 3H₂ ⇌ 2NH₃ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Both B and C — upar ki derivation / NCERT rule se match nahi karta."], "t": "Galti se Option D (Both B and C) mat laga dena — $\\text{NH}_3$ synthesis me $\\Delta n_g = -2$ hota hai, $-1$ nahi!", "sim": ""}, {"id": 47, "sub": "Chemistry", "q": "The correct formula to calculate the hydroxyl ion concentration $[\\text{OH}^-]$ of an aqueous solution of $\\text{NH}_4\\text{NO}_3$ of concentration $C$ is:", "fig": "", "opt": ["$\\sqrt{\\frac{C \\times K_w}{K_b}}$", "$\\sqrt{\\frac{K_w \\times K_b}{C}}$", "$\\sqrt{\\frac{C \\times K_w}{K_a}}$", "$\\sqrt{\\frac{K_a \\times K_w}{C}}$"], "ans": 1, "c": "$\\text{NH}_4\\text{NO}_3$ ek <b>weak base ($\\text{NH}_4\\text{OH}$, constant $K_b$)</b> aur <b>strong acid ($\\text{HNO}_3$)</b> ka salt hai, jo paani me cationic hydrolysis ($\\text{NH}_4^+ + \\text{H}_2\\text{O} \\rightleftharpoons \\text{NH}_4\\text{OH} + \\text{H}^+$) dikhata hai.", "m": "Pehle $[\\text{H}^+] = \\sqrt{\\frac{K_w \\cdot C}{K_b}}$ likhenge, fir $[\\text{OH}^-] = \\frac{K_w}{[\\text{H}^+]}$ se hydroxyl ion concentration nikalenge.", "s": ["Cationic hydrolysis constant: $K_h = \\frac{K_w}{K_b} \\Rightarrow [\\text{H}^+] = \\sqrt{K_h \\cdot C} = \\sqrt{\\frac{C \\times K_w}{K_b}}$.", "Sawal me <b>hydroxyl ion concentration $[\\text{OH}^-]$</b> pucha gaya hai ($[\\text{H}^+]$ nahi!):<br>$[\\text{OH}^-] = \\frac{K_w}{[\\text{H}^+]} = \\frac{K_w}{\\sqrt{\\frac{C \\times K_w}{K_b}}} = \\sqrt{\\frac{K_w^2 \\times K_b}{C \\times K_w}} = \\color{#3fb950}{\\sqrt{\\frac{K_w \\times K_b}{C}}}$.", "Note: Source PDF ki key me typo se (4) chhap gaya tha, jabki chemically exact uttar Option (B) $\\sqrt{\\frac{K_w \\times K_b}{C}}$ hai."], "r": "Option <b>(B)</b> ($\\sqrt{\\frac{K_w \\times K_b}{C}}$) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> $\\sqrt{\\frac{C \\times K_w}{K_b}}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> $\\sqrt{\\frac{C \\times K_w}{K_a}}$ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> $\\sqrt{\\frac{K_a \\times K_w}{C}}$ — upar ki derivation / NCERT rule se match nahi karta."], "t": "Hamesha check karo sawal me $[\\text{H}^+]$ pucha hai ya $[\\text{OH}^-]$ — acidic salt me $[\\text{OH}^-] < 10^{-7}$ hona chahiye!", "sim": ""}, {"id": 48, "sub": "Chemistry", "q": "From the given plot of Gibbs free energy change ($\\Delta G$) versus absolute temperature ($T$), what can be concluded about $\\Delta H$ and $\\Delta S$?", "fig": "<svg viewBox=\"0 0 480 185\" width=\"100%\" style=\"max-width:480px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Gibbs free energy vs Temperature graph\"><rect width=\"480\" height=\"185\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><line x1=\"95\" y1=\"18\" x2=\"95\" y2=\"148\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"95\" y1=\"148\" x2=\"425\" y2=\"148\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"89\" y1=\"30\" x2=\"101\" y2=\"30\" stroke=\"#9aa3b2\"/><text x=\"83\" y=\"34\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"end\">100</text><line x1=\"89\" y1=\"56\" x2=\"101\" y2=\"56\" stroke=\"#9aa3b2\"/><text x=\"83\" y=\"60\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"end\">50</text><line x1=\"89\" y1=\"82\" x2=\"101\" y2=\"82\" stroke=\"#9aa3b2\"/><text x=\"83\" y=\"86\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"end\">0</text><line x1=\"89\" y1=\"108\" x2=\"101\" y2=\"108\" stroke=\"#9aa3b2\"/><text x=\"83\" y=\"112\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"end\">-50</text><line x1=\"89\" y1=\"134\" x2=\"101\" y2=\"134\" stroke=\"#9aa3b2\"/><text x=\"83\" y=\"138\" fill=\"#9aa3b2\" font-size=\"12\" text-anchor=\"end\">-100</text><text x=\"40\" y=\"90\" fill=\"#dcdfe4\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">ΔG</text><line x1=\"142\" y1=\"48\" x2=\"328\" y2=\"118\" stroke=\"#3fb950\" stroke-width=\"3\"/><text x=\"150\" y=\"165\" fill=\"#9aa3b2\" font-size=\"11.5\" text-anchor=\"middle\">100</text><text x=\"205\" y=\"165\" fill=\"#9aa3b2\" font-size=\"11.5\" text-anchor=\"middle\">200</text><text x=\"260\" y=\"165\" fill=\"#9aa3b2\" font-size=\"11.5\" text-anchor=\"middle\">300</text><text x=\"315\" y=\"165\" fill=\"#9aa3b2\" font-size=\"11.5\" text-anchor=\"middle\">400</text><text x=\"370\" y=\"165\" fill=\"#9aa3b2\" font-size=\"11.5\" text-anchor=\"middle\">500</text><text x=\"260\" y=\"180\" fill=\"#dcdfe4\" font-size=\"12.5\" text-anchor=\"middle\">Temperature T (K) →</text></svg>", "opt": ["ΔH > 0, ΔS > 0", "ΔH > 0, ΔS < 0", "ΔH < 0, ΔS > 0", "ΔH > 0, ΔS = 0"], "ans": 0, "c": "<b>Gibbs-Helmholtz relation</b> $\\Delta G = \\Delta H - T\\Delta S$ ko straight line equation $y = c + mx$ ($y = \\Delta G,\\; x = T$) se compare karte hain.", "m": "$y$-intercept $= \\Delta H$ aur line ki slope $m = -\\Delta S$ ka sign graph se padhenge.", "s": ["Graph me line ko $T \\to 0$ ($y$-axis) tak peeche badhane par intercept $+50$ ke upar positive aata hai $\\Rightarrow \\Delta H > 0$.", "Temperature $T$ badhne par $\\Delta G$ neeche ghat raha hai, yaani slope negative hai: $-\\Delta S < 0 \\Rightarrow \\Delta S > 0$.", "Isliye $\\color{#3fb950}{\\Delta H > 0,\\; \\Delta S > 0}$ (Option A)."], "r": "Option <b>(A)</b> (ΔH > 0, ΔS > 0) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> ΔH > 0, ΔS < 0 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> ΔH < 0, ΔS > 0 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> ΔH > 0, ΔS = 0 — upar ki derivation / NCERT rule se match nahi karta."], "t": "$\\Delta G = \\Delta H - T\\Delta S$ me $-\\Delta S$ ke minus sign ka hamesha dhyan rakho: downward slope matlab $\\Delta S$ positive!", "sim": ""}, {"id": 49, "sub": "Chemistry", "q": "How many molecules show geometrical isomerism (at room temperature):<br>(I) (CH₃)₂C=C(Cl)(Br)<br>(II) [CH₃-CH(Cl)][CH₃-CH(Cl)-CH₂]C=CHD<br>(III) (C₂H₅)(n-C₃H₇)C=CH-CH₃<br>(IV) CH₃-CH₂-CH=CH-CH₂-CH₃<br>(V) CH₂=C(CH₃)-C(CH₃)=CH-CH₃<br>(VI) (CH₃)(C₂H₅)C=N-OH<br>(VII) (C₂H₅)(Br)C=C(C₂H₅)₂<br>(VIII) [CH₃-CH(Cl)]C(CH₃)=C(CH₃)[CH(Cl)-CH₃]<br>(IX) 1,3-Dicyclobutylcyclobutane<br>(X) Cyclopropylidene=C(Cl)(CH₃)<br>(XI) 1,2-Dimethyl-3-methylenecyclopropane<br>(XII) Bicyclopropylidene<br>(XIII) 3,4-Diethylidenecyclobut-1-ene<br>(XIV) Cyclooctene<br>(XV) 1,2-Dimethylcyclohex-1-ene", "fig": "", "opt": ["6", "8", "12", "10"], "ans": 3, "c": "Geometrical isomerism (GI) ke liye double bond / ring system ke dono ends par <b>alag-alag groups ($a \\ne b$)</b> hone chahiye aur cyclic alkene me ring kam-se-kam $8$-membered honi chahiye.", "m": "15 molecules (I se XV) ko ek-ek karke check karke count karenge.", "s": ["<b>GI dikhane wale (10 molecules):</b> <b>(II)</b> dono chiral/different ends + $(-H, -D)$; <b>(III)</b> 3-ethylhex-2-ene; <b>(IV)</b> hex-3-ene; <b>(V)</b> C3=C4 par GI; <b>(VI)</b> unsymmetrical oxime $(>\\text{C=N-OH})$; <b>(VIII)</b> pseudoasymmetric/stereogenic ends; <b>(IX)</b> 1,3-disubstituted cyclobutane; <b>(XI)</b> 1,2-dimethyl-3-methylenecyclopropane; <b>(XIII)</b> 3,4-diethylidenecyclobutene; <b>(XIV)</b> cyclooctene (trans stable at room temp).", "<b>GI NAHI dikhane wale (5 molecules):</b> (I) do identical $-\\text{CH}_3$; (VII) do identical $-\\text{C}_2\\text{H}_5$; (X) symmetric cyclopropylidene; (XII) bicyclopropylidene; (XV) 6-membered cycloalkene.", "Kul GI dikhane wale molecules $= \\color{#3fb950}{10}$ (Option D)."], "r": "Option <b>(D)</b> (10) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 6 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 8 — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 12 — upar ki derivation / NCERT rule se match nahi karta."], "t": "Cycloalkenes me minimum <b>8 carbons (cyclooctene)</b> room temperature par cis-trans isomerism dikhata hai!", "sim": ""}, {"id": 50, "sub": "Chemistry", "q": "Which of the following statements for a meso compound is/are correct:<br>(A) The meso compound has either a plane or centre of symmetry.<br>(B) The meso compound is optically inactive due to internal compensation.<br>(C) The meso compound is achiral.<br>(D) The meso compound is formed when equal amounts of two enantiomers are mixed.", "fig": "", "opt": ["Only A and B", "Only B and C", "Only A, B and C", "All are correct"], "ans": 2, "c": "<b>Meso compound</b> ek single pure compound hota hai jisme chiral centres to hote hain, par molecular symmetry (<b>POS ya COS</b>) ke karan <b>internal compensation</b> se wo optically inactive (achiral) hota hai.", "m": "Charon statements A, B, C, D ko stereochemistry rules se check karenge.", "s": ["Statements <b>A, B aur C</b> bilkul sahi hain: meso compound me POS/COS hoti hai, internal compensation hota hai aur molecule achiral hota hai.", "Statement <b>D galat hai</b>: do enantiomers ki equal amount milane par <b>racemic mixture</b> banta hai (external compensation), meso compound nahi!", "Isliye sahi uttar $\\color{#3fb950}{\\text{Only A, B and C}}$ (Option C)."], "r": "Option <b>(C)</b> (Only A, B and C) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Only A and B — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> Only B and C — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> All are correct — upar ki derivation / NCERT rule se match nahi karta."], "t": "Internal compensation $\\rightarrow$ Meso compound (pure single substance); External compensation $\\rightarrow$ Racemic mixture!", "sim": ""}, {"id": 51, "sub": "Chemistry", "q": "Consider the given two-step organic reaction sequence starting from $\\gamma$-butyrolactone. Identify the major cyclic product <b>B</b>:", "fig": "<svg viewBox=\"0 0 560 215\" width=\"100%\" style=\"max-width:560px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Lactone reaction with excess MeMgCl and conc H2SO4\"><rect width=\"560\" h =\"translate(215,148)\"><text x=\"-48\" y=\"6\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\">(B)</text><polygon points=\"0,-24 -25,-6 -15,24 15,24 25,-6\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><circle cx=\"0\" cy=\"-24\" r=\"8\" fill=\"#151922\"/><text x=\"0\" y=\"-19\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">O</text><line x1=\"-25\" y1=\"-6\" x2=\"-43\" y2=\"-18\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/><line x1=\"25\" y1=\"-6\" x2=\"43\" y2=\"-18\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/></g><g transform=\"translate(348,148)\"><text x=\"-48\" y=\"6\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\">(C)</text><polygon points=\"0,-24 -25,-6 -15,24 15,24 25,-6\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><circle cx=\"0\" cy=\"-24\" r=\"8\" fill=\"#151922\"/><text x=\"0\" y=\"-19\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">O</text><line x1=\"-25\" y1=\"-6\" x2=\"-43\" y2=\"-18\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/><line x1=\"-25\" y1=\"-6\" x2=\"-43\" y2=\"8\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/><line x1=\"25\" y1=\"-6\" x2=\"43\" y2=\"-18\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/><line x1=\"25\" y1=\"-6\" x2=\"43\" y2=\"8\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/></g><g transform=\"translate(482,148)\"><text x=\"-48\" y=\"6\" fill=\"#93c5fd\" font-size=\"13\" font-weight=\"700\">(D)</text><polygon points=\"0,-24 -25,-6 -15,24 15,24 25,-6\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><circle cx=\"0\" cy=\"-24\" r=\"8\" fill=\"#151922\"/><text x=\"0\" y=\"-19\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">O</text><line x1=\"-25\" y1=\"-6\" x2=\"-42\" y2=\"-18\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/><line x1=\"25\" y1=\"-6\" x2=\"42\" y2=\"-18\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/><line x1=\"-15\" y1=\"24\" x2=\"-28\" y2=\"38\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/><line x1=\"15\" y1=\"24\" x2=\"28\" y2=\"38\" stroke=\"#f59e0b\" stroke-width=\"2.2\"/></g></svg>", "opt": ["2,2-Dimethyltetrahydrofuran", "2,5-Dimethyltetrahydrofuran", "2,2,5,5-Tetramethyltetrahydrofuran", "2,3,4,5-Tetramethyltetrahydrofuran"], "ans": 0, "c": "Cyclic ester ($\\gamma$-butyrolactone) excess Grignard reagent ($\\text{MeMgCl}$) ke <b>2 equivalents</b> se react karke diol banata hai, jo conc. $\\text{H}_2\\text{SO}_4$ ke saath intramolecular dehydration se $5$-membered cyclic ether (THF derivative) deta hai.", "m": "Step 1 nucleophilic acyl substitution + nucleophilic addition; Step 2 acid-catalysed cyclisation.", "s": ["Lactone $+ 2\\text{MeMgCl} \\xrightarrow{\\text{H}_2\\text{O}} \\text{HO-CH}_2\\text{-CH}_2\\text{-CH}_2\\text{-C(OH)(CH}_3)_2$ (Compound A: 4-methylpentane-1,4-diol).", "Conc. $\\text{H}_2\\text{SO}_4$ tertiary $-\\text{OH}$ se carbocation banata hai aur $1^\\circ\\;-\\text{OH}$ cyclise hokar <b>2,2-Dimethyltetrahydrofuran</b> (ek hi carbon par do methyl groups — Option A) banata hai!"], "r": "Option <b>(A)</b> (2,2-Dimethyltetrahydrofuran) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (B):</b> 2,5-Dimethyltetrahydrofuran — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 2,2,5,5-Tetramethyltetrahydrofuran — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> 2,3,4,5-Tetramethyltetrahydrofuran — upar ki derivation / NCERT rule se match nahi karta."], "t": "Ester/Lactone par Grignard ke <b>2 moles</b> ek hi carbonyl carbon par judte hain, isliye gem-dimethyl ring banti hai!", "sim": ""}, {"id": 52, "sub": "Chemistry", "q": "In the Cannizzaro reaction $2\\,\\text{PhCHO} + \\text{OH}^- \\longrightarrow \\text{PhCH}_2\\text{OH} + \\text{PhCOO}^-$, the slowest rate-determining step is:", "fig": "", "opt": ["The abstraction of a proton from the carboxylic group", "The deprotonation of PhCH₂OH", "The nucleophilic attack of OH⁻ at the carbonyl group", "The transfer of hydride ion (H⁻) to the carbonyl group"], "ans": 3, "c": "<b>Cannizzaro reaction</b> alpha-hydrogen rahit aldehydes (jaise $\\text{PhCHO}$) me concentrated alkali ki upasthiti me hoti hai.", "m": "Mechanism ke dono steps likhkar Rate Determining Step (RDS) pehchanenge.", "s": ["Step 1 (Fast reversible): $\\text{PhCHO} + \\text{OH}^- \\rightleftharpoons \\text{Ph-CH(O}^-)\\text{OH}$.", "Step 2 (Slow RDS): Tetrahedral intermediate se doosre $\\text{PhCHO}$ molecule ke carbonyl carbon par <b>hydride ion ($\\text{H}^-$) ka transfer</b> sabse mushkil aur <b>slowest step</b> hota hai!"], "r": "Option <b>(D)</b> (The transfer of hydride ion (H⁻) to the carbonyl group) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> The abstraction of a proton from the carboxylic group — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> The deprotonation of PhCH₂OH — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> The nucleophilic attack of OH⁻ at the carbonyl group — upar ki derivation / NCERT rule se match nahi karta."], "t": "Cannizzaro reaction me C–H bond tutna (Hydride transfer) RDS hota hai — kinetic isotope effect se proved NCERT fact!", "sim": ""}, {"id": 53, "sub": "Chemistry", "q": "Identify the final major product <b>(Z)</b> formed in the following three-step reaction sequence starting from styrene:", "fig": "<svg viewBox=\"0 0 600 112\" width=\"100%\" style=\"max-width:560px\" aria-label=\"Reaction sequence styrene to Z\">\n  <rect x=\"4\" y=\"4\" width=\"592\" height=\"104\" rx=\"10\" fill=\"#151821\" stroke=\"#2d3444\"/>\n  <text x=\"18\" y=\"60\" fill=\"#dcdfe4\" font-size=\"15\" font-weight=\"600\">Ph–CH=CH₂</text>\n  <line x1=\"122\" y1=\"55\" x2=\"218\" y2=\"55\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"222,55 214,50 214,60\" fill=\"#58a6ff\"/>\n  <text x=\"170\" y=\"40\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"11.5\">(1) B₂H₆ / THF</text>\n  <text x=\"170\" y=\"74\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"11.5\">(2) H₂O₂ / OH⁻</text>\n  <rect x=\"228\" y=\"36\" width=\"44\" height=\"38\" rx=\"8\" fill=\"#1f2532\" stroke=\"#3b4356\"/>\n  <text x=\"250\" y=\"60\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"15\" font-weight=\"700\">(X)</text>\n  <line x1=\"278\" y1=\"55\" x2=\"366\" y2=\"55\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"370,55 362,50 362,60\" fill=\"#58a6ff\"/>\n  <text x=\"322\" y=\"42\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">PCC (CH₂Cl₂)</text>\n  <rect x=\"376\" y=\"36\" width=\"44\" height=\"38\" rx=\"8\" fill=\"#1f2532\" stroke=\"#3b4356\"/>\n  <text x=\"398\" y=\"60\" text-anchor=\"middle\" fill=\"#f0b72f\" font-size=\"15\" font-weight=\"700\">(Y)</text>\n  <line x1=\"426\" y1=\"55\" x2=\"508\" y2=\"55\" stroke=\"#58a6ff\" stroke-width=\"2\"/>\n  <polygon points=\"512,55 504,50 504,60\" fill=\"#58a6ff\"/>\n  <text x=\"468\" y=\"42\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12.5\">OH⁻ / Δ</text>\n  <rect x=\"518\" y=\"34\" width=\"60\" height=\"42\" rx=\"8\" fill=\"#1c2b22\" stroke=\"#3fb950\"/>\n  <text x=\"548\" y=\"60\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"16\" font-weight=\"700\">(Z)</text>\n</svg>", "opt": ["Ph-CH=CH-CHO", "Ph-C(CH₃)=C(CH₃)-CHO", "Ph-CH₂-CH=C(Ph)-CHO", "Ph-C(CH₃)=CH-CHO"], "ans": 2, "c": "Hydroboration-oxidation anti-Markovnikov alcohol deta hai, $\\text{PCC}$ use aldehyde tak rokh kar oxidize karta hai, aur $\\text{OH}^-/\\Delta$ <b>aldol condensation</b> karwata hai!", "m": "$X \\to Y \\to Z$ har intermediate likhkar cross/self aldol product banayenge.", "s": ["Styrene $\\text{Ph-CH=CH}_2 \\xrightarrow{\\text{B}_2\\text{H}_6/\\text{THF},\\;\\text{H}_2\\text{O}_2/\\text{OH}^-} \\text{Ph-CH}_2\\text{-CH}_2\\text{OH}$ ($X$, anti-Markovnikov $1^\\circ$ alcohol).", "$X \\xrightarrow{\\text{PCC}} \\text{Ph-CH}_2\\text{-CHO}$ ($Y$, phenylacetaldehyde).", "$2\\,\\text{Ph-CH}_2\\text{-CHO} \\xrightarrow{\\text{OH}^-/\\Delta}$ self-aldol condensation ($\\alpha$-carbon jis par $-\\text{Ph}$ laga hai, wahan se $2\\text{H}$ nikal kar):<br>$\\color{#3fb950}{\\text{Ph-CH}_2\\text{-CH=C(Ph)-CHO}}$ (Option C)."], "r": "Option <b>(C)</b> (Ph-CH₂-CH=C(Ph)-CHO) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Ph-CH=CH-CHO — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> Ph-C(CH₃)=C(CH₃)-CHO — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Ph-C(CH₃)=CH-CHO — upar ki derivation / NCERT rule se match nahi karta."], "t": "Aldol trick: Jis aldehyde ka self-condensation ho, uske $\\alpha$-carbon ($-\\text{CH}_2\\text{Ph}$) ko doosre ke $=\\text{O}$ se seedha double bond se jod do!", "sim": ""}, {"id": 54, "sub": "Chemistry", "q": "The reaction CH₄(g) + Cl₂(g) → CH₃Cl(g) + HCl(g) has ΔH = -25 kcal.<br>Given Bond Enthalpies (kcal/mol): ε(C-Cl) = 84, ε(H-Cl) = 103, ε(C-H) = x, ε(Cl-Cl) = y, and x : y = 9 : 5.<br>From the given data, what is the bond enthalpy of Cl-Cl bond?", "fig": "", "opt": ["70 kcal/mol", "80 kcal/mol", "67.75 kcal/mol", "57.86 kcal/mol"], "ans": 3, "c": "Reaction enthalpy bond enthalpies ke roop me $\\Delta H = \\sum \\text{BE}_{\\text{reactants}} - \\sum \\text{BE}_{\\text{products}}$ hoti hai.", "m": "$\\Delta H = -25$ aur $x : y = 9 : 5$ ($x = \\frac{9}{5}y$) solve karenge.", "s": ["$\\text{CH}_4 + \\text{Cl}_2 \\to \\text{CH}_3\\text{Cl} + \\text{HCl}$ me ek $\\text{C-H}$ ($x$) aur ek $\\text{Cl-Cl}$ ($y$) bond tuta, aur ek $\\text{C-Cl}$ ($84$) tatha ek $\\text{H-Cl}$ ($103$) bana.", "$-25 = (x + y) - (84 + 103) = x + y - 187 \\Rightarrow x + y = 162$.", "$x = \\frac{9}{5}y$ rakhne par: $\\frac{9}{5}y + y = \\frac{14}{5}y = 162 \\Rightarrow y = \\frac{162 \\times 5}{14} = \\frac{810}{14} \\approx \\color{#3fb950}{57.86\\text{ kcal/mol}}$."], "r": "Option <b>(D)</b> (57.86 kcal/mol) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> 70 kcal/mol — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> 80 kcal/mol — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> 67.75 kcal/mol — upar ki derivation / NCERT rule se match nahi karta."], "t": "Sign galti se bachne ka mantra: <b>Bond tutna = Energy deni padti hai ($+$), Bond banna = Energy nikalti hai ($-$)</b>!", "sim": ""}, {"id": 55, "sub": "Chemistry", "q": "For conversion C(graphite) → C(Diamond), the ΔS is:", "fig": "", "opt": ["Zero", "Positive", "Negative", "Cannot be predicted"], "ans": 2, "c": "<b>Entropy ($S$)</b> randomness ya disorder maapti hai. Graphite me layered sheets ek-doosre par slip kar sakti hain (zyada disorder), jabki <b>Diamond</b> ek behad rigid $3\\text{D}$ covalent network solid hai (bahut kam disorder).", "m": "$\\Delta S = S_{\\text{diamond}} - S_{\\text{graphite}}$ ka sign nikalenge.", "s": ["$S_{\\text{diamond}} < S_{\\text{graphite}}$, isliye graphite se diamond banne me randomness ghat-ti hai $\\Rightarrow \\Delta S$ <b>Negative</b> hota hai!"], "r": "Option <b>(C)</b> (Negative) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Zero — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (B):</b> Positive — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> Cannot be predicted — upar ki derivation / NCERT rule se match nahi karta."], "t": "Yaad rakho: Diamond zyada ordered crystal hai, isliye $S_{\\text{diamond}} < S_{\\text{graphite}}$ ($\\Delta S < 0$)!", "sim": ""}, {"id": 56, "sub": "Chemistry", "q": "Which reagent carries out the selective partial hydrogenation shown below without reducing the conjugated cyclic enone?", "fig": "<svg viewBox=\"0 0 540 140\" width=\"100%\" style=\"max-width:540px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Selective cis reduction of internal alkyne\"><rect width=\"540\" height=\"140\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><g transform=\"translate(72,78)\"><polygon points=\"0,-26 -25,-7 -15,23 15,23 25,-7\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"11\" y1=\"17\" x2=\"19\" y2=\"-5\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"-3\" y1=\"-26\" x2=\"-3\" y2=\"-44\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"3\" y1=\"-26\" x2=\"3\" y2=\"-44\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><text x=\"0\" y=\"-48\" fill=\"#f59e0b\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">O</text><line x1=\"15\" y1=\"23\" x2=\"30\" y2=\"37\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><polyline points=\"25,-7 48,-20 68,-6\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><text x=\"95\" y=\"-2\" fill=\"#60a5fa\" font-size=\"13.5\" font-weight=\"700\" text-anchor=\"middle\">C≡C</text><polyline points=\"122,-6 142,-20 164,-7\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/></g><line x1=\"252\" y1=\"74\" x2=\"302\" y2=\"74\" stroke=\"#3fb950\" stroke-width=\"2.4\"/><polygon points=\"308,74 299,69 299,79\" fill=\"#3fb950\"/><text x=\"278\" y=\"64\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">?</text><g transform=\"translate(352,78)\"><polygon points=\"0,-26 -25,-7 -15,23 15,23 25,-7\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"11\" y1=\"17\" x2=\"19\" y2=\"-5\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"-3\" y1=\"-26\" x2=\"-3\" y2=\"-44\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"3\" y1=\"-26\" x2=\"3\" y2=\"-44\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><text x=\"0\" y=\"-48\" fill=\"#f59e0b\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">O</text><line x1=\"15\" y1=\"23\" x2=\"30\" y2=\"37\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><polyline points=\"25,-7 48,-20 68,-5 98,-5 118,-20 140,-7\" fill=\"none\" stroke=\"#3fb950\" stroke-width=\"2.2\"/><line x1=\"71\" y1=\"-10\" x2=\"95\" y2=\"-10\" stroke=\"#3fb950\" stroke-width=\"2.2\"/><text x=\"83\" y=\"14\" fill=\"#3fb950\" font-size=\"11.5\" font-weight=\"600\" text-anchor=\"middle\">cis-alkene</text></g></svg>", "opt": ["Na / Liq. NH₃", "H₂, Pd-CaCO₃", "Li, Ph-NH₂", "H₂, Pt"], "ans": 1, "c": "Diye gaye molecule me ring ke andar conjugated ketone ($\\text{C=C-C=O}$) bhi hai aur side chain me internal alkyne ($-\\text{C}\\equiv\\text{C}-$) ko sirf <b>cis-alkene</b> me badla gaya hai.", "m": "Syn-addition partial hydrogenation catalyst <b>Lindlar's catalyst</b> ($\\text{H}_2,\\; \\text{Pd-CaCO}_3$) chunege.", "s": ["$\\text{Na/Liq. NH}_3$ (Birch) <i>trans</i>-alkene deta hai aur $\\text{H}_2/\\text{Pt}$ sabhi double/triple bonds ko alkane tak reduce kar deta hai.", "Poisoned <b>Lindlar's catalyst ($\\text{H}_2,\\; \\text{Pd-CaCO}_3$)</b> syn-addition se internal alkyne ko selectively <b>cis-alkene</b> (<i>cis</i>-jasmone) me rokh deta hai!"], "r": "Option <b>(B)</b> (H₂, Pd-CaCO₃) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> Na / Liq. NH₃ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (C):</b> Li, Ph-NH₂ — upar ki derivation / NCERT rule se match nahi karta.", "<b>Option (D):</b> H₂, Pt — upar ki derivation / NCERT rule se match nahi karta."], "t": "Lindlar's catalyst ($\\text{H}_2/\\text{Pd-CaCO}_3$) $\\rightarrow$ <b>Cis</b>-alkene; Birch ($\\text{Na/NH}_3(l)$) $\\rightarrow$ <b>Trans</b>-alkene!", "sim": ""}, {"id": 57, "sub": "Chemistry", "q": "Which reagent selectively achieves the chemoselective reduction of the keto group in $4$-nitrocyclohexan-$1$-one shown below?", "fig": "<svg viewBox=\"0 0 460 155\" width=\"100%\" style=\"max-width:460px;display:block;margin:0 auto\" role=\"img\" aria-label=\"Chemoselective ketone reduction\"><rect width=\"460\" height=\"155\" rx=\"10\" fill=\"#151922\" stroke=\"#283040\"/><g transform=\"translate(128,78)\"><polygon points=\"0,-30 26,-15 26,15 0,30 -26,15 -26,-15\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"-3\" y1=\"-30\" x2=\"-3\" y2=\"-48\" stroke=\"#f59e0b\" stroke-width=\"2\"/><line x1=\"3\" y1=\"-30\" x2=\"3\" y2=\"-48\" stroke=\"#f59e0b\" stroke-width=\"2\"/><text x=\"0\" y=\"-52\" fill=\"#f59e0b\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">O</text><line x1=\"0\" y1=\"30\" x2=\"0\" y2=\"48\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><text x=\"0\" y=\"63\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">NO₂</text></g><line x1=\"190\" y1=\"78\" x2=\"264\" y2=\"78\" stroke=\"#3fb950\" stroke-width=\"2.4\"/><polygon points=\"270,78 261,73 261,83\" fill=\"#3fb950\"/><text x=\"228\" y=\"68\" fill=\"#3fb950\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">?</text><g transform=\"translate(332,78)\"><polygon points=\"0,-30 26,-15 26,15 0,30 -26,15 -26,-15\" fill=\"none\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><line x1=\"0\" y1=\"-30\" x2=\"0\" y2=\"-48\" stroke=\"#3fb950\" stroke-width=\"2\"/><text x=\"0\" y=\"-52\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">OH</text><line x1=\"0\" y1=\"30\" x2=\"0\" y2=\"48\" stroke=\"#dcdfe4\" stroke-width=\"2\"/><text x=\"0\" y=\"63\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">NO₂</text></g></svg>", "opt": ["LiAlH₄", "H₂/Ni, Δ", "NaBH₄", "All"], "ans": 2, "c": "Molecule me <b>ketone ($>\\text{C=O}$)</b> aur <b>nitro ($-\\text{NO}_2$)</b> dono functional groups hain, aur sirf ketone ko alcohol ($-\\text{OH}$) me badalna hai bina $-\\text{NO}_2$ ko chhede (<b>chemoselective reduction</b>).", "m": "Mild selective reducing agent $\\text{NaBH}_4$ select karenge.", "s": ["$\\text{LiAlH}_4$ aur $\\text{H}_2/\\text{Ni},\\Delta$ strong reducing agents hain jo $-\\text{NO}_2$ group ko bhi reduce kar dete hain.", "<b>$\\text{NaBH}_4$</b> ek mild chemoselective reagent hai jo $-\\text{NO}_2$ ko bilkul touch kiye bina sirf aldehyde, ketone aur acid chloride ko alcohol me reduce karta hai!"], "r": "Option <b>(C)</b> (NaBH₄) sabhi steps aur rules ke mutabik bilkul sahi jawab hai.", "w": ["<b>Option (A):</b> LiAlH₄ — upar ki derivation / NCERT
