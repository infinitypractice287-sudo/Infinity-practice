function formatClock(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function toggleTimer() {
  state.timerRunning = !state.timerRunning;
  const btn = document.getElementById("timerBtn");
  btn.classList.toggle("active", state.timerRunning);
  if (state.timerRunning) {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(() => {
      if (state.timeLeft > 0) {
        state.timeLeft--;
        btn.textContent = "⏱ " + formatClock(state.timeLeft);
        if (state.timeLeft % 10 === 0) saveState();
      } else {
        clearInterval(timerHandle);
        state.timerRunning = false;
        confirmSubmit();
      }
    }, 1000);
  } else if (timerHandle) {
    clearInterval(timerHandle);
  }
}

function openSubmitModal() {
  const st = calcStats();
  document.getElementById("modalSummaryText").textContent =
    `Attempted: ${st.attempted} / 180  •  Unattempted: ${st.skipped} / 180. Ready to view your 720-mark scorecard & full solutions?`;
  document.getElementById("submitModal").classList.remove("hidden");
}

function closeSubmitModal() {
  document.getElementById("submitModal").classList.add("hidden");
}

function confirmSubmit() {
  closeSubmitModal();
  state.submitted = true;
  saveState();
  renderQuestion();
  scrollTopSafe();
}

function renderResultScreen() {
  const st = calcStats();
  const rows = ["Physics", "Chemistry", "Botany", "Zoology"].map(sub => {
    const b = st.bySub[sub];
    return `<tr>
      <td><b>${sub}</b></td>
      <td style="color:var(--green-soft)">${b.right}</td>
      <td style="color:var(--red-soft)">${b.wrong}</td>
      <td style="color:var(--muted)">${b.left}</td>
      <td><b>${b.score} / 180</b></td>
    </tr>`;
  }).join("");

  document.getElementById("resultSummary").innerHTML = `
    <h2 style="font-size:24px;margin-bottom:4px;">NEET UG Full Paper Scorecard</h2>
    <p style="color:var(--muted);font-size:15px;">Complete 180 Questions Evaluation (+4 Correct, −1 Incorrect, 0 Unattempted)</p>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val" style="color:var(--accent)">${st.score} / 720</div><div class="kpi-lbl">Total Score</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:var(--green-soft)">${st.correct}</div><div class="kpi-lbl">Correct (+4)</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:var(--red-soft)">${st.wrong}</div><div class="kpi-lbl">Wrong (−1)</div></div>
      <div class="kpi-card"><div class="kpi-val">${st.skipped}</div><div class="kpi-lbl">Unattempted (0)</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:var(--amber)">${st.acc}%</div><div class="kpi-lbl">Accuracy</div></div>
    </div>
    <table class="sub-table">
      <thead><tr><th>Subject</th><th>Right</th><th>Wrong</th><th>Left</th><th>Marks</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="nav-btn primary" type="button" onclick="openReview()">Review All 180 Answers</button>
      <button class="nav-btn" type="button" onclick="backToExam()">← Back to Question Mode</button>
      <button class="nav-btn" type="button" onclick="restartExam()">Restart Fresh Exam</button>
    </div>`;

  if (state.reviewOpen) {
    document.getElementById("reviewSection").classList.remove("hidden");
    renderReviewList();
  } else {
    document.getElementById("reviewSection").classList.add("hidden");
  }
}

function openReview() {
  state.reviewOpen = true;
  saveState();
  document.getElementById("reviewSection").classList.remove("hidden");
  renderReviewList();
}

function setReviewFilter(f) {
  state.reviewFilter = f;
  saveState();
  renderReviewList();
}

function renderReviewList() {
  const filters = [
    ["all", "All (180)"],
    ["wrong", "Wrong"],
    ["right", "Correct"],
    ["skipped", "Unattempted"],
    ["Physics", "Physics"],
    ["Chemistry", "Chemistry"],
    ["Botany", "Botany"],
    ["Zoology", "Zoology"]
  ];
  document.getElementById("reviewFilters").innerHTML = filters.map(([id, lbl]) =>
    `<button type="button" class="mini-btn ${state.reviewFilter === id ? "active" : ""}" onclick="setReviewFilter('${id}')">${lbl}</button>`
  ).join("");

  const filtered = QUESTIONS.filter(q => {
    const pick = state.answers[q.id];
    const f = state.reviewFilter;
    if (f === "all") return true;
    if (f === "wrong") return pick !== undefined && pick !== null && pick !== q.ans;
    if (f === "right") return pick === q.ans;
    if (f === "skipped") return pick === undefined || pick === null;
    return q.sub === f;
  });

  document.getElementById("reviewList").innerHTML = filtered.map(q => {
    const pick = state.answers[q.id];
    let statusBadge = `<span style="color:var(--muted)">Unattempted (0)</span>`;
    if (pick === q.ans) statusBadge = `<span style="color:var(--green-soft)">✓ Correct (+4) — Picked ${LETTERS[pick]}</span>`;
    else if (pick !== undefined && pick !== null) statusBadge = `<span style="color:var(--red-soft)">✗ Wrong (−1) — Picked ${LETTERS[pick]}, Correct: ${LETTERS[q.ans]}</span>`;

    const optsHtml = q.opt.map((op, i) => {
      let cls = "opt-btn";
      if (i === q.ans) cls += " correct";
      else if (i === pick) cls += " wrong";
      return `<div class="${cls}" style="cursor:default;"><span class="opt-letter">${LETTERS[i]}</span><span>${renderRich(op)}</span></div>`;
    }).join("");

    return `<article class="review-item">
      <div class="q-meta">
        <span class="q-index">Q${q.id} • ${q.sub}</span>
        <span>${statusBadge}</span>
      </div>
      <div class="q-stem">${renderRich(q.q)}</div>
      ${q.fig ? `<div class="fig-box">${q.fig}</div>` : ""}
      <div class="options-list">${optsHtml}</div>
      <div class="exp-box">${buildExplanationHtml(q)}</div>
    </article>`;
  }).join("");
}

function backToExam() {
  state.submitted = false;
  saveState();
  renderQuestion();
}

function restartExam() {
  state = {
    idx: 0,
    answers: {},
    submitted: false,
    reviewOpen: false,
    reviewFilter: "all",
    timeLeft: 180 * 60,
    timerRunning: false
  };
  saveState();
  document.getElementById("timerBtn").textContent = "⏱ 180:00";
  renderQuestion();
  scrollTopSafe();
}

document.addEventListener("keydown", e => {
  if (state.submitted) return;
  if (e.key === "ArrowLeft") goPrev();
  else if (e.key === "ArrowRight") goNext();
  else if (["1", "2", "3", "4"].includes(e.key)) selectOption(Number(e.key) - 1);
  else if (["a", "b", "c", "d", "A", "B", "C", "D"].includes(e.key)) {
    selectOption(e.key.toUpperCase().charCodeAt(0) - 65);
  }
});

loadState();
document.getElementById("timerBtn").textContent = "⏱ " + formatClock(state.timeLeft);
window.addEventListener("DOMContentLoaded", () => {
  renderQuestion();
  setTimeout(renderQuestion, 350);
});
renderQuestion();
</script>
