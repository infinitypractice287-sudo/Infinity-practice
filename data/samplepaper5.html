= \\pi\\,\\mathrm{s^{-1}}$","Amplitude identity likhein: $A = \\sqrt{x_0^2 + \\left(\\dfrac{v_0}{\\omega}\\right)^2}$","Values rakhein: $A = \\sqrt{(1)^2 + \\left(\\dfrac{\\cancel{\\pi}}{\\cancel{\\pi}}\\right)^2}\\,\\mathrm{cm}$","Simplify karein: $A = \\sqrt{1 + 1} = \\color{#7ee2b8}{\\sqrt{2}\\,\\mathrm{cm}}$"],"r":"SHM karte particle ka amplitude $\\sqrt{2}\\,\\mathrm{cm}$ hai.","w":["**Option A ($1\\,\\mathrm{cm}$):** Initial velocity $v_0 = \\pi\\,\\mathrm{cm\\,s^{-1}} \\ne 0$ hai, toh $x_0 = 1\\,\\mathrm{cm}$ extreme point nahi ho sakta ($A > 1\\,\\mathrm{cm}$ hona hi chahiye!).","**Option C ($2\\,\\mathrm{cm}$):** Square root lena bhool kar $A^2 = 2$ ko hi $A = 2\\,\\mathrm{cm}$ likhne se aata hai!","**Option D ($2.5\\,\\mathrm{cm}$):** Galat arithmetic ka parinaam hai."],"t":"SHM ka sabse fast formula yaad rakho: **$A = \\sqrt{x^2 + (v/\\omega)^2}$** — isse $\\sin\\theta, \\cos\\theta$ nikalne ki kabhi zaroorat nahi padegi!","sim":""},{"id":28,"q":"A pipe open at both ends has a third harmonic frequency of $600\\,\\mathrm{Hz}$ and a wave speed of $400\\,\\mathrm{m\\,s^{-1}}$. What is its length?","fig":"q28","opt":["$0.5\\,\\mathrm{m}$","$0.67\\,\\mathrm{m}$","$1.5\\,\\mathrm{m}$","$1\\,\\mathrm{m}$"],"ans":3,"c":"**Open organ pipe** (dono siron par khula) me **saare harmonics** ($n = 1, 2, 3, \\dots$) bante hain aur $n\\text{th}$ harmonic ki frequency $f_n = \\dfrac{nv}{2L}$ hoti hai.","m":"Third harmonic ke liye $n = 3$, $f_3 = 600\\,\\mathrm{Hz}$, aur $v = 400\\,\\mathrm{m\\,s^{-1}}$ ko $f_3 = \\dfrac{3v}{2L}$ me rakhkar $L$ nikalenge.","s":["Open pipe ke $n\\text{th}$ harmonic ka sutr: $f_n = \\dfrac{nv}{2L}$","$n = 3$, $f_3 = 600\\,\\mathrm{Hz}$, $v = 400\\,\\mathrm{m\\,s^{-1}}$ rakhein: $600 = \\dfrac{3 \\times 400}{2L}$","Numerator simplify karein: $600 = \\dfrac{1200}{2L} = \\dfrac{600}{L}$","$L$ solve karein: $L = \\dfrac{600}{600} = \\color{#7ee2b8}{1\\,\\mathrm{m}}$"],"r":"Open pipe ki lambai $1\\,\\mathrm{m}$ hai.","w":["**Option A ($0.5\\,\\mathrm{m}$):** Closed pipe formula $\\dfrac{nv}{4L}$ laga dene se $L = \\dfrac{3 \\times 400}{4 \\times 600} = 0.5\\,\\mathrm{m}$ galat aata hai!","**Option B ($0.67\\,\\mathrm{m}$):** Third harmonic ko galti se $n = 2$ (second overtone confusion!) le lene se $L = \\dfrac{2}{3} = 0.67\\,\\mathrm{m}$ aata hai.","**Option C ($1.5\\,\\mathrm{m}$):** $\\dfrac{f_3}{v} = \\dfrac{600}{400} = 1.5$ ulta ratio lene se aata hai."],"t":"Confusion killer: **\"Third harmonic\"** hamesha $f_3 = 3f_1$ ($n = 3$) hota hai! Jabki **\"Third overtone\"** open pipe me $4f_1$ hota hai — harmonic aur overtone me farak dhyan rakhein!","sim":"standing_wave"},{"id":29,"q":"A wave represented by the given equation $y = a\\cos(kx - \\omega t)$ is superposed with another wave to form a stationary wave such that the point $x = 0$ is a node. The equation for the other wave is","fig":"","opt":["$y = a\\sin(kx + \\omega t)$","$y = -a\\cos(kx + \\omega t)$","$y = -a\\cos(kx - \\omega t)$","$y = -a\\sin(kx - \\omega t)$"],"ans":1,"c":"**Stationary (standing) wave** banne ki do shartein hain: (1) doosri wave **opposite direction** me chalni chahiye (agar pehli $kx - \\omega t$ यानी $+x$ me ja rahi hai, toh doosri $kx + \\omega t$ यानी $-x$ me aani chahiye!), aur (2) **Node** ($x = 0$) par **har samay $t$ ke liye** resultant displacement $y_1(0,t) + y_2(0,t) = 0$ hona chahiye!","m":"Pehle direction check karke $(kx - \\omega t)$ wale options (C aur D) turant hata denge, phir $x = 0$ rakhkar check karenge ki $y_1 + y_2 \\equiv 0$ kis option me banta hai.","s":["Di gayi incident wave ($+x$ direction): $y_1 = a\\cos(kx - \\omega t)$","Stationary wave ke liye reflected wave $-x$ direction me honi chahiye, isliye argument $(kx + \\omega t)$ hoga (Options C aur D eliminate ho gaye!)","$x = 0$ par $y_1(0, t) = a\\cos(0 - \\omega t) = a\\cos(\\omega t)$ [kyunki $\\cos(-\\theta) = \\cos\\theta$]","Node condition $y_1(0,t) + y_2(0,t) = 0 \\implies y_2(0,t) = -a\\cos(\\omega t)$","Option B me $x = 0$ check karein: $y_2 = -a\\cos(kx + \\omega t) \\implies y_2(0,t) = -a\\cos(\\omega t)$; aur poori standing wave $y_1 + y_2 = 2a\\sin(kx)\\sin(\\omega t)$ banti hai! Isliye $\\color{#7ee2b8}{y = -a\\cos(kx + \\omega t)}$ sahi hai."],"r":"Doosri wave ki equation $y = -a\\cos(kx + \\omega t)$ hai.","w":["**Option A ($y = a\\sin(kx + \\omega t)$):** $x = 0$ par $y_1 + y_2 = a\\cos(\\omega t) + a\\sin(\\omega t) = \\sqrt{2}a\\sin(\\omega t + \\pi/4) \\ne 0$, yaani $x = 0$ node nahi banega.","**Option C ($y = -a\\cos(kx - \\omega t)$):** Ye same direction ($+x$) me ja rahi hai aur har jagah $y_1 + y_2 = 0$ (complete darkness/silence) kar degi, stationary wave nahi banegi!","**Option D ($y = -a\\sin(kx - \\omega t)$):** Ye bhi $+x$ direction me travel karti travelling wave degi, standing wave nahi."],"t":"Rigid boundary reflection rule: $+x$ ko $-x$ karo ($kx \\to -kx$) aur phase $\\pi$ jodo ($+$ sign ko $-$ karo): $a\\cos(kx - \\omega t) \\longrightarrow -a\\cos(-kx - \\omega t) = -a\\cos(kx + \\omega t)$!","sim":""},{"id":30,"q":"A uniform field $E = 6 \\times 10^{3}\\,\\mathrm{N\\,C^{-1}}$ is along the $y$-axis. What is the flux through a square of side $25\\,\\mathrm{cm}$ in the $xz$-plane at $60^\\circ$ to the $y$-axis?","fig":"q30","opt":["$150\\,\\mathrm{N\\,m^2\\,C^{-1}}$","$175\\,\\mathrm{N\\,m^2\\,C^{-1}}$","$187.5\\,\\mathrm{N\\,m^2\\,C^{-1}}$","$200\\,\\mathrm{N\\,m^2\\,C^{-1}}$"],"ans":2,"c":"Uniform electric field $\\vec{E}$ me plane surface area $\\vec{A}$ se guzarne wala electric flux $\\Phi = \\vec{E}\\cdot\\vec{A} = E A \\cos\\theta$ hota hai, jahan $\\theta$ electric field $\\vec{E}$ aur area normal vector $\\hat{n}$ ke beech ka angle hai.","m":"Square side $a = 25\\,\\mathrm{cm} = \\dfrac{1}{4}\\,\\mathrm{m}$ rakhne se $A = \\dfrac{1}{16}\\,\\mathrm{m^2}$ calculation behad aasaan ho jaati hai, phir $\\Phi = E A \\cos 60^\\circ$ lagayenge.","s":["Square ka area SI me nikalein: $a = 25\\,\\mathrm{cm} = 0.25\\,\\mathrm{m} = \\dfrac{1}{4}\\,\\mathrm{m} \\implies A = a^2 = 0.0625\\,\\mathrm{m^2} = \\dfrac{1}{16}\\,\\mathrm{m^2}$","Flux formula likhein: $\\Phi = E \\cdot A \\cdot \\cos 60^\\circ$","Values rakhein: $\\Phi = (6 \\times 10^{3}) \\times \\dfrac{1}{16} \\times \\dfrac{1}{2}$","Divide karein: $\\Phi = \\dfrac{6000}{32} = \\dfrac{750}{4} = \\color{#7ee2b8}{187.5\\,\\mathrm{N\\,m^2\\,C^{-1}}}$"],"r":"Square se guzarne wala electric flux $187.5\\,\\mathrm{N\\,m^2\\,C^{-1}}$ hai.","w":["**Option A ($150\\,\\mathrm{N\\,m^2\\,C^{-1}}$):** Area ya angle factor galat lene se aata hai.","**Option B ($175\\,\\mathrm{N\\,m^2\\,C^{-1}}$):** $\\dfrac{6000}{32}$ divide karne me $375 \\div 2 = 175$ (mental subtraction slip!) karne se aata hai!","**Option D ($200\\,\\mathrm{N\\,m^2\\,C^{-1}}$):** Rough rounding karne se galat value aati hai."],"t":"$375 \\div 2$ me jaldbazi me kai students **$175$** likh dete hain ($2 \\times 175 = 350$, $375$ nahi!) — dhyan rakhein $375 \\div 2 = \\mathbf{187.5}$!","sim":""},{"id":31,"q":"Two charges of $-4\\,\\mu\\mathrm{C}$ and $+4\\,\\mu\\mathrm{C}$ are placed at the points $A(1,0,4)$ and $B(2,-1,5)$ located in an electric field $\\vec{E} = 20\\hat{i}\\,\\mathrm{V\\,cm^{-1}}$ (coords in $\\mathrm{cm}$). Then, torque acting on the dipole will be","fig":"q31","opt":["$2.31 \\times 10^{-6}\\,\\mathrm{N\\,m}$","$1.13 \\times 10^{-4}\\,\\mathrm{N\\,m}$","$8.0 \\times 10^{-4}\\,\\mathrm{N\\,m}$","$3.04 \\times 10^{-3}\\,\\mathrm{N\\,m}$"],"ans":1,"c":"Electric dipole moment vector **negative charge $A(-q)$ se positive charge $B(+q)$** ki disha me hota hai: $\\vec{p} = q\\overrightarrow{AB}$. Uniform electric field $\\vec{E}$ me dipole par lagne wala torque vector cross product se milta hai: $\\vec{\\tau} = \\vec{p} \\times \\vec{E}$.","m":"Pehle displacement vector $\\overrightarrow{AB} = \\vec{r}_B - \\vec{r}_A$ nikalenge, phir unit vectors ke cross product ($\\hat{i}\\times\\hat{i}=0$, $\\hat{j}\\times\\hat{i}=-\\hat{k}$, $\\hat{k}\\times\\hat{i}=\\hat{j}$) se $\\vec{\\tau}$ aur uska magnitude $|\\vec{\\tau}|$ nikalenge.","s":["Negative se positive ki displacement vector: $\\overrightarrow{AB} = (2 - 1)\\hat{i} + (-1 - 0)\\hat{j} + (5 - 4)\\hat{k} = (\\hat{i} - \\hat{j} + \\hat{k})\\times 10^{-2}\\,\\mathrm{m}$","Dipole moment $\\vec{p} = q\\overrightarrow{AB} = 4 \\times 10^{-6} \\times 10^{-2}(\\hat{i} - \\hat{j} + \\hat{k}) = 4 \\times 10^{-8}(\\hat{i} - \\hat{j} + \\hat{k})\\,\\mathrm{C\\,m}$","Electric field SI me: $\\vec{E} = 20\\hat{i}\\,\\mathrm{V\\,cm^{-1}} = 20 \\times 10^{2}\\hat{i}\\,\\mathrm{V\\,m^{-1}}$","Cross product lein: $\\vec{\\tau} = \\vec{p} \\times \\vec{E} = (4 \\times 10^{-8} \\times 20 \\times 10^{2})[(\\hat{i} - \\hat{j} + \\hat{k}) \\times \\hat{i}] = 8 \\times 10^{-5}(0 + \\hat{k} + \\hat{j})\\,\\mathrm{N\\,m}$","Magnitude nikalein: $|\\vec{\\tau}| = 8 \\times 10^{-5}\\sqrt{1^2 + 1^2} = 8\\sqrt{2} \\times 10^{-5} = 8 \\times 1.414 \\times 10^{-5} = \\color{#7ee2b8}{1.13 \\times 10^{-4}\\,\\mathrm{N\\,m}}$"],"r":"Dipole par lagne wale torque ka magnitude $1.13 \\times 10^{-4}\\,\\mathrm{N\\,m}$ hai.","w":["**Option A ($2.31 \\times 10^{-6}\\,\\mathrm{N\\,m}$):** Galat exponent aur dot/cross mix karne se aata hai.","**Option C ($8.0 \\times 10^{-4}\\,\\mathrm{N\\,m}$):** Vector cross product ki jagah sirf ek component $8 \\times 10^{-5}$ aur galat $10$ power lene se aata hai.","**Option D ($3.04 \\times 10^{-3}\\,\\mathrm{N\\,m}$):** Coordinates ko subtract karne ke bajay add kar dene se aata hai."],"t":"Shortcut: $(\\hat{i} - \\hat{j} + \\hat{k}) \\times \\hat{i}$ me $\\hat{i}$ wala component turant **zero** ho jaata hai! Sirf perpendicular part $(-\\hat{j} + \\hat{k})$ bachta hai jiska magnitude seedha $\\sqrt{(-1)^2 + 1^2} = \\sqrt{2}$ hai!","sim":""},{"id":32,"q":"A spherical conductor of radius $2\\,\\mathrm{m}$ is charged to a potential of $120\\,\\mathrm{V}$. It is now placed inside another hollow spherical conductor of radius $6\\,\\mathrm{m}$ (and connected). Calculate the potential to which the bigger sphere would be raised.","fig":"q32","opt":["$20\\,\\mathrm{V}$","$60\\,\\mathrm{V}$","$80\\,\\mathrm{V}$","$40\\,\\mathrm{V}$"],"ans":3,"c":"Isolated spherical conductor (radius $r_1$) ka potential $V_1 = \\dfrac{kq}{r_1}$ hota hai. Jab ise radius $r_2$ ke concentric uncharged hollow spherical shell ke andar rakhkar connect kiya jaata hai (ya electrostatic induction se bhi!), outer shell ka potential $V_2 = \\dfrac{kq}{r_2}$ hota hai!","m":"Dono relations $V_1 = \\dfrac{kq}{r_1}$ aur $V_2 = \\dfrac{kq}{r_2}$ ko divide karne par $kq$ cancel ho jaata hai aur $V_2 = V_1 \\times \\dfrac{r_1}{r_2}$ ek line me answer deta hai!","s":["Chhote sphere ($r_1 = 2\\,\\mathrm{m}$) ka initial potential: $V_1 = \\dfrac{kq}{r_1} = 120\\,\\mathrm{V} \\implies kq = 120 \\times 2 = 240\\,\\mathrm{V\\,m}$","Bade hollow sphere ($r_2 = 6\\,\\mathrm{m}$) par sara charge bahari satah par aa jaata hai (aur bina jode bhi induced charges $-q, +q$ milkar $V_{\\text{outer}} = \\dfrac{kq}{r_2}$ hi dete hain!):","$V_2 = \\dfrac{kq}{r_2} = \\dfrac{240\\,\\mathrm{V\\,m}}{6\\,\\mathrm{m}} = \\color{#7ee2b8}{40\\,\\mathrm{V}}$"],"r":"Bada hollow sphere $40\\,\\mathrm{V}$ potential tak uth jayega.","w":["**Option A ($20\\,\\mathrm{V}$):** $r_2 = 6\\,\\mathrm{m}$ se seedha $\\dfrac{120}{6} = 20\\,\\mathrm{V}$ kar diya ($r_1 = 2\\,\\mathrm{m}$ se multiply karna bhool gaye!).","**Option B ($60\\,\\mathrm{V}$):** Average ya $\\dfrac{120}{2} = 60\\,\\mathrm{V}$ lene ki galti se aata hai.","**Option C ($80\\,\\mathrm{V}$):** Parallel spheres outdoors formula $\\dfrac{C_1 V_1}{C_1 + C_2} = \\dfrac{2 \\times 120}{2 + 6} = 30\\,\\mathrm{V}$ ya galat subtraction $120 - 40 = 80\\,\\mathrm{V}$ se aata hai!"],"t":"Kamaal ki physics fact: Inner sphere ko outer uncharged concentric shell se **wire se jodo ya na jodo**, outer shell ka potential dono hi cases me exact $\\dfrac{kq}{r_2} = 40\\,\\mathrm{V}$ hi hota hai!","sim":""},{"id":33,"q":"The total current supplied to the circuit by the battery is","fig":"q33","opt":["$1\\,\\mathrm{A}$","$2\\,\\mathrm{A}$","$4\\,\\mathrm{A}$","$6\\,\\mathrm{A}$"],"ans":2,"c":"Complex dikhne wale circular circuit ko solve karne ka sabse aasaan tareeka **Node Labelling Method** hai: bina resistor wale har connecting wire ke har point ko **same letter** ($A, B, C$) do, aur phir resistors ko un nodes ke beech draw kar lo!","m":"Battery terminals ko $A$ (top-left arc) aur $B$ (bottom-left arc) aur beecho-beech junction ko $C$ naam denge — poora circuit $10$ second me aasaan series-parallel me khul jayega!","s":["Outer circle dekhein: Battery ($6\\,\\mathrm{V}$) ke upar wala poora upper conducting arc ek hi node **$A$** hai! Isliye **$2\\,\\Omega$** (top-left se centre $C$) aur **$6\\,\\Omega$** (top-right se centre $C$) dono **Node $A$ aur Node $C$ ke beech PARALLEL** me hain!","$2\\,\\Omega \\parallel 6\\,\\Omega$ jodein: $R_{AC} = \\dfrac{2 \\times 6}{2 + 6} = \\dfrac{12}{8} = 1.5\\,\\Omega$","Centre **$C$** se bottom conducting arc (**Node $B$**) tak **$1.5\\,\\Omega$** laga hai $\\implies R_{ACB} = R_{AC} + 1.5\\,\\Omega = 1.5 + 1.5 = 3\\,\\Omega$","Right side me Node $A$ se Node $B$ ke beech bahari arc par **$3\\,\\Omega$** directly parallel me juda hai $\\implies R_{\\mathrm{eq}} = 3\\,\\Omega \\parallel 3\\,\\Omega = \\dfrac{3}{2} = 1.5\\,\\Omega$","Ohm's law se battery current: $I = \\dfrac{V}{R_{\\mathrm{eq}}} = \\dfrac{6\\,\\mathrm{V}}{1.5\\,\\Omega} = \\color{#7ee2b8}{4\\,\\mathrm{A}}$"],"r":"Battery dwara circuit ko supply kiya gaya kul current $4\\,\\mathrm{A}$ hai.","w":["**Option A ($1\\,\\mathrm{A}$):** Resistors ko parallel ke bajay series me jodkar $R_{\\mathrm{eq}} = 6\\,\\Omega$ maan lene se aata hai.","**Option B ($2\\,\\mathrm{A}$):** Outer $3\\,\\Omega$ parallel branch ko bhool kar sirf $R = 3\\,\\Omega \\implies I = \\dfrac{6}{3} = 2\\,\\mathrm{A}$ nikalne se aata hai!","**Option D ($6\\,\\mathrm{A}$):** $R_{\\mathrm{eq}} = 1\\,\\Omega$ andaze se lene par galat maan aata hai."],"t":"**Node Method Magic**: Upper arc par koi resistor nahi hai, toh $2\\,\\Omega$ aur $6\\,\\Omega$ ke bahari sire ek hi wire se jude hain ($2 \\parallel 6 = 1.5\\,\\Omega$) — bas yahi step poore sawal ki chaabi hai!","sim":""},{"id":34,"q":"A body of mass $3\\,\\mathrm{kg}$ is acted upon by a constant force of $15\\,\\mathrm{N}$ for $4\\,\\mathrm{s}$. What is the change in momentum of the body?","fig":"","opt":["$30\\,\\mathrm{kg\\,m\\,s^{-1}}$","$45\\,\\mathrm{kg\\,m\\,s^{-1}}$","$60\\,\\mathrm{kg\\,m\\,s^{-1}}$","$75\\,\\mathrm{kg\\,m\\,s^{-1}}$"],"ans":2,"c":"**Impulse–Momentum Theorem** (Newton's Second Law $F = \\dfrac{\\Delta p}{\\Delta t}$) ke anusaar kisi body ke momentum me badlaav $\\Delta p$ us par lagne wale **impulse** ($F \\times \\Delta t$) ke barabar hota hai — body ke mass par bilkul depend nahi karta!","m":"Seedha $\\Delta p = F \\cdot \\Delta t$ lagayenge; $m = 3\\,\\mathrm{kg}$ se $a = \\dfrac{F}{m} = 5\\,\\mathrm{m\\,s^{-2}}$ aur $m\\Delta v = m(at)$ se cross-check bhi kar sakte hain.","s":["Impulse–momentum relation likhein: $\\Delta p = F \\times \\Delta t$","Values rakhein: $\\Delta p = 15\\,\\mathrm{N} \\times 4\\,\\mathrm{s} = \\color{#7ee2b8}{60\\,\\mathrm{kg\\,m\\,s^{-1}}}$","Cross-verify (kinematics se): $a = \\dfrac{15}{3} = 5\\,\\mathrm{m\\,s^{-2}} \\implies \\Delta v = 5 \\times 4 = 20\\,\\mathrm{m\\,s^{-1}} \\implies m\\Delta v = 3 \\times 20 = 60\\,\\mathrm{kg\\,m\\,s^{-1}}$!"],"r":"Body ke momentum me badlaav $60\\,\\mathrm{kg\\,m\\,s^{-1}}$ hai.","w":["**Option A ($30\\,\\mathrm{kg\\,m\\,s^{-1}}$):** Galti se $\\dfrac{1}{2}$ lagane ya galat time se multiply karne se aata hai.","**Option B ($45\\,\\mathrm{kg\\,m\\,s^{-1}}$):** $F \\times t$ ke bajay galti se $F \\times m = 15 \\times 3 = 45$ kar dene se aata hai!!","**Option D ($75\\,\\mathrm{kg\\,m\\,s^{-1}}$):** $15 \\times 5$ galat table padhne se aata hai."],"t":"Trap alert: **Option B ($45$)** $15 \\times 3$ ($F \\times m$) se banaya gaya hai! Yaad rakhein $\\Delta p = F \\times t$, mass $3\\,\\mathrm{kg}$ sirf confuse karne ke liye diya hai!","sim":""},{"id":35,"q":"An element $\\vec{dl} = dx\\,\\hat{i}$ (where $dx = 1\\,\\mathrm{cm}$) is placed at the origin and carries a large current $i = 10\\,\\mathrm{A}$. What is the magnetic field on the $y$-axis at a distance of $0.5\\,\\mathrm{m}$?","fig":"q35","opt":["$2 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}$","$4 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}$","$-2 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}$","$-4 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}$"],"ans":1,"c":"**Biot–Savart Law** vector form me chhote current element $i\\vec{dl}$ ke karan position vector $\\vec{r}$ par magnetic field deta hai: $\\vec{dB} = \\dfrac{\\mu_0}{4\\pi}\\dfrac{i(\\vec{dl} \\times \\vec{r})}{r^3}$.","m":"Magnitude aur direction dono ek saath exact pane ke liye vector cross product $\\hat{i} \\times \\hat{j} = +\\hat{k}$ lagayenge (isase $-\\hat{k}$ wale Options C aur D pehle hi second me kat jaate hain!).","s":["Diya hai: $i = 10\\,\\mathrm{A}$, $\\vec{dl} = 10^{-2}\\hat{i}\\,\\mathrm{m}$, aur $y$-axis par $\\vec{r} = 0.5\\hat{j}\\,\\mathrm{m}$ ($r = 0.5\\,\\mathrm{m}$)","Biot–Savart formula lagayein: $\\vec{dB} = \\dfrac{\\mu_0}{4\\pi}\\dfrac{i(dx\\,\\hat{i} \\times r\\,\\hat{j})}{r^3} = \\dfrac{\\mu_0}{4\\pi}\\dfrac{i\\,dx}{r^2}(\\hat{i} \\times \\hat{j})$","Cross product aur values rakhein ($\\hat{i} \\times \\hat{j} = +\\hat{k}$, $\\dfrac{\\mu_0}{4\\pi} = 10^{-7}$): $\\vec{dB} = \\dfrac{10^{-7} \\times 10 \\times 10^{-2}}{(0.5)^2}\\hat{k}\\,\\mathrm{T}$","Simplify karein: $\\vec{dB} = \\dfrac{10^{-8}}{0.25}\\hat{k} = \\color{#7ee2b8}{4 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}}$"],"r":"$y$-axis par $0.5\\,\\mathrm{m}$ doori par magnetic field $4 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}$ hai.","w":["**Option A ($2 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}$):** $(0.5)^2 = 0.25$ ki jagah $r = 0.5$ bina square kiye divide karne se $2 \\times 10^{-8}$ aata hai!","**Option C ($-2 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}$):** $r^2$ chhoota aur right-hand thumb rule ulta lagaya gaya.","**Option D ($-4 \\times 10^{-8}\\hat{k}\\,\\mathrm{T}$):** $\\vec{r} \\times \\vec{dl}$ ulta order lene se $-\\hat{k}$ sign galti aati hai."],"t":"Right-Hand Thumb Rule check: Angootha $+x$ (current direction) me rakho — $+y$ (upar) par ungliyan page se **bahar ($+z = +\\hat{k}$)** aati hain!","sim":""},{"id":36,"q":"The space within a current carrying solenoid is filled with magnesium having magnetic susceptibility, $\\chi_{\\mathrm{Mg}} = 1.2 \\times 10^{-5}$. What will be the percentage increase in magnetic field?","fig":"","opt":["$1.2 \\times 10^{-3}\\%$","$1.2 \\times 10^{-4}\\%$","$3.6 \\times 10^{-3}\\%$","$2.4 \\times 10^{-2}\\%$"],"ans":0,"c":"Vacuum me solenoid ke andar magnetic field $B_0 = \\mu_0 H$ hota hai. Jab andar magnetic material (susceptibility $\\chi$) bhara jaata hai, toh net field $B = \\mu H = \\mu_0(1 + \\chi)H = B_0(1 + \\chi)$ ho jaata hai!","m":"Fractional increase $\\dfrac{B - B_0}{B_0} = \\chi$ hota hai, isliye **percentage increase** hamesha seedha $\\chi \\times 100\\%$ ke barabar hota hai!","s":["Vacuum aur medium magnetic fields likhein: $B_0 = \\mu_0 H$ aur $B = \\mu_0(1 + \\chi_{\\mathrm{Mg}})H$","Fractional increase nikalein: $\\dfrac{\\Delta B}{B_0} = \\dfrac{B - B_0}{B_0} = (1 + \\chi_{\\mathrm{Mg}}) - 1 = \\chi_{\\mathrm{Mg}}$","Percentage increase ke liye $100$ se multiply karein: $\\% \\text{ increase} = \\chi_{\\mathrm{Mg}} \\times 100\\%$","$\\chi_{\\mathrm{Mg}} = 1.2 \\times 10^{-5}$ rakhein: $1.2 \\times 10^{-5} \\times 10^{2}\\% = \\color{#7ee2b8}{1.2 \\times 10^{-3}\\%}$"],"r":"Magnetic field me percentage increase $1.2 \\times 10^{-3}\\%$ hoga.","w":["**Option B ($1.2 \\times 10^{-4}\\%$):** $100$ ki jagah sirf $10$ se multiply karne ki galti se aata hai.","**Option C ($3.6 \\times 10^{-3}\\%$):** Volume thermal expansion ($3\\alpha$) jaisa galat factor $3$ multiply karne se aata hai.","**Option D ($2.4 \\times 10^{-2}\\%$):** Galat multiplication aur exponent jodne se aata hai."],"t":"1-second NEET formula: Paramagnetic core bharne par **% increase in $B = \\chi \\times 100\\%$** — seedha exponent me $+2$ jod do ($-5 + 2 = -3$)! Done!","sim":""},{"id":37,"q":"A current of $10\\,\\mathrm{A}$ in the primary coil of a circuit is reduced to zero. If the coefficient of mutual inductance is $3\\,\\mathrm{H}$ and emf induced in secondary coil is $30\\,\\mathrm{kV}$, time taken for the change of current is","fig":"","opt":["$10^{3}\\,\\mathrm{s}$","$10^{2}\\,\\mathrm{s}$","$10^{-3}\\,\\mathrm{s}$","$10^{-2}\\,\\mathrm{s}$"],"ans":2,"c":"Faraday's law of mutual induction ke anusaar primary coil me current badalne par secondary coil me induced emf $e = -M\\dfrac{\\Delta I}{\\Delta t}$ (magnitude $|e| = M\\dfrac{|\\Delta I|}{\\Delta t}$) hota hai.","m":"$30\\,\\mathrm{kV} = 30 \\times 10^{3}\\,\\mathrm{V}$ SI me likhkar $\\Delta t = \\dfrac{M |\\Delta I|}{|e|}$ se seedha samay nikalenge.","s":["Mutual induction formula likhein: $|e| = M\\dfrac{|\\Delta I|}{\\Delta t} \\implies \\Delta t = \\dfrac{M |\\Delta I|}{|e|}$","Diya hai: $M = 3\\,\\mathrm{H}$, $|\\Delta I| = |0 - 10| = 10\\,\\mathrm{A}$, aur $|e| = 30\\,\\mathrm{kV} = 30 \\times 10^{3}\\,\\mathrm{V}$","Values rakhein: $\\Delta t = \\dfrac{3 \\times 10}{30 \\times 10^{3}} = \\dfrac{\\cancel{30}}{\\cancel{30} \\times 10^{3}}$","Simplify karein: $\\Delta t = \\color{#7ee2b8}{10^{-3}\\,\\mathrm{s}}$ ($1\\,\\mathrm{ms}$)"],"r":"Current ghatne me laga samay $10^{-3}\\,\\mathrm{s}$ hai.","w":["**Option A ($10^{3}\\,\\mathrm{s}$):** Ratio ulta $\\dfrac{|e|}{M|\\Delta I|}$ likh dene se $10^{3}\\,\\mathrm{s}$ aata hai! ($1000\\,\\mathrm{s}$ me dheere ghatane par $30\\,\\mathrm{kV}$ spark thodi banega!)","**Option B ($10^{2}\\,\\mathrm{s}$):** Ulta ratio + $10\\,\\mathrm{A}$ bhoolne se aata hai.","**Option D ($10^{-2}\\,\\mathrm{s}$):** $10\\,\\mathrm{A}$ ka एक zero katne me chhootne se aata hai."],"t":"Physical common sense check: Car spark plug me $30000\\,\\mathrm{V}$ tabhi paida hota hai jab current **milliseconds ($10^{-3}\\,\\mathrm{s}$)** me tut-ta hai, $1000\\,\\mathrm{s}$ me nahi!","sim":""},{"id":38,"q":"An aluminium block of dimensions $0.4\\,\\mathrm{m} \\times 0.2\\,\\mathrm{m} \\times 0.05\\,\\mathrm{m}$ is subjected to a shearing force of $2 \\times 10^{4}\\,\\mathrm{N}$. If the shear modulus of aluminium is $2.5 \\times 10^{10}\\,\\mathrm{N\\,m^{-2}}$ what is the displacement of the top face? (Top face is the face having largest surface area)","fig":"q38","opt":["$4 \\times 10^{-7}\\,\\mathrm{m}$","$6 \\times 10^{-7}\\,\\mathrm{m}$","$5 \\times 10^{-7}\\,\\mathrm{m}$","$3 \\times 10^{-7}\\,\\mathrm{m}$"],"ans":2,"c":"**Shear modulus (Modulus of Rigidity)** $G$ shearing stress aur shearing strain ka anupaat hota hai: $G = \\dfrac{F / A}{\\Delta x / h}$, jahan $A$ tangential force wale face ka area aur $h$ fixed face se uski perpendicular unchai hai!","m":"Sabse bada face $A = 0.4\\,\\mathrm{m} \\times 0.2\\,\\mathrm{m} = 0.08\\,\\mathrm{m^2}$ hai, isliye remaining teesri dimension $h = 0.05\\,\\mathrm{m}$ block ki height hogi! Ab $\\Delta x = \\dfrac{F \\cdot h}{A \\cdot G}$ lagayenge.","s":["Top face ka largest area: $A = 0.4 \\times 0.2 = 0.08\\,\\mathrm{m^2}$, aur height $h = 0.05\\,\\mathrm{m}$","Shear formula rearrange karein: $\\Delta x = \\dfrac{F \\cdot h}{A \\cdot G}$","Values rakhein: $\\Delta x = \\dfrac{(2 \\times 10^{4}) \\times 0.05}{0.08 \\times (2.5 \\times 10^{10})}\\,\\mathrm{m}$","Numerator aur denominator gunaa karein: Numerator $= 0.1 \\times 10^{4} = 10^{3}$; Denominator $= (0.08 \\times 2.5) \\times 10^{10} = 0.2 \\times 10^{10} = 2 \\times 10^{9}$","Divide karein: $\\Delta x = \\dfrac{10^{3}}{2 \\times 10^{9}} = 0.5 \\times 10^{-6}\\,\\mathrm{m} = \\color{#7ee2b8}{5 \\times 10^{-7}\\,\\mathrm{m}}$"],"r":"Top face ka displacement $5 \\times 10^{-7}\\,\\mathrm{m}$ hoga.","w":["**Option A ($4 \\times 10^{-7}\\,\\mathrm{m}$):** Wrong face area chunne ya division slip se aata hai.","**Option B ($6 \\times 10^{-7}\\,\\mathrm{m}$):** Arithmetic rounding error se aata hai.","**Option D ($3 \\times 10^{-7}\\,\\mathrm{m}$):** Galat height/area pairing lene se aata hai."],"t":"$0.08 \\times 2.5$ mental trick: $8 \\times 25 = 200$, teen decimal baad lagao $= 0.200$! Calculation ekdam crystal clean ho jaati hai!","sim":""},{"id":39,"q":"In an $L\\text{–}R$ circuit, the inductive reactance is equal to the resistance $R$ of the circuit. An emf $E = E_0\\cos(\\omega t)$ applied to the circuit. The power consumed in the circuit is","fig":"q39","opt":["$\\dfrac{E_0^2}{R}$","$\\dfrac{E_0^2}{2R}$","$\\dfrac{E_0^2}{4R}$","$\\dfrac{E_0^2}{8R}$"],"ans":2,"c":"AC circuit me inductor $L$ average power zero consume karta hai; saari average power sirf resistor $R$ me consume hoti hai: $P_{\\mathrm{avg}} = E_{\\mathrm{rms}} I_{\\mathrm{rms}} \\cos\\phi = I_{\\mathrm{rms}}^2 R$.","m":"Impedance $Z = \\sqrt{R^2 + X_L^2}$ nikalenge aur sabse simple aur mistake-free formula $P_{\\mathrm{avg}} = I_{\\mathrm{rms}}^2 R = \\left(\\dfrac{E_0}{\\sqrt{2}\\,Z}\\right)^2 R$ lagayenge!","s":["Diya hai $X_L = R$, toh impedance: $Z = \\sqrt{R^2 + X_L^2} = \\sqrt{R^2 + R^2} = \\sqrt{2}\\,R$","Peak current $I_0 = \\dfrac{E_0}{Z} = \\dfrac{E_0}{\\sqrt{2}\\,R} \\implies I_{\\mathrm{rms}} = \\dfrac{I_0}{\\sqrt{2}} = \\dfrac{E_0}{2R}$","Average power consumed: $P_{\\mathrm{avg}} = I_{\\mathrm{rms}}^2 R = \\left(\\dfrac{E_0}{2R}\\right)^2 R = \\dfrac{E_0^2}{4\\cancel{R^2}}\\cdot\\cancel{R} = \\color{#7ee2b8}{\\dfrac{E_0^2}{4R}}$"],"r":"Circuit me average power consumed $\\dfrac{E_0^2}{4R}$ hai.","w":["**Option A ($\\dfrac{E_0^2}{R}$):** Peak voltage ko DC samajh liya aur inductor $X_L$ ko poora bhool gaye!","**Option B ($\\dfrac{E_0^2}{2R}$):** Ya toh rms ka $\\sqrt{2}$ lagaya par $\\cos 45^\\circ = \\dfrac{1}{\\sqrt{2}}$ aur $Z = \\sqrt{2}R$ ka ek $\\dfrac{1}{2}$ chhod diya (pure resistive AC circuit ki power hai!).","**Option D ($\\dfrac{E_0^2}{8R}$):** Ek extra $\\dfrac{1}{2}$ galti se multiply karne se aata hai."],"t":"Double trap saver: Pure $R$ me $E_0^2 / (2R)$ hota hai; $X_L = R$ jodte hi $Z$ $\\sqrt{2}$ guna badha, toh current $\\dfrac{1}{\\sqrt{2}}$ aur $I^2 R$ seedha **aadha** होकर $\\dfrac{E_0^2}{4R}$ ho gaya!","sim":""},{"id":40,"q":"A parallel beam of light of intensity $I = 1.5\\,\\mathrm{kW\\,m^{-2}}$ is incident normally on a flat surface. If the surface absorbs $40\\%$ of the incident energy and reflects the remaining $60\\%$, the radiation pressure exerted on the surface is: ($c = 3 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$)","fig":"q40","opt":["$5 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$","$7 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$","$8 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$","$9 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$"],"ans":2,"c":"Normal incidence par **absorbed** photon apna momentum $p$ deta hai ($\\Delta p = p \\implies P_{\\mathrm{abs}} = \\dfrac{I_{\\mathrm{abs}}}{c}$), jabki **reflected** photon ulta lautne ke karan **dugna** momentum transfer karta hai ($\\Delta p = 2p \\implies P_{\\mathrm{ref}} = \\dfrac{2I_{\\mathrm{ref}}}{c}$)!","m":"Partial reflection coefficient $r = 0.60$ ke liye direct master formula $P = \\dfrac{I}{c}(1 + r)$ lagayenge (aur alag-alag $P_{\\mathrm{abs}} + P_{\\mathrm{ref}}$ se cross-check karenge)!","s":["Diya hai: $I = 1.5\\,\\mathrm{kW\\,m^{-2}} = 1500\\,\\mathrm{W\\,m^{-2}}$, fraction reflected $r = 0.60$, fraction absorbed $a = 0.40$ ($a + r = 1$)","Radiation pressure formula: $P = \\dfrac{a I}{c} + \\dfrac{2 r I}{c} = \\dfrac{I}{c}(a + 2r) = \\dfrac{I}{c}(1 + r)$","Values rakhein: $P = \\dfrac{1500}{3 \\times 10^{8}} \\times (1 + 0.60) = (5 \\times 10^{-6}) \\times 1.60$","Multiply karein: $5 \\times 1.60 \\times 10^{-6} = \\color{#7ee2b8}{8 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}}$"],"r":"Surface par lagne wala radiation pressure $8 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$ hai.","w":["**Option A ($5 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$):** Ye $100\\%$ absorption ($r = 0 \\implies \\dfrac{I}{c} = 5 \\times 10^{-6}$) ke liye hota, $60\\%$ reflection ignore kar diya!","**Option B ($7 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$):** $40\\%$ aur $60\\%$ ulta ($r = 0.40$) le lene se $5 \\times 1.4 = 7 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$ aata hai!","**Option D ($9 \\times 10^{-6}\\,\\mathrm{N\\,m^{-2}}$):** $r = 0.80$ jaisa galat factor lene se aata hai."],"t":"1-line Master Formula: Normal incidence radiation pressure **$P = \\dfrac{I}{c}(1 + r)$**, jahan $r$ reflectance ($0 \\le r \\le 1$) hai! $r = 0 \\to \\dfrac{I}{c}$, $r = 1 \\to \\dfrac{2I}{c}$, aur $r = 0.6 \\to 1.6\\dfrac{I}{c}$!","sim":""},{"id":41,"q":"A fish is vertically below a flying bird moving vertically down toward water surface. The bird will appear to the fish to be","fig":"q41","opt":["moving faster than its speed and also away from the real distance","moving faster than its real speed and nearer than its real distance","moving slower than its real speed and also nearer than its real distance","moving slower than its real speed and away from the real distance"],"ans":0,"c":"Jab light **rarer medium (air, $\\mu_1 = 1$) se denser medium (water, $\\mu_2 = \\mu > 1$)** me jaati hai aur observer paani ke andar (fish) hota hai, toh normal की ओर झुकती rays peeche badhane par apparent height asali height se **badi** dikhti hai: $h_{\\mathrm{app}} = \\mu h_{\\mathrm{real}}$.","m":"Apparent height formula $h_{\\mathrm{app}} = \\mu h$ ko time $t$ ke sapeksh differentiate karke apparent speed $v_{\\mathrm{app}} = \\mu v_{\\mathrm{real}}$ nikal lenge ($\\mu_{\\text{water}} = \\dfrac{4}{3} > 1$).","s":["Water surface se bird ki real height $h$ ho toh fish ko dikhne wali apparent height: $h_{\\mathrm{app}} = \\mu h$","Chunki $\\mu = \\dfrac{4}{3} > 1$, isliye $h_{\\mathrm{app}} > h$ — bird asali doori se **zyada door (away)** dikhegi!","Time ke respect me differentiate karein: $\\dfrac{dh_{\\mathrm{app}}}{dt} = \\mu\\dfrac{dh}{dt} \\implies v_{\\mathrm{app}} = \\mu v_{\\mathrm{real}}$","Chunki $\\mu > 1$, $v_{\\mathrm{app}} > v_{\\mathrm{real}}$ — bird apni asali speed se **zyada tezi (faster)** se aati dikhegi! ($\\color{#7ee2b8}{\\text{Option A}}$)"],"r":"Fish ko bird apni asali speed se **faster** aur asali doori se **farther away** dikhegi.","w":["**Option B:** Speed sahi hai par distance 'nearer' galat likha hai ('nearer' tab hota hai jab bird paani ke bahar se fish ko dekhe!).","**Option C:** 'Slower' aur 'nearer' dono ulte hain — ye bird ko fish kaisi dikhti hai ($h/\\mu, v/\\mu$), uska jawab hai!","**Option D:** Apparent distance sahi hai par speed 'slower' galat hai."],"t":"Symmetric shortcut: **Air se Water me dekho** $\\implies$ sab $\\div \\mu$ (nearer & slower); **Water se Air me dekho** $\\implies$ sab $\\times \\mu$ (**farther & faster**)!","sim":""},{"id":42,"q":"A solenoid with $1000$ turns per meter and current $2\\,\\mathrm{A}$ has a core with relative permeability $\\mu_r = 200$. What is the magnetic field $B$ inside?","fig":"q42","opt":["$0.1\\,\\mathrm{T}$","$0.8\\,\\mathrm{T}$","$0.5\\,\\mathrm{T}$","$1.6\\,\\mathrm{T}$"],"ans":2,"c":"Ferromagnetic/paramagnetic core (relative permeability $\\mu_r$) wale lambe solenoid ke bhitar magnetic field $B = \\mu_0 \\mu_r n I$ hota hai, jahan $n$ प्रति मीटर turns ki sankhya hai.","m":"$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{T\\,m\\,A^{-1}}$, $\\mu_r = 200$, $n = 1000\\,\\mathrm{m^{-1}}$, aur $I = 2\\,\\mathrm{A}$ seedha $B = \\mu_0 \\mu_r n I$ me rakhenge.","s":["Solenoid magnetic field formula: $B = \\mu_0 \\mu_r n I$","Values rakhein: $B = (4\\pi \\times 10^{-7}) \\times 200 \\times 1000 \\times 2\\,\\mathrm{T}$","Powers aur integers alag gunaa karein: $4 \\times 2 \\times 2 \\times \\pi \\times 10^{-7 + 2 + 3} = 16\\pi \\times 10^{-2}\\,\\mathrm{T}$","$\\pi \\approx 3.1416$ rakhein: $B = 0.16 \\times 3.1416 = 0.5026\\,\\mathrm{T} \\approx \\color{#7ee2b8}{0.5\\,\\mathrm{T}}$"],"r":"Solenoid ke andar magnetic field $0.5\\,\\mathrm{T}$ hai.","w":["**Option A ($0.1\\,\\mathrm{T}$):** $\\pi \\approx 3.14$ aur $2\\,\\mathrm{A}$ factor chhootne se $0.16$ ke aas-paas round karne ki galti hai.","**Option B ($0.8\\,\\mathrm{T}$):** $\\pi$ ko $5$ ke aas-paas galat gunaa karne se aata hai.","**Option D ($1.6\\,\\mathrm{T}$):** $\\pi$ bhool kar $16 \\times 10^{-1} = 1.6\\,\\mathrm{T}$ likhne se aata hai!"],"t":"$0.16 \\times \\pi$: yaad rakhein $16 \\times 3 = 48 \\implies 0.48 + 0.02 = \\mathbf{0.50\\,\\mathrm{T}}$ — ek second me exact calculation!","sim":""},{"id":43,"q":"A convex lens is made of glass of refractive index $1.5$. If radius of curvature of each of its two surfaces is $20\\,\\mathrm{cm}$, find the ratio of the power of the lens, when placed in air to its power, when immersed inside a liquid of refractive index $1.25$.","fig":"q43","opt":["$\\dfrac{2}{5}$","$\\dfrac{5}{2}$","$\\dfrac{4}{3}$","$\\dfrac{4}{9}$"],"ans":1,"c":"**Lens Maker's Formula** ke anusaar surrounding medium $\\mu_m$ me lens ki optical power $P = \\dfrac{1}{f} = \\left(\\dfrac{\\mu_g}{\\mu_m} - 1\\right)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$ hoti hai.","m":"Gaur karein ki ratio $\\dfrac{P_{\\mathrm{air}}}{P_{\\mathrm{liquid}}}$ lete hi geometry factor $\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$ poora cancel ho jaata hai! Hum $R = 20\\,\\mathrm{cm}$ se individual powers ($5\\,\\mathrm{D}$ aur $2\\,\\mathrm{D}$) bhi nikalenge aur direct ratio se verify bhi karenge.","s":["Air ($\\mu_m = 1$) me power ($R_1 = +0.20\\,\\mathrm{m}, R_2 = -0.20\\,\\mathrm{m}$): $P_1 = (1.5 - 1)\\left(\\dfrac{1}{0.20} - \\dfrac{1}{-0.20}\\right) = 0.5 \\times 10 = 5\\,\\mathrm{D}$","Liquid ($\\mu_l = 1.25$) me glass ka relative refractive index: $\\mu' = \\dfrac{1.5}{1.25} = \\dfrac{6}{5} = 1.2$","Liquid me lens power: $P_2 = (1.2 - 1) \\times 10 = 0.2 \\times 10 = 2\\,\\mathrm{D}$","Ratio lein: $\\dfrac{P_1}{P_2} = \\color{#7ee2b8}{\\dfrac{5}{2}}$"],"r":"Air aur liquid me lens powers ka ratio $\\dfrac{5}{2}$ hai.","w":["**Option A ($\\dfrac{2}{5}$):** Ulta ratio $\\dfrac{P_{\\mathrm{liquid}}}{P_{\\mathrm{air}}}$ le lene se $\\dfrac{2}{5}$ aata hai! (Power liquid me **ghatti** hai, isliye $\\dfrac{P_1}{P_2} > 1$ hona zaroori hai!)","**Option C ($\\dfrac{4}{3}$):** Refractive indices ka sidha anupaat lene ki galti se aata hai.","**Option D ($\\dfrac{4}{9}$):** Galat subtraction $(1.5 - 1.25)$ bina $\\mu_l$ divide kiye lene se aata hai."],"t":"$2$-second shortcut: $\\dfrac{P_{\\mathrm{air}}}{P_{\\mathrm{liq}}} = \\dfrac{\\mu_g - 1}{\\dfrac{\\mu_g}{\\mu_l} - 1}$ ($R = 20\\,\\mathrm{cm}$ chhoone ki bhi zaroorat nahi!) $= \\dfrac{0.5}{0.2} = \\dfrac{5}{2}$!","sim":"lens_liquid"},{"id":44,"q":"Two polaroids are placed in the path of unpolarized beam of intensity $I_0$ such that no light is emitted from the second polaroid. If a third polaroid whose polarization axis makes an angle $\\theta$ with the polarization axis of first polaroid is placed between these polaroids then the intensity of light emerging from the last polaroid will be","fig":"q44","opt":["$\\left(\\dfrac{I_0}{8}\\right)\\sin^2 2\\theta$","$\\left(\\dfrac{I_0}{4}\\right)\\sin^2 2\\theta$","$\\left(\\dfrac{I_0}{2}\\right)\\cos^4\\theta$","$I_0\\cos^4\\theta$"],"ans":0,"c":"**Unpolarized light** ($I_0$) jab pehle polaroid $P_1$ se guzarti hai toh transmitted intensity **aadhi ($I_1 = \\dfrac{I_0}{2}$)** ho jaati hai! Pehle do polaroids se zero light nikalne ka arth hai $P_1 \\perp P_2$ ($90^\\circ$ crossed). Beech me rakhe polaroid $P_3$ par **Malus's Law** ($I = I_{\\mathrm{in}}\\cos^2\\phi$) lagta hai.","m":"Kram se teenon polaroids ($P_1 \\to P_3 \\to P_2$) se guzarne par intensity step-by-step likhenge aur trigonometric identity $\\sin 2\\theta = 2\\sin\\theta\\cos\\theta$ lagayenge.","s":["**$P_1$ ke baad:** Unpolarized beam se plane-polarized intensity $I_1 = \\dfrac{I_0}{2}$","**Beech wale $P_3$ (angle $\\theta$ with $P_1$) ke baad:** Malus's law se $I_3 = I_1\\cos^2\\theta = \\dfrac{I_0}{2}\\cos^2\\theta$","**Aakhiri $P_2$ ($P_1$ se $90^\\circ$, toh $P_3$ se angle $= 90^\\circ - \\theta$) ke baad:** $I_2 = I_3\\cos^2(90^\\circ - \\theta) = \\dfrac{I_0}{2}\\cos^2\\theta\\sin^2\\theta$","$\\sin 2\\theta = 2\\sin\\theta\\cos\\theta \\implies \\sin\\theta\\cos\\theta = \\dfrac{\\sin 2\\theta}{2}$ rakhein: $I_2 = \\dfrac{I_0}{2}\\left(\\dfrac{\\sin 2\\theta}{2}\\right)^2 = \\color{#7ee2b8}{\\left(\\dfrac{I_0}{8}\\right)\\sin^2 2\\theta}$"],"r":"Aakhiri polaroid se nikalne wali light ki intensity $\\left(\\dfrac{I_0}{8}\\right)\\sin^2 2\\theta$ hogi.","w":["**Option B ($\\left(\\dfrac{I_0}{4}\\right)\\sin^2 2\\theta$):** Pehle polaroid par unpolarized light ka $\\dfrac{1}{2}$ factor bhoolne se $\\dfrac{I_0}{4}$ galat aata hai!!","**Option C ($\\left(\\dfrac{I_0}{2}\\right)\\cos^4\\theta$):** $P_2$ ko $P_1$ ke perpendicular lene ke bajay parallel ($0^\\circ$) maan lene se aata hai.","**Option D ($I_0\\cos^4\\theta$):** $\\dfrac{1}{2}$ factor aur $90^\\circ - \\theta$ dono bhoolne se aata hai."],"t":"NEET ka #1 optical trap **Option B ($\\dfrac{I_0}{4}\\sin^2 2\\theta$)** vs **Option A ($\\dfrac{I_0}{8}\\sin^2 2\\theta$)** hai: agar incoming beam **unpolarized** hai toh $\\dfrac{I_0}{8}\\sin^2 2\\theta$, aur agar pehle se **polarized** hoti tab $\\dfrac{I_0}{4}\\sin^2 2\\theta$ hota!","sim":"polaroids"},{"id":45,"q":"An electron of mass $m$ when accelerated through a potential difference has de-Broglie wavelength $\\lambda$. The de-Broglie wavelength associated with a proton of mass $M$ accelerated through the same potential difference will be","fig":"","opt":["$\\lambda\\dfrac{m}{M}$","$\\lambda\\sqrt{\\dfrac{m}{M}}$","$\\lambda\\dfrac{M}{m}$","$\\lambda\\sqrt{\\dfrac{M}{m}}$"],"ans":1,"c":"Charge magnitude $q$ wale particle ko potential difference $V$ se accelerate karne par kinetic energy $K = qV$ aur momentum $p = \\sqrt{2m_0 qV}$ milta hai. Isliye de-Broglie wavelength $\\lambda = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2m_0 qV}}$ hoti hai.","m":"Electron ($|-e| = e$) aur proton ($|+e| = e$) dono par charge magnitude **$q = e$ bilkul barabar** aur potential difference $V$ same hai, isliye $\\lambda \\propto \\dfrac{1}{\\sqrt{\\text{mass}}}$ lagayenge!","s":["Electron (mass $m$) ke liye: $\\lambda = \\dfrac{h}{\\sqrt{2 m e V}}$","Proton (mass $M$) ke liye: $\\lambda_p = \\dfrac{h}{\\sqrt{2 M e V}}$","Dono equations ko divide karein: $\\dfrac{\\lambda_p}{\\lambda} = \\sqrt{\\dfrac{2 m e V}{2 M e V}} = \\sqrt{\\dfrac{m}{M}}$","Multiply by $\\lambda$: $\\lambda_p = \\color{#7ee2b8}{\\lambda\\sqrt{\\dfrac{m}{M}}}$"],"r":"Proton ki de-Broglie wavelength $\\lambda\\sqrt{\\dfrac{m}{M}}$ hogi.","w":["**Option A ($\\lambda\\dfrac{m}{M}$):** Ye tab hota jab dono ki **speed $v$ barabar** di hoti ($\\lambda = \\dfrac{h}{mv}$), same accelerating voltage $V$ nahi!","**Option C ($\\lambda\\dfrac{M}{m}$):** Bhaari particle ki wavelength chhoti honi chahiye, jabki $M > m \\implies \\lambda\\dfrac{M}{m} > \\lambda$ bada deta hai.","**Option D ($\\lambda\\sqrt{\\dfrac{M}{m}}$):** Ratio ulta lene se proton ki wavelength electron se badi dikha raha hai jo galat hai."],"t":"Intuition check: Proton bhaari ($M \\gg m$) hai toh uski de-Broglie wavelength electron se **chhoti** hogi — aur same $V$ par square root aata hai $\\implies \\lambda\\sqrt{\\dfrac{m}{M}}$!","sim":""},{"id":46,"q":"Nitrogen has the electronic configuration $1s^2, 2s^2, 2p_x^1 2p_y^1 2p_z^1$ and not $1s^2, 2s^2 2p_x^2 2p_y^1, 2p_z^0$ which is determined by","fig":"","opt":["Aufbau's principle","Pauli's exclusion principle","Hund's rule","Uncertainty principle"],"ans":2,"c":"**Hund's Rule of Maximum Multiplicity** kehta hai ki same energy wale degenerate orbitals (jaise $2p_x, 2p_y, 2p_z$) me electrons ki pairing tab tak shuru nahi hoti jab tak har orbital me parallel spin ke saath ek-ek electron na bhar jaye — kyunki isse electron–electron repulsion minimum aur exchange energy maximum hoti hai!","m":"Yahan dono configurations me electrons $2p$ subshell me hi hain; farak sirf degenerate $2p$ orbitals me **singly occupy vs pairing** ka hai, jo seedha Hund's rule tay karta hai.","s":["Nitrogen ($Z = 7$) me $1s^2\\,2s^2$ ke baad $3$ electrons degenerate $2p$ orbitals ($2p_x, 2p_y, 2p_z$) me jaate hain","Agar $2p_x^2\\,2p_y^1\\,2p_z^0$ banta toh ek hi orbital $2p_x$ me do electrons ke beech coulombic repulsion badh jaata","**Hund's rule** ke anusaar teeno orbitals me ek-ek parallel spin electron ($2p_x^1\\,2p_y^1\\,2p_z^1$, half-filled extra stability!) rehta hai ($\\color{#7ee2b8}{\\text{Option C}}$)"],"r":"Ye electronic configuration **Hund's rule** dwara nirdharit hoti hai.","w":["**Option A (Aufbau's principle):** Ye subshells ke energy order ($1s < 2s < 2p < 3s$) ko batata hai, ek hi subshell ke degenerate orbitals ke andar pairing ko nahi.","**Option B (Pauli's exclusion principle):** $2p_x^2$ me opposite spins ($\\uparrow\\downarrow$) hone par Pauli rule violate nahi hota, isliye Pauli ise mana nahi karta!","**Option D (Uncertainty principle):** Ye $\\Delta x \\cdot \\Delta p \\ge \\dfrac{h}{4\\pi}$ batata hai, orbital electron filling nahi."],"t":"Farak pakka rakhein: $\\uparrow\\uparrow$ ek hi box me ho $\\to$ **Pauli violated**; $2s$ khali chhodkar $2p$ bhara $\\to$ **Aufbau violated**; khali $2p_z$ chhodkar $2p_x^2$ pair kiya $\\to$ **Hund violated**!","sim":""},{"id":47,"q":"Incorrect statement is :-","fig":"","opt":["Total energy of electron in third orbit of $\\ce{Li^{2+}}$ ion is $-6.8\\,\\mathrm{eV}$","Potential energy of $\\ce{e-}$ in second orbit of hydrogen atom is $6.8\\,\\mathrm{eV}$","Kinetic energy of $\\ce{e-}$ in third orbit of $\\ce{He+}$ is equal to $-13.6\\,\\mathrm{eV}$","All of the above are wrong"],"ans":3,"c":"Bohr's atomic model me single-electron species ($\\ce{H}, \\ce{He+}, \\ce{Li^{2+}}$) ke $n\\text{th}$ orbit ke liye teeno energies ka pakka rishta hota hai: $\\mathrm{TE}_n = -13.6\\dfrac{Z^2}{n^2}\\,\\mathrm{eV}$ (hamesha negative), $\\mathrm{KE}_n = -\\mathrm{TE}_n = +13.6\\dfrac{Z^2}{n^2}\\,\\mathrm{eV}$ (**hamesha positive!**), aur $\\mathrm{PE}_n = 2\\,\\mathrm{TE}_n = -27.2\\dfrac{Z^2}{n^2}\\,\\mathrm{eV}$ (**hamesha negative!**).","m":"Jaldi me pehla galat statement dekhkar rukna nahi hai kyunki Option D **'All of the above are wrong'** diya hai! Isliye (A), (B), aur (C) teeno ko calculate karke check karenge!","s":["**Check A ($\\ce{Li^{2+}}$, $Z = 3, n = 3$):** $\\mathrm{TE} = -13.6 \\times \\dfrac{3^2}{3^2} = -13.6 \\times 1 = -13.6\\,\\mathrm{eV} \\ne -6.8\\,\\mathrm{eV}$ $\\implies$ **Galat!**","**Check B ($\\ce{H}$, $Z = 1, n = 2$):** $\\mathrm{TE}_2 = -13.6 \\times \\dfrac{1^2}{2^2} = -3.4\\,\\mathrm{eV} \\implies \\mathrm{PE}_2 = 2(-3.4) = -6.8\\,\\mathrm{eV} \\ne +6.8\\,\\mathrm{eV}$ $\\implies$ **Galat!**","**Check C ($\\ce{He+}$, $Z = 2, n = 3$):** $\\mathrm{KE}_3 = +13.6 \\times \\dfrac{2^2}{3^2} = +6.04\\,\\mathrm{eV}$ (aur kinetic energy kabhi bhi negative $-13.6\\,\\mathrm{eV}$ ho hi nahi sakti!) $\\implies$ **Galat!**","Chunki A, B, aur C **teeno hi statements galat hain**, isliye $\\color{#7ee2b8}{\\text{Option D (All of the above are wrong)}}$ hi complete aur sahi uttar hai!"],"r":"Teeno statements (A, B, C) galat hone ke karan **Option D (All of the above are wrong)** sahi jawab hai.","w":["**Option A:** Akela tick karna adhoora hoga kyunki $\\mathrm{TE}(\\ce{Li^{2+}}, n=3) = -13.6\\,\\mathrm{eV}$ ke saath B aur C bhi galat hain.","**Option B:** Sign error ($-6.8\\,\\mathrm{eV}$ vs $+6.8\\,\\mathrm{eV}$) toh hai hi, par A aur C bhi galat hain.","**Option C:** Kinetic energy kabhi negative nahi hoti, par A aur B bhi galat hone se Option D sabko cover karta hai."],"t":"Golden Exam Rule: Jab bhi **'All of the above'** option dikhe, pehle ek option check karke OMR kabhi mat bharo — kam se kam **do** options zaroor check karo!","sim":"bohr"},{"id":48,"q":"$25.4\\,\\mathrm{g}$ of iodine and $14.2\\,\\mathrm{g}$ of chlorine are made to react completely to yield a mixture of $\\ce{ICl}$ and $\\ce{ICl3}$. Ratio of moles of $\\ce{ICl}$ & $\\ce{ICl3}$ formed is (Atomic mass: $\\ce{I} = 127, \\ce{Cl} = 35.5$)","fig":"","opt":["$1 : 1$","$1 : 2$","$1 : 3$","$2 : 3$"],"ans":0,"c":"**Principle of Atom Conservation (POAC)** ke anusaar jab reactants **completely** react karke products banate hain, toh reaction se pehle aur baad me $\\ce{I}$ atoms ke kul moles aur $\\ce{Cl}$ atoms ke kul moles bilkul barabar rehte hain!","m":"Balanced equation ke झंझट ke bina POAC lagayenge! Maan lein $x\\,\\mathrm{mol}\\;\\ce{ICl}$ aur $y\\,\\mathrm{mol}\\;\\ce{ICl3}$ bante hain.","s":["Moles of $\\ce{I2} = \\dfrac{25.4}{2 \\times 127} = \\dfrac{25.4}{254} = 0.1\\,\\mathrm{mol} \\implies$ Moles of $\\ce{I}$ atoms $= 2 \\times 0.1 = 0.2\\,\\mathrm{mol}$","Moles of $\\ce{Cl2} = \\dfrac{14.2}{2 \\times 35.5} = \\dfrac{14.2}{71} = 0.2\\,\\mathrm{mol} \\implies$ Moles of $\\ce{Cl}$ atoms $= 2 \\times 0.2 = 0.4\\,\\mathrm{mol}$","$\\ce{I}$ atoms par POAC: $1(x) + 1(y) = 0.2$ ...(i)","$\\ce{Cl}$ atoms par POAC: $1(x) + 3(y) = 0.4$ ...(ii)","(ii) $-$ (i) ghataein: $2y = 0.2 \\implies y = 0.1\\,\\mathrm{mol}$, aur $x = 0.2 - 0.1 = 0.1\\,\\mathrm{mol} \\implies x : y = 0.1 : 0.1 = \\color{#7ee2b8}{1 : 1}$"],"r":"$\\ce{ICl}$ aur $\\ce{ICl3}$ ke moles ka ratio $1 : 1$ hai.","w":["**Option B ($1 : 2$):** $\\ce{I2} : \\ce{Cl2}$ ka reactant mole ratio $0.1 : 0.2 = 1 : 2$ hi galti se product ratio samajh lene se aata hai!!","**Option C ($1 : 3$):** $\\ce{Cl}$ atoms ki sankhya ($1$ aur $3$) dekhkar andaze se tick karne par aata hai.","**Option D ($2 : 3$):** Atomic weight aur molecular weight ($127$ vs $254$) mix karne se aata hai."],"t":"1-line equation check: $\\ce{I2 + 2Cl2 -> ICl + ICl3}$! Dekho left me $2\\;\\ce{I}, 4\\;\\ce{Cl}$ aur right me $2\\;\\ce{I}, 4\\;\\ce{Cl}$ — $0.1\\,\\mathrm{mol}\\;\\ce{I2} + 0.2\\,\\mathrm{mol}\\;\\ce{Cl2}$ seedha $0.1\\,\\mathrm{mol}\\;\\ce{ICl} + 0.1\\,\\mathrm{mol}\\;\\ce{ICl3}$ ($1:1$) deta hai!","sim":""},{"id":49,"q":"A compound contains $10^{-2}\\%$ of phosphorus. If atomic mass of phosphorus is $31$, the molar mass of the compound having one phosphorus atom per molecule is :","fig":"","opt":["$31$","$31 \\times 10^{2}$","$31 \\times 10^{4}$","$31 \\times 10^{3}$"],"ans":2,"c":"Kisi compound me element ka mass percentage formula hota hai: $\\% \\text{ of element} = \\dfrac{\\text{Atomicity} \\times \\text{Atomic mass}}{\\text{Molar mass } (M)} \\times 100$.","m":"Har molecule me $1$ phosphorus atom hai ($\\text{atomicity} = 1$), isliye $M = \\dfrac{1 \\times 31 \\times 100}{10^{-2}}$ me rakhkar $10$ ki powers aaram se jodeinge.","s":["Mass percentage relation likhein: $10^{-2} = \\dfrac{1 \\times 31}{M} \\times 100$","$M$ ke liye rearrange karein: $M = \\dfrac{31 \\times 10^{2}}{10^{-2}}$","Exponent upar le jayein: $M = 31 \\times 10^{2 - (-2)} = \\color{#7ee2b8}{31 \\times 10^{4}}\\,\\mathrm{g\\,mol^{-1}}$"],"r":"Compound ka molar mass $31 \\times 10^{4}\\,\\mathrm{g\\,mol^{-1}}$ hai.","w":["**Option A ($31$):** Percentage aur $100$ dono bhoolne se sirf atomic mass bach gaya.","**Option B ($31 \\times 10^{2}$):** $\\%$ ka $\\times 100$ bhool kar $10^{-2}$ ko fraction $0.01$ hi samajh lene se $31 / 10^{-2} = 31 \\times 10^{2}$ aata hai!!","**Option D ($31 \\times 10^{3}$):** Ek zero chhoot jaane ki galti se aata hai."],"t":"Trap alert: **$10^{-2}\\%$ ka matlab $10^{-2}$ nahi, balki $\\dfrac{10^{-2}}{100} = 10^{-4}$ mass fraction** hota hai — **Option B** isi galti par banaya gaya trap hai!","sim":""},{"id":50,"q":"If $6 \\times 10^{-3}\\,\\mathrm{mol}\\;\\ce{K2Cr2O7}$ reacts completely with $9 \\times 10^{-3}\\,\\mathrm{mol}$ of $\\ce{X^{n+}}$ to give $\\ce{XO3-}$ and $\\ce{Cr^{3+}}$, then the value of $n$ is","fig":"","opt":["$1$","$2$","$3$","$5$"],"ans":0,"c":"**Law of Chemical Equivalence** ke anusaar किसी bhi redox reaction me oxidising agent dwara liye gaye total equivalents reducing agent dwara diye gaye total equivalents ke barabar hote hain: $n_1 \\times \\text{v.f.}_1 = n_2 \\times \\text{v.f.}_2$.","m":"$\\ce{K2Cr2O7 -> 2Cr^{3+}}$ me $2$ $\\ce{Cr}$ atoms $+6$ se $+3$ me jaate hain toh $n$-factor $= 2 \\times (6 - 3) = 6$; aur $\\ce{XO3-}$ me $\\ce{X}$ ki oxidation state $+5$ hai toh $\\ce{X^{n+}}$ ka $n$-factor $= (5 - n)$.","s":["$\\ce{K2Cr2O7}$ me $\\ce{Cr}$ ki O.S. $= +6 \\to \\ce{Cr^{3+}}$ ($+3$); प्रति मोल $2\\;\\ce{Cr}$ atoms ke liye $n\\text{-factor} = 2 \\times 3 = 6$","$\\ce{XO3-}$ me $\\ce{X}$ ki O.S.: $x + 3(-2) = -1 \\implies x = +5$; toh $\\ce{X^{n+} -> X^{+5}}$ ke liye $n\\text{-factor} = (5 - n)$","Gram equivalents barabar rakhein: $(6 \\times 10^{-3}) \\times 6 = (9 \\times 10^{-3}) \\times (5 - n)$","$10^{-3}$ cancel karein: $36 = 9(5 - n) \\implies 5 - n = \\dfrac{36}{9} = 4 \\implies n = 5 - 4 = \\color{#7ee2b8}{1}$"],"r":"$n$ ka maan $1$ ($\\ce{X+}$) hai.","w":["**Option B ($2$):** $\\ce{K2Cr2O7}$ ka $n$-factor $6$ ki jagah $3$ (ek $\\ce{Cr}$ atom bhool kar!) le lene se $18 = 9(5-n) \\implies n = 3$ ya calculation slip hoti hai.","**Option C ($3$):** Single $\\ce{Cr}$ ka change $3$ lene se $5 - n = 2 \\implies n = 3$ galat aata hai!!","**Option D ($5$):** $n = 5$ hone par $\\ce{X^{+5}}$ ka koi oxidation hi nahi hota ($5 - 5 = 0$)."],"t":"Classic mistake **Option C ($n = 3$)**: $\\ce{K2Cr2O7}$ me **DO $\\ce{Cr}$ atoms** hote hain, isliye acidic medium me $\\ce{K2Cr2O7}$ ka $n$-factor hamesha **$6$** hota hai, $3$ nahi!","sim":""},{"id":51,"q":"Match the oxidation number of underlined elements of List-I with List-II:<table class=\"q-table\"><tr><th><\/th><th>List-I<\/th><th><\/th><th>List-II<\/th><\/tr><tr><td>(P)<\/td><td>$\\ce{H2S2\\underline{O}8}$<\/td><td>(1)<\/td><td>$+1$<\/td><\/tr><tr><td>(Q)<\/td><td>$\\ce{Fe\\underline{S}2}$<\/td><td>(2)<\/td><td>$-2$<\/td><\/tr><tr><td>(R)<\/td><td>$\\ce{K2\\underline{Cr}2O7}$<\/td><td>(3)<\/td><td>$+6$<\/td><\/tr><tr><td>(S)<\/td><td>$\\ce{CaO\\underline{Cl}2}$<\/td><td>(4)<\/td><td>$-1$<\/td><\/tr><\/table>The correct option is :","fig":"","opt":["$\\mathrm{P} \\to 1,2;\\; \\mathrm{Q} \\to 1;\\; \\mathrm{R} \\to 4;\\; \\mathrm{S} \\to 3$","$\\mathrm{P} \\to 2,4;\\; \\mathrm{Q} \\to 4;\\; \\mathrm{R} \\to 3;\\; \\mathrm{S} \\to 1,4$","$\\mathrm{P} \\to 3;\\; \\mathrm{Q} \\to 1,3;\\; \\mathrm{R} \\to 2;\\; \\mathrm{S} \\to 1$","$\\mathrm{P} \\to 1,2;\\; \\mathrm{Q} \\to 1;\\; \\mathrm{R} \\to 2,3;\\; \\mathrm{S} \\to 3$"],"ans":1,"c":"Average formula ke bajay **individual oxidation number** nikalne ke liye special molecules ki real bonding dekhni chahiye: Marshall's acid ($\\ce{H2S2O8}$) me ek peroxide $\\ce{-O-O-}$ bridge hoti hai, iron pyrite ($\\ce{FeS2}$) me persulphide $\\ce{S2^{2-}}$ ion hota hai, aur bleaching powder ($\\ce{Ca(OCl)Cl}$) me $\\ce{OCl-}$ aur $\\ce{Cl-}$ dono ions hote hain!","m":"Har compound me underlined atom ki individual oxidation states nikalenge aur List-II se match karenge.","s":["**(P) $\\ce{H2S2\\underline{O}8}$ (Peroxydisulphuric acid):** $8$ oxygens me se $6$ normal oxide oxygens ($-2$) aur $2$ peroxide bridge oxygens ($-1$) hote hain $\\implies \\mathrm{P} \\to 2, 4$","**(Q) $\\ce{Fe\\underline{S}2}$ (Fool's gold, $\\ce{Fe^{2+}(^-S-S^-)}$):** Persulphide linkage me pratyek $\\ce{S}$ ki oxidation state $-1$ hoti hai $\\implies \\mathrm{Q} \\to 4$","**(R) $\\ce{K2\\underline{Cr}2O7}$:** Dono $\\ce{Cr}$ equivalent hain aur $2(+1) + 2x + 7(-2) = 0 \\implies x = +6 \\implies \\mathrm{R} \\to 3$","**(S) $\\ce{CaO\\underline{Cl}2}$ ($\\ce{Ca^{2+}[OCl-][Cl-]}$):** Hypochlorite $\\ce{OCl-}$ wale $\\ce{Cl}$ ki O.S. $= +1$ aur chloride $\\ce{Cl-}$ wale $\\ce{Cl}$ ki O.S. $= -1 \\implies \\mathrm{S} \\to 1, 4$ ($\\color{#7ee2b8}{\\text{Option B}}$)"],"r":"Sahi milan $\\mathrm{P} \\to 2,4;\\; \\mathrm{Q} \\to 4;\\; \\mathrm{R} \\to 3;\\; \\mathrm{S} \\to 1,4$ (**Option B**) hai.","w":["**Option A:** $\\ce{K2Cr2O7}$ me $\\ce{Cr}$ ko $-1$ diya hai jo bilkul asambhav hai.","**Option C:** $\\ce{H2S2O8}$ me underlined $\\ce{O}$ ko galti se $\\ce{S}$ ($+6 \\to 3$) padh lene par aata hai!","**Option D:** $\\ce{FeS2}$ aur $\\ce{CaOCl2}$ dono ke individual oxidation numbers galat hain."],"t":"NCERT Redox chapter ke chaaro VIP exceptions ek hi sawal me hain: $\\ce{H2S2O8}$ ($6\\,\\ce{O}$ at $-2$, $2\\,\\ce{O}$ at $-1$), $\\ce{FeS2}$ ($\\ce{S} = -1$), aur $\\ce{CaOCl2}$ ($\\ce{Cl} = +1, -1$)!","sim":""},{"id":52,"q":"The enthalpy changes for two reactions are given by the equations:<br>$2\\ce{Cr(s)} + \\dfrac{3}{2}\\ce{O2(g) -> Cr2O3(s)},\\quad \\Delta H = -1130\\,\\mathrm{kJ}$<br>$\\ce{C(s)} + \\dfrac{1}{2}\\ce{O2(g) -> CO(g)},\\quad \\Delta H = -110\\,\\mathrm{kJ}$<br>What is the enthalpy change (in $\\mathrm{kJ}$) for the reaction $3\\ce{C(s) + Cr2O3(s) -> 2Cr(s) + 3CO(g)}$?","fig":"","opt":["$-1460\\,\\mathrm{kJ}$","$800\\,\\mathrm{kJ}$","$-800\\,\\mathrm{kJ}$","$-500\\,\\mathrm{kJ}$"],"ans":1,"c":"**Hess's Law of Constant Heat Summation** ke anusaar enthalpy $H$ ek state function hai, isliye chemical equations ko algebra ki tarah multiply, reverse, aur add karke target reaction ka $\\Delta H$ nikala ja sakta hai.","m":"Target reaction me $\\ce{Cr2O3(s)}$ reactant side par ($1\\,\\mathrm{mol}$) aur $\\ce{CO(g)}$ product side par ($3\\,\\mathrm{mol}$) chahiye — isliye **Equation $(2) \\times 3 - \\text{Equation }(1)$** karenge!","s":["Equation $(2)$ ko $3$ se multiply karein: $3\\ce{C(s)} + \\dfrac{3}{2}\\ce{O2(g) -> 3CO(g)}, \\quad \\Delta H_a = 3 \\times (-110) = -330\\,\\mathrm{kJ}$","Equation $(1)$ ko reverse karein (sign palat jayega!): $\\ce{Cr2O3(s) -> 2Cr(s)} + \\dfrac{3}{2}\\ce{O2(g)}, \\quad \\Delta H_b = +1130\\,\\mathrm{kJ}$","Dono ko jodein ($\\dfrac{3}{2}\\ce{O2(g)}$ dono taraf cancel!): $3\\ce{C(s) + Cr2O3(s) -> 2Cr(s) + 3CO(g)}$","$\\Delta H = \\Delta H_a + \\Delta H_b = -330 + 1130 = \\color{#7ee2b8}{+800\\,\\mathrm{kJ}}$"],"r":"Reaction ka enthalpy change $+800\\,\\mathrm{kJ}$ hai.","w":["**Option A ($-1460\\,\\mathrm{kJ}$):** Equation $(1)$ ko reverse kiye bina seedha $-1130 + (-330) = -1460\\,\\mathrm{kJ}$ jod dene se aata hai!!","**Option C ($-800\\,\\mathrm{kJ}$):** Reverse sign galti se $-1130 + 330 = -800\\,\\mathrm{kJ}$ likhne se aata hai!","**Option D ($-500\\,\\mathrm{kJ}$):** Arithmetic galti se aata hai."],"t":"Plus/Minus sign double check: $\\ce{Cr2O3}$ bahut stable oxide hai ($\\Delta_f H = -1130\\,\\mathrm{kJ}$), use carbon se todne (smelting) ke liye bhatti me **bhaari garmi deni padti hai (endothermic, $+\\mathbf{800\\,\\mathrm{kJ}}$)**!","sim":""},{"id":53,"q":"The reaction $\\ce{CHCl3(g) + Cl2(g) -> CCl4(g) + HCl(g)}$ occurred by this series of steps :<br>Step $1$: $\\ce{Cl2(g) <=> Cl(g) + Cl(g)}$<br>Step $2$: $\\ce{CHCl3(g) + Cl(g) -> CCl3(g) + HCl(g)}$<br>Step $3$: $\\ce{CCl3(g) + Cl(g) -> CCl4(g)}$<br>If this reaction is first order in $\\ce{CHCl3}$ and half order in $\\ce{Cl2}$, which statement from the following is correct?","fig":"","opt":["Step $1$ is the slowest","Step $1$ and $2$ both are slow","Step $2$ must be slower than step $1$ and step $3$","Step $3$ must be the slowest"],"ans":2,"c":"Multi-step reaction mechanism me overall rate **Rate Determining Step (RDS = slowest step)** dwara tay hota hai. Agar RDS me reactive intermediate (yahan $\\ce{Cl}$ free radical) aata hai, toh uski concentration isse pehle wale fast reversible step ke equilibrium constant $K_{\\mathrm{eq}}$ se replace ki jaati hai.","m":"Step $2$ ko slowest (RDS) aur Step $1$ ko fast pre-equilibrium maankar rate law derive karenge aur dekhenge ki experimental order $[\\ce{CHCl3}]^1[\\ce{Cl2}]^{1/2}$ milta hai ya nahi!","s":["Agar **Step $2$ slowest (RDS)** ho, toh elementary rate law: $r = k_2[\\ce{CHCl3}][\\ce{Cl}]$","Fast reversible Step $1$ ke equilibrium se: $K_1 = \\dfrac{[\\ce{Cl}]^2}{[\\ce{Cl2}]} \\implies [\\ce{Cl}] = K_1^{1/2}[\\ce{Cl2}]^{1/2}$","$[\\ce{Cl}]$ ko RDS rate law me rakhein: $r = k_2 K_1^{1/2}[\\ce{CHCl3}]^{1}[\\ce{Cl2}]^{1/2} = k_{\\mathrm{obs}}[\\ce{CHCl3}]^{1}[\\ce{Cl2}]^{1/2}$!","Ye $\\ce{CHCl3}$ me $1\\text{st}$ order aur $\\ce{Cl2}$ me $\\dfrac{1}{2}$ order se exact match karta hai $\\implies$ **Step $2$ hi Step $1$ aur Step $3$ dono se slow hona chahiye** ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"**Step $2$ must be slower than step $1$ and step $3$** (Option C).","w":["**Option A:** Agar Step $1$ slowest hota toh rate $= k_1[\\ce{Cl2}]^1[\\ce{CHCl3}]^0$ ($\\ce{CHCl3}$ me zero order!) hota.","**Option B:** Pre-equilibrium tabhi banta hai jab Step $1$ fast reversible ho aur Step $2$ slow bottleneck ho.","**Option D:** Step $3$ radical-radical combination ($\\Delta H < 0$, near-zero activation energy) hone se ultra-fast hota hai."],"t":"Fractional order $[\\ce{Cl2}]^{1/2}$ dekhte hi samajh jao: $\\ce{Cl2 <=> 2Cl}$ **fast pre-equilibrium** hai aur agla $\\ce{Cl}$ wala step **slow RDS** hai!","sim":""},{"id":54,"q":"The value of $\\log_{10} K$ approx for a reaction $\\ce{A <=> B}$ is:<br>Given: $\\Delta H^\\circ = -54.07\\,\\mathrm{kJ\\,mol^{-1}}$, $\\Delta S^\\circ = 10\\,\\mathrm{J\\,K^{-1}\\,mol^{-1}}$, $T = 298\\,\\mathrm{K}$ [$2.303 \\times 8.314 \\times 298 = 5705$]","fig":"","opt":["$5$","$10$","$95$","$100$"],"ans":1,"c":"Standard Gibbs free energy change $\\Delta G^\\circ$ enthalpy, entropy, aur equilibrium constant $K$ ko jodta hai: $\\Delta G^\\circ = \\Delta H^\\circ - T\\Delta S^\\circ = -2.303\\,RT\\log_{10} K$.","m":"**Sabse zaroori unit alert**: $\\Delta H^\\circ$ **$\\mathrm{kJ\\,mol^{-1}}$** me hai jabki $\\Delta S^\\circ$ aur $2.303\\,RT = 5705$ **$\\mathrm{J\\,mol^{-1}}$** me hain! Dono ko $\\mathrm{J\\,mol^{-1}}$ me rakhenge — numbers itne pyaare set kiye gaye hain ki exact $57050 / 5705 = 10$ katega!!","s":["$\\Delta H^\\circ$ ko $\\mathrm{J\\,mol^{-1}}$ me badlein: $\\Delta H^\\circ = -54.07 \\times 1000 = -54070\\,\\mathrm{J\\,mol^{-1}}$","$T\\Delta S^\\circ$ nikalein: $T\\Delta S^\\circ = 298\\,\\mathrm{K} \\times 10\\,\\mathrm{J\\,K^{-1}\\,mol^{-1}} = 2980\\,\\mathrm{J\\,mol^{-1}}$","$\\Delta G^\\circ = \\Delta H^\\circ - T\\Delta S^\\circ = -54070 - 2980 = -57050\\,\\mathrm{J\\,mol^{-1}}$!","Ab $\\Delta G^\\circ = -2.303\\,RT\\log_{10} K$ lagayein: $-57050 = -5705 \\times \\log_{10} K$","Divide karein: $\\log_{10} K = \\dfrac{\\cancel{57050}^{\\,10}}{\\cancel{5705}^{\\,1}} = \\color{#7ee2b8}{10}$"],"r":"$\\log_{10} K$ ka approximate maan $10$ hai.","w":["**Option A ($5$):** Half factor ya galat division karne se aata hai.","**Option C ($95$):** $\\mathrm{kJ}$ aur $\\mathrm{J}$ bina badle $(-54.07 - 2980)$ kar dene ya $T\\Delta S^\\circ$ ulta ghatane ($54070 - 2980$) se aata hai!","**Option D ($100$):** Ek zero extra laga dene ki galti se aata hai."],"t":"Examiner ki खूबसूरती dekho: $54070 + 2980 = \\mathbf{57050}$ aur bracket me hint diya hai **$5705$**! Jab number itna exact kate ($57050 \\div 5705 = 10$), samajh jao aapka answer $1000\\%$ sahi hai!","sim":""},{"id":55,"q":"What is the $\\mathrm{pH}$ at which $0.01\\,\\mathrm{M}\\;\\ce{Co^{2+}}$ ions in solution just precipitate as $\\ce{Co(OH)2}$? ($K_{\\mathrm{sp}}$ of $\\ce{Co(OH)2} = 25 \\times 10^{-16}$)","fig":"","opt":["$6.3$","$7.3$","$10.8$","$7.7$"],"ans":3,"c":"Sparingly soluble hydroxide $\\ce{Co(OH)2(s) <=> Co^{2+}(aq) + 2OH^-(aq)}$ ka precipitation theek us pal shuru hota hai jab **Ionic Product** solubility product $K_{\\mathrm{sp}}$ ke barabar pahunch jaye: $[\\ce{Co^{2+}}][\\ce{OH-}]^2 = K_{\\mathrm{sp}}$.","m":"Pehle $K_{\\mathrm{sp}}$ se threshold $[\\ce{OH-}]$ nikalenge, phir $\\mathrm{pOH} = -\\log_{10}[\\ce{OH-}]$ aur aakhir me **$\\mathrm{pH} = 14 - \\mathrm{pOH}$** (rukna mat — $\\mathrm{pOH} = 6.3$ Option A me trap rakha hua hai!!).","s":["Just-precipitation condition likhein: $[\\ce{Co^{2+}}][\\ce{OH-}]^2 = K_{\\mathrm{sp}}$","Values rakhein ($[\\ce{Co^{2+}}] = 0.01 = 10^{-2}\\,\\mathrm{M}$): $10^{-2} \\times [\\ce{OH-}]^2 = 25 \\times 10^{-16}$","Solve karein: $[\\ce{OH-}]^2 = 25 \\times 10^{-14} \\implies [\\ce{OH-}] = \\sqrt{25 \\times 10^{-14}} = 5 \\times 10^{-7}\\,\\mathrm{mol\\,L^{-1}}$","$\\mathrm{pOH}$ nikalein ($\\log_{10} 5 \\approx 0.70$): $\\mathrm{pOH} = -\\log_{10}(5 \\times 10^{-7}) = 7 - 0.70 = 6.3$","Ab $\\mathrm{pH}$ nikalein ($25^\\circ\\mathrm{C}$ par): $\\mathrm{pH} = 14 - \\mathrm{pOH} = 14 - 6.3 = \\color{#7ee2b8}{7.7}$"],"r":"$\\ce{Co(OH)2}$ ka precipitation $\\mathrm{pH} = 7.7$ par shuru hoga.","w":["**Option A ($6.3$):** **DEADLY TRAP!** $6.3$ **$\\mathrm{pOH}$** hai, **$\\mathrm{pH}$ nahi**!! $14$ me se ghatana bhoolte hi $-1$ mark pakka!","**Option B ($7.3$):** $7 + 0.3$ ya $14 - 6.7$ galat log subtraction karne se aata hai.","**Option C ($10.8$):** $[\\ce{OH-}]$ ka square root bhoolne ya stoichiometric power galat lene se aata hai."],"t":"**RED ALERT TRAP**: Jab bhi base/hydroxide ($\\ce{Mg(OH)2}, \\ce{Zn(OH)2}, \\ce{Co(OH)2}$) ki $\\mathrm{pH}$ poochhi jaye, examiner **Option A me hamesha $\\mathrm{pOH}$ ($6.3$) rakhta hai**! Aakhiri step $\\mathrm{pH} = 14 - \\mathrm{pOH} = 7.7$ kabhi mat bhoolna!","sim":"solubility_ph"},{"id":56,"q":"In a closed container two reactions take place simultaneously:<br>$\\ce{PCl5(g) <=> PCl3(g) + Cl2(g)}$ and<br>$\\ce{CO(g) + Cl2(g) <=> COCl2(g)}$<br>On adding more $\\ce{CO}$ into the container, select the correct options :<br>(i) Degree of dissociation of $\\ce{PCl5(g)}$ decreases.<br>(ii) Conc. of $\\ce{CO(g)}$ at new equilibrium position is less than that of at initial equilibrium conc.<br>(iii) Degree of dissociation of $\\ce{PCl5(g)}$ increases.","fig":"","opt":["Only (i)","Only (iii)","Both (i) and (ii)","Both (ii) and (iii)"],"ans":1,"c":"**Le Chatelier's Principle** ke do golden rules yahan lagte hain: (1) Coupled equilibria me common species ($\\ce{Cl2}$) consume hone par pehli equilibrium forward khinchti hai, aur (2) Jis substance ($\\ce{CO}$) ko bahar se add kiya gaya hai, equilibrium shift us badhotari ko **partially** kam karta hai — kabhi poora khatam nahi kar sakta, isliye $[\\ce{CO}]_{\\text{new eq}} > [\\ce{CO}]_{\\text{old eq}}$ hamesha rehta hai!","m":"Extra $\\ce{CO}$ daalne ka asar pehle reaction $(2)$ par aur phir common gas $\\ce{Cl2}$ ke zariye reaction $(1)$ par step-by-step dekhenge.","s":["Container me extra $\\ce{CO(g)}$ daalne par second equilibrium $\\ce{CO(g) + Cl2(g) <=> COCl2(g)}$ **forward** shift hoti hai, jisse $\\ce{Cl2(g)}$ kharch hota hai ($[\\ce{Cl2}]$ ghat-ta hai)","$[\\ce{Cl2(g)}]$ ghatne se first equilibrium $\\ce{PCl5(g) <=> PCl3(g) + Cl2(g)}$ bhi $\\ce{Cl2}$ ki kami poori karne ke liye **forward** shift hoti hai $\\implies$ $\\ce{PCl5(g)}$ ka **degree of dissociation badhta hai** — **(iii) Correct**, **(i) Wrong**!","Le Chatelier shift kabhi bhi cause ko over-compensate nahi kar sakta, isliye naye equilibrium par $[\\ce{CO}]_{\\text{new}} > [\\ce{CO}]_{\\text{initial}}$ hota hai — **(ii) Wrong**!","Isliye keval **(iii)** sahi hai ($\\color{#7ee2b8}{\\text{Option B}}$)."],"r":"Sahi vikalp **Only (iii)** (Option B) hai.","w":["**Option A (Only i):** $\\ce{CO}$ daalne se $\\ce{Cl2}$ badhta nahi balki $\\ce{COCl2}$ banakar ghat-ta hai, isliye dissociation ghat-ta nahi, badhta hai.","**Option C (Both i and ii):** (i) aur (ii) dono hi statements गलत hain.","**Option D (Both ii and iii):** Statement (ii) classic trap hai — bahar se add ki gayi $\\ce{CO}$ ki nayi equilibrium concentration purani se hamesha **zyada** hoti hai, kam nahi!"],"t":"IIT/NEET equilibrium gold rule: Closed constant-volume vessel me agar tum $n$ moles $\\ce{CO}$ bahar se daaloge, toh equilibrium par kuch fraction react karega par **final $[\\ce{CO}]$ hamesha initial $[\\ce{CO}]$ se upar hi rahega**!","sim":""},{"id":57,"q":"On the basis of information given below mark the correct option :<br>A. In bromoethane and chloroethane mixture intermolecular interactions of $A\\text{–}A$ and $B\\text{–}B$ type are nearly same as $A\\text{–}B$ type interactions.<br>B. In ethanol and acetone mixture $A\\text{–}A$ and $B\\text{–}B$ type intermolecular interactions are stronger than $A\\text{–}B$ type interactions.<br>C. In chloroform and acetone mixture $A\\text{–}A$ and $B\\text{–}B$ type intermolecular interactions are weaker than $A\\text{–}B$ type interactions.","fig":"","opt":["Solution B and C will follow Raoult's law","Solution A will follow Raoult's law","Solution B will show negative deviation from Raoult's law","Solution C will show positive deviation from Raoult's law"],"ans":1,"c":"**Raoult's Law** ke anusaar: (1) Jab $A\\text{–}B \\approx A\\text{–}A, B\\text{–}B \\implies$ **Ideal solution** (follows Raoult's law); (2) Jab $A\\text{–}B < A\\text{–}A, B\\text{–}B$ (kamzor pakad, molecules aasani se udte hain!) $\\implies$ **Positive deviation**; (3) Jab $A\\text{–}B > A\\text{–}A, B\\text{–}B$ (mazboot pakad, vapour pressure girta hai!) $\\implies$ **Negative deviation**!","m":"Teeno mixtures A, B, aur C ka behaviour unki intermolecular interactions se seedha identify karenge.","s":["**Mixture A ($\\ce{C2H5Br + C2H5Cl}$):** $A\\text{–}B \\approx A\\text{–}A, B\\text{–}B \\implies \\Delta H_{\\mathrm{mix}} = 0, \\Delta V_{\\mathrm{mix}} = 0 \\implies$ **Ideal solution — follows Raoult's law!**","**Mixture B (Ethanol $+$ Acetone):** Acetone ethanol ke H-bonds tod deta hai ($A\\text{–}B$ kamzor) $\\implies$ vapour pressure badhta hai $\\implies$ **Positive deviation** (Option C galat!)","**Mixture C ($\\ce{CHCl3} + \\text{Acetone}$):** $\\ce{Cl3C-H\\cdots O=C(CH3)2}$ naya H-bond banta hai ($A\\text{–}B$ mazboot) $\\implies$ vapour pressure ghat-ta hai $\\implies$ **Negative deviation** (Option D galat!)","Isliye $\\color{#7ee2b8}{\\text{Solution A will follow Raoult's law}}$ (**Option B**) sahi hai!"],"r":"**Solution A will follow Raoult's law** (Option B).","w":["**Option A:** B aur C dono non-ideal solutions hain aur Raoult's law follow nahi karte.","**Option C:** Ethanol $+$ acetone H-bond tutne ke karan **positive** deviation dikhata hai, negative nahi.","**Option D:** Chloroform $+$ acetone naya H-bond banne ke karan **negative** deviation dikhata hai, positive nahi."],"t":"Intuition mantra: **Pakad kamzor $\\to$ zyada bhaap $\\to$ Positive deviation**; **Pakad mazboot $\\to$ kam bhaap $\\to$ Negative deviation**!","sim":""},{"id":58,"q":"Two open beakers one containing a solvent and the other containing a mixture of that solvent with a nonvolatile solute are together sealed in a container. Over the time,","fig":"q58","opt":["The volume of the solution increases and the volume of the solvent decreases.","The volume of the solution decreases and the volume of the solvent increases.","The volume of the solution and the solvent does not change.","The volume of the solution does not change and the volume of the solvent decreases."],"ans":0,"c":"**Relative Lowering of Vapour Pressure** ke anusaar non-volatile solute milane par solution ka equilibrium vapour pressure pure solvent ke vapour pressure se **kam** ho jaata hai ($P_{\\mathrm{solution}} < P_{\\mathrm{solvent}}^\\circ$).","m":"Sealed chamber me vapour high vapour pressure region (pure solvent beaker) se evaporate hokar low vapour pressure region (solution beaker) me condense hoti rehti hai!","s":["Pure solvent beaker ka equilibrium vapour pressure $= P^\\circ$, aur solution beaker ka $= P_s < P^\\circ$","Jab chamber ka vapour pressure $P^\\circ$ ke paas pahunchta hai, toh solution ke liye ye **supersaturated** ($P_{\\mathrm{vap}} > P_s$) hota hai!","Isliye vapour solution beaker me lagatar **condense** hoti hai, jisse chamber pressure girta hai aur pure solvent beaker se aur solvent **evaporate** hota rehta hai","Nateeja: **Solution ka volume badhta hai aur pure solvent ka volume ghat-ta hai** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Samay ke saath **solution ka volume badhta hai aur solvent ka volume ghat-ta hai** (Option A).","w":["**Option B:** Vapour kabhi low vapour pressure ($P_s$) se high vapour pressure ($P^\\circ$) ki taraf net transfer nahi hoti.","**Option C:** $P^\\circ \\ne P_s$ hone ke karan dono beakers ek saath vapour equilibrium me reh hi nahi sakte.","**Option D:** Condense hone wali solvent vapour solution beaker me hi jaati hai (chamber saturate hone ke baad), isliye solution volume badhta hai."],"t":"Isi process ko **isopiestic distillation** kehte hain — aakhir me pure solvent beaker poora khali hokar saara solvent solution beaker me chala jaata hai!","sim":""},{"id":59,"q":"Select incorrect statement","fig":"","opt":["Conductivity always decreases with decrease in concentration for both weak and strong electrolytes","Variation in molar conductivity with concentration is different for strong and weak electrolytes.","Molar conductivity decreases with decrease in concentration.","When concentration approaches zero, molar conductivity is known as limiting molar conductivity."],"ans":2,"c":"**Conductivity ($\\kappa$, specific conductance)** $= 1\\,\\mathrm{cm^3}$ solution ke ions ki conductance hoti hai — dilution par unit volume me ions ghatne se $\\kappa$ **hamesha ghat-ti hai**. Lekin **Molar Conductivity ($\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$)** $= 1\\,\\mathrm{mol}$ electrolyte rakhne wale kul volume $V$ ki conductance hoti hai — dilution par total volume $V$ tezi se badhne (aur mobility/$\\alpha$ badhne) se $\\Lambda_m$ **hamesha badhti hai**!","m":"$\\kappa$ vs $\\Lambda_m$ ke dilution trends se charo statements check karenge.","s":["**Statement A:** Dilution ($C \\downarrow$) par unit volume me current-carrying ions kam ho jaate hain, isliye strong aur weak dono ke liye $\\kappa$ ghat-ti hai — **Correct**.","**Statement B:** Strong electrolyte linear ($\\Lambda_m = \\Lambda_m^\\circ - A\\sqrt{C}$) aur weak electrolyte steep hyperbola dikhata hai — **Correct**.","**Statement C:** Dilution ($C \\downarrow$) par **molar conductivity $\\Lambda_m$ badhti hai**, ghat-ti nahi! Isliye ye statement **INCORRECT** hai ($\\color{#7ee2b8}{\\text{Option C}}$)!","**Statement D:** $C \\to 0$ (infinite dilution) par $\\Lambda_m$ ko limiting molar conductivity ($\\Lambda_m^\\circ$) kehte hain — **Correct**."],"r":"Incorrect statement **Option C** hai kyunki concentration ghatne (dilution) par molar conductivity **badhti** hai.","w":["**Option A:** Ye $100\\%$ sahi NCERT statement hai ($\\kappa$ dilution par hamesha ghat-ti hai).","**Option B:** Ye bhi sahi hai (Debye–Hückel–Onsager linear vs Ostwald steep curve).","**Option D:** Ye limiting molar conductivity $\\Lambda_m^\\circ$ ki standard paribhasha hai."],"t":"NCERT Electrochemistry one-liner: **Dilution ($C \\downarrow$) $\\implies \\kappa \\downarrow$ ALWAYS, aur $\\Lambda_m \\uparrow$ ALWAYS** (for BOTH strong & weak electrolytes)!","sim":""},{"id":60,"q":"Match the Column-I with Column-II:<table class=\"q-table\"><tr><th><\/th><th>Column-I<\/th><th><\/th><th>Column-II<\/th><\/tr><tr><td>(A)<\/td><td>Thermal decomposition of $\\ce{HI}$ on gold surface<\/td><td>(P)<\/td><td>Zero order reaction<\/td><\/tr><tr><td>(B)<\/td><td>Inversion of cane sugar in acidic medium<\/td><td>(Q)<\/td><td>Pseudo first order reaction<\/td><\/tr><tr><td>(C)<\/td><td>Hydrogenation of ethene<\/td><td>(R)<\/td><td>First order reaction<\/td><\/tr><tr><td>(D)<\/td><td>The decomposition of gaseous ammonia on a hot platinum surface at high pressure<\/td><td>(S)<\/td><td>Second order reaction<\/td><\/tr><\/table>","fig":"","opt":["$\\mathrm{A} \\to \\mathrm{P},\\; \\mathrm{B} \\to \\mathrm{Q},\\; \\mathrm{C} \\to \\mathrm{S},\\; \\mathrm{D} \\to \\mathrm{P}$","$\\mathrm{A} \\to \\mathrm{Q},\\; \\mathrm{B} \\to \\mathrm{P},\\; \\mathrm{C} \\to \\mathrm{S},\\; \\mathrm{D} \\to \\mathrm{R}$","$\\mathrm{A} \\to \\mathrm{P},\\; \\mathrm{B} \\to \\mathrm{Q},\\; \\mathrm{C} \\to \\mathrm{R},\\; \\mathrm{D} \\to \\mathrm{P}$","$\\mathrm{A} \\to \\mathrm{P},\\; \\mathrm{B} \\to \\mathrm{Q},\\; \\mathrm{C} \\to \\mathrm{R},\\; \\mathrm{D} \\to \\mathrm{S}$"],"ans":2,"c":"NCERT Chemical Kinetics ke 4 classic experimental examples hain: heterogeneous metal catalyst surface ($\\ce{Au}, \\ce{Pt}$) high pressure par saturate ho jaane ke karan **zero order** hoti hai; excess $\\ce{H2O}$ solvent wali hydrolysis **pseudo first order** hoti hai; aur hydrogenation of ethene ($\\ce{C2H4 + H2 -> C2H6}$) **first order** hoti hai.","m":"Har NCERT standard reaction ko uske experimental order se seedha match karenge.","s":["**(A) $2\\ce{HI(g) ->[\\ce{Au}] H2(g) + I2(g)}$:** Gold surface catalytic decomposition $\\implies$ **Zero order ($\\mathrm{P}$)**","**(B) $\\ce{C12H22O11 + H2O(excess) ->[\\ce{H+}] C6H12O6 + C6H12O6}$:** Cane sugar inversion $\\implies$ **Pseudo first order ($\\mathrm{Q}$)**","**(C) $\\ce{C2H4(g) + H2(g) -> C2H6(g)}$:** Hydrogenation of ethene $\\implies$ **First order ($\\mathrm{R}$)** ($r = k[\\ce{C2H4}]$)","**(D) $2\\ce{NH3(g) ->[\\ce{Pt},\\,1130\\,\\mathrm{K}][\\text{High }P] N2(g) + 3H2(g)}$:** Hot $\\ce{Pt}$ surface par saturated $\\implies$ **Zero order ($\\mathrm{P}$)** ($\\color{#7ee2b8}{\\text{Option C}}$)"],"r":"Sahi matching $\\mathrm{A} \\to \\mathrm{P},\\; \\mathrm{B} \\to \\mathrm{Q},\\; \\mathrm{C} \\to \\mathrm{R},\\; \\mathrm{D} \\to \\mathrm{P}$ (**Option C**) hai.","w":["**Option A:** Hydrogenation of ethene (C) ko second order ($\\mathrm{S}$) diya hai jabki NCERT me ye first order ($\\mathrm{R}$) hai.","**Option B:** (A), (B), (C), (D) charo galat match kiye gaye hain.","**Option D:** High pressure par $\\ce{NH3}$ on $\\ce{Pt}$ (D) zero order ($\\mathrm{P}$) hota hai, second order ($\\mathrm{S}$) nahi."],"t":"Metal surface memory hook: **$\\ce{HI}$ on $\\ce{Au}$, $\\ce{NH3}$ on $\\ce{Pt}$, $\\ce{N2O}$ on $\\ce{Pt}$** — high pressure catalytic decompositions teeno **Zero Order** hote hain!","sim":""},{"id":61,"q":"In which of the following statement is correct -","fig":"","opt":["$\\ce{C-F}$ bond length $\\Rightarrow \\ce{CH3F < CHF3}$","In $\\ce{PCl3F2}$, $\\ce{P-F_{\\mathrm{a}}}$ bond length is greater than $\\ce{P-Cl_{\\mathrm{e}}}$ bond length.","$\\ce{X-\\hat{C}-X}$ bond angle $\\Rightarrow \\ce{OCF2 < OCCl2}$","None of these"],"ans":2,"c":"**VSEPR Theory** aur **Bent's Rule** ke anusaar zyada electronegative substituent (jaise $-\\ce{F}$) central atom ke orbital me **zyada $p$-character** khinchta hai aur bonding electron pair central $\\ce{C}$ se door sarak jaata hai, jisse bond-pair–bond-pair repulsion ghat-ta hai aur bond angle **chhota** ho jaata hai!","m":"Har option par Bent's rule, atomic covalent radius, aur partial ionic character lagakar check karenge.","s":["**Check A ($\\ce{CH3F}$ vs $\\ce{CHF3}$):** $\\ce{CHF3}$ me teen $-\\ce{F}$ hone se $\\ce{C}$ par high $+\\delta$ charge aur partial back-bonding aati hai, jisse $\\ce{C-F}$ bond **chhota** ($1.33\\,\\text{\\AA} < 1.39\\,\\text{\\AA}$) hota hai, yaani $\\ce{CHF3 < CH3F}$ — **A Galat**!","**Check B ($\\ce{PCl3F2}$):** Trigonal bipyramidal me axial $\\ce{P-F_{\\mathrm{a}}}$ ($159\\,\\mathrm{pm}$) equatorial $\\ce{P-Cl_{\\mathrm{e}}}$ ($200\\,\\mathrm{pm}$) se kaafi **chhota** hota hai kyunki $\\ce{F}$ ka atomic size $\\ce{Cl}$ se bahut chhota hai! — **B Galat**!","**Check C ($\\ce{OCF2}$ vs $\\ce{OCCl2}$):** Fluorine ki high electronegativity ke karan $\\ce{C-F}$ bond pairs $\\ce{F}$ ki taraf sarak jaate hain $\\implies$ bp–bp repulsion kam $\\implies \\angle\\ce{FCF}\\;(108^\\circ) < \\angle\\ce{ClCCl}\\;(111.3^\\circ)$ — **C Sahi** ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"Sahi kathan **$\\ce{X-\\hat{C}-X}$ bond angle $\\Rightarrow \\ce{OCF2 < OCCl2}$** (Option C) hai.","w":["**Option A:** Number of $-\\ce{F}$ atoms badhne par $\\ce{C-F}$ bond length ghat-ti hai ($\\ce{CF4 < CHF3 < CH2F2 < CH3F}$).","**Option B:** Axial lengthening sirf **same** halogen ($\\ce{P-Cl_{\\mathrm{a}} > P-Cl_{\\mathrm{e}}}$) me compare hoti hai; $\\ce{F}$ chhota hone se $\\ce{P-F_{\\mathrm{a}} < P-Cl_{\\mathrm{e}}}$ hi rehta hai!","**Option D:** Option C bilkul sahi hai isliye 'None of these' galat hai."],"t":"**Option B** Kota coaching ka legendary Bent's rule trap hai: $\\ce{PCl3F2}$ me axial $\\ce{P-F_{\\mathrm{a}}}$ sirf equatorial $\\ce{P-F_{\\mathrm{e}}}$ se lamba hota hai, bade $\\ce{P-Cl_{\\mathrm{e}}}$ se kabhi lamba nahi ho sakta!","sim":""},{"id":62,"q":"Which order of dipole moment is correct ?","fig":"","opt":["$\\ce{CCl4 < CH3Cl < CH2Cl2 < CHCl3}$","$\\ce{CH3Cl > CH3F > CH3Br > CH3I}$","$\\ce{BF3 > NH3 > NF3}$","$\\text{o-dichlorobenzene} < \\text{m-dichlorobenzene} < \\text{p-dichlorobenzene}$"],"ans":1,"c":"Dipole moment $\\mu = q \\times d$ **charge separation ($q$)** aur **bond length ($d$)** dono ke product par nirbhar karta hai! Halomethanes $\\ce{CH3X}$ me $\\ce{F}$ zyada electronegative hai par $\\ce{C-F}$ bond bahut chhota ($139\\,\\mathrm{pm}$) hai, jabki $\\ce{C-Cl}$ bond kaafi lamba ($178\\,\\mathrm{pm}$) hone se $q \\times d$ product **$\\ce{CH3Cl}$ ke liye maximum** ho jaata hai!","m":"NCERT dipole moment table ke exact experimental values se charo series verify karenge.","s":["$\\ce{CH3X}$ series experimental dipole moments: $\\mu(\\ce{CH3Cl}) = 1.87\\,\\mathrm{D} > \\mu(\\ce{CH3F}) = 1.85\\,\\mathrm{D} > \\mu(\\ce{CH3Br}) = 1.81\\,\\mathrm{D} > \\mu(\\ce{CH3I}) = 1.62\\,\\mathrm{D}$ $\\implies$ $\\color{#7ee2b8}{\\text{Option B Sahi}}$!","Chloromethanes sahi kram: $\\ce{CCl4}\\;(0) < \\ce{CHCl3}\\;(1.01\\,\\mathrm{D}) < \\ce{CH2Cl2}\\;(1.60\\,\\mathrm{D}) < \\ce{CH3Cl}\\;(1.87\\,\\mathrm{D})$","$\\ce{BF3}\\;(0) < \\ce{NF3}\\;(0.24\\,\\mathrm{D}) < \\ce{NH3}\\;(1.47\\,\\mathrm{D})$","Dichlorobenzenes ($\\theta = 60^\\circ, 120^\\circ, 180^\\circ$): $\\text{ortho} > \\text{meta} > \\text{para}\\;(0)$"],"r":"Dipole moment ka sahi kram **$\\ce{CH3Cl > CH3F > CH3Br > CH3I}$** (Option B) hai.","w":["**Option A:** Chloromethanes me sahi kram $\\ce{CCl4 < CHCl3 < CH2Cl2 < CH3Cl}$ hota hai.","**Option C:** Planar trigonal $\\ce{BF3}$ ka net dipole moment zero hota hai ($\\ce{BF3 < NF3 < NH3}$).","**Option D:** *p*-Dichlorobenzene symmetrical ($\\theta = 180^\\circ$) hone se $\\mu = 0$ rakhta hai, sabse bada nahi!"],"t":"Har saal NEET me repeat hone wala exception: **Dipole moment: $\\ce{CH3Cl > CH3F > CH3Br > CH3I}$** (**Cl > F > Br > I**, bilkul Electron Affinity order ki tarah!)!","sim":""},{"id":63,"q":"Which of the following is correct on the basis of MOT?","fig":"","opt":["Bond strength of $\\ce{O2+ > N2}$","Bond length order : $\\ce{O2 > O2+ > O2-}$","Number of unpaired electrons order : $\\ce{O2 > O2+ > N2}$","Number of ABMO electrons order : $\\ce{Be2 < O2 < N2-}$"],"ans":2,"c":"**Molecular Orbital Theory (MOT)** me $\\ce{O2}$ ($16\\,e^-$) ke ${\\pi^*_{2p_x}}^1 {\\pi^*_{2p_y}}^1$ degenerate antibonding orbitals me **$2$ unpaired electrons** hote hain; $\\ce{O2+}$ ($15\\,e^-$) me **$1$ unpaired electron** hota hai; aur $\\ce{N2}$ ($14\\,e^-$) me saare electrons paired (**$0$ unpaired electrons**) hote hain!","m":"Total valence/molecular electrons ginkar Bond Order, Bond Length ($\\propto \\dfrac{1}{\\text{B.O.}}$), aur unpaired electrons check karenge.","s":["$\\ce{O2}$ ($16\\,e^-$): configuration $\\dots \\pi_{2p}^4\\,{\\pi^*_{2p_x}}^1{\\pi^*_{2p_y}}^1 \\implies$ unpaired $e^- = \\mathbf{2}$","$\\ce{O2+}$ ($15\\,e^-$): ek $\\pi^*$ electron nikal gaya $\\implies$ unpaired $e^- = \\mathbf{1}$","$\\ce{N2}$ ($14\\,e^-$): closed shell $\\dots \\pi_{2p}^4\\,\\sigma_{2p_z}^2 \\implies$ unpaired $e^- = \\mathbf{0}$","Order compare karein: $2 > 1 > 0 \\implies \\color{#7ee2b8}{\\ce{O2 > O2+ > N2}}$ (**Option C**)"],"r":"MOT ke aadhar par sahi kathan **Number of unpaired electrons order : $\\ce{O2 > O2+ > N2}$** (Option C) hai.","w":["**Option A:** Bond order $\\ce{O2+} = 2.5$ jabki $\\ce{N2} = 3.0$, isliye $\\ce{N2}$ zyada mazboot hai.","**Option B:** Bond order $\\ce{O2+}\\;(2.5) > \\ce{O2}\\;(2.0) > \\ce{O2-}\\;(1.5) \\implies$ bond length ulta $\\ce{O2- > O2 > O2+}$ hota hai!","**Option D:** Total ABMO ($\\sigma^* + \\pi^*$) electrons: $\\ce{Be2}\\;(4) < \\ce{N2-}\\;(5) < \\ce{O2}\\;(6)$, diya gaya kram galat hai."],"t":"Diatomic count shortcut: $14\\,e^-\\;(\\ce{N2}) \\to \\text{B.O. } 3.0\\;(0\\text{ unpaired})$; $15\\,e^-\\;(\\ce{O2+}) \\to \\text{B.O. } 2.5\\;(1\\text{ unpaired})$; $16\\,e^-\\;(\\ce{O2}) \\to \\text{B.O. } 2.0\\;(2\\text{ unpaired})$!","sim":""},{"id":64,"q":"Which of the following statement is correct?","fig":"","opt":["$\\ce{Br2}$ is liquid metal","I.E. of $\\ce{Na}$ is greater than $\\ce{Mg}$","Electron affinity of $\\ce{O}$ is greater than $\\ce{S}$","Electron affinity of $\\ce{Cl}$ is greater than $\\ce{F}$"],"ans":3,"c":"$2\\text{nd}$ period ke p-block elements ($\\ce{O}, \\ce{F}$) ka atomic size bahut chhota hone se compact $2p$
