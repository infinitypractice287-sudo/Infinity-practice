}}$ inorganic *metal ion activator* hai (proteolytic enzyme **Carboxypeptidase** ke liye!).","**Option D (Niacin):** Vitamin Niacin co-enzyme $\\mathrm{NAD}$ / $\\mathrm{NADP}$ ka avashyak chemical component hai."],"t":"NCERT Biomolecules Co-factor Trio ratt lo:<br>• **Prosthetic group:** **Haem** in *Peroxidase & Catalase*<br>• **Co-enzyme:** **NAD / NADP** (contains vitamin *Niacin*)<br>• **Metal ion:** **$\\ce{Zn^{2+}}$** in *Carboxypeptidase*!","sim":""},{"id":104,"q":"Refer to the following statements for agarose-gel electrophoresis :<br>(a) Agarose is a natural polymer obtained from seaweed.<br>(b) The separation of DNA molecules in agarose-gel electrophoresis depends on the size of DNA.<br>(c) The DNA migrates from negatively-charged electrode to the positively-charged electrode.<br>(d) The DNA migrates from positively-charged electrode to the negatively-charged electrode.<br>Choose the most appropriate answer from the options given below :","fig":"","opt":["(a) and (b) only","(a), (b) and (c) only","(a), (b) and (d) only","(b), (c) and (d) only"],"ans":1,"c":"**Agarose Gel Electrophoresis** (NCERT Class XII *Biotechnology: Principles and Processes*) me:<br>• **Agarose** red seaweed (*Gelidium / Gracilaria*) se nikala gaya **natural polysaccharide polymer** hai.<br>• DNA fragments phosphate backbone ($\\ce{-PO4^{3-}}$) ke karan **negatively charged anions** hote hain, isliye electric field me **negative cathode se positive ANODE ki taraf** migrate karte hain!<br>• Agarose matrix ke **sieving effect** se fragments **keval apne size** ke aadhar par separate hote hain (chhota fragment zyada aage jaata hai)!","m":"DNA ka charge (**negative**) aur electrode direction (**$-$ cathode $\\longrightarrow +$ anode**) pakka karke `(a)–(d)` check karenge!","s":["**(a) Natural polymer from seaweed:** $100\\%$ NCERT verbatim line — **Correct**.","**(b) Separation depends on size of DNA:** Sieving effect of agarose — chhota tukda tezi se door jaata hai — **Correct**.","**(c) vs (d):** Negatively-charged DNA **negative electrode (cathode) se positive electrode (anode)** ki taraf chalta hai $\\implies$ **(c) Correct**, **(d) Wrong**! ($\\color{#7ee2b8}{\\text{Option B}}$)"],"r":"Sahi kathan **(a), (b) and (c) only** (**Option B**) hain.","w":["**Option A:** Statement `(c)` bhi $100\\%$ sahi hai, use chhod nahi sakte.","**Option C:** DNA negatively charged hone se positive anode se दूर nahi jaata, uski *taraf* jaata hai (`d` galat).","**Option D:** `(c)` aur `(d)` ek doosre ke bilkul virodhi statements hain, dono ek saath sahi ho hi nahi sakte!"],"t":"Electrophoresis Memory Trick: **DNA = Anion ($-$) $\\implies$ Runs towards ANODE ($+$)**! Aur wells hamesha **cathode ($-$) end** par banate hain!","sim":""},{"id":105,"q":"IUDs are small objects made up of plastic or copper that are inserted in the uterine cavity. Which of the following statements are correct about IUDs ?<br>(a) IUDs decrease phagocytosis of sperm within the uterus.<br>(b) The released copper ions suppress the sperm motility.<br>(c) IUDs do not make the cervix hostile to the sperm.<br>(d) IUDs suppress the fertilization capacity of sperm.<br>(e) The IUDs require surgical intervention for their insertion in the uterine cavity.<br>Choose the most appropriate answer from the options given below :","fig":"","opt":["(a), (d) and (e) only","(b) and (c) only","(b) and (d) only","(d) only"],"ans":2,"c":"NCERT Class XII (*Reproductive Health*) ke anusaar **Intra Uterine Devices (IUDs)** $3$ tareeke se kaam karte hain:<br>1) Sabhi IUDs uterus ke andar sperms ki **phagocytosis INCREASE** karte hain!<br>2) **$\\ce{Cu}$-releasing IUDs** ($\\text{CuT, Cu7, Multiload 375}$): released **$\\ce{Cu^{2+}}$ ions suppress sperm motility AND fertilising capacity of sperms**!<br>3) **Hormone-releasing IUDs** ($\\text{Progestasert, LNG-20}$): uterus ko implantation ke liye unsuitable banate hain **aur cervix ko sperms ke liye HOSTILE banate hain**!","m":"Har word ('decrease' vs 'increase', 'do not' vs 'make', 'surgical' vs 'vaginal') bariki se check karenge!","s":["**(a) 'decrease phagocytosis':** **Galat!** IUDs sperm phagocytosis **INCREASE** karte hain!","**(b) & (d):** Released $\\ce{Cu^{2+}}$ ions **suppress sperm motility (b)** AND **suppress fertilising capacity of sperms (d)** $\\implies$ **(b) aur (d) dono $100\\%$ Sahi**!","**(c) 'do not make cervix hostile':** **Galat!** Hormone-releasing IUDs cervix ko hostile banate hain! Aur **(e) 'surgical intervention':** **Galat!** Expert doctors/nurses vagina ke raaste *bina surgery* ke insert karte hain! Sahi uttar: $\\color{#7ee2b8}{\\text{(b) and (d) only (Option C)}}$!"],"r":"Correct statements **(b) and (d) only** (**Option C**) hain.","w":["**Option A:** `(a)` (*decrease* ki jagah *increase*) aur `(e)` (non-surgical vaginal insertion hota hai) dono galat hain.","**Option B:** `(c)` galat hai kyunki LNG-20 / Progestasert cervix mucus ko sperms ke liye hostile banate hain.","**Option D:** `(b)` bhi NCERT ki word-for-word sahi line hai, isliye keval `(d)` adhura hai."],"t":"India ka most widely accepted contraception method **IUDs** hi hai — aur iske $3$ action verbs ratt lo: **INCREASE phagocytosis**, **SUPPRESS motility & fertilising capacity ($\\ce{Cu^{2+}}$)**, **HOSTILE cervix (LNG-20)**!","sim":""},{"id":106,"q":"A normal girl, whose mother is haemophilic marries a male with no ancestral history of haemophilia. What will be the possible phenotypes of the offsprings ?<br>(a) Haemophilic son and haemophilic daughter.<br>(b) Haemophilic son and carrier daughter.<br>(c) Normal daughter and normal son.<br>(d) Normal son and haemophilic daughter.<br>Choose the most appropriate answer from the options given below:","fig":"q106","opt":["(a) and (b) only","(b) and (c) only","(a) and (d) only","(b) and (d) only"],"ans":1,"c":"**Haemophilia** ek **X-linked recessive** Mendelian disorder hai! Jab kisi phenotypically normal ladki ki **maa haemophilic ($\\ce{X^hX^h}$)** ho, toh us ladki ko maa se ek $\\ce{X^h}$ milna $100\\%$ tay hai — yaani ladki **obligate CARRIER ($\\ce{XX^h}$)** hogi! Aur uske husband me कोई haemophilia history nahi hai $\\implies$ **Normal Male ($\\ce{XY}$)**!","m":"Cross **$\\ce{XX^h} \\times \\ce{XY}$** ka $2 \\times 2$ Punnett square banakar charon offsprings dekhenge!","s":["**Parents ke Genotypes:** Wife $= \\ce{XX^h}$ (normal carrier female), Husband $= \\ce{XY}$ (normal male).","**Gametes cross ($\\ce{X, X^h} \\times \\ce{X, Y}$):**<br>• Daughters: **$\\ce{XX}$ (Normal daughter)** aur **$\\ce{XX^h}$ (Carrier normal daughter)** — **KOI BHI DAUGHTER HAEMOPHILIC ($\\ce{X^hX^h}$) HO HI NAHI SAKTI** kyunki father $\\ce{X}$ normal hai!!<br>• Sons: **$\\ce{XY}$ (Normal son)** aur **$\\ce{X^hY}$ (Haemophilic son)**!","Statements check karein: `(a)` aur `(d)` me *haemophilic daughter* diya hai jo **impossible** hai! Possible combinations keval **Haemophilic son & carrier daughter (`b`)** aur **Normal daughter & normal son (`c`)** hain $\\implies$ $\\color{#7ee2b8}{\\text{(b) and (c) only (Option B)}}$!"],"r":"Offsprings ke sambhavit phenotypes **(b) and (c) only** (**Option B**) honge.","w":["**Option A:** Haemophilic daughter ($\\ce{X^hX^h}$) tabhi ho sakti hai jab **father BHI haemophilic ($\\ce{X^hY}$)** ho!","**Option C:** `(a)` aur `(d)` dono me haemophilic daughter hone se dono impossible hain.","**Option D:** Statement `(d)` me haemophilic daughter impossible hai."],"t":"1-Second Genetics Rule: **Normal father ($\\ce{XY}$) ki beti KABHI X-linked recessive disease se affected ($\\ce{X^hX^h}$) NAHI ho sakti** — seedha `(a)` aur `(d)` cross, **Option B** lock!!","sim":""},{"id":107,"q":"Choose the correct statements:<br>(a) Bones support and protect softer tissues and organs.<br>(b) Weight bearing function is served by limb bones.<br>(c) Ligament is the site of production of blood cells.<br>(d) Adipose tissue is specialised to store fats.<br>(e) Tendons attach one bone to another.<br>Choose the most appropriate answer from the options given below :","fig":"","opt":["(a), (b) and (d) only","(b), (c) and (e) only","(a), (c) and (d) only","(a), (b) and (e) only"],"ans":0,"c":"Animal Connective Tissues (NCERT Class XI) ke core functions:<br>• **Bones:** structural frame, softer organs ka protection, limb bones dwara weight-bearing, aur **red bone marrow** me blood cells (haematopoiesis) banana!<br>• **Adipose tissue:** loose connective tissue specialised to store **fats**!<br>• **BLB & MTB:** **B**one-to-**B**one = **L**igament | **M**uscle-to-**B**one = **T**endon!","m":"Har statement `(a)–(e)` ko verify karke गलत swaps (`c` aur `e`) hata denge!","s":["**(a) & (b):** Bones softer tissues/organs ko protect karti hain aur leg/limb bones weight-bearing ka kaam karti hain — **Dono Sahi**!","**(c) 'Ligament produces blood cells':** **Galat!** Blood cells **Red Bone Marrow** me bante hain!","**(d) Adipose tissue stores fats:** Excess nutrients fat me badalkar yahan store hote hain — **Sahi**!","**(e) 'Tendons attach bone to bone':** **Galat!** Bone-to-bone **Ligament** jodta hai (Tendon muscle-to-bone jodta hai!) $\\implies$ $\\color{#7ee2b8}{\\text{(a), (b) and (d) only (Option A)}}$!"],"r":"Correct statements **(a), (b) and (d) only** (**Option A**) hain.","w":["**Option B:** `(c)` aur `(e)` dono statements galat hain.","**Option C:** `(c)` galat hai kyunki erythropoiesis/haematopoiesis bone marrow me hoti hai.","**Option D:** `(e)` galat hai kyunki bone-to-bone **BLB** (*Ligament*) jodta hai, tendon nahi!"],"t":"Kabhi na bhoolne wala mnemonic: **BLB** (**B**one–**L**igament–**B**one) aur **MTB** (**M**uscle–**T**endon–**B**one)!","sim":""},{"id":108,"q":"Given below are two statements: one is labelled as Assertion (A) and the other is labelled as Reason (R).<br>**Assertion (A) :** During pregnancy the level of thyroxine is increased in the maternal blood.<br>**Reason (R) :** Pregnancy is not characterised by metabolic changes in the mother.<br>In the light of the above statements, choose the most appropriate answer from the options given below:","fig":"","opt":["Both (A) and (R) are correct and (R) is the correct explanation of (A)","Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct"],"ans":2,"c":"NCERT Class XII (*Human Reproduction*, Pregnancy and Embryonic Development) ke anusaar pregnancy ke dauran maternal blood me **estrogens, progestogens, cortisol, prolactin, aur THYROXINE** kayi guna (**several folds**) badh jaate hain — **ISILIYE taaki fetal growth support ho sake AUR mother me increased METABOLIC CHANGES maintain ho sakein**!","m":"Assertion aur Reason dono ko NCERT ki exact line se check karenge!","s":["**Assertion (A):** Pregnancy me maternal blood me thyroxine, cortisol, prolactin, estrogens, progestogens *several folds* badh jaate hain $\\implies$ **(A) is Correct**!","**Reason (R):** NCERT likhta hai ki ye hormone वृद्धि *'is essential for supporting fetal growth, **metabolic changes in the mother** and maintenance of pregnancy'* — jabki Reason me **'NOT characterised by metabolic changes'** likh diya hai $\\implies$ **(R) is NOT correct**!","Isliye **(A) is correct but (R) is not correct** ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"**(A) is correct but (R) is not correct** (**Option C**).","w":["**Option A:** Reason (R) poori tarah false hai kyunki pregnancy me maternal metabolism kafi badh jaata hai.","**Option B:** Reason (R) true nahi hai ('not' laga hua hai!).","**Option D:** Assertion (A) $100\\%$ NCERT true hai."],"t":"Thyroxine ka kaam hi **Basal Metabolic Rate (BMR) badhana** hai — pregnancy me thyroxine kai guna badhna hi prove karta hai ki mother me bhaari metabolic changes hote hain!","sim":""},{"id":109,"q":"Arrange the components of mammary gland (from proximal to distal):<br>(a) Mammary duct &nbsp;&nbsp; (b) Lactiferous duct &nbsp;&nbsp; (c) Alveoli &nbsp;&nbsp; (d) Mammary ampulla &nbsp;&nbsp; (e) Mammary tubules<br>Choose the most appropriate answer from the options given below :","fig":"","opt":["(c) $\\rightarrow$ (a) $\\rightarrow$ (d) $\\rightarrow$ (e) $\\rightarrow$ (b)","(b) $\\rightarrow$ (c) $\\rightarrow$ (e) $\\rightarrow$ (d) $\\rightarrow$ (a)","(c) $\\rightarrow$ (e) $\\rightarrow$ (a) $\\rightarrow$ (d) $\\rightarrow$ (b)","(e) $\\rightarrow$ (c) $\\rightarrow$ (d) $\\rightarrow$ (b) $\\rightarrow$ (a)"],"ans":2,"c":"Human female **Mammary Gland** me milk production se lekar nipple se bahar nikalne tak ka exact NCERT pathway:<br>$$\\text{Mammary Alveoli } (c) \\longrightarrow \\text{Mammary Tubules } (e) \\longrightarrow \\text{Mammary Duct } (a) \\longrightarrow \\text{Mammary Ampulla } (d) \\longrightarrow \\text{Lactiferous Duct } (b)$$!","m":"**AT-DAL** mnemonic se start (**Alveoli**) aur end (**Lactiferous duct**) Se seedha sequence verify karenge!","s":["**1. Alveoli `(c)`:** Clusters of milk-secreting cells jinke lumen me doodh (milk) jama hota hai.","**2. Mammary tubules `(e)` $\\to$ 3. Mammary duct `(a)`:** Har lobe ki alveoli **mammary tubules** me khulti hain, jo milkar **mammary duct** banati hain.","**4. Mammary ampulla `(d)` $\\to$ 5. Lactiferous duct `(b)`:** Kai mammary ducts milkar wider **mammary ampulla** banati hain jo **lactiferous duct** se judi hoti hai jisse milk suck out hota hai $\\implies$ $\\color{#7ee2b8}{\\text{(c)} \\to \\text{(e)} \\to \\text{(a)} \\to \\text{(d)} \\to \\text{(b)}}$ (**Option C**)!"],"r":"Sahi pathway **(c) $\\rightarrow$ (e) $\\rightarrow$ (a) $\\rightarrow$ (d) $\\rightarrow$ (b)** (**Option C**) hai.","w":["**Option A:** Alveoli seedha mammary duct me nahi khulti — pehle **mammary tubules `(e)`** aati hain!","**Option B:** Lactiferous duct `(b)` sabse aakhiri (distal opening at nipple) hota hai, pehla nahi.","**Option D:** Alveoli `(c)` sabse shuruat hoti hai aur ampulla ke baad lactiferous duct aata hai."],"t":"$5$-Second Golden Mnemonic — **A T D A L**: **A**lveoli $\\to$ **T**ubules $\\to$ **D**uct $\\to$ **A**mpulla $\\to$ **L**actiferous duct!! Kabhi zindagi me galat nahi hoga!","sim":""},{"id":110,"q":"Select the **incorrect** match regarding the symbols used in Pedigree analysis:","fig":"","opt":["{{OPT:ped:1}} — Sex unspecified","{{OPT:ped:2}} — Affected individual","{{OPT:ped:3}} — Consanguineous mating","{{OPT:ped:4}} — Parent with male child affected with disease"],"ans":2,"c":"NCERT Class XII (*Principles of Inheritance and Variation*, Fig. 4.13) ke **Human Pedigree Symbols** me:<br>• **Single horizontal line** ($\\square\\text{—}\\bigcirc$) $=$ **Normal Mating (Marriage between unrelated individuals)**!<br>• **DOUBLE horizontal line** ($\\square\\text{==}\\bigcirc$) $=$ **Consanguineous Mating (Mating between relatives)**!","m":"Chaaron pedigree symbols dekhkar turant pakad lenge ki Option C me **single line** hai par label **Consanguineous mating** likha hai!","s":["**Option A (Diamond $\\lozenge$):** Sex unspecified — **Sahi match**.","**Option B (Solid/Shaded Square $\\blacksquare$):** Affected male individual — **Sahi match**.","**Option C ($\\square\\text{—}\\bigcirc$ single horizontal line):** Ye **Normal Mating** ka symbol hai! **Consanguineous mating** (rishtedaron me vivah) ke liye **DO (double) horizontal lines** ($\\square\\text{==}\\bigcirc$) zaroori hoti hain! $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Match (Option C)}}$!","**Option D:** Normal parents ke neeche shaded square ($\\blacksquare$) $=$ Parents with male child affected with disease — **Sahi match**."],"r":"Incorrect match **Option C (Single mating line — Consanguineous mating)** hai.","w":["**Option A:** Diamond symbol unspecified sex ko hi darshata hai.","**Option B:** Solid filled symbol disease-affected individual dikhata hai.","**Option D:** Parents ke marriage line se latakta shaded square affected son dikhata hai."],"t":"1-Second Visual Check: **1 Line = Normal Mating** | **2 Lines ($=$) = Consanguineous Mating (Relatives)**!","sim":""},{"id":111,"q":"Panspermia, an idea that is still a favourite for some astronomers, means :","fig":"","opt":["Creation of life from dead and decaying matter","Creation of life from chemicals","Origin of sperm in human testes","Transfer of spores as unit of life to different planets including earth"],"ans":3,"c":"**Theory of Panspermia (Cosmozoic Theory)** ke anusaar shuruati Greek thinkers (aur aaj bhi kuch astronomers!) maante hain ki jeevan ki ikaiyan — जिन्हें **spores** kaha gaya — antariksh se **alag-alag grahon (planets including Earth) par transfer** hui hain!","m":"NCERT Class XII (*Evolution*, Origin of Life) ki word-for-word line se match karenge!","s":["Option A (*dead and decaying matter* — straw, mud) $=$ **Theory of Spontaneous Generation (Abiogenesis)**.","Option B (*from non-living organic/inorganic chemicals*) $=$ **Oparin–Haldane Chemical Evolution**.","Option D (*units of life called **spores** transferred to different planets including Earth*) $=$ **Panspermia** ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"Panspermia ka arth **Transfer of spores as unit of life to different planets including earth** (**Option D**) hai.","w":["**Option A:** Ye *Spontaneous Generation* theory hai jise Louis Pasteur ne swan-neck flask experiment se kharij kar diya tha.","**Option B:** Ye Oparin–Haldane aur Miller–Urey ki *Abiogenic Chemical Evolution* theory hai.","**Option C:** Naam 'spermia' (Greek *sperma* = seed/spore) sunne me lagta hai par spermatogenesis se iska zero lena-dena hai!"],"t":"Word roots se samjho: **Pan** (*all / everywhere*) + **spermia** (*seed / spore*) $=$ **Cosmic seeds/spores travelling across planets**!","sim":""},{"id":112,"q":"Which of the following statements are correct with respect to **vital capacity**?<br>(a) It includes $\\mathrm{ERV}$, $\\mathrm{TV}$ and $\\mathrm{IRV}$.<br>(b) Total volume of air a person can inspire after a normal expiration.<br>(c) The maximum volume of air a person can breathe in after forced expiration.<br>(d) It includes $\\mathrm{ERV}$, $\\mathrm{RV}$ and $\\mathrm{IRV}$.<br>(e) The maximum volume of air a person can breathe out after a forced inspiration.<br>Choose the most appropriate answer from the options given below:","fig":"","opt":["(b), (d) and (e)","(a), (c) and (d)","(a), (c) and (e)","(a) and (e)"],"ans":2,"c":"**Vital Capacity ($\\mathrm{VC} \\approx 4000\\text{–}4600\\,\\mathrm{mL}$)** ko NCERT Class XI (*Breathing and Exchange of Gases*) me **teeno samatulya tareeqon** se paribhashit kiya gaya hai:<br>1) Formula: **$\\mathrm{VC} = \\mathrm{ERV} + \\mathrm{TV} + \\mathrm{IRV}$**<br>2) Forced expiration ke baad jitni **maximum hawa andar le sakte hain**!<br>3) **OR** Forced inspiration ke baad jitni **maximum hawa bahar nikaal sakte hain**!","m":"Paanchon statements `(a)–(e)` ko inhi teen exact NCERT paribhashaon se check karenge!","s":["**(a) Includes $\\mathrm{ERV + TV + IRV}$:** Exact formula — **Correct**! (`d` me $\\mathrm{RV}$ de diya hai, $\\mathrm{RV}$ judte hi *Total Lung Capacity* ban jaata hai, isliye `d` galat!)","**(b) Total volume inspired after normal expiration:** Ye **Inspiratory Capacity ($\\mathrm{IC} = \\mathrm{TV + IRV}$)** ki definition hai — **Wrong**!","**(c) & (e):** Maximum air breathed **in after forced expiration (`c`)** AUR maximum air breathed **out after forced inspiration (`e`)** — **DONO HI Vital Capacity hain**! ($\\color{#7ee2b8}{\\text{(a), (c) and (e) — Option C}}$)!"],"r":"Vital capacity ke liye sahi statements **(a), (c) and (e)** (**Option C**) hain.","w":["**Option A:** `(b)` *Inspiratory Capacity* hai aur `(d)` me *Residual Volume* ($\\mathrm{RV}$) galti se shaamil kar liya gaya hai.","**Option B:** `(d)` galat hai kyunki forced expiration ke baad bhi $\\mathrm{RV}$ ($1100\\text{–}1200\\,\\mathrm{mL}$) lungs me hi bacha rehta hai.","**Option D:** `(c)` chhod diya gaya hai jabki NCERT me `(c)` aur `(e)` dono verbatim ek hi line me likhe hain!"],"t":"**Option D vs Option C** NEET 2023/2027 ka exact trap hai — NCERT p. 187 me dono hi phrases (*'breathe in after a forced expiration ... OR ... breathe out after a forced inspiration'*) Vital Capacity ke liye likhe hain! Niche slider chala kar dekho!","sim":"spirometry"},{"id":113,"q":"Choose the correct option regarding **Retrovirus**:","fig":"","opt":["An RNA virus that synthesises DNA during infection","A DNA virus that synthesises RNA during infection","A single stranded DNA virus","A dsRNA virus"],"ans":0,"c":"**Retroviruses** (jaise **HIV** — Human Immunodeficiency Virus, aur oncogenic RNA tumor viruses) ke paas **single-stranded RNA genome** aur **Reverse Transcriptase** (RNA-dependent DNA polymerase) enzyme hota hai! Host cell infect karne par ye **viral RNA template se complementary viral DNA ($\\mathrm{cDNA}$)** banate hain ($\\mathrm{RNA} \\xrightarrow{\\text{Reverse Transcriptase}} \\mathrm{DNA}$), jo host genome me integrate ho jaata hai!","m":"**Retro** $=$ *backward* (reverse of Central Dogma $\\mathrm{DNA \\to RNA}$) — seedha **RNA virus synthesising DNA** tick karenge!","s":["Retrovirus particle me genetic material **$\\mathrm{ssRNA}$** ($2$ identical strands in HIV) hota hai — DNA nahi!","Host macrophage / helper $\\mathrm{T}$-cell me ghusne ke baad viral enzyme **Reverse Transcriptase** viral RNA se **viral DNA** synthesise karta hai.","Isliye Retrovirus $=$ **An RNA virus that synthesises DNA during infection** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Retrovirus **An RNA virus that synthesises DNA during infection** (**Option A**) hota hai.","w":["**Option B:** Retrovirus ka genome DNA nahi balki **RNA** hota hai.","**Option C:** $\\phi\\mathrm{X174}$ / $\\mathrm{M13}$ $\\mathrm{ssDNA}$ phages hote hain, retroviruses nahi.","**Option D:** Reovirus $\\mathrm{dsRNA}$ virus hota hai, retrovirus nahi."],"t":"1-Line Memory Lock: **Retro = Reverse Transcription ($\\mathrm{RNA \\longrightarrow DNA}$)**, classic example = **HIV**!","sim":""},{"id":114,"q":"According to the **sliding filament theory**:","fig":"q114","opt":["Actin and myosin filaments slide over each other to increase the length of the sarcomere.","Length of A-band does not change.","I-band increases in length","The actin filaments slide away from A-band resulting in shortening of sarcomere"],"ans":1,"c":"**Sliding Filament Theory** (H.E. Huxley & A.F. Huxley) ke anusaar muscle contraction ke dauran **thin filaments (actin)** **thick filaments (myosin)** ke upar andar (**H-zone center ki taraf**) slide karte hain! Na actin filament khud chhota hota hai, na myosin filament — aur kyunki **A-band = poori thick myosin filament ki lambai**, isliye **contraction me A-band ki lambai BILKUL CONSTANT rehti hai**!!","m":"Contraction ke $4$ golden changes check karenge: **Sarcomere $\\downarrow$, I-band $\\downarrow$, H-zone $\\downarrow$, A-band $=$ UNCHANGED (Retains its length)**!","s":["Contraction me Z-lines ek doosre ke paas खिंचती hain $\\implies$ **Sarcomere SHORTENS** (Option A galat).","Thin actin filaments A-band ke center ki taraf **andar** slide karte hain (away nahi! Option D galat) $\\implies$ **I-band aur H-zone SHORTEN** (Option C galat).","Thick myosin filament ki lambai badalti hi nahi $\\implies$ **Length of A-band DOES NOT CHANGE (retains its length)** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Sliding filament theory ke anusaar **Length of A-band does not change** (**Option B**).","w":["**Option A:** Muscle contraction se sarcomere ki lambai **ghat-ti (shortens)** hai, badhti nahi!","**Option C:** I-band ki lambai contraction ke dauran **ghat-ti (reduces)** hai.","**Option D:** Actin filaments A-band ke center ki *taraf* (**inwards**) slide karte hain, away nahi."],"t":"Super Mnemonic **HI-S vs A**: Contraction me **H**-zone, **I**-band, **S**arcomere teeno **GHAT-TE hain**, jabki **A-band ALWAYS SAME** rehta hai! Niche live slider chala kar dekho!","sim":"sarcomere"},{"id":115,"q":"Two butterfly species are competing for the same nectar of a flower in a garden. To survive and coexist together, they may avoid competition in the same garden by:","fig":"","opt":["feeding at the same time","choosing different foraging patterns","increasing time spent on attacking each other","predating on each other"],"ans":1,"c":"**Resource Partitioning** (MacArthur's warblers classic example, NCERT Class XII *Organisms and Populations*) ke anusaar agar do species ek hi सीमित resource ke liye compete kar rahi hon, toh competitive exclusion se bachkar **co-exist** karne ke liye woh **alag-alag feeding times ya alag-alag foraging patterns (behavioural differences)** apna leti hain!","m":"Co-existence = **avoiding competition via behavioural resource partitioning** (`choosing different foraging patterns`)!","s":["Gause ka *Competitive Exclusion Principle* tab lagta hai jab resource limiting ho aur dono bilkul same niche use karein.","Recent studies (MacArthur — $5$ warbler species on the same tree!) dikhati hain ki competing species **different times for feeding OR different foraging patterns** chun kar peacefully co-exist karti hain!","Isliye sahi uttar **choosing different foraging patterns** ($\\color{#7ee2b8}{\\text{Option B}}$) hai!"],"r":"Dono butterfly species **choosing different foraging patterns** (**Option B**) dwara competition avoid karke co-exist kar sakti hain.","w":["**Option A (feeding at the same time):** Same time par feed karne se competition घटेगा nahi, aur तेज़ ho jayega!","**Option C:** Ek doosre par attack karne (*interference*) se dono ki fitness aur survival ghat-ti hai.","**Option D:** Nectar-feeding butterflies ek doosre ka shikar (*predation*) nahi karti hain!"],"t":"Keyword Link: **Co-existence despite same resource $\\equiv$ Resource Partitioning (MacArthur's $5$ Warblers) $\\equiv$ Different feeding times / foraging patterns**!","sim":""},{"id":116,"q":"Which of the following reasons is mainly responsible for **graft rejection** in transplantation of organs ?","fig":"","opt":["Inability of recipient to differentiate between 'self' and 'non-self' tissues/cells","Humoral immune response only","Auto-immune response","Cell-mediated immunity"],"ans":3,"c":"NCERT Class XII (*Human Health and Disease*) ki gold-standard line: Body **'self' aur 'non-self' ko pehchanne me poori tarah saksham** hoti hai, aur organ transplantation me **Cell-Mediated Immune response (CMI — mediated by $\\mathrm{T}$-lymphocytes)** hi **graft rejection ke liye zimmedar** hota hai!","m":"Direct NCERT immunity highlight: **Graft Rejection $\\equiv$ Cell-Mediated Immunity ($\\mathrm{T}$-lymphocytes)**!","s":["Organ transplant se pehle tissue matching aur blood group matching zaroori hoti hai kyunki recipient immune system foreign MHC/HLA antigens ko **'non-self'** pehchan leta hai.","Cytotoxic $\\mathrm{T}$-lymphocytes ($\\mathrm{T_C}$ cells) donor graft tissue par seedha hamla karte hain.","NCERT exact sentence: *'The body is able to differentiate **self** and **non-self** and the **cell-mediated immune response is responsible for the graft rejection**.'* ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"Organ transplantation me graft rejection ke liye mukhya roop se **Cell-mediated immunity** (**Option D**) zimmedar hoti hai.","w":["**Option A:** Graft rejection recipient ki 'self' vs 'non-self' pehchanne ki **ABILITY** ki wajah se hota hai, *inability* ki wajah se nahi!","**Option B:** $\\mathrm{B}$-lymphocytes (antibodies) humoral immunity banati hain — graft rejection me mukhya role $\\mathrm{T}$-cells (CMI) ka hota hai.","**Option C:** Auto-immunity (jaise rheumatoid arthritis) tab hoti hai jab immune system **khud ke 'self' cells** par attack kar de."],"t":"$3$ C's Ek Saath Yaad Rakho: **Graft Rejection $\\longrightarrow$ Cell-Mediated Immunity ($\\mathrm{T}$-cells) $\\longrightarrow$ suppressed by Cyclosporin A (*Trichoderma polysporum*)**!","sim":""},{"id":117,"q":"If the $\\mathrm{pH}$ in lysosomes is increased to alkaline, what will be the outcome?","fig":"","opt":["Hydrolytic enzymes will function more efficiently","Hydrolytic enzymes will become inactive","Lysosomal enzymes will be released into the cytoplasm","Lysosomal enzymes will be more active"],"ans":1,"c":"**Lysosomes** ke andar karib $50$ tarah ke **acid hydrolases** (lipases, proteases, carbohydrases, nucleases) bhare hote hain! NCERT (*Cell: The Unit of Life*) ke anusaar ye enzymes **optimally active at ACIDIC $\\mathrm{pH}$ ($\\mathrm{pH} \\approx 4.5\\text{–}5.0$)** hote hain (jo membrane $\\ce{H+}$-pump maintain karta hai). Agar $\\mathrm{pH}$ badhakar **alkaline ($\\mathrm{pH} > 7$)** kar diya jaye, toh enzyme active-site conformation bigad jaane se **hydrolytic enzymes INACTIVE ho jayenge**!","m":"Enzyme $\\mathrm{pH}$ optimum curve lagayein: **Acid hydrolases** optimal at acidic $\\mathrm{pH} \\implies$ alkaline $\\mathrm{pH}$ par **inactive**!","s":["Lysosomal hydrolases ka naam hi **acid hydrolases** hai kyunki unka optimum $\\mathrm{pH} \\approx 4.5\\text{–}5.0$ hota hai.","Alkaline $\\mathrm{pH}$ ($\\mathrm{pH} > 7$) par active site ionisation badal jaati hai aur catalytic activity ruk jaati hai.","Isliye **Hydrolytic enzymes will become inactive** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Lysosome ka $\\mathrm{pH}$ alkaline hone par **Hydrolytic enzymes will become inactive** (**Option B**).","w":["**Option A:** Efficiently sirf acidic $\\mathrm{pH}$ ($\\approx 4.5\\text{–}5$) par hi kaam karte hain.","**Option C:** Alkaline $\\mathrm{pH}$ se enzymes inactive hote hain, membrane phat kar bahar nahi nikalte (aur cytoplasm khud $\\mathrm{pH} \\approx 7.2$ hone se cell ko accidental leak se bachata hai!).","**Option D:** Activity badhne ki bajay शून्य/निष्क्रिय ho jaati hai."],"t":"Nature ka genius safety lock: Cell cytoplasm ka $\\mathrm{pH} \\approx 7.2$ hota hai, isliye ek-aadh lysosome leak bhi ho jaye toh neutral/alkaline $\\mathrm{pH}$ par acid hydrolases turant **inactive** ho jaate hain!","sim":""},{"id":118,"q":"Chemosynthetic bacteria obtain energy from :","fig":"","opt":["Sun","Infrared rays","Organic substances","Inorganic chemicals"],"ans":3,"c":"**Chemosynthetic autotrophic bacteria** (jaise *Nitrosomonas, Nitrobacter, Beggiatoa*) suraj ki roshni use **nahi** karte! Iske bajay woh **inorganic substances** (jaise **nitrates, nitrites, aur ammonia** — $\\ce{NH3, NO2-, H2S, Fe^{2+}}$) ko **oxidise** karte hain aur usse nikli free energy se **$\\mathrm{ATP}$ aur food ($\\ce{CO2}$ fixation)** banate hain!","m":"NCERT Class XI (*Biological Classification*, Archaebacteria & Eubacteria) ki verbatim line apply karenge!","s":["Photosynthetic autotrophs energy **Sunlight** se lete hain.","Heterotrophs energy **Organic substances** se lete hain.","**Chemosynthetic autotrophs** विभिन्न **inorganic chemicals** ($\\ce{NO2-}, \\ce{NH3}, \\ce{H2S}$) ke oxidation se nikli energy use karke $\\mathrm{ATP}$ banate hain ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"Chemosynthetic bacteria apni energy **Inorganic chemicals** (**Option D**) ke oxidation se prapt karte hain.","w":["**Option A (Sun):** Sunlight energy *photoautotrophs* (cyanobacteria, purple/green bacteria, plants) use karte hain.","**Option B (Infrared rays):** Infrared spectrum anoxygenic bacteriochlorophyll se juda hota hai, chemosynthesis se nahi.","**Option C (Organic substances):** Organic compounds *chemoheterotrophs* (saprophytes) use karte hain, chemosynthetic autotrophs nahi!"],"t":"Exam Trap Alert: **Chemosynthetic bacteria = INORGANIC chemicals** (nitrates, nitrites, ammonia — great role in nutrient recycling of $\\ce{N, P, Fe, S}$)!","sim":""},{"id":119,"q":"Which one of the following is **not** a major characteristic feature of biodiversity hot spots?","fig":"","opt":["Large number of species","Abundance of endemic species","Mostly located in the tropics","Mostly located in the polar regions"],"ans":3,"c":"**Biodiversity Hotspots** (Norman Myers — kul **$34$** globally, India se जुड़े $3$: *Western Ghats & Sri Lanka, Indo-Burma, aur Himalaya*) ke $3$ pramukh lakshan hain:<br>1) **Very high species richness** (large number of species)<br>2) **High degree of endemism** (aisi species jo duniya me aur kahin nahi milti!)<br>3) **Accelerated habitat loss** aur zyada tar **tropical / subtropical** kshetron me sthit — **polar barfani regions me NAHI**!","m":"Latitudinal diversity gradient yaad karo: biodiversity tropics se poles ki taraf tezi se **ghat-ti** hai!","s":["Options A aur B (*high species richness* + *high endemism*) biodiversity hotspots define karne ke do primary criteria hi hain!","Option C (*mostly located in tropics*): Tropical regions me solar energy aur stability zyada hone se $34$ me se adhikansh hotspots wahin hain.","Option D (*mostly located in the polar regions*): Polar regions me harsh climate ke karan biodiversity bahut kam hoti hai $\\implies$ $\\color{#7ee2b8}{\\text{NOT a feature (Option D)}}$!"],"r":"Biodiversity hotspots ki visheshta **Mostly located in the polar regions** (**Option D**) **nahi** hai.","w":["**Option A:** High species richness hotspot chune jaane ki pehli mukhya shart hai.","**Option B:** High endemism (sthanik prajatiyan) hotspot ki sabse khas pehchaan hai.","**Option C:** Western Ghats, Indo-Burma, Amazon/Andes jaise adhikansh hotspots tropical belt me hi hain."],"t":"Biodiversity Hotspot के $2$ Core Criteria ratt lo: **(1) High Species Richness** + **(2) High Degree of Endemism** (+ Accelerated Habitat Loss; Total in world $= \\mathbf{34}$, India $= \\mathbf{3}$)!","sim":""},{"id":120,"q":"Select the **incorrect** match:<table class=\"q-table\"><tr><th><\/th><th>List-I<\/th><th>List-II<\/th><\/tr><tr><td>(1)<\/td><td>$\\mathrm{PAR}$ captured by plants<\/td><td>$2$ to $10\\%$<\/td><\/tr><tr><td>(2)<\/td><td>Productivity of ocean<\/td><td>$55$ billion tons<\/td><\/tr><tr><td>(3)<\/td><td>Productivity of surface (land)<\/td><td>$65$ billion tons<\/td><\/tr><tr><td>(4)<\/td><td>Productivity of the whole biosphere<\/td><td>$170$ billion tons<\/td><\/tr><\/table>","fig":"","opt":["(1)","(2)","(3)","(4)"],"ans":2,"c":"NCERT Class XII (*Ecosystem*, Productivity & Energy Flow) ke exact numerical figures:<br>• Plants capture **$2\\text{–}10\\%$ of $\\mathrm{PAR}$** (Photosynthetically Active Radiation)<br>• Whole biosphere annual Net Primary Productivity ($\\mathrm{NPP}$) $= \\mathbf{170\\text{ billion tons}}$ (dry weight)<br>• Oceans ($70\\%$ surface area hone ke bawajood!) $= \\mathbf{55\\text{ billion tons}}$<br>• **Land / Terrestrial surface** $= 170 - 55 = \\mathbf{115\\text{ billion tons}}$ (**$65$ billion tons NAHI!**)!","m":"Simple subtraction check: $170\\text{ (whole biosphere)} - 55\\text{ (oceans)} = \\mathbf{115\\text{ billion tons}}$! Row `(3)` me $65$ likha hai jo seedha galat hai!","s":["**Row (1):** Plants capture only **$2\\text{–}10\\%$ of $\\mathrm{PAR}$** (ya $1\\text{–}5\\%$ of total incident solar radiation) — **Correct**.","**Row (2) & Row (4):** Whole biosphere $\\mathrm{NPP} = \\mathbf{170\\text{ billion tons}}$ aur Oceans $= \\mathbf{55\\text{ billion tons}}$ — **Dono Correct**.","**Row (3):** Terrestrial / land surface productivity $= 170 - 55 = \\mathbf{115\\text{ billion tons}}$, jabki table me $65\\text{ billion tons}$ diya hai! $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Match — Option C}}$!"],"r":"Incorrect match **(3) Productivity of surface — $65$ billion tons** (**Option C**) hai (sahi value **$115$ billion tons** hai!).","w":["**Option A (1):** $2\\text{–}10\\%$ of $\\mathrm{PAR}$ exact NCERT figure hai (total solar radiation ka $<50\\%$ $\\mathrm{PAR}$ hota hai!).","**Option B (2):** Oceans ($70\\%$ area) ki annual $\\mathrm{NPP}$ exact $55\\text{ billion tons}$ hi hoti hai (nitrogen/light limitation ke karan!).","**Option D (4):** Poore biosphere ki annual $\\mathrm{NPP}$ exact $170\\text{ billion tons}$ dry organic matter hoti hai."],"t":"NCERT Ecosystem Golden Equation: **$170\\text{ billion tons (Total)} = 115\\text{ billion tons (Land)} + 55\\text{ billion tons (Ocean)}$**!!","sim":""},{"id":121,"q":"If a female individual is with small round head, furrowed tongue, partially open mouth and broad palm with characteristic palm crease. Also the physical, psychomotor and mental development is retarded. The karyotype analysis of such an individual will show :","fig":"","opt":["$47$ chromosomes with $\\mathrm{XXY}$ sex chromosomes","$45$ chromosomes with $\\mathrm{XO}$ sex chromosomes","$47$ chromosomes with $\\mathrm{XYY}$ sex chromosomes","Trisomy of chromosome $21$"],"ans":3,"c":"Diye gaye saare lakshan — **small round head, furrowed tongue, partially open mouth, broad flat palm with single simian palm crease, aur retarded physical, psychomotor & mental development** — **Down's Syndrome** (Langdon Down, $1866$) ki word-for-word NCERT pehchaan hain! Ye **autosomal aneuploidy** (**Trisomy of chromosome $21$**) se hota hai, isliye **male aur female dono** me ho sakta hai!","m":" TRAP ALERT: Sawal ki shuruat *'If a **female** individual...'* padhkar galti se **Turner's syndrome ($\\mathrm{45, XO}$)** MAT tick kar dena!! Symptom list 100% **Down's Syndrome** ki hai ($47, \\mathrm{XX}, +21$)!","s":["Symptoms match karein: small round head + furrowed tongue + partially open mouth + palm crease + retarded psychomotor & mental development $\\implies$ **Down's Syndrome**!","Down's syndrome sex-chromosomal disorder nahi balki **autosome $21$ ki extra copy (Trisomy-$21$, $2n + 1 = 47$)** ke karan hota hai.","Isliye female patient ka karyotype **$47, \\mathrm{XX}, +21$** = **Trisomy of chromosome $21$** dikhayega ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"Karyotype analysis **Trisomy of chromosome $21$** (**Option D**) dikhayega.","w":["**Option A ($47, \\mathrm{XXY}$):** Ye **Klinefelter's syndrome** hai (sterile tall male with gynaecomastia).","**Option B ($45, \\mathrm{XO}$):** **#1 EXAM TRAP!** *Female* word dekhkar log Turner's tick kar dete hain, jabki Turner's me rudimentary ovaries aur secondary sexual characters ki kami hoti hai, furrowed tongue / palm crease nahi!","**Option C ($47, \\mathrm{XYY}$):** Ye Jacob's supermale karyotype hai, female me possible hi nahi hai."],"t":"**WHAT A CLASSIC NTA TRAP!** *'Female individual'* sirf aapko $\\mathrm{XO}$ ki taraf bhatkane ke liye likha gaya hai — **Furrowed tongue + Palm crease = 1000% Down's Syndrome (Trisomy $21$)**!","sim":""},{"id":122,"q":"Which type of selection explains industrial melanism observed in moth, *Biston betularia*:","fig":"","opt":["Stabilising","Directional","Disruptive","Artificial"],"ans":1,"c":"**Natural Selection ke $3$ modes** (NCERT Class XII *Evolution*):<br>1) **Stabilising:** Mean character value wale individuals zyada survive karte hain (peak gets **higher & narrower**)<br>2) **Directional:** Ek extreme phenotype ki taraf population mean shift ho jaata hai (**peak shifts in ONE direction**)<br>3) **Disruptive:** Dono extreme ends survive karte hain (**TWO peaks** bante hain)!<br>Industrialisation ke baad soot-darkened pedon par light-winged moths shikar ban gaye aur dark melanic *Biston betularia* tezi se badhe — yaani peak **ek disha (dark phenotype) me shift** hua!","m":"White-winged $\\longrightarrow$ Dark melanic shift = **one-sided shift of population mean** = **Directional Selection**!","s":["Pre-industrial ($1850\\text{s}$): Lichen-covered safed tano par safed moths zyada bachte the.","Post-industrial ($1920\\text{s}$): Lichens mar gaye, kaale tano par **sirf dark melanic extreme** camouflage hokar bacha $\\implies$ gene frequency **ek disha me shift** hui.","Ye **Directional Natural Selection** ka textbook example hai ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"*Biston betularia* me industrial melanism **Directional** (**Option B**) natural selection samjhata hai.","w":["**Option A (Stabilising):** Stabilising selection ka classic example **human birth weight** hai (medium weight babies survive best).","**Option C (Disruptive):** Disruptive selection me intermediate hat-ta hai aur do alag peaks bante hain.","**Option D (Artificial):** Artificial selection insaan khud breeding se karwata hai (dogs, wild cabbage), shikar karne wale pakshi nahi!"],"t":"3 Selection Examples Ungliyon Par:<br>• **Stabilising:** Human baby birth weight<br>• **Directional:** Industrial melanism (*Biston betularia*) & DDT/antibiotic resistance!<br>• **Disruptive:** Two distinct shell/beak extremes!","sim":""},{"id":123,"q":"Select the correct statements regarding dissolved oxygen and Biochemical Oxygen Demand.<br>(A) $\\mathrm{BOD}$ is inversely related to dissolved oxygen.<br>(B) Only dissolved oxygen are affected by amount of organic matter in the water body.<br>(C) High $\\mathrm{BOD}$ leads to high dissolved oxygen.<br>(D) Both $\\mathrm{BOD}$ and dissolved oxygen are indicator of health of a water body.<br>(E) Both $\\mathrm{BOD}$ and dissolved oxygen are affected by amount of organic matter in the water body.<br>Choose the most appropriate answer from the options given below:","fig":"","opt":["(A), (B), (C), (E) only","(A), (D), (E) only","(A), (B), (C), (D) only","(B), (C), (D), (E) only"],"ans":1,"c":"**Biochemical Oxygen Demand ($\\mathrm{BOD}$)** $1\\,\\mathrm{L}$ paani me maujood saare organic matter ko aerobic bacteria dwara oxidise karne me lagne wali $\\ce{O2}$ ki matra hai:<br>$$\\text{Organic Pollution } \\uparrow \\implies \\mathrm{BOD} \\uparrow \\implies \\text{Dissolved Oxygen } (\\mathrm{DO}) \\downarrow$$!","m":"Inverse relation ($\\mathrm{BOD} \\propto \\dfrac{1}{\\mathrm{DO}}$) lagakar `(B)` aur `(C)` turant eliminate kar denge!","s":["**(A):** Sewage/organic waste girte hi microbes ghuli hui $\\ce{O2}$ kharch kar lete hain $\\implies$ **$\\mathrm{BOD}$ aur $\\mathrm{DO}$ inversely related hain** — **Sahi**!","**(B) & (C):** Organic matter **dono ($\\mathrm{BOD}$ aur $\\mathrm{DO}$)** ko affect karta hai (`B` galat), aur high $\\mathrm{BOD}$ se $\\mathrm{DO}$ **crash (low)** hota hai, high nahi (`C` galat)!","**(D) & (E):** $\\mathrm{BOD}$ aur $\\mathrm{DO}$ dono water pollution/health ke pramukh indicators hain aur dono organic matter ki matra par nirbhar karte hain — **Dono Sahi**! ($\\color{#7ee2b8}{\\text{(A), (D), (E) only — Option B}}$)"],"r":"Sahi kathan **(A), (D), (E) only** (**Option B**) hain.","w":["**Option A:** `(B)` aur `(C)` dono bilkul galat hain.","**Option C:** `(B)` aur `(C)` dono galat hain.","**Option D:** High $\\mathrm{BOD}$ paani se $\\mathrm{DO}$ khatam karke fish mortality karwata hai, high $\\mathrm{DO}$ nahi (`C` galat)!"],"t":"1-Second Rule: **Greater the $\\mathrm{BOD}$ of waste water, MORE is its polluting potential, and LOWER is its Dissolved Oxygen ($\\mathrm{DO}$)**!","sim":""},{"id":124,"q":"To ensure that only the desired pollens fall on the stigma in artificial hybridization process :<br>(a) the female flower buds of plant producing unisexual flower need not be bagged.<br>(b) there is no need to emasculate unisexual flowers of selected female parent.<br>(c) emasculated flowers are to be rebagged immediately after cross pollination.<br>(d) emasculated flowers are to be bagged after removal of anthers.<br>(e) bisexual flowers, showing protogyny are never selected for cross.<br>Choose the correct answer from the options given below:","fig":"","opt":["(a), (b) and (c) only","(b), (c) and (d) only","(b), (c) and (e) only","(a), (d) and (e) only"],"ans":1,"c":"NCERT Class XII (*Sexual Reproduction in Flowering Plants*, **Artificial Hybridisation**) ka exact protocol:<br>• **Bisexual flower:** **Emasculation** (bud khulne se pehle anther hatana) $\\longrightarrow$ **Bagging** (`d`) $\\longrightarrow$ Desired pollen dusting $\\longrightarrow$ **Re-bagging** (`c`)!<br>• **Unisexual female flower:** Stamen hote hi nahi, isliye **NO need of emasculation (`b`), LEKIN flower bud khulne se pehle BAGGING ZAROORI hoti hai** (taaki hawa/insects se unwanted foreign pollen na aa jaye — `a` GALAT hai)!!","m":"Unisexual female flower me **Emasculation = NO (`b` true)**, **Bagging = YES (`a` false!)** — bas isi ek point se poora sawal khul jaata hai!","s":["**(a) vs (b):** Unisexual female flower me anthers nahi hote isliye **emasculation ki zaroorat nahi hoti (`b` Sahi)**, par unwanted cross-pollen rokne ke liye **bud stage me bagging ZAROOR karni padti hai** (`a` Galat)!","**(c) & (d):** Bisexual flower se anthers hatane ke baad butter-paper bag pehnate hain (**bagging — `d` Sahi**), aur desired pollen chhidakne ke turant baad phir se **rebagging (`c` Sahi)** karte hain!","**(e):** Protogynous bisexual flowers cross-breeding me aasani se use hote hain (`e` Galat). Sahi jawab: $\\color{#7ee2b8}{\\text{(b), (c) and (d) only (Option B)}}$!"],"r":"Sahi kathan **(b), (c) and (d) only** (**Option B**) hain.","w":["**Option A:** **CLASSIC TRAP!** `(a)` galat hai — unisexual female flower bud ko bhi khulne se pehle **bag karna anivarya** hota hai!","**Option C:** `(e)` galat hai aur `(d)` chhod diya gaya hai.","**Option D:** `(a)` aur `(e)` dono hi statements galat hain."],"t":"Artificial Hybridisation Golden Table:<br>• **Bisexual female parent:** Emasculation **✓** + Bagging **✓** + Rebagging **✓**<br>• **Unisexual female parent:** Emasculation **✗** + **Bagging ✓** + **Rebagging ✓**!","sim":""},{"id":125,"q":"The World Summit on sustainable development held in $2002$ in Johannesburg, pledged for:","fig":"","opt":["A significant reduction in the current rate of biodiversity loss.","Declaration of more biodiversity hotspots.","Increase in agricultural production","Collection and preservation of seeds of different genetic strains of commercially important plants."],"ans":0,"c":"NCERT Class XII (*Biodiversity and Conservation*) ke **DO Historical Summits** jinme bacche aksar confuse hote hain:<br>1) **$1992$ Earth Summit — Rio de Janeiro:** Conservation of biodiversity & sustainable utilisation of its benefits.<br>2) **$2002$ World Summit on Sustainable Development — Johannesburg, South Africa:** $190$ countries pledged for **a significant reduction in the current rate of biodiversity loss** at global, regional and local levels by $2010$!","m":"**$2002$ + Johannesburg + $190$ countries** $=$ verbatim **'significant reduction in the current rate of biodiversity loss'**!","s":["Summit aur year dekhein: **World Summit on Sustainable Development, $2002$, Johannesburg (South Africa)**.","Isme $190$ deshon ne $2010$ tak global, regional aur local level par **biodiversity loss ki dar me bhaari kami (significant reduction)** laane ki shapath li!","Exact NCERT match $\\implies$ $\\color{#7ee2b8}{\\text{Option A}}$!"],"r":"$2002$ Johannesburg World Summit ne **A significant reduction in the current rate of biodiversity loss** (**Option A**) ke liye pledge liya tha.","w":["**Option B:** Hotspots Norman Myers ke scientific conservation priority regions hain, Johannesburg summit ka pledge nahi.","**Option C:** Agricultural production Green Revolution se juda hai.","**Option D:** Seed preservation *ex-situ conservation* (seed banks) ki salah Rio Earth Summit ($1992$) ke baad uubhri thi."],"t":"Dono Summits ek saath lock karo:<br>• **$1992$ = Earth Summit = Rio de Janeiro**<br>• **$2002$ = World Summit = Johannesburg ($190$ countries — reduce rate of biodiversity loss by $2010$)**!","sim":""},{"id":126,"q":"In general the embryo sac in angiosperm consists of:","fig":"q126","opt":["One egg cell, two synergids, three antipodal cells, two Polar nuclei","One egg cell, two synergids, two antipodal cells, three Polar nuclei","One egg cell, three synergids, two antipodal cells, two Polar nuclei","One egg cell, two synergids, two antipodal cells, two Polar nuclei"],"ans":0,"c":"Typical angiosperm mature female gametophyte (**Polygonum-type Embryo Sac**) mature hone par **$7$-celled aur $8$-nucleate** hota hai:<br>• **Micropylar end (Egg Apparatus):** **$1$ Egg cell + $2$ Synergids** ($3$ cells, $3$ nuclei)<br>• **Chalazal end:** **$3$ Antipodal cells** ($3$ cells, $3$ nuclei)<br>• **Large Central Cell ($1$ cell):** **$2$ Polar nuclei**!","m":"Cells aur nuclei dono jod kar double-check kar lenge: $1 + 2 + 3 + 1\\text{ (central cell)} = \\mathbf{7\\text{ cells}}$, aur $1 + 2 + 3 + 2\\text{ (polar nuclei)} = \\mathbf{8\\text{ nuclei}}$!","s":["**Micropylar Egg Apparatus:** $1$ egg cell + $2$ synergids (filiform apparatus sahit).","**Chalazal End:** $3$ antipodal cells.","**Central Cell:** $2$ polar nuclei $\\implies$ **One egg cell, two synergids, three antipodal cells, two Polar nuclei** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Angiosperm embryo sac me samanyatah **One egg cell, two synergids, three antipodal cells, two Polar nuclei** (**Option A**) hote hain.","w":["**Option B:** Antipodals $3$ hote hain ($2$ nahi) aur polar nuclei $2$ hote hain ($3$ nahi).","**Option C:** Synergids $2$ aur antipodals $3$ hote hain — yahan ulta likh diya hai.","**Option D:** Antipodal cells $3$ hote hain; $2$ lene par kul $7$ nuclei hi bante hain ($8$ nahi!)."],"t":"Count Check: **$1\\text{ (Egg)} + 2\\text{ (Synergids)} + 3\\text{ (Antipodals)} + 2\\text{ (Polar nuclei)} = \\mathbf{8\\text{ Nuclei in }7\\text{ Cells}}$**!","sim":""},{"id":127,"q":"Given below are two statements, one is labelled as Assertion (A) and the other is labelled as Reason (R).<br>**Assertion (A) :** When a particular restriction enzyme cuts strand of DNA, overhanging stretches or sticky ends are formed.<br>**Reason (R) :** All restriction enzymes cut the strand of DNA a little away from the centre of palindromic site.<br>In the light of the above statements, choose the correct answer from the options given below :","fig":"","opt":["(A) is correct but (R) is not correct","(A) is not correct but (R) is correct","Both (A) and (R) are correct and (R) is the correct explanation of (A)","Both (A) and (R) are correct but (R) is not the correct explanation of (A)"],"ans":0,"c":"**SUPERB NTA WORD TRAP — 'ALL'!**<br>• Ek particular restriction endonuclease (jaise ***Eco*RI**, recognition $\\ce{5'-G\\downarrow AATTC-3'}$) palindromic site ke center se thoda hatkar cut lagakar single-stranded overhanging **sticky ends** banata hai (**Assertion True**)!<br>• **LEKIN SABHI ('ALL') restriction enzymes center se hatkar cut NAHI lagate!** Kai restriction enzymes (jaise ***Eco*RV**, $\\ce{5'-GAT\\downarrow ATC-3'}$, *Sma*I, *Alu*I) palindromic site ke **bilkul beechon-beech** cut lagate hain aur **BLUNT (flush) ends** banate hain (**Reason FALSE**)!!","m":"Biology A–R golden rule: jab bhi Reason me extreme absolute shabd **'ALL', 'ONLY', 'ALWAYS', 'NEVER'** dikhe, chaukanna hokar exception check karo (*Eco*RV = blunt ends!)!","s":["**Assertion (A):** *'When **a particular** restriction enzyme (*Eco*RI) cuts strand of DNA, overhanging stretches or sticky ends are formed'* — exact NCERT line $\\implies$ **(A) is Correct**!","**Reason (R):** *'**All** restriction enzymes cut ... a little away from the centre'* — **FALSE!** *Eco*RV, *Sma*I, *Hae*III palindromic sequence ke **exact centre** par cut karke **blunt ends** banate hain!","Isliye **(A) is correct but (R) is not correct** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"**(A) is correct but (R) is not correct** (**Option A**).","w":["**Option B:** Assertion (A) bilkul sahi hai (*a particular* likha hai!).","**Option C:** **95% students ka trap!** Jo pehla word **'All'** dhyan se nahi padhte woh C tick karke $-1$ karwa lete hain!!","**Option D:** Reason (R) false hai kyunki blunt-end cutters (*Eco*RV) centre par hi kaat-te hain."],"t":"Sticky vs Blunt Contrast:<br>• ***Eco*RI:** $\\ce{G\\downarrow AATTC}$ $\\longrightarrow$ away from centre (**Sticky ends**)<br>• ***Eco*RV:** $\\ce{GAT\\downarrow ATC}$ $\\longrightarrow$ right at centre (**Blunt ends**) — isiliye **'ALL'** galat ho gaya!!","sim":""},{"id":128,"q":"Given below are two statements:<br>**Statement I :** Sickle cell anaemia and Haemophilia are autosomal dominant traits.<br>**Statement II :** Sickle cell anaemia and Haemophilia are disorders of the blood.<br>In the light of the above statements, choose the correct answer from the options given below :","fig":"","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":2,"c":"NCERT Mendelian Disorders me inheritance modes bilkul crista-clear hain:<br>• **Sickle cell anaemia** $=$ **Autosomal RECESSIVE** trait ($\\beta$-globin $\\mathrm{GAG \\to GUG}$, $\\mathrm{Glu \\to Val}$ at $6\\text{th}$ position)<br>• **Haemophilia** $=$ **Sex-linked (X-linked) RECESSIVE** trait (clotting protein defect)<br>Aur **DONO hi blood-related disorders** hain!","m":"Statement I (*autosomal dominant* — dono ke liye galat!) aur Statement II (*disorders of blood* — dono ke liye sahi!) compare karenge!","s":["**Statement I:** Sickle cell anaemia **autosomal recessive** hai aur Haemophilia **X-linked recessive** hai — dono me se **EK BHI dominant nahi hai**! $\\implies$ **Statement I Incorrect**!","**Statement II:** Sickle cell anaemia RBCs ($\\mathrm{Hb^S}$) ko affect karta hai aur Haemophilia blood clotting cascade ko $\\implies$ **dono blood disorders hain** $\\implies$ **Statement II Correct**!","Sahi jawab: **Statement I is incorrect but Statement II is correct** ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"**Statement I is incorrect but Statement II is correct** (**Option C**).","w":["**Option A:** Statement II bilkul sahi hai (RBC aur clotting dono blood disorders hain).","**Option B:** Dono statements ke status bilkul ulte likhe hain.","**Option D:** Statement I poori tarah galat hai (*autosomal dominant* NCERT example **Myotonic dystrophy** hota hai!)."],"t":"NCERT Pedigree Trio Ratt Lo:<br>• **Autosomal Dominant:** *Myotonic dystrophy*<br>• **Autosomal Recessive:** *Sickle-cell anaemia, Phenylketonuria, Thalassemia, Cystic fibrosis*<br>• **X-linked Recessive:** *Haemophilia, Colour blindness*!","sim":""},{"id":129,"q":"Select the **incorrect** match :","fig":"","opt":["Hypothyroidism — Deaf-mutism","Hypersecretion of growth hormone — Severe disfigurement","High pitch of voice — Female secondary sex characters","Gluconeogenesis — Contributes to hypoglycemia"],"ans":3,"c":"**Gluconeogenesis** = non-carbohydrate sources (amino acids, glycerol, lactate) se **NAYA GLUCOSE BANNA**! Glucagon aur Cortisol gluconeogenesis stimulate karte hain jisse blood glucose level **BADHTA hai — yaani ye HYPERGLYCEMIA karata hai, *hypoglycemia* NAHI**!!","m":"**Hypo** ($=$ *low blood sugar*) vs **Hyper** ($=$ *high blood sugar*) prefix dhyan se padhte hi Option D 1 second me pakda jaata hai!","s":["**Option A:** Pregnancy ke dauran maternal **hypothyroidism** se cretinism: stunted growth, mental retardation, low IQ, abnormal skin aur **deaf-mutism** hota hai — **Sahi**.","**Option B:** Adults me $\\mathrm{GH}$ hypersecretion (**Acromegaly**) se चेहरे ki haddiyon ka **severe disfigurement** hota hai — **Sahi**.","**Option C:** Estrogens female secondary sex characters aur **high pitch of voice** regulate karte hain — **Sahi**.","**Option D:** **Gluconeogenesis** blood glucose **badhata** hai (**hyperglycemia**, by glucagon!), ghatata (*hypoglycemia*) nahi! $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Match (Option D)}}$!"],"r":"Incorrect match **Gluconeogenesis — Contributes to hypoglycemia** (**Option D**) hai.","w":["**Option A:** Deaf-mutism cretinism (maternal hypothyroidism) ka word-for-word NCERT symptom hai.","**Option B:** Adult hypersecretion of $\\mathrm{GH}$ (*Acromegaly*) exact NCERT word *'severe disfigurement (especially of the face)'* deti hai.","**Option C:** High-pitched voice classic estrogen-mediated female secondary sexual character hai."],"t":"Prefix Trap Vigilance: **Glycogenesis** = glucose $\\downarrow$ (*hypoglycemic, Insulin*); **Glycogenolysis & Gluconeogenesis** = glucose $\\uparrow$ (**hyperglycemic, Glucagon**)!","sim":""},{"id":130,"q":"The **grinding region** and **incision region** are present upon which structure in cockroach :","fig":"","opt":["Mandible","Labrum","Antennae","Compound eye"],"ans":0,"c":"Cockroach (*Periplaneta americana*, biting & chewing type mouthparts — NCERT Class XI) ke mukh-angon me:<br>• Labrum = upper lip | Labium = lower lip | Hypopharynx = tongue<br>• **Paired Mandibles** = hard, chitinous jaws jinme bhojan kaatne aur peesne ke liye **ek INCISING region aur ek GRINDING region** hoti hai!","m":"Direct NCERT Cockroach Anatomy line: **Grinding region + Incising region $\\equiv$ Mandible**!","s":["Cockroach ke biting-and-chewing mouthparts me labrum, paired mandibles, paired maxillae, labium, aur hypopharynx hote hain.","Bhojan ko kaatne (**incision**) aur chabane/peesne (**grinding**) ke dentate kinare **Mandibles** ke andar waale hisse par hote hain!","Sahi jawab: **Mandible** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Cockroach me grinding aur incision regions **Mandible** (**Option A**) par upasthit hoti hain.","w":["**Option B (Labrum):** Labrum upper lip ka kaam karke khane ko pakadta hai, peesta nahi.","**Option C (Antennae):** Antennae sensory receptors hain jo environment (touch/smell/temperature) monitor karte hain.","**Option D (Compound eye):** Compound eye ($\\approx 2000$ ommatidia) mosaic vision ke liye hoti hai."],"t":"Cockroach Mouthparts Quick Map: **Upper lip = Labrum | Lower lip = Labium | Tongue = Hypopharynx | Incising + Grinding teeth = Mandibles**!","sim":""},{"id":131,"q":"Select the correct statement for given type of cross:<br>$\\mathrm{Rr}$ — Pink flower, $\\mathrm{RR}$ — Red flower, $\\mathrm{rr}$ — White flower<br>$\\mathrm{TT}$ — Tall plant, $\\mathrm{Tt}$ — Tall plant, $\\mathrm{tt}$ — Dwarf plant<br>$$\\mathrm{TTRr} \\times \\mathrm{Ttrr}$$<br>a. The percentage of tall plants are $100$<br>b. The percentage of pink flower are $50$<br>c. The percentage of red flower $25$<br>d. The percentage of white flower are $25$<br>e. The percentage of dwarf plant are zero","fig":"","opt":["a, b, e","Only a, b","Only b, c, e","b, c, d, e"],"ans":0,"c":"Independent assortment wale dihybrid cross ko **DO ALAG MONOHYBRID CROSSES** me tod lena genetics ka **sabse fast, $0$-error brahmastra** hai:<br>$$(\\mathrm{TT \\times Tt}) \\quad \\text{AUR} \\quad (\\mathrm{Rr \\times rr})$$!","m":"$16$-box Punnett square banane me time waste bilkul mat karo — dono genes alag solve karke $5$ second me exact percentages nikalo!!","s":["**Cross 1 (Height: $\\mathrm{TT \\times Tt}$):** Offsprings $= 50\\%\\;\\mathrm{TT} + 50\\%\\;\\mathrm{Tt}$ $\\implies$ **$100\\%$ Tall plants (`a` True)** aur **$0\\%$ Dwarf plants (`e` True)**!","**Cross 2 (Flower colour — Incomplete Dominance: $\\mathrm{Rr \\times rr}$):** Offsprings $= 50\\%\\;\\mathrm{Rr}\\;(\\text{Pink}) + 50\\%\\;\\mathrm{rr}\\;(\\text{White})$, aur **$0\\%\\;\\mathrm{RR}\\;(\\text{Red})$**!","Statements check karein: **Pink $= 50\\%$ (`b` True)**, Red $= 0\\% \\ne 25\\%$ (`c` False), White $= 50\\% \\ne 25\\%$ (`d` False) $\\implies$ $\\color{#7ee2b8}{\\text{a, b, e (Option A)}}$!"],"r":"Sahi statements **a, b, e** (**Option A**) hain.","w":["**Option B (Only a, b):** Statement `e` (*percentage of dwarf plants is zero*) bhi $100\\%$ sahi hai, use chhod nahi sakte!","**Option C:** Statement `c` galat hai — doosre parent $\\mathrm{rr}$ ke paas $\\mathrm{R}$ allele hi nahi hai, isliye Red ($\\mathrm{RR}$) $= \\mathbf{0\\%}$ banega!","**Option D:** `c` aur `d` dono galat hain (White $= 50\\%$ aur Red $= 0\\%$)."],"t":"Speed Genetics Trick: **Split ANY $n$-hybrid cross into $n$ separate $2 \\times 2$ monohybrid crosses** — $10\\times$ faster aur $0\\%$ calculation error!","sim":""},{"id":132,"q":"The example of organ of food storage :<br>(a) Potato &nbsp;&nbsp; (b) Ginger &nbsp;&nbsp; (c) Turmeric &nbsp;&nbsp; (d) *Zaminkand* &nbsp;&nbsp; (e) *Colocasia*","fig":"","opt":["Only a, b, c, e","Only b, c, d, e","All","Only a, c, d, e"],"ans":2,"c":"Old NCERT Class XI (*Morphology of Flowering Plants*, Modifications of Stem) ki exact line hai:<br>*'Underground stems of **potato, ginger, turmeric, zaminkand, colocasia** are modified to **store food** in them. They also act as **organs of perennation** to tide over conditions unfavourable for growth.'*!","m":"Paanchon naam ek hi NCERT sentence se word-for-word uthaye gaye hain!","s":["**(a) Potato:** Underground stem **tuber** — food storage + perennation.","**(b) Ginger & (c) Turmeric:** Underground horizontal **rhizome** — food storage + perennation.","**(d) *Zaminkand* (*Amorphophallus*) & (e) *Colocasia*:** Underground vertical **corm** — food storage + perennation $\\implies$ **PAANCHON SAHI = $\\color{#7ee2b8}{\\text{All (Option C)}}$**!"],"r":"Paanchon paudhe (**All** — **Option C**) underground food-storage stems hain.","w":["**Option A:** *Zaminkand* (`d`, corm) bhi food storage underground stem hai.","**Option B:** Potato (`a`, tuber) sabse famous food storage underground stem hai!","**Option D:** Ginger (`b`, rhizome) bhi food storage underground stem hai."],"t":"**DOUBLE BONUS FOR NEET:** Potato = Tuber | Ginger & Turmeric = Rhizome | *Zaminkand* & *Colocasia* = Corm — **PAANCHON STEM MODIFICATIONS hain (ROOT NAHI!)**!","sim":""},{"id":133,"q":"Given below are two statements:<br>**Statement I :** $\\mathrm{RQ} = 1 \\rightarrow$ Number of consumed oxygen molecules are equal to the number of evolved $\\ce{CO2}$ molecules during reaction.<br>**Statement II :** $\\mathrm{RQ} < 1 \\rightarrow$ Number of consumed oxygen molecules are more than the number of evolved $\\ce{CO2}$ molecules during reaction.<br>Choose the correct answer from the option given below:","fig":"","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"c":"**Respiratory Quotient ($\\mathrm{RQ}$)** ki formula-definition hai:<br>$$\\mathrm{RQ} = \\frac{\\text{Volume (or moles/molecules) of }\\ce{CO2}\\text{ evolved}}{\\text{Volume (or moles/molecules) of }\\ce{O2}\\text{ consumed}}$$!","m":"Seedha fraction $\\dfrac{\\ce{CO2}}{\\ce{O2}}$ me numerator aur denominator compare karenge!","s":["**Statement I ($\\mathrm{RQ} = 1$, e.g., Carbohydrates $6\\ce{CO2}/6\\ce{O2}$):** $\\dfrac{\\ce{CO2}\\text{ evolved}}{\\ce{O2}\\text{ consumed}} = 1 \\iff \\ce{O2}\\text{ consumed} = \\ce{CO2}\\text{ evolved}$ $\\implies$ **Correct**!","**Statement II ($\\mathrm{RQ} < 1$, e.g., Fats $= 0.7$, Proteins $= 0.9$):** $\\dfrac{\\ce{CO2}\\text{ evolved}}{\\ce{O2}\\text{ consumed}} < 1 \\iff \\ce{O2}\\text{ consumed} > \\ce{CO2}\\text{ evolved}$ $\\implies$ **Correct**!","Dono statements mathematically aur biologically $100\\%$ sahi hain $\\implies$ $\\color{#7ee2b8}{\\text{Option D}}$!"],"r":"**Both Statement I and Statement II are correct** (**Option D**).","w":["**Option A:** Dono hi statements formula $\\mathrm{RQ} = \\ce{CO2}/\\ce{O2}$ se seedhe sahi aate hain.","**Option B:** Statement II bilkul sahi hai (fats tripalmitin: $102\\,\\ce{CO2} / 145\\,\\ce{O2} = 0.7 < 1 \\implies \\ce{O2} > \\ce{CO2}$!).","**Option C:** Statement I carbohydrates ($\\ce{C6H12O6 + 6O2 -> 6CO2 + 6H2O}$) ke liye $100\\%$ sahi hai."],"t":"All NCERT $\\mathrm{RQ}$ Values Together: **Carbs $= 1.0$ | Proteins $\\approx 0.9$ | Fats (Tripalmitin) $= 0.7$ | Organic acids $> 1$ (Malic acid $= 1.33$) | Anaerobic $= \\infty$**!","sim":""},{"id":134,"q":"Seminal plasma, the fluid part of semen, is contributed by:<br>i. Seminal vesicle &nbsp;&nbsp; ii. Prostate gland &nbsp;&nbsp; iii. Urethra &nbsp;&nbsp; iv. Bulbourethral gland","fig":"","opt":["i and ii only","i, ii and iv","ii, iii and iv","i and iv only"],"ans":1,"c":"NCERT Class XII (*Human Reproduction*, Male Reproductive System) ke anusaar **male accessory glands** me **$3$ glands** shamil hain:<br>1) **Paired Seminal vesicles (`i`)**<br>2) **A single Prostate gland (`ii`)**<br>3) **Paired Bulbourethral / Cowper's glands (`iv`)**<br>In teeno glands ke secretions milkar **Seminal Plasma** banate hain (jo **fructose, calcium ($\\ce{Ca^{2+}}$), aur certain enzymes** se bharpoor hota hai)!","m":"Male accessory glands vs male accessory ducts (`urethra = duct`, gland nahi!) alag karte hi answer samne hai!","s":["**i. Seminal vesicles (paired), ii. Prostate (unpaired), iv. Bulbourethral glands (paired):** Ye teeno **male accessory glands** hain jo seminal plasma secrete karte hain!","**iii. Urethra:** Urethra ek **passage / accessory duct** (urinogenital duct) hai, glandular contributor nahi!","Isliye seminal plasma **i, ii and iv** dwara banta hai ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Seminal plasma **i, ii and iv** (**Option B** — Seminal vesicles, Prostate gland, aur Bulbourethral glands) dwara banta hai.","w":["**Option A (i and ii only):** Paired bulbourethral glands (`iv`) bhi seminal plasma aur penis lubrication me yogdan dete hain.","**Option C:** Urethra (`iii`) ek duct hai, accessory gland nahi.","**Option D:** Single prostate gland (`ii`) chhod diya gaya hai."],"t":"Paired vs Single Trap Alert: **Seminal vesicles = PAIRED | Bulbourethral = PAIRED | Prostate = SINGLE ($1$)**! Aur Seminal plasma rich in **Fructose + $\\ce{Ca^{2+}}$ + Enzymes**!","sim":""},{"id":135,"q":"The spermatogonia undergo division to produce sperms by the process of spermatogenesis. Choose the **correct** one with reference to above.","fig":"","opt":["Spermatogonia have $46$ chromosomes and always undergo meiotic cell division","Primary spermatocytes divide by mitotic cell division","Secondary spermatocytes have $23$ chromosomes and undergo second meiotic division","Spermatozoa are transformed into spermatids"],"ans":2,"c":"Human **Spermatogenesis** flow-chart (ploidy & division ke saath):<br>$$\\text{Spermatogonia } (2n=46) \\xrightarrow{\\text{Mitosis}} \\text{Primary Spermatocyte } (2n=46) \\xrightarrow{\\text{Meiosis I}} 2\\text{ Secondary Spermatocytes } (n=23) \\xrightarrow{\\text{Meiosis II}} 4\\text{ Spermatids } (n=23) \\xrightarrow{\\text{Spermiogenesis}} 4\\text{ Spermatozoa } (n=23)$$!","m":"Har cell stage ka chromosome count ($46$ vs $23$) aur division type (Mitosis vs Meiosis I vs Meiosis II) check karenge!","s":["**Option A:** Spermatogonia ($2n=46$) multiply karne ke liye **MITOSIS** karte hain (*always meiotic* galat!).","**Option B:** Primary spermatocytes ($2n=46$) **MEIOSIS I** karte hain (*mitotic* galat!).","**Option C:** Meiosis I ke baad bane **Secondary spermatocytes haploid ($n = 23$ chromosomes)** hote hain aur **second meiotic division (Meiosis II)** karke $4$ haploid spermatids banate hain — **100% CORRECT** ($\\color{#7ee2b8}{\\text{Option C}}$)!","**Option D:** Ulta likha hai — **Spermatids** transform hokar **spermatozoa** banate hain (**Spermiogenesis**), na ki spermatozoa se spermatids!"],"r":"Sahi kathan **Secondary spermatocytes have $23$ chromosomes and undergo second meiotic division** (**Option C**) hai.","w":["**Option A:** Spermatogonia germ cells mitosis se apni sankhya badhate hain, direct meiosis nahi karte.","**Option B:** Primary spermatocyte reductional Meiosis I karta hai, mitosis nahi.","**Option D:** Direction ulti di gayi hai: **Spermatids $\\xrightarrow{\\text{Spermiogenesis}}$ Spermatozoa (sperms)**!"],"t":"**Option D** exam pressure me $50\\%$ bacche ulta padh jaate hain — dhyan rakho: **Spermatid $\\longrightarrow$ Spermatozoa** (*Spermiogenesis*)!","sim":""},{"id":136,"q":"Given below are two statements:<br>**Statement I :** The effect of water as a factor is more through its effect on the plant, rather than directly on photosynthesis as a reactant.<br>**Statement II :** Due to water stress leaves become wilt and their metabolic activity is also reduced.<br>Choose the correct answer from the option given below:","fig":"","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"c":"NCERT Class XI (*Photosynthesis in Higher Plants*, **Water** factor paragraph) ki word-for-word lines:<br>• Halanki paani light reaction me ek reactant hai, **water ka prabhav direct reactant se kahin zyada plant ke upar indirect effect ke zariye hota hai**!<br>• **Water stress** se: (1) **stomata band (close)** ho jaate hain ($\\ce{CO2}$ availability ghat-ti hai), AUR (2) **leaves wilt (murjha)** jaati hain jisse leaf surface area aur **metabolic activity dono ghat jaate hain**!","m":"Dono sentences NCERT ke ek hi paragraph se verbatim aaye hain!","s":["**Statement I:** Exact verbatim NCERT first sentence of *Water* section: *'...the effect of water as a factor is more through its effect on the plant, rather than directly on photosynthesis.'* $\\implies$ **Correct**!","**Statement II:** Exact verbatim NCERT next sentence: *'Water stress also makes **leaves wilt**, thus, reducing the surface area of the leaves and **their metabolic activity as well**.'* $\\implies$ **Correct**!","Dono statements $100\\%$ sahi hain $\\implies$ $\\color{#7ee2b8}{\\text{Option D}}$!"],"r":"**Both Statement I and Statement II are correct** (**Option D**).","w":["**Option A:** Dono sentences NCERT Plant Physiology ke verbatim true statements hain.","**Option B:** Statement II bhi $100\\%$ sahi hai.","**Option C:** Statement I bilkul sahi hai (kul absorbed paani ka $<1\\%$ hi photosynthesis reactant banta hai!)."],"t":"Logic samjho toh kabhi bhoologe nahi: Plant ke absorbed paani ka **$<1\\%$** hi photolysis me lagta hai — isliye paani ki kami se pehle **stomata close + leaf wilting** photosynthesis girati hai!","sim":""},{"id":137,"q":"Viviparity is considered to be more evolved because:","fig":"","opt":["the young ones are left on their own","the young ones are protected by a thick shell","the young ones are protected inside the mother's body and are looked after they are born leading to more chances of survival","the embryo takes a long time to develop"],"ans":2,"c":"**Oviparous** jantuon ke ande bahari वातावरण me predators aur khatron ke samne asurakshit rehte hain, jabki **Viviparous** jantuon (adhikansh mammals) me **proper embryonic care aur protection mother ke sharir ke andar** milti hai, aur janm ke baad bhi dekभाल hone se **young ones ke survival chances kahin zyada badh jaate hain**!","m":"Evolutionary advantage = **higher survival probability of offspring due to internal protection & maternal care**!","s":["Oviparous animals me shelled eggs bahar predator attack ke khatre me rehte hain.","Viviparous organisms me embryo female body ke andar safe rehta hai aur birth ke baad parental care milti hai.","Isse **survival chances of young ones bahot badh jaate hain** ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"Viviparity zyada viksit maani jaati hai kyunki **the young ones are protected inside the mother's body and are looked after they are born leading to more chances of survival** (**Option C**).","w":["**Option A:** Akela chhod dena (*left on their own*) survival kam karta hai, evolutionary advantage nahi hai.","**Option B:** Thick calcareous shell **oviparous** reptiles aur birds ki visheshta hai, viviparous ki nahi!","**Option D:** Lamba gestation khud me maqsad nahi hai; asli faayda **high survival probability** hai."],"t":"1-Line NCERT Contrast: **Oviparous = Calcareous shell outside (lower survival)** vs **Viviparous = Protected inside mother's body (higher survival)**!","sim":""},{"id":138,"q":"In malignant tumors, the cells proliferate, grow rapidly and move to other parts of the body to form new tumors. This stage of disease is called:","fig":"","opt":["metagenesis","metastasis","teratogenesis","mitosis"],"ans":1,"c":"**Malignant tumors** se slough-off hokar cancer cells **blood aur lymph ke raste distant sites tak pahunch jaate hain** aur jahan rukte hain wahan **naye secondary tumors** shuru kar dete hain — malignant tumors ki is **sabse khaufnak (most feared) property** ko **METASTASIS** kehte hain!","m":"Look-alike terms **Metagenesis** vs **Metastasis** kabhi confuse mat karna!","s":["**Metagenesis (Option A):** Coelenterates (*Obelia*) me polyp $\\leftrightarrow$ medusa alternation of generations.","**Metastasis (Option B):** Malignant tumor cells ka blood/lymph dwara door-daraaz angon me phail kar naye tumors banana $\\implies$ $\\color{#7ee2b8}{\\text{Option B}}$!","**Teratogenesis (Option C):** Congenital birth defects (jaise thalidomide se).","**Mitosis (Option D):** Normal equational somatic cell division."],"r":"Malignant cancer ke is sabse khatarnak phailav gun ko **metastasis** (**Option B**) kehte hain.","w":["**Option A (metagenesis):** *Obelia* (Cnidaria) me asexual polyp aur sexual medusa ke alternation ko metagenesis kehte hain!","**Option C (teratogenesis):** Embryo me developmental abnormalities utpann hona teratogenesis hai.","**Option D (mitosis):** Normal controlled cell division hai, secondary distant tumor spread nahi."],"t":"3 Confusing 'Meta-' Terms Ek Saath Clear Karo:<br>• **Metastasis** = Cancer spread via blood (*Malignant tumor*)<br>• **Metagenesis** = Alternation of generation (*Obelia*)<br>• **Metamerism** = True metameric segmentation (*Earthworm*)!","sim":""},{"id":139,"q":"Given below are two statements:<br>**Statement I :** In angiosperm the viability of seed may vary from few months to thousands years.<br>**Statement II :** In *Ficus* a big tree developed from a very large seeds.<br>Choose the correct answer from the option given below:","fig":"","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":1,"c":"NCERT Class XII (*Sexual Reproduction in Flowering Plants*, Seed section) ki do super-famous lines:<br>1) **Seed Viability:** Kuch mahinon (*Oxalis*) se lekar hazaron saalon tak — ***Lupinus arcticus*** ($10,000\\text{ years}$ dormancy in Arctic Tundra!) aur ***Phoenix dactylifera*** ($2,000\\text{ years}$ at King Herod's palace, Dead Sea)!<br>2) **Tiny Seed Wonder:** Ek vishal banyan/peepal ped (***Ficus***) ek **TINY (nanhe se) seed** se paida hota hai, aur har orchid fruit me hazaron tiny seeds hote hain (*Orobanche, Striga* me bhi)!","m":"Statement II me **'very large seeds'** word dekhte hi red alert — *Ficus* ka beej **bahut TINY** hota hai!!","s":["**Statement I:** Seed viability kuch mahinon se hazaron saalon (*Lupinus arcticus* — $10,000\\text{ years}$; *Phoenix dactylifera* — $2,000\\text{ years}$) tak hoti hai $\\implies$ **Correct**!","**Statement II:** NCERT wonder box: *'How **tiny** is the seed of **Ficus** and how large is the tree developed from that tiny seed!'* — *very large seed* bilkul ulta likha hai (*Lodoicea* double coconut ka seed bada hota hai, *Ficus* ka nahi!) $\\implies$ **Incorrect**!","Sahi jawab: **Statement I is correct but Statement II is incorrect** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"**Statement I is correct but Statement II is incorrect** (**Option B**).","w":["**Option A:** Statement I (*Lupinus* $10,000\\text{ yr}$, *Phoenix* $2,000\\text{ yr}$) $100\\%$ NCERT true hai.","**Option C:** Dono statements ke true/false status ulte hain.","**Option D:** Peepal/Bargad (*Ficus*) ke figs ke andar dana-jaisa **tiny seed** hota hai, *very large* nahi!"],"t":"3 Iconic NCERT Seed Records:<br>• **$10,000\\text{ years}$ old viable seed:** *Lupinus arcticus*<br>• **$2,000\\text{ years}$ old viable seed:** *Phoenix dactylifera* (Date palm)<br>• **Tiny seed $\\longrightarrow$ Huge tree / parasitic tiny seeds:** ***Ficus***, *Orchids*, *Orobanche*, *Striga*!","sim":""},{"id":140,"q":"Methanogenic bacteria are **not** found in :","fig":"","opt":["Rumen of cattle","Gobar gas plant","Flocs","Bio gas plant"],"ans":2,"c":"**Methanogens** (jaise ***Methanobacterium***) **strict ANAEROBIC archaebacteria** hote hain jo cellulosic padarthon par grow karke **$\\ce{CH4 + CO2 + H2}$ (biogas)** banate hain!<br>• Ye **cattle ke rumen**, **anaerobic sludge digesters**, aur **gobar gas / biogas plants** me bhari matra me hote hain.<br>• Iske bilkul ulat **FLOCS** secondary sewage treatment ke **aeration tank** me lagatar mechanical agitation + $\\ce{O2}$ pumping ke beech banne wale **AEROBIC bacteria + fungal filaments ke mesh-like structures** hote hain!","m":"**Anaerobic (*Methanogens*)** vs **Aerobic (*Flocs* in aeration tank)** contrast lagate hi `Flocs` turant pakda jaata hai!","s":["**Options A, B, D:** Rumen of cattle (*Methanobacterium* cellulose digest karta hai), Gobar gas plant, aur Biogas plant teeno **anaerobic** jagah hain jahan methanogens mukhya microflora hote hain!","**Option C (Flocs):** **Flocs** $=$ masses of **AEROBIC bacteria associated with fungal filaments** forming mesh-like structures in aerobic aeration tanks — yahan anaerobic methanogens survive hi nahi karte!","Sahi jawab: **Flocs** ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"Methanogenic bacteria **Flocs** (**Option C**) me **nahi** paaye jaate.","w":["**Option A (Rumen of cattle):** Gaay-bhains ke rumen me *Methanobacterium* cellulose pachane me madad karta hai.","**Option B (Gobar gas plant):** Gobar me aaye methanogens hi gobar gas ($\\ce{CH4}$) paida karte hain.","**Option D (Bio gas plant):** Anaerobic sludge digester / biogas plant me methanogens hi biogas banate hain."],"t":"Sewage Treatment Twin Contrast:<br>• **Aeration Tank = FLOCS = Aerobic bacteria + Fungal filaments** (reduces $\\mathrm{BOD}$)<br>• **Anaerobic Sludge Digester = METHANOGENS** (produces biogas $\\ce{CH4 + H2S + CO2}$)!","sim":""},{"id":141,"q":"The correct option for **Restriction enzyme** :","fig":"","opt":["Cleaving of phosphodiester bond in DNA by the enzyme","Cutting of DNA at specific position","Prevention of the multiplication of bacteriophage by the host bacteria","All of the above"],"ans":3,"c":"**Restriction Endonucleases ('Molecular Scissors')** nucleases family ke enzymes hain! $1963$ me *E. coli* se do enzymes isolate kiye gaye the jo **bacteriophage ki growth ko RESTRICT** karte the: ek methylase, aur doosra **restriction endonuclease** — jo specific palindromic nucleotide sequence pehchan kar **sugar-phosphate backbone ke phosphodiester bonds ko specific position par cut** karta hai!","m":"NCERT Class XII (*Biotechnology: Principles and Processes*) ke teeno historical aur functional points check karenge!","s":["**Option A:** Restriction enzyme DNA ke sugar-phosphate backbone me **phosphodiester bond** cleave (hydrolyse) karta hai — **Sahi**.","**Option B:** Har restriction endonuclease DNA ko ek خاص **specific recognition sequence** par hi kaat-ta hai — **Sahi**.","**Option C:** Naam *'restriction'* pada hi isiliye kyunki ye bacteria me **bacteriophage multiplication ko prevent/restrict** karta hai — **Sahi**!","Teeno kathan $100\\%$ sahi hain $\\implies$ **All of the above** ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"Restriction enzyme ke liye **All of the above** (**Option D**) bilkul sahi hai.","w":["**Option A:** Ye sahi hai, par Options B aur C bhi barabar sahi hone se adhura hai.","**Option B:** Ye sahi hai, par A aur C chhodne se adhura hai.","**Option C:** Ye sahi hai, par A aur B chhodne se adhura hai."],"t":"Restriction Modification System ($1963$, *E. coli*): **Methylase** host DNA ko methylate karke bachata hai + **Restriction endonuclease** foreign phage DNA ka **phosphodiester bond** kaat deta hai!","sim":""},{"id":142,"q":"A **protoxin** is:","fig":"","opt":["Active toxin","A denatured toxin","Toxin produced by protozoa","Inactive toxin"],"ans":3,"c":"*Bacillus thuringiensis* (**Bt**) bacterium protein crystals banata hai jinme **insecticidal protein** hoti hai. Sawal uthta hai — **ye Bt toxin khud *Bacillus* bacterium ko kyun nahi maarta?!** Kyunki Bt toxin bacterium ke andar **INACTIVE PROTOXIN** ke roop me maujood rehta hai, aur keval insect gut ke **alkaline $\\mathrm{pH}$** me ghulkar active toxin me badalta hai!","m":"Prefix **Pro-** (jaise *proinsulin, pepsinogen, proenzyme*) = **inactive precursor** $\\implies$ **Inactive toxin**!","s":["**Pro-** prefix biology me hamesha **inactive precursor molecule** dikhata hai (e.g., *proinsulin, prothrombin, p
