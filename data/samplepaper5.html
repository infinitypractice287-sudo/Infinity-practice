  ans: {},      // { [id]: 0..3 }
  skipped: {},  // { [id]: true }
  filter: "all",
  view: "quiz", // "quiz" | "summary"

};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        state.cur = Math.max(0, Math.min(TOTAL - 1, Number(parsed.cur) || 0));
        state.ans = parsed.ans && typeof parsed.ans === "object" ? parsed.ans : {};
        state.skipped = parsed.skipped && typeof parsed.skipped === "object" ? parsed.skipped : {};
        state.filter = ["all", "answered", "unanswered"].includes(parsed.filter) ? parsed.filter : "all";
        state.view = parsed.view === "summary" ? "summary" : "quiz";
        state.reviewAll = Boolean(parsed.reviewAll);
      }
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

const GREEK_MAP = {
  alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", varepsilon: "ε",
  zeta: "ζ", eta: "η", theta: "θ", iota: "ι", kappa: "κ", lambda: "λ",
  mu: "μ", nu: "ν", xi: "ξ", pi: "π", rho: "ρ", sigma: "σ", tau: "τ",
  phi: "φ", varphi: "φ", chi: "χ", psi: "ψ", omega: "ω",
  Gamma: "Γ", Delta: "Δ", Theta: "Θ", Lambda: "Λ", Pi: "Π", Sigma: "Σ",
  Phi: "Φ", Psi: "Ψ", Omega: "Ω",
  times: "×", cdot: "·", pm: "±", mp: "∓", div: "÷",
  le: "≤", leq: "≤", ge: "≥", geq: "≥", ne: "≠", neq: "≠",
  approx: "≈", simeq: "≃", equiv: "≡", propto: "∝", infty: "∞",
  rightarrow: "→", to: "→", gets: "←", leftrightarrow: "↔",
  Rightarrow: "⇒", implies: "⟹", iff: "⟺", rightleftharpoons: "⇌",
  uparrow: "↑", downarrow: "↓", circ: "°", degree: "°", prime: "′",
  partial: "∂", nabla: "∇", int: "∫", sum: "∑", prod: "∏",
  therefore: "∴", because: "∵", angle: "∠", perp: "⊥", parallel: "∥",
  AA: "Å", ell: "ℓ", hbar: "ℏ", sin: "sin", cos: "cos", tan: "tan",
  sec: "sec", csc: "csc", cot: "cot", log: "log", ln: "ln", max: "max", min: "min"
};

function takeGroup(s, pos) {
  while (pos < s.length && s[pos] === " ") pos++;
  if (pos >= s.length) return ["", pos];
  if (s[pos] === "{") {
    let depth = 1, i = pos + 1;
    while (i < s.length && depth > 0) {
      if (s[i] === "\\") i += 2;
      else {
        if (s[i] === "{") depth++;
        else if (s[i] === "}") depth--;
        i++;
      }
    }
    return [s.slice(pos + 1, i - 1), i];
  }
  if (s[pos] === "\\") {
    let i = pos + 1;
    while (i < s.length && /[a-zA-Z]/.test(s[i])) i++;
    return [s.slice(pos, i), i];
  }
  return [s[pos], pos + 1];
}

function renderChemFallback(ce) {
  let s = ce.trim();
  // Handle arrows with optional [above][below]
  s = s.replace(/<=>/g, " ⇌ ");
  s = s.replace(/<->/g, " ↔ ");
  s = s.replace(/->\[([^\]]*)\]\[([^\]]*)\]/g, (_, a, b) =>
    `<span class="fb-rxn-arr"><span class="fb-rxn-top">${renderTexFallback(a)}</span><span>⟶</span><span class="fb-rxn-bot">${renderTexFallback(b)}</span></span>`
  );
  s = s.replace(/->\[([^\]]*)\]/g, (_, a) =>
    `<span class="fb-rxn-arr"><span class="fb-rxn-top">${renderTexFallback(a)}</span><span>⟶</span></span>`
  );
  s = s.replace(/->/g, " ⟶ ");
  s = s.replace(/\\underline\{([^}]*)\}/g, "<u>$1</u>");
  s = s.replace(/\\overset\{([^}]*)\}\{([^}]*)\}/g, "<span class=\"fb-over\"><sup>$1</sup>$2</span>");
  s = s.replace(/\\text\{([^}]*)\}/g, "<span class=\"rm\">$1</span>");
  // Triple & double bonds
  s = s.replace(/#/g, "≡").replace(/=/g, "=");
  // Isotope pre-superscript/subscript e.g. ^{14}_{6}C
  s = s.replace(/\^\{([^}]*)\}_\{([^}]*)\}/g, "<sup>$1</sup><sub>$2</sub>");
  // Explicit braced charges/superscripts & subscripts
  s = s.replace(/\^\{([^}]*)\}/g, (_, g) => `<sup>${g.replace(/-/g, "−")}</sup>`);
  s = s.replace(/_\{([^}]*)\}/g, "<sub>$1</sub>");
  // Subscript digits right after element letters or closing parens/brackets
  s = s.replace(/([A-Za-z)\]])(\d+)/g, "$1<sub>$2</sub>");
  // Terminal ion charges like Fe3+, OH-, Cl-
  s = s.replace(/([A-Za-z0-9>])([+-])(?=\s|$|[),.;])/g, (_, ch, sgn) => `${ch}<sup>${sgn === "-" ? "−" : "+"}</sup>`);
  return `<span class="rm">${s}</span>`;
}

function renderTexFallback(tex) {
  let out = "", i = 0;
  while (i < tex.length) {
    const ch = tex[i];
    if (ch === "\\") {
      if (tex[i + 1] === "," || tex[i + 1] === ";" || tex[i + 1] === " ") { out += "&#8239;"; i += 2; continue; }
      if (tex[i + 1] === "!" ) { i += 2; continue; }
      if ("{}%&_".includes(tex[i + 1] || "")) { out += tex[i + 1]; i += 2; continue; }
      let j = i + 1;
      while (j < tex.length && /[a-zA-Z]/.test(tex[j])) j++;
      const cmd = tex.slice(i + 1, j);
      i = j;
      if (cmd === "ce") {
        const [g, ni] = takeGroup(tex, i); i = ni;
        out += renderChemFallback(g);
      } else if (cmd === "frac" || cmd === "dfrac" || cmd === "tfrac") {
        const [n, i1] = takeGroup(tex, i);
        const [d, i2] = takeGroup(tex, i1); i = i2;
        out += `<span class="fb-frac"><span class="fb-num">${renderTexFallback(n)}</span><span class="fb-den">${renderTexFallback(d)}</span></span>`;
      } else if (cmd === "sqrt") {
        let root = "";
        if (tex[i] === "[") {
          const cl = tex.indexOf("]", i);
          if (cl !== -1) { root = `<sup>${tex.slice(i + 1, cl)}</sup>`; i = cl + 1; }
        }
        const [rad, ni] = takeGroup(tex, i); i = ni;
        out += `<span class="fb-sqrt">${root}&radic;<span class="fb-rad">${renderTexFallback(rad)}</span></span>`;
      } else if (cmd === "cancel") {
        const [g, ni] = takeGroup(tex, i); i = ni;
        out += `<span class="fb-cancel">${renderTexFallback(g)}</span>`;
      } else if (cmd === "color") {
        const [col, i1] = takeGroup(tex, i);
        const [body, i2] = takeGroup(tex, i1); i = i2;
        out += `<span style="color:${col}">${renderTexFallback(body)}</span>`;
      } else if (cmd === "mathbf" || cmd === "textbf" || cmd === "boldsymbol") {
        const [g, ni] = takeGroup(tex, i); i = ni;
        out += `<strong>${renderTexFallback(g)}</strong>`;
      } else if (cmd === "mathrm" || cmd === "text" || cmd === "operatorname") {
        const [g, ni] = takeGroup(tex, i); i = ni;
        out += `<span class="rm">${renderTexFallback(g)}</span>`;
      } else if (cmd === "underline") {
        const [g, ni] = takeGroup(tex, i); i = ni;
        out += `<u>${renderTexFallback(g)}</u>`;
      } else if (cmd === "hat") {
        const [g, ni] = takeGroup(tex, i); i = ni;
        out += `${renderTexFallback(g)}&#770;`;
      } else if (cmd === "vec" || cmd === "overrightarrow") {
        const [g, ni] = takeGroup(tex, i); i = ni;
        out += `${renderTexFallback(g)}&#8407;`;
      } else if (cmd === "left" || cmd === "right") {
        if (tex[i] && tex[i] !== ".") { out += tex[i]; }
        i++;
      } else if (GREEK_MAP[cmd]) {
        out += GREEK_MAP[cmd];
      } else {
        out += cmd;
      }
    } else if (ch === "^") {
      const [g, ni] = takeGroup(tex, i + 1); i = ni;
      out += `<sup>${renderTexFallback(g)}</sup>`;
    } else if (ch === "_") {
      const [g, ni] = takeGroup(tex, i + 1); i = ni;
      out += `<sub>${renderTexFallback(g)}</sub>`;
    } else if (ch === "{") {
      const [g, ni] = takeGroup(tex, i); i = ni;
      out += renderTexFallback(g);
    } else if (ch === "-") {
      out += "−"; i++;
    } else {
      out += ch; i++;
    }
  }
  return out;
}

function renderMathInContainer(el) {
  if (!el) return;
  if (window.renderMathInElement && window.katex) {
    try {
      window.renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false,
        trust: true,
        strict: false
      });
      return;
    } catch (e) {}
  }
  // Seamless offline fallback walk on text nodes inside el
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) {
    if (n.nodeValue && n.nodeValue.indexOf("$") !== -1) nodes.push(n);
  }
  nodes.forEach((textNode) => {
    const html = textNode.nodeValue
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => `<div class="math-fb" style="text-align:center;margin:8px 0">${renderTexFallback(m)}</div>`)
      .replace(/\$([^$]+?)\$/g, (_, m) => `<span class="math-fb">${renderTexFallback(m)}</span>`);
    const span = document.createElement("span");
    span.innerHTML = html;
    textNode.parentNode.replaceChild(span, textNode);
  });
}

      }
    } else {
      unattempted++;
    }
  });
  const score = right * 4 - wrong * 1;
  const attempted = right + wrong;
  const accuracy = attempted > 0 ? ((right / attempted) * 100).toFixed(1) : "0.0";
  return { right, wrong, unattempted, attempted, score, maxScore: TOTAL * 4, accuracy, bySubj };
}

function updateTopBarAndPalette() {
  const m = computeMetrics();
  document.getElementById("liveScore").textContent = `${m.score} / ${m.maxScore}`;
  document.getElementById("doneCount").textContent = `${m.attempted} / ${TOTAL}`;
  document.getElementById("topProgressPill").textContent = `Q${QUESTIONS[state.cur].id} / ${TOTAL}`;
  document.getElementById("progressBar").style.width = `${((m.attempted / TOTAL) * 100).toFixed(1)}%`;

  // Filter tabs state
  document.querySelectorAll("#filterTabs .tab-btn").forEach((b) => {
    b.classList.toggle("active", b.dataset.filter === state.filter);
  });

  // Render palette buttons
  const grid = document.getElementById("qGrid");
  let html = "", shown = 0;
  QUESTIONS.forEach((q, idx) => {
    const hasAns = Object.prototype.hasOwnProperty.call(state.ans, q.id);
    if (state.filter === "answered" && !hasAns) return;
    if (state.filter === "unanswered" && hasAns) return;
    shown++;
    let cls = "grid-btn";
    if (hasAns) cls += state.ans[q.id] === q.ans ? " ans-ok" : " ans-bad";
    else if (state.skipped[q.id]) cls += " skipped";
    if (idx === state.cur && state.view === "quiz") cls += " current";
    html += `<button class="${cls}" type="button" data-idx="${idx}">${q.id}</button>`;
  });
  grid.innerHTML = html || `<div style="grid-column:1/-1;color:var(--muted);font-size:0.84rem;padding:8px 0;">Is filter me koi question nahi hai.</div>`;
  document.getElementById("paletteCount").textContent = `${shown} Qs`;
}

function formatRichText(str) {
  return (str || "").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

function buildSimulationHTML(simKey) {
  const sim = SIMS[simKey];
  if (!sim) return "";
  let controls = "";
  sim.sliders.forEach((sl) => {
    controls += `<div class="sim-row">
      <span>${sl.label}</span>
      <strong id="simVal_${sl.key}">${sl.val}</strong>
      <input type="range" data-simkey="${sl.key}" min="${sl.min}" max="${sl.max}" step="${sl.step}" value="${sl.val}">
    </div>`;
  });
  return `<div class="sim-box" id="activeSimBox" data-sim="${simKey}">
    <div class="sim-title">${sim.title}</div>
    <div class="sim-controls">${controls}</div>
    <div class="sim-stage" id="simStage"></div>
    <div class="sim-readout" id="simReadout"></div>
  </div>`;
}

function bindSimulation(simKey) {
  const box = document.getElementById("activeSimBox");
  const sim = SIMS[simKey];
  if (!box || !sim) return;
  const vals = {};
  sim.sliders.forEach((sl) => { vals[sl.key] = sl.val; });
  const refresh = () => {
    const out = sim.render(vals);
    document.getElementById("simStage").innerHTML = out.svg;
    const rd = document.getElementById("simReadout");
    rd.innerHTML = out.readout;
    renderMathInContainer(rd);
  };
  box.querySelectorAll("input[type='range']").forEach((inp) => {
    inp.addEventListener("input", () => {
      const k = inp.dataset.simkey;
      vals[k] = Number(inp.value);
      document.getElementById(`simVal_${k}`).textContent = inp.value;
      refresh();
    });
  });
  refresh();
}

function renderExplanationHTML(q) {
  const letters = ["A", "B", "C", "D"];
  const stepsHtml = q.s.map((st) => `<li>${formatRichText(st)}</li>`).join("");
  const wrongHtml = q.w.map((wr) => `<li>${formatRichText(wr)}</li>`).join("");
  const tipHtml = q.t
    ? `<div class="exp-sec"><div class="exp-label">6. Kaam Ki Tip</div><div class="exp-tip">${formatRichText(q.t)}</div></div>`
    : "";
  const simHtml = q.sim ? buildSimulationHTML(q.sim) : "";
  const flagNote = FLAGGED_MAP[q.id]
    ? `<div class="flag-note"><strong>QA Flag Note (Q${q.id}):</strong> ${formatRichText(FLAGGED_MAP[q.id])}</div>`
    : "";

  return `<div class="explain-box" id="explainBox">
    <div class="exp-sec">
      <div class="exp-label">1. Concept (Bilkul Zero Se)</div>
      <div>${formatRichText(q.c)}</div>
    </div>
    <div class="exp-sec">
      <div class="exp-label">2. Kaun Sa Method Aur Kyun</div>
      <div>${formatRichText(q.m)}</div>
    </div>
    <div class="exp-sec">
      <div class="exp-label">3. Step-by-Step Solution</div>
      <ol class="exp-steps">${stepsHtml}</ol>
    </div>
    <div class="exp-sec">
      <div class="exp-label">4. Final Answer</div>
      <div class="exp-final"><strong>Correct Option ${letters[q.ans]}:</strong> ${formatRichText(q.r)}</div>
    </div>
    <div class="exp-sec">
      <div class="exp-label">5. Baaki Options Galat Kyun Hain</div>
      <ul class="exp-wrong-list">${wrongHtml}</ul>
    </div>
    ${tipHtml}
    ${simHtml}
    ${flagNote}
  </div>`;
}

// Render ONLY the current question (or Summary view when submitted)
function renderCurrentView() {
  updateTopBarAndPalette();
  const main = document.getElementById("mainArea");

  if (state.view === "summary") {
    const m = computeMetrics();
    let subjCards = "";
    ["Physics", "Chemistry", "Biology"].forEach((s) => {
      const d = m.bySubj[s];
      if (!d) return;
      const sc = d.right * 4 - d.wrong;
      subjCards += `<div class="sum-box">
        <div class="sum-val" style="font-size:1.3rem">${sc} / ${d.total * 4}</div>
        <div class="sum-lbl">${s} (+${d.right} / −${d.wrong})</div>
      </div>`;
    });

    main.innerHTML = `<div class="card">
      <h2 style="font-size:1.35rem;margin-bottom:6px;">Test Complete — Result Summary</h2>
      <p style="color:var(--muted);font-size:0.95rem;">Marking scheme: $+4$ sahi jawab ke liye, $-1$ galat jawab ke liye, $0$ unattempted ke liye.</p>
      <div class="summary-grid">
        <div class="sum-box"><div class="sum-val" style="color:var(--green-text)">${m.score} / ${m.maxScore}</div><div class="sum-lbl">Total Score</div></div>
        <div class="sum-box"><div class="sum-val" style="color:#60a5fa">${m.accuracy}%</div><div class="sum-lbl">Accuracy</div></div>
        <div class="sum-box"><div class="sum-val" style="color:var(--green-text)">${m.right}</div><div class="sum-lbl">Correct (+${m.right * 4})</div></div>
        <div class="sum-box"><div class="sum-val" style="color:var(--red-text)">${m.wrong}</div><div class="sum-lbl">Wrong (−${m.wrong})</div></div>
        <div class="sum-box"><div class="sum-val" style="color:#fcd34d">${m.unattempted}</div><div class="sum-lbl">Unattempted (0)</div></div>
      </div>
      <h3 style="font-size:1.02rem;margin:14px 0 6px;color:var(--muted)">Subject-wise Breakdown</h3>
      <div class="summary-grid">${subjCards}</div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;">
        <button class="btn btn-primary" id="reviewAllBtn" type="button">Review All Answers (Q1–Q${TOTAL})</button>
        <button class="btn" id="resumeBtn" type="button">Back to Question View</button>
        <button class="btn btn-danger" id="restartSummaryBtn" type="button">Restart Quiz</button>
      </div>
    </div>`;

    renderMathInContainer(main);
    document.getElementById("reviewAllBtn").onclick = () => {
      state.view = "quiz";
      state.reviewAll = true;
      state.cur = 0;
      saveState();
      renderCurrentView();
    };
    document.getElementById("resumeBtn").onclick = () => {
      state.view = "quiz";
      saveState();
      renderCurrentView();
    };
    document.getElementById("restartSummaryBtn").onclick = promptRestart;
    return;
  }

  const q = QUESTIONS[state.cur];
  const subj = getSubject(q.id);
  const letters = ["A", "B", "C", "D"];
  const hasAns = Object.prototype.hasOwnProperty.call(state.ans, q.id);
  const showSol = hasAns || state.reviewAll;
  const userChoice = state.ans[q.id];

  let optsHtml = "";
  q.opt.forEach((optText, i) => {
    let cls = "opt-btn";
    if (showSol) {
      if (i === q.ans) cls += " correct";
      else if (hasAns && i === userChoice) cls += " wrong";
    }
    optsHtml += `<button class="${cls}" type="button" data-opt="${i}" ${hasAns ? "disabled" : ""}>
      <span class="opt-letter">${letters[i]}</span>
      <span class="opt-content">${optText}</span>
    </button>`;
  });

  let bannerHtml = "";
  if (hasAns) {
    if (userChoice === q.ans) {
      bannerHtml = `<div class="verdict-banner verdict-right"><span>Sahi jawab! Shabash!</span><span>+4 Marks</span></div>`;
    } else {
      bannerHtml = `<div class="verdict-banner verdict-wrong"><span>Galat jawab — Sahi option ${letters[q.ans]} hai</span><span>−1 Mark</span></div>`;
    }
  } else if (state.reviewAll) {
    bannerHtml = `<div class="verdict-banner verdict-unattempted"><span>Review Mode — Aapne ye question skip kiya tha (Sahi option: ${letters[q.ans]})</span><span>0 Marks</span></div>`;
  }

  const reviewNotice = state.reviewAll
    ? `<span class="flag-tag" style="background:rgba(96,165,250,0.15);color:#93c5fd;border-color:#60a5fa;">Review All Answers Mode</span>`
    : "";

  main.innerHTML = `<article class="card" id="questionCard">
    <div class="q-meta">
      <div class="q-badges">
        <span class="q-num">Q${q.id}</span>
        <span class="subj-tag subj-${subj}">${subj}</span>
        ${FLAGGED_MAP[q.id] ? `<span class="flag-tag" title="QA Verified Flag">Flagged QA</span>` : ""}
        ${reviewNotice}
      </div>
      <span class="mark-scheme">Right: $+4$ &nbsp;|&nbsp; Wrong: $-1$</span>
    </div>

    <div class="q-stem">${q.q}</div>
    ${q.fig ? `<div class="fig-box">${q.fig}</div>` : ""}

    <div class="options-list" id="optionsList">${optsHtml}</div>
    ${bannerHtml}

    <div class="nav-bar">
      <div class="nav-group">
        <button class="btn" id="prevBtn" type="button" ${state.cur === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn" id="skipBtn" type="button" ${hasAns || state.cur === TOTAL - 1 ? "disabled" : ""}>Skip</button>
        <button class="btn btn-primary" id="nextBtn" type="button" ${state.cur === TOTAL - 1 ? "disabled" : ""}>Next →</button>
      </div>
      ${state.reviewAll ? `<button class="btn" id="backSumBtn" type="button">Result Summary</button>` : ""}
    </div>

    ${showSol ? renderExplanationHTML(q) : ""}
  </article>`;

  // Option click lock handler
  main.querySelectorAll(".opt-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (Object.prototype.hasOwnProperty.call(state.ans, q.id)) return;
      state.ans[q.id] = Number(btn.dataset.opt);
      delete state.skipped[q.id];
      saveState();
      renderCurrentView();
    });
  });

  document.getElementById("prevBtn").onclick = () => {
    if (state.cur > 0) { state.cur--; saveState(); renderCurrentView(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  };
  document.getElementById("skipBtn").onclick = () => {
    if (!hasAns) state.skipped[q.id] = true;
    if (state.cur < TOTAL - 1) state.cur++;
    saveState();
    renderCurrentView();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  document.getElementById("nextBtn").onclick = () => {
    if (state.cur < TOTAL - 1) { state.cur++; saveState(); renderCurrentView(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  };
  const backSum = document.getElementById("backSumBtn");
  if (backSum) {
    backSum.onclick = () => { state.view = "summary"; saveState(); renderCurrentView(); };
  }

  if (showSol && q.sim) bindSimulation(q.sim);
  renderMathInContainer(document.getElementById("questionCard"));
}

// Confirmation Modal Helpers
let pendingConfirmAction = null;
function openModal(title, htmlBody, onConfirm) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = htmlBody;
  pendingConfirmAction = onConfirm;
  document.getElementById("confirmModal").classList.add("open");
}
function closeModal() {
  document.getElementById("confirmModal").classList.remove("open");
  pendingConfirmAction = null;
}
document.getElementById("modalCancel").onclick = closeModal;
document.getElementById("modalOk").onclick = () => {
  const fn = pendingConfirmAction;
  closeModal();
  if (fn) fn();
};

function promptSubmit() {
  const m = computeMetrics();
  openModal(
    "Test Submit Karein?",
    `Aapne <strong>${m.attempted} / ${TOTAL}</strong> questions attempt kiye hain aur <strong>${m.unattempted}</strong> abhi unattempted hain.<br><br>Kya aap final score aur complete analysis dekhna chahte hain?`,
    () => {
      state.view = "summary";
      saveState();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  );
}

function promptRestart() {
  openModal(
    "Quiz Restart Karein?",
    `Isse aapke saare saved answers aur live score reset ho jayenge aur quiz <strong>Q1</strong> se naye sire se shuru hoga. Continue karein?`,
    () => {
      state = { cur: 0, ans: {}, skipped: {}, filter: "all", view: "quiz", reviewAll: false };
      saveState();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  );
}

// Wire Navigation Controls
document.getElementById("submitTopBtn").onclick = promptSubmit;
document.getElementById("restartSideBtn").onclick = promptRestart;

document.getElementById("qGrid").addEventListener("click", (e) => {
  const b = e.target.closest(".grid-btn");
  if (!b) return;
  state.cur = Number(b.dataset.idx);
  state.view = "quiz";
  saveState();
  renderCurrentView();
  if (window.innerWidth <= 900) window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("filterTabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab-btn");
  if (!b) return;
  state.filter = b.dataset.filter;
  saveState();
  updateTopBarAndPalette();
});

document.querySelectorAll(".subj-jumps .tab-btn").forEach((b) => {
  b.addEventListener("click", () => {
    const idx = Number(b.dataset.jump);
    if (idx < TOTAL) {
      state.cur = idx;
      state.view = "quiz";
      saveState();
      renderCurrentView();
    }
  });
});

document.getElementById("gotoForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const inp = document.getElementById("gotoInput");
  const num = parseInt(inp.value, 10);
  if (!isNaN(num) && num >= 1 && num <= TOTAL) {
    state.cur = num - 1;
    state.view = "quiz";
    saveState();
    renderCurrentView();
    inp.value = "";
  }
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || document.getElementById("confirmModal").classList.contains("open")) return;
  if (state.view !== "quiz") return;
  if (e.key === "ArrowLeft" && state.cur > 0) { state.cur--; saveState(); renderCurrentView(); }
  else if (e.key === "ArrowRight" && state.cur < TOTAL - 1) { state.cur++; saveState(); renderCurrentView(); }
});

// Boot & Re-render when deferred KaTeX scripts finish loading
loadState();
renderCurrentView();
window.addEventListener("load", () => {
  if (window.katex && window.renderMathInElement) renderCurrentView();
});
</script>
