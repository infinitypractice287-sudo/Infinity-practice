<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET UG Complete Interactive Quiz — 180 Questions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #12141a;
    --card: #1b1f27;
    --card-alt: #222733;
    --surface: #151922;
    --border: #2c3342;
    --border-hover: #475569;
    --text: #dcdfe4;
    --muted: #9aa3b2;
    --accent: #60a5fa;
    --accent-soft: rgba(96, 165, 250, 0.14);
    --green: #34b385;
    --green-text: #7ee2b8;
    --green-bg: rgba(52, 179, 133, 0.15);
    --red: #d9535f;
    --red-text: #f49ca4;
    --red-bg: rgba(217, 83, 95, 0.15);
    --amber: #f59e0b;
    --amber-bg: rgba(245, 158, 11, 0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    font-size: 17.5px;
    line-height: 1.72;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(18, 20, 26, 0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px 0;
  }
  .topbar-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.02rem;
    letter-spacing: -0.01em;
  }
  .brand-pill {
    background: var(--accent-soft);
    color: #93c5fd;
    border: 1px solid rgba(96, 165, 250, 0.32);
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .top-stats {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .stat-chip {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.86rem;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .stat-chip strong { color: var(--text); }
  .stat-chip.score strong { color: var(--green-text); }
  .btn {
    background: var(--card-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 15px;
    min-height: 44px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.08s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover:not(:disabled) { background: #2a3140; border-color: var(--border-hover); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.42; cursor: not-allowed; }
  .btn-primary {
    background: #2563eb;
    border-color: #3b82f6;
    color: #ffffff;
  }
  .btn-primary:hover:not(:disabled) { background: #1d4ed8; border-color: #60a5fa; }
  .btn-submit {
    background: rgba(52, 179, 133, 0.2);
    border-color: var(--green);
    color: var(--green-text);
  }
  .btn-submit:hover:not(:disabled) { background: rgba(52, 179, 133, 0.3); }
  .btn-danger {
    background: var(--red-bg);
    border-color: var(--red);
    color: var(--red-text);
  }
  .progress-track {
    max-width: 1120px;
    margin: 0 auto;
    height: 4px;
    background: #1f2430;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #34b385);
    width: 0%;
    transition: width 0.25s ease;
  }
  .layout {
    max-width: 1120px;
    margin: 18px auto 48px;
    padding: 0 14px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
  }
  @media (max-width: 560px) {
    .card { padding: 16px; }
  }
  .q-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .q-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .q-num {
    background: #283040;
    color: #f8fafc;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 8px;
    font-size: 0.92rem;
  }
  .subj-tag {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .subj-Physics { background: rgba(56, 189, 248, 0.13); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.3); }
  .subj-Chemistry { background: rgba(244, 114, 182, 0.13); color: #f9a8d4; border-color: rgba(244, 114, 182, 0.3); }
  .subj-Biology { background: rgba(52, 211, 153, 0.13); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.3); }
  .flag-tag {
    font-size: 0.78rem;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--amber-bg);
    color: #fcd34d;
    border: 1px solid rgba(245, 158, 11, 0.35);
  }
  .mark-scheme { font-size: 0.83rem; color: var(--muted); }
  .q-stem {
    font-size: 1.04rem;
    color: var(--text);
    margin-bottom: 16px;
    word-wrap: break-word;
  }
  .q-stem p + p { margin-top: 8px; }
  .q-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 0.94rem;
    background: var(--surface);
    border-radius: 8px;
    overflow: hidden;
  }
  .q-table th, .q-table td {
    border: 1px solid var(--border);
    padding: 8px 11px;
    text-align: left;
    vertical-align: middle;
  }
  .q-table th {
    background: #202634;
    color: #fcd34d;
    font-weight: 600;
  }
  .fig-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin: 12px 0 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: auto;
  }
  .fig-svg { max-width: 100%; height: auto; display: block; }
  .opt-svg { max-width: 100%; height: auto; display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin-top: 6px;
  }
  .opt-btn {
    width: 100%;
    min-height: 52px;
    text-align: left;
    background: var(--card-alt);
    color: var(--text);
    border: 1.5px solid var(--border);
    border-radius: 11px;
    padding: 11px 15px;
    font-size: 1rem;
    line-height: 1.6;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 13px;
    transition: background 0.14s, border-color 0.14s;
  }
  .opt-btn:hover:not(:disabled) {
    background: #293040;
    border-color: #60a5fa;
  }
  .opt-btn:disabled { cursor: default; }
  .opt-letter {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #171b24;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 700;
    font-size: 0.92rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .opt-content {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .opt-btn.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: #e6fffa;
  }
  .opt-btn.correct .opt-letter {
    background: var(--green);
    border-color: var(--green);
    color: #0b1912;
  }
  .opt-btn.wrong {
    background: var(--red-bg);
    border-color: var(--red);
    color: #ffe8ea;
  }
  .opt-btn.wrong .opt-letter {
    background: var(--red);
    border-color: var(--red);
    color: #ffffff;
  }
  .verdict-banner {
    margin-top: 16px;
    padding: 11px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .verdict-right {
    background: var(--green-bg);
    border: 1px solid var(--green);
    color: var(--green-text);
  }
  .verdict-wrong {
    background: var(--red-bg);
    border: 1px solid var(--red);
    color: var(--red-text);
  }
  .verdict-unattempted {
    background: var(--amber-bg);
    border: 1px solid rgba(245, 158, 11, 0.45);
    color: #fcd34d;
  }
  .nav-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .nav-group { display: flex; gap: 9px; flex-wrap: wrap; }
  .explain-box {
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .exp-sec { margin-bottom: 16px; }
  .exp-sec:last-child { margin-bottom: 0; }
  .exp-label {
    font-size: 0.84rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    color: #93c5fd;
    margin-bottom: 5px;
  }
  .exp-steps {
    padding-left: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .exp-wrong-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .exp-wrong-list li {
    padding: 7px 11px;
    background: rgba(217, 83, 95, 0.08);
    border-left: 3px solid var(--red);
    border-radius: 0 7px 7px 0;
    font-size: 0.95rem;
  }
  .exp-final {
    padding: 10px 14px;
    background: var(--green-bg);
    border-left: 4px solid var(--green);
    border-radius: 0 8px 8px 0;
    color: #e6fffa;
  }
  .exp-tip {
    padding: 10px 14px;
    background: var(--amber-bg);
    border-left: 4px solid var(--amber);
    border-radius: 0 8px 8px 0;
    color: #fde68a;
    font-size: 0.95rem;
  }
  .flag-note {
    margin-top: 12px;
    padding: 9px 13px;
    background: rgba(245, 158, 11, 0.1);
    border: 1px dashed rgba(245, 158, 11, 0.45);
    border-radius: 8px;
    color: #fcd34d;
    font-size: 0.9rem;
  }
  /* Interactive Simulation Box */
  .sim-box {
    margin-top: 16px;
    padding: 15px;
    background: #1a2130;
    border: 1px solid #334155;
    border-radius: 11px;
  }
  .sim-title {
    font-weight: 700;
    font-size: 0.95rem;
    color: #7dd3fc;
    margin-bottom: 10px;
  }
  .sim-controls {
    display: grid;
    gap: 9px;
    margin-bottom: 12px;
  }
  .sim-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .sim-row input[type="range"] {
    width: 100%;
    accent-color: #60a5fa;
    cursor: pointer;
    height: 6px;
  }
  .sim-stage {
    background: var(--surface);
    border-radius: 8px;
    padding: 8px;
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }
  .sim-readout {
    margin-top: 9px;
    font-size: 0.93rem;
    color: var(--text);
    text-align: center;
  }
  /* Sidebar Question Navigator */
  .side-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    position: sticky;
    top: 74px;
  }
  @media (max-width: 900px) {
    .side-panel { position: static; }
  }
  .side-title {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .goto-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .goto-input {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 0.9rem;
  }
  .filter-tabs, .subj-jumps {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .tab-btn {
    flex: 1;
    padding: 5px 8px;
    font-size: 0.79rem;
    font-weight: 600;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent-soft);
    color: #93c5fd;
    border-color: #60a5fa;
  }
  .q-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-height: 360px;
    overflow-y: auto;
    padding-right: 3px;
  }
  .grid-btn {
    height: 36px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .grid-btn:hover { border-color: #93c5fd; color: var(--text); }
  .grid-btn.ans-ok { background: var(--green-bg); border-color: var(--green); color: var(--green-text); }
  .grid-btn.ans-bad { background: var(--red-bg); border-color: var(--red); color: var(--red-text); }
  .grid-btn.skipped { border-color: rgba(245, 158, 11, 0.45); color: #fcd34d; }
  .grid-btn.current { outline: 2px solid #60a5fa; outline-offset: 1px; color: #ffffff; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 11px;
    font-size: 0.76rem;
    color: var(--muted);
  }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  /* Summary Result Screen */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 18px 0;
  }
  .sum-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 15px;
    text-align: center;
  }
  .sum-val { font-size: 1.65rem; font-weight: 800; line-height: 1.25; }
  .sum-lbl { font-size: 0.83rem; color: var(--muted); margin-top: 4px; }
  /* Confirmation Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--border-hover);
    border-radius: 14px;
    max-width: 440px;
    width: 100%;
    padding: 22px;
  }
  .modal-title { font-size: 1.12rem; font-weight: 700; margin-bottom: 8px; }
  .modal-body { color: var(--muted); font-size: 0.96rem; margin-bottom: 18px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

  /* Offline Fallback Math & Chemistry Typesetting Styles */
  .math-fb { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; white-space: normal; }
  .math-fb .rm { font-family: system-ui, -apple-system, sans-serif; font-style: normal; }
  .fb-frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 2px;
    font-size: 0.9em;
    line-height: 1.15;
  }
  .fb-num { border-bottom: 1.2px solid currentColor; padding: 0 3px 1px; }
  .fb-den { padding: 1px 3px 0; }
  .fb-sqrt { display: inline-flex; align-items: baseline; }
  .fb-rad { border-top: 1.2px solid currentColor; padding: 0 2px; margin-left: 1px; }
  .fb-cancel {
    position: relative;
    display: inline-block;
    opacity: 0.82;
  }
  .fb-cancel::after {
    content: "";
    position: absolute;
    left: -2px;
    right: -2px;
    top: 50%;
    border-top: 1.8px solid #f49ca4;
    transform: rotate(-18deg);
  }
  .fb-rxn-arr {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 4px;
    line-height: 1.05;
  }
  .fb-rxn-top, .fb-rxn-bot { font-size: 0.72em; color: var(--muted); }
  .katex { font-size: 1.04em; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span>NEET UG Full Paper</span>
      <span class="brand-pill" id="topProgressPill">Q1 / 180</span>
    </div>
    <div class="top-stats">
      <span class="stat-chip score">Live Score: <strong id="liveScore">0 / 720</strong></span>
      <span class="stat-chip">Done: <strong id="doneCount">0 / 180</strong></span>
      <button class="btn btn-submit" id="submitTopBtn" type="button">Submit Test</button>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
</header>

<main class="layout" id="quizLayout">
  <section id="mainArea"></section>

  <aside class="side-panel" aria-label="Question Navigator">
    <div class="side-title">
      <span>Question Palette</span>
      <span style="font-size:0.8rem;color:var(--muted)" id="paletteCount">180 Qs</span>
    </div>
    <form class="goto-row" id="gotoForm">
      <input class="goto-input" id="gotoInput" type="number" min="1" max="180" placeholder="Go to Q (1–180)">
      <button class="btn" type="submit" style="padding:7px 12px;min-height:38px;">Go</button>
    </form>
    <div class="subj-jumps">
      <button class="tab-btn" type="button" data-jump="0">Phy (1–45)</button>
      <button class="tab-btn" type="button" data-jump="45">Chem (46–90)</button>
      <button class="tab-btn" type="button" data-jump="90">Bio (91–180)</button>
    </div>
    <div class="filter-tabs" id="filterTabs">
      <button class="tab-btn active" type="button" data-filter="all">All</button>
      <button class="tab-btn" type="button" data-filter="answered">Answered</button>
      <button class="tab-btn" type="button" data-filter="unanswered">Unanswered</button>
    </div>
    <div class="q-grid" id="qGrid"></div>
    <div class="legend">
      <span><i class="dot" style="background:#34b385"></i>Sahi (+4)</span>
      <span><i class="dot" style="background:#d9535f"></i>Galat (−1)</span>
      <span><i class="dot" style="background:#f59e0b"></i>Skipped</span>
      <span><i class="dot" style="background:#475569"></i>Unseen</span>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn btn-danger" id="restartSideBtn" type="button" style="width:100%;font-size:0.85rem;">Restart Quiz</button>
    </div>
  </aside>
</main>

<div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">Submit Quiz?</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel" type="button">Wapas Jao</button>
      <button class="btn btn-primary" id="modalOk" type="button">Haan, Confirm</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "mcq_all_v1";

// Reusable Dark-Theme SVG Primitive & Diagram Library
// Palette: strokes #dcdfe4 / #93c5fd / #6ee7b7 / #fcd34d / #f9a8d4 / #fca5a5 on #151922 canvas

const S = {
  sub: (v) => `<tspan baseline-shift="sub" font-size="70%">${v}</tspan>`,
  sup: (v) => `<tspan baseline-shift="super" font-size="70%">${v}</tspan>`,
  defs: `<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dcdfe4"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#6ee7b7"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#fcd34d"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#fca5a5"/>
    </marker>
  </defs>`,
  wrap: (w, h, body, cls = "fig-svg") =>
    `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" xmlns="http://www.w3.org/2000/svg">${S.defs}${body}</svg>`,
  txt: (x, y, content, opts = {}) => {
    const fill = opts.fill || "#dcdfe4";
    const size = opts.size || 13;
    const anchor = opts.anchor || "middle";
    const weight = opts.weight ? ` font-weight="${opts.weight}"` : "";
    const italic = opts.italic ? ` font-style="italic"` : "";
    return `<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" text-anchor="${anchor}" dominant-baseline="middle" font-family="system-ui,-apple-system,sans-serif"${weight}${italic}>${content}</text>`;
  },
  line: (x1, y1, x2, y2, stroke = "#dcdfe4", sw = 1.8, dash = "", marker = "") =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ""}${marker ? ` marker-end="url(#${marker})"` : ""} stroke-linecap="round"/>`,
  arrow: (x1, y1, x2, y2, stroke = "#dcdfe4", marker = "arr", sw = 1.8) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" marker-end="url(#${marker})" stroke-linecap="round"/>`,
  darrow: (x1, y1, x2, y2, stroke = "#9aa3b2", sw = 1.3) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" marker-start="url(#arr)" marker-end="url(#arr)"/>`,
  resistor: (x1, y1, x2, y2, stroke = "#7dd3fc", amp = 5, zigs = 6) => {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len;
    const nx = -uy, ny = ux;
    const pad = len * 0.2;
    const bodyLen = len - 2 * pad;
    let d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} L ${(x1 + ux * pad).toFixed(1)} ${(y1 + uy * pad).toFixed(1)}`;
    for (let i = 0; i < zigs; i++) {
      const t = pad + ((i + 0.5) / zigs) * bodyLen;
      const sgn = i % 2 === 0 ? 1 : -1;
      const px = x1 + ux * t + nx * amp * sgn;
      const py = y1 + uy * t + ny * amp * sgn;
      d += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
    }
    d += ` L ${(x2 - ux * pad).toFixed(1)} ${(y2 - uy * pad).toFixed(1)} L ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    return `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>`;
  },
  polyPts: (cx, cy, r, n, rotDeg = -90) => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = ((rotDeg + (360 / n) * i) * Math.PI) / 180;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    return pts;
  },
  ring: (cx, cy, r, n = 6, aromatic = false, doubleEdges = [], skipVertices = {}, rotDeg = -90) => {
    const pts = S.polyPts(cx, cy, r, n, rotDeg);
    let out = "";
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      let [x1, y1] = pts[i];
      let [x2, y2] = pts[j];
      if (skipVertices[i]) { x1 = x1 + (x2 - x1) * 0.26; y1 = y1 + (y2 - y1) * 0.26; }
      if (skipVertices[j]) { x2 = x2 - (x2 - x1) * 0.26; y2 = y2 - (y2 - y1) * 0.26; }
      out += S.line(x1.toFixed(1), y1.toFixed(1), x2.toFixed(1), y2.toFixed(1), "#dcdfe4", 1.8);
      if (doubleEdges.includes(i)) {
        const mx1 = pts[i][0] * 0.78 + cx * 0.22, my1 = pts[i][1] * 0.78 + cy * 0.22;
        const mx2 = pts[j][0] * 0.78 + cx * 0.22, my2 = pts[j][1] * 0.78 + cy * 0.22;
        out += S.line(mx1.toFixed(1), my1.toFixed(1), mx2.toFixed(1), my2.toFixed(1), "#dcdfe4", 1.6);
      }
    }
    if (aromatic) {
      out += `<circle cx="${cx}" cy="${cy}" r="${(r * 0.56).toFixed(1)}" fill="none" stroke="#93c5fd" stroke-width="1.6"/>`;
    }
    return { svg: out, pts };
  }
};

const RAW_QUESTIONS = [{"id":1,"q":"A photon has an energy of $4.14 \\times 10^{-19}\\,\\mathrm{J}$. What is its frequency? (Take $h = 6.63 \\times 10^{-34}\\,\\mathrm{J\\,s}$)","fig":"","opt":["$6.24 \\times 10^{14}\\,\\mathrm{Hz}$","$5.5 \\times 10^{13}\\,\\mathrm{Hz}$","$7.0 \\times 10^{15}\\,\\mathrm{Hz}$","$8.1 \\times 10^{12}\\,\\mathrm{Hz}$"],"ans":0,"c":"Light aur saari electromagnetic waves chhote-chhote discrete energy packets me travel karti hain jinhe **photons** kehte hain. Max Planck ke quantum सिद्धांत ke anusaar ek photon ki energy $E$ uski frequency $\\nu$ ke seedhe proportional hoti hai: $E = h\\nu$, jahan $h = 6.63 \\times 10^{-34}\\,\\mathrm{J\\,s}$ Planck's constant hai.","m":"Yahan energy $E$ ($\\mathrm{J}$ me) aur Planck's constant $h$ ($\\mathrm{J\\,s}$ me) dono SI units me diye gaye hain, isliye seedha $\\nu = \\dfrac{E}{h}$ use karenge aur mantissa aur $10$ ki powers ko alag-alag hal karenge.","s":["Planck relation ko frequency $\\nu$ ke liye likhein: $\\nu = \\dfrac{E}{h}$","Diye gaye values substitute karein: $\\nu = \\dfrac{4.14 \\times 10^{-19}\\,\\cancel{\\mathrm{J}}}{6.63 \\times 10^{-34}\\,\\cancel{\\mathrm{J}}\\,\\mathrm{s}}$","$10$ ki powers simplify karein: $\\dfrac{10^{-19}}{10^{-34}} = 10^{-19 - (-34)} = 10^{-19 + 34} = 10^{15}\\,\\mathrm{s^{-1}}$","Numbers ko divide karein: $\\dfrac{4.14}{6.63} \\approx 0.6244$","Dono ko combine karke standard scientific form me badlein: $\\nu = 0.6244 \\times 10^{15}\\,\\mathrm{Hz} = \\color{#7ee2b8}{6.24 \\times 10^{14}\\,\\mathrm{Hz}}$"],"r":"Photon ki frequency $6.24 \\times 10^{14}\\,\\mathrm{Hz}$ hai.","w":["**Option B ($5.5 \\times 10^{13}\\,\\mathrm{Hz}$):** Power of $10$ me ek extra $10^{-1}$ shift aur galat ratio lene se aata hai.","**Option C ($7.0 \\times 10^{15}\\,\\mathrm{Hz}$):** $\\dfrac{4.14}{6.63}$ ki jagah ulta $\\dfrac{6.63}{4.14}$ aur galat exponent jodne se aata hai.","**Option D ($8.1 \\times 10^{12}\\,\\mathrm{Hz}$):** Exponents ko $-19 - 34$ galat tarah se ghatane par galat power milti hai."],"t":"Exam speed trick: Visible orange-red photon ki energy $\\approx 2.5\\text{–}3\\,\\mathrm{eV} \\approx 4 \\times 10^{-19}\\,\\mathrm{J}$ hoti hai aur visible light ki frequency hamesha $4\\text{–}7.5 \\times 10^{14}\\,\\mathrm{Hz}$ hoti hai — charo options me sirf **Option A** me $10^{14}\\,\\mathrm{Hz}$ hai!","sim":"photon"},{"id":2,"q":"What is the Fahrenheit equivalent of $50^\\circ\\mathrm{C}$?","fig":"","opt":["$120^\\circ\\mathrm{F}$","$122^\\circ\\mathrm{F}$","$125^\\circ\\mathrm{F}$","$118^\\circ\\mathrm{F}$"],"ans":1,"c":"Celsius aur Fahrenheit dono temperature scales me ice point ($0^\\circ\\mathrm{C} = 32^\\circ\\mathrm{F}$) aur steam point ($100^\\circ\\mathrm{C} = 212^\\circ\\mathrm{F}$) fixed hote hain. Celsius ke $100$ divisions Fahrenheit ke $180$ divisions ke barabar hote hain, isliye $\\dfrac{C - 0}{100} = \\dfrac{F - 32}{180}$.","m":"Linear scale conversion formula $F = \\dfrac{9}{5}C + 32$ use karenge kyunki isse ek hi line me exact Fahrenheit value mil jaati hai.","s":["Conversion formula likhein: $F = \\left(\\dfrac{9}{5} \\times C\\right) + 32$","$C = 50$ rakhein: $F = \\left(\\dfrac{9}{\\cancel{5}} \\times \\cancel{50}^{\\,10}\\right) + 32$","Pehle multiplication poora karein: $9 \\times 10 = 90$","Ab $32$ jodein: $F = 90 + 32 = \\color{#7ee2b8}{122^\\circ\\mathrm{F}}$"],"r":"$50^\\circ\\mathrm{C}$ ka Fahrenheit equivalent $122^\\circ\\mathrm{F}$ hai.","w":["**Option A ($120^\\circ\\mathrm{F}$):** $90 + 32$ jodne me $122$ ki jagah galti se $30$ jodkar $120$ likhne se aata hai.","**Option C ($125^\\circ\\mathrm{F}$):** $90 + 35$ ya andaze se round figure chunne ki galti se aata hai.","**Option D ($118^\\circ\\mathrm{F}$):** Addition/subtraction sign error se $2$ kam value aati hai."],"t":"Reverse sanity check: $(122 - 32) \\times \\dfrac{5}{9} = 90 \\times \\dfrac{5}{9} = 50^\\circ\\mathrm{C}$ — bilkul pakka!","sim":""},{"id":3,"q":"A bar magnet produces a field of $2 \\times 10^{-6}\\,\\mathrm{T}$ at $0.5\\,\\mathrm{m}$ on its equatorial line. What is its magnetic moment? (Take $\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{T\\,m\\,A^{-1}}$)","fig":"q3","opt":["$2.0\\,\\mathrm{A\\,m^2}$","$2.5\\,\\mathrm{A\\,m^2}$","$3.0\\,\\mathrm{A\\,m^2}$","$3.5\\,\\mathrm{A\\,m^2}$"],"ans":1,"c":"Chhota bar magnet ek magnetic dipole ki tarah behave karta hai. Uske centre se perpendicular bisector (**equatorial line**) par distance $r$ par magnetic field magnitude $B_{\\mathrm{eq}} = \\dfrac{\\mu_0}{4\\pi}\\dfrac{M}{r^3}$ hota hai, jahan $M$ magnet ka magnetic dipole moment hai.","m":"Equatorial dipole formula se $M$ nikalenge; chunki $\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{T\\,m\\,A^{-1}}$ diya hai, isliye $\\dfrac{\\mu_0}{4\\pi} = 10^{-7}\\,\\mathrm{T\\,m\\,A^{-1}}$ seedha cancel ho jayega.","s":["Equatorial magnetic field ka sutr likhein: $B_{\\mathrm{eq}} = \\dfrac{\\mu_0}{4\\pi}\\dfrac{M}{r^3}$","$M$ ke liye rearrange karein: $M = \\dfrac{B_{\\mathrm{eq}} \\cdot 4\\pi \\cdot r^3}{\\mu_0}$","Values rakhein: $M = \\dfrac{(2 \\times 10^{-6}) \\times \\cancel{4\\pi} \\times (0.5)^3}{\\cancel{4\\pi} \\times 10^{-7}}$","$(0.5)^3$ calculate karein: $0.5 \\times 0.5 \\times 0.5 = 0.125$, toh numerator $= 2 \\times 0.125 \\times 10^{-6} = 0.25 \\times 10^{-6}$","$10^{-7}$ se divide karein: $M = \\dfrac{0.25 \\times 10^{-6}}{10^{-7}} = 0.25 \\times 10^{1} = \\color{#7ee2b8}{2.5\\,\\mathrm{A\\,m^2}}$"],"r":"Bar magnet ka magnetic moment $2.5\\,\\mathrm{A\\,m^2}$ hai.","w":["**Option A ($2.0\\,\\mathrm{A\\,m^2}$):** $(0.5)^3 = 0.125$ ki jagah galti se $0.10$ lene se $2.0$ aata hai.","**Option C ($3.0\\,\\mathrm{A\\,m^2}$):** Cube nikalne me arithmetic error ki wajah se galat maan hai.","**Option D ($3.5\\,\\mathrm{A\\,m^2}$):** $r^3$ ke sthan par galat exponent lagane se aata hai."],"t":"Sabse aam galti: **Axial** field me $\\dfrac{2M}{r^3}$ hota hai aur **Equatorial** field me sirf $\\dfrac{M}{r^3}$ — agar axial formula laga dete toh $1.25\\,\\mathrm{A\\,m^2}$ milta!","sim":""},{"id":4,"q":"A $4\\,\\mathrm{kg}$ block slides down a frictionless incline from $11\\,\\mathrm{m}$ height. What is its speed at the bottom? (Take $g = 10\\,\\mathrm{m\\,s^{-2}}$)","fig":"q4","opt":["$14\\,\\mathrm{m\\,s^{-1}}$","$14.8\\,\\mathrm{m\\,s^{-1}}$","$15.5\\,\\mathrm{m\\,s^{-1}}$","$16\\,\\mathrm{m\\,s^{-1}}$"],"ans":1,"c":"Jab incline **frictionless** ho, toh normal force motion ke perpendicular hone ke karan zero work karta hai aur sirf conservative gravitational force kaam karta hai. Isliye total mechanical energy ($\\mathrm{PE + KE}$) poori tarah conserved rehti hai.","m":"Law of Conservation of Mechanical Energy lagayenge: top par gravitational potential energy $mgh$ bottom par kinetic energy $\\dfrac{1}{2}mv^2$ me badal jaati hai.","s":["Mechanical energy conservation likhein: $mgh = \\dfrac{1}{2}mv^2$","Dono taraf se mass $m$ cancel karein: $\\cancel{m}gh = \\dfrac{1}{2}\\cancel{m}v^2 \\implies v = \\sqrt{2gh}$","Values $g = 10\\,\\mathrm{m\\,s^{-2}}$ aur $h = 11\\,\\mathrm{m}$ rakhein: $v = \\sqrt{2 \\times 10 \\times 11} = \\sqrt{220}\\,\\mathrm{m\\,s^{-1}}$","Perfect squares se bound check karein: $14^2 = 196$ aur $15^2 = 225$, toh $\\sqrt{220}$ bilkul $15$ ke paas ($14.83$) hoga!","Linear approximation ya square root se: $\\sqrt{220} \\approx \\color{#7ee2b8}{14.8\\,\\mathrm{m\\,s^{-1}}}$"],"r":"Incline ke bottom par block ki speed $14.8\\,\\mathrm{m\\,s^{-1}}$ hogi.","w":["**Option A ($14\\,\\mathrm{m\\,s^{-1}}$):** $14^2 = 196$ hota hai jo $220$ se kaafi chhota hai ($h = 9.8\\,\\mathrm{m}$ ke liye hota).","**Option C ($15.5\\,\\mathrm{m\\,s^{-1}}$):** $15.5^2 = 240.25$ hota hai jo $220$ se bada hai.","**Option D ($16\\,\\mathrm{m\\,s^{-1}}$):** $16^2 = 256$ hota hai, isliye ye bhi galat hai."],"t":"Gaur karein: $4\\,\\mathrm{kg}$ mass ek **distractor** hai — frictionless incline par $4\\,\\mathrm{kg}$ aur $40\\,\\mathrm{kg}$ dono blocks niche same speed $\\sqrt{2gh}$ se pahunchenge! Niche slider hila kar khud dekhein.","sim":"incline"},{"id":5,"q":"A wire of length $5\\,\\mathrm{m}$ and cross-sectional area $4 \\times 10^{-6}\\,\\mathrm{m^2}$ has a resistance of $10\\,\\Omega$. What is the resistivity of the material?","fig":"q5","opt":["$8.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}$","$9.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}$","$10.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}$","$12.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}$"],"ans":0,"c":"Kisi conductor ka electrical resistance $R$ uski length $l$ ke directly proportional aur cross-sectional area $A$ ke inversely proportional hota hai: $R = \\rho\\dfrac{l}{A}$, jahan $\\rho$ material ki **resistivity** (specific resistance) hai.","m":"Sabhi quantities ($l, A, R$) pehle se SI units me hain, isliye $\\rho = \\dfrac{R \\cdot A}{l}$ me seedha substitute karenge.","s":["Formula likhein: $R = \\rho\\dfrac{l}{A} \\implies \\rho = \\dfrac{R \\cdot A}{l}$","Values rakhein: $\\rho = \\dfrac{10\\,\\Omega \\times 4 \\times 10^{-6}\\,\\mathrm{m^2}}{5\\,\\mathrm{m}}$","Numerator multiply karein: $\\rho = \\dfrac{40 \\times 10^{-6}}{5}\\,\\Omega\\,\\mathrm{m}$","$40$ ko $5$ se divide karein: $\\dfrac{\\cancel{40}^{\\,8}}{\\cancel{5}^{\\,1}} \\times 10^{-6} = \\color{#7ee2b8}{8.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}}$"],"r":"Wire ke material ki resistivity $8.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}$ hai.","w":["**Option B ($9.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}$):** $\\dfrac{40}{5} = 8$ ke sthan par galat arithmetic karne se aata hai.","**Option C ($10.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}$):** Length aur area ke numerical ratio $\\dfrac{4}{5}$ ko ignore karke seedha $R$ ka ank lene se aata hai.","**Option D ($12.0 \\times 10^{-6}\\,\\Omega\\,\\mathrm{m}$):** Division ki jagah galat factor lagane se aata hai."],"t":"Unit check hamesha madad karta hai: $\\rho = \\dfrac{\\Omega \\times \\mathrm{m^2}}{\\mathrm{m}} = \\Omega\\,\\mathrm{m}$ — isse $\\dfrac{R \\cdot A}{l}$ aur $\\dfrac{R \\cdot l}{A}$ me kabhi confusion nahi hoga!","sim":""},{"id":6,"q":"Amount of solar energy received on the earth's surface per unit area per unit time is defined as solar constant. Dimensional formula of solar constant is","fig":"","opt":["$[\\mathrm{M\\,L\\,T^{-2}}]$","$[\\mathrm{M\\,L^{0}\\,T^{-3}}]$","$[\\mathrm{M^{2}\\,L^{0}\\,T^{-1}}]$","$[\\mathrm{M\\,L^{2}\\,T^{-2}}]$"],"ans":1,"c":"**Solar constant** wave **intensity** hi hoti hai — yaani unit area par unit time me padne wali energy: $S = \\dfrac{\\text{Energy}}{\\text{Area} \\times \\text{Time}}$. Energy ka dimensional formula $[\\mathrm{M\\,L^{2}\\,T^{-2}}]$, area ka $[\\mathrm{L^{2}}]$, aur time ka $[\\mathrm{T}]$ hota hai.","m":"Definition se har physical quantity ki fundamental dimensions ($\\mathrm{M, L, T}$) rakh kar common powers cancel kar denge.","s":["Definition likhein: $\\text{Solar Constant} = \\dfrac{\\text{Energy}}{\\text{Area} \\times \\text{Time}}$","Har term ki dimension rakhein: $[S] = \\dfrac{[\\mathrm{M\\,L^{2}\\,T^{-2}}]}{[\\mathrm{L^{2}}] \\cdot [\\mathrm{T}]}$","$\\mathrm{L^{2}}$ numerator aur denominator se cancel karein: $[S] = \\dfrac{[\\mathrm{M}\\,\\cancel{\\mathrm{L^{2}}}\\,\\mathrm{T^{-2}}]}{[\\cancel{\\mathrm{L^{2}}}] \\cdot [\\mathrm{T^{1}}]}$","$\\mathrm{T}$ ki power combine karein: $\\mathrm{T^{-2 - 1}} = \\mathrm{T^{-3}} \\implies [S] = \\color{#7ee2b8}{[\\mathrm{M\\,L^{0}\\,T^{-3}}]}$"],"r":"Solar constant ka dimensional formula $[\\mathrm{M\\,L^{0}\\,T^{-3}}]$ hai.","w":["**Option A ($[\\mathrm{M\\,L\\,T^{-2}}]$):** Ye **force** ka dimensional formula hai, solar constant ka nahi.","**Option C ($[\\mathrm{M^{2}\\,L^{0}\\,T^{-1}}]$):** Energy me mass ki power $1$ hoti hai, $\\mathrm{M^2}$ nahi.","**Option D ($[\\mathrm{M\\,L^{2}\\,T^{-2}}]$):** Ye sirf **energy / work** ki dimension hai; area aur time se divide karna chhoot gaya hai."],"t":"Yaad rakhein: Intensity ($\\mathrm{W\\,m^{-2}}$), Poynting vector, aur Solar Constant — teeno ka dimensional formula same $[\\mathrm{M\\,L^{0}\\,T^{-3}}]$ hota hai!","sim":""},{"id":7,"q":"A body starts from rest and moves with a constant acceleration. The ratio of distance covered in the $n\\text{th}$ second to the distance covered in $n$ second is","fig":"","opt":["$\\dfrac{2}{n} - \\dfrac{1}{n^2}$","$\\dfrac{1}{n^2} - \\dfrac{1}{n}$","$\\dfrac{2}{n^2} - \\dfrac{1}{n}$","$\\dfrac{2}{n} + \\dfrac{1}{n^2}$"],"ans":0,"c":"Uniform acceleration $a$ aur initial velocity $u = 0$ ke liye: pehle $n$ seconds me kul tay doori $S_n = \\dfrac{1}{2}an^2$ hoti hai, jabki sirf **$n\\text{th}$ second** (yaani $(n-1)\\,\\mathrm{s}$ se $n\\,\\mathrm{s}$ ke beech $1$ second me) tay doori $S_{n\\text{th}} = S_n - S_{n-1} = \\dfrac{a}{2}(2n - 1)$ hoti hai.","m":"Dono standard kinematics expressions likhkar ratio $\\dfrac{S_{n\\text{th}}}{S_n}$ lenge aur $a$ cancel kar denge; saath hi $n = 1$ daalkar turant cross-verify bhi karenge!","s":["Rest ($u = 0$) se $n$ seconds me kul distance: $S_n = 0 + \\dfrac{1}{2}an^2 = \\dfrac{1}{2}an^2$","$n\\text{th}$ second me distance: $S_{n\\text{th}} = S_n - S_{n-1} = \\dfrac{1}{2}an^2 - \\dfrac{1}{2}a(n-1)^2 = \\dfrac{1}{2}a(2n - 1)$","Dono ka anupaat (ratio) lein: $\\dfrac{S_{n\\text{th}}}{S_n} = \\dfrac{\\cancel{\\frac{1}{2}a}\\,(2n - 1)}{\\cancel{\\frac{1}{2}a}\\,n^2} = \\dfrac{2n - 1}{n^2}$","Har term ko alag divide karein: $\\dfrac{2\\cancel{n}}{n^{\\,\\cancel{2}}} - \\dfrac{1}{n^2} = \\color{#7ee2b8}{\\dfrac{2}{n} - \\dfrac{1}{n^2}}$"],"r":"Required ratio $\\dfrac{2}{n} - \\dfrac{1}{n^2}$ hai.","w":["**Option B ($\\dfrac{1}{n^2} - \\dfrac{1}{n}$):** $n = 2$ rakhne par negative distance ratio $-\\dfrac{1}{4}$ deta hai jo physically namumkin hai.","**Option C ($\\dfrac{2}{n^2} - \\dfrac{1}{n}$):** $n = 3$ rakhne par $-\\dfrac{1}{9}$ (negative) deta hai.","**Option D ($\\dfrac{2}{n} + \\dfrac{1}{n^2}$):** $n = 1$ rakhne par $3$ deta hai jabki pehle $1$ second me $S_{1\\text{st}} = S_1 \\implies \\text{ratio} = 1$ hona chahiye!"],"t":"$5$-second Brahmastra check: $n = 1$ put karo! Pehle second me $S_{1\\text{st}}$ aur $S_1$ ek hi cheez hain toh ratio $= 1$ aana chahiye — $(A)\\;2-1=1$, $(B)\\;0$, $(C)\\;1$, $(D)\\;3$; ab $n=2$ rakho: $C$ negative ho gaya, sirf **Option A** bacha!","sim":""},{"id":8,"q":"What is the binding energy of a nucleus with a mass defect of $0.08\\,\\mathrm{u}$? (Given $1\\,\\mathrm{u} = 931.5\\,\\mathrm{MeV}/c^2$)","fig":"","opt":["$74.52\\,\\mathrm{MeV}$","$93.15\\,\\mathrm{MeV}$","$46.58\\,\\mathrm{MeV}$","$149.04\\,\\mathrm{MeV}$"],"ans":0,"c":"Jab protons aur neutrons milkar ek nucleus banate hain, toh thoda sa mass ($\\Delta m$, jise **mass defect** kehte hain) Einstein ke relation $E = \\Delta m \\cdot c^2$ ke mutabik **nuclear binding energy** me badal jaata hai.","m":"Chunki $1\\,\\mathrm{u} = 931.5\\,\\mathrm{MeV}/c^2$ diya hai, isliye $\\mathrm{BE} = \\Delta m \\cdot c^2$ me $c^2$ seedha cancel ho jayega aur sirf $0.08 \\times 931.5$ karna hoga.","s":["Einstein mass-energy relation likhein: $\\mathrm{BE} = \\Delta m \\cdot c^2$","$\\Delta m = 0.08\\,\\mathrm{u} = 0.08 \\times 931.5\\,\\dfrac{\\mathrm{MeV}}{\\cancel{c^2}} \\cdot \\cancel{c^2}$","$8 \\times 931.5$ multiply karein: $8 \\times 900 = 7200$, $8 \\times 31 = 248$, $8 \\times 0.5 = 4 \\implies 7200 + 248 + 4 = 7452$","$0.08 = \\dfrac{8}{100}$ hone se decimal $2$ sthan baayein lagayein: $\\mathrm{BE} = \\color{#7ee2b8}{74.52\\,\\mathrm{MeV}}$"],"r":"Nucleus ki binding energy $74.52\\,\\mathrm{MeV}$ hai.","w":["**Option B ($93.15\\,\\mathrm{MeV}$):** Ye $\\Delta m = 0.10\\,\\mathrm{u}$ ke liye hoti, $0.08\\,\\mathrm{u}$ ke liye nahi.","**Option C ($46.58\\,\\mathrm{MeV}$):** Ye $\\Delta m = 0.05\\,\\mathrm{u}$ ke liye hoti.","**Option D ($149.04\\,\\mathrm{MeV}$):** Ye $74.52$ ka dugna ($\\Delta m = 0.16\\,\\mathrm{u}$) hai."],"t":"Last-digit trick: $8 \\times 5 = 40$ aur carry jodkar $.52$ sirf Option A me aata hai ($931.5 \\times 0.08$ slightly less than $93.15$ aur greater than $46.58$ — ek nazar me Option A!).","sim":""},{"id":9,"q":"A projectile is fired with a velocity $v$ at an angle $\\theta$ with the horizontal. The speed of the projectile when its direction of motion makes an angle $\\beta$ with the horizontal is","fig":"q9","opt":["$v\\cos\\theta$","$v\\cos\\theta\\cos\\beta$","$v\\cos\\theta\\sec\\beta$","$v\\cos\\theta\\tan\\beta$"],"ans":2,"c":"Projectile motion me air resistance na hone par horizontal direction me koi force nahi lagta ($a_x = 0$). Isliye projectile ke velocity ka **horizontal component poore raaste constant rehta hai**!","m":"Launch moment aur angle $\\beta$ wale moment par velocity ke horizontal components ko equate karenge: $(v_x)_{\\text{initial}} = (v_x)_{\\text{at }\\beta}$.","s":["Launch par horizontal velocity component likhein: $v_x = v\\cos\\theta$","Maan lein jab motion horizontal se $\\beta$ angle banata hai tab speed $v'$ hai; us samay horizontal component $= v'\\cos\\beta$","Chunki $a_x = 0$, horizontal velocity barabar rahegi: $v'\\cos\\beta = v\\cos\\theta$","$\\cos\\beta$ se divide karein: $v' = \\dfrac{v\\cos\\theta}{\\cos\\beta} = \\color{#7ee2b8}{v\\cos\\theta\\sec\\beta}$"],"r":"Angle $\\beta$ par projectile ki speed $v\\cos\\theta\\sec\\beta$ hogi.","w":["**Option A ($v\\cos\\theta$):** Ye sirf **highest point** ($\\beta = 0^\\circ \\implies \\sec 0^\\circ = 1$) par speed hoti hai, har angle $\\beta$ par nahi.","**Option B ($v\\cos\\theta\\cos\\beta$):** Divide karne ke bajay $\\cos\\beta$ se multiply kar diya gaya hai; $\\beta = \\theta$ rakhne par $v\\cos^2\\theta \\ne v$ milta hai!","**Option D ($v\\cos\\theta\\tan\\beta$):** $\\beta = 0^\\circ$ (top point) rakhne par $0$ deta hai jabki top par speed $v\\cos\\theta$ hoti hai."],"t":"Boundary value test: $\\beta = \\theta$ rakho (yaani launch point hi!) — speed wapas $v$ milni chahiye! $v\\cos\\theta\\sec\\theta = v\\cancel{\\cos\\theta}\\cdot\\dfrac{1}{\\cancel{\\cos\\theta}} = v$ — sirf Option C paas hota hai!","sim":"projectile"},{"id":10,"q":"A curved road of $50\\,\\mathrm{m}$ radius is banked at correct angle for a given speed. If the speed is to be doubled keeping the same banking angle, the radius of curvature of the road should be changed to","fig":"q10","opt":["$25\\,\\mathrm{m}$","$100\\,\\mathrm{m}$","$150\\,\\mathrm{m}$","$200\\,\\mathrm{m}$"],"ans":3,"c":"Friction par depend kiye bina safe turning ke liye road ko angle $\\theta$ par uthaya (**bank** kiya) jaata hai taaki normal reaction ka component $N\\sin\\theta$ centripetal force $\\dfrac{mv^2}{r}$ de aur $N\\cos\\theta = mg$ weight balance kare. Dono ko divide karne par ideal banking formula milta hai: $\\tan\\theta = \\dfrac{v^2}{rg}$.","m":"Chunki banking angle $\\theta$ aur $g$ dono constant rakhe gaye hain, $\\dfrac{v^2}{r} = \\text{constant} \\implies r \\propto v^2$ proportionality lagayenge.","s":["Ideal banking relation likhein: $\\tan\\theta = \\dfrac{v^2}{rg}$","Same $\\theta$ aur $g$ ke liye dono cases equate karein: $\\dfrac{v_1^2}{r_1} = \\dfrac{v_2^2}{r_2}$","$r_1 = 50\\,\\mathrm{m}$ aur $v_2 = 2v_1$ rakhein: $\\dfrac{v_1^2}{50} = \\dfrac{(2v_1)^2}{r_2} = \\dfrac{4v_1^2}{r_2}$","$v_1^2$ cancel karke $r_2$ nikalein: $r_2 = 4 \\times 50\\,\\mathrm{m} = \\color{#7ee2b8}{200\\,\\mathrm{m}}$"],"r":"Road ka naya radius of curvature $200\\,\\mathrm{m}$ hona chahiye.","w":["**Option A ($25\\,\\mathrm{m}$):** $r \\propto \\dfrac{1}{v}$ galat ulta anupaat lagane se aadha kar diya gaya.","**Option B ($100\\,\\mathrm{m}$):** $v^2$ ka square bhool kar $r \\propto v$ linear lene se $50 \\times 2 = 100\\,\\mathrm{m}$ aata hai.","**Option C ($150\\,\\mathrm{m}$):** $3$ se multiply karne ki calculation error se aata hai."],"t":"Centripetal acceleration $\\dfrac{v^2}{r}$ same rakhne ke liye jab bhi speed **$k$ times** badhe, turn ka radius **$k^2$ times** ($2^2 = 4$ times) bada karna padta hai!","sim":"banking"},{"id":11,"q":"A particle accelerates uniformly from rest to $20\\,\\mathrm{m\\,s^{-1}}$ in $5\\,\\mathrm{s}$. What is the distance covered?","fig":"","opt":["$25\\,\\mathrm{m}$","$50\\,\\mathrm{m}$","$75\\,\\mathrm{m}$","$100\\,\\mathrm{m}$"],"ans":1,"c":"Jab acceleration constant ho, toh particle ki average velocity initial aur final velocity ka arithmetic mean hoti hai: $v_{\\mathrm{avg}} = \\dfrac{u + v}{2}$. Straight-line unidirectional motion me distance $= v_{\\mathrm{avg}} \\times t$.","m":"Pehle $a = \\dfrac{v - u}{t}$ se $s = ut + \\dfrac{1}{2}at^2$ lagayenge aur $v_{\\mathrm{avg}} = \\dfrac{u + v}{2}t$ se turant cross-verify bhi karenge.","s":["Acceleration nikalein ($u = 0$, $v = 20\\,\\mathrm{m\\,s^{-1}}$, $t = 5\\,\\mathrm{s}$): $a = \\dfrac{20 - 0}{5} = 4\\,\\mathrm{m\\,s^{-2}}$","Second equation of motion lagayein: $s = ut + \\dfrac{1}{2}at^2$","Values rakhein: $s = (0)(5) + \\dfrac{1}{\\cancel{2}}(\\cancel{4}^{\\,2})(5)^2$","Multiply karein: $s = 2 \\times 25 = \\color{#7ee2b8}{50\\,\\mathrm{m}}$ (Check: $\\dfrac{0 + 20}{2} \\times 5 = 10 \\times 5 = 50\\,\\mathrm{m}$!)"],"r":"Particle dwara cover ki gayi distance $50\\,\\mathrm{m}$ hai.","w":["**Option A ($25\\,\\mathrm{m}$):** Acceleration $a = 4$ ki jagah $2$ lene ya ek extra $\\dfrac{1}{2}$ lagane se aata hai.","**Option C ($75\\,\\mathrm{m}$):** Arithmetic galti se $3 \\times 25$ kar dene par aata hai.","**Option D ($100\\,\\mathrm{m}$):** $\\dfrac{1}{2}$ factor bhool kar seedha $v \\times t = 20 \\times 5 = 100\\,\\mathrm{m}$ (uniform velocity formula!) lagane se aata hai."],"t":"Uniform acceleration me $s = \\left(\\dfrac{u + v}{2}\\right)t$ bina $a$ nikale $2$ second me exact answer deta hai!","sim":""},{"id":12,"q":"The monkey $B$ shown in figure is holding on to the tail of the monkey $A$ which is climbing up a rope. The masses of the monkeys $A$ and $B$ are $5\\,\\mathrm{kg}$ and $2\\,\\mathrm{kg}$ respectively. If $A$ can tolerate a tension of $30\\,\\mathrm{N}$ in its tail, what force should it apply on the rope in order to carry the monkey $B$ with it? (Take, $g = 10\\,\\mathrm{m\\,s^{-2}}$)","fig":"q12","opt":["$105\\,\\mathrm{N}$","$108\\,\\mathrm{N}$","$10.5\\,\\mathrm{N}$","$100\\,\\mathrm{N}$"],"ans":0,"c":"Newton's Second Law ($F_{\\mathrm{net}} = ma$) har monkey ke Free Body Diagram (FBD) par alag-alag ya poore $(A + B)$ system par ek saath lagaya ja sakta hai. Dono monkeys ek saath common upward acceleration $a$ se chadh rahe hain; tail ka limiting tension $T_{\\max} = 30\\,\\mathrm{N}$ maximum acceleration decide karta hai!","m":"Pehle niche wale monkey $B$ ke FBD se maximum upward acceleration $a_{\\max}$ nikalenge (jab $T = 30\\,\\mathrm{N}$ ho), phir poore $(A + B)$ system par $F_{\\mathrm{rope}} - (m_A + m_B)g = (m_A + m_B)a_{\\max}$ lagayenge.","s":["Monkey $B$ ($m_B = 2\\,\\mathrm{kg}$) par upward tail tension $T$ aur downward weight $m_B g$ lagta hai: $T - m_B g = m_B a$","Limiting tension $T = 30\\,\\mathrm{N}$ rakhein: $30 - (2 \\times 10) = 2a \\implies 30 - 20 = 2a \\implies a = \\dfrac{10}{2} = 5\\,\\mathrm{m\\,s^{-2}}$","Ab poore $(A + B)$ system ka kul mass $= 5 + 2 = 7\\,\\mathrm{kg}$ lein, jis par upward rope force $F$ lag raha hai:","$F - (m_A + m_B)g = (m_A + m_B)a \\implies F = (m_A + m_B)(g + a)$","Values rakhein: $F = 7 \\times (10 + 5) = 7 \\times 15 = \\color{#7ee2b8}{105\\,\\mathrm{N}}$ (Note: agar constant velocity $a = 0$ hoti toh minimum force $70\\,\\mathrm{N}$ hota, par options me limiting force $105\\,\\mathrm{N}$ poocha gaya hai!)"],"r":"Limiting condition me monkey $A$ ko rope par $105\\,\\mathrm{N}$ force lagana chahiye.","w":["**Option B ($108\\,\\mathrm{N}$):** $7 \\times 15 = 105$ ki jagah arithmetic mistake se $108$ likha gaya hai.","**Option C ($10.5\\,\\mathrm{N}$):** $g = 10\\,\\mathrm{m\\,s^{-2}}$ se divide karke kgf aur Newton me confusion karne se aata hai.","**Option D ($100\\,\\mathrm{N}$):** Monkey $B$ ka weight ya acceleration term aadha chhod dene se aata hai."],"t":"HC Verma ka classic sawal! Actual range $[70\\,\\mathrm{N},\\,105\\,\\mathrm{N}]$ hoti hai ($a = 0$ se $a_{\\max} = 5\\,\\mathrm{m\\,s^{-2}}$), isliye options me hamesha $70\\,\\mathrm{N}$ se $105\\,\\mathrm{N}$ ke beech wala maan ($105\\,\\mathrm{N}$) tick karein!","sim":""},{"id":13,"q":"A $5\\,\\mathrm{kg}$ brick of $20\\,\\mathrm{cm} \\times 10\\,\\mathrm{cm} \\times 8\\,\\mathrm{cm}$ dimension lying on the largest base. It is now made to stand with length vertical. If $g = 10\\,\\mathrm{m\\,s^{-2}}$, then the amount of work done is","fig":"q13","opt":["$3\\,\\mathrm{J}$","$5\\,\\mathrm{J}$","$7\\,\\mathrm{J}$","$9\\,\\mathrm{J}$"],"ans":0,"c":"Rigid body ko uthane ya khada karne me gravity ke viruddh kiya gaya work body ke **Centre of Mass (Centre of Gravity)** ki vertical height me aaye badlaav $\\Delta h$ ke barabar hota hai: $W = mg(h_f - h_i)$.","m":"Uniform rectangular brick ka CG uski vertical height ke theek aadhe ($\\dfrac{H}{2}$) par hota hai. Initial aur final CG heights nikalkar SI ($\\mathrm{m}$) me badlenge.","s":["Largest base $20\\,\\mathrm{cm} \\times 10\\,\\mathrm{cm}$ zameen par hai, toh initial vertical height $= 8\\,\\mathrm{cm} \\implies$ initial CG height $h_i = \\dfrac{8}{2} = 4\\,\\mathrm{cm}$","Jab length ($20\\,\\mathrm{cm}$) vertical khadi ki gayi, toh final CG height $h_f = \\dfrac{20}{2} = 10\\,\\mathrm{cm}$","CG height me badhotari: $\\Delta h = h_f - h_i = 10\\,\\mathrm{cm} - 4\\,\\mathrm{cm} = 6\\,\\mathrm{cm} = 0.06\\,\\mathrm{m}$","Work done calculate karein: $W = mg\\Delta h = 5\\,\\mathrm{kg} \\times 10\\,\\mathrm{m\\,s^{-2}} \\times 0.06\\,\\mathrm{m} = 50 \\times 0.06 = \\color{#7ee2b8}{3\\,\\mathrm{J}}$"],"r":"Brick ko vertical khada karne me kiya gaya work $3\\,\\mathrm{J}$ hai.","w":["**Option B ($5\\,\\mathrm{J}$):** Final CG height $10\\,\\mathrm{cm}$ ($W = 50 \\times 0.10 = 5\\,\\mathrm{J}$) lekar initial height $4\\,\\mathrm{cm}$ ghatana bhoolne se aata hai!","**Option C ($7\\,\\mathrm{J}$):** $10 + 4 = 14\\,\\mathrm{cm}$ galti se jodkar $50 \\times 0.14 = 7\\,\\mathrm{J}$ nikalne se aata hai.","**Option D ($9\\,\\mathrm{J}$):** CG lene ke bajay poori side lengths ka galat difference lene se aata hai."],"t":"Sabse badi silly mistake **Option B ($5\\,\\mathrm{J}$)** hoti hai — yaad rakhein pehle bhi brick zameen ke andar nahi dabi thi, uska CG pehle se $4\\,\\mathrm{cm}$ upar tha!","sim":""},{"id":14,"q":"What is the approximate mass number of a nucleus with radius $4.8 \\times 10^{-15}\\,\\mathrm{m}$? (Given $R_0 = 1.2 \\times 10^{-15}\\,\\mathrm{m}$)","fig":"","opt":["$27$","$40$","$64$","$91$"],"ans":2,"c":"Sabhi nuclei ki nuclear density lagbhag constant hoti hai, isliye nucleus ka volume $\\dfrac{4}{3}\\pi R^3$ uske mass number $A$ (nucleons ki sankhya) ke proportional hota hai. Isse empirical relation milta hai: $R = R_0 A^{1/3}$.","m":"$A^{1/3} = \\dfrac{R}{R_0}$ nikalkar dono taraf cube karenge ($A = \\left(\\dfrac{R}{R_0}\\right)^3$).","s":["Nuclear radius formula likhein: $R = R_0 A^{1/3} \\implies A^{1/3} = \\dfrac{R}{R_0}$","Values rakhein: $A^{1/3} = \\dfrac{4.8 \\times \\cancel{10^{-15}\\,\\mathrm{m}}}{1.2 \\times \\cancel{10^{-15}\\,\\mathrm{m}}} = \\dfrac{4.8}{1.2} = 4$","Dono taraf cube karein: $A = 4^3 = 4 \\times 4 \\times 4 = \\color{#7ee2b8}{64}$"],"r":"Nucleus ka approximate mass number $64$ (jaise $\\ce{^{64}Cu}$ ya $\\ce{^{64}Zn}$) hai.","w":["**Option A ($27$):** Ratio $3$ aane par $3^3 = 27$ hota ($R = 3.6 \\times 10^{-15}\\,\\mathrm{m}$ ke liye).","**Option B ($40$):** Cube ki jagah $4 \\times 10 = 40$ kar dene se aata hai.","**Option D ($91$):** Galat multiplication se non-cube number aaya hai."],"t":"NEET me $A$ aksar perfect cube diya jaata hai: $A = 8 \\leftrightarrow 2R_0$, $A = 27 \\leftrightarrow 3R_0$, $A = 64 \\leftrightarrow 4R_0$, $A = 125 \\leftrightarrow 5R_0$, $A = 216 \\leftrightarrow 6R_0$!","sim":""},{"id":15,"q":"The mean free path of a gas molecule is $5 \\times 10^{-7}\\,\\mathrm{m}$ at $1\\,\\mathrm{atm}$. What will it be if the pressure is reduced to $0.5\\,\\mathrm{atm}$ at constant temperature?","fig":"","opt":["$2.5 \\times 10^{-7}\\,\\mathrm{m}$","$5.0 \\times 10^{-7}\\,\\mathrm{m}$","$7.5 \\times 10^{-7}\\,\\mathrm{m}$","$1.0 \\times 10^{-6}\\,\\mathrm{m}$"],"ans":3,"c":"Kinetic Theory of Gases ke anusaar gas molecule ka **mean free path** $\\lambda$ (do successive collisions ke beech ki ausat doori) $\\lambda = \\dfrac{k_{\\mathrm{B}} T}{\\sqrt{2}\\pi d^2 P}$ hota hai. Constant temperature $T$ par pressure kam karne se molecules door-door ho jaate hain, isliye $\\lambda \\propto \\dfrac{1}{P}$!","m":"Constant temperature par $\\lambda_1 P_1 = \\lambda_2 P_2$ lagayenge aur scientific notation ka exponent dhyan se adjust karenge.","s":["Constant $T$ par relation likhein: $\\lambda \\propto \\dfrac{1}{P} \\implies \\lambda_2 = \\lambda_1 \\times \\dfrac{P_1}{P_2}$","Values rakhein: $\\lambda_2 = (5 \\times 10^{-7}\\,\\mathrm{m}) \\times \\dfrac{1\\,\\cancel{\\mathrm{atm}}}{0.5\\,\\cancel{\\mathrm{atm}}}$","$\\dfrac{1}{0.5} = 2$ se multiply karein: $\\lambda_2 = 10 \\times 10^{-7}\\,\\mathrm{m}$","Standard power me likhein: $10^{1} \\times 10^{-7}\\,\\mathrm{m} = \\color{#7ee2b8}{1.0 \\times 10^{-6}\\,\\mathrm{m}}$"],"r":"$0.5\\,\\mathrm{atm}$ pressure par naya mean free path $1.0 \\times 10^{-6}\\,\\mathrm{m}$ hoga.","w":["**Option A ($2.5 \\times 10^{-7}\\,\\mathrm{m}$):** $\\lambda \\propto P$ galat samajhkar dugna karne ke bajay aadha kar diya gaya.","**Option B ($5.0 \\times 10^{-7}\\,\\mathrm{m}$):** Mean free path ko pressure se independent maanne ki galti (ye tab hota jab density/volume fixed rehta).","**Option C ($7.5 \\times 10^{-7}\\,\\mathrm{m}$):** $1.5$ se multiply karne ki arithmetic error hai."],"t":"Intuition check: Bheed (pressure $P$) aadhi hogi toh bina takraye chalne ki doori ($\\lambda$) **dugni** hogi: $5 \\times 10^{-7} \\times 2 = 10^{-6}\\,\\mathrm{m}$!","sim":""},{"id":16,"q":"A particle of mass $m$ is moving with speed $2v$ and collides with a mass $2m$ moving with speed $v$ in the same direction. After collision, the first mass is stopped completely while the second one splits into two particles each of mass $m$, which move at angle $45^\\circ$ with respect to the original direction. The speed of each of the moving particle will be","fig":"q16","opt":["$\\sqrt{2}v$","$\\dfrac{v}{\\sqrt{2}}$","$\\dfrac{v}{2\\sqrt{2}}$","$2\\sqrt{2}v$"],"ans":3,"c":"Collision ya internal splitting me koi external force nahi lagta ($\\vec{F}_{\\mathrm{ext}} = 0$), isliye system ka **total linear momentum** har direction ($x$ aur $y$) me alag-alag conserved rehta hai.","m":"Original motion direction ko $+x$-axis lenge aur $(p_x)_{\\mathrm{initial}} = (p_x)_{\\mathrm{final}}$ lagayenge (symmetry se $+45^\\circ$ aur $-45^\\circ$ par $y$-components ek doosre ko cancel kar dete hain).","s":["Collision se pehle $+x$ direction me total momentum: $p_i = m(2v) + (2m)(v) = 2mv + 2mv = 4mv$","Collision ke baad: pehla mass ruk gaya ($0$), aur do fragments (mass $m$, speed $v'$) $+45^\\circ$ aur $-45^\\circ$ par gaye:","Final $+x$ momentum: $p_f = 0 + m v'\\cos 45^\\circ + m v'\\cos 45^\\circ = 2m v' \\left(\\dfrac{1}{\\sqrt{2}}\\right) = \\sqrt{2}\\,mv'$","Momentum conservation $p_i = p_f$ lagayein: $4\\cancel{m}v = \\sqrt{2}\\,\\cancel{m}v'$","$v'$ solve karein: $v' = \\dfrac{4v}{\\sqrt{2}} = \\dfrac{4\\sqrt{2}\\,v}{2} = \\color{#7ee2b8}{2\\sqrt{2}v}$"],"r":"Dono moving fragments me se pratyek ki speed $2\\sqrt{2}v$ hogi.","w":["**Option A ($\\sqrt{2}v$):** Initial momentum sirf ek particle ka $2mv$ lekar doosre particle ($2m \\cdot v = 2mv$) ko bhoolne se aata hai!","**Option B ($\\dfrac{v}{\\sqrt{2}}$):** $\\cos 45^\\circ$ se divide karne ke bajay multiply aur factor $4$ chhodne se aata hai.","**Option C ($\\dfrac{v}{2\\sqrt{2}}$):** Ratio ulta lene ki galti se aata hai."],"t":"Sabse common trap **Option A ($\\sqrt{2}v$)** hai — yaad rakhein doosra mass $2m$ rest par nahi tha, wo bhi same direction me speed $v$ se chal raha tha, isliye $p_i = 2mv + 2mv = 4mv$ hai!","sim":""},{"id":17,"q":"A copper wire carries $6\\,\\mathrm{A}$ with a drift speed of $1.2 \\times 10^{-4}\\,\\mathrm{m\\,s^{-1}}$. If $n = 8.5 \\times 10^{28}\\,\\mathrm{m^{-3}}$ and $e = 1.6 \\times 10^{-19}\\,\\mathrm{C}$, what is the cross-sectional area?","fig":"","opt":["$4.7 \\times 10^{-5}\\,\\mathrm{m^2}$","$3.5 \\times 10^{-7}\\,\\mathrm{m^2}$","$3.6 \\times 10^{-3}\\,\\mathrm{m^2}$","$3.68 \\times 10^{-5}\\,\\mathrm{m^2}$"],"ans":3,"c":"Conductor me free electrons electric field ke karan average **drift velocity** $v_d$ se badhte hain. Electric current aur drift speed ka fundamental relation hai: $I = n e A v_d$, jahan $n$ electron number density, $e$ charge, aur $A$ wire ka cross-sectional area hai.","m":"$A = \\dfrac{I}{n e v_d}$ me sabhi SI values rakhkar pehle $n \\cdot e \\cdot v_d$ aur powers of $10$ nikalkar exact mantissa aur power check karenge.","s":["Formula rearrange karein: $I = n e A v_d \\implies A = \\dfrac{I}{n e v_d}$","Values rakhein: $A = \\dfrac{6}{(8.5 \\times 10^{28}) \\times (1.6 \\times 10^{-19}) \\times (1.2 \\times 10^{-4})}\\,\\mathrm{m^2}$","Denominator ke numbers multiply karein: $8.5 \\times 1.6 = 13.6$, aur $13.6 \\times 1.2 = 16.32$","Denominator ki $10$ ki powers jodein: $10^{28 - 19 - 4} = 10^{5}$, toh denominator $= 16.32 \\times 10^{5} = 1.632 \\times 10^{6}$","Divide karein: $A = \\dfrac{6}{1.632 \\times 10^{6}} = 3.676 \\times 10^{-6}\\,\\mathrm{m^2} \\approx \\color{#7ee2b8}{3.68 \\times 10^{-6}\\,\\mathrm{m^2}}$ (Source PDF ke Option D me printing exponent typo se $10^{-5}$ chhapa hai jabki mantissa $3.68$ exact yahi hai!)"],"r":"Exact calculation $3.68 \\times 10^{-6}\\,\\mathrm{m^2}$ deta hai, jo source paper ke intended **Option D ($3.68 \\times 10^{-5}\\,\\mathrm{m^2}$, exponent misprint)** se match karta hai.","w":["**Option A ($4.7 \\times 10^{-5}\\,\\mathrm{m^2}$):** Mantissa $4.7$ galat division se aaya hai.","**Option B ($3.5 \\times 10^{-7}\\,\\mathrm{m^2}$):** Mantissa aur exponent dono galat hain.","**Option C ($3.6 \\times 10^{-3}\\,\\mathrm{m^2}$):** $10^{-3}\\,\\mathrm{m^2}$ ($36\\,\\mathrm{cm^2}$!) bahut mota rod hoga aur $3$ decimal orders off hai."],"t":"Exam hall rule: Jab kisi numerical me $3$-significant-digit mantissa ($3.68$) sirf ek hi option me exact match ho aur $10$ ki power me printing slip ho, hamesha exact mantissa match (**Option D**) hi official key hota hai!","sim":""},{"id":18,"q":"For a uniform rectangular sheet, shown in the figure, the ratio of moments of inertia about the axes perpendicular to the sheet and passing through $O$ (the centre of mass) and $O'$ (corner point) is","fig":"q18","opt":["$\\dfrac{1}{8}$","$\\dfrac{2}{3}$","$\\dfrac{1}{4}$","$\\dfrac{1}{2}$"],"ans":2,"c":"Rectangular lamina (sides $L$ aur $B$, mass $M$) ka uske centre of mass $O$ se plane ke perpendicular axis ke paritah moment of inertia $I_O = \\dfrac{M}{12}(L^2 + B^2)$ hota hai. Kisi parallel corner axis $O'$ ke liye **Parallel Axis Theorem** lagta hai: $I_{O'} = I_O + Md^2$.","m":"Gaur karein ki centre $O$ se corner $O'$ ki doori $d = \\sqrt{(L/2)^2 + (B/2)^2} = \\dfrac{1}{2}\\sqrt{L^2 + B^2}$ hoti hai — yaani ye ratio sheet ki dimensions ($80\\,\\mathrm{cm}, 60\\,\\mathrm{cm}$) se **hamesha independent ($\\dfrac{1}{4}$)** hota hai! Hum dimensions rakhkar aur general algebra dono se verify karenge.","s":["Centre $O$ ke paritah MOI ($L = 80\\,\\mathrm{cm}, B = 60\\,\\mathrm{cm}$): $I_O = \\dfrac{M}{12}(80^2 + 60^2) = \\dfrac{M}{12}(6400 + 3600) = \\dfrac{10000\\,M}{12}$","Centre $O$ se corner $O'$ ki doori: $d = \\sqrt{40^2 + 30^2} = \\sqrt{1600 + 900} = \\sqrt{2500} = 50\\,\\mathrm{cm}$","Parallel Axis Theorem se $I_{O'}$ nikalein: $I_{O'} = I_O + Md^2 = \\dfrac{10000\\,M}{12} + M(50)^2 = \\dfrac{10000\\,M + 30000\\,M}{12} = \\dfrac{40000\\,M}{12}$","Dono ka ratio lein: $\\dfrac{I_O}{I_{O'}} = \\dfrac{\\cancel{\\frac{M}{12}} \\times 10000}{\\cancel{\\frac{M}{12}} \\times 40000} = \\color{#7ee2b8}{\\dfrac{1}{4}}$"],"r":"Moments of inertia ka ratio $\\dfrac{I_O}{I_{O'}} = \\dfrac{1}{4}$ hai.","w":["**Option A ($\\dfrac{1}{8}$):** $d^2 = \\dfrac{L^2 + B^2}{4}$ ki jagah galti se $L^2 + B^2$ (poora diagonal!) le lene par $\\dfrac{1/12}{1/12 + 1} = \\dfrac{1}{13}$ ya similar galti hoti hai.","**Option B ($\\dfrac{2}{3}$):** Rod ya disc formula mix karne ki wajah se galat fraction aata hai.","**Option D ($\\dfrac{1}{2}$):** Perpendicular axis theorem aur parallel axis theorem mix karne se aata hai."],"t":"Universal shortcut: **Kisi bhi** rectangular ya square plate ke liye $d^2 = \\dfrac{L^2 + B^2}{4} = 3 \\times \\dfrac{L^2 + B^2}{12}$, isliye $I_{\\text{corner}} = I_{\\text{CM}} + 3I_{\\text{CM}} = 4I_{\\text{CM}} \\implies \\dfrac{I_{\\text{CM}}}{I_{\\text{corner}}} = \\dfrac{1}{4}$ hamesha fixed hota hai — $80$ aur $60$ chaahe kuch bhi hon!","sim":""},{"id":19,"q":"A spaceship is launched into a circular orbit close to earth's surface. The additional velocity that should be imparted to the spaceship in the orbit to overcome the gravitational pull is (Radius of earth $= 6400\\,\\mathrm{km}$ and $g = 9.8\\,\\mathrm{m\\,s^{-2}}$)","fig":"q19","opt":["$11.2\\,\\mathrm{km\\,s^{-1}}$","$8\\,\\mathrm{km\\,s^{-1}}$","$3.2\\,\\mathrm{km\\,s^{-1}}$","$1.5\\,\\mathrm{km\\,s^{-1}}$"],"ans":2,"c":"Earth surface ke paas circular orbit me satellite ki **orbital speed** $v_o = \\sqrt{gR}$ hoti hai, jabki Earth ke gravitational pull se hamesha ke liye nikalne ke liye **escape speed** $v_e = \\sqrt{2gR} = \\sqrt{2}\\,v_o$ chahiye.","m":"Spaceship pehle se hi orbit me $v_o \\approx 8\\,\\mathrm{km\\,s^{-1}}$ se ghoom raha hai, isliye **additional velocity** $\\Delta v = v_e - v_o$ nikalenge.","s":["Close circular orbit velocity nikalein: $v_o = \\sqrt{gR} = \\sqrt{9.8 \\times 6.4 \\times 10^{6}}\\,\\mathrm{m\\,s^{-1}} = \\sqrt{62.72} \\times 10^{3}\\,\\mathrm{m\\,s^{-1}} \\approx 8\\,\\mathrm{km\\,s^{-1}}$","Escape velocity nikalein: $v_e = \\sqrt{2gR} = \\sqrt{2} \\times v_o \\approx 1.414 \\times 7.92 \\approx 11.2\\,\\mathrm{km\\,s^{-1}}$","Additional velocity subtract karein: $\\Delta v = v_e - v_o = 11.2\\,\\mathrm{km\\,s^{-1}} - 8.0\\,\\mathrm{km\\,s^{-1}} = \\color{#7ee2b8}{3.2\\,\\mathrm{km\\,s^{-1}}}$"],"r":"Spaceship ko escape karane ke liye $3.2\\,\\mathrm{km\\,s^{-1}}$ additional velocity deni hogi.","w":["**Option A ($11.2\\,\\mathrm{km\\,s^{-1}}$):** Ye kul escape speed $v_e$ hai — spaceship rest par nahi balki pehle se $8\\,\\mathrm{km\\,s^{-1}}$ se orbit me hai!","**Option B ($8\\,\\mathrm{km\\,s^{-1}}$):** Ye initial orbital speed $v_o$ hi hai; itna aur dene par total $16\\,\\mathrm{km\\,s^{-1}}$ ho jayega.","**Option D ($1.5\\,\\mathrm{km\\,s^{-1}}$):** Isse total speed $9.5\\,\\mathrm{km\\,s^{-1}} < 11.2\\,\\mathrm{km\\,s^{-1}}$ rahegi aur satellite elliptical orbit me hi bandha rahega."],"t":"Jaldi me **Option A ($11.2\\,\\mathrm{km\\,s^{-1}}$)** mat tick karna — sawal me word **\"additional velocity\"** underline kar liya karo: $11.2 - 8.0 = 3.2\\,\\mathrm{km\\,s^{-1}}$!","sim":""},{"id":20,"q":"A tension of $20\\,\\mathrm{N}$ is applied to a wire of cross-sectional area $0.01\\,\\mathrm{cm^2}$. The decrease in cross-sectional area is (Take, Young's modulus of $\\ce{Cu} = 1.1 \\times 10^{11}\\,\\mathrm{N\\,m^{-2}}$ and Poisson's ratio $= 0.32$)","fig":"","opt":["$1.81 \\times 10^{-4}\\,\\mathrm{cm^2}$","$1.16 \\times 10^{-6}\\,\\mathrm{cm^2}$","$2.81 \\times 10^{-8}\\,\\mathrm{cm^2}$","$5.23 \\times 10^{-3}\\,\\mathrm{cm^2}$"],"ans":1,"c":"Jab wire ko kheench kar lamba kiya jaata hai (longitudinal strain $\\dfrac{\\Delta l}{l} = \\dfrac{F}{AY}$), toh wo patla bhi hota hai (lateral contraction $\\dfrac{\\Delta r}{r} = \\sigma\\dfrac{\\Delta l}{l}$). Chunki $A = \\pi r^2$, small strains ke liye relative area decrease $\\dfrac{\\Delta A}{A} = 2\\dfrac{\\Delta r}{r}$ hota hai!","m":"Gaur karein ki $\\Delta A = A \\cdot \\dfrac{\\Delta A}{A} = \\cancel{A} \\cdot \\left(2\\sigma\\dfrac{F}{\\cancel{A}Y}\\right)$ — **area $A$ upar-neeche kat jaata hai**? Rukiye: SI me $\\Delta A = \\dfrac{2\\sigma F}{Y}$ seedha $\\mathrm{m^2}$ me milta hai aur $1\\,\\mathrm{m^2} = 10^{4}\\,\\mathrm{cm^2}$ se $2$ lines me exact answer aa jaata hai! Dono methods se check karte hain!","s":["Step $1$ (Longitudinal strain): $A = 0.01\\,\\mathrm{cm^2} = 10^{-6}\\,\\mathrm{m^2}$, toh $\\dfrac{\\Delta l}{l} = \\dfrac{F}{AY} = \\dfrac{20}{10^{-6} \\times 1.1 \\times 10^{11}} = \\dfrac{20}{1.1 \\times 10^{5}} = 1.818 \\times 10^{-4}$","Step $2$ (Fractional area decrease): $\\dfrac{\\Delta A}{A} = 2\\dfrac{\\Delta r}{r} = 2\\sigma\\dfrac{\\Delta l}{l} = 2 \\times 0.32 \\times 1.818 \\times 10^{-4} = 1.1636 \\times 10^{-4}$","Step $3$ ($\\mathrm{cm^2}$ me $\\Delta A$): $\\Delta A = A \\times 1.1636 \\times 10^{-4} = 0.01\\,\\mathrm{cm^2} \\times 1.1636 \\times 10^{-4} = \\color{#7ee2b8}{1.16 \\times 10^{-6}\\,\\mathrm{cm^2}}$","Shortcut verify: $\\Delta A = \\dfrac{2\\sigma F}{Y} = \\dfrac{2 \\times 0.32 \\times 20}{1.1 \\times 10^{11}}\\,\\mathrm{m^2} = 1.1636 \\times 10^{-10}\\,\\mathrm{m^2} = 1.16 \\times 10^{-6}\\,\\mathrm{cm^2}$ — exact match!"],"r":"Wire ke cross-sectional area me kami $1.16 \\times 10^{-6}\\,\\mathrm{cm^2}$ hogi.","w":["**Option A ($1.81 \\times 10^{-4}\\,\\mathrm{cm^2}$):** Ye sirf dimensionless longitudinal strain $\\dfrac{\\Delta l}{l} = 1.81 \\times 10^{-4}$ ki sankhya hai!","**Option C ($2.81 \\times 10^{-8}\\,\\mathrm{cm^2}$):** Galat decimal power aur $\\sigma^2$ kar dene se aata hai.","**Option D ($5.23 \\times 10^{-3}\\,\\mathrm{cm^2}$):** $A = 0.01\\,\\mathrm{cm^2}$ se bada/comparable badlaav hookean elastic range me sambhav hi nahi hai."],"t":"Super formula yaad rakho: **Wire ka area kitna bhi ho**, elastic tension $F$ lagane par $\\Delta A = \\dfrac{2\\sigma F}{Y}$ ($A$ se bilkul independent!) hota hai!","sim":""},{"id":21,"q":"A man runs at $5\\,\\mathrm{m\\,s^{-1}}$ towards a wall and throws a ball at $15\\,\\mathrm{m\\,s^{-1}}$ towards the wall when $20\\,\\mathrm{m}$ away. If the ball rebounds at $10\\,\\mathrm{m\\,s^{-1}}$ when does it return to the man? (Take wall as origin)","fig":"q21","opt":["$1.5\\,\\mathrm{s}$","$2.5\\,\\mathrm{s}$","$1\\,\\mathrm{s}$","$2\\,\\mathrm{s}$"],"ans":3,"c":"Relative motion me jab daudta hua aadmi ($v_m = 5\\,\\mathrm{m\\,s^{-1}}$) aage ki taraf $15\\,\\mathrm{m\\,s^{-1}}$ se ball fekta hai, toh ball ki ground speed donon velocities ke yog $v_b = 15 + 5 = 20\\,\\mathrm{m\\,s^{-1}}$ ke barabar hoti hai. Wall se takrane ke baad ball aur aadmi opposite directions me ek doosre ki taraf aate hain, isliye relative approach speed $v_{\\mathrm{rel}} = v_{\\mathrm{rebound}} + v_m$ hoti hai.","m":"Motion ko do hisson me todenge: (i) throw se wall tak pahunchne ka time $t_1$, aur us dauran aadmi ki nayi position; (ii) rebound ke baad relative velocity se milne ka time $t_2$. Total time $T = t_1 + t_2$.","s":["Ground ke sapeksh ball ki forward speed: $v_{\\mathrm{ball}} = 15 + 5 = 20\\,\\mathrm{m\\,s^{-1}}$","$20\\,\\mathrm{m}$ door wall tak pahunchne ka samay: $t_1 = \\dfrac{20\\,\\mathrm{m}}{20\\,\\mathrm{m\\,s^{-1}}} = 1\\,\\mathrm{s}$","Is $1\\,\\mathrm{s}$ me aadmi aage badha $= 5\\,\\mathrm{m\\,s^{-1}} \\times 1\\,\\mathrm{s} = 5\\,\\mathrm{m}$, toh wall se ab aadmi ki doori $= 20 - 5 = 15\\,\\mathrm{m}$","Rebound ke baad ball $10\\,\\mathrm{m\\,s^{-1}}$ se wapas aur aadmi $5\\,\\mathrm{m\\,s^{-1}}$ se samne aa raha hai $\\implies v_{\\mathrm{rel}} = 10 + 5 = 15\\,\\mathrm{m\\,s^{-1}}$","Wapas milne ka samay $t_2 = \\dfrac{15\\,\\mathrm{m}}{15\\,\\mathrm{m\\,s^{-1}}} = 1\\,\\mathrm{s} \\implies$ Kul samay $T = t_1 + t_2 = 1 + 1 = \\color{#7ee2b8}{2\\,\\mathrm{s}}$"],"r":"Ball fekne ke $2\\,\\mathrm{s}$ baad wapas aadmi ke paas laut aayegi.","w":["**Option A ($1.5\\,\\mathrm{s}$):** Rebound ke baad aadmi ki motion ignore karke $\\dfrac{15}{10}$ ya adhoora sum lene se aata hai.","**Option B ($2.5\\,\\mathrm{s}$):** $t_2 = \\dfrac{15}{10} = 1.5\\,\\mathrm{s}$ lekar $1 + 1.5 = 2.5\\,\\mathrm{s}$ (aadmi ko ruk gaya maan lene ki galti!) se aata hai!","**Option C ($1\\,\\mathrm{s}$):** Ye sirf wall tak jaane ka aadha samay $t_1 = 1\\,\\mathrm{s}$ hai, wapas lautne ka nahi."],"t":"Trap alert: **Option B ($2.5\\,\\mathrm{s}$)** tab aata hai jab aap bhool jaate hain ki rebound ke baad bhi aadmi $5\\,\\mathrm{m\\,s^{-1}}$ se samne daud raha hai!","sim":""},{"id":22,"q":"Water is flowing with a speed of $2\\,\\mathrm{m\\,s^{-1}}$ in a horizontal pipe with cross-sectional area decreasing from $2 \\times 10^{-2}\\,\\mathrm{m^2}$ to $0.01\\,\\mathrm{m^2}$ at pressure $4 \\times 10^{4}\\,\\mathrm{Pa}$. What will be the pressure at small cross-section?","fig":"q22","opt":["$2 \\times 10^{4}\\,\\mathrm{Pa}$","$3.4 \\times 10^{4}\\,\\mathrm{Pa}$","$2.4 \\times 10^{4}\\,\\mathrm{Pa}$","$4 \\times 10^{4}\\,\\mathrm{Pa}$"],"ans":1,"c":"Ideal incompressible fluid ke steady flow me do niyam lagte hain: (1) **Equation of Continuity** $A_1 v_1 = A_2 v_2$ (jahan pipe sakra ho wahan tezi se paani behta hai), aur (2) **Bernoulli's Theorem** (horizontal pipe ke liye $p_1 + \\dfrac{1}{2}\\rho v_1^2 = p_2 + \\dfrac{1}{2}\\rho v_2^2$).","m":"Pehle $A_1 v_1 = A_2 v_2$ se chhote cross-section ki speed $v_2$ nikalenge, phir horizontal Bernoulli equation ($\\rho_{\\text{water}} = 10^{3}\\,\\mathrm{kg\\,m^{-3}}$) se $p_2$ nikalenge.","s":["Continuity equation lagayein: $v_2 = \\dfrac{A_1 v_1}{A_2} = \\dfrac{2 \\times 10^{-2} \\times 2}{0.01} = \\dfrac{0.04}{0.01} = 4\\,\\mathrm{m\\,s^{-1}}$","Horizontal pipe ke liye Bernoulli's theorem: $p_2 = p_1 + \\dfrac{1}{2}\\rho(v_1^2 - v_2^2)$","Values rakhein ($\\rho = 10^{3}\\,\\mathrm{kg\\,m^{-3}}$): $p_2 = 4 \\times 10^{4} + \\dfrac{1}{2} \\times 10^{3} \\times (2^2 - 4^2)$","Simplify karein: $p_2 = 4 \\times 10^{4} + 500 \\times (4 - 16) = 4 \\times 10^{4} - 6000\\,\\mathrm{Pa}$","Scientific form me ghataein: $40000 - 6000 = 34000\\,\\mathrm{Pa} = \\color{#7ee2b8}{3.4 \\times 10^{4}\\,\\mathrm{Pa}}$"],"r":"Chhote cross-section par paani ka pressure $3.4 \\times 10^{4}\\,\\mathrm{Pa}$ hoga.","w":["**Option A ($2 \\times 10^{4}\\,\\mathrm{Pa}$):** Galat soch ki area aadha hone par pressure bhi aadha ho jayega ($p \\propto A$ nahi hota!).","**Option C ($2.4 \\times 10^{4}\\,\\mathrm{Pa}$):** $\\dfrac{1}{2}\\rho v_2^2$ me $\\dfrac{1}{2}$ bhool kar $40000 - 16000 = 24000\\,\\mathrm{Pa}$ nikalne se aata hai!","**Option D ($4 \\times 10^{4}\\,\\mathrm{Pa}$):** Speed badhne par pressure constant rehna Bernoulli conservation ke khilaaf hai."],"t":"**Venturi effect**: Jahan velocity **badhti** hai ($2 \\to 4\\,\\mathrm{m\\,s^{-1}}$), wahan static pressure **ghatta** hai ($4 \\times 10^{4} \\to 3.4 \\times 10^{4}\\,\\mathrm{Pa}$)!","sim":""},{"id":23,"q":"What will be the temperature, when $150\\,\\mathrm{g}$ of ice at $0^\\circ\\mathrm{C}$ is mixed with $300\\,\\mathrm{g}$ of water at $50^\\circ\\mathrm{C}$? Specific heat of water $= 1\\,\\mathrm{cal\\,g^{-1}\\,{}^\\circ C^{-1}}$. Latent heat of fusion of ice $= 80\\,\\mathrm{cal\\,g^{-1}}$.","fig":"","opt":["$6.0^\\circ\\mathrm{C}$","$5.6^\\circ\\mathrm{C}$","$6.7^\\circ\\mathrm{C}$","$17.6^\\circ\\mathrm{C}$"],"ans":2,"c":"**Principle of Calorimetry** ke anusaar isolated mixing me $\\text{Heat Lost by Hot Body} = \\text{Heat Gained by Cold Body}$. Ice-water mixing me sabse pehle check karna zaroori hota hai ki garm paani saari barf pighla sakta hai ya nahi!","m":"Step $1$: $150\\,\\mathrm{g}$ ice pighlane ke liye chahiye $Q_{\\mathrm{melt}}$ aur $50^\\circ\\mathrm{C}$ paani dwara $0^\\circ\\mathrm{C}$ tak thanda hone par available heat $Q_{\\mathrm{avail}}$ compare karenge. Agar $Q_{\\mathrm{avail}} > Q_{\\mathrm{melt}}$, toh bachi hui heat kul $(150 + 300) = 450\\,\\mathrm{g}$ paani ka taap badhayegi!","s":["Saari ice ko $0^\\circ\\mathrm{C}$ water me pighlane ki aavashyak heat: $Q_{\\mathrm{melt}} = m_i L_f = 150 \\times 80 = 12000\\,\\mathrm{cal}$","$300\\,\\mathrm{g}$ water ko $50^\\circ\\mathrm{C} \\to 0^\\circ\\mathrm{C}$ laane se mukt adhiktam heat: $Q_{\\mathrm{avail}} = m_w c_w \\Delta T = 300 \\times 1 \\times 50 = 15000\\,\\mathrm{cal}$","Chunki $15000\\,\\mathrm{cal} > 12000\\,\\mathrm{cal}$, saari barf pighal jayegi aur bachi heat $\\Delta Q = 15000 - 12000 = 3000\\,\\mathrm{cal}$","Ab mixture me $0^\\circ\\mathrm{C}$ par kul paani $= 150 + 300 = 450\\,\\mathrm{g}$ hai; iska final temperature $T$: $450 \\times 1 \\times T = 3000$","Divide karein: $T = \\dfrac{3000}{450} = \\dfrac{20}{3}\\,{}^\\circ\\mathrm{C} = 6.67^\\circ\\mathrm{C} \\approx \\color{#7ee2b8}{6.7^\\circ\\mathrm{C}}$"],"r":"Mixture ka final equilibrium temperature $6.7^\\circ\\mathrm{C}$ hoga.","w":["**Option A ($6.0^\\circ\\mathrm{C}$):** $\\dfrac{3000}{500}$ galat total mass lene se $6.0^\\circ\\mathrm{C}$ aata hai.","**Option B ($5.6^\\circ\\mathrm{C}$):** Division me galti se $\\dfrac{25}{4.5}$ jaisa maan lene par aata hai.","**Option D ($17.6^\\circ\\mathrm{C}$):** Ice pighlane ke baad uske $150\\,\\mathrm{g}$ melted water ko denominator me jodna bhoolne ya latent heat aadhi lene se aata hai."],"t":"Ice-water problems ka **Golden Method**: Sab kuch pehle mentally $0^\\circ\\mathrm{C}$ water me le aao! Surplus heat $= 15000 - 12000 = +3000\\,\\mathrm{cal}$; total mass $= 450\\,\\mathrm{g} \\implies T = \\dfrac{3000}{450} = 6.67^\\circ\\mathrm{C}$! (Agar surplus negative aata, toh answer seedha $0^\\circ\\mathrm{C}$ hota!)","sim":"calorimetry"},{"id":24,"q":"A block of mass $1\\,\\mathrm{kg}$ oscillates with a spring of $k = 100\\,\\mathrm{N\\,m^{-1}}$. If the amplitude is $10\\,\\mathrm{cm}$, what is the total energy?","fig":"q24","opt":["$0.25\\,\\mathrm{J}$","$0.5\\,\\mathrm{J}$","$0.75\\,\\mathrm{J}$","$1.0\\,\\mathrm{J}$"],"ans":1,"c":"Simple Harmonic Motion (SHM) me extreme position ($x = A$) par velocity zero hoti hai aur saari total mechanical energy spring potential energy ke roop me hoti hai: $E = \\dfrac{1}{2}kA^2$.","m":"Amplitude $A = 10\\,\\mathrm{cm}$ ko pehle SI unit ($0.1\\,\\mathrm{m}$) me badalkar seedha $E = \\dfrac{1}{2}kA^2$ lagayenge.","s":["Unit convert karein: $A = 10\\,\\mathrm{cm} = 0.1\\,\\mathrm{m}$, aur $k = 100\\,\\mathrm{N\\,m^{-1}}$","SHM total energy formula likhein: $E = \\dfrac{1}{2}kA^2$","Values rakhein: $E = \\dfrac{1}{\\cancel{2}} \\times \\cancel{100}^{\\,50} \\times (0.1)^2$","Simplify karein: $E = 50 \\times 0.01 = \\color{#7ee2b8}{0.5\\,\\mathrm{J}}$"],"r":"Oscillating block ki total mechanical energy $0.5\\,\\mathrm{J}$ hai.","w":["**Option A ($0.25\\,\\mathrm{J}$):** Do baar $\\dfrac{1}{2}$ factor lagane ki galti se aata hai.","**Option C ($0.75\\,\\mathrm{J}$):** Arithmetic galti se aata hai.","**Option D ($1.0\\,\\mathrm{J}$):** $\\dfrac{1}{2}$ factor bhool kar $E = kA^2 = 100 \\times 0.01 = 1.0\\,\\mathrm{J}$ likhne se aata hai!"],"t":"Note karein: SHM me jab $k$ aur $A$ diye hon toh block ka mass ($1\\,\\mathrm{kg}$) **total energy par asar nahi daalta** — mass sirf frequency $\\omega = \\sqrt{k/m}$ badalta hai!","sim":""},{"id":25,"q":"Consider a sample of oxygen behaving like an ideal gas. At $300\\,\\mathrm{K}$, the ratio of root mean square (rms) velocity to the average velocity of gas molecule would be (Take, molecular weight of oxygen $= 32\\,\\mathrm{g\\,mol^{-1}}$ and $R = 8.3\\,\\mathrm{J\\,K^{-1}\\,mol^{-1}}$)","fig":"","opt":["$\\sqrt{\\dfrac{3}{8}}$","$\\sqrt{\\dfrac{8}{3}}$","$\\sqrt{\\dfrac{3\\pi}{8}}$","$\\sqrt{\\dfrac{8\\pi}{3}}$"],"ans":2,"c":"Maxwell-Boltzmann speed distribution ke anusaar gas molecules ki teen standard speeds hoti hain: $v_{\\mathrm{mp}} = \\sqrt{\\dfrac{2RT}{M}}$, $v_{\\mathrm{avg}} = \\sqrt{\\dfrac{8RT}{\\pi M}}$, aur $v_{\\mathrm{rms}} = \\sqrt{\\dfrac{3RT}{M}}$, jahan hamesha $v_{\\mathrm{rms}} > v_{\\mathrm{avg}} > v_{\\mathrm{mp}}$ hota hai!","m":"Dono formulas ko divide karne par $\\dfrac{RT}{M}$ poora cancel ho jayega — $T = 300\\,\\mathrm{K}$, $M = 32\\,\\mathrm{g\\,mol^{-1}}$, aur $R = 8.3\\,\\mathrm{J\\,K^{-1}\\,mol^{-1}}$ ko chhoone ki bhi zaroorat nahi!","s":["Dono velocities likhein: $v_{\\mathrm{rms}} = \\sqrt{\\dfrac{3RT}{M}}$ aur $v_{\\mathrm{avg}} = \\sqrt{\\dfrac{8RT}{\\pi M}}$","Ratio lein: $\\dfrac{v_{\\mathrm{rms}}}{v_{\\mathrm{avg}}} = \\dfrac{\\sqrt{\\dfrac{3\\cancel{RT}}{\\cancel{M}}}}{\\sqrt{\\dfrac{8\\cancel{RT}}{\\pi\\cancel{M}}}}$","Fraction simplify karein: $\\dfrac{v_{\\mathrm{rms}}}{v_{\\mathrm{avg}}} = \\color{#7ee2b8}{\\sqrt{\\dfrac{3\\pi}{8}}}$"],"r":"$v_{\\mathrm{rms}}$ aur $v_{\\mathrm{avg}}$ ka anupaat $\\sqrt{\\dfrac{3\\pi}{8}}$ hota hai.","w":["**Option A ($\\sqrt{\\dfrac{3}{8}}$):** $v_{\\mathrm{avg}}$ ke denominator me $\\pi$ bhoolne se aata hai (aur ye $< 1$ hai jabki $v_{\\mathrm{rms}} > v_{\\mathrm{avg}}$ hota hai!).","**Option B ($\\sqrt{\\dfrac{8}{3}}$):** Ulta aur bina $\\pi$ ka galat ratio hai.","**Option D ($\\sqrt{\\dfrac{8\\pi}{3}}$):** Denominator ka $\\pi$ galti se $8$ ke saath multiply kar dene se $\\approx 2.89$ aata hai jo bahut bada hai."],"t":"Smart check: $v_{\\mathrm{rms}}$ $v_{\\mathrm{avg}}$ se **thoda sa bada** ($\\approx 1.085$ guna) hota hai! $\\dfrac{3\\pi}{8} \\approx \\dfrac{9.42}{8} \\approx 1.18 > 1$ — charon me se sirf **Option C** slightly greater than $1$ hai!","sim":""},{"id":26,"q":"A gas is expanded from volume $V_0$ to $2V_0$ under three different processes shown in figure. Process $1$ is isobaric process, process $2$ is isothermal and process $3$ is adiabatic. Let $\\Delta U_1, \\Delta U_2$ and $\\Delta U_3$ be the change in internal energy of the gas in these three processes, then","fig":"q26","opt":["$\\Delta U_1 > \\Delta U_2 > \\Delta U_3$","$\\Delta U_1 < \\Delta U_2 < \\Delta U_3$","$\\Delta U_2 < \\Delta U_1 > \\Delta U_3$","$\\Delta U_2 < \\Delta U_3 < \\Delta U_1$"],"ans":0,"c":"Ideal gas ki internal energy $U$ ek **state function** hai jo keval absolute temperature $T$ par nirbhar karti hai: $\\Delta U = n C_V \\Delta T = n C_V (T_f - T_i)$.","m":"Har process me expansion ($V_0 \\to 2V_0$) ke dauran temperature $T$ badhta hai, constant rehta hai, ya girta hai — bas iska sign ($+$, $0$, $-$) nikal lenge!","s":["**Process $1$ (Isobaric expansion):** $p = \\text{constant}$, $V$ dugna ($V_0 \\to 2V_0$) $\\implies T$ dugna ($T_0 \\to 2T_0$) $\\implies \\Delta T > 0 \\implies \\Delta U_1 > 0$ (**positive**)","**Process $2$ (Isothermal expansion):** $T = \\text{constant}$ $\\implies \\Delta T = 0 \\implies \\Delta U_2 = 0$ (**zero**)","**Process $3$ (Adiabatic expansion):** $Q = 0$, gas khud apni internal energy kharch karke $W > 0$ karti hai $\\implies \\Delta U_3 = -W < 0$ (**negative**)","Sign compare karein: $(+) > 0 > (-) \\implies \\color{#7ee2b8}{\\Delta U_1 > \\Delta U_2 > \\Delta U_3}$"],"r":"Internal energy changes ka sahi kram $\\Delta U_1 > \\Delta U_2 > \\Delta U_3$ hai.","w":["**Option B ($\\Delta U_1 < \\Delta U_2 < \\Delta U_3$):** Ye tab hota jab gas **compress** ($2V_0 \\to V_0$) ho rahi hoti, expand nahi!","**Option C ($\\Delta U_2 < \\Delta U_1 > \\Delta U_3$):** Ye $\\Delta U_2$ aur $\\Delta U_3$ ke beech ka kram tay nahi karta aur adhoora relation hai.","**Option D ($\\Delta U_2 < \\Delta U_3 < \\Delta U_1$):** Isme $\\Delta U_3 > 0$ maan liya gaya hai jabki adiabatic expansion me gas thandi hoti hai ($\\Delta U_3 < 0$)."],"t":"$p\\text{–}V$ graph rule: Jo point origin se jitna door upar-daayein ($pV = nRT$ bada), uska temperature $T$ utna hi **zyada**! $2V_0$ line par upar se neeche $T_1 > T_2 > T_3 \\implies \\Delta U_1 > \\Delta U_2 > \\Delta U_3$!","sim":"pv_gas"},{"id":27,"q":"A particle in SHM is described by the displacement function $x(t) = A\\cos(\\omega t + \\theta)$. If the initial ($t = 0$) position of the particle is $1\\,\\mathrm{cm}$ and its initial velocity is $\\pi\\,\\mathrm{cm\\,s^{-1}}$, what is its amplitude? The angular frequency of the particle is $\\pi\\,\\mathrm{s^{-1}}$.","fig":"","opt":["$1\\,\\mathrm{cm}$","$\\sqrt{2}\\,\\mathrm{cm}$","$2\\,\\mathrm{cm}$","$2.5\\,\\mathrm{cm}$"],"ans":1,"c":"SHM me किसी bhi kshan displacement $x$ aur velocity $v$ ke beech phase angle $\\theta$ ko eliminate karke seedha speed-position relation banta hai: $v^2 = \\omega^2(A^2 - x^2) \\implies A = \\sqrt{x^2 + \\left(\\dfrac{v}{\\omega}\\right)^2}$.","m":"Phase angle $\\theta$ nikalne me waqt barbad karne ke bajay seedha $A = \\sqrt{x_0^2 + \\left(\\dfrac{v_0}{\\omega}\\right)^2}$ lagayenge!","s":["Diya hai ($t = 0$ par): $x_0 = 1\\,\\mathrm{cm}$, $v_0 = \\pi\\,\\mathrm{cm\\,s^{-1}}$, aur $\\omega
