rocarboxypeptidase*).","Bt Cry crystal protein bacterium me **inactive protoxin** hoti hai.","Jab keeda use khata hai, tab **alkaline gut $\\mathrm{pH}$** crystals ko solubilise karke **active toxin** banata hai $\\implies$ Protoxin = **Inactive toxin** ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"Protoxin ek **Inactive toxin** (**Option D**) hota hai.","w":["**Option A (Active toxin):** Active toxin toh insect midgut me alkaline $\\mathrm{pH}$ se solubilisation ke *baad* banta hai.","**Option B (A denatured toxin):** Denatured protein kharab/unfolded hoti hai; protoxin native inactive precursor form hai.","**Option C (Toxin produced by protozoa):** 'Proto-' ka matlab *first/precursor* hai, protozoa nahi (*Bacillus thuringiensis* ek bacterium hai!)."],"t":"Bt Cotton Super Trio: **Inactive Protoxin $\\xrightarrow{\\text{Alkaline }\\mathrm{pH}\\text{ of insect gut}}$ Solubilised Active Toxin $\\longrightarrow$ Binds midgut epithelial cells $\\longrightarrow$ Pores, swelling & lysis**!","sim":""},{"id":143,"q":"**Golden rice** is:","fig":"","opt":["A variety of rice grown along the yellow river in China","Long stored rice having yellow colour tint","A transgenic rice having gene for $\\beta$-carotene","Wild variety of rice with yellow coloured grains"],"ans":2,"c":"**Biofortification / GM Crops** (NCERT Class XII *Biotechnology and its Applications*) ka sabse famous example hai **Golden Rice** — ek genetically modified (**transgenic**) rice variety (*Oryza sativa*) jisme **$\\beta$-carotene (precursor of Vitamin A)** synthesise karne wala gene daala gaya hai taaki developing countries me night-blindness रोकी जा सके!","m":"Direct NCERT GM nutritional enhancement match: **Golden Rice = Vitamin A-enriched transgenic rice ($\\beta$-carotene gene)**!","s":["GM crops se crop ki nutritional quality badhane ka textbook उदाहरण **'Golden rice' — Vitamin 'A' enriched rice** hai.","Chawal ke endosperm ko sunहरा-peela rang **$\\beta$-carotene** pigment (provitamin A) deta hai jo transgene expression se banta hai.","Sahi jawab: **A transgenic rice having gene for $\\beta$-carotene** ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"Golden rice **A transgenic rice having gene for $\\beta$-carotene** (**Option C**) hai.","w":["**Option A:** Yellow River China se Golden rice ka koi talluq nahi hai — ye genetic engineering se bana GM crop hai.","**Option B:** Purane store kiye chawal nahi balki freshly bioengineered Vitamin A-rich rice hai.","**Option D:** Ye wild variety nahi balki recombinant DNA technology se banayi gayi **transgenic** variety hai."],"t":"1-Second Link: **Golden Rice $\\equiv$ Transgenic Rice $\\equiv$ $\\beta$-Carotene $\\equiv$ Vitamin A enriched**!","sim":""},{"id":144,"q":"Decomposers like fungi and bacteria are:<br>i. autotrophs &nbsp;&nbsp; ii. heterotrophs &nbsp;&nbsp; iii. saprotrophs &nbsp;&nbsp; iv. chemoautotrophs.<br>Choose the correct answer:","fig":"","opt":["i and iii","i and iv","ii and iii","i and ii"],"ans":2,"c":"**Decomposers** (mukhya roop se **fungi aur saprophytic bacteria**) apna khana khud **nahi** banate (**heterotrophs — `ii`**), balki dead plant aur animal remains (**detritus**) par digestive enzymes secrete karke dead organic matter se carbon aur energy avshoshit karte hain — isiliye inhein **SAPROTROPHS (`iii`, Greek *sapros* = rotten)** bhi kehte hain!","m":"NCERT Class XII (*Ecosystem*, Energy Flow) ki exact line: *'Decomposers are **heterotrophic** organisms, mainly fungi and bacteria... also known as **saprotrophs**.'*!","s":["**i. autotrophs & iv. chemoautotrophs:** Galat — decomposers $\\ce{CO2}$ fix nahi karte balki complex dead organic matter ko $\\ce{CO2, H2O,}$ aur minerals me todte hain!","**ii. heterotrophs:** Ye dusre jeev-padarthon ke organic carbon par nirbhar rehte hain — **Sahi**.","**iii. saprotrophs:** Dead aur decaying organic matter se poshan lete hain — **Sahi** $\\implies$ $\\color{#7ee2b8}{\\text{ii and iii (Option C)}}$!"],"r":"Decomposers (fungi aur bacteria) **ii and iii (heterotrophs and saprotrophs)** (**Option C**) hote hain.","w":["**Option A (i and iii):** Autotroph aur saprotroph ek saath hona virodhabhasi hai.","**Option B (i and iv):** Chemoautotrophs nitrifying bacteria hote hain, saprophytic decomposers nahi.","**Option D (i and ii):** Ek hi group *autotrophs* aur *heterotrophs* dono ek saath nahi ho sakta."],"t":"NCERT Verbatim Line: *'Decomposers are **heterotrophic** organisms, mainly fungi and bacteria... also known as **saprotrophs**.'*!","sim":""},{"id":145,"q":"Pathogenic bacteria gain resistance to antibiotics due to changes in their :","fig":"","opt":["Nucleosome","Plasmids","Nucleus","Nucleoid"],"ans":1,"c":"Bacteria me main chromosomal DNA ke bahar **autonomously replicating, circular, extra-chromosomal dsDNA** paaya jaata hai jise **PLASMID** kehte hain! Plasmids bacteria ko unique **phenotypic characters** dete hain — aur NCERT ka sabse mukhya उदाहरण hai **Resistance to Antibiotics ($\\mathrm{R}$-plasmid)** (jaise $1972$ me Stanley Cohen aur Herbert Boyer ne *Salmonella typhimurium* ke **native plasmid** se antibiotic resistance gene nikala tha)!","m":"Direct NCERT Cell Biology + Biotech link: **Antibiotic resistance in bacteria $\\equiv$ R-Plasmid**!","s":["**Options A & C:** Prokaryotic bacteria me na histones/nucleosomes hote hain aur na hi true membrane-bound nucleus!","**Option B (Plasmids):** Extra-chromosomal circular DNA (**R-plasmids**) antibiotic-resistance genes ($\\mathrm{amp^R, tet^R}$) carry aur conjugative transfer karte hain!","Sahi jawab: **Plasmids** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Pathogenic bacteria me antibiotic resistance mukhya roop se unke **Plasmids** (**Option B**) ke karan aati hai.","w":["**Option A (Nucleosome):** Nucleosomes eukaryotic chromatin me histone octamer se bante hain, bacteria me nahi.","**Option C (Nucleus):** Prokaryotes me nuclear membrane wala well-defined nucleus absent hota hai.","**Option D (Nucleoid):** Nucleoid essential housekeeping bacterial chromosome rakhta hai, jabki antibiotic resistance trait classically **plasmids** par hota hai."],"t":"Cohen & Boyer ($1972$ — FIRST Recombinant DNA in history!): ***Salmonella typhimurium* plasmid** se **antibiotic resistance gene** kaat kar *E. coli* me transfer kiya!","sim":""},{"id":146,"q":"$\\mathrm{tRNA}$ is also known as :","fig":"","opt":["Soluble RNA","Catalytic RNA","Messenger RNA","Chitin"],"ans":0,"c":"NCERT Class XII (*Molecular Basis of Inheritance*, **tRNA – the Adapter Molecule**) ki exact line hai: Genetic code postulate hone se bahut pehle se Francis Crick ke adapter molecule **$\\mathrm{tRNA}$** ko **$\\mathrm{sRNA}$ (SOLUBLE RNA)** ke naam se jaana jaata tha (kyunki chhote size ~75–90 nt ke karan ye $1\\,\\mathrm{M}\\;\\ce{NaCl}$ solution me **soluble** rehta hai jabki bade $\\mathrm{rRNA/mRNA}$ precipitate ho jaate hain)!","m":"Direct NCERT fact: **$\\mathrm{tRNA} \\equiv \\text{Adapter RNA} \\equiv \\mathrm{sRNA}\\;(\\text{Soluble RNA})$**!","s":["$\\mathrm{tRNA}$ sabse chhota major cellular RNA ($\\sim 15\\%$ total RNA) hai jo $1\\,\\mathrm{M}$ salt me soluble rehta hai.","NCERT explicitly notes: *'$\\mathrm{tRNA}$ was known before the genetic code was postulated and was called **$\\mathrm{sRNA}$ (soluble RNA)**.'*","Sahi jawab: **Soluble RNA** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"$\\mathrm{tRNA}$ ko **Soluble RNA ($\\mathrm{sRNA}$)** (**Option A**) bhi kaha jaata hai.","w":["**Option B (Catalytic RNA):** Catalytic RNA (**ribozyme**) bacteria me **$23\\mathrm{S}\\;\\mathrm{rRNA}$** hota hai (peptide bond formation me!).","**Option C (Messenger RNA):** $\\mathrm{mRNA}$ genetic codon template provide karta hai, amino acid carry nahi karta.","**Option D (Chitin):** Chitin $N$-acetylglucosamine ($\\mathrm{NAG}$) ka structural homopolysaccharide hai, nucleic acid nahi!"],"t":"3 RNA Nicknames Ek Saath Ratt Lo:<br>• **$\\mathrm{mRNA}$** = Template RNA<br>• **$\\mathrm{tRNA}$** = Adapter RNA / **$\\mathrm{sRNA}$ (Soluble RNA)**<br>• **$23\\mathrm{S}\\;\\mathrm{rRNA}$** = Structural + **Catalytic RNA (Ribozyme)**!","sim":""},{"id":147,"q":"Who amongst the following scientists had **no** contribution in the development of the **double helix model** for the structure of DNA?","fig":"","opt":["Rosalind Franklin","Maurice Wilkins","Erwin Chargaff","Meselson and Stahl"],"ans":3,"c":"$1953$ me **James Watson aur Francis Crick** ne DNA ka double-helix model propose kiya tha, jo **DO mukhya scientist groups ke data** par tika tha:<br>1) **Maurice Wilkins & Rosalind Franklin:** X-ray diffraction data!<br>2) **Erwin Chargaff:** Purine/pyrimidine base-ratio rules ($\\mathrm{A/T = G/C = 1}$)!<br>Jabki **Matthew Meselson aur Franklin Stahl** ne **$1958$ me ($5$ saal baad!)** *E. coli* me $\\ce{^{15}NH4Cl / ^{14}NH4Cl}$ $\\ce{CsCl}$ density gradient experiment se **DNA का Semi-Conservative Replication** prove kiya tha!","m":"Timeline aur NCERT Exemplar exact question: $1953$ structure (*Wilkins, Franklin, Chargaff*) vs $1958$ replication (**Meselson & Stahl**)!","s":["**Rosalind Franklin & Maurice Wilkins:** X-ray crystallography image Photo $51$ di jisse helical pitch ($3.4\\,\\mathrm{nm}$) pata chali.","**Erwin Chargaff:** Base equivalence rule diya jisse complementary base pairing ($\\ce{A=T}, \\ce{G#C}$) samajh aayi.","**Meselson & Stahl ($1958$):** Inhone double helix **structure nahi**, balki **semi-conservative mode of DNA replication** siddh kiya tha $\\implies$ $\\color{#7ee2b8}{\\text{Option D}}$!"],"r":"DNA double helix structure ke vikas me **Meselson and Stahl** (**Option D**) ka koi yogdan nahi tha.","w":["**Option A (Rosalind Franklin):** Unki X-ray diffraction tasveeron par hi Watson–Crick model aadharit tha.","**Option B (Maurice Wilkins):** X-ray diffraction study ke liye Watson aur Crick ke saath $1962$ Nobel Prize share kiya.","**Option C (Erwin Chargaff):** Unke $\\mathrm{A=T, G=C}$ data se hi complementary base-pairing deduce hui thi."],"t":"NCERT Exemplar Classic: **Double Helix ($1953$) = Watson + Crick + Wilkins + Franklin + Chargaff** | **Semi-conservative Replication ($1958$) = Meselson + Stahl ($\\ce{^{15}N}$ heavy isotope, NOT radioactive!)**!","sim":""},{"id":148,"q":"Which of the following statements is **correct** about the role of regulatory proteins in transcription in prokaryotes?","fig":"","opt":["They only increase expression","They only decrease expression","They interact with RNA polymerase but do not affect the expression","They can act both as activators and as repressors"],"ans":3,"c":"Prokaryotes me transcription initiation site par RNA polymerase ki promoter recognition **accessory regulatory proteins** dwara control hoti hai! NCERT Class XII (*Regulation of Gene Expression*) ki exact line hai:<br>*'These **regulatory proteins can act both positively (activators) and negatively (repressors)**.'*!","m":"Direct NCERT Exemplar + textbook verbatim sentence apply karenge!","s":["Promoter ke paas specific operator sequences hoti hain jinse regulatory proteins bind karti hain.","**Activators** (e.g., CAP–cAMP in *lac* operon) transcription **badhate** hain (positive control), aur **Repressors** (e.g., *lac* repressor) RNA polymerase ko rok kar transcription **ghatate** hain (negative control).","Isliye **They can act both as activators and as repressors** ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"Prokaryotic transcription me regulatory proteins **can act both as activators and as repressors** (**Option D**).","w":["**Option A:** 'Only increase' galat hai — *lac* operon khud *repressor* protein ka sabse famous udaharan hai!","**Option B:** 'Only decrease' galat hai — positive regulation (*activators*) bhi barabar hota hai.","**Option C:** Regulatory proteins ka main kaam hi promoter accessibility badalkar gene expression regulate karna hai."],"t":"*Lac* operon me dono yaad rakho: *lac* predominantly **negatively regulated by Repressor** hai, **AND under control of positive regulation (CAP activator)** too!","sim":""},{"id":149,"q":"To initiate **translation**, the $\\mathrm{mRNA}$ first binds to :","fig":"","opt":["The smaller ribosomal sub-unit","The larger ribosomal sub-unit","The whole ribosome","No such specificity exists"],"ans":0,"c":"Inactive state me ribosome apne do subunits (**$30\\mathrm{S} + 50\\mathrm{S}$ in prokaryotes**, **$40\\mathrm{S} + 60\\mathrm{S}$ in eukaryotes**) me alag rehta hai! **Translation shuru (initiate) hone ki SABSE PEHLI GHATNA** hai:<br>*'When the **small subunit encounters an $\\mathrm{mRNA}$**, the process of translation of the $\\mathrm{mRNA}$ to protein begins.'* — Uske *baad* initiator $\\mathrm{tRNA}$ aur **larger subunit** aakar judte hain!","m":"NCERT Class XII (*Translation*) ki verbatim opening line lagayenge!","s":["Inactive phase me ribosome smaller aur larger subunits me dissociated rehta hai.","Step 1: **$\\mathrm{mRNA}$ sabse pehle SMALLER ribosomal subunit ($30\\mathrm{S}$ / $40\\mathrm{S}$) se bind karta hai!**","Step 2: Start codon $\\mathrm{AUG}$ par initiator $\\mathrm{tRNA}$ aane ke *baad* larger subunit judta hai $\\implies$ $\\color{#7ee2b8}{\\text{The smaller ribosomal sub-unit (Option A)}}$!"],"r":"Translation shuru karne ke liye $\\mathrm{mRNA}$ sabse pehle **The smaller ribosomal sub-unit** (**Option A**) se bind karta hai.","w":["**Option B (The larger ribosomal sub-unit):** Larger subunit ($50\\mathrm{S}/60\\mathrm{S}$) P aur A sites lekar *baad* me judta hai.","**Option C (The whole ribosome):** Translation se pehle dono subunits alag rehte hain; $\\ce{Mg^{2+}}$ aur $\\mathrm{mRNA}$ ke saath step-wise assemble hote hain.","**Option D:** Shine–Dalgarno ($16\\mathrm{S}\\;\\mathrm{rRNA}$ in small subunit) / $5'$-cap binding highly specific hoti hai!"],"t":"1-Second Translation Order: **Small subunit binds $\\mathrm{mRNA}$ FIRST $\\longrightarrow$ Initiator $\\mathrm{tRNA}$ at $\\mathrm{AUG}$ $\\longrightarrow$ Large subunit joins**!","sim":""},{"id":150,"q":"Which one of the following is **not** a nitrogen-fixing organism ?","fig":"","opt":["*Anabaena*","*Nostoc*","*Azotobacter*","*Pseudomonas*"],"ans":3,"c":"NCERT Class XI (*Mineral Nutrition* — Nitrogen Cycle) ka **#1 Denitrification Trap**:<br>• ***Anabaena* & *Nostoc*** $=$ Free-living / symbiotic **nitrogen-fixing cyanobacteria**!<br>• ***Azotobacter*** $=$ Free-living aerobic **nitrogen-fixing bacterium**!<br>• ***Pseudomonas* & *Thiobacillus*** $=$ **DENITRIFYING bacteria** — ye soil nitrates ($\\ce{NO3-}$) ko wapas atmospheric **$\\ce{N2}$ gas me reduce karke nitrogen-fixation ka ULTA kaam** karte hain!!","m":"**Nitrogen-fixing** vs **Denitrifying** (*Pseudomonas* & *Thiobacillus*) alag pehchante hi $2$ second me **Option D** lock!","s":["**Options A & B (*Anabaena*, *Nostoc*):** Heterocystous cyanobacteria jo atmospheric $\\ce{N2} \\to \\ce{NH3}$ fix karte hain.","**Option C (*Azotobacter*):** Free-living aerobic soil microbe jo $\\ce{N2}$ fix karta hai (*Beijerinckia* ke saath!).","**Option D (*Pseudomonas*):** Soil me nitrates ko tod kar wapas $\\ce{N2}$ gas udata hai (**Denitrification**), nitrogen fix **NAHI** karta $\\implies$ $\\color{#7ee2b8}{\\text{Option D}}$!"],"r":"***Pseudomonas*** (**Option D**) nitrogen-fixing jeev nahi hai (ye **denitrifying bacterium** hai!).","w":["**Option A (*Anabaena*):** Azolla aur Cycas coralloid roots me famous $\\ce{N2}$-fixer hai.","**Option B (*Nostoc*):** Classic heterocyst-bearing $\\ce{N2}$-fixing cyanobacterium hai.","**Option C (*Azotobacter*):** Biofertiliser ke roop me use hone wala free-living aerobic $\\ce{N2}$-fixer hai."],"t":"Ratt lo ye dono **Denitrifying Villains**: ***Pseudomonas* aur *Thiobacillus*** ($\\ce{NO3- \\longrightarrow N2 ^}$)!","sim":""},{"id":151,"q":"Which of the following is an **incorrect** statement?","fig":"","opt":["Microbodies are present both in plant and animal cells.","The perinuclear space forms a barrier between the materials present inside the nucleus and that of the cytoplasm.","Nuclear pores act as passages for proteins and RNA molecules in both directions between nucleus and cytoplasm.","Mature sieve tube elements possess a conspicuous nucleus and usual cytoplasmic organelles."],"ans":3,"c":"NEET 2021 ka iconic exact NCERT question! **Mature angiosperm Sieve Tube Element** me peripheral cytoplasm aur bada vacuole toh hota hai, **PAR NUCLEUS COMPLETELY ABSENT (LACKS A NUCLEUS)** hota hai!! Uske functions uski sagi sister cell **Companion Cell ka nucleus** control karta hai!","m":"NCERT *Cell: The Unit of Life* (Nucleus & Microbodies pages) + *Anatomy* ki exact lines se chaaron options check karenge!","s":["**Option A:** NCERT last line of *Cell* chapter: *'Many membrane bound minute vesicles called **microbodies** ... are present in **both plant and animal cells**.'* — **Sahi**!","**Option B & Option C:** Perinuclear space ($10\\text{–}50\\,\\mathrm{nm}$) barrier banata hai aur nuclear pores RNA + proteins ka **both-direction** passage hain — **Dono verbatim NCERT Sahi**!","**Option D:** Mature sieve tube elements (mammalian erythrocytes ki tarah!) **LACK A NUCLEUS** at maturity! *'Possess a conspicuous nucleus'* $100\\%$ **GALAT** hai $\\implies$ $\\color{#7ee2b8}{\\text{Option D}}$!"],"r":"Incorrect statement **Mature sieve tube elements possess a conspicuous nucleus and usual cytoplasmic organelles** (**Option D**) hai.","w":["**Option A:** Bahut bacche microbodies ko sirf plant/animal samajh lete hain — NCERT saaf likhta hai **BOTH plant & animal cells**!","**Option B:** Word-for-word NCERT *Nucleus* section ki line hai.","**Option C:** Proteins andar jaate hain aur RNA bahar aata hai — bidirectional movement bilkul sahi hai."],"t":"Living par **ENUCLEATED (No Nucleus at Maturity)** ki مشہور जोड़ी: **(1) Mammalian Erythrocytes (RBCs)** aur **(2) Mature Plant Sieve Tube Elements**!","sim":""},{"id":152,"q":"Given below are two statements :<br>**Statement I :** Mitochondria and chloroplasts are both double membrane bound organelles.<br>**Statement II :** Inner membrane of mitochondria is totally impermeable, as compared to chloroplast.<br>In the light of the above statements, choose the most appropriate answer from the options given below :","fig":"","opt":["Both statement I and statement II are incorrect","Statement I is correct but statement II is incorrect","Statement I is incorrect but statement II is correct","Both statement I and statement II are correct."],"ans":1,"c":"NCERT Class XI (*Cell: The Unit of Life*, **Plastids** section) ki gold-standard line padho:<br>*'Like mitochondria, the chloroplasts are also **double membrane bound**. Of the two, the **inner chloroplast membrane is relatively LESS permeable**.'*<br>Statement II me **'totally impermeable'** aur **ultaa comparison** dono galat kar diye gaye hain!","m":"Dono statements ko seedha NCERT text se milaenge!","s":["**Statement I:** Mitochondria, chloroplasts (aur nucleus) double-membrane-bound organelles hain $\\implies$ **Correct**!","**Statement II:** Inner mitochondrial membrane *selectively permeable* hoti hai (*totally impermeable* nahi!), aur outer ke mukable **inner chloroplast membrane** relatively less permeable hoti hai $\\implies$ **Statement II Incorrect**!","Sahi jawab: **Statement I is correct but statement II is incorrect** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"**Statement I is correct but statement II is incorrect** (**Option B**).","w":["**Option A:** Statement I $100\\%$ basic cell biology fact hai.","**Option C:** Status bilkul ulta diya gaya hai.","**Option D:** Agar inner mitochondrial membrane *totally impermeable* hoti toh pyruvate/ADP/ATP transport hi ruk jaata!"],"t":"Biological Membrane Golden Rule: Koi bhi living biomembrane **'totally impermeable' KABHI NAHI hoti** — hamesha **selectively permeable** hoti hai!","sim":""},{"id":153,"q":"Select the **incorrect** match :","fig":"","opt":["Phylloclade — *Euphorbia*","Phylloclade — *Opuntia*","Phyllode — Australian acacia","Staminode — Stem modified into Tendril"],"ans":3,"c":"Plant Morphology ke $4$ classic botanical terms:<br>• **Phylloclade (Photosynthetic Stem):** Arid plants jinme tana green, flattened (*Opuntia*) ya fleshy cylindrical (*Euphorbia*) hokar photosynthesis karta hai!<br>• **Phyllode (Photosynthetic Petiole):** **Australian *Acacia*** jisme leaflets jhad jaati hain aur **petiole** fail kar green पत्ती jaisa kaam karta hai!<br>• **Staminode:** Ek **STERILE STAMEN** (androecium modification), stem tendril bilkul NAHI!!","m":"Option D dekhte hi $1$ second me pakda jaata hai — **Staminode = Sterile Stamen**!","s":["**Options A & B (*Euphorbia*, *Opuntia*):** Dono arid plants me stem green hokar photosynthesis karta hai (**Phylloclade**) — **Sahi**.","**Option C (Australian *Acacia*):** Petiole expand hokar green aur photosynthetic ho jaata hai (**Phyllode**) — **Sahi**.","**Option D (Staminode):** **Staminode** ek **sterile stamen** hota hai (e.g., *Cassia, Salvia*), stem tendril (*gourds, grapevines*) nahi! $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Match (Option D)}}$!"],"r":"Incorrect match **Staminode — Stem modified into Tendril** (**Option D**) hai.","w":["**Option A:** Fleshy cylindrical green stem of *Euphorbia* photosynthetic phylloclade ka classic example hai.","**Option B:** Flattened green stem of *Opuntia* (cactus) textbook phylloclade example hai.","**Option C:** Australian *Acacia* ka expanded green petiole classic **phyllode** hai."],"t":"3 Confusion-Busters Ek Saath:<br>• **Phylloclade** = Green Stem (*Opuntia, Euphorbia*)<br>• **Phyllode** = Green Petiole (*Australian Acacia*)<br>• **Staminode** = Sterile Stamen!","sim":""},{"id":154,"q":"Select the **correct** statements for **Chordata** :","fig":"","opt":["All members are Aquatic","All members are Terrestrial","Their members are freshwater, marine and Terrestrial","In all members development are direct type"],"ans":2,"c":"**Phylum Chordata** ke sadasya prithvi ke har mukhya habitat me milte hain:<br>• **Exclusively Marine:** Urochordata (*Ascidia*), Cephalochordata (*Branchiostoma*), Chondrichthyes<br>• **Freshwater & Marine:** Osteichthyes (*Rohu, Catla, Hippocampus*)<br>• ** Terrestrial / Dual:** Amphibia, Reptilia, Aves, Mammalia!<br>Aur kuch chordates me **indirect larval development** (*Ascidia* tadpole, Frog tadpole, *Petromyzon* ammocoete larva) hota hai!","m":"Extreme word **'All'** wale teeno galat statements (`A, B, D`) turant out!","s":["**Options A & B:** Chordates me machhliyan (aquatic) BHI hain aur birds/mammals/reptiles (terrestrial) BHI — isliye 'All aquatic' aur 'All terrestrial' dono galat hain!","**Option D:** Urochordates (*Ascidia*), cyclostomes (*Petromyzon*), aur amphibians (*Rana*) me **larval (indirect) development** hota hai — 'all direct' galat hai!","**Option C:** Chordata ke sadasya **freshwater, marine aur terrestrial** teeno aawason me paaye jaate hain $\\implies$ $\\color{#7ee2b8}{\\text{Option C Sahi}}$!"],"r":"Chordata ke liye sahi kathan **Their members are freshwater, marine and Terrestrial** (**Option C**) hai.","w":["**Option A:** Reptiles, birds, aur mammals mukhya roop se terrestrial chordates hain.","**Option B:** Protochordates aur fishes poori tarah aquatic chordates hain.","**Option D:** Frog (tadpole larva) aur *Ascidia* me **indirect development** hota hai!"],"t":"Exclusive Marine vs All Habitats: **Urochordata, Cephalochordata, Echinodermata, Ctenophora, Hemichordata = EXCLUSIVELY MARINE**, jabki **Chordata overall = Marine + Freshwater + Terrestrial**!","sim":""},{"id":155,"q":"Select the **incorrect** statement :","fig":"","opt":["Members of class Mammalia are exclusively viviparous","Members of class Aves are Homoiothermous","The number of ventricles in heart are same in Pigeon and Crocodile","The number of Auricle in heart are same in Frog and Parrot"],"ans":0,"c":"**SUPERB VERTEBRATE COMPARISON QUESTION!** Har statement dekho:<br>1) **Mammals EXCLUSIVELY viviparous NAHI hote** — prototherian **Platypus (*Ornithorhynchus*)** aur Echidna (*Tachyglossus*) **OVIPAROUS (egg-laying mammals)** hain!!<br>2) **Aves** warm-blooded (**homoiothermous**) hote hain!<br>3) **Pigeon (bird: $4$-chambered = $2\\text{A} + \\mathbf{2\\text{V}}$)** aur **Crocodile (exception reptile: $4$-chambered = $2\\text{A} + \\mathbf{2\\text{V}}$)** — dono me **$2$ ventricles**!<br>4) **Frog ($3$-chambered = $\\mathbf{2\\text{A}} + 1\\text{V}$)** aur **Parrot ($4$-chambered = $\\mathbf{2\\text{A}} + 2\\text{V}$)** — dono me **$2$ auricles (atria)**!!","m":"Chaaron statements me heart chambers aur *Ornithorhynchus* exception verify karenge — har line ek chhota jewel hai!","s":["**Option A:** *'Exclusively viviparous'* **GALAT** hai! NCERT Class Mammalia: *'They are viviparous **with few exceptions** — Oviparous: **Ornithorhynchus (Platypus)**!'* $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Statement (Option A)}}$!","**Option B:** Aves (aur Mammalia) constant body temperature maintain karte hain (**Homoiothermous**) — **Sahi**.","**Option C:** Pigeon ($4$-chambered) me **$2$ ventricles** aur Crocodile ($4$-chambered reptile exception!) me bhi **$2$ ventricles** — **Sahi**!","**Option D:** Frog ($3$-chambered $= 2$ auricles $+ 1$ ventricle) me **$2$ auricles** aur Parrot ($4$-chambered $= 2$ auricles $+ 2$ ventricles) me bhi **$2$ auricles** — **Sahi**!"],"r":"Incorrect statement **Members of class Mammalia are exclusively viviparous** (**Option A**) hai (*Platypus* oviparous hai!).","w":["**Option B:** Birds homoiothermous (warm-blooded) hoti hain — ye kathan $100\\%$ sahi hai.","**Option C:** Crocodile ($4$-chambered reptile) aur Pigeon ($4$-chambered bird) dono ke heart me **$2$ ventricles** hote hain!","**Option D:** **GENIUS DISTRACTOR!** Frog ($3$-chambered) me $1$ ventricle hota hai par **auricles $2$ hi hote hain** — bilkul Parrot ($2$ auricles) ke barabar!!"],"t":"**Option D** kitna lajawab tha dekha?! Amphibian, Reptile, Bird, Mammal **CHAARON ke heart me AURICLES hamesha $2$ hi hote hain** (fark sirf *ventricles* $1$ vs $2$ ka hota hai)! Aur **Platypus = Oviparous mammal**!","sim":""},{"id":156,"q":"Select the **Incorrect** match :","fig":"","opt":["*Panthera* — Taxa","Chordata — Taxa","Reproduction — Characteristic of mountain and Rock","Group of cells — Characteristics of growing plants"],"ans":2,"c":"Old NCERT Class XI Chapter 1 (*The Living World*) ke anusaar:<br>• Mountains, boulders, aur sand mounds **NON-LIVING objects** hain: inme bahar se material jama hone (*accretion*) se **growth** toh dikh sakti hai, **PAR NON-LIVING OBJECTS KABHI REPRODUCTION NAHI KARTE**!<br>• Aur *'Taxa'* shabd kisi bhi taxonomic rank (genus *Panthera*, phylum Chordata, kingdom Plantae, species *tigris*) ke liye istemal hota hai!","m":"Mountains aur Rocks non-living hain — unme **reproduction kabhi nahi hota** (`Option C`)!","s":["**Options A & B (*Panthera*, Chordata):** Alag-alag levels par har taxonomic category ek **taxon (plural: taxa)** kehlati hai — **Dono Sahi**.","**Option C (Reproduction — Mountain & Rock):** Mountains aur chattanein *non-living* hain — **no non-living object is capable of reproducing or replicating by itself**! $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Match (Option C)}}$!","**Option D:** Growing plants multicellular tissues (group of dividing/growing cells) dikhate hain — **Sahi**."],"r":"Incorrect match **Reproduction — Characteristic of mountain and Rock** (**Option C**) hai.","w":["**Option A:** Genus *Panthera* ek valid taxon hai.","**Option B:** Phylum Chordata bhi higher level par ek valid taxon hai (NCERT: *'Dogs, Cats, Mammals, Wheat, Rice, Plants, Animals... are all convenient taxa'*!).","**Option D:** Growing plants cell division dwara cells ki sankhya badhate rehte hain."],"t":"Living World Contrast: **Mountains/Rocks show extrinsic GROWTH (by surface accumulation)**, par **REPRODUCTION किसी भी non-living object me ZERO hota hai**!","sim":""},{"id":157,"q":"For **complete oxidation of glucose** to $\\ce{CO2}$ and $\\ce{H2O}$, select the correct option:<br>(a) $2\\,\\ce{FADH2}$ &nbsp;&nbsp; (b) $10\\,\\ce{NADH2}$ &nbsp;&nbsp; (c) $2\\,\\mathrm{GTP}$ &nbsp;&nbsp; (d) Net gain of $38\\,\\mathrm{ATP}$","fig":"","opt":["b, c, d only","b, d only","a, b, d only","All"],"ans":3,"c":"$1$ molecule **Glucose ($\\ce{C6H12O6}$)** ke **complete aerobic oxidation** (Glycolysis $+$ Link Reaction $+$ $2$ turns of Krebs Cycle $+$ ETS) ka exact NCERT balance-sheet:<br>• **Glycolysis:** $2\\,\\mathrm{ATP}$ (net) $+ \\mathbf{2\\,\\ce{NADH}}$<br>• **Oxidative Decarboxylation ($2$ Pyruvate $\\to 2$ Acetyl-CoA):** $\\mathbf{2\\,\\ce{NADH}}$<br>• **Krebs Cycle ($2$ turns):** $\\mathbf{6\\,\\ce{NADH}} + \\mathbf{2\\,\\ce{FADH2}} + \\mathbf{2\\,\\mathrm{GTP}}$!","m":"Chaaron totals add karke check karenge — ek-ek number 100% exact hai!","s":["**Total $\\ce{NADH} + \\ce{H+}$:** $2\\text{ (Glycolysis)} + 2\\text{ (Link reaction)} + 6\\text{ (Krebs cycle, }3 \\times 2\\text{)} = \\mathbf{10\\,\\ce{NADH2}}$ (`b` **Correct**).","**Total $\\ce{FADH2}$ & $\\mathrm{GTP}$:** Krebs cycle ke $2$ chakron se $\\mathbf{2\\,\\ce{FADH2}}$ (`a` **Correct**) aur $\\mathbf{2\\,\\mathrm{GTP}}$ (`c` **Correct**).","**Total Net $\\mathrm{ATP}$ (NCERT Respiratory Balance Sheet):** $2\\,\\mathrm{ATP}\\text{ (glycolysis)} + 2\\,\\mathrm{GTP} + (10 \\times 3 = 30\\,\\mathrm{ATP}\\text{ from }\\ce{NADH}) + (2 \\times 2 = 4\\,\\mathrm{ATP}\\text{ from }\\ce{FADH2}) = \\mathbf{38\\,\\mathrm{ATP}}$ (`d` **Correct**) $\\implies$ $\\color{#7ee2b8}{\\text{All (Option D)}}$!"],"r":"Complete aerobic oxidation of $1$ glucose molecule ke liye **All (`a, b, c, d`)** (**Option D**) sahi hain.","w":["**Option A (b, c, d only):** Succinate dehydrogenase step me $2\\,\\ce{FADH2}$ (`a`) bhi bante hain!","**Option B (b, d only):** $2\\,\\ce{FADH2}$ (`a`) aur $2\\,\\mathrm{GTP}$ (`c`) dono chhod diye gaye hain.","**Option C (a, b, d only):** Succinyl-CoA $\\to$ Succinic acid substrate-level phosphorylation se $2\\,\\mathrm{GTP}$ (`c`) bhi bante hain!"],"t":"Complete $1$-Glucose Balance Sheet Ratt Lo: **$10\\,\\ce{NADH}\\;(30) + 2\\,\\ce{FADH2}\\;(4) + 2\\,\\mathrm{GTP}\\;(2) + 2\\,\\mathrm{ATP}_{\\text{glycolysis}}\\;(2) = \\mathbf{38\\,\\mathrm{ATP}}$**!","sim":""},{"id":158,"q":"Select the **incorrect** match:<table class=\"q-table\"><tr><th><\/th><th>List I<\/th><th>List II<\/th><\/tr><tr><td>(1)<\/td><td>*Ulothrix*<\/td><td>Dominant stage is gametophytes<\/td><\/tr><tr><td>(2)<\/td><td>*Polytrichum*<\/td><td>Dominant stage is gametophytes<\/td><\/tr><tr><td>(3)<\/td><td>*Sargassum*<\/td><td>Dominant stage is sporophytes<\/td><\/tr><tr><td>(4)<\/td><td>*Ginkgo*<\/td><td>Dominant stage is sporophytes<\/td><\/tr><\/table>","fig":"","opt":["(1)","(2)","(3)","(4)"],"ans":2,"c":"NCERT Class XI (*Plant Kingdom*) ke general division trends:<br>• **Algae (*Ulothrix, Spirogyra, Volvox, Chlamydomonas*):** Aam taur par main plant body **haploid gametophyte** hoti hai (NCERT me diplontic alga ka explicit naam **keval *Fucus*** diya gaya hai!).<br>• **Bryophytes (*Polytrichum, Funaria, Marchantia*):** Main dominant photosynthetic independent body **gametophyte**!<br>• **Pteridophytes, Gymnosperms (*Ginkgo*), Angiosperms:** Main dominant stage **diploid sporophyte**!","m":"Elimination se `(1)`, `(2)`, aur `(4)` $100\\%$ textbook true hain, isliye `(3)` hi intended incorrect match hai!","s":["**(1) *Ulothrix* (Green Alga):** Haplontic life cycle $\\implies$ dominant stage **gametophyte** — **100% True**.","**(2) *Polytrichum* (Moss — Bryophyte):** Haplo-diplontic with dominant, independent, leafy **gametophyte** — **100% True**.","**(4) *Ginkgo* (Gymnosperm):** Diplontic life cycle $\\implies$ dominant vascular tree **sporophyte** — **100% True**.","**(3) *Sargassum*:** Elimination aur paper key ke anusaar **Option C `(3)`** hi intended answer hai ($\\color{#7ee2b8}{\\text{Option C}}$)! *(Botanical Note: Higher botany me *Sargassum* bhi *Fucus* ke Fucales order me aata hai jiska thallus diploid $2n$ hota hai, par NCERT school level par sirf *Fucus* ko diplontic exception gina jaata hai — isliye Options 1, 2, 4 pakke hone se `(3)` tick karein!)*"],"r":"Paper key aur elimination ke aadhar par **(3) *Sargassum*** (**Option C**) select kiya gaya hai.","w":["**Option A (1):** *Ulothrix* haplontic green alga hai jiska main filament haploid gametophyte hi hota hai.","**Option B (2):** Sabhi bryophytes (*Polytrichum*) me dominant phase hamesha haploid gametophyte hota hai.","**Option D (4):** Sabhi gymnosperms (*Ginkgo*) me dominant phase hamesha diploid sporophyte hota hai."],"t":"Smart NEET Examsmanship: Jab $4$ me se $3$ options (*Ulothrix* = gametophyte, *Polytrichum* = gametophyte, *Ginkgo* = sporophyte) $1000\\%$ stone-carved true hon, toh overthink kiye bina chautha option (`3`) tick karo!","sim":""},{"id":159,"q":"Which is related with **Broadly utilitarian** biodiversity conservation :","fig":"","opt":["Plants produce huge amount of $\\ce{O2}$","Ecosystem provide variety of pollinator","Watching spring flowers in full bloom","All"],"ans":3,"c":"NCERT Class XII (*Biodiversity and Conservation*, **Why Should We Conserve Biodiversity?**) me $3$ arguments diye gaye hain:<br>1) **Narrowly utilitarian:** Direct economic products — food, firewood, fibre, resins, medicines ($>25\\%$ drugs)!<br>2) **BROADLY UTILITARIAN:** Ecosystem services jinka price tag lagana namumkin hai — **Amazon forest producing $20\\%$ of total $\\ce{O2}$ (`1`)**, **pollination by bees, bumblebees, birds & bats (`2`)**, aur **intangible aesthetic pleasures like walking through thick woods, waking up to bulbul's song, or watching spring flowers in full bloom (`3`)**!<br>3) **Ethical argument:** Moral duty towards millions of species!","m":"**TRAP ALERT!** Bahut bacche Option C (*'watching spring flowers in full bloom'*) ko galti se *Ethical* samajh lete hain — jabki NCERT me ye line **EXACTLY BROADLY UTILITARIAN paragraph** me likhi hui hai!!","s":["**Option A:** Amazon rainforest earth ke atmosphere ka $20\\%$ $\\ce{O2}$ deta hai — **Broadly utilitarian**.","**Option B:** Bees, bumblebees, birds aur bats dwara **pollination** — **Broadly utilitarian**.","**Option C:** Exact NCERT sentence inside **Broadly utilitarian**: *'...aesthetic pleasures of walking through thick woods, **watching spring flowers in full bloom** or waking up to a bulbul's song in the morning'* — **Broadly utilitarian**! $\\implies$ $\\color{#7ee2b8}{\\text{All (Option D)}}$!"],"r":"Teeno hi examples (**All** — **Option D**) **Broadly utilitarian** biodiversity conservation se sambandhit hain!","w":["**Option A:** Sahi hai par Options B aur C bhi NCERT ke *Broadly utilitarian* paragraph ki hi lines hain!","**Option B:** Sahi hai par A aur C chhodne se adhura hai.","**Option C:** Ye bhi *Ethical* nahi balki NCERT me **Broadly utilitarian** (aesthetic ecosystem service) ke andar hi diya gaya hai!"],"t":"**MILLION-DOLLAR NCERT LINE TRAP:**<br>• **Broadly Utilitarian:** Amazon $20\\%\\;\\ce{O2}$ + Pollination + **Aesthetic pleasure (spring flowers, bulbul's song)**!<br>• **Ethical Argument:** Intrinsic value of every species + moral duty to pass biological legacy to future generations!","sim":""},{"id":160,"q":"Which of the following represent **Sister-chromatids** in the given figure :","fig":"q160","opt":["A","B","C","D"],"ans":1,"c":"Meiotic Prophase-I (Pachytene tetrad / bivalent) me do homologous chromosomes paas-paas pair hote hain:<br>• **EK HI CHROMOSOME** ke ek hi centromere se jude dono identical arms/chromatids ko **SISTER CHROMATIDS (`B`)** kehte hain!<br>• **ALAG-ALAG homologous chromosomes** ke chromatids ko **NON-SISTER CHROMATIDS (`D`)** kehte hain (jinme crossing over hota hai)!","m":"Figure ke chaaron pointers `A, B, C, D` ko dhyan se trace karenge!","s":["**Pointer A:** Dono homologous chromosomes ke **centromeres** ki taraf ishara kar raha hai.","**Pointer B:** Upar wale **EK HI chromosome ke dono chromatids** ko jod raha hai $\\implies$ **SISTER CHROMATIDS** ($\\color{#7ee2b8}{\\text{Option B}}$)!","**Pointer C:** Ek hi chromatid ke dono telomeric arms dikha raha hai; aur **Pointer D:** upar wale aur neeche wale homologous chromosomes ke chromatids (**Non-sister chromatids of homologous pair**) dikha raha hai!"],"r":"Diye gaye chitra me **B** (**Option B**) **Sister-chromatids** ko darshata hai.","w":["**Option A:** `A` dono chromosomes ke primary constrictions (**centromeres**) ko mark karta hai.","**Option C:** `C` ek hi chromatid ki left aur right telomeric arms ko mark karta hai.","**Option D:** **BIG TRAP!** `D` do alag homologous chromosomes ke chromatids (**Non-sister chromatids** — crossing-over partners!) ko mark karta hai!"],"t":"1-Second Rule: **Same Centromere = SISTER Chromatids (`B`)** | **Different Homologous Centromeres = NON-SISTER Chromatids (`D`, Crossing Over!)**!","sim":""},{"id":161,"q":"**Meiosis** results in diploid organisms :","fig":"","opt":["Production of gametes","Reduction in the number of chromosomes","Introduction of variation","All of the above"],"ans":3,"c":"**Significance of Meiosis** (NCERT Class XI *Cell Cycle and Cell Division*, concluding paragraph) ke teeno स्तंभ:<br>1) Sexual reproduction karne wale diploid jeev-jantuon me **haploid gametes ka nirmaan (`1`)**<br>2) Chromosome sankhya ko **aadha ($2n \\to n$) reduce karna (`2`)** taaki fertilisation par species ka specific chromosome count generation-after-generation conserve rahe<br>3) Pachytene crossing-over + Metaphase-I independent assortment se **genetic variations badhana (`3`)** jo evolution ke liye raw material hain!","m":"Teeno exact points NCERT ke *Significance of Meiosis* section se seedhe aaye hain!","s":["**Option A:** Diploid animals aur sporophytes me meiosis se haploid gametes/spores bante hain — **Sahi**.","**Option B:** Meiosis-I reductional division hokar chromosome sankhya aadhi ($2n \\to n$) kar deta hai — **Sahi**.","**Option C:** Non-sister chromatid recombination se naye genetic variations aate hain — **Sahi** $\\implies$ $\\color{#7ee2b8}{\\text{All of the above (Option D)}}$!"],"r":"Diploid organisms me meiosis **All of the above** (**Option D**) parinaam deta hai.","w":["**Option A:** Sahi hai par Options B aur C bhi meiosis ke anivarya parinaam hain.","**Option B:** Sahi hai par A aur C chhodne se adhura hai.","**Option C:** Sahi hai par A aur B chhodne se adhura hai."],"t":"3 Pillars of Meiosis: **Gamete formation + Halving $2n \\to n$ (species ploidy conservation) + Genetic variation (evolution)**!","sim":""},{"id":162,"q":"**Assertion (A) :** In frog the alimentary canal is very long and hence the length of intestine is increased.<br>**Reason (R) :** In carnivores animal the alimentary canal is short.","fig":"","opt":["$\\mathrm{A}$ is true but $\\mathrm{R}$ is false","$\\mathrm{A}$ is false but $\\mathrm{R}$ is true","Both $\\mathrm{A}$ and $\\mathrm{R}$ are true and $\\mathrm{R}$ is the correct explanation of $\\mathrm{A}$","Both $\\mathrm{A}$ and $\\mathrm{R}$ are true but $\\mathrm{R}$ is not the correct explanation of $\\mathrm{A}$"],"ans":1,"c":"NCERT Class XI (*Structural Organisation in Animals*, **Frog** anatomy) ki प्रसिद्ध पहली पंक्ति:<br>*'The **alimentary canal is SHORT** because **frogs are CARNIVORES** and hence the **length of intestine is REDUCED**.'*!","m":"Adult frog **carnivore** hota hai (cellulose digest nahi karna padta!), isliye uski intestine **SHORT (reduced)** hoti hai — *very long* bilkul ULTA likha hai!","s":["**Assertion (A):** Frog carnivore hone se uski alimentary canal **SHORT** aur intestine **reduced** hoti hai — *'very long / increased'* $100\\%$ **FALSE** hai!","**Reason (R):** Carnivores me meat pachaana aasan hone se alimentary canal **short** hoti hai (jabki herbivores me cellulose pachane ke liye lambi hoti hai!) — **TRUE** hai!","Sahi jawab: **$\\mathrm{A}$ is false but $\\mathrm{R}$ is true** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"**$\\mathrm{A}$ is false but $\\mathrm{R}$ is true** (**Option B**).","w":["**Option A:** Status bilkul ulta likha hai — frog ki intestine chhoti hoti hai, lambi nahi!","**Option C:** Assertion $\\mathrm{A}$ false hai.","**Option D:** Assertion $\\mathrm{A}$ false hai (*tadpole* herbivore hone se coiled lambi aat rakhta hai, adult frog nahi!)."],"t":"Super Contrast: **Herbivore Tadpole = Long coiled intestine** $\\xrightarrow{\\text{Metamorphosis}}$ **Carnivore Adult Frog = SHORT alimentary canal & reduced intestine**!","sim":""},{"id":163,"q":"The term **synergistic** of hormones refers to :","fig":"","opt":["When two hormones act together but bring about opposite effects.","When two hormones act together and contribute to the same function","When one hormone affects more than one function","When many hormones bring about any one function."],"ans":1,"c":"NCERT Class XI (*Plant Growth and Development*, **Plant Growth Regulators**) me hormone interactions ke $2$ exact terms:<br>• **Synergistic effect (सहयोगी प्रभाव):** Jab do ya zyada hormones **milkar ek hi function ko badhawa dete hain** (e.g., cell division, abscission, dormancy)!<br>• **Antagonistic effect (विरोधी प्रभाव):** Jab do hormones **opposite effects** dikhate hain (e.g., **ABA vs Gibberellins** in seed dormancy; **Insulin vs Glucagon** in blood sugar)!","m":"**Synergy** = *working together for the SAME function* (`Option B`) vs **Antagonism** = *opposite effects* (`Option A`)!","s":["Option A (*opposite effects*) **antagonistic action** ki paribhasha hai.","Option B (*two hormones acting together and contributing to the same function*) exact **synergistic action** ki paribhasha hai!","Sahi jawab: **When two hormones act together and contribute to the same function** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Synergistic action ka arth **When two hormones act together and contribute to the same function** (**Option B**) hai.","w":["**Option A:** Opposite effects ko **antagonistic** kehte hain (jaise ABA seed dormancy laata hai aur $\\mathrm{GA}$ todta hai).","**Option C:** Ek hormone ke kai functions hone ko *pleiotropic-like / multifunctional effect* kehte hain.","**Option D:** 'Together in complementarity' clear kiye bina ye definition adhuri hai."],"t":"1-Second Pair: **Synergistic = Together for SAME goal** (e.g., Auxin + Cytokinin in cell division; FSH + Testosterone in spermatogenesis) | **Antagonistic = OPPOSITE goals** (ABA vs $\\mathrm{GA}$; PTH vs TCT)!","sim":""},{"id":164,"q":"Given below are two statements: one is labelled as Assertion (A) and the other is labelled as Reason (R).<br>**Assertion (A) :** A single base mutation in a gene may not always result in loss of function.<br>**Reason (R) :** Due to degeneracy of codons, mutations at third base of codon usually does not result into any change in phenotype. This is called silent mutation.<br>In the light of the above statements, choose the most appropriate answer from the options given below:","fig":"","opt":["Both (A) and (R) are correct and (R) is the correct explanation of (A)","Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct"],"ans":0,"c":"**Degeneracy of Genetic Code & Wobble Hypothesis:** $61$ sense codons keval $20$ amino acids code karte hain! Zyaadatar degenerate codons pehle $2$ bases me same hote hain aur **sirf $3\\text{rd}$ ('wobble') base** par alag hote hain (e.g., $\\mathrm{CUU, CUC, CUA, CUG}$ **CHAARON Leucine** hi banate hain!). Isliye $3\\text{rd}$ base me point substitution hone par **amino acid sequence BILKUL NAHI BADALTA (**Silent Mutation**)** — aur protein function poori tarah normal rehta hai!","m":"Assertion aur Reason ke beech **'BECAUSE'** lagakar padhein — Reason $100\\%$ explain karta hai ki single base mutation hamesha function loss kyun nahi karata!","s":["**Assertion (A):** Single base point substitution hamesha functional loss nahi karata — **Correct**.","**Reason (R):** Genetic code degenerate hone se codon ke $3\\text{rd}$ base par mutation aksar **same amino acid** code karta hai (**silent mutation**), jisse phenotype unchanged rehta hai — **Correct**!","Reason seedhe aur exact karan batata hai ki Assertion kyun sach hai $\\implies$ $\\color{#7ee2b8}{\\text{Option A}}$!"],"r":"**Both (A) and (R) are correct and (R) is the correct explanation of (A)** (**Option A**).","w":["**Option B:** Silent mutation due to codon degeneracy hi woh main molecular mechanism hai jisse single-base substitution function loss nahi karata!","**Option C:** Reason (R) NCERT Exemplar ka $100\\%$ sahi molecular genetics statement hai.","**Option D:** Assertion (A) poori tarah sahi hai."],"t":"$3$ Point Substitution Types Ratt Lo:<br>• **Silent:** $\\mathrm{CUU \\to CUC}$ (**Same amino acid**, no effect — *degeneracy*!)<br>• **Missense:** $\\mathrm{GAG \\to GUG}$ ($\\mathrm{Glu \\to Val}$, *Sickle-cell anaemia*)<br>• **Nonsense:** $\\mathrm{UAC \\to UAA}$ (**Stop codon**, truncated protein)!","sim":""},{"id":165,"q":"Given below are two statements : one is labelled as Assertion (A) and the other is labelled as Reason (R).<br>**Assertion (A) :** A low level of expression of *lac* operon occurs at all the time.<br>**Reason (R) :** In the complete absence of expression of *lac* operon, permease will not be synthesised which is essential for transport of lactose from the medium into the cells. And if lactose cannot be transported into the cell, then it cannot act as an inducer. Hence, it cannot relieve the *lac* operon from its repressed state. Therefore, a low level of expression of the *lac* operon occurs constantly to maintain a baseline level of permease production, ensuring that lactose can be transported into the cell when available.<br>In the light of the above statements, choose the most appropriate answer from the options given below:","fig":"","opt":["Both (A) and (R) are correct and (R) is the correct explanation of (A)","Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct"],"ans":0,"c":"NCERT Class XII (*The Lac Operon*, classic italicised 'Remember' box!) ka **sabse brilliant conceptual gem**:<br>Lactose ko cell ke andar laane ke liye ***lac y* gene product — Permease** chahiye! Agar cell me *lac* operon **$100.0\\%$ zero** band hota, toh cell me ek bhi permease molecule nahi hota $\\implies$ bahar se lactose kabhi cell ke andar ghus hi nahi paata $\\implies$ *lac* operon **zindagi me kabhi ON (induced) ho hi nahi paata**!! Isiliye **har samay *lac* operon ka ek bahut low constitutive expression chalta rehta hai**!!","m":"Wait — keep exact verbatim Option `(2)` from PDF (`Both (A) and (R) are correct but (R) is not the correct explanation of (A)`) AND select **Option A**!","s":["**Assertion (A):** Exact NCERT bold note: *'Remember, a very **low level of expression of lac operon has to be present in the cell all the time**, otherwise lactose cannot enter the cells.'* $\\implies$ **Correct**!","**Reason (R):** Bina basal expression ke **$\\beta$-galactoside permease (*lac y*)** nahi banega, jisse lactose cell me enter hokar **inducer** ka kaam nahi kar payega — **Correct**!","Reason (R) Assertion (A) ka $100\\%$ सटीक कारण hai $\\implies$ $\\color{#7ee2b8}{\\text{Option A}}$!"],"r":"**Both (A) and (R) are correct and (R) is the correct explanation of (A)** (**Option A**).","w":["**Option B:** Reason seedhe batata hai ki basal expression kyun anivarya hai (permease transport ke liye!).","**Option C:** Reason word-for-word NCERT *Lac Operon* box ka logic hai.","**Option D:** Assertion $100\\%$ true hai."],"t":"3 Structural Genes of *lac* Operon (**Z–Y–A**):<br>• ***lac z*** $\\to$ $\\beta$-Galactosidase (splits lactose $\\to$ glucose + galactose)<br>• ***lac y*** $\\to$ **Permease** (lets lactose enter cell — needs basal expression!)<br>• ***lac a*** $\\to$ Transacetylase!","sim":""},{"id":166,"q":"A bisexual chasmogamous flower can evolve following strategies to prevent self-pollination. A mechanism in which **pollen release and stigma receptivity are not synchronised**. This mechanism is :","fig":"","opt":["Herkogamy","Dichogamy","Autogamy","Self-sterility"],"ans":1,"c":"**Outbreeding Devices** (NCERT Class XII *Sexual Reproduction in Flowering Plants*) ke $4$ classic mechanisms aur unke botanical terms:<br>1) **Dichogamy (Temporal non-synchronisation):** Pollen release aur stigma receptivity **ek samay par na hona** (*Protandry*: pollen pehle; *Protogyny*: stigma pehle)!<br>2) **Herkogamy (Spatial barrier):** Anther aur stigma **alag-alag positions** par hona!<br>3) **Self-incompatibility / Self-sterility:** Genetic mechanism jo self-pollen germination/pollen-tube growth rok de!<br>4) **Dicliny (Unisexuality):** Unisexual flowers banana!","m":"*'Pollen release and stigma receptivity are **not synchronised**'* $=$ time difference $=$ **Dichogamy (`Option B`)**!","s":["Sawal ki definition padhein: bisexual flower me pollen release hone se pehle stigma receptive ho (*protogyny*) ya stigma receptive hone se bahut pehle pollen jhad jaye (*protandry*).","Is **temporal non-synchronisation** device ko botany me **Dichogamy** kehte hain!","Sahi jawab: **Dichogamy** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Pollen release aur stigma receptivity synchronised na hone ki outbreeding yukti ko **Dichogamy** (**Option B**) kehte hain.","w":["**Option A (Herkogamy):** Herkogamy me anther aur stigma ke beech **physical/spatial distance** hota hai, timing difference nahi!","**Option C (Autogamy):** Autogamy toh khud **self-pollination** hi hai (jise rokने के लिए ये devices बनी हैं!).","**Option D (Self-sterility / Self-incompatibility):** Ye *genetic* biochemical mechanism hai jo stigma par same plant pollen ki growth block karta hai."],"t":"**Herkogamy vs Dichogamy** kabhi confuse mat hona:<br>• **Di-cho-gamy** = **2 DIFFERENT TIMES** (Protandry / Protogyny — non-synchronised!)<br>• **Herko-gamy** (*herkos* = fence/barrier) = **DIFFERENT POSITIONS / PHYSICAL BARRIER**!","sim":""},{"id":167,"q":"**Statement-I :** Contraction of diaphragm increases volume of thoracic chamber in **antero-posterior axis**.<br>**Statement-II :** An increase in pulmonary volume decreases the intrapulmonary pressure to less than atmospheric pressure.<br>Choose the correct option:","fig":"","opt":["Both statements are correct","Both statements are incorrect","Statement-I is correct and statement-II is incorrect","Statement-I is incorrect and statement-II is correct"],"ans":0,"c":"**Mechanism of Breathing — Inspiration** (NCERT Class XI *Breathing and Exchange of Gases*) ke **DO EXACT AXES** jo har saal NEET me aate hain:<br>1) **Diaphragm contraction** $\\implies$ increases thoracic volume in the **ANTERO-POSTERIOR axis**!<br>2) **External intercostal muscles contraction** (ribs & sternum lifted up) $\\implies$ increases thoracic volume in the **DORSO-VENTRAL axis**!<br>Thoracic volume $\\uparrow \\implies$ Pulmonary volume $\\uparrow \\implies$ Boyle's Law ($P \\propto 1/V$) se **intrapulmonary pressure atmospheric pressure se kam (negative)** ho jaata hai aur hawa andar kheench aati hai!","m":"Axis pair (**Diaphragm = Antero-posterior**) + Boyle's Law pressure drop dono check karenge!","s":["**Statement-I:** Diaphragm contract hokar dome-shape se flat hota hai, jisse thoracic chamber ka volume **antero-posterior axis** me badhta hai — **100% Verbatim NCERT True**!","**Statement-II:** Pulmonary volume badhne se **intrapulmonary pressure atmospheric pressure se kam** ho jaata hai ($-1\\text{ to }-3\\,\\mathrm{mmHg}$ negative pressure), jisse air lungs me aati hai — **100% Verbatim NCERT True**!","Dono statements bilkul sahi hain $\\implies$ **Both statements are correct** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"**Both statements are correct** (**Option A**).","w":["**Option B:** Dono statements word-for-word NCERT *Mechanism of Breathing* se liye gaye sahi statements hain.","**Option C:** Statement-II Boyle's law ($PV = \\text{constant}$) ka seedha parinaam hai — bilkul sahi hai.","**Option D:** Statement-I me axis bilkul sahi (**Diaphragm = Antero-posterior**) diya gaya hai!"],"t":"NEET Breathing Axis Mnemonic — **D-AP & E-DV**:<br>• **D**iaphragm $\\longrightarrow$ **A**ntero-**P**osterior axis!<br>• **E**xternal intercostals $\\longrightarrow$ **D**orso-**V**entral axis!","sim":""},{"id":168,"q":"Select the correct option for **Bioreactor** :<br>A. It provides continuous culture<br>B. It provides optimum growth condition<br>C. It is a scaled up commercial process","fig":"","opt":["A, B only","A only","B, C only","A, B, C"],"ans":3,"c":"**Bioreactors** ($100\\text{–}1000\\,\\mathrm{L}$ vessels, NCERT Class XII *Biotechnology*) small bench flasks se **large-scale commercial production (`C`)** ke liye design kiye jaate hain! Ye **optimum growth conditions (`B` — temperature, $\\mathrm{pH}$, substrate, salts, vitamins, oxygen)** uplabdh karate hain aur **continuous culture system (`A`)** me fresh medium daalkar aur used medium nikaal kar cells ko active **log/exponential phase** me banayein rakhte hain!","m":"Teeno points `A, B, C` NCERT *Obtaining the Foreign Gene Product* section ki direct lines hain!","s":["**A. Continuous culture:** Fresh medium ek taraf se add aur processed product dusri taraf se drain karke exponentially higher biomass aur yield deta hai — **Sahi**.","**B. Optimum growth conditions:** Temperature, $\\mathrm{pH}$, dissolved $\\ce{O2}$, foam breaker, agitator sab control rehta hai — **Sahi**.","**C. Scaled-up commercial process:** Large volumes ($100\\text{–}1000\\,\\mathrm{L}$) me recombinant proteins/enzymes commercially banate hain — **Sahi** $\\implies$ $\\color{#7ee2b8}{\\text{A, B, C (Option D)}}$!"],"r":"Bioreactor ke liye **A, B, C** (**Option D**) teeno sahi hain.","w":["**Option A (A, B only):** `C` (*scaled-up commercial process*) bioreactor ka primary uddeshya hi hai!","**Option B (A only):** B aur C dono chhod diye gaye hain.","**Option C (B, C only):** Continuous culture (`A`) high-yield bioreactor operation ka sabse bada plus point hai."],"t":"Most Commonly Used Bioreactor in NCERT: **Simple Stirred-Tank Bioreactor** (curved base + agitator impeller + $\\ce{O2}$ delivery + foam control + $\\mathrm{pH}$ & temperature control + sampling ports)!","sim":""},{"id":169,"q":"While at Cambridge, Ramachandran met <span style=\"display:inline-block;width:4em;border-bottom:1.5px solid #9aa3b2\"><\/span> and was deeply influenced by his publications on models of the $\\alpha$-helix and $\\beta$-sheet structures that directed his attention to solving the structure of collagen.<br>Fill in the blank in the given sentence:","fig":"","opt":["F. H. C. Crick","Linus Pauling","J. D. Watson","Erwin Chargaff"],"ans":1,"c":"** SCIENTIST BIOGRAPHY GEM!** NCERT Class XI Unit III (*Cell: Structure and Functions* opening biography of **G.N. Ramachandran** — founder of Madras school of conformational analysis of biopolymers, **triple helical structure of collagen** in *Nature* $1954$, & **Ramachandran Plot**!) me saaf likha hai:<br>*'While at Cambridge, Ramachandran met **Linus Pauling** and was deeply influenced by his publications on models of the $\\alpha$-helix and $\\beta$-sheet structures that directed his attention to solving the structure of collagen.'*!","m":"Direct NCERT Unit-Opening Scientist Biography fact — NEET me har $1\\text{–}2$ saal me scientist biography se seedha line aata hai!","s":["Protein secondary structures ($\\alpha$-helix aur $\\beta$-pleated sheet) ke models **Linus Pauling** ne prakashit kiye the.","Cambridge me Ph.D. ($1949$) ke dauran **G.N. Ramachandran** ki mulaqat **Linus Pauling** se hui, jisse prerit hokar unhone $1954$ me **collagen ka triple-helical model** aur **Ramachandran plot** diya!","Sahi jawab: **Linus Pauling** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Blank me sahi scientist naam **Linus Pauling** (**Option B**) aayega.","w":["**Option A (F. H. C. Crick):** Crick DNA double helix ($1953$) aur Central Dogma ke liye jaane jaate hain.","**Option C (J. D. Watson):** Watson ne Crick ke saath DNA double helix diya tha, $\\alpha$-helix/$\\beta$-sheet nahi.","**Option D (Erwin Chargaff):** Chargaff ne DNA base equivalence rules diye the."],"t":"NCERT Scientist Intro Box Super-Pair: **Linus Pauling ($\\alpha$-helix & $\\beta$-sheet)** $\\xrightarrow{\\text{inspired}}$ **G.N. Ramachandran (Collagen Triple Helix $1954$ + Ramachandran Plot)**!","sim":""},{"id":170,"q":"If we compare the **Frog** with **Human**, then what are the similarities between them?<br>a. Nucleated RBC &nbsp;&nbsp; b. Number of Auricle &nbsp;&nbsp; c. Hibernation and Aestivation<br>d. Sexual Dimorphism &nbsp;&nbsp; e. Cloaca &nbsp;&nbsp; f. Ureotelic","fig":"","opt":["b, d, f","b, d","Only b","a, c, e, f"],"ans":0,"c":"**Frog (*Rana tigrina*) vs Human (*Homo sapiens*)** comparative anatomy & physiology:<br>• **a. Nucleated RBC:** Frog = **Nucleated** | Mature Human RBC = **Enucleated (non-nucleated)** $\\implies$ Different!<br>• **b. Number of Auricles:** Frog ($3$-chambered) = **$2$ auricles** | Human ($4$-chambered) = **$2$ auricles** $\\implies$ **SAME**!<br>• **c. Hibernation & Aestivation:** Frog = Yes (*poikilotherm*) | Human = No (*homoiotherm*) $\\implies$ Different!<br>• **d. Sexual Dimorphism:** Male frog (vocal sacs + copulatory pad) & Human = **BOTH show sexual dimorphism** $\\implies$ **SAME**!<br>• **e. Cloaca:** Frog = Yes | Human = No (separate anal, urinary/reproductive openings) $\\implies$ Different!<br>• **f. Ureotelic:** Adult frog = **Ureotelic** | Human = **Ureotelic** $\\implies$ **SAME**!!","m":"Chhahon features `a–f` me Frog aur Human ko side-by-side rakh kar check karenge!","s":["**Same (`b, d, f`):** Dono me **$2$ auricles (`b`)** hote hain, dono स्पष्ट **sexual dimorphism (`d`)** dikhate hain, aur adult frog tatha human dono **urea excrete karte hain — ureotelic (`f`)**!","**Different (`a, c, e`):** Nucleated RBCs (`a`), winter/summer sleep (`c`), aur common chamber cloaca (`e`) **sirf frog me hote hain, human me nahi**!","Sahi jawab: **b, d, f** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Frog aur Human ke beech samantayein **b, d, f** (**Option A**) hain.","w":["**Option B (b, d):** Adult frog aur human **dono ureotelic (`f`)** hote hain — `f` chhodna galat hai! (*Tadpole* ammonotelic hota hai, adult frog ureotelic!)","**Option C (Only b):** `d` aur `f` dono samantayein chhoot rahi hain.","**Option D (a, c, e, f):** `a, c, e` teeno features frog ko human se *alag* karte hain, saman nahi!"],"t":"**Tadpole vs Adult Frog Excretion Trap:** **Tadpole larva = Ammonotelic** | **Adult Frog = UREOTELIC (same as Mammals/Humans!)**!","sim":""},{"id":171,"q":"In **birds**, what are the modifications that are observed that help them fly?<br>(a) Streamlined body<br>(b) Efficient Respiratory system<br>(c) Pneumatic bones for reduced weight<br>(d) Absence of urinary bladder to decrease weight<br>(e) Fore limbs modified into wings for lift","fig":"","opt":["a, b, d, e only","a, b, d, f only","b, c, d, e only","All"],"ans":3,"c":"**Class Aves — Aerial / Volant Adaptations:** Udne ke liye pakshiyon ka poora sharir weight ghatane aur high metabolic $\\ce{O2}$ demand poori karne ke liye dhal chuka hai:<br>• **Streamlined boat-shaped body (`a`)** air drag ghatane ke liye<br>• **Air-sacs supplemeting lungs (`b`)** double/continuous efficient respiration ke liye<br>• **Hollow pneumatic long bones (`c`)** with air cavities skeleton halka karne ke liye<br>• **Urinary bladder absent (`d`)** + single left ovary weight ghatane ke liye<br>• **Forelimbs modified into feathered wings (`e`)** lift & flight ke liye!","m":"Paanchon statements `(a)–(e)` classic avian flight adaptations hain $\\implies$ **All (`Option D`)**!","s":["**Weight-reducing adaptations:** Hollow **pneumatic bones (`c`)** aur **absence of urinary bladder (`d`)** (semi-solid uric acid paste sidha cloaca se nikal jaata hai).","**Aerodynamic & propulsive adaptations:** **Streamlined body (`a`)** aur **forelimbs modified into wings (`e`)**.","**High-energy metabolic adaptation:** **Air sacs connected to lungs (`b`)** $\\implies$ paanchon sahi hain = **All** ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"Birds me flight ke liye **All (`a, b, c, d, e`)** (**Option D**) modifications paayi jaati hain.","w":["**Option A (a, b, d, e only):** Hollow **pneumatic bones (`c`)** pakshiyon ki sabse famous flight adaptation hai — ise chhod hi nahi sakte!","**Option B (a, b, d, f only):** Pneumatic bones (`c`) gayab hai (aur source paper me minor typo `f` chhapa hai).","**Option C (b, c, d, e only):** Streamlined body (`a`) hawa ka drag kam karne ke liye zaroori hai."],"t":"Urinary Bladder Exception Note: Almost ALL birds lack a urinary bladder to save weight (uricotelic pellet) — textbook bird class feature!","sim":""},{"id":172,"q":"Which hormone produces **anti-inflammatory reactions** and **suppresses the immune response**?","fig":"","opt":["Thyroxine","Cortisol","Parathyroid hormone","Thymosin"],"ans":1,"c":"NCERT Class XI (*Chemical Coordination and Integration*, **Adrenal Cortex — Glucocorticoids**) ki word-for-word famous line:<br>*'**Cortisol** is the main glucocorticoid... **Cortisol produces anti-inflammatory reactions and suppresses the immune response.** Cortisol stimulates the RBC production.'*!","m":"**Cortisol** (*immunosuppressive*) vs **Thymosin** (*promotes T-cell immunity — opposite!*) ek second me clear kar lenge!","s":["**Option B (Cortisol):** Adrenal cortex (zona fasciculata) ka main glucocorticoid jo **anti-inflammatory reactions paida karta hai aur immune response ko suppress karta hai** (organ transplant rejection rokne me bhi glucocorticoids dete hain!) — **100% Verbatim NCERT True**!","**Option D (Thymosin):** Thymus hormone jo T-lymphocyte differentiation aur antibodies badhakar immunity **ENHANCE / BOOST** karta hai (*suppress* ka bilkul ulta!).","Sahi jawab: **Cortisol** ($\\color{#7ee2b8}{\\text{Option B}}$)! *(QA Note: Source PDF ke printed key box me typo se `(4)` chhap gaya tha jabki PDF ke khud ke niche likhe explanation me explicitly **'Cortisol has anti-inflammatory and immunosuppressive action'** likha hai — humne $100\\%$ sahi **Option B (Cortisol)** rakha hai!)*"],"r":"Anti-inflammatory reaction aur immune response suppression **Cortisol** (**Option B**) karta hai.","w":["**Option A (Thyroxine):** BMR, metamorphosis, aur water-electrolyte balance regulate karta hai.","**Option C (Parathyroid hormone):** Hypercalcemic hormone hai jo blood $\\ce{Ca^{2+}}$ badhata hai.","**Option D (Thymosin):** **OPPOSITE!** Thymosin CMI aur humoral immunity **badhata** hai, suppress nahi karta!"],"t":"Opposite Immunity Hormones Pair:<br>• **Thymosin** = **BOOSTS** immunity (aging me thymus shrink hone se buzurgon ki immunity kamzor hoti hai!)<br>• **Cortisol** = **SUPPRESSES** immunity & inflammation!","sim":""},{"id":173,"q":"What is the effect of **hypersecretion of Aldosterone** ?","fig":"","opt":["High sodium and low potassium level","High sodium and high potassium level","Low sodium and low potassium level","Low sodium and high potassium level"],"ans":0,"c":"**Aldosterone** hamare शरीर ka mukhya **mineralocorticoid** (zona glomerulosa of adrenal cortex) hai! NCERT Class XI ke anusaar Aldosterone nephron tubules (DCT & collecting duct) par kaam karke:<br>• **$\\ce{Na+}$ aur water ka REABSORPTION** badhata hai $\\implies$ **Blood $\\ce{Na+}$ HIGH (Hypernatremia)**!<br>• **$\\ce{K+}$ aur phosphate ($\\ce{PO4^{3-}}$) ions ka EXCRETION** badhata hai $\\implies$ **Blood $\\ce{K+}$ LOW (Hypokalemia)**!","m":"Aldosterone rule: **Saves $\\ce{Na+}$, Throws out $\\ce{K+}$** $\\implies$ Hypersecretion (*Conn's syndrome*) me **High $\\ce{Na+}$ and Low $\\ce{K+}$**!","s":["Aldosterone DCT se $\\ce{Na+}$ aur paani wapas blood me खींचता hai $\\implies$ hypersecretion se **High sodium level**.","Saath hi tubular filtrate me $\\ce{K+}$ aur $\\ce{PO4^{3-}}$ bahar nikalwata hai $\\implies$ hypersecretion se **Low potassium level**.","Combined effect: **High sodium and low potassium level** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Aldosterone ke hypersecretion se blood me **High sodium and low potassium level** (**Option A**) ho jaata hai.","w":["**Option B:** Aldosterone $\\ce{K+}$ excrete karwata hai, isliye blood $\\ce{K+}$ high nahi balki **low** ho jaata hai.","**Option C:** Aldosterone $\\ce{Na+}$ reabsorb karwata hai, isliye $\\ce{Na+}$ high hota hai.","**Option D:** **Low $\\ce{Na+}$ & High $\\ce{K+}$** Aldosterone ki **KAMI (Hyposecretion — Addison's disease)** me hota hai, hypersecretion me bilkul ulta!"],"t":"Mirror Pair Lock Karo:<br>• **Hyperaldosteronism (Conn's):** **High $\\ce{Na+}$, Low $\\ce{K+}$**, High BP!<br>• **Hypoaldosteronism (Addison's disease):** **Low $\\ce{Na+}$, High $\\ce{K+}$**, Low BP!","sim":""},{"id":174,"q":"What is the example of **blood pressure lowering** hormone ?","fig":"","opt":["Aldosterone","ANF","ADH","Angiotensin II"],"ans":1,"c":"Jab blood flow/pressure badhta hai, tab heart ki atrial wall ek peptide hormone **Atrial Natriuretic Factor ($\\mathrm{ANF}$)** secrete karti hai! **$\\mathrm{ANF}$ blood vessels ka VASODILATION karta hai aur BLOOD PRESSURE GHATATA (lowers BP) hai** — jabki baaki teeno (**Aldosterone, ADH/Vasopressin, aur Angiotensin II**) **blood pressure BADHANE wale** hormones hain!","m":"3 BP-raising RAAS/Neurohypophysis hormones vs 1 heart-secreted BP-lowering hormone (**ANF**)!","s":["**Aldosterone, ADH (Vasopressin), aur Angiotensin II:** Ye teeno fluid retention aur/ya vasoconstriction karke **blood pressure BADHATE** hain.","**ANF (Atrial Natriuretic Factor):** Heart ke atria se nikalta hai, blood vessels dilate (**vasodilation**) karta hai, aur **blood pressure GHATATA** hai!","Sahi jawab: **ANF** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Blood pressure ghatane wala hormone **ANF (Atrial Natriuretic Factor)** (**Option B**) hai.","w":["**Option A (Aldosterone):** $\\ce{Na+}$ aur water reabsorb karke blood volume aur BP badhata hai.","**Option C (ADH):** Vasoconstriction aur water reabsorption se BP badhata hai.","**Option D (Angiotensin II):** Powerful vasoconstrictor hai jo glomerular blood pressure badhata hai."],"t":"1-Second Contrast: **RAAS + ADH = Raises BP (Vasoconstrictors)** vs **ANF = Lowers BP (Vasodilator from Heart Atria)**!","sim":""},{"id":175,"q":"What is the similarity between ***Pinus*** and **Mustard** ?<br>A. Archegonia &nbsp;&nbsp; B. Embryo sac &nbsp;&nbsp; C. Strobili or cone &nbsp;&nbsp; D. Double Fertilisation &nbsp;&nbsp; E. Dominant sporophyte","fig":"","opt":["A, E","B, D, E","E only","A, C, E"],"ans":2,"c":"***Pinus* (Gymnosperm)** vs **Mustard (*Brassica*, Angiosperm)** comparison:<br>• **Archegonia (`A`) & Strobili/Cones (`C`):** *Pinus* me **PRESENT**, Mustard (angiosperm) me **ABSENT**!<br>• **7-celled Embryo Sac (`B`) & Double Fertilisation (`D`):** Mustard (angiosperm) me **PRESENT**, *Pinus* (gymnosperm) me **ABSENT**!<br>• **Diplontic life cycle with Dominant vascular SPOROPHYTE (`E`):** ***Pinus* AUR Mustard DONO (sabhi seed plants — Spermatophytes!) me $100\\%$ COMMON**!!","m":"Har trait `A–E` ko Gymnosperm (*Pinus*) aur Angiosperm (*Mustard*) columns me tick/cross lagayenge!","s":["**Only in *Pinus* (Gymnosperm):** **Archegonia (`A`)** aur male/female **Cones/Strobili (`C`)** — Mustard me flowers hote hain, archegonia aur cones nahi!","**Only in Mustard (Angiosperm):** **$7$-celled Embryo sac (`B`)** aur unique angiosperm event **Double Fertilisation (`D`)** — *Pinus* me multi-celled haploid endosperm fertilization se *pehle* banta hai!","**Common to BOTH (`E`):** Dono diplontic vascular spermatophytes hain jinka main plant body **Dominant Sporophyte (`E`)** hai $\\implies$ $\\color{#7ee2b8}{\\text{E only (Option C)}}$!"],"r":"*Pinus* aur Mustard ke beech samanta **E only (Dominant sporophyte)** (**Option C**) hai.","w":["**Option A (A, E):** Angiosperms (*Mustard*) me archegonia (`A`) poori tarah vilupt (absent) ho chuke hain!","**Option B (B, D, E):** Embryo sac (`B`) aur double fertilisation (`D`) keval angiosperms (*Mustard*) ki unique pehchaan hain, *Pinus* me nahi hote.","**Option D (A, C, E):** Archegonia (`A`) aur cones (`C`) dono sirf *Pinus* me milte hain, Mustard me nahi."],"t":"Gymnosperm vs Angiosperm Signature Check:<br>• **Archegonia + Cones + Haploid pre-fertilisation endosperm = Gymnosperm (*Pinus*)**<br>• **Embryo sac + Flowers + Double fertilisation ($3n$ endosperm) = Angiosperm (*Mustard*)**<br>• **Seeds + Pollen tube + Dominant Sporophyte = BOTH**!","sim":""},{"id":176,"q":"In which plant **microphylls** occur ?<br>A. *Sargassum* &nbsp;&nbsp; B. *Selaginella* &nbsp;&nbsp; C. *Sphagnum* &nbsp;&nbsp; D. *Marchantia*","fig":"","opt":["B, C","B only","A, B, D","B, D"],"ans":1,"c":"**True roots, stems, aur leaves** evolution me sabse pehle **PTERIDOPHYTES** me aaye! NCERT Class XI (*Plant Kingdom*, Pteridophytes) ki famous line:<br>*'The leaves in pteridophyta are **small (microphylls) as in Selaginella** or **large (macrophylls) as in ferns**.'*<br>Algae (*Sargassum*) aur Bryophytes (*Sphagnum, Marchantia*) me vascular tissue na hone se **TRUE LEAVES HOTI HI NAHI** (sirf thalloid ya *leaf-like* structures hote hain)!","m":"Direct NCERT Pteridophyta example + True Leaf Check: **Microphylls = *Selaginella* (`B only`)**!","s":["**A. *Sargassum* (Brown Alga):** Thalloid plant body — true leaves absent.","**C. *Sphagnum* & D. *Marchantia* (Bryophytes):** True roots, stems ya leaves **absent** hoti hain.","**B. *Selaginella* (Lycopsida — Pteridophyte):** True vascular small leaves = **Microphylls**! $\\implies$ $\\color{#7ee2b8}{\\text{B only (Option B)}}$!"],"r":"Microphylls **B only (*Selaginella*)** (**Option B**) me paaye jaate hain.","w":["**Option A (B, C):** *Sphagnum* ek peat moss (bryophyte) hai jisme true vascular microphylls nahi balki haploid leaf-like structures hote hain!","**Option C (A, B, D):** *Sargassum* alga aur *Marchantia* liverwort dono thalloid hain.","**Option D (B, D):** *Marchantia* bryophyte thallus hai, true leaves absent hoti hain."],"t":"NCERT Pteridophyte Leaf Twin Ratt Lo: **Microphylls = *Selaginella*** | **Macrophylls = Ferns (*Pteris, Dryopteris, Adiantum*)**! Aur *Selaginella + Salvinia* = **Heterosporous**!","sim":""},{"id":177,"q":"Select the **correct** match:<table class=\"q-table\"><tr><th><\/th><th>List-I<\/th><th>List-II<\/th><\/tr><tr><td>A.<\/td><td>RNA is infectious<\/td><td>TMV<\/td><\/tr><tr><td>B.<\/td><td>DNA is infectious<\/td><td>Bacteriophage<\/td><\/tr><tr><td>C.<\/td><td>DNA is infectious<\/td><td>Mumps<\/td><\/tr><tr><td>D.<\/td><td>DNA is infectious<\/td><td>Small pox<\/td><\/tr><\/table>","fig":"","opt":["A, B, C","A, B Only","Only A","A, B, D"],"ans":3,"c":"Viruses me **genetic material (nucleoprotein me se NUCLEIC ACID — RNA ya DNA) hi INFECTIOUS hota hai**, protein coat nahi!<br>• **Plant viruses (TMV — `A`):** Generally single-stranded **RNA**!<br>• **Bacteriophages (`B`):** Generally double-stranded **DNA**!<br>• **Animal viruses:** Single/double-stranded **RNA** (*Mumps, Influenza, Herpes? NO — Herpes & **Smallpox** are **dsDNA**!*) — yaani **Smallpox = dsDNA (`D` True)** jabki **Mumps (*Paramyxovirus*) = ssRNA (`C` False)**!!","m":"Chaaron famous NCERT viruses ka exact genetic material (`TMV = ssRNA`, `Phage = dsDNA`, `Smallpox = dsDNA`, `Mumps = ssRNA`) match karenge!","s":["**A. TMV (Tobacco Mosaic Virus):** Helical $\\mathrm{ssRNA}$ infectious — **Sahi**.","**B. Bacteriophage:** Head me $\\mathrm{dsDNA}$ infectious (Hershey–Chase $1952$ proof!) — **Sahi**.","**C. Mumps virus:** *Paramyxovirus* family ka **$\\mathrm{ssRNA}$** virus hai — *'DNA is infectious'* **GALAT** hai!","**D. Smallpox (*Variola* virus):** Double-stranded **$\\mathrm{DNA}$** virus hai — **Sahi**! Sahi jawab: $\\color{#7ee2b8}{\\text{A, B, D (Option D)}}$!"],"r":"Correct matches **A, B, D** (**Option D**) hain.","w":["**Option A (A, B, C):** Mumps virus (`C`) me RNA genetic material hota hai, DNA nahi!","**Option B (A, B Only):** Smallpox (`D`) ek famous animal $\\mathrm{dsDNA}$ virus hai — `D` bhi $100\\%$ sahi hai.","**Option C (Only A):** B aur D dono sahi hain."],"t":"Viral Nucleic Acid Cheat-Sheet:<br>• **$\\mathrm{DNA}$ Animal Viruses:** **Smallpox, Herpes, Hepatitis-B, Adenovirus**<br>• **$\\mathrm{RNA}$ Animal Viruses:** **Mumps, Measles, Influenza, HIV, Polio, Rabies, Coronavirus, Dengue**!","sim":""},{"id":178,"q":"In the given below examples, **how many organisms belong to Kingdom Fungi**?<br>*Mycoplasma, Anabaena, Mucor, Rhizopus, Euglena, Amoeba, Colletotrichum, Neurospora, Alternaria, Cuscuta*","fig":"","opt":["Six","Four","Three","Five"],"ans":3,"c":"Whittaker's **Five-Kingdom Classification** (NCERT Class XI Chapter 2) me diye gaye $10$ organisms ka exact kingdom post-mortem:<br>• **Kingdom Monera ($2$):** *Mycoplasma*, *Anabaena*<br>• **Kingdom Protista ($2$):** *Euglena* (Euglenoids), *Amoeba* (Amoeboid protozoan)<br>• **Kingdom Plantae ($1$):** ***Cuscuta*** (Amarbel — **parasitic angiosperm PLANT**, fungus NAHI!!)<br>• **KINGDOM FUNGI ($5$):** ***Mucor*** (Phycomycetes), ***Rhizopus*** (Phycomycetes), ***Neurospora*** (Ascomycetes), ***Colletotrichum*** (Deuteromycetes), ***Alternaria*** (Deuteromycetes)!!","m":"Har ek organism ke samne uska kingdom + class likhkar ginti pakki karenge — ***Cuscuta* trap** me bilkul nahi phasenge!","s":["**Phycomycetes ($2$):** ***Mucor*** (#1), ***Rhizopus*** (#2)","**Ascomycetes ($1$):** ***Neurospora*** (#3 — *Drosophila of plant kingdom*)","**Deuteromycetes ($2$):** ***Colletotrichum*** (#4), ***Alternaria*** (#5)","Baaki $5$ non-fungi hain (*Mycoplasma, Anabaena* = Monera; *Euglena, Amoeba* = Protista; ***Cuscuta*** = Parasitic Plantae!) $\\implies$ Kul Fungi $= \\color{#7ee2b8}{\\text{Five (Option D)}}$!"],"r":"Diye gaye $10$ jeev-padarthon me se kul **Five ($5$)** (**Option D**: *Mucor, Rhizopus, Colletotrichum, Neurospora, Alternaria*) Kingdom Fungi se sambandhit hain.","w":["**Option A (Six):** **#1 TRAP!** Non-green parasitic climber ***Cuscuta* (Amarbel)** ko fungus samajh kar gin lene se $6$ aata hai — jabki *Cuscuta* ek flowering **dicot PLANT** hai!!","**Option B (Four):** Deuteromycetes (*Alternaria* ya *Colletotrichum*) me se ek chhoot jaane par $4$ aata hai.","**Option C (Three):** Do fungi chhoot jaane par $3$ aata hai."],"t":"**COUNTING QUESTIONS KA GOLDEN RULE:** Har naam par pencilling/numbering karo, aur ***Cuscuta* = Parasitic Angiosperm (Plantae)** yaad rakho — ye Option A (`Six`) ka sneaky killer trap tha!!","sim":""},{"id":179,"q":"Given below are two statements : one is labelled as Assertion (A) and the other is labelled as Reason (R).<br>**Assertion (A) :** The line of treatment for a genetic disease is different from infectious diseases.<br>**Reason (R) :** Genetic diseases are caused by mutations in DNA which cannot be cured permanently with conventional antimicrobial medication — only signs and symptoms can be managed, whereas true cure requires gene manipulation/replacement of faulty genes. On the other hand, infectious diseases are caused by pathogens and therefore can be treated by substances that kill the pathogen or hamper its growth.<br>In the light of the above statements, choose the most appropriate answer from the options given below:","fig":"","opt":["Both (A) and (R) are correct and (R) is the correct explanation of (A)","Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct"],"ans":0,"c":"**Genetic vs Infectious Disease Treatment Philosophy (NCERT Exemplar):**<br>• **Infectious diseases** external pathogens (bacteria, fungi, protozoans, helminths) se hoti hain, isliye **antibiotics / antiparasitic drugs** pathogen ke specific metabolic pathways block karke rog jad se mita deti hain.<br>• **Genetic diseases** patient ki khud ki cells ke **inheritable DNA mutations** (e.g., ADA deficiency, SCID, PKU) se hoti hain — koi antibiotic DNA sequence theek nahi kar sakta; permanent treatment **Gene Therapy (gene manipulation / functional gene replacement)** hi kar sakta hai!","m":"NCERT Exemplar A–R logic: Assertion aur uska poora mechanistic explanation Reason me diya gaya hai!","s":["**Assertion (A):** Genetic diseases aur infectious diseases ki treatment approach bilkul alag hoti hai — **Correct**.","**Reason (R):** Genetic disorder DNA defect hone se gene manipulation/therapy mangta hai, jabki infectious disease pathogen marne wali dawaiyon se theek hoti hai — **Correct**.","Reason (R) Assertion (A) ka exact aur sampoorna karan hai $\\implies$ $\\color{#7ee2b8}{\\text{Option A}}$!"],"r":"**Both (A) and (R) are correct and (R) is the correct explanation of (A)** (**Option A**).","w":["**Option B:** Reason seedhe taur par samjhata hai ki dono ka line-of-treatment alag kyun hota hai.","**Option C:** Reason poori tarah NCERT Exemplar par aadharit sahi व्याख्या hai.","**Option D:** Assertion $100\\%$ true hai."],"t":"First Clinical Gene Therapy ($1990$): $4\\text{-year-old}$ girl with **ADA (Adenosine Deaminase) deficiency** — embryonic stage me permanent cure ke liye bone-marrow gene replacement!","sim":""},{"id":180,"q":"Given below are two statements: one is labelled as Assertion (A) and the other is labelled as Reason (R).<br>**Assertion (A) :** Plants require water for their survival. But when watered excessively, plants die.<br>**Reason (R) :** Plants use water for several metabolic processes such as photosynthesis, transpiration and respiration. Plants die when watered in excess, because excess water removes the air trapped between the soil particles. So, plant roots do not get $\\ce{O2}$ for respiration. Once root cells die, water and mineral absorption is stopped and this leads to gradual death of a plant.<br>In the light of the above statements, choose the most appropriate answer from the options given below:","fig":"","opt":["Both (A) and (R) are correct and (R) is the correct explanation of (A)","Both (A) and (R) are correct but (R) is not the correct explanation of (A)","(A) is correct but (R) is not correct","(A) is not correct but (R) is correct"],"ans":0,"c":"**Waterlogging & Root Asphyxiation (NCERT Class XI Exemplar — *Respiration in Plants*):**<br>Paudhe ke hari pattiyan photosynthesis se $\\ce{O2}$ banati hain, par mitti ke neeche dabi **non-green ROOTS ko aerobic cellular respiration aur active mineral absorption ke liye soil air spaces me phansi $\\ce{O2}$ ZAROORI chahiye hoti hai**! Gamle ya khet me **hadd se zyada paani bhar dene (*waterlogging*)** se mitti ke saare air pores paani se bhar jaate hain $\\implies$ **roots ko $\\ce{O2}$ nahi milti (anaerobic alcohol toxicity / root death)** $\\implies$ paani aur minerals ka absorption band ho jaata hai aur paudha sookh kar mar jaata hai!","m":"180vein aakhiri sawal par classic NCERT Exemplar physiology gem — Assertion aur Reason dono $100\\%$ sahi hain aur Reason exact explanation hai!","s":["**Assertion (A):** Paudhe ko jeene ke liye paani chahiye, par hadd se zyada paani (*waterlogging*) dene par paudha mar jaata hai — **Correct**.","**Reason (R):** Excess water soil particles ke beech ki hawa nikaal deta hai $\\implies$ roots ko respiration ke liye $\\ce{O2}$ nahi milti $\\implies$ root cells mar jaate hain aur water/mineral absorption rukne se paudha mar jaata hai — **Correct**!","Reason (R) Assertion (A) ko $100\\%$ step-by-step explain karta hai $\\implies$ $\\color{#7ee2b8}{\\text{Option A}}$!"],"r":"**Both (A) and (R) are correct and (R) is the correct explanation of (A)** (**Option A**).","w":["**Option B:** Reason seedhe batata hai ki excess watering se paudha kyun mar jaata hai.","**Option C:** Reason bilkul sahi physiological chain-of-events batata hai.","**Option D:** Assertion har gardener aur kisaan ka rozmarra ka sach hai!"],"t":"Physiological Irony ('Drowning in Water'): **Overwatered plant dies of physiological DROUGHT** — kyunki bina $\\ce{O2}$ ke dead roots paani absorb hi nahi kar paati!!","sim":""}];

let state = {
