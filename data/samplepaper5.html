 subshell me inter-electronic repulsion bahut high hota hai! Isliye aane wale extra electron ko $3p$ subshell ($\\ce{S}, \\ce{Cl}$) zyada aasani se accept karta hai.","m":"Periodic table trends aur $2p$ vs $3p$ electron gain enthalpy exceptions compare karenge.","s":["**Option A:** $\\ce{Br2}$ room temperature par liquid **non-metal** hai (liquid metal $\\ce{Hg}$ hota hai!) — Galat.","**Option B:** Period $3$ me $\\ce{Mg}$ ($3s^2$ full-filled + larger $Z_{\\mathrm{eff}}$) ki $\\mathrm{IE_1}$ $\\ce{Na}$ ($3s^1$) se **zyada** hoti hai — Galat.","**Option C:** $2p$ inter-electronic repulsion ke karan Electron Affinity $\\ce{S > O}$ hoti hai — Galat.","**Option D:** $\\ce{Cl}$ ($349\\,\\mathrm{kJ\\,mol^{-1}}$) ki Electron Affinity compact $2p^5$ wale $\\ce{F}$ ($328\\,\\mathrm{kJ\\,mol^{-1}}$) se **zyada** hoti hai — $\\color{#7ee2b8}{\\text{Sahi (Option D)}}$!"],"r":"**Electron affinity of $\\ce{Cl}$ is greater than $\\ce{F}$** (Option D).","w":["**Option A:** Bromine ($\\ce{Br2}$) ek halogen **non-metal** hai, metal nahi!","**Option B:** First ionisation energy $\\ce{Mg}\\;(737\\,\\mathrm{kJ\\,mol^{-1}}) > \\ce{Na}\\;(496\\,\\mathrm{kJ\\,mol^{-1}})$ hoti hai.","**Option C:** Group $16$ me electron affinity $\\ce{S > Se > Te > Po > O}$ hoti hai ($\\ce{O}$ sabse kam!)."],"t":"**Option A** jaldbazi me padhne walon ke liye brilliant trap hai — log '$\\ce{Br2}$ is liquid...' padhkar tick kar dete hain aur aakhiri word **'metal'** miss kar jaate hain!","sim":""},{"id":65,"q":"Which of the following is not correctly matched :-","fig":"","opt":["$[\\ce{Cu(NH3)2Cl2}] \\Rightarrow$ Heteroleptic complex","$[\\ce{Pt(NO2)(NH3)(H2O)Cl}] \\Rightarrow$ Show optical isomerism","$[\\ce{Fe(ox)3}]^{3-} \\Rightarrow$ Paramagnetic, show optical isomerism","$[\\ce{Co(NH3)3Cl3}] \\Rightarrow$ Show fac-mer isomer"],"ans":1,"c":"$5d$ metal ion $\\ce{Pt^{2+}}$ ($5d^8$) ke $4$-coordinate complexes ($[\\ce{PtABCD}]$) hamesha **$dsp^2$ square planar** geometry rakhte hain! Square planar molecule me poora **molecular plane hi Plane of Symmetry ($\\sigma_h$)** hota hai, isliye symmetric monodentate ligands wale square planar complexes **kabhi optical isomerism nahi dikhate**!","m":"Har complex ki geometry, symmetry elements (POS), aur unpaired electrons check karenge.","s":["**Check A:** $[\\ce{Cu(NH3)2Cl2}]$ me do alag ligands ($\\ce{NH3}$ aur $\\ce{Cl-}$) hain $\\implies$ **Heteroleptic** — Sahi match.","**Check B:** $[\\ce{Pt(NO2)(NH3)(H2O)Cl}]$ ek square planar $[\\ce{MABCD}]$ complex hai: ye **$3$ geometrical isomers** dikhata hai, par molecular plane of symmetry hone se **optical isomerism NAHI dikhata**! $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect match (Option B)}}$.","**Check C:** $[\\ce{Fe(C2O4)3}]^{3-}$: $\\ce{Fe^{3+}}$ ($3d^5$, weak ligand $\\ce{C2O4^{2-}} \\implies 5$ unpaired $e^-$, paramagnetic) aur chiral propeller $[\\ce{M(AA)3}]^{3-}$ ($d$ & $l$ optical isomers!) — Sahi match.","**Check D:** Octahedral $[\\ce{MA3B3}]$ ($\\ce{[Co(NH3)3Cl3]}$) classic **facial (*fac*) aur meridional (*mer*)** isomers dikhata hai — Sahi match."],"r":"Incorrect match **Option B ($[\\ce{Pt(NO2)(NH3)(H2O)Cl}] \\Rightarrow$ Show optical isomerism)** hai.","w":["**Option A:** Ek se zyada donor ligand types hone se ye waastav me heteroleptic complex hai.","**Option C:** Octahedral tris-oxalatoferrate(III) high-spin paramagnetic bhi hai aur optically active ($d/l$) bhi.","**Option D:** $[\\ce{MA3B3}]$ octahedral complex *fac* ($90^\\circ$) aur *mer* ($90^\\circ, 180^\\circ$) isomerism dikhata hai."],"t":"Super rule: **$[\\ce{MABCD}]$ square planar $\\longrightarrow 3$ Geometrical isomers, $0$ Optical isomers** (POS present)!","sim":""},{"id":66,"q":"Match the lists-<table class=\"q-table\"><tr><th><\/th><th>List-I<\/th><th><\/th><th>List-II<\/th><\/tr><tr><td>(i)<\/td><td>$\\ce{B < Ga < Al}$<\/td><td>(a)<\/td><td>$\\mathrm{I.E.}$<\/td><\/tr><tr><td>(ii)<\/td><td>$\\ce{Li < Na = K}$<\/td><td>(b)<\/td><td>$Z_{\\mathrm{eff}}$<\/td><\/tr><tr><td>(iii)<\/td><td>$\\ce{C < O < N < F}$<\/td><td>(c)<\/td><td>$\\mathrm{E.A.}$<\/td><\/tr><tr><td>(iv)<\/td><td>$\\ce{P < Si < S < Cl}$<\/td><td>(d)<\/td><td>Atomic size<\/td><\/tr><\/table>","fig":"","opt":["i-a, ii-b, iii-c, iv-d","i-d, ii-b, iii-a, iv-c","i-c, ii-d, iii-a, iv-b","i-d, ii-b, iii-c, iv-a"],"ans":1,"c":"Periodic properties ke char classic NCERT + Slater exceptions yahan diye gaye hain: Group $13$ me $3d^{10}$ poor shielding se **atomic radius $\\ce{Ga}\\;(135\\,\\mathrm{pm}) < \\ce{Al}\\;(143\\,\\mathrm{pm})$**; Slater's rule se alkali metals ka **$Z_{\\mathrm{eff}}$ ($\\ce{Li}=1.30 < \\ce{Na}=2.20 = \\ce{K}=2.20$)**; Period $2$ me half-filled $2p^3$ se **$\\mathrm{IE_1}$ ($\\ce{C < O < N < F}$)**; aur Period $3$ me half-filled $3p^3$ se **$\\mathrm{EA}$ ($\\ce{P < Si < S < Cl}$)**!","m":"In charon iconic trends ko seedha unki periodic property se pair karenge.","s":["**(i) $\\ce{B < Ga < Al}$:** D-block contraction ($3d^{10}$ poor shielding in $\\ce{Ga}$) $\\implies$ **Atomic size (d)**","**(ii) $\\ce{Li < Na = K}$:** Slater's rules se $\\sigma$: $\\ce{Li}\\;(1.3) < \\ce{Na}\\;(2.2) = \\ce{K}\\;(2.2) \\implies$ **$Z_{\\mathrm{eff}}$ (b)**","**(iii) $\\ce{C < O < N < F}$:** Half-filled $2p^3$ extra stability of $\\ce{N}$ over $\\ce{O}$ $\\implies$ **$\\mathrm{I.E.}$ (a)**","**(iv) $\\ce{P < Si < S < Cl}$:** Half-filled $3p^3$ of $\\ce{P}$ resists electron addition compared to $3p^2$ $\\ce{Si}$ (giving $3p^3$!) $\\implies$ **$\\mathrm{E.A.}$ (c)** ($\\color{#7ee2b8}{\\text{Option B}}$)"],"r":"Sahi matching **i-d, ii-b, iii-a, iv-c** (**Option B**) hai.","w":["**Option A:** $\\ce{B < Ga < Al}$ atomic radius hai, ionisation energy ($\\ce{B > Ga > Al}$) nahi!","**Option C:** (i), (ii), aur (iv) teeno galat match hain.","**Option D:** (iii) aur (iv) ulte kar diye gaye hain ($\\ce{N > O}$ $\\mathrm{I.E.}$ me hota hai, $\\mathrm{E.A.}$ me nahi!)."],"t":"Sirf **(i) $\\to$ d** aur **(iii) $\\to$ a** pakadte hi $5$ second me sirf **Option B** bachta hai!","sim":""},{"id":67,"q":"Which of the following is correctly matched?","fig":"","opt":["$[\\ce{Cu(NH3)4}]^{2+}$ — Diamagnetic","$[\\ce{Ni(CN)4}]^{2-}$ — Paramagnetic","$[\\ce{MnCl4}]^{2-}$ — Diamagnetic","$[\\ce{Fe(CN)6}]^{4-}$ — Diamagnetic"],"ans":3,"c":"Valence Bond Theory / Crystal Field Theory ke anusaar **strong field ligand ($\\ce{CN-}$)** $d$-electrons ki pairing karata hai, jabki **weak field halide ligand ($\\ce{Cl-}$)** pairing nahi karata. Odd $d^9$ ($\\ce{Cu^{2+}}$) complex me toh pairing ke baad bhi **$1$ unpaired electron hamesha bachta hi hai**!","m":"Har central metal ion ki oxidation state, $3d^n$ configuration, aur unpaired electrons $n$ nikalenge ($n = 0 \\implies$ Diamagnetic, $n \\ge 1 \\implies$ Paramagnetic).","s":["**A. $[\\ce{Cu(NH3)4}]^{2+}$:** $\\ce{Cu^{2+}} = 3d^9 \\implies 1$ unpaired electron ($dsp^2$) $\\implies$ **Paramagnetic** (Galat match).","**B. $[\\ce{Ni(CN)4}]^{2-}$:** $\\ce{Ni^{2+}} = 3d^8$ + strong ligand $\\ce{CN-} \\implies dsp^2$ square planar, $0$ unpaired $e^- \\implies$ **Diamagnetic** (Galat match).","**C. $[\\ce{MnCl4}]^{2-}$:** $\\ce{Mn^{2+}} = 3d^5$ + weak ligand $\\ce{Cl-} \\implies sp^3$ tetrahedral, $5$ unpaired $e^- \\implies$ **Paramagnetic** (Galat match).","**D. $[\\ce{Fe(CN)6}]^{4-}$:** $\\ce{Fe^{2+}} = 3d^6$ + strong ligand $\\ce{CN-} \\implies d^2sp^3$ ($t_{2g}^6 e_g^0$), **$0$ unpaired $e^-$ $\\implies$ Diamagnetic** — $\\color{#7ee2b8}{\\text{Sahi match (Option D)}}$!"],"r":"Correct match **$[\\ce{Fe(CN)6}]^{4-}$ — Diamagnetic** (Option D) hai.","w":["**Option A:** $3d^9$ me $9$ odd electrons hone se $1$ unpaired electron hamesha rehta hai (paramagnetic).","**Option B:** Strong field $\\ce{CN-}$ $\\ce{Ni^{2+}}$ ($3d^8$) ke saare electrons pair karke diamagnetic bana deta hai.","**Option C:** $[\\ce{MnCl4}]^{2-}$ me $5$ unpaired electrons ($\\mu \\approx 5.92\\,\\mathrm{BM}$, strongly paramagnetic) hote hain."],"t":"Odd electron count shortcut: $\\ce{Cu^{2+}}$ ($3d^9$) ka koi bhi mononuclear complex ho — ligand weak ho ya strong — **$9$ electrons kabhi poori tarah pair nahi ho sakte**, hamesha paramagnetic!","sim":""},{"id":68,"q":"Which of the following order is not correct?","fig":"","opt":["$\\ce{BF3 < BCl3 < BBr3}$ — Lewis acidic strength","$\\ce{O(CH3)2 > O(SiH3)2}$ — Lewis basic strength","$\\ce{H3PO4 > H3PO3 > H3PO2}$ — O.S. of $\\ce{P}$","$\\ce{HOCl > HClO2 > HClO3 > HClO4}$ — Oxidising strength"],"ans":3,"c":"Inorganic chemistry me boron halides ki Lewis acidity back-bonding ($2p_\\pi\\text{–}np_\\pi$) se tay hoti hai, silyl ether ki basicity $2p_\\pi\\text{–}3d_\\pi$ delocalization se ghat-ti hai, aur oxoacids of $\\ce{P}$ me oxidation numbers $+5, +3, +1$ hote hain.","m":"Pehle teenon indisputable orders (A, B, C) verify karenge aur Option D ke piche paper-setter ka target point (acidic/oxidising trend confusion) samjhenge.","s":["**Option A:** $\\ce{BF3}$ me strong $2p_\\pi\\text{–}2p_\\pi$ back-bonding se $\\ce{B}$ ki electron deficiency ghat-ti hai, jabki $\\ce{BBr3}$ ($2p_\\pi\\text{–}4p_\\pi$) me back-bonding sabse kamzor hoti hai $\\implies$ Lewis acidity $\\ce{BF3 < BCl3 < BBr3}$ — **100% Correct**.","**Option B:** $\\ce{O(SiH3)2}$ me $\\ce{O}$ ka lone pair $\\ce{Si}$ ke vacant $3d$ orbital me delocalize ($p_\\pi\\text{–}d_\\pi$) ho jaata hai, jabki $\\ce{O(CH3)2}$ me $\\ce{C}$ ke paas $d$-orbital nahi hota $\\implies$ Lewis basicity $\\ce{O(CH3)2 > O(SiH3)2}$ — **100% Correct**.","**Option C:** Phosphorus ki oxidation state: $\\ce{H3PO4}\\;(+5) > \\ce{H3PO3}\\;(+3) > \\ce{H3PO2}\\;(+1)$ — **100% Correct**.","**Option D:** Elimination se **Option D** hi intended answer hai ($\\color{#7ee2b8}{\\text{Option D}}$) [QA Note: paper-setter ne acidic strength order $\\ce{HOCl < HClO2 < HClO3 < HClO4}$ se mix karke D ko wrong mark kiya hai, halanki kinetically dilute solution me $\\ce{HOCl}$ sabse tezi se $\\ce{[O]}$ deta hai!]."],"r":"Elimination aur source paper key ke anusaar **Option D** select kiya gaya hai.","w":["**Option A:** Back-bonding ghate $\\implies$ Lewis acidity badhe ($\\ce{BF3 < BCl3 < BBr3 < BI3}$) — bilkul sahi statement hai.","**Option B:** $2p_\\pi\\text{–}3d_\\pi$ back-bonding ke karan disilyl ether dimethyl ether se kamzor base hota hai — bilkul sahi hai.","**Option C:** $+5 > +3 > +1$ oxidation state kram ganitiy roop se $100\\%$ sahi hai."],"t":"Elimination power: Jab Options A, B, C teeno rock-solid $100\\%$ true hon, toh exam hall me hamesha remaining Option D hi tick karein!","sim":""},{"id":69,"q":"Which of the following has banana bond :","fig":"","opt":["$\\ce{Si2(CH3)6}$","$\\ce{C2(CH3)6}$","$\\ce{Al2(CH3)6}$","$\\ce{Al2Cl6}$"],"ans":2,"c":"**Banana bond ($3\\text{-centre–}2\\text{-electron}$, $3c\\text{–}2e^-$ bond)** tab banta hai jab central atom electron-deficient ho **aur** bridging atom/group ke paas **lone pair na ho**! Agar bridging atom ke paas lone pair ho (jaise $-\\ce{Cl}$ me $\\ce{Al2Cl6}$!), toh coordinate dative bond ($3c\\text{–}4e^-$) banta hai, banana bond nahi!","m":"Har molecule me bridging bond aur lone pairs check karenge — **$\\ce{Al2Cl6}$ vs $\\ce{Al2(CH3)6}$** JEE/NEET ka sabse iconic trap hai!","s":["**A. $\\ce{Si2(CH3)6}$ & B. $\\ce{C2(CH3)6}$:** Hexamethyldisilane aur hexamethylethane me direct normal $2c\\text{–}2e^-$ $\\ce{Si-Si}$ aur $\\ce{C-C}$ bond hota hai — koi bridge nahi!","**D. $\\ce{Al2Cl6}$:** Bridging $-\\ce{Cl}$ ke paas lone pairs hote hain ($\\ce{Al\\leftarrow Cl - Al}$), isliye har bridge me $4$ electrons (**$3c\\text{–}4e^-$ bond**) hote hain — banana bond NAHI!","**C. $\\ce{Al2(CH3)6}$:** Trimethylaluminium dimer me bridging $-\\ce{CH3}$ ke paas koi lone pair nahi hota, isliye $\\ce{Al\\cdots CH3 \\cdots Al}$ me **$3c\\text{–}2e^-$ banana bond** banta hai ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"Banana bond ($3c\\text{–}2e^-$) **$\\ce{Al2(CH3)6}$** (Option C) me paaya jaata hai.","w":["**Option A ($\\ce{Si2(CH3)6}$):** Electron-precise molecule hai, normal covalent $2c\\text{–}2e^-$ bonds hote hain.","**Option B ($\\ce{C2(CH3)6}$):** Saturated alkane hai, saare normal $2c\\text{–}2e^-$ sigma bonds hain.","**Option D ($\\ce{Al2Cl6}$):** **#1 EXAM TRAP!** $\\ce{Al2Cl6}$ me halogen lone pair donation se **$3c\\text{–}4e^-$** bridge banta hai, $3c\\text{–}2e^-$ banana bond nahi!"],"t":"Ratt lo ye सोने जैसा फर्क: **$\\ce{B2H6}, \\ce{Al2(CH3)6}, (\\ce{BeH2})_n \\longrightarrow 3c\\text{–}2e^-$ (Banana bond)**; jabki **$\\ce{Al2Cl6}, (\\ce{BeCl2})_n, \\ce{I2Cl6} \\longrightarrow 3c\\text{–}4e^-$ bond**!","sim":""},{"id":70,"q":"Arrange the following hydrides of group $16$ elements in order of increasing stability.","fig":"","opt":["$\\ce{H2S < H2O < H2Te > H2Se}$","$\\ce{H2O < H2Te < H2Se < H2S}$","$\\ce{H2O < H2S < H2Se < H2Te}$","$\\ce{H2Te < H2Se < H2S < H2O}$"],"ans":3,"c":"Group $16$ ($\\ce{O, S, Se, Te}$) me upar se neeche jaane par central atom $\\ce{E}$ ka atomic size badhta hai, jisse $\\ce{H-E}$ bond lamba aur kamzor hota jaata hai (**bond dissociation enthalpy $\\Delta_{\\mathrm{diss}} H^\\circ$ ghat-ti hai**). Isliye **thermal stability down the group ghat-ti hai**!","m":"Sawal me **'increasing stability'** (sabse kam stable se sabse zyada stable!) maanga hai — sign $<$ dhyan se dekhenge!","s":["Bond length kram: $\\ce{O-H < S-H < Se-H < Te-H}$","Bond dissociation energy (stability) kram: $\\ce{H2Te}$ (least stable) $< \\ce{H2Se} < \\ce{H2S} < \\ce{H2O}$ (most stable)","Increasing order me likhein: $\\color{#7ee2b8}{\\ce{H2Te < H2Se < H2S < H2O}}$ (**Option D**)"],"r":"Increasing thermal stability ka sahi kram **$\\ce{H2Te < H2Se < H2S < H2O}$** (Option D) hai.","w":["**Option A:** Mixed inequality aur galat kram hai.","**Option B:** $\\ce{H2O}$ ko sabse kam stable dikhaya hai jabki $\\ce{H2O}$ sabse zyada stable hai.","**Option C:** Ye **acidic strength** aur **reducing character** ka increasing order hai ($\\ce{H2O < H2S < H2Se < H2Te}$), thermal stability ka bilkul ulta!"],"t":"Opposite pairs yaad rakho: **Thermal Stability:** $\\ce{H2Te < H2Se < H2S < H2O}$; **Acidic & Reducing Strength:** $\\ce{H2O < H2S < H2Se < aur **Carnallite** ($\\ce{KCl.MgCl2.6H2O}$)!","sim":""},{"id":73,"q":"Select the correct statement :-<br>(a) $\\ce{Mn^{3+}}$ acts as stronger oxidising agent than $\\ce{Cr^{3+}}$ & $\\ce{Fe^{3+}}$<br>(b) $\\ce{MnF7}$, $\\ce{SiF6^{2-}}$ & $\\ce{BF6^{3-}}$ all are known fluorides<br>(c) $\\ce{La^{3+}}$ & $\\ce{Lu^{3+}}$ both are diamagnetic<br>(d) When $\\ce{K2Cr2O7}$ reacts with $\\ce{H2O2}$ in acidic medium it forms dark orange ($\\ce{CrO5}$) compound","fig":"","opt":["a, b, d","a, b, c","a, c","a, b, c, d"],"ans":2,"c":"$3d$ aur $4f$ chemistry ke char super-important concepts: (1) $\\ce{Mn^{3+}}\\;(3d^4) \\to \\ce{Mn^{2+}}\\;(3d^5\\text{ half-filled})$ ki bhaari tendancy se $\\ce{Mn^{3+}}$ strong oxidant ($E^\\circ = +1.57\\,\\mathrm{V}$) hai; (2) $\\ce{B}$ ($2\\text{nd}$ period) me $2d$ orbital na hone se max covalency $= 4$ ($\\ce{BF4-}$ only) aur $\\ce{Mn}$ ka highest fluoride $\\ce{MnF4}$ hai; (3) $\\ce{La^{3+}}\\;(4f^0)$ aur $\\ce{Lu^{3+}}\\;(4f^{14})$ dono me $0$ unpaired electrons hain; (4) peroxo-chromium pentoxide $\\ce{CrO5}$ **deep blue** hota hai!","m":"Charo statements (a), (b), (c), (d) ko ek-ek karke NCERT facts se verify karenge.","s":["**(a) $\\ce{Mn^{3+}}$ oxidising power:** $\\ce{Mn^{3+}}\\;(d^4) + e^- \\to \\ce{Mn^{2+}}\\;(d^5,\\text{ extra stable})$, $E^\\circ = +1.57\\,\\mathrm{V} \\gg \\ce{Fe^{3+}}\\;(+0.77\\,\\mathrm{V}) > \\ce{Cr^{3+}}\\;(-0.41\\,\\mathrm{V})$ $\\implies$ **(a) Correct**!","**(b) Known fluorides:** $\\ce{BF6^{3-}}$ ($2d$ orbital absent!) aur $\\ce{MnF7}$ (steric crowding; $\\ce{Mn}$ forms $\\ce{MnO3F}$, max binary fluoride is $\\ce{MnF4}$) **exist hi nahi karte**! $\\implies$ **(b) Wrong**!","**(c) $\\ce{La^{3+}}$ & $\\ce{Lu^{3+}}$:** $\\ce{La^{3+}} = [\\ce{Xe}]\\,4f^0$ ($n=0$) aur $\\ce{Lu^{3+}} = [\\ce{Xe}]\\,4f^{14}$ ($n=0$) $\\implies$ dono **diamagnetic**! $\\implies$ **(c) Correct**!","**(d) $\\ce{CrO5}$ colour:** Acidified $\\ce{K2Cr2O7 + 4H2O2 -> 2CrO5 + 5H2O}$ butterfly structure **deep blue** (amyl alcohol layer me) hota hai, dark orange nahi! $\\implies$ **(d) Wrong**! Sahi uttar: $\\color{#7ee2b8}{\\text{a, c (Option C)}}$."],"r":"Keval statements **a, c** (**Option C**) sahi hain.","w":["**Option A (a, b, d):** (b) aur (d) dono hi statements तथ्यात्मक रूप से गलत hain.","**Option B (a, b, c):** Boron ($n=2$) kabhi hexacoordinate $\\ce{BF6^{3-}}$ nahi bana sakta, isliye (b) galat hai.","**Option D (a, b, c, d):** $\\ce{CrO5}$ deep blue hota hai (orange toh reactant $\\ce{Cr2O7^{2-}}$ hota hai!)."],"t":"1-second elimination: Boron ki max covalency **$4$** hoti hai ($\\ce{BF6^{3-}}$ impossible $\\implies$ `b` gaya!), toh Options A, B, D teeno ek jhatke me bahar — sirf **Option C (`a, c`)** bacha!!","sim":""},{"id":74,"q":"One of the products formed due to the reaction between $\\ce{KMnO4}$ and $\\ce{HCl}$ is","fig":"","opt":["red liquid","$\\ce{MnO2}$","greenish yellow gas","$\\ce{HClO4}$"],"ans":2,"c":"Laboratory me $\\ce{Cl2}$ gas banane ki classic method hai: strong oxidising agent $\\ce{KMnO4}$ concentrated $\\ce{HCl}$ ko oxidise karke pungent **greenish-yellow $\\ce{Cl2(g)}$** banata hai ($2\\ce{KMnO4 + 16HCl -> 2KCl + 2MnCl2 + 8H2O + 5Cl2 ^}$)!","m":"Balanced redox reaction likhkar products ($\\ce{KCl}, \\ce{MnCl2}, \\ce{H2O}, \\ce{Cl2}$) aur unki physical appearance dekhenge.","s":["Acidic medium ($\\ce{HCl}$) me $\\ce{MnO4-}\\;(+7)$ reduce hokar colourless/pale-pink $\\ce{Mn^{2+}}$ ($\\ce{MnCl2}$) deta hai (na ki $\\ce{MnO2}$!)","Saath hi $\\ce{Cl-}\\;(-1)$ oxidise hokar $\\ce{Cl2}\\;(0)$ gas deta hai: $2\\ce{KMnO4 + 16HCl -> 2KCl + 2MnCl2 + 8H2O + 5Cl2(g)}$","$\\ce{Cl2}$ gas apni pehchan **greenish-yellow gas** ke roop me rakhti hai ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"$\\ce{KMnO4}$ aur $\\ce{HCl}$ ki abhikriya se **greenish yellow gas ($\\ce{Cl2}$)** banti hai.","w":["**Option A (red liquid):** Red liquid ($\\ce{CrO2Cl2}$ chromyl chloride ya $\\ce{Br2}$) yahan nahi banta.","**Option B ($\\ce{MnO2}$):** Strong acid $\\ce{HCl}$ me $\\ce{Mn}$ $+7$ se seedha $+2$ ($\\ce{MnCl2}$) tak jaata hai, $+4$ ($\\ce{MnO2}$) par nahi rukta.","**Option D ($\\ce{HClO4}$):** $\\ce{Cl-}$ ka oxidation $\\ce{Cl2}$ tak hota hai, perchloric acid $\\ce{HClO4}$ nahi banta."],"t":"Yahi kaaran hai ki permanganate titrations me acidify karne ke liye **$\\ce{HCl}$ kabhi use nahi karte** (sirf dil. $\\ce{H2SO4}$ use karte hain) — kyunki $\\ce{KMnO4}$ $\\ce{HCl}$ ko hi $\\ce{Cl2}$ greenish-yellow gas me oxidise kar deta hai!","sim":""},{"id":75,"q":"The product of oxidation of $\\ce{I-}$ with $\\ce{MnO4-}$ in alkaline medium :-","fig":"","opt":["$\\ce{IO3-}$","$\\ce{I2}$","$\\ce{IO-}$","$\\ce{IO4-}$"],"ans":0,"c":"NCERT d-block chapter ka **#1 Most Repeated Trap**:<br>• **Acidic medium** me $\\ce{MnO4-}$ iodide ($\\ce{I-}$) ko **$\\ce{I2}$** me oxidise karta hai ($10\\ce{I- + 2MnO4- + 16H+ -> 5I2 + 2Mn^{2+} + 8H2O}$).<br>• **Neutral ya faintly alkaline medium** me $\\ce{MnO4-}$ iodide ($\\ce{I-}$) ko iodate **$\\ce{IO3-}$** me oxidise karta hai ($2\\ce{MnO4- + H2O + I- -> 2MnO2 + 2OH- + IO3-}$)!","m":"Medium dhyan se padhein: **alkaline medium** diya hai — seedha iodate ion $\\ce{IO3-}$ بنتा hai!","s":["Neutral / faintly alkaline medium ki balanced NCERT reaction likhein:","$2\\ce{MnO4- + H2O + I- -> 2MnO2 + 2OH- + IO3-}$ (aur strong alkali me $6\\ce{MnO4- + I- + 6OH- -> 6MnO4^{2-} + IO3- + 3H2O}$)","$\\ce{I}$ ki oxidation state $-1$ ($\\ce{I-}$) se badhkar **$+5$ ($\\ce{IO3-}$, iodate ion)** ho jaati hai ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Alkaline medium me $\\ce{I-}$ ka oxidation product **$\\ce{IO3-}$** (Option A) hota hai.","w":["**Option B ($\\ce{I2}$):** **SABSE BADA TRAP!** $\\ce{I2}$ **acidic medium** me banta hai, alkaline medium me nahi!","**Option C ($\\ce{IO-}$):** Hypoiodite unstable intermediate hota hai jo turant disproportionate hokar $\\ce{IO3-}$ bana leta hai.","**Option D ($\\ce{IO4-}$):** Periodate $+7$ tak permanganate se aam alkaline solution me nahi jaata."],"t":"Dimag me chhaap lo: **$\\ce{MnO4- + I-}$ $\\xrightarrow{\\text{Acidic}}$ $\\ce{I2}$**; **$\\ce{MnO4- + I-}$ $\\xrightarrow{\\text{Neutral / Alkaline}}$ $\\ce{IO3-}$**!","sim":""},{"id":76,"q":"IUPAC name of the compound is :-","fig":"q76","opt":["$5$-Chloro-$2$-ethyl-$1$-methyl cyclohexane","$1$-Chloro-$4$-ethyl-$3$-methyl cyclohexane","$1$-Ethyl-$2$-methyl-$4$-chloro cyclohexane","$4$-Chloro-$1$-ethyl-$2$-methyl cyclohexane"],"ans":3,"c":"Trisubstituted cycloalkane ke IUPAC naming ke **do kramik rules** hain:<br>1) **Lowest Set of Locants Rule (First Point of Difference):** Ring carbons ko is tarah number do ki substituents ko sabse chhota locant set mile!<br>2) **Alphabetical Order in Name:** Name likhte waqt prefixes hamesha **alphabetical order** (**c**hloro $\\to$ **e**thyl $\\to$ **m**ethyl) me hi likhe jaate hain!","m":"Ring par teen groups hain: $-\\ce{Cl}$ ($12$ o'clock), $-\\ce{CH3}$ ($5$ o'clock), aur $-\\ce{C2H5}$ ($6$ o'clock). Sabhi possible numbering sets compare karenge.","s":["Ethyl ($6$ o'clock) ko $\\mathrm{C_1}$, Methyl ($5$ o'clock) ko $\\mathrm{C_2}$ dekar anticlockwise chalein: Chloro $\\mathrm{C_4}$ par aata hai $\\implies$ locant set $= \\mathbf{(1, 2, 4)}$!","Baaki sabhi koshishein badi aati hain: Methyl se $\\mathrm{C_1} \\to$ Ethyl $\\mathrm{C_2}$ clockwise dene par Chloro $\\mathrm{C_5}$ par $\\implies (1, 2, 5) > (1, 2, 4)$; Chloro ko $\\mathrm{C_1}$ dene par $\\implies (1, 3, 4) > (1, 2, 4)$!","Toh final locants pakke ho gaye: **$1$-ethyl**, **$2$-methyl**, **$4$-chloro**!","Ab IUPAC alphabetical order (**C**hloro $\\to$ **E**thyl $\\to$ **M**ethyl) me likhein: $\\color{#7ee2b8}{4\\text{-Chloro-}1\\text{-ethyl-}2\\text{-methylcyclohexane}}$ (**Option D**)!"],"r":"Compound ka sahi IUPAC naam **$4$-Chloro-$1$-ethyl-$2$-methyl cyclohexane** (Option D) hai.","w":["**Option A ($5$-Chloro-$2$-ethyl-$1$-methyl):** Locant set $(1, 2, 5)$ first point of difference par $(1, 2, 4)$ se bada hai, isliye galat.","**Option B ($1$-Chloro-$4$-ethyl-$3$-methyl):** Locant set $(1, 3, 4)$ me doosra number $3 > 2$ hone se galat hai!","**Option C ($1$-Ethyl-$2$-methyl-$4$-chloro):** Numbers sahi $(1, 2, 4)$ hain par alphabetical order (**C** pehle aana chahiye, E nahi!) tod diya gaya hai!"],"t":"**Option C vs Option D** classic IUPAC trap hai: numbering locant sum/set se hoti hai ($(1,2,4)$), par **writing hamesha A–Z alphabetical** (**4-Chloro-1-ethyl-2-methyl**) hoti hai!","sim":""},{"id":77,"q":"How many optically active stereoisomers are possible for $\\ce{CH3CHBrCHOHCHOHCHBrCH3}$ ?","fig":"","opt":["$4$","$6$","$8$","$10$"],"ans":2,"c":"Jab molecule **symmetrical** ho (dono ends bilkul same: $\\ce{CH3-CHBr-CHOH - CHOH-CHBr-CH3}$) aur chiral centres ki sankhya **$n$ EVEN** ho ($n = 4$: $\\mathrm{C_2, C_3, C_4, C_5}$), tab:<br>• **Optically active isomers ($a$)** $= 2^{n - 1}$<br>• **Meso (optically inactive) isomers ($m$)** $= 2^{\\frac{n}{2} - 1}$<br>• **Total stereoisomers** $= 2^{n - 1} + 2^{\\frac{n}{2} - 1}$!","m":"Dhyan se padhein: sawal me **'total stereoisomers' ($10$) NAHI**, balki **'optically active stereoisomers' ($a = 2^{n-1}$)** poocha gaya hai!!","s":["Chain likhein: $\\ce{CH3 - \\overset{\\ast}{C}H(Br) - \\overset{\\ast}{C}H(OH) - \\overset{\\ast}{C}H(OH) - \\overset{\\ast}{C}H(Br) - CH3}$","Chiral carbons ginein: $\\mathrm{C_2, C_3, C_4, C_5} \\implies n = 4$ (even), aur molecule bich se bilkul symmetrical hai!","Optically active stereoisomers ka formula lagayein: $a = 2^{n - 1} = 2^{4 - 1} = 2^{3} = \\color{#7ee2b8}{8}$ ($4$ pairs of $d/l$ enantiomers!)","(Reference ke liye: meso forms $m = 2^{\\frac{4}{2}-1} = 2^1 = 2$, aur kul stereoisomers $= 8 + 2 = 10$ hote hain.)"],"r":"Optically active stereoisomers ki sankhya **$8$** (Option C) hai.","w":["**Option A ($4$):** $d/l$ **pairs** ki sankhya ($4$ enantiomeric pairs) ko individual isomers samajh lene se $4$ aata hai.","**Option B ($6$):** $8 - 2 = 6$ (active me se meso ek baar aur ghata dene ki galti!) se aata hai!!","**Option D ($10$):** **BIGGEST TRAP!** $10$ **total** stereoisomers ($8$ active $+ 2$ meso) hain — meso compounds optically inactive hote hain!"],"t":"Symmetrical + even $n$ ke teenon numbers ungliyon par rakho ($n = 4$): **Active $= 2^{n-1} = 8$**, **Meso $= 2^{n/2-1} = 2$**, **Total $= 10$**!","sim":""},{"id":78,"q":"Following compound contains how many chiral centres :-","fig":"q78","opt":["$3$","$2$","$1$","$4$"],"ans":0,"c":"$sp^3$ hybridised tetrahedral atom jis par **chaaro groups alag-alag** jude hon, ek **chiral centre (asymmetric centre)** hota hai. Isotopes ($\\ce{-H}$ protium aur $\\ce{-D}$ deuterium!) bhi atomic mass alag hone ke karan **different groups** maane jaate hain!","m":"Newman projection ko open structural chain me likhkar **front carbon**, **back carbon**, aur **side-chain carbon** teenon ko alag-alag check karenge!","s":["Newman projection se formula kholein: $\\ce{HOOC - \\overset{\\ast}{C}H(Cl) - \\overset{\\ast}{C}(Cl)(CHO) - \\overset{\\ast}{C}H(OH)D}$!","**1. Front Carbon ($\\mathrm{C}_{\\text{front}}$):** Jude $4$ groups hain $-\\ce{COOH}$, $-\\ce{Cl}$, $-\\ce{H}$, aur bada back-carbon group $\\implies$ **Chiral (#1)**!","**2. Back Carbon ($\\mathrm{C}_{\\text{back}}$):** Jude $4$ groups hain $-\\ce{Cl}$, $-\\ce{CHO}$, $-\\ce{CH(OH)D}$, aur front-carbon group — charo bilkul alag! $\\implies$ **Chiral (#2)**!","**3. Side-chain Carbon ($-\\ce{CH(OH)D}$):** Jude $4$ groups hain $-\\ce{H}$, $-\\ce{OH}$, $-\\ce{D}$ (deuterium!), aur $-\\mathrm{C}_{\\text{back}}(\\dots)$ — charo bilkul alag! $\\implies$ **Chiral (#3)**! Kul chiral centres $= \\color{#7ee2b8}{3}$!"],"r":"Is compound me kul **$3$** chiral centres hain (**Option A**).","w":["**Option B ($2$):** **90% students ki galti!** Front aur back carbon toh gin liye, par side group $-\\ce{CH(OH)D}$ me $\\ce{H \\ne D}$ chiral centre miss kar gaye!!","**Option C ($1$):** Dono Newman carbons par $-\\ce{Cl}$ dekhkar achiral samajh liya (jabki baaki groups $-\\ce{COOH}$ vs $-\\ce{CHO}$ alag hain!).","**Option D ($4$):** $-\\ce{COOH}$ aur $-\\ce{CHO}$ $sp^2$ trigonal planar hote hain, chiral nahi ho sakte."],"t":"Jab bhi substituent me **$-\\ce{CH(OH)D}$**, **$-\\ce{CHDCl}$**, ya **sec-butyl $-\\ce{CH(CH3)C2H5}$** chhupa ho, chaukanna ho jao — side chain ke andar ek chhupa hua chiral carbon बैठा hai!","sim":""},{"id":79,"q":"How many of the following are aromatic?","fig":"q79","opt":["$1$","$2$","$3$","$4$"],"ans":1,"c":"**Hückel's Rule of Aromaticity** ki $4$ anivarya shartein hain: molecule (1) **cyclic**, (2) **planar**, (3) **completely conjugated** (har ring atom par overlapping $p$-orbital ho, koi $sp^3$ break na ho!), aur (4) **$(4n + 2)\\pi$ delocalized electrons** ($2, 6, 10, \\dots$) rakhta ho!","m":"Chhahon structures **(a) se (f)** ka hybridisation, planarity, aur delocalized $\\pi$-electron count ek-ek karke check karenge.","s":["**(a) Pyrazine ($1,4$-diazine):** Planar conjugated $6$-ring, $3$ double bonds $= \\mathbf{6\\pi\\,e^-}$ (dono $\\ce{N}$ ke lone pairs $sp^2$ orbitals me ring plane me bahar rehte hain!) $\\implies$ **AROMATIC (#1)**!","**(b) $1,4$-Dioxin:** $2$ double bonds ($4\\pi$) + dono $\\ce{O}$ se $2+2$ lone pair $e^-$ $= 8\\pi\\,e^-$ ($4n$, tub-shaped non-planar) $\\implies$ **Non-aromatic**.","**(c) Tropolone:** $\\ce{C=O <-> C^+-O^-}$ polarisation se $7$-membered ring tropylium cation jaisa planar conjugated **$6\\pi\\,e^-$** system banata hai $\\implies$ **AROMATIC (#2)**!","**(d) $[10]$Annulene:** $10\\pi\\,e^-$ hone ke bawajood andar wale trans-annular hydrogens ke beech severe steric clash ke karan **non-planar** ho jaata hai $\\implies$ **Non-aromatic**!","**(e) $-\\ce{BH2-}$ five-ring & (f) $\\ce{BH}$ borole:** (e) me tetrahedral **$sp^3$ boron** conjugation tod deta hai (**non-aromatic**), aur (f) me $4\\pi\\,e^-$ + vacant $p$ orbital of $\\ce{B}$ hone se **anti-aromatic**! Kul aromatic $= \\color{#7ee2b8}{2}$ (**a aur c**)!"],"r":"Diye gaye $6$ compounds me se keval **$2$** (`(a)` pyrazine aur `(c)` tropolone) aromatic hain (**Option B**).","w":["**Option A ($1$):** Tropolone `(c)` ki dipolar resonance aromaticity miss karne se $1$ aata hai.","**Option C ($3$):** $[10]$Annulene `(d)` ko $10\\pi\\,e^-$ dekhkar planar aromatic maan lene ki classic galti se $3$ aata hai!!","**Option D ($4$):** `(b)` ya `(e)` me lone pair / $sp^3$ boron galti se count karne par aata hai."],"t":"Organic Chemistry ke $2$ super classics ek hi sawal me: **Tropolone `(c)` = Aromatic ($6\\pi$)**, aur **Naphthalene-perimeter $[10]$Annulene `(d)` = Non-planar, Non-aromatic**!","sim":""},{"id":80,"q":"Which of the following reactions is not feasible ?","fig":"","opt":["{{OPT:bz:COOH}} $+\\;\\ce{NaHCO3 ->}$ {{OPT:bz:COONa}} $+\\;\\ce{H2O + CO2}$","{{OPT:bz:SO3H}} $+\\;\\ce{NaHCO3 ->}$ {{OPT:bz:SO3Na}} $+\\;\\ce{H2O + CO2}$","{{OPT:bz:OH}} $+\\;\\ce{NaHCO3 ->}$ {{OPT:bz:ONa}} $+\\;\\ce{H2CO3}$","{{OPT:bz:COONa}} $+$ {{OPT:bz:COOH|NO2}} $\\ce{->}$ {{OPT:bz:COOH}} $+$ {{OPT:bz:COONa|NO2}}"],"ans":2,"c":"Acid–base equilibrium **hamesha Stronger Acid + Stronger Base $\\longrightarrow$ Weaker Acid + Weaker Base** ki disha me hi aage badhti hai ($\\mathrm{p}K_a$ chhote se bade ki taraf)! Acid strength kram hai:<br>$\\ce{C6H5SO3H}\\;(\\mathrm{p}K_a \\approx -2.8) > p\\text{-}\\ce{O2NC6H4COOH}\\;(3.4) > \\ce{C6H5COOH}\\;(4.2) > \\ce{H2CO3}\\;(6.4) > \\ce{C6H5OH}\\;(10.0)$!","m":"Left side ke acid aur right side ke conjugate acid ki acidity ($\\mathrm{p}K_a$) compare karenge — jahan **weaker acid stronger acid banane ki koshish kare**, wo reaction **NOT feasible** hai!","s":["**Option A:** $\\ce{C6H5COOH}$ ($\\mathrm{p}K_a = 4.2$, stronger) $\\to \\ce{H2CO3}$ ($\\mathrm{p}K_a = 6.4$, weaker) $\\implies$ brisk effervescence of $\\ce{CO2}$, **Feasible**!","**Option B:** $\\ce{C6H5SO3H}$ ($\\mathrm{p}K_a \\approx -2.8$, very strong) $\\to \\ce{H2CO3}$ ($\\mathrm{p}K_a = 6.4$, weaker) $\\implies$ **Feasible**!","**Option C:** **Phenol ($\\ce{C6H5OH}$, $\\mathrm{p}K_a = 10.0$, WEAKER acid)** carbonic acid **$\\ce{H2CO3}$ ($\\mathrm{p}K_a = 6.4$, STRONGER acid)** nahi bana sakta! Phenol aqueous $\\ce{NaHCO3}$ me dissolve nahi hota $\\implies$ $\\color{#7ee2b8}{\\text{NOT Feasible (Option C)}}$!","**Option D:** $p$-Nitrobenzoic acid ($-\\mathrm{M}$ group $-\\ce{NO2}$, $\\mathrm{p}K_a = 3.4$, stronger acid) benzoic acid ($\\mathrm{p}K_a = 4.2$, weaker acid) ko displace kar deta hai $\\implies$ **Feasible**!"],"r":"**Option C ($\\ce{C6H5OH + NaHCO3 -> C6H5ONa + H2CO3}$)** feasible nahi hai.","w":["**Option A:** Carboxylic acids $\\ce{H2CO3}$ se zyada acidic hote hain aur $\\ce{NaHCO3}$ test dete hain.","**Option B:** Sulphonic acids mineral acids jitne strong hote hain aur turant $\\ce{CO2}$ udate hain.","**Option D:** $-\\ce{NO2}$ group benzoic acid ki acidity badha deta hai, isliye forward direction strong acid $\\to$ weak acid hai."],"t":"Organic Lab Distinction King: **Phenol $\\ce{NaHCO3}$ ke saath $\\ce{CO2}$ NAHI deta** (sirf *picric acid* $2,4,6$-trinitrophenol deta hai!), jabki $\\ce{RCOOH}$ turant $\\ce{CO2}$ देता hai!","sim":""},{"id":81,"q":"Identify the final major product $\\mathrm{E}$ in the given reaction sequence:<br>$$\\ce{CH#CH ->[\\text{Red hot}][\\text{Fe tube}] A ->[CH3CH2CH2Cl][\\text{Anhydrous }\\ce{AlCl3}] B ->[\\text{Conc.}][\\ce{H2SO4}] C ->[\\ce{Br2}][\\ce{FeBr3}] D ->[\\ce{H3O+}][\\Delta] E}$$","fig":"","opt":["{{OPT:q81:nPr|ortho}}","{{OPT:q81:iPr|ortho}}","{{OPT:q81:nPr|para}}","{{OPT:q81:iPr|para}}"],"ans":1,"c":"Ye $5$-step synthesis **Organic Chemistry ke $3$ sabse iconic concepts** ek saath test karta hai:<br>1) **Cyclic polymerisation** ($3\\,\\ce{CH#CH -> C6H6}$)<br>2) **Friedel–Crafts carbocation rearrangement** ($1^\\circ$ *n*-propyl $\\xrightarrow{1,2\\text{-H}^-\\text{ shift}} 2^\\circ$ isopropyl $\\implies$ **Cumene**!)<br>3) **Sulphonation as a reversible *para*-blocking group** ($\\text{Conc. }\\ce{H2SO4}$ *para* block karta hai $\\to$ $\\ce{Br}$ *ortho* par lagta hai $\\to$ $\\ce{H3O+}/\\Delta$ desulphonation se $-\\ce{SO3H}$ hat jaata hai)!","m":"Har intermediate $\\mathrm{A \\to B \\to C \\to D \\to E}$ step-by-step draw karke regioselectivity aur alkyl chain dono pakke karenge!","s":["**Step 1 ($\\mathrm{A}$):** $3\\,\\ce{CH#CH ->[\\text{Red hot Fe tube}]} \\ce{C6H6}$ (**Benzene**)","**Step 2 ($\\mathrm{B}$):** $\\ce{CH3CH2CH2Cl + AlCl3 -> CH3CH2CH2+ ->[\\text{H}^-\\text{ shift}] CH3-\\overset{+}{C}H-CH3} \\xrightarrow{\\ce{C6H6}}$ **Cumene (isopropylbenzene)**!","**Step 3 ($\\mathrm{C}$):** Bulky isopropyl group ke *para* position par reversible sulphonation $\\implies$ **$p$-isopropylbenzenesulphonic acid**!","**Step 4 ($\\mathrm{D}$):** *Para* position $-\\ce{SO3H}$ se block hone aur $-\\ce{CH(CH3)2}$ *o,p*-directing hone se electrophilic bromination ($\\ce{Br2/FeBr3}$) **ortho** to isopropyl par hoti hai!","**Step 5 ($\\mathrm{E}$):** Dilute acid heat ($\\ce{H3O+/\\Delta}$, ipso-desulphonation) $-\\ce{SO3H}$ group hata deta hai $\\implies$ **1-Bromo-2-isopropylbenzene (*o*-bromocumene)** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Final product $\\mathrm{E}$ **ortho-bromoisopropylbenzene (*o*-bromocumene)** (**Option B**) hai.","w":["**Option A:** Friedel–Crafts alkylation me $1^\\circ$ propyl cation rearrange hokar **isopropyl** banata hai, straight *n*-propyl nahi!","**Option C:** Straight *n*-propyl chain aur *para* substitution dono galat hain.","**Option D:** **BIG TRAP!** Bina sulphonation/desulphonation ke *para*-bromocumene banta, par $\\text{Conc. }\\ce{H2SO4}$ + $\\ce{H3O+/\\Delta}$ ka poora maksad hi *para* block karke **ortho** isomer banana tha!"],"t":"Organic synthesis gold rule: Jab bhi sequence me **$\\text{Conc. }\\ce{H2SO4} \\longrightarrow \\text{Electrophile} \\longrightarrow \\ce{H3O+/\\Delta}$** dikhe, samajh jao **para-blocking trick** lagi hai aur answer **ORTHO isomer** hoga!!","sim":""},{"id":82,"q":"The compound &#39;$\\mathrm{A}$&#39; is a complementary base of <span style=\"display:inline-block;width:3.5em;border-bottom:1.5px solid #9aa3b2\"><\/span> in DNA strands :","fig":"q82","opt":["Uracil","Guanine","Adenine","Cytosine"],"ans":2,"c":"Diye gaye structure $(\\mathrm{A})$ me pyrimidine-2,4-dione ring ke $\\mathrm{C_5}$ carbon par **$-\\ce{CH3}$ group** laga hua hai — yaani ye **$5$-methyluracil = Thymine ($\\mathrm{T}$)** hai! **Watson–Crick DNA base pairing** rule ke anusaar **Adenine ($\\mathrm{A}$) hamesha Thymine ($\\mathrm{T}$) ke saath $2$ hydrogen bonds ($\\ce{A=T}$) banata hai**!","m":"Pehle $\\mathrm{C_5}-\\ce{CH3}$ se $(\\mathrm{A}) =$ **Thymine** pehchaanenge, aur fir DNA complementary base ($\\mathrm{A}$)! (Dhyan rahe: sawal me $(\\mathrm{A})$ **Thymine** hai, uska **partner** poocha hai — **Adenine**!)","s":["Ring structure check karein: $6$-membered pyrimidine ring + do $\\ce{=O}$ groups + $\\mathrm{C_5}$ par $-\\ce{CH3} \\implies$ **Thymine ($\\mathrm{T}$)**!","DNA double helix me Chargaff / Watson–Crick complementary base pairing: $\\ce{Adenine (A) = Thymine (T)}$ ($2$ H-bonds) aur $\\ce{Guanine (G) # Cytosine (C)}$ ($3$ H-bonds).","Isliye Thymine $(\\mathrm{A})$ ka complementary base **Adenine** hai ($\\color{#7ee2b8}{\\text{Option C}}$)!"],"r":"Compound '$\\mathrm{A}$' (Thymine) DNA strands me **Adenine** (Option C) ka complementary base hai.","w":["**Option A (Uracil):** Uracil RNA me Adenine se judta hai; DNA me Uracil upasthit hi nahi hota!","**Option B (Guanine):** Purine Guanine hamesha Cytosine ($\\ce{G#C}$) ke saath $3$ H-bonds banata hai.","**Option D (Cytosine):** Cytosine Guanine ka complementary base hai, Thymine ka nahi."],"t":"Structure mnemonic: **Uracil $+ \\;5\\text{-}\\ce{CH3} =$ Thymine**! Aur DNA pairing: **A=T ($2$ H-bonds)**, **G$\\equiv$C ($3$ H-bonds)**!","sim":""},{"id":83,"q":"Which gives maximum yield of $\\ce{C2H5Cl}$ ?","fig":"","opt":["$\\underset{\\text{(excess)}}{\\ce{C2H6}} + \\ce{Cl2 ->[h\\nu,\\text{ light}] C2H5Cl + HCl}$","$\\ce{C2H6} + \\underset{\\text{(excess)}}{\\ce{Cl2}} \\ce{->[h\\nu][\\text{light}] C2H5Cl + HCl}$","$\\ce{C2H6 + Cl2 ->[h\\nu][\\text{light}] C2H2Cl}$","$\\ce{C2H6 + Cl2 ->[\\text{Dark}] C2H5Cl + HCl}$"],"ans":0,"c":"Alkanes ke free-radical photochlorination me **polychlorination** ($\\ce{C2H5Cl -> C2H4Cl2 -> \\dots -> C2Cl6}$) ek badi samasya hoti hai! Mono-chloro product ($\\ce{C2H5Cl}$) ki **maximum yield** paane ke liye **alkane ($\\ce{C2H6}$) ko heavy EXCESS me** lete hain taaki har $\\ce{Cl^\\bullet}$ radical naye $\\ce{C2H6}$ molecule se takraye!","m":"Free-radical halogenation ki condition ($h\\nu$/UV light ज़रूरी!) aur reagent stoichiometry (**alkane in excess** vs halogen in excess) compare karenge.","s":["Andhere (**Dark**) me homolytic $\\ce{Cl-Cl}$ cleavage nahi hota $\\implies$ no reaction (Option D galat).","Agar **$\\ce{Cl2}$ excess** me ho (Option B), toh saare hydrogens replace hokar hexachloroethane $\\ce{C2Cl6}$ ban jaata hai!","Jab **$\\ce{C2H6}$ excess** me + **$h\\nu,\\text{ light}$** ho, tab collision probability $\\ce{Cl^\\bullet + C2H6}$ overwhelming hoti hai aur **$\\ce{C2H5Cl}$ maximum yield** me banta hai ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Maximum yield of $\\ce{C2H5Cl}$ **$\\underset{\\text{(excess)}}{\\ce{C2H6}} + \\ce{Cl2 ->[h\\nu,\\text{ light}] C2H5Cl + HCl}$** (Option A) se milti hai.","w":["**Option B ($\\ce{Cl2}$ excess):** Excess chlorine multi-chlorination karke perchloroalkane ($\\ce{C2Cl6}$) bana deti hai!","**Option C:** Formula aur stoichiometry ($\\ce{C2H2Cl}$) hi invalid hai.","**Option D (Dark):** UV light ya heat ke bina free-radical chain initiation ($h\\nu$) shuru hi nahi hoti."],"t":"1-Line Golden Rule: **Alkane in excess $\\implies$ Monohaloalkane ($\\ce{RCl}$)**; **$\\ce{Cl2}$ in excess $\\implies$ Perchloroalkane ($\\ce{CCl4 / C2Cl6}$)**!","sim":""},{"id":84,"q":"Which of the following reactions is the best choice for preparing methyl cyclohexyl ether ?","fig":"","opt":["{{OPT:cyHex:ONa}} $+\\;\\ce{CH3I ->}$","{{OPT:cyHex:I}} $+\\;\\ce{CH3ONa ->}$","{{OPT:cyHex:OH}} $+\\;\\ce{CH3I ->}$","{{OPT:cyHex:I}} $+\\;\\ce{CH3OH ->}$"],"ans":0,"c":"**Williamson Ether Synthesis** ($\\ce{R-O^-Na^+ + R'-X -> R-O-R' + NaX}$) ek pure **concerted $\\mathrm{S_N2}$ reaction** hai! $\\mathrm{S_N2}$ ki golden shart hai ki **alkyl halide ($\\ce{R'-X}$) unhindered ($1^\\circ$ ya sabse best methyl $\\ce{CH3-I}$)** hona chahiye, aur sterically hindered ($2^\\circ / 3^\\circ$) group **alkoxide ($\\ce{R-O^-}$)** hona chahiye — warna strong base $\\mathrm{E2}$ elimination karke alkene bana deta hai!","m":"Methyl cyclohexyl ether banane ke dono pairs check karenge: **sodium cyclohexoxide + $\\ce{CH3I}$** vs **cyclohexyl iodide + $\\ce{CH3ONa}$**.","s":["**Option A (Sodium cyclohexoxide $+ \\ce{CH3I}$):** Nucleophile $\\ce{C6H11O^-}$ unhindered **methyl iodide ($\\ce{CH3I}$ — fastest $\\mathrm{S_N2}$ substrate, zero $\\beta$-hydrogen so zero elimination!)** par backside attack karta hai $\\implies$ **$>90\\%$ pure methyl cyclohexyl ether** ($\\color{#7ee2b8}{\\text{Option A}}$)!","**Option B (Cyclohexyl iodide $+ \\ce{CH3ONa}$):** $2^\\circ$ cyclohexyl halide par strong base $\\ce{CH3O^-}$ predominantly **$\\mathrm{E2}$ dehydrohalogenation** karke **cyclohexene** bana deta hai!","**Options C & D:** Neutral alcohols ($\\ce{ROH}$) weak nucleophiles hote hain, bina alkoxide base ke Williamson synthesis nahi hoti."],"r":"Methyl cyclohexyl ether banane ka best choice **Sodium cyclohexoxide $+ \\ce{CH3I}$** (**Option A**) hai.","w":["**Option B:** $2^\\circ$ cyclohexyl iodide strong base $\\ce{CH3ONa}$ ke saath $\\mathrm{E2}$ elimination se major product **cyclohexene** deta hai!","**Option C:** Neutral cyclohexanol poor nucleophile hai aur $\\ce{CH3I}$ ke saath unreactive rehta hai.","**Option D:** Neutral methanol ke saath $2^\\circ$ iodide solvolysis + elimination mixture deta hai."],"t":"Williamson Synthesis Mantra: **Bulky group = Alkoxide ($\\ce{RO^-}$), Chhota group = Halide ($\\ce{CH3X}$)**!","sim":""},{"id":85,"q":"Which of the following is most reactive toward the acid-catalysed dehydration ?","fig":"","opt":["{{OPT:q85:1}}","{{OPT:q85:2}}","{{OPT:q85:3}}","{{OPT:q85:4}}"],"ans":2,"c":"Alcohols ka acid-catalysed dehydration ($\\mathrm{E1}$ mechanism) **rate-determining step me carbocation ($\\ce{R^+}$) banne** se aage badhta hai:<br>$$\\text{Rate of Dehydration} \\propto \\text{Stability of Intermediate Carbocation } (\\ce{R^+})$$!","m":"Charo cyclic alcohols se $-\\ce{OH2^+}$ nikalne ke baad banne wale carbocation ki stability compare karenge!","s":["**Option A ($1$-methylcyclohexanol):** Simple **$3^\\circ$ localized carbocation** ($7\\;\\alpha\\text{-H}$ hyperconjugation only, no resonance).","**Option B (cyclohex-$2$-en-$1$-ol):** **$2^\\circ$ allylic carbocation** (resonance stabilized, par $-\\ce{CH3}$ group nahi hai).","**Option C ($1$-methylcyclohex-$2$-en-$1$-ol):** $-\\ce{OH}$ nikalte hi **BOTH $3^\\circ$ AND ALLYLIC (resonance-stabilized) carbocation** banta hai ($\\ce{C^+ - CH = CH <-> C = CH - C^+}$ + $-\\ce{CH3}$ hyperconjugation)! $\\implies$ **Sabse zyada stable carbocation, fastest dehydration** ($\\color{#7ee2b8}{\\text{Option C}}$)!","**Option D (cyclohex-$1$-en-$1$-ol, enol):** $sp^2$ vinylic carbon se $-\\ce{OH}$ heterolytically toot-ta hi nahi (unstable vinylic cation)!"],"r":"Acid-catalysed dehydration ke liye sabse अधिक kriyasheel **Option C ($1$-methylcyclohex-$2$-en-$1$-ol)** hai.","w":["**Option A:** Isme keval $3^\\circ$ inductive/hyperconjugation hai, allylic resonance nahi hai.","**Option B:** Isme $2^\\circ$ allylic cation banta hai jo Option C ke $3^\\circ$ allylic cation se kam stable hai.","**Option D:** Vinylic $-\\ce{OH}$ (enol) tautomerise hokar cyclohexanone banata hai, dehydrate nahi hota!"],"t":"Carbocation powerhouse combo: **$3^\\circ$ + Allylic Resonance (Option C)** $\\gg 2^\\circ$ Allylic (Option B) $> 3^\\circ$ Alkyl (Option A)!","sim":""},{"id":86,"q":"Identify the **incorrect** statement about compound '$\\mathrm{Y}$' in the given reaction sequence:<br>$$\\ce{CH3-CN ->[(i)\\;CH3MgBr][(ii)\\;H2O / H+] X ->[Ba(OH)2][\\Delta] Y}$$","fig":"","opt":["Compound '$\\mathrm{Y}$' is but-$2$-enal","Compound '$\\mathrm{Y}$' is $\\alpha, \\beta$-unsaturated carbonyl compound.","IUPAC name of '$\\mathrm{Y}$' is $4$-methyl pent-$3$-en-$2$-one","Double bond equivalent of compound $\\mathrm{Y}$ is $2$"],"ans":0,"c":"Nitriles ($\\ce{R-C#N}$) Grignard reagent ($\\ce{R'MgBr}$) aur acidic hydrolysis ke saath **Ketone ($\\ce{R-CO-R'}$)** banate hain! Fir $\\ce{Ba(OH)2}$ + heat ($\\Delta$) ke saath **Aldol Condensation** hokar **$\\alpha,\\beta$-unsaturated ketone** banta hai!","m":"Pehle $\\mathrm{X}$ aur fir self-aldol condensation product $\\mathrm{Y}$ ka exact formula aur IUPAC name nikalenge!","s":["**Step 1 ($\\mathrm{X}$):** $\\ce{CH3-C#N + CH3MgBr -> (CH3)2C=NMgBr ->[H3O+] CH3-CO-CH3}$ (**Acetone = Propanone**, **$3$-carbon ketone** — acetaldehyde NAHI!)","**Step 2 ($\\mathrm{Y}$):** $2\\,\\ce{CH3-CO-CH3 ->[Ba(OH)2][\\Delta] (CH3)2C=CH-CO-CH3 + H2O}$ (**Mesityl oxide** — **$6$-carbon $\\alpha,\\beta$-unsaturated ketone**!)","**Check IUPAC & DBE of $\\mathrm{Y}$:** Chain $= 5$ carbons, $\\mathrm{C_2}$ par ketone, $\\mathrm{C_3}$ par alkene, $\\mathrm{C_4}$ par methyl $\\implies$ **$4$-methylpent-$3$-en-$2$-one**; molecular formula $\\ce{C6H10O} \\implies \\mathrm{DBE} = 6 + 1 - \\dfrac{10}{2} = \\mathbf{2}$!","But-$2$-enal (crotonaldehyde) **acetaldehyde** ke aldol se banta hai, acetone se nahi! Isliye **Option A incorrect hai** ($\\color{#7ee2b8}{\\text{Option A}}$)!"],"r":"Incorrect statement **Option A (Compound '$\\mathrm{Y}$' is but-$2$-enal)** hai.","w":["**Option B:** Mesityl oxide $\\ce{(CH3)2C=CH-CO-CH3}$ ek classic $\\alpha,\\beta$-unsaturated carbonyl compound hai (Correct statement).","**Option C:** $\\mathrm{Y}$ ka exact IUPAC naam $4$-methylpent-$3$-en-$2$-one hi hai (Correct statement).","**Option D:** Ek $\\ce{C=C}$ aur ek $\\ce{C=O}$ bond hone se $\\mathrm{DBE} = 1 + 1 = 2$ bilkul sahi hai (Correct statement)."],"t":"**SUPER TRAP:** Jo bacha $\\ce{CH3CN + CH3MgBr}$ me dono carbons ginn-na bhool kar galti se *acetaldehyde* bana deta hai, wahi **but-$2$-enal** aata hai! Carbon count hamesha check karo: $2\\text{C} + 1\\text{C} = \\mathbf{3\\text{C}\\text{ (acetone)}} \\xrightarrow{\\times 2} \\mathbf{6\\text{C}\\text{ product}}$!","sim":""},{"id":87,"q":"Identify the **correct** statement about compound $\\mathrm{B}$:<br>$$\\ce{CH3-CH2-COOH ->[\\text{Red }\\ce{P / Br2}] A ->[(1)\\;KCN][(2)\\;H3O+] B}$$","fig":"","opt":["It does not evolve $\\ce{CO2}$ on heating","It gives positive iodoform test","It is vicinal dicarboxylic acid","It evolve $\\ce{CO2}$ with $\\ce{NaHCO3}$"],"ans":3,"c":"**Hell–Volhard–Zelinsky (HVZ) reaction** ($\\text{Red }\\ce{P / Br2}$) carboxylic acid ke **sirf $\\alpha$-carbon** par $-\\ce{Br}$ lagati hai! Uske baad $\\ce{KCN}$ substitution aur hydrolysis ($\\ce{H3O+}$) se **ek hi $\\alpha$-carbon par do $-\\ce{COOH}$ groups** (**$1,1$- / geminal dicarboxylic acid**, malonic acid derivative) aa jaate hain!","m":"$\\mathrm{A}$ aur $\\mathrm{B}$ ke structures likhkar charo statements ($\\Delta$ decarboxylation, iodoform, vicinal vs geminal, aur $\\ce{NaHCO3}$ test) verify karenge!","s":["**Step 1 ($\\mathrm{A}$ — HVZ):** $\\ce{CH3-CH2-COOH ->[\\text{Red P / Br2}] CH3-CH(Br)-COOH}$ ($2$-bromopropanoic acid)","**Step 2 ($\\mathrm{B}$):** $\\ce{CH3-CH(Br)-COOH ->[(1)\\;KCN][(2)\\;H3O+] CH3-CH(COOH)2}$ (**$2$-methylpropanedioic acid / methylmalonic acid** — **GEMINAL** dicarboxylic acid!)","**Check Options:**<br>• Geminal ($1,1$-) dicarboxylic acids ($=\\beta$-keto acid analogue!) heat karne par **turant $\\ce{CO2}$ evolve karte hain** ($\\to \\ce{CH3CH2COOH}$) — A galat!<br>• Koi $\\ce{CH3CO-}$ group nahi $\\implies$ iodoform negative — B galat!<br>• Dono $-\\ce{COOH}$ **ek hi carbon** par hain (**geminal**, na ki *vicinal*!) — C galat!<br>• Carboxylic acid hone ke naate $\\ce{NaHCO3}$ ke saath **brisk effervescence ($\\ce{CO2}$)** deta hai — $\\color{#7ee2b8}{\\text{Option D Sahi}}$!"],"r":"Compound $\\mathrm{B}$ ke baare me sahi kathan **It evolve $\\ce{CO2}$ with $\\ce{NaHCO3}$** (**Option D**) hai.","w":["**Option A:** Geminal ($1,1$-) dicarboxylic acids ($6$-membered cyclic TS se) garm karne par **aasani se $\\ce{CO2}$ nikalte hain**!","**Option B:** Methylmalonic acid me methyl ketone ($\\ce{CH3CO-}$) group nahi hota, iodoform test nahi deta.","**Option C:** **CLASSIC TRAP!** *Vicinal* ($1,2$-) matlab bagal-bagal wale carbons par; yahan dono $-\\ce{COOH}$ **ek hi carbon** (**geminal**) par hain!"],"t":"Geminal vs Vicinal yaad rakhne ki trick: **Geminal = Twins on the SAME carbon ($1,1$)** — garm karte hi ek $-\\ce{COOH}$ $\\ce{CO2}$ bankar udd jaata hai!!","sim":""},{"id":88,"q":"The numbers of chiral centers present in glucopyranose and fructofuranose respectively are :","fig":"q88","opt":["$4$ and $3$","$5$ and $4$","$4$ in each","$5$ in each"],"ans":1,"c":"**Open-chain** D-glucose me **$4$** ($\\mathrm{C_2, C_3, C_4, C_5}$) aur open-chain D-fructose me **$3$** ($\\mathrm{C_3, C_4, C_5}$) chiral carbons hote hain — **LEKIN cyclic hemiacetal/hemiketal bante hi carbonyl carbon ($\\mathrm{C_1}$ in glucose, $\\mathrm{C_2}$ in fructose) NAYA CHIRAL ANOMERIC CARBON ban jaata hai** (+$1$ chiral centre in BOTH!)!","m":"Haworth structures (`glucopyranose` aur `fructofuranose`) me har carbon ($\\mathrm{C_1 \\to C_6}$) check karenge — open chain ka trap **Option A ($4$ and $3$)** kabhi mat chuna!","s":["**Glucopyranose (cyclic $6$-membered ring):** $\\mathrm{C_1}$ (anomeric $*$), $\\mathrm{C_2}\\;(*)$, $\\mathrm{C_3}\\;(*)$, $\\mathrm{C_4}\\;(*)$, $\\mathrm{C_5}\\;(*)$ پانचों tetrahedral carbons par char alag attachments hain; sirf $\\mathrm{C_6}$ ($-\\ce{CH2OH}$) achiral hai $\\implies \\mathbf{5}$ chiral centres!","**Fructofuranose (cyclic $5$-membered ring):** $\\mathrm{C_1}$ ($-\\ce{CH2OH}$, achiral), $\\mathrm{C_2}$ (anomeric $*$), $\\mathrm{C_3}\\;(*)$, $\\mathrm{C_4}\\;(*)$, $\\mathrm{C_5}\\;(*)$, aur $\\mathrm{C_6}$ ($-\\ce{CH2OH}$, achiral) $\\implies \\mathbf{4}$ chiral centres!","Isliye kramashah chiral centres $= \\color{#7ee2b8}{5\\text{ and }4}$ (**Option B**)!"],"r":"Glucopyranose aur fructofuranose me chiral centres kramashah **$5$ and $4$** (**Option B**) hote hain.","w":["**Option A ($4$ and $3$):** **#1 EXAM TRAP!** Ye **open-chain** glucose ($4$) aur fructose ($3$) ke chiral carbons hain — cyclic pyranose/furanose me anomeric carbon judkar $+1$ badh jaata hai!!","**Option C ($4$ in each):** Glucopyranose me $5$ chiral carbons hote hain.","**Option D ($5$ in each):** Fructofuranose me do $-\\ce{CH2OH}$ groups ($\\mathrm{C_1}$ aur $\\mathrm{C_6}$) hone se sirf $4$ chiral carbons bachte hain."],"t":"1-Second Biomolecules Table:<br>• **Open Glucose / Fructose:** **$4$** aur **$3$**<br>• **Cyclic Glucopyranose / Fructofuranose:** **$5$** aur **$4$** (Anomeric carbon $+1$!)!","sim":""},{"id":89,"q":"Match List I and List II:<table class=\"q-table\"><tr><th><\/th><th>List I (Test)<\/th><th><\/th><th>List II (Functional group / Class)<\/th><\/tr><tr><td>(A)<\/td><td>Lucas test<\/td><td>(I)<\/td><td>Alkene<\/td><\/tr><tr><td>(B)<\/td><td>Baeyer&#39;s test<\/td><td>(II)<\/td><td>$3^\\circ$ alcohol<\/td><\/tr><tr><td>(C)<\/td><td>Carbylamine Test<\/td><td>(III)<\/td><td>Primary amine<\/td><\/tr><tr><td>(D)<\/td><td>Schiff&#39;s Test<\/td><td>(IV)<\/td><td>Aldehyde<\/td><\/tr><\/table>Choose the correct answer from the options given below :","fig":"","opt":["(A) - I, (B) - II, (C) - III, (D) - IV","(A) - III, (B) - IV, (C) - I, (D) - II","(A) - II, (B) - I, (C) - III, (D) - IV","(A) - III, (B) - IV, (C) - II, (D) - I"],"ans":2,"c":"Practical Organic Chemistry ke $4$ core functional group tests:<br>• **Lucas reagent** ($\\text{conc. }\\ce{HCl + anhyd.\\;ZnCl2}$): $3^\\circ$ alcohol ke saath **immediate turbidity**!<br>• **Baeyer's reagent** (cold alkaline dil. $\\ce{KMnO4}$): **unsaturation (alkene/alkyne)** purple colour gayab kar deta hai!<br>• **Carbylamine reaction** ($\\ce{CHCl3 + alc.\\;KOH}$): **$1^\\circ$ amine** foul-smelling isocyanide ($\\ce{R-NC}$) banata hai!<br>• **Schiff's reagent**: **aldehyde** pink/magenta colour restore kar deta hai!","m":"Chaaron famous organic qualitative tests ko unke exact functional group se match karenge.","s":["**(A) Lucas test** $\\longrightarrow$ **$3^\\circ$ alcohol (II)** (immediate cloudiness of $\\ce{R-Cl}$)","**(B) Baeyer's test** $\\longrightarrow$ **Alkene (I)** (decolourisation of pink $\\ce{MnO4-} \\to$ brown $\\ce{MnO2}$)","**(C) Carbylamine Test** $\\longrightarrow$ **Primary amine (III)** ($\\ce{RNH2 + CHCl3 + 3KOH -> RNC + 3KCl + 3H2O}$)","**(D) Schiff's Test** $\\longrightarrow$ **Aldehyde (IV)** $\\implies$ $\\color{#7ee2b8}{\\text{(A) - II, (B) - I, (C) - III, (D) - IV}}$ (**Option C**)"],"r":"Sahi matching **(A) - II, (B) - I, (C) - III, (D) - IV** (**Option C**) hai.","w":["**Option A:** Lucas test aur Baeyer's test aapas me ulte match kiye gaye hain.","**Option B:** Chaaron hi tests galat functional groups se jode gaye hain.","**Option D:** Chaaron hi tests galat functional groups se jode gaye hain."],"t":"**(A) Lucas $\\to$ II ($3^\\circ$ alcohol)** dekhte hi sirf **Option C** akela option bachta hai — $2$-second +$4$ marks!","sim":""},{"id":90,"q":"**Statement-1 :** Acetaldehyde and acetone are distinguished by Fehling test.<br>**Statement-2 :** Benzaldehyde and Acetaldehyde are distinguished by Fehling test.","fig":"","opt":["Both Statement-1 and Statement-2 are correct.","Both Statement-1 and Statement-2 are incorrect.","Statement-1 is correct and Statement-2 is incorrect.","Statement-1 is incorrect and Statement-2 is correct."],"ans":0,"c":"**Fehling's solution** (alkaline $\\ce{Cu^{2+}}$ sodium potassium tartrate complex) Tollens' reagent se **kamzor oxidising agent** hai! Isliye:<br>• **Aliphatic aldehydes** (jaise **Acetaldehyde $\\ce{CH3CHO}$**) brick-red ppt **$\\ce{Cu2O v}$** dete hain (**Positive**)!<br>• **Ketones** (**Acetone**) **Negative**!<br>• **Aromatic aldehydes** (**Benzaldehyde $\\ce{C6H5CHO}$**, carbonyl ring conjugation se stabilized + alpha-H absent) bhi Fehling's test **NAHI dete (Negative)**!!","m":"Acetaldehyde (+ve) vs Acetone (-ve) aur Acetaldehyde (+ve) vs Benzaldehyde (-ve) dono pairs check karenge!","s":["**Statement-1:** Acetaldehyde $\\ce{CH3CHO} \\xrightarrow{\\text{Fehling's}} \\ce{Cu2O v}$ (brick-red ppt, **+ve**), jabki Acetone $\\ce{CH3COCH3}$ **-ve** $\\implies$ **Statement-1 Correct**.","**Statement-2:** Acetaldehyde (**aliphatic aldehyde $\\to$ +ve** brick-red ppt) jabki **Benzaldehyde ($\\ce{C6H5CHO}$, aromatic aldehyde $\\to$ -ve**, no ppt with Fehling's!) $\\implies$ **Statement-2 Correct**!","Dono hi statements $100\\%$ sahi hain $\\implies$ $\\color{#7ee2b8}{\\text{Option A}}$!"],"r":"**Both Statement-1 and Statement-2 are correct** (**Option A**).","w":["**Option B:** Dono hi pairs me acetaldehyde brick-red $\\ce{Cu2O}$ ppt deta hai aur doosra compound nahi deta.","**Option C:** **CLASSIC NCERT TRAP!** Tollens' test benzaldehyde aur acetaldehyde dono dete hain, par **Fehling's test benzaldehyde NAHI deta**, isliye Statement-2 bhi $100\\%$ correct hai!","**Option D:** Statement-1 bilkul sahi hai kyunki ketones Fehling's reagent reduce nahi karte."],"t":"NCERT Aldehydes Chapter ka Gold Gem: **Benzaldehyde gives Tollens' (+), DOES NOT give Fehling's (–)**! Isiliye Fehling's test $\\ce{CH3CHO}$ aur $\\ce{C6H5CHO}$ ko distinguish kar leta hai!","sim":""},{"id":91,"q":"Select the **incorrect** match:<table class=\"q-table\"><tr><th><\/th><th>Characteristics<\/th><th>$\\mathrm{C_3}$ plants<\/th><th>$\\mathrm{C_4}$ plants<\/th><\/tr><tr><td>(1)<\/td><td>Primary $\\ce{CO2}$ acceptor<\/td><td>$\\mathrm{RuBP}$<\/td><td>$\\mathrm{PEP}$<\/td><\/tr><tr><td>(2)<\/td><td>The primary $\\ce{CO2}$ fixation product<\/td><td>$\\mathrm{PGA}$<\/td><td>$\\mathrm{OAA}$<\/td><\/tr><tr><td>(3)<\/td><td>Cell type in which the initial carboxylation reaction occurs<\/td><td>Mesophyll<\/td><td>Bundle sheath<\/td><\/tr><tr><td>(4)<\/td><td>Number of carbons in the primary $\\ce{CO2}$ acceptor<\/td><td>$5$<\/td><td>$3$<\/td><\/tr><\/table>","fig":"","opt":["(1)","(2)","(3)","(4)"],"ans":2,"c":"NCERT Class XI *Photosynthesis in Higher Plants* (Table 11.1) ke anusaar **$\\mathrm{C_3}$ aur $\\mathrm{C_4}$ DONO hi paudhon me initial (primary) atmospheric $\\ce{CO2}$ fixation MESOPHYLL cell me hi hoti hai**! $\\mathrm{C_4}$ plants me mesophyll cell me **PEPcase** $\\ce{CO2}$ fix karke $\\mathrm{OAA}$ banata hai, aur **RuBisCO (secondary/Calvin fixation)** bundle sheath cell me chalta hai!","m":"Har row ko NCERT comparison table se मिलाएंगे — Row `(3)` me $\\mathrm{C_4}$ ke liye 'Bundle sheath' likha hai jo galat hai!","s":["**Row (1):** Primary $\\ce{CO2}$ acceptor — $\\mathrm{C_3}$: $\\mathrm{RuBP}$ ($5\\mathrm{C}$); $\\mathrm{C_4}$: $\\mathrm{PEP}$ ($3\\mathrm{C}$) — **Sahi**.","**Row (2):** First stable fixation product — $\\mathrm{C_3}$: $3\\text{-}\\mathrm{PGA}$ ($3\\mathrm{C}$); $\\mathrm{C_4}$: $\\mathrm{OAA}$ ($4\\mathrm{C}$) — **Sahi**.","**Row (3):** Initial carboxylation cell type — $\\mathrm{C_3}$: **Mesophyll**, aur $\\mathrm{C_4}$: **BHI Mesophyll** (via PEPcase, NOT Bundle sheath!) $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Match — Option C}}$!","**Row (4):** Primary acceptor me carbons — $\\mathrm{RuBP} = \\mathbf{5}$, $\\mathrm{PEP} = \\mathbf{3}$ — **Sahi**."],"r":"Incorrect match **Row (3)** (**Option C**) hai — $\\mathrm{C_3}$ aur $\\mathrm{C_4}$ dono me **initial carboxylation Mesophyll cell** me hoti hai!","w":["**Option A (1):** $\\mathrm{RuBP}$ aur $\\mathrm{PEP}$ primary $\\ce{CO2}$ acceptors bilkul sahi diye hain.","**Option B (2):** $3$-phosphoglyceric acid ($\\mathrm{PGA}$) aur oxaloacetic acid ($\\mathrm{OAA}$) bilkul sahi hain.","**Option D (4):** $\\mathrm{RuBP}$ ($5\\mathrm{C}$ ketose) aur $\\mathrm{PEP}$ ($3\\mathrm{C}$) carbon numbers bilkul sahi hain (galti se $3$ aur $4$ mat sochna — wo fixation *product* ke carbons hote hain!)."],"t":"DO TOP NCERT TRAPS EK SAATH YAAD RAKHO:<br>1) **Initial carboxylation cell in BOTH $\\mathrm{C_3}$ & $\\mathrm{C_4}$ = Mesophyll!** (Cell with *RuBisCO*: Mesophyll vs Bundle sheath!)<br>2) **Carbons in Primary Acceptor = $5$ ($\\mathrm{RuBP}$) & $3$ ($\\mathrm{PEP}$)**!","sim":""},{"id":92,"q":"Vaccines induce the production of antibodies which will destroy the pathogenic agents during :","fig":"","opt":["Vaccination","Actual Infection","Passive Immunisation","Transplantation"],"ans":1,"c":"**Vaccination (Active Immunisation)** ka sidhant **immunological memory** par aadharit hai! Vaccine me inactivated/weakened pathogen ya antigenic protein शरीर me primary immune response jaga kar **antibodies + memory B and T lymphocytes** banwata hai, jo baad me **asli rog (Actual Infection)** aane par massive secondary anamnestic response se pathogen ko tabah kar dete hain!","m":"NCERT Class XII (*Human Health and Disease*) ki exact verbatim line se check karenge!","s":["Vaccination शरीर me inactivated/weakened pathogen ya antigenic protein introduce karke **primary response** generate karta hai.","Isse specific **antibodies** aur **memory B & T lymphocytes** ban jaate hain.","NCERT exact line: *'The antibodies produced in the body against these antigens would neutralise the pathogenic agents **during actual infection**.'* $\\implies$ $\\color{#7ee2b8}{\\text{Option B}}$!"],"r":"Vaccine dwara pre-formed/induced antibodies aur memory cells **Actual Infection** (Option B) ke dauran pathogenic agents ko nasht karte hain.","w":["**Option A (Vaccination):** Vaccination ke waqt toh sirf antigen/weakened vaccine lagayi jaati hai taaki future ke liye immunity taiyaar ho.","**Option C (Passive Immunisation):** Passive immunisation me readymade external antibodies seedhe inject kiye jaate hain (jaise tetanus antitoxin, snake antivenom).","**Option D (Transplantation):** Organ transplantation cell-mediated immunity ($\\mathrm{T}$-lymphocytes) se juda hota hai, vaccination se nahi."],"t":"Exact NCERT verbatim sentence: *'...neutralise the pathogenic agents **during actual infection**'* — word-for-word NEET favourite!","sim":""},{"id":93,"q":"Select the **incorrect** match :","fig":"","opt":["No well defined nucleus — Cyanobacteria","Mesosome — Characteristic of prokaryotes","Mitochondria and chloroplasts — Site of ATP formation in jelly fish","Well defined nucleus — *Pinus*"],"ans":2,"c":"**Jellyfish (*Aurelia*, Phylum Coelenterata / Cnidaria)** ek **heterotrophic eukaryotic ANIMAL** hai! Animal cells me **plastids / chloroplasts BILKUL ABSENT** hote hain (unme ATP synthesis keval cytoplasm aur **mitochondria** me hoti hai)!","m":"Chaaron matches padhte hi Option C me *'chloroplasts ... in jelly fish'* turant chilla kar bata deta hai ki yahi galat hai!","s":["**Option A:** Cyanobacteria (BGA) Monera kingdom ke **prokaryotes** hain $\\implies$ nuclear membrane absent (no well-defined nucleus) — Sahi.","**Option B:** Plasma membrane infoldings **Mesosomes** prokaryotes ki khas visheshta hain — Sahi.","**Option C:** Jellyfish ek **animal** hai — isme **chloroplast nahi paya jaata**! $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Match (Option C)}}$!","**Option D:** *Pinus* ek gymnosperm (**eukaryotic plant**) hai jisme membrane-bound well-defined nucleus hota hai — Sahi."],"r":"Incorrect match **Mitochondria and chloroplasts — Site of ATP formation in jelly fish** (**Option C**) hai.","w":["**Option A:** Cyanobacteria prokaryotic hone se nucleoid rakhte hain, well-defined nucleus nahi.","**Option B:** NCERT *Cell: The Unit of Life* me saaf likha hai: *'Mesosome is a characteristic of prokaryotes.'*","**Option D:** Gymnosperms (*Pinus*) true eukaryotes hain."],"t":"Speed reading rule: *'Chloroplasts ... in jelly fish'* — aakhiri word tak poora option padhne ki aadat har saal +$5$ marks bachati hai!","sim":""},{"id":94,"q":"Given below are two statements:<br>**Statement I :** Parenchyma $\\rightarrow$ Cells are generally isodiametric and performs various functions like photosynthesis, storage, secretion.<br>**Statement II :** Parenchyma $\\rightarrow$ Cells are without protoplasm and in all vascular plants it is main water transporting elements.<br>Choose the correct answer from the option given below:","fig":"q94","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":1,"c":"Plant Anatomy (NCERT Class XI) me:<br>• **Parenchyma** ek **living simple permanent tissue** hai jiski thin cellulosic cell wall hoti hai, cells generally **isodiametric** hote hain, aur ye **photosynthesis, storage, aur secretion** karte hain!<br>• **Dead cells devoid of protoplasm** jo water transport karte hain wo **Xylem Tracheids aur Vessels** hote hain (aur vessels bhi *all* vascular plants me nahi — pteridophytes aur most gymnosperms me vessels absent hoti hain)!","m":"Statement I aur Statement II dono ko NCERT *Anatomy of Flowering Plants* se cross-check karenge.","s":["**Statement I:** Exact NCERT line for **Parenchyma**: cells generally isodiametric + photosynthesis, storage, secretion $\\implies$ **Correct**!","**Statement II:** Parenchyma **living (protoplasm present!)** tissue hai, aur main water-conducting elements dead **tracheids & vessels** hote hain $\\implies$ **Incorrect**!","Isliye **Statement I is correct but Statement II is incorrect** ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"**Statement I is correct but Statement II is incorrect** (**Option B**).","w":["**Option A:** Statement I word-for-word NCERT ka $100\\%$ sahi kathan hai.","**Option C:** Statement I sahi hai aur Statement II dono hisson me galat hai.","**Option D:** Statement II xylem vessels ka dead description galti se parenchyma ke aage likh raha hai, isliye galat hai."],"t":"Double verification: Statement II me **दो गलतियाँ** hain — (1) Parenchyma living hai (without protoplasm nahi!), aur (2) **Vessels** *angiosperms* me main water transporter hain, pteridophytes/gymnosperms me nahi!","sim":""},{"id":95,"q":"Select the **correct** match:<table class=\"q-table\"><tr><th><\/th><th>Column I<\/th><th><\/th><th>Column II<\/th><\/tr><tr><td>A.<\/td><td>Hypogynous<\/td><td>I.<\/td><td>*Hibiscus* (China rose)<\/td><\/tr><tr><td>B.<\/td><td>Perigynous<\/td><td>II.<\/td><td>Rose<\/td><\/tr><tr><td>C.<\/td><td>Epigynous<\/td><td>III.<\/td><td>Ray florets of *Helianthus*<\/td><\/tr><tr><td>D.<\/td><td>Perianth<\/td><td>IV.<\/td><td>Calyx and corolla are not distinct<\/td><\/tr><\/table>","fig":"","opt":["A-I, B-II, C-III, D-IV","A-IV, B-I, C-III, D-II","A-III, B-II, C-I, D-IV","A-IV, B-III, C-II, D-I"],"ans":0,"c":"NCERT *Morphology of Flowering Plants* ke anusaar floral parts ki thalamus par position ke $3$ types + Perianth:<br>• **Hypogynous (superior ovary):** Mustard, **China rose (*Hibiscus*)**, Brinjal<br>• **Perigynous (half-inferior ovary):** Plum, **Rose**, Peach<br>• **Epigynous (inferior ovary):** Guava, Cucumber, **Ray florets of sunflower (*Helianthus*)**<br>• **Perianth:** Jab calyx aur corolla alag-alag distinct na hon (*Lily*)!","m":"Scientific names pehchaan lein: ***Hibiscus* = China rose** aur ***Helianthus* = Sunflower**! Chaaron seedhe same-row match hain!","s":["**A. Hypogynous** $\\longrightarrow$ **I. *Hibiscus*** (China rose — superior ovary)","**B. Perigynous** $\\longrightarrow$ **II. Rose** (half-inferior ovary — China rose vs Rose kabhi confuse mat karna!)","**C. Epigynous** $\\longrightarrow$ **III. Ray florets of *Helianthus*** (sunflower — inferior ovary)","**D. Perianth** $\\longrightarrow$ **IV. Calyx and corolla are not distinct** $\\implies$ $\\color{#7ee2b8}{\\text{A-I, B-II, C-III, D-IV}}$ (**Option A**)"],"r":"Sahi match **A-I, B-II, C-III, D-IV** (**Option A**) hai.","w":["**Option B:** A, B, D galat match hain.","**Option C:** Hypogynous aur Epigynous ulte kar diye gaye hain.","**Option D:** Chaaron hi columns ulte kar diye gaye hain."],"t":"NEET Morphology #1 Trap: **China rose (*Hibiscus*) = Hypogynous**, jabki **Rose (*Rosa*) = Perigynous**! Aur ***Helianthus* = Sunflower**!","sim":""},{"id":96,"q":"Select the **incorrect** match from the given coelom, organism, and phylum table :","fig":"q96","opt":["A, B","Only B","A, C, D","C, D"],"ans":1,"c":"NCERT *Animal Kingdom* (Fig. 4.3) ke $3$ body cavity diagrams:<br>• **True Coelomate (Eucoelomate):** Annelida, **Arthropoda**, Mollusca, **Echinodermata**, Hemichordata, **Chordata**<br>• **Pseudocoelomate (scattered mesodermal pouches!):** **ONLY Aschelminthes (Nematoda)**!<br>• **Acoelomate (solid mesoderm):** **Platyhelminthes**!","m":"Diagram ke chaaron rows `A, B, C, D` me Column-I (coelom cross-section), Column-II (animal), aur Column-III (phylum) match karenge!","s":["**Row A:** True coelom + Starfish (*Asterias*) + **Echinodermata** $\\implies$ **Correct**!","**Row B:** **Pseudocoelom (scattered pouches!)** + Prawn (*Palaemon*) + **Arthropoda** $\\implies$ **INCORRECT!** Arthropods **true coelomates (haemocoel)** hote hain; pseudocoelom keval **Aschelminthes** me hota hai!","**Row C:** Acoelomate + *Planaria* + **Platyhelminthes** $\\implies$ **Correct**!","**Row D:** True coelom + Bird (*Aquila*) + **Chordata** $\\implies$ **Correct**! Isliye sirf $\\color{#7ee2b8}{\\text{Only B (Option B)}}$ incorrect hai!"],"r":"Incorrect match **Only B** (**Option B**) hai.","w":["**Option A (A, B):** Row A (*Asterias* — Echinodermata — Eucoelomate) bilkul sahi hai.","**Option C (A, C, D):** A, C, aur D teenon hi rows $100\\%$ sahi hain!","**Option D (C, D):** Platyhelminthes acoelomate aur Chordata eucoelomate bilkul sahi hain."],"t":"1-Second Animal Kingdom Rule: **Scattered mesoderm pouches = Pseudocoelom = ONLY Aschelminthes**! Kisi aur phylum ke samne scattered pouches dikhe toh $100\\%$ galat match hai!","sim":""},{"id":97,"q":"Given below are two statements referring to the two human age pyramids shown above:<br>**Statement I :** In the first pyramid (Expanding), post-reproductive individuals are lower than reproductive individuals.<br>**Statement II :** In the second pyramid (Stable), post-reproductive individuals are lower than reproductive individuals.<br>Choose the correct answer from the option given below:","fig":"q97","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"c":"NCERT Class XII (*Organisms and Populations*, Age Pyramids) me teeno pyramids (**Expanding, Stable, aur Declining**) ka **top bar (Post-reproductive)** unke **middle bar (Reproductive)** se **HAMESHA CHHOTA (narrower / lower)** hota hai! Expanding vs Stable vs Declining ka farq **Pre-reproductive (base) vs Reproductive (middle)** ke comparison se hota hai!!","m":"Jaldbaazi me students Expanding vs Stable sunte hi ek galat kar dete hain — jabki sawal me **Post-reproductive vs Reproductive** poocha gaya hai!! Dono pyramids ki upar wali pink patti aur beech wali blue patti compare karo!","s":["**Statement I (Expanding pyramid):** Base $>$ Middle $>$ Top $\\implies$ **Post-reproductive $<$ Reproductive** — **Correct**!","**Statement II (Stable / Bell-shaped pyramid):** Base $\\approx$ Middle $>$ Top $\\implies$ yahan bhi **Post-reproductive $<$ Reproductive** — **Correct**!","Isliye **Both Statement I and Statement II are correct** ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"**Both Statement I and Statement II are correct** (**Option D**).","w":["**Option A:** Dono hi age pyramids me post-reproductive population reproductive population se kam hoti hai.","**Option B:** **CLASSIC TRAP!** Stable pyramid me *pre-reproductive $\\approx$ reproductive* barabar hote hain, **post-reproductive nahi** — post-reproductive toh wahan bhi chhota hi hota hai!!","**Option C:** Statement I bilkul sahi hai."],"t":"**WHAT A GENIUS QUESTION!** Stable pyramid me **Pre = Reproductive** hota hai, par **Post < Reproductive** TEENO pyramids (Expanding, Stable, Declining) me true hota hai!","sim":""},{"id":98,"q":"Given below are two statements:<br>**Statement I :** Lichen $\\rightarrow$ It is the association between autotrophic and heterotrophic organism.<br>**Statement II :** Mycorrhiza $\\rightarrow$ It is the association between autotrophic and heterotrophic organism.<br>Choose the correct answer from the option given below:","fig":"","opt":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"ans":3,"c":"**Mutualism** ke dono NCERT iconic examples me ek partner **photosynthetic autotroph** (food provider) aur doosra partner **absorptive heterotroph — fungus** (water/mineral & shelter provider) hota hai:<br>• **Lichen** $=$ **Algae / Cyanobacteria (Autotroph, phycobiont)** $+$ **Fungus (Heterotroph, mycobiont)**<br>• **Mycorrhiza** $=$ **Higher plant roots (Autotroph)** $+$ **Fungus (Heterotroph)**!","m":"Dono symbiotic associations ke dono partners ki nutrition mode check karenge!","s":["**Statement I (Lichen):** Phycobiont (**autotrophic** algae/cyanobacteria) $+$ Mycobiont (**heterotrophic** fungus) $\\implies$ **Correct**!","**Statement II (Mycorrhiza):** Photosynthetic higher plant (**autotrophic**) $+$ Fungus (*Glomus*, **heterotrophic**) $\\implies$ **Correct**!","Isliye **Both Statement I and Statement II are correct** ($\\color{#7ee2b8}{\\text{Option D}}$)!"],"r":"**Both Statement I and Statement II are correct** (**Option D**).","w":["**Option A:** Lichen aur Mycorrhiza dono me hi ek autotroph aur ek heterotrophic fungus ka mutualistic association hota hai.","**Option B:** Mycorrhiza me plant autotrophic aur fungus heterotrophic hota hai, isliye Statement II bhi sahi hai.","**Option C:** Statement I $100\\%$ sahi hai."],"t":"Lichen aur Mycorrhiza dono ka common thread: **Autotroph (Alga / Plant — carbs deta hai) $\\longleftrightarrow$ Heterotroph (Fungus — $\\ce{H2O}$ & minerals deta hai)**!","sim":""},{"id":99,"q":"Select the **incorrect** match:<table class=\"q-table\"><tr><th><\/th><th>Column I<\/th><th>Column II<\/th><\/tr><tr><td>(1)<\/td><td>Biopsy<\/td><td>Cancer detection<\/td><\/tr><tr><td>(2)<\/td><td>Histopathological studies<\/td><td>Cancer detection<\/td><\/tr><tr><td>(3)<\/td><td>Widal test<\/td><td>Diagnosis of cancer<\/td><\/tr><tr><td>(4)<\/td><td>AIDS patient<\/td><td>Susceptible for infection of *Mycobacterium* and *Toxoplasma*<\/td><\/tr><\/table>","fig":"","opt":["(1)","(2)","(3)","(4)"],"ans":2,"c":"**Widal test** *Salmonella typhi* dwara hone wale **Typhoid fever** ka confirmatory serological diagnostic test hai — cancer ka nahi!","m":"NCERT *Human Health and Disease* diagnostics table se turant pehchaan lenge!","s":["**(1) Biopsy & (2) Histopathological studies:** Suspected tissue ka thin section stain karke cancer detection me use hota hai — **Sahi**.","**(3) Widal test:** **Typhoid fever** (*Salmonella typhi*) ke diagnosis ke liye hota hai, cancer ke liye nahi! $\\implies$ $\\color{#7ee2b8}{\\text{Incorrect Match — Option C}}$!","**(4) AIDS patient:** Helper $\\mathrm{T_H}$-lymphocytes ghatne se *Mycobacterium*, viruses, fungi, aur *Toxoplasma* ke opportunistic infections ka shikaar ho jaate hain — **Sahi**."],"r":"Incorrect match **(3) Widal test — Diagnosis of cancer** (**Option C**) hai.","w":["**Option A (1):** Biopsy cancer diagnosis ka gold-standard test hai.","**Option B (2):** Tissue aur blood ki histopathological study cancer cells pehchanne me use hoti hai.","**Option D (4):** Word-for-word NCERT AIDS paragraph ka $100\\%$ sahi kathan hai."],"t":"1-Second Match: **Widal Test $\\equiv$ Typhoid (*Salmonella typhi*, Mary Mallon)**!","sim":""},{"id":100,"q":"Select the **correct** match :<br>A. Cocaine — Interfere with the transport of the neurotransmitter dopamine.<br>B. Benzodiazepines — Used as medicines in mental illness<br>C. Tobacco smoke — Lung cancer<br>D. Morphine — Generally taken by snorting and injection","fig":"","opt":["A, B, C only","B, C, D only","A, C, D only","All"],"ans":0,"c":"NCERT Class XII (*Human Health and Disease*, p. 142) ka **classic NTA verbatim distinction**:<br>• **Heroin (smack = diacetylmorphine)** *'is a depressant ... **generally taken by snorting and injection**.'*<br>• **Morphine** *'is a very effective **sedative and painkiller**, and is very useful in patients who have undergone surgery.'*<br>Isliye strictly NCERT ke anusaar **A, B, aur C bilkul sahi hain**, jabki D me *Heroin* ki line *Morphine* ke aage likh di gayi hai!","m":"Har statement ko word-for-word NCERT *Drugs and Alcohol Abuse* text se verify karenge!","s":["**A. Cocaine (*Erythroxylum coca*):** Interferes with the transport of neurotransmitter **dopamine** — **100% NCERT True**.","**B. Benzodiazepines (e.g., barbiturates, amphetamines, benzodiazepines):** Used as medicines to help patients cope with mental illnesses like depression & insomnia — **100% NCERT True**.","**C. Tobacco smoke:** Associated with increased incidence of cancers of **lung**, urinary bladder, throat, etc. — **100% NCERT True**.","**D. Morphine vs Heroin:** NCERT explicitly states **Heroin (smack)** is *'generally taken by snorting and injection'*, whereas **Morphine** is a sedative & post-surgery painkiller $\\implies$ strict NCERT answer is $\\color{#7ee2b8}{\\text{A, B, C only (Option A)}}$! *(QA Note: Source PDF key prints `(4) All` by conflating Morphine with diacetylmorphine/Heroin; flagged for full transparency!)*"],"r":"Strictly NCERT text ke anusaar **A, B, C only** (**Option A**) bilkul sahi hain (*Heroin/smack* snorting aur injection se liya jaata hai).","w":["**Option B (B, C, D only):** Statement A $100\\%$ sahi hai aur D *Heroin* ka description hai.","**Option C (A, C, D only):** Statement B $100\\%$ sahi hai.","**Option D (All):** Source test key ne `(4) All` print kiya hai, par strict NCERT line *'generally taken by snorting and injection'* **Heroin (diacetylmorphine)** ke liye likhi gayi hai, Morphine ke liye nahi!"],"t":"NTA ka all-time favourite NCERT word-swap trap: **Snorting & injection = Heroin (Smack, diacetylmorphine)** | **Post-surgery sedative & painkiller = Morphine**!","sim":""},{"id":101,"q":"Select the correct statements.<br>(a) Angiotensin II activates the cortex of adrenal gland to release aldosterone.<br>(b) Aldosterone leads to increase in blood pressure.<br>(c) ANF acts as a check on renin-angiotensin mechanism.<br>(d) ADH causes vasodilation.<br>(e) Vasopressin is released from adenohypophysis.<br>Choose the most appropriate answer from the options given below :","fig":"","opt":["(a), (b) and (e) only","(c), (d) and (e) only","(b), (c) and (d) only","(a), (b) and (c) only"],"ans":3,"c":"Kidney function regulation (**RAAS vs ANF vs ADH**, NCERT Class XI) me:<br>• **Angiotensin II** ek powerful **vasoconstrictor** hai **AUR** adrenal cortex ko **Aldosterone** release karne ke liye stimulate karta hai!<br>• **Aldosterone** distal tubule se $\\ce{Na+}$ aur water reabsorb kara ke **blood pressure badhata hai**!<br>• Heart atria se nikalne wala **ANF** vasodilation karke **RAAS mechanism par break (check)** lagata hai!","m":"Paanchon statements `(a)–(e)` ko NCERT Excretory Products chapter ki lines se match karenge.","s":["**(a), (b) & (c):** Angiotensin II $\\to$ Adrenal cortex $\\to$ Aldosterone $\\to \\ce{Na+}/\\ce{H2O}$ reabsorption $\\to$ BP $\\uparrow$, jabki **ANF** is par **check** lagata hai $\\implies$ **(a), (b), (c) teeno $100\\%$ Sahi**!","**(d) ADH causes vasodilation:** **Galat!** ADH (vasopressin) blood vessels par **vasoconstrictory** effect daalta hai (isiliye naam *vaso-pressin* hai!), vasodilation nahi!","**(e) Vasopressin from adenohypophysis:** **Galat!** Vasopressin (ADH) hypothalamus me banta hai aur **neurohypophysis (posterior pituitary)** se release hota hai, adenohypophysis se nahi! Sahi uttar: $\\color{#7ee2b8}{\\text{(a), (b) and (c) only (Option D)}}$!"],"r":"Correct statements **(a), (b) and (c) only** (**Option D**) hain.","w":["**Option A:** Statement `(e)` galat hai kyunki vasopressin *neurohypophysis* (pars nervosa) se nikalta hai.","**Option B:** `(d)` aur `(e)` dono statements galat hain.","**Option C:** `(d)` galat hai kyunki ADH vasoconstriction karta hai, vasodilation toh ANF karta hai!"],"t":"Naam me hi jawab chhupa hai: **Vaso-pressin = Vessel-presser = Vasoconstrictor** (BP $\\uparrow$, released from **Neurohypophysis**), jabki **ANF = Vasodilator** (BP $\\downarrow$)!","sim":""},{"id":102,"q":"Arrange the following formed elements in the **decreasing** order of their abundance in blood in humans:<br>(a) Platelets &nbsp;&nbsp; (b) Neutrophils &nbsp;&nbsp; (c) Erythrocytes &nbsp;&nbsp; (d) Eosinophils &nbsp;&nbsp; (e) Monocytes<br>Choose the most appropriate answer from the options given below :","fig":"","opt":["(c), (a), (b), (e), (d)","(c), (b), (a), (e), (d)","(d), (e), (b), (a), (c)","(a), (c), (b), (d), (e)"],"ans":0,"c":"Human blood ke formed elements ki exact NCERT counts ($\\text{per }\\mathrm{mm^3}$ of blood):<br>• **Erythrocytes (RBCs):** $5.0\\text{–}5.5\\,\\text{million}\\,\\mathrm{mm^{-3}}$<br>• **Platelets (Thrombocytes):** $1.5\\text{–}3.5\\,\\text{lakh}\\,\\mathrm{mm^{-3}}$<br>• **Total WBCs:** keval $6,000\\text{–}8,000\\,\\mathrm{mm^{-3}}$, jisme **Neutrophils** ($60\\text{–}65\\%$) $>$ Lymphocytes ($20\\text{–}25\\%$) $>$ **Monocytes** ($6\\text{–}8\\%$) $>$ **Eosinophils** ($2\\text{–}3\\%$) $>$ Basophils ($0.5\\text{–}1\\%$)!","m":"Sabse bada se sabse chhota (**decreasing order**) count ginkar kram likhenge!","s":["Sabse zyada **Erythrocytes `(c)`** ($5\\text{–}5.5\\,\\text{million}$) $>$ doosre number par **Platelets `(a)`** ($1.5\\text{–}3.5\\,\\text{lakh}$)! (Yaad rahe: Platelets total WBCs se ~35 guna zyada hote hain!)","Ab WBCs ($6\\text{–}8\\,\\text{thousand}$) ke andar compare karein: **Neutrophils `(b)`** ($60\\text{–}65\\%$) $>$ **Monocytes `(e)`** ($6\\text{–}8\\%$) $>$ **Eosinophils `(d)`** ($2\\text{–}3\\%$).","Pura decreasing kram: $\\color{#7ee2b8}{\\text{(c) } > \\text{ (a) } > \\text{ (b) } > \\text{ (e) } > \\text{ (d)}}$ (**Option A**)!"],"r":"Decreasing order of abundance **(c), (a), (b), (e), (d)** (**Option A**) hai.","w":["**Option B:** Neutrophils (`b`, ~4,500) ko Platelets (`a`, ~2,50,000) se zyada dikhaya gaya hai jo galat hai!","**Option C:** Ye **increasing** order likh diya gaya hai (sawal me *decreasing* poocha hai!).","**Option D:** Platelets RBCs ($5\\,\\text{million}$) se zyada nahi hote."],"t":"Golden WBC Mnemonic: **N**ever **L**et **M**onkeys **E**at **B**ananas $\\implies \\text{Neutrophils } (60\\text{–}65\\%) > \\text{Lymphocytes } (20\\text{–}25\\%) > \\text{Monocytes } (6\\text{–}8\\%) > \\text{Eosinophils } (2\\text{–}3\\%) > \\text{Basophils } (0.5\\text{–}1\\%)$, aur un sabke upar **RBC $>$ Platelets**!","sim":""},{"id":103,"q":"In the enzyme which catalyses the breakdown of $\\ce{H2O2 -> H2O + O2}$, the prosthetic group is :","fig":"","opt":["Nicotinamide adenine dinucleotide","Haem","Zinc","Niacin"],"ans":1,"c":"**Prosthetic groups** aise **organic non-protein compounds** hote hain jo apoenzyme ke saath **tightly bound** rehte hain! NCERT Class XI (*Biomolecules*, Co-factors section) ki sabse famous example hai: **Peroxidase aur Catalase** (jo hydrogen peroxide ko paani aur oxygen me todte hain) me **Haem** active site ka hissa aur **prosthetic group** hota hai!","m":"NCERT *Co-factors* ke teenon classic examples (`Haem`, `NAD/Niacin`, `Zinc`) alag-alag pehchanenge!","s":["Reaction identify karein: $2\\,\\ce{H2O2 ->[\\text{Catalase / Peroxidase}] 2H2O + O2}$.","Catalase aur Peroxidase dono enzymes me iron-porphyrin ring **Haem** apoenzyme se tightly juda **prosthetic group** hota hai!","Isliye sahi uttar **Haem** (**Option B**) hai ($\\color{#7ee2b8}{\\text{Option B}}$)!"],"r":"Peroxidase / Catalase enzyme ka prosthetic group **Haem** (**Option B**) hota hai.","w":["**Option A (NAD):** $\\mathrm{NAD}$ aur $\\mathrm{NADP}$ *co-enzymes* (transiently bound) hain, prosthetic group nahi.","**Option C (Zinc):** $\\ce{Zn^{2+
